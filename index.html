{id:'bi_metab5',t:'bi_metab',l:3,q:`Quanti ATP netti produce la sola glicolisi a partire da una molecola di glucosio?`,o:[`2`,`4`,`30`,`10`],a:0,e:`La glicolisi consuma 2 ATP e ne produce 4: il guadagno netto è 2 ATP. Il resto dell'ATP della respirazione viene prodotto nei mitocondri.`},
{id:'bi_metab6',t:'bi_metab',l:3,q:`Dove avviene il ciclo di Calvin nelle cellule vegetali?`,o:[`Nello stroma del cloroplasto`,`Nei tilacoidi`,`Nei mitocondri`,`Nel nucleo`],a:0,e:`Il ciclo di Calvin fissa la CO₂ in zuccheri e avviene nello stroma. La fase luminosa si svolge invece sulle membrane dei tilacoidi.`},
{id:'bi_gapp1',t:'bi_gapp',l:1,q:`Qual è il genotipo di una persona con gruppo sanguigno 0?`,o:[`ii`,`Iᴬi`,`Iᴬ Iᴮ`,`Iᴮi`],a:0,e:`L'allele i è recessivo: il gruppo 0 compare solo nell'omozigote ii. Iᴬi dà il gruppo A, Iᴮi il gruppo B, Iᴬ Iᴮ il gruppo AB.`},
{id:'bi_gapp2',t:'bi_gapp',l:1,q:`Nella codominanza, un individuo eterozigote…`,o:[`mostra entrambi i caratteri`,`mostra solo il carattere dominante`,`mostra un carattere intermedio`,`non mostra nessuno dei due caratteri`],a:0,e:`Con la codominanza i due alleli si esprimono insieme, come nel gruppo AB. Il carattere intermedio è tipico invece della dominanza incompleta.`},
{id:'bi_gapp3',t:'bi_gapp',l:2,q:`Un genitore ha gruppo A (Iᴬi) e l'altro gruppo B (Iᴮi). Quali gruppi possono avere i figli?`,o:[`A, B, AB e 0`,`Solo AB`,`Solo A e B`,`Solo 0`],a:0,e:`I gameti sono Iᴬ o i da un genitore, Iᴮ o i dall'altro: le combinazioni Iᴬ Iᴮ, Iᴬi, Iᴮi e ii danno tutti e quattro i gruppi, ciascuno con probabilità 1/4.`},
{id:'bi_gapp4',t:'bi_gapp',l:2,q:`Nel bocca di leone la dominanza è incompleta. Incrociando una pianta a fiori rossi (RR) con una a fiori bianchi (WW), come sono i fiori dei figli?`,o:[`Rosa`,`Rossi`,`Bianchi`,`Metà rossi e metà bianchi`],a:0,e:`Tutti i figli sono RW. Con dominanza incompleta l'eterozigote ha un fenotipo intermedio: il rosa.`},
{id:'bi_gapp5',t:'bi_gapp',l:3,q:`L'emofilia è una malattia recessiva legata a X. Una donna portatrice sana (XᴴXʰ) e un uomo sano (XᴴY) hanno un figlio maschio. Qual è la probabilità che sia emofilico?`,o:[`1/2`,`1/4`,`0`,`1`],a:0,e:`Il figlio maschio riceve la Y dal padre e una delle due X dalla madre: con probabilità 1/2 riceve Xʰ ed è malato.`},
{id:'bi_gapp6',t:'bi_gapp',l:3,q:`Due genitori sani hanno una figlia affetta da una malattia. Quale tipo di trasmissione è più probabile?`,o:[`Autosomica recessiva`,`Autosomica dominante`,`Dominante legata a X`,`Mitocondriale`],a:0,e:`Genitori sani possono generare un figlio malato solo se sono portatori di un allele recessivo. Se fosse recessiva legata a X, una figlia malata richiederebbe un padre malato.`},
{id:'fi_gran1',t:'fi_gran',l:1,q:`Qual è l'unità di misura della massa nel Sistema Internazionale?`,o:[`Chilogrammo`,`Grammo`,`Newton`,`Libbra`],a:0,e:`Nel SI l'unità di massa è il chilogrammo (kg). Il newton misura la forza.`},
{id:'fi_gran2',t:'fi_gran',l:1,q:`Quanti metri sono 2,5 km?`,o:[`2500 m`,`250 m`,`25 m`,`25000 m`],a:0,e:`1 km = 1000 m, quindi 2,5 km = 2,5 · 1000 = 2500 m.`},
{id:'fi_gran3',t:'fi_gran',l:2,q:`A quanti m/s corrispondono 54 km/h?`,o:[`15 m/s`,`54 m/s`,`194 m/s`,`5,4 m/s`],a:0,e:`Si divide per 3,6: 54 / 3,6 = 15 m/s. Il valore 194 si ottiene moltiplicando per 3,6 invece di dividere.`},
{id:'fi_gran4',t:'fi_gran',l:2,q:`Quanti litri sono contenuti in 2 m³?`,o:[`2000 L`,`200 L`,`20 L`,`0,002 L`],a:0,e:`1 m³ = 1000 dm³ = 1000 L, quindi 2 m³ = 2000 L.`},
{id:'fi_gran5',t:'fi_gran',l:3,q:`A quanti cm² corrispondono 3 m²?`,o:[`30000 cm²`,`300 cm²`,`3000 cm²`,`300000 cm²`],a:0,e:`1 m = 100 cm, quindi 1 m² = 100² = 10⁴ cm². Allora 3 m² = 3 · 10⁴ = 30000 cm².`},
{id:'fi_gran6',t:'fi_gran',l:3,q:`Quale unità equivale a kg · m/s²?`,o:[`Newton`,`Joule`,`Watt`,`Pascal`],a:0,e:`Dal secondo principio F = m · a: kg · m/s² = N. Il joule è N · m, il pascal N/m², il watt J/s.`},
{id:'fi_vet1',t:'fi_vet',l:1,q:`Quale di queste grandezze è un vettore?`,o:[`Velocità`,`Massa`,`Temperatura`,`Tempo`],a:0,e:`La velocità ha modulo, direzione e verso. Massa, temperatura e tempo sono scalari.`},
{id:'fi_vet2',t:'fi_vet',l:1,q:`Quale di queste grandezze è scalare?`,o:[`Energia`,`Forza`,`Spostamento`,`Accelerazione`],a:0,e:`L'energia è descritta da un solo numero (con unità). Forza, spostamento e accelerazione sono vettori.`},
{id:'fi_vet3',t:'fi_vet',l:2,q:`Due forze di 5 N e 3 N agiscono sulla stessa retta con versi opposti. Quanto vale la risultante?`,o:[`2 N`,`8 N`,`15 N`,`4 N`],a:0,e:`Con versi opposti i moduli si sottraggono: 5 − 3 = 2 N, nel verso della forza maggiore.`},
{id:'fi_vet4',t:'fi_vet',l:2,q:`Due vettori perpendicolari hanno moduli 6 e 8. Quanto vale il modulo della loro somma?`,o:[`10`,`14`,`2`,`48`],a:0,e:`Per vettori perpendicolari R = √(6² + 8²) = √100 = 10. Il valore 14 è la somma dei moduli, valida solo per vettori concordi sulla stessa retta.`},
{id:'fi_vet5',t:'fi_vet',l:3,q:`Un vettore di modulo 10 forma un angolo di 30° con l'asse x. Quanto vale la sua componente lungo y? (sin 30° = 0,5)`,o:[`5`,`8,7`,`10`,`0,5`],a:0,e:`v_y = v · sin θ = 10 · 0,5 = 5. Il valore 8,7 è la componente lungo x (10 · cos 30°).`},
{id:'fi_vet6',t:'fi_vet',l:3,q:`Se un vettore viene moltiplicato per −2, il risultato è un vettore…`,o:[`con modulo doppio e verso opposto`,`con modulo doppio e stesso verso`,`con modulo dimezzato e verso opposto`,`con lo stesso modulo e verso opposto`],a:0,e:`Il fattore 2 raddoppia il modulo, il segno meno inverte il verso.`},
{id:'fi_flu1',t:'fi_flu',l:1,q:`Qual è l'unità di misura della pressione nel Sistema Internazionale?`,o:[`Pascal`,`Newton`,`Joule`,`Watt`],a:0,e:`La pressione si misura in pascal (Pa): 1 Pa = 1 N/m².`},
{id:'fi_flu2',t:'fi_flu',l:1,q:`Quale formula definisce la densità?`,o:[`d = m / V`,`d = V / m`,`d = m · V`,`d = F / S`],a:0,e:`La densità è la massa per unità di volume: d = m / V. F / S è la pressione.`},
{id:'fi_flu3',t:'fi_flu',l:2,q:`Una forza di 200 N agisce perpendicolarmente su una superficie di 0,5 m². Qual è la pressione?`,o:[`400 Pa`,`100 Pa`,`0,0025 Pa`,`200 Pa`],a:0,e:`p = F / S = 200 / 0,5 = 400 Pa.`},
{id:'fi_flu4',t:'fi_flu',l:2,q:`Qual è la pressione dovuta alla sola acqua a 5 m di profondità? (d = 1000 kg/m³, g = 10 m/s²)`,o:[`50000 Pa`,`5000 Pa`,`500 Pa`,`500000 Pa`],a:0,e:`Legge di Stevino: p = d · g · h = 1000 · 10 · 5 = 50000 Pa. A questo valore si aggiunge la pressione atmosferica se si vuole la pressione totale.`},
{id:'fi_flu5',t:'fi_flu',l:3,q:`Un cubo di 1 dm³ è completamente immerso in acqua (d = 1000 kg/m³, g = 10 m/s²). Quanto vale la spinta di Archimede?`,o:[`10 N`,`1 N`,`100 N`,`1000 N`],a:0,e:`1 dm³ = 10⁻³ m³. F = d · V · g = 1000 · 10⁻³ · 10 = 10 N, cioè il peso di 1 kg di acqua.`},
{id:'fi_flu6',t:'fi_flu',l:3,q:`In un torchio idraulico i pistoni hanno superfici di 20 cm² e 200 cm². Con una forza di 50 N sul pistone piccolo, quale forza si ottiene sul grande?`,o:[`500 N`,`5 N`,`50 N`,`1000 N`],a:0,e:`Per il principio di Pascal la pressione è la stessa: F₂ = F₁ · S₂ / S₁ = 50 · 200 / 20 = 500 N.`},
{id:'fi_cal1',t:'fi_cal',l:1,q:`A quanti kelvin corrispondono 0 °C?`,o:[`273,15 K`,`0 K`,`100 K`,`−273,15 K`],a:0,e:`T[K] = T[°C] + 273,15, quindi 0 °C = 273,15 K. Lo zero assoluto (0 K) corrisponde a −273,15 °C.`},
{id:'fi_cal2',t:'fi_cal',l:1,q:`Come arriva il calore del Sole sulla Terra attraverso lo spazio vuoto?`,o:[`Per irraggiamento`,`Per conduzione`,`Per convezione`,`Per evaporazione`],a:0,e:`Conduzione e convezione richiedono un mezzo materiale. L'irraggiamento avviene con onde elettromagnetiche e funziona anche nel vuoto.`},
{id:'fi_cal3',t:'fi_cal',l:2,q:`Quanto calore serve per scaldare di 10 K una massa di 2 kg di una sostanza con calore specifico 500 J/(kg · K)?`,o:[`10000 J`,`1000 J`,`100 J`,`250 J`],a:0,e:`Q = m · c · ΔT = 2 · 500 · 10 = 10000 J.`},
{id:'fi_cal4',t:'fi_cal',l:2,q:`Perché durante l'ebollizione la temperatura dell'acqua resta a 100 °C anche se si continua a fornire calore?`,o:[`Il calore fornito serve per il passaggio di stato`,`L'acqua non assorbe più calore`,`Il termometro si blocca`,`Il calore viene disperso del tutto`],a:0,e:`Durante il passaggio di stato il calore (calore latente) serve a separare le molecole del liquido e non ad aumentare la temperatura.`},
{id:'fi_cal5',t:'fi_cal',l:3,q:`Un sistema assorbe 500 J di calore e compie un lavoro di 200 J. Di quanto varia la sua energia interna?`,o:[`+300 J`,`+700 J`,`−300 J`,`+100 J`],a:0,e:`Primo principio: ΔU = Q − L = 500 − 200 = +300 J.`},
{id:'fi_cal6',t:'fi_cal',l:3,q:`Si mescolano 1 kg di acqua a 80 °C e 1 kg di acqua a 20 °C, senza dispersioni. Quale temperatura finale si ottiene?`,o:[`50 °C`,`100 °C`,`60 °C`,`40 °C`],a:0,e:`Massa e calore specifico sono uguali, quindi la temperatura finale è la media: (80 + 20) / 2 = 50 °C. Il calore ceduto dall'acqua calda è uguale a quello assorbito dalla fredda.`},
{id:'ch_atomo13',t:'ch_atomo',l:1,q:`Dove si trova concentrata quasi tutta la massa di un atomo?`,o:[`Nel nucleo`,`Negli orbitali p`,`Nella nube elettronica`,`Nei livelli energetici esterni`],a:0,e:`Protoni e neutroni, che stanno nel nucleo, hanno una massa circa 1800 volte più grande di quella di un elettrone. La massa dell'atomo è quindi concentrata nel nucleo, che occupa però uno spazio piccolissimo.`},
{id:'ch_atomo14',t:'ch_atomo',l:1,q:`Come si chiamano le colonne verticali della tavola periodica?`,o:[`Gruppi`,`Periodi`,`Blocchi`,`Serie`],a:0,e:`Le colonne sono i gruppi (numerati da 1 a 18) e contengono elementi con proprietà simili perché hanno lo stesso numero di elettroni di valenza. Le righe orizzontali sono i periodi.`},
{id:'ch_atomo15',t:'ch_atomo',l:1,q:`Quale di questi elementi è un metallo alcalino?`,o:[`Potassio`,`Calcio`,`Cloro`,`Neon`],a:0,e:`I metalli alcalini sono gli elementi del gruppo 1 (Li, Na, K, Rb, Cs), tutti con un solo elettrone di valenza. Il calcio è un alcalino-terroso (gruppo 2), il cloro un alogeno (gruppo 17), il neon un gas nobile (gruppo 18).`},
{id:'ch_atomo16',t:'ch_atomo',l:1,q:`Quale di questi elementi è un alogeno?`,o:[`Cloro`,`Sodio`,`Neon`,`Calcio`],a:0,e:`Gli alogeni formano il gruppo 17 (F, Cl, Br, I) e hanno 7 elettroni di valenza. Il sodio è un alcalino, il neon un gas nobile e il calcio un alcalino-terroso.`},
{id:'ch_atomo17',t:'ch_atomo',l:2,q:`Qual è la configurazione elettronica dell'atomo neutro di azoto (Z = 7)?`,o:[`1s² 2s² 2p³`,`1s² 2s² 2p⁵`,`1s² 2s² 2p⁴`,`1s² 2s² 2p⁶`],a:0,e:`Un atomo neutro ha 7 elettroni: 2 nell'orbitale 1s, 2 nel 2s e i restanti 3 nel sottolivello 2p. Per questo l'azoto ha 5 elettroni di valenza (2s² 2p³).`},
{id:'ch_atomo18',t:'ch_atomo',l:2,q:`Quanti elettroni di valenza ha un atomo di cloro (gruppo 17)?`,o:[`7`,`1`,`5`,`17`],a:0,e:`Per gli elementi dei gruppi principali il numero di elettroni di valenza è dato dall'unità del numero del gruppo: gruppo 17, quindi 7 elettroni (3s² 3p⁵). Gli alogeni tendono ad acquistare un elettrone per completare l'ottetto.`},
{id:'ch_atomo19',t:'ch_atomo',l:2,q:`Un atomo neutro ha configurazione 1s² 2s² 2p⁶ 3s² 3p¹. A quale gruppo della tavola periodica appartiene?`,o:[`Gruppo 13`,`Gruppo 3`,`Gruppo 1`,`Gruppo 14`],a:0,e:`Ha 3 elettroni nel livello più esterno (3s² 3p¹) ed è un elemento del blocco p: appartiene al gruppo 13. È l'alluminio (Z = 13).`},
{id:'ch_atomo20',t:'ch_atomo',l:2,q:`Quale tra questi elementi alcalini ha il raggio atomico maggiore?`,o:[`Cesio`,`Litio`,`Sodio`,`Potassio`],a:0,e:`Scendendo lungo un gruppo il raggio cresce perché si aggiungono livelli energetici. Cs, nel sesto periodo, è il più grande tra Li, Na, K e Cs.`},
{id:'ch_atomo21',t:'ch_atomo',l:2,q:`Come varia in genere l'energia di ionizzazione scendendo lungo un gruppo?`,o:[`Diminuisce`,`Aumenta`,`Resta costante`,`Prima aumenta e poi diminuisce`],a:0,e:`Scendendo lungo un gruppo l'elettrone più esterno sta più lontano dal nucleo ed è più schermato dagli elettroni interni, quindi è più facile da strappare e l'energia di ionizzazione diminuisce.`},
{id:'ch_atomo22',t:'ch_atomo',l:3,q:`Un elemento ha configurazione elettronica [Ne] 3s² 3p⁴. Di quale elemento si tratta?`,o:[`Zolfo`,`Ossigeno`,`Cloro`,`Fosforo`],a:0,e:`[Ne] rappresenta 10 elettroni; 3s² 3p⁴ ne aggiungono 6, per un totale di 16 elettroni e quindi Z = 16: è lo zolfo. Ha 6 elettroni di valenza, come l'ossigeno, ma sta nel terzo periodo.`},
{id:'ch_atomo23',t:'ch_atomo',l:3,q:`Quanti elettroni spaiati ha un atomo di azoto nello stato fondamentale?`,o:[`3`,`1`,`2`,`0`],a:0,e:`Nel sottolivello 2p ci sono 3 elettroni e 3 orbitali p: per la regola di Hund si dispongono uno per orbitale con spin parallelo. I 3 elettroni 2p sono quindi tutti spaiati.`},
{id:'ch_atomo24',t:'ch_atomo',l:3,q:`Il ferro ha numero atomico Z = 26. Quanti elettroni ha lo ione Fe³⁺?`,o:[`23`,`29`,`26`,`24`],a:0,e:`Lo ione Fe³⁺ si forma togliendo 3 elettroni all'atomo neutro, che ne ha 26: restano 26 − 3 = 23 elettroni. Il numero di protoni resta 26.`},
{id:'ch_atomo25',t:'ch_atomo',l:3,q:`Il cloro in natura è una miscela di ³⁵Cl (75%) e ³⁷Cl (25%). Qual è la sua massa atomica media?`,o:[`35,5`,`36`,`35`,`37`],a:0,e:`La massa atomica media è la media pesata sulle abbondanze: 0,75 × 35 + 0,25 × 37 = 26,25 + 9,25 = 35,5. È il valore riportato nella tavola periodica.`},
{id:'ch_legami13',t:'ch_legami',l:1,q:`Quale di queste molecole contiene un legame covalente triplo?`,o:[`N₂`,`O₂`,`H₂`,`Cl₂`],a:0,e:`Nell'azoto molecolare i due atomi condividono tre coppie di elettroni (N≡N), per questo N₂ è molto stabile e poco reattivo. O₂ ha un legame doppio, H₂ e Cl₂ un legame singolo.`},
{id:'ch_legami14',t:'ch_legami',l:1,q:`Quale tipo di legame tiene uniti gli atomi di un metallo, come il rame?`,o:[`Legame metallico`,`Legame ionico`,`Legame covalente polare`,`Legame a idrogeno`],a:0,e:`Nei metalli gli elettroni di valenza sono delocalizzati e condivisi da tutti gli atomi (modello del «mare di elettroni»). Questo spiega la conducibilità elettrica e la malleabilità dei metalli.`},
{id:'ch_legami15',t:'ch_legami',l:1,q:`Perché i gas nobili sono poco reattivi?`,o:[`Hanno il livello elettronico più esterno completo`,`Non hanno elettroni`,`Hanno un solo elettrone di valenza`,`Sono tutti metalli`],a:0,e:`Elio, neon, argon ecc. hanno il livello esterno completo (2 elettroni per l'elio, 8 per gli altri): non hanno tendenza né a cedere né ad acquistare elettroni, quindi formano pochissimi composti.`},
{id:'ch_legami16',t:'ch_legami',l:1,q:`Quale di queste sostanze è formata da molecole biatomiche con due atomi uguali?`,o:[`Cl₂`,`HCl`,`NaCl`,`CO`],a:0,e:`Cl₂ è formata da due atomi di cloro identici uniti da un legame covalente apolare. HCl e CO hanno atomi diversi e NaCl è un composto ionico, non molecolare.`},
{id:'ch_legami17',t:'ch_legami',l:2,q:`Quale forza intermolecolare è presente anche tra molecole apolari, come quelle di O₂ o di CH₄?`,o:[`Forze di dispersione di London`,`Legami a idrogeno`,`Interazioni dipolo-dipolo permanenti`,`Legami ionici`],a:0,e:`Le molecole apolari non hanno un dipolo permanente, ma gli elettroni si spostano in continuazione e creano dipoli temporanei che attirano le molecole vicine: sono le forze di dispersione di London, presenti in tutte le molecole.`},
{id:'ch_legami18',t:'ch_legami',l:2,q:`Perché il cloruro di sodio conduce la corrente allo stato fuso o in soluzione acquosa, ma non allo stato solido?`,o:[`Solo allora gli ioni sono liberi di muoversi`,`Perché solo allora contiene elettroni liberi`,`Perché solo allora diventa covalente`,`Perché solo allora si formano nuovi ioni dal nulla`],a:0,e:`Nel cristallo solido gli ioni Na⁺ e Cl⁻ sono bloccati nel reticolo. Quando il sale fonde o si scioglie, gli ioni sono liberi e trasportano la carica elettrica.`},
{id:'ch_legami19',t:'ch_legami',l:2,q:`Quale geometria ha la molecola di metano (CH₄)?`,o:[`Tetraedrica`,`Planare quadrata`,`Piramidale`,`Lineare`],a:0,e:`Il carbonio forma quattro legami identici e senza coppie solitarie: le quattro coppie di legame si dispongono ai vertici di un tetraedro, con angoli di 109,5°.`},
{id:'ch_legami20',t:'ch_legami',l:2,q:`Perché la molecola di CO₂ è apolare pur avendo due legami C=O polari?`,o:[`Perché la geometria lineare fa annullare i due dipoli`,`Perché i legami C=O sono in realtà apolari`,`Perché il carbonio è più elettronegativo dell'ossigeno`,`Perché è una molecola ionica`],a:0,e:`Ogni legame C=O è polare, ma nella molecola lineare i due dipoli hanno stessa intensità e verso opposto: la somma è zero e la molecola è apolare.`},
{id:'ch_legami21',t:'ch_legami',l:2,q:`Quale proprietà è tipica dei composti ionici solidi?`,o:[`Alto punto di fusione e fragilità`,`Basso punto di fusione`,`Buona conducibilità elettrica allo stato solido`,`Elevata malleabilità`],a:0,e:`Il reticolo ionico è tenuto da forti attrazioni elettrostatiche: servono temperature alte per fonderlo. Se uno strato di ioni scorre, ioni di carica uguale si trovano affiancati e si respingono: il cristallo si rompe, cioè è fragile.`},
{id:'ch_legami22',t:'ch_legami',l:3,q:`Quanti legami σ e π ci sono nella molecola N₂, in cui i due atomi sono uniti da un legame triplo?`,o:[`1 legame σ e 2 legami π`,`3 legami σ`,`2 legami σ e 1 legame π`,`3 legami π`],a:0,e:`Il primo legame tra due atomi è sempre un legame σ; il secondo e il terzo, nei legami multipli, sono legami π. Un triplo legame è quindi 1 σ + 2 π.`},
{id:'ch_legami23',t:'ch_legami',l:3,q:`Qual è l'ibridazione degli atomi di carbonio nell'etene (C₂H₄, CH₂=CH₂)?`,o:[`sp²`,`sp³`,`sp`,`sp³d`],a:0,e:`Ogni carbonio dell'etene forma 3 legami σ (due con H e uno con l'altro C) e un legame π: servono 3 orbitali ibridi, quindi sp². La molecola è planare, con angoli di circa 120°.`},
{id:'ch_legami24',t:'ch_legami',l:3,q:`Qual è la geometria della molecola BF₃, in cui il boro ha tre coppie di legame e nessuna coppia solitaria?`,o:[`Planare trigonale`,`Piramidale trigonale`,`Tetraedrica`,`Angolare`],a:0,e:`Con 3 zone elettroniche e nessuna coppia solitaria, il modello VSEPR prevede una disposizione planare con angoli di 120°. Con una coppia solitaria in più (come in NH₃) la molecola diventerebbe piramidale.`},
{id:'ch_legami25',t:'ch_legami',l:3,q:`Quale tipo di legame tiene appaiate le basi azotate complementari nella doppia elica del DNA?`,o:[`Legami a idrogeno`,`Legami ionici`,`Legami covalenti doppi`,`Legami metallici`],a:0,e:`Tra A e T si formano 2 legami a idrogeno e tra G e C ne sono 3. Sono legami deboli, quindi i due filamenti possono separarsi quando serve (replicazione, trascrizione).`},
{id:'ch_mole13',t:'ch_mole',l:1,q:`Quante moli sono contenute in 4 g di idrogeno molecolare H₂ (M = 2 g/mol)?`,o:[`2 mol`,`8 mol`,`0,5 mol`,`6 mol`],a:0,e:`n = m / M = 4 g / 2 g/mol = 2 mol. Attenzione: la massa molare di H₂ è 2 g/mol, perché la molecola ha due atomi.`},
{id:'ch_mole14',t:'ch_mole',l:1,q:`Qual è la massa molare dell'acqua (H = 1 g/mol, O = 16 g/mol)?`,o:[`18 g/mol`,`17 g/mol`,`16 g/mol`,`34 g/mol`],a:0,e:`M(H₂O) = 2 · 1 + 16 = 18 g/mol: si sommano le masse atomiche di tutti gli atomi della formula.`},
{id:'ch_mole15',t:'ch_mole',l:1,q:`Qual è il valore approssimato del numero di Avogadro?`,o:[`6,022 × 10²³ mol⁻¹`,`6,022 × 10²² mol⁻¹`,`3,011 × 10²³ mol⁻¹`,`1,602 × 10⁻¹⁹ mol⁻¹`],a:0,e:`Il numero di Avogadro è il numero di particelle contenute in una mole: circa 6,022 × 10²³ mol⁻¹. 1,602 × 10⁻¹⁹ è invece la carica elementare in coulomb.`},
{id:'ch_mole16',t:'ch_mole',l:1,q:`Qual è il volume occupato da 1 mol di un gas ideale a 0 °C e 1 atm?`,o:[`22,4 L`,`1 L`,`11,2 L`,`44,8 L`],a:0,e:`Il volume molare di un gas ideale in condizioni normali (0 °C, 1 atm) è circa 22,4 L/mol.`},
{id:'ch_mole17',t:'ch_mole',l:2,q:`Quanti grammi pesano 0,25 mol di carbonato di calcio CaCO₃ (M = 100 g/mol)?`,o:[`25 g`,`400 g`,`2,5 g`,`0,25 g`],a:0,e:`m = n · M = 0,25 mol · 100 g/mol = 25 g.`},
{id:'ch_mole18',t:'ch_mole',l:2,q:`Quanti atomi di idrogeno sono presenti in 1 mol di H₂O?`,o:[`1,2 × 10²⁴`,`6,0 × 10²³`,`3,0 × 10²³`,`1,8 × 10²⁴`],a:0,e:`1 mol di H₂O contiene 6,022 × 10²³ molecole e ogni molecola ha 2 atomi di H: 2 × 6,022 × 10²³ ≈ 1,2 × 10²⁴ atomi.`},
{id:'ch_mole19',t:'ch_mole',l:2,q:`Che volume occupano 2 mol di un gas ideale a 0 °C e 1 atm?`,o:[`44,8 L`,`22,4 L`,`11,2 L`,`2 L`],a:0,e:`V = n · 22,4 L/mol = 2 · 22,4 = 44,8 L.`},
{id:'ch_mole20',t:'ch_mole',l:2,q:`Qual è la percentuale in massa dell'ossigeno nell'acqua (H₂O; H = 1, O = 16)?`,o:[`88,9%`,`50%`,`16%`,`33,3%`],a:0,e:`M(H₂O) = 18 g/mol, di cui 16 g sono ossigeno: 16/18 · 100 ≈ 88,9%. L'idrogeno è il restante 11,1%.`},
{id:'ch_mole21',t:'ch_mole',l:2,q:`Qual è la massa di 3,011 × 10²³ molecole di O₂ (M = 32 g/mol)?`,o:[`16 g`,`32 g`,`8 g`,`64 g`],a:0,e:`3,011 × 10²³ è metà del numero di Avogadro, cioè 0,5 mol. m = 0,5 mol · 32 g/mol = 16 g.`},
{id:'ch_mole22',t:'ch_mole',l:3,q:`Il propano brucia secondo C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. Quanti grammi di CO₂ (M = 44 g/mol) si formano bruciando 22 g di propano (M = 44 g/mol)?`,o:[`66 g`,`22 g`,`44 g`,`132 g`],a:0,e:`22 g di propano sono 22/44 = 0,5 mol. Dal rapporto 1 C₃H₈ : 3 CO₂ si formano 1,5 mol di CO₂, cioè 1,5 · 44 = 66 g.`},
{id:'ch_mole23',t:'ch_mole',l:3,q:`Nella reazione 2 Mg + O₂ → 2 MgO si fanno reagire 3 mol di Mg con 1 mol di O₂. Qual è il reagente limitante e quante moli di MgO si formano?`,o:[`O₂ è limitante e si formano 2 mol di MgO`,`Mg è limitante e si formano 3 mol di MgO`,`O₂ è limitante e si formano 1 mol di MgO`,`Mg è limitante e si formano 1,5 mol di MgO`],a:0,e:`1 mol di O₂ reagisce con 2 mol di Mg e dà 2 mol di MgO. Rimane 1 mol di Mg in eccesso. Il reagente che finisce per primo, O₂, è quello limitante.`},
{id:'ch_mole24',t:'ch_mole',l:3,q:`Un composto contiene in massa il 40% di C, il 6,7% di H e il 53,3% di O (C = 12, H = 1, O = 16). Qual è la sua formula minima?`,o:[`CH₂O`,`CHO`,`C₂H₂O`,`CH₄O`],a:0,e:`Si dividono le percentuali per le masse atomiche: C 40/12 = 3,33; H 6,7/1 = 6,7; O 53,3/16 = 3,33. Il rapporto è 1 : 2 : 1, quindi CH₂O.`},
{id:'ch_mole25',t:'ch_mole',l:3,q:`Scaldando CaCO₃ (M = 100 g/mol) si ottiene CaO (M = 56 g/mol) e CO₂: CaCO₃ → CaO + CO₂. Quanti grammi di CaO si ottengono da 200 g di CaCO₃?`,o:[`112 g`,`56 g`,`200 g`,`100 g`],a:0,e:`200 g di CaCO₃ sono 2 mol. Il rapporto è 1 : 1, quindi si formano 2 mol di CaO, cioè 2 · 56 = 112 g.`},
{id:'ch_ph13',t:'ch_ph',l:1,q:`Quale ione è responsabile del carattere basico di una soluzione acquosa?`,o:[`OH⁻`,`H⁺`,`Cl⁻`,`Na⁺`],a:0,e:`Le basi, sciolte in acqua, aumentano la concentrazione degli ioni idrossido OH⁻ rispetto a quella di H⁺.`},
{id:'ch_ph14',t:'ch_ph',l:1,q:`Secondo la teoria di Brønsted-Lowry, che cos'è un acido?`,o:[`Una sostanza che cede un protone (H⁺)`,`Una sostanza che accetta un protone`,`Una sostanza che cede elettroni`,`Una sostanza che libera ioni OH⁻`],a:0,e:`Per Brønsted e Lowry un acido è un donatore di H⁺ e una base è un accettore di H⁺.`},
{id:'ch_ph15',t:'ch_ph',l:1,q:`Qual è il pH di una soluzione di HNO₃ 0,1 M (acido forte, completamente dissociato)?`,o:[`1`,`0,1`,`13`,`7`],a:0,e:`HNO₃ è un acido forte: [H⁺] = 0,1 = 10⁻¹ M, quindi pH = −log(10⁻¹) = 1.`},
{id:'ch_ph16',t:'ch_ph',l:1,q:`Quanto vale il prodotto ionico dell'acqua Kw a 25 °C?`,o:[`1,0 × 10⁻¹⁴`,`1,0 × 10⁻⁷`,`1,0 × 10¹⁴`,`14`],a:0,e:`Kw = [H⁺][OH⁻] = 10⁻⁷ · 10⁻⁷ = 10⁻¹⁴ a 25 °C. Da qui deriva la relazione pH + pOH = 14.`},
{id:'ch_ph17',t:'ch_ph',l:2,q:`Qual è il pH di una soluzione di KOH 0,01 M (base forte) a 25 °C?`,o:[`12`,`2`,`10`,`1,2`],a:0,e:`KOH si dissocia completamente: [OH⁻] = 10⁻² M, quindi pOH = 2 e pH = 14 − 2 = 12.`},
{id:'ch_ph18',t:'ch_ph',l:2,q:`Quanto vale [H⁺] in una soluzione con pH 6?`,o:[`10⁻⁶ M`,`6 M`,`10⁶ M`,`−6 M`],a:0,e:`pH = −log[H⁺], quindi [H⁺] = 10⁻ᵖᴴ = 10⁻⁶ M.`},
{id:'ch_ph19',t:'ch_ph',l:2,q:`Qual è l'acido coniugato dell'ammoniaca NH₃?`,o:[`NH₄⁺`,`NH₂⁻`,`OH⁻`,`N₂H₄`],a:0,e:`L'acido coniugato di una base si ottiene aggiungendole un H⁺: NH₃ + H⁺ → NH₄⁺.`},
{id:'ch_ph20',t:'ch_ph',l:2,q:`Quale di queste soluzioni, tutte 0,1 M, ha il pH più basso?`,o:[`HCl`,`CH₃COOH`,`NaCl`,`NH₃`],a:0,e:`HCl è un acido forte e fornisce [H⁺] = 0,1 M (pH = 1). L'acido acetico è debole e si dissocia poco, NaCl è neutro e NH₃ è una base.`},
{id:'ch_ph21',t:'ch_ph',l:2,q:`Quale colore assume la fenolftaleina in una soluzione di pH 12?`,o:[`Rosa-fucsia`,`Incolore`,`Giallo`,`Blu`],a:0,e:`La fenolftaleina è incolore in ambiente acido e neutro e vira al rosa-fucsia circa tra pH 8 e 10: a pH 12 è nettamente rosa.`},
{id:'ch_ph22',t:'ch_ph',l:3,q:`Una soluzione 0,1 M di un acido debole HA ha Ka = 1 × 10⁻⁵. Usando l'approssimazione [H⁺] = √(Ka · C), qual è il suo pH?`,o:[`3`,`1`,`5`,`6`],a:0,e:`[H⁺] = √(10⁻⁵ · 10⁻¹) = √(10⁻⁶) = 10⁻³ M, quindi pH = 3. Un acido forte alla stessa concentrazione avrebbe pH 1.`},
{id:'ch_ph23',t:'ch_ph',l:3,q:`Una soluzione di HCl ha pH 2. Diluendola 100 volte con acqua, quale pH si ottiene (circa)?`,o:[`4`,`2,01`,`0`,`6`],a:0,e:`La diluizione di 100 volte riduce [H⁺] di 100 volte: da 10⁻² M a 10⁻⁴ M, quindi pH = 4.`},
{id:'ch_ph24',t:'ch_ph',l:3,q:`Si mescolano 100 mL di HCl 0,2 M e 100 mL di NaOH 0,1 M. Qual è il pH della soluzione finale (circa)?`,o:[`1,3`,`1`,`7`,`2,3`],a:0,e:`Le moli sono 0,02 mol di H⁺ e 0,01 mol di OH⁻: dopo la neutralizzazione restano 0,01 mol di H⁺ in 0,2 L, cioè [H⁺] = 0,05 M. pH = −log 0,05 ≈ 1,3.`},
{id:'ch_ph25',t:'ch_ph',l:3,q:`In una soluzione tampone acido acetico/acetato la concentrazione dell'acido è uguale a quella della base coniugata. Quanto vale il pH?`,o:[`Uguale al pKa dell'acido`,`Uguale a 7`,`Uguale a 14 − pKa`,`Uguale a 2 · pKa`],a:0,e:`Dall'equazione di Henderson-Hasselbalch, pH = pKa + log([base]/[acido]). Se [base] = [acido] il logaritmo vale 0 e pH = pKa (circa 4,76 per l'acido acetico).`},
{id:'bi_cell13',t:'bi_cell',l:1,q:`Quale struttura delimita la cellula e controlla gli scambi con l'ambiente esterno?`,o:[`Membrana plasmatica`,`Parete cellulare`,`Citoscheletro`,`Nucleo`],a:0,e:`La membrana plasmatica è un doppio strato di fosfolipidi con proteine: separa la cellula dall'esterno e regola con selettività ciò che entra e ciò che esce. La parete, quando c'è, sta all'esterno della membrana e non è selettiva.`},
{id:'bi_cell14',t:'bi_cell',l:1,q:`Quale struttura dà forma e sostegno interno alla cellula e permette lo spostamento degli organuli?`,o:[`Citoscheletro`,`Membrana nucleare`,`Reticolo endoplasmatico`,`Lisosoma`],a:0,e:`Il citoscheletro è una rete di filamenti proteici (microtubuli, filamenti intermedi, microfilamenti di actina) che sostiene la cellula, la fa muovere e guida il trasporto degli organuli.`},
{id:'bi_cell15',t:'bi_cell',l:1,q:`Quale di questi organismi è formato da una cellula procariote?`,o:[`Un batterio come Escherichia coli`,`Un lievito`,`Un fungo a cappello`,`Un'ameba`],a:0,e:`I batteri e gli archei sono procarioti. Lieviti, funghi e amebe (protozoi) sono eucarioti, con un vero nucleo delimitato da membrana.`},
{id:'bi_cell16',t:'bi_cell',l:1,q:`Che cos'è il citoplasma?`,o:[`Tutto il contenuto della cellula racchiuso dalla membrana plasmatica, escluso il nucleo`,`Soltanto il liquido interno del nucleo`,`Soltanto la membrana plasmatica`,`Soltanto l'insieme degli organuli`],a:0,e:`Il citoplasma comprende il citosol (la parte fluida, ricca d'acqua) e gli organuli in esso immersi, e si trova fra la membrana plasmatica e il nucleo.`},
{id:'bi_cell17',t:'bi_cell',l:2,q:`Qual è la funzione principale del nucleolo?`,o:[`Produrre l'RNA ribosomiale e assemblare le subunità dei ribosomi`,`Digerire le molecole di scarto`,`Produrre ATP`,`Modificare i lipidi di membrana`],a:0,e:`Il nucleolo è una regione del nucleo, non delimitata da membrana, dove si sintetizza l'rRNA e si assemblano le subunità ribosomiali, poi esportate nel citoplasma.`},
{id:'bi_cell18',t:'bi_cell',l:2,q:`Quale di questi organuli NON è delimitato da membrana?`,o:[`Ribosoma`,`Mitocondrio`,`Lisosoma`,`Apparato di Golgi`],a:0,e:`I ribosomi sono complessi di rRNA e proteine, senza membrana. Per questo sono presenti anche nei procarioti. Mitocondri, lisosomi e Golgi sono delimitati da membrane.`},
{id:'bi_cell19',t:'bi_cell',l:2,q:`Quale struttura è tipica delle cellule animali e manca nelle cellule delle piante superiori?`,o:[`Centrioli`,`Mitocondri`,`Ribosomi`,`Nucleo`],a:0,e:`I centrioli, coppie di cilindri di microtubuli nel centrosoma, sono presenti nelle cellule animali e organizzano il fuso mitotico. Le piante superiori formano il fuso senza centrioli.`},
{id:'bi_cell20',t:'bi_cell',l:2,q:`Dove si trova il DNA di una cellula batterica?`,o:[`Nel nucleoide, una regione del citoplasma non delimitata da membrana`,`In un nucleo con doppia membrana`,`Nei lisosomi`,`Nel reticolo endoplasmatico`],a:0,e:`I batteri non hanno un nucleo vero: il cromosoma circolare sta nel nucleoide, a contatto diretto con il citoplasma.`},
{id:'bi_cell21',t:'bi_cell',l:2,q:`Quale organulo delle cellule vegetali accumula acqua e sostanze di riserva e contribuisce alla turgidità?`,o:[`Vacuolo centrale`,`Lisosoma`,`Perossisoma`,`Centriolo`],a:0,e:`Nelle cellule vegetali mature il grande vacuolo centrale occupa gran parte del volume: immagazzina acqua e soluti e, spingendo sulla parete, mantiene la turgidità.`},
{id:'bi_cell22',t:'bi_cell',l:3,q:`Quale polimero è il componente principale della parete cellulare dei funghi?`,o:[`Chitina`,`Cellulosa`,`Peptidoglicano`,`Amido`],a:0,e:`La parete dei funghi è formata soprattutto da chitina. La cellulosa è tipica delle piante, il peptidoglicano dei batteri.`},
{id:'bi_cell23',t:'bi_cell',l:3,q:`Quali organuli contengono un proprio DNA?`,o:[`Mitocondri e cloroplasti`,`Lisosomi e perossisomi`,`Ribosomi e Golgi`,`Reticolo liscio e rugoso`],a:0,e:`Mitocondri e cloroplasti hanno DNA circolare e ribosomi propri, e si dividono da soli: indizi a favore della teoria endosimbiontica.`},
{id:'bi_cell24',t:'bi_cell',l:3,q:`Perché le cellule del muscolo cardiaco contengono moltissimi mitocondri?`,o:[`Hanno un'elevata richiesta continua di ATP`,`Devono sintetizzare molte proteine di secrezione`,`Devono digerire grandi quantità di materiale`,`Devono conservare il DNA`],a:0,e:`Il cuore si contrae di continuo e consuma molta energia: i mitocondri producono l'ATP tramite la respirazione cellulare aerobica.`},
{id:'bi_cell25',t:'bi_cell',l:3,q:`Quale tipo di ribosomi (coefficiente di sedimentazione) è presente nelle cellule procariote?`,o:[`70S`,`80S`,`60S`,`40S`],a:0,e:`I ribosomi procariotici sono 70S (subunità 50S e 30S), quelli eucariotici nel citoplasma sono 80S (60S e 40S). Questa differenza permette ad alcuni antibiotici di colpire solo i batteri.`},
{id:'bi_memb13',t:'bi_memb',l:1,q:`Che cos'è l'esocitosi?`,o:[`L'uscita di materiali dalla cellula tramite vescicole che si fondono con la membrana`,`L'ingresso di materiali tramite vescicole`,`Il passaggio di acqua attraverso la membrana`,`Il trasporto di ioni da canali`],a:0,e:`Nell'esocitosi la vescicola si fonde con la membrana plasmatica e rilascia il contenuto all'esterno (per esempio ormoni o neurotrasmettitori). L'endocitosi è il processo inverso.`},
{id:'bi_memb14',t:'bi_memb',l:1,q:`Quale lipide è presente nelle membrane delle cellule animali e ne regola la fluidità?`,o:[`Colesterolo`,`Amido`,`Trigliceride`,`Glicogeno`],a:0,e:`Il colesterolo si inserisce fra i fosfolipidi: a temperature alte irrigidisce la membrana, a basse impedisce che diventi troppo rigida, mantenendone la fluidità.`},
{id:'bi_memb15',t:'bi_memb',l:1,q:`Per quali sostanze la parte interna idrofobica del doppio strato è una barriera difficile da attraversare?`,o:[`Ioni e molecole polari o cariche`,`Ossigeno e anidride carbonica`,`Molecole apolari piccole`,`Lipidi`],a:0,e:`Gli ioni (come Na⁺ e K⁺) e le molecole polari grandi non si sciolgono nelle code idrofobiche: per attraversare la membrana servono proteine di trasporto.`},
{id:'bi_memb16',t:'bi_memb',l:1,q:`Che cosa significa che la membrana plasmatica ha permeabilità selettiva?`,o:[`Lascia passare alcune sostanze e ne blocca altre`,`Lascia passare tutto`,`Non lascia passare niente`,`Lascia passare solo l'acqua`],a:0,e:`La membrana è permeabile in modo diverso a sostanze diverse, in base a dimensioni, carica e solubilità, e alle proteine di trasporto presenti.`},
{id:'bi_memb17',t:'bi_memb',l:2,q:`Come entra il glucosio nella maggior parte delle cellule?`,o:[`Per diffusione facilitata tramite proteine trasportatrici (GLUT)`,`Per diffusione semplice attraverso il doppio strato`,`Per esocitosi`,`Con la pompa Na⁺/K⁺ direttamente`],a:0,e:`Il glucosio è una molecola polare e grande: non attraversa il doppio strato, ma entra secondo gradiente grazie a trasportatori specifici della famiglia GLUT.`},
{id:'bi_memb18',t:'bi_memb',l:2,q:`Che cosa descrive il modello a mosaico fluido della membrana?`,o:[`Un doppio strato fluido di fosfolipidi in cui le proteine si muovono lateralmente`,`Una barriera rigida di proteine`,`Un solo strato di fosfolipidi fisso`,`Una membrana senza proteine`],a:0,e:`Nel modello di Singer e Nicolson le molecole della membrana si spostano lateralmente, come un mosaico che cambia continuamente disposizione.`},
{id:'bi_memb19',t:'bi_memb',l:2,q:`Un globulo rosso viene posto in una soluzione di NaCl allo 0,9%, isotonica rispetto al suo citoplasma. Cosa accade?`,o:[`Non c'è variazione netta di volume`,`Si gonfia e scoppia`,`Si raggrinzisce`,`Perde tutto il contenuto`],a:0,e:`In una soluzione isotonica entra tanta acqua quanta ne esce: il volume resta invariato. Per questo le soluzioni fisiologiche sono preparate allo 0,9% di NaCl.`},
{id:'bi_memb20',t:'bi_memb',l:2,q:`Che cosa sono le acquaporine?`,o:[`Proteine canale che facilitano il passaggio dell'acqua`,`Pompe che consumano ATP per spostare ioni`,`Enzimi che demoliscono l'acqua`,`Recettori per gli ormoni`],a:0,e:`L'acqua attraversa un po' anche il doppio strato, ma le acquaporine ne aumentano molto la velocità: sono canali selettivi per le molecole d'acqua.`},
{id:'bi_memb21',t:'bi_memb',l:2,q:`Come si chiama il processo con cui una cellula inglobia particelle grandi, come un batterio?`,o:[`Fagocitosi`,`Diffusione semplice`,`Osmosi`,`Trasporto passivo`],a:0,e:`Nella fagocitosi la membrana emette pseudopodi che circondano la particella e la inglobano in una vescicola. È usata per esempio dai macrofagi.`},
{id:'bi_memb22',t:'bi_memb',l:3,q:`Il cotrasporto sodio-glucosio (SGLT) è un esempio di…`,o:[`trasporto attivo secondario`,`diffusione semplice`,`trasporto attivo primario`,`osmosi`],a:0,e:`L'SGLT usa il gradiente di Na⁺ (creato dalla pompa Na⁺/K⁺ con ATP) come fonte di energia per portare il glucosio dentro la cellula anche contro gradiente: l'ATP serve in modo indiretto.`},
{id:'bi_memb23',t:'bi_memb',l:3,q:`Una soluzione di NaCl 0,15 M (completamente dissociata in Na⁺ e Cl⁻) quale osmolarità ha?`,o:[`0,3 osmol/L`,`0,15 osmol/L`,`0,075 osmol/L`,`0,6 osmol/L`],a:0,e:`L'osmolarità conta le particelle: 0,15 mol/L di NaCl liberano 0,15 mol/L di Na⁺ e 0,15 mol/L di Cl⁻, quindi 0,30 osmol/L, simile a quella del plasma.`},
{id:'bi_memb24',t:'bi_memb',l:3,q:`Che cosa contribuisce soprattutto a creare il potenziale di membrana a riposo di una cellula nervosa?`,o:[`Il gradiente del K⁺, mantenuto dalla pompa Na⁺/K⁺, e la permeabilità al K⁺`,`La sintesi di proteine nel nucleo`,`Il passaggio di acqua per osmosi`,`La fagocitosi`],a:0,e:`A riposo la membrana è molto permeabile al K⁺, che esce secondo gradiente lasciando l'interno negativo. La pompa Na⁺/K⁺ mantiene i gradienti dei due ioni.`},
{id:'bi_memb25',t:'bi_memb',l:3,q:`Che cosa accade a un globulo rosso immerso in acqua distillata?`,o:[`Entra acqua per osmosi e la cellula si rompe (emolisi)`,`Perde acqua e si raggrinzisce`,`Non succede niente`,`Produce più ATP`],a:0,e:`L'acqua distillata è fortemente ipotonica: l'acqua entra nel globulo e, senza parete cellulare, la membrana cede e la cellula si lisa.`},
{id:'bi_dna13',t:'bi_dna',l:1,q:`Che cos'è un gene?`,o:[`Un tratto di DNA che contiene l'informazione per una proteina o un RNA funzionale`,`Una proteina che replica il DNA`,`Una molecola di RNA di trasporto`,`Un organulo della cellula`],a:0,e:`Un gene è un'unità di informazione ereditaria: la sua sequenza di nucleotidi codifica una proteina (o un RNA con una funzione, come tRNA e rRNA).`},
{id:'bi_dna14',t:'bi_dna',l:1,q:`Qual è la forma tridimensionale della molecola di DNA?`,o:[`Doppia elica`,`Singola elica`,`Foglietto piatto`,`Sfera compatta`],a:0,e:`La struttura a doppia elica fu descritta da Watson e Crick nel 1953: due filamenti antiparalleli avvolti uno sull'altro e tenuti insieme dalle basi appaiate.`},
{id:'bi_dna15',t:'bi_dna',l:1,q:`Dove avviene la traduzione, cioè la sintesi delle proteine?`,o:[`Sui ribosomi`,`Nel nucleolo`,`Nei lisosomi`,`Nella membrana plasmatica`],a:0,e:`I ribosomi leggono l'mRNA e uniscono gli amminoacidi trasportati dai tRNA. Nelle cellule eucariote si trovano nel citoplasma, liberi o legati al reticolo rugoso.`},
{id:'bi_dna16',t:'bi_dna',l:1,q:`Quante basi azotate diverse sono presenti nel DNA?`,o:[`4`,`2`,`3`,`5`],a:0,e:`Nel DNA ci sono adenina, timina, guanina e citosina. Nell'RNA la timina è sostituita dall'uracile.`},
{id:'bi_dna17',t:'bi_dna',l:2,q:`Quali sono le basi puriniche presenti nel DNA?`,o:[`Adenina e guanina`,`Citosina e timina`,`Adenina e timina`,`Guanina e citosina`],a:0,e:`Le purine hanno due anelli (adenina e guanina), le pirimidine ne hanno uno (citosina, timina e, nell'RNA, uracile).`},
{id:'bi_dna18',t:'bi_dna',l:2,q:`Quale codone dell'mRNA segnala normalmente l'inizio della traduzione?`,o:[`AUG`,`UAA`,`UGA`,`GCU`],a:0,e:`AUG codifica la metionina ed è il codone di inizio. UAA, UAG e UGA sono codoni di stop e non codificano amminoacidi.`},
{id:'bi_dna19',t:'bi_dna',l:2,q:`Quale enzima aggiunge nucleotidi al nuovo filamento durante la replicazione del DNA?`,o:[`DNA polimerasi`,`RNA polimerasi`,`Elicasi`,`Lisozima`],a:0,e:`La DNA polimerasi allunga il nuovo filamento in direzione 5'→3' seguendo lo stampo. L'elicasi separa i due filamenti, l'RNA polimerasi lavora nella trascrizione.`},
{id:'bi_dna20',t:'bi_dna',l:2,q:`Che cos'è un introne?`,o:[`Un tratto di un gene eucariote che viene rimosso dall'mRNA (splicing)`,`Un tratto che codifica proteine e resta nell'mRNA maturo`,`Il segnale di inizio della traduzione`,`Un tipo di RNA transfer`],a:0,e:`I geni degli eucarioti contengono esoni, che vengono mantenuti nell'mRNA maturo, e introni, che vengono tagliati via durante lo splicing prima che l'mRNA esca dal nucleo.`},
{id:'bi_dna21',t:'bi_dna',l:2,q:`Quale tipo di RNA porta gli amminoacidi ai ribosomi?`,o:[`tRNA`,`mRNA`,`rRNA`,`DNA mitocondriale`],a:0,e:`Ogni tRNA lega uno specifico amminoacido e, con il suo anticodone, riconosce il codone corrispondente sull'mRNA.`},
{id:'bi_dna22',t:'bi_dna',l:3,q:`In un frammento di DNA a doppio filamento il 30% delle basi è adenina. Qual è la percentuale di citosina?`,o:[`20%`,`30%`,`40%`,`70%`],a:0,e:`Per l'appaiamento A = T = 30%, quindi A + T = 60%. Restano il 40% per G + C, in parti uguali: C = 20%.`},
{id:'bi_dna23',t:'bi_dna',l:3,q:`Una regione codificante di mRNA ha 300 nucleotidi e non include il codone di stop. Quanti amminoacidi ha la proteina?`,o:[`100`,`300`,`900`,`3`],a:0,e:`Ogni codone di 3 nucleotidi codifica un amminoacido: 300 / 3 = 100 amminoacidi.`},
{id:'bi_dna24',t:'bi_dna',l:3,q:`Quale tipo di mutazione, come la perdita di una sola base, sposta la cornice di lettura dei codoni?`,o:[`Mutazione frameshift (con scorrimento del modulo di lettura)`,`Mutazione silente`,`Sostituzione che cambia solo un codone`,`Mutazione che non altera la sequenza`],a:0,e:`Una delezione o inserzione di un numero di basi non multiplo di 3 cambia il raggruppamento dei codoni da quel punto in poi: gli amminoacidi successivi risultano di solito tutti diversi.`},
{id:'bi_dna25',t:'bi_dna',l:3,q:`Perché si dice che il codice genetico è degenerato?`,o:[`Perché più codoni diversi possono codificare lo stesso amminoacido`,`Perché alcuni codoni non hanno alcun significato`,`Perché cambia da specie a specie`,`Perché un codone codifica più amminoacidi`],a:0,e:`Ci sono 64 codoni possibili e solo 20 amminoacidi: molti amminoacidi hanno più codoni sinonimi. Il codice però non è ambiguo: un codone specifica un solo amminoacido.`},
{id:'bi_gen13',t:'bi_gen',l:1,q:`Che cos'è il genotipo di un individuo?`,o:[`L'insieme degli alleli che possiede per uno o più geni`,`L'insieme dei caratteri visibili`,`Il numero di cromosomi`,`L'ambiente in cui vive`],a:0,e:`Il genotipo è la costituzione genetica (per esempio Aa); il fenotipo è il carattere che si osserva, risultato di genotipo e ambiente.`},
{id:'bi_gen14',t:'bi_gen',l:1,q:`Che cos'è il fenotipo di un individuo?`,o:[`L'insieme dei caratteri osservabili`,`L'insieme degli alleli`,`Il numero di gameti prodotti`,`La sequenza del DNA`],a:0,e:`Il fenotipo comprende i caratteri visibili o misurabili, come il colore dei fiori o il gruppo sanguigno, e dipende dal genotipo e dall'ambiente.`},
{id:'bi_gen15',t:'bi_gen',l:1,q:`Quale scienziato è considerato il fondatore della genetica per i suoi esperimenti sui piselli?`,o:[`Gregor Mendel`,`Charles Darwin`,`Louis Pasteur`,`James Watson`],a:0,e:`Gregor Mendel, monaco agostiniano, incrociò migliaia di piante di pisello e dedusse le leggi dell'ereditarietà, pubblicate nel 1866.`},
{id:'bi_gen16',t:'bi_gen',l:1,q:`Quando si manifesta un carattere recessivo?`,o:[`Quando l'individuo è omozigote per l'allele recessivo`,`Quando è eterozigote`,`Sempre, in ogni genotipo`,`Solo nei maschi`],a:0,e:`L'allele recessivo si manifesta solo in assenza dell'allele dominante, cioè nel genotipo aa.`},
{id:'bi_gen17',t:'bi_gen',l:2,q:`Incrocio Aa × Aa. Quale percentuale della prole è eterozigote?`,o:[`50%`,`25%`,`75%`,`100%`],a:0,e:`I genotipi attesi sono 1/4 AA, 2/4 Aa, 1/4 aa: gli eterozigoti sono 2/4 = 50%.`},
{id:'bi_gen18',t:'bi_gen',l:2,q:`Incrocio AABB × aabb (geni su cromosomi diversi). Qual è il genotipo di tutta la F1?`,o:[`AaBb`,`AABB`,`aabb`,`AAbb`],a:0,e:`Ogni genitore, omozigote, produce un solo tipo di gameti: AB e ab. Tutta la F1 è quindi AaBb.`},
{id:'bi_gen19',t:'bi_gen',l:2,q:`Che cosa afferma la legge della segregazione (seconda legge di Mendel)?`,o:[`I due alleli di un gene si separano durante la formazione dei gameti`,`Ogni gamete contiene tutti gli alleli`,`Gli alleli dominanti si trasmettono sempre`,`Geni diversi sono sempre legati`],a:0,e:`Ogni individuo ha due alleli per ogni gene, ma ogni gamete ne riceve uno solo: per questo gli alleli di un genitore possono ricombinarsi in modo diverso nei figli.`},
{id:'bi_gen20',t:'bi_gen',l:2,q:`Quanti tipi diversi di gameti produce un individuo AaBb, con i due geni su cromosomi diversi?`,o:[`4`,`2`,`3`,`8`],a:0,e:`I gameti possibili sono AB, Ab, aB e ab, in uguali proporzioni.`},
{id:'bi_gen21',t:'bi_gen',l:2,q:`Incrocio Aa × Aa. Qual è la probabilità che un figlio mostri il fenotipo dominante?`,o:[`3/4`,`1/4`,`1/2`,`1`],a:0,e:`AA (1/4) e Aa (2/4) mostrano il fenotipo dominante: 3/4. Solo aa (1/4) mostra il fenotipo recessivo.`},
{id:'bi_gen22',t:'bi_gen',l:3,q:`Incrocio diibrido AaBb × AaBb con dominanza completa e geni indipendenti. Qual è il rapporto fenotipico atteso nella prole?`,o:[`9 : 3 : 3 : 1`,`3 : 1`,`1 : 1 : 1 : 1`,`1 : 2 : 1`],a:0,e:`I fenotipi sono 9/16 con entrambi i caratteri dominanti, 3/16 dominante-recessivo, 3/16 recessivo-dominante e 1/16 con entrambi recessivi: 9 : 3 : 3 : 1.`},
{id:'bi_gen23',t:'bi_gen',l:3,q:`Una coppia ha tre figli. Supponendo che nascere maschio o femmina siano ugualmente probabili, qual è la probabilità che siano tutti maschi?`,o:[`1/8`,`1/6`,`1/4`,`3/8`],a:0,e:`Gli eventi sono indipendenti: (1/2)³ = 1/8.`},
{id:'bi_gen24',t:'bi_gen',l:3,q:`Un individuo con fenotipo dominante e genotipo ignoto viene incrociato con un aa. La prole è per metà dominante e per metà recessiva. Qual era il suo genotipo?`,o:[`Aa`,`AA`,`aa`,`AaBb`],a:0,e:`Se fosse AA tutta la prole sarebbe dominante. La presenza di figli aa indica che l'individuo ha trasmesso l'allele a: è eterozigote Aa, e Aa × aa dà 1/2 Aa e 1/2 aa.`},
{id:'bi_gen25',t:'bi_gen',l:3,q:`Due genitori Aa × Aa hanno due figli. Qual è la probabilità che esattamente uno dei due sia aa?`,o:[`3/8`,`1/16`,`1/4`,`9/16`],a:0,e:`P(aa) = 1/4 e P(non aa) = 3/4. Ci sono due ordini possibili (aa prima o dopo): 2 · (1/4) · (3/4) = 6/16 = 3/8.`},
{id:'fi_cin13',t:'fi_cin',l:1,q:`Che cosa rappresenta la pendenza di un grafico spazio-tempo di un moto rettilineo uniforme?`,o:[`La velocità`,`L'accelerazione`,`Lo spazio percorso`,`Il tempo impiegato`],a:0,e:`In un grafico s-t la pendenza è Δs/Δt, cioè la velocità. Nel moto rettilineo uniforme il grafico è una retta, perché la velocità è costante.`},
{id:'fi_cin14',t:'fi_cin',l:1,q:`Come si chiama la grandezza che misura quanto velocemente cambia la velocità di un corpo?`,o:[`Accelerazione`,`Spostamento`,`Potenza`,`Lavoro`],a:0,e:`L'accelerazione è la variazione di velocità nell'unità di tempo: a = Δv / Δt, e si misura in m/s².`},
{id:'fi_cin15',t:'fi_cin',l:1,q:`In un moto rettilineo uniformemente accelerato, come varia la velocità nel tempo?`,o:[`In modo lineare`,`Resta costante`,`In modo quadratico`,`In modo casuale`],a:0,e:`Con accelerazione costante v = v₀ + a · t: nel grafico v-t si ottiene una retta.`},
{id:'fi_cin16',t:'fi_cin',l:1,q:`Qual è il valore approssimato dell'accelerazione di gravità sulla superficie della Terra?`,o:[`9,8 m/s²`,`1,6 m/s²`,`98 m/s²`,`0,98 m/s²`],a:0,e:`Vicino alla superficie terrestre g ≈ 9,8 m/s² (spesso approssimato a 10 m/s²). Il valore 1,6 m/s² è quello della Luna.`},
{id:'fi_cin17',t:'fi_cin',l:2,q:`Un'auto viaggia a 90 km/h costanti. Quanta strada percorre in 10 s?`,o:[`250 m`,`900 m`,`90 m`,`25 m`],a:0,e:`90 km/h = 90 / 3,6 = 25 m/s. Lo spazio percorso è s = v · t = 25 · 10 = 250 m.`},
{id:'fi_cin18',t:'fi_cin',l:2,q:`Un ciclista viaggia a 15 m/s. Quanto tempo impiega a percorrere 150 m?`,o:[`10 s`,`2250 s`,`0,1 s`,`165 s`],a:0,e:`t = s / v = 150 m / 15 m/s = 10 s.`},
{id:'fi_cin19',t:'fi_cin',l:2,q:`Un'auto passa da ferma a 100 km/h in 10 s con accelerazione costante. Qual è l'accelerazione (circa)?`,o:[`2,8 m/s²`,`10 m/s²`,`1 m/s²`,`36 m/s²`],a:0,e:`100 km/h = 100 / 3,6 ≈ 27,8 m/s. a = Δv / Δt = 27,8 / 10 ≈ 2,8 m/s².`},
{id:'fi_cin20',t:'fi_cin',l:2,q:`Un oggetto cade da fermo in caduta libera (g = 10 m/s², senza attrito dell'aria). Che velocità ha dopo 3 s?`,o:[`30 m/s`,`10 m/s`,`15 m/s`,`45 m/s`],a:0,e:`v = g · t = 10 · 3 = 30 m/s.`},
{id:'fi_cin21',t:'fi_cin',l:2,q:`Un oggetto cade da fermo in caduta libera (g = 10 m/s², senza attrito dell'aria). Quanta strada percorre in 3 s?`,o:[`45 m`,`30 m`,`90 m`,`15 m`],a:0,e:`s = ½ · g · t² = ½ · 10 · 3² = 45 m. Il valore 30 m sarebbe la velocità raggiunta, non lo spazio.`},
{id:'fi_cin22',t:'fi_cin',l:3,q:`Un corpo passa da 10 m/s a 20 m/s con accelerazione costante di 5 m/s². Quanta strada percorre in questa fase?`,o:[`30 m`,`60 m`,`15 m`,`75 m`],a:0,e:`Si usa v² = v₀² + 2 · a · s: s = (20² − 10²) / (2 · 5) = 300 / 10 = 30 m. Con la velocità media: 15 m/s per 2 s, cioè 30 m.`},
{id:'fi_cin23',t:'fi_cin',l:3,q:`Un'auto B viaggia a 30 m/s e ne insegue una A che va a 20 m/s, 100 m più avanti. Dopo quanto tempo la raggiunge?`,o:[`10 s`,`3,3 s`,`5 s`,`20 s`],a:0,e:`La velocità relativa è 30 − 20 = 10 m/s: B recupera 10 m ogni secondo. Per colmare 100 m servono 100 / 10 = 10 s.`},
{id:'fi_cin24',t:'fi_cin',l:3,q:`Un'auto accelera da 0 a 20 m/s in 10 s e poi viaggia a 20 m/s per altri 10 s. Quanta strada percorre in tutto?`,o:[`300 m`,`400 m`,`200 m`,`100 m`],a:0,e:`Nel grafico v-t lo spazio è l'area sotto la curva: triangolo ½ · 10 · 20 = 100 m nella prima fase e rettangolo 20 · 10 = 200 m nella seconda. Totale 300 m.`},
{id:'fi_cin25',t:'fi_cin',l:3,q:`Un sasso viene lanciato verso l'alto a 30 m/s (g = 10 m/s², senza attrito dell'aria). Dopo quanto tempo ricade al punto di partenza?`,o:[`6 s`,`3 s`,`9 s`,`12 s`],a:0,e:`Salita e discesa durano lo stesso tempo: t_salita = v₀ / g = 3 s. Il tempo totale è 2 · 3 = 6 s.`},
{id:'fi_din13',t:'fi_din',l:1,q:`Che cosa misura la massa di un corpo?`,o:[`La sua inerzia, cioè la resistenza a cambiare velocità`,`La forza con cui è attratto dalla Terra`,`Il suo volume`,`La sua velocità`],a:0,e:`La massa è la misura dell'inerzia di un corpo: a parità di forza, un corpo più massiccio accelera meno. Il peso, invece, è la forza con cui il corpo è attratto verso la Terra.`},
{id:'fi_din14',t:'fi_din',l:1,q:`Quale forza fa cadere un oggetto lasciato libero?`,o:[`La forza peso (di gravità)`,`La forza elastica`,`La forza di attrito`,`La forza centrifuga`],a:0,e:`La Terra attira ogni corpo con la forza peso, P = m · g, diretta verso il centro della Terra.`},
{id:'fi_din15',t:'fi_din',l:1,q:`Qual è la direzione della forza di attrito radente rispetto al moto di un corpo?`,o:[`Opposta al moto`,`Uguale al moto`,`Perpendicolare al moto`,`Sempre verso l'alto`],a:0,e:`L'attrito radente si oppone allo scorrimento tra le superfici e quindi agisce in verso opposto al moto relativo.`},
{id:'fi_din16',t:'fi_din',l:1,q:`Che cosa accade a un corpo su cui agisce una forza risultante diversa da zero?`,o:[`Accelera`,`Resta fermo`,`Si muove a velocità costante`,`Perde massa`],a:0,e:`Per il secondo principio della dinamica la risultante F produce un'accelerazione a = F / m nella stessa direzione e verso della forza.`},
{id:'fi_din17',t:'fi_din',l:2,q:`Una forza risultante di 12 N agisce su un corpo di massa 3 kg. Qual è la sua accelerazione?`,o:[`4 m/s²`,`36 m/s²`,`0,25 m/s²`,`15 m/s²`],a:0,e:`a = F / m = 12 N / 3 kg = 4 m/s².`},
{id:'fi_din18',t:'fi_din',l:2,q:`Una cassa è appoggiata su un piano orizzontale e la forza normale è 50 N. Il coefficiente di attrito dinamico è 0,4. Quanto vale la forza di attrito?`,o:[`20 N`,`125 N`,`12,5 N`,`0,4 N`],a:0,e:`F_attrito = μ · N = 0,4 · 50 = 20 N.`},
{id:'fi_din19',t:'fi_din',l:2,q:`Una forza di 60 N tira una cassa di 20 kg su un piano orizzontale con attrito di 20 N. Qual è l'accelerazione?`,o:[`2 m/s²`,`3 m/s²`,`1 m/s²`,`4 m/s²`],a:0,e:`La risultante è 60 − 20 = 40 N. a = F / m = 40 / 20 = 2 m/s². Il valore 3 m/s² si otterrebbe ignorando l'attrito (60 / 20).`},
{id:'fi_din20',t:'fi_din',l:2,q:`La Terra attira una mela con una forza pari al peso della mela. Che forza esercita la mela sulla Terra?`,o:[`Una forza uguale in modulo e di verso opposto`,`Una forza molto più piccola`,`Nessuna forza`,`Una forza uguale e dello stesso verso`],a:0,e:`Per il terzo principio le forze di azione e reazione sono uguali in modulo e opposte. Gli effetti sono diversi perché le masse sono diverse: la mela accelera molto, la Terra quasi niente.`},
{id:'fi_din21',t:'fi_din',l:2,q:`Sulla Luna g ≈ 1,6 m/s². Quanto pesa un astronauta di massa 80 kg?`,o:[`128 N`,`800 N`,`80 N`,`50 N`],a:0,e:`P = m · g = 80 · 1,6 = 128 N. Sulla Terra peserebbe 800 N, ma la massa è sempre 80 kg.`},
{id:'fi_din22',t:'fi_din',l:3,q:`Un blocco di 5 kg è spinto da una forza orizzontale di 20 N su un piano scabro con coefficiente di attrito dinamico 0,2 (g = 10 m/s²). Qual è l'accelerazione?`,o:[`2 m/s²`,`4 m/s²`,`3 m/s²`,`1 m/s²`],a:0,e:`La normale è N = m · g = 50 N, quindi l'attrito è μ · N = 0,2 · 50 = 10 N. La risultante è 20 − 10 = 10 N e a = 10 / 5 = 2 m/s².`},
{id:'fi_din23',t:'fi_din',l:3,q:`Due blocchi di 2 kg e 3 kg, uniti da una fune, si trovano su un piano senza attrito. Una forza di 10 N tira il blocco da 2 kg, che traina quello da 3 kg. Quanto vale la tensione della fune?`,o:[`6 N`,`10 N`,`4 N`,`2 N`],a:0,e:`L'insieme (massa totale 5 kg) ha accelerazione a = 10 / 5 = 2 m/s². La fune è l'unica forza che accelera il blocco da 3 kg: T = 3 · 2 = 6 N.`},
{id:'fi_din24',t:'fi_din',l:3,q:`Un corpo di 2 kg si muove a 5 m/s e si ferma urtando un muro in 0,1 s. Qual è la forza media esercitata?`,o:[`100 N`,`10 N`,`1 N`,`50 N`],a:0,e:`Dal teorema dell'impulso F · Δt = Δp: Δp = 2 · 5 = 10 kg·m/s. F = 10 / 0,1 = 100 N.`},
{id:'fi_din25',t:'fi_din',l:3,q:`Un ascensore scende con accelerazione 2 m/s² (g = 10 m/s²). Quale forza segna una bilancia sotto una persona di 60 kg?`,o:[`480 N`,`720 N`,`600 N`,`120 N`],a:0,e:`Con l'ascensore che scende accelerando, N − m·g = m·a con a verso il basso: N = m · (g − a) = 60 · 8 = 480 N. La persona si sente più leggera.`},
{id:'fi_en13',t:'fi_en',l:1,q:`Quale di queste unità è un'unità di energia?`,o:[`Chilowattora (kWh)`,`Chilowatt (kW)`,`Newton (N)`,`Ampere (A)`],a:0,e:`Il kWh è l'energia consumata da un apparecchio da 1 kW in un'ora: vale 3,6 milioni di joule. Il kW è un'unità di potenza.`},
{id:'fi_en14',t:'fi_en',l:1,q:`Che cosa afferma il principio di conservazione dell'energia?`,o:[`L'energia non si crea né si distrugge, ma si trasforma`,`L'energia cresce sempre`,`L'energia si perde sempre per attrito`,`L'energia dipende solo dalla massa`],a:0,e:`In un sistema isolato la quantità totale di energia resta costante: può cambiare forma (da potenziale a cinetica, a termica, ecc.).`},
{id:'fi_en15',t:'fi_en',l:1,q:`Come si chiama l'energia che un corpo possiede per la sua posizione in un campo gravitazionale?`,o:[`Energia potenziale gravitazionale`,`Energia cinetica`,`Energia termica`,`Energia elettrica`],a:0,e:`U = m · g · h: dipende dalla massa e dall'altezza h rispetto a un livello di riferimento.`},
{id:'fi_en16',t:'fi_en',l:1,q:`A quale combinazione di unità equivale 1 joule?`,o:[`1 N · m`,`1 N / m`,`1 kg · m/s`,`1 W · s⁻¹`],a:0,e:`Il lavoro è forza per spostamento: 1 J = 1 N · 1 m. Anche 1 J = 1 W · 1 s, ma non 1 W · s⁻¹.`},
{id:'fi_en17',t:'fi_en',l:2,q:`Qual è l'energia cinetica di un'auto di 1000 kg che viaggia a 20 m/s?`,o:[`200000 J`,`20 000 J`,`400 000 J`,`2000 J`],a:0,e:`Ec = ½ · m · v² = ½ · 1000 · 20² = 200 000 J (200 kJ).`},
{id:'fi_en18',t:'fi_en',l:2,q:`Una persona di 60 kg sale di 3 m in 6 s (g = 10 m/s²). Quale potenza sviluppa (circa)?`,o:[`300 W`,`1800 W`,`30 W`,`600 W`],a:0,e:`Il lavoro contro la gravità è m · g · h = 60 · 10 · 3 = 1800 J. P = L / t = 1800 / 6 = 300 W.`},
{id:'fi_en19',t:'fi_en',l:2,q:`Un corpo di 2 kg scende di 5 m in verticale (g = 10 m/s²). Quanto lavoro compie la forza peso?`,o:[`100 J`,`10 J`,`−100 J`,`25 J`],a:0,e:`La forza peso è concorde allo spostamento: L = m · g · h = 2 · 10 · 5 = 100 J (positivo).`},
{id:'fi_en20',t:'fi_en',l:2,q:`Una molla con costante elastica k = 200 N/m è compressa di 0,1 m. Quanta energia elastica contiene?`,o:[`1 J`,`20 J`,`10 J`,`0,5 J`],a:0,e:`U = ½ · k · x² = ½ · 200 · 0,1² = ½ · 200 · 0,01 = 1 J.`},
{id:'fi_en21',t:'fi_en',l:2,q:`Una macchina assorbe 500 J di energia e ne trasforma 350 J in lavoro utile. Qual è il suo rendimento?`,o:[`70%`,`30%`,`143%`,`35%`],a:0,e:`Rendimento = energia utile / energia assorbita = 350 / 500 = 0,7, cioè 70%. Il resto si disperde, di solito sotto forma di calore.`},
{id:'fi_en22',t:'fi_en',l:3,q:`Una palla viene lasciata cadere da 1,25 m di altezza (g = 10 m/s², senza attrito dell'aria). Con che velocità tocca terra?`,o:[`5 m/s`,`12,5 m/s`,`2,5 m/s`,`25 m/s`],a:0,e:`Per la conservazione dell'energia m·g·h = ½·m·v²: v = √(2·g·h) = √(2 · 10 · 1,25) = √25 = 5 m/s.`},
{id:'fi_en23',t:'fi_en',l:3,q:`Un carrello di 2 kg si muove a 4 m/s e sale su una rampa senza attrito (g = 10 m/s²). A quale altezza massima arriva?`,o:[`0,8 m`,`1,6 m`,`0,4 m`,`8 m`],a:0,e:`L'energia cinetica iniziale diventa potenziale: ½ · m · v² = m · g · h, quindi h = v² / (2g) = 16 / 20 = 0,8 m. La massa si semplifica.`},
{id:'fi_en24',t:'fi_en',l:3,q:`Un'auto di 1000 kg che viaggia a 20 m/s frena fino a fermarsi con una forza costante di 5000 N. Quanta strada percorre in frenata?`,o:[`40 m`,`20 m`,`4 m`,`80 m`],a:0,e:`Il lavoro della forza frenante annulla l'energia cinetica: F · s = ½ · m · v² → s = 200 000 / 5000 = 40 m.`},
{id:'fi_en25',t:'fi_en',l:3,q:`Un motore solleva un carico di 100 kg a velocità costante di 0,5 m/s (g = 10 m/s²). Quale potenza deve fornire?`,o:[`500 W`,`50 W`,`1000 W`,`5000 W`],a:0,e:`A velocità costante la forza del motore uguaglia il peso: F = m · g = 1000 N. La potenza è P = F · v = 1000 · 0,5 = 500 W.`},
{id:'fi_el13',t:'fi_el',l:1,q:`Quale unità misura la tensione elettrica nel Sistema Internazionale?`,o:[`Volt`,`Ampere`,`Ohm`,`Watt`],a:0,e:`La tensione (differenza di potenziale) si misura in volt (V). L'ampere misura la corrente, l'ohm la resistenza e il watt la potenza.`},
{id:'fi_el14',t:'fi_el',l:1,q:`Come si collega un amperometro in un circuito per misurare la corrente?`,o:[`In serie`,`In parallelo`,`Ai capi della batteria soltanto`,`Non si collega`],a:0,e:`L'amperometro deve essere attraversato dalla stessa corrente da misurare, quindi si inserisce in serie e deve avere resistenza molto piccola.`},
{id:'fi_el15',t:'fi_el',l:1,q:`Come si collega un voltmetro per misurare la tensione ai capi di un resistore?`,o:[`In parallelo`,`In serie`,`In serie con la batteria`,`Non si può collegare`],a:0,e:`Il voltmetro misura la differenza di potenziale fra due punti: si collega in parallelo al componente e ha una resistenza molto grande.`},
{id:'fi_el16',t:'fi_el',l:1,q:`Quale di questi materiali è un buon conduttore elettrico?`,o:[`Rame`,`Gomma`,`Vetro`,`Plastica`],a:0,e:`I metalli, come il rame, hanno elettroni liberi di muoversi e conducono bene. Gomma, vetro e plastica sono isolanti.`},
{id:'fi_el17',t:'fi_el',l:2,q:`In un circuito con resistori collegati in parallelo, la tensione ai capi di ciascun resistore è…`,o:[`la stessa per tutti`,`la somma delle tensioni`,`diversa in base alla resistenza`,`uguale a zero`],a:0,e:`I resistori in parallelo sono collegati agli stessi due nodi: hanno la stessa differenza di potenziale. La corrente si divide invece tra i rami.`},
{id:'fi_el18',t:'fi_el',l:2,q:`Tre resistori da 2 Ω, 3 Ω e 5 Ω sono collegati in serie. Qual è la resistenza equivalente?`,o:[`10 Ω`,`1 Ω`,`30 Ω`,`0,97 Ω`],a:0,e:`In serie le resistenze si sommano: 2 + 3 + 5 = 10 Ω.`},
{id:'fi_el19',t:'fi_el',l:2,q:`Un resistore da 10 Ω è attraversato da una corrente di 2 A. Quale potenza dissipa?`,o:[`40 W`,`20 W`,`5 W`,`14 W`],a:0,e:`P = R · I² = 10 · 2² = 40 W. In alternativa P = V · I con V = R · I = 20 V: 20 · 2 = 40 W.`},
{id:'fi_el20',t:'fi_el',l:2,q:`Un circuito è percorso da una corrente di 2 A per 5 s. Quale carica elettrica è passata?`,o:[`10 C`,`2,5 C`,`0,4 C`,`7 C`],a:0,e:`Q = I · t = 2 A · 5 s = 10 C.`},
{id:'fi_el21',t:'fi_el',l:2,q:`Che cosa accade alla resistenza di un filo conduttore se se ne raddoppia la lunghezza, mantenendo uguali la sezione e il materiale?`,o:[`Raddoppia`,`Si dimezza`,`Resta invariata`,`Diventa quattro volte più grande`],a:0,e:`Per la seconda legge di Ohm R = ρ · L / A: la resistenza è proporzionale alla lunghezza.`},
{id:'fi_el22',t:'fi_el',l:3,q:`Una batteria da 12 V alimenta due resistori da 4 Ω e 2 Ω in serie. Quanto vale la tensione ai capi del resistore da 4 Ω?`,o:[`8 V`,`12 V`,`6 V`,`4 V`],a:0,e:`La resistenza totale è 6 Ω e la corrente I = 12 / 6 = 2 A. Ai capi del resistore da 4 Ω: V = R · I = 4 · 2 = 8 V.`},
{id:'fi_el23',t:'fi_el',l:3,q:`Due resistori da 6 Ω e 3 Ω sono collegati in parallelo a una batteria da 12 V. Qual è la corrente totale erogata dalla batteria?`,o:[`6 A`,`2 A`,`4 A`,`1,3 A`],a:0,e:`1/R = 1/6 + 1/3 = 1/2, quindi R = 2 Ω. La corrente totale è I = V / R = 12 / 2 = 6 A (4 A nel ramo da 3 Ω e 2 A in quello da 6 Ω).`},
{id:'fi_el24',t:'fi_el',l:3,q:`Una stufa da 1500 W resta accesa per 2 ore. Se 1 kWh costa 0,25 €, quanto costa il suo funzionamento?`,o:[`0,75 €`,`0,38 €`,`3 €`,`1,50 €`],a:0,e:`Energia = potenza · tempo = 1,5 kW · 2 h = 3 kWh. Costo = 3 · 0,25 = 0,75 €.`},
{id:'fi_el25',t:'fi_el',l:3,q:`Se il diametro di un filo di rame viene raddoppiato, mantenendo la stessa lunghezza, la sua resistenza…`,o:[`diventa un quarto`,`raddoppia`,`si dimezza`,`diventa quattro volte più grande`],a:0,e:`L'area della sezione è proporzionale al quadrato del diametro: raddoppiando il diametro l'area diventa 4 volte più grande e, poiché R = ρ · L / A, la resistenza si riduce a un quarto.`},
{id:'ch_materia7',t:'ch_materia',l:1,q:`Quale stato della materia ha forma e volume propri?`,o:[`Solido`,`Liquido`,`Gassoso`,`Plasma freddo`],a:0,e:`Nei solidi le particelle sono molto vicine e occupano posizioni quasi fisse: per questo mantengono sia la forma sia il volume. I liquidi hanno volume proprio ma non forma, i gas non hanno né l'una né l'altro.`},
{id:'ch_materia8',t:'ch_materia',l:1,q:`Come si chiama il passaggio di stato da liquido ad aeriforme?`,o:[`Vaporizzazione`,`Condensazione`,`Fusione`,`Sublimazione`],a:0,e:`Il passaggio da liquido a gas si chiama vaporizzazione (evaporazione se avviene dalla superficie, ebollizione se in tutta la massa). Il passaggio inverso è la condensazione.`},
{id:'ch_materia9',t:'ch_materia',l:1,q:`Come si chiama il passaggio di stato da aeriforme a liquido?`,o:[`Condensazione`,`Vaporizzazione`,`Solidificazione`,`Fusione`],a:0,e:`Raffreddandosi, il vapore cede energia e le particelle si avvicinano fino a formare il liquido: è la condensazione.`},
{id:'ch_materia10',t:'ch_materia',l:1,q:`Quale di questi è un elemento?`,o:[`Ferro`,`Acqua`,`Sale da cucina (NaCl)`,`Aria`],a:0,e:`Il ferro (Fe) è formato da un solo tipo di atomi, quindi è un elemento. L'acqua e il sale sono composti, l'aria è un miscuglio.`},
{id:'ch_materia11',t:'ch_materia',l:1,q:`Quale tecnica permette di separare limatura di ferro e sabbia?`,o:[`Separazione magnetica con una calamita`,`Distillazione`,`Cromatografia`,`Evaporazione`],a:0,e:`Il ferro è attratto da una calamita e la sabbia no: si sfrutta questa differenza di proprietà fisica.`},
{id:'ch_materia12',t:'ch_materia',l:1,q:`Quale tra questi passaggi di stato richiede un assorbimento di calore dall'ambiente?`,o:[`Fusione`,`Solidificazione`,`Condensazione`,`Brinamento`],a:0,e:`La fusione richiede energia per vincere le forze che tengono unite le particelle nel solido. Solidificazione, condensazione e brinamento (da gas a solido) cedono invece calore.`},
{id:'ch_materia13',t:'ch_materia',l:2,q:`Quale tecnica si usa per separare sabbia e acqua?`,o:[`Filtrazione`,`Distillazione`,`Cristallizzazione`,`Cromatografia`],a:0,e:`La sabbia è un solido insolubile: passando il miscuglio attraverso un filtro, la sabbia resta sul filtro e l'acqua passa.`},
{id:'ch_materia14',t:'ch_materia',l:2,q:`Quale tecnica separa i componenti di un miscuglio in base alla loro diversa velocità di spostamento su un supporto, spinti da un solvente?`,o:[`Cromatografia`,`Filtrazione`,`Decantazione`,`Sublimazione`],a:0,e:`Nella cromatografia i componenti hanno affinità diversa per il supporto e per il solvente che li trascina, quindi si spostano a velocità diverse e si separano.`},
{id:'ch_materia15',t:'ch_materia',l:2,q:`Quale strumento si usa per separare olio e acqua?`,o:[`Imbuto separatore`,`Filtro di carta`,`Pallone da distillazione`,`Crogiolo`],a:0,e:`Olio e acqua sono liquidi immiscibili e formano due strati separati (miscuglio eterogeneo): con l'imbuto separatore si fa uscire prima lo strato inferiore.`},
{id:'ch_materia16',t:'ch_materia',l:2,q:`In che cosa un composto differisce da un miscuglio?`,o:[`Gli elementi sono uniti chimicamente in proporzioni fisse`,`Ha sempre un solo stato fisico`,`Si separa sempre per filtrazione`,`Contiene un solo tipo di atomi`],a:0,e:`Un composto ha formula e composizione costanti e i suoi componenti si separano solo con reazioni chimiche. Un miscuglio ha composizione variabile e i componenti si separano con metodi fisici.`},
{id:'ch_materia17',t:'ch_materia',l:2,q:`Quale di queste grandezze è una proprietà intensiva, cioè non dipende dalla quantità di materia?`,o:[`Densità`,`Massa`,`Volume`,`Peso`],a:0,e:`La densità (massa/volume) è la stessa per un grammo e per un chilo della stessa sostanza. Massa, volume e peso crescono con la quantità, quindi sono estensive.`},
{id:'ch_materia18',t:'ch_materia',l:2,q:`Come si definisce un miscuglio omogeneo?`,o:[`Ha aspetto e composizione uniformi in tutta la massa (una sola fase)`,`Ha componenti sempre visibili a occhio nudo`,`È formato da un solo elemento`,`Si può separare solo con reazioni chimiche`],a:0,e:`In un miscuglio omogeneo (soluzione) i componenti sono mescolati a livello molecolare e non si distinguono, anche al microscopio ottico.`},
{id:'ch_materia19',t:'ch_materia',l:2,q:`Quale di questi è un cambiamento chimico?`,o:[`La combustione del legno`,`La fusione del ghiaccio`,`L'evaporazione dell'acqua`,`La sublimazione della naftalina`],a:0,e:`Bruciando, il legno si trasforma in sostanze nuove (CO₂, H₂O, ceneri). Fusione, evaporazione e sublimazione sono cambiamenti di stato fisici: cambia lo stato, non la sostanza.`},
{id:'ch_materia20',t:'ch_materia',l:3,q:`Un blocco metallico ha massa 54 g e volume 20 cm³. Qual è la sua densità?`,o:[`2,7 g/cm³`,`0,37 g/cm³`,`74 g/cm³`,`1080 g/cm³`],a:0,e:`d = m / V = 54 g / 20 cm³ = 2,7 g/cm³ (è il valore dell'alluminio).`},
{id:'ch_materia21',t:'ch_materia',l:3,q:`Quanto calore serve per fondere 100 g di ghiaccio già a 0 °C, sapendo che il calore latente di fusione è 334 J/g?`,o:[`33400 J (33,4 kJ)`,`334 J`,`3,34 J`,`100 J`],a:0,e:`Durante la fusione la temperatura non cambia: Q = m · λ = 100 g · 334 J/g = 33 400 J.`},
{id:'ch_materia22',t:'ch_materia',l:3,q:`250 mL di un liquido hanno una massa di 200 g. Qual è la sua densità e come si comporta se versato nell'acqua (d = 1,0 g/mL), senza mescolarsi?`,o:[`0,8 g/mL: galleggia`,`1,25 g/mL: galleggia`,`0,8 g/mL: affonda`,`1,25 g/mL: affonda`],a:0,e:`d = 200 g / 250 mL = 0,8 g/mL. Essendo meno denso dell'acqua, il liquido galleggia (come fa l'olio).`},
{id:'ch_materia23',t:'ch_materia',l:3,q:`Perché il ghiaccio galleggia sull'acqua liquida?`,o:[`Ha densità minore dell'acqua liquida`,`Ha massa minore di quella dell'acqua`,`È formato da molecole diverse`,`Contiene aria che lo rende più leggero`],a:0,e:`Solidificando, le molecole d'acqua formano un reticolo ordinato tenuto da legami a idrogeno che le tiene più distanziate: a parità di massa il ghiaccio occupa più volume (circa il 9% in più) e ha densità minore.`},
{id:'ch_materia24',t:'ch_materia',l:3,q:`In un grafico temperatura-tempo del riscaldamento di una sostanza pura, a che cosa corrispondono i tratti orizzontali?`,o:[`Ai passaggi di stato (fusione ed ebollizione)`,`Al riscaldamento del solido`,`Alla decomposizione della sostanza`,`Alla perdita di calore verso l'ambiente`],a:0,e:`Durante un passaggio di stato il calore fornito serve a vincere le forze tra le particelle e non ad aumentare la temperatura, che resta costante: il grafico mostra un tratto orizzontale.`},
{id:'ch_materia25',t:'ch_materia',l:3,q:`Quale tecnica si usa per separare due liquidi miscibili con punti di ebollizione diversi, come acqua ed etanolo?`,o:[`Distillazione frazionata`,`Filtrazione`,`Decantazione`,`Cromatografia su carta`],a:0,e:`L'etanolo bolle a circa 78 °C e l'acqua a 100 °C: scaldando, i vapori sono più ricchi del componente più volatile e, con una colonna di frazionamento, si raccolgono separatamente.`},
{id:'ch_reaz7',t:'ch_reaz',l:1,q:`Come si chiama il numero scritto davanti a una formula in un'equazione chimica, per esempio il 2 in 2 H₂O?`,o:[`Coefficiente stechiometrico`,`Indice`,`Numero atomico`,`Numero di ossidazione`],a:0,e:`Il coefficiente indica quante molecole (o moli) della sostanza partecipano alla reazione. L'indice, scritto in basso dopo il simbolo, indica invece quanti atomi ci sono in una molecola.`},
{id:'ch_reaz8',t:'ch_reaz',l:1,q:`In una reazione chimica, che cosa sono i prodotti?`,o:[`Le sostanze che si formano`,`Le sostanze di partenza`,`Le sostanze che non cambiano`,`I catalizzatori`],a:0,e:`I reagenti stanno a sinistra della freccia e si trasformano nei prodotti, scritti a destra.`},
{id:'ch_reaz9',t:'ch_reaz',l:1,q:`Una reazione del tipo AB → A + B è una reazione di…`,o:[`decomposizione`,`sintesi`,`scambio semplice`,`combustione`],a:0,e:`Un solo composto si scinde in sostanze più semplici: è una decomposizione (o analisi). L'opposto, A + B → AB, è una sintesi.`},
{id:'ch_reaz10',t:'ch_reaz',l:1,q:`Che cosa indica il simbolo (aq) accanto a una formula in un'equazione chimica?`,o:[`Che la sostanza è in soluzione acquosa`,`Che la sostanza è un gas`,`Che la sostanza è un solido`,`Che la sostanza è un catalizzatore`],a:0,e:`(aq) deriva da «aqueous»: la sostanza è disciolta in acqua. Gli altri simboli usati sono (s) solido, (l) liquido e (g) gas.`},
{id:'ch_reaz11',t:'ch_reaz',l:1,q:`Quale di queste osservazioni indica più probabilmente una reazione chimica?`,o:[`La formazione di un precipitato mescolando due soluzioni limpide`,`La fusione di un cubetto di ghiaccio`,`L'evaporazione dell'acqua da una pozzanghera`,`La dissoluzione dello zucchero in acqua`],a:0,e:`La comparsa di un solido (precipitato) da due soluzioni limpide indica che si è formata una sostanza nuova. Gli altri esempi sono trasformazioni fisiche: cambiano stato o si mescolano, ma le sostanze restano le stesse.`},
{id:'ch_reaz12',t:'ch_reaz',l:1,q:`Che cos'è una reazione esotermica?`,o:[`Una reazione che libera calore nell'ambiente`,`Una reazione che assorbe calore`,`Una reazione che non cambia la temperatura`,`Una reazione che avviene solo in acqua`],a:0,e:`In una reazione esotermica l'energia contenuta nei prodotti è minore di quella dei reagenti e la differenza viene ceduta all'ambiente sotto forma di calore. La combustione ne è un esempio.`},
{id:'ch_reaz13',t:'ch_reaz',l:2,q:`Quali sono i coefficienti, nell'ordine, che bilanciano N₂ + H₂ → NH₃?`,o:[`1, 3, 2`,`1, 1, 1`,`2, 3, 1`,`1, 2, 3`],a:0,e:`N₂ + 3 H₂ → 2 NH₃: a sinistra ci sono 2 atomi di N e 6 di H, a destra 2 · 1 = 2 atomi di N e 2 · 3 = 6 di H.`},
{id:'ch_reaz14',t:'ch_reaz',l:2,q:`Bilanciando C₃H₈ + ? O₂ → 3 CO₂ + 4 H₂O, quale coefficiente va davanti a O₂?`,o:[`5`,`3`,`4`,`7`],a:0,e:`A destra ci sono 3 · 2 + 4 · 1 = 10 atomi di ossigeno. A sinistra O₂ ne fornisce 2 per molecola, quindi servono 10 / 2 = 5 molecole.`},
{id:'ch_reaz15',t:'ch_reaz',l:2,q:`Mescolando AgNO₃(aq) e NaCl(aq) si forma AgNO₃ + NaCl → AgCl + NaNO₃. Quale composto precipita?`,o:[`AgCl`,`NaNO₃`,`AgNO₃`,`NaCl`],a:0,e:`Il cloruro d'argento è un sale insolubile in acqua e si separa come solido bianco; i nitrati e il cloruro di sodio restano disciolti.`},
{id:'ch_reaz16',t:'ch_reaz',l:2,q:`Che tipo di reazione è Zn + 2 HCl → ZnCl₂ + H₂?`,o:[`Scambio semplice (spostamento)`,`Sintesi`,`Decomposizione`,`Neutralizzazione acido-base`],a:0,e:`Lo zinco, un elemento, prende il posto dell'idrogeno nel composto: è una reazione di scambio semplice (e anche di ossidoriduzione, perché Zn si ossida e H⁺ si riduce).`},
{id:'ch_reaz17',t:'ch_reaz',l:2,q:`Quale di queste è una reazione di combustione?`,o:[`CH₄ + 2 O₂ → CO₂ + 2 H₂O`,`CaCO₃ → CaO + CO₂`,`HCl + NaOH → NaCl + H₂O`,`N₂ + 3 H₂ → 2 NH₃`],a:0,e:`Una combustione è la reazione di un combustibile con l'ossigeno, con produzione di calore e, nel caso degli idrocarburi, di CO₂ e acqua.`},
{id:'ch_reaz18',t:'ch_reaz',l:2,q:`Che cosa fa un catalizzatore in una reazione?`,o:[`Aumenta la velocità senza essere consumato`,`Aumenta la resa all'equilibrio`,`Fornisce energia ai reagenti`,`Diventa uno dei prodotti`],a:0,e:`Il catalizzatore offre un percorso con energia di attivazione più bassa, quindi la reazione è più veloce, ma alla fine della reazione si ritrova invariato e non modifica la posizione dell'equilibrio.`},
{id:'ch_reaz19',t:'ch_reaz',l:2,q:`In una reazione di ossidoriduzione, quale specie si ossida?`,o:[`Quella che perde elettroni`,`Quella che acquista elettroni`,`Quella che acquista ossigeno ma non elettroni`,`Il catalizzatore`],a:0,e:`L'ossidazione è la perdita di elettroni (aumenta il numero di ossidazione), la riduzione è il loro acquisto. Le due semireazioni avvengono sempre insieme.`},
{id:'ch_reaz20',t:'ch_reaz',l:3,q:`Qual è il numero di ossidazione del manganese in KMnO₄?`,o:[`+7`,`+2`,`+4`,`+5`],a:0,e:`K è +1 e ognuno dei 4 atomi di O è −2, cioè −8 in totale. La molecola è neutra: +1 + x − 8 = 0, quindi x = +7.`},
{id:'ch_reaz21',t:'ch_reaz',l:3,q:`Qual è il numero di ossidazione dello zolfo in H₂SO₄?`,o:[`+6`,`+4`,`+2`,`−2`],a:0,e:`H è +1 (due atomi: +2) e O è −2 (quattro atomi: −8). La somma è zero: +2 + x − 8 = 0, quindi x = +6.`},
{id:'ch_reaz22',t:'ch_reaz',l:3,q:`Nella reazione Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂, quale specie agisce da riducente?`,o:[`CO`,`Fe₂O₃`,`Fe`,`CO₂`],a:0,e:`Il carbonio passa da +2 in CO a +4 in CO₂: si ossida e quindi riduce il ferro (da +3 a 0). La specie che si ossida è l'agente riducente.`},
{id:'ch_reaz23',t:'ch_reaz',l:3,q:`Dalla stechiometria ci si aspetta di ottenere 80 g di prodotto, ma se ne ottengono 50 g. Qual è la resa percentuale?`,o:[`62,5%`,`37,5%`,`160%`,`30%`],a:0,e:`Resa % = (quantità ottenuta / quantità teorica) · 100 = 50 / 80 · 100 = 62,5%.`},
{id:'ch_reaz24',t:'ch_reaz',l:3,q:`Quali coefficienti, nell'ordine, bilanciano Al + HCl → AlCl₃ + H₂?`,o:[`2, 6, 2, 3`,`1, 3, 1, 1`,`2, 3, 2, 3`,`1, 6, 1, 3`],a:0,e:`2 Al + 6 HCl → 2 AlCl₃ + 3 H₂. Controllo: Al 2 = 2, Cl 6 = 2 · 3, H 6 = 3 · 2.`},
{id:'ch_reaz25',t:'ch_reaz',l:3,q:`Nell'acqua il rapporto in massa tra idrogeno e ossigeno è 1 : 8. Quanti grammi di ossigeno reagiscono completamente con 3 g di idrogeno?`,o:[`24 g`,`3 g`,`6 g`,`11 g`],a:0,e:`Per la legge delle proporzioni definite, 1 g di idrogeno reagisce con 8 g di ossigeno: 3 g di idrogeno ne richiedono 3 · 8 = 24 g (e si formano 27 g di acqua).`},
{id:'ch_sol7',t:'ch_sol',l:1,q:`Che cos'è il soluto in una soluzione?`,o:[`Il componente che si scioglie, di solito presente in quantità minore`,`Il componente in cui ci si scioglie`,`Il solido che resta sul fondo`,`Il catalizzatore`],a:0,e:`In una soluzione il soluto (per esempio il sale) è disciolto nel solvente (per esempio l'acqua), che di solito è il componente più abbondante.`},
{id:'ch_sol8',t:'ch_sol',l:1,q:`Che cos'è una soluzione satura?`,o:[`Una soluzione che a quella temperatura non può sciogliere altro soluto`,`Una soluzione molto diluita`,`Una soluzione senza soluto`,`Una soluzione che bolle`],a:0,e:`Quando si è sciolta la massima quantità di soluto possibile a una certa temperatura, ogni aggiunta resta sul fondo come corpo di fondo.`},
{id:'ch_sol9',t:'ch_sol',l:1,q:`In genere, che cosa accade alla solubilità in acqua della maggior parte dei solidi aumentando la temperatura?`,o:[`Aumenta`,`Diminuisce`,`Resta uguale`,`Si annulla`],a:0,e:`Per la maggior parte dei solidi (per esempio zucchero e nitrato di potassio) la solubilità cresce con la temperatura. Per i gas, invece, diminuisce.`},
{id:'ch_sol10',t:'ch_sol',l:1,q:`Come si calcola la molarità di una soluzione?`,o:[`Moli di soluto divise per i litri di soluzione`,`Grammi di soluto divisi per i grammi di solvente`,`Moli di soluto divise per i chili di solvente`,`Litri di soluzione divisi per le moli di soluto`],a:0,e:`M = n / V, con V in litri di soluzione. Dividere per i kg di solvente dà invece la molalità.`},
{id:'ch_sol11',t:'ch_sol',l:1,q:`Quale di questi è un solvente polare?`,o:[`Acqua`,`Esano`,`Benzene`,`Tetracloruro di carbonio`],a:0,e:`L'acqua è una molecola polare e scioglie bene sostanze ioniche e polari. Esano, benzene e CCl₄ sono apolari.`},
{id:'ch_sol12',t:'ch_sol',l:1,q:`Una soluzione contiene 5 g di soluto in 100 g di soluzione. Qual è la sua concentrazione percentuale m/m?`,o:[`5%`,`0,05%`,`95%`,`20%`],a:0,e:`% m/m = (massa di soluto / massa di soluzione) · 100 = 5/100 · 100 = 5%.`},
{id:'ch_sol13',t:'ch_sol',l:2,q:`Quante moli di NaCl sono contenute in 250 mL di una soluzione 0,4 M?`,o:[`0,1 mol`,`1,6 mol`,`0,4 mol`,`0,01 mol`],a:0,e:`n = M · V = 0,4 mol/L · 0,25 L = 0,1 mol.`},
{id:'ch_sol14',t:'ch_sol',l:2,q:`Quanti grammi di NaCl (M = 58,5 g/mol) servono per preparare 500 mL di soluzione 0,1 M?`,o:[`2,93 g`,`5,85 g`,`29,25 g`,`0,29 g`],a:0,e:`n = 0,1 mol/L · 0,5 L = 0,05 mol; m = 0,05 · 58,5 = 2,925 g, cioè circa 2,93 g.`},
{id:'ch_sol15',t:'ch_sol',l:2,q:`Si sciolgono 4 g di NaOH (M = 40 g/mol) in acqua fino a ottenere 500 mL di soluzione. Qual è la molarità?`,o:[`0,2 M`,`0,1 M`,`0,8 M`,`2 M`],a:0,e:`n = 4 g / 40 g/mol = 0,1 mol. M = n / V = 0,1 mol / 0,5 L = 0,2 M.`},
{id:'ch_sol16',t:'ch_sol',l:2,q:`20 g di soluto sono disciolti in acqua fino a ottenere 500 mL di soluzione. Qual è la concentrazione % m/V (g di soluto ogni 100 mL)?`,o:[`4%`,`20%`,`25%`,`40%`],a:0,e:`% m/V = (20 g / 500 mL) · 100 = 4 g ogni 100 mL, cioè 4%.`},
{id:'ch_sol17',t:'ch_sol',l:2,q:`Perché il sale da cucina si scioglie in acqua ma non in olio?`,o:[`L'acqua è polare e circonda gli ioni, l'olio è apolare e non può farlo`,`Perché l'olio è più denso dell'acqua`,`Perché l'acqua è più calda`,`Perché il sale è apolare`],a:0,e:`Vale la regola «il simile scioglie il simile»: le molecole polari dell'acqua si dispongono attorno agli ioni Na⁺ e Cl⁻ e li stabilizzano; l'olio, apolare, non ha questa capacità.`},
{id:'ch_sol18',t:'ch_sol',l:2,q:`Quali sono le proprietà colligative di una soluzione?`,o:[`Proprietà che dipendono dal numero di particelle di soluto e non dalla loro natura`,`Proprietà che dipendono solo dal colore del soluto`,`Proprietà che dipendono solo dal solvente puro`,`Proprietà legate al pH`],a:0,e:`Abbassamento della tensione di vapore, innalzamento ebullioscopico, abbassamento crioscopico e pressione osmotica dipendono dal numero di particelle disciolte, non dal tipo di sostanza.`},
{id:'ch_sol19',t:'ch_sol',l:2,q:`20 mL di una soluzione 1 M vengono diluiti fino a un volume finale di 100 mL. Qual è la nuova molarità?`,o:[`0,2 M`,`0,02 M`,`5 M`,`0,5 M`],a:0,e:`M₁V₁ = M₂V₂, quindi M₂ = 1 · 20 / 100 = 0,2 M.`},
{id:'ch_sol20',t:'ch_sol',l:3,q:`Si sciolgono 0,5 mol di soluto in 250 g di solvente. Qual è la molalità della soluzione?`,o:[`2 mol/kg`,`0,5 mol/kg`,`0,125 mol/kg`,`1 mol/kg`],a:0,e:`La molalità è moli di soluto per kg di solvente: 0,5 mol / 0,250 kg = 2 mol/kg.`},
{id:'ch_sol21',t:'ch_sol',l:3,q:`Una soluzione 0,1 M di CaCl₂ (completamente dissociato) quante moli di ioni Cl⁻ contiene per litro?`,o:[`0,2 mol`,`0,1 mol`,`0,3 mol`,`0,05 mol`],a:0,e:`CaCl₂ → Ca²⁺ + 2 Cl⁻: ogni unità formula libera 2 ioni cloruro, quindi [Cl⁻] = 2 · 0,1 = 0,2 mol/L.`},
{id:'ch_sol22',t:'ch_sol',l:3,q:`Si mescolano 100 mL di una soluzione 0,2 M e 300 mL di una soluzione 0,4 M dello stesso soluto. Qual è la molarità finale (volumi additivi)?`,o:[`0,35 M`,`0,3 M`,`0,6 M`,`0,4 M`],a:0,e:`Moli totali: 0,2 · 0,1 + 0,4 · 0,3 = 0,02 + 0,12 = 0,14 mol. Volume totale 0,4 L: M = 0,14 / 0,4 = 0,35 M.`},
{id:'ch_sol23',t:'ch_sol',l:3,q:`Quanti mL di HCl concentrato 12 M servono per preparare 600 mL di soluzione 0,2 M?`,o:[`10 mL`,`100 mL`,`60 mL`,`1 mL`],a:0,e:`Servono 0,6 L · 0,2 mol/L = 0,12 mol di HCl. Il volume di soluzione 12 M che le contiene è 0,12 / 12 = 0,01 L = 10 mL.`},
{id:'ch_sol24',t:'ch_sol',l:3,q:`Perché d'inverno si sparge sale sulle strade ghiacciate?`,o:[`Il sale abbassa la temperatura di congelamento dell'acqua`,`Il sale riscalda il ghiaccio chimicamente`,`Il sale innalza la temperatura di fusione`,`Il sale rende l'acqua più densa`],a:0,e:`Il soluto disciolto abbassa il punto di congelamento della soluzione (abbassamento crioscopico), per questo il ghiaccio cosparso di sale fonde anche sotto 0 °C.`},
{id:'ch_sol25',t:'ch_sol',l:3,q:`Una soluzione fisiologica contiene lo 0,9% m/V di NaCl. Quanti grammi di NaCl sono disciolti in 500 mL?`,o:[`4,5 g`,`0,9 g`,`9 g`,`45 g`],a:0,e:`0,9% m/V significa 0,9 g ogni 100 mL: in 500 mL ci sono 5 · 0,9 = 4,5 g.`},
{id:'ch_neut7',t:'ch_neut',l:1,q:`Quali prodotti si ottengono dalla reazione HCl + NaOH?`,o:[`NaCl e H₂O`,`NaH e OCl`,`H₂ e NaOCl`,`Cl₂ e NaOH`],a:0,e:`È una neutralizzazione: HCl + NaOH → NaCl + H₂O. Si forma il sale cloruro di sodio e acqua.`},
{id:'ch_neut8',t:'ch_neut',l:1,q:`Come si chiama il procedimento con cui si determina la concentrazione di una soluzione facendola reagire con una soluzione a concentrazione nota?`,o:[`Titolazione`,`Distillazione`,`Filtrazione`,`Cromatografia`],a:0,e:`Nella titolazione si aggiunge gradualmente il titolante (di concentrazione nota) finché la reazione è completa, e dal volume impiegato si calcola la concentrazione incognita.`},
