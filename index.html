{id:'fi_cal_sf9',t:'fi_cal',l:4,q:`In una parete piana in regime stazionario il flusso di calore per conduzione è proporzionale alla superficie e alla differenza di temperatura tra le due facce, e inversamente proporzionale allo spessore. Se lo spessore della parete raddoppia e la differenza di temperatura tra le facce triplica, come cambia il flusso di calore (a parità di materiale e superficie)?`,o:[`Diventa 1,5 volte quello iniziale`,`Diventa 6 volte quello iniziale`,`Diventa 2/3 di quello iniziale`,`Resta invariato`],a:0,e:`Il flusso è Φ = k · S · ΔT / d. Con ΔT × 3 e d × 2 il fattore è 3 / 2 = 1,5. 6 volte moltiplica entrambi i fattori senza considerare che lo spessore è al denominatore, 2/3 inverte il rapporto e la risposta 'invariato' varrebbe solo se ΔT e d fossero moltiplicati per lo stesso fattore.`},
{id:'fi_cal_sf10',t:'fi_cal',l:4,q:`Una persona di 90 kg a riposo produce circa 100 W di potenza termica. Se per un'ora non disperdesse alcun calore, di quanto aumenterebbe la sua temperatura corporea? (calore specifico medio 4000 J/(kg · K))`,o:[`1 K`,`0,017 K`,`0,1 K`,`10 K`],a:0,e:`In 1 h = 3600 s l'energia prodotta è Q = 100 · 3600 = 3,6 × 10⁵ J. Allora ΔT = Q / (m c) = 3,6 × 10⁵ / (90 · 4000) = 1 K. 0,017 K si ottiene usando 60 s invece di 3600 s, mentre 0,1 K e 10 K derivano da errori di potenza di dieci. Per questo il corpo deve disperdere calore (sudorazione, irraggiamento, convezione).`},
];

var CONTENT={
ch_atomo:{
 sum:[`Il numero atomico **Z** è il numero di protoni; il numero di massa **A** è protoni + neutroni. Nell'atomo neutro gli elettroni sono uguali ai protoni.`,`Gli **isotopi** hanno lo stesso Z ma un diverso numero di neutroni.`,`Gli elettroni occupano gli orbitali (s, p, d, f) in ordine di energia crescente, al massimo 2 per orbitale (principio di Pauli); negli orbitali della stessa energia si dispongono prima da soli (regola di Hund).`,`Nella tavola periodica i **gruppi** (colonne) hanno lo stesso numero di elettroni di valenza; i **periodi** (righe) corrispondono al livello energetico più esterno.`,`Lungo un periodo (verso destra) aumentano elettronegatività ed energia di ionizzazione e diminuisce il raggio. Lungo un gruppo (verso il basso) il raggio aumenta e l'elettronegatività diminuisce.`],
 ex:[{t:`Il sodio`,d:`Na: Z = 11, A = 23, quindi 11 protoni, 12 neutroni, 11 elettroni. Perdendo un elettrone diventa Na⁺ con la configurazione del neon.`},{t:`Il cloro`,d:`Cl (Z = 17): 1s² 2s² 2p⁶ 3s² 3p⁵. Acquistando un elettrone diventa Cl⁻ con 1s² 2s² 2p⁶ 3s² 3p⁶, come l'argon.`}],
 map:{centro:`Atomo`,rami:[{t:`Nucleo`,figli:[`Protoni (Z)`,`Neutroni`]},{t:`Elettroni`,figli:[`Orbitali s, p, d, f`,`Configurazione elettronica`]},{t:`Isotopi`,figli:[`Stesso Z`,`Diverso A`]},{t:`Tavola periodica`,figli:[`Gruppi: elettroni di valenza`,`Periodi: livelli energetici`]}]}},
ch_legami:{
 sum:[`**Legame ionico**: trasferimento di elettroni tra un metallo e un non metallo (grande differenza di elettronegatività), per esempio NaCl.`,`**Legame covalente**: condivisione di coppie di elettroni. È polare se gli atomi hanno elettronegatività diversa (H–O) e apolare se è uguale (H–H).`,`La forma delle molecole si prevede con il modello **VSEPR**: le coppie di elettroni (di legame e solitarie) si respingono e si dispongono il più lontano possibile.`,`Forze intermolecolari: dispersione di London, dipolo-dipolo, **legame a idrogeno** (H legato a F, O o N). Più sono forti, più alto è il punto di ebollizione.`],
 ex:[{t:`L'acqua`,d:`L'ossigeno è molto elettronegativo, quindi la molecola è polare e angolare (due coppie solitarie). Tra le molecole si formano legami a idrogeno: per questo l'acqua bolle a 100 °C mentre H₂S è un gas a temperatura ambiente.`},{t:`L'ammoniaca`,d:`NH₃ ha 3 coppie di legame e 1 solitaria: geometria piramidale trigonale, con angoli di circa 107°.`}],
 map:{centro:`Legami chimici`,rami:[{t:`Ionico`,figli:[`Metallo + non metallo`,`Reticolo cristallino`]},{t:`Covalente`,figli:[`Coppie condivise`,`Polare o apolare`]},{t:`Forma (VSEPR)`,figli:[`Coppie solitarie`,`Geometria molecolare`]},{t:`Forze intermolecolari`,figli:[`Legame a idrogeno`,`Dispersione di London`]}]}},
ch_mole:{
 sum:[`La **mole** è la quantità di sostanza che contiene 6,022 × 10²³ entità (numero di Avogadro).`,`La massa molare M (g/mol) coincide numericamente con la massa atomica o molecolare. Si usa **n = m / M**.`,`In una reazione bilanciata i coefficienti indicano i rapporti tra le **moli**, non tra i grammi.`,`Il **reagente limitante** è quello che si esaurisce per primo e decide quanto prodotto si forma.`,`Molarità: **M = n / V** (mol/L). Nelle diluizioni vale M₁V₁ = M₂V₂.`],
 ex:[{t:`Dai grammi alle molecole`,d:`18 g di H₂O = 1 mol (M = 18 g/mol) = 6,022 × 10²³ molecole.`},{t:`Reagente limitante`,d:`2 H₂ + O₂ → 2 H₂O con 4 mol di H₂ e 1 mol di O₂. Per usare tutto l'H₂ servirebbero 2 mol di O₂, ma ce n'è 1: O₂ è limitante e si formano 2 mol di H₂O.`}],
 map:{centro:`Mole e stechiometria`,rami:[{t:`Mole`,figli:[`Numero di Avogadro`,`n = m / M`]},{t:`Reazioni`,figli:[`Bilanciamento`,`Rapporti molari`]},{t:`Reagente limitante`,figli:[`Si esaurisce per primo`,`Determina la resa`]},{t:`Concentrazione`,figli:[`Molarità = n / V`,`Diluizione: M₁V₁ = M₂V₂`]}]}},
ch_ph:{
 sum:[`**pH = −log[H⁺]** e pOH = −log[OH⁻]. A 25 °C, pH + pOH = 14.`,`pH < 7 acido, = 7 neutro, > 7 basico. Ogni unità di pH corrisponde a un fattore 10 nella concentrazione di H⁺.`,`Acidi e basi **forti** si dissociano completamente: per un acido forte monoprotico [H⁺] è uguale alla sua concentrazione.`,`Acidi e basi **deboli** si dissociano solo in parte (costanti Ka e Kb).`,`Un **tampone** contiene un acido debole e la sua base coniugata (o viceversa) e resiste alle variazioni di pH.`],
 ex:[{t:`HCl 0,01 M`,d:`Acido forte: [H⁺] = 10⁻² M, quindi pH = 2.`},{t:`NaOH 0,001 M`,d:`Base forte: [OH⁻] = 10⁻³ M, pOH = 3, quindi pH = 11.`},{t:`Il sangue`,d:`Ha un pH di circa 7,4, mantenuto dal tampone acido carbonico / bicarbonato.`}],
 map:{centro:`Acidi e basi`,rami:[{t:`pH`,figli:[`pH = −log[H⁺]`,`pH + pOH = 14`]},{t:`Forti`,figli:[`Dissociazione completa`,`HCl, NaOH`]},{t:`Deboli`,figli:[`Dissociazione parziale`,`Ka e Kb`]},{t:`Tamponi`,figli:[`Acido debole + base coniugata`,`Limitano le variazioni di pH`]}]},
 extra:'ph'},
bi_cell:{
 sum:[`Le cellule **procariote** non hanno un nucleo delimitato da membrana; le **eucariote** hanno il nucleo e gli organuli.`,`**Mitocondri**: respirazione aerobica e produzione di ATP. **Ribosomi**: sintesi delle proteine.`,`Il reticolo endoplasmatico **rugoso** (con ribosomi) produce proteine da secernere o di membrana; il **liscio** si occupa di lipidi e detossificazione. Il **Golgi** modifica, smista e impacchetta.`,`I **lisosomi** digeriscono materiali all'interno della cellula. I **cloroplasti** (solo piante e alghe) svolgono la fotosintesi.`,`La **parete cellulare** è presente in piante, funghi e batteri, ma non nelle cellule animali.`],
 ex:[{t:`L'insulina`,d:`È sintetizzata dai ribosomi del reticolo rugoso delle cellule β del pancreas, modificata nel Golgi e secreta in vescicole.`},{t:`La cellula muscolare`,d:`Ha moltissimi mitocondri perché consuma molto ATP.`}],
 map:{centro:`Cellula eucariote`,rami:[{t:`Nucleo`,figli:[`DNA`,`Nucleolo: rRNA`]},{t:`Energia`,figli:[`Mitocondri: ATP`,`Cloroplasti (piante)`]},{t:`Sintesi e trasporto`,figli:[`Ribosomi`,`Reticolo, Golgi, vescicole`]},{t:`Rivestimenti`,figli:[`Membrana plasmatica`,`Parete cellulare (piante)`]}]}},
bi_memb:{
 sum:[`La membrana plasmatica è un **doppio strato di fosfolipidi**: teste idrofile all'esterno, code idrofobiche all'interno, con proteine e colesterolo (modello a mosaico fluido).`,`**Trasporto passivo** (senza ATP, secondo gradiente): diffusione semplice, diffusione facilitata, osmosi.`,`**Trasporto attivo** (con ATP, contro gradiente): per esempio la pompa Na⁺/K⁺.`,`**Osmosi**: l'acqua attraversa una membrana semipermeabile verso la soluzione più ricca di soluti.`,`Una cellula animale in soluzione **ipotonica** si gonfia (può lisarsi), in soluzione **ipertonica** si raggrinzisce, in soluzione **isotonica** resta stabile.`],
 ex:[{t:`La pompa Na⁺/K⁺`,d:`Per ogni ATP idrolizzato porta 3 Na⁺ fuori e 2 K⁺ dentro: crea il gradiente necessario ai neuroni.`},{t:`Globuli rossi in acqua distillata`,d:`L'acqua entra per osmosi, i globuli rossi si gonfiano e si rompono (emolisi).`}],
 map:{centro:`Membrana plasmatica`,rami:[{t:`Struttura`,figli:[`Doppio strato fosfolipidico`,`Proteine e colesterolo`]},{t:`Trasporto passivo`,figli:[`Diffusione semplice e facilitata`,`Osmosi`]},{t:`Trasporto attivo`,figli:[`Richiede ATP`,`Pompa Na⁺/K⁺`]},{t:`Tonicità`,figli:[`Ipotonica: la cellula si gonfia`,`Ipertonica: si raggrinzisce`]}]}},
bi_dna:{
 sum:[`Il DNA è una doppia elica antiparallela con appaiamenti **A–T** e **G–C** (nell'RNA A–U); lo zucchero è il desossiribosio.`,`**Replicazione semiconservativa**: ogni nuova doppia elica ha un filamento vecchio e uno nuovo. La DNA polimerasi lavora in direzione 5'→3'.`,`**Trascrizione** (nel nucleo): DNA → mRNA, a opera dell'RNA polimerasi. L'mRNA è complementare e antiparallelo allo stampo.`,`**Traduzione** (ribosomi): mRNA → proteina. Ogni codone (3 basi) specifica un amminoacido, portato dal tRNA. **AUG** è il codone di inizio.`,`Il codice genetico è **degenerato** (più codoni per lo stesso amminoacido) ma non ambiguo.`],
 ex:[{t:`Dallo stampo all'mRNA`,d:`Stampo 3'-TACGGA-5' → mRNA 5'-AUGCCU-3'.`},{t:`Mutazioni puntiformi`,d:`Cambiare una base può modificare un amminoacido (missenso), creare un codone di stop (non senso) o non cambiare nulla (silente).`}],
 map:{centro:`Dal DNA alla proteina`,rami:[{t:`Replicazione`,figli:[`DNA → DNA`,`Semiconservativa`]},{t:`Trascrizione`,figli:[`DNA → mRNA`,`Nel nucleo`]},{t:`Traduzione`,figli:[`mRNA → proteina`,`Ribosomi e tRNA`]},{t:`Codice genetico`,figli:[`Codoni di 3 basi`,`AUG = inizio`]}]}},
bi_gen:{
 sum:[`L'allele **dominante** si manifesta anche in eterozigosi; quello **recessivo** solo in omozigosi.`,`**Genotipo** = costituzione allelica (AA, Aa, aa). **Fenotipo** = carattere osservabile.`,`**Prima legge di Mendel** (segregazione): i due alleli di un gene si separano nei gameti.`,`**Seconda legge** (assortimento indipendente): geni su cromosomi diversi si trasmettono in modo indipendente.`,`Aa × Aa dà 1 AA : 2 Aa : 1 aa (genotipi), cioè 3 dominanti : 1 recessivo (fenotipi).`],
 ex:[{t:`Portatori sani`,d:`Due genitori sani Aa per una malattia recessiva: 1/4 dei figli è malato (aa). Tra i figli sani, 1/3 è AA e 2/3 è portatore Aa.`},{t:`Reincrocio`,d:`Aa × aa dà metà figli Aa e metà aa: rapporto 1 : 1.`}],
 map:{centro:`Genetica mendeliana`,rami:[{t:`Alleli`,figli:[`Dominante e recessivo`,`Omozigote ed eterozigote`]},{t:`Leggi di Mendel`,figli:[`Segregazione`,`Assortimento indipendente`]},{t:`Quadrato di Punnett`,figli:[`Aa × Aa = 3 : 1`,`Aa × aa = 1 : 1`]},{t:`Malattie recessive`,figli:[`Portatori sani`,`Rischio 1/4`]}]},
 extra:'punnett'},
fi_cin:{
 sum:[`**Moto rettilineo uniforme**: velocità costante, s = v · t.`,`**Moto uniformemente accelerato**: v = v₀ + a · t e s = s₀ + v₀ · t + ½ · a · t².`,`Nel grafico velocità–tempo la **pendenza** è l'accelerazione e l'**area** sotto la curva è lo spazio percorso.`,`**Caduta libera**: accelerazione g ≈ 9,8 m/s² (spesso approssimata a 10) verso il basso, indipendente dalla massa se si trascura l'aria.`,`Attenzione alle unità: 1 m/s = 3,6 km/h.`],
 ex:[{t:`Da fermo con a = 2 m/s²`,d:`Dopo 5 s: v = 2 · 5 = 10 m/s e spazio = ½ · 2 · 5² = 25 m.`},{t:`Caduta da 20 m`,d:`t = √(2h/g) = √(2 · 20 / 10) = 2 s. La velocità finale è v = g · t = 20 m/s.`}],
 map:{centro:`Cinematica`,rami:[{t:`Moto uniforme`,figli:[`v costante`,`s = v · t`]},{t:`Moto accelerato`,figli:[`v = v₀ + a · t`,`s = ½ · a · t² (da fermo)`]},{t:`Grafici`,figli:[`Pendenza di v(t) = a`,`Area sotto v(t) = spazio`]},{t:`Caduta libera`,figli:[`a = g ≈ 9,8 m/s²`,`Indipendente dalla massa`]}]},
 extra:'vt'},
fi_din:{
 sum:[`**Primo principio** (inerzia): se la risultante delle forze è nulla, il corpo resta fermo o in moto rettilineo uniforme.`,`**Secondo principio**: **F = m · a**, dove F è la risultante (somma vettoriale) di tutte le forze.`,`**Terzo principio**: a ogni azione corrisponde una reazione uguale e contraria, applicata a un corpo diverso.`,`Forza peso: **P = m · g**. Massa (kg) e peso (N) sono grandezze diverse.`,`Piano inclinato senza attrito: l'accelerazione lungo il piano è **a = g · sin θ**.`],
 ex:[{t:`F = m · a`,d:`Una forza di 10 N su una massa di 2 kg produce a = 5 m/s².`},{t:`Piano inclinato di 30°`,d:`a = g · sin 30° = g/2 ≈ 5 m/s², qualunque sia la massa.`}],
 map:{centro:`Dinamica`,rami:[{t:`1° principio`,figli:[`Inerzia`,`Risultante nulla`]},{t:`2° principio`,figli:[`F = m · a`,`Somma vettoriale`]},{t:`3° principio`,figli:[`Azione e reazione`,`Su corpi diversi`]},{t:`Peso e piano inclinato`,figli:[`P = m · g`,`a = g · sin θ`]}]}},
fi_en:{
 sum:[`**Lavoro**: L = F · s · cos θ (joule). **Potenza**: P = L / t (watt).`,`**Energia cinetica**: Ec = ½ · m · v². **Energia potenziale gravitazionale**: U = m · g · h.`,`**Teorema lavoro–energia**: il lavoro della forza risultante è uguale alla variazione di energia cinetica.`,`**Conservazione dell'energia meccanica**: senza attriti, Ec + U resta costante.`,`Con l'attrito l'energia meccanica diminuisce: la differenza diventa calore.`],
 ex:[{t:`Caduta da 5 m`,d:`m · g · h = ½ · m · v², quindi v = √(2 · 10 · 5) = 10 m/s. La massa si semplifica.`},{t:`Energia cinetica`,d:`Per 2 kg a 3 m/s: ½ · 2 · 3² = 9 J.`}],
 map:{centro:`Lavoro ed energia`,rami:[{t:`Lavoro e potenza`,figli:[`L = F · s · cos θ`,`P = L / t`]},{t:`Energia cinetica`,figli:[`½ · m · v²`,`Teorema lavoro–energia`]},{t:`Energia potenziale`,figli:[`m · g · h`,`Dipende dalla quota`]},{t:`Conservazione`,figli:[`Ec + U = costante`,`Con attrito: calore`]}]}},
fi_el:{
 sum:[`**Corrente** I (ampere), **tensione** V (volt), **resistenza** R (ohm).`,`**Legge di Ohm**: V = R · I.`,`**Serie**: stessa corrente, R = R₁ + R₂; le tensioni si sommano.`,`**Parallelo**: stessa tensione, 1/R = 1/R₁ + 1/R₂; le correnti si sommano.`,`**Potenza** elettrica: P = V · I = R · I². L'energia è P · t.`],
 ex:[{t:`Resistori in serie`,d:`10 Ω + 10 Ω = 20 Ω. Con 20 V la corrente è 1 A.`},{t:`Resistori in parallelo`,d:`Due resistori da 10 Ω in parallelo valgono 5 Ω. Con 10 V la corrente totale è 2 A.`}],
 map:{centro:`Circuiti elettrici`,rami:[{t:`Legge di Ohm`,figli:[`V = R · I`,`Unità: V, A, Ω`]},{t:`Serie`,figli:[`Stessa corrente`,`R = R₁ + R₂`]},{t:`Parallelo`,figli:[`Stessa tensione`,`1/R = 1/R₁ + 1/R₂`]},{t:`Potenza`,figli:[`P = V · I`,`Effetto Joule: calore`]}]}},
ch_materia:{
 sum:[`La materia è tutto ciò che ha massa e occupa spazio. Gli stati di aggregazione sono **solido**, **liquido** e **aeriforme**.`,`**Solido**: forma e volume propri. **Liquido**: volume proprio ma forma del recipiente. **Aeriforme**: né forma né volume propri.`,`Passaggi di stato: fusione (solido → liquido), solidificazione, evaporazione ed ebollizione (liquido → aeriforme), condensazione, sublimazione (solido → aeriforme). Durante un passaggio di stato la temperatura resta costante.`,`Una **sostanza pura** ha composizione definita (un elemento o un composto). Un **miscuglio** contiene più sostanze: **omogeneo** se ha una sola fase (acqua e sale sciolto), **eterogeneo** se si vedono più fasi (acqua e sabbia).`,`I miscugli si separano con metodi fisici: filtrazione, decantazione, distillazione, cromatografia. I composti si scindono nei loro elementi solo con reazioni chimiche.`],
 ex:[{t:`Acqua salata`,d:`È un miscuglio omogeneo. Con la distillazione l'acqua evapora e poi si condensa, mentre il sale resta nel recipiente.`},{t:`Ghiaccio che fonde`,d:`A pressione atmosferica, finché c'è ghiaccio la temperatura resta 0 °C: il calore assorbito serve per la fusione, non per scaldare.`}],
 map:{centro:`Materia`,rami:[{t:`Stati`,figli:[`Solido, liquido, aeriforme`,`Passaggi di stato`]},{t:`Sostanze pure`,figli:[`Elementi`,`Composti`]},{t:`Miscugli`,figli:[`Omogenei`,`Eterogenei`]},{t:`Separazione`,figli:[`Filtrazione, decantazione`,`Distillazione`]}]}},
ch_reaz:{
 sum:[`In una reazione chimica i **reagenti** si trasformano in **prodotti**: gli atomi si riarrangiano ma non si creano né si distruggono (**conservazione della massa**).`,`**Bilanciare** vuol dire scegliere i **coefficienti stechiometrici** in modo che ogni elemento abbia lo stesso numero di atomi a sinistra e a destra. Non si cambiano mai i pedici delle formule.`,`Tipi principali: **sintesi** (A + B → AB), **decomposizione** (AB → A + B), **scambio semplice**, **doppio scambio**, **combustione** (con O₂; per gli idrocarburi dà CO₂ e H₂O).`,`I coefficienti indicano rapporti in **moli**: 2 H₂ + O₂ → 2 H₂O vuol dire 2 mol di H₂ per 1 mol di O₂ per 2 mol di H₂O.`,`Il **reagente limitante** si esaurisce per primo e decide quanto prodotto si ottiene. La **resa** percentuale è (quantità ottenuta / quantità teorica) · 100.`],
 ex:[{t:`Combustione del metano`,d:`CH₄ + 2 O₂ → CO₂ + 2 H₂O. A sinistra e a destra ci sono 1 C, 4 H e 4 O: l'equazione è bilanciata.`},{t:`Resa`,d:`Se la quantità teorica è 20 g e ne ottieni 15 g, la resa è 15 / 20 · 100 = 75%.`}],
 map:{centro:`Reazioni chimiche`,rami:[{t:`Reagenti e prodotti`,figli:[`Conservazione della massa`,`Equazione chimica`]},{t:`Bilanciamento`,figli:[`Coefficienti stechiometrici`,`Non cambiare i pedici`]},{t:`Tipi`,figli:[`Sintesi e decomposizione`,`Scambio e combustione`]},{t:`Quantità`,figli:[`Rapporti in moli`,`Reagente limitante e resa`]}]}},
ch_sol:{
 sum:[`Una soluzione è formata da **soluto** (in quantità minore) e **solvente** (in quantità maggiore).`,`**Molarità**: M = n / V (mol/L). Per ottenere la massa di soluto: m = M · V · massa molare.`,`**Concentrazione percentuale**: % m/m = (massa di soluto / massa di soluzione) · 100; % m/V = grammi di soluto ogni 100 mL di soluzione.`,`**Diluizione**: aggiungendo solvente le moli di soluto non cambiano, quindi **M₁ · V₁ = M₂ · V₂**.`,`Una soluzione è **satura** quando ha sciolto il massimo di soluto a quella temperatura. In genere la solubilità dei solidi cresce con la temperatura, quella dei gas diminuisce.`],
 ex:[{t:`Preparare una soluzione`,d:`0,5 L di NaCl 0,2 M (M = 58,5 g/mol): n = 0,2 · 0,5 = 0,1 mol, quindi m = 0,1 · 58,5 = 5,85 g.`},{t:`Diluizione`,d:`Da 20 mL di soluzione 0,5 M a 0,1 M: V₂ = 0,5 · 20 / 0,1 = 100 mL, cioè si aggiungono 80 mL di solvente.`}],
 map:{centro:`Soluzioni`,rami:[{t:`Componenti`,figli:[`Soluto`,`Solvente`]},{t:`Concentrazione`,figli:[`Molarità n / V`,`Percentuale m/m e m/V`]},{t:`Diluizione`,figli:[`M₁V₁ = M₂V₂`,`Le moli non cambiano`]},{t:`Solubilità`,figli:[`Soluzione satura`,`Dipende dalla temperatura`]}]}},
ch_neut:{
 sum:[`La **neutralizzazione** è la reazione tra un acido e una base che produce un **sale** e acqua: HCl + NaOH → NaCl + H₂O.`,`Alla base c'è la reazione H⁺ + OH⁻ → H₂O. Al **punto di equivalenza** le moli di H⁺ e di OH⁻ sono uguali.`,`Per un acido con un solo H⁺ e una base con un solo OH⁻: **M(acido) · V(acido) = M(base) · V(base)**. Con H₂SO₄ o Ca(OH)₂ bisogna moltiplicare per il numero di H⁺ o di OH⁻ liberati.`,`Il pH al punto di equivalenza dipende dalla forza: acido forte + base forte dà pH 7; acido debole + base forte dà pH > 7; acido forte + base debole dà pH < 7.`,`La **titolazione** determina una concentrazione incognita aggiungendo goccia a goccia una soluzione di concentrazione nota, con un indicatore che cambia colore.`],
 ex:[{t:`Titolazione`,d:`20 mL di HCl sono neutralizzati da 25 mL di NaOH 0,1 M: n(NaOH) = 0,0025 mol = n(HCl), quindi M(HCl) = 0,0025 / 0,020 = 0,125 M.`},{t:`Acido diprotico`,d:`10 mL di H₂SO₄ 0,1 M contengono 0,002 mol di H⁺: servono 20 mL di NaOH 0,1 M.`}],
 map:{centro:`Neutralizzazione`,rami:[{t:`Reazione`,figli:[`Acido + base`,`Sale + acqua`]},{t:`Equivalenza`,figli:[`mol H⁺ = mol OH⁻`,`Ma · Va = Mb · Vb`]},{t:`pH finale`,figli:[`Forte + forte: 7`,`Con un debole: diverso da 7`]},{t:`Titolazione`,figli:[`Soluzione di concentrazione nota`,`Indicatore di colore`]}]}},
ch_org:{
 sum:[`La chimica organica studia i composti del **carbonio**, che forma 4 legami e può concatenarsi in catene e anelli.`,`**Idrocarburi**: solo C e H. **Alcani** (legami singoli, CₙH₂ₙ₊₂, per esempio il metano CH₄), **alcheni** (almeno un doppio legame, CₙH₂ₙ), **alchini** (triplo legame), **aromatici** (con l'anello del benzene).`,`**Gruppi funzionali**: alcoli (–OH), aldeidi (–CHO), chetoni (C=O dentro la catena), acidi carbossilici (–COOH), ammine (–NH₂), eteri (–O–), esteri (–COO–), ammidi (–CONH–).`,`**Isomeri**: composti con la stessa formula molecolare ma struttura diversa (per esempio butano e 2-metilpropano, entrambi C₄H₁₀).`,`Il gruppo funzionale determina le proprietà: l'–OH forma legami a idrogeno (punti di ebollizione più alti), il –COOH è acido, l'–NH₂ è basico.`],
 ex:[{t:`Un alcol`,d:`CH₃CH₂OH è l'etanolo: una catena di 2 atomi di carbonio con un gruppo –OH.`},{t:`Isomeri`,d:`C₄H₁₀ può essere butano (catena lineare) oppure 2-metilpropano (catena ramificata): stessa formula, proprietà diverse.`}],
 map:{centro:`Chimica organica`,rami:[{t:`Idrocarburi`,figli:[`Alcani, alcheni, alchini`,`Aromatici`]},{t:`Gruppi funzionali`,figli:[`–OH, –CHO, C=O`,`–COOH, –NH₂, esteri`]},{t:`Isomeria`,figli:[`Stessa formula`,`Struttura diversa`]},{t:`Proprietà`,figli:[`Legami a idrogeno`,`Acidità e basicità`]}]}},
bi_ciclo:{
 sum:[`Il **ciclo cellulare** comprende l'**interfase** (G1, S, G2) e la **divisione** (mitosi e citodieresi). Nella fase S il DNA viene replicato.`,`**Mitosi**: da una cellula madre nascono 2 cellule figlie identiche, con lo stesso numero di cromosomi. Fasi: profase, metafase, anafase, telofase.`,`**Meiosi**: due divisioni consecutive che da una cellula diploide (2n) producono 4 cellule **aploidi** (n), cioè i gameti. Avviene solo nelle cellule germinali.`,`Nella meiosi I si separano i cromosomi omologhi e avviene il **crossing-over**, lo scambio di tratti tra omologhi che crea variabilità genetica. Nella meiosi II si separano le cromatidi fratelle.`,`Il ciclo è controllato da punti di controllo. Se non funzionano, le cellule possono dividersi in modo incontrollato, come nei tumori.`],
 ex:[{t:`Numero di cromosomi`,d:`Nell'uomo 2n = 46. Dopo la mitosi ogni cellula figlia ha 46 cromosomi, dopo la meiosi ogni gamete ne ha 23.`},{t:`Le fasi della mitosi`,d:`In metafase i cromosomi si allineano all'equatore della cellula; in anafase le cromatidi fratelle si separano e migrano ai poli opposti.`}],
 map:{centro:`Ciclo cellulare`,rami:[{t:`Interfase`,figli:[`G1, S, G2`,`Replicazione del DNA in S`]},{t:`Mitosi`,figli:[`2 cellule identiche`,`Profase, metafase, anafase, telofase`]},{t:`Meiosi`,figli:[`4 cellule aploidi`,`Crossing-over`]},{t:`Controllo`,figli:[`Punti di controllo`,`Tumori se falliscono`]}]}},
bi_biomol:{
 sum:[`Le quattro grandi classi di biomolecole sono **carboidrati**, **lipidi**, **proteine** e **acidi nucleici**.`,`**Carboidrati**: monosaccaridi (glucosio, fruttosio), disaccaridi (saccarosio, lattosio), polisaccaridi (amido, glicogeno, cellulosa). Hanno funzione energetica e strutturale.`,`**Lipidi**: trigliceridi (riserva di energia), fosfolipidi (membrane), steroidi (colesterolo, ormoni). Sono poco solubili in acqua, cioè idrofobici.`,`**Proteine**: polimeri di amminoacidi uniti da legami peptidici. **Acidi nucleici**: DNA e RNA, polimeri di nucleotidi.`,`I polimeri si formano per **condensazione** (si libera una molecola d'acqua) e si scindono per **idrolisi** (si consuma acqua).`],
 ex:[{t:`Condensazione`,d:`Due molecole di glucosio si uniscono formando maltosio e liberando una molecola di acqua.`},{t:`Riserve di glucosio`,d:`Gli animali lo accumulano come glicogeno (fegato e muscoli), le piante come amido. La cellulosa invece è strutturale e forma la parete cellulare vegetale.`}],
 map:{centro:`Biomolecole`,rami:[{t:`Carboidrati`,figli:[`Glucosio, saccarosio`,`Amido, glicogeno, cellulosa`]},{t:`Lipidi`,figli:[`Trigliceridi`,`Fosfolipidi, steroidi`]},{t:`Proteine`,figli:[`Amminoacidi`,`Legame peptidico`]},{t:`Acidi nucleici`,figli:[`DNA e RNA`,`Nucleotidi`]}]}},
bi_prot:{
 sum:[`Le proteine sono formate da **20 amminoacidi** diversi uniti da legami peptidici. L'ordine degli amminoacidi è la **struttura primaria**.`,`**Struttura secondaria**: α-elica e foglietto β, stabilizzati da legami a idrogeno. **Terziaria**: ripiegamento tridimensionale della catena. **Quaternaria**: unione di più catene (per esempio l'emoglobina).`,`La forma tridimensionale determina la funzione. La **denaturazione** (calore, pH estremi) distrugge la forma e quindi la funzione.`,`Gli **enzimi** sono catalizzatori biologici (quasi tutti proteine): abbassano l'energia di attivazione e accelerano la reazione senza consumarsi. Sono **specifici** per il proprio substrato, che si lega al sito attivo.`,`L'attività di un enzima dipende da temperatura, pH e concentrazione del substrato. Un **inibitore** ne riduce l'attività.`],
 ex:[{t:`Amilasi`,d:`Scinde l'amido in zuccheri più semplici. Nella saliva funziona al meglio a pH vicino alla neutralità.`},{t:`Denaturazione`,d:`Quando si cuoce un uovo l'albume coagula: il calore fa perdere alle proteine la forma nativa.`}],
 map:{centro:`Proteine ed enzimi`,rami:[{t:`Struttura`,figli:[`Primaria: sequenza`,`Terziaria e quaternaria: forma 3D`]},{t:`Funzioni`,figli:[`Strutturali e di trasporto`,`Enzimi e anticorpi`]},{t:`Enzimi`,figli:[`Abbassano l'energia di attivazione`,`Specifici per il substrato`]},{t:`Fattori`,figli:[`Temperatura e pH`,`Denaturazione`]}]}},
bi_metab:{
 sum:[`Il **metabolismo** è l'insieme delle reazioni della cellula: l'**anabolismo** costruisce molecole complesse e richiede energia, il **catabolismo** le demolisce e libera energia.`,`La moneta energetica della cellula è l'**ATP**: l'idrolisi ATP → ADP + Pi libera energia utilizzabile.`,`**Respirazione cellulare**: glucosio + O₂ → CO₂ + H₂O + ATP. Tappe: **glicolisi** (citoplasma, 2 ATP netti), **ciclo di Krebs** (matrice mitocondriale), **fosforilazione ossidativa** (membrana mitocondriale interna, la maggior parte dell'ATP: circa 30-32 per glucosio).`,`Senza ossigeno si ha la **fermentazione** (lattica o alcolica): rigenera NAD⁺ ma rende solo i 2 ATP della glicolisi.`,`**Fotosintesi**: CO₂ + H₂O + luce → glucosio + O₂. La fase luminosa avviene nei tilacoidi, il ciclo di Calvin nello stroma del cloroplasto.`],
 ex:[{t:`Bilancio energetico`,d:`La glicolisi rende 2 ATP netti per glucosio; con l'ossigeno, tra Krebs e fosforilazione ossidativa, si arriva a circa 30-32 ATP in tutto.`},{t:`Fermentazione lattica`,d:`Nei muscoli sotto sforzo intenso, quando manca ossigeno, il piruvato diventa lattato e la glicolisi può continuare.`}],
 map:{centro:`Metabolismo`,rami:[{t:`Anabolismo e catabolismo`,figli:[`Anabolismo: costruisce`,`Catabolismo: demolisce`]},{t:`ATP`,figli:[`Moneta energetica`,`ATP → ADP + Pi`]},{t:`Respirazione`,figli:[`Glicolisi e Krebs`,`Fosforilazione ossidativa`]},{t:`Senza O₂ e nelle piante`,figli:[`Fermentazione`,`Fotosintesi`]}]}},
bi_gapp:{
 sum:[`**Dominanza incompleta**: l'eterozigote ha un fenotipo intermedio (fiori rosa da rosso × bianco). **Codominanza**: l'eterozigote mostra entrambi i caratteri (gruppo sanguigno AB).`,`**Gruppi sanguigni ABO**: gli alleli Iᴬ e Iᴮ sono codominanti, i è recessivo. Fenotipi: A, B, AB e 0 (genotipo ii). Il fattore Rh (+ dominante su −) è indipendente.`,`**Eredità legata al sesso**: geni sul cromosoma X. I maschi (XY) hanno una sola copia, quindi le malattie recessive legate a X (daltonismo, emofilia) colpiscono più spesso i maschi.`,`**Alberi genealogici**: aiutano a capire il tipo di trasmissione. Una malattia presente in un figlio di due genitori sani è tipicamente **autosomica recessiva**.`,`**Assortimento indipendente**: geni su cromosomi diversi si trasmettono indipendentemente. In AaBb × AaBb il rapporto fenotipico è 9 : 3 : 3 : 1. Il **testcross** con un omozigote recessivo rivela il genotipo.`],
 ex:[{t:`Gruppi sanguigni`,d:`Genitori A (Iᴬi) e B (Iᴮi) possono avere figli di gruppo A, B, AB o 0, ciascuno con probabilità 1/4.`},{t:`Diibrido`,d:`AaBb × AaBb: la probabilità di un figlio aabb è 1/4 · 1/4 = 1/16.`}],
 map:{centro:`Genetica applicata`,rami:[{t:`Oltre Mendel`,figli:[`Dominanza incompleta`,`Codominanza`]},{t:`Gruppi sanguigni`,figli:[`Alleli Iᴬ, Iᴮ, i`,`Fattore Rh`]},{t:`Legata al sesso`,figli:[`Geni sul cromosoma X`,`Più frequente nei maschi`]},{t:`Strumenti`,figli:[`Alberi genealogici`,`Testcross`]}]}},
fi_gran:{

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function rich(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function topicOf(id){return TOPICS.find(function(t){return t.id===id;});}
function bank(){return QB.concat(S.custom);}
function qById(id){return bank().find(function(q){return q.id===id;});}
function T(id){return S.topics[id]||(S.topics[id]={level:1,streak:0,fragile:false,placed:false});}
function recent(tid,n){var r=[];for(var i=S.log.length-1;i>=0&&r.length<n;i--){if(S.log[i].t===tid&&S.log[i].l!==4)r.push(S.log[i]);}return r;}
function known(tid){return T(tid).placed||recent(tid,1).length>0;}
function unresolved(tid){return Object.keys(S.errors).filter(function(id){var q=qById(id);return q&&(!tid||q.t===tid)&&S.errors[id].ok<2;});}
function weakness(tid){var t=T(tid),r=recent(tid,10);if(!r.length&&!t.placed)return 0.5;var acc=r.length?r.filter(function(x){return x.ok;}).length/r.length:0.5;return Math.min((1-acc)*0.6+((3-t.level)/2)*0.4+Math.min(unresolved(tid).length,4)*0.08,1.2);}
function lastAns(qid){for(var i=S.log.length-1;i>=0;i--){if(S.log[i].q===qid)return S.log[i];}return null;}
function levelLabel(tid){var t=T(tid);if(!known(tid))return 'Da valutare';return t.fragile?'Da costruire':LV[t.level];}
function meter(tid){var t=T(tid),k=known(tid);return '<span class="meter" role="img" aria-label="'+esc(levelLabel(tid))+'" style="--sc:var('+SUBJ[topicOf(tid).s].v+')">'+[1,2,3].map(function(i){return '<i style="--i:'+(i-1)+'" class="'+(k&&i<=t.level&&!(t.fragile&&i===1)?'on':'')+'"></i>';}).join('')+'</span>';}

function dayKey(t){var d=new Date(t===undefined?Date.now():t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function bump(n){var k=dayKey();S.days=S.days||{};S.days[k]=(S.days[k]||0)+(n||1);var ks=Object.keys(S.days);if(ks.length>400){ks.sort();ks.slice(0,ks.length-400).forEach(function(x){delete S.days[x];});}}
function goal(){return S.goal>0?S.goal:20;}

function streakInfo(){
  var g=goal(),n=0,d=new Date();d.setHours(12,0,0,0);
  if(((S.days||{})[dayKey(d.getTime())]||0)<g)d.setDate(d.getDate()-1);
  while(((S.days||{})[dayKey(d.getTime())]||0)>=g&&n<400){n++;d.setDate(d.getDate()-1);}

}

var sampleFn,sampleP=null;
function getSample(){
  if(sampleP)return sampleP;
  sampleP=(async function(){
    try{if(!window.claude||!window.claude.use)return null;var s=await window.claude.use('sample');return s||null;}catch(e){return null;}
  })().then(function(s){sampleFn=s||false;return s;});

function errMsg(e){

  if(c==='not_granted')return 'Per usare Claude serve il tuo permesso: riprova e accetta la richiesta.';
  if(c==='rate_limited')return 'Troppe richieste ravvicinate. Riprova tra poco.';

}

/* ---------- Selezione domande e registrazione risposte ---------- */
function qWeight(q){
  var t=T(q.t),w=1,e=S.errors[q.id];
  if(e&&e.ok<2)w+=3;
  var l=lastAns(q.id);
  if(!l)w+=1;else if(l.ok&&Date.now()-l.ts<2*864e5)w*=0.3;
  var d=Math.abs(q.l-t.level);w+=d===0?2:d===1?0.5:0;
  w*=(0.6+weakness(q.t)*1.4);
  return Math.max(w,0.05);
}
function pickQuestions(pool,n){
  var arr=pool.map(function(q){return {q:q,w:qWeight(q)};}),out=[];
  while(out.length<n&&arr.length){
    var tot=arr.reduce(function(a,x){return a+x.w;},0),r=Math.random()*tot,i=0;
    for(;i<arr.length;i++){r-=arr[i].w;if(r<=0)break;}
    i=Math.min(i,arr.length-1);out.push(arr[i].q);arr.splice(i,1);
  }
  return out;
}
function record(q,orig,ok,place,conf){
  var up=false,now=Date.now();
  S.log.push({q:q.id,t:q.t,ok:ok,ts:now,c:conf||undefined,l:q.l===4?4:undefined});
  if(q.l===4){S.sf=S.sf||{};var sx=S.sf[q.t]||(S.sf[q.t]={n:0,ok:0});sx.n++;if(ok)sx.ok++;}
  if(S.log.length>600)S.log.splice(0,S.log.length-600);
  var e=S.errors[q.id],c0=S.cards[q.id];
  if(!ok){S.errors[q.id]={n:(e?e.n:0)+1,ok:0,last:orig,ts:now,sure:conf==='s'};S.cards[q.id]={box:0,due:now};}
  else{
    if(e)e.ok=(e.ok||0)+1;
    if(!place&&c0&&c0.due<=now){c0.box=Math.min(4,(c0.box||0)+1);c0.due=now+INT[c0.box]*864e5;}
  }
  bump(1);
  if(!place&&q.l<=3){
    var t=T(q.t);
    if(ok){if(q.l>=t.level){t.streak++;if(t.streak>=2&&t.level<3){t.level++;t.streak=0;t.fragile=false;up=true;}}}
    else if(q.l<=t.level){t.streak=0;if(t.level>1)t.level--;else t.fragile=true;}
  }
  save();
  return up;
}

/* ---------- Suggerimento "cosa fare adesso" ---------- */
function suggest(){
  var none=TOPICS.every(function(t){return !known(t.id);});
  if(none)return {h:'Comincia dal test di livello',p:'Poche domande per materia, che si adattano alle tue risposte. Servono a capire da dove far partire i quiz.',b:[{l:'Fai il test di livello',a:'go',v:'quiz'}]};
  var ranked=TOPICS.map(function(t){return {t:t,w:weakness(t.id)};}).sort(function(a,b){return b.w-a.w;});
  var top=ranked[0],tid=top.t.id,er=unresolved(tid).length,lv=T(tid).level,how;
  if(er>=2||lv===1||T(tid).fragile)how={tab:'anim',txt:'Guarda l\'animazione per capire il meccanismo, rileggi il riassunto e poi rifai le domande sbagliate.'};
  else if(lv===2)how={tab:'map',txt:'Guarda la mappa concettuale per collegare le idee, poi fai un quiz mirato.'};
  else how={tab:'ex',txt:'Hai buone basi: passa agli esempi svolti e a domande più difficili.'};
  var b=[{l:'Studia: '+top.t.n,a:'openTopic',t:tid,tab:how.tab},er?{l:'Rifai gli errori ('+er+')',a:'quizErrTopic',t:tid,g:1}:{l:'Quiz su questo argomento',a:'quizTopic',t:tid,g:1}];
  return {h:'Da rafforzare: '+top.t.n,p:(er?'Hai '+er+(er===1?' errore da recuperare. ':' errori da recuperare. '):'')+how.txt,b:b};
}

/* ---------- Mappe e grafici (SVG) ---------- */
function wrap(s,max){
  var w=String(s).split(/\s+/),lines=[],cur='';
  w.forEach(function(x){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x;}else cur=(cur+' '+x).trim();});
  if(cur)lines.push(cur);
  return lines.slice(0,3);
}
function validMap(m){return m&&typeof m.centro==='string'&&Array.isArray(m.rami)&&m.rami.length>=2&&m.rami.every(function(r){return r&&typeof r.t==='string';});}
function mapSVG(m,sv){
  var W=900,H=640,cx=W/2,cy=H/2,nodes=[],edges=[];
  function mk(x,y,text,cls,max){var L=wrap(text,max),fs=cls==='c'?19:cls==='b'?16.5:15;var w=Math.max.apply(null,L.map(function(l){return l.length;}))*fs*0.54+26;var lh=fs*1.22;return {x:x,y:y,w:w,h:L.length*lh+16,L:L,fs:fs,lh:lh,cls:cls};}
  var c=mk(cx,cy,m.centro,'c',14);c.d=0;nodes.push(c);
  var rami=m.rami.slice(0,6),n=rami.length,start=-90-180/n;
  rami.forEach(function(r,i){
    var ang=(start+i*360/n)*Math.PI/180;
    var b=mk(cx+210*Math.cos(ang),cy+140*Math.sin(ang),r.t,'b',16);b.d=0.2+i*0.2;nodes.push(b);edges.push([c,b]);
    var kids=(Array.isArray(r.figli)?r.figli:[]).filter(function(k){return typeof k==='string';}).slice(0,3),m2=kids.length;
    kids.forEach(function(k,j){
      var a2=ang+(j-(m2-1)/2)*(22*Math.PI/180);
      var l=mk(cx+380*Math.cos(a2),cy+262*Math.sin(a2),k,'l',20);l.d=0.35+i*0.2+j*0.1;nodes.push(l);edges.push([b,l]);
    });
  });
  nodes.forEach(function(nd){nd.x=Math.max(nd.w/2+4,Math.min(W-nd.w/2-4,nd.x));nd.y=Math.max(nd.h/2+4,Math.min(H-nd.h/2-4,nd.y));});
  var s='<svg class="mc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mappa concettuale: '+esc(m.centro)+'" style="--sc:var('+sv+')">';
  edges.forEach(function(e){var len=Math.hypot(e[1].x-e[0].x,e[1].y-e[0].y);s+='<line class="mc-e" style="--len:'+len.toFixed(0)+';--d:'+Math.max(0,(e[1].d||0)-0.12).toFixed(2)+'s" x1="'+e[0].x.toFixed(1)+'" y1="'+e[0].y.toFixed(1)+'" x2="'+e[1].x.toFixed(1)+'" y2="'+e[1].y.toFixed(1)+'"/>';});
  nodes.forEach(function(nd){
    s+='<g class="mc-'+nd.cls+'" style="--d:'+(nd.d||0).toFixed(2)+'s"><rect x="'+(nd.x-nd.w/2).toFixed(1)+'" y="'+(nd.y-nd.h/2).toFixed(1)+'" width="'+nd.w.toFixed(1)+'" height="'+nd.h.toFixed(1)+'" rx="'+(nd.cls==='c'?18:nd.cls==='b'?12:8)+'"/>';
    nd.L.forEach(function(l,i){s+='<text x="'+nd.x.toFixed(1)+'" y="'+(nd.y+(i-(nd.L.length-1)/2)*nd.lh+nd.fs*0.34).toFixed(1)+'" text-anchor="middle" font-size="'+nd.fs+'">'+esc(l)+'</text>';});
    s+='</g>';
  });
  return s+'</svg>';
}
function ticks(lo,hi){
  var span=(hi-lo)||1,raw=span/5,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*p,a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,r=[];
  for(var v=a;v<=b+step/2;v+=step)r.push(+v.toFixed(10));
  return r;
}
function nf(v){return String(+(+v).toFixed(2)).replace('.',',');}
function validChart(g){
  if(!g||typeof g!=='object')return false;
  if(g.tipo==='barre')return Array.isArray(g.etichette)&&Array.isArray(g.valori)&&g.etichette.length>=2&&g.etichette.length===g.valori.length&&g.valori.every(function(v){return typeof v==='number'&&isFinite(v);});
  if(g.tipo==='linea')return Array.isArray(g.punti)&&g.punti.length>=2&&g.punti.every(function(p){return Array.isArray(p)&&p.length===2&&p.every(function(v){return typeof v==='number'&&isFinite(v);});});
  return false;
}
function chartSVG(g,sv){
  var W=640,H=340,L=64,R=24,Tp=46,B=58,pw=W-L-R,ph=H-Tp-B;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafico: '+esc(g.titolo||'')+'" style="--sc:var('+sv+')">';
  s+='<text class="ch-ti" x="'+L+'" y="24">'+esc(g.titolo||'')+'</text>';
  var xt,yt,sx,sy;
  if(g.tipo==='barre'){
    var mx=Math.max.apply(null,g.valori.concat([0])),mn=Math.min.apply(null,g.valori.concat([0]));
    yt=ticks(mn,mx);sy=function(v){return Tp+ph-(v-yt[0])/(yt[yt.length-1]-yt[0])*ph;};
    yt.forEach(function(v){s+='<line class="ch-ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'"/><text class="ch-t" x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end">'+nf(v)+'</text>';});
    var n=g.etichette.length,bw=pw/n;

      var it=m.items[m.i],j=+d.i;
      if(it.opts[j]===it.term){var left=Math.max(0,Math.ceil((POP_MS-(Date.now()-m.t0))/1000));m.last=10+left;m.score+=m.last;m.shown='ok';m.right++;m.tok++;}
      else{m.lives--;m.wrong[j]=true;if(m.lives<=0){m.shown='bad';m.tok++;}}
      render();return true;
    }
    if(a==='gTime'&&m.shown===null){m.lives--;m.shown='time';m.tok++;render();return true;}
    if(a==='gNext'){
      if(m.lives<=0||m.i+1>=m.items.length){m.end=true;bestUp('pop',m.score);}
      else{m.i++;m.shown=null;m.wrong={};popTimer();}
      render();scrollTop();return true;
    }
    return false;
  }
  if(m.g==='hang'){
    if(a==='gKey'&&m.res===null){
      var l=d.l,w=m.words[m.i];if(m.used[l])return true;
      m.used[l]=true;
      var wn=w.term.split('').map(normL);
      if(wn.indexOf(l)<0)m.wrong++;
      var all=w.term.split('').every(function(c){return !isL(c)||m.used[normL(c)];});
      if(all){m.res='win';m.score++;}else if(m.wrong>=m.max)m.res='lose';
      render();return true;
    }
    if(a==='gNext'){
      if(m.i+1>=m.words.length){m.end=true;bestUp('hang',m.score);}
      else{m.i++;m.used={};m.wrong=0;m.res=null;}
      render();scrollTop();return true;
    }
    return false;
  }
  if(m.g==='boss'){
    if(a==='gBoss'&&m.shown===null){
      var q=m.q,orig=m.order[+d.i],ok=orig===q.a;
      record(q,orig,ok,false,null);
      m.chosen=+d.i;m.shown=ok?'ok':'bad';
      if(ok){
        m.score++;m.hp--;m.hit=true;
        if(m.hp<=0){m.monsters++;m.beat=true;m.mi++;m.hpMax=Math.min(12,5+m.monsters);m.hp=m.hpMax;bestUp('boss',m.monsters);}
        m.tok++;var tk=m.tok;
        setTimeout(function(){if(gm&&gm.g==='boss'&&gm.tok===tk&&view==='game'&&gm.shown==='ok'){bossQ();render();}},m.beat?1100:750);
      }else{m.lives--;}
      render();return true;
    }
    if(a==='gNext'){
      if(m.lives<=0){m.end=true;bestUp('boss',m.monsters);}else bossQ();
      render();scrollTop();return true;
    }
    return false;
  }
  return false;
}

/* ---------- Lezione guidata ---------- */
function lessonStart(){
  var L=S.lesson;
  if(!L||L.step>=4){S.lesson={tid:pickLessonTopic(),step:1,wrong:[]};ui.swap=0;save();}
  lessonGo();
}
function lessonGo(){
  var L=S.lesson;ui.msg='';
  if(L.step===1){view='lesson';sess=null;render();scrollTop();}
  else if(L.step===2)startQuiz('topic',L.tid,{n:5,lesson:true});
  else if(L.step===3){
    var now=Date.now(),ids=(L.wrong||[]).slice();
    bank().forEach(function(q){if(q.t===L.tid&&S.cards[q.id]&&S.cards[q.id].due<=now&&ids.indexOf(q.id)<0)ids.push(q.id);});
    var items=ids.map(qById).filter(Boolean).slice(0,6);
    if(!items.length){finishLesson();view='lessonDone';sess=null;render();scrollTop();return;}
    sess={mode:'cards',items:items,i:0,flipped:false,known:0,review:0,done:false,lesson:true};view='playcards';render();scrollTop();
  }else{view='lessonDone';sess=null;render();scrollTop();}
}
function lessonNext(){
  var L=S.lesson;if(!L)return;
  if(L.step===2&&sess&&sess.answers)L.wrong=sess.answers.filter(function(x){return !x.ok;}).map(function(x){return x.q;});
  L.step++;save();lessonGo();
}
function finishLesson(){if(S.lesson&&S.lesson.step<4){S.lesson.step=4;S.lessonsDone=(S.lessonsDone||0)+1;save();}}

function setQ(q){sess.conf=null;sess.reveal=sess.mode==='place'||S.hide===false;sess.lvUp=null;sess.rev=null;sess.prev=null;sess.q=q;sess.order=shuffle([0,1,2,3]);sess.chosen=null;sess.shown=false;sess.ok=null;}
function startQuiz(mode,arg,opt){
  opt=opt||{};var pool=bank(),n=10;
  if(mode==='subj')pool=pool.filter(function(q){return topicOf(q.t).s===arg;});
  else if(mode==='topic'){pool=pool.filter(function(q){return q.t===arg;});n=8;}
  else if(mode==='multi'){var ids=arg||[];pool=pool.filter(function(q){return ids.indexOf(q.t)>-1;});n=opt.n===0?pool.length:(opt.n||10);}
  else if(mode==='errors'){pool=pool.filter(function(q){return S.errors[q.id]&&S.errors[q.id].ok<2&&(!arg||q.t===arg);});n=12;}
  if(mode!=='errors'){var df=opt.diff===undefined?'auto':opt.diff;pool=pool.filter(function(q){return diffOK(q,df);});}
  if(!pool.length){ui.msg='Non ci sono domande disponibili per questa scelta.';view='home';sess=null;render();scrollTop();return;}
  if(opt.n&&mode!=='multi')n=opt.n;
  var items=pickQuestions(pool,Math.min(n,pool.length));
  ui.lp=0;sess={mode:'quiz',sub:mode==='multi'?'multi':'',items:items,i:0,answers:[],lesson:!!opt.lesson};setQ(items[0]);view='play';render();scrollTop();
}

  sess={mode:'place',queue:topics,total:topics.length,done:0,cur:null,stage:2,answers:[],subjects:arg==='all'?Object.keys(SUBJ):[arg],lv:{}};

function placeNext(){

    var lv=sess.stage===3?(last.ok?3:2):1,fragile=sess.stage===1&&!last.ok,t=T(tid);

  if(!sess||sess.shown)return;

  var conf=sess.conf||null,up=record(q,orig,ok,sess.mode==='place',conf);
  sess.prev=S.cards[q.id]?JSON.parse(JSON.stringify(S.cards[q.id])):null;
  if(ok&&sess.mode!=='place'&&conf&&conf!=='s'&&!S.cards[q.id]){S.cards[q.id]={box:0,due:Date.now()};sess.rev=1;save();}
  sess.lvUp=up?LV[T(q.t).level]:null;ui.fx=true;

}
function setReview(v){
  if(!sess||sess.mode==='place'||!sess.shown||!sess.ok)return;
  var q=sess.q,last=sess.answers[sess.answers.length-1];
  if(v==='1'){S.cards[q.id]={box:0,due:Date.now()};sess.rev=1;}
  else{if(sess.prev)S.cards[q.id]=sess.prev;else delete S.cards[q.id];sess.rev=0;}
  if(last&&last.q===q.id)last.rev=sess.rev;

}
function next(){
  if(!sess)return;

}
var INT=[0,1,3,7,21];
function startCards(arg){
  var now=Date.now(),pool=cardsPool(arg);

}
function rate(r){
  if(!sess||sess.mode!=='cards')return;
  var q=sess.items[sess.i],c=S.cards[q.id]||(S.cards[q.id]={box:0,due:0});
  if(r==='known'){c.box=Math.min(4,(c.box||0)+1);c.due=Date.now()+INT[c.box]*864e5;sess.known++;}

    }else{

/* Mole: reagente limitante */
ANIM.ch_mole=function(root){
  root.innerHTML='<p class="muted">Reazione: 2 H₂ + O₂ danno 2 H₂O. Ogni pallino è 1 mol.</p>'+slider('h','Moli di H₂',0,8,1,4,' mol')+slider('o','Moli di O₂',0,6,1,1,' mol')+'<div class="mole-grid" id="out"></div><div class="cap" id="cap" aria-live="polite"></div>';
  function toks(n,c,sym){var s='';for(var i=0;i<n;i++)s+='<span class="tok '+c+'" style="--i:'+i+'">'+sym+'</span>';return s;}
  function upd(){
    var h=+$('h').value,o=+$('o').value,xi=Math.min(h/2,o),w=2*xi,hl=h-2*xi,ol=o-xi,t;
    var before=toks(h,'h','H₂')+toks(o,'o','O₂'),after=toks(w,'w','H₂O')+toks(hl,'h','H₂')+toks(ol,'o','O₂');
    $('out').innerHTML='<div class="panel" style="margin:0"><h3>Prima</h3><div class="toks">'+(before||'<span class="note">vuoto</span>')+'</div></div><div class="panel" style="margin:0"><h3>Dopo la reazione</h3><div class="toks">'+(after||'<span class="note">vuoto</span>')+'</div></div>';
    if(h===0||o===0)t='Senza uno dei due reagenti la reazione non parte.';
    else{
      var lim=h/2<o?'H₂, che finisce per primo':h/2>o?'O₂, che finisce per primo':'nessuno: le quantità sono nel rapporto esatto';
      t='Servono 2 mol di H₂ ogni 1 mol di O₂. Con '+h+' mol di H₂ e '+o+' mol di O₂ il reagente limitante è <strong>'+lim+'</strong>. Si formano <strong>'+w+' mol di H₂O</strong>'+((hl||ol)?' e avanzano '+[hl?hl+' mol di H₂':'',ol?ol+' mol di O₂':''].filter(Boolean).join(' e ')+'.':'.');
    }
    setText('cap',t);
  }
  onInput('h',upd);onInput('o',upd);upd();
};

/* pH */
ANIM.ch_ph=function(root){
  root.innerHTML=slider('p','pH',0,14,0.1,7,'')+'<div class="phbar"><i id="mk"></i></div><div class="ph-read" id="rd"></div><div class="ions"><div><strong>Ioni H⁺</strong><div class="dots" id="hd"></div></div><div><strong>Ioni OH⁻</strong><div class="dots" id="od"></div></div></div><p class="note">I pallini mostrano quale ione prevale, non sono in scala.</p>'+chipRow('pre',[[2,'Limone'],[5,'Caffè'],[7,'Acqua pura'],[7.4,'Sangue'],[11,'Ammoniaca domestica']],null)+'<div class="cap" id="cap" aria-live="polite"></div>';
  function dots(n,c){var s='';for(var i=0;i<n;i++)s+='<span class="dot '+c+'" style="animation-delay:'+(i*25)+'ms"></span>';return s;}
  var lastH=-1,lastO=-1;
  function upd(v){
    var k=Math.ceil(v-1e-9),mH=Math.pow(10,k-v),po=14-v,ko=Math.ceil(po-1e-9),mO=Math.pow(10,ko-po);
    var type=v<6.95?'Soluzione acida':v>7.05?'Soluzione basica':'Soluzione neutra';
    $('mk').style.left=(v/14*100)+'%';
    setText('rd','<span class="ph-big">pH '+nf(v)+'</span><span>[H⁺] = '+nf(mH)+' × 10'+sup(-k)+' mol/L</span><span>[OH⁻] = '+nf(mO)+' × 10'+sup(-ko)+' mol/L</span><strong>'+type+'</strong>');
    var hN=v<7?Math.round((7-v)/7*17)+1:1,oN=v>7?Math.round((v-7)/7*17)+1:1;
    if(hN!==lastH){$('hd').innerHTML=dots(hN,'hp');lastH=hN;}
    if(oN!==lastO){$('od').innerHTML=dots(oN,'oh');lastO=oN;}
    var f=Math.pow(10,Math.abs(7-v)),ft=f<10?nf(f):String(Math.round(f));
    setText('cap',Math.abs(v-7)<0.05?'A pH 7 gli ioni H⁺ e OH⁻ sono in numero uguale (10⁻⁷ mol/L ciascuno): la soluzione è neutra.':v<7?'Rispetto all\'acqua pura (pH 7) qui gli ioni H⁺ sono circa <strong>'+ft+' volte</strong> più numerosi. Ogni unità di pH in meno significa 10 volte più H⁺.':'Rispetto all\'acqua pura (pH 7) qui gli ioni OH⁻ sono circa <strong>'+ft+' volte</strong> più numerosi. Ogni unità di pH in più significa 10 volte più OH⁻.');
  }
  onInput('p',upd);
  wireChips('pre',function(k){var v=+k;$('p').value=v;$('pv').textContent=nf(v);upd(v);});
  upd(7);
};

/* DNA: trascrizione e traduzione */
ANIM.bi_dna=function(root){
  var tpl='TACCGATTTACT',cmp={T:'A',A:'U',C:'G',G:'C'},AA={AUG:['Met','metionina, l\'amminoacido di inizio'],GCU:['Ala','alanina'],AAA:['Lys','lisina'],UGA:['Stop','codone di stop: la traduzione finisce']},n=0,timer=null,msg='Il filamento stampo (in alto) viene letto da 3\' a 5\'. Premi «Prossima base»: l\'mRNA cresce da 5\' a 3\'.';
  root.innerHTML='<div class="row" style="margin-bottom:10px"><button class="btn sm" id="nx">Prossima base</button><button class="btn ghost sm" id="au">Automatico</button><button class="btn ghost sm" id="rs">Ricomincia</button></div><div class="cap" id="cap" aria-live="polite"></div><div class="dnaw"><div class="dna" id="dn"></div></div>';
  function mrna(){var s='';for(var i=0;i<n;i++)s+=cmp[tpl[i]];return s;}
  function grid(){
    var m=mrna(),h='<div class="rowlab">DNA stampo, 3\' verso 5\'</div>';
    for(var i=0;i<12;i++)h+='<div class="b" data-b="'+tpl[i]+'">'+tpl[i]+'</div>';
    h+='<div class="rowlab">mRNA, 5\' verso 3\'</div>';
    for(var k=0;k<12;k++)h+=k<n?'<div class="b'+(k===n-1?' new':'')+'" data-b="'+m[k]+'">'+m[k]+'</div>':'<div class="b empty"></div>';
    h+='<div class="rowlab">Proteina (un amminoacido ogni codone)</div>';
    for(var c=0;c<4;c++){var cod=m.slice(c*3,c*3+3);h+=cod.length===3?'<div class="b aa'+(n===(c+1)*3?' new':'')+'">'+AA[cod][0]+'</div>':'<div class="b aa empty"></div>';}
    $('dn').innerHTML=h;setText('cap',msg);
  }
  function step(){
    if(n>=12){stopAuto();return;}
    var b=tpl[n];n++;
    msg='Base '+n+': nello stampo c\'è <strong>'+b+'</strong>, quindi nell\'mRNA si inserisce <strong>'+cmp[b]+'</strong>.'+(b==='A'?' Nell\'RNA, al posto della timina, c\'è l\'uracile (U).':'');
    if(n%3===0){var cod=mrna().slice(n-3);msg+=' Codone completo: <strong>'+cod+'</strong>, tradotto in '+AA[cod][0]+' ('+AA[cod][1]+').';}
    if(n===12)msg+=' L\'mRNA è pronto: il ribosoma lo ha tradotto in una piccola proteina (Met, Ala, Lys).';
    grid();
  }
  function stopAuto(){if(timer){clearInterval(timer);timer=null;}$('au').textContent='Automatico';}
  stops.push(function(){if(timer)clearInterval(timer);});
  $('nx').addEventListener('click',function(){stopAuto();step();});
  $('au').addEventListener('click',function(){if(timer){stopAuto();return;}if(n>=12)n=0;$('au').textContent='Pausa';step();timer=setInterval(step,1100);});
  $('rs').addEventListener('click',function(){stopAuto();n=0;msg='Si riparte: premi «Prossima base».';grid();});
  grid();
};

/* Genetica: quadrato di Punnett */
ANIM.bi_gen=function(root){

  root.innerHTML='<h3>Genitore 1</h3>'+chipRow('p1',G,p1)+'<h3>Genitore 2</h3>'+chipRow('p2',G,p2)+'<div class="pgrid" id="pg"></div><div class="sbar" id="sb"></div><div class="cap" id="cap" aria-live="polite"></div>';
  function gcd(a,b){return b?gcd(b,a%b):a;}
  function upd(){
    var g1=p1.split(''),g2=p2.split(''),cells=[],cnt={AA:0,Aa:0,aa:0};
    var h='<div></div><div class="pg-h">'+g2[0]+'</div><div class="pg-h">'+g2[1]+'</div>';
    for(var i=0;i<2;i++){h+='<div class="pg-h">'+g1[i]+'</div>';for(var j=0;j<2;j++){var a=g1[i],b=g2[j],gt=a<b?a+b:b+a;if(a===b)gt=a+b;else gt='Aa';cnt[gt]++;h+='<div class="pc '+gt+'" style="--i:'+(i*2+j)+'">'+gt+'</div>';}}
    $('pg').innerHTML=h;
    var col={AA:'var(--bio)',Aa:'color-mix(in srgb,var(--bio) 45%,var(--surface))',aa:'var(--soft)'};
    $('sb').innerHTML=['AA','Aa','aa'].map(function(k){return '<div style="width:'+cnt[k]*25+'%;background:'+col[k]+(k==='AA'?';color:var(--on-sub)':'')+'">'+(cnt[k]?cnt[k]*25+'% '+k:'')+'</div>';}).join('');
    var dom=cnt.AA+cnt.Aa,rec=cnt.aa,ratio=rec===0?'tutti con il fenotipo dominante':dom===0?'tutti con il fenotipo recessivo':(dom/gcd(dom,rec))+' dominanti : '+(rec/gcd(dom,rec))+' recessivi';
    setText('cap','Ogni genitore passa ai figli uno dei suoi due alleli, con uguale probabilità. Qui i figli sono: '+ratio+'. Probabilità di un figlio aa: <strong>'+rec*25+'%</strong>.');
  }
  wireChips('p1',function(k){p1=k;upd();});wireChips('p2',function(k){p2=k;upd();});
  upd();
};

    for(k=0;k<=6;k++)s+='<text class="txtm" x="'+X(k)+'" y="318" text-anchor="middle">'+k+'</text>';
    s+='<text class="txtm" x="315" y="338" text-anchor="middle">tempo t (s)</text><text class="txtm" x="14" y="230" transform="rotate(-90 14 230)" text-anchor="middle">velocità v (m/s)</text><text class="txtm" x="54" y="304" text-anchor="end">0</text><text class="txtm" x="54" y="168" text-anchor="end">'+nf(vmax)+'</text>';
    s+='<line class="ghost" x1="'+X(0)+'" y1="'+Y(v0)+'" x2="'+X(TT)+'" y2="'+Y(v0+a*TT)+'"/>';
    s+='<polygon class="area" points="'+X(0)+','+Y(0)+' '+X(0)+','+Y(v0)+' '+X(t).toFixed(1)+','+Y(v).toFixed(1)+' '+X(t).toFixed(1)+','+Y(0)+'"/>';
    s+='<line class="line" x1="'+X(0)+'" y1="'+Y(v0)+'" x2="'+X(t).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><circle class="ch" cx="'+X(t).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="6"/>';
    $('sv').innerHTML=s;
    setText('rd','<span>t = <b>'+nf(t)+'</b> s</span><span>v = <b>'+nf(v)+'</b> m/s</span><span>spazio = <b>'+nf(sp)+'</b> m</span>');
  }
  function reset(){t=0;running=false;dirty=true;}
  onInput('a',function(v){a=v;reset();});onInput('v',function(v){v0=v;reset();});
  $('go').addEventListener('click',function(){if(t>=TT)t=0;running=true;dirty=true;});
  $('rs').addEventListener('click',reset);
  loop(function(dt){if(running){t+=dt;if(t>=TT){t=TT;running=false;}dirty=true;}if(dirty){dirty=false;draw();}});
};

/* Dinamica: piano inclinato */
ANIM.fi_din=function(root){
  var th=30,t=0,running=false,dirty=true,LM=4;
  root.innerHTML=slider('th','Inclinazione del piano',0,60,5,30,'°')+'<div class="read" id="rd"></div><svg id="sv" class="animsvg" viewBox="0 0 600 300" role="img" aria-label="Blocco su un piano inclinato con le forze"></svg><div class="row" style="margin-top:10px"><button class="btn sm" id="go">Fai scivolare il blocco</button><button class="btn ghost sm" id="rs">Riporta in cima</button></div><div class="cap" id="cap" style="margin-top:12px" aria-live="polite"></div>';
  function draw(){
    var r=th*Math.PI/180,sn=Math.sin(r),cs=Math.cos(r),a=10*sn,L=Math.min(430,sn>0.01?200/sn:430),H=L*sn,W=L*cs,tx=60,ty=260-H,bx=60+W;
    var s='<defs><marker id="ahi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mki" d="M0 0L10 5L0 10z"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mks" d="M0 0L10 5L0 10z"/></marker></defs>';
    s+='<polygon class="ramp" points="'+tx+','+ty.toFixed(1)+' '+bx.toFixed(1)+',260 60,260"/>';
    if(th>=5)s+='<path class="angle" d="M'+(bx-40).toFixed(1)+' 260 A40 40 0 0 1 '+(bx-40*cs).toFixed(1)+' '+(260-40*sn).toFixed(1)+'"/><text class="txt" x="'+(bx-58).toFixed(1)+'" y="'+(250-6)+'">'+th+'°</text>';
    var sm=Math.min(LM,0.5*a*t*t),d=30+sm/LM*(L-70),px=tx+d*cs,py=ty+d*sn,cx=px+14*sn,cy=py-14*cs;
    s+='<g transform="translate('+cx.toFixed(1)+' '+cy.toFixed(1)+') rotate('+th+')"><rect class="blk" x="-22" y="-14" width="44" height="28" rx="4"/></g>';
    s+='<line class="vw" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+(cy+56).toFixed(1)+'" marker-end="url(#ahi)"/><text class="txt" x="'+(cx+8).toFixed(1)+'" y="'+(cy+66).toFixed(1)+'">P = m·g</text>';
    if(sn>0.05)s+='<line class="vp" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(cx+cs*56*sn).toFixed(1)+'" y2="'+(cy+sn*56*sn).toFixed(1)+'" marker-end="url(#ahs)"/>';
    if(th>0)s+='<line class="vn" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(cx-sn*56*cs).toFixed(1)+'" y2="'+(cy+cs*56*cs).toFixed(1)+'" stroke-dasharray="5 4"/>';
    s+='<text class="txtm" x="330" y="26">Linea colorata: parte del peso lungo il piano (fa muovere il blocco)</text><text class="txtm" x="330" y="46">Linea tratteggiata: parte contro il piano (il piano la compensa)</text>';
    $('sv').innerHTML=s;
    setText('rd','<span>a = g · sin θ = <b>'+nf(a)+'</b> m/s²</span><span>t = <b>'+nf(t)+'</b> s</span><span>v = <b>'+nf(a*t)+'</b> m/s</span>');
    setText('cap',th===0?'Su un piano orizzontale il peso è tutto contro il piano: non c\'è nessuna parte lungo il piano e il blocco resta fermo.':'Il peso si scompone in due parti: <strong>P∥ = m·g·sin θ</strong> lungo il piano (fa scivolare il blocco) e <strong>P⊥ = m·g·cos θ</strong> contro il piano. Più il piano è ripido, più P∥ cresce. La massa si semplifica: tutti i blocchi accelerano allo stesso modo.');
  }
  function reset(){t=0;running=false;dirty=true;}
  onInput('th',function(v){th=v;reset();});
  $('go').addEventListener('click',function(){var a=10*Math.sin(th*Math.PI/180);if(a<=0)return;if(0.5*a*t*t>=LM)t=0;running=true;dirty=true;});
  $('rs').addEventListener('click',reset);
  loop(function(dt){if(running){var a=10*Math.sin(th*Math.PI/180);t+=dt;if(0.5*a*t*t>=LM){t=Math.sqrt(2*LM/a);running=false;}dirty=true;}if(dirty){dirty=false;draw();}});
};

/* Energia: caduta di una palla */
ANIM.fi_en=function(root){
  var h0=10,t=0,running=false,dirty=true;
  root.innerHTML=slider('h','Altezza iniziale h',2,20,1,10,' m')+'<div class="read" id="rd"></div><svg id="sv" class="animsvg" viewBox="0 0 600 345" role="img" aria-label="Palla in caduta e barre di energia"></svg><div class="row" style="margin-top:10px"><button class="btn sm" id="go">Lascia cadere la palla</button><button class="btn ghost sm" id="rs">Riporta su</button></div><div class="cap" id="cap" style="margin-top:12px" aria-live="polite"></div>';
  function draw(){
    var T=Math.sqrt(h0/5),tt=Math.min(t,T),y=Math.max(0,h0-5*tt*tt),v=10*tt,U=10*y,K=0.5*v*v,E=10*h0,BH=230,s='',k;
    s+='<line class="axis" x1="40" y1="300" x2="560" y2="300"/><line class="axis" x1="60" y1="60" x2="60" y2="300"/>';
    for(k=0;k<=20;k+=5)s+='<line class="axis" x1="55" y1="'+(300-k*12)+'" x2="65" y2="'+(300-k*12)+'"/><text class="txtm" x="50" y="'+(304-k*12)+'" text-anchor="end">'+k+'</text>';
    s+='<text class="txtm" x="70" y="52">altezza (m)</text>';
    s+='<line class="ghost" x1="60" y1="'+(300-h0*12)+'" x2="180" y2="'+(300-h0*12)+'"/>';
    s+='<circle class="ball" cx="130" cy="'+(300-y*12-12).toFixed(1)+'" r="12"/>';
    var bars=[[250,'Potenziale',U,'bu'],[350,'Cinetica',K,'bk']];
    bars.forEach(function(b){var hh=b[2]/E*BH;s+='<rect class="'+b[3]+'" x="'+b[0]+'" y="'+(300-hh).toFixed(1)+'" width="70" height="'+hh.toFixed(1)+'" rx="4"/><text class="txtm" x="'+(b[0]+35)+'" y="320" text-anchor="middle">'+b[1]+'</text><text class="txt" x="'+(b[0]+35)+'" y="'+(292-hh).toFixed(1)+'" text-anchor="middle">'+nf(b[2])+' J</text>';});
    var hk=K/E*BH,hu=U/E*BH;
    s+='<rect class="bk" x="470" y="'+(300-hk).toFixed(1)+'" width="70" height="'+hk.toFixed(1)+'"/><rect class="bu" x="470" y="'+(300-hk-hu).toFixed(1)+'" width="70" height="'+hu.toFixed(1)+'"/><rect class="tot" x="470" y="'+(300-BH)+'" width="70" height="'+BH+'" rx="4"/><text class="txtm" x="505" y="320" text-anchor="middle">Totale</text><text class="txt" x="505" y="'+(292-BH)+'" text-anchor="middle">'+nf(E)+' J</text>';
    $('sv').innerHTML=s;
    setText('rd','<span>quota = <b>'+nf(y)+'</b> m</span><span>velocità = <b>'+nf(v)+'</b> m/s</span><span>tempo = <b>'+nf(tt)+'</b> s</span>');
    setText('cap',tt>=T?'A terra tutta l\'energia potenziale è diventata cinetica: v = √(2·g·h) = <strong>'+nf(Math.sqrt(2*10*h0))+' m/s</strong>. Il totale è rimasto sempre uguale (senza attrito).':'Mentre la palla scende, l\'energia potenziale (m·g·h) diminuisce e quella cinetica (½·m·v²) aumenta della stessa quantità. La palla pesa 1 kg e g = 10 m/s².');
  }
  function reset(){t=0;running=false;dirty=true;}
  onInput('h',function(v){h0=v;reset();});
  $('go').addEventListener('click',function(){if(t>=Math.sqrt(h0/5))t=0;running=true;dirty=true;});
  $('rs').addEventListener('click',reset);
  loop(function(dt){if(running){t+=dt;if(t>=Math.sqrt(h0/5)){t=Math.sqrt(h0/5);running=false;}dirty=true;}if(dirty){dirty=false;draw();}});
};

/* Circuiti elettrici */
ANIM.fi_el=function(root){
  var mode='one',V=12,R=6,off=[0,0];
  root.innerHTML=chipRow('mode',[['one','Un resistore'],['ser','Due in serie'],['par','Due in parallelo']],'one')+slider('v','Tensione V',1,24,1,12,' V')+slider('r','Resistenza di ogni resistore',1,20,1,6,' Ω')+'<div class="read" id="rd"></div><svg id="sv" class="animsvg" viewBox="0 0 600 300" role="img" aria-label="Circuito elettrico con cariche in movimento"></svg><div class="cap" id="cap" style="margin-top:12px" aria-live="polite"></div>';
  function info(){
    var Rt=mode==='one'?R:mode==='ser'?2*R:R/2,I=V/Rt,Ib=mode==='par'?V/R:I;
    return {Rt:Rt,I:I,Ib:Ib};
  }
  function paths(){
    if(mode==='par')return [[[70,240],[70,60],[330,60],[330,240],[70,240]],[[70,240],[70,60],[520,60],[520,240],[70,240]]];
    return [[[70,240],[70,60],[520,60],[520,240],[70,240]]];
  }
  function draw(dt){
    var f=info(),P=paths(),s='';
    s+='<polyline class="wire" points="70,240 70,60 520,60 520,240 70,240"/>';
    if(mode==='par')s+='<polyline class="wire" points="330,60 330,240"/>';
    s+='<rect class="batt" x="58" y="130" width="24" height="40"/><text class="txt" x="94" y="155">'+V+' V</text>';
    var sp=Math.min(260,30+14*f.Ib);
    P.forEach(function(pts,i){
      off[i]+=dt*sp;var L=polyLen(pts),n=Math.round(L/38),stp=L/n;
      for(var k=0;k<n;k++){var q=polyPos(pts,off[i]+k*stp);s+='<circle class="ch" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4.5"/>';}
    });
    function res(x,y1,y2,lab){s+='<rect class="resb" x="'+(x-18)+'" y="'+y1+'" width="36" height="'+(y2-y1)+'" rx="4"/><text class="txt" x="'+(x+26)+'" y="'+((y1+y2)/2+5)+'">'+lab+'</text>';}
    if(mode==='one')res(520,120,180,R+' Ω');
    else if(mode==='ser'){res(520,85,125,R+' Ω');res(520,175,215,R+' Ω');}
    else{res(330,120,180,R+' Ω');res(520,120,180,R+' Ω');}
    $('sv').innerHTML=s;
    setText('rd','<span>R totale = <b>'+nf(f.Rt)+'</b> Ω</span><span>corrente totale = <b>'+nf(f.I)+'</b> A</span><span>potenza = <b>'+nf(V*f.I)+'</b> W</span>');
    setText('cap',mode==='one'?'Legge di Ohm: I = V / R = '+V+' / '+R+' = <strong>'+nf(f.I)+' A</strong>. Più la corrente è alta, più le cariche (i pallini) corrono veloci.':mode==='ser'?'In serie la corrente è la stessa in tutto il circuito e le resistenze si sommano: R = '+R+' + '+R+' = <strong>'+nf(f.Rt)+' Ω</strong>, quindi I = '+nf(f.I)+' A. Con più resistori la corrente cala.':'In parallelo ogni ramo ha la stessa tensione V e la corrente si divide: ogni ramo porta I = V / R = '+nf(f.Ib)+' A. La corrente totale è la somma ('+nf(f.I)+' A) e la resistenza equivalente si abbassa: R = '+R+' / 2 = <strong>'+nf(f.Rt)+' Ω</strong>.');
  }
  wireChips('mode',function(k){mode=k;off=[0,0];if(RM)draw(0);});
  onInput('v',function(x){V=x;if(RM)draw(0);});onInput('r',function(x){R=x;if(RM)draw(0);});
  draw(0);
  if(!RM)loop(function(dt){draw(dt);});
};


/* ---------- Eventi ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  var a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'go':go(d.v);break;
    case 'pickT':{var a=selTopics(),i=a.indexOf(d.t);if(i>-1)a.splice(i,1);else a.push(d.t);S.sel=a;save();ui.focusSel='[data-t="'+d.t+'"]';render();break;}
    case 'pickS':{var ids=TOPICS.filter(function(t){return t.s===d.v;}).map(function(t){return t.id;}),cur=selTopics(),all=ids.every(function(x){return cur.indexOf(x)>-1;});S.sel=all?cur.filter(function(x){return ids.indexOf(x)<0;}):cur.concat(ids.filter(function(x){return cur.indexOf(x)<0;}));save();ui.focusSel='[data-v="'+d.v+'"]';render();break;}
    case 'pickAll':S.sel=TOPICS.map(function(t){return t.id;});save();render();break;
    case 'pickNone':S.sel=[];save();render();break;
    case 'pickWeak':S.sel=rankTopics().slice(0,5);save();render();break;
    case 'pickN':ui.pickN=+d.v;ui.focusSel='[data-v="'+d.v+'"][data-act="pickN"]';render();break;
    case 'pickGo':startQuiz('multi',selTopics(),{n:ui.pickN===undefined?10:ui.pickN,diff:S.diff===undefined?'auto':S.diff});break;
    case 'pickD':S.diff=d.v==='auto'?'auto':+d.v;save();ui.focusSel='[data-act="pickD"][data-v="'+d.v+'"]';render();break;
    case 'pickExam':S.diff=4;if(!selTopics().length)S.sel=rankTopics().slice(0,5);save();go('pick');break;
    case 'quizTopicExam':startQuiz('topic',d.t,{n:10,diff:4});break;
    case 'placeStart':startPlace(d.arg);break;
    case 'startQuiz':startQuiz(d.mode,d.arg);break;
    case 'quizTopic':startQuiz('topic',d.t);break;
    case 'quizErrTopic':startQuiz('errors',d.t);break;
    case 'ans':answer(+d.i);break;
    case 'conf':if(sess&&!sess.reveal){sess.conf=d.c==='n'?null:d.c;sess.reveal=true;render();}break;
    case 'goalSet':S.goal=+d.v;save();render();break;
    case 'hideToggle':S.hide=(S.hide===false);save();render();break;
    case 'examStart':startExam(+d.n);break;
    case 'examGo':if(sess&&sess.mode==='exam'){sess.i=+d.i;ui.exConf=false;render();scrollTop();}break;
    case 'examAns':if(sess&&sess.mode==='exam'){sess.ans[sess.i]=+d.j;ui.exConf=false;render();}break;
    case 'examStep':if(sess&&sess.mode==='exam'){sess.i=Math.max(0,Math.min(sess.items.length-1,sess.i+(+d.v)));render();scrollTop();}break;
    case 'examSubmit':examSubmit(false);break;
    case 'examCancel':ui.exConf=false;render();break;
    case 'examQuit':if(ui.exQuit){go('home');}else{ui.exQuit=true;render();}break;
    case 'gScope':ui.gscope=d.v;render();break;
    case 'gStart':startGame(d.g);break;
    case 'gAgain':if(gm)startGame(gm.g);break;
    case 'gExit':go('games');break;
    case 'gPop':case 'gTime':case 'gKey':case 'gBoss':case 'gmT':case 'gmD':case 'gTF':case 'gGu':case 'gNext':case 'gOrd':gameAct(a,d);break;
    case 'next':next();break;
    case 'rev':setReview(d.v);break;
    case 'quit':go('home');break;
    case 'lessonStart':lessonStart();break;
    case 'lessonNext':lessonNext();break;
    case 'lessonSwap':ui.swap=(ui.swap||0)+1;render();break;
    case 'lessonDrop':S.lesson=null;save();render();break;
    case 'explain':explainQ(d.q,+d.c,el);break;
    case 'openTopic':ui.topic=d.t;view='topic';sess=null;ui.msg='';render();scrollTop();break;
    case 'tab':ui.tab=d.tab;render();break;
    case 'genMat':genMat(d.t);break;
    case 'genQ':genQ(d.t);break;
    case 'startCards':startCards(d.arg);break;
    case 'flip':if(sess){sess.flipped=true;render();}break;
    case 'rate':rate(d.r);break;
    case 'helpClose':S.helpSeen=true;ui.help=false;save();render();break;
    case 'backupOpen':ui.backup=true;render();break;
    case 'backupClose':ui.backup=false;render();break;
    case 'exportData':{
      var box=$('bk'),code='';
      try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){}
      box.value=code;box.focus();box.select();
      var done=function(ok){setText('bkm',ok?'Codice creato e copiato. Incollalo sull\'altro dispositivo.':'Codice creato: selezionalo e copialo a mano.');};
      try{navigator.clipboard.writeText(code).then(function(){done(true);},function(){done(false);});}catch(e){done(false);}
      break;}
    case 'importData':{
      var txt=($('bk').value||'').trim(),obj=null;
      try{obj=JSON.parse(decodeURIComponent(escape(atob(txt))));}catch(e){}
      if(!obj||!Array.isArray(obj.log)||typeof obj.topics!=='object'){setText('bkm','Il codice non è valido. Controlla di averlo copiato per intero.');break;}
      S=Object.assign(blank(),obj);save();ui.backup=false;ui.help=false;render();scrollTop();break;}
    case 'helpOpen':ui.help=true;render();scrollTop();break;
    case 'reset':
      if(ui.confirmReset){S=blank();save();ui.confirmReset=false;}else ui.confirmReset=true;
      render();break;
  }
});

render();
getSample().then(function(){render();});
})();
