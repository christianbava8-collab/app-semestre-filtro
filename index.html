{id:"fl1_039",t:"fl1",p:"1.5.2",l:3,q:"Larghezza (180 ± 0,2) cm e altezza (80 ± 0,1) cm di un tavolo. Quale misura è più precisa?",o:["La larghezza","L'altezza","Hanno la stessa precisione","Servono gli errori sistematici per dirlo"],a:0,e:"Errori relativi: 0,2/180 ≈ 0,11% e 0,1/80 ≈ 0,13%. La larghezza è più precisa, pur avendo l'errore assoluto maggiore."},
{id:"fl1_040",t:"fl1",p:"1.5.4",l:3,q:"Il lato di un quadrato misura (10 ± 2) cm. Qual è l'errore assoluto sul perimetro?",o:["8 cm","2 cm","4 cm","40 cm"],a:0,e:"P = L + L + L + L: in una somma si sommano gli errori assoluti, quindi 4 · 2 = 8 cm (errore relativo 8/40 = 0,2)."},
{id:"fl1_041",t:"fl1",p:"1.5.4",l:3,q:"Il lato di un quadrato misura (10 ± 2) cm. Qual è l'errore assoluto sull'area?",o:["40 cm²","4 cm²","8 cm²","20 cm²"],a:0,e:"A = L · L = 100 cm². In un prodotto si sommano gli errori relativi: 0,2 + 0,2 = 0,4. Errore assoluto = 0,4 · 100 = 40 cm²."},
{id:"fl1_042",t:"fl1",p:"1.5.3",l:3,q:"Con uno strumento sensibile al centimetro si ottiene un valore medio di 15,4 cm. Come va scritta la misura?",o:["15 cm","15,4 cm","154 mm","15,40 cm"],a:0,e:"Lo strumento non distingue i millimetri, quindi scriverli non ha senso: la misura corretta è 15 cm, con 2 cifre significative."},
{id:"fl1_043",t:"fl1",p:"1.4.2",l:4,q:"Tre forze non nulle sono applicate all'origine e giacciono tutte nel primo quadrante. Per quali moduli la loro risultante può essere nulla?",o:["Mai, qualunque siano i moduli","3, 4 e 5","0,5, 0,5 e 1","1, 2 e 4"],a:0,e:"Tutte e tre hanno componenti positive su x e y, quindi anche la loro somma ha componenti positive: la risultante non può mai annullarsi."},
{id:"fl1_044",t:"fl1",p:"1.3",l:4,q:"Sapendo che 1 Å = 10⁻¹⁰ m, quale uguaglianza è corretta?",o:["50 km = 5 · 10¹⁴ Å","50 km = 5 · 10¹³ Å","50 km = 5 · 10⁻⁶ Å","50 km = 5 · 10¹¹ Å"],a:0,e:"50 km = 5 · 10⁴ m; dividendo per 10⁻¹⁰ m/Å si ottiene 5 · 10⁴ · 10¹⁰ = 5 · 10¹⁴ Å."},
{id:"fl1_045",t:"fl1",p:"1.5.4",l:4,q:"Un lato misura (20,0 ± 0,1) cm e l'altro (5,0 ± 0,1) cm. Qual è l'errore percentuale sull'area del rettangolo?",o:["2,5%","0,5%","2%","0,2%"],a:0,e:"Errori percentuali: 0,1/20 = 0,5% e 0,1/5 = 2%. Nel prodotto si sommano: 0,5% + 2% = 2,5%."},
{id:"fl1_046",t:"fl1",p:"1.4.2",l:4,q:"Due vettori a e b hanno moduli 4 e 2. Se sono perpendicolari, quanto valgono |a + b| e |a − b|?",o:["Entrambi 2√5","6 e 2","2√5 e 2","6 e 2√5"],a:0,e:"Per vettori ortogonali sia la somma sia la differenza si calcolano con Pitagora: √(16 + 4) = √20 = 2√5. Hanno lo stesso modulo ma direzioni diverse."},
{id:"fl1_047",t:"fl1",p:"1.1.2",l:4,q:"Un angolo di 2π rad è…",o:["l'angolo giro, una grandezza adimensionale","un angolo piatto con dimensioni [L]","un numero puro pari a 3,14","un angolo retto"],a:0,e:"Gli angoli in radianti sono grandezze adimensionali. 2π rad è l'angolo giro; 2π da solo (senza «rad») è solo un numero puro, circa 6,28."},
{id:"fl1_048",t:"fl1",p:"1.1",l:1,q:"Che cosa significa misurare una grandezza fisica?",o:["Fissare un'unità di misura e stabilire quante volte è contenuta nella grandezza","Descriverla a parole","Stimarla a occhio","Confrontarla con un'altra grandezza qualsiasi"],a:0,e:"Misurare vuol dire confrontare la grandezza con un riferimento fissato (l'unità di misura): da qui la definizione operativa delle grandezze fisiche."},
{id:"fl1_049",t:"fl1",p:"1.1",l:2,q:"Che cosa si intende per definizione operativa di una grandezza fisica?",o:["Una definizione legata al procedimento con cui la grandezza si misura","Una definizione solo matematica","La definizione della sua unità nel CGS","Una definizione valida solo in laboratorio"],a:0,e:"Le grandezze fisiche sono tali solo se si possono misurare; la loro definizione è quindi legata al procedimento di misura."},
{id:"fl1_050",t:"fl1",p:"1.1.1",l:2,q:"Come si indicano le dimensioni delle grandezze fondamentali?",o:["Con una lettera tra parentesi quadre, per esempio [L] per la lunghezza","Con il simbolo dell'unità di misura tra tonde","Con un numero","Con una freccia"],a:0,e:"A ogni grandezza fondamentale è associata una lettera tra quadre: [L] lunghezza, [M] massa, [T] tempo, [i] corrente, [K] temperatura."},
{id:"fl1_051",t:"fl1",p:"1.3.1",l:1,q:"Nella notazione scientifica a · 10ᵇ, quante cifre diverse da zero ci sono prima della virgola in a?",o:["Una sola","Due","Nessuna","Quante se ne vuole"],a:0,e:"a è un decimale con una sola cifra diversa da zero prima della virgola; b è un intero."},
{id:"fl1_052",t:"fl1",p:"1.3.1",l:2,q:"Come si scrive −562,5 in notazione scientifica?",o:["−5,625 · 10²","−56,25 · 10¹","−5,625 · 10³","−0,5625 · 10³"],a:0,e:"Si sposta la virgola di due posti verso sinistra: −5,625 · 10²."},
{id:"fl1_053",t:"fl1",p:"1.4",l:1,q:"In un vettore, che cosa rappresenta la lunghezza della freccia?",o:["Il modulo (intensità)","La direzione","Il verso","Il punto di applicazione"],a:0,e:"La direzione è la retta su cui giace la freccia, il verso è indicato dalla punta, il punto di partenza è il punto di applicazione."},
{id:"fl1_054",t:"fl1",p:"1.4.1",l:1,q:"Moltiplicando un vettore a per 2, che cosa si ottiene?",o:["Un vettore con la stessa direzione e lo stesso verso, di modulo doppio","Un vettore perpendicolare ad a","Uno scalare pari a 2|a|","Un vettore di verso opposto"],a:0,e:"|2a| = 2|a|; con uno scalare positivo il verso resta concorde."},
{id:"fl1_055",t:"fl1",p:"1.4.1",l:2,q:"Che cos'è l'opposto di un vettore a?",o:["Il vettore −a, con lo stesso modulo e verso opposto","Un vettore perpendicolare ad a","Il vettore con modulo 1/|a|","Un vettore nullo"],a:0,e:"L'opposto si ottiene moltiplicando a per −1: stessa direzione e modulo, verso opposto."},
{id:"fl1_056",t:"fl1",p:"1.4.3",l:1,q:"Che cosa sono le componenti di un vettore su un sistema cartesiano?",o:["Le sue proiezioni ortogonali sugli assi","I suoi multipli","Il suo modulo e la sua direzione","Le sue diagonali"],a:0,e:"Sono i due vettori paralleli agli assi x e y la cui somma dà il vettore."},
{id:"fl1_057",t:"fl1",p:"1.4.3",l:2,q:"Un vettore di modulo 10 forma un angolo di 60° con l'asse x. Quanto vale la sua componente lungo x?",o:["5","5√3","10","8,66 · 10"],a:0,e:"|vₓ| = v · cos 60° = 10 · ½ = 5; la componente lungo y vale 10 · sen 60° = 5√3."},
{id:"fl1_058",t:"fl1",p:"1.5",l:2,q:"Perché gli errori sistematici sono considerati i più «pericolosi»?",o:["Perché sono difficili da individuare e non si riducono facendo la media","Perché sono sempre molto grandi","Perché sono casuali","Perché dipendono dall'operatore"],a:0,e:"Avvengono sempre nello stesso verso (per eccesso o per difetto), per esempio per difetti dello strumento."},
{id:"fl1_059",t:"fl1",p:"1.5.1",l:1,q:"Come si calcola la media aritmetica di n misure x₁, x₂, …, xₙ?",o:["(x₁ + x₂ + … + xₙ) / n","(xmax − xmin) / 2","x₁ · x₂ · … · xₙ","(xmax + xmin) · n"],a:0,e:"M = (x₁ + x₂ + … + xₙ)/n."},
{id:"fl1_060",t:"fl1",p:"1.5.1",l:2,q:"A che cosa serve fare più misure della stessa grandezza e calcolarne la media?",o:["A ridurre gli errori accidentali","A eliminare gli errori sistematici","A cambiare la sensibilità dello strumento","A ridurre le cifre significative"],a:0,e:"Gli errori accidentali sono per eccesso o per difetto e nella media tendono a compensarsi."},
{id:"fl1_061",t:"fl1",p:"1.5.1",l:2,q:"Tre misure di una lunghezza danno 12,0 cm, 12,4 cm e 12,2 cm. Qual è il valore medio?",o:["12,2 cm","12,4 cm","36,6 cm","0,2 cm"],a:0,e:"M = (12,0 + 12,4 + 12,2)/3 = 36,6/3 = 12,2 cm (l'errore assoluto sarebbe (12,4 − 12,0)/2 = 0,2 cm)."},
{id:"fl1_062",t:"fl1",p:"1.5.3",l:1,q:"Quante cifre significative ha 1,205?",o:["4","3","2","5"],a:0,e:"Le cifre diverse da zero sono significative e anche gli zeri compresi tra due cifre diverse da zero: 1, 2, 0, 5."},
{id:"fl2_001",t:"fl2",p:"2.1",l:1,q:"Quando un'automobile si può considerare un punto materiale?",o:["Quando i suoi spostamenti sono molto grandi rispetto alle sue dimensioni","Mai, perché è un corpo esteso","Solo quando è ferma","Solo se ha massa trascurabile"],a:0,e:"Considerare un corpo puntiforme dipende dal confronto tra le sue dimensioni e le altre lunghezze in gioco: un'auto che percorre chilometri si può trattare come un punto."},
{id:"fl2_002",t:"fl2",p:"2.1",l:1,q:"Che cos'è la traiettoria di un punto materiale?",o:["La linea che unisce tutte le posizioni occupate nel tempo","Il vettore che va dalla posizione iniziale a quella finale","La distanza totale percorsa","La velocità in ogni punto"],a:0,e:"La traiettoria è la linea di tutte le posizioni occupate. Il vettore dalla posizione iniziale alla finale è invece lo spostamento."},
{id:"fl2_003",t:"fl2",p:"2.1",l:2,q:"Perché si dice che ogni moto è «relativo»?",o:["Perché quiete e moto hanno senso solo rispetto a un sistema di riferimento scelto","Perché la velocità è sempre costante","Perché dipende dalla massa del corpo","Perché la traiettoria è sempre curva"],a:0,e:"Dire che un oggetto è fermo o in moto ha senso solo dopo aver fissato un sistema di riferimento, considerato fisso; nel libro di solito è un sistema solidale con la Terra."},
{id:"fl2_004",t:"fl2",p:"2.2.2",l:1,q:"A quanti m/s corrispondono 72 km/h?",o:["20 m/s","259,2 m/s","7,2 m/s","36 m/s"],a:0,e:"Da km/h a m/s si divide per 3,6: 72 / 3,6 = 20 m/s."},
{id:"fl2_005",t:"fl2",p:"2.2.3",l:1,q:"Qual è l'unità di misura dell'accelerazione nel SI?",o:["m/s²","m/s","m²/s","km/h"],a:0,e:"a = Δv/Δt, quindi (m/s)/s = m/s². Nel CGS si usa cm/s²."},
{id:"fl2_006",t:"fl2",p:"2.2.2",l:2,q:"Un camion va a 200 km/h per 0,5 h, a 150 km/h per 1 h e a 50 km/h per 2 h. Qual è la velocità media?",o:["100 km/h","133,3 km/h","150 km/h","116,7 km/h"],a:0,e:"Spazio totale 100 + 150 + 100 = 350 km in 3,5 h: v = 350/3,5 = 100 km/h. La velocità media non è la media delle velocità."},
{id:"fl2_007",t:"fl2",p:"2.2.2",l:2,q:"Un'auto percorre 140 km a una velocità media di 100 km/h. Quanto dura il viaggio?",o:["1 h e 24 min","1 h e 40 min","1 h e 4 min","1 h e 14 min"],a:0,e:"Δt = Δs/v = 140/100 = 1,4 h = 1 h + 0,4 · 60 min = 1 h e 24 min."},
{id:"fl2_008",t:"fl2",p:"2.2.3",l:2,q:"Un corpo si muove a velocità costante in modulo lungo una curva. La sua accelerazione è…",o:["diversa da zero, perché cambia la direzione della velocità","nulla, perché il modulo è costante","uguale a g","diretta come la velocità"],a:0,e:"L'accelerazione è la variazione del vettore velocità: anche se il modulo resta costante, su una curva cambia la direzione, quindi Δv ≠ 0."},
{id:"fl2_009",t:"fl2",p:"2.2.1",l:3,q:"Un punto passa dalla posizione (1; 3) alla posizione (4; 1). Quanto vale il modulo dello spostamento?",o:["√13","5","√5","13"],a:0,e:"Δx = 4 − 1 = 3, Δy = 1 − 3 = −2: |Δs| = √(9 + 4) = √13."},
{id:"fl2_010",t:"fl2",p:"2.2.3",l:3,q:"Un corpo che aumenta la sua velocità può avere un'accelerazione che diminuisce?",o:["Sì, purché l'accelerazione resti positiva","No, mai","Solo se il moto è circolare","Solo se la velocità è negativa"],a:0,e:"Se l'accelerazione resta positiva la velocità continua a crescere, anche se l'accelerazione si sta riducendo nel tempo."},
{id:"fl2_011",t:"fl2",p:"2.2.2",l:4,q:"Un veicolo va 10 km verso Est e poi 24 km verso Sud in 30 minuti. Quanto vale il modulo della velocità vettoriale media?",o:["52 km/h","68 km/h","34 km/h","26 km/h"],a:0,e:"Lo spostamento è l'ipotenusa: √(10² + 24²) = 26 km (terna 5-12-13 per 2). v = 26 km / 0,5 h = 52 km/h. Con la strada percorsa (34 km) si otterrebbe invece 68 km/h."},
{id:"fl2_012",t:"fl2",p:"2.3.1",l:1,q:"Un'auto procede a 72 km/h costanti. Quanti metri percorre in 5 secondi?",o:["100 m","360 m","14,4 m","50 m"],a:0,e:"72 km/h = 20 m/s; s = v·t = 20 · 5 = 100 m."},
{id:"fl2_013",t:"fl2",p:"2.3.1",l:1,q:"Nel moto rettilineo uniforme, com'è il grafico velocità-tempo?",o:["Una retta parallela all'asse dei tempi","Una retta passante per l'origine","Una parabola","Un'iperbole"],a:0,e:"La velocità è costante: il grafico v-t è una retta orizzontale all'altezza del valore della velocità."},
{id:"fl2_014",t:"fl2",p:"2.3.1",l:2,q:"Nel grafico spazio-tempo di un moto rettilineo uniforme, il coefficiente angolare della retta è…",o:["la velocità","l'accelerazione","lo spazio iniziale","il tempo totale"],a:0,e:"s = s₀ + v·t: la pendenza della retta nel piano s-t è numericamente uguale alla velocità."},
{id:"fl2_015",t:"fl2",p:"2.3.1",l:2,q:"Nel moto rettilineo uniforme con s₀ ≠ 0, il grafico s-t…",o:["è una retta che non passa per l'origine","è una retta passante per l'origine","è una parabola","è una retta orizzontale"],a:0,e:"Con s = s₀ + v·t la retta interseca l'asse s in s₀, quindi non passa per l'origine."},
{id:"fl2_016",t:"fl2",p:"2.3.2",l:1,q:"Una particella a 5,0 m/s accelera di 3,0 m/s² nel verso del moto. Che velocità ha dopo 4,0 s?",o:["17 m/s","12 m/s","20 m/s","8 m/s"],a:0,e:"v = v₀ + a·t = 5,0 + 3,0 · 4,0 = 17 m/s."},
{id:"fl2_017",t:"fl2",p:"2.3.2",l:2,q:"Un aereo parte da fermo e in 40 s raggiunge 360 km/h. Qual è l'accelerazione media?",o:["2,5 m/s²","9 m/s²","10 m/s²","0,25 m/s²"],a:0,e:"360 km/h = 100 m/s. a = Δv/Δt = 100/40 = 2,5 m/s²."},
{id:"fl2_018",t:"fl2",p:"2.3.2",l:2,q:"Nel moto uniformemente accelerato con v₀ = 0, il grafico velocità-tempo è…",o:["una semiretta passante per l'origine, con pendenza a","una parabola con vertice nell'origine","una retta orizzontale","un ramo di iperbole"],a:0,e:"v = a·t: velocità e tempo sono direttamente proporzionali e la pendenza è l'accelerazione. È il grafico s-t a essere una parabola."},
{id:"fl2_019",t:"fl2",p:"2.3.2",l:2,q:"Nel moto uniformemente accelerato con s₀ = v₀ = 0, che forma ha il grafico spazio-tempo?",o:["Una parabola con vertice nell'origine","Una retta passante per l'origine","Una retta orizzontale","Una sinusoide"],a:0,e:"s = ½at²: lo spazio dipende dal quadrato del tempo, quindi il grafico è una parabola."},
{id:"fl2_020",t:"fl2",p:"2.3.2",l:3,q:"Nel moto rettilineo uniformemente accelerato, velocità e accelerazione…",o:["possono essere antiparalleli, come in una frenata","sono sempre direttamente proporzionali","hanno sempre lo stesso verso","sono sempre perpendicolari"],a:0,e:"In frenata (o nella salita di un sasso lanciato in alto) la velocità ha verso opposto all'accelerazione. E v = v₀ + at non è una proporzionalità diretta."},
{id:"fl2_021",t:"fl2",p:"2.3.2",l:3,q:"Un tram a 12,0 m/s frena con decelerazione costante di 1,50 m/s² fino a fermarsi. Quanta strada fa?",o:["48 m","96 m","8 m","24 m"],a:0,e:"Tempo di arresto t = 12/1,5 = 8 s. s = v₀t − ½at² = 96 − ½ · 1,5 · 64 = 96 − 48 = 48 m."},
{id:"fl2_022",t:"fl2",p:"2.3.3",l:1,q:"Quanto vale circa l'accelerazione di gravità g sulla Terra?",o:["9,8 m/s²","98 m/s²","0,98 m/s²","6,67 m/s²"],a:0,e:"g ≈ 9,8 m/s². Il moto di caduta dei gravi si chiama anche moto naturalmente accelerato."},
{id:"fl2_023",t:"fl2",p:"2.3.3",l:1,q:"In un tubo vuoto cadono insieme un foglio di carta, un pezzo di legno e una sferetta di ferro. Quale arriva per primo?",o:["Arrivano insieme","La sferetta di ferro","Il pezzo di legno, perché più pesante","Il foglio di carta"],a:0,e:"Senza attrito il tempo di caduta t = √(2h/g) non dipende da massa, forma o materiale: arrivano insieme."},
{id:"fl2_024",t:"fl2",p:"2.3.3",l:2,q:"Un sasso lasciato cadere da una scogliera tocca l'acqua dopo 2 s. Quanto è alta circa la scogliera?",o:["Circa 20 m","Circa 10 m","Circa 40 m","Circa 15 m"],a:0,e:"h = ½gt² = ½ · 9,8 · 4 ≈ 19,6 m, cioè circa 20 m."},
{id:"fl2_025",t:"fl2",p:"2.3.3",l:2,q:"Dove è massima l'accelerazione di gravità g sulla superficie terrestre?",o:["Ai poli","All'Equatore","Alle medie latitudini","È uguale ovunque"],a:0,e:"g diminuisce passando dai poli all'Equatore (per effetto della forza centrifuga) e allontanandosi dalla superficie. È massima ai poli e minima all'Equatore."},
{id:"fl2_026",t:"fl2",p:"2.3.3",l:2,q:"Un oggetto viene lanciato verso l'alto a 9,8 m/s. Quale altezza massima raggiunge?",o:["4,9 m","9,8 m","1 m","19,6 m"],a:0,e:"hmax = v²/(2g) = 96,04/19,6 = 4,9 m. La massa dell'oggetto non conta."},
{id:"fl2_027",t:"fl2",p:"2.3.3",l:3,q:"Un corpo lanciato in alto impiega 1 s a salire. Dopo quanto tempo dal lancio ripassa per il punto di partenza?",o:["2 s","1 s","1,41 s","4 s"],a:0,e:"Il tempo per salire a una certa altezza è uguale al tempo per ripercorrerla in caduta: 1 s + 1 s = 2 s. Ripassa con la stessa velocità iniziale, rivolta in basso."},
{id:"fl2_028",t:"fl2",p:"2.3.3",l:3,q:"Un corpo cade da fermo da un'altezza h. Con quale velocità arriva a terra?",o:["√(2gh)","2gh","gh/2","√(h/2g)"],a:0,e:"Per la caduta da fermo: tempo t = √(2h/g) e velocità finale v = √(2gh)."},
{id:"fl2_029",t:"fl2",p:"2.3.3",l:4,q:"Un grave viene lasciato cadere da fermo da un precipizio (g = 9,8 m/s²). Quanto spazio percorre in 10 s?",o:["490 m","98 m","980 m","245 m"],a:0,e:"h = ½gt² = ½ · 9,8 · 100 = 490 m."},
{id:"fl2_030",t:"fl2",p:"2.3.4",l:1,q:"Nel moto circolare uniforme, che cosa resta costante?",o:["Il modulo della velocità","Il vettore velocità","La direzione della velocità","Il vettore accelerazione"],a:0,e:"Il modulo v = 2πr/T è costante, ma la direzione cambia di continuo (sempre tangente). Per questo c'è un'accelerazione centripeta."},
{id:"fl2_031",t:"fl2",p:"2.3.4",l:1,q:"In che unità si misura la frequenza?",o:["Hertz (s⁻¹)","Secondi","rad","m/s"],a:0,e:"La frequenza è il numero di giri al secondo: si misura in s⁻¹ = hertz (Hz). Il periodo invece si misura in secondi."},
{id:"fl2_032",t:"fl2",p:"2.3.4",l:2,q:"Un corpo gira su una circonferenza di raggio 50 cm con velocità angolare 2 rad/s. Qual è la velocità lineare?",o:["1 m/s","100 m/s","0,25 m/s","4 m/s"],a:0,e:"v = ω · r = 2 rad/s · 0,5 m = 1 m/s (il raggio va prima trasformato in metri)."},
{id:"fl2_033",t:"fl2",p:"2.3.4",l:2,q:"Un punto compie 4 giri ogni 2 secondi. Quanto vale il periodo?",o:["0,5 s","2 s","8 s","4 s"],a:0,e:"La frequenza è 4/2 = 2 Hz, quindi T = 1/f = 0,5 s."},
{id:"fl2_034",t:"fl2",p:"2.3.4",l:2,q:"Come è diretta l'accelerazione centripeta nel moto circolare uniforme?",o:["Lungo il raggio, verso il centro","Tangente alla traiettoria","Lungo il raggio, verso l'esterno","Perpendicolare al piano del moto"],a:0,e:"È radiale, dall'esterno verso il centro, e sempre perpendicolare alla velocità istantanea. Il modulo vale v²/r."},
{id:"fl2_035",t:"fl2",p:"2.3.4",l:3,q:"Un pianeta ha periodo di rotazione 36 ore. Rispetto alla Terra (24 ore), la sua velocità angolare è…",o:["minore","maggiore","uguale","non confrontabile"],a:0,e:"ω = 2π/T: con un periodo più lungo la velocità angolare è più piccola."},
{id:"fl2_036",t:"fl2",p:"2.3.4",l:3,q:"Su una giostra, un bambino al bordo e uno vicino al centro hanno…",o:["la stessa velocità angolare, ma velocità lineari diverse","la stessa velocità lineare","velocità angolari diverse","la stessa accelerazione centripeta"],a:0,e:"ω non dipende dalla distanza dal centro, mentre v = ω·r cresce con il raggio (e anche aₙ = ω²r)."},
{id:"fl2_037",t:"fl2",p:"2.3.4",l:3,q:"A quanti radianti corrisponde un angolo di 90°?",o:["π/2","π","π/4","2π"],a:0,e:"360° = 2π rad, quindi 90° = 2π · 90/360 = π/2 rad."},
{id:"fl2_038",t:"fl2",p:"2.3.4",l:4,q:"Un punto gira sul bordo di un disco di raggio 1 cm compiendo 4 giri in 2 s. Quanto vale circa l'accelerazione centripeta?",o:["1,6 m/s²","0,16 m/s²","16 m/s²","0,08 m/s²"],a:0,e:"T = 0,5 s; aₙ = 4π²r/T² = 4 · 9,87 · 0,01 / 0,25 ≈ 1,6 m/s²."},
{id:"fl2_039",t:"fl2",p:"2.3.5",l:1,q:"Il moto oscillatorio armonico si può ottenere come…",o:["proiezione su un diametro di un moto circolare uniforme","somma di due moti rettilinei uniformi","caduta libera con velocità iniziale","moto parabolico"],a:0,e:"È il moto del punto P', proiezione su un diametro di un punto P che si muove di moto circolare uniforme. Come quest'ultimo, è un moto periodico."},
{id:"fl2_040",t:"fl2",p:"2.3.5",l:2,q:"In un moto armonico, dove è massima la velocità?",o:["Al centro dell'oscillazione","Agli estremi","È uguale ovunque","A metà tra centro ed estremo"],a:0,e:"La velocità è massima nel centro O e nulla agli estremi A e B, dove il moto si inverte."},
{id:"fl2_041",t:"fl2",p:"2.3.5",l:2,q:"In un moto armonico, dove è massima l'accelerazione?",o:["Agli estremi dell'oscillazione","Al centro","È sempre nulla","È costante ovunque"],a:0,e:"L'accelerazione è proporzionale allo spostamento dal centro: massima agli estremi, nulla al centro."},
{id:"fl2_042",t:"fl2",p:"2.3.5",l:3,q:"Nella legge oraria x(t) = A sen(ωt + φ), che cosa rappresenta A?",o:["L'ampiezza massima dell'oscillazione","La pulsazione","La fase iniziale","Il periodo"],a:0,e:"A è l'ampiezza (metà della distanza tra gli estremi), ω è la pulsazione (dimensioni di un inverso di un tempo), φ la fase iniziale."},
{id:"fl2_043",t:"fl2",p:"2.4.1",l:1,q:"Un passeggero cammina nel verso di marcia di un treno. Per un osservatore a terra, la sua velocità è…",o:["maggiore di quella del treno","minore di quella del treno","uguale a quella del treno","uguale a quella con cui cammina"],a:0,e:"Velocità assoluta = velocità relativa + velocità di trascinamento. Camminando nel verso del treno, le due si sommano."},
{id:"fl2_044",t:"fl2",p:"2.4.2",l:2,q:"Nel moto parabolico (senza attrito), com'è il moto lungo l'orizzontale?",o:["Uniforme","Uniformemente accelerato con a = g","Uniformemente decelerato","Armonico"],a:0,e:"Lungo x non agisce nessuna accelerazione, quindi vₓ è costante. Lungo la verticale invece il moto è uniformemente accelerato con a = g."},
{id:"fl2_045",t:"fl2",p:"2.4.1",l:3,q:"Una barca attraversa un fiume largo 50 m a 5 m/s perpendicolarmente alla corrente, che va a 10 m/s. Di quanto viene trascinata a valle?",o:["100 m","50 m","25 m","500 m"],a:0,e:"Tempo di attraversamento: 50/5 = 10 s. Nel frattempo la corrente la sposta di 10 m/s · 10 s = 100 m."},
{id:"fl2_046",t:"fl2",p:"2.4.2",l:3,q:"Un corpo viene lanciato orizzontalmente da un'altezza h. Che forma ha la traiettoria?",o:["Una parabola con la concavità verso il basso","Una retta inclinata","Un arco di circonferenza","Una parabola con la concavità verso l'alto"],a:0,e:"x = vₓt e y = h − ½gt²: eliminando t si ottiene y = h − (g/2vₓ²)x², una parabola rivolta verso il basso."},
{id:"fl2_047",t:"fl2",p:"2.2.2",l:4,q:"Un'auto percorre 15 km in 10 minuti e poi 5 km in 5 minuti. Qual è la velocità media?",o:["80 km/h","70 km/h","60 km/h","90 km/h"],a:0,e:"20 km in 15 minuti = 0,25 h: v = 20/0,25 = 80 km/h."},
{id:"fl2_048",t:"fl2",p:"2.2.1",l:1,q:"Che cosa unisce il vettore spostamento?",o:["La posizione nell'istante iniziale con quella nell'istante finale","Tutti i punti della traiettoria","L'origine degli assi con la posizione finale","La velocità iniziale con quella finale"],a:0,e:"Δs = s₂ − s₁: è la differenza tra il vettore posizione finale e quello iniziale."},
{id:"fl2_049",t:"fl2",p:"2.2.1",l:2,q:"Che cosa indica l'operatore Δ applicato a una grandezza g?",o:["La variazione: valore finale meno valore iniziale","Il valore medio","Il valore iniziale meno quello finale","La somma dei valori"],a:0,e:"Δg = g(finale) − g(iniziale). Per esempio Δs = s₂ − s₁."},
{id:"fl2_050",t:"fl2",p:"2.2.1",l:2,q:"Un corridore fa un giro completo di una pista circolare e torna al punto di partenza. Quanto vale il suo spostamento?",o:["Zero","La lunghezza della pista","Il diametro della pista","Il raggio della pista"],a:0,e:"Posizione iniziale e finale coincidono, quindi Δs = 0, anche se la strada percorsa è un giro intero."},
{id:"fl2_051",t:"fl2",p:"2.4.1",l:2,q:"Un nuotatore attraversa un fiume nuotando perpendicolarmente alla corrente. Se la corrente aumenta, il tempo per attraversare…",o:["resta uguale","aumenta","diminuisce","si annulla"],a:0,e:"I due moti uniformi sono indipendenti: il tempo dipende solo dalla larghezza e dalla velocità perpendicolare; la corrente cambia solo quanto viene trascinato a valle."},
{id:"fl2_052",t:"fl2",p:"2.4.2",l:2,q:"Nel moto parabolico di un corpo lanciato orizzontalmente, come varia la componente verticale della velocità?",o:["Cresce in modulo come g · t","Resta costante","Diminuisce fino a zero","È sempre nulla"],a:0,e:"Lungo y il moto è uniformemente accelerato: vᵧ = −g·t (parte da zero se il lancio è orizzontale)."},
{id:"fl3_001",t:"fl3",p:"3.1",l:1,q:"Che cosa afferma il principio di relatività galileiana?",o:["Le leggi della fisica sono le stesse in tutti i sistemi in moto rettilineo uniforme gli uni rispetto agli altri","Il moto è sempre assoluto","La velocità della luce è uguale in tutti i sistemi","Le leggi della fisica cambiano nei sistemi in movimento"],a:0,e:"Galileo osservò che dall'interno di una «navicella» non si può capire se si è fermi o in moto rettilineo uniforme."},
{id:"fl3_002",t:"fl3",p:"3.1",l:2,q:"Perché la Terra non è un sistema inerziale perfetto?",o:["Per i suoi moti di rotazione e di rivoluzione","Perché ha una massa enorme","Perché è soggetta all'attrito dell'aria","Perché è sferica"],a:0,e:"Rotazione e rivoluzione non sono moti rettilinei uniformi. Su brevi intervalli di tempo la Terra è comunque una buona approssimazione di sistema inerziale; quello delle «stelle fisse» lo è ancora di più."},
{id:"fl3_003",t:"fl3",p:"3.1",l:2,q:"Due sistemi inerziali A e B si muovono con velocità uniformi diverse. Un esperimento fatto dentro A e dentro B permette di distinguerli?",o:["No, nessun esperimento li distingue","Sì, sempre","Solo con esperimenti di elettricità","Solo se uno dei due è fermo"],a:0,e:"Per il principio di relatività galileiana le leggi fisiche sono identiche nei due sistemi: nessun esperimento interno può rivelarne lo stato di moto."},
{id:"fl3_004",t:"fl3",p:"3.2.1",l:1,q:"Che cosa afferma il primo principio della dinamica?",o:["Un corpo con risultante delle forze nulla resta in quiete o in moto rettilineo uniforme","F = m·a","A ogni azione corrisponde una reazione uguale e contraria","Ogni corpo tende a fermarsi"],a:0,e:"È il principio d'inerzia: senza forze (o con forze in equilibrio) la velocità vettoriale resta costante."},
{id:"fl3_005",t:"fl3",p:"3.2.2",l:1,q:"Quale forza imprime a un corpo di 2 kg un'accelerazione di 5 m/s²?",o:["10 N","2,5 N","0,4 N","7 N"],a:0,e:"F = m·a = 2 kg · 5 m/s² = 10 N."},
{id:"fl3_006",t:"fl3",p:"3.2.3",l:1,q:"A quanti dyn corrisponde 1 N?",o:["10⁵ dyn","10³ dyn","10⁻⁵ dyn","10⁷ dyn"],a:0,e:"1 N = 1 kg·m/s² = 10³ g · 10² cm/s² = 10⁵ dyn."},
{id:"fl3_007",t:"fl3",p:"3.2.1",l:2,q:"Un'auto va a velocità costante in autostrada con il motore acceso. Qual è la risultante delle forze?",o:["Nulla: la spinta del motore bilancia gli attriti","Uguale alla forza del motore","Diretta nel verso del moto","Diretta all'indietro"],a:0,e:"La velocità è costante, quindi l'accelerazione è nulla: la forza del motore è uguale e contraria agli attriti (1ª legge)."},
{id:"fl3_008",t:"fl3",p:"3.2.6",l:2,q:"Le due forze di azione e reazione…",o:["sono applicate a due corpi diversi","sono applicate allo stesso corpo e si annullano","hanno la stessa direzione e lo stesso verso","hanno moduli diversi"],a:0,e:"F₁₂ = −F₂₁: stesso modulo, stessa direzione, verso opposto, ma una agisce su un corpo e l'altra sull'altro. Per questo non si annullano."},
{id:"fl3_009",t:"fl3",p:"3.2.4",l:2,q:"Un passeggero di un autobus in curva si sente spinto verso l'esterno. Come si chiama questa forza?",o:["Forza centrifuga, una forza apparente","Forza centripeta, una forza reale","Forza peso","Reazione vincolare"],a:0,e:"Nel sistema dell'autobus (non inerziale, perché accelerato) si introduce una forza fittizia, la centrifuga, uguale e contraria alla centripeta. Da terra si vede solo il corpo che prosegue in linea retta."},
{id:"fl3_010",t:"fl3",p:"3.2.6",l:3,q:"Una pattinatrice di 60 kg e un pattinatore di 80 kg si spingono a vicenda. Lei accelera di 2 m/s². Quanto accelera lui?",o:["1,5 m/s²","2,67 m/s²","2 m/s²","0,75 m/s²"],a:0,e:"Le forze sono uguali e opposte: m₁a₁ = m₂a₂ ⇒ a = 60 · 2 / 80 = 1,5 m/s²."},
{id:"fl3_011",t:"fl3",p:"3.2.1",l:3,q:"Un corpo fermo viene sottoposto a due forze di uguale intensità. Può restare fermo?",o:["Sì, solo se le due forze sono antiparallele (verso opposto)","Sì, sempre","No, mai","Sì, solo se sono perpendicolari"],a:0,e:"Le forze sono vettori: la loro risultante è nulla solo se hanno stessa direzione e verso opposto."},
{id:"fl3_012",t:"fl3",p:"3.2.4",l:3,q:"Se viene a mancare la forza centripeta, un corpo in moto circolare…",o:["prosegue in linea retta lungo la tangente","si muove verso l'esterno lungo il raggio","si ferma subito","continua a girare"],a:0,e:"Senza forza centripeta non c'è più accelerazione: il corpo prosegue di moto rettilineo uniforme lungo la tangente nel punto in cui la forza è cessata."},
{id:"fl3_013",t:"fl3",p:"3.2.5",l:1,q:"Qual è l'unità di misura della quantità di moto nel SI?",o:["kg·m/s","kg·m/s²","N","J"],a:0,e:"p = m·v, quindi kg · m/s. Le sue dimensioni sono [M][L][T]⁻¹."},
{id:"fl3_014",t:"fl3",p:"3.2.5",l:2,q:"Una massa di 5 kg ferma subisce una forza di 90 N per 2 s. Che velocità raggiunge?",o:["36 m/s","18 m/s","9 m/s","900 m/s"],a:0,e:"Teorema dell'impulso: F·Δt = Δp ⇒ 90 · 2 = 5 · v ⇒ v = 36 m/s."},
{id:"fl3_015",t:"fl3",p:"3.2.5",l:2,q:"Quando si conserva la quantità di moto totale di un sistema?",o:["Quando il sistema è isolato","Sempre","Solo se i corpi sono fermi","Solo negli urti elastici"],a:0,e:"Un sistema è isolato se le particelle sono soggette solo alle loro mutue interazioni: in questo caso la quantità di moto totale resta costante."},
{id:"fl3_016",t:"fl3",p:"3.2.5",l:3,q:"Un fucile di 1 kg spara un proiettile di 10 g a 200 km/h. Con che velocità rincula il fucile?",o:["2 km/h","20 km/h","0,2 km/h","200 km/h"],a:0,e:"La quantità di moto iniziale è nulla e resta nulla: M·v_f = m·v_p ⇒ 1000 g · v = 10 g · 200 km/h ⇒ v = 2 km/h, in verso opposto."},
{id:"fl3_017",t:"fl3",p:"3.3",l:1,q:"Quanto vale la costante di gravitazione universale G?",o:["6,67 · 10⁻¹¹ N·m²/kg²","9,8 m/s²","6,67 · 10¹¹ N·m²/kg²","6,02 · 10²³"],a:0,e:"G = 6,67 · 10⁻¹¹ N·m²/kg². Non va confusa con g, l'accelerazione di gravità terrestre."},
{id:"fl3_018",t:"fl3",p:"3.3",l:2,q:"Se la distanza tra due masse raddoppia, la forza gravitazionale…",o:["diventa un quarto","si dimezza","raddoppia","resta uguale"],a:0,e:"F = G·m₁m₂/r²: con 2r al denominatore c'è 4r², quindi la forza diventa ¼."},
{id:"fl3_019",t:"fl3",p:"3.3",l:2,q:"Se la distanza tra due corpi si dimezza, la loro attrazione gravitazionale…",o:["quadruplica","raddoppia","si dimezza","resta uguale"],a:0,e:"Con r/2 si ha (r/2)² = r²/4 al denominatore: la forza diventa 4 volte più grande."},
{id:"fl3_020",t:"fl3",p:"3.3",l:3,q:"Quali sono le dimensioni di G?",o:["[M]⁻¹[L]³[T]⁻²","[M][L][T]⁻²","[M]²[L]⁻²","[L][T]⁻²"],a:0,e:"G = F·r²/(m₁m₂): [M][L][T]⁻² · [L]² / [M]² = [M]⁻¹[L]³[T]⁻²."},
{id:"fl3_021",t:"fl3",p:"3.3",l:3,q:"Che rapporto c'è tra massa inerziale e massa gravitazionale di un corpo?",o:["Hanno natura diversa ma lo stesso valore e la stessa unità","Sono sempre diverse","La massa gravitazionale è il doppio","La massa inerziale dipende dal luogo"],a:0,e:"La massa inerziale misura l'opposizione al cambiamento di moto, quella gravitazionale l'attrazione tra i corpi. Sperimentalmente sono equivalenti: si misurano entrambe in kg."},
{id:"fl3_022",t:"fl3",p:"3.4",l:1,q:"Quanto pesa sulla Terra un corpo di massa 1 kg?",o:["9,8 N","1 N","0,98 N","98 N"],a:0,e:"P = m·g = 1 kg · 9,8 m/s² = 9,8 N: questo è 1 kg-peso."},
{id:"fl3_023",t:"fl3",p:"3.4",l:1,q:"Quale affermazione su massa e peso è corretta?",o:["La massa è scalare e non dipende dal luogo; il peso è un vettore e dipende dal luogo","Massa e peso sono la stessa cosa","La massa dipende dal luogo, il peso no","Sono entrambi vettori"],a:0,e:"La massa è una caratteristica intrinseca; il peso P = m·g è una forza, che cambia per esempio dalla Terra alla Luna."},
{id:"fl3_024",t:"fl3",p:"3.4",l:2,q:"Un oggetto di 1 kg viene portato sulla Luna. Che cosa cambia?",o:["Il peso, che diventa circa 1/6 (circa 1,6 N)","La massa, che diventa 1/6 kg","Massa e peso","Niente"],a:0,e:"La massa resta 1 kg; l'accelerazione gravitazionale lunare è circa sei volte più piccola, quindi il peso è circa 1,6 N."},
{id:"fl3_025",t:"fl3",p:"3.4",l:2,q:"Quanto vale circa la velocità di fuga dalla Terra?",o:["11 km/s","11 m/s","300.000 km/s","1,1 km/s"],a:0,e:"Vale √(2GM_T/r_T) ≈ 11 km/s e non dipende dalla massa del corpo lanciato."},
{id:"fl3_026",t:"fl3",p:"3.5",l:2,q:"Qual è l'unità di misura del peso specifico nel SI?",o:["N/m³","kg/m³","N/m²","kg/m²"],a:0,e:"Peso specifico = P/V, quindi newton su metro cubo. La densità (m/V) si misura invece in kg/m³."},
{id:"fl3_027",t:"fl3",p:"3.5",l:3,q:"La densità del benzene è 879 kg/m³. Quanto vale la sua densità relativa all'acqua?",o:["0,879, senza unità","879 kg/m³","8600 N/m³","0,879 kg/m³"],a:0,e:"Densità relativa = ρ_benzene/ρ_acqua = 879/1000 = 0,879. È un rapporto tra grandezze omogenee, quindi adimensionale."},
{id:"fl3_028",t:"fl3",p:"3.4",l:3,q:"Come è diretta la forza peso?",o:["Lungo la verticale, verso il centro della Terra","Sempre perpendicolare al piano d'appoggio","Nel verso del moto","Verso l'alto"],a:0,e:"P = m·g e la massa è positiva, quindi P ha direzione e verso di g: lungo la verticale verso il centro della Terra."},
{id:"fl3_029",t:"fl3",p:"3.6",l:1,q:"Che cosa misura il momento di una forza rispetto a un punto?",o:["La capacità della forza di far ruotare un corpo intorno al punto","La capacità di far traslare un corpo","L'energia del corpo","La quantità di moto"],a:0,e:"τ = r ∧ F; il suo modulo è F per il braccio b, cioè la distanza tra il polo e la retta d'azione della forza."},
{id:"fl3_030",t:"fl3",p:"3.6",l:2,q:"Una forza è diretta lungo la retta che passa per il polo. Quanto vale il suo momento?",o:["Zero","F·r","Il massimo possibile","F/r"],a:0,e:"Se F è parallela a r, sen 0° = 0 e il braccio è nullo: la forza non genera rotazione rispetto a quel polo."},
{id:"fl3_031",t:"fl3",p:"3.6.1",l:2,q:"Che effetto ha una coppia di forze su un corpo rigido libero?",o:["Lo fa ruotare pur avendo risultante nulla","Lo fa traslare","Non ha alcun effetto","Lo deforma soltanto"],a:0,e:"Le due forze sono parallele, uguali e opposte: la risultante è nulla, ma il momento F·b fa ruotare il corpo."},
{id:"fl3_032",t:"fl3",p:"3.7",l:2,q:"Dove si trova il baricentro di un anello omogeneo?",o:["Nel centro geometrico, fuori dal materiale dell'anello","Su un punto qualsiasi dell'anello","Nel punto più basso","Non ha baricentro"],a:0,e:"Il baricentro può anche essere esterno al corpo: per un anello omogeneo coincide con il centro, dove non c'è materiale."},
{id:"fl3_033",t:"fl3",p:"3.8",l:3,q:"Quali condizioni servono perché un corpo rigido sia in equilibrio?",o:["Risultante delle forze nulla e momento risultante nullo","Solo risultante delle forze nulla","Solo momento risultante nullo","Che sia appoggiato su un piano"],a:0,e:"Per un punto materiale basta R = 0. Per un corpo rigido serve anche τ = 0, altrimenti può ruotare."},
{id:"fl3_034",t:"fl3",p:"3.6.1",l:3,q:"Che differenza c'è tra il momento di una forza e quello di una coppia?",o:["Il primo dipende dal polo, il secondo è lo stesso per ogni punto","Sono entrambi indipendenti dal polo","Dipendono entrambi dal polo","Il momento di una coppia è sempre nullo"],a:0,e:"Cambiando polo cambia r, quindi cambia il momento di una forza. Il momento di una coppia invece vale F·b rispetto a qualunque punto del piano."},
{id:"fl3_035",t:"fl3",p:"3.8",l:3,q:"Un equilibrio si dice stabile quando…",o:["dopo un piccolo disturbo nasce una forza che riporta il corpo nella posizione di equilibrio","il corpo resta nella nuova posizione","il corpo si allontana sempre di più","il corpo non ha peso"],a:0,e:"Nell'equilibrio stabile una componente del peso riporta il corpo indietro; in quello instabile lo allontana; in quello indifferente il corpo resta dove viene spostato."},
{id:"fl3_036",t:"fl3",p:"3.9.1",l:1,q:"A quale specie appartiene una leva con il fulcro tra forza motrice e resistenza, come le forbici?",o:["Prima specie","Seconda specie","Terza specie","Non è una leva"],a:0,e:"Prima specie: fulcro in mezzo. Seconda: resistenza in mezzo (schiaccianoci). Terza: forza motrice in mezzo (braccio umano)."},
{id:"fl3_037",t:"fl3",p:"3.9.1",l:1,q:"Quale tipo di leva è sempre svantaggioso?",o:["La leva di terza specie","La leva di seconda specie","La leva di prima specie","Nessuna leva è svantaggiosa"],a:0,e:"Nella terza specie la forza motrice sta tra fulcro e resistenza, quindi il suo braccio è sempre più corto: V < 1."},
{id:"fl3_038",t:"fl3",p:"3.9.2",l:2,q:"Che tipo di leva è l'avambraccio?",o:["Terza specie: fulcro nel gomito, forza dei muscoli bicipite e brachiale","Prima specie","Seconda specie","Non è una leva"],a:0,e:"Fulcro: articolazione del gomito; forza motrice: bicipite e brachiale anteriore; resistenza: peso dell'avambraccio e del carico. La testa invece è una leva di 1ª specie e l'anca di 2ª."},
{id:"fl3_039",t:"fl3",p:"3.9.3",l:2,q:"Quanto vale il vantaggio di una carrucola mobile?",o:["2","1","0,5","4"],a:0,e:"Metà della resistenza si scarica sul sostegno: Fm = Fr/2, quindi V = 2. La carrucola fissa ha V = 1."},
{id:"fl3_040",t:"fl3",p:"3.9.3",l:2,q:"A che cosa serve una carrucola fissa, se non è vantaggiosa (V = 1)?",o:["A sollevare un corpo tirando verso il basso","A dimezzare la forza necessaria","A raddoppiare la forza","A ridurre il peso del corpo"],a:0,e:"La carrucola fissa è indifferente, ma cambia la direzione della forza: si solleva il carico tirando la corda verso il basso."},
{id:"fl3_041",t:"fl3",p:"3.9.3",l:3,q:"Un paranco ha 3 carrucole mobili. Che forza serve per tenere in equilibrio un carico di 600 N?",o:["100 N","200 N","300 N","600 N"],a:0,e:"Per il paranco Fm = Fr/(2n) = 600/6 = 100 N; il vantaggio è V = 2n = 6."},
{id:"fl3_042",t:"fl3",p:"3.9.4",l:3,q:"Su un piano inclinato lungo 5 m con un dislivello di 1 m, che forza parallela al piano serve per tenere fermo un corpo di 500 N (senza attrito)?",o:["100 N","500 N","2500 N","250 N"],a:0,e:"Fm = Fr · h/l = 500 · 1/5 = 100 N. Il vantaggio è l/h = 5: il piano inclinato è sempre vantaggioso."},
{id:"fl3_043",t:"fl3",p:"3.9.1",l:3,q:"Su una leva, una forza motrice con braccio 2 m equilibra una resistenza di 300 N con braccio 0,5 m. Quanto vale la forza motrice?",o:["75 N","1200 N","150 N","300 N"],a:0,e:"Fm·bm = Fr·br ⇒ Fm = 300 · 0,5 / 2 = 75 N."},
{id:"fl3_044",t:"fl3",p:"3.10",l:1,q:"Come si definisce il momento angolare di una particella rispetto a un punto?",o:["L = r ∧ p, prodotto vettoriale tra vettore posizione e quantità di moto","L = m·v","L = F·b","L = ½Iω²"],a:0,e:"È il momento della quantità di moto: vettore perpendicolare al piano di r e p, dipende dal polo scelto."},
{id:"fl3_045",t:"fl3",p:"3.10.1",l:2,q:"Quanto vale il momento d'inerzia di una particella di massa m che ruota a distanza r?",o:["I = m·r²","I = m·r","I = m/r²","I = m·v·r"],a:0,e:"Nel moto circolare L = m·v·r = m·r²·ω: la quantità m·r² è il momento d'inerzia I, quindi L = I·ω."},
{id:"fl3_046",t:"fl3",p:"3.10.1",l:3,q:"Una pattinatrice in trottola dimezza il suo momento d'inerzia avvicinando le braccia. La sua velocità angolare…",o:["raddoppia","si dimezza","resta uguale","quadruplica"],a:0,e:"Senza attriti il momento angolare L = I·ω si conserva: se I si dimezza, ω raddoppia."},
{id:"fl3_047",t:"fl3",p:"3.11",l:1,q:"Com'è la forza elastica di una molla?",o:["Opposta e proporzionale alla deformazione: F = −k·x","Costante","Proporzionale al quadrato della deformazione","Nello stesso verso della deformazione"],a:0,e:"È una forza di richiamo: tende sempre a riportare la massa nella posizione di equilibrio x = 0."},
{id:"fl3_048",t:"fl3",p:"3.11.1",l:2,q:"Da che cosa NON dipende il periodo di un pendolo semplice?",o:["Dalla massa appesa e dall'ampiezza delle oscillazioni","Dalla lunghezza del filo","Dall'accelerazione di gravità","Né dalla lunghezza né da g"],a:0,e:"T = 2π√(l/g): dipende solo da lunghezza del filo e g."},
{id:"fl3_049",t:"fl3",p:"3.11.1",l:2,q:"Come varia il periodo di un sistema massa-molla se la massa quadruplica?",o:["Raddoppia","Quadruplica","Si dimezza","Resta uguale"],a:0,e:"T = 2π√(m/k): con 4m la radice raddoppia, quindi anche il periodo."},
{id:"fl3_050",t:"fl3",p:"3.11.1",l:3,q:"Come varia il periodo di un pendolo semplice se la lunghezza del filo diventa 4 volte maggiore?",o:["Raddoppia","Quadruplica","Si dimezza","Resta uguale"],a:0,e:"T = 2π√(l/g): √4 = 2, quindi il periodo raddoppia."},
{id:"fl3_051",t:"fl3",p:"3.11.2",l:3,q:"Nel moto armonico di una massa su una molla, a quanto è uguale ω?",o:["√(k/m)","k/m","√(m/k)","2π·k·m"],a:0,e:"Da m·a = −k·x si ha a = −(k/m)·x; ponendo ω² = k/m si ottiene la pulsazione ω = √(k/m)."},
{id:"fl3_052",t:"fl3",p:"3.12",l:1,q:"Come si calcola l'intensità della forza di attrito radente?",o:["F = f·N","F = f/N","F = m·a","F = f·v"],a:0,e:"È proporzionale alla forza normale N che tiene a contatto i corpi; f è il coefficiente di attrito (statico o dinamico)."},
{id:"fl3_053",t:"fl3",p:"3.12",l:2,q:"Che relazione c'è tra coefficiente di attrito statico e dinamico per uno stesso materiale?",o:["Lo statico è maggiore del dinamico","Il dinamico è maggiore dello statico","Sono sempre uguali","Dipende dalla velocità"],a:0,e:"fs > fd: è più difficile mettere in moto un corpo fermo che mantenerlo in movimento."},
{id:"fl3_054",t:"fl3",p:"3.12",l:2,q:"Quale affermazione sull'attrito volvente è corretta?",o:["È sempre inferiore all'attrito radente","È sempre maggiore dell'attrito radente","Si ha solo nei fluidi","Non dipende dalle superfici"],a:0,e:"L'attrito volvente si oppone al rotolamento ed è sperimentalmente sempre minore di quello radente."},
{id:"fl3_055",t:"fl3",p:"3.12",l:3,q:"Un corpo di 10 kg è su un piano orizzontale con coefficiente di attrito dinamico 0,2 (g = 10 m/s²). Che forza orizzontale serve per farlo scivolare a velocità costante?",o:["20 N","100 N","2 N","50 N"],a:0,e:"A velocità costante la forza applicata bilancia l'attrito: F = fd·N = 0,2 · 10 · 10 = 20 N."},
{id:"fl3_056",t:"fl3",p:"3.2.1",l:4,q:"Un ascensore scende a velocità costante. Che cosa indica la bilancia su cui si pesa un ragazzo?",o:["Il suo peso normale","Un peso maggiore","Un peso minore","Zero"],a:0,e:"A velocità costante l'accelerazione è nulla: il sistema si comporta come uno fermo e la bilancia segna il peso normale."},
{id:"fl3_057",t:"fl3",p:"3.3",l:4,q:"La massa di un pianeta è doppia di quella terrestre e il raggio è doppio. Quanto vale g sulla sua superficie rispetto alla Terra?",o:["La metà","Il doppio","Lo stesso","Un quarto"],a:0,e:"g = G·M/R²: con 2M e 2R si ha 2/4 = ½ del valore terrestre."},
{id:"fl3_058",t:"fl3",p:"3.9.1",l:4,q:"Alice (40 kg) e Bob stanno in equilibrio agli estremi di un dondolo con il fulcro al centro. Quanto pesa Bob?",o:["392 N","40 N","196 N","784 N"],a:0,e:"Bracci uguali ⇒ pesi uguali: P = 40 · 9,8 = 392 N."},
{id:"fl3_059",t:"fl3",p:"3.12",l:4,q:"Un corpo di 2 kg (fs = 0,5, fd = 0,3) è tirato da 20 N a 60° sull'orizzontale. Quanto vale la componente orizzontale della forza applicata?",o:["10 N","17,3 N","20 N","5 N"],a:0,e:"Fₓ = F·cos 60° = 20 · 0,5 = 10 N. La componente verticale (≈ 17,3 N) riduce la forza normale e quindi l'attrito."},
{id:"fl3_060",t:"fl3",p:"3.2.5",l:4,q:"Un corpo di 2 kg passa da 3 m/s a 7 m/s in 0,5 s. Quale forza media ha agito?",o:["16 N","8 N","4 N","20 N"],a:0,e:"Δp = 2 · (7 − 3) = 8 kg·m/s; F = Δp/Δt = 8/0,5 = 16 N."},
{id:"fl3_061",t:"fl3",p:"3.2.2",l:1,q:"Come si chiama la costante di proporzionalità tra forza e accelerazione nella seconda legge della dinamica?",o:["Massa inerziale","Peso","Densità","Quantità di moto"],a:0,e:"F = m·a: m è la massa inerziale, che esprime la resistenza del corpo a cambiare il suo stato di moto."},
{id:"fl3_062",t:"fl3",p:"3.2.2",l:2,q:"Su un corpo di 4 kg agiscono due forze nello stesso verso, di 6 N e 10 N. Qual è l'accelerazione?",o:["4 m/s²","1 m/s²","64 m/s²","2,5 m/s²"],a:0,e:"F è la risultante: 6 + 10 = 16 N; a = 16/4 = 4 m/s². La seconda legge è una relazione vettoriale."},
{id:"fl3_063",t:"fl3",p:"3.2.3",l:1,q:"Con quale strumento si misurano le forze?",o:["Il dinamometro","Il barometro","Il termometro","L'amperometro"],a:0,e:"Il dinamometro misura la forza tramite l'allungamento di una molla."},
{id:"fl3_064",t:"fl3",p:"3.2.3",l:2,q:"Quali sono le dimensioni di una forza?",o:["[M][L][T]⁻²","[M][L][T]⁻¹","[M][L]²[T]⁻²","[L][T]⁻²"],a:0,e:"F = m·a: [M] · [L][T]⁻². Nel SI: kg·m/s² = N."},
{id:"fl3_065",t:"fl3",p:"3.2.4",l:2,q:"Un passeggero su un treno in frenata vede la sua valigia cadere in avanti. Per spiegarlo introduce una forza. Di che tipo è?",o:["Una forza fittizia, perché il treno in frenata è un sistema non inerziale","Una forza reale dovuta al motore","La forza peso","Una reazione vincolare"],a:0,e:"Nei sistemi non inerziali (accelerati) si introducono forze apparenti per poter applicare il principio d'inerzia."},
{id:"fl3_066",t:"fl3",p:"3.2.6",l:1,q:"Come sono, in modulo, le forze di azione e reazione tra due corpi?",o:["Uguali","Quella di azione è maggiore","Quella di reazione è maggiore","Dipende dalle masse"],a:0,e:"F₁₂ = −F₂₁: stesso modulo e direzione, verso opposto. Le accelerazioni invece dipendono dalle masse."},
{id:"fl3_067",t:"fl3",p:"3.5",l:1,q:"Quanto vale la densità dell'acqua?",o:["1000 kg/m³","1 kg/m³","100 kg/m³","10.000 kg/m³"],a:0,e:"ρ = m/V; per l'acqua 10³ kg/m³, cioè 1 kg/dm³."},
{id:"fl3_068",t:"fl3",p:"3.5",l:2,q:"Quanto vale circa il peso specifico dell'acqua?",o:["Circa 10.000 N/m³","1000 N/m³","1000 kg/m³","9,8 N/m³"],a:0,e:"Peso specifico = ρ·g = 1000 · 9,8 ≈ 10⁴ N/m³."},
{id:"fl3_069",t:"fl3",p:"3.6",l:2,q:"Il momento di una forza dipende dal polo scelto?",o:["Sì: cambiando polo cambia il vettore r e quindi il momento","No, mai","Solo se la forza è nulla","Solo per le coppie di forze"],a:0,e:"τ = r ∧ F: a seconda del polo la stessa forza può avere momento nullo o diverso da zero."},
{id:"fl3_070",t:"fl3",p:"3.6.1",l:1,q:"Come sono le due forze che formano una coppia?",o:["Parallele, di uguale intensità e verso opposto","Perpendicolari e uguali","Parallele e concordi","Di intensità diversa"],a:0,e:"La risultante è nulla ma il momento F·b fa ruotare il corpo intorno a un asse perpendicolare al piano delle forze."},
{id:"fl3_071",t:"fl3",p:"3.7",l:1,q:"Che cos'è il baricentro di un corpo?",o:["Il punto in cui si può immaginare concentrato tutto il peso del corpo","Il punto più basso del corpo","Il centro geometrico, sempre interno al corpo","Il punto dove agisce l'attrito"],a:0,e:"È il punto di applicazione della risultante di tutte le forze peso delle parti del corpo (centro di gravità)."},
{id:"fl3_072",t:"fl3",p:"3.7",l:2,q:"Un corpo sospeso per il suo baricentro è…",o:["in equilibrio comunque lo si orienti","sempre in equilibrio instabile","in equilibrio solo in una posizione","mai in equilibrio"],a:0,e:"Rispetto al baricentro la somma dei momenti delle forze peso è nulla in qualunque posizione."},
{id:"fl3_073",t:"fl3",p:"3.8",l:2,q:"Quando un punto materiale è in equilibrio?",o:["Quando la risultante delle forze applicate è nulla","Quando il momento risultante è nullo","Quando non ha peso","Quando si muove di moto accelerato"],a:0,e:"Per un punto materiale basta R = 0; per un corpo rigido serve anche il momento risultante nullo."},
{id:"fl3_074",t:"fl3",p:"3.9",l:1,q:"Come si definisce il vantaggio statico di una macchina?",o:["V = Fr/Fm, forza resistente diviso forza motrice","V = Fm/Fr","V = Fm · Fr","V = lavoro/tempo"],a:0,e:"Se V > 1 la macchina è vantaggiosa, se V < 1 svantaggiosa, se V = 1 indifferente."},
{id:"fl3_075",t:"fl3",p:"3.9",l:1,q:"In una macchina, che cos'è la forza resistente?",o:["La forza da vincere","La forza che compie l'azione","L'attrito dell'aria","La reazione del fulcro"],a:0,e:"La forza motrice Fm è quella che compie l'azione, la forza resistente Fr quella da vincere."},
{id:"fl3_076",t:"fl3",p:"3.9",l:2,q:"Una macchina ha vantaggio statico 0,5. Com'è?",o:["Svantaggiosa: serve una forza motrice doppia della resistente","Vantaggiosa","Indifferente","Impossibile"],a:0,e:"V = Fr/Fm = 0,5 ⇒ Fm = 2Fr."},
{id:"fl3_077",t:"fl3",p:"3.9.2",l:1,q:"Che tipo di leva è la testa, con il fulcro nell'articolazione atlanto-occipitale?",o:["Prima specie","Seconda specie","Terza specie","Non è una leva"],a:0,e:"Fulcro nell'articolazione atlanto-occipitale, resistenza = peso della testa, forza motrice = muscoli posteriori del collo."},
{id:"fl3_078",t:"fl3",p:"3.9.2",l:2,q:"Secondo il libro, che tipo di leva è l'anca?",o:["Seconda specie","Prima specie","Terza specie","Una carrucola"],a:0,e:"Fulcro nell'anca, forza resistente = peso della gamba, forza motrice = muscoli quadricipite e sartorio."},
{id:"fl3_079",t:"fl3",p:"3.9.4",l:1,q:"Per tenere fermo un corpo su un piano inclinato nel modo più vantaggioso, come va applicata la forza motrice?",o:["Parallela al piano","Verticale","Perpendicolare al piano","Orizzontale"],a:0,e:"La forza motrice deve bilanciare la componente del peso parallela al piano; quella perpendicolare è bilanciata dalla reazione vincolare."},
{id:"fl3_080",t:"fl3",p:"3.9.4",l:2,q:"Il piano inclinato è una macchina…",o:["sempre vantaggiosa, perché l > h","sempre svantaggiosa","indifferente","vantaggiosa solo se l'angolo supera 45°"],a:0,e:"V = l/h e la lunghezza del piano è sempre maggiore del dislivello."},
{id:"fl3_081",t:"fl3",p:"3.10",l:2,q:"Quando si conserva il momento angolare di un sistema?",o:["Quando il sistema è isolato","Sempre","Solo nei moti rettilinei","Mai"],a:0,e:"Come la quantità di moto, il momento angolare di un sistema isolato si conserva. Una coppia di momento τ invece lo fa variare."},
{id:"fl3_082",t:"fl3",p:"3.10",l:2,q:"Quanto vale il momento angolare di una particella in moto circolare uniforme?",o:["L = m·v·r","L = m·v","L = ½mv²","L = m·r"],a:0,e:"Velocità e vettore posizione sono perpendicolari, quindi |r ∧ p| = r·m·v."},
{id:"fl3_083",t:"fl3",p:"3.10.1",l:2,q:"Che cosa indica il momento d'inerzia di un corpo?",o:["L'opposizione del corpo a variare la sua velocità angolare","La massa del corpo","L'opposizione a variare la velocità lineare","L'energia di rotazione"],a:0,e:"I = m·r²: è per le rotazioni l'analogo della massa per le traslazioni."},
{id:"fl3_084",t:"fl3",p:"3.11",l:1,q:"Il moto armonico è il moto della proiezione su un diametro di un punto che si muove…",o:["di moto circolare uniforme","di moto rettilineo uniforme","di caduta libera","di moto parabolico"],a:0,e:"La legge oraria è sinusoidale e l'oscillazione va da −X a +X."},
{id:"fl3_085",t:"fl3",p:"3.11",l:2,q:"Che relazione c'è tra pulsazione ω e periodo T nel moto armonico?",o:["ω = 2π/T","ω = T/2π","ω = 2πT","ω = 1/T"],a:0,e:"ω = 2π/T = 2πν, con ν frequenza."},
{id:"fl3_086",t:"fl3",p:"3.11.2",l:2,q:"Nel moto armonico l'accelerazione è…",o:["direttamente proporzionale allo spostamento dalla posizione di equilibrio","costante","proporzionale alla velocità","sempre nulla"],a:0,e:"Da m·a = −k·x: a = −(k/m)·x."},
{id:"fl3_087",t:"fl3",p:"3.11.2",l:3,q:"Che cosa rappresenta φ nella legge oraria x(t) = A·sen(ωt + φ)?",o:["La fase iniziale, legata alle condizioni iniziali","L'ampiezza","La pulsazione","Il periodo"],a:0,e:"A è l'ampiezza massima, ω = √(k/m) la pulsazione, φ la fase iniziale."},
{id:"fl3_088",t:"fl3",p:"3.11.3",l:1,q:"Qual è il periodo di un pendolo semplice?",o:["T = 2π√(l/g)","T = 2π√(m/k)","T = 2π√(g/l)","T = 2πl/g"],a:0,e:"Per il sistema massa-molla invece T = 2π√(m/k)."},
{id:"fl3_089",t:"fl3",p:"3.11.3",l:2,q:"Quanto vale la frequenza di un sistema massa-molla?",o:["ν = (1/2π)·√(k/m)","ν = 2π·√(m/k)","ν = √(k/m)","ν = k/m"],a:0,e:"La frequenza è l'inverso del periodo T = 2π√(m/k)."},
{id:"fl3_090",t:"fl3",p:"3.11.3",l:2,q:"Quanto vale la pulsazione di un pendolo semplice?",o:["ω = √(g/l)","ω = √(l/g)","ω = √(k/m)","ω = g/l"],a:0,e:"Nel pendolo il ruolo di k/m è preso da g/l."},
{id:"fl4_001",t:"fl4",p:"4.1",l:1,q:"Qual è l'unità di misura del lavoro nel SI?",o:["Joule (J)","Watt (W)","Newton (N)","Pascal (Pa)"],a:0,e:"L = F·s, quindi N·m = joule. Nel CGS si usa l'erg."},
{id:"fl4_002",t:"fl4",p:"4.1",l:1,q:"Il lavoro è una grandezza…",o:["scalare","vettoriale","adimensionale","fondamentale"],a:0,e:"È il prodotto scalare di due vettori (forza e spostamento), quindi è un numero, che può essere positivo, negativo o nullo."},
{id:"fl4_003",t:"fl4",p:"4.1",l:2,q:"Quanto lavoro compie la forza centripeta in un moto circolare uniforme?",o:["Zero","m·v²","½mv²","Dipende dal raggio"],a:0,e:"La forza centripeta è perpendicolare alla velocità e quindi allo spostamento: cos 90° = 0."},
{id:"fl4_004",t:"fl4",p:"4.1",l:2,q:"Una forza di 10 N sposta un corpo di 2 m formando un angolo di 150° con lo spostamento. Il lavoro è…",o:["negativo, circa −17,3 J","positivo, circa 17,3 J","nullo","20 J"],a:0,e:"L = 10 · 2 · cos 150° = 20 · (−√3/2) ≈ −17,3 J. Con angoli maggiori di 90° il lavoro è negativo."},
{id:"fl4_005",t:"fl4",p:"4.1",l:2,q:"A quanti erg corrisponde 1 J?",o:["10⁷ erg","10⁵ erg","10³ erg","10⁻⁷ erg"],a:0,e:"1 J = 1 N · 1 m = 10⁵ dyn · 10² cm = 10⁷ erg."},
{id:"fl4_006",t:"fl4",p:"4.1",l:3,q:"Un carrello si muove su un piano orizzontale. Quale forza NON compie lavoro?",o:["La forza peso","La forza che lo tira nella direzione del moto","La forza d'attrito","Una forza inclinata di 30° sul piano"],a:0,e:"Il peso è verticale e lo spostamento orizzontale: sono perpendicolari, quindi il lavoro del peso è nullo."},
{id:"fl4_007",t:"fl4",p:"4.1",l:3,q:"Per quale angolo tra forza e spostamento il lavoro è massimo?",o:["0°","90°","180°","45°"],a:0,e:"L = F·s·cos α è massimo quando cos α = 1, cioè quando forza e spostamento sono paralleli e concordi."},
{id:"fl4_008",t:"fl4",p:"4.2",l:1,q:"Qual è l'unità di misura della potenza nel SI?",o:["Watt (W = J/s)","Joule","Kilowattora","Cavallo vapore"],a:0,e:"P = L/Δt: joule al secondo, cioè watt. CV e hp sono unità tecniche non del SI."},
{id:"fl4_009",t:"fl4",p:"4.2",l:1,q:"Il kilowattora è un'unità di misura di…",o:["lavoro (energia)","potenza","forza","tempo"],a:0,e:"È il lavoro compiuto in un'ora da una macchina di 1000 W: 1 kWh = 3,6 · 10⁶ J."},
{id:"fl4_010",t:"fl4",p:"4.2",l:2,q:"A quanti joule corrisponde 1 kWh?",o:["3,6 · 10⁶ J","3,6 · 10³ J","1000 J","3600 J"],a:0,e:"1 kWh = 1000 W · 3600 s = 3,6 · 10⁶ J."},
{id:"fl4_011",t:"fl4",p:"4.2",l:2,q:"Una macchina compie in un'ora un lavoro di 0,5 kWh. Che potenza ha?",o:["500 W","0,5 W","1800 W","5000 W"],a:0,e:"0,5 kWh in un'ora corrispondono a 0,5 kW, cioè 500 W."},
{id:"fl4_012",t:"fl4",p:"4.2",l:2,q:"Una forza di 50 N spinge un corpo a velocità costante di 4 m/s nella sua direzione. Che potenza sviluppa?",o:["200 W","12,5 W","54 W","800 W"],a:0,e:"P = F·v = 50 · 4 = 200 W."},
{id:"fl4_013",t:"fl4",p:"4.2",l:3,q:"Una centrale alimenta un milione di alloggi che consumano in media 1 kW ciascuno. Che potenza deve erogare?",o:["1 GW","1 MW","1 TW","100 MW"],a:0,e:"10⁶ · 10³ W = 10⁹ W = 1 GW."},
{id:"fl4_014",t:"fl4",p:"4.2",l:3,q:"A quanti watt corrisponde circa 1 cavallo vapore (CV)?",o:["735,5 W","1000 W","745,7 W","75 W"],a:0,e:"1 CV = 75 kg-peso · 1 m/s ≈ 735,5 W. Il cavallo britannico (hp) vale invece circa 745,7 W."},
{id:"fl4_015",t:"fl4",p:"4.3.1",l:1,q:"Come si calcola l'energia cinetica?",o:["½mv²","mgh","mv","½kx²"],a:0,e:"L'energia cinetica è l'energia di movimento e non dipende dalla posizione del corpo."},
{id:"fl4_016",t:"fl4",p:"4.3.1",l:2,q:"Se la velocità di un corpo raddoppia, la sua energia cinetica…",o:["quadruplica","raddoppia","resta uguale","si dimezza"],a:0,e:"Ec = ½mv²: dipende dal quadrato della velocità, quindi 2² = 4."},
{id:"fl4_017",t:"fl4",p:"4.3.1",l:2,q:"Che cosa afferma il teorema dell'energia cinetica?",o:["Il lavoro della forza agente è uguale alla variazione di energia cinetica","L'energia cinetica è sempre costante","Il lavoro è uguale all'energia potenziale","La potenza è uguale all'energia cinetica"],a:0,e:"L_AB = Ec,B − Ec,A per un corpo soggetto alla sola forza F."},
{id:"fl4_018",t:"fl4",p:"4.3.1",l:3,q:"Un corpo di 1 g viene lasciato cadere da 2 m. Quanto vale la sua energia cinetica finale (g = 9,8 m/s²)?",o:["0,0196 J","19,6 J","0,0098 J","1,96 J"],a:0,e:"Senza attriti Ec finale = mgh = 10⁻³ kg · 9,8 · 2 = 0,0196 J."},
{id:"fl4_019",t:"fl4",p:"4.3.2",l:1,q:"Come si calcola l'energia potenziale gravitazionale vicino alla superficie terrestre?",o:["m·g·h","½mv²","m·g","½kx²"],a:0,e:"Ep = m·g·h: è proporzionale alla massa e alla quota."},
{id:"fl4_020",t:"fl4",p:"4.3.2",l:2,q:"Che cos'è un campo conservativo?",o:["Un campo in cui il lavoro delle forze non dipende dal cammino ma solo dai punti iniziale e finale","Un campo in cui l'energia cinetica è costante","Un campo senza forze","Un campo in cui c'è sempre attrito"],a:0,e:"In un campo conservativo il lavoro è una funzione di stato e lungo un percorso chiuso è nullo. Il campo gravitazionale è conservativo."},
{id:"fl4_021",t:"fl4",p:"4.3.2",l:2,q:"Per quali campi si può definire l'energia potenziale?",o:["Solo per i campi conservativi","Per tutti i campi","Solo per i campi elettrici","Solo in presenza di attrito"],a:0,e:"L'energia potenziale è definita solo nei campi conservativi, dove il lavoro dipende solo dalla posizione."},
{id:"fl4_022",t:"fl4",p:"4.3.2",l:2,q:"Quanto vale l'energia potenziale elastica di una molla allungata di x?",o:["½kx²","kx","½kx","kx²"],a:0,e:"Ep = ½kx², dove k è la costante elastica della molla."},
{id:"fl4_023",t:"fl4",p:"4.3.2",l:3,q:"La forza di attrito radente è conservativa?",o:["No: il suo lavoro dipende dal percorso","Sì, sempre","Sì, se la velocità è costante","Solo su piani orizzontali"],a:0,e:"Il lavoro dell'attrito dipende dal cammino seguito, quindi è una forza non conservativa."},
{id:"fl4_024",t:"fl4",p:"4.3.2",l:3,q:"Che lavoro compie la forza elastica in un'oscillazione completa di una molla senza attrito?",o:["Zero","½kA²","kA²","Dipende dalla massa"],a:0,e:"La forza elastica è conservativa: lungo un percorso chiuso (un'oscillazione completa) il lavoro è nullo."},
{id:"fl4_025",t:"fl4",p:"4.3.3",l:1,q:"Durante la caduta libera di un corpo (senza attriti), che cosa resta costante?",o:["La somma di energia cinetica e potenziale","L'energia cinetica","L'energia potenziale","La velocità"],a:0,e:"L'energia potenziale diminuisce e si trasforma in cinetica: la somma ½mv² + mgh resta costante."},
{id:"fl4_026",t:"fl4",p:"4.3.3",l:2,q:"Un corpo scivola senza attrito da un'altezza h lungo un piano inclinato. Da che cosa dipende la velocità alla base?",o:["Solo dall'altezza h","Dalla massa e dall'altezza","Dall'angolo del piano","Dalla lunghezza del piano"],a:0,e:"mgh = ½mv² ⇒ v = √(2gh): non dipende né dalla massa né dall'inclinazione."},
{id:"fl4_027",t:"fl4",p:"4.3.4",l:2,q:"Dove è massima l'energia potenziale gravitazionale di un pendolo che oscilla?",o:["Nei punti di massima ampiezza","Nel punto di equilibrio (il più basso)","È uguale ovunque","A metà dell'oscillazione"],a:0,e:"Ep è proporzionale alla quota: è minima nel punto più basso (dove la velocità è massima) e massima agli estremi."},
{id:"fl4_028",t:"fl4",p:"4.3.3",l:3,q:"Un corpo cade da 5 m senza attrito (g = 10 m/s²). Con quale velocità arriva a terra?",o:["10 m/s","50 m/s","5 m/s","100 m/s"],a:0,e:"v = √(2gh) = √(2 · 10 · 5) = √100 = 10 m/s."},
{id:"fl4_029",t:"fl4",p:"4.3.4",l:3,q:"Un pendolo viene lasciato da fermo da un'altezza h. Fino a che altezza risale dall'altra parte (senza attriti)?",o:["La stessa altezza h","h/2","2h","Dipende dalla massa"],a:0,e:"Nel punto più alto l'energia cinetica è nulla e quella potenziale è uguale a quella iniziale: quindi stessa quota."},
{id:"fl4_030",t:"fl4",p:"4.3.3",l:3,q:"In presenza di attrito, che cosa succede all'energia meccanica totale?",o:["Non si conserva: in parte si trasforma per esempio in energia termica","Si conserva sempre","Aumenta","Si trasforma tutta in energia potenziale"],a:0,e:"L'attrito è una forza non conservativa: cade il principio di conservazione dell'energia meccanica."},
{id:"fl4_031",t:"fl4",p:"4.4",l:1,q:"In quali urti si conserva la quantità di moto totale?",o:["In tutti gli urti","Solo negli urti elastici","Solo negli urti perfettamente anelastici","In nessun urto"],a:0,e:"Il sistema dei corpi che si urtano è con buona approssimazione isolato: la quantità di moto si conserva in ogni urto."},
{id:"fl4_032",t:"fl4",p:"4.4",l:1,q:"In quali urti si conserva l'energia cinetica?",o:["Solo negli urti elastici","In tutti gli urti","Solo negli urti anelastici","In nessun urto"],a:0,e:"Negli urti anelastici forze dissipative provocano deformazioni e riscaldamento, e l'energia cinetica non si conserva."},
{id:"fl4_033",t:"fl4",p:"4.4",l:2,q:"Come si chiama un urto dopo il quale i due corpi restano uniti?",o:["Perfettamente anelastico","Elastico","Parzialmente elastico","Conservativo"],a:0,e:"È il caso estremo di urto anelastico: i corpi proseguono insieme con un'unica velocità."},
{id:"fl4_034",t:"fl4",p:"4.4",l:3,q:"Un carrello di 2 kg a 3 m/s urta un carrello fermo di 1 kg e restano attaccati. Con che velocità proseguono?",o:["2 m/s","3 m/s","1 m/s","1,5 m/s"],a:0,e:"v' = (m₁v₁ + m₂v₂)/(m₁ + m₂) = (2 · 3 + 0)/3 = 2 m/s."},
{id:"fl4_035",t:"fl4",p:"4.4",l:3,q:"Due corpi di 1 kg si muovono uno contro l'altro a 4 m/s e restano uniti nell'urto. Qual è la velocità finale?",o:["0 m/s","4 m/s","2 m/s","8 m/s"],a:0,e:"Le quantità di moto sono uguali e opposte, quindi la quantità di moto totale è nulla e resta nulla: i corpi si fermano."},
{id:"fl4_036",t:"fl4",p:"4.1",l:4,q:"Si trasporta una valigia a velocità costante tenendola alla stessa altezza da terra, camminando in piano. Che lavoro compie la forza che la sostiene?",o:["Zero","Positivo","Negativo","Uguale al peso per la distanza"],a:0,e:"La forza che sostiene la valigia è verticale e lo spostamento è orizzontale: sono perpendicolari, quindi il lavoro è nullo."},
{id:"fl4_037",t:"fl4",p:"4.3.3",l:4,q:"Un corpo di 2 kg scivola senza attrito da un'altezza di 1,8 m (g = 10 m/s²). Quale velocità ha alla base?",o:["6 m/s","36 m/s","3,6 m/s","18 m/s"],a:0,e:"v = √(2gh) = √36 = 6 m/s. La massa non conta."},
{id:"fl4_038",t:"fl4",p:"4.3.2",l:4,q:"Una molla di costante k = 200 N/m viene compressa di 10 cm. Quanta energia potenziale immagazzina?",o:["1 J","10 J","20 J","0,1 J"],a:0,e:"Ep = ½kx² = ½ · 200 · (0,1)² = 1 J."},
{id:"fl4_039",t:"fl4",p:"4.4",l:4,q:"In un urto perfettamente anelastico tra un corpo di 1 kg a 6 m/s e uno fermo di 2 kg, quanta energia cinetica si perde?",o:["12 J","18 J","6 J","0 J"],a:0,e:"v' = 6/3 = 2 m/s. Ec iniziale = ½ · 1 · 36 = 18 J; finale = ½ · 3 · 4 = 6 J. Si perdono 12 J."},
{id:"fl4_040",t:"fl4",p:"4.2",l:4,q:"Un motore solleva un carico di 100 kg di 10 m in 20 s a velocità costante (g = 10 m/s²). Che potenza sviluppa?",o:["500 W","5000 W","50 W","20.000 W"],a:0,e:"L = mgh = 100 · 10 · 10 = 10⁴ J; P = L/t = 10⁴/20 = 500 W."},
{id:"fl4_041",t:"fl4",p:"4.3.4",l:2,q:"Nel moto di un pendolo senza attriti, dove è massima l'energia cinetica?",o:["Nel punto più basso (posizione di equilibrio)","Nei punti di massima ampiezza","È uguale ovunque","A metà della discesa"],a:0,e:"Nel punto più basso tutta l'energia potenziale iniziale si è trasformata in energia cinetica."},
{id:"fl4_042",t:"fl4",p:"4.3.4",l:3,q:"Un pendolo parte da fermo 20 cm più in alto del suo punto più basso (g = 10 m/s²). Con che velocità passa per il punto più basso?",o:["2 m/s","4 m/s","√2 m/s","20 m/s"],a:0,e:"mgh = ½mv² ⇒ v = √(2gh) = √(2 · 10 · 0,2) = √4 = 2 m/s."},
{id:"fl5_001",t:"fl5",p:"5.1",l:1,q:"Quale stato di aggregazione ha volume proprio ma assume la forma del recipiente?",o:["Liquido","Solido","Aeriforme","Nessuno"],a:0,e:"Il solido ha forma e volume propri; l'aeriforme non ha né l'uno né l'altro; il liquido ha solo volume proprio."},
{id:"fl5_002",t:"fl5",p:"5.1.1",l:1,q:"Qual è l'unità di misura della pressione nel SI?",o:["Pascal (N/m²)","Atmosfera","Bar","mmHg"],a:0,e:"P = F/S, quindi N/m² = pascal. Atmosfera, bar e mmHg sono altre unità molto usate."},
{id:"fl5_003",t:"fl5",p:"5.1.1",l:2,q:"A quanti mmHg corrisponde 1 atmosfera?",o:["760 mmHg","100 mmHg","1013 mmHg","76 mmHg"],a:0,e:"1 atm è la pressione di una colonna di mercurio alta 760 mm; equivale anche a 101325 Pa ≈ 10⁵ Pa."},
{id:"fl5_004",t:"fl5",p:"5.1",l:2,q:"Quale di queste variabili di stato è intensiva?",o:["La temperatura","Il volume","Il numero di moli","La massa"],a:0,e:"Le variabili intensive (temperatura, pressione) non sono additive e non dipendono dalle dimensioni del sistema; volume e moli sono estensive."},
{id:"fl5_005",t:"fl5",p:"5.1.2",l:2,q:"Un recipiente cubico ha il lato di 100 cm. Quanti litri contiene?",o:["1000 L","100 L","10 L","10⁶ L"],a:0,e:"V = (1 m)³ = 1 m³ = 1000 dm³ = 1000 L."},
{id:"fl5_006",t:"fl5",p:"5.1.1",l:3,q:"A quante barie corrisponde 1 Pa?",o:["10 barie","0,1 barie","10⁵ barie","1 baria"],a:0,e:"1 Pa = 1 N/m² = 10⁵ dyn / 10⁴ cm² = 10 barie."},
{id:"fl5_007",t:"fl5",p:"5.1",l:3,q:"Che differenza c'è tra un liquido perfetto e un gas perfetto?",o:["Il liquido perfetto è incomprimibile, il gas perfetto è comprimibile; entrambi non viscosi","Il gas perfetto è incomprimibile","Il liquido perfetto è viscoso","Nessuna"],a:0,e:"Nei liquidi le forze di coesione tengono vicine le molecole e impediscono la compressione; nei gas no."},
{id:"fl5_008",t:"fl5",p:"5.1.3",l:1,q:"A quanti kelvin corrispondono circa 27 °C?",o:["300 K","246 K","327 K","27 K"],a:0,e:"T = t + 273 = 27 + 273 = 300 K."},
{id:"fl5_009",t:"fl5",p:"5.1.3",l:1,q:"Una temperatura sale da 25 °C a 27 °C. Di quanto aumenta in kelvin?",o:["2 K","275 K","300 K","0,2 K"],a:0,e:"Grado Celsius e kelvin hanno la stessa ampiezza: una differenza di 2 °C è anche di 2 K."},
{id:"fl5_010",t:"fl5",p:"5.1.3",l:2,q:"Quali scale termometriche hanno gradi della stessa ampiezza?",o:["Celsius e Kelvin","Celsius e Fahrenheit","Fahrenheit e Kelvin","Tutte e tre"],a:0,e:"Celsius e Kelvin sono solo traslate di 273,15; il grado Fahrenheit è più piccolo (100 °C = 180 °F di differenza)."},
{id:"fl5_011",t:"fl5",p:"5.1.3",l:2,q:"A quanti °F corrispondono 100 °C?",o:["212 °F","180 °F","373 °F","100 °F"],a:0,e:"T(°F) = 9/5 · 100 + 32 = 180 + 32 = 212 °F."},
{id:"fl5_012",t:"fl5",p:"5.1.4",l:2,q:"Un binario di ferro di 5 m (γ = 12·10⁻⁶ °C⁻¹) si scalda di 50 °C. Di quanto si allunga?",o:["3 mm","3 cm","0,3 mm","30 cm"],a:0,e:"ΔL = L₀·γ·Δt = 5 · 12·10⁻⁶ · 50 = 3·10⁻³ m = 3 mm."},
{id:"fl5_013",t:"fl5",p:"5.1.4",l:3,q:"Tutti i materiali aumentano di volume quando la temperatura sale?",o:["No: l'acqua passando da ghiaccio a liquido diminuisce di volume","Sì, senza eccezioni","Solo i gas","Solo i solidi"],a:0,e:"La dilatazione riguarda la stragrande maggioranza dei materiali, ma l'acqua è un'eccezione nel passaggio ghiaccio → liquido."},
{id:"fl5_014",t:"fl5",p:"5.1.4",l:3,q:"Quanto vale il coefficiente di dilatazione dei gas (in °C⁻¹)?",o:["1/273 per tutti i gas","Dipende dal gas","273","1/100"],a:0,e:"Per gli aeriformi k = 1/273,15 °C⁻¹ uguale per tutti; da qui Kelvin fissò la sua scala assoluta."},
{id:"fl5_015",t:"fl5",p:"5.2",l:1,q:"Come si chiama il passaggio diretto da solido ad aeriforme?",o:["Sublimazione","Brinamento","Fusione","Evaporazione"],a:0,e:"Sublimazione: solido → aeriforme. Il passaggio inverso (aeriforme → solido) è il brinamento."},
{id:"fl5_016",t:"fl5",p:"5.2",l:1,q:"Durante un passaggio di stato che assorbe calore, la temperatura…",o:["resta costante","aumenta","diminuisce","oscilla"],a:0,e:"L'energia fornita serve a rompere i legami, non ad aumentare la temperatura: per esempio il ghiaccio fonde a temperatura costante."},
{id:"fl5_017",t:"fl5",p:"5.2",l:2,q:"Quale passaggio di stato cede energia all'esterno?",o:["La liquefazione (condensazione)","La fusione","La vaporizzazione","La sublimazione"],a:0,e:"Solidificazione, liquefazione e brinamento cedono energia; fusione, vaporizzazione e sublimazione la assorbono."},
{id:"fl5_018",t:"fl5",p:"5.2",l:2,q:"Quanto calore serve per fondere 1 kg di ghiaccio (λ = 79,7 cal/g)?",o:["79.700 cal","79,7 cal","540.000 cal","7970 cal"],a:0,e:"Q = m·λ = 1000 g · 79,7 cal/g = 79.700 cal."},
{id:"fl5_019",t:"fl5",p:"5.2",l:3,q:"Per l'acqua, quale calore latente è maggiore?",o:["Quello di evaporazione (540 cal/g)","Quello di fusione (79,7 cal/g)","Sono uguali","Dipende dalla massa"],a:0,e:"Nel grafico del riscaldamento dell'acqua il tratto di evaporazione è molto più lungo di quello di fusione: λ evaporazione = 540 cal/g contro 79,7 cal/g."},
{id:"fl5_020",t:"fl5",p:"5.3.1",l:1,q:"Quale legge vale per un gas perfetto a temperatura costante?",o:["Boyle: P·V = costante","Charles: V/T costante","Gay-Lussac: P/T costante","Dalton"],a:0,e:"Legge di Boyle: in una trasformazione isoterma pressione e volume sono inversamente proporzionali."},
{id:"fl5_021",t:"fl5",p:"5.3.1",l:1,q:"Nell'equazione PV = nRT, in che unità va espressa la temperatura?",o:["In kelvin","In gradi Celsius","In gradi Fahrenheit","In qualunque scala"],a:0,e:"T deve essere la temperatura assoluta, in kelvin."},
{id:"fl5_022",t:"fl5",p:"5.3.1",l:2,q:"Un recipiente chiuso contiene un gas perfetto. Se la temperatura assoluta raddoppia, la pressione…",o:["raddoppia","si dimezza","resta uguale","quadruplica"],a:0,e:"Con n, R e V costanti, P/T è costante: se T raddoppia anche P raddoppia."},
{id:"fl5_023",t:"fl5",p:"5.3.1",l:2,q:"Un cilindro contiene n moli di gas. Se la temperatura raddoppia, quante moli contiene?",o:["Sempre n","2n","n/2","4n"],a:0,e:"Il numero di moli dipende solo da quante molecole ci sono: non cambia con temperatura, volume o pressione."},
{id:"fl5_024",t:"fl5",p:"5.3.1",l:2,q:"Quale volume occupa una mole di qualunque gas a 0 °C e 1 atm?",o:["22,4 litri","1 litro","6,022 litri","24,4 m³"],a:0,e:"Legge di Avogadro: in queste condizioni una mole di qualunque gas occupa 22,4 L e contiene 6,022·10²³ molecole."},
{id:"fl5_025",t:"fl5",p:"5.3.1",l:3,q:"Che cosa afferma la legge di Dalton?",o:["La pressione di una miscela di gas è la somma delle pressioni parziali","Volumi uguali contengono lo stesso numero di molecole","PV = costante","La pressione dipende dal volume del recipiente"],a:0,e:"Ogni gas esercita la pressione che avrebbe se occupasse da solo tutto il volume: Pᵢ = P · nᵢ/n."},
{id:"fl5_026",t:"fl5",p:"5.3.1",l:3,q:"Una miscela a 1 atm contiene 1 mol di O₂ e 3 mol di N₂. Qual è la pressione parziale dell'ossigeno?",o:["0,25 atm","0,33 atm","0,75 atm","1 atm"],a:0,e:"Frazione molare dell'O₂ = 1/4; P(O₂) = 1 atm · 1/4 = 0,25 atm."},
{id:"fl5_027",t:"fl5",p:"5.3.1",l:3,q:"Un gas a pressione costante passa da 300 K a 600 K. Il suo volume…",o:["raddoppia","si dimezza","resta uguale","aumenta di 300 L"],a:0,e:"A pressione costante (Charles) il volume è proporzionale alla temperatura assoluta."},
{id:"fl5_028",t:"fl5",p:"5.3.2",l:1,q:"Da che cosa dipende la pressione di un gas secondo la teoria cinetica?",o:["Dagli urti delle molecole contro le pareti","Dal colore del gas","Dalla forza peso del gas","Solo dal volume"],a:0,e:"La pressione è l'effetto macroscopico degli urti delle molecole; la temperatura è l'espressione della loro agitazione termica."},
{id:"fl5_029",t:"fl5",p:"5.3.2",l:2,q:"A parità di temperatura, come si muovono le molecole più leggere rispetto a quelle più pesanti?",o:["Più velocemente","Più lentamente","Alla stessa velocità","Non si muovono"],a:0,e:"L'energia cinetica media dipende solo da T: a pari energia, massa minore significa velocità maggiore."},
{id:"fl5_030",t:"fl5",p:"5.3.3",l:2,q:"Quale di queste caratteristiche distingue un gas reale da uno perfetto?",o:["Il volume proprio delle particelle (covolume) non trascurabile","Le particelle puntiformi","Gli urti perfettamente elastici","L'assenza di interazioni"],a:0,e:"Un gas reale ha almeno una di queste caratteristiche: interazioni tra le molecole, urti non perfettamente elastici, covolume non trascurabile. Si usa l'equazione di Van der Waals."},
{id:"fl5_031",t:"fl5",p:"5.3.4",l:3,q:"Che cos'è la temperatura critica di un gas?",o:["La temperatura sopra la quale non si può liquefare per sola compressione","La temperatura di ebollizione","La temperatura di 0 K","La temperatura a cui il gas si solidifica"],a:0,e:"Sotto la temperatura critica l'aeriforme è un vapore e si liquefa comprimendolo; sopra è un gas e non si liquefa. Per l'acqua vale 374 °C."},
{id:"fl5_032",t:"fl5",p:"5.3.3",l:3,q:"In quali condizioni un gas reale si comporta quasi come un gas perfetto?",o:["Alte temperature e basse pressioni","Basse temperature e alte pressioni","Basse temperature e basse pressioni","Alte pressioni e alte temperature"],a:0,e:"Ad alta temperatura e bassa pressione le molecole sono lontane e veloci: interazioni e covolume diventano trascurabili."},
{id:"fl5_033",t:"fl5",p:"5.4.1",l:1,q:"L'acqua può evaporare a temperature tra 0 °C e 100 °C?",o:["Sì, evapora a qualunque temperatura","No, solo a 100 °C","Solo sopra i 50 °C","Solo sotto gli 0 °C"],a:0,e:"L'evaporazione interessa le molecole della superficie con energia superiore alla media e avviene a ogni temperatura; è più evidente quando la temperatura è alta."},
{id:"fl5_034",t:"fl5",p:"5.4.1",l:2,q:"Sul Monte Bianco l'acqua bolle a una temperatura…",o:["minore di 100 °C","maggiore di 100 °C","uguale a 100 °C","di 0 °C"],a:0,e:"Si bolle quando la tensione di vapore uguaglia la pressione esterna: in quota la pressione è minore, quindi basta una temperatura più bassa."},
{id:"fl5_035",t:"fl5",p:"5.4.1",l:2,q:"Perché nella pentola a pressione i cibi cuociono prima?",o:["La pressione maggiore alza la temperatura di ebollizione sopra i 100 °C","La pressione abbassa la temperatura di ebollizione","Il vapore è più denso","L'acqua evapora più in fretta"],a:0,e:"Con una pressione esterna maggiore serve una tensione di vapore maggiore, quindi una temperatura più alta: i cibi cuociono a più di 100 °C."},
{id:"fl5_036",t:"fl5",p:"5.4.2",l:2,q:"Grazie a quale fenomeno alcuni insetti camminano sull'acqua?",o:["La tensione superficiale","La capillarità","La spinta di Archimede","L'evaporazione"],a:0,e:"Le molecole in superficie sono attratte solo verso l'interno: lo strato superficiale si comporta come una pellicola elastica."},
{id:"fl5_037",t:"fl5",p:"5.4.3",l:3,q:"Se il raggio di un capillare si dimezza, il dislivello del liquido…",o:["raddoppia","si dimezza","resta uguale","quadruplica"],a:0,e:"Legge di Jurin-Borelli: il dislivello h è inversamente proporzionale al raggio del capillare."},
{id:"fl5_038",t:"fl5",p:"5.4.1",l:3,q:"Quando l'acqua salata bolle, il vapore che si libera contiene…",o:["solo H₂O: il sale resta nella soluzione","H₂O e NaCl gassoso","solo NaCl","H₂ e O₂"],a:0,e:"Il sale è un soluto non volatile: resta in soluzione (per questo nelle saline si ricava il sale facendo evaporare l'acqua)."},
{id:"fl5_039",t:"fl5",p:"5.4.1",l:3,q:"Da che cosa dipende la tensione di vapore di un liquido?",o:["Solo dalla temperatura e dalla natura del liquido","Dalla quantità di liquido","Dalla forma del recipiente","Dalla pressione esterna"],a:0,e:"La tensione di vapore dipende solo da temperatura e natura del liquido e aumenta con la temperatura."},
{id:"fl5_040",t:"fl5",p:"5.5",l:1,q:"Come si chiama la proprietà di un solido di lasciarsi ridurre in fili sottili?",o:["Duttilità","Malleabilità","Tenacità","Durezza"],a:0,e:"Duttilità: fili; malleabilità: fogli; tenacità: resistenza alla rottura; durezza: capacità di scalfire un altro corpo."},
{id:"fl5_041",t:"fl5",p:"5.5",l:2,q:"A quale tipo di solido appartiene il diamante?",o:["Solido covalente","Solido ionico","Solido molecolare","Solido metallico"],a:0,e:"Nei solidi covalenti (diamante, silice) gli atomi sono legati da legami covalenti: sono durissimi, fondono ad alta temperatura e conducono male."},
{id:"fl5_042",t:"fl5",p:"5.5",l:2,q:"Quali solidi conducono bene calore ed elettricità?",o:["I solidi metallici","I solidi ionici","I solidi covalenti","I solidi molecolari"],a:0,e:"Nei metalli gli ioni positivi sono immersi in una nube di elettroni mobili, che spiegano la buona conducibilità."},
{id:"fl5_043",t:"fl5",p:"5.5",l:3,q:"Secondo il libro, perché il vetro non è un vero solido?",o:["Perché non ha un reticolo cristallino (è un solido amorfo)","Perché è trasparente","Perché fonde a bassa temperatura","Perché è un liquido a temperatura ambiente"],a:0,e:"Un solido è tale se ha un reticolo cristallino; il vetro non lo ha e si chiama solido amorfo."},
{id:"fl5_044",t:"fl5",p:"5.5.1",l:1,q:"Che unità di misura ha lo sforzo?",o:["Pascal (N/m²)","Newton","Nessuna, è adimensionale","Joule"],a:0,e:"Lo sforzo σ = F/S è dimensionalmente analogo a una pressione."},
{id:"fl5_045",t:"fl5",p:"5.5.1",l:2,q:"Perché la deformazione ε = ΔL/L₀ è adimensionale?",o:["È il rapporto tra due lunghezze","Perché si misura in pascal","Perché è sempre piccola","Perché dipende dalla forza"],a:0,e:"È un rapporto tra grandezze omogenee (lunghezze), quindi senza dimensioni."},
{id:"fl5_046",t:"fl5",p:"5.5.2",l:2,q:"Due materiali subiscono lo stesso sforzo ma hanno modulo di Young diverso. Quale si deforma di più?",o:["Quello con modulo di Young minore","Quello con modulo di Young maggiore","Si deformano uguale","Nessuno dei due"],a:0,e:"σ = E·ε ⇒ ε = σ/E: a parità di sforzo la deformazione è maggiore se E è minore."},
{id:"fl5_047",t:"fl5",p:"5.5.2",l:3,q:"Quale affermazione su ossa e tendini è corretta?",o:["L'osso ha un modulo di Young alto (15–20 GPa), i tendini basso (0,5–1,5 GPa)","I tendini sono più rigidi delle ossa","Hanno lo stesso modulo di Young","L'osso non segue mai la legge di Hooke"],a:0,e:"L'osso è rigido e si deforma poco; tendini e legamenti sono elastici. Nell'osteoporosi il modulo di Young dell'osso si riduce."},
{id:"fl5_048",t:"fl5",p:"5.5.3",l:3,q:"Che cosa succede se lo sforzo su un materiale supera il limite elastico?",o:["La legge di Hooke non vale più: il materiale si deforma in modo permanente o si frattura","Il materiale torna sempre alla forma iniziale","Il modulo di Young raddoppia","La deformazione si annulla"],a:0,e:"Fino al limite elastico il materiale torna alla lunghezza originale; oltre entra nel regime plastico e può fratturarsi."},
{id:"fl5_049",t:"fl5",p:"5.5.4",l:3,q:"Quando una forza agisce parallelamente alla superficie di un materiale si parla di…",o:["sforzo di taglio","trazione longitudinale","compressione","pressione"],a:0,e:"Lo sforzo di taglio τ = F/S causa una deformazione angolare Δθ: τ = G·Δθ, con G modulo di taglio."},
{id:"fl5_050",t:"fl5",p:"5.3.1",l:4,q:"Quante moli di gas ci sono in 10 L a 27 °C e 30 atm (R = 0,082 L·atm/(mol·K))?",o:["Circa 12,2 mol","Circa 135 mol","Circa 1,2 mol","Circa 0,8 mol"],a:0,e:"n = PV/RT = 30 · 10 / (0,082 · 300) ≈ 12,2 mol. (Se fosse ossigeno, 12,2 · 32 g ≈ 390 g.)"},
{id:"fl5_051",t:"fl5",p:"5.3.1",l:4,q:"Un gas a temperatura costante viene compresso da 6 L a 2 L. Se la pressione iniziale era 1 atm, quella finale è…",o:["3 atm","1/3 atm","6 atm","12 atm"],a:0,e:"Boyle: P₁V₁ = P₂V₂ ⇒ P₂ = 1 · 6 / 2 = 3 atm."},
{id:"fl5_052",t:"fl5",p:"5.1.3",l:4,q:"A che temperatura in °C corrispondono 200 K?",o:["−73 °C","73 °C","−200 °C","473 °C"],a:0,e:"t = T − 273 = 200 − 273 = −73 °C."},
{id:"fl5_053",t:"fl5",p:"5.4.1",l:4,q:"Da che cosa NON dipende la temperatura di ebollizione di un liquido?",o:["Dalla temperatura dell'ambiente esterno","Dalla natura del liquido","Dalla pressione esterna","Dall'altitudine"],a:0,e:"Dipende dalla natura del liquido e dalla pressione esterna (quindi dall'altitudine); la temperatura dell'ambiente non c'entra."},
{id:"fl5_054",t:"fl5",p:"5.2",l:4,q:"Quanto calore serve per far evaporare 10 g di acqua a 100 °C (λ = 540 cal/g)?",o:["5400 cal","540 cal","54 cal","797 cal"],a:0,e:"Q = m·λ = 10 · 540 = 5400 cal."},
{id:"fl5_055",t:"fl5",p:"5.1.2",l:1,q:"A quanti m³ corrisponde 1 litro?",o:["10⁻³ m³","1 m³","10⁻⁶ m³","10³ m³"],a:0,e:"1 L = 1 dm³ = 10⁻³ m³."},
{id:"fl5_056",t:"fl5",p:"5.1.2",l:2,q:"Quanti litri ci sono in 2,5 m³?",o:["2500 L","250 L","25 L","25.000 L"],a:0,e:"1 m³ = 1000 L, quindi 2,5 m³ = 2500 L."},
