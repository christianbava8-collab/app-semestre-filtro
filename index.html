{id:"cl3_018",t:"cl3",p:"3.3.1",l:3,q:"Come è legata la lunghezza di legame all'energia di legame?",o:["È inversamente proporzionale: legami più corti sono più forti", "È direttamente proporzionale", "Non c'è relazione", "Dipende solo dalla temperatura"],a:0,e:"La lunghezza è proporzionale al raggio degli atomi e inversamente proporzionale all'energia di legame."},
{id:"cl3_019",t:"cl3",p:"3.3.2",l:1,q:"Come si chiamano gli elettroni di valenza che non partecipano al legame?",o:["Doppietti solitari (di non legame)", "Doppietti di legame", "Elettroni di core", "Elettroni delocalizzati"],a:0,e:"Si considerano a coppie: la coppia condivisa è il doppietto di legame."},
{id:"cl3_020",t:"cl3",p:"3.3.2",l:2,q:"Quanti doppietti solitari ha l'ossigeno nella molecola d'acqua?",o:["2", "1", "0", "3"],a:0,e:"L'O ha 6 elettroni di valenza: 2 li usa nei legami con gli H, gli altri 4 formano due doppietti solitari."},
{id:"cl3_021",t:"cl3",p:"3.3.2",l:2,q:"Nella molecola Cl₂, quanti doppietti solitari ha ciascun atomo di cloro?",o:["3", "1", "2", "4"],a:0,e:"7 elettroni di valenza: 1 nel legame e 6 in tre doppietti solitari."},
{id:"cl3_022",t:"cl3",p:"3.3.3",l:1,q:"Quanti elettroni sono condivisi in un legame triplo?",o:["6", "3", "2", "4"],a:0,e:"Singolo = 2 elettroni, doppio = 4, triplo = 6 (come in N≡N)."},
{id:"cl3_023",t:"cl3",p:"3.3.3",l:2,q:"All'aumentare dell'ordine di legame…",o:["aumenta l'energia di legame e diminuisce la distanza", "diminuisce l'energia e aumenta la distanza", "non cambia nulla", "aumenta la distanza"],a:0,e:"Più coppie condivise tengono gli atomi più vicini e più saldamente."},
{id:"cl3_024",t:"cl3",p:"3.3.3",l:2,q:"Che cos'è un legame covalente polare?",o:["Una condivisione non equa degli elettroni tra atomi di elettronegatività diversa", "Una condivisione equa tra atomi uguali", "Un trasferimento completo di elettroni", "Un legame tra due metalli"],a:0,e:"L'atomo più elettronegativo porta una carica parziale δ⁻, l'altro δ⁺."},
{id:"cl3_025",t:"cl3",p:"3.3.3",l:2,q:"In un legame dativo (di coordinazione), da dove vengono i due elettroni?",o:["Entrambi dallo stesso atomo (donatore), che li condivide con un accettore con orbitale vuoto", "Uno da ciascun atomo", "Da un metallo", "Dal nucleo"],a:0,e:"È un legame covalente in cui la coppia proviene da un doppietto solitario del donatore."},
{id:"cl3_026",t:"cl3",p:"3.3.3",l:3,q:"Come si forma lo ione ammonio NH₄⁺?",o:["Con un legame dativo tra il doppietto solitario dell'azoto di NH₃ e lo ione H⁺", "Con un legame ionico tra N³⁻ e H⁺", "Con un legame metallico", "Con un legame a idrogeno"],a:0,e:"L'H⁺ ha l'orbitale vuoto e accetta il doppietto dell'azoto."},
{id:"cl3_027",t:"cl3",p:"3.3.4",l:1,q:"Come si forma un legame σ?",o:["Per sovrapposizione frontale di orbitali lungo l'asse tra i nuclei", "Per sovrapposizione laterale di orbitali p", "Per trasferimento di elettroni", "Per attrazione tra ioni"],a:0,e:"Il legame π si forma invece per sovrapposizione laterale di orbitali p."},
{id:"cl3_028",t:"cl3",p:"3.3.4",l:2,q:"Perché il legame σ è più forte del legame π?",o:["Perché la sovrapposizione degli orbitali è maggiore", "Perché contiene più elettroni", "Perché si forma solo tra metalli", "Perché è più lungo"],a:0,e:"La sovrapposizione frontale è più efficace di quella laterale."},
{id:"cl3_029",t:"cl3",p:"3.3.4",l:2,q:"Da che cosa è formato il triplo legame della molecola N₂?",o:["Un legame σ e due legami π", "Tre legami σ", "Tre legami π", "Due legami σ e un legame π"],a:0,e:"Un σ dalla sovrapposizione frontale dei pₓ e due π da quella laterale di p_y e p_z."},
{id:"cl3_030",t:"cl3",p:"3.3.5",l:1,q:"Quale ibridazione ha il carbonio nel metano?",o:["sp³", "sp²", "sp", "Nessuna"],a:0,e:"Quattro orbitali ibridi sp³ verso i vertici di un tetraedro, a circa 109°."},
{id:"cl3_031",t:"cl3",p:"3.3.5",l:2,q:"Quali angoli formano gli orbitali ibridi sp²?",o:["120°", "109,5°", "180°", "90°"],a:0,e:"Un s e due p formano tre ibridi complanari a 120°, come nel boro di BH₃."},
{id:"cl3_032",t:"cl3",p:"3.3.5",l:2,q:"Quale ibridazione ha il berillio in BeH₂?",o:["sp, con orbitali a 180°", "sp²", "sp³", "Nessuna"],a:0,e:"Due orbitali sp lineari permettono al Be di formare due legami."},
{id:"cl3_033",t:"cl3",p:"3.3.5",l:3,q:"Perché il carbonio (2s² 2p²) può formare quattro legami uguali nel metano?",o:["Un elettrone 2s viene promosso nel 2p e si formano quattro ibridi sp³ isoenergetici", "Perché ha quattro elettroni spaiati nello stato fondamentale", "Perché forma legami ionici", "Perché usa gli orbitali d"],a:0,e:"Con due soli elettroni spaiati formerebbe due legami: l'ibridazione spiega i quattro legami equivalenti."},
{id:"cl3_034",t:"cl3",p:"3.3.5",l:3,q:"Gli orbitali ibridi sono…",o:["orbitali atomici del singolo atomo", "orbitali molecolari", "orbitali del nucleo", "orbitali d"],a:0,e:"Pur servendo a descrivere le molecole, l'ibridazione coinvolge orbitali di un solo atomo."},
{id:"cl3_035",t:"cl3",p:"3.3.6",l:2,q:"Che cos'è l'ibrido di risonanza?",o:["La struttura reale, intermedia tra le forme limite di risonanza", "Una delle formule limite", "Un isomero della molecola", "Un orbitale ibrido sp²"],a:0,e:"Nessuna forma limite rappresenta da sola la struttura reale."},
{id:"cl3_036",t:"cl3",p:"3.3.6",l:2,q:"Perché nello ione NO₂⁻ i due legami N–O hanno la stessa lunghezza?",o:["Perché gli elettroni π sono delocalizzati su tutti e tre gli atomi (risonanza)", "Perché sono entrambi doppi", "Perché sono entrambi ionici", "Perché l'azoto è ibridato sp³"],a:0,e:"Un doppio legame sarebbe più corto di uno singolo, ma la delocalizzazione li rende uguali."},
{id:"cl3_037",t:"cl3",p:"3.3.6",l:3,q:"Nel benzene, che ibridazione hanno i carboni e dove sono i sei elettroni π?",o:["sp²; delocalizzati in due nubi sopra e sotto il piano dell'anello", "sp³; localizzati su tre doppi legami fissi", "sp; nel piano dell'anello", "sp²; tutti legati agli idrogeni"],a:0,e:"Ogni C ha un orbitale p puro: i sei elettroni formano nubi cicliche delocalizzate."},
{id:"cl3_038",t:"cl3",p:"3.3.7",l:1,q:"Su che cosa si basa il modello VSEPR?",o:["Sulla repulsione tra i doppietti elettronici del guscio di valenza", "Sulla massa degli atomi", "Sull'elettronegatività del nucleo", "Sul numero di neutroni"],a:0,e:"I doppietti (di legame e solitari) si dispongono il più lontano possibile tra loro."},
{id:"cl3_039",t:"cl3",p:"3.3.7",l:2,q:"Che forma ha la molecola d'acqua?",o:["Piegata (angolata)", "Lineare", "Tetraedrica", "Trigonale planare"],a:0,e:"Numero sterico 4 (2 legami + 2 doppietti solitari, AX₂E₂): angolo di 104,5°."},
{id:"cl3_040",t:"cl3",p:"3.3.7",l:2,q:"Che forma ha l'ammoniaca NH₃?",o:["Piramide trigonale", "Trigonale planare", "Tetraedrica", "Lineare"],a:0,e:"AX₃E: tre legami e un doppietto solitario, angolo di 107,5°."},
{id:"cl3_041",t:"cl3",p:"3.3.7",l:3,q:"Come si calcola il numero sterico (NS)?",o:["Atomi legati all'atomo centrale + doppietti solitari dell'atomo centrale", "Numero totale di elettroni", "Numero di legami π", "Numero di atomi della molecola"],a:0,e:"I legami multipli contano come uno. NS = 2 lineare, 3 trigonale planare, 4 tetraedrica."},
{id:"cl3_042",t:"cl3",p:"3.3.7",l:3,q:"Perché l'angolo H–O–H (104,5°) è minore di 109,5°?",o:["I doppietti solitari occupano più volume e respingono di più", "L'ossigeno è ibridato sp²", "Gli idrogeni si attraggono", "L'acqua è lineare"],a:0,e:"I doppietti non condivisi comprimono gli angoli di legame."},
{id:"cl3_043",t:"cl3",p:"3.3.8",l:1,q:"Quando una molecola è polare?",o:["Quando ha un momento di dipolo molecolare non nullo", "Quando contiene almeno un atomo di ossigeno", "Quando è lineare", "Quando ha legami solo apolari"],a:0,e:"Il momento di dipolo molecolare è la somma vettoriale dei dipoli di legame."},
{id:"cl3_044",t:"cl3",p:"3.3.8",l:2,q:"Perché CO₂ è apolare pur avendo legami polari?",o:["È lineare e i due dipoli C–O si annullano", "Perché i legami C–O sono apolari", "Perché il carbonio è più elettronegativo", "Perché ha doppietti solitari sul C"],a:0,e:"Stessa direzione, versi opposti, moduli uguali: risultante nulla."},
{id:"cl3_045",t:"cl3",p:"3.3.8",l:2,q:"In quale unità si misura il momento di dipolo?",o:["Debye (D)", "Coulomb", "Newton", "Pascal"],a:0,e:"Il vettore va dall'atomo meno elettronegativo a quello più elettronegativo."},
{id:"cl3_046",t:"cl3",p:"3.3.8",l:3,q:"Quale di queste molecole è polare?",o:["CHCl₃", "CCl₄", "BF₃", "CO₂"],a:0,e:"Una molecola tetraedrica è apolare solo se i quattro atomi legati sono uguali (CCl₄); CHCl₃ ha atomi diversi."},
{id:"cl3_047",t:"cl3",p:"3.4",l:1,q:"Che cos'è il legame ionico?",o:["Un'attrazione elettrostatica tra ioni di carica opposta", "La condivisione di una coppia di elettroni", "Un legame tra metalli", "Un legame a idrogeno"],a:0,e:"Si forma per trasferimento di elettroni dall'atomo meno a quello più elettronegativo."},
{id:"cl3_048",t:"cl3",p:"3.4",l:2,q:"Il legame ionico è direzionale?",o:["No, è adirezionale", "Sì, come il covalente", "Sì, solo nei solidi", "Solo in soluzione"],a:0,e:"Non si formano orbitali molecolari: la forza è puramente elettrostatica in tutte le direzioni."},
{id:"cl3_049",t:"cl3",p:"3.4",l:2,q:"Quando conducono la corrente i composti ionici?",o:["Allo stato fuso e in soluzione acquosa", "Allo stato solido", "Mai", "Solo allo stato gassoso"],a:0,e:"Nel solido gli ioni sono bloccati nel reticolo; fusi o disciolti possono muoversi."},
{id:"cl3_050",t:"cl3",p:"3.4",l:3,q:"Come varia l'energia reticolare?",o:["Aumenta al crescere della carica degli ioni e al diminuire delle loro dimensioni", "Aumenta con ioni più grandi", "Non dipende dagli ioni", "Diminuisce con la carica"],a:0,e:"Più alta è l'energia reticolare, più alta è la temperatura di fusione."},
{id:"cl3_051",t:"cl3",p:"3.4",l:3,q:"Oltre quale differenza di elettronegatività il legame si considera ionico, per convenzione?",o:["Circa 1,9 (sotto 1,7 è covalente)", "0,4", "0,1", "3,5"],a:0,e:"Tra 1,7 e 1,9 la classificazione è sfumata: ogni legame (tranne l'apolare) ha un certo grado di ionicità."},
{id:"cl3_052",t:"cl3",p:"3.5",l:1,q:"Quali metalli NON sono solidi a temperatura ambiente, secondo il libro?",o:["Mercurio e copernicio", "Ferro e rame", "Sodio e potassio", "Oro e argento"],a:0,e:"Tutti gli altri metalli sono solidi cristallini."},
{id:"cl3_053",t:"cl3",p:"3.5",l:2,q:"Da che cosa dipendono conducibilità, duttilità e malleabilità dei metalli?",o:["Dalla mobilità degli elettroni delocalizzati", "Dai legami a idrogeno", "Dai doppietti solitari", "Dalla presenza di anioni"],a:0,e:"Gli elettroni di valenza sono messi in comune e liberi di muoversi in tutto il campione."},
{id:"cl3_054",t:"cl3",p:"3.5",l:3,q:"Che carattere ha il legame metallico secondo il libro?",o:["Sia elettrostatico sia covalente, ed è adirezionale", "Solo covalente e direzionale", "Solo ionico", "Solo dipolare"],a:0,e:"È l'attrazione tra cationi del reticolo ed elettroni delocalizzati."},
{id:"cl3_055",t:"cl3",p:"3.6.1",l:1,q:"Le forze di van der Waals sono…",o:["interazioni elettrostatiche molto deboli tra molecole", "legami covalenti forti", "legami ionici", "legami metallici"],a:0,e:"Comprendono interazioni dipolo-dipolo, dipolo-dipolo indotto e di dispersione (London)."},
{id:"cl3_056",t:"cl3",p:"3.6.1",l:2,q:"Come si chiamano le interazioni dipolo istantaneo-dipolo indotto?",o:["Forze di dispersione (di London)", "Forze di Keesom", "Forze di Debye", "Legami a idrogeno"],a:0,e:"Keesom = dipolo-dipolo; Debye = dipolo permanente-dipolo indotto; London = dispersione."},
{id:"cl3_057",t:"cl3",p:"3.6.1",l:3,q:"Perché a temperatura ambiente Cl₂ è gas, Br₂ liquido e I₂ solido?",o:["Le forze di dispersione crescono con la massa molecolare e il numero di elettroni", "I legami covalenti diventano più forti", "Lo iodio forma legami a idrogeno", "Il cloro è ionico"],a:0,e:"Mᵣ 71, 160, 254: più elettroni, dipoli istantanei più intensi, punti di fusione più alti."},
{id:"cl3_058",t:"cl3",p:"3.6.2",l:1,q:"Tra quali atomi si forma il legame a idrogeno?",o:["Tra un H legato a F, O o N e un doppietto solitario di F, O o N vicino", "Tra due atomi di idrogeno qualsiasi", "Tra H e un metallo", "Tra due atomi di carbonio"],a:0,e:"Si trova per esempio in HF, NH₃ e H₂O, non in HCl o H₂S."},
{id:"cl3_059",t:"cl3",p:"3.6.2",l:2,q:"Perché H₂O è liquida a temperatura ambiente mentre H₂S è un gas?",o:["L'acqua forma legami a idrogeno, più intensi delle interazioni dipolo-dipolo", "H₂S ha massa molecolare minore", "L'acqua è un composto ionico", "H₂S è apolare"],a:0,e:"Per questo fusione ed ebollizione dell'acqua sono particolarmente alte (0 °C e 100 °C)."},
{id:"cl3_060",t:"cl3",p:"3.6.2",l:2,q:"A che temperatura l'acqua ha la massima densità?",o:["4 °C", "0 °C", "100 °C", "−4 °C"],a:0,e:"Sotto i 4 °C la densità diminuisce; il ghiaccio è meno denso dell'acqua liquida."},
{id:"cl3_061",t:"cl3",p:"3.6.2",l:3,q:"Perché il ghiaccio galleggia sull'acqua?",o:["I legami a idrogeno direzionali lo organizzano in anelli esagonali con molti spazi vuoti", "Il ghiaccio contiene aria", "Il ghiaccio ha massa molecolare minore", "Nel ghiaccio non ci sono legami a idrogeno"],a:0,e:"La struttura poco compatta fa aumentare il volume e diminuire la densità."},
{id:"cl3_062",t:"cl3",p:"3.6.2",l:3,q:"Il legame a idrogeno è…",o:["direzionale, con distanza di legame ben definita", "adirezionale", "più forte di un legame covalente", "presente tra molecole di metano"],a:0,e:"È il più forte tra le forze intermolecolari ma resta molto più debole di un covalente."},
{id:"cl3_063",t:"cl3",p:"3.6.3",l:2,q:"Che cosa succede quando NaCl si scioglie in acqua?",o:["Le molecole d'acqua circondano gli ioni con l'estremità opposta del dipolo (interazione ione-dipolo)", "Si formano legami covalenti Na–O", "Gli ioni diventano atomi neutri", "L'acqua si decompone"],a:0,e:"L'O (δ⁻) circonda i Na⁺, gli H (δ⁺) circondano i Cl⁻: il reticolo si disgrega e gli ioni sono solvatati."},
{id:"cl3_064",t:"cl3",p:"3.6.3",l:2,q:"L'interazione ione-dipolo avviene tra…",o:["uno ione e una molecola polare", "due molecole apolari", "due ioni dello stesso segno", "due atomi di metallo"],a:0,e:"Per esempio Na⁺ e acqua."},
{id:"cl3_065",t:"cl3",p:"3.6.4",l:2,q:"Da che cosa nascono le interazioni idrofobiche?",o:["Da un effetto entropico: aggregando le specie apolari aumenta l'entropia dell'acqua", "Da una forte attrazione diretta tra molecole apolari", "Da legami ionici", "Da legami a idrogeno tra molecole apolari"],a:0,e:"L'acqua forma strutture ordinate (clatrati) attorno alle specie apolari; quando queste si aggregano l'ordine diminuisce."},
{id:"cl3_066",t:"cl3",p:"3.6.4",l:3,q:"In quale processo biologico sono fondamentali le interazioni idrofobiche?",o:["Il ripiegamento delle proteine e la formazione delle membrane", "La replicazione del DNA", "La conduzione nervosa", "La respirazione"],a:0,e:"Spingono le parti apolari lontano dall'acqua."},
{id:"cl3_067",t:"cl3",p:"3.7.1",l:1,q:"Come si chiama il passaggio diretto da solido ad aeriforme?",o:["Sublimazione", "Brinamento", "Fusione", "Evaporazione"],a:0,e:"Il passaggio inverso, da aeriforme a solido, si chiama brinamento."},
{id:"cl3_068",t:"cl3",p:"3.7.1",l:2,q:"Che differenza c'è tra evaporazione ed ebollizione?",o:["L'evaporazione riguarda solo la superficie e avviene a ogni temperatura; l'ebollizione tutta la massa, a temperatura definita", "Sono la stessa cosa", "L'ebollizione avviene a qualsiasi temperatura", "L'evaporazione riguarda tutta la massa"],a:0,e:"Entrambe sono forme di vaporizzazione."},
{id:"cl3_069",t:"cl3",p:"3.7.1",l:2,q:"Che differenza c'è tra condensazione e liquefazione?",o:["La condensazione avviene per raffreddamento, la liquefazione per compressione", "Sono sinonimi", "La liquefazione avviene per riscaldamento", "La condensazione riguarda i solidi"],a:0,e:"Entrambe portano un aeriforme allo stato liquido."},
{id:"cl3_070",t:"cl3",p:"3.7.1",l:3,q:"Durante una sosta termica in una curva di riscaldamento…",o:["la temperatura resta costante perché il calore serve a vincere le interazioni (Q = m·λ)", "la temperatura aumenta rapidamente", "il calore non viene assorbito", "cambia il calore specifico"],a:0,e:"Durante il passaggio di stato i moti termici non cambiano: l'energia rompe i legami tra le particelle."},
{id:"cl3_071",t:"cl3",p:"3.7.1",l:3,q:"Perché i tratti di riscaldamento del ghiaccio e dell'acqua liquida hanno pendenze diverse?",o:["Perché il calore specifico è diverso nei due stati", "Perché la massa cambia", "Perché il calore latente è zero", "Perché la pressione cambia"],a:0,e:"Q = m·c·ΔT: con c diverso, a parità di calore ΔT cambia."},
{id:"cl3_072",t:"cl3",p:"3.7.2",l:1,q:"Qual è l'equazione di stato dei gas perfetti?",o:["PV = nRT", "PV = costante", "P/T = costante", "P = nRT·V"],a:0,e:"Lega pressione, volume, moli e temperatura assoluta."},
{id:"cl3_073",t:"cl3",p:"3.7.2",l:2,q:"Che differenza c'è tra gas e vapore?",o:["Il gas è sopra la sua temperatura critica, il vapore sotto", "Il vapore è più denso del liquido", "Il gas è sempre colorato", "Nessuna"],a:0,e:"Sotto la temperatura critica l'aeriforme (vapore) si può liquefare per sola compressione."},
{id:"cl3_074",t:"cl3",p:"3.7.2",l:2,q:"Una miscela di gas a 800 torr contiene il 60% di O₂. Qual è la pressione parziale di O₂?",o:["480 torr", "320 torr", "800 torr", "60 torr"],a:0,e:"Per Dalton Pᵢ = P_tot · xᵢ = 0,60 · 800 = 480 torr."},
{id:"cl3_075",t:"cl3",p:"3.7.2",l:2,q:"A quante atmosfere corrispondono 760 mmHg?",o:["1 atm", "0,76 atm", "76 atm", "10 atm"],a:0,e:"1 atm = 760 mmHg = 760 torr."},
{id:"cl3_076",t:"cl3",p:"3.7.2",l:3,q:"Quali ipotesi fa il modello del gas ideale?",o:["Particelle senza volume proprio, nessuna interazione a distanza, urti perfettamente elastici", "Particelle con volume grande e attrazioni forti", "Urti anelastici", "Particelle ferme"],a:0,e:"I gas reali si avvicinano al modello ad alte temperature e basse pressioni."},
{id:"cl3_077",t:"cl3",p:"3.7.2",l:3,q:"Che cosa correggono i parametri a e b dell'equazione di van der Waals?",o:["Le interazioni tra molecole e il covolume dei gas reali", "La massa molare", "Il numero di Avogadro", "La costante R"],a:0,e:"(P + an²/V²)(V − nb) = nRT, legge empirica per i gas reali."},
{id:"cl3_078",t:"cl3",p:"3.7.2",l:3,q:"Secondo la legge di Maxwell-Boltzmann, che cosa succede alzando la temperatura di un gas?",o:["Aumenta la velocità media delle particelle e la curva si allarga", "Tutte le particelle assumono la stessa velocità", "Diminuisce la velocità media", "La curva non cambia"],a:0,e:"Poche particelle sono molto lente o molto veloci; la maggior parte ha velocità intermedie."},
{id:"cl3_079",t:"cl3",p:"3.7.3",l:1,q:"Quali caratteristiche ha un liquido?",o:["Volume proprio, forma del recipiente, quasi incomprimibile", "Forma e volume propri", "Né forma né volume propri", "Molto comprimibile"],a:0,e:"Le interazioni intermolecolari vincolano le particelle."},
{id:"cl3_080",t:"cl3",p:"3.7.3",l:2,q:"Perché le gocce d'acqua sono sferiche?",o:["Per la tensione superficiale: il liquido minimizza la sua area", "Per la gravità", "Per la pressione atmosferica", "Per l'evaporazione"],a:0,e:"Le forze di coesione all'interno sono maggiori di quelle con l'aria in superficie."},
{id:"cl3_081",t:"cl3",p:"3.7.3",l:2,q:"Che cos'è la temperatura di ebollizione?",o:["La temperatura alla quale la tensione di vapore del liquido è uguale alla pressione esterna", "La temperatura alla quale il liquido inizia a evaporare", "Sempre 100 °C", "La temperatura critica"],a:0,e:"Per questo dipende dalla pressione esterna."},
{id:"cl3_082",t:"cl3",p:"3.7.3",l:3,q:"Perché in montagna l'acqua bolle sotto i 100 °C?",o:["La pressione esterna è minore di 1 atm", "L'aria è più fredda", "L'acqua contiene meno sali", "La tensione di vapore è più alta"],a:0,e:"Con pressione esterna minore basta una tensione di vapore minore, quindi una temperatura più bassa. Nella pentola a pressione succede il contrario."},
{id:"cl3_083",t:"cl3",p:"3.7.4",l:1,q:"Che tipo di moto hanno le particelle di un solido?",o:["Solo vibrazioni attorno a posizioni di equilibrio", "Traslazioni libere", "Rotazioni e traslazioni", "Nessun moto"],a:0,e:"Nei liquidi e nei gas ci sono anche moti traslazionali e rotazionali."},
{id:"cl3_084",t:"cl3",p:"3.7.4",l:2,q:"Che differenza c'è tra solidi cristallini e amorfi?",o:["I cristallini hanno ordine a lungo raggio e punto di fusione definito; gli amorfi no (intervallo di rammollimento)", "Gli amorfi sono più ordinati", "I cristallini non hanno reticolo", "Nessuna"],a:0,e:"Nei cristalli la cella elementare si ripete nelle tre dimensioni."},
{id:"cl3_085",t:"cl3",p:"3.7.4",l:2,q:"Il diamante è un esempio di solido…",o:["covalente", "ionico", "molecolare", "metallico"],a:0,e:"Atomi uniti da una rete tridimensionale di legami covalenti: durissimo e alto punto di fusione (anche Si e SiO₂)."},
{id:"cl3_086",t:"cl3",p:"3.7.4",l:3,q:"Quale coppia è correttamente abbinata?",o:["Ghiaccio – solido molecolare", "NaCl – solido covalente", "Ferro – solido ionico", "Diamante – solido molecolare"],a:0,e:"Solidi molecolari: H₂O, saccarosio, I₂; ionici: NaCl, CaCO₃; metallici: Fe, Au; covalenti: diamante, SiO₂."},
{id:"cl3_087",t:"cl3",p:"3.7.4",l:2,q:"Che cos'è la duttilità?",o:["La capacità di essere ridotto in fili sottili", "La capacità di essere ridotto in fogli", "La resistenza alla rottura", "La capacità di scalfire un altro corpo"],a:0,e:"Malleabilità = fogli; tenacità = resistenza alla rottura; durezza = capacità di scalfire."},
{id:"cl3_088",t:"cl3",p:"3.7.5",l:1,q:"Che cos'è il punto triplo?",o:["Il valore di T e P in cui coesistono in equilibrio le tre fasi", "Il punto di ebollizione a 1 atm", "Il punto in cui il liquido diventa fluido supercritico", "Il punto di fusione a 0 °C"],a:0,e:"Per l'acqua è a 0,01 °C e 0,006 atm."},
{id:"cl3_089",t:"cl3",p:"3.7.5",l:2,q:"Che cosa c'è oltre il punto critico?",o:["Solo la fase di fluido supercritico: liquido e aeriforme non si distinguono più", "Solo il solido", "Solo il vapore", "Tre fasi in equilibrio"],a:0,e:"Per l'acqua il punto critico è a 374 °C e 218 atm."},
{id:"cl3_090",t:"cl3",p:"3.7.5",l:3,q:"Che particolarità ha la curva di fusione dell'acqua?",o:["Ha pendenza negativa, perché il ghiaccio è meno denso dell'acqua", "Ha pendenza positiva come la CO₂", "È orizzontale", "Non esiste"],a:0,e:"Aumentando la pressione il ghiaccio fonde a temperatura più bassa."},
{id:"cl3_091",t:"cl3",p:"3.7.5",l:3,q:"Perché la CO₂ supercritica si usa per decaffeinare il caffè?",o:["Ha un punto critico facilmente raggiungibile (31 °C, 73 atm)", "È un liquido a temperatura ambiente", "È più densa del ghiaccio", "Ha un punto triplo a 0 °C"],a:0,e:"Il punto critico molto più accessibile rende possibile usarla nelle estrazioni industriali."},
{id:"cl3_092",t:"cl3",p:"3.7.6",l:1,q:"Perché l'evaporazione del sudore raffredda il corpo?",o:["Evaporando sottrae calore alla superficie cutanea", "Perché il sudore è freddo", "Perché aumenta la temperatura dell'aria", "Perché il sale riflette il calore"],a:0,e:"Il passaggio da liquido a vapore assorbe calore dal corpo."},
{id:"cl3_093",t:"cl3",p:"3.7.6",l:2,q:"Quale organo regola principalmente la temperatura corporea?",o:["L'ipotalamo", "Il cuore", "Il fegato", "Il midollo spinale"],a:0,e:"Monitorando i recettori termici, stimola le ghiandole sudoripare."},
{id:"cl3_094",t:"cl3",p:"3.7.6",l:2,q:"Perché con aria molto umida si soffre di più il caldo?",o:["L'aria satura di vapore ostacola l'evaporazione del sudore", "Perché il sudore diventa più salato", "Perché aumenta la pressione", "Perché si suda di meno"],a:0,e:"Meno evaporazione = meno calore dissipato."},
{id:"cl3_095",t:"cl3",p:"3.7.7",l:2,q:"Quale legge dei gas spiega la ventilazione polmonare?",o:["La legge di Boyle (P·V = costante)", "La legge di Henry", "La legge di Charles", "La legge di Avogadro"],a:0,e:"Durante l'inspirazione il volume del torace aumenta, la pressione diminuisce e l'aria entra."},
{id:"cl3_096",t:"cl3",p:"3.7.7",l:2,q:"Che cosa afferma la legge di Henry?",o:["La quantità di gas disciolto in un liquido è proporzionale alla sua pressione parziale", "La pressione totale è la somma delle parziali", "P·V = costante", "La diffusione è proporzionale allo spessore della membrana"],a:0,e:"Spiega come l'ossigeno si scioglie nel plasma."},
{id:"cl3_097",t:"cl3",p:"3.7.7",l:3,q:"Secondo la legge di Fick, la diffusione di un gas attraverso una membrana è inversamente proporzionale a…",o:["lo spessore della membrana", "l'area della superficie", "il gradiente di pressione parziale", "la diffusibilità del gas"],a:0,e:"È direttamente proporzionale ad area, gradiente e diffusibilità."},
{id:"cl3_098",t:"cl3",p:"3.7.7",l:3,q:"Durante l'inspirazione che cosa fa il diaframma?",o:["Si abbassa (si contrae), il volume toracico aumenta e la pressione diminuisce", "Si alza e la pressione aumenta", "Resta fermo", "Spinge fuori l'aria"],a:0,e:"L'espirazione invece è passiva: diaframma e intercostali si rilassano."},
{id:"cl3_sf1",t:"cl3",p:"3.3.7",l:4,q:"Quale specie ha geometria trigonale planare?",o:["BF₃", "NH₃", "H₂O", "CH₄"],a:0,e:"BF₃: 3 legami e nessun doppietto solitario (AX₃, 120°). NH₃ ha un doppietto ed è piramidale."},
{id:"cl3_sf2",t:"cl3",p:"3.7.2",l:4,q:"Un recipiente di 10,0 L contiene idrogeno a 100 atm e 30 °C. Quante moli contiene circa (R = 0,0821 L·atm/(mol·K))?",o:["40 mol", "400 mol", "4 mol", "0,4 mol"],a:0,e:"n = PV/RT = (100 · 10)/(0,0821 · 303) ≈ 40 mol. Attenzione a usare la temperatura in kelvin."},
{id:"cl3_sf3",t:"cl3",p:"3.6.1",l:4,q:"Quale sostanza ha la temperatura di ebollizione più alta?",o:["H₂O", "H₂S", "CH₄", "Ne"],a:0,e:"Solo l'acqua forma legami a idrogeno; H₂S ha solo interazioni dipolo-dipolo, CH₄ e Ne solo forze di dispersione."},
{id:"cl3_sf4",t:"cl3",p:"3.4",l:4,q:"Quale composto ha probabilmente l'energia reticolare più alta?",o:["MgO", "NaCl", "KBr", "NaI"],a:0,e:"Mg²⁺ e O²⁻ hanno carica doppia e sono piccoli: l'energia reticolare cresce con la carica e al diminuire delle dimensioni degli ioni."},
{id:"cl3_sf5",t:"cl3",p:"3.3.8",l:4,q:"Quale coppia contiene una molecola polare e una apolare, nell'ordine?",o:["NH₃ e BF₃", "CO₂ e CCl₄", "H₂O e HCl", "CH₄ e BF₃"],a:0,e:"NH₃ è piramidale (polare); BF₃ è trigonale planare con tre atomi uguali (apolare). Nelle altre coppie le molecole sono entrambe apolari o entrambe polari."},
{id:"cl4_001",t:"cl4",p:"4.1",l:1,q:"Qual è il numero di ossidazione di una sostanza allo stato elementare (es. O₂, Cu)?",o:["0", "+1", "−1", "Dipende dal gruppo"],a:0,e:"Regola 1: tutte le sostanze elementari hanno N.O. pari a 0."},
{id:"cl4_002",t:"cl4",p:"4.1",l:1,q:"Qual è di solito il N.O. dell'ossigeno nei composti?",o:["−2", "+2", "−1", "0"],a:0,e:"Fanno eccezione i perossidi (−1) e OF₂ (+2)."},
{id:"cl4_003",t:"cl4",p:"4.1",l:2,q:"Qual è il N.O. dell'idrogeno negli idruri metallici, come LiH?",o:["−1", "+1", "0", "+2"],a:0,e:"Normalmente H ha N.O. +1, ma legato a un metallo meno elettronegativo vale −1."},
{id:"cl4_004",t:"cl4",p:"4.1",l:2,q:"Qual è il N.O. dello zolfo in H₂SO₄?",o:["+6", "+4", "−2", "+8"],a:0,e:"2·(+1) + x + 4·(−2) = 0 ⇒ x = +6."},
{id:"cl4_005",t:"cl4",p:"4.1",l:2,q:"Qual è il N.O. dell'azoto in NO₃⁻?",o:["+5", "+3", "−3", "+6"],a:0,e:"x + 3·(−2) = −1 ⇒ x = +5. In uno ione la somma dei N.O. è uguale alla carica."},
{id:"cl4_006",t:"cl4",p:"4.1",l:3,q:"Qual è il N.O. del carbonio nello ione CO₃²⁻?",o:["+4", "+2", "−4", "+6"],a:0,e:"x + 3·(−2) = −2 ⇒ x = +4."},
{id:"cl4_007",t:"cl4",p:"4.1",l:3,q:"Qual è il N.O. dell'ossigeno nel perossido di idrogeno H₂O₂?",o:["−1", "−2", "+1", "0"],a:0,e:"2·(+1) + 2x = 0 ⇒ x = −1."},
{id:"cl4_008",t:"cl4",p:"4.1",l:3,q:"Che differenza c'è tra valenza e numero di ossidazione?",o:["La valenza è sempre positiva; il N.O. ha segno, perché tiene conto dell'elettronegatività", "Sono identici anche nel segno", "La valenza può essere negativa", "Il N.O. è sempre positivo"],a:0,e:"La valenza conta gli elettroni impegnati nei legami; il N.O. assegna gli elettroni di legame all'atomo più elettronegativo."},
{id:"cl4_009",t:"cl4",p:"4.1",l:3,q:"Un elemento del gruppo 15 può avere N.O. +6?",o:["No: un elemento non supera il numero del suo gruppo (+5 per il gruppo 15)", "Sì, sempre", "Sì, ma solo nei perossidi", "Solo l'azoto"],a:0,e:"Inoltre i gruppi 14 e 16 hanno di solito N.O. pari, i gruppi 15 e 17 dispari."},
{id:"cl4_010",t:"cl4",p:"4.1.1",l:1,q:"Che tipo di composti formano metalli e non metalli reagendo tra loro?",o:["Composti ionici", "Composti covalenti apolari", "Leghe metalliche", "Nessun composto"],a:0,e:"I non metalli tra loro formano invece composti covalenti."},
{id:"cl4_011",t:"cl4",p:"4.1.1",l:2,q:"I composti dei metalli sono tipicamente…",o:["basici", "acidi", "neutri", "anfoteri"],a:0,e:"I composti dei non metalli sono invece tipicamente acidi."},
{id:"cl4_012",t:"cl4",p:"4.2.2",l:1,q:"In un composto ionico, nella formula si scrive prima…",o:["il catione", "l'anione", "l'elemento più elettronegativo", "l'ossigeno"],a:0,e:"Gli elementi compaiono in ordine di elettronegatività crescente, quindi il catione precede l'anione."},
{id:"cl4_013",t:"cl4",p:"4.2.2",l:2,q:"Qual è la formula del composto tra alluminio e cloro?",o:["AlCl₃", "AlCl", "Al₃Cl", "Al₂Cl₃"],a:0,e:"Al³⁺ e Cl⁻: servono tre Cl⁻ per neutralizzare un Al³⁺."},
{id:"cl4_014",t:"cl4",p:"4.2.2",l:2,q:"Come si classifica NaHCO₃?",o:["Composto quaternario", "Composto binario", "Composto ternario", "Sostanza elementare"],a:0,e:"Contiene quattro elementi: Na, H, C, O."},
{id:"cl4_015",t:"cl4",p:"4.2.3",l:1,q:"Nella nomenclatura tradizionale, il suffisso -ico indica…",o:["il N.O. maggiore", "il N.O. minore", "il N.O. minimo tra quattro", "un composto binario"],a:0,e:"-oso = N.O. minore, -ico = maggiore; ipo-…-oso il minimo e per-…-ico il massimo."},
{id:"cl4_016",t:"cl4",p:"4.2.3",l:2,q:"Come si chiama Fe₂O₃ nella nomenclatura IUPAC con prefissi?",o:["Triossido di diferro", "Ossido ferroso", "Diossido di triferro", "Ossido di ferro(II)"],a:0,e:"La IUPAC usa prefissi numerali greci; con la notazione di Stock è ossido di ferro(III)."},
{id:"cl4_017",t:"cl4",p:"4.2.3",l:2,q:"Che cosa indica la notazione di Stock, per esempio ferro(III)?",o:["Il N.O. positivo dell'elemento, in numeri romani", "Il numero di atomi di ferro", "Il periodo del ferro", "La carica dell'anione"],a:0,e:"Si usa per gli elementi che hanno più numeri di ossidazione."},
{id:"cl4_018",t:"cl4",p:"4.2.3",l:3,q:"Con quattro N.O. possibili, quale prefisso e suffisso indicano il N.O. massimo?",o:["per-…-ico", "ipo-…-oso", "-oso", "-ico"],a:0,e:"Per esempio acido perclorico (Cl +7) contro acido ipocloroso (Cl +1)."},
{id:"cl4_019",t:"cl4",p:"4.3.1",l:1,q:"Negli idruri metallici l'idrogeno ha N.O.…",o:["−1", "+1", "0", "−2"],a:0,e:"Per esempio LiH (idruro di litio); negli idruri covalenti, come NH₃, ha +1."},
{id:"cl4_020",t:"cl4",p:"4.3.1",l:2,q:"Come si chiama HCl nella nomenclatura tradizionale?",o:["Acido cloridrico", "Acido cloroso", "Acido clorico", "Cloruro di idrogeno ionico"],a:0,e:"Gli idracidi si chiamano acido …-idrico; la IUPAC per la sostanza pura dice cloruro di idrogeno."},
{id:"cl4_021",t:"cl4",p:"4.3.1",l:2,q:"Che cos'è l'acido muriatico?",o:["Acido cloridrico, HCl", "Acido solforico", "Acido nitrico", "Ammoniaca"],a:0,e:"È un detergente energico che si usa per togliere il calcare."},
{id:"cl4_022",t:"cl4",p:"4.3.1",l:2,q:"Come si chiama PH₃?",o:["Fosfina (triidruro di fosforo)", "Acido fosforico", "Fosfato", "Idruro fosforoso"],a:0,e:"Per gli idruri covalenti come NH₃, CH₄, PH₃ la IUPAC ammette i nomi comuni."},
{id:"cl4_023",t:"cl4",p:"4.3.1",l:3,q:"Quale composto ternario rientra tra gli idracidi per analogia di comportamento?",o:["HCN (acido cianidrico)", "H₂SO₄", "HNO₃", "NaOH"],a:0,e:"Pur essendo ternario, HCN si comporta come gli idracidi."},
{id:"cl4_024",t:"cl4",p:"4.3.2",l:1,q:"Che cosa si ottiene dalla combinazione di un metallo con l'ossigeno?",o:["Un ossido basico", "Un'anidride", "Un idracido", "Un idruro"],a:0,e:"Formula generale MₓOᵧ; i non metalli con l'ossigeno formano ossidi acidi (anidridi)."},
{id:"cl4_025",t:"cl4",p:"4.3.2",l:2,q:"Come si chiama SO₃ nella nomenclatura tradizionale?",o:["Anidride solforica", "Anidride solforosa", "Ossido solforico", "Acido solforico"],a:0,e:"S ha N.O. +6 (il maggiore tra +4 e +6): anidride solforica. SO₂ è l'anidride solforosa."},
{id:"cl4_026",t:"cl4",p:"4.3.2",l:2,q:"Perché CO non si chiama \"anidride carboniosa\"?",o:["Perché non reagisce con l'acqua e non esiste un acido carbonioso", "Perché è un ossido basico", "Perché contiene un metallo", "Perché è ionico"],a:0,e:"Si chiamano anidridi solo gli ossidi acidi che reagendo con l'acqua danno ossiacidi, come CO₂ → H₂CO₃."},
{id:"cl4_027",t:"cl4",p:"4.3.2",l:3,q:"Il manganese con N.O. +7 forma…",o:["un'anidride (anidride permanganica, Mn₂O₇)", "un ossido basico", "un idruro", "un idracido"],a:0,e:"Mn e Cr formano composti tipici dei metalli con N.O. bassi e dei non metalli con N.O. alti."},
{id:"cl4_028",t:"cl4",p:"4.3.2",l:2,q:"Come si chiama Cu₂O nella nomenclatura di Stock?",o:["Ossido di rame(I)", "Ossido di rame(II)", "Ossido rameico", "Diossido di rame"],a:0,e:"Il rame ha N.O. +1 (ossido rameoso); CuO è ossido di rame(II)."},
{id:"cl4_029",t:"cl4",p:"4.3.3",l:1,q:"Quale desinenza hanno i sali degli idracidi?",o:["-uro", "-ato", "-ito", "-ico"],a:0,e:"Per esempio cloruro di sodio, bromuro di potassio, solfuro rameico."},
{id:"cl4_030",t:"cl4",p:"4.3.3",l:2,q:"Qual è la formula del cloruro di calcio?",o:["CaCl₂", "CaCl", "Ca₂Cl", "CaCl₃"],a:0,e:"Ca²⁺ e Cl⁻: servono due Cl⁻ per ogni Ca²⁺."},
{id:"cl4_031",t:"cl4",p:"4.3.3",l:2,q:"Qual è la formula del bromuro di potassio?",o:["KBr", "K₂Br", "KBr₂", "PBr"],a:0,e:"K⁺ e Br⁻ hanno cariche opposte uguali: rapporto 1 : 1."},
{id:"cl4_032",t:"cl4",p:"4.4.1",l:1,q:"Qual è la formula generale degli idrossidi?",o:["M(OH)ₓ", "HₓXOᵧ", "MₓOᵧ", "MₓHᵧ"],a:0,e:"Sono formati da un metallo e uno o più gruppi OH⁻; in soluzione si comportano da basi."},
{id:"cl4_033",t:"cl4",p:"4.4.1",l:2,q:"Come si chiama Pb(OH)₄ nella nomenclatura tradizionale?",o:["Idrossido piombico", "Idrossido piomboso", "Ossido piombico", "Acido piombico"],a:0,e:"Pb ha N.O. +4 (il maggiore tra +2 e +4)."},
{id:"cl4_034",t:"cl4",p:"4.4.1",l:2,q:"Come si comportano gli idrossidi in soluzione?",o:["Da basi, strappando ioni H⁺ all'acqua", "Da acidi, cedendo H⁺", "Restano indissociati", "Si decompongono in ossido e idrogeno"],a:0,e:"Sono le basi tipiche della chimica inorganica."},
{id:"cl4_035",t:"cl4",p:"4.4.2",l:1,q:"Qual è la formula generale degli ossiacidi?",o:["HₓXᵧOᵤ (idrogeno, non metallo, ossigeno)", "M(OH)ₓ", "HₓX", "MₓOᵧ"],a:0,e:"Sono composti ternari molecolari; in soluzione cedono H⁺."},
{id:"cl4_036",t:"cl4",p:"4.4.2",l:2,q:"Qual è il N.O. del bromo nell'acido perbromico HBrO₄?",o:["+7", "+5", "+3", "+1"],a:0,e:"+1 + x − 8 = 0 ⇒ x = +7: il massimo, quindi per-…-ico."},
{id:"cl4_037",t:"cl4",p:"4.4.2",l:2,q:"Togliendo H⁺ all'acido clorico HClO₃, quale anione si ottiene?",o:["Clorato, ClO₃⁻", "Clorito, ClO₂⁻", "Cloruro, Cl⁻", "Perclorato, ClO₄⁻"],a:0,e:"-ico diventa -ato, -oso diventa -ito: acido clorico → ione clorato."},
{id:"cl4_038",t:"cl4",p:"4.4.2",l:2,q:"Come si chiama HCO₃⁻?",o:["Ione bicarbonato (idrogenocarbonato)", "Ione carbonato", "Ione carbonico", "Ione carburo"],a:0,e:"Deriva dall'acido carbonico per perdita di un solo H⁺."},
{id:"cl4_039",t:"cl4",p:"4.4.2",l:3,q:"Qual è la formula del solfato di alluminio?",o:["Al₂(SO₄)₃", "AlSO₄", "Al₃(SO₄)₂", "Al(SO₄)₂"],a:0,e:"Al³⁺ e SO₄²⁻: 2 · (+3) = 3 · (−2), quindi due Al e tre solfati."},
{id:"cl4_040",t:"cl4",p:"4.4.2",l:3,q:"Qual è il N.O. del rame in Cu(NO₃)₂?",o:["+2", "+1", "+3", "0"],a:0,e:"Ogni nitrato ha carica −1: due nitrati richiedono Cu²⁺ (nitrato rameico)."},
{id:"cl4_041",t:"cl4",p:"4.4.2",l:3,q:"L'acido ortofosforico H₃PO₄ si ottiene formalmente da P₂O₅ con quante molecole di acqua?",o:["3", "1", "2", "4"],a:0,e:"Con 1 H₂O si ha l'acido metafosforico, con 2 il pirofosforico, con 3 l'ortofosforico (il più stabile)."},
{id:"cl4_042",t:"cl4",p:"4.4.2",l:3,q:"Qual è l'anione nel sale K₂HPO₄?",o:["HPO₄²⁻ (idrogenofosfato)", "PO₄³⁻", "H₂PO₄⁻", "K⁺"],a:0,e:"Due K⁺ bilanciano un anione con carica −2, derivato da H₃PO₄ per perdita di due H⁺."},
{id:"cl4_043",t:"cl4",p:"4.5",l:1,q:"Che cosa si ottiene da un ossido basico e acqua?",o:["Un idrossido", "Un ossiacido", "Un sale", "Un idruro"],a:0,e:"Per esempio Na₂O + H₂O → 2 NaOH."},
{id:"cl4_044",t:"cl4",p:"4.5",l:1,q:"Che cosa si ottiene da un'anidride e acqua?",o:["Un ossiacido", "Un idrossido", "Un idruro", "Un ossido basico"],a:0,e:"Per esempio SO₃ + H₂O → H₂SO₄."},
{id:"cl4_045",t:"cl4",p:"4.5",l:2,q:"Che cosa si forma dalla reazione tra un acido e un idrossido?",o:["Un sale e acqua", "Un ossido e idrogeno", "Un'anidride", "Un idracido"],a:0,e:"È la reazione di neutralizzazione, per esempio 2 NaOH + H₂SO₄ → Na₂SO₄ + 2 H₂O."},
{id:"cl4_046",t:"cl4",p:"4.5",l:2,q:"Quale prodotto si ottiene da CuO + H₂O?",o:["Cu(OH)₂", "CuOH", "H₂CuO₂ (un acido)", "Cu + H₂O₂"],a:0,e:"Il rame ha N.O. +2: servono due OH⁻ per ogni Cu²⁺."},
{id:"cl4_047",t:"cl4",p:"4.5",l:3,q:"Che cosa si ottiene da un non metallo come Cl₂ e l'idrogeno H₂?",o:["Un idracido", "Un idruro metallico", "Un'anidride", "Un idrossido"],a:0,e:"Non metallo (F₂, Cl₂, Br₂, I₂, S) + H₂ → idracido."},
{id:"cl4_048",t:"cl4",p:"4.6",l:2,q:"In un composto di coordinazione, come si comporta l'atomo centrale?",o:["Da accettore di coppie di elettroni (acido di Lewis)", "Da donatore di elettroni", "Da base di Brønsted", "Non forma legami"],a:0,e:"I leganti donano doppietti (basi di Lewis) all'atomo centrale, di solito un metallo di transizione."},
{id:"cl4_049",t:"cl4",p:"4.6",l:2,q:"Che cos'è il numero di coordinazione?",o:["Il numero di atomi donatori legati all'atomo centrale", "Il N.O. del metallo", "Il numero di leganti diversi", "La carica del complesso"],a:0,e:"In [Ag(NH₃)₂]⁺ vale 2; con l'EDTA esadentato vale 6."},
{id:"cl4_050",t:"cl4",p:"4.6",l:3,q:"Quale legante è esadentato?",o:["EDTA", "NH₃", "H₂O", "Cl⁻"],a:0,e:"I leganti polidentati si chiamano chelanti; l'etilendiammina è bidentata, il citrato tridentato."},
{id:"cl4_051",t:"cl4",p:"4.6",l:3,q:"Quale complesso è un esempio di isomeria cis-trans?",o:["Il cisplatino [Pt(NH₃)₂Cl₂]", "[Ag(NH₃)₂]⁺", "[Fe(CN)₆]³⁻ omolettico", "[Cu(NH₃)₄]²⁺"],a:0,e:"I complessi planari quadrati o ottaedrici possono avere isomeri cis e trans."},
{id:"cl4_052",t:"cl4",p:"4.6",l:2,q:"Quale biomolecola contiene ferro legato con legame di coordinazione?",o:["L'emoglobina (gruppo eme)", "La clorofilla", "La vitamina B₁₂", "L'insulina"],a:0,e:"Nella clorofilla c'è il magnesio, nella cobalamina (B₁₂) il cobalto."},
{id:"cl4_053",t:"cl4",p:"4.7",l:2,q:"Diamante e grafite sono…",o:["allotropi del carbonio", "isotopi del carbonio", "polimorfi dello zolfo", "isomeri"],a:0,e:"L'allotropia riguarda forme diverse dello stesso elemento (anche O₂ e O₃)."},
{id:"cl4_054",t:"cl4",p:"4.7",l:3,q:"Perché il polimorfismo è importante in farmacia?",o:["Forme cristalline diverse dello stesso principio attivo possono avere diversa biodisponibilità", "Perché cambia la formula del farmaco", "Perché rende il farmaco radioattivo", "Perché aumenta il numero atomico"],a:0,e:"I polimorfi differiscono in punto di fusione, densità e solubilità."},
{id:"cl4_055",t:"cl4",p:"4.7.1",l:1,q:"Qual è l'elemento più abbondante nell'Universo?",o:["L'idrogeno", "L'ossigeno", "L'elio", "Il carbonio"],a:0,e:"Ha configurazione 1s¹ ed è formato, nell'isotopo più leggero, da un protone e un elettrone."},
{id:"cl4_056",t:"cl4",p:"4.7.1",l:2,q:"Com'è l'idrogeno elementare?",o:["Un gas di molecole biatomiche H₂, poco reattivo in condizioni ordinarie", "Un metallo solido", "Un gas monoatomico", "Un liquido"],a:0,e:"Se attivato con catalizzatori o ad alta temperatura reagisce in modo violento."},
{id:"cl4_057",t:"cl4",p:"4.7.2",l:1,q:"Che configurazione esterna hanno i metalli alcalini?",o:["ns¹", "ns²", "ns² np¹", "ns² np⁵"],a:0,e:"Perdono facilmente l'unico elettrone esterno e formano ioni +1."},
{id:"cl4_058",t:"cl4",p:"4.7.2",l:2,q:"Perché i metalli alcalini non si trovano liberi in natura?",o:["Sono molto reattivi, soprattutto con l'acqua", "Sono gas", "Sono radioattivi", "Sono troppo pesanti"],a:0,e:"Si trovano come cloruri, carbonati, solfati, silicati e nitrati."},
{id:"cl4_059",t:"cl4",p:"4.7.2",l:2,q:"Come si comportano in acqua gli idrossidi dei metalli alcalini?",o:["Si dissociano completamente: sono basi forti", "Sono acidi deboli", "Non si sciolgono", "Sono anfoteri"],a:0,e:"Per esempio NaOH e KOH."},
{id:"cl4_060",t:"cl4",p:"4.7.3",l:2,q:"Come si chiamano Ca(OH)₂ e CaO nell'uso comune?",o:["Calce spenta e calce viva", "Calce viva e calce spenta", "Gesso e marmo", "Soda e potassa"],a:0,e:"CaO è la calce viva; con l'acqua dà Ca(OH)₂, la calce spenta."},
{id:"cl4_061",t:"cl4",p:"4.7.3",l:2,q:"Quale ione dei metalli alcalino-terrosi è presente nella clorofilla?",o:["Mg²⁺", "Ca²⁺", "Ba²⁺", "Na⁺"],a:0,e:"Il magnesio è l'atomo centrale della clorofilla."},
{id:"cl4_062",t:"cl4",p:"4.7.4",l:2,q:"In quale vitamina si trova il cobalto?",o:["Vitamina B₁₂ (cobalamina)", "Vitamina C", "Vitamina D", "Vitamina K"],a:0,e:"È essenziale nella sintesi delle basi azotate."},
{id:"cl4_063",t:"cl4",p:"4.7.4",l:3,q:"Quale metallo di transizione si trova nelle proteine zinc-finger e nell'anidrasi carbonica?",o:["Zinco", "Rame", "Ferro", "Cobalto"],a:0,e:"Lo zinco forma ZnO, poco solubile e anfotero."},
{id:"cl4_064",t:"cl4",p:"4.7.5",l:2,q:"Come si comporta l'ossido di alluminio Al₂O₃?",o:["È anfotero", "È un ossido acido", "È un ossido basico forte", "Non esiste"],a:0,e:"Oltre all'idrossido Al(OH)₃ esistono i sali alluminati. B₂O₃ è invece acido."},
{id:"cl4_065",t:"cl4",p:"4.7.5",l:2,q:"Che natura ha il boro?",o:["È un semimetallo che forma composti covalenti", "È un metallo alcalino", "È un gas nobile", "È un alogeno"],a:0,e:"Nel gruppo 13 l'alluminio è invece un metallo."},
{id:"cl4_066",t:"cl4",p:"4.7.6",l:2,q:"Quale ossido del silicio è noto come silice?",o:["SiO₂", "SiO", "Si₂O₃", "SiO₄⁴⁻"],a:0,e:"La silice è solida e ha carattere acido; nei silicati il silicio compare come SiO₄⁴⁻."},
{id:"cl4_067",t:"cl4",p:"4.7.6",l:2,q:"Quale composto del carbonio è essenziale per la regolazione del pH ematico?",o:["L'acido carbonico H₂CO₃", "Il monossido di carbonio", "Il metano", "Il carburo di silicio"],a:0,e:"Si forma da CO₂ e acqua."},
{id:"cl4_068",t:"cl4",p:"4.7.7",l:2,q:"Che forma ha l'azoto allo stato elementare?",o:["Gas inerte di molecole N₂, principale componente dell'aria", "Solido bianco", "Gas monoatomico", "Liquido"],a:0,e:"L'azoto è presente in amminoacidi, proteine, nucleotidi e acidi nucleici."},
{id:"cl4_069",t:"cl4",p:"4.7.7",l:2,q:"Quali N.O. sono più comuni per gli elementi del gruppo 15?",o:["−3, +3 e +5", "−2, +4 e +6", "+1 e +2", "−1 e +7"],a:0,e:"Formano ossidi acidi, alcuni dei quali sono anidridi."},
{id:"cl4_070",t:"cl4",p:"4.7.8",l:2,q:"Che percentuale dell'aria costituisce l'ossigeno O₂?",o:["Circa il 20%", "Circa il 78%", "Circa l'1%", "Circa il 50%"],a:0,e:"Si trova anche come ozono O₃ nell'ozonosfera."},
{id:"cl4_071",t:"cl4",p:"4.7.8",l:3,q:"Perché lo zolfo è importante nelle proteine?",o:["Forma ponti disolfuro che stabilizzano le strutture terziarie e quaternarie", "Forma legami ionici con il ferro", "È il componente principale della catena peptidica", "Lega l'ossigeno nel sangue"],a:0,e:"È contenuto in amminoacidi come la cisteina."},
{id:"cl4_072",t:"cl4",p:"4.7.9",l:1,q:"Qual è il N.O. più comune degli alogeni?",o:["−1", "+1", "−2", "+7"],a:0,e:"Tranne il fluoro, possono avere anche +1, +3, +5, +7."},
{id:"cl4_073",t:"cl4",p:"4.7.9",l:2,q:"Quale idracido degli alogeni NON è un acido forte?",o:["HF", "HCl", "HBr", "HI"],a:0,e:"Gli idracidi degli alogeni sono acidi forti, tranne l'acido fluoridrico."},
{id:"cl4_074",t:"cl4",p:"4.7.9",l:2,q:"A temperatura ambiente il bromo Br₂ è…",o:["un liquido volatile", "un gas", "un solido che sublima", "un metallo"],a:0,e:"F₂ e Cl₂ sono gassosi, I₂ è solido e tende a sublimare."},
{id:"cl4_075",t:"cl4",p:"4.7.10",l:2,q:"Perché i gas nobili sono chimicamente inerti?",o:["Hanno la configurazione esterna completa (ottetto, o duetto per l'elio)", "Hanno bassa energia di ionizzazione", "Sono radioattivi", "Hanno elettronegatività altissima"],a:0,e:"Hanno energia di ionizzazione molto elevata."},
{id:"cl4_076",t:"cl4",p:"4.7.10",l:2,q:"Quale gas nobile radioattivo è un fattore di rischio per il tumore ai polmoni?",o:["Il radon", "Lo xeno", "L'argon", "L'elio"],a:0,e:"Deriva dal decadimento dell'uranio nelle rocce e si accumula negli ambienti chiusi ai piani bassi."},
{id:"cl4_077",t:"cl4",p:"4.7.10",l:3,q:"Da quale gas nobile in giù si possono preparare alcuni rari composti?",o:["Dall'argon", "Dall'elio", "Dal neon", "Nessuno forma composti"],a:0,e:"Soprattutto fluoruri, come XeF₂, XeF₄, RnF₂."},
{id:"cl4_sf1",t:"cl4",p:"4.1",l:4,q:"In quale composto il cromo ha numero di ossidazione +6?",o:["K₂Cr₂O₇", "Cr₂O₃", "CrCl₂", "Cr(OH)₃"],a:0,e:"2·(+1) + 2x + 7·(−2) = 0 ⇒ x = +6. Negli altri il cromo ha +3 o +2."},
{id:"cl4_sf2",t:"cl4",p:"4.4.2",l:4,q:"Quale formula corrisponde al fosfato di calcio?",o:["Ca₃(PO₄)₂", "CaPO₄", "Ca₂(PO₄)₃", "Ca(PO₄)₂"],a:0,e:"Ca²⁺ e PO₄³⁻: 3 · (+2) = 2 · (−3), quindi tre Ca e due fosfati."},
{id:"cl4_sf3",t:"cl4",p:"4.5",l:4,q:"Quale coppia di reagenti produce un sale ternario e acqua?",o:["SO₂ + 2 NaOH", "Na₂O + H₂O", "4 Na + O₂", "SO₃ + H₂O"],a:0,e:"Anidride + idrossido → sale ternario + acqua (qui Na₂SO₃). Le altre danno un idrossido, un ossido o un ossiacido."},
{id:"cl4_sf4",t:"cl4",p:"4.3.2",l:4,q:"Quale ossido, sciolto in acqua, rende la soluzione acida?",o:["SO₂", "Na₂O", "CaO", "MgO"],a:0,e:"SO₂ è l'ossido di un non metallo (anidride solforosa) e con l'acqua dà acido solforoso; gli altri sono ossidi basici."},
{id:"cl5_001",t:"cl5",p:"5",l:1,q:"Che cosa indica il simbolo (aq) dopo una formula?",o:["Che la specie è in soluzione acquosa", "Che è un gas", "Che è un liquido puro", "Che è un solido"],a:0,e:"(s) solido, (l) liquido, (g) gas, (aq) in soluzione acquosa."},
{id:"cl5_002",t:"cl5",p:"5",l:2,q:"Una reazione in cui reagenti e prodotti stanno in un'unica fase si dice…",o:["in fase omogenea", "in fase eterogenea", "di decomposizione", "di doppio scambio"],a:0,e:"Se il sistema presenta più di una fase la reazione è in fase eterogenea."},
{id:"cl5_003",t:"cl5",p:"5",l:2,q:"CaCO₃ → CaO + CO₂ è una reazione di…",o:["decomposizione", "sintesi", "doppio scambio", "neutralizzazione"],a:0,e:"Un'unica sostanza si scinde in sostanze più semplici."},
{id:"cl5_004",t:"cl5",p:"5",l:2,q:"BaCl₂ + Na₂SO₄ → BaSO₄ + 2 NaCl è una reazione di…",o:["doppio scambio (metatesi)", "scambio semplice", "sintesi", "combustione"],a:0,e:"Due composti si scambiano ioni."},
{id:"cl5_005",t:"cl5",p:"5",l:3,q:"Che cos'è una reazione di condensazione?",o:["L'unione di due molecole con perdita di una piccola molecola, come H₂O", "La rottura di una molecola con l'acqua", "Il passaggio da gas a liquido", "Una reazione di combustione"],a:0,e:"L'opposto è l'idrolisi, la rottura di una molecola per mezzo dell'acqua."},
{id:"cl5_006",t:"cl5",p:"5",l:2,q:"Nella combustione CH₄ + 2 O₂ → CO₂ + 2 H₂O, qual è il comburente?",o:["L'ossigeno", "Il metano", "L'anidride carbonica", "L'acqua"],a:0,e:"Il combustibile si ossida a opera del comburente, di solito l'ossigeno, con sviluppo di calore."},
{id:"cl5_007",t:"cl5",p:"5.1",l:2,q:"Nell'equazione ionica, come si scrivono gli elettroliti forti?",o:["Come ioni separati", "In forma molecolare", "Non si scrivono", "Solo come prodotti"],a:0,e:"Solidi, gas ed elettroliti deboli restano in forma molecolare."},
{id:"cl5_008",t:"cl5",p:"5.1",l:2,q:"Che cosa sono gli ioni spettatori?",o:["Ioni uguali a sinistra e a destra, che si omettono nell'equazione ionica netta", "Ioni che precipitano", "Ioni che si ossidano", "Ioni che formano gas"],a:0,e:"Nella reazione tra CaCl₂ e AgNO₃, Ca²⁺ e NO₃⁻ sono spettatori."},
{id:"cl5_009",t:"cl5",p:"5.1",l:3,q:"Qual è l'equazione ionica netta di CaCl₂(aq) + 2 AgNO₃(aq) → Ca(NO₃)₂(aq) + 2 AgCl(s)?",o:["Ag⁺(aq) + Cl⁻(aq) → AgCl(s)", "Ca²⁺ + 2 NO₃⁻ → Ca(NO₃)₂", "CaCl₂ → Ca²⁺ + 2 Cl⁻", "Ag⁺ + NO₃⁻ → AgNO₃"],a:0,e:"Restano solo le specie che cambiano: gli ioni che formano il precipitato."},
{id:"cl5_010",t:"cl5",p:"5.2",l:1,q:"Nel bilanciare un'equazione, che cosa NON si può modificare?",o:["I pedici delle formule", "I coefficienti stechiometrici", "L'ordine dei reagenti", "Il numero di prodotti"],a:0,e:"Si possono cambiare solo i coefficienti, altrimenti cambierebbero le sostanze."},
{id:"cl5_011",t:"cl5",p:"5.2",l:2,q:"Quali elementi conviene bilanciare per ultimi?",o:["Idrogeno e ossigeno", "Gli elementi che compaiono una volta sola", "I metalli", "Gli ioni poliatomici"],a:0,e:"Si inizia dagli elementi che compaiono meno spesso."},
{id:"cl5_012",t:"cl5",p:"5.2",l:2,q:"Quale equazione è correttamente bilanciata?",o:["2 NH₃ → 3 H₂ + N₂", "4 NH₃ → 6 H₂ + 2 N₂", "NH₃ → 3/2 H₂ + 1/2 N₂", "NH₃ → H₂ + N₂"],a:0,e:"I coefficienti devono essere i minimi numeri interi possibili."},
{id:"cl5_013",t:"cl5",p:"5.2",l:3,q:"Come si bilanciano gli ioni poliatomici che compaiono uguali nei due membri?",o:["Come entità uniche", "Atomo per atomo, separandoli", "Non vanno bilanciati", "Si cambiano i pedici"],a:0,e:"Per esempio SO₄²⁻ si conta come un blocco."},
{id:"cl5_014",t:"cl5",p:"5.3",l:1,q:"Che cosa avviene in una reazione redox?",o:["Un trasferimento di elettroni tra specie chimiche", "Un trasferimento di protoni", "Uno scambio di neutroni", "Solo un cambio di stato"],a:0,e:"Alcuni elementi (di solito due) cambiano numero di ossidazione."},
{id:"cl5_015",t:"cl5",p:"5.3",l:1,q:"Una specie che si ossida…",o:["perde elettroni e aumenta il N.O.", "acquista elettroni e diminuisce il N.O.", "acquista protoni", "non cambia N.O."],a:0,e:"\"Chi si Ossida Perde elettroni, chi si Riduce Acquista elettroni\"."},
{id:"cl5_016",t:"cl5",p:"5.3",l:2,q:"Che cos'è l'agente riducente?",o:["La specie che si ossida, cedendo elettroni all'altra", "La specie che si riduce", "Il catalizzatore", "Il solvente"],a:0,e:"Il riducente si ossida; l'ossidante si riduce acquistando elettroni."},
{id:"cl5_017",t:"cl5",p:"5.3",l:2,q:"Che cos'è una disproporzione (dismutazione)?",o:["Una stessa specie si trasforma in due specie dello stesso elemento con N.O. più alto e più basso", "Due specie con N.O. diversi danno un N.O. intermedio", "Una reazione senza trasferimento di elettroni", "Una reazione acido-base"],a:0,e:"L'opposto è la comproporzione, in cui da due N.O. diversi si arriva a uno intermedio."},
{id:"cl5_018",t:"cl5",p:"5.3",l:3,q:"In 2 Na + Cl₂ → 2 NaCl, chi è l'ossidante?",o:["Il cloro", "Il sodio", "NaCl", "Nessuno: non è una redox"],a:0,e:"Il cloro passa da 0 a −1 (si riduce, è l'ossidante); il sodio da 0 a +1 (si ossida, è il riducente)."},
{id:"cl5_019",t:"cl5",p:"5.3.1",l:2,q:"In una redox bilanciata, che cosa deve valere oltre alla conservazione della massa?",o:["La conservazione della carica: elettroni ceduti = elettroni acquistati", "La conservazione del volume", "L'uguaglianza delle masse molari", "La conservazione dei N.O."],a:0,e:"È il principio di elettroneutralità."},
{id:"cl5_020",t:"cl5",p:"5.3.1",l:2,q:"Nel metodo delle semireazioni, in ambiente acido come si pareggia la carica?",o:["Aggiungendo ioni H⁺", "Aggiungendo OH⁻", "Aggiungendo elettroni a caso", "Cambiando i pedici"],a:0,e:"In ambiente basico si aggiungono OH⁻; poi si bilanciano H e O con molecole d'acqua."},
{id:"cl5_021",t:"cl5",p:"5.3.1",l:3,q:"Perché si calcola il minimo comune multiplo nel bilanciamento redox?",o:["Per rendere uguali gli elettroni persi nell'ossidazione e acquistati nella riduzione", "Per trovare la massa molare", "Per bilanciare l'ossigeno", "Per trovare il pH"],a:0,e:"Si moltiplica ogni semireazione per il fattore necessario e poi si sommano."},
{id:"cl5_022",t:"cl5",p:"5.3.2",l:1,q:"Quale reazione di ossidazione rapida libera luce e calore?",o:["La combustione", "L'arrugginimento", "L'idrolisi", "La neutralizzazione"],a:0,e:"L'ossigeno è l'ossidante tipico; un'ossidazione lenta è l'arrugginimento del ferro."},
{id:"cl5_023",t:"cl5",p:"5.3.2",l:2,q:"Qual è l'accettore finale degli elettroni nella catena respiratoria degli organismi aerobi?",o:["L'ossigeno", "L'anidride carbonica", "L'acqua", "Il glucosio"],a:0,e:"Ha il potenziale di riduzione più alto della catena."},
{id:"cl5_024",t:"cl5",p:"5.4",l:1,q:"Che cosa studia l'elettrochimica?",o:["Le relazioni tra energia chimica ed energia elettrica", "Solo le reazioni nucleari", "I cambi di stato", "La velocità delle reazioni"],a:0,e:"Si fonda sulle reazioni redox."},
{id:"cl5_025",t:"cl5",p:"5.4",l:2,q:"Che differenza c'è tra pila e cella elettrolitica?",o:["La pila usa una redox spontanea per produrre energia elettrica; la cella elettrolitica usa energia elettrica per una redox non spontanea", "Sono la stessa cosa", "La pila richiede corrente dall'esterno", "La cella elettrolitica produce energia"],a:0,e:"Pila: energia chimica → elettrica; elettrolisi: elettrica → chimica."},
{id:"cl5_026",t:"cl5",p:"5.4.1",l:2,q:"Come conducono i conduttori di seconda specie?",o:["Per movimento di ioni, con reazioni chimiche agli elettrodi", "Per movimento di elettroni senza trasformazioni", "Non conducono", "Per movimento di neutroni"],a:0,e:"Sono soluzioni elettrolitiche o sali fusi; i metalli sono conduttori di prima specie."},
{id:"cl5_027",t:"cl5",p:"5.4.1",l:2,q:"I metalli sono conduttori di…",o:["prima specie", "seconda specie", "terza specie", "nessuna specie"],a:0,e:"Conducono grazie agli elettroni delocalizzati, senza trasformazioni chimiche."},
{id:"cl5_028",t:"cl5",p:"5.4.2",l:1,q:"Nella pila, dove avviene l'ossidazione?",o:["All'anodo, che è il polo negativo", "Al catodo, polo positivo", "Nel ponte salino", "Nel filo esterno"],a:0,e:"Al catodo (positivo) avviene la riduzione."},
{id:"cl5_029",t:"cl5",p:"5.4.2",l:2,q:"A che cosa serve il ponte salino?",o:["A mantenere il contatto ionico tra le due soluzioni senza mescolarle", "A produrre elettroni", "A ossidare lo zinco", "A misurare il pH"],a:0,e:"Contiene un elettrolita forte come KCl o KNO₃."},
{id:"cl5_030",t:"cl5",p:"5.4.2",l:2,q:"Come si calcola la f.e.m. di una pila?",o:["E(catodo) − E(anodo)", "E(anodo) − E(catodo)", "E(catodo) + E(anodo)", "E(catodo) · E(anodo)"],a:0,e:"Gli elettroni vanno dall'elettrodo a potenziale minore a quello maggiore."},
{id:"cl5_031",t:"cl5",p:"5.4.2",l:2,q:"A quale elettrodo è attribuito per convenzione il potenziale 0 V?",o:["All'elettrodo standard a idrogeno", "All'elettrodo di rame", "All'elettrodo di zinco", "All'elettrodo a vetro"],a:0,e:"I potenziali standard si misurano a 25 °C, concentrazioni 1 M e gas a 1 atm."},
{id:"cl5_032",t:"cl5",p:"5.4.2",l:3,q:"Qual è la f.e.m. della pila Daniell (Cu²⁺/Cu +0,34 V; Zn²⁺/Zn −0,76 V)?",o:["1,10 V", "0,42 V", "−1,10 V", "0,34 V"],a:0,e:"0,34 − (−0,76) = 1,10 V. Lo zinco si ossida (anodo), il rame si riduce (catodo)."},
{id:"cl5_033",t:"cl5",p:"5.4.2",l:3,q:"Una specie con potenziale di riduzione molto alto (es. F₂) è…",o:["un forte ossidante", "un forte riducente", "inerte", "un metallo alcalino"],a:0,e:"Più in alto sta nella serie elettrochimica, più tende a ridursi. Il litio, in fondo (−3,05 V), è un forte riducente."},
{id:"cl5_034",t:"cl5",p:"5.4.2",l:3,q:"Quando una redox è spontanea?",o:["Quando la sua f.e.m. (ΔE) è positiva", "Quando ΔE è negativa", "Sempre", "Mai"],a:0,e:"Se non è spontanea, lo è la reazione inversa."},
{id:"cl5_035",t:"cl5",p:"5.4.3",l:2,q:"Nella cella elettrolitica, quale segno ha l'anodo?",o:["Positivo (al contrario della pila)", "Negativo, come nella pila", "Nessuno", "Dipende dalla soluzione"],a:0,e:"In entrambe all'anodo avviene l'ossidazione, ma nell'elettrolisi l'anodo è il polo positivo."},
{id:"cl5_036",t:"cl5",p:"5.4.3",l:2,q:"Nell'elettrolisi dell'acqua, che cosa si sviluppa al catodo?",o:["Idrogeno", "Ossigeno", "Cloro", "Nulla"],a:0,e:"Al catodo l'H dell'acqua si riduce a H₂; all'anodo l'O si ossida a O₂."},
{id:"cl5_037",t:"cl5",p:"5.4.3",l:3,q:"Perché nell'elettrolisi dell'acqua si aggiunge un elettrolita?",o:["L'acqua pura conduce pochissimo", "Per produrre più ossigeno", "Per abbassare la temperatura", "Per evitare la formazione di idrogeno"],a:0,e:"Un acido o una base forte aumentano gli ioni mobili."},
{id:"cl5_038",t:"cl5",p:"5.4.4",l:2,q:"Che cosa afferma la prima legge di Faraday?",o:["La massa depositata è proporzionale alla carica passata (m = Z·q)", "La massa depositata non dipende dalla corrente", "La carica è proporzionale al volume", "Le masse depositate sono sempre uguali"],a:0,e:"Z è l'equivalente elettrochimico."},
{id:"cl5_039",t:"cl5",p:"5.4.4",l:2,q:"Quanto vale circa la costante di Faraday?",o:["96.485 C/mol", "6,02 · 10²³ C", "1,6 · 10⁻¹⁹ C", "8,314 C/mol"],a:0,e:"È la carica di una mole di elettroni."},
{id:"cl5_040",t:"cl5",p:"5.4.4",l:3,q:"Con la stessa carica (1 F), quante moli si depositano di Na (Na⁺ + e⁻) e di Ca (Ca²⁺ + 2e⁻)?",o:["1 mol di Na e 0,5 mol di Ca", "1 mol di entrambi", "0,5 mol di Na e 1 mol di Ca", "2 mol di Ca"],a:0,e:"Il calcio richiede due elettroni per atomo: con la stessa carica se ne deposita la metà."},
{id:"cl5_041",t:"cl5",p:"5.4.5",l:2,q:"A che cosa serve l'equazione di Nernst?",o:["A calcolare il potenziale di un elettrodo in condizioni non standard", "A calcolare la massa depositata", "A trovare il numero di ossidazione", "A bilanciare le redox"],a:0,e:"Tiene conto delle concentrazioni effettive delle specie."},
{id:"cl5_042",t:"cl5",p:"5.4.5",l:2,q:"Quale strumento si basa sull'equazione di Nernst?",o:["Il pH-metro, con l'elettrodo a vetro", "Il contatore Geiger", "Il dinamometro", "Lo spettrometro di massa"],a:0,e:"L'elettrodo a vetro è sensibile alla concentrazione di H⁺."},
{id:"cl5_043",t:"cl5",p:"5.4.5",l:3,q:"In una pila a concentrazione, che cosa genera la f.e.m.?",o:["La differenza di concentrazione della stessa coppia redox nelle due semicelle", "Due coppie redox diverse", "Il ponte salino", "La temperatura"],a:0,e:"Il processo tende ad annullare il gradiente di concentrazione."},
{id:"cl5_044",t:"cl5",p:"5.5",l:1,q:"Che cosa indicano i coefficienti stechiometrici, oltre al numero di molecole?",o:["I rapporti tra le moli che reagiscono e si formano", "Le masse in grammi", "I volumi dei liquidi", "Le cariche degli ioni"],a:0,e:"N₂ + 3 H₂ → 2 NH₃: 1 mol di N₂ con 3 mol di H₂ dà 2 mol di NH₃."},
{id:"cl5_045",t:"cl5",p:"5.5",l:2,q:"Che cos'è la stechiometria?",o:["La descrizione quantitativa di una reazione chimica", "Lo studio della struttura degli atomi", "Lo studio dei gas", "La misura del pH"],a:0,e:"Nota la quantità di una sostanza, l'equazione bilanciata permette di calcolare tutte le altre."},
{id:"cl5_046",t:"cl5",p:"5.5.1",l:2,q:"Quante moli di NH₃ si ottengono da 6 mol di H₂ con N₂ in eccesso (N₂ + 3 H₂ → 2 NH₃)?",o:["4 mol", "2 mol", "6 mol", "12 mol"],a:0,e:"3 : 2 = 6 : x ⇒ x = 4 mol."},
{id:"cl5_047",t:"cl5",p:"5.5.1",l:2,q:"Quanti grammi di NH₃ si ottengono da 56 g di N₂ con H₂ in eccesso (N = 14, H = 1)?",o:["68 g", "34 g", "17 g", "112 g"],a:0,e:"56 g di N₂ = 2 mol ⇒ 4 mol di NH₃ ⇒ 4 · 17 = 68 g."},
{id:"cl5_048",t:"cl5",p:"5.5.1",l:3,q:"Quanti litri di CO₂ (a 0 °C e 1 atm) si ottengono decomponendo 200 g di CaCO₃ (M = 100)?",o:["44,8 L", "22,4 L", "11,2 L", "89,6 L"],a:0,e:"200 g = 2 mol di CaCO₃ ⇒ 2 mol di CO₂ ⇒ 2 · 22,4 = 44,8 L."},
{id:"cl5_049",t:"cl5",p:"5.5.1",l:2,q:"Che cos'è il reagente limitante?",o:["Il reagente presente in difetto, che si esaurisce per primo e determina la quantità di prodotto", "Il reagente in eccesso", "Il catalizzatore", "Il prodotto principale"],a:0,e:"L'altro reagente resta in parte non reagito."},
{id:"cl5_050",t:"cl5",p:"5.5.1",l:3,q:"39 g di K (M = 39) reagiscono con 100 g di H₂O (M = 18): 2 K + 2 H₂O → 2 KOH + H₂. Qual è il reagente limitante?",o:["Il potassio", "L'acqua", "Nessuno", "Entrambi"],a:0,e:"1 mol di K reagisce con 1 mol di H₂O; di acqua ce ne sono 5,56 mol, quindi è in eccesso."},
{id:"cl5_051",t:"cl5",p:"5.5.1",l:2,q:"Come si calcola la resa percentuale?",o:["(resa effettiva / resa teorica) · 100", "(resa teorica / resa effettiva) · 100", "resa effettiva − resa teorica", "(massa dei reagenti / massa dei prodotti) · 100"],a:0,e:"La resa quasi mai è del 100% per reazioni parassite, reazioni incomplete o perdite durante la purificazione."},
{id:"cl5_052",t:"cl5",p:"5.5.1",l:3,q:"Da 32,5 g di Zn (M = 65) si ottengono 27 g di Cu (M = 63,5) invece dei teorici. Qual è la resa?",o:["Circa 85%", "Circa 50%", "Circa 100%", "Circa 27%"],a:0,e:"0,5 mol di Zn ⇒ 0,5 mol di Cu = 31,8 g teorici; 27/31,8 ≈ 85%."},
{id:"cl5_sf1",t:"cl5",p:"5.4.4",l:4,q:"Facendo passare 2,0 A per 30 minuti in una soluzione di Cu²⁺, quanto rame si deposita circa (Cu = 63,5; F = 96.500 C/mol)?",o:["1,2 g", "2,4 g", "0,6 g", "4,7 g"],a:0,e:"q = 2,0 · 1800 = 3600 C ⇒ 3600/96.500 ≈ 0,037 mol di elettroni ⇒ 0,019 mol di Cu (2 elettroni per atomo) ⇒ circa 1,2 g."},
{id:"cl5_sf2",t:"cl5",p:"5.3",l:4,q:"Nella reazione Zn + Cu²⁺ → Zn²⁺ + Cu, quale affermazione è corretta?",o:["Lo zinco è il riducente e si ossida", "Lo zinco è l'ossidante", "Il rame si ossida", "Non è una redox"],a:0,e:"Zn passa da 0 a +2 (perde elettroni, si ossida, quindi è il riducente); Cu²⁺ si riduce a Cu ed è l'ossidante."},
{id:"cl5_sf3",t:"cl5",p:"5.5.1",l:4,q:"4 g di H₂ e 32 g di O₂ reagiscono (2 H₂ + O₂ → 2 H₂O; H = 1, O = 16). Quanta acqua si forma?",o:["36 g", "18 g", "72 g", "32 g"],a:0,e:"4 g di H₂ = 2 mol, 32 g di O₂ = 1 mol: rapporto esatto 2 : 1, si formano 2 mol di H₂O = 36 g (conservazione della massa)."},
{id:"cl5_sf4",t:"cl5",p:"5.4.2",l:4,q:"Tra Ag⁺/Ag (+0,80 V) e Zn²⁺/Zn (−0,76 V), quale reazione è spontanea?",o:["Zn + 2 Ag⁺ → Zn²⁺ + 2 Ag", "Zn²⁺ + 2 Ag → Zn + 2 Ag⁺", "Nessuna delle due", "Entrambe"],a:0,e:"Si riduce la specie con potenziale maggiore (Ag⁺) e si ossida quella con potenziale minore (Zn): ΔE = 0,80 − (−0,76) = 1,56 V > 0."},
{id:"cl6_001",t:"cl6",p:"6.1",l:1,q:"Come si chiamano le miscele eterogenee?",o:["Dispersioni", "Soluzioni", "Leghe", "Sostanze pure"],a:0,e:"Le miscele omogenee sono le soluzioni; quelle eterogenee si dividono in sospensioni e colloidi."},
{id:"cl6_002",t:"cl6",p:"6.1",l:2,q:"Quali dimensioni hanno le particelle di una dispersione colloidale?",o:["Tra 1 nm e 1 µm", "Più di 1 µm", "Meno di 1 nm", "Più di 1 mm"],a:0,e:"Le sospensioni (es. fango, sangue) hanno particelle maggiori di 1 µm."},
{id:"cl6_003",t:"cl6",p:"6.1",l:2,q:"Come si chiama la dispersione di un liquido in un altro liquido in cui non è solubile?",o:["Emulsione", "Aerosol", "Schiuma", "Sol"],a:0,e:"Esempio: la miscela olio-aceto."},
{id:"cl6_004",t:"cl6",p:"6.1",l:2,q:"La nebbia è un esempio di…",o:["aerosol (liquido disperso in un gas)", "fumo", "emulsione", "gel"],a:0,e:"Il fumo è invece un solido disperso in un gas."},
{id:"cl6_005",t:"cl6",p:"6.1",l:3,q:"Che cos'è un gel?",o:["Un sol in cui le molecole formano filamenti intrecciati e una struttura semisolida", "Una schiuma liquida", "Un'emulsione di gas", "Una soluzione vera"],a:0,e:"Esempio: le gelatine di frutta."},
{id:"cl6_006",t:"cl6",p:"6.2",l:1,q:"Che cos'è il solvente in una soluzione?",o:["Il componente nello stesso stato della soluzione e in quantità maggiore", "Il componente in quantità minore", "Sempre l'acqua", "Il componente solido"],a:0,e:"Il soluto è la sostanza dissolta, in quantità minore."},
{id:"cl6_007",t:"cl6",p:"6.2",l:2,q:"Il bronzo è un esempio di soluzione…",o:["solida (rame e stagno)", "liquida", "gassosa", "eterogenea"],a:0,e:"Nelle soluzioni solide il solvente è solido."},
{id:"cl6_008",t:"cl6",p:"6.2",l:2,q:"In una soluzione gassosa come l'aria…",o:["non si distingue tra soluto e solvente", "il solvente è l'ossigeno", "il soluto è l'azoto", "il solvente è il vapore acqueo"],a:0,e:"Le soluzioni gassose sono miscele di gas."},
{id:"cl6_009",t:"cl6",p:"6.3",l:1,q:"Come si chiama la solvatazione quando il solvente è l'acqua?",o:["Idratazione", "Idrolisi", "Idrogenazione", "Diluizione"],a:0,e:"Le particelle di soluto circondate dall'acqua si dicono idratate."},
{id:"cl6_010",t:"cl6",p:"6.3",l:2,q:"Quando è possibile la solvatazione?",o:["Quando le attrazioni soluto-solvente compensano quelle solvente-solvente e soluto-soluto", "Sempre", "Solo con soluti ionici", "Solo ad alta temperatura"],a:0,e:"Altrimenti il soluto non si scioglie."},
{id:"cl6_011",t:"cl6",p:"6.3",l:2,q:"Perché l'acqua scioglie molti composti ionici?",o:["È polare e solvata cationi e anioni con interazioni ione-dipolo", "È apolare", "Forma legami ionici con il soluto", "Ha bassa costante dielettrica"],a:0,e:"Scioglie anche i composti polari con interazioni dipolo-dipolo e legami a idrogeno."},
{id:"cl6_012",t:"cl6",p:"6.3.1",l:1,q:"Perché lo zucchero a velo si scioglie più in fretta di quello granulare?",o:["È più suddiviso: c'è più superficie di contatto con il solvente", "È più dolce", "È più solubile a parità di quantità", "Contiene amido"],a:0,e:"Agitazione, temperatura e grado di suddivisione aumentano la velocità di dissoluzione."},
{id:"cl6_013",t:"cl6",p:"6.3.1",l:2,q:"Quale fattore NON aumenta la velocità di dissoluzione di un solido?",o:["Usare cristalli più grossi", "Agitare la soluzione", "Aumentare la temperatura", "Polverizzare il soluto"],a:0,e:"Cristalli più grossi offrono meno superficie."},
{id:"cl6_014",t:"cl6",p:"6.3.2",l:1,q:"Che cos'è una soluzione satura?",o:["Una soluzione che contiene la massima quantità di soluto solubile a quella temperatura", "Una soluzione molto diluita", "Una soluzione senza soluto", "Una soluzione che bolle"],a:0,e:"Il soluto aggiunto in più precipita come corpo di fondo."},
{id:"cl6_015",t:"cl6",p:"6.3.2",l:2,q:"Che cos'è una soluzione sovrasatura?",o:["Una soluzione che contiene più soluto della sua solubilità: un sistema metastabile", "Una soluzione con corpo di fondo", "Una soluzione a 100 °C", "Una soluzione diluita"],a:0,e:"È stabile solo temporaneamente."},
{id:"cl6_016",t:"cl6",p:"6.3.2",l:2,q:"Come si definisce la solubilità?",o:["La concentrazione della soluzione satura", "La velocità di dissoluzione", "La massa del solvente", "La temperatura di ebollizione della soluzione"],a:0,e:"Dipende da soluto, solvente e temperatura."},
{id:"cl6_017",t:"cl6",p:"6.3.3",l:1,q:"Che cosa significa \"il simile scioglie il simile\"?",o:["Le sostanze polari si sciolgono nei solventi polari, le apolari in quelli apolari", "Ogni sostanza si scioglie solo in sé stessa", "I sali si sciolgono solo nei sali", "Le sostanze apolari si sciolgono in acqua"],a:0,e:"Lo iodio si scioglie in esano; NaCl e glucosio in acqua; l'esano non si scioglie in acqua."},
{id:"cl6_018",t:"cl6",p:"6.3.3",l:2,q:"Se la dissoluzione è esotermica, alzando la temperatura la solubilità…",o:["diminuisce", "aumenta", "non cambia", "raddoppia"],a:0,e:"Per le dissoluzioni endotermiche invece la solubilità aumenta con la temperatura."},
{id:"cl6_019",t:"cl6",p:"6.3.3",l:2,q:"Perché aprendo una bottiglia di acqua gassata si formano le bollicine?",o:["Cala la pressione e con essa la solubilità della CO₂ (legge di Henry)", "Aumenta la temperatura", "L'acqua evapora", "La CO₂ reagisce con l'aria"],a:0,e:"C = k_H · P: diminuendo la pressione parziale diminuisce il gas disciolto."},
{id:"cl6_020",t:"cl6",p:"6.3.3",l:3,q:"Perché i gas sono meno solubili ad alta temperatura?",o:["Perché la loro dissoluzione è un processo esotermico", "Perché si decompongono", "Perché la pressione aumenta", "Perché diventano polari"],a:0,e:"La costante di Henry dipende dal solvente e dalla temperatura."},
{id:"cl6_021",t:"cl6",p:"6.3.4",l:1,q:"I sali dei metalli alcalini sono in genere…",o:["solubili in acqua", "insolubili in acqua", "solubili solo in esano", "gassosi"],a:0,e:"Fanno eccezione alcuni composti del litio."},
{id:"cl6_022",t:"cl6",p:"6.3.4",l:2,q:"Quale di questi sali è insolubile in acqua?",o:["AgCl", "NaCl", "KNO₃", "NH₄Cl"],a:0,e:"I cloruri sono solubili tranne quelli di Ag⁺, Pb²⁺ e Hg₂²⁺."},
{id:"cl6_023",t:"cl6",p:"6.3.4",l:2,q:"I sali contenenti NO₃⁻ (nitrati) sono…",o:["solubili, con poche eccezioni", "quasi tutti insolubili", "insolubili tranne quelli di sodio", "solubili solo a caldo"],a:0,e:"Anche clorati, perclorati e acetati sono in genere solubili."},
{id:"cl6_024",t:"cl6",p:"6.3.4",l:3,q:"Quale solfato è poco solubile?",o:["BaSO₄", "Na₂SO₄", "K₂SO₄", "(NH₄)₂SO₄"],a:0,e:"I solfati sono solubili tranne quelli di Ca²⁺, Sr²⁺, Ba²⁺, Pb²⁺ e Hg₂²⁺."},
{id:"cl6_025",t:"cl6",p:"6.3.4",l:3,q:"I carbonati e i fosfati sono in genere…",o:["insolubili, tranne quelli di NH₄⁺ e dei metalli alcalini", "tutti solubili", "solubili tranne quelli di sodio", "gassosi"],a:0,e:"Anche ossidi e idrossidi metallici sono insolubili, tranne quelli dei metalli alcalini."},
{id:"cl6_026",t:"cl6",p:"6.4.1",l:1,q:"Che cosa indica una percentuale m/m?",o:["I grammi di soluto in 100 g di soluzione", "I grammi di soluto in 100 mL di soluzione", "I mL di soluto in 100 mL di soluzione", "Le moli in 1 L"],a:0,e:"La m/V indica i grammi in 100 mL e la V/V i millilitri in 100 mL."},
{id:"cl6_027",t:"cl6",p:"6.4.1",l:2,q:"20 g di NaOH in 500 mL di soluzione: qual è la percentuale m/V?",o:["4%", "20%", "2%", "10%"],a:0,e:"20 : 500 = x : 100 ⇒ x = 4 g in 100 mL."},
{id:"cl6_028",t:"cl6",p:"6.4.1",l:2,q:"Quale percentuale NON è adimensionale?",o:["La percentuale massa/volume", "La percentuale massa/massa", "La percentuale volume/volume", "Nessuna"],a:0,e:"Rapporta grandezze non omogenee (g e mL), quindi ha dimensioni."},
{id:"cl6_029",t:"cl6",p:"6.4.2",l:1,q:"Che cosa indica la molarità?",o:["Le moli di soluto in un litro di soluzione", "Le moli di soluto in un kg di solvente", "I grammi di soluto in 100 mL", "Il rapporto tra le moli"],a:0,e:"Si esprime in mol/L (M)."},
{id:"cl6_030",t:"cl6",p:"6.4.2",l:2,q:"20 g di NaOH (M = 40) in 500 mL: qual è la molarità?",o:["1 M", "0,5 M", "2 M", "0,04 M"],a:0,e:"n = 20/40 = 0,5 mol; M = 0,5/0,5 L = 1 M."},
{id:"cl6_031",t:"cl6",p:"6.4.2",l:3,q:"Quanti grammi di NaCl (M = 58,5) servono per 2 L di soluzione 0,1 M?",o:["11,7 g", "5,85 g", "117 g", "0,2 g"],a:0,e:"n = 0,1 · 2 = 0,2 mol ⇒ 0,2 · 58,5 = 11,7 g."},
{id:"cl6_032",t:"cl6",p:"6.4.3",l:1,q:"Quanto vale la somma delle frazioni molari di tutti i componenti?",o:["1", "100", "Dipende dalla soluzione", "0"],a:0,e:"Ogni frazione molare è compresa tra 0 e 1."},
{id:"cl6_033",t:"cl6",p:"6.4.3",l:2,q:"In una soluzione di glucosio la frazione molare del soluto è 0,05. Quella dell'acqua?",o:["0,95", "0,05", "1,05", "0,5"],a:0,e:"x(H₂O) = 1 − 0,05 = 0,95."},
{id:"cl6_034",t:"cl6",p:"6.4.4",l:1,q:"Che cosa indica la molalità?",o:["Le moli di soluto per kg di solvente", "Le moli di soluto per litro di soluzione", "I grammi di soluto per kg di soluzione", "Le moli totali"],a:0,e:"Si esprime in mol/kg (m); per soluzioni acquose molto diluite è circa uguale alla molarità."},
{id:"cl6_035",t:"cl6",p:"6.4.4",l:3,q:"Una soluzione di HBr al 25% m/m (M = 81) che molalità ha circa?",o:["4,1 m", "3,1 m", "0,31 m", "25 m"],a:0,e:"25 g = 0,31 mol in 75 g di solvente ⇒ 0,31 · 1000/75 ≈ 4,1 mol/kg."},
{id:"cl6_036",t:"cl6",p:"6.4.4",l:2,q:"Che differenza c'è tra molarità e molalità?",o:["La molarità si riferisce al volume di soluzione, la molalità alla massa di solvente", "Sono sinonimi", "La molalità si riferisce al volume", "La molarità si riferisce alla massa di solvente"],a:0,e:"Molarità in mol/L di soluzione; molalità in mol/kg di solvente."},
{id:"cl6_037",t:"cl6",p:"6.4.5",l:2,q:"Qual è la normalità di H₂SO₄ 1 M in una reazione acido-base?",o:["2 N", "1 N", "0,5 N", "4 N"],a:0,e:"Ogni molecola cede 2 H⁺: la valenza operativa è 2 eq/mol."},
{id:"cl6_038",t:"cl6",p:"6.4.5",l:2,q:"La normalità di una soluzione rispetto alla molarità è…",o:["maggiore o al massimo uguale, mai inferiore", "sempre minore", "sempre uguale", "indipendente"],a:0,e:"N = M · v_op, con v_op = 1, 2, 3…"},
{id:"cl6_039",t:"cl6",p:"6.4.5",l:3,q:"In quale unità si esprimono spesso gli ioni negli esami del sangue?",o:["mEq/L", "mol/kg", "g/100 g", "ppm in volume"],a:0,e:"Gli equivalenti, obsoleti per la IUPAC, sono ancora usati in ambito medico."},
{id:"cl6_040",t:"cl6",p:"6.4.6",l:1,q:"Che cosa resta costante durante una diluizione?",o:["Il numero di moli di soluto", "La molarità", "Il volume", "La massa del solvente"],a:0,e:"Per questo vale M₁ · V₁ = M₂ · V₂."},
{id:"cl6_041",t:"cl6",p:"6.4.6",l:2,q:"A 100 mL di NaCl 0,1 M si aggiungono 900 mL di acqua. Qual è la nuova concentrazione?",o:["0,01 M", "0,1 M", "0,09 M", "0,001 M"],a:0,e:"0,1 · 100 = M₂ · 1000 ⇒ M₂ = 0,01 M."},
{id:"cl6_042",t:"cl6",p:"6.4.6",l:3,q:"Quanti mL di HCl 2 M servono per preparare 500 mL di HCl 0,5 M?",o:["125 mL", "250 mL", "62,5 mL", "1000 mL"],a:0,e:"2 · V₁ = 0,5 · 500 ⇒ V₁ = 125 mL."},
{id:"cl6_043",t:"cl6",p:"6.5",l:1,q:"Che cos'è un elettrolita?",o:["Un soluto che in acqua libera ioni e rende la soluzione conduttrice", "Un soluto che non si dissocia", "Un solvente apolare", "Un gas disciolto"],a:0,e:"Glucosio, saccarosio, urea e glicerolo sono non elettroliti."},
{id:"cl6_044",t:"cl6",p:"6.5",l:2,q:"Che differenza c'è tra dissociazione e ionizzazione?",o:["La dissociazione separa gli ioni di un composto ionico; la ionizzazione forma ioni da un composto molecolare che reagisce con l'acqua", "Sono sinonimi", "La ionizzazione riguarda solo i sali", "La dissociazione riguarda solo gli acidi"],a:0,e:"MgCl₂ → Mg²⁺ + 2 Cl⁻ (dissociazione); HNO₃ + H₂O → H₃O⁺ + NO₃⁻ (ionizzazione)."},
{id:"cl6_045",t:"cl6",p:"6.5",l:2,q:"Un elettrolita forte ha grado di dissociazione…",o:["α = 1", "α < 1", "α = 0", "α > 1"],a:0,e:"Sali solubili, acidi e basi forti sono elettroliti forti; acidi e basi deboli hanno α < 1."},
{id:"cl6_046",t:"cl6",p:"6.6",l:1,q:"Da che cosa dipendono le proprietà colligative?",o:["Solo dal numero di particelle di soluto", "Dalla natura chimica del soluto", "Dal colore della soluzione", "Dalla massa del soluto"],a:0,e:"Sono: abbassamento della tensione di vapore, innalzamento ebullioscopico, abbassamento crioscopico, pressione osmotica."},
{id:"cl6_047",t:"cl6",p:"6.6",l:2,q:"Qual è il coefficiente di van't Hoff di BaCl₂ (elettrolita forte)?",o:["3", "2", "1", "4"],a:0,e:"BaCl₂ → Ba²⁺ + 2 Cl⁻: tre particelle. Per NaCl i = 2, per il glucosio i = 1."},
{id:"cl6_048",t:"cl6",p:"6.6.1",l:2,q:"Che cosa afferma la legge di Raoult?",o:["La tensione di vapore della soluzione è quella del solvente puro per la frazione molare del solvente", "La tensione di vapore aumenta con il soluto", "Il gas disciolto è proporzionale alla pressione", "La pressione osmotica è CRT"],a:0,e:"Poiché x < 1, la tensione di vapore della soluzione è minore di quella del solvente puro."},
{id:"cl6_049",t:"cl6",p:"6.6.1",l:2,q:"Aggiungendo un soluto non volatile a un solvente, la tensione di vapore…",o:["diminuisce", "aumenta", "resta uguale", "si annulla"],a:0,e:"È la prima delle proprietà colligative."},
{id:"cl6_050",t:"cl6",p:"6.6.2",l:1,q:"Perché d'inverno si sparge sale sulle strade?",o:["Il sale abbassa il punto di congelamento dell'acqua (abbassamento crioscopico)", "Il sale riscalda il ghiaccio", "Il sale reagisce con il ghiaccio formando gas", "Il sale aumenta la tensione di vapore"],a:0,e:"L'acqua salata congela sotto 0 °C e bolle sopra 100 °C."},
{id:"cl6_051",t:"cl6",p:"6.6.2",l:2,q:"A quale concentrazione è proporzionale l'innalzamento ebullioscopico?",o:["Alla molalità", "Alla molarità", "Alla percentuale m/V", "Alla frazione molare del solvente"],a:0,e:"ΔT_eb = K_eb · m (moltiplicato per i se il soluto è un elettrolita)."},
{id:"cl6_052",t:"cl6",p:"6.6.2",l:3,q:"Quale soluzione acquosa congela a temperatura più bassa?",o:["CaCl₂ 0,1 m", "NaCl 0,1 m", "Glucosio 0,1 m", "Urea 0,1 m"],a:0,e:"A parità di molalità conta il numero di particelle: CaCl₂ dà 3 ioni, NaCl 2, glucosio e urea 1."},
{id:"cl6_053",t:"cl6",p:"6.6.3",l:1,q:"Nell'osmosi, in che verso passa il solvente?",o:["Dalla soluzione più diluita a quella più concentrata", "Dalla più concentrata alla più diluita", "Non passa", "Passa solo il soluto"],a:0,e:"Attraverso la membrana semipermeabile passa solo il solvente."},
{id:"cl6_054",t:"cl6",p:"6.6.3",l:2,q:"Come si calcola la pressione osmotica di una soluzione di un non elettrolita?",o:["π = C·R·T", "π = m·g·h", "π = n/V", "π = K·m"],a:0,e:"Per un elettrolita si moltiplica per il coefficiente i."},
{id:"cl6_055",t:"cl6",p:"6.6.3",l:2,q:"Che cosa succede a un globulo rosso in una soluzione ipotonica?",o:["Entra acqua, si rigonfia e può andare incontro a lisi", "Perde acqua e raggrinzisce", "Non succede nulla", "Si divide"],a:0,e:"La soluzione fisiologica (NaCl 0,9%, circa 7,8 atm a 37 °C) è isotonica con il sangue."},
{id:"cl6_056",t:"cl6",p:"6.6.3",l:3,q:"Glucosio 1 M e NaCl 1 M separati da una membrana semipermeabile: da che parte va l'acqua?",o:["Dalla soluzione di glucosio verso quella di NaCl", "Dalla soluzione di NaCl verso quella di glucosio", "Non c'è flusso: hanno la stessa molarità", "Passano i soluti"],a:0,e:"NaCl ha i = 2: è ipertonica rispetto al glucosio."},
{id:"cl6_057",t:"cl6",p:"6.6.3",l:3,q:"Che cosa indica l'osmolarità?",o:["Il numero di osmoli (moli · i) per litro di soluzione", "Le moli per kg di solvente", "La pressione osmotica in atm", "La massa del soluto"],a:0,e:"Esprime la concentrazione delle particelle di soluto."},
{id:"cl6_058",t:"cl6",p:"6.7",l:1,q:"Qual è circa la percentuale di ossigeno nell'aria inspirata?",o:["21%", "78%", "16%", "0,04%"],a:0,e:"L'aria secca contiene circa 78% di azoto, 21% di ossigeno e lo 0,03-0,04% di CO₂."},
{id:"cl6_059",t:"cl6",p:"6.7",l:2,q:"Come cambia l'aria espirata rispetto a quella inspirata?",o:["Meno ossigeno, più CO₂, satura di vapore e più calda", "Più ossigeno e meno CO₂", "Uguale", "Senza azoto"],a:0,e:"L'azoto resta circa al 78%; l'ossigeno scende a circa il 16%."},
{id:"cl6_060",t:"cl6",p:"6.7",l:2,q:"Quale infezione si diagnostica con un test del respiro, secondo il libro?",o:["Helicobacter pylori", "Influenza", "Epatite B", "Tubercolosi"],a:0,e:"Con i test del respiro si diagnosticano anche l'intolleranza al lattosio."},
{id:"cl6_061",t:"cl6",p:"6.8",l:2,q:"Quale pompa mantiene i gradienti ionici lontani dall'equilibrio nelle cellule?",o:["La Na⁺/K⁺-ATPasi", "L'emoglobina", "L'anidrasi carbonica", "La DNA polimerasi"],a:0,e:"I gradienti elettrochimici servono per l'impulso nervoso e la contrazione muscolare."},
{id:"cl6_062",t:"cl6",p:"6.8",l:2,q:"Quali ioni sono tipici dei fluidi corporei citati dal libro?",o:["Na⁺, K⁺, Cl⁻, Ca²⁺, HCO₃⁻", "Solo Na⁺ e Cl⁻", "Fe³⁺ e Cu²⁺", "Ag⁺ e Pb²⁺"],a:0,e:"Le loro concentrazioni sono finemente controllate da reni, respirazione e tamponi."},
{id:"cl6_sf1",t:"cl6",p:"6.6.3",l:4,q:"Quale soluzione è isotonica con NaCl 0,15 M (dissociazione completa)?",o:["Glucosio 0,30 M", "Glucosio 0,15 M", "CaCl₂ 0,15 M", "NaCl 0,30 M"],a:0,e:"NaCl 0,15 M ha osmolarità 0,30 osmol/L; il glucosio (i = 1) deve essere 0,30 M. CaCl₂ 0,15 M avrebbe 0,45 osmol/L."},
{id:"cl6_sf2",t:"cl6",p:"6.4.2",l:4,q:"Si mescolano 200 mL di NaCl 0,5 M con 300 mL di NaCl 1 M. Qual è la concentrazione finale?",o:["0,8 M", "0,75 M", "1,5 M", "0,6 M"],a:0,e:"Moli: 0,1 + 0,3 = 0,4 mol in 0,5 L ⇒ 0,8 M. La media semplice (0,75) è sbagliata perché i volumi sono diversi."},
{id:"cl6_sf3",t:"cl6",p:"6.6.2",l:4,q:"Quale soluzione acquosa bolle alla temperatura più alta?",o:["Al₂(SO₄)₃ 0,1 m", "NaCl 0,2 m", "Glucosio 0,4 m", "CaCl₂ 0,1 m"],a:0,e:"Particelle: Al₂(SO₄)₃ dà 5 ioni ⇒ 0,5 m; NaCl 0,2 · 2 = 0,4; glucosio 0,4; CaCl₂ 0,3."},
{id:"cl6_sf4",t:"cl6",p:"6.4.6",l:4,q:"Una soluzione di glucosio al 10% m/V va diluita fino al 2% m/V. Quanto volume finale si ottiene da 50 mL?",o:["250 mL", "100 mL", "500 mL", "200 mL"],a:0,e:"C₁V₁ = C₂V₂: 10 · 50 = 2 · V₂ ⇒ V₂ = 250 mL."},
{id:"cl7_001",t:"cl7",p:"7.1",l:1,q:"Quanti joule vale una caloria?",o:["4,186 J", "1 J", "418,6 J", "0,239 J"],a:0,e:"1 cal = 4,186 J."},
