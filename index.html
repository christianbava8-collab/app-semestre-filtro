{id:'bi_ciclo_sf2',t:'bi_ciclo',l:4,q:`In una specie con 2n = 8, quanti cromosomi e quanti cromatidi ha una cellula in metafase della meiosi II?`,o:[`4 cromosomi e 8 cromatidi`,`8 cromosomi e 16 cromatidi`,`4 cromosomi e 4 cromatidi`,`8 cromosomi e 8 cromatidi`],a:0,e:`Dopo la meiosi I le cellule sono aploidi (n = 4) ma ogni cromosoma è ancora formato da due cromatidi fratelli, che si separano solo in anafase II. In metafase II ci sono quindi 4 cromosomi e 4 × 2 = 8 cromatidi. 8 e 16 sono i valori di una metafase mitotica.`},
{id:'bi_ciclo_sf3',t:'bi_ciclo',l:4,q:`In una coltura asincrona di 2.000 cellule che proliferano con un ciclo di 20 ore, la fase S dura 8 ore. Supponendo che le cellule siano distribuite lungo il ciclo in proporzione alla durata di ogni fase, quante sono in fase S?`,o:[`800`,`400`,`1.200`,`160`],a:0,e:`La frazione di cellule in una fase è uguale al rapporto tra la durata della fase e la durata del ciclo: 8/20 = 40%. Il 40% di 2.000 è 800. 1.200 è il numero di cellule fuori dalla fase S (60%).`},
{id:'bi_ciclo_sf4',t:'bi_ciclo',l:4,q:`Un organismo ha 2n = 6, cioè tre coppie di omologhi, ciascuna formata da un cromosoma ereditato dalla madre e uno dal padre. Trascurando il crossing-over, qual è la probabilità che un suo gamete contenga solo cromosomi ereditati dalla propria madre?`,o:[`1/8`,`1/6`,`1/3`,`1/64`],a:0,e:`Per assortimento indipendente, ogni coppia contribuisce al gamete con il cromosoma materno o paterno con probabilità 1/2 ciascuno. Per tre coppie: (1/2)³ = 1/8. I gameti diversi possibili sono 2³ = 8, e quello con tutti i cromosomi materni è uno di questi.`},
{id:'bi_ciclo_sf5',t:'bi_ciclo',l:4,q:`Una coltura asincrona è analizzata con citometria a flusso, che misura il DNA per cellula: i picchi sono a 2C (G1) e 4C (G2/M). Dopo il trattamento con un farmaco il picco 4C aumenta molto e il picco 2C diminuisce, senza cellule con meno di 2C. Quale interpretazione è più plausibile?`,o:[`Le cellule completano la fase S e si accumulano in G2 o in mitosi`,`Le cellule si bloccano in G1 e non iniziano la replicazione`,`Le cellule entrano in G0 e smettono di replicare il DNA`,`Le cellule vanno in apoptosi, con frammentazione del DNA sotto 2C`],a:0,e:`Un contenuto di 4C indica DNA già replicato e non ancora ripartito tra due cellule figlie, quindi cellule in G2 o M: il farmaco blocca G2/M o la mitosi. Un blocco in G1 o l'ingresso in G0 aumenterebbe il picco 2C, e l'apoptosi darebbe cellule con meno di 2C, che qui non si osservano.`},
{id:'bi_ciclo_sf6',t:'bi_ciclo',l:4,q:`Una cellula in mitosi viene fusa con una cellula in G1. Poco dopo, i cromosomi del nucleo della cellula G1 si condensano prematuramente. Che cosa suggerisce?`,o:[`Il citoplasma mitotico contiene fattori, come ciclina B-CDK1, che promuovono la mitosi`,`Il nucleo della cellula G1 contiene un inibitore della mitosi che viene eliminato`,`La fusione danneggia il DNA e attiva il checkpoint di danno al DNA in G2/M`,`La cellula G1 era già entrata in fase S e stava replicando il proprio DNA`],a:0,e:`Se un nucleo in interfase entra in condensazione cromosomica dopo l'esposizione al citoplasma di una cellula in M, vuol dire che in quel citoplasma sono presenti fattori diffusibili che promuovono la mitosi: il fattore promotore della M è il complesso ciclina B-CDK1. Un danno al DNA bloccherebbe, non anticiperebbe, la mitosi.`},
{id:'bi_ciclo_sf7',t:'bi_ciclo',l:4,q:`Nelle cellule in G1 non stimolate, la proteina Rb lega il fattore di trascrizione E2F. Che cosa ci si aspetta in una cellula con Rb non funzionante?`,o:[`E2F è libero di attivare i geni della fase S anche senza segnali di crescita`,`E2F resta inattivo e la cellula si arresta in G1 anche con segnali di crescita`,`La cellula va in apoptosi perché p53 diventa inattivo`,`Il checkpoint G2/M si blocca e la mitosi non può iniziare`],a:0,e:`Rb è un freno del passaggio G1/S: finché è legata a E2F, i geni necessari alla fase S non si attivano. Se Rb non funziona, E2F è sempre libero e la cellula può entrare in S senza segnali mitogeni (proliferazione incontrollata, come nel retinoblastoma). Il blocco del ciclo sarebbe l'effetto opposto.`},
{id:'bi_ciclo_sf8',t:'bi_ciclo',l:4,q:`Molti chemioterapici bloccano la replicazione del DNA o la mitosi. Perché provocano effetti collaterali come caduta dei capelli e calo dei globuli bianchi?`,o:[`Colpiscono anche cellule sane che si dividono spesso, come bulbi piliferi e midollo osseo`,`Danneggiano i neuroni maturi, che si dividono molto più rapidamente delle cellule tumorali`,`Agiscono soprattutto sulle cellule in G0, abbondanti nei capelli e nel midollo`,`Alterano il DNA di tutte le cellule del corpo, comprese quelle che non si dividono`],a:0,e:`I farmaci che interferiscono con replicazione e mitosi colpiscono tutte le cellule che si dividono spesso, tumorali o no: cellule del bulbo pilifero, del midollo osseo e dell'epitelio intestinale. I neuroni maturi non si dividono e le cellule in G0 sono per definizione quiescenti, quindi poco sensibili.`},
{id:'bi_ciclo_sf9',t:'bi_ciclo',l:4,q:`In una cellula germinale si verifica la non-disgiunzione dei cromatidi fratelli del cromosoma 21 durante la meiosi II, in una sola delle due cellule figlie della meiosi I. Quali gameti si formano?`,o:[`Uno con 24 cromosomi, uno con 22 e due normali con 23`,`Due gameti con 24 cromosomi e due con 22 cromosomi`,`Uno con 22 cromosomi e tre normali con 23 cromosomi`,`Uno con 24 cromosomi e tre normali con 23 cromosomi`],a:0,e:`La meiosi I è regolare e produce due cellule n. In una di esse la meiosi II procede normalmente e dà due gameti con 23 cromosomi. Nell'altra i cromatidi del cromosoma 21 non si separano: un gamete riceve entrambi (24 cromosomi) e l'altro nessuno (22). Due gameti con 24 e due con 22 si avrebbero con una non-disgiunzione degli omologhi in meiosi I.`},
{id:'bi_ciclo_sf10',t:'bi_ciclo',l:4,q:`In metafase un cromosoma ha un cinetocore non legato ai microtubuli del fuso. Che cosa fa il checkpoint del fuso?`,o:[`Impedisce l'anafase inibendo l'APC/C, quindi i cromatidi restano uniti`,`Blocca la citodieresi dopo la separazione dei cromatidi fratelli in anafase`,`Fa ripetere la replicazione del DNA prima di consentire l'anafase`,`Impedisce l'ingresso in mitosi dalla fase G2 finché il DNA non è replicato`],a:0,e:`Un cinetocore non attaccato genera un segnale che inibisce l'APC/C: la securina non viene degradata, la separasi resta inattiva, la coesina tiene uniti i cromatidi e l'anafase non parte finché tutti i cromosomi sono ben legati. Il blocco G2/M agisce prima della mitosi e non riguarda l'attacco al fuso.`},
{id:'bi_biomol_sf1',t:'bi_biomol',l:4,q:`Il glicogeno viene mobilizzato molto più rapidamente di una catena lineare di glucosio di pari massa, come l'amilosio. Quale caratteristica strutturale del glicogeno lo spiega?`,o:[`Le ramificazioni α(1→6) creano molte estremità non riducenti attaccabili in parallelo`,`I legami β(1→4) del glicogeno sono più labili dei legami α dell'amilosio`,`Il glicogeno contiene anche fruttosio, legato al glucosio in modo più labile`,`Le ramificazioni riducono il numero di estremità libere e aumentano la solubilità`],a:0,e:`La glicogeno fosforilasi stacca il glucosio una unità alla volta dalle estremità non riducenti: più ramificazioni significano più estremità e quindi più enzimi che lavorano insieme. Il glicogeno è un polimero di solo glucosio con legami α(1→4) e α(1→6), non contiene fruttosio né legami β. Le ramificazioni aumentano, non riducono, il numero di estremità libere.`},
{id:'bi_biomol_sf2',t:'bi_biomol',l:4,q:`Una persona con deficit di lattasi non digerisce il latte. Quale legame del lattosio non viene scisso e quali unità collega?`,o:[`Il legame β(1→4) tra galattosio e glucosio`,`Il legame α(1→2) tra glucosio e fruttosio`,`Il legame α(1→4) tra due unità di glucosio`,`Il legame β(1→4) tra due unità di glucosio`],a:0,e:`Il lattosio è formato da galattosio e glucosio uniti da un legame β(1→4), che la lattasi intestinale idrolizza. Glucosio-fruttosio con legame α(1→2) è il saccarosio, glucosio-glucosio α(1→4) il maltosio, glucosio-glucosio β(1→4) il cellobiosio.`},
{id:'bi_biomol_sf3',t:'bi_biomol',l:4,q:`Un batterio coltivato a 37 °C viene trasferito a 15 °C. Quale modifica dei lipidi di membrana gli permette di mantenere la fluidità del doppio strato?`,o:[`Aumenta la quota di acidi grassi insaturi con doppi legami cis nei fosfolipidi`,`Aumenta la quota di acidi grassi saturi a catena più lunga nei fosfolipidi`,`Sostituisce parte dei fosfolipidi con trigliceridi nel doppio strato`,`Inserisce più colesterolo, che a bassa temperatura irrigidisce la membrana`],a:0,e:`I doppi legami cis creano pieghe nelle catene e impediscono un impaccamento fitto, mantenendo la membrana fluida al freddo. Catene sature e più lunghe fanno l'opposto, i trigliceridi non formano doppi strati e nelle cellule animali il colesterolo a bassa temperatura ostacola l'impaccamento invece di irrigidire (i batteri in genere non lo hanno).`},
{id:'bi_biomol_sf4',t:'bi_biomol',l:4,q:`L'analisi della composizione di un acido nucleico estratto da un virus dà: adenina 26%, guanina 31%, citosina 20%, uracile 23%. Che cosa si può dedurre?`,o:[`È RNA a singolo filamento: ha uracile e le basi complementari non coincidono`,`È DNA a doppia elica: la quantità di purine è uguale a quella delle pirimidine`,`È RNA a doppio filamento: adenina e uracile, guanina e citosina si appaiano`,`È DNA a singolo filamento: contiene guanina e citosina in buona quantità`],a:0,e:`La presenza di uracile indica RNA. Nei doppi filamenti vale A = U (o T) e G = C, qui invece A ≠ U (26 contro 23) e G ≠ C (31 contro 20); inoltre le purine sono il 57% e le pirimidine il 43%. Le regole di Chargaff non sono rispettate, quindi il filamento è singolo.`},
{id:'bi_biomol_sf5',t:'bi_biomol',l:4,q:`Un frammento di DNA a doppio filamento è lungo 100 coppie di basi e contiene in totale 60 timine (contando entrambi i filamenti). Quanti legami a idrogeno tengono uniti i due filamenti?`,o:[`240`,`300`,`200`,`260`],a:0,e:`Per la complementarità le adenine sono 60, quindi ci sono 60 coppie A-T (2 legami ciascuna) e 40 coppie G-C (3 legami ciascuna): 60×2 + 40×3 = 240. 300 e 200 sono i valori se tutte le coppie fossero G-C o tutte A-T, 260 deriva dallo scambio dei legami tra le due coppie.`},
{id:'bi_biomol_sf6',t:'bi_biomol',l:4,q:`Una soluzione zuccherina è negativa al reattivo di Benedict. Dopo ebollizione con HCl diluito e neutralizzazione diventa positiva. Quale zucchero contiene?`,o:[`Saccarosio`,`Maltosio`,`Lattosio`,`Glucosio`],a:0,e:`Il reattivo di Benedict rileva gli zuccheri riducenti, cioè con un gruppo carbonilico libero. Il saccarosio ha entrambi i carboni anomerici impegnati nel legame glicosidico, quindi non è riducente, ma l'idrolisi acida lo scinde in glucosio e fruttosio, entrambi riducenti. Maltosio, lattosio e glucosio sarebbero positivi già prima del trattamento.`},
{id:'bi_biomol_sf7',t:'bi_biomol',l:4,q:`Un polisaccaride, idrolizzato con acido a caldo, libera solo glucosio. Ingerito dall'uomo, non viene scisso dagli enzimi digestivi e passa come fibra. Quale tra questi è il più probabile?`,o:[`Cellulosa`,`Amido`,`Glicogeno`,`Chitina`],a:0,e:`La cellulosa è un polimero di glucosio con legami β(1→4), che gli enzimi umani non idrolizzano. Amido e glicogeno hanno legami α e sono digeriti dalle amilasi. La chitina non libera glucosio ma N-acetilglucosamina.`},
{id:'bi_biomol_sf8',t:'bi_biomol',l:4,q:`Il tripeptide Ala-Gly-Ser è scritto secondo la convenzione, dall'estremità N-terminale a quella C-terminale. Quale amminoacido ha il gruppo carbossilico α libero e quante molecole d'acqua si liberano nella sua sintesi?`,o:[`Ser; 2 molecole d'acqua`,`Ala; 2 molecole d'acqua`,`Ser; 3 molecole d'acqua`,`Gly; 1 molecola d'acqua`],a:0,e:`Le sequenze peptidiche si leggono dall'N-terminale (Ala, con amminico libero) al C-terminale (Ser, con carbossilico libero). Tre amminoacidi formano due legami peptidici e ogni condensazione libera una molecola d'acqua: 2 in totale, cioè n − 1.`},
{id:'bi_biomol_sf9',t:'bi_biomol',l:4,q:`Quale differenza strutturale dello zucchero rende il DNA chimicamente più stabile dell'RNA?`,o:[`Il desossiribosio è privo del gruppo OH in posizione 2'`,`Il desossiribosio ha un atomo di carbonio in più del ribosio`,`Il desossiribosio è privo del gruppo OH in posizione 3'`,`Il desossiribosio forma un anello a sei termini più stabile`],a:0,e:`Il gruppo OH in 2' del ribosio può attaccare il legame fosfodiesterico adiacente e favorirne l'idrolisi, quindi l'RNA è meno stabile. Il desossiribosio ha cinque atomi di carbonio, forma un anello a cinque termini e conserva l'OH in 3', indispensabile per il legame con il nucleotide successivo.`},
{id:'bi_biomol_sf10',t:'bi_biomol',l:4,q:`Le statine inibiscono la HMG-CoA reduttasi, enzima chiave di una via biosintetica del fegato. La sintesi di quale molecola, precursore anche degli ormoni steroidei, ne risulta ridotta?`,o:[`Colesterolo`,`Trigliceridi`,`Glicogeno`,`Emoglobina`],a:0,e:`La HMG-CoA reduttasi catalizza la tappa limitante della sintesi del colesterolo, da cui derivano anche ormoni steroidei e sali biliari. I trigliceridi si formano da glicerolo e acidi grassi, il glicogeno da glucosio, l'emoglobina è una proteina.`},
{id:'bi_prot_sf1',t:'bi_prot',l:4,q:`Un enzima che segue la cinetica di Michaelis-Menten ha Vmax = 120 μmol/min e Km = 2 mM. Qual è la velocità iniziale con [S] = 6 mM?`,o:[`90 μmol/min`,`60 μmol/min`,`80 μmol/min`,`100 μmol/min`],a:0,e:`v = Vmax·[S]/(Km + [S]) = 120·6/(2 + 6) = 90 μmol/min. 60 è la velocità a [S] = Km (metà di Vmax), 80 corrisponde a [S] = 4 mM e 100 a [S] = 10 mM.`},
{id:'bi_prot_sf2',t:'bi_prot',l:4,q:`Un inibitore lascia invariata la Vmax di un enzima e raddoppia la Km apparente. Con substrato molto abbondante l'effetto si annulla. Di che tipo di inibizione si tratta?`,o:[`Competitiva`,`Non competitiva`,`Incompetitiva`,`Irreversibile covalente`],a:0,e:`Un inibitore competitivo occupa il sito attivo: serve più substrato per raggiungere metà di Vmax (Km apparente maggiore) ma a [S] molto alta Vmax si recupera. Quella non competitiva abbassa Vmax con Km invariata, quella incompetitiva abbassa sia Vmax sia Km, quella irreversibile covalente riduce la quantità di enzima attivo e quindi Vmax.`},
{id:'bi_prot_sf3',t:'bi_prot',l:4,q:`Nell'avvelenamento da metanolo si somministra etanolo. Qual è il meccanismo d'azione?`,o:[`Compete con il metanolo per l'alcol deidrogenasi, rallentando la formazione di acido formico`,`Si lega a un sito allosterico dell'alcol deidrogenasi, inibendola in modo non competitivo`,`Denatura in modo irreversibile l'alcol deidrogenasi, bloccando ogni ossidazione alcolica`,`Converte direttamente il metanolo in acqua e CO₂, senza passare da intermedi tossici`],a:0,e:`L'etanolo è un substrato preferito dall'alcol deidrogenasi rispetto al metanolo e agisce come competitore: il metanolo viene eliminato in gran parte invariato invece di formare i metaboliti tossici (acido formico in particolare). Non c'è denaturazione, né inibizione allosterica, né conversione diretta in CO₂.`},
{id:'bi_prot_sf4',t:'bi_prot',l:4,q:`Un peptide contiene molta lisina e arginina e pochissimi residui acidi. In un'elettroforesi a pH 7,4, verso quale elettrodo migra e perché?`,o:[`Verso il catodo (polo negativo), perché ha carica netta positiva`,`Verso l'anodo (polo positivo), perché ha carica netta negativa`,`Non migra, perché a pH 7,4 ogni peptide è privo di carica netta`,`Verso l'anodo (polo positivo), perché i gruppi amminici sono deprotonati`],a:0,e:`Le catene laterali di lisina e arginina sono basiche e a pH 7,4 sono protonate (pKa circa 10,5 e 12,5), quindi il peptide ha carica netta positiva e migra verso il catodo. Un peptide è neutro solo al proprio punto isoelettrico, che qui è molto più alto di 7,4.`},
{id:'bi_prot_sf5',t:'bi_prot',l:4,q:`Nel muscolo che lavora intensamente aumentano la CO₂ e gli ioni H⁺. Come cambia l'affinità dell'emoglobina per l'O₂ e con quale vantaggio?`,o:[`Diminuisce (effetto Bohr), favorendo il rilascio di O₂ dove serve di più`,`Aumenta, così l'emoglobina trattiene più O₂ per i tessuti meno attivi`,`Resta invariata, perché dipende solo dalla pressione parziale di O₂`,`Aumenta, perché gli ioni H⁺ stabilizzano la forma ad alta affinità`],a:0,e:`Con pH più basso e più CO₂ l'emoglobina passa verso la forma a bassa affinità (effetto Bohr) e cede più O₂ proprio ai tessuti più attivi. L'affinità non dipende solo dalla pressione parziale di O₂ e H⁺ stabilizza la forma a bassa affinità, non quella ad alta affinità.`},
{id:'bi_prot_sf6',t:'bi_prot',l:4,q:`La ribonucleasi trattata con urea 8 M e un agente riducente si srotola e perde l'attività. Dopo rimozione graduale dei reagenti recupera la struttura nativa e l'attività. Che cosa dimostra l'esperimento?`,o:[`Che la sequenza degli amminoacidi contiene l'informazione per il ripiegamento corretto`,`Che urea e riducente hanno idrolizzato i legami peptidici, poi risaldati spontaneamente`,`Che solo la struttura secondaria è determinata dalla sequenza, la terziaria no`,`Che la denaturazione con urea è di norma irreversibile`],a:0,e:`L'urea e il riducente rompono legami non covalenti e disolfuro, non i legami peptidici. Poiché la proteina si rifolda da sola nella forma nativa, la struttura terziaria è specificata dalla struttura primaria (esperimento di Anfinsen). Il risultato contraddice l'idea che la denaturazione sia sempre irreversibile.`},
{id:'bi_prot_sf7',t:'bi_prot',l:4,q:`L'esochinasi (Km per il glucosio circa 0,1 mM) e la glucochinasi epatica (Km circa 10 mM) fosforilano il glucosio. Dopo un pasto la glicemia sale da 5 a 8 mM. Quale affermazione è corretta?`,o:[`L'esochinasi è già quasi satura e cambia poco; la glucochinasi aumenta sensibilmente`,`Entrambe aumentano la velocità in modo proporzionale alla glicemia, perché la Km non conta`,`L'esochinasi aumenta molto la velocità perché ha l'affinità più alta; la glucochinasi è satura`,`La glucochinasi è già satura a 5 mM e non risponde all'aumento della glicemia dopo il pasto`],a:0,e:`Con Km = 0,1 mM l'esochinasi lavora già a circa il 98% di Vmax a 5 mM, quindi quasi non cambia. Con Km = 10 mM la glucochinasi passa da circa un terzo a circa il 44% di Vmax: aumenta di oltre il 30%, cosa utile per il fegato che deve assorbire il glucosio in eccesso dopo i pasti.`},
{id:'bi_prot_sf8',t:'bi_prot',l:4,q:`Perché la tripsina viene sintetizzata dal pancreas come tripsinogeno inattivo?`,o:[`Per non digerire le proteine del pancreas stesso prima di raggiungere l'intestino`,`Perché la forma attiva sarebbe instabile al pH basico del duodeno`,`Perché l'attivazione richiede fosforilazione da parte dell'ATP nello stomaco`,`Perché il tripsinogeno è più solubile e può essere trasportato nel sangue`],a:0,e:`Gli zimogeni sono precursori inattivi che evitano l'autodigestione dell'organo che li produce. Il tripsinogeno viene attivato nel duodeno dall'enteropeptidasi, con taglio proteolitico, non per fosforilazione. La tripsina lavora bene a pH lievemente basico e non viene trasportata nel sangue.`},
{id:'bi_prot_sf9',t:'bi_prot',l:4,q:`L'emoglobina adulta è un tetramero con due catene α di 141 amminoacidi e due catene β di 146 amminoacidi. Quanti legami peptidici contiene in totale?`,o:[`570`,`573`,`574`,`566`],a:0,e:`Ogni catena di n amminoacidi ha n − 1 legami peptidici: 2·140 + 2·145 = 570. Il totale degli amminoacidi è 574 (da cui 573 se si sbaglia trattando tutto come una sola catena); le subunità sono tenute insieme da legami non covalenti, non peptidici.`},
{id:'bi_prot_sf10',t:'bi_prot',l:4,q:`Perché l'emoglobina fetale (α₂γ₂), con affinità per l'O₂ maggiore di quella adulta, è vantaggiosa per il feto?`,o:[`Permette di sottrarre O₂ all'emoglobina materna a livello della placenta`,`Permette di cedere O₂ ai tessuti fetali più facilmente della madre`,`Rende il feto indipendente dalla pressione parziale di O₂ materna`,`Evita la formazione del legame tra emoglobina e CO₂`],a:0,e:`A parità di pressione parziale di O₂, l'emoglobina con affinità più alta si satura di più: all'interfaccia placentare l'O₂ passa dall'emoglobina materna a quella fetale. Il feto dipende comunque dall'O₂ materno e l'alta affinità non riguarda il CO₂.`},
{id:'bi_metab_sf1',t:'bi_metab',l:4,q:`Una molecola di acetil-CoA viene completamente ossidata nel ciclo di Krebs. Contando 2,5 ATP per NADH, 1,5 ATP per FADH₂ e 1 ATP (o GTP) per fosforilazione a livello del substrato, quanti ATP si ottengono in totale?`,o:[`10`,`9`,`7,5`,`12`],a:0,e:`Un giro del ciclo produce 3 NADH, 1 FADH₂ e 1 ATP/GTP: 3·2,5 + 1·1,5 + 1 = 10. Il valore 9 dimentica l'ATP, 7,5 conta solo i NADH, 12 deriva dalla vecchia convenzione 3 e 2 ATP per NADH e FADH₂ (qui esclusa).`},
{id:'bi_metab_sf2',t:'bi_metab',l:4,q:`Acido miristico (saturo, 14 atomi di carbonio). Contando 2,5 ATP per NADH, 1,5 per FADH₂, 10 ATP per ogni acetil-CoA ossidato nel ciclo di Krebs e nella catena respiratoria, e 2 ATP equivalenti per l'attivazione ad acil-CoA, qual è la resa netta di ATP della completa ossidazione?`,o:[`92`,`94`,`106`,`82`],a:0,e:`14 C danno 6 cicli di β-ossidazione e 7 acetil-CoA. I cicli forniscono 6·(2,5 + 1,5) = 24 ATP, gli acetil-CoA 7·10 = 70, meno 2 per l'attivazione: 24 + 70 − 2 = 92. 94 dimentica l'attivazione, 106 è il valore del palmitato (16 C), 82 deriva dal contare 6 acetil-CoA invece di 7.`},
{id:'bi_metab_sf3',t:'bi_metab',l:4,q:`Il 2,4-dinitrofenolo, che trasporta protoni attraverso la membrana mitocondriale interna, viene aggiunto a mitocondri funzionanti. Quali effetti si osservano?`,o:[`Il consumo di O₂ aumenta, la sintesi di ATP diminuisce e si libera più calore`,`Il consumo di O₂ diminuisce e la sintesi di ATP aumenta per l'accumulo del gradiente`,`Il consumo di O₂ si blocca perché viene inibito il complesso IV`,`Il consumo di O₂ e la sintesi di ATP aumentano insieme perché passano più protoni`],a:0,e:`Il disaccoppiante dissipa il gradiente protonico senza passare dall'ATP sintasi: la catena respiratoria corre più velocemente (più O₂ consumato) ma l'energia si perde come calore e l'ATP prodotto cala. Non inibisce il complesso IV e i protoni che passano per il disaccoppiante non producono ATP.`},
{id:'bi_metab_sf4',t:'bi_metab',l:4,q:`Cellule in coltura vengono trattate con cianuro, inibitore della citocromo c ossidasi (complesso IV), in presenza di glucosio. Che cosa avviene?`,o:[`Il NADH si accumula e la cellula ricorre alla glicolisi anaerobica con produzione di lattato`,`L'ATP sintasi continua a lavorare con il gradiente residuo e la produzione di ATP resta invariata`,`Il ciclo di Krebs accelera perché nella matrice si accumula NAD⁺ in eccesso`,`La glicolisi si arresta e le cellule smettono completamente di consumare glucosio`],a:0,e:`Senza il complesso IV gli elettroni non arrivano all'O₂, la catena si ferma, il NADH non viene riossidato e il ciclo di Krebs rallenta. Per rigenerare NAD⁺ la glicolisi prosegue con riduzione del piruvato a lattato (e il consumo di glucosio aumenta per compensare la perdita di ATP).`},
{id:'bi_metab_sf5',t:'bi_metab',l:4,q:`In mitocondri isolati con substrato e O₂, l'oligomicina (inibitore dell'ATP sintasi) riduce molto il consumo di O₂. Aggiungendo poi un disaccoppiante, il consumo di O₂ torna elevato. Quale interpretazione è corretta?`,o:[`Senza rientro dei protoni il gradiente frena la catena; il disaccoppiante dissipa il gradiente`,`L'oligomicina blocca il complesso IV della catena e il disaccoppiante lo riattiva`,`L'oligomicina esaurisce il substrato ossidabile e il disaccoppiante lo rigenera`,`L'oligomicina disperde il gradiente protonico e il disaccoppiante lo ricostituisce`],a:0,e:`Se i protoni non possono rientrare attraverso l'ATP sintasi, il gradiente cresce e frena il pompaggio, quindi la catena rallenta e il consumo di O₂ cala. Il disaccoppiante riapre una via di rientro dei protoni e la catena torna veloce. Le altre risposte scambiano i ruoli o attribuiscono al disaccoppiante effetti che non ha.`},
{id:'bi_metab_sf6',t:'bi_metab',l:4,q:`Dopo un digiuno di 12 ore il fegato rilascia glucosio nel sangue, mentre il glicogeno muscolare non contribuisce alla glicemia. Qual è la spiegazione?`,o:[`Il fegato ha la glucosio-6-fosfatasi, assente nel muscolo`,`Il muscolo non ha la glicogeno fosforilasi e non degrada il glicogeno`,`Il muscolo non possiede l'esochinasi e non fosforila il glucosio`,`Solo il fegato è in grado di immagazzinare glicogeno`],a:0,e:`Il muscolo degrada il glicogeno (ha la fosforilasi), ma il glucosio-6-fosfato che ne deriva non può essere defosforilato né uscire dalla cellula, e viene usato in loco nella glicolisi. Il fegato, con la glucosio-6-fosfatasi, produce glucosio libero. Anche il muscolo contiene molto glicogeno e ha l'esochinasi.`},
{id:'bi_metab_sf7',t:'bi_metab',l:4,q:`Una coltura di lievito fermenta 5 mol di glucosio fino a etanolo in condizioni anaerobie. Considerando la sola resa netta della glicolisi, quante mol di ATP e di CO₂ si ottengono?`,o:[`10 mol di ATP e 10 mol di CO₂`,`10 mol di ATP e 5 mol di CO₂`,`20 mol di ATP e 10 mol di CO₂`,`10 mol di ATP e 30 mol di CO₂`],a:0,e:`Per ogni glucosio la glicolisi dà 2 ATP netti e la fermentazione alcolica produce 2 etanolo e 2 CO₂: per 5 mol si hanno 10 ATP e 10 CO₂. 30 mol di CO₂ sarebbero la resa della respirazione aerobica (6 per glucosio), non della fermentazione.`},
{id:'bi_metab_sf8',t:'bi_metab',l:4,q:`Nel ciclo di Calvin, quanti ATP e quanti NADPH servono per fissare 6 molecole di CO₂ nell'equivalente di una molecola di glucosio?`,o:[`18 ATP e 12 NADPH`,`12 ATP e 18 NADPH`,`9 ATP e 6 NADPH`,`6 ATP e 12 NADPH`],a:0,e:`Per ogni CO₂ fissata servono 3 ATP (riduzione del 3-fosfoglicerato e rigenerazione del RuBP) e 2 NADPH: per 6 CO₂ sono 18 ATP e 12 NADPH. 9 e 6 sono i valori per 3 CO₂ (una triosio fosfato), mentre 12 e 18 invertono il rapporto.`},
{id:'bi_metab_sf9',t:'bi_metab',l:4,q:`Alghe fotosintetiche ricevono ¹⁴CO₂ e vengono bloccate dopo pochi secondi: il primo composto stabile marcato è il 3-fosfoglicerato, a tre atomi di carbonio. Che cosa si deduce sulla fissazione della CO₂?`,o:[`La CO₂ si lega a un accettore a 5 atomi di carbonio, generando due molecole a 3 atomi`,`La CO₂ si lega a un composto a 2 atomi di carbonio, formando una molecola a 3 atomi`,`La CO₂ si lega al piruvato, formando una molecola a 4 atomi di carbonio`,`La CO₂ si lega a un composto a 6 atomi di carbonio, che si scinde in due molecole`],a:0,e:`Il primo prodotto stabile a 3 C indica che l'addizione di 1 C a un accettore a 5 C (ribulosio-1,5-bisfosfato, catalizzata dalla RuBisCO) forma un intermedio a 6 C instabile, che si scinde subito in due 3-fosfoglicerato. Il piruvato e l'ossalacetato (a 4 C) non sono il primo prodotto di questa via.`},
{id:'bi_metab_sf10',t:'bi_metab',l:4,q:`In una persona a digiuno da 18 ore, quale combinazione di eventi epatici è attesa per azione del glucagone?`,o:[`Aumentano glicogenolisi e gluconeogenesi, diminuisce la sintesi di glicogeno`,`Aumentano glicogenosintesi e glicolisi, diminuisce la gluconeogenesi`,`Aumentano glicogenolisi e glicolisi, diminuisce la gluconeogenesi`,`Aumentano glicogenosintesi e gluconeogenesi, diminuisce la glicogenolisi`],a:0,e:`Il glucagone attiva nel fegato la glicogeno fosforilasi, inibisce la glicogeno sintasi e favorisce la gluconeogenesi, riducendo la glicolisi, per mandare glucosio nel sangue. Le altre combinazioni mescolano effetti dell'insulina (che favorisce glicogenosintesi e glicolisi) con quelli del glucagone.`},
{id:'bi_gapp_sf1',t:'bi_gapp',l:4,q:`Una reazione di PCR parte da 4 molecole di DNA stampo a doppio filamento contenenti la sequenza bersaglio. Con efficienza del 100%, quante molecole a doppio filamento con la sequenza bersaglio ci sono dopo 6 cicli?`,o:[`256`,`24`,`64`,`512`],a:0,e:`A ogni ciclo il numero di molecole raddoppia: 4 · 2⁶ = 256. 24 sarebbe una crescita lineare, 64 dimentica le 4 molecole iniziali, 512 corrisponde a 7 cicli.`},
{id:'bi_gapp_sf2',t:'bi_gapp',l:4,q:`Un DNA lineare di 10 000 bp viene tagliato da un enzima di restrizione in tre siti, posti a 2000, 5000 e 9000 bp da un'estremità. Quanti frammenti si ottengono e di che lunghezza?`,o:[`4 frammenti: 1000, 2000, 3000 e 4000 bp`,`3 frammenti: 2000, 3000 e 4000 bp`,`4 frammenti: 2000, 5000, 9000 e 10 000 bp`,`3 frammenti: 2000, 5000 e 9000 bp`],a:0,e:`Un DNA lineare con 3 tagli dà 4 frammenti: da 0 a 2000 (2000), da 2000 a 5000 (3000), da 5000 a 9000 (4000) e da 9000 a 10 000 (1000); la somma è 10 000. Le altre risposte dimenticano l'ultimo frammento oppure scambiano le posizioni dei siti con le lunghezze.`},
{id:'bi_gapp_sf3',t:'bi_gapp',l:4,q:`Un amplicone di 600 bp contiene un sito per EcoRI a 200 bp da un'estremità; una mutazione puntiforme può abolire il sito. Il DNA di un paziente, digerito con EcoRI e analizzato su gel di agarosio, mostra bande a 600, 400 e 200 bp. Qual è il genotipo?`,o:[`Eterozigote per la mutazione`,`Omozigote per la mutazione`,`Omozigote per l'allele normale`,`Emizigote per l'allele mutato`],a:0,e:`L'allele normale viene tagliato in 200 + 400 bp, l'allele mutato (senza sito) resta a 600 bp. La presenza di tutte e tre le bande indica un allele per tipo, cioè un eterozigote. L'omozigote mutato mostrerebbe solo la banda a 600, l'omozigote normale solo 400 e 200; l'emizigote ha una sola copia del gene.`},
{id:'bi_gapp_sf4',t:'bi_gapp',l:4,q:`In una popolazione in equilibrio di Hardy-Weinberg una malattia autosomica recessiva colpisce 1 persona su 400. Quanti portatori sani ci si aspetta in un gruppo di 10 000 persone?`,o:[`950`,`25`,`475`,`1900`],a:0,e:`q² = 1/400, quindi q = 1/20 e p = 19/20. I portatori sono 2pq = 2·(19/20)·(1/20) = 0,095, cioè 950 su 10 000. 25 sono i malati, 475 deriva dal dimenticare il fattore 2 e 1900 dal raddoppiare ancora il risultato corretto.`},
{id:'bi_gapp_sf5',t:'bi_gapp',l:4,q:`Una coppia di genitori sani ha un figlio affetto da una malattia autosomica recessiva. Qual è la probabilità che un'altra loro figlia, sana, sia portatrice?`,o:[`2/3`,`1/2`,`1/4`,`1/3`],a:0,e:`I genitori sono obbligatoriamente portatori (Aa × Aa). Tra i figli sani le combinazioni possibili sono AA (1/4) e Aa (2/4): la probabilità di essere portatrice, dato che è sana, è (2/4)/(3/4) = 2/3. 1/2 è la probabilità non condizionata, 1/4 quella di essere affetta.`},
{id:'bi_gapp_sf6',t:'bi_gapp',l:4,q:`Due genitori sani sono eterozigoti per due malattie autosomiche recessive su cromosomi diversi, la fibrosi cistica e la fenilchetonuria. Qual è la probabilità che un figlio abbia la fibrosi cistica ma non la fenilchetonuria?`,o:[`3/16`,`1/16`,`9/16`,`1/4`],a:0,e:`I due geni segregano in modo indipendente: P(fibrosi cistica) = 1/4 e P(non fenilchetonurico) = 3/4, quindi 1/4 · 3/4 = 3/16. 1/16 è la probabilità di avere entrambe le malattie, 9/16 di non averne nessuna e 1/4 ignora la seconda condizione.`},
{id:'bi_gapp_sf7',t:'bi_gapp',l:4,q:`Una donna Rh negativa, dopo il parto del primo figlio Rh positivo, riceve immunoglobuline anti-D. Qual è lo scopo del trattamento?`,o:[`Eliminare le emazie fetali Rh+ dal sangue materno prima che la madre produca anticorpi`,`Immunizzare attivamente la madre, che produrrà anticorpi anti-D protettivi per il feto stesso`,`Trasformare le emazie del neonato da Rh positive a Rh negative, evitando l'anemia`,`Bloccare il passaggio delle IgG materne attraverso la placenta nelle gravidanze successive`],a:0,e:`Al parto emazie fetali Rh+ passano nel circolo materno; gli anticorpi anti-D somministrati le eliminano prima che il sistema immunitario materno si sensibilizzi, così una gravidanza successiva con feto Rh+ non è a rischio di malattia emolitica. L'immunità conferita è passiva, non attiva, e le IgG materne attraversano la placenta, ed è proprio questo a causare il danno se la madre è sensibilizzata.`},
{id:'bi_gapp_sf8',t:'bi_gapp',l:4,q:`Per produrre insulina umana in Escherichia coli si inserisce nel plasmide il cDNA e non il gene genomico. Perché?`,o:[`Perché i batteri non sanno rimuovere gli introni dal trascritto primario`,`Perché i batteri non sanno trascrivere il DNA di origine umana`,`Perché il cDNA contiene gli introni, che aumentano l'espressione`,`Perché il gene genomico non può essere tagliato dagli enzimi di restrizione`],a:0,e:`Il cDNA è ottenuto per retrotrascrizione dall'mRNA maturo, quindi è privo di introni, mentre E. coli non possiede lo spliceosoma per eliminarli dal trascritto. Il DNA umano può essere trascritto in batteri se ha un promotore adatto e il gene genomico può essere tagliato dagli enzimi di restrizione come qualsiasi DNA.`},
{id:'bi_gapp_sf9',t:'bi_gapp',l:4,q:`Batteri trasformati con un plasmide che porta il gene di resistenza all'ampicillina e il gene lacZ (con un sito di clonaggio al suo interno) sono piastrati su terreno con ampicillina e X-gal. Che cosa indicano le colonie bianche?`,o:[`Batteri con plasmide con lacZ interrotto dall'inserto di DNA estraneo`,`Batteri non trasformati, privi di qualsiasi plasmide`,`Batteri con plasmide richiuso su sé stesso senza inserto`,`Batteri con plasmide senza il gene di resistenza all'ampicillina`],a:0,e:`Solo i batteri con il plasmide resistono all'ampicillina e crescono. Se lacZ è integro la β-galattosidasi scinde l'X-gal e la colonia è blu (plasmide senza inserto); se l'inserto interrompe lacZ, la colonia è bianca (ricombinante). I batteri senza plasmide o privi del gene di resistenza non crescono.`},
{id:'bi_gapp_sf10',t:'bi_gapp',l:4,q:`In una cellula umana, Cas9 guidata da un RNA guida produce un taglio a doppio filamento in un gene e non è fornito alcuno stampo di riparazione. Quale esito è il più comune?`,o:[`Riparo per giunzione di estremità non omologhe, con piccoli indel che possono inattivare il gene`,`Riparo per ricombinazione omologa, che ripristina esattamente la sequenza originale`,`Sostituzione del tratto tagliato con una sequenza nuova scelta dalla cellula stessa`,`Metilazione del gene, che lo silenzia senza alterare la sequenza`],a:0,e:`In assenza di uno stampo il riparo avviene soprattutto per giunzione delle estremità non omologhe, che è soggetta a errori: piccole inserzioni o delezioni (indel) possono causare uno slittamento della fase di lettura e inattivare il gene. La riparazione per omologia richiede uno stampo e la metilazione non è la conseguenza del taglio.`},
{id:'fi_cin_sf1',t:'fi_cin',l:4,q:`Un'auto viaggia a 72 km/h e frena con decelerazione costante di 4 m/s². Quanta strada percorre prima di fermarsi?`,o:[`50 m`,`100 m`,`25 m`,`80 m`],a:0,e:`72 km/h = 20 m/s. Dalla relazione v² = 2·a·s si ha s = v²/(2a) = 400/8 = 50 m. Se si dimentica il fattore 2 si trova 100 m; 25 m e 80 m derivano da altri scambi tra v, a e t.`},
{id:'fi_cin_sf2',t:'fi_cin',l:4,q:`Un treno parte da fermo e accelera uniformemente fino a 30 m/s in 15 s. Prosegue a 30 m/s per 20 s e poi frena uniformemente fino a fermarsi in 10 s. Quanta strada ha percorso in tutto?`,o:[`975 m`,`1350 m`,`600 m`,`825 m`],a:0,e:`La strada è l'area sotto il grafico v-t, un trapezio. Fase 1: ½·30·15 = 225 m. Fase 2: 30·20 = 600 m. Fase 3: ½·30·10 = 150 m. Totale 975 m. 1350 m è 30·45, cioè come se il treno viaggiasse sempre a 30 m/s; 600 m è il solo tratto a velocità costante; 825 m dimentica la frenata (225 + 600).`},
{id:'fi_cin_sf3',t:'fi_cin',l:4,q:`Il grafico velocità-tempo di un corpo è una retta che sale da 0 a 10 m/s nei primi 5 s, poi diventa orizzontale a 10 m/s per altri 5 s. Qual è la velocità media sull'intero intervallo di 10 s?`,o:[`7,5 m/s`,`5 m/s`,`10 m/s`,`3,75 m/s`],a:0,e:`Spostamento = area sotto il grafico: ½·10·5 = 25 m nella rampa e 10·5 = 50 m nel tratto costante, cioè 75 m. Velocità media = 75 m / 10 s = 7,5 m/s. Il valore 5 m/s è la media nella sola rampa (0 e 10), 10 m/s è la velocità finale, 3,75 m/s deriva da una divisione per 20 s.`},
{id:'fi_cin_sf4',t:'fi_cin',l:4,q:`Due sassi vengono lasciati cadere da fermi, senza attrito dell'aria. Il secondo parte da un'altezza 4 volte maggiore del primo. Il tempo di caduta del secondo rispetto al primo è…`,o:[`il doppio`,`4 volte maggiore`,`la metà`,`√2 volte maggiore`],a:0,e:`Da h = ½·g·t² si ricava t = √(2h/g): il tempo è proporzionale alla radice quadrata dell'altezza. Se h quadruplica, t raddoppia. La risposta 4 volte confonde proporzionalità lineare e quadratica; √2 si avrebbe raddoppiando l'altezza.`},
{id:'fi_cin_sf5',t:'fi_cin',l:4,q:`Un'auto che viaggia a 50 km/h si arresta in 15 m con una frenata a decelerazione costante. A parità di condizioni della strada, quanto spazio serve per fermarla partendo da 100 km/h?`,o:[`60 m`,`30 m`,`45 m`,`120 m`],a:0,e:`Lo spazio di frenata è s = v²/(2a), quindi è proporzionale al quadrato della velocità. Raddoppiando v, s diventa 2² = 4 volte: 15 · 4 = 60 m. 30 m è la risposta di chi pensa a una proporzionalità diretta; 45 m e 120 m non seguono la legge quadratica.`},
{id:'fi_cin_sf6',t:'fi_cin',l:4,q:`Un ciclista percorre la prima metà di un tragitto a 12 m/s e la seconda metà, della stessa lunghezza, a 6 m/s. Qual è la sua velocità media sull'intero tragitto?`,o:[`8 m/s`,`9 m/s`,`18 m/s`,`4 m/s`],a:0,e:`Sia L la lunghezza di ciascuna metà. Tempi: L/12 e L/6, totale L/4. Strada totale 2L, quindi vmedia = 2L / (L/4) = 8 m/s. La media aritmetica 9 m/s è sbagliata perché il ciclista passa più tempo alla velocità minore; 18 m/s è la somma; 4 m/s è un errore di calcolo.`},
{id:'fi_cin_sf7',t:'fi_cin',l:4,q:`Un sasso viene lanciato verticalmente verso l'alto (g = 10 m/s², senza attrito dell'aria). Nel punto più alto della traiettoria, velocità e accelerazione valgono…`,o:[`v = 0 e a = 10 m/s² diretta verso il basso`,`v = 0 e a = 0`,`v = 0 e a = 10 m/s² diretta verso l'alto`,`v = 10 m/s verso il basso e a = 0`],a:0,e:`Nel punto più alto il sasso si ferma un istante (v = 0), ma sul sasso agisce sempre la sola forza peso, quindi l'accelerazione resta g = 10 m/s² verso il basso per tutto il volo. Dire che a = 0 confonde velocità nulla e accelerazione nulla; il verso verso l'alto è sbagliato perché g punta sempre verso il basso.`},
{id:'fi_cin_sf8',t:'fi_cin',l:4,q:`Da un balcone alto 15 m si lancia una palla verticalmente verso l'alto a 10 m/s (g = 10 m/s², senza attrito dell'aria). Dopo quanto tempo tocca il suolo?`,o:[`3 s`,`2 s`,`1,7 s`,`4 s`],a:0,e:`Con l'origine al suolo, y(t) = 15 + 10t − 5t². Imponendo y = 0 si ottiene t² − 2t − 3 = 0, cioè t = 3 s (l'altra soluzione, −1 s, non ha significato). Dopo 2 s la palla è solo tornata all'altezza del balcone; 1,7 s è il tempo di caduta libera da 15 m senza lancio; 4 s non soddisfa l'equazione.`},
{id:'fi_cin_sf9',t:'fi_cin',l:4,q:`Un'auto viaggia a 90 km/h. Il guidatore impiega 0,8 s a reagire, durante i quali la velocità non cambia, poi frena con decelerazione costante di 5 m/s². Qual è la distanza totale percorsa dal momento in cui vede l'ostacolo a quando l'auto si ferma?`,o:[`82,5 m`,`62,5 m`,`20 m`,`145 m`],a:0,e:`90 km/h = 25 m/s. Durante la reazione: 25·0,8 = 20 m. In frenata: v²/(2a) = 625/10 = 62,5 m. Totale 20 + 62,5 = 82,5 m. 62,5 m e 20 m sono i singoli contributi; 145 m deriva dal 20 + 125, cioè dalla frenata calcolata senza il fattore ½.`},
{id:'fi_cin_sf10',t:'fi_cin',l:4,q:`Due ciclisti partono nello stesso istante da due paesi distanti 60 km e vanno uno verso l'altro lungo la stessa strada, a velocità costanti di 20 km/h e 10 km/h. A quale distanza dal paese del ciclista più veloce si incontrano?`,o:[`40 km`,`20 km`,`30 km`,`50 km`],a:0,e:`Le velocità si sommano nell'avvicinamento: 20 + 10 = 30 km/h, quindi si incontrano dopo 60/30 = 2 h. Il ciclista più veloce ha percorso 20·2 = 40 km. 20 km è la distanza percorsa dal più lento; 30 km è la metà del percorso, che varrebbe solo a velocità uguali; 50 km non corrisponde ai dati.`},
{id:'fi_din_sf1',t:'fi_din',l:4,q:`Un blocco parte da fermo e scivola senza attrito lungo un piano inclinato di 30° (g = 10 m/s², sen 30° = 0,5), percorrendo 10 m lungo il piano. Quanto tempo impiega?`,o:[`2 s`,`1,4 s`,`4 s`,`10 s`],a:0,e:`L'accelerazione lungo il piano è a = g·sen 30° = 5 m/s². Da s = ½·a·t² si ha t = √(2s/a) = √(20/5) = 2 s. 1,4 s si ottiene usando a = g invece di g·sen 30°; 4 s è 2s/a senza radice; 10 s non ha base fisica.`},
{id:'fi_din_sf2',t:'fi_din',l:4,q:`Una cassa di 20 kg, ferma su un pavimento orizzontale, viene tirata da una forza orizzontale costante di 100 N. Il coefficiente di attrito dinamico è 0,3 (g = 10 m/s²). Che velocità ha dopo 5 s?`,o:[`10 m/s`,`25 m/s`,`5 m/s`,`50 m/s`],a:0,e:`Forza di attrito: μ·m·g = 0,3·20·10 = 60 N. Risultante: 100 − 60 = 40 N, quindi a = 40/20 = 2 m/s² e v = a·t = 2·5 = 10 m/s. 25 m/s si ottiene ignorando l'attrito (a = 5 m/s²); 5 m/s è l'accelerazione senza attrito (100/20) presa come velocità; 50 m/s usa t² al posto di t (2·25).`},
{id:'fi_din_sf3',t:'fi_din',l:4,q:`Due masse di 3 kg e 2 kg sono appese alle estremità di una fune inestensibile e di massa trascurabile che passa su una carrucola ideale (g = 10 m/s²). Quanto vale la tensione della fune mentre le masse si muovono?`,o:[`24 N`,`20 N`,`30 N`,`25 N`],a:0,e:`Il sistema accelera con a = g(m1 − m2)/(m1 + m2) = 10·1/5 = 2 m/s². Per la massa da 2 kg che sale: T − 20 = 2·2, quindi T = 24 N (verifica con la massa da 3 kg: 30 − T = 3·2, T = 24 N). 20 N e 30 N sono i pesi delle due masse, valori che la tensione avrebbe solo in equilibrio (a = 0); 25 N è la media dei due pesi, un'approssimazione priva di fondamento.`},
{id:'fi_din_sf4',t:'fi_din',l:4,q:`Su un corpo la forza risultante raddoppia e, nello stesso tempo, la sua massa si dimezza. L'accelerazione del corpo…`,o:[`diventa 4 volte più grande`,`raddoppia`,`resta uguale`,`diventa la metà`],a:0,e:`Dal secondo principio a = F/m. Con F → 2F e m → m/2 si ha a' = 2F/(m/2) = 4F/m = 4a. Raddoppia solo se cambia uno dei due fattori; resta uguale se i due effetti si compensassero (cosa che accadrebbe raddoppiando sia F sia m).`},
{id:'fi_din_sf5',t:'fi_din',l:4,q:`Un'auto percorre una strada rettilinea e orizzontale a velocità costante. Che cosa si può dire della forza motrice sulle ruote rispetto alle forze resistenti (attrito e resistenza dell'aria)?`,o:[`È uguale in modulo e opposta alle forze resistenti`,`È maggiore delle forze resistenti`,`È nulla, perché l'auto non accelera`,`È minore delle forze resistenti`],a:0,e:`A velocità costante l'accelerazione è nulla, quindi per il secondo principio la risultante è nulla: la forza motrice bilancia esattamente le forze resistenti. Non è nulla (altrimenti l'auto rallenterebbe) e non è maggiore (altrimenti accelererebbe): confondere moto e forza risultante è l'errore tipico.`},
{id:'fi_din_sf6',t:'fi_din',l:4,q:`Un camion pesante urta frontalmente un'auto leggera. Durante l'urto, quale affermazione è corretta?`,o:[`Le due forze hanno lo stesso modulo, ma l'auto subisce un'accelerazione maggiore`,`Il camion esercita sull'auto una forza maggiore, e le due accelerazioni sono uguali`,`Le due forze hanno lo stesso modulo e le due accelerazioni sono uguali`,`L'auto esercita sul camion una forza maggiore, perché è più leggera`],a:0,e:`Per il terzo principio le forze di azione e reazione hanno sempre lo stesso modulo e verso opposto, qualunque sia la massa dei corpi. Per il secondo principio a = F/m: a parità di F, l'auto (massa minore) subisce un'accelerazione maggiore del camion. L'errore tipico è pensare che il corpo più pesante eserciti una forza maggiore.`},
{id:'fi_din_sf7',t:'fi_din',l:4,q:`In un urto frontale una persona di 60 kg, che viaggia a 15 m/s, viene arrestata in 0,1 s da un sedile rigido. Con un sistema di ritenuta che allunga l'arresto a 0,3 s, qual è la forza media che agisce sulla persona?`,o:[`3000 N`,`9000 N`,`900 N`,`300 N`],a:0,e:`Impulso = variazione della quantità di moto: F·Δt = m·Δv = 60·15 = 900 kg·m/s. Con Δt = 0,3 s: F = 900/0,3 = 3000 N (contro 9000 N con 0,1 s: allungare il tempo riduce la forza di 3 volte). 9000 N è la forza senza il sistema di ritenuta; 900 N è l'impulso preso come se fosse la forza; 300 N è un errore di un fattore 10.`},
{id:'fi_din_sf8',t:'fi_din',l:4,q:`Una cassa di 50 kg è ferma su un pavimento orizzontale. I coefficienti di attrito sono μs = 0,4 (statico) e μd = 0,3 (dinamico), con g = 10 m/s². Una persona la spinge con una forza orizzontale costante di 250 N. Qual è l'accelerazione della cassa una volta in moto?`,o:[`2 m/s²`,`1 m/s²`,`5 m/s²`,`0 m/s², la cassa resta ferma`],a:0,e:`La forza massima di attrito statico è 0,4·50·10 = 200 N < 250 N, quindi la cassa si mette in moto. Da quel momento agisce l'attrito dinamico: 0,3·50·10 = 150 N. Risultante 250 − 150 = 100 N, a = 100/50 = 2 m/s². 1 m/s² usa per errore l'attrito statico, 5 m/s² lo trascura del tutto, 0 vale solo se la spinta fosse sotto i 200 N.`},
{id:'fi_din_sf9',t:'fi_din',l:4,q:`Il grafico velocità-tempo di una slitta è: retta crescente da 0 a 4 s, tratto orizzontale da 4 a 8 s, retta decrescente da 8 a 10 s fino a fermarsi. In quale intervallo la forza risultante sulla slitta è nulla?`,o:[`Tra 4 s e 8 s`,`Tra 0 s e 4 s`,`Tra 8 s e 10 s`,`Mai, perché la slitta è sempre in movimento`],a:0,e:`La risultante è proporzionale all'accelerazione, cioè alla pendenza del grafico v-t. Nel tratto orizzontale (4-8 s) la pendenza è nulla, quindi la risultante è nulla anche se la slitta si muove: è il primo principio. Nei tratti inclinati l'accelerazione, e quindi la risultante, è diversa da zero (positiva nel primo, negativa nel terzo).`},
{id:'fi_din_sf10',t:'fi_din',l:4,q:`Una cassa di 10 kg è ferma su una rampa inclinata di 30° rispetto all'orizzontale (g = 10 m/s², sen 30° = 0,5, cos 30° ≈ 0,87). Quanto vale la forza di attrito statico che la tiene ferma?`,o:[`50 N`,`100 N`,`87 N`,`0 N`],a:0,e:`La cassa è in equilibrio, quindi la forza di attrito bilancia la componente del peso lungo il piano: m·g·sen 30° = 10·10·0,5 = 50 N. 100 N è il peso intero; 87 N è la componente perpendicolare al piano (normale); 0 N varrebbe solo senza attrito, ma allora la cassa scivolerebbe.`},
{id:'fi_en_sf1',t:'fi_en',l:4,q:`Una cassa di 10 kg parte da ferma dalla sommità di una rampa alta 2 m e arriva alla base con velocità 4 m/s (g = 10 m/s²). Quanta energia è stata dissipata dall'attrito?`,o:[`120 J`,`80 J`,`200 J`,`280 J`],a:0,e:`Energia potenziale iniziale: m·g·h = 10·10·2 = 200 J. Energia cinetica finale: ½·10·4² = 80 J. L'energia dissipata è la differenza: 200 − 80 = 120 J. 200 J e 80 J sono i due termini presi singolarmente; 280 J si ottiene sommandoli invece di sottrarli.`},
{id:'fi_en_sf2',t:'fi_en',l:4,q:`Una gru solleva a velocità costante un carico di 200 kg di 15 m in 30 s (g = 10 m/s²). Il suo motore ha un rendimento del 50%. Quale potenza elettrica assorbe?`,o:[`2000 W`,`1000 W`,`500 W`,`4000 W`],a:0,e:`Lavoro utile: m·g·h = 200·10·15 = 30000 J. Potenza utile: 30000/30 = 1000 W. Il rendimento è 50%, quindi la potenza assorbita è 1000/0,5 = 2000 W. 1000 W è la sola potenza utile; 500 W moltiplica per il rendimento invece di dividere; 4000 W raddoppia due volte.`},
{id:'fi_en_sf3',t:'fi_en',l:4,q:`Un'auto che viaggia a una certa velocità si ferma, con forza frenante costante, dopo una distanza d. Se la velocità iniziale triplica e la forza frenante è la stessa, la distanza di arresto diventa…`,o:[`9 d`,`3 d`,`6 d`,`27 d`],a:0,e:`Il lavoro della forza frenante F·s deve annullare l'energia cinetica ½·m·v². Quindi s = m·v²/(2F) è proporzionale a v². Con v → 3v, s → 9s. 3 d vale per una proporzionalità diretta, 6 d è un errore additivo, 27 d deriva dal cubo.`},
{id:'fi_en_sf4',t:'fi_en',l:4,q:`Una forza agisce nella direzione dello spostamento. Il suo valore è costante, 10 N, per i primi 4 m; poi diminuisce linearmente fino ad annullarsi in altri 4 m. Quanto lavoro compie in totale sugli 8 m?`,o:[`60 J`,`80 J`,`40 J`,`50 J`],a:0,e:`Il lavoro è l'area sotto il grafico forza-spostamento. Primo tratto, rettangolo: 10·4 = 40 J. Secondo tratto, triangolo: ½·10·4 = 20 J. Totale 60 J. 80 J considera la forza costante su tutti gli 8 m; 40 J trascura il secondo tratto; 50 J si ottiene dimezzando per errore la base del triangolo (40 + 10).`},
{id:'fi_en_sf5',t:'fi_en',l:4,q:`Un facchino cammina su un pavimento orizzontale a velocità costante, reggendo con le braccia una valigia. Il lavoro compiuto dalla forza verticale con cui le sue mani sostengono la valigia, nel tragitto, è…`,o:[`nullo, perché la forza è perpendicolare allo spostamento`,`positivo, perché la valigia viene trasportata`,`negativo, perché si oppone al peso`,`pari all'energia cinetica della valigia`],a:0,e:`Il lavoro è L = F·s·cos θ. La forza di sostegno è verticale e lo spostamento è orizzontale: θ = 90°, cos θ = 0, quindi L = 0 (anche se il facchino si stanca fisiologicamente). Non c'è variazione di energia cinetica, né di energia potenziale, quindi non c'è lavoro netto da compiere.`},
{id:'fi_en_sf6',t:'fi_en',l:4,q:`Tre palline identiche vengono lanciate da una stessa altezza h sopra il suolo con la stessa velocità iniziale v: la prima verso l'alto, la seconda in orizzontale, la terza verso il basso. Trascurando l'attrito dell'aria, come sono le velocità con cui toccano il suolo?`,o:[`Uguali per tutte e tre`,`Maggiore per la prima, perché sale più in alto`,`Maggiore per la terza, perché è lanciata verso il basso`,`Maggiore per la seconda, perché ha anche moto orizzontale`],a:0,e:`Per la conservazione dell'energia meccanica, ½·m·v² + m·g·h è uguale per le tre palline all'inizio, e a terra è tutta cinetica: ½·m·v_f² = ½·m·v² + m·g·h. Il modulo v_f non dipende dalla direzione del lancio. Le traiettorie e i tempi di volo sono diversi, ma non le velocità finali.`},
{id:'fi_en_sf7',t:'fi_en',l:4,q:`Una persona di 80 kg salta da un muretto alto 0,8 m e, atterrando, flette le gambe fermandosi dopo che il suo baricentro si è abbassato di altri 0,4 m (g = 10 m/s²). Supponendo costante la forza totale esercitata dal suolo sulla persona durante l'arresto, quanto vale?`,o:[`2400 N`,`1600 N`,`800 N`,`3200 N`],a:0,e:`Il lavoro della forza del suolo F·d deve compensare tutta l'energia persa: m·g·(h + d) = 80·10·1,2 = 960 J. Quindi F = 960/0,4 = 2400 N, cioè 3 volte il peso. 1600 N dimentica che la persona scende ancora di 0,4 m durante l'arresto (usa solo m·g·h/d); 800 N è il peso; 3200 N non corrisponde a nessun bilancio corretto.`},
{id:'fi_en_sf8',t:'fi_en',l:4,q:`Una lampada a incandescenza da 60 W viene sostituita con una LED da 10 W che dà la stessa luce. La lampada è accesa 5 ore al giorno per 30 giorni e 1 kWh costa 0,30 €. Quanto si risparmia in 30 giorni?`,o:[`2,25 €`,`0,45 €`,`2,70 €`,`22,50 €`],a:0,e:`Ore totali: 5·30 = 150 h. La differenza di potenza è 60 − 10 = 50 W = 0,05 kW, quindi si risparmiano 0,05·150 = 7,5 kWh, pari a 7,5·0,30 = 2,25 €. 0,45 € è il costo della sola LED; 2,70 € il costo della sola incandescente; 22,50 € nasce da un errore di conversione da W a kW.`},
{id:'fi_en_sf9',t:'fi_en',l:4,q:`Un'auto viaggia a velocità costante di 20 m/s su un tratto rettilineo e orizzontale mentre il motore fornisce alle ruote una potenza di 20 kW. Quanto vale la forza totale di resistenza (attrito e aria) che si oppone al moto?`,o:[`1000 N`,`2000 N`,`400000 N`,`100 N`],a:0,e:`A velocità costante la forza motrice uguaglia la resistenza. Dalla relazione P = F·v si ha F = P/v = 20000/20 = 1000 N. 400000 N si ottiene moltiplicando P per v; 2000 N e 100 N sono errori di conversione da kW a W o di divisione.`},
{id:'fi_en_sf10',t:'fi_en',l:4,q:`Una molla di costante k = 500 N/m, compressa di 0,2 m, lancia verticalmente verso l'alto una pallina di 0,1 kg (g = 10 m/s², attrito trascurabile; si trascuri la quota guadagnata durante la decompressione). Che altezza massima raggiunge la pallina rispetto al punto di rilascio?`,o:[`10 m`,`20 m`,`1 m`,`100 m`],a:0,e:`Energia elastica: ½·k·x² = ½·500·0,04 = 10 J. Si trasforma in energia potenziale: m·g·h = 10 J, con m·g = 1 N, da cui h = 10 m. 20 m si ottiene usando k·x² senza il ½; 1 m e 100 m sono errori nei fattori 10 della conversione.`},
{id:'fi_el_sf1',t:'fi_el',l:4,q:`Una batteria da 16 V alimenta un resistore da 5 Ω in serie con il parallelo di due resistori da 4 Ω e 12 Ω. Quanta corrente attraversa il resistore da 4 Ω?`,o:[`1,5 A`,`2 A`,`0,5 A`,`4 A`],a:0,e:`Parallelo: 1/R = 1/4 + 1/12 = 1/3, quindi 3 Ω. Resistenza totale: 5 + 3 = 8 Ω, corrente totale 16/8 = 2 A. Tensione sul parallelo: 2·3 = 6 V, quindi nel resistore da 4 Ω passano 6/4 = 1,5 A. 2 A è la corrente totale; 0,5 A è quella nel resistore da 12 Ω; 4 A applica tutti i 16 V al resistore da 4 Ω, ignorando il resistore da 5 Ω in serie.`},
{id:'fi_el_sf2',t:'fi_el',l:4,q:`Due lampade identiche sono collegate alla stessa batteria ideale, prima in serie e poi in parallelo. Il rapporto tra la potenza totale assorbita nel collegamento in parallelo e quella nel collegamento in serie è…`,o:[`4`,`2`,`1`,`1/4`],a:0,e:`Con R la resistenza di una lampada e V la tensione della batteria: in serie Rtot = 2R e P = V²/(2R); in parallelo Rtot = R/2 e P = V²/(R/2) = 2V²/R. Il rapporto è 2V²/R diviso V²/(2R) = 4. Il rapporto 2 si ha considerando solo la variazione di corrente o solo quella di tensione; 1/4 è il rapporto inverso.`},
{id:'fi_el_sf3',t:'fi_el',l:4,q:`Una persona con resistenza elettrica del corpo di 2300 Ω tocca per errore un conduttore a 230 V verso terra. Supponendo che questa sia la resistenza totale del percorso, quale corrente la attraversa?`,o:[`100 mA`,`10 mA`,`1 A`,`0,1 mA`],a:0,e:`Dalla legge di Ohm I = V/R = 230/2300 = 0,1 A, cioè 100 mA (1 A = 1000 mA). 1 A e 10 mA sono errori di potenza di dieci; 0,1 mA deriva dal confondere 0,1 A con 0,1 mA, un errore di conversione di unità.`},
{id:'fi_el_sf4',t:'fi_el',l:4,q:`Perché in un impianto domestico gli apparecchi (lampade, frigorifero, forno) sono collegati in parallelo alla rete?`,o:[`Ognuno è sottoposto alla stessa tensione e può funzionare indipendentemente dagli altri`,`Così la corrente è la stessa in tutti gli apparecchi`,`Così la resistenza totale dell'impianto è la somma delle resistenze`,`Così la tensione si ripartisce tra gli apparecchi`],a:0,e:`In parallelo i capi di ogni apparecchio sono collegati agli stessi due punti, quindi hanno tutti la tensione di rete; spegnere o guastare un apparecchio non interrompe gli altri rami. In serie invece la corrente sarebbe la stessa, le resistenze si sommerebbero, la tensione si ripartirebbe e un apparecchio guasto spegnerebbe tutto.`},
{id:'fi_el_sf5',t:'fi_el',l:4,q:`A una batteria ideale, già collegata a due resistori in parallelo, si aggiunge un terzo resistore in parallelo agli altri. Che cosa succede?`,o:[`La corrente totale erogata aumenta e quella negli altri resistori non cambia`,`La corrente totale diminuisce e quella negli altri resistori diminuisce`,`La corrente totale aumenta e quella negli altri resistori diminuisce`,`La corrente totale resta uguale e si ripartisce tra tre resistori`],a:0,e:`Aggiungere un ramo in parallelo diminuisce la resistenza equivalente, quindi la corrente totale I = V/Req aumenta. Ogni ramo però è ancora sottoposto alla tensione V della batteria ideale, perciò la corrente in ciascun resistore preesistente (V/R) resta invariata: il terzo resistore fornisce corrente in più.`},
{id:'fi_el_sf6',t:'fi_el',l:4,q:`Il grafico della corrente I in funzione della tensione V per un resistore ohmico è una retta passante per l'origine. Quando V = 12 V, la corrente vale 0,4 A. Qual è la resistenza del resistore?`,o:[`30 Ω`,`0,03 Ω`,`4,8 Ω`,`11,6 Ω`],a:0,e:`Per la legge di Ohm R = V/I = 12/0,4 = 30 Ω; la pendenza del grafico I-V è 1/R = 0,033 A/V. 0,03 Ω è il valore della pendenza scambiato per una resistenza; 4,8 Ω è il prodotto V·I (una potenza in watt); 11,6 Ω è la differenza V − I, priva di significato.`},
{id:'fi_el_sf7',t:'fi_el',l:4,q:`Un filo di rame omogeneo ha resistenza di 8 Ω. Viene tagliato a metà e i due pezzi, uguali, vengono collegati in parallelo. Qual è la resistenza equivalente?`,o:[`2 Ω`,`4 Ω`,`8 Ω`,`16 Ω`],a:0,e:`La resistenza è proporzionale alla lunghezza: ciascun pezzo ha 8/2 = 4 Ω. Due resistori uguali da 4 Ω in parallelo danno 4/2 = 2 Ω. 4 Ω è la resistenza di un solo pezzo; 8 Ω sarebbe il filo originale (pezzi in serie); 16 Ω è un errore di moltiplicazione.`},
{id:'fi_el_sf8',t:'fi_el',l:4,q:`Un impianto a 230 V è protetto da un interruttore automatico che scatta oltre 16 A. Sono già accesi un forno da 2300 W e un ferro da stiro da 1150 W. Quanta potenza al massimo si può ancora collegare senza che l'interruttore scatti?`,o:[`230 W`,`3680 W`,`3450 W`,`1150 W`],a:0,e:`Potenza massima consentita: P = V·I = 230·16 = 3680 W. Già in uso: 2300 + 1150 = 3450 W. Potenza disponibile: 3680 − 3450 = 230 W. 3680 W è il limite totale; 3450 W è la potenza già assorbita; 1150 W aggiungerebbe un secondo ferro da stiro, facendo scattare l'interruttore (4600 W).`},
{id:'fi_el_sf9',t:'fi_el',l:4,q:`Due resistori da 3 Ω e 6 Ω sono collegati in serie a una batteria da 18 V. Quanta energia dissipa il resistore da 6 Ω in 10 s?`,o:[`240 J`,`120 J`,`360 J`,`60 J`],a:0,e:`Resistenza totale 9 Ω, corrente I = 18/9 = 2 A, uguale in entrambi i resistori (serie). Potenza sul resistore da 6 Ω: R·I² = 6·4 = 24 W. Energia in 10 s: 24·10 = 240 J. 120 J è l'energia del resistore da 3 Ω (12 W); 360 J è l'energia totale (36 W); 60 J è semplicemente R·t, senza considerare la corrente.`},
{id:'fi_el_sf10',t:'fi_el',l:4,q:`Due lampadine a incandescenza, una da 40 W e una da 100 W (entrambe progettate per 230 V), vengono collegate in serie a una presa da 230 V. Quale delle due brilla di più?`,o:[`Quella da 40 W, perché ha resistenza maggiore`,`Quella da 100 W, perché ha potenza nominale maggiore`,`Brillano allo stesso modo, perché la corrente è la stessa`,`Nessuna delle due si accende`],a:0,e:`Dalla potenza nominale si ricava R = V²/P: la lampada da 40 W ha resistenza maggiore (circa 1320 Ω contro circa 530 Ω). In serie la corrente è la stessa e la potenza dissipata P = R·I² è maggiore sulla resistenza più grande, quindi la lampada da 40 W brilla di più. Le potenze nominali valgono solo con 230 V ai capi di ciascuna lampada.`},
{id:'fi_gran_sf1',t:'fi_gran',l:4,q:`Il livello di intensità sonora è β = 10 · log₁₀(I / I₀). Un rumore ha livello 50 dB. Un secondo rumore ha un'intensità 1000 volte maggiore. Quale livello ha il secondo rumore?`,o:[`80 dB`,`53 dB`,`150 dB`,`500 dB`],a:0,e:`Il fattore 1000 = 10³ vale log₁₀(1000) = 3, quindi il livello aumenta di 10 · 3 = 30 dB e si passa da 50 dB a 80 dB. Il livello non si moltiplica (500 dB) e non si somma l'intensità in modo lineare (150 dB, 53 dB): la scala è logaritmica, a ogni fattore 10 corrispondono +10 dB.`},
{id:'fi_gran_sf2',t:'fi_gran',l:4,q:`Un macchinario produce da solo un livello sonoro di 60 dB in un punto. Si accende un secondo macchinario identico, così che le intensità si sommano. Con β = 10 · log₁₀(I / I₀) e log₁₀ 2 ≈ 0,3, quale livello si misura?`,o:[`63 dB`,`120 dB`,`66 dB`,`70 dB`],a:0,e:`L'intensità totale raddoppia (I' = 2I). Il livello aumenta di 10 · log₁₀ 2 ≈ 10 · 0,3 = 3 dB, quindi 60 + 3 = 63 dB. I decibel non si sommano come numeri (120 dB) e 70 dB corrisponderebbe a un'intensità decuplicata, non raddoppiata.`},
{id:'fi_gran_sf3',t:'fi_gran',l:4,q:`Un'auto viaggia a velocità costante di 72 km/h. Quanti metri percorre in 3 s?`,o:[`60 m`,`216 m`,`20 m`,`6 m`],a:0,e:`72 km/h = 72 / 3,6 = 20 m/s. In 3 s lo spazio è 20 · 3 = 60 m. Se non si converte si ottiene 72 · 3 = 216 (unità sbagliate), mentre 20 m è solo la distanza in 1 s e 6 m deriva da un errore nel fattore di conversione.`},
{id:'fi_gran_sf4',t:'fi_gran',l:4,q:`Una flebo contiene 300 mL di soluzione e deve essere somministrata in 2 ore. Il deflussore eroga 20 gocce per ogni mL. Quante gocce al minuto si devono contare?`,o:[`50 gocce/min`,`150 gocce/min`,`6000 gocce/min`,`2,5 gocce/min`],a:0,e:`Gocce totali: 300 · 20 = 6000. Il tempo è 2 h = 120 min, quindi 6000 / 120 = 50 gocce al minuto. 6000 sono le gocce totali (non il ritmo), 150 si ottiene dividendo i mL per le ore e 2,5 è la portata in mL/min senza considerare le gocce.`},
{id:'fi_gran_sf5',t:'fi_gran',l:4,q:`Quale combinazione di unità fondamentali del SI equivale al pascal (pressione = forza / superficie)?`,o:[`kg / (m · s²)`,`kg · m / s²`,`kg / (m² · s²)`,`kg · m² / s²`],a:0,e:`Il newton è kg · m / s² e il metro quadro divide per m²: (kg · m / s²) / m² = kg / (m · s²). kg · m / s² è il newton, kg · m² / s² è il joule, kg / (m² · s²) deriva dall'aver diviso la forza per m³ invece che per m².`},
{id:'fi_gran_sf6',t:'fi_gran',l:4,q:`Un cubo omogeneo di lato ℓ ha massa m. Quanto vale la massa di un cubo dello stesso materiale con lato 3ℓ?`,o:[`27 m`,`9 m`,`3 m`,`6 m`],a:0,e:`La densità è la stessa, quindi la massa è proporzionale al volume, che cresce con il cubo del lato: (3ℓ)³ = 27 ℓ³. La massa diventa 27 m. Triplicare il lato non triplica la massa (3 m) e il fattore 9 è quello dell'area delle facce, non del volume.`},
{id:'fi_gran_sf7',t:'fi_gran',l:4,q:`Un'arteria ha sezione circolare con raggio 2 mm. Usando π ≈ 3, quanto vale l'area della sua sezione in m²?`,o:[`1,2 × 10⁻⁵ m²`,`1,2 × 10⁻² m²`,`6 × 10⁻³ m²`,`1,2 × 10⁻⁶ m²`],a:0,e:`2 mm = 2 × 10⁻³ m. L'area è π r² ≈ 3 · (2 × 10⁻³)² = 3 · 4 × 10⁻⁶ = 1,2 × 10⁻⁵ m². 6 × 10⁻³ dimentica il quadrato (è 2π r · 1 mm), mentre 1,2 × 10⁻² e 1,2 × 10⁻⁶ derivano da errori nella conversione mm² → m² (il fattore corretto è 10⁻⁶).`},
{id:'fi_gran_sf8',t:'fi_gran',l:4,q:`Un farmaco va somministrato alla dose di 5 mg per ogni kg di peso corporeo. Un paziente pesa 60 kg e le compresse disponibili contengono 100 mg ciascuna. Quante compresse servono?`,o:[`3 compresse`,`30 compresse`,`300 compresse`,`0,3 compresse`],a:0,e:`Dose totale: 5 mg/kg · 60 kg = 300 mg. Numero di compresse: 300 mg / 100 mg = 3. Dimenticare di dividere per la dose della compressa dà 300, mentre 30 e 0,3 derivano da errori di potenza di dieci.`},
{id:'fi_gran_sf9',t:'fi_gran',l:4,q:`Uno scaldabagno elettrico di potenza 2 kW resta acceso per 30 minuti. Quanta energia assorbe, espressa in joule?`,o:[`3,6 × 10⁶ J`,`3,6 × 10³ J`,`6 × 10⁴ J`,`1 × 10³ J`],a:0,e:`P = 2 kW = 2000 W e t = 30 min = 1800 s. L'energia è E = P · t = 2000 · 1800 = 3,6 × 10⁶ J (corrispondente a 1 kWh). 6 × 10⁴ si ottiene usando 2 · 30 · 1000 senza convertire i minuti, 10³ sbaglia il tempo e 3,6 × 10³ equivale a 1 Wh invece di 1 kWh.`},
{id:'fi_gran_sf10',t:'fi_gran',l:4,q:`Un respiratore eroga aria con una portata di 12 L/min. Quanto vale la portata in unità del SI (m³/s)?`,o:[`2 × 10⁻⁴ m³/s`,`2 × 10⁻¹ m³/s`,`2 × 10⁻³ m³/s`,`1,2 × 10⁻² m³/s`],a:0,e:`12 L = 12 × 10⁻³ m³ e 1 min = 60 s, quindi Q = 12 × 10⁻³ / 60 = 2 × 10⁻⁴ m³/s. Se non si converte il volume (L → m³) si sbaglia di 10³ (2 × 10⁻¹), se si dimentica di dividere per 60 si ottiene 1,2 × 10⁻² e dimenticando altre potenze 2 × 10⁻³.`},
{id:'fi_vet_sf1',t:'fi_vet',l:4,q:`Due funi tirano un carrello, ciascuna con una forza di 100 N, e ognuna forma un angolo di 60° con la direzione di avanzamento (una a destra e una a sinistra di essa). Con cos 60° = 0,5 e sin 60° ≈ 0,87, quanto vale la forza risultante?`,o:[`100 N, nella direzione di avanzamento`,`200 N, nella direzione di avanzamento`,`50 N, nella direzione di avanzamento`,`174 N, nella direzione di avanzamento`],a:0,e:`Le componenti perpendicolari alla direzione di avanzamento si annullano per simmetria. Quelle lungo l'avanzamento valgono ciascuna 100 · cos 60° = 50 N, quindi la risultante è 2 · 50 = 100 N. 200 N sarebbe la somma dei moduli (angolo nullo), 50 N dimentica una fune e 174 N usa il seno al posto del coseno.`},
{id:'fi_vet_sf2',t:'fi_vet',l:4,q:`Una barca si muove a 4 m/s rispetto all'acqua con la prua sempre perpendicolare alle rive di un fiume largo 120 m. La corrente scorre parallela alle rive a 3 m/s. A quale distanza a valle dal punto di partenza (misurata lungo la riva) approda?`,o:[`90 m`,`120 m`,`30 m`,`150 m`],a:0,e:`Le due componenti del moto sono indipendenti: la traversata richiede t = 120 / 4 = 30 s. In questo tempo la corrente sposta la barca di 3 · 30 = 90 m lungo la riva. 120 m è la larghezza del fiume, 30 s è il tempo e 150 m è la lunghezza del percorso effettivo (ipotenusa), non lo spostamento lungo la riva.`},
{id:'fi_vet_sf3',t:'fi_vet',l:4,q:`Due vettori a e b hanno moduli 8 e 6. Quale tra i seguenti valori NON può essere il modulo del vettore somma a + b?`,o:[`15`,`2`,`10`,`14`],a:0,e:`Il modulo della somma è compreso tra |8 − 6| = 2 (vettori paralleli e opposti) e 8 + 6 = 14 (paralleli e concordi). Tutti i valori nell'intervallo [2; 14] sono possibili, compreso 10 (vettori perpendicolari), mentre 15 supera il massimo di 14.`},
{id:'fi_vet_sf4',t:'fi_vet',l:4,q:`Siano a = (5, −2) e b = (−1, 5) due vettori nel piano. Quanto vale il modulo di a + b?`,o:[`5`,`7`,`25`,`1`],a:0,e:`La somma si fa per componenti: (5 − 1, −2 + 5) = (4, 3). Il modulo è √(4² + 3²) = √25 = 5. 7 si ottiene sommando le componenti 4 + 3 senza usare Pitagora, 25 dimentica la radice quadrata e 1 deriva da un errore di segno nel sommare le componenti.`},
{id:'fi_vet_sf5',t:'fi_vet',l:4,q:`Una cassa di peso 200 N è ferma su un piano inclinato di 30° rispetto all'orizzontale (sin 30° = 0,5 e cos 30° ≈ 0,87). Quanto vale la forza di attrito statico che la tiene ferma?`,o:[`100 N`,`200 N`,`174 N`,`0 N`],a:0,e:`La cassa è in equilibrio, quindi l'attrito bilancia la componente del peso parallela al piano: P · sin 30° = 200 · 0,5 = 100 N. 174 N è la componente perpendicolare al piano (con il coseno), 200 N è l'intero peso e 0 N è escluso perché senza attrito la cassa scivolerebbe.`},
{id:'fi_vet_sf6',t:'fi_vet',l:4,q:`Un'auto percorre una curva a velocità di modulo costante pari a 20 m/s. Quale affermazione è corretta?`,o:[`La velocità cambia (direzione), quindi l'accelerazione non è nulla`,`La velocità è costante, quindi l'accelerazione è nulla`,`L'accelerazione è nulla perché il modulo non cambia`,`Il vettore velocità è costante perché non cambia la rapidità`],a:0,e:`La velocità è un vettore: anche se il modulo è costante, la direzione cambia lungo la curva. Poiché l'accelerazione è la variazione del vettore velocità nel tempo, essa non è nulla (è diretta verso il centro della curva). Le altre risposte confondono la velocità vettoriale con il solo modulo.`},
{id:'fi_vet_sf7',t:'fi_vet',l:4,q:`Due forze di moduli 6 N e 8 N agiscono sullo stesso punto. Quale angolo tra le loro direzioni produce una risultante di modulo 10 N?`,o:[`90°`,`0°`,`180°`,`45°`],a:0,e:`Poiché 6² + 8² = 36 + 64 = 100 = 10², la risultante vale 10 N se le forze sono perpendicolari (teorema di Pitagora). Con 0° si avrebbe 14 N, con 180° si avrebbe 2 N, mentre a 45° il modulo sarebbe circa 13 N.`},
{id:'fi_vet_sf8',t:'fi_vet',l:4,q:`Un escursionista cammina 6 km verso est, poi 8 km verso nord e infine 6 km verso ovest. Quanto vale il modulo del suo spostamento totale rispetto al punto di partenza?`,o:[`8 km`,`20 km`,`10 km`,`6 km`],a:0,e:`Gli spostamenti verso est e verso ovest (6 km ciascuno) si annullano, resta solo quello verso nord: 8 km. 20 km è la lunghezza del percorso (grandezza scalare diversa dallo spostamento), 10 km si otterrebbe con i soli primi due tratti (6 e 8 perpendicolari) e 6 km è la componente est-ovest di un singolo tratto.`},
{id:'fi_vet_sf9',t:'fi_vet',l:4,q:`Un nuotatore percorre una piscina lunga 50 m all'andata e subito al ritorno, tornando al punto di partenza in 100 s in totale. Quali sono la velocità vettoriale media e la velocità scalare media (rapidità media) nell'intero percorso?`,o:[`0 m/s e 1 m/s`,`1 m/s e 1 m/s`,`0 m/s e 0 m/s`,`1 m/s e 0 m/s`],a:0,e:`Lo spostamento totale è nullo (punto di partenza = punto di arrivo), quindi la velocità vettoriale media è 0. La distanza percorsa è 100 m in 100 s, dunque la rapidità media è 100 / 100 = 1 m/s. Le altre opzioni scambiano o confondono spostamento e distanza percorsa.`},
{id:'fi_vet_sf10',t:'fi_vet',l:4,q:`Un lampione di peso 100 N è sospeso con due cavi uguali e simmetrici, ciascuno inclinato di 30° rispetto all'orizzontale (sin 30° = 0,5 e cos 30° ≈ 0,87). Quanto vale la tensione di ciascun cavo?`,o:[`100 N`,`50 N`,`200 N`,`87 N`],a:0,e:`In equilibrio la somma delle componenti verticali eguaglia il peso: 2 · T · sin 30° = 100, quindi T · 1 = 100 e T = 100 N. 50 N è la componente verticale di un solo cavo, 200 N dimentica che i cavi sono due e 87 N usa il coseno al posto del seno.`},
{id:'fi_flu_sf1',t:'fi_flu',l:4,q:`Una zattera a forma di parallelepipedo, fatta di tronchi con densità media 750 kg/m³ e spessore 40 cm, galleggia in acqua dolce (densità 1000 kg/m³). Quale altezza della zattera è immersa?`,o:[`30 cm`,`10 cm`,`40 cm`,`75 cm`],a:0,e:`All'equilibrio il peso eguaglia la spinta di Archimede: d_zattera · V = d_acqua · V_immerso. A parità di base, h_immersa = (750 / 1000) · 40 cm = 30 cm. 40 cm significherebbe zattera completamente immersa, 10 cm è l'altezza emersa (il restante 25%) e 75 cm confonde la densità con una lunghezza.`},
{id:'fi_flu_sf2',t:'fi_flu',l:4,q:`Una zattera ha base di area 4 m² e galleggia in acqua dolce (densità 1000 kg/m³). Una persona di 80 kg sale sulla zattera, che resta a galla con i lati verticali. Di quanto affonda in più la zattera?`,o:[`2 cm`,`20 cm`,`2 m`,`8 cm`],a:0,e:`La spinta di Archimede deve aumentare di un peso pari a quello della persona, cioè deve spostare 80 kg di acqua in più: volume = 80 / 1000 = 0,08 m³. Con base 4 m², l'altezza in più è 0,08 / 4 = 0,02 m = 2 cm. 20 cm e 2 m sono errori di conversione, mentre 8 cm si ottiene dimenticando di dividere il volume per l'area (0,08 m = 8 cm).`},
{id:'fi_flu_sf3',t:'fi_flu',l:4,q:`Una sacca per flebo è appesa 1,36 m sopra il punto in cui l'ago entra nella vena. Considerando la soluzione come acqua (densità 1000 kg/m³), a quanti mmHg equivale la pressione idrostatica della colonna di liquido? (1 mmHg corrisponde a una colonna di 1 mm di mercurio, densità del mercurio 13600 kg/m³)`,o:[`100 mmHg`,`10 mmHg`,`136 mmHg`,`1360 mmHg`],a:0,e:`A parità di pressione, le altezze sono inversamente proporzionali alle densità: h_Hg = 1,36 m · 1000 / 13600 = 0,1 m = 100 mm, quindi 100 mmHg. 1360 mmHg è l'altezza in mm di acqua, non di mercurio (manca il rapporto delle densità), mentre 136 e 10 mmHg derivano da errori di potenza di dieci.`},
{id:'fi_flu_sf4',t:'fi_flu',l:4,q:`Con lo sfigmomanometro il bracciale va tenuto all'altezza del cuore. Che cosa accade al valore misurato se il braccio è tenuto sollevato sopra il livello del cuore?`,o:[`Risulta più basso, perché sopra il cuore la pressione idrostatica ρ g h del sangue è minore`,`Resta uguale, perché la pressione del sangue non dipende dalla quota`,`Risulta più alto, perché sopra il cuore la pressione idrostatica ρ g h del sangue è maggiore`,`Resta uguale, perché dipende solo dalla frequenza cardiaca`],a:0,e:`Il sangue si comporta come un liquido in quiete rispetto alla componente idrostatica: la pressione varia di ρ g Δh con la quota rispetto al cuore. In un punto più in alto la pressione è minore (valore sottostimato), in un punto più in basso è maggiore (valore sovrastimato). Per questo si misura a livello del cuore.`},
{id:'fi_flu_sf5',t:'fi_flu',l:4,q:`Una placca restringe un'arteria in modo che il raggio nel tratto stenotico sia la metà di quello normale. Se la portata del sangue (liquido incomprimibile) resta costante, come cambia la velocità media del sangue nel restringimento?`,o:[`Quadruplica`,`Raddoppia`,`Si dimezza`,`Aumenta di 8 volte`],a:0,e:`Per l'equazione di continuità A · v = costante. L'area è proporzionale al quadrato del raggio: con raggio dimezzato l'area diventa 1/4, quindi la velocità diventa 4 volte maggiore. Il raddoppio dimentica il quadrato, mentre 8 volte sarebbe il fattore se l'area dipendesse da r³.`},
{id:'fi_flu_sf6',t:'fi_flu',l:4,q:`Un cuore pompa 6 L di sangue al minuto attraverso un'aorta che, per semplicità, supponiamo con sezione di 5 cm². Quanto vale la velocità media del sangue nell'aorta?`,o:[`0,2 m/s`,`20 m/s`,`0,002 m/s`,`2 m/s`],a:0,e:`Portata Q = 6 L/min = 6 × 10⁻³ m³ / 60 s = 10⁻⁴ m³/s. Sezione A = 5 cm² = 5 × 10⁻⁴ m². Velocità v = Q / A = 10⁻⁴ / (5 × 10⁻⁴) = 0,2 m/s. Gli altri valori derivano da errori nella conversione cm² → m² (10⁻² al posto di 10⁻⁴ dà 0,002) o dei litri.`},
{id:'fi_flu_sf7',t:'fi_flu',l:4,q:`Una persona di massa 60 kg si regge su un solo tacco a spillo, la cui superficie di appoggio è 1 cm² (g = 10 m/s²). Quale pressione esercita sul pavimento?`,o:[`6 × 10⁶ Pa`,`6 × 10⁵ Pa`,`6 × 10⁴ Pa`,`6 × 10² Pa`],a:0,e:`Il peso è F = 60 · 10 = 600 N. L'area è 1 cm² = 10⁻⁴ m². La pressione è p = F / A = 600 / 10⁻⁴ = 6 × 10⁶ Pa, cioè circa 60 volte la pressione atmosferica. 6 × 10² Pa è la sola forza senza dividere per l'area, mentre 6 × 10⁵ e 6 × 10⁴ derivano da conversioni sbagliate cm² → m².`},
{id:'fi_flu_sf8',t:'fi_flu',l:4,q:`Un subacqueo inspira 6 L di aria in superficie (pressione atmosferica 1 × 10⁵ Pa) e scende a 30 m di profondità in acqua (densità 1000 kg/m³, g = 10 m/s²), trattenendo il respiro a temperatura costante. Quale volume occupa l'aria nei polmoni (legge di Boyle)?`,o:[`1,5 L`,`2 L`,`3 L`,`18 L`],a:0,e:`A 30 m la pressione assoluta è 10⁵ + 1000 · 10 · 30 = 4 × 10⁵ Pa, cioè 4 volte quella in superficie. Con T costante p V = costante, quindi V = 6 / 4 = 1,5 L. 2 L usa la sola pressione idrostatica (3 atm) senza aggiungere quella atmosferica, 18 L moltiplica invece di dividere e 3 L usa un rapporto di pressioni 2.`},
{id:'fi_flu_sf9',t:'fi_flu',l:4,q:`Un cubetto di ghiaccio galleggia in un bicchiere pieno d'acqua dolce fino all'orlo. Quando il ghiaccio fonde completamente, che cosa accade al livello dell'acqua nel bicchiere?`,o:[`Non cambia, e l'acqua non trabocca`,`Sale e l'acqua trabocca`,`Scende leggermente`,`Sale solo se l'acqua è molto fredda`],a:0,e:`Il ghiaccio galleggia, quindi la spinta di Archimede eguaglia il suo peso: sposta una massa d'acqua pari alla propria massa. Fondendo, la stessa massa di acqua occupa esattamente il volume spostato prima, perciò il livello resta invariato. La parte di ghiaccio che emerge corrisponde esattamente alla differenza tra il volume del ghiaccio e quello dell'acqua di fusione, quindi non cambia nulla.`},
{id:'fi_flu_sf10',t:'fi_flu',l:4,q:`Una nave carica passa dal mare (densità circa 1025 kg/m³) alla foce di un fiume con acqua dolce (densità 1000 kg/m³). Che cosa accade?`,o:[`La spinta di Archimede resta uguale al peso e la nave si immerge di più`,`La spinta di Archimede aumenta e la nave si solleva`,`La spinta di Archimede resta uguale al peso e la nave si immerge di meno`,`La spinta di Archimede diminuisce e la nave si immerge di più`],a:0,e:`Finché galleggia, la spinta eguaglia il peso della nave, che non cambia: d · V_immerso · g = peso. Poiché la densità dell'acqua dolce è minore, serve un volume immerso maggiore, quindi la nave affonda un po' di più (il livello di carico è per questo diverso in acqua dolce e salata).`},
{id:'fi_cal_sf1',t:'fi_cal',l:4,q:`Durante un'attività fisica evaporano 50 g di sudore. Per l'evaporazione servono circa 2,4 × 10⁶ J per ogni kg di acqua. Se questo calore venisse sottratto interamente a una persona di 60 kg con calore specifico medio 4000 J/(kg · K), di quanto si abbasserebbe la temperatura corporea?`,o:[`0,5 K`,`5 K`,`0,05 K`,`2 K`],a:0,e:`Calore sottratto: Q = 0,05 kg · 2,4 × 10⁶ J/kg = 1,2 × 10⁵ J. Variazione di temperatura: ΔT = Q / (m c) = 1,2 × 10⁵ / (60 · 4000) = 0,5 K. 5 K e 0,05 K derivano da errori di potenza di dieci (per esempio 0,5 kg o 5 g invece di 50 g), mentre 2 K corrisponde a una massa di 15 kg.`},
{id:'fi_cal_sf2',t:'fi_cal',l:4,q:`Perché la sudorazione contribuisce a raffreddare il corpo?`,o:[`Perché per evaporare il sudore assorbe calore latente di vaporizzazione dalla pelle, che si raffredda`,`Perché il sudore, essendo più freddo della pelle, assorbe calore per conduzione e lo cede all'aria`,`Perché durante l'evaporazione il sudore cede calore alla pelle, che si raffredda per irraggiamento`,`Perché il sudore aumenta la capacità termica della pelle senza scambiare calore con l'ambiente`],a:0,e:`Il passaggio da liquido a vapore richiede energia (calore latente di vaporizzazione, circa 2,4 × 10⁶ J/kg). Questa energia viene sottratta alla pelle e al corpo, che si raffreddano. Il fenomeno non dipende da un sudore più freddo né da un cedimento di calore alla pelle.`},
{id:'fi_cal_sf3',t:'fi_cal',l:4,q:`Un blocco metallico di 0,2 kg viene portato a 100 °C e immerso in 0,4 kg di acqua a 20 °C (calore specifico 4200 J/(kg · K)) contenuta in un recipiente isolato. L'equilibrio termico si raggiunge a 25 °C. Quanto vale il calore specifico del metallo? Trascura la capacità termica del recipiente.`,o:[`560 J/(kg · K)`,`525 J/(kg · K)`,`280 J/(kg · K)`,`112 J/(kg · K)`],a:0,e:`L'acqua assorbe Q = 0,4 · 4200 · (25 − 20) = 8400 J. Il metallo cede lo stesso calore con ΔT = 100 − 25 = 75 K: c = 8400 / (0,2 · 75) = 560 J/(kg · K). 525 usa ΔT = 80 K (temperatura iniziale dell'acqua), 280 usa la massa dell'acqua al posto di quella del metallo e 112 dimentica la massa.`},
{id:'fi_cal_sf4',t:'fi_cal',l:4,q:`Un bollitore elettrico da 2 kW scalda 1 kg di acqua da 20 °C a 100 °C. Supponendo che tutta l'energia vada all'acqua e c = 4200 J/(kg · K), quanto tempo serve?`,o:[`168 s`,`84 s`,`336 s`,`168 000 s`],a:0,e:`Calore necessario: Q = m c ΔT = 1 · 4200 · 80 = 336 000 J. Potenza 2 kW = 2000 W, quindi t = Q / P = 336 000 / 2000 = 168 s. 84 s corrisponde a ΔT = 40 K, 336 s a una potenza di 1 kW e 168 000 s si ottiene non convertendo i kW in watt.`},
{id:'fi_cal_sf5',t:'fi_cal',l:4,q:`La pressione di un pneumatico è 2,0 bar a 27 °C. Dopo un lungo viaggio la temperatura dell'aria interna sale a 57 °C. Considerando il volume costante e l'aria un gas ideale, quanto vale la pressione (circa)?`,o:[`2,2 bar`,`4,2 bar`,`1,8 bar`,`2,0 bar`],a:0,e:`A volume costante p / T è costante, con T in kelvin: 27 °C = 300 K e 57 °C = 330 K. p' = 2,0 · 330 / 300 = 2,2 bar. 4,2 bar si ottiene usando i °C (57 / 27), 1,8 bar inverte il rapporto delle temperature e 2,0 bar ignora la variazione.`},
{id:'fi_cal_sf6',t:'fi_cal',l:4,q:`Un gas ideale si espande a pressione costante di 1 × 10⁵ Pa, aumentando il suo volume di 2 L, mentre assorbe 500 J di calore. Quanto vale la variazione di energia interna del gas? (1 L = 10⁻³ m³)`,o:[`+300 J`,`+700 J`,`+500 J`,`+200 J`],a:0,e:`Il lavoro compiuto dal gas è W = p ΔV = 1 × 10⁵ · 2 × 10⁻³ = 200 J. Per il primo principio ΔU = Q − W = 500 − 200 = +300 J. +700 J somma lavoro e calore, +500 J ignora il lavoro, +200 J è il solo lavoro.`},
{id:'fi_cal_sf7',t:'fi_cal',l:4,q:`Con una pompa da bicicletta si comprime rapidamente l'aria nel cilindro, così che gli scambi di calore con l'esterno siano trascurabili (trasformazione adiabatica). Che cosa accade alla temperatura dell'aria?`,o:[`Aumenta, perché il lavoro compiuto sul gas ne aumenta l'energia interna (Q = 0)`,`Resta costante, perché senza scambio di calore l'energia interna non cambia`,`Diminuisce, perché il gas compresso cede calore all'ambiente`,`Aumenta, perché il gas assorbe calore dall'ambiente`],a:0,e:`Per il primo principio ΔU = Q − W. In una compressione adiabatica Q = 0 e il lavoro W del gas è negativo (viene compiuto lavoro sul gas), quindi ΔU > 0 e la temperatura sale. È ciò che si avverte toccando il corpo della pompa. Le altre risposte ammettono scambi di calore che per ipotesi non ci sono o ignorano il lavoro.`},
{id:'fi_cal_sf8',t:'fi_cal',l:4,q:`Una macchina termica reversibile (ciclo di Carnot) lavora tra una sorgente calda a 500 K e una fredda a 400 K e compie un lavoro di 200 J per ciclo. Quanto calore cede alla sorgente fredda in un ciclo?`,o:[`800 J`,`200 J`,`1000 J`,`300 J`],a:0,e:`Il rendimento è η = 1 − T_f / T_c = 1 − 400 / 500 = 0,2. Il calore assorbito è Q_c = L / η = 200 / 0,2 = 1000 J. Il calore ceduto è Q_f = Q_c − L = 1000 − 200 = 800 J. 1000 J è il calore assorbito, 200 J è il lavoro e 300 J deriva da un rendimento errato η = 0,4 (1 − 300/500).`},
