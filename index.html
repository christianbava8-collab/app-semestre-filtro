{id:"fl6_015",t:"fl6",p:"6.3",l:2,q:"Dove si applica la spinta di Archimede?",o:["Nel baricentro del fluido spostato (centro di spinta)","Nel baricentro del corpo","Sulla superficie inferiore del corpo","Nel punto più profondo del fluido"],a:0,e:"I due punti possono non coincidere se il corpo non è omogeneo (es. un martello con il manico di legno)."},
{id:"fl6_016",t:"fl6",p:"6.3",l:3,q:"Un cubo ha densità relativa all'acqua 2/3. Quale frazione del suo volume resta immersa?",o:["2/3","1/3","3/2","Tutto"],a:0,e:"ρf·Vimmerso = ρc·Vcorpo ⇒ Vimmerso/Vcorpo = ρc/ρf = 2/3."},
{id:"fl6_017",t:"fl6",p:"6.3",l:3,q:"Un corpo di 300 dm³ galleggia sull'acqua e ne emergono 60 dm³. Quanto vale la sua densità?",o:["0,8 kg/dm³","0,2 kg/dm³","1,25 kg/dm³","0,6 kg/dm³"],a:0,e:"È immerso per 240/300 = 8/10 del volume, quindi la sua densità è 0,8 volte quella dell'acqua: 0,8 kg/dm³."},
{id:"fl6_018",t:"fl6",p:"6.3",l:3,q:"Quando l'equilibrio di un corpo che galleggia è stabile?",o:["Quando il baricentro del corpo è sotto il centro di spinta","Quando il baricentro è sopra il centro di spinta","Quando i due punti coincidono sempre","Mai"],a:0,e:"Se la barca si inclina, peso e spinta formano una coppia che la riporta in equilibrio solo se il baricentro sta sotto il centro di spinta."},
{id:"fl6_019",t:"fl6",p:"6.4.3",l:1,q:"Un fiume si restringe. Che cosa succede alla velocità dell'acqua?",o:["Aumenta","Diminuisce","Resta uguale","Si annulla"],a:0,e:"Equazione di continuità: S·v = costante. Se la sezione diminuisce, la velocità aumenta: l'acqua è più tumultuosa."},
{id:"fl6_020",t:"fl6",p:"6.4.3",l:2,q:"Un condotto passa da una sezione di 4 cm² a una di 1 cm². Se la velocità era 2 m/s, quale diventa?",o:["8 m/s","0,5 m/s","2 m/s","4 m/s"],a:0,e:"S₁v₁ = S₂v₂ ⇒ v₂ = 4 · 2 / 1 = 8 m/s."},
{id:"fl6_021",t:"fl6",p:"6.4.2",l:2,q:"Con quale velocità esce l'acqua da un foro praticato 5 m sotto la superficie (g = 10 m/s², fluido ideale)?",o:["10 m/s","50 m/s","5 m/s","100 m/s"],a:0,e:"Torricelli: v = √(2gh) = √100 = 10 m/s, come un corpo in caduta libera da 5 m."},
{id:"fl6_022",t:"fl6",p:"6.4.4",l:2,q:"Che cosa afferma il principio di Venturi?",o:["Dove la sezione diminuisce la velocità aumenta e la pressione diminuisce","Dove la sezione diminuisce la pressione aumenta","La pressione è la stessa in tutto il condotto","La velocità non dipende dalla sezione"],a:0,e:"È una conseguenza dell'equazione di continuità (velocità) e del teorema di Bernoulli (pressione), a parità di altezza."},
{id:"fl6_023",t:"fl6",p:"6.4.4",l:3,q:"Che cosa si conserva lungo un condotto secondo il teorema di Bernoulli?",o:["La somma P + ρgh + ½ρv²","Solo la pressione","Solo la velocità","Il prodotto P·v"],a:0,e:"La somma di altezza piezometrica, geometrica e cinetica è costante."},
{id:"fl6_024",t:"fl6",p:"6.4.1",l:3,q:"In regime stazionario, la velocità del fluido…",o:["in un dato punto non cambia nel tempo, ma può essere diversa da punto a punto","è uguale in tutti i punti","cambia nel tempo in ogni punto","è sempre nulla"],a:0,e:"Stazionario = costante nel tempo in ogni punto. Uniforme = uguale in tutti i punti."},
{id:"fl6_025",t:"fl6",p:"6.5",l:1,q:"Che cos'è la viscosità?",o:["L'attrito interno di un fluido","La densità di un fluido","La pressione di un fluido","La velocità di un fluido"],a:0,e:"È la resistenza al flusso: più un fluido è viscoso, più si oppone al moto dei corpi immersi."},
{id:"fl6_026",t:"fl6",p:"6.5.1",l:2,q:"Quale formula esprime la legge di Stokes?",o:["F = 6πηrv","F = ρgV","F = ηv/r","F = 8ηL/πr⁴"],a:0,e:"Vale per sferette piccole che si muovono lentamente (flusso laminare)."},
{id:"fl6_027",t:"fl6",p:"6.5.4",l:2,q:"Un flusso ha numero di Reynolds 1500. Com'è?",o:["Laminare","Turbolento","In transizione","Impossibile dirlo"],a:0,e:"Re < 2000: laminare; 2000–4000: transizione; > 4000: turbolento."},
{id:"fl6_028",t:"fl6",p:"6.5.2",l:2,q:"Perché un liquido reale che scorre in un condotto a sezione costante perde pressione?",o:["Per la viscosità (perdita di carico)","Perché accelera","Perché la sezione si allarga","Per la tensione superficiale"],a:0,e:"Per la sola continuità velocità e pressione resterebbero costanti; la viscosità invece fa calare la pressione nel senso del moto."},
{id:"fl6_029",t:"fl6",p:"6.5.5",l:3,q:"Secondo Poiseuille, se il raggio di un vaso si dimezza (tutto il resto uguale), la portata…",o:["diventa 1/16","si dimezza","diventa 1/4","diventa 1/8"],a:0,e:"Q è proporzionale a r⁴: (1/2)⁴ = 1/16."},
{id:"fl6_030",t:"fl6",p:"6.5.3",l:3,q:"Il moto turbolento compare tipicamente con…",o:["velocità elevate, fluidi poco viscosi o ostacoli","velocità basse e fluidi molto viscosi","fluidi fermi","condotti molto stretti e flusso lento"],a:0,e:"Il regime laminare è tipico di basse velocità e fluidi viscosi. Una stenosi può rendere turbolento il flusso del sangue, udibile come soffio."},
{id:"fl6_031",t:"fl6",p:"6.5.1",l:3,q:"Quando un corpo che cade in un fluido raggiunge la velocità limite?",o:["Quando peso, attrito viscoso e spinta di Archimede si bilanciano","Subito, appena entra nel fluido","Mai","Quando tocca il fondo"],a:0,e:"Da quel momento la risultante è nulla e il corpo cade a velocità costante."},
{id:"fl6_032",t:"fl6",p:"6.6.2",l:1,q:"Che cosa rappresenta l'ematocrito?",o:["Il rapporto tra volume dei globuli rossi e volume totale del sangue","La quantità di emoglobina","La velocità di sedimentazione","Il numero di globuli bianchi"],a:0,e:"Poiché i globuli rossi dominano la parte corpuscolare, HCT ≈ volume dei globuli rossi / volume totale."},
{id:"fl6_033",t:"fl6",p:"6.6.3",l:2,q:"Qual è il valore tipico della VES in un paziente sano?",o:["0–20 mm/h","20–100 mm/h","Oltre 100 mm/h","200–300 mm/h"],a:0,e:"20–100 mm/h si trova con infiammazioni, gravidanza o anemia; oltre 100 mm/h con infiammazioni gravi o neoplasie."},
{id:"fl6_034",t:"fl6",p:"6.6.4",l:2,q:"Quale valvola attraversa il sangue passando dall'atrio sinistro al ventricolo sinistro?",o:["La mitrale","La tricuspide","L'aortica","La polmonare"],a:0,e:"Atrio sinistro → mitrale → ventricolo sinistro → aortica → aorta. A destra: tricuspide e polmonare."},
{id:"fl6_035",t:"fl6",p:"6.6.4",l:2,q:"Una frequenza cardiaca di 75 bpm a quanti hertz corrisponde?",o:["1,25 Hz","75 Hz","0,8 Hz","4500 Hz"],a:0,e:"Si divide per 60: 75/60 = 1,25 battiti al secondo."},
{id:"fl6_036",t:"fl6",p:"6.6.4",l:3,q:"Secondo la formula di Astrand, qual è la frequenza cardiaca massima di un uomo di 40 anni?",o:["180 bpm","186 bpm","200 bpm","160 bpm"],a:0,e:"Uomini: 220 − età = 180 bpm. Per le donne il libro riporta 226 − età."},
{id:"fl6_037",t:"fl6",p:"6.6.4",l:3,q:"In caso di ipertensione, che cosa succede all'area della curva pressione-volume del ventricolo?",o:["Aumenta: il cuore compie più lavoro per ciclo","Diminuisce","Resta uguale","Si annulla"],a:0,e:"Il cuore lavora contro una pressione maggiore. Nell'insufficienza cardiaca invece l'area si riduce."},
{id:"fl6_038",t:"fl6",p:"6.4.4",l:4,q:"In un condotto orizzontale con una strozzatura, dove è minore la pressione del fluido?",o:["Nella strozzatura","Nella parte larga","È uguale ovunque","All'uscita"],a:0,e:"Nella strozzatura la velocità è maggiore (continuità) e quindi la pressione è minore (Bernoulli): effetto Venturi."},
{id:"fl6_039",t:"fl6",p:"6.5.4",l:4,q:"Sangue con ρ = 1050 kg/m³ e η = 4·10⁻³ Pa·s scorre a 0,5 m/s in un'arteria di 4 mm di diametro. Il flusso è…",o:["laminare (Re ≈ 525)","turbolento (Re ≈ 5250)","in transizione (Re ≈ 3000)","laminare (Re ≈ 52)"],a:0,e:"Re = ρvd/η = 1050 · 0,5 · 0,004 / 0,004 = 525 < 2000."},
{id:"fl6_040",t:"fl6",p:"6.3",l:4,q:"Un cubo di legno con densità 600 kg/m³ galleggia in acqua. Quale percentuale del suo volume emerge?",o:["40%","60%","6%","94%"],a:0,e:"La parte immersa è ρc/ρf = 0,6 = 60%, quindi emerge il 40%."},
{id:"fl6_041",t:"fl6",p:"6.2",l:4,q:"Qual è la pressione idrostatica a 2 m di profondità in acqua (ρ = 1000 kg/m³, g = 10 m/s²)?",o:["2·10⁴ Pa","2·10³ Pa","2·10⁵ Pa","20 Pa"],a:0,e:"P = ρgh = 1000 · 10 · 2 = 20.000 Pa = 2·10⁴ Pa."},
{id:"fl6_042",t:"fl6",p:"6.6.4",l:4,q:"Quanto vale circa la potenza totale del cuore umano a riposo, secondo il libro?",o:["Tra 1,5 e 2,5 W","Circa 100 W","Circa 0,01 W","Tra 15 e 25 W"],a:0,e:"Circa 1,1 J per battito dal ventricolo sinistro, per circa 1,25 battiti al secondo, più il contributo del ventricolo destro: 1,5–2,5 W."},
{id:"fl6_043",t:"fl6",p:"6.1",l:2,q:"Le forze di pressione su un corpo immerso in un fluido sono…",o:["perpendicolari alle superfici del corpo, comunque siano orientate","sempre verticali","sempre parallele alle superfici","dirette solo verso il basso"],a:0,e:"In un fluido la pressione si trasmette in tutti i punti e in tutte le direzioni e agisce perpendicolarmente alle superfici."},
{id:"fl6_044",t:"fl6",p:"6.1.1",l:2,q:"Un fluido a pressione costante di 10⁵ Pa si espande di 2 L. Quanto lavoro compie?",o:["200 J","2·10⁵ J","20 J","0,2 J"],a:0,e:"L = P·ΔV = 10⁵ Pa · 2·10⁻³ m³ = 200 J."},
{id:"fl6_045",t:"fl6",p:"6.1.2",l:3,q:"Per un vaso sanguigno (cilindro sottile), se la pressione resta uguale e il raggio raddoppia, la tensione della parete…",o:["raddoppia","si dimezza","quadruplica","resta uguale"],a:0,e:"ΔP = T/r ⇒ T = ΔP·r: è proporzionale al raggio."},
{id:"fl6_046",t:"fl6",p:"6.4.1",l:1,q:"Che cosa associa a ogni punto del fluido il campo delle velocità?",o:["La velocità istantanea del fluido in quel punto","La pressione del fluido","La densità del fluido","La temperatura"],a:0,e:"È un campo vettoriale: in ogni punto c'è un vettore con direzione e intensità del moto del fluido."},
{id:"fl6_047",t:"fl6",p:"6.4.1",l:2,q:"In un campo di velocità uniforme…",o:["la velocità è uguale in tutti i punti, ma può variare nel tempo","la velocità è costante nel tempo ma varia da punto a punto","la velocità è sempre nulla","la pressione è uguale ovunque"],a:0,e:"Uniforme = uguale ovunque; stazionario = costante nel tempo in ogni punto; uniforme e stazionario = entrambe le cose."},
{id:"fl6_048",t:"fl6",p:"6.4.2",l:1,q:"Che cosa afferma il teorema di Torricelli?",o:["La velocità di efflusso da un foro a profondità h è √(2gh)","La pressione aumenta con la profondità","La portata è costante","Il fluido esce sempre a 1 m/s"],a:0,e:"È la stessa velocità di un corpo che cade liberamente da un'altezza h."},
{id:"fl6_049",t:"fl6",p:"6.4.2",l:2,q:"Se la profondità del foro quadruplica, la velocità di efflusso…",o:["raddoppia","quadruplica","resta uguale","si dimezza"],a:0,e:"v = √(2gh): √4 = 2."},
{id:"fl6_050",t:"fl6",p:"6.4.3",l:2,q:"Come si calcola la portata volumica di un condotto?",o:["Q = S·v","Q = S/v","Q = P·v","Q = ρ·v"],a:0,e:"È il volume di fluido che attraversa una sezione nell'unità di tempo. Per un fluido incomprimibile è costante lungo il condotto: S₁v₁ = S₂v₂."},
{id:"fl6_051",t:"fl6",p:"6.5",l:1,q:"Che cosa distingue un fluido reale da un fluido ideale?",o:["La presenza di un attrito interno (viscosità)","La presenza di peso","La compressibilità","Il colore"],a:0,e:"L'attrito interno è dovuto alla coesione tra le particelle del fluido e all'adesione tra fluido e pareti."},
{id:"fl6_052",t:"fl6",p:"6.5",l:2,q:"Da quali forze nasce la viscosità di un fluido reale?",o:["Coesione tra particelle del fluido e adesione tra fluido e pareti","Forza peso e spinta di Archimede","Solo forze elettriche","Forze magnetiche"],a:0,e:"La viscosità è il termine con cui la fisica descrive l'attrito interno dei fluidi."},
{id:"fl6_053",t:"fl6",p:"6.5.1",l:3,q:"Secondo la legge di Stokes, se il raggio della sfera raddoppia (stessa velocità e fluido), la forza di attrito viscoso…",o:["raddoppia","quadruplica","resta uguale","si dimezza"],a:0,e:"F = 6πηrv è proporzionale al raggio."},
{id:"fl6_054",t:"fl6",p:"6.5.2",l:1,q:"Che cos'è la perdita di carico?",o:["La diminuzione di pressione di un fluido reale lungo un condotto, dovuta alla viscosità","La perdita di fluido da un foro","La diminuzione della portata","L'aumento di velocità in una strozzatura"],a:0,e:"Si vede dall'abbassamento del livello del liquido nei tubicini verticali lungo il condotto."},
{id:"fl6_055",t:"fl6",p:"6.5.2",l:2,q:"Senza viscosità, in un condotto a sezione costante la pressione…",o:["resterebbe costante","diminuirebbe","aumenterebbe","si annullerebbe"],a:0,e:"Per la sola equazione di continuità velocità e pressione resterebbero costanti; la diminuzione osservata è dovuta alla viscosità."},
{id:"fl6_056",t:"fl6",p:"6.5.3",l:1,q:"Come si muovono le particelle in regime laminare?",o:["Su strati paralleli e ordinati, senza mescolarsi","Su traiettorie irregolari con vortici","Solo verso il centro del condotto","Ferme"],a:0,e:"Nel regime turbolento invece seguono traiettorie irregolari e formano piccoli vortici."},
{id:"fl6_057",t:"fl6",p:"6.5.3",l:2,q:"Nel moto laminare in un condotto, dove è massima la velocità del fluido?",o:["Al centro del condotto","Vicino alle pareti","È uguale ovunque","All'ingresso"],a:0,e:"A contatto con la parete la velocità è nulla per l'attrito e cresce regolarmente fino al centro."},
{id:"fl6_058",t:"fl6",p:"6.5.4",l:2,q:"Il numero di Reynolds è…",o:["adimensionale","una pressione","una velocità","una viscosità"],a:0,e:"Re = ρvd/η è un numero puro: < 2000 laminare, 2000–4000 transizione, > 4000 turbolento."},
{id:"fl6_059",t:"fl6",p:"6.5.5",l:2,q:"Secondo Poiseuille, la portata è inversamente proporzionale…",o:["alla viscosità e alla lunghezza del condotto","alla differenza di pressione","al raggio","alla densità"],a:0,e:"Q = πΔP r⁴/(8ηL): direttamente proporzionale a ΔP e a r⁴, inversamente a η e L."},
{id:"fl6_060",t:"fl6",p:"6.5.5",l:3,q:"Se la differenza di pressione ai capi di un condotto raddoppia, secondo Poiseuille la portata…",o:["raddoppia","quadruplica","resta uguale","diventa 16 volte"],a:0,e:"La portata è direttamente proporzionale a ΔP."},
{id:"fl6_061",t:"fl6",p:"6.6.1",l:1,q:"Quale componente del sangue trasporta ossigeno e anidride carbonica?",o:["I globuli rossi (eritrociti)","I globuli bianchi","Le piastrine","Il plasma da solo"],a:0,e:"I globuli bianchi fanno parte del sistema immunitario, le piastrine servono alla coagulazione."},
{id:"fl6_062",t:"fl6",p:"6.6.1",l:1,q:"Circa quanta acqua contiene il plasma?",o:["Circa il 90%","Circa il 50%","Circa il 10%","Circa il 99,9%"],a:0,e:"Il plasma è acqua (≈90%) con glucidi, lipidi, proteine, amminoacidi, vitamine, ormoni e sali minerali."},
{id:"fl6_063",t:"fl6",p:"6.6.1",l:2,q:"A che cosa servono le piastrine (trombociti)?",o:["Alla coagulazione","Al trasporto di ossigeno","Alla difesa immunitaria","All'equilibrio acido-base"],a:0,e:"Fanno parte della parte corpuscolare del sangue insieme a globuli rossi e bianchi."},
{id:"fl6_064",t:"fl6",p:"6.6.2",l:2,q:"Perché l'ematocrito si può approssimare con volume dei globuli rossi / volume totale?",o:["Perché il volume dei globuli rossi domina sul resto della parte corpuscolare","Perché le piastrine non hanno volume","Perché il plasma non ha volume","Perché i globuli bianchi sono più numerosi"],a:0,e:"Globuli bianchi e piastrine occupano un volume molto minore dei globuli rossi."},
{id:"fl6_065",t:"fl6",p:"6.6.2",l:3,q:"In un campione di 10 mL di sangue i globuli rossi occupano 4,5 mL. Quanto vale circa l'ematocrito?",o:["45%","4,5%","55%","22%"],a:0,e:"HCT ≈ 4,5/10 = 0,45 = 45%."},
{id:"fl6_066",t:"fl6",p:"6.6.3",l:2,q:"Che cos'è la sedimentazione?",o:["Il processo per cui particelle solide immerse in un fluido tendono a scendere per gravità","L'evaporazione di un liquido","La separazione per filtrazione","La coagulazione del sangue"],a:0,e:"Una particella in un fluido viscoso accelera fino a una velocità terminale costante; per i globuli rossi questa corrisponde circa alla VES."},
{id:"fl6_067",t:"fl6",p:"6.6.3",l:2,q:"Perché nelle infiammazioni la VES aumenta?",o:["Cambia la composizione del plasma e aumenta l'aggregazione dei globuli rossi","Diminuisce il numero di globuli rossi","Il sangue diventa meno denso","Aumenta la temperatura del sangue"],a:0,e:"I globuli rossi aggregati sedimentano più rapidamente."},
{id:"fl7_001",t:"fl7",p:"7.1.1",l:1,q:"A quanti joule corrisponde 1 caloria?",o:["4,186 J","1 J","1000 J","0,239 J"],a:0,e:"È l'equivalente meccanico della caloria, trovato da Joule: 1 cal = 4,186 J."},
{id:"fl7_002",t:"fl7",p:"7.1.2",l:1,q:"Quale modo di trasmissione del calore avviene anche nel vuoto?",o:["L'irraggiamento","La conduzione","La convezione","Nessuno"],a:0,e:"L'irraggiamento usa le onde elettromagnetiche, che non hanno bisogno di un mezzo: così arriva il calore del Sole."},
{id:"fl7_003",t:"fl7",p:"7.1.2",l:2,q:"Quale modo di trasmissione del calore comporta spostamento di materia?",o:["La convezione","La conduzione","L'irraggiamento","Tutti e tre"],a:0,e:"La convezione è tipica dei fluidi: per esempio i movimenti di aria calda e fredda nell'atmosfera."},
{id:"fl7_004",t:"fl7",p:"7.1",l:2,q:"Il calore è una funzione di stato?",o:["No, è energia che si trasferisce da un corpo all'altro","Sì, come la temperatura","Sì, ma solo nei gas","Dipende dalla trasformazione"],a:0,e:"Il calore non è una caratteristica propria dei corpi: è energia termica in transito. La temperatura invece è una funzione di stato."},
{id:"fl7_005",t:"fl7",p:"7.1.1",l:2,q:"Quali sono le dimensioni del calore?",o:["[M][L]²[T]⁻²","[M][L][T]⁻²","[M][L]²[T]⁻³","[K]"],a:0,e:"Il calore è omogeneo al lavoro (F·s): [M][L][T]⁻² · [L] = [M][L]²[T]⁻²."},
{id:"fl7_006",t:"fl7",p:"7.1.2",l:3,q:"Nella conduzione tra due corpi, la velocità con cui passa il calore è proporzionale…",o:["alla differenza di temperatura e all'area di contatto","solo alla massa dei corpi","al calore specifico","al quadrato della temperatura"],a:0,e:"Il calore passa dal corpo più caldo al più freddo con velocità proporzionale a (TA − TB) e alla superficie di contatto."},
{id:"fl7_007",t:"fl7",p:"7.2",l:1,q:"Qual è il calore specifico dell'acqua?",o:["1 cal/(g·°C), cioè circa 4186 J/(kg·K)","0,5 cal/(g·°C)","4,186 cal/(g·°C)","1 J/(kg·K)"],a:0,e:"Dalla definizione di caloria: 1 cal per scaldare 1 g di 1 °C. In unità SI: 4186 J/(kg·K). Il ghiaccio ha 0,5 cal/(g·°C)."},
{id:"fl7_008",t:"fl7",p:"7.2",l:1,q:"Quale formula lega calore, massa e variazione di temperatura?",o:["Q = c·m·ΔT","Q = m·λ","Q = C/ΔT","Q = P·ΔV"],a:0,e:"c è il calore specifico. Q = m·λ vale invece per i passaggi di stato."},
{id:"fl7_009",t:"fl7",p:"7.2",l:2,q:"Che cosa misura la capacità termica di un corpo?",o:["Il calore necessario per aumentarne la temperatura di 1 K","Il calore per scaldare 1 kg di sostanza di 1 K","La temperatura massima raggiungibile","Il calore latente"],a:0,e:"C = Q/ΔT, in J/K. Vale C = c·m: dipende dalla massa del corpo, il calore specifico no."},
{id:"fl7_010",t:"fl7",p:"7.2.1",l:2,q:"200 g di acqua a 20 °C vengono mescolati con 500 g di acqua a 80 °C. Qual è circa la temperatura finale?",o:["62,9 °C","50 °C","37,1 °C","70 °C"],a:0,e:"Te = (200·20 + 500·80)/700 = 44.000/700 ≈ 62,9 °C."},
{id:"fl7_011",t:"fl7",p:"7.2",l:3,q:"Quanto calore serve per scaldare 2 kg di acqua da 20 °C a 70 °C (c = 4186 J/kg·K)?",o:["Circa 4,2·10⁵ J","Circa 4,2·10³ J","Circa 8,4·10⁵ J","Circa 2,1·10⁵ J"],a:0,e:"Q = c·m·ΔT = 4186 · 2 · 50 ≈ 418.600 J ≈ 4,2·10⁵ J."},
{id:"fl7_012",t:"fl7",p:"7.2",l:3,q:"Nei gas perfetti, che cosa afferma la relazione di Mayer?",o:["cp − cv = R","cp = cv","cp + cv = R","cp/cv = R"],a:0,e:"Il calore specifico a pressione costante supera quello a volume costante di R. Nei solidi e nei liquidi invece cp ≈ cv."},
{id:"fl7_013",t:"fl7",p:"7.2.1",l:3,q:"A 200 g di acqua a 20 °C si aggiungono 10 g di ghiaccio a 0 °C. Perché la temperatura finale è più bassa di quella che si avrebbe con 10 g di acqua a 0 °C?",o:["Perché prima serve calore per fondere il ghiaccio","Perché il ghiaccio ha calore specifico maggiore","Perché il ghiaccio è più denso","Non è più bassa"],a:0,e:"Fondere 10 g di ghiaccio richiede 797 cal, sottratte all'acqua (che scende a circa 16 °C) prima dell'equilibrio: si arriva a circa 15,2 °C."},
{id:"fl7_014",t:"fl7",p:"7.3",l:1,q:"Un sistema che scambia energia ma non materia con l'ambiente si dice…",o:["chiuso","isolato","aperto","adiabatico"],a:0,e:"Isolato: niente scambi. Chiuso: solo energia. Aperto: materia ed energia."},
{id:"fl7_015",t:"fl7",p:"7.4",l:1,q:"Come si chiama una trasformazione a volume costante?",o:["Isocora","Isobara","Isoterma","Adiabatica"],a:0,e:"Isocora: V costante (retta verticale nel piano PV). Isobara: P costante. Isoterma: T costante. Adiabatica: niente calore scambiato."},
{id:"fl7_016",t:"fl7",p:"7.4.1",l:2,q:"Come si rappresenta un'isoterma di un gas perfetto nel piano PV?",o:["Con un'iperbole equilatera","Con una retta orizzontale","Con una retta verticale","Con una retta passante per l'origine"],a:0,e:"P·V = costante è un'iperbole. L'isobara è una retta orizzontale, l'isocora verticale; l'adiabatica è una curva più ripida dell'isoterma."},
{id:"fl7_017",t:"fl7",p:"7.4.1",l:2,q:"In una trasformazione senza scambio di calore, la temperatura…",o:["può cambiare: è una trasformazione adiabatica, non isoterma","resta sempre costante","aumenta sempre","è sempre zero"],a:0,e:"Adiabatica significa Q = 0, non T costante: l'energia interna cambia per effetto del lavoro."},
{id:"fl7_018",t:"fl7",p:"7.4",l:2,q:"Secondo le convenzioni del libro, quando il lavoro è positivo?",o:["Quando il sistema lo cede all'ambiente (il gas si espande)","Quando il sistema lo riceve","Quando il gas viene compresso","Mai"],a:0,e:"L > 0 in espansione, L < 0 in compressione. Il calore invece è positivo se assorbito dal sistema."},
{id:"fl7_019",t:"fl7",p:"7.5",l:1,q:"Come si scrive il primo principio della termodinamica?",o:["ΔU = Q − L","ΔU = Q + L","Q = L","ΔS = Q/T"],a:0,e:"È la conservazione dell'energia estesa all'energia termica: il calore assorbito va in lavoro o in variazione di energia interna."},
{id:"fl7_020",t:"fl7",p:"7.5",l:2,q:"In una trasformazione isoterma di un gas perfetto…",o:["ΔU = 0, quindi Q = L","Q = 0","L = 0","ΔU = Q"],a:0,e:"Nei gas perfetti l'energia interna dipende solo dalla temperatura: se T è costante, ΔU = 0."},
{id:"fl7_021",t:"fl7",p:"7.5",l:2,q:"In una trasformazione isocora…",o:["L = 0, quindi ΔU = Q","Q = 0","ΔU = 0","Q = L"],a:0,e:"Se il volume non cambia, L = P·ΔV = 0 e tutto il calore va in energia interna."},
{id:"fl7_022",t:"fl7",p:"7.5",l:3,q:"Un gas si espande a pressione costante di 2·10⁵ Pa aumentando il volume di 3·10⁻³ m³. Quanto lavoro compie?",o:["600 J","6·10⁸ J","60 J","6000 J"],a:0,e:"L = P·ΔV = 2·10⁵ · 3·10⁻³ = 600 J."},
{id:"fl7_023",t:"fl7",p:"7.5",l:3,q:"Un gas assorbe 500 J di calore e compie 200 J di lavoro. Di quanto varia la sua energia interna?",o:["+300 J","+700 J","−300 J","0 J"],a:0,e:"ΔU = Q − L = 500 − 200 = 300 J."},
{id:"fl7_024",t:"fl7",p:"7.5",l:3,q:"Quale di queste grandezze è una funzione di stato?",o:["L'energia interna U","Il calore Q","Il lavoro L","Nessuna"],a:0,e:"U dipende solo dagli stati iniziale e finale; Q e L dipendono dal tipo di trasformazione."},
{id:"fl7_025",t:"fl7",p:"7.6",l:1,q:"Come si definisce il rendimento di una macchina termica?",o:["Lavoro prodotto diviso calore assorbito dalla sorgente calda","Calore ceduto diviso lavoro","Temperatura calda diviso temperatura fredda","Lavoro per tempo"],a:0,e:"η = L/Qc = 1 − Qf/Qc. È sempre positivo e minore di 1."},
{id:"fl7_026",t:"fl7",p:"7.7",l:2,q:"Da quali trasformazioni è formato il ciclo di Carnot?",o:["Due isoterme e due adiabatiche","Due isobare e due isocore","Quattro isoterme","Due isoterme e due isocore"],a:0,e:"Il lavoro di ogni ciclo è uguale all'area racchiusa dal ciclo nel piano PV."},
{id:"fl7_027",t:"fl7",p:"7.7",l:2,q:"Una macchina di Carnot lavora tra 400 K e 300 K. Qual è il suo rendimento?",o:["25%","75%","33%","100%"],a:0,e:"η = 1 − Tf/Tc = 1 − 300/400 = 0,25."},
{id:"fl7_028",t:"fl7",p:"7.7",l:3,q:"Una macchina di Carnot ha rendimento 20% e la sorgente fredda è a 27 °C. A che temperatura è la sorgente calda?",o:["102 °C (375 K)","33,75 °C","135 °C","375 °C"],a:0,e:"Tf = 300 K; Tc = Tf/(1 − η) = 300/0,8 = 375 K = 102 °C."},
{id:"fl7_029",t:"fl7",p:"7.7",l:3,q:"Perché il rendimento di una macchina di Carnot è sempre minore di 1?",o:["Perché la temperatura in kelvin della sorgente fredda è sempre maggiore di zero","Per gli attriti","Perché il ciclo è irreversibile","Perché il gas non è perfetto"],a:0,e:"η = 1 − Tf/Tc sarebbe 1 solo con Tf = 0 K, che non si può raggiungere."},
{id:"fl7_030",t:"fl7",p:"7.7",l:3,q:"Come funziona un frigorifero dal punto di vista termodinamico?",o:["Percorre un ciclo al contrario: prende calore dall'interno freddo e lo cede all'ambiente caldo","Produce freddo dal nulla","Trasforma il freddo in lavoro","Prende calore dall'ambiente e lo porta all'interno"],a:0,e:"È una macchina che percorre il ciclo in senso opposto, usando lavoro per portare calore dalla sorgente fredda a quella calda."},
{id:"fl7_031",t:"fl7",p:"7.9",l:1,q:"Che cosa afferma l'enunciato di Clausius del secondo principio?",o:["Il calore passa spontaneamente dai corpi caldi ai corpi freddi e non viceversa","L'energia non si crea e non si distrugge","Il rendimento può essere 1","L'entropia diminuisce sempre"],a:0,e:"I tre enunciati (Kelvin, Clausius, entropia) sono equivalenti: se uno fosse falso lo sarebbero anche gli altri."},
{id:"fl7_032",t:"fl7",p:"7.9",l:2,q:"Che cosa afferma l'enunciato di Kelvin?",o:["È impossibile trasformare integralmente in lavoro il calore assorbito da una sola sorgente","Il calore va dal freddo al caldo","L'entropia dell'universo diminuisce","Il lavoro si trasforma sempre in calore"],a:0,e:"Per produrre lavoro in modo continuo servono due sorgenti a temperature diverse: quindi η < 1."},
{id:"fl7_033",t:"fl7",p:"7.8.1",l:2,q:"Che cosa si intende con moto perpetuo di prima specie?",o:["Produrre lavoro senza assorbire energia dall'esterno","Trasformare integralmente in lavoro il calore di una sola sorgente","Una macchina con rendimento del 50%","Un moto senza attriti"],a:0,e:"È vietato dal primo principio. Il moto perpetuo di seconda specie (tutto il calore di una sorgente in lavoro) è vietato dal secondo."},
{id:"fl7_034",t:"fl7",p:"7.8",l:2,q:"Perché le trasformazioni reali sono sempre irreversibili?",o:["Perché comprendono sempre degli attriti","Perché sono troppo lente","Perché il calore è una funzione di stato","Perché l'energia non si conserva"],a:0,e:"Una trasformazione reversibile richiede cause infinitesime, stati di equilibrio e assenza di attriti: è un caso ideale."},
{id:"fl7_035",t:"fl7",p:"7.8.1",l:3,q:"Che cosa misura l'entropia configurazionale S = k·ln W?",o:["Il disordine del sistema","L'energia interna","La temperatura","Il lavoro compiuto"],a:0,e:"W è la probabilità termodinamica della configurazione: più disordine ⇒ W maggiore ⇒ S maggiore."},
{id:"fl7_036",t:"fl7",p:"7.9",l:3,q:"L'entropia di un sistema può diminuire?",o:["Sì, se il sistema non è isolato","No, mai","Solo se è isolato","Solo a 0 K"],a:0,e:"L'entropia cresce sempre nelle trasformazioni spontanee dei sistemi isolati; un sistema non isolato può diminuirla con una trasformazione non spontanea."},
{id:"fl7_037",t:"fl7",p:"7.8.1",l:3,q:"Quali sono le dimensioni dell'entropia?",o:["Quelle di un'energia divisa una temperatura (J/K)","È adimensionale","Quelle di un'energia (J)","Quelle di una temperatura (K)"],a:0,e:"Dalla definizione ΔS = Q/T. Anche la costante k in S = k·ln W ha quindi dimensioni J/K."},
{id:"fl7_038",t:"fl7",p:"7.10",l:1,q:"Come si definisce l'entalpia?",o:["H = U + PV","H = U − PV","H = G − TS","H = Q/T"],a:0,e:"Esprime il contenuto energetico totale del sistema. Si misura in joule."},
{id:"fl7_039",t:"fl7",p:"7.10",l:2,q:"Una reazione a pressione costante ha ΔH < 0. Com'è?",o:["Esotermica: rilascia calore","Endotermica: assorbe calore","Sempre spontanea","All'equilibrio"],a:0,e:"A P costante ΔH coincide con il calore scambiato: negativo significa calore ceduto all'ambiente."},
{id:"fl7_040",t:"fl7",p:"7.10",l:2,q:"Quando una reazione è spontanea secondo l'energia libera di Gibbs?",o:["Quando ΔG < 0","Quando ΔG > 0","Quando ΔH > 0","Quando ΔS = 0"],a:0,e:"ΔG < 0 spontanea, ΔG > 0 non spontanea, ΔG = 0 equilibrio (a T e P costanti). L'entalpia da sola non basta perché non considera l'entropia."},
{id:"fl7_041",t:"fl7",p:"7.10",l:3,q:"Come si definisce l'energia libera di Gibbs?",o:["G = H − TS","G = H + TS","G = U + PV","G = U − TS"],a:0,e:"T è la temperatura assoluta e S l'entropia: G misura l'energia utile disponibile a T e P costanti."},
{id:"fl7_042",t:"fl7",p:"7.11.1",l:1,q:"Quante kcal liberano circa i grassi per grammo?",o:["Circa 9 kcal/g","Circa 4 kcal/g","Circa 1 kcal/g","Circa 20 kcal/g"],a:0,e:"Carboidrati e proteine ≈ 4 kcal/g, grassi ≈ 9 kcal/g."},
{id:"fl7_043",t:"fl7",p:"7.11.1",l:2,q:"Qual è circa il rendimento del corpo umano visto come macchina termica?",o:["20–25%","80–90%","1–2%","100%"],a:0,e:"Gran parte dell'energia chimica dei nutrienti diventa calore; solo il 20–25% diventa lavoro meccanico."},
{id:"fl7_044",t:"fl7",p:"7.11.1",l:3,q:"Un adulto di 80 kg ha un metabolismo basale di circa 1 kcal/(kg·h). Quanto consuma a riposo in un giorno?",o:["Circa 1920 kcal","Circa 80 kcal","Circa 960 kcal","Circa 3840 kcal"],a:0,e:"1 · 80 · 24 = 1920 kcal ≈ 8·10⁶ J, cioè una potenza media di circa 93 W."},
{id:"fl7_045",t:"fl7",p:"7.11.1",l:3,q:"Quando si ha una perdita di peso, secondo il bilancio energetico?",o:["Quando l'energia degli alimenti è minore di BMR + lavoro + calore emesso","Quando l'energia degli alimenti è maggiore","Quando il metabolismo basale è nullo","Mai, l'energia si conserva"],a:0,e:"Se si spende più energia (metabolismo basale + lavoro + termogenesi) di quella introdotta, il corpo usa le riserve."},
{id:"fl7_046",t:"fl7",p:"7.1.1",l:4,q:"A quante calorie corrispondono circa 10 J?",o:["Circa 2,4 cal","Circa 41,9 cal","Circa 0,24 cal","10 cal"],a:0,e:"10 / 4,186 ≈ 2,4 cal. Al contrario 10 cal = 41,86 J."},
{id:"fl7_047",t:"fl7",p:"7.6",l:4,q:"Una macchina assorbe 1000 J dalla sorgente calda e ne cede 700 a quella fredda per ciclo. Qual è il rendimento?",o:["30%","70%","43%","100%"],a:0,e:"L = Qc − Qf = 300 J; η = 300/1000 = 0,3."},
{id:"fl7_048",t:"fl7",p:"7.2.1",l:4,q:"Due corpi di uguale massa e materiale, a 10 °C e 50 °C, vengono messi a contatto in un sistema isolato. A che temperatura arrivano?",o:["30 °C","20 °C","40 °C","60 °C"],a:0,e:"Con masse e calori specifici uguali la temperatura di equilibrio è la media: (10 + 50)/2 = 30 °C."},
{id:"fl7_049",t:"fl7",p:"7.5",l:4,q:"In una trasformazione adiabatica un gas compie 150 J di lavoro. Come varia la sua energia interna?",o:["Diminuisce di 150 J","Aumenta di 150 J","Non cambia","Diminuisce di 300 J"],a:0,e:"Q = 0 ⇒ ΔU = −L = −150 J: il gas si raffredda espandendosi."},
{id:"fl7_050",t:"fl7",p:"7.11.1",l:4,q:"Un alimento contiene 10 g di carboidrati, 5 g di proteine e 4 g di grassi. Quante kcal fornisce circa?",o:["96 kcal","76 kcal","171 kcal","19 kcal"],a:0,e:"10·4 + 5·4 + 4·9 = 40 + 20 + 36 = 96 kcal."},
{id:"fl7_051",t:"fl7",p:"7.1",l:1,q:"Che cos'è il calore?",o:["Energia scambiata tra corpi a temperature diverse","La temperatura di un corpo","Una sostanza contenuta nei corpi","Una forza"],a:0,e:"Lo scambio avviene attraverso le collisioni a livello atomico e molecolare; nel SI il calore si misura in joule."},
{id:"fl7_052",t:"fl7",p:"7.1",l:2,q:"Come si definisce una caloria?",o:["L'energia per innalzare di 1 °C la temperatura di 1 g di acqua (da 14,5 a 15,5 °C)","L'energia per scaldare 1 kg di acqua di 1 °C","L'energia di 1 J","L'energia per far bollire 1 g di acqua"],a:0,e:"1 kcal = 1 Cal = 1000 cal."},
{id:"fl7_053",t:"fl7",p:"7.3",l:1,q:"Quali grandezze determinano lo stato di un sistema termodinamico (un gas)?",o:["Pressione, volume e temperatura","Posizione e quantità di moto","Massa e velocità","Calore e lavoro"],a:0,e:"In meccanica lo stato di un corpo è dato da posizione e quantità di moto; in termodinamica da P, V e T."},
{id:"fl7_054",t:"fl7",p:"7.3",l:2,q:"Che cosa significa che una funzione di stato «non ha memoria»?",o:["Dipende solo dallo stato iniziale e finale, non dal cammino seguito","Cambia sempre nel tempo","Non si può misurare","Dipende dal tipo di trasformazione"],a:0,e:"Per questo temperatura e pressione sono funzioni di stato, mentre calore e lavoro no."},
{id:"fl7_055",t:"fl7",p:"7.4",l:2,q:"Quando un sistema subisce una trasformazione termodinamica?",o:["Quando scambia calore e/o lavoro con l'ambiente","Solo quando cambia stato di aggregazione","Solo quando cambia massa","Mai, se è chiuso"],a:0,e:"Per esempio un gas in un cilindro con un pistone: se il pistone è bloccato il volume resta costante, se è libero resta costante la pressione."},
{id:"fl7_056",t:"fl7",p:"7.4.1",l:1,q:"Come si rappresenta una trasformazione isobara nel piano PV?",o:["Con una retta orizzontale","Con una retta verticale","Con un'iperbole equilatera","Con una curva più ripida dell'isoterma"],a:0,e:"Isobara: P costante, retta orizzontale. Isocora: retta verticale. Isoterma: iperbole. Adiabatica: curva più ripida dell'isoterma."},
{id:"fl7_057",t:"fl7",p:"7.6",l:2,q:"Perché una macchina termica deve restituire una parte del calore a una sorgente fredda?",o:["Per ripristinare le condizioni iniziali e chiudere il ciclo","Per aumentare il rendimento oltre 1","Per evitare gli attriti","Non è necessario"],a:0,e:"Il lavoro totale è Qc − Qf: non tutto il calore assorbito può diventare lavoro."},
{id:"fl7_058",t:"fl7",p:"7.8",l:1,q:"Quando una trasformazione è reversibile?",o:["Quando è una successione di stati di equilibrio e si può percorrere nei due versi","Quando avviene molto velocemente","Quando c'è attrito","Quando la temperatura sale"],a:0,e:"Le trasformazioni reversibili si possono seguire variabile per variabile istante per istante; quelle reali, con attriti, sono irreversibili."},
{id:"fl7_059",t:"fl7",p:"7.8",l:2,q:"Perché in una compressione molto veloce di un gas la trasformazione è irreversibile?",o:["Perché la pressione varia da punto a punto e non si passa per stati di equilibrio","Perché il volume aumenta","Perché la temperatura resta costante","Perché non si scambia lavoro"],a:0,e:"In una trasformazione veloce non si possono specificare con esattezza i valori delle variabili in ogni istante."},
{id:"fl8_001",t:"fl8",p:"8.1",l:1,q:"Due cariche dello stesso segno…",o:["si respingono","si attraggono","non interagiscono","si attraggono solo nel vuoto"],a:0,e:"Cariche di segno opposto si attraggono, cariche dello stesso segno si respingono."},
{id:"fl8_002",t:"fl8",p:"8.1",l:1,q:"Qual è l'unità di misura della carica elettrica nel SI?",o:["Coulomb","Ampere","Volt","Farad"],a:0,e:"La carica si misura in coulomb; non è una grandezza fondamentale: le sue dimensioni sono [i][T]."},
{id:"fl8_003",t:"fl8",p:"8.1",l:1,q:"Quale di questi materiali è un buon isolante?",o:["L'acqua distillata","Il rame","L'acqua di casa","L'argento"],a:0,e:"L'acqua distillata è un isolante; quella del rubinetto conduce perché contiene sali disciolti (ioni). I metalli sono i conduttori per eccellenza."},
{id:"fl8_004",t:"fl8",p:"8.1",l:2,q:"Due cariche a 1 m si attraggono con 1 N. Se la distanza diventa 2 m, la forza vale…",o:["0,25 N","0,5 N","2 N","4 N"],a:0,e:"F è inversamente proporzionale a r²: con distanza doppia la forza diventa ¼."},
{id:"fl8_005",t:"fl8",p:"8.1",l:2,q:"Quanto vale la costante di Coulomb nel vuoto K₀?",o:["9·10⁹ N·m²/C²","6,67·10⁻¹¹ N·m²/kg²","8,85·10⁹ N·m²/C²","1,6·10⁻¹⁹ C"],a:0,e:"K₀ = 1/(4πε₀) ≈ 9·10⁹ N·m²/C²: due cariche di 1 C a 1 m si respingono con 9·10⁹ N."},
{id:"fl8_006",t:"fl8",p:"8.1",l:3,q:"Se entrambe le cariche raddoppiano e anche la distanza raddoppia, la forza di Coulomb…",o:["resta uguale","raddoppia","quadruplica","si dimezza"],a:0,e:"Il numeratore diventa 4 volte, il denominatore (r²) anche 4 volte: la forza non cambia."},
{id:"fl8_007",t:"fl8",p:"8.1.1",l:1,q:"Quanto vale circa la costante dielettrica relativa dell'acqua?",o:["81","1","1,0006","0,81"],a:0,e:"L'acqua è molto polarizzabile perché la sua molecola è un dipolo: εᵣ ≈ 81. L'aria ha 1,0006 e il vuoto 1."},
{id:"fl8_008",t:"fl8",p:"8.1.1",l:2,q:"Come cambia la forza tra due cariche se passano dal vuoto all'acqua?",o:["Si riduce di circa 80 volte","Aumenta di circa 80 volte","Non cambia","Diventa sempre attrattiva"],a:0,e:"La forza è divisa per εᵣ. Attenzione: resta repulsiva se le cariche hanno lo stesso segno."},
{id:"fl8_009",t:"fl8",p:"8.1.1",l:2,q:"Che dimensioni ha la costante dielettrica relativa εᵣ?",o:["Nessuna, è adimensionale","F/m","N·m²/C²","C²/(N·m²)"],a:0,e:"È il rapporto tra due costanti dielettriche (ε/ε₀), quindi un numero puro, sempre ≥ 1."},
{id:"fl8_010",t:"fl8",p:"8.1.2",l:3,q:"Quale differenza c'è tra forza di Coulomb e forza gravitazionale?",o:["La forza elettrica dipende dal mezzo e può essere repulsiva","La forza gravitazionale dipende dal mezzo","Sono entrambe sempre attrattive","La forza gravitazionale è molto più intensa"],a:0,e:"Entrambe dipendono da 1/r², ma la gravità è sempre attrattiva, non dipende dal mezzo ed è molto più debole (circa 10³⁹ volte nell'atomo di idrogeno)."},
{id:"fl8_011",t:"fl8",p:"8.1.1",l:3,q:"Qual è la causa della riduzione della forza elettrica in un dielettrico?",o:["La polarizzazione del dielettrico","La conduzione di corrente","La forza di gravità","L'aumento di temperatura"],a:0,e:"Le molecole del dielettrico si orientano (o si deformano) nel campo: più sono polari, maggiore è la riduzione della forza."},
{id:"fl8_012",t:"fl8",p:"8.2",l:1,q:"Come si definisce il campo elettrico in un punto?",o:["Forza sulla carica esploratrice diviso la carica stessa: E = F/q","Forza per distanza","Carica per potenziale","Energia diviso carica"],a:0,e:"La carica esploratrice per convenzione è positiva. Il campo si misura in N/C (o V/m)."},
{id:"fl8_013",t:"fl8",p:"8.2",l:2,q:"Il campo generato da una carica Q in un punto dipende dalla carica esploratrice q?",o:["No: dipende solo da Q e dalla distanza","Sì, è proporzionale a q","Sì, è inversamente proporzionale a q","Solo se q è negativa"],a:0,e:"E = K₀·Q/r²: la carica esploratrice si semplifica."},
{id:"fl8_014",t:"fl8",p:"8.2",l:2,q:"Una carica negativa si trova in un campo elettrico. Come è diretta la forza su di essa?",o:["Nella stessa direzione del campo ma in verso opposto","Nello stesso verso del campo","Perpendicolare al campo","Non subisce forza"],a:0,e:"F = q·E: con q negativa la forza ha verso opposto a E."},
{id:"fl8_015",t:"fl8",p:"8.2",l:2,q:"Come sono orientate per convenzione le linee di forza del campo elettrico?",o:["Escono dalle cariche positive ed entrano in quelle negative","Escono dalle cariche negative","Sono sempre circolari","Sono perpendicolari al campo"],a:0,e:"Sono in ogni punto tangenti al campo e concordi con esso."},
{id:"fl8_016",t:"fl8",p:"8.2",l:3,q:"Una particella di massa m e carica q positiva è in un campo uniforme E. Qual è la sua accelerazione?",o:["a = qE/m, nel verso del campo","a = mE/q","a = qm/E","a = E/(qm)"],a:0,e:"F = qE e per la seconda legge a = F/m = qE/m."},
{id:"fl8_017",t:"fl8",p:"8.2",l:3,q:"Una carica positiva libera di muoversi in un campo con linee di forza curve…",o:["in generale non segue le linee di forza","segue sempre esattamente le linee di forza","resta ferma","si muove perpendicolarmente alle linee"],a:0,e:"La forza è tangente alle linee, ma per seguire una traiettoria curva servirebbe anche una forza centripeta, che qui non c'è."},
{id:"fl8_018",t:"fl8",p:"8.3.1",l:1,q:"Qual è l'unità di misura del potenziale elettrico?",o:["Volt (J/C)","Joule","Coulomb","Newton/coulomb"],a:0,e:"Il potenziale è energia potenziale per unità di carica: V = Ep/q, quindi J/C = volt."},
{id:"fl8_019",t:"fl8",p:"8.3.1",l:1,q:"Il potenziale elettrico è una grandezza…",o:["scalare","vettoriale","adimensionale","fondamentale"],a:0,e:"Per questo i potenziali di più cariche si sommano come numeri, mentre i campi si sommano come vettori."},
{id:"fl8_020",t:"fl8",p:"8.3.1",l:2,q:"Nel punto medio tra due cariche positive uguali, quanto valgono campo e potenziale?",o:["Campo nullo, potenziale diverso da zero","Entrambi nulli","Campo diverso da zero, potenziale nullo","Entrambi diversi da zero"],a:0,e:"I due campi hanno uguale modulo e verso opposto e si annullano; i potenziali (scalari positivi) si sommano: 2K₀Q/d."},
{id:"fl8_021",t:"fl8",p:"8.3.3",l:2,q:"Che lavoro compiono le forze del campo spostando una carica su una superficie equipotenziale?",o:["Nessuno","q·V","Dipende dal percorso","Sempre negativo"],a:0,e:"L = q(V_A − V_B) e i due potenziali sono uguali."},
{id:"fl8_022",t:"fl8",p:"8.3.3",l:2,q:"Come sono le superfici equipotenziali rispetto alle linee di campo?",o:["Perpendicolari","Parallele","Coincidenti","Inclinate di 45°"],a:0,e:"Per una carica puntiforme le superfici equipotenziali sono sfere centrate sulla carica, e le linee di campo sono radiali."},
{id:"fl8_023",t:"fl8",p:"8.3.2",l:3,q:"Una carica di +8 C passa da un punto a 6 V a uno a 2 V. Quanto lavoro compiono le forze del campo?",o:["+32 J","−32 J","+16 J","+64 J"],a:0,e:"L = q(V_A − V_B) = 8 · (6 − 2) = 32 J."},
{id:"fl8_024",t:"fl8",p:"8.3.3",l:3,q:"Due piastre parallele distano 2 cm e hanno una d.d.p. di 100 V. Quanto vale il campo tra di esse?",o:["5000 V/m","50 V/m","200 V/m","2 V/m"],a:0,e:"E = ΔV/d = 100 V / 0,02 m = 5000 V/m. Il campo è uniforme e va dalla piastra a potenziale maggiore a quella minore."},
{id:"fl8_025",t:"fl8",p:"8.3.1",l:3,q:"Come varia il potenziale generato da una carica puntiforme se la distanza raddoppia?",o:["Si dimezza","Diventa ¼","Raddoppia","Resta uguale"],a:0,e:"V = K₀Q/r: è inversamente proporzionale a r (non a r² come il campo)."},
{id:"fl8_026",t:"fl8",p:"8.4",l:1,q:"Quanto vale il campo elettrico all'interno di un conduttore carico in equilibrio?",o:["Zero","È massimo","È uguale a quello sulla superficie","Dipende dalla carica"],a:0,e:"È una conseguenza del teorema di Gauss: la carica si dispone sulla superficie e il campo interno è nullo."},
{id:"fl8_027",t:"fl8",p:"8.4",l:2,q:"Dove si concentra la carica su un conduttore carico?",o:["Sulle punte, dove la curvatura è maggiore","Nelle zone piatte","Al centro del conduttore","Si distribuisce uniformemente nel volume"],a:0,e:"La densità di carica è maggiore dove il raggio di curvatura è minore: è il «potere delle punte»."},
{id:"fl8_028",t:"fl8",p:"8.4",l:2,q:"Che cosa afferma il teorema di Gauss (nel vuoto)?",o:["Il flusso del campo attraverso una superficie chiusa è Q/ε₀","Il campo è sempre nullo","Il potenziale è sempre costante","La carica si concentra al centro"],a:0,e:"Φ(E) = Q/ε₀, dove Q è la carica contenuta nella superficie."},
{id:"fl8_029",t:"fl8",p:"8.4",l:3,q:"In condizioni elettrostatiche, i punti di un conduttore…",o:["hanno tutti lo stesso potenziale","hanno potenziali diversi","hanno potenziale nullo","hanno campo massimo"],a:0,e:"È il potenziale del conduttore: se ci fossero differenze di potenziale, le cariche si muoverebbero."},
{id:"fl8_030",t:"fl8",p:"8.5",l:1,q:"Qual è l'unità di misura della capacità?",o:["Farad (C/V)","Coulomb","Volt","Henry"],a:0,e:"C = Q/V. 1 F è la capacità di un conduttore che con 1 C assume il potenziale di 1 V. Si usano spesso µF, nF e pF."},
{id:"fl8_031",t:"fl8",p:"8.5.1",l:2,q:"Da che cosa dipende la capacità di un condensatore piano?",o:["Da ε, superficie delle armature e loro distanza: C = εS/d","Solo dalla carica","Solo dalla tensione","Dalla corrente che lo attraversa"],a:0,e:"La capacità aumenta con la superficie e con la costante dielettrica, diminuisce con la distanza tra le armature."},
{id:"fl8_032",t:"fl8",p:"8.5.1",l:2,q:"Se si raddoppia la distanza tra le armature di un condensatore piano, la capacità…",o:["si dimezza","raddoppia","resta uguale","quadruplica"],a:0,e:"C = εS/d: è inversamente proporzionale alla distanza."},
{id:"fl8_033",t:"fl8",p:"8.5",l:3,q:"Un condensatore da 2 µF è caricato a 10 V. Che carica ha?",o:["2·10⁻⁵ C","2·10⁻⁶ C","5·10⁻⁶ C","20 C"],a:0,e:"Q = C·ΔV = 2·10⁻⁶ · 10 = 2·10⁻⁵ C."},
{id:"fl8_034",t:"fl8",p:"8.5.2",l:3,q:"Che lavoro serve per caricare un condensatore da 4 µF a 10 V?",o:["2·10⁻⁴ J","4·10⁻⁴ J","4·10⁻⁵ J","2·10⁻⁵ J"],a:0,e:"L = ½C·ΔV² = ½ · 4·10⁻⁶ · 100 = 2·10⁻⁴ J."},
{id:"fl8_035",t:"fl8",p:"8.5.1",l:3,q:"In quale unità si misura la costante dielettrica ε nel SI?",o:["Farad al metro (F/m)","Farad","È adimensionale","Volt al metro"],a:0,e:"Da C = εS/d si ottiene ε = C·d/S: farad · m / m² = F/m."},
{id:"fl8_036",t:"fl8",p:"8.5.3",l:1,q:"Quanto vale la carica dell'elettrone?",o:["−1,6·10⁻¹⁹ C","+1,6·10⁻¹⁹ C","−9,1·10⁻³¹ C","−1 C"],a:0,e:"È la carica elementare (con segno negativo); quella del protone ha lo stesso valore, positivo."},
{id:"fl8_037",t:"fl8",p:"8.5.3",l:2,q:"Che cosa significa che la carica elettrica è quantizzata?",o:["Che ogni carica è un multiplo intero della carica elementare","Che la carica può avere qualunque valore","Che la carica si conserva sempre","Che la carica è un vettore"],a:0,e:"Non esistono cariche più piccole di e (1,6·10⁻¹⁹ C) e ogni carica ne è un multiplo intero."},
{id:"fl8_038",t:"fl8",p:"8.5.2",l:2,q:"A quanti joule corrisponde 1 elettronvolt?",o:["1,6·10⁻¹⁹ J","1 J","1,6·10¹⁹ J","9·10⁹ J"],a:0,e:"È l'energia acquistata da un elettrone che attraversa una d.d.p. di 1 V: 1,6·10⁻¹⁹ C · 1 V."},
{id:"fl8_039",t:"fl8",p:"8.5.4",l:3,q:"Quali sono le caratteristiche tipiche dell'impulso di un pacemaker?",o:["2–5 V, pochi microampere, circa 0,5 ms","220 V, 1 A, 1 s","0,1 V, 10 A, 1 min","1000 V, pochi mA, 10 ms"],a:0,e:"Il pacemaker misura il potenziale del cuore e, se il segnale naturale manca o è in ritardo, invia un impulso che stimola la contrazione."},
{id:"fl8_040",t:"fl8",p:"8.5.4",l:3,q:"Dove nascono normalmente gli impulsi elettrici del cuore?",o:["Nel nodo senoatriale, nell'atrio destro","Nel ventricolo sinistro","Nell'aorta","Nella valvola mitrale"],a:0,e:"Se il nodo SA o il sistema di conduzione funzionano male, il ritmo può diventare troppo lento (bradicardia) e serve il pacemaker."},
{id:"fl8_041",t:"fl8",p:"8.1",l:4,q:"Due cariche si respingono con 9 N a 1 m nel vuoto. Che forza c'è se si porta la distanza a 3 m?",o:["1 N","3 N","27 N","81 N"],a:0,e:"La forza scala con 1/r²: 9 N / 9 = 1 N."},
{id:"fl8_042",t:"fl8",p:"8.5.2",l:4,q:"Un elettrone viene accelerato da una d.d.p. di 100 V. Quanta energia acquista?",o:["100 eV = 1,6·10⁻¹⁷ J","1 eV","1,6·10⁻¹⁹ J","100 J"],a:0,e:"L = e·ΔV = 100 eV = 100 · 1,6·10⁻¹⁹ J = 1,6·10⁻¹⁷ J."},
{id:"fl8_043",t:"fl8",p:"8.5.1",l:4,q:"Un condensatore piano è collegato a una tensione costante. Si inserisce un dielettrico con εᵣ = 4 tra le armature. Che cosa succede alla carica accumulata?",o:["Quadruplica","Si riduce a ¼","Resta uguale","Raddoppia"],a:0,e:"La capacità C = ε₀εᵣS/d diventa 4 volte maggiore; con ΔV costante, Q = C·ΔV quadruplica."},
{id:"fl8_044",t:"fl8",p:"8.2",l:4,q:"Il campo elettrico di una carica puntiforme a 1 m vale 900 N/C. Quanto vale a 3 m?",o:["100 N/C","300 N/C","2700 N/C","8100 N/C"],a:0,e:"E è proporzionale a 1/r²: 900/9 = 100 N/C."},
{id:"fl8_045",t:"fl8",p:"8.4",l:4,q:"Perché in un conduttore carico in equilibrio la carica si trova tutta sulla superficie?",o:["Perché il campo interno è nullo (teorema di Gauss)","Perché le cariche sono attratte dall'aria","Perché il conduttore è isolante all'interno","Perché la gravità le spinge fuori"],a:0,e:"Se il campo all'interno è nullo, il flusso attraverso qualsiasi superficie interna è nullo, quindi dentro non c'è carica netta."},
{id:"fl8_046",t:"fl8",p:"8.1.2",l:1,q:"Quale forza è sempre attrattiva?",o:["La forza gravitazionale","La forza di Coulomb","Entrambe","Nessuna delle due"],a:0,e:"La forza elettrostatica può essere attrattiva o repulsiva a seconda del segno delle cariche."},
{id:"fl8_047",t:"fl8",p:"8.1.2",l:2,q:"Quale delle due forze dipende dal mezzo che separa i corpi?",o:["La forza di Coulomb","La forza gravitazionale","Entrambe","Nessuna"],a:0,e:"La forza elettrica dipende dal dielettrico tra le cariche; la gravità no. Entrambe però scalano con 1/r²."},
{id:"fl8_048",t:"fl8",p:"8.3",l:1,q:"Come si definisce l'energia potenziale elettrica di una carica q in un punto P?",o:["Il lavoro da compiere contro le forze del campo per portare q dall'infinito a P","La forza su q diviso la distanza","Il campo diviso la carica","La carica per la distanza"],a:0,e:"Si misura in joule: Ep = K₀·Q·q/r."},
{id:"fl8_049",t:"fl8",p:"8.3",l:2,q:"Quando l'energia potenziale elettrica di due cariche è negativa?",o:["Quando le cariche sono discordi (segno opposto)","Quando sono concordi","Quando sono molto lontane","Mai"],a:0,e:"Ep = K₀Qq/r è positiva per cariche concordi e negativa per cariche discordi."},
{id:"fl8_050",t:"fl8",p:"8.3",l:3,q:"Se la distanza tra due cariche si dimezza, la loro energia potenziale elettrica (in modulo)…",o:["raddoppia","quadruplica","si dimezza","resta uguale"],a:0,e:"Ep è inversamente proporzionale alla distanza r (non al suo quadrato)."},
{id:"fl8_051",t:"fl8",p:"8.3.2",l:2,q:"Che segno ha il lavoro del campo quando una carica positiva va da un punto a potenziale maggiore a uno a potenziale minore?",o:["Positivo","Negativo","Nullo","Dipende dal percorso"],a:0,e:"L = q(V_A − V_B) con q > 0 e V_A > V_B: lavoro positivo. Le cariche positive si muovono spontaneamente verso potenziali minori."},
{id:"fl8_052",t:"fl8",p:"8.3.2",l:3,q:"Quanto lavoro compie il campo su una carica di 2 C che passa da un punto a 10 V a uno a 15 V?",o:["−10 J","+10 J","+50 J","−50 J"],a:0,e:"L = q(V_A − V_B) = 2 · (10 − 15) = −10 J: bisogna compiere lavoro contro il campo."},
{id:"fl8_053",t:"fl8",p:"8.5",l:2,q:"A parità di potenziale, quale conduttore accumula più carica?",o:["Quello con capacità maggiore","Quello con capacità minore","Accumulano la stessa carica","Dipende dal materiale"],a:0,e:"Q = C·V; la capacità aumenta con l'area della superficie del conduttore e dipende anche dalla sua forma."},
{id:"fl8_054",t:"fl8",p:"8.5.3",l:3,q:"Che cosa afferma il principio di conservazione della carica?",o:["In un sistema isolato la carica totale resta costante","La carica di un corpo non cambia mai","La carica si trasforma in energia","Le cariche positive sono sempre uguali alle negative"],a:0,e:"Le cariche si possono spostare da un corpo all'altro ma la somma algebrica in un sistema isolato non cambia; la carica è inoltre uno scalare."},
{id:"fl8_055",t:"fl8",p:"8.5.4",l:2,q:"Di quali parti è composto un pacemaker?",o:["Un generatore (batteria e circuito) e degli elettrocateteri","Solo una batteria","Un condensatore e una valvola","Un magnete e una bobina"],a:0,e:"Gli elettrocateteri portano gli impulsi al cuore e ne rilevano l'attività elettrica."},
{id:"fl9_001",t:"fl9",p:"9.1",l:1,q:"Qual è l'unità di misura dell'intensità di corrente?",o:["Ampere (C/s)","Volt","Ohm","Coulomb"],a:0,e:"i = ΔQ/Δt: 1 A significa 1 C che attraversa la sezione ogni secondo. È una grandezza fondamentale del SI."},
{id:"fl9_002",t:"fl9",p:"9.1",l:1,q:"Per convenzione, il verso della corrente è quello in cui si muovono…",o:["le cariche positive","gli elettroni","i neutroni","le cariche negative"],a:0,e:"Nei metalli in realtà si muovono gli elettroni, in verso opposto alla corrente convenzionale."},
{id:"fl9_003",t:"fl9",p:"9.1",l:2,q:"In un conduttore metallico con VA > VB, come si muovono gli elettroni?",o:["Da B verso A, mentre la corrente va da A a B","Da A verso B, come la corrente","Non si muovono","Avanti e indietro"],a:0,e:"Il campo va da A a B; gli elettroni (negativi) si muovono in verso opposto, da B ad A."},
{id:"fl9_004",t:"fl9",p:"9.1",l:2,q:"In 10 s attraversano una sezione 5 C di carica. Qual è l'intensità di corrente?",o:["0,5 A","50 A","2 A","15 A"],a:0,e:"i = ΔQ/Δt = 5/10 = 0,5 A."},
{id:"fl9_005",t:"fl9",p:"9.1",l:3,q:"Che cosa caratterizza una corrente continua?",o:["Intensità e verso costanti","Verso che si inverte periodicamente","Intensità che varia in modo sinusoidale","Cariche ferme"],a:0,e:"La corrente alternata invece cambia periodicamente verso."},
{id:"fl9_006",t:"fl9",p:"9.2.1",l:1,q:"Che cosa afferma la prima legge di Ohm?",o:["ΔV = R·i","R = ρl/S","P = R·i²","i = Q·t"],a:0,e:"Nei conduttori metallici la corrente è proporzionale alla d.d.p.; la costante è la resistenza R."},
{id:"fl9_007",t:"fl9",p:"9.2.1",l:1,q:"Una lampadina ha resistenza 100 Ω e ai suoi capi ci sono 2 V e 8 V. Che corrente la attraversa?",o:["60 mA","80 mA","600 mA","6 A"],a:0,e:"ΔV = 8 − 2 = 6 V; i = ΔV/R = 6/100 = 0,06 A = 60 mA."},
{id:"fl9_008",t:"fl9",p:"9.2.2",l:2,q:"Secondo la seconda legge di Ohm, se la lunghezza di un filo raddoppia la sua resistenza…",o:["raddoppia","si dimezza","quadruplica","resta uguale"],a:0,e:"R = ρ·l/S: è direttamente proporzionale alla lunghezza."},
{id:"fl9_009",t:"fl9",p:"9.2.2",l:2,q:"Se la sezione di un filo raddoppia (stessa lunghezza e materiale), la resistenza…",o:["si dimezza","raddoppia","quadruplica","resta uguale"],a:0,e:"R è inversamente proporzionale alla sezione S."},
{id:"fl9_010",t:"fl9",p:"9.2.2",l:2,q:"Come varia la resistenza di un metallo all'aumentare della temperatura?",o:["Aumenta","Diminuisce","Resta uguale","Si annulla"],a:0,e:"Nei conduttori di prima classe la resistenza cresce con la temperatura; nei semiconduttori invece diminuisce."},
{id:"fl9_011",t:"fl9",p:"9.2.2",l:3,q:"Che cosa succede a un superconduttore sotto la sua temperatura critica?",o:["La resistenza diventa quasi nulla","Diventa isolante","La resistenza raddoppia","Si magnetizza sempre"],a:0,e:"La corrente può circolare a lungo anche senza generatore."},
{id:"fl9_012",t:"fl9",p:"9.2.2",l:3,q:"Quale tra questi materiali ha la resistività più bassa?",o:["Argento","Ferro","Silicio","Vetro"],a:0,e:"In ordine crescente di resistività il libro mette per primo l'argento, poi rame, alluminio, platino, ferro…"},
{id:"fl9_013",t:"fl9",p:"9.2.2",l:3,q:"Quale unità ha la resistività?",o:["Ω·m","Ω/m","Ω","S"],a:0,e:"Da R = ρl/S: ρ = R·S/l, quindi Ω·m²/m = Ω·m."},
{id:"fl9_014",t:"fl9",p:"9.3",l:1,q:"Come si chiama il riscaldamento di un conduttore percorso da corrente?",o:["Effetto Joule","Effetto Doppler","Effetto fotoelettrico","Effetto Volta"],a:0,e:"L'energia elettrica si trasforma in calore: E = R·i²·Δt."},
{id:"fl9_015",t:"fl9",p:"9.3",l:2,q:"Una lampadina da 75 W è collegata a 220 V. Che corrente la attraversa?",o:["Circa 0,34 A","Circa 2,9 A","Circa 16.500 A","Circa 3,4 A"],a:0,e:"P = ΔV·i ⇒ i = 75/220 ≈ 0,34 A."},
{id:"fl9_016",t:"fl9",p:"9.3",l:2,q:"Quale di queste espressioni NON dà la potenza dissipata per effetto Joule?",o:["R/i²","R·i²","ΔV·i","ΔV²/R"],a:0,e:"P = R·i² = ΔV·i = ΔV²/R; R/i² non ha le dimensioni di una potenza."},
{id:"fl9_017",t:"fl9",p:"9.3",l:3,q:"Una resistenza di 0,10 Ω con 0,2 V ai capi per 10⁻² s. Quanta energia dissipa?",o:["4·10⁻³ J","4·10⁻² J","2·10⁻³ J","0,4 J"],a:0,e:"E = ΔV²·t/R = 0,04 · 0,01 / 0,1 = 4·10⁻³ J."},
{id:"fl9_018",t:"fl9",p:"9.3",l:3,q:"Se la corrente in una resistenza raddoppia, la potenza dissipata…",o:["quadruplica","raddoppia","si dimezza","resta uguale"],a:0,e:"P = R·i²: dipende dal quadrato della corrente."},
{id:"fl9_019",t:"fl9",p:"9.4",l:1,q:"Come va collegato un amperometro?",o:["In serie","In parallelo","Indifferentemente","Solo al generatore"],a:0,e:"L'amperometro deve essere attraversato dalla corrente che misura; il voltmetro invece si collega in parallelo."},
{id:"fl9_020",t:"fl9",p:"9.4",l:2,q:"Quando la forza elettromotrice di un generatore coincide con la d.d.p. ai suoi capi?",o:["A circuito aperto","Sempre","Quando la corrente è massima","Mai"],a:0,e:"Con il circuito chiuso c'è una caduta r·i sulla resistenza interna: f.e.m. = ΔV + r·i."},
{id:"fl9_021",t:"fl9",p:"9.4",l:2,q:"In che unità si misura la forza elettromotrice?",o:["Volt","Newton","Ampere","Joule"],a:0,e:"È un lavoro diviso una carica (J/C), quindi volt, anche se si chiama «forza»."},
{id:"fl9_022",t:"fl9",p:"9.4.2",l:3,q:"Un generatore con f.e.m. 12 V e resistenza interna 1 Ω alimenta una resistenza di 5 Ω. Che corrente circola?",o:["2 A","2,4 A","12 A","0,5 A"],a:0,e:"i = f.e.m./(R + r) = 12/6 = 2 A."},
{id:"fl9_023",t:"fl9",p:"9.4.2",l:3,q:"Nello stesso circuito (f.e.m. 12 V, r = 1 Ω, R = 5 Ω), quale d.d.p. c'è ai capi del generatore?",o:["10 V","12 V","2 V","6 V"],a:0,e:"ΔV = f.e.m. − r·i = 12 − 1·2 = 10 V, uguale a R·i = 5·2."},
{id:"fl9_024",t:"fl9",p:"9.4.1",l:1,q:"Come si calcola la resistenza equivalente di due resistenze in serie?",o:["Req = R₁ + R₂","1/Req = 1/R₁ + 1/R₂","Req = R₁·R₂","Req = R₁ − R₂"],a:0,e:"In serie la resistenza equivalente è la somma ed è maggiore di ciascuna resistenza."},
{id:"fl9_025",t:"fl9",p:"9.4.1",l:2,q:"Due resistenze da 6 Ω in parallelo. Quanto vale la resistenza equivalente?",o:["3 Ω","12 Ω","6 Ω","36 Ω"],a:0,e:"1/Req = 1/6 + 1/6 = 2/6 ⇒ Req = 3 Ω, minore di ciascuna."},
{id:"fl9_026",t:"fl9",p:"9.4.1",l:2,q:"Come si calcola la capacità equivalente di due condensatori in parallelo?",o:["Ceq = C₁ + C₂","1/Ceq = 1/C₁ + 1/C₂","Ceq = C₁·C₂","Ceq = C₁ − C₂"],a:0,e:"Per i condensatori vale l'opposto delle resistenze: in parallelo si sommano, in serie si sommano i reciproci."},
{id:"fl9_027",t:"fl9",p:"9.4.1",l:3,q:"Tre resistenze in parallelo: 200 Ω, 200 Ω e 100 Ω. Quanto vale la resistenza equivalente?",o:["50 Ω","500 Ω","100 Ω","166,7 Ω"],a:0,e:"1/Req = 1/200 + 1/200 + 1/100 = 4/200 ⇒ Req = 50 Ω."},
{id:"fl9_028",t:"fl9",p:"9.4.1",l:3,q:"Quattro condensatori da 100 pF: come si collegano per ottenere 25 pF?",o:["Tutti in serie","Tutti in parallelo","Due in serie e due in parallelo","Non è possibile"],a:0,e:"In serie 1/Ceq = 4/100 ⇒ 25 pF. In parallelo si otterrebbero 400 pF."},
{id:"fl9_029",t:"fl9",p:"9.4.1",l:3,q:"La capacità equivalente di più condensatori in serie è…",o:["minore di ciascuna capacità","maggiore di ciascuna capacità","uguale alla somma","uguale alla più grande"],a:0,e:"In serie si sommano i reciproci, quindi il risultato è più piccolo della capacità minore."},
{id:"fl9_030",t:"fl9",p:"9.4.1",l:1,q:"Due elementi collegati in serie hanno sempre…",o:["la stessa corrente","la stessa d.d.p.","la stessa resistenza","la stessa potenza"],a:0,e:"In serie sono attraversati dalla stessa corrente; in parallelo hanno la stessa d.d.p."},
{id:"fl9_031",t:"fl9",p:"9.4.3",l:2,q:"Che cosa afferma la prima legge di Kirchhoff?",o:["In ogni nodo la somma delle correnti entranti è uguale a quella delle uscenti","In una maglia la somma delle f.e.m. è nulla","ΔV = R·i","La corrente è uguale ovunque"],a:0,e:"È la conservazione della carica nei nodi. La seconda legge riguarda le maglie: somma delle f.e.m. = somma delle d.d.p."},
{id:"fl9_032",t:"fl9",p:"9.4.3",l:2,q:"Due punti collegati solo da un filo (senza altri elementi in mezzo)…",o:["hanno lo stesso potenziale","hanno sempre potenziali diversi","hanno potenziale nullo","hanno la d.d.p. del generatore"],a:0,e:"I fili si considerano a resistenza nulla, quindi su di essi non c'è caduta di potenziale."},
{id:"fl9_033",t:"fl9",p:"9.4.2",l:3,q:"Un generatore ideale da 10 V alimenta in serie R₁ = 100 Ω e R₂ = 400 Ω. Quale d.d.p. c'è ai capi di R₁?",o:["2 V","8 V","10 V","5 V"],a:0,e:"i = 10/500 = 0,02 A; ΔV₁ = 100 · 0,02 = 2 V (e 8 V su R₂)."},
{id:"fl9_034",t:"fl9",p:"9.4.3",l:3,q:"Due resistenze da 10 Ω e 20 Ω sono in parallelo a 20 V. Qual è la corrente totale erogata?",o:["3 A","2 A","0,67 A","1 A"],a:0,e:"Hanno entrambe 20 V: i₁ = 2 A, i₂ = 1 A. Per Kirchhoff la corrente totale è 3 A."},
{id:"fl9_035",t:"fl9",p:"9.5",l:1,q:"Perché l'acqua distillata non conduce corrente?",o:["Perché non contiene ioni","Perché è troppo densa","Perché ha resistenza nulla","Perché è un metallo"],a:0,e:"Diventa conduttrice quando contiene ioni, per esempio sciogliendovi un elettrolita."},
{id:"fl9_036",t:"fl9",p:"9.5",l:2,q:"Liquidi e gas seguono la legge di Ohm?",o:["No, non sono conduttori ohmici","Sì, sempre","Solo i gas","Solo i liquidi"],a:0,e:"Sono conduttori di seconda specie; la loro conducibilità dipende dalla concentrazione e dalla mobilità degli ioni."},
{id:"fl9_037",t:"fl9",p:"9.5",l:2,q:"Quando un gas conduce la corrente?",o:["Solo se è ionizzato","Sempre","Mai","Solo se è caldo"],a:0,e:"Si ionizza bombardandolo con agenti ionizzanti: raggi X, elettroni veloci, particelle alfa."},
{id:"fl9_038",t:"fl9",p:"9.5",l:3,q:"Che cosa sono i raggi catodici?",o:["Elettroni emessi dal catodo in un gas rarefatto","Radiazioni gamma","Protoni emessi dall'anodo","Ioni positivi"],a:0,e:"Con una d.d.p. elevata in un'ampolla con gas molto rarefatto, il catodo emette elettroni a circa 1/3 della velocità della luce."},
{id:"fl9_039",t:"fl9",p:"9.5",l:3,q:"Da che cosa dipende la conducibilità di una soluzione elettrolitica?",o:["Dalla concentrazione dell'elettrolita e dalla mobilità degli ioni","Solo dal volume della soluzione","Dal colore della soluzione","Dalla pressione atmosferica"],a:0,e:"Cresce con la concentrazione di un elettrolita forte e con la mobilità degli ioni."},
{id:"fl9_040",t:"fl9",p:"9.4.1",l:4,q:"Tre resistenze da 30 Ω: due in parallelo, e il gruppo in serie con la terza. Qual è la resistenza equivalente?",o:["45 Ω","90 Ω","10 Ω","60 Ω"],a:0,e:"Il parallelo di due da 30 Ω vale 15 Ω; in serie con 30 Ω: 45 Ω."},
{id:"fl9_041",t:"fl9",p:"9.3",l:4,q:"Un ferro da stiro da 1000 W resta acceso per 2 ore. Quanta energia consuma?",o:["2 kWh = 7,2·10⁶ J","2000 J","500 Wh","7,2·10³ J"],a:0,e:"E = P·t = 1 kW · 2 h = 2 kWh = 2 · 3,6·10⁶ J = 7,2·10⁶ J."},
{id:"fl9_042",t:"fl9",p:"9.2.2",l:4,q:"Un filo ha resistenza 4 Ω. Si raddoppia la lunghezza e si raddoppia anche il diametro. Quale nuova resistenza ha?",o:["2 Ω","4 Ω","8 Ω","1 Ω"],a:0,e:"Diametro doppio ⇒ sezione 4 volte più grande. R = ρl/S diventa 4 · 2/4 = 2 Ω."},
{id:"fl9_043",t:"fl9",p:"9.4.3",l:4,q:"Due lampadine uguali sono collegate in parallelo a una batteria. Se una si brucia (circuito aperto), l'altra…",o:["resta accesa con la stessa luminosità","si spegne","brilla di più","brilla di meno"],a:0,e:"In parallelo ogni lampadina ha ai capi la stessa d.d.p. della batteria (generatore ideale), indipendentemente dall'altra."},
{id:"fl9_044",t:"fl9",p:"9.4.2",l:4,q:"Una batteria ha f.e.m. 9 V. A circuito chiuso il voltmetro ai suoi capi segna 8 V con una corrente di 0,5 A. Quanto vale la resistenza interna?",o:["2 Ω","1 Ω","0,5 Ω","16 Ω"],a:0,e:"f.e.m. − ΔV = r·i ⇒ 1 V = r · 0,5 A ⇒ r = 2 Ω."},
{id:"fl9_045",t:"fl9",p:"9.2.1",l:1,q:"Qual è l'unità di misura della resistenza elettrica?",o:["Ohm (Ω = V/A)","Volt","Ampere","Siemens·metro"],a:0,e:"R = ΔV/i: 1 Ω è la resistenza di un conduttore attraversato da 1 A quando ai suoi capi c'è 1 V."},
{id:"fl9_046",t:"fl9",p:"9.2.1",l:2,q:"Ai capi di una resistenza da 20 Ω c'è una d.d.p. di 5 V. Che corrente passa?",o:["0,25 A","4 A","100 A","25 A"],a:0,e:"i = ΔV/R = 5/20 = 0,25 A."},
{id:"fl10_001",t:"fl10",p:"10.1",l:1,q:"Che cosa succede se si spezza a metà una calamita?",o:["Si ottengono due calamite, ciascuna con polo nord e polo sud","Si ottengono un polo nord e un polo sud isolati","La calamita perde il magnetismo","Si ottengono due poli nord"],a:0,e:"Non è possibile isolare un monopolo magnetico: ogni pezzo è ancora un dipolo."},
{id:"fl10_002",t:"fl10",p:"10.1",l:1,q:"Chi osservò per primo che un filo percorso da corrente genera un campo magnetico?",o:["Oersted","Faraday","Coulomb","Ohm"],a:0,e:"Nel 1820 Oersted scoprì il legame tra corrente elettrica e magnetismo."},
{id:"fl10_003",t:"fl10",p:"10.1",l:2,q:"Come sono le linee di forza del campo magnetico?",o:["Sempre chiuse","Sempre aperte","Rette che vanno all'infinito","Escono da un monopolo"],a:0,e:"Escono da un polo e rientrano nell'altro dello stesso corpo. Quelle del campo elettrico invece in genere sono aperte."},
{id:"fl10_004",t:"fl10",p:"10.1",l:2,q:"Il campo magnetico è conservativo?",o:["No, mai: non si può definire un'energia potenziale magnetica","Sì, sempre","Solo se non è generato da correnti","Solo nel vuoto"],a:0,e:"La chiusura delle linee di campo implica che non è conservativo."},
{id:"fl10_005",t:"fl10",p:"10.1",l:3,q:"Una carica elettrica in movimento genera…",o:["sia un campo elettrico sia un campo magnetico","solo un campo elettrico","solo un campo magnetico","nessun campo"],a:0,e:"Una carica stazionaria genera solo un campo elettrico; se si muove genera anche un campo magnetico."},
{id:"fl10_006",t:"fl10",p:"10.1.1",l:1,q:"Qual è l'unità di misura del campo magnetico B nel SI?",o:["Tesla","Weber","Henry","Gauss"],a:0,e:"1 T = 1 Wb/m²; il weber (V·s) è l'unità del flusso magnetico, l'henry dell'induttanza."},
{id:"fl10_007",t:"fl10",p:"10.1.2",l:1,q:"Quando una carica in moto in un campo magnetico non subisce alcuna deviazione?",o:["Quando si muove parallelamente al campo","Quando si muove perpendicolarmente al campo","Mai","Quando è positiva"],a:0,e:"F = q·v·B·sen θ: con θ = 0° la forza di Lorentz è nulla."},
{id:"fl10_008",t:"fl10",p:"10.1.2",l:2,q:"Che lavoro compie la forza di Lorentz su una carica?",o:["Nessuno, perché è sempre perpendicolare alla velocità","q·v·B","Dipende dal segno della carica","Sempre negativo"],a:0,e:"Cambia solo la direzione della velocità, non il suo modulo: l'energia cinetica resta costante."},
{id:"fl10_009",t:"fl10",p:"10.1.2",l:2,q:"Una carica entra con velocità perpendicolare a un campo magnetico uniforme. Che moto compie?",o:["Moto circolare uniforme","Moto rettilineo uniforme","Moto uniformemente accelerato","Moto parabolico"],a:0,e:"La forza di Lorentz fa da forza centripeta; il raggio vale r = mv/(qB)."},
{id:"fl10_010",t:"fl10",p:"10.1.2",l:2,q:"Un protone (1,6·10⁻¹⁹ C) a 2 m/s entra perpendicolarmente in un campo di 1 T. Quanto vale la forza su di lui?",o:["3,2·10⁻¹⁹ N","1,6·10⁻¹⁹ N","0,8·10⁻¹⁹ N","3,2 N"],a:0,e:"F = q·v·B = 1,6·10⁻¹⁹ · 2 · 1 = 3,2·10⁻¹⁹ N."},
{id:"fl10_011",t:"fl10",p:"10.1.2",l:3,q:"Se al posto del protone entra un elettrone nelle stesse condizioni, che cosa cambia nel verso di rotazione?",o:["Ruota in verso opposto, perché ha carica opposta","Ruota nello stesso verso","Non ruota","Si muove in linea retta"],a:0,e:"Cambiando il segno della carica cambia il verso della forza; la massa diversa cambia anche raggio e periodo."},
{id:"fl10_012",t:"fl10",p:"10.1.2",l:3,q:"Due particelle con la stessa carica girano nello stesso campo su circonferenze di uguale raggio. Se mA = 2mB, allora…",o:["vA = vB/2","vA = 2vB","vA = vB","vA = 4vB"],a:0,e:"r = mv/(qB) uguale per entrambe ⇒ mA·vA = mB·vB ⇒ vA = vB/2."},
{id:"fl10_013",t:"fl10",p:"10.1.2",l:3,q:"Una carica entra in un campo magnetico con una velocità che ha una componente parallela e una perpendicolare al campo. Che traiettoria segue?",o:["Un'elica (moto a spirale)","Una circonferenza","Una retta","Una parabola"],a:0,e:"La componente parallela resta costante (trascinamento), quella perpendicolare produce un moto circolare: insieme danno una spirale."},
{id:"fl10_014",t:"fl10",p:"10.1.3",l:1,q:"Come sono le linee del campo magnetico generato da un filo rettilineo percorso da corrente?",o:["Circonferenze concentriche intorno al filo","Rette parallele al filo","Rette che escono dal filo","Spirali"],a:0,e:"Il verso si trova con la mano destra: pollice nel verso della corrente, le dita indicano il verso di B."},
{id:"fl10_015",t:"fl10",p:"10.1.3",l:2,q:"Secondo la legge di Biot-Savart, se la distanza dal filo raddoppia il campo magnetico…",o:["si dimezza","diventa ¼","raddoppia","resta uguale"],a:0,e:"B = μ₀μᵣ·i/(2πr): è inversamente proporzionale alla distanza (non al suo quadrato)."},
{id:"fl10_016",t:"fl10",p:"10.1.4",l:2,q:"Due fili paralleli sono percorsi da correnti nello stesso verso. Che cosa succede?",o:["Si attraggono","Si respingono","Non interagiscono","Ruotano"],a:0,e:"Correnti concordi si attraggono, correnti discordi si respingono."},
{id:"fl10_017",t:"fl10",p:"10.1.3",l:2,q:"Com'è il campo magnetico all'interno di un solenoide percorso da corrente?",o:["Uniforme","Nullo","Circolare","Uguale a quello esterno"],a:0,e:"All'interno B = μ₀·n·i/l è uniforme; all'esterno è trascurabile."},
{id:"fl10_018",t:"fl10",p:"10.1.4",l:3,q:"Quando è massima la forza su un filo percorso da corrente immerso in un campo magnetico?",o:["Quando il filo è perpendicolare al campo","Quando è parallelo al campo","Quando forma 45°","Non dipende dall'angolo"],a:0,e:"F = i·l ∧ B: il prodotto vettoriale è massimo per un angolo di 90°."},
{id:"fl10_019",t:"fl10",p:"10.1.3",l:3,q:"Come varia il campo all'interno di un solenoide se si raddoppia il numero di spire (stessa lunghezza e corrente)?",o:["Raddoppia","Si dimezza","Quadruplica","Resta uguale"],a:0,e:"B = μ₀·n·i/l è proporzionale al numero di spire per unità di lunghezza."},
{id:"fl10_020",t:"fl10",p:"10.1.3",l:3,q:"In che unità si misura la permeabilità magnetica?",o:["Henry al metro (H/m)","Farad al metro","Tesla","È adimensionale"],a:0,e:"μ = μ₀μᵣ si misura in H/m; la permeabilità relativa μᵣ è invece adimensionale."},
{id:"fl10_021",t:"fl10",p:"10.2",l:1,q:"Quando si genera una corrente indotta in un circuito?",o:["Quando varia il flusso del campo magnetico concatenato","Sempre, se c'è un magnete vicino","Solo se il magnete è fermo","Solo nei superconduttori"],a:0,e:"Con il magnete fermo non passa corrente: serve una variazione di flusso."},
{id:"fl10_022",t:"fl10",p:"10.2",l:1,q:"Qual è l'unità di misura del flusso magnetico?",o:["Weber (T·m²)","Tesla","Henry","Volt"],a:0,e:"Φ(B) = B·S·cos θ, quindi T·m² = Wb."},
{id:"fl10_023",t:"fl10",p:"10.2.1",l:2,q:"Che cosa afferma la legge di Lenz?",o:["La corrente indotta genera un campo che si oppone alla variazione di flusso che l'ha prodotta","La corrente indotta è sempre nulla","La corrente indotta rafforza la variazione di flusso","Il flusso è sempre costante"],a:0,e:"È il motivo del segno meno nella legge di Faraday-Neumann-Lenz: f.e.m. = −ΔΦ/Δt."},
{id:"fl10_024",t:"fl10",p:"10.2.1",l:2,q:"Il flusso concatenato con una spira varia di 0,6 Wb in 0,2 s. Quanto vale la f.e.m. indotta (in modulo)?",o:["3 V","0,12 V","0,8 V","0,4 V"],a:0,e:"|f.e.m.| = ΔΦ/Δt = 0,6/0,2 = 3 V."},
{id:"fl10_025",t:"fl10",p:"10.2.1",l:3,q:"Avvicinando più velocemente un magnete a una spira, la corrente indotta…",o:["aumenta","diminuisce","resta uguale","si annulla"],a:0,e:"La f.e.m. è inversamente proporzionale al tempo in cui avviene la variazione di flusso."},
{id:"fl10_026",t:"fl10",p:"10.2",l:3,q:"Una spira è in un campo magnetico. Quando il flusso attraverso di essa è nullo?",o:["Quando il campo è parallelo al piano della spira","Quando il campo è perpendicolare al piano della spira","Sempre","Mai"],a:0,e:"Φ = B·S·cos θ, con θ angolo tra B e la normale alla superficie: se B è parallelo al piano, θ = 90° e cos θ = 0."},
{id:"fl10_027",t:"fl10",p:"10.2.2",l:1,q:"Che cosa sono le correnti di Foucault?",o:["Correnti indotte in lamine conduttrici quando varia il flusso magnetico","Correnti nei liquidi","Correnti nei superconduttori","Correnti generate dalle pile"],a:0,e:"Sono dissipative (effetto Joule): nelle macchine elettriche si cerca di ridurle."},
{id:"fl10_028",t:"fl10",p:"10.2.3",l:2,q:"Qual è l'unità di misura dell'induttanza?",o:["Henry","Weber","Tesla","Farad"],a:0,e:"Il flusso autoconcatenato è Φ = L·i, quindi L = Φ/i: weber/ampere = henry."},
{id:"fl10_029",t:"fl10",p:"10.2.3",l:2,q:"Da che cosa dipende l'induttanza di un circuito?",o:["Solo dalla forma e dalle dimensioni del circuito","Dalla corrente che lo attraversa","Dalla tensione applicata","Dalla temperatura"],a:0,e:"Nei solenoidi è particolarmente elevata: L = μ₀n²S/l."},
{id:"fl10_030",t:"fl10",p:"10.2.3",l:3,q:"Perché spegnendo un interruttore a volte si vede una scintilla?",o:["Per un'extracorrente autoindotta dovuta alla brusca diminuzione di corrente","Per l'effetto Joule nella lampadina","Per le correnti di Foucault","Per un cortocircuito"],a:0,e:"L'induttanza si oppone alle variazioni di corrente: una variazione improvvisa genera una f.e.m. autoindotta elevata."},
{id:"fl10_031",t:"fl10",p:"10.2.2",l:3,q:"Perché estrarre rapidamente una lastra di rame da una potente calamita è difficile?",o:["Le correnti di Foucault indotte si oppongono al movimento (legge di Lenz)","Il rame è attratto dalla calamita come il ferro","Per l'attrito con l'aria","Per la forza di gravità"],a:0,e:"Il rame non è ferromagnetico, ma il movimento fa variare il flusso e nascono correnti che frenano il moto."},
{id:"fl10_032",t:"fl10",p:"10.3",l:1,q:"Che corrente si genera in una spira che ruota in un campo magnetico costante?",o:["Una corrente alternata","Una corrente continua","Nessuna corrente","Una corrente costante nel verso"],a:0,e:"Il verso della corrente indotta cambia ogni mezzo giro: la f.e.m. varia in modo sinusoidale."},
{id:"fl10_033",t:"fl10",p:"10.3.1",l:2,q:"Che relazione c'è tra intensità efficace e intensità massima di una corrente alternata?",o:["i_eff = i₀/√2","i_eff = i₀/2","i_eff = i₀·√2","i_eff = i₀"],a:0,e:"L'intensità efficace è quella della corrente continua che dissiperebbe la stessa energia per effetto Joule."},
{id:"fl10_034",t:"fl10",p:"10.3.2",l:2,q:"Che cosa rappresenta l'impedenza Z in un circuito in corrente alternata?",o:["Ciò che la resistenza rappresenta per la corrente continua","La frequenza della corrente","La capacità del circuito","La potenza dissipata"],a:0,e:"f.e.m.₀ = Z·i₀; Z si misura in ohm e dipende da resistori, condensatori, induttori e dalla pulsazione."},
{id:"fl10_035",t:"fl10",p:"10.3.1",l:3,q:"Una corrente alternata ha valore massimo 10 A. Quanto vale circa l'intensità efficace?",o:["7,1 A","5 A","14,1 A","10 A"],a:0,e:"i_eff = 10/√2 ≈ 7,07 A."},
{id:"fl10_036",t:"fl10",p:"10.4",l:1,q:"Quale macchina trasforma energia meccanica in corrente alternata?",o:["L'alternatore","La dinamo","Il motore elettrico","La pila"],a:0,e:"La dinamo produce corrente continua; il motore elettrico fa il contrario (elettrica → meccanica)."},
{id:"fl10_037",t:"fl10",p:"10.4",l:2,q:"Che differenza c'è tra una pila e un accumulatore?",o:["L'accumulatore è reversibile: trasforma energia chimica in elettrica e viceversa","La pila è reversibile","L'accumulatore produce corrente alternata","Nessuna"],a:0,e:"La pila trasforma energia chimica in elettrica ma non viceversa; l'accumulatore è una pila reversibile."},
{id:"fl10_038",t:"fl10",p:"10.4",l:2,q:"Un trasformatore ha 100 spire nel primario e 500 nel secondario. Se il primario è a 220 V, il secondario è a…",o:["1100 V","44 V","220 V","22.000 V"],a:0,e:"V₂/V₁ = n₂/n₁ ⇒ V₂ = 220 · 500/100 = 1100 V."},
{id:"fl10_039",t:"fl10",p:"10.4",l:3,q:"Perché nelle linee elettriche la corrente si trasporta ad alta tensione?",o:["Perché a parità di potenza la corrente è più bassa e le perdite per effetto Joule (∝ i²) sono minori","Perché l'alta tensione è più sicura","Perché la resistenza dei fili aumenta","Perché la corrente alternata non passa a bassa tensione"],a:0,e:"Alzando la tensione si abbassa l'intensità di corrente, e la dissipazione è proporzionale al quadrato della corrente."},
{id:"fl10_040",t:"fl10",p:"10.1.1",l:4,q:"Quali sono le dimensioni del campo magnetico B?",o:["[M][T]⁻²[i]⁻¹","[M][L][T]⁻²","[M][L]²[T]⁻²[i]⁻¹","[L][T]⁻¹"],a:0,e:"B = F/(q·v): [M][L][T]⁻² / ([i][T]·[L][T]⁻¹) = [M][T]⁻²[i]⁻¹."},
{id:"fl10_041",t:"fl10",p:"10.1.3",l:4,q:"Il campo di un filo a 2 cm di distanza vale 4·10⁻⁵ T. Quanto vale a 8 cm?",o:["1·10⁻⁵ T","2,5·10⁻⁶ T","1,6·10⁻⁴ T","2·10⁻⁵ T"],a:0,e:"B è inversamente proporzionale a r: distanza 4 volte maggiore ⇒ campo 4 volte minore."},
{id:"fl10_042",t:"fl10",p:"10.1.2",l:4,q:"Se la velocità di una particella carica che gira in un campo magnetico raddoppia, il raggio della sua traiettoria…",o:["raddoppia","si dimezza","quadruplica","resta uguale"],a:0,e:"r = mv/(qB): è proporzionale alla velocità."},
{id:"fl10_043",t:"fl10",p:"10.4",l:4,q:"Un trasformatore deve ridurre 220 V a 11 V. Se il primario ha 1000 spire, quante ne deve avere il secondario?",o:["50","20.000","200","500"],a:0,e:"n₂ = n₁ · V₂/V₁ = 1000 · 11/220 = 50."},
{id:"fl10_044",t:"fl10",p:"10.2",l:4,q:"Un magnete è fermo vicino a una spira chiusa. Quanta corrente indotta circola?",o:["Nessuna, perché il flusso non varia","Una corrente costante","Una corrente alternata","Dipende dalla forza del magnete"],a:0,e:"Le correnti indotte nascono solo se il flusso concatenato cambia nel tempo."},
{id:"fl10_045",t:"fl10",p:"10.1.1",l:1,q:"Come si stabilisce la direzione del vettore induzione magnetica B in un punto?",o:["È quella secondo cui si dispone un aghetto magnetico posto in quel punto","È sempre verticale","È quella della corrente","È quella del campo elettrico"],a:0,e:"Il verso va dal polo sud al polo nord dell'aghetto."},
{id:"fl10_046",t:"fl10",p:"10.1.1",l:2,q:"A che cosa corrisponde 1 weber?",o:["1 V·s","1 T/m²","1 A·m","1 N/C"],a:0,e:"1 Wb = 1 V·s; 1 T = 1 Wb/m²."},
{id:"fl10_047",t:"fl10",p:"10.1.4",l:2,q:"Due fili paralleli sono percorsi da correnti di verso opposto. Che cosa succede?",o:["Si respingono","Si attraggono","Non interagiscono","Ruotano di 90°"],a:0,e:"Correnti concordi si attraggono, discordi si respingono."},
{id:"fl10_048",t:"fl10",p:"10.1.4",l:3,q:"Se la distanza tra due fili paralleli percorsi da corrente raddoppia, la forza tra loro…",o:["si dimezza","diventa ¼","raddoppia","resta uguale"],a:0,e:"F = μ₀·i₁·i₂·l/(2πd): è inversamente proporzionale alla distanza d."},
{id:"fl10_049",t:"fl10",p:"10.2.2",l:2,q:"Perché nelle macchine elettriche si cerca di ridurre le correnti di Foucault?",o:["Perché dissipano energia per effetto Joule","Perché aumentano il rendimento","Perché sono pericolose per l'uomo","Perché producono raggi X"],a:0,e:"Sono correnti dissipative: trasformano energia in calore."},
{id:"fl10_050",t:"fl10",p:"10.3",l:2,q:"Come si scrive l'intensità di una corrente alternata in funzione del tempo?",o:["i = i₀·sen(ωt)","i = i₀·t","i = i₀/t","i = i₀ costante"],a:0,e:"i₀ è il valore massimo. Se nel circuito vale la legge di Ohm, f.e.m. e corrente sono in fase."},
{id:"fl10_051",t:"fl10",p:"10.3",l:3,q:"Nei circuiti in corrente alternata con induttanze e capacità, f.e.m. e corrente…",o:["possono essere sfasate","sono sempre in fase","sono sempre in opposizione","sono sempre nulle"],a:0,e:"Sono in fase solo se vale la legge di Ohm (circuito puramente resistivo); induttanze e capacità introducono uno sfasamento."},
{id:"fl10_052",t:"fl10",p:"10.3.1",l:2,q:"Come si definisce l'intensità efficace di una corrente alternata?",o:["L'intensità della corrente continua che dissiperebbe la stessa energia per effetto Joule","Il valore massimo della corrente","La media della corrente in un periodo","Il valore minimo della corrente"],a:0,e:"Vale i_eff = i₀/√2 e il calore dissipato è R·i_eff²·Δt."},
{id:"fl10_053",t:"fl10",p:"10.3.2",l:2,q:"In che unità si misura l'impedenza?",o:["Ohm","Henry","Farad","Hertz"],a:0,e:"Z lega i valori massimi: f.e.m.₀ = Z·i₀. È chiamata anche resistenza apparente o reattanza."},
{id:"fl10_054",t:"fl10",p:"10.3.2",l:3,q:"Da che cosa dipende l'impedenza di un circuito in corrente alternata?",o:["Da condensatori, resistori e induttori del circuito e dalla pulsazione della corrente","Solo dalla resistenza","Solo dalla tensione","Dal numero di spire del trasformatore"],a:0,e:"Rappresenta per la corrente alternata quello che la resistenza rappresenta per la continua."},
{id:"fl11_001",t:"fl11",p:"11.1",l:1,q:"Che cosa trasporta un'onda?",o:["Energia, ma non materia","Materia, ma non energia","Materia ed energia","Né materia né energia"],a:0,e:"Un tappo di sughero su uno specchio d'acqua oscilla in verticale ma non viene trasportato."},
{id:"fl11_002",t:"fl11",p:"11.1",l:1,q:"Quale tipo di onda si propaga anche nel vuoto?",o:["Le onde elettromagnetiche","Le onde sonore","Le onde sull'acqua","Le onde elastiche"],a:0,e:"Le onde meccaniche hanno bisogno di un mezzo; quelle elettromagnetiche no (la luce del Sole arriva attraverso lo spazio vuoto)."},
{id:"fl11_003",t:"fl11",p:"11.1",l:2,q:"Il suono nell'aria è un'onda…",o:["longitudinale","trasversale","elettromagnetica","stazionaria"],a:0,e:"Nei gas e all'interno dei liquidi si propagano solo onde longitudinali: zone alternate di compressione e rarefazione."},
