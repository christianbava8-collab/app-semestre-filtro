{id:"bl4_002",t:"bl4",p:"4.1",l:2,q:"Che cosa scoprì Griffith con gli pneumococchi?",o:["Che un \"principio trasformante\" dei batteri morti trasformava quelli vivi", "Che il DNA è a doppia elica", "Il codice genetico", "La replicazione semiconservativa"],a:0,e:"Avery, MacLeod e McCarty dimostrarono poi che il principio era il DNA."},
{id:"bl4_003",t:"bl4",p:"4.1",l:3,q:"Perché inizialmente si pensava che il materiale genetico fossero le proteine?",o:["Perché hanno 20 monomeri diversi e sembravano più adatte a contenere informazione", "Perché il DNA non era stato scoperto", "Perché le proteine si replicano", "Perché il DNA è nel citoplasma"],a:0,e:"Il DNA ha solo 4 nucleotidi."},
{id:"bl4_004",t:"bl4",p:"4.1.1",l:1,q:"Chi propose il modello a doppia elica del DNA nel 1953?",o:["Watson e Crick", "Mendel", "Darwin", "Morgan"],a:0,e:"Si basarono anche sulle immagini a raggi X di Rosalind Franklin."},
{id:"bl4_005",t:"bl4",p:"4.1.1",l:2,q:"Che cosa afferma la regola di Chargaff?",o:["Nel DNA A = T e G = C", "A = G e T = C", "Le basi sono tutte uguali", "Le purine sono il doppio delle pirimidine"],a:0,e:"Ne segue che le purine sono uguali alle pirimidine."},
{id:"bl4_006",t:"bl4",p:"4.1.1",l:2,q:"Che cosa significa che i due filamenti del DNA sono antiparalleli?",o:["Uno corre 5'→3' e l'altro 3'→5'", "Sono identici", "Non sono appaiati", "Sono uno di DNA e uno di RNA"],a:0,e:"Sono tenuti insieme da legami a idrogeno tra basi complementari."},
{id:"bl4_007",t:"bl4",p:"4.2",l:1,q:"Che cos'è la cromatina?",o:["Il complesso di DNA e proteine negli eucarioti", "Un tipo di RNA", "Il nucleolo", "Una proteina del citoscheletro"],a:0,e:"Il DNA dei procarioti non è associato agli istoni."},
{id:"bl4_008",t:"bl4",p:"4.2",l:2,q:"Che cos'è un nucleosoma?",o:["DNA avvolto attorno a un ottamero di istoni", "Un ribosoma nel nucleo", "Un tipo di cromosoma", "Un enzima"],a:0,e:"È l'unità di base della cromatina, come \"perle su un filo\"."},
{id:"bl4_009",t:"bl4",p:"4.2",l:2,q:"Che differenza c'è tra eucromatina ed eterocromatina?",o:["L'eucromatina è meno condensata e attiva nella trascrizione; l'eterocromatina è condensata e poco trascritta", "Sono identiche", "L'eterocromatina è più trascritta", "L'eucromatina è nei mitocondri"],a:0,e:"Il grado di condensazione regola l'espressione genica."},
{id:"bl4_010",t:"bl4",p:"4.2",l:3,q:"Che cosa sono i telomeri?",o:["Sequenze ripetute alle estremità dei cromosomi", "Il punto di unione dei cromatidi", "Geni per l'rRNA", "Proteine del fuso"],a:0,e:"Il centromero è invece il punto di unione dei cromatidi fratelli; la telomerasi allunga i telomeri."},
{id:"bl4_011",t:"bl4",p:"4.3",l:1,q:"Perché la replicazione del DNA si dice semiconservativa?",o:["Ogni nuova doppia elica contiene un filamento vecchio e uno nuovo", "Si conserva metà del DNA", "Si replicano solo metà dei geni", "Il DNA vecchio viene distrutto"],a:0,e:"Lo dimostrarono Meselson e Stahl."},
{id:"bl4_012",t:"bl4",p:"4.3",l:2,q:"Quale enzima apre la doppia elica?",o:["L'elicasi", "La ligasi", "La primasi", "La DNA polimerasi"],a:0,e:"La primasi sintetizza il primer di RNA, la DNA polimerasi allunga il filamento, la ligasi unisce i frammenti."},
{id:"bl4_013",t:"bl4",p:"4.3",l:2,q:"In che direzione la DNA polimerasi sintetizza il nuovo filamento?",o:["5'→3'", "3'→5'", "In entrambe", "Dipende dal gene"],a:0,e:"Per questo un filamento è continuo e l'altro discontinuo."},
{id:"bl4_014",t:"bl4",p:"4.3",l:3,q:"Che cosa sono i frammenti di Okazaki?",o:["Tratti discontinui del filamento lento (lagging)", "Primer di RNA", "Telomeri", "Introni"],a:0,e:"Vengono poi uniti dalla DNA ligasi."},
{id:"bl4_015",t:"bl4",p:"4.3",l:3,q:"Perché serve un primer per la replicazione?",o:["La DNA polimerasi può solo allungare una catena esistente", "Per aprire la doppia elica", "Per unire i frammenti", "Per correggere gli errori"],a:0,e:"Il primer di RNA è sintetizzato dalla primasi."},
{id:"bl4_016",t:"bl4",p:"4.3.1",l:2,q:"Quale attività della DNA polimerasi corregge gli errori durante la replicazione?",o:["L'attività esonucleasica 3'→5' (proofreading)", "L'attività di elicasi", "L'attività di ligasi", "La sintesi di primer"],a:0,e:"Toglie il nucleotide sbagliato appena inserito."},
{id:"bl4_017",t:"bl4",p:"4.3.1",l:3,q:"A che cosa serve il riparo per escissione di nucleotidi?",o:["A rimuovere tratti danneggiati, come i dimeri di timina da raggi UV", "A unire i frammenti di Okazaki", "A sintetizzare RNA", "A duplicare i telomeri"],a:0,e:"Difetti di questo sistema causano lo xeroderma pigmentoso."},
{id:"bl4_018",t:"bl4",p:"4.3.2",l:2,q:"Chi formulò l'ipotesi \"un gene - un enzima\"?",o:["Beadle e Tatum", "Watson e Crick", "Jacob e Monod", "Hershey e Chase"],a:0,e:"Studiando mutanti della muffa Neurospora."},
{id:"bl4_019",t:"bl4",p:"4.3.2",l:3,q:"Come è stata poi corretta l'ipotesi un gene-un enzima?",o:["Un gene - un polipeptide", "Un gene - un amminoacido", "Un enzima - molti geni", "Un gene - un cromosoma"],a:0,e:"Molte proteine sono formate da più catene e non tutte sono enzimi."},
{id:"bl4_020",t:"bl4",p:"4.4",l:1,q:"Che cosa afferma il dogma centrale della biologia?",o:["L'informazione passa da DNA a RNA a proteina", "L'informazione passa dalle proteine al DNA", "Il DNA si traduce direttamente in proteine", "L'RNA non ha funzioni"],a:0,e:"I retrovirus fanno eccezione con la trascrizione inversa."},
{id:"bl4_021",t:"bl4",p:"4.4",l:2,q:"Perché serve un intermediario tra DNA e proteine negli eucarioti?",o:["Il DNA resta nel nucleo, mentre le proteine si sintetizzano nel citoplasma", "Perché il DNA è troppo piccolo", "Perché le proteine sono nel nucleo", "Non serve"],a:0,e:"L'mRNA porta l'informazione ai ribosomi."},
{id:"bl4_022",t:"bl4",p:"4.4.1",l:1,q:"Quali sono le differenze tra RNA e DNA?",o:["L'RNA ha ribosio, un singolo filamento e uracile al posto della timina", "L'RNA ha deossiribosio", "L'RNA ha la timina", "L'RNA è a doppia elica"],a:0,e:"L'RNA è anche più corto e meno stabile."},
{id:"bl4_023",t:"bl4",p:"4.4.1",l:2,q:"Quale RNA trasporta gli amminoacidi al ribosoma?",o:["Il tRNA", "L'mRNA", "L'rRNA", "Il miRNA"],a:0,e:"Ha un anticodone complementare al codone dell'mRNA."},
{id:"bl4_024",t:"bl4",p:"4.4.1",l:2,q:"Qual è la funzione dell'rRNA?",o:["Costituire con le proteine i ribosomi e catalizzare il legame peptidico", "Trasportare amminoacidi", "Portare l'informazione genetica", "Duplicare il DNA"],a:0,e:"È l'RNA più abbondante della cellula."},
{id:"bl4_025",t:"bl4",p:"4.5",l:1,q:"Quale enzima catalizza la trascrizione?",o:["L'RNA polimerasi", "La DNA polimerasi", "La ligasi", "La trascrittasi inversa"],a:0,e:"Si lega al promotore e copia uno solo dei due filamenti (stampo)."},
{id:"bl4_026",t:"bl4",p:"4.5",l:2,q:"Che cos'è il promotore?",o:["La sequenza di DNA dove si lega l'RNA polimerasi per iniziare la trascrizione", "Il primo codone", "Il primer", "La fine del gene"],a:0,e:"Negli eucarioti servono anche fattori di trascrizione."},
{id:"bl4_027",t:"bl4",p:"4.5",l:2,q:"Che cos'è lo splicing?",o:["La rimozione degli introni e l'unione degli esoni nel pre-mRNA", "La sintesi del primer", "La traduzione", "La replicazione"],a:0,e:"Avviene negli eucarioti, che aggiungono anche cappuccio al 5' e coda di poli-A al 3'."},
{id:"bl4_028",t:"bl4",p:"4.5",l:3,q:"Quale filamento di mRNA si ottiene dallo stampo 3'-TACGGA-5'?",o:["5'-AUGCCU-3'", "5'-ATGCCT-3'", "3'-AUGCCU-5'", "5'-UACGGA-3'"],a:0,e:"È complementare e antiparallelo, con U al posto di T."},
{id:"bl4_029",t:"bl4",p:"4.6",l:1,q:"Da quanti nucleotidi è formato un codone?",o:["3", "2", "1", "4"],a:0,e:"Con 4 basi a triplette si ottengono 4³ = 64 codoni."},
{id:"bl4_030",t:"bl4",p:"4.6",l:2,q:"Perché il codice genetico si dice ridondante (degenerato)?",o:["Più codoni codificano lo stesso amminoacido", "Un codone codifica più amminoacidi", "Mancano codoni", "È diverso in ogni specie"],a:0,e:"64 codoni per 20 amminoacidi e 3 segnali di stop."},
{id:"bl4_031",t:"bl4",p:"4.6",l:2,q:"Qual è il codone di inizio?",o:["AUG (metionina)", "UAA", "UGA", "UAG"],a:0,e:"UAA, UAG e UGA sono codoni di stop."},
{id:"bl4_032",t:"bl4",p:"4.6",l:3,q:"Il codice genetico è universale?",o:["Quasi: la principale eccezione è il DNA mitocondriale", "Sì, senza eccezioni", "No, è diverso in ogni specie", "Solo nei procarioti"],a:0,e:"È lo stesso in quasi tutti gli organismi."},
{id:"bl4_033",t:"bl4",p:"4.7",l:1,q:"Dove avviene la traduzione?",o:["Nel citoplasma, sui ribosomi", "Nel nucleo", "Nel nucleolo", "Nel Golgi"],a:0,e:"L'mRNA viene letto in triplette."},
{id:"bl4_034",t:"bl4",p:"4.7",l:2,q:"Che cos'è l'anticodone?",o:["La tripletta del tRNA complementare al codone dell'mRNA", "Il codone di stop", "La tripletta del DNA", "Un amminoacido"],a:0,e:"Garantisce l'inserimento dell'amminoacido corretto."},
{id:"bl4_035",t:"bl4",p:"4.7",l:2,q:"Quali sono le fasi della traduzione?",o:["Inizio, allungamento, terminazione", "Splicing, trascrizione, replicazione", "Profase, metafase, anafase", "Glicolisi e Krebs"],a:0,e:"La terminazione avviene quando il ribosoma incontra un codone di stop."},
{id:"bl4_036",t:"bl4",p:"4.7",l:3,q:"Che cosa riconosce il codone di stop?",o:["Un fattore di rilascio, non un tRNA", "Un tRNA con metionina", "L'RNA polimerasi", "Il primer"],a:0,e:"La catena polipeptidica viene liberata."},
{id:"bl4_037",t:"bl4",p:"4.7.1",l:2,q:"Che funzione hanno le chaperon molecolari?",o:["Aiutano le proteine a ripiegarsi correttamente ed evitano aggregazioni", "Sintetizzano proteine", "Degradano il DNA", "Trasportano mRNA"],a:0,e:"Molte sono proteine da shock termico (Hsp)."},
{id:"bl4_038",t:"bl4",p:"4.7.1",l:3,q:"Perché le catene appena sintetizzate rischiano di aggregarsi?",o:["Espongono regioni idrofobiche", "Sono troppo cariche", "Non hanno amminoacidi", "Sono legate al DNA"],a:0,e:"Gli aggregati proteici sono alla base di alcune malattie neurodegenerative."},
{id:"bl4_039",t:"bl4",p:"4.8",l:1,q:"Che cos'è una mutazione genica?",o:["Un cambiamento che interessa un singolo gene", "Un cambiamento del numero di cromosomi", "Lo scambio tra omologhi", "Una variazione ambientale"],a:0,e:"Spesso deriva da errori di replicazione non corretti."},
{id:"bl4_040",t:"bl4",p:"4.8",l:2,q:"Che cos'è una mutazione silente?",o:["Una sostituzione di base che non cambia l'amminoacido", "Una mutazione che crea un codone di stop", "L'inserzione di una base", "La perdita di un cromosoma"],a:0,e:"È possibile grazie alla ridondanza del codice."},
{id:"bl4_041",t:"bl4",p:"4.8",l:2,q:"Che effetto ha l'inserzione di una base in un gene?",o:["Sposta la cornice di lettura (frameshift)", "Cambia un solo amminoacido", "Nessuno", "Raddoppia il gene"],a:0,e:"Tutti i codoni successivi vengono letti in modo diverso."},
{id:"bl4_042",t:"bl4",p:"4.8",l:3,q:"Una mutazione che trasforma un codone in un codone di stop si dice…",o:["non senso", "di senso errato (missenso)", "silente", "frameshift"],a:0,e:"Produce una proteina tronca."},
{id:"bl4_043",t:"bl4",p:"4.8",l:3,q:"L'anemia falciforme è dovuta a…",o:["una mutazione puntiforme missenso nel gene della β-globina", "una trisomia", "una delezione cromosomica", "una mutazione silente"],a:0,e:"Un acido glutammico è sostituito da una valina."},
{id:"bl4_044",t:"bl4",p:"4.8.1",l:1,q:"Quale di questi è un mutageno fisico?",o:["I raggi ultravioletti", "Il benzopirene", "L'acido nitroso", "I nitriti"],a:0,e:"Anche raggi X e radiazioni ionizzanti sono mutageni fisici."},
{id:"bl4_045",t:"bl4",p:"4.8.1",l:2,q:"Che danno tipico provocano i raggi UV al DNA?",o:["Dimeri di timina", "Rottura dei cromosomi in due", "Trisomie", "Aggiunta di uracile"],a:0,e:"Distorcono la doppia elica e bloccano la replicazione."},
{id:"bl4_046",t:"bl4",p:"4.9",l:1,q:"Da che cosa è formato un virus?",o:["Un acido nucleico racchiuso in un capside proteico", "Una cellula procariotica", "Ribosomi e DNA", "Lipidi e zuccheri soltanto"],a:0,e:"Alcuni hanno anche un involucro lipidico (envelope)."},
{id:"bl4_047",t:"bl4",p:"4.9",l:2,q:"Perché i virus non sono considerati organismi viventi a sé?",o:["Si moltiplicano solo dentro una cellula ospite", "Non hanno acidi nucleici", "Sono troppo grandi", "Producono ATP da soli"],a:0,e:"Usano i ribosomi e gli enzimi della cellula."},
{id:"bl4_048",t:"bl4",p:"4.9",l:3,q:"Che cosa sono i retrovirus?",o:["Virus a RNA che con la trascrittasi inversa producono DNA", "Virus a DNA dei batteri", "Virus senza capside", "Batteriofagi"],a:0,e:"Esempio: l'HIV."},
{id:"bl4_049",t:"bl4",p:"4.9.1",l:2,q:"Da che cosa dipende la specificità dei virus?",o:["Dai recettori sulla superficie della cellula ospite", "Dal colore della cellula", "Dalla temperatura", "Dal numero di cromosomi"],a:0,e:"Le proteine del capside si legano a recettori specifici."},
{id:"bl4_050",t:"bl4",p:"4.9.2",l:2,q:"Che cosa avviene nel ciclo litico?",o:["Il virus si moltiplica e lisa la cellula, liberando nuovi virus", "Il DNA virale si integra e resta inattivo", "La cellula diventa immune", "Il virus si divide per mitosi"],a:0,e:"È il normale ciclo riproduttivo."},
{id:"bl4_051",t:"bl4",p:"4.9.2",l:3,q:"Che cos'è un profago?",o:["Il DNA di un batteriofago integrato nel cromosoma batterico (ciclo lisogenico)", "Un virus libero", "Un plasmide di resistenza", "Il capside vuoto"],a:0,e:"Viene replicato con il batterio e può poi tornare al ciclo litico."},
{id:"bl4_052",t:"bl4",p:"4.10",l:1,q:"Come si riproducono i batteri?",o:["Per scissione binaria", "Per meiosi", "Per fecondazione", "Per gemmazione con mitosi"],a:0,e:"Il materiale genetico cambia solo per mutazione o per scambi orizzontali."},
{id:"bl4_053",t:"bl4",p:"4.10",l:2,q:"Quali sono i tre meccanismi di ricombinazione nei batteri?",o:["Trasformazione, trasduzione, coniugazione", "Mitosi, meiosi, fecondazione", "Replicazione, trascrizione, traduzione", "Glicolisi, Krebs, fermentazione"],a:0,e:"Sono forme di trasferimento genico orizzontale."},
{id:"bl4_054",t:"bl4",p:"4.10.1",l:2,q:"Che cos'è la trasformazione batterica?",o:["L'assorbimento e l'integrazione di DNA libero nell'ambiente", "Il trasferimento di DNA tramite virus", "Il trasferimento di DNA tramite un pilo", "La divisione cellulare"],a:0,e:"Il DNA proviene di solito da batteri morti."},
{id:"bl4_055",t:"bl4",p:"4.10.2",l:2,q:"Che cos'è la trasduzione?",o:["Il trasferimento di geni batterici da una cellula all'altra tramite un batteriofago", "Il trasferimento di DNA libero", "Lo scambio di plasmidi", "La traduzione dell'mRNA"],a:0,e:"Può essere generalizzata o specializzata."},
{id:"bl4_056",t:"bl4",p:"4.10.3",l:2,q:"Che cosa sono i plasmidi?",o:["Piccoli DNA circolari con geni utili ma non indispensabili", "Il cromosoma principale", "Ribosomi", "Proteine di membrana"],a:0,e:"Per esempio portano la resistenza agli antibiotici."},
{id:"bl4_057",t:"bl4",p:"4.10.3",l:3,q:"Come avviene la coniugazione batterica?",o:["Un batterio con il fattore F trasferisce DNA a un altro tramite un pilo sessuale", "Per fusione di due batteri", "Tramite virus", "Assorbendo DNA libero"],a:0,e:"Il batterio donatore è F⁺, il ricevente F⁻."},
{id:"bl4_058",t:"bl4",p:"4.11",l:2,q:"A quale livello avviene soprattutto la regolazione genica nei procarioti?",o:["Alla trascrizione", "Allo splicing", "Al trasporto nel nucleo", "Alla replicazione"],a:0,e:"Vengono trascritti solo i geni necessari."},
{id:"bl4_059",t:"bl4",p:"4.11.1",l:1,q:"Chi propose il modello dell'operone?",o:["Jacob e Monod", "Watson e Crick", "Beadle e Tatum", "Avery e McCarty"],a:0,e:"Studiando la regolazione dei geni del lattosio in E. coli."},
{id:"bl4_060",t:"bl4",p:"4.11.1",l:2,q:"Da che cosa è formato un operone?",o:["Un promotore, un operatore e uno o più geni strutturali", "Solo geni strutturali", "Introni ed esoni", "Un plasmide"],a:0,e:"Il gene regolatore, a parte, produce il repressore."},
{id:"bl4_061",t:"bl4",p:"4.11.1",l:3,q:"Che cosa succede all'operone lac quando c'è lattosio?",o:["Il lattosio inattiva il repressore e i geni vengono trascritti", "Il repressore si lega all'operatore", "I geni vengono spenti", "Il DNA si degrada"],a:0,e:"È un operone inducibile."},
{id:"bl4_062",t:"bl4",p:"4.11.1",l:3,q:"Che tipo di operone è quello del triptofano?",o:["Reprimibile: il triptofano attiva il repressore e spegne i geni", "Inducibile come il lac", "Sempre spento", "Sempre acceso"],a:0,e:"Quando il prodotto abbonda la sua sintesi si blocca."},
{id:"bl4_063",t:"bl4",p:"4.9.1",l:3,q:"In che modo entrano nella cellula i virus con envelope?",o:["Per fusione dell'involucro con la membrana o per endocitosi", "Solo iniettando il DNA", "Attraverso i pori nucleari", "Non possono entrare"],a:0,e:"La maggior parte dei fagi inietta invece solo l'acido nucleico."},
{id:"bl4_064",t:"bl4",p:"4.10.1",l:3,q:"Chi osservò per primo la trasformazione batterica?",o:["Griffith, con gli pneumococchi", "Mendel", "Morgan", "Sanger"],a:0,e:"Batteri innocui diventavano virulenti assorbendo DNA dei virulenti morti."},
{id:"bl4_065",t:"bl4",p:"4.10.2",l:3,q:"Che differenza c'è tra trasduzione generalizzata e specializzata?",o:["Nella generalizzata il fago porta un frammento qualsiasi; nella specializzata solo geni vicini al sito di integrazione", "Sono uguali", "La specializzata usa plasmidi", "La generalizzata usa DNA libero"],a:0,e:"La specializzata riguarda fagi lisogeni."},
{id:"bl4_066",t:"bl4",p:"4.11",l:3,q:"Perché nei procarioti la regolazione è soprattutto trascrizionale?",o:["Non serve produrre mRNA di geni che non verranno tradotti; trascrizione e traduzione sono accoppiate", "Perché non hanno ribosomi", "Perché non hanno DNA", "Perché hanno lo splicing"],a:0,e:"Risparmiano energia producendo solo ciò che serve."},
{id:"bl4_067",t:"bl4",p:"4.5",l:3,q:"Negli eucarioti, quale RNA polimerasi trascrive gli mRNA?",o:["L'RNA polimerasi II", "L'RNA polimerasi I", "L'RNA polimerasi III", "La primasi"],a:0,e:"La I trascrive gli rRNA, la III i tRNA."},
{id:"bl4_068",t:"bl4",p:"4.2",l:2,q:"Quante molecole di DNA contiene un cromosoma in metafase?",o:["2 (due cromatidi)", "1", "4", "46"],a:0,e:"Dopo la fase S ogni cromosoma è formato da due cromatidi identici."},
{id:"bl4_sf1",t:"bl4",p:"4.6",l:4,q:"Un mRNA ha 300 nucleotidi tra il codone di inizio e quello di stop escluso. Quanti amminoacidi avrà il polipeptide?",o:["100", "300", "99", "900"],a:0,e:"300 nucleotidi = 100 codoni, ognuno un amminoacido (incluso il primo, la metionina); il codone di stop non codifica."},
{id:"bl4_sf2",t:"bl4",p:"4.3",l:4,q:"DNA marcato con ¹⁵N viene replicato due volte in un terreno con ¹⁴N. Che molecole si ottengono?",o:["Metà ibride ¹⁵N/¹⁴N e metà solo ¹⁴N", "Tutte ibride", "Tutte solo ¹⁵N", "Un quarto ibride e tre quarti ¹⁵N"],a:0,e:"È l'esperimento di Meselson e Stahl: con la replicazione semiconservativa le ibride restano 2 su 4 dopo due cicli."},
{id:"bl4_sf3",t:"bl4",p:"4.8",l:4,q:"In quale caso una mutazione puntiforme ha l'effetto più grave sulla proteina?",o:["Se crea un codone di stop vicino all'inizio del gene", "Se cambia la terza base di un codone in modo silente", "Se avviene in un introne", "Se sostituisce un amminoacido con uno simile"],a:0,e:"Un codone di stop precoce produce una proteina molto tronca e di solito non funzionante."},
{id:"bl4_sf4",t:"bl4",p:"4.11.1",l:4,q:"In E. coli manca il gene del repressore lac funzionante. Che cosa succede?",o:["I geni lac sono sempre trascritti, anche senza lattosio", "I geni lac non sono mai trascritti", "Sono trascritti solo con il glucosio", "Il batterio muore"],a:0,e:"Senza repressore nulla blocca l'operatore: l'espressione è costitutiva."},
{id:"bl4_sf5",t:"bl4",p:"4.1.1",l:4,q:"Un DNA a doppio filamento contiene il 30% di guanina. Quale percentuale di timina contiene?",o:["20%", "30%", "40%", "70%"],a:0,e:"G = C = 30%, quindi A + T = 40% e T = 20%."},
{id:"bl5_001",t:"bl5",p:"5.1",l:1,q:"Chi è considerato il padre della genetica?",o:["Gregor Mendel", "Charles Darwin", "Thomas Morgan", "James Watson"],a:0,e:"Scoprì le regole dell'ereditarietà tra il 1854 e il 1864."},
{id:"bl5_002",t:"bl5",p:"5.1",l:2,q:"Su quale organismo lavorò Mendel?",o:["La pianta di pisello", "Il moscerino della frutta", "Il topo", "Il batterio E. coli"],a:0,e:"Il pisello ha caratteri ben distinguibili, generazioni brevi e permette incroci controllati."},
{id:"bl5_003",t:"bl5",p:"5.1.1",l:1,q:"Incrociando piante di linea pura a seme giallo e verde, com'è la F1?",o:["Tutta a seme giallo", "Metà gialla e metà verde", "Tutta verde", "Gialla e verde 3 : 1"],a:0,e:"È la legge della dominanza (uniformità degli ibridi)."},
{id:"bl5_004",t:"bl5",p:"5.1.1",l:2,q:"Qual è il rapporto fenotipico nella F2 di un incrocio monoibrido?",o:["3 : 1", "1 : 1", "9 : 3 : 3 : 1", "1 : 2 : 1 fenotipico sempre"],a:0,e:"Il carattere recessivo ricompare in un quarto degli individui."},
{id:"bl5_005",t:"bl5",p:"5.1.2",l:2,q:"Che cosa afferma la legge della segregazione?",o:["I due alleli di un gene si separano nei gameti, che ne ricevono uno solo", "Gli alleli si mescolano", "Tutti i gameti hanno due alleli", "I geni non si trasmettono"],a:0,e:"È la seconda legge di Mendel."},
{id:"bl5_006",t:"bl5",p:"5.1.2",l:2,q:"Che cosa sono gli alleli?",o:["Forme alternative dello stesso gene", "Geni di cromosomi diversi", "Cromosomi omologhi", "Proteine"],a:0,e:"Ogni individuo ne porta due per ciascun gene, uno per genitore."},
{id:"bl5_007",t:"bl5",p:"5.1.3",l:1,q:"Un individuo Yy si dice…",o:["eterozigote", "omozigote dominante", "omozigote recessivo", "emizigote"],a:0,e:"Gli omozigoti hanno due alleli uguali (YY o yy)."},
{id:"bl5_008",t:"bl5",p:"5.1.3",l:2,q:"Qual è il rapporto genotipico nella F2 di Yy × Yy?",o:["1 YY : 2 Yy : 1 yy", "3 YY : 1 yy", "1 : 1", "9 : 3 : 3 : 1"],a:0,e:"Il fenotipo è 3 gialli : 1 verde."},
{id:"bl5_009",t:"bl5",p:"5.1.3",l:3,q:"Qual è la probabilità che due eterozigoti Aa abbiano un figlio aa?",o:["1/4", "1/2", "3/4", "0"],a:0,e:"Ogni genitore dà a con probabilità 1/2: 1/2 · 1/2 = 1/4."},
{id:"bl5_010",t:"bl5",p:"5.1.4",l:2,q:"Qual è il rapporto fenotipico nella F2 di un diibrido (AaBb × AaBb)?",o:["9 : 3 : 3 : 1", "3 : 1", "1 : 1 : 1 : 1", "1 : 2 : 1"],a:0,e:"Dimostra la terza legge, dell'assortimento indipendente."},
{id:"bl5_011",t:"bl5",p:"5.1.4",l:3,q:"Quanti tipi di gameti produce un individuo AaBb (geni indipendenti)?",o:["4", "2", "8", "1"],a:0,e:"AB, Ab, aB, ab in proporzioni uguali."},
{id:"bl5_012",t:"bl5",p:"5.1.4",l:3,q:"Da AaBb × AaBb, qual è la probabilità di un figlio aabb?",o:["1/16", "1/4", "9/16", "3/16"],a:0,e:"1/4 · 1/4 = 1/16."},
{id:"bl5_013",t:"bl5",p:"5.1.5",l:2,q:"A che cosa serve il reincrocio (test-cross)?",o:["A scoprire se un individuo a fenotipo dominante è omozigote o eterozigote", "A creare linee pure", "A ottenere mutazioni", "A determinare il sesso"],a:0,e:"Lo si incrocia con un omozigote recessivo."},
{id:"bl5_014",t:"bl5",p:"5.1.5",l:3,q:"In un test-cross con aa compaiono figli a fenotipo recessivo. Il genitore era…",o:["eterozigote Aa", "omozigote AA", "omozigote aa", "non si può dire"],a:0,e:"Se fosse AA tutti i figli sarebbero Aa, a fenotipo dominante."},
{id:"bl5_015",t:"bl5",p:"5.2.1",l:2,q:"Bocca di leone rossa × bianca dà F1 rosa. È un caso di…",o:["dominanza incompleta", "codominanza", "epistasi", "pleiotropia"],a:0,e:"L'eterozigote ha un fenotipo intermedio."},
{id:"bl5_016",t:"bl5",p:"5.2.1",l:3,q:"Nella F2 di un caso di dominanza incompleta, qual è il rapporto fenotipico?",o:["1 : 2 : 1", "3 : 1", "9 : 3 : 3 : 1", "1 : 1"],a:0,e:"Fenotipo e genotipo coincidono (rosso : rosa : bianco)."},
{id:"bl5_017",t:"bl5",p:"5.2.2",l:2,q:"Che cos'è la codominanza?",o:["Nell'eterozigote si esprimono entrambi gli alleli", "Nessuno dei due alleli si esprime", "Il fenotipo è intermedio", "Un gene ne maschera un altro"],a:0,e:"Esempio: gli antigeni A e B nel gruppo AB."},
{id:"bl5_018",t:"bl5",p:"5.2.3",l:2,q:"Che cosa si intende per alleli multipli?",o:["Un gene con più di due forme alleliche nella popolazione", "Un individuo con tre alleli", "Più geni per un carattere", "Geni concatenati"],a:0,e:"Il gene del sistema AB0 ha tre alleli (Iᴬ, Iᴮ, i)."},
{id:"bl5_019",t:"bl5",p:"5.2.4",l:2,q:"Che cos'è la pleiotropia?",o:["Un singolo gene con effetti fenotipici multipli", "Più geni per un carattere", "Un gene che ne maschera un altro", "Due alleli espressi insieme"],a:0,e:"Esempio: i geni degli ormoni, che hanno molti effetti."},
{id:"bl5_020",t:"bl5",p:"5.2.5",l:2,q:"Che cos'è l'epistasi?",o:["L'interazione per cui un gene interferisce con l'espressione di un altro", "Un gene con più effetti", "Due alleli codominanti", "Un carattere legato al sesso"],a:0,e:"Esempio: la sordità congenita dovuta a due geni."},
{id:"bl5_021",t:"bl5",p:"5.2.6",l:2,q:"Perché i geni concatenati non seguono la terza legge di Mendel?",o:["Si trovano sullo stesso cromosoma e tendono a essere ereditati insieme", "Sono sempre recessivi", "Sono sui cromosomi sessuali", "Sono mitocondriali"],a:0,e:"Possono separarsi solo con il crossing-over."},
{id:"bl5_022",t:"bl5",p:"5.2.6",l:3,q:"Come varia la frequenza di ricombinazione tra due geni concatenati?",o:["Aumenta con la loro distanza sul cromosoma", "Diminuisce con la distanza", "È sempre 50%", "È sempre zero"],a:0,e:"Si usa per costruire mappe genetiche (1% = 1 centimorgan)."},
{id:"bl5_023",t:"bl5",p:"5.2.7",l:2,q:"Che cosa sono i caratteri quantitativi?",o:["Caratteri a variabilità continua, controllati da più geni (poligenici)", "Caratteri con due sole forme", "Caratteri legati al sesso", "Caratteri mitocondriali"],a:0,e:"Esempi: statura, colore della pelle; dipendono anche dall'ambiente."},
{id:"bl5_024",t:"bl5",p:"5.2.8",l:2,q:"Che rapporto c'è tra genotipo e fenotipo?",o:["Il fenotipo dipende dal genotipo e dall'ambiente", "Il fenotipo dipende solo dall'ambiente", "Sono la stessa cosa", "Il genotipo dipende dal fenotipo"],a:0,e:"Il genotipo non determina il fenotipo in modo rigido."},
{id:"bl5_025",t:"bl5",p:"5.2.9",l:3,q:"Che cos'è la penetranza incompleta?",o:["Non tutti i portatori del genotipo mostrano il fenotipo", "Tutti i portatori mostrano il fenotipo", "Il fenotipo è più grave", "Il gene è sul cromosoma Y"],a:0,e:"L'espressività indica invece quanto il fenotipo è intenso nei portatori."},
{id:"bl5_026",t:"bl5",p:"5.3",l:2,q:"Che cosa afferma la teoria cromosomica dell'ereditarietà?",o:["I geni si trovano sui cromosomi e il loro comportamento in meiosi spiega le leggi di Mendel", "I geni si trovano nei mitocondri", "I cromosomi non hanno geni", "I geni si mescolano"],a:0,e:"Fu proposta da Sutton e Boveri."},
{id:"bl5_027",t:"bl5",p:"5.3",l:2,q:"Che cos'è il locus di un gene?",o:["La sua posizione su un cromosoma", "Un tipo di allele", "Un cromosoma sessuale", "Il centromero"],a:0,e:"I due alleli di un gene occupano lo stesso locus sugli omologhi."},
{id:"bl5_028",t:"bl5",p:"5.3.2",l:1,q:"Quali cromosomi sessuali ha un maschio umano?",o:["XY", "XX", "X0", "YY"],a:0,e:"Il sesso è determinato dal gamete maschile, che porta X o Y."},
{id:"bl5_029",t:"bl5",p:"5.3.2",l:2,q:"Qual è la probabilità che un figlio sia maschio?",o:["1/2", "1/4", "3/4", "Dipende dalla madre"],a:0,e:"Metà degli spermatozoi porta X e metà Y."},
{id:"bl5_030",t:"bl5",p:"5.3.3",l:2,q:"Su quale organismo lavorò Thomas Morgan?",o:["Drosophila melanogaster", "Pisello", "Topo", "Lievito"],a:0,e:"Collegò il colore degli occhi al cromosoma X."},
{id:"bl5_031",t:"bl5",p:"5.3.4",l:2,q:"Perché i maschi manifestano più spesso i caratteri recessivi legati all'X?",o:["Hanno un solo cromosoma X (sono emizigoti)", "Hanno due X", "L'Y li rende dominanti", "Non è vero"],a:0,e:"Basta un allele recessivo sull'X perché si manifesti."},
{id:"bl5_032",t:"bl5",p:"5.3.4",l:3,q:"Da chi eredita un maschio il suo cromosoma X?",o:["Dalla madre", "Dal padre", "Da entrambi", "Da nessuno"],a:0,e:"Dal padre riceve l'Y."},
{id:"bl5_033",t:"bl5",p:"5.4.1",l:1,q:"Quali sono le più note malattie legate al sesso?",o:["Emofilia e daltonismo", "Fibrosi cistica e talassemia", "Sindrome di Down e Turner", "Diabete e ipertensione"],a:0,e:"Sono dovute a geni recessivi sul cromosoma X."},
{id:"bl5_034",t:"bl5",p:"5.4.1",l:3,q:"Una donna portatrice di emofilia e un uomo sano hanno un figlio maschio. Probabilità che sia emofiliaco?",o:["1/2", "1/4", "0", "1"],a:0,e:"Il figlio maschio riceve una delle due X materne: una su due porta l'allele."},
{id:"bl5_035",t:"bl5",p:"5.4.1",l:3,q:"Un padre daltonico e una madre omozigote normale: come saranno le figlie?",o:["Tutte portatrici sane", "Tutte daltoniche", "Metà daltoniche", "Tutte normali non portatrici"],a:0,e:"Ricevono dal padre l'X con l'allele recessivo."},
{id:"bl5_036",t:"bl5",p:"5.4.2",l:2,q:"Quale di queste è una malattia autosomica recessiva?",o:["Fibrosi cistica", "Corea di Huntington", "Emofilia", "Daltonismo"],a:0,e:"Si manifesta solo negli omozigoti recessivi; anche la talassemia e la fenilchetonuria."},
{id:"bl5_037",t:"bl5",p:"5.4.2",l:2,q:"Quale di queste è una malattia autosomica dominante?",o:["Corea di Huntington", "Fibrosi cistica", "Anemia falciforme", "Albinismo"],a:0,e:"Basta un allele per manifestarla."},
{id:"bl5_038",t:"bl5",p:"5.4.2",l:3,q:"Due genitori sani portatori di fibrosi cistica: probabilità di un figlio malato?",o:["1/4", "1/2", "0", "3/4"],a:0,e:"Aa × Aa → 1/4 aa."},
{id:"bl5_039",t:"bl5",p:"5.4.3",l:2,q:"Che cos'è un pedigree?",o:["Un albero genealogico che mostra come un carattere compare in una famiglia", "Un cariotipo", "Un test del DNA", "Una mappa genetica"],a:0,e:"Quadrati = maschi, cerchi = femmine, simboli pieni = affetti."},
{id:"bl5_040",t:"bl5",p:"5.4.3",l:3,q:"Se due genitori sani hanno un figlio malato, la malattia è probabilmente…",o:["autosomica recessiva", "autosomica dominante", "legata all'Y", "mitocondriale"],a:0,e:"I genitori sono portatori eterozigoti."},
{id:"bl5_041",t:"bl5",p:"5.5.1",l:1,q:"Quali antigeni ha sui globuli rossi una persona di gruppo AB?",o:["A e B", "Nessuno", "Solo A", "Solo B"],a:0,e:"Il gruppo 0 non ha antigeni A né B."},
{id:"bl5_042",t:"bl5",p:"5.5.1",l:2,q:"Quali anticorpi ha nel plasma una persona di gruppo 0?",o:["Anti-A e anti-B", "Nessuno", "Solo anti-A", "Solo anti-B"],a:0,e:"Il gruppo AB invece non ha anticorpi anti-A né anti-B."},
{id:"bl5_043",t:"bl5",p:"5.5.1",l:2,q:"Perché il gruppo 0 è considerato donatore universale?",o:["I suoi globuli rossi non hanno antigeni A né B", "Ha tutti gli anticorpi", "Non ha globuli rossi", "Ha l'antigene Rh"],a:0,e:"Il gruppo AB è il ricevente universale."},
{id:"bl5_044",t:"bl5",p:"5.5.1",l:3,q:"Un genitore A (Iᴬi) e uno B (Iᴮi) possono avere figli di quali gruppi?",o:["A, B, AB e 0", "Solo AB", "Solo A e B", "Solo 0"],a:0,e:"Ogni combinazione ha probabilità 1/4."},
{id:"bl5_045",t:"bl5",p:"5.5.2",l:2,q:"Come si ereditano i gruppi Rh?",o:["Con l'allele D dominante (Rh⁺) e d recessivo (Rh⁻)", "Con tre alleli codominanti", "Sono legati all'X", "Non sono ereditari"],a:0,e:"Una persona Rh⁻ è dd."},
{id:"bl5_046",t:"bl5",p:"5.5.2",l:3,q:"Quando c'è rischio di malattia emolitica del neonato?",o:["Madre Rh⁻ già sensibilizzata con un feto Rh⁺", "Madre Rh⁺ con feto Rh⁻", "Entrambi Rh⁻", "Entrambi Rh⁺"],a:0,e:"Gli anticorpi anti-Rh materni attraversano la placenta e distruggono i globuli rossi fetali."},
{id:"bl5_047",t:"bl5",p:"5.2.2",l:3,q:"Una persona di gruppo AB ha genotipo…",o:["IᴬIᴮ", "Iᴬi", "ii", "IᴮIᴮ"],a:0,e:"Gli alleli Iᴬ e Iᴮ sono codominanti."},
{id:"bl5_048",t:"bl5",p:"5.2.3",l:3,q:"Quanti genotipi sono possibili con i tre alleli del sistema AB0?",o:["6", "3", "4", "9"],a:0,e:"IᴬIᴬ, Iᴬi, IᴮIᴮ, Iᴮi, IᴬIᴮ, ii; i fenotipi sono 4."},
{id:"bl5_049",t:"bl5",p:"5.2.4",l:3,q:"L'anemia falciforme provoca anemia, dolori e danni a più organi a partire da un solo gene. È un esempio di…",o:["pleiotropia", "epistasi", "codominanza", "caratteri quantitativi"],a:0,e:"Un singolo gene ha effetti fenotipici multipli."},
{id:"bl5_050",t:"bl5",p:"5.2.5",l:3,q:"Nel caso della sordità congenita a due geni (A e B), quando si manifesta?",o:["Quando almeno uno dei due geni è in forma omozigote recessiva", "Solo se entrambi sono dominanti", "Mai negli omozigoti", "Solo nei maschi"],a:0,e:"Basta aa oppure bb: un gene maschera l'effetto dell'altro."},
{id:"bl5_051",t:"bl5",p:"5.2.7",l:3,q:"Perché la statura ha una distribuzione a campana?",o:["Dipende da molti geni con effetto additivo e dall'ambiente", "Dipende da un solo gene", "È legata all'X", "È un carattere recessivo"],a:0,e:"È un carattere quantitativo."},
{id:"bl5_052",t:"bl5",p:"5.2.8",l:3,q:"Due gemelli identici cresciuti in ambienti diversi possono avere fenotipi diversi?",o:["Sì, il fenotipo dipende anche dall'ambiente", "No, mai", "Solo se hanno DNA diverso", "Solo per i gruppi sanguigni"],a:0,e:"Il genotipo non determina il fenotipo in modo rigido."},
{id:"bl5_053",t:"bl5",p:"5.2.9",l:2,q:"Che cos'è l'espressività variabile?",o:["Portatori della stessa mutazione mostrano il carattere con intensità diversa", "Alcuni portatori non mostrano il carattere", "Il carattere salta generazioni", "Il gene è sull'Y"],a:0,e:"La penetranza riguarda invece se il carattere compare o no."},
{id:"bl5_054",t:"bl5",p:"5.3.3",l:3,q:"Che cosa osservò Morgan incrociando femmine a occhi rossi con maschi a occhi bianchi?",o:["In F2 gli occhi bianchi comparivano solo nei maschi", "Tutti gli individui avevano occhi bianchi", "Nessuna differenza tra i sessi", "Comparivano occhi verdi"],a:0,e:"Concluse che il gene era sul cromosoma X."},
{id:"bl5_055",t:"bl5",p:"5.1.2",l:3,q:"Secondo Mendel, i \"fattori\" ereditari…",o:["non si mescolano e si trasmettono intatti", "si mescolano nella prole", "si perdono nella F1", "vengono dall'ambiente"],a:0,e:"Contro la teoria dell'eredità per mescolanza."},
{id:"bl5_056",t:"bl5",p:"5.5.1",l:3,q:"Perché trasfondere sangue A a una persona di gruppo B è pericoloso?",o:["Gli anticorpi anti-A del ricevente agglutinano i globuli rossi A", "Perché i globuli rossi B sono più grandi", "Perché il gruppo A è Rh⁻", "Non è pericoloso"],a:0,e:"Si verifica una reazione trasfusionale."},
{id:"bl5_sf1",t:"bl5",p:"5.1.4",l:4,q:"Da AaBb × aabb (geni indipendenti), che proporzione di figli avrà fenotipo dominante per entrambi i caratteri?",o:["1/4", "9/16", "1/2", "1/16"],a:0,e:"È un test-cross diibrido: 1 AaBb : 1 Aabb : 1 aaBb : 1 aabb, solo 1 su 4 mostra entrambi i caratteri dominanti."},
{id:"bl5_sf2",t:"bl5",p:"5.4.1",l:4,q:"Una donna con padre daltonico e vista normale sposa un uomo con vista normale. Probabilità che un loro figlio maschio sia daltonico?",o:["1/2", "1/4", "0", "1"],a:0,e:"La donna è sicuramente portatrice (X^d dal padre); un figlio maschio riceve X^d con probabilità 1/2."},
{id:"bl5_sf3",t:"bl5",p:"5.5.1",l:4,q:"Una madre di gruppo 0 ha un figlio di gruppo A. Quale padre è escluso?",o:["Un padre di gruppo 0", "Un padre di gruppo A", "Un padre di gruppo AB", "Un padre eterozigote A"],a:0,e:"Il figlio ha l'allele Iᴬ, che non può venire dalla madre (ii): il padre deve averlo. Un padre 0 (ii) non può darlo."},
{id:"bl5_sf4",t:"bl5",p:"5.4.3",l:4,q:"In un pedigree la malattia salta generazioni, colpisce maschi e femmine in egual misura e figli malati nascono da genitori sani. Che tipo di trasmissione è?",o:["Autosomica recessiva", "Autosomica dominante", "Legata all'X dominante", "Legata all'Y"],a:0,e:"Il salto di generazioni e la parità tra i sessi indicano un allele recessivo su un autosoma."},
{id:"bl5_sf5",t:"bl5",p:"5.2.6",l:4,q:"Due geni concatenati mostrano il 12% di gameti ricombinanti. Che distanza hanno sulla mappa?",o:["12 centimorgan", "6 centimorgan", "24 centimorgan", "88 centimorgan"],a:0,e:"La frequenza di ricombinazione in percentuale corrisponde alla distanza in unità di mappa (cM)."},
{id:"bl6_001",t:"bl6",p:"6.1",l:1,q:"A quanti livelli può essere regolata l'espressione genica negli eucarioti?",o:["A molti livelli: cromatina, trascrizione, maturazione dell'RNA, traduzione, post-traduzione", "Solo alla trascrizione", "Solo alla traduzione", "Non è regolata"],a:0,e:"Nei procarioti la regolazione è soprattutto trascrizionale."},
{id:"bl6_002",t:"bl6",p:"6.1",l:2,q:"Perché le cellule di un organismo sono diverse pur avendo lo stesso DNA?",o:["Esprimono geni diversi", "Hanno DNA diverso", "Perdono cromosomi", "Hanno mutazioni diverse"],a:0,e:"È l'espressione genica differenziale."},
{id:"bl6_003",t:"bl6",p:"6.1.1",l:2,q:"Perché l'eterocromatina non viene trascritta?",o:["È troppo compatta e inaccessibile all'RNA polimerasi", "Non contiene DNA", "È nel citoplasma", "È fatta di RNA"],a:0,e:"È ricca di sequenze ripetute; l'eucromatina, meno condensata, è trascritta."},
{id:"bl6_004",t:"bl6",p:"6.1.1",l:3,q:"Che effetto ha l'acetilazione degli istoni?",o:["Allenta la cromatina e favorisce la trascrizione", "Compatta la cromatina", "Taglia il DNA", "Blocca la replicazione"],a:0,e:"La metilazione del DNA invece tende a silenziare i geni."},
{id:"bl6_005",t:"bl6",p:"6.1.2",l:2,q:"Che cosa sono i fattori di trascrizione?",o:["Proteine che si legano al DNA e regolano l'attività dell'RNA polimerasi", "Enzimi che tagliano l'RNA", "Ribosomi", "Ormoni"],a:0,e:"Negli eucarioti l'RNA polimerasi non lega il promotore da sola."},
{id:"bl6_006",t:"bl6",p:"6.1.2",l:3,q:"Che cosa sono gli enhancer?",o:["Sequenze regolatrici che aumentano la trascrizione anche a distanza dal gene", "Codoni di stop", "Introni", "Telomeri"],a:0,e:"I silencer invece la riducono."},
{id:"bl6_007",t:"bl6",p:"6.1.3",l:2,q:"Che cos'è lo splicing alternativo?",o:["La combinazione di esoni diversi dallo stesso pre-mRNA per ottenere proteine diverse", "La rimozione degli esoni", "La traduzione di introni", "La replicazione dell'RNA"],a:0,e:"Così un gene può produrre più proteine."},
{id:"bl6_008",t:"bl6",p:"6.1.3",l:2,q:"Quali modifiche subisce il pre-mRNA prima di uscire dal nucleo?",o:["Cappuccio al 5', coda di poli-A al 3', splicing", "Aggiunta di timina", "Metilazione degli istoni", "Taglio dei telomeri"],a:0,e:"Gli mRNA non maturi restano nel nucleo."},
{id:"bl6_009",t:"bl6",p:"6.1.4",l:2,q:"Come può essere bloccata la traduzione di un mRNA?",o:["Con proteine inibitrici che si legano al 5' e impediscono il legame al ribosoma", "Rimuovendo gli istoni", "Con la DNA polimerasi", "Con lo splicing"],a:0,e:"Permette di regolare rapidamente la produzione di proteine."},
{id:"bl6_010",t:"bl6",p:"6.1.4",l:3,q:"Che cosa fanno i microRNA?",o:["Si appaiano a mRNA bersaglio bloccandone la traduzione o favorendone la degradazione", "Codificano proteine", "Formano i ribosomi", "Trasportano amminoacidi"],a:0,e:"È un meccanismo di silenziamento post-trascrizionale."},
{id:"bl6_011",t:"bl6",p:"6.1.5",l:2,q:"Che cos'è l'epigenetica?",o:["Lo studio dei meccanismi che regolano l'attività genica senza alterare la sequenza del DNA", "Lo studio delle mutazioni", "Lo studio dei cromosomi sessuali", "Lo studio dei virus"],a:0,e:"Esempi: metilazione del DNA e modifiche degli istoni, anche ereditabili."},
{id:"bl6_012",t:"bl6",p:"6.1.5",l:2,q:"Da che cosa dipendono attivazione e durata di una proteina dopo la sintesi?",o:["Dalle modificazioni post-traduzionali", "Dalla sequenza degli introni", "Dai telomeri", "Dal numero di cromosomi"],a:0,e:"Esempi: tagli proteolitici, fosforilazione, glicosilazione, ubiquitinazione."},
{id:"bl6_013",t:"bl6",p:"6.2",l:1,q:"Quanta parte del DNA umano codifica proteine, secondo il libro?",o:["Non più del 2%", "Circa il 50%", "Circa il 98%", "Il 100%"],a:0,e:"Il restante 98% è DNA non codificante, un tempo detto \"spazzatura\"."},
{id:"bl6_014",t:"bl6",p:"6.2",l:2,q:"Che cosa sono gli introni?",o:["Tratti non codificanti interni ai geni, rimossi con lo splicing", "Tratti codificanti", "Promotori", "Telomeri"],a:0,e:"Gli esoni sono le parti che restano nell'mRNA maturo."},
{id:"bl6_015",t:"bl6",p:"6.2",l:3,q:"Il DNA non codificante è inutile?",o:["No: contiene sequenze regolatrici, RNA non codificanti e strutture come i telomeri", "Sì, del tutto", "Sì, è solo di origine virale", "Viene eliminato in ogni divisione"],a:0,e:"Per questo non si parla più di \"junk DNA\"."},
{id:"bl6_016",t:"bl6",p:"6.2.1",l:2,q:"Perché i telomeri si accorciano a ogni replicazione?",o:["La DNA polimerasi non riesce a copiare l'estremità del filamento lento", "Per mutazioni", "Per il crossing-over", "Per l'apoptosi"],a:0,e:"Proteggono i geni dalla perdita di informazione."},
{id:"bl6_017",t:"bl6",p:"6.2.1",l:2,q:"Quale enzima allunga i telomeri?",o:["La telomerasi", "La ligasi", "L'elicasi", "La primasi"],a:0,e:"È attiva nelle cellule staminali, germinali e in molte cellule tumorali."},
{id:"bl6_018",t:"bl6",p:"6.2.1",l:3,q:"Che cosa succede a una cellula quando i telomeri diventano troppo corti?",o:["Smette di dividersi (senescenza) o va in apoptosi", "Si divide più velocemente", "Diventa staminale", "Non succede nulla"],a:0,e:"È uno dei meccanismi dell'invecchiamento cellulare."},
{id:"bl6_019",t:"bl6",p:"6.3.1",l:2,q:"Come si differenziano le cellule embrionali, pur avendo lo stesso DNA?",o:["Con la trascrizione selettiva del genoma", "Perdendo geni", "Con mutazioni programmate", "Scambiandosi cromosomi"],a:0,e:"Le cellule specializzate esprimono solo una parte dei loro geni."},
{id:"bl6_020",t:"bl6",p:"6.3.1",l:3,q:"Il differenziamento comporta perdita di DNA?",o:["No: in genere il genoma resta completo", "Sì, sempre", "Solo nei neuroni", "Solo nelle cellule del sangue"],a:0,e:"Lo dimostra la clonazione da nucleo di cellula differenziata."},
{id:"bl6_021",t:"bl6",p:"6.3.2",l:1,q:"Che cosa sono le cellule staminali?",o:["Cellule indifferenziate che possono generare diverse linee cellulari", "Cellule tumorali", "Cellule nervose mature", "Gameti"],a:0,e:"Si dividono per mitosi."},
{id:"bl6_022",t:"bl6",p:"6.3.2",l:2,q:"Quale cellula è totipotente?",o:["Lo zigote", "Una cellula staminale dell'adulto", "Un neurone", "Un globulo rosso"],a:0,e:"Totipotente: può dare tutti i tessuti, anche gli annessi embrionali."},
{id:"bl6_023",t:"bl6",p:"6.3.2",l:2,q:"Le cellule staminali embrionali della massa cellulare interna sono…",o:["pluripotenti", "unipotenti", "totipotenti", "differenziate"],a:0,e:"Possono dare tutti i tessuti dell'organismo ma non gli annessi embrionali."},
{id:"bl6_024",t:"bl6",p:"6.3.2",l:3,q:"Che cosa sono le cellule staminali unipotenti?",o:["Cellule che producono un solo tipo di cellula del tessuto in cui si trovano", "Cellule che danno tutti i tessuti", "Gameti", "Cellule tumorali"],a:0,e:"Servono a riparare i tessuti nell'adulto."},
{id:"bl6_025",t:"bl6",p:"6.3.2",l:3,q:"Che cosa sono le iPS?",o:["Cellule adulte riprogrammate in staminali pluripotenti", "Cellule tumorali", "Cellule embrionali naturali", "Gameti modificati"],a:0,e:"Si ottengono attivando pochi fattori di trascrizione."},
{id:"bl6_026",t:"bl6",p:"6.4",l:2,q:"Che cosa sono gli oncogeni?",o:["Forme mutate di proto-oncogeni che stimolano la proliferazione; basta una copia mutata", "Geni che bloccano la crescita", "Geni dei virus innocui", "Geni dei telomeri"],a:0,e:"Esempi: Ras e HER2."},
{id:"bl6_027",t:"bl6",p:"6.4",l:2,q:"Che cosa sono i geni oncosoppressori?",o:["Geni che frenano la proliferazione o favoriscono l'apoptosi; servono entrambe le copie mutate", "Geni che stimolano la divisione", "Geni sempre dominanti", "Geni mitocondriali"],a:0,e:"Esempi: TP53 e RB1."},
{id:"bl6_028",t:"bl6",p:"6.4",l:3,q:"Che funzione ha p53?",o:["Blocca il ciclo in G1/S se il DNA è danneggiato e può indurre apoptosi", "Stimola la divisione", "Sintetizza DNA", "Forma i telomeri"],a:0,e:"È detto \"guardiano del genoma\"; è mutato in molti tumori."},
{id:"bl6_029",t:"bl6",p:"6.4.1",l:2,q:"Quali alterazioni portano alla formazione di un tumore?",o:["L'accumulo di mutazioni genetiche e modificazioni epigenetiche", "Una singola mutazione sempre", "Solo infezioni", "Solo l'invecchiamento"],a:0,e:"Agiscono in modo interdipendente."},
{id:"bl6_030",t:"bl6",p:"6.4.1",l:3,q:"Come può l'epigenetica favorire un tumore?",o:["Con l'ipermetilazione del promotore di un oncosoppressore, che lo silenzia", "Aggiungendo cromosomi", "Allungando i telomeri", "Bloccando la telomerasi"],a:0,e:"Senza cambiare la sequenza del gene, lo spegne."},
{id:"bl6_031",t:"bl6",p:"6.4.2",l:2,q:"Quale caratteristica è tipica delle cellule tumorali?",o:["Proliferazione incontrollata e insensibilità ai segnali di arresto", "Morte più rapida", "Differenziamento completo", "Assenza di divisione"],a:0,e:"Eludono anche l'apoptosi e diventano \"immortali\"."},
{id:"bl6_032",t:"bl6",p:"6.4.2",l:2,q:"Che cos'è l'angiogenesi tumorale?",o:["La formazione di nuovi vasi sanguigni stimolata dal tumore per nutrirsi", "La morte delle cellule tumorali", "La migrazione in altri organi", "La riparazione del DNA"],a:0,e:"Senza vasi un tumore non cresce oltre pochi millimetri."},
{id:"bl6_033",t:"bl6",p:"6.4.2",l:3,q:"Che cosa sono le metastasi?",o:["Tumori secondari formati da cellule che migrano in altri organi", "Tumori benigni", "Mutazioni puntiformi", "Cellule staminali normali"],a:0,e:"Le cellule tumorali cambiano l'adesione e invadono sangue e linfa."},
{id:"bl6_034",t:"bl6",p:"6.1.2",l:2,q:"Negli eucarioti l'RNA polimerasi riesce a legare il promotore da sola?",o:["No, servono i fattori di trascrizione generali", "Sì, sempre", "Solo nei mitocondri", "Solo per i geni degli rRNA"],a:0,e:"È una differenza importante rispetto ai procarioti."},
{id:"bl6_035",t:"bl6",p:"6.1.5",l:3,q:"Che cos'è l'inattivazione del cromosoma X nelle femmine?",o:["Uno dei due X viene condensato in eterocromatina (corpo di Barr)", "La perdita di un X", "La duplicazione dell'X", "Una mutazione dell'X"],a:0,e:"È un esempio di regolazione epigenetica."},
{id:"bl6_036",t:"bl6",p:"6.2",l:2,q:"Che cosa sono le sequenze ripetute del genoma?",o:["Tratti di DNA presenti in molte copie, spesso non codificanti", "Geni per le proteine", "Codoni di stop", "Esoni"],a:0,e:"Comprendono sequenze satelliti e trasposoni."},
{id:"bl6_037",t:"bl6",p:"6.3.1",l:2,q:"Che cosa determina il destino di una cellula embrionale?",o:["I segnali ricevuti e i geni che esprime", "Il numero dei suoi cromosomi", "La perdita di geni", "Il caso soltanto"],a:0,e:"Il differenziamento dipende dalla trascrizione selettiva."},
{id:"bl6_038",t:"bl6",p:"6.4.2",l:3,q:"Perché le cellule tumorali sfuggono all'apoptosi?",o:["Hanno spesso p53 o altri regolatori dell'apoptosi alterati", "Perché non hanno mitocondri", "Perché non hanno DNA", "Perché sono aploidi"],a:0,e:"Così sopravvivono nonostante i danni al DNA."},
{id:"bl6_039",t:"bl6",p:"6.4",l:3,q:"Perché basta una copia mutata di un oncogene per favorire il tumore?",o:["Perché la mutazione aumenta l'attività del prodotto (effetto dominante)", "Perché il gene è sull'X", "Perché serve anche l'altra copia", "Non basta"],a:0,e:"Gli oncosoppressori richiedono invece l'inattivazione di entrambe le copie."},
{id:"bl6_sf1",t:"bl6",p:"6.4",l:4,q:"In una famiglia molti membri ereditano una copia mutata di RB1 e sviluppano retinoblastoma. Perché basta ereditare una copia?",o:["Nelle cellule della retina basta una seconda mutazione somatica per perdere entrambe le copie", "Perché RB1 è un oncogene dominante", "Perché il gene è sul cromosoma Y", "Perché la mutazione è epigenetica"],a:0,e:"Gli oncosoppressori agiscono in modo recessivo a livello cellulare (ipotesi dei \"due colpi\"), ma la predisposizione si eredita in modo dominante."},
{id:"bl6_sf2",t:"bl6",p:"6.2.1",l:4,q:"Perché molte cellule tumorali possono dividersi indefinitamente?",o:["Riattivano la telomerasi e non accorciano i telomeri", "Perdono tutti i telomeri", "Non replicano il DNA", "Sono aploidi"],a:0,e:"Senza accorciamento dei telomeri non arrivano alla senescenza."},
{id:"bl6_sf3",t:"bl6",p:"6.1.3",l:4,q:"Un gene ha 4 esoni. Con lo splicing alternativo, quale prodotto NON è possibile?",o:["Un mRNA con l'esone 3 prima dell'esone 1", "Un mRNA con gli esoni 1, 2, 4", "Un mRNA con gli esoni 1, 3, 4", "Un mRNA con tutti e 4 gli esoni"],a:0,e:"Lo splicing può saltare esoni ma ne mantiene l'ordine originale."},
{id:"bl6_sf4",t:"bl6",p:"6.3.2",l:4,q:"Da quale cellula si possono ottenere in teoria anche i tessuti della placenta?",o:["Dallo zigote o dalle prime cellule dell'embrione (totipotenti)", "Da una staminale del midollo osseo", "Da una cellula della massa interna della blastocisti", "Da un neurone"],a:0,e:"Solo le cellule totipotenti danno anche gli annessi embrionali; quelle della massa interna sono pluripotenti."},
{id:"bl7_001",t:"bl7",p:"7.1",l:1,q:"Quali sono le tre tappe della segnalazione cellulare?",o:["Ricezione del segnale, trasduzione, risposta", "Replicazione, trascrizione, traduzione", "Glicolisi, Krebs, catena respiratoria", "Profase, metafase, anafase"],a:0,e:"Il segnale (ligando) si lega a un recettore specifico."},
{id:"bl7_002",t:"bl7",p:"7.1",l:2,q:"Quali molecole possono fare da segnale extracellulare?",o:["Ormoni, neurotrasmettitori, fattori di crescita, citochine", "Solo il glucosio", "Solo l'ATP", "Solo il DNA"],a:0,e:"Si legano a recettori sulla superficie o dentro la cellula."},
{id:"bl7_003",t:"bl7",p:"7.1",l:2,q:"Che cosa provoca il legame del segnale al recettore?",o:["Un cambiamento conformazionale del recettore che avvia una cascata", "La distruzione del recettore", "La replicazione del DNA", "La divisione immediata"],a:0,e:"La cascata amplifica e propaga il segnale."},
{id:"bl7_004",t:"bl7",p:"7.1",l:3,q:"Perché solo alcune cellule rispondono a un ormone?",o:["Solo le cellule bersaglio hanno il recettore specifico", "Perché l'ormone non circola", "Perché le altre cellule sono morte", "Tutte le cellule rispondono uguale"],a:0,e:"La specificità dipende dai recettori."},
{id:"bl7_005",t:"bl7",p:"7.2",l:1,q:"Quante sono le classi principali di recettori?",o:["4", "2", "3", "6"],a:0,e:"Accoppiati a canali ionici, a proteine G, ad attività enzimatica, intracellulari."},
{id:"bl7_006",t:"bl7",p:"7.2",l:2,q:"Dove si trovano soprattutto i recettori accoppiati a canali ionici (ionotropici)?",o:["Nelle sinapsi e nelle cellule eccitabili", "Nel nucleo", "Nei mitocondri", "Nei globuli rossi"],a:0,e:"Il legame del ligando apre il canale."},
{id:"bl7_007",t:"bl7",p:"7.2",l:2,q:"Come si chiamano i recettori accoppiati a proteine G?",o:["GPCR", "Tirosina chinasi", "Ionotropici", "Recettori nucleari"],a:0,e:"Attraversano la membrana sette volte."},
{id:"bl7_008",t:"bl7",p:"7.2",l:3,q:"Dove si trovano i recettori degli ormoni steroidei?",o:["All'interno della cellula (citoplasma o nucleo)", "Sulla membrana", "Nei ribosomi", "Nel Golgi"],a:0,e:"Gli steroidi sono liposolubili e attraversano la membrana; il complesso agisce da fattore di trascrizione."},
{id:"bl7_009",t:"bl7",p:"7.2",l:3,q:"Quale recettore è un esempio di tipo accoppiato ad attività enzimatica?",o:["Il recettore tirosina chinasi (es. dell'insulina)", "Il recettore nicotinico", "Il recettore degli estrogeni", "L'acquaporina"],a:0,e:"Si autofosforila e attiva proteine intracellulari."},
{id:"bl7_010",t:"bl7",p:"7.3",l:2,q:"Che ruolo hanno chinasi e fosfatasi nella trasduzione?",o:["Aggiungono e rimuovono fosfati, accendendo e spegnendo le proteine della via", "Sintetizzano il DNA", "Producono ormoni", "Formano i recettori"],a:0,e:"Molte vie sono cascate di fosforilazioni."},
{id:"bl7_011",t:"bl7",p:"7.3",l:3,q:"Che cosa si intende per cross-talk tra vie di segnalazione?",o:["L'interazione tra vie diverse che si influenzano a vicenda", "La comunicazione tra due cellule", "La traduzione dell'mRNA", "Il trasporto di vescicole"],a:0,e:"La maggior parte delle vie forma reti ramificate."},
{id:"bl7_012",t:"bl7",p:"7.4",l:1,q:"Che cos'è un secondo messaggero?",o:["Una piccola molecola intracellulare che trasmette e amplifica il segnale", "L'ormone stesso", "Il recettore", "Un neurone"],a:0,e:"Esempi: cAMP, Ca²⁺, DAG, IP₃."},
{id:"bl7_013",t:"bl7",p:"7.4",l:2,q:"Quale enzima produce il cAMP?",o:["L'adenilato ciclasi", "La fosfodiesterasi", "La fosfolipasi C", "La DNA polimerasi"],a:0,e:"La fosfodiesterasi lo degrada."},
{id:"bl7_014",t:"bl7",p:"7.4",l:2,q:"Quale proteina attiva di solito il cAMP?",o:["La proteina chinasi A (PKA)", "La proteina G", "L'RNA polimerasi", "L'emoglobina"],a:0,e:"La PKA fosforila numerosi bersagli."},
{id:"bl7_015",t:"bl7",p:"7.4",l:3,q:"Che cosa producono la fosfolipasi C e il PIP₂?",o:["IP₃ e DAG", "cAMP e ATP", "Glucosio e lattato", "DNA e RNA"],a:0,e:"L'IP₃ libera Ca²⁺ dal reticolo endoplasmatico; il DAG attiva la proteina chinasi C."},
{id:"bl7_016",t:"bl7",p:"7.4",l:3,q:"Perché i secondi messaggeri sono prodotti in modo transitorio?",o:["Per avere una risposta rapida, reversibile e controllata", "Perché sono tossici", "Perché non servono", "Perché si legano al DNA"],a:0,e:"Enzimi specifici li producono e altri li degradano."},
{id:"bl7_017",t:"bl7",p:"7.5",l:2,q:"Quale via di segnalazione è coinvolta nella risposta infiammatoria?",o:["NF-κB", "Notch", "Wnt/β-catenina", "Glicolisi"],a:0,e:"Notch regola il destino cellulare, Wnt/β-catenina la proliferazione intestinale."},
{id:"bl7_018",t:"bl7",p:"7.5",l:2,q:"Che cosa possono causare alterazioni nelle vie di segnalazione?",o:["Tumori, malattie metaboliche e immunitarie", "Solo effetti positivi", "Nulla", "Solo mutazioni del DNA mitocondriale"],a:0,e:"Per esempio recettori sempre attivi stimolano la proliferazione."},
{id:"bl7_019",t:"bl7",p:"7.5",l:3,q:"In quali processi le vie di segnalazione sono fondamentali nello sviluppo embrionale?",o:["Differenziamento, morfogenesi e formazione dei tessuti", "Solo nella digestione", "Solo nella respirazione", "In nessuno"],a:0,e:"Nei tessuti adulti regolano proliferazione, riparazione, omeostasi e immunità."},
{id:"bl7_020",t:"bl7",p:"7.2",l:2,q:"Qual è il recettore ionotropico tipico della giunzione neuromuscolare?",o:["Il recettore nicotinico dell'acetilcolina", "Il recettore dell'insulina", "Il recettore degli estrogeni", "Il recettore β-adrenergico"],a:0,e:"Il legame dell'acetilcolina apre un canale per i cationi."},
{id:"bl7_021",t:"bl7",p:"7.3",l:2,q:"Che cosa fa una proteina G attivata da un GPCR?",o:["Scambia GDP con GTP e attiva un enzima effettore", "Trasporta ossigeno", "Si lega al DNA", "Apre i pori nucleari"],a:0,e:"Per esempio l'adenilato ciclasi o la fosfolipasi C."},
{id:"bl7_022",t:"bl7",p:"7.3",l:3,q:"Come si spegne una proteina G?",o:["Idrolizzando il GTP a GDP", "Legando altro GTP", "Fosforilando il recettore del DNA", "Non si spegne"],a:0,e:"Ha un'attività GTPasica intrinseca."},
{id:"bl7_023",t:"bl7",p:"7.4",l:2,q:"Da dove viene il Ca²⁺ che fa da secondo messaggero?",o:["Dal reticolo endoplasmatico o dall'esterno della cellula", "Dal nucleo", "Dai ribosomi", "Dal DNA"],a:0,e:"La sua concentrazione nel citosol è normalmente molto bassa."},
{id:"bl7_024",t:"bl7",p:"7.5",l:2,q:"Che ruolo ha la via Wnt/β-catenina?",o:["Regola la proliferazione, per esempio nell'epitelio intestinale", "Regola la fotosintesi", "Produce ATP", "Blocca la trascrizione"],a:0,e:"Mutazioni di questa via sono frequenti nel tumore del colon."},
{id:"bl7_025",t:"bl7",p:"7.1",l:2,q:"Che cosa sono gli effettori intracellulari?",o:["Molecole come proteine G, chinasi e secondi messaggeri che portano avanti il segnale", "Gli ormoni", "I recettori di membrana", "I geni"],a:0,e:"Modificano infine i processi biologici della cellula."},
{id:"bl7_sf1",t:"bl7",p:"7.4",l:4,q:"Un farmaco inibisce la fosfodiesterasi. Che cosa succede al cAMP nella cellula?",o:["Aumenta e prolunga la risposta", "Diminuisce", "Non cambia", "Si trasforma in DNA"],a:0,e:"La fosfodiesterasi degrada il cAMP: bloccandola, il secondo messaggero resta più a lungo (la caffeina agisce in parte così)."},
{id:"bl7_sf2",t:"bl7",p:"7.2",l:4,q:"Perché il cortisolo può agire senza recettori di membrana?",o:["È uno steroide liposolubile che attraversa la membrana e lega recettori intracellulari", "Perché è una proteina", "Perché apre canali ionici", "Perché attiva l'adenilato ciclasi"],a:0,e:"Gli ormoni idrosolubili invece usano recettori di membrana e secondi messaggeri."},
{id:"bl7_sf3",t:"bl7",p:"7.1",l:4,q:"Perché una piccola quantità di ormone può produrre una grande risposta?",o:["La cascata di trasduzione amplifica il segnale a ogni passaggio", "Perché l'ormone si moltiplica", "Perché entra nel nucleo", "Perché è molto concentrato"],a:0,e:"Ogni enzima attivato ne attiva molti altri."},
{id:"bl8_001",t:"bl8",p:"A.1",l:1,q:"Che cos'è il potere risolutivo di un microscopio?",o:["La distanza minima alla quale due punti appaiono ancora distinti", "L'ingrandimento massimo", "La luminosità", "La dimensione del campione"],a:0,e:"Più è piccolo, migliore è il microscopio."},
{id:"bl8_002",t:"bl8",p:"A.1",l:2,q:"Quale microscopio dà immagini tridimensionali della superficie?",o:["Il microscopio elettronico a scansione (SEM)", "Il microscopio ottico", "Il microscopio elettronico a trasmissione (TEM)", "La lente d'ingrandimento"],a:0,e:"Gli elettroni sono riflessi dalla superficie; risoluzione circa 10 nm."},
{id:"bl8_003",t:"bl8",p:"A.1",l:2,q:"Quale microscopio ha il potere risolutivo migliore (circa 0,2 nm)?",o:["Il microscopio elettronico a trasmissione (TEM)", "Il microscopio ottico", "Il SEM", "Il microscopio a fluorescenza"],a:0,e:"Gli elettroni attraversano sezioni sottilissime del campione."},
{id:"bl8_004",t:"bl8",p:"A.1",l:3,q:"Perché il microscopio elettronico risolve molto meglio di quello ottico?",o:["Gli elettroni hanno una lunghezza d'onda molto più piccola della luce visibile", "Perché usa lenti di vetro più spesse", "Perché colora i campioni", "Perché ingrandisce di meno"],a:0,e:"Il microscopio ottico arriva a circa 0,2 µm."},
{id:"bl8_005",t:"bl8",p:"A.2",l:2,q:"Come si separano gli organuli dopo aver rotto le cellule?",o:["Con la centrifugazione differenziale a velocità crescenti", "Con la PCR", "Con il sequenziamento", "Con l'elettroforesi su gel di agarosio"],a:0,e:"Prima sedimentano i nuclei, poi mitocondri, poi microsomi e ribosomi."},
{id:"bl8_006",t:"bl8",p:"A.2",l:3,q:"Quale componente sedimenta per primo nella centrifugazione differenziale?",o:["I nuclei", "I ribosomi", "Le proteine solubili", "Il citosol"],a:0,e:"Gli oggetti più grandi e densi sedimentano a velocità più basse."},
{id:"bl8_007",t:"bl8",p:"A.3",l:2,q:"Su quale principio si basa l'elettroforesi del DNA?",o:["Le molecole cariche migrano in un campo elettrico secondo la loro dimensione", "La solubilità in solventi", "La fluorescenza", "La radioattività"],a:0,e:"Il DNA, negativo, va verso il polo positivo; i frammenti piccoli corrono di più."},
{id:"bl8_008",t:"bl8",p:"A.3",l:2,q:"Qual è il primo passo per analizzare DNA, RNA o proteine?",o:["L'estrazione mediante lisi cellulare, poi la purificazione", "La traduzione", "Il sequenziamento diretto", "La clonazione dell'organismo"],a:0,e:"Serve ottenerne una quantità sufficiente."},
{id:"bl8_009",t:"bl8",p:"A.3.1",l:1,q:"Che cosa fanno gli enzimi di restrizione?",o:["Tagliano il DNA in corrispondenza di sequenze specifiche", "Uniscono i frammenti di DNA", "Copiano il DNA", "Traducono l'mRNA"],a:0,e:"I siti di restrizione sono lunghi 4-8 coppie di basi."},
{id:"bl8_010",t:"bl8",p:"A.3.1",l:2,q:"Da dove provengono naturalmente gli enzimi di restrizione?",o:["Dai batteri, che li usano contro i virus", "Dalle cellule umane", "Dai virus", "Dalle piante"],a:0,e:"Il batterio protegge il proprio DNA metilandolo."},
{id:"bl8_011",t:"bl8",p:"A.3.1",l:3,q:"Che cosa sono le estremità \"adesive\" (sticky ends)?",o:["Estremità a singolo filamento lasciate da tagli sfalsati, che si appaiano con estremità complementari", "Estremità tagliate dritte", "Telomeri", "Primer"],a:0,e:"Sono utilissime per unire DNA di origine diversa con la ligasi."},
{id:"bl8_012",t:"bl8",p:"A.3.2",l:2,q:"Chi ideò il metodo di sequenziamento basato sui dideossinucleotidi?",o:["Frederick Sanger", "Kary Mullis", "Watson e Crick", "Jacob e Monod"],a:0,e:"Il primo DNA sequenziato fu quello del fago phi X 174."},
{id:"bl8_013",t:"bl8",p:"A.3.2",l:3,q:"Perché i dideossinucleotidi bloccano la sintesi nel metodo Sanger?",o:["Non hanno l'–OH in 3' e la catena non può allungarsi", "Perché sono radioattivi", "Perché non hanno basi", "Perché sono di RNA"],a:0,e:"Si ottengono frammenti che terminano su ogni posizione."},
{id:"bl8_014",t:"bl8",p:"A.3.3",l:2,q:"Che cosa studia la proteomica?",o:["L'insieme delle proteine di una cellula o di un organismo", "L'insieme dei geni", "L'insieme degli mRNA", "L'insieme dei metaboliti"],a:0,e:"Genomica = DNA, trascrittomica = RNA, metabolomica = metaboliti."},
{id:"bl8_015",t:"bl8",p:"A.3.3",l:2,q:"Che cos'è il genoma?",o:["La totalità del DNA di un organismo", "L'insieme delle proteine", "Un singolo gene", "Un cromosoma"],a:0,e:"Il suo studio si chiama genomica."},
{id:"bl8_016",t:"bl8",p:"A.3.4",l:1,q:"A che cosa serve la PCR?",o:["Ad amplificare rapidamente un tratto di DNA in moltissime copie", "A tagliare il DNA", "A sequenziare le proteine", "A tradurre l'mRNA"],a:0,e:"Bisogna conoscere almeno in parte la sequenza, per costruire i primer."},
{id:"bl8_017",t:"bl8",p:"A.3.4",l:2,q:"Quali sono le tre fasi di un ciclo di PCR?",o:["Denaturazione, appaiamento dei primer, estensione", "Trascrizione, splicing, traduzione", "Taglio, ligazione, trasformazione", "Profase, metafase, anafase"],a:0,e:"Ogni ciclo raddoppia il numero di copie."},
{id:"bl8_018",t:"bl8",p:"A.3.4",l:3,q:"Perché nella PCR si usa una DNA polimerasi termostabile (Taq)?",o:["Deve resistere ai circa 95 °C della denaturazione", "Perché lavora al freddo", "Perché taglia il DNA", "Perché non serve il primer"],a:0,e:"La Taq polimerasi viene dal batterio termofilo Thermus aquaticus."},
{id:"bl8_019",t:"bl8",p:"A.3.4",l:3,q:"Partendo da una molecola di DNA, quante copie si hanno dopo 10 cicli di PCR?",o:["Circa 1000 (2¹⁰ = 1024)", "20", "100", "10"],a:0,e:"Il numero raddoppia a ogni ciclo."},
{id:"bl8_020",t:"bl8",p:"A.3.5",l:2,q:"Su che cosa si basa l'ibridazione?",o:["Un filamento singolo si appaia a una sonda con sequenza complementare", "Il taglio del DNA", "La traduzione", "La centrifugazione"],a:0,e:"Serve a verificare se un gene è presente o mutato."},
{id:"bl8_021",t:"bl8",p:"A.3.5",l:3,q:"Che cos'è una sonda molecolare?",o:["Un breve filamento marcato, complementare alla sequenza da cercare", "Un enzima di restrizione", "Un anticorpo", "Un plasmide"],a:0,e:"Può essere radioattiva o fluorescente."},
{id:"bl8_022",t:"bl8",p:"A.3.6",l:2,q:"Che cos'è un DNA ricombinante?",o:["DNA ottenuto unendo frammenti di origine diversa", "DNA mutato da raggi UV", "DNA mitocondriale", "DNA virale naturale"],a:0,e:"È alla base dell'ingegneria genetica."},
{id:"bl8_023",t:"bl8",p:"A.3.6",l:2,q:"Quale vettore si usa spesso per clonare un gene nei batteri?",o:["Un plasmide", "Un ribosoma", "Un mitocondrio", "Un istone"],a:0,e:"Il plasmide ricombinante entra nel batterio per trasformazione."},
{id:"bl8_024",t:"bl8",p:"A.3.6",l:3,q:"Quali enzimi servono per inserire un gene in un plasmide?",o:["Un enzima di restrizione e la DNA ligasi", "L'RNA polimerasi e l'elicasi", "La trascrittasi inversa e la primasi", "La Taq polimerasi e la proteasi"],a:0,e:"Lo stesso enzima taglia gene e plasmide; la ligasi li unisce."},
{id:"bl8_025",t:"bl8",p:"A.3.7",l:2,q:"Che cosa permette il genome editing?",o:["Eliminare o sostituire un gene preciso in un organismo", "Clonare un organismo intero", "Sequenziare le proteine", "Contare i cromosomi"],a:0,e:"Usa \"forbici molecolari\" come CRISPR/Cas9."},
{id:"bl8_026",t:"bl8",p:"A.3.7",l:3,q:"Da dove deriva il sistema CRISPR/Cas9?",o:["Da un sistema di difesa dei batteri contro i virus", "Dalle cellule umane", "Dai lieviti", "Dai virus"],a:0,e:"Un RNA guida porta Cas9 a tagliare una sequenza precisa."},
{id:"bl8_027",t:"bl8",p:"A.3.8",l:2,q:"Quale tecnica analizza le proteine?",o:["Western blotting", "Southern blotting", "Northern blotting", "PCR"],a:0,e:"Southern = DNA, Northern = RNA, Western = proteine (con anticorpi)."},
{id:"bl8_028",t:"bl8",p:"A.3.8",l:3,q:"Su che cosa si basano le tecniche di blotting?",o:["Elettroforesi, trasferimento su membrana e riconoscimento con sonde o anticorpi", "Solo sulla centrifugazione", "Sulla microscopia", "Sul sequenziamento"],a:0,e:"Separano le molecole per dimensione e poi le identificano."},
{id:"bl8_029",t:"bl8",p:"A.3.9",l:2,q:"Che cosa fa il silenziamento genico?",o:["Spegne un gene impedendo la produzione della proteina", "Elimina il gene dal DNA", "Aumenta la trascrizione", "Duplica il gene"],a:0,e:"Per esempio con RNA interferenti (siRNA) che degradano l'mRNA."},
{id:"bl8_030",t:"bl8",p:"A.3.10",l:2,q:"Quale applicazione dell'ingegneria genetica ha permesso di produrre insulina umana?",o:["L'inserimento del gene dell'insulina in batteri", "La clonazione di pecore", "La PCR", "Il sequenziamento Sanger"],a:0,e:"I batteri ricombinanti la producono in grande quantità."},
{id:"bl8_031",t:"bl8",p:"A.3.10",l:2,q:"Che cosa sono gli OGM?",o:["Organismi il cui genoma è stato modificato con l'ingegneria genetica", "Organismi nati per mutazione naturale", "Ibridi tra specie", "Organismi clonati"],a:0,e:"Esempi: piante resistenti agli insetti."},
{id:"bl8_032",t:"bl8",p:"A.4",l:2,q:"Perché Mendel scelse il pisello come organismo modello?",o:["Era facile da coltivare, economico, con caratteri distinguibili e ciclo breve", "Perché è un animale", "Perché ha pochi cromosomi", "Per caso"],a:0,e:"Sono i criteri che definiscono un buon organismo modello."},
{id:"bl8_033",t:"bl8",p:"A.4.1",l:1,q:"Qual è l'organismo modello procariote più noto?",o:["Escherichia coli", "Saccharomyces cerevisiae", "Drosophila melanogaster", "Mus musculus"],a:0,e:"È un batterio gram negativo, cresce rapidamente ed è facile da manipolare."},
{id:"bl8_034",t:"bl8",p:"A.4.2",l:2,q:"Per quale processo è stato cruciale il lievito Saccharomyces cerevisiae?",o:["Lo studio del ciclo cellulare eucariotico", "La fotosintesi", "Lo sviluppo degli arti", "L'immunità"],a:0,e:"È un fungo unicellulare con ciclo cellulare simile a quello umano."},
{id:"bl8_035",t:"bl8",p:"A.4.2",l:2,q:"Quale di questi è un organismo modello eucariote?",o:["Drosophila melanogaster", "Escherichia coli", "Il batteriofago T4", "Il virus HIV"],a:0,e:"Altri: il nematode C. elegans, il topo, il pesce zebra, Arabidopsis."},
{id:"bl8_036",t:"bl8",p:"A.3.9",l:3,q:"Come agiscono gli siRNA nel silenziamento genico?",o:["Si appaiano all'mRNA bersaglio e ne provocano la degradazione", "Tagliano il DNA del gene", "Aggiungono metili agli istoni", "Bloccano la replicazione"],a:0,e:"Il gene resta nel DNA ma la proteina non viene prodotta."},
{id:"bl8_037",t:"bl8",p:"A.4",l:2,q:"Quale caratteristica deve avere un buon organismo modello?",o:["Ciclo vitale breve e facilità di allevamento", "Grandi dimensioni", "Lunga vita", "Molti cromosomi"],a:0,e:"Così si possono osservare molte generazioni in poco tempo."},
{id:"bl8_038",t:"bl8",p:"A.4.1",l:2,q:"Perché E. coli è un organismo modello molto usato?",o:["Cresce rapidamente ed è facile da manipolare geneticamente", "Perché è eucariote", "Perché fa la fotosintesi", "Perché è un virus"],a:0,e:"Ha permesso di scoprire replicazione, operone lac e sintesi proteica."},
{id:"bl8_039",t:"bl8",p:"A.3.6",l:3,q:"Come si selezionano i batteri che hanno ricevuto il plasmide ricombinante?",o:["Con un gene di resistenza a un antibiotico presente sul plasmide", "Al microscopio", "Con la PCR prima della trasformazione", "Con il Western blot"],a:0,e:"Solo i batteri trasformati crescono sull'antibiotico."},
{id:"bl8_sf1",t:"bl8",p:"A.3.4",l:4,q:"Per amplificare con la PCR un tratto di DNA di cui non si conosce alcuna sequenza, che cosa manca?",o:["Le sequenze per costruire i primer", "La Taq polimerasi", "I nucleotidi", "Lo stampo"],a:0,e:"I primer devono essere complementari alle estremità del tratto: senza conoscerne almeno in parte la sequenza non si possono progettare."},
{id:"bl8_sf2",t:"bl8",p:"A.3.1",l:4,q:"Un plasmide circolare viene tagliato da un enzima che ha 3 siti di restrizione. Quanti frammenti si ottengono?",o:["3", "4", "2", "6"],a:0,e:"In una molecola circolare n tagli danno n frammenti; in una lineare darebbero n + 1."},
{id:"bl8_sf3",t:"bl8",p:"A.3.8",l:4,q:"Si vuole sapere se un tessuto produce l'mRNA di un certo gene. Quale tecnica si usa?",o:["Northern blotting", "Southern blotting", "Western blotting", "Microscopia elettronica"],a:0,e:"Il Northern analizza l'RNA; il Southern il DNA (il gene ci sarebbe comunque), il Western la proteina."},
{id:"fl1_001",t:"fl1",p:"1.1",l:1,q:"Quale di queste grandezze è scalare?",o:["La massa","Lo spostamento","La forza","La velocità"],a:0,e:"Una grandezza scalare è descritta solo da un numero con la sua unità. Massa, tempo, temperatura, densità, lavoro, frequenza e carica sono scalari; spostamento, forza e velocità servono anche direzione e verso."},
{id:"fl1_002",t:"fl1",p:"1.1.1",l:1,q:"Quante sono le grandezze fondamentali individuate in fisica?",o:["7","3","5","10"],a:0,e:"Sono sette: lunghezza, massa, tempo, intensità di corrente, temperatura, intensità luminosa e quantità di sostanza. Tutte le altre sono derivate."},
{id:"fl1_003",t:"fl1",p:"1.1.1",l:2,q:"Quale di queste è una grandezza derivata?",o:["La velocità","La massa","Il tempo","La temperatura"],a:0,e:"La velocità si ricava da lunghezza e tempo (v = lunghezza / tempo), quindi è derivata e ha dimensioni [L][T]⁻¹."},
{id:"fl1_004",t:"fl1",p:"1.1.2",l:2,q:"Quali sono le dimensioni della velocità?",o:["[L][T]⁻¹","[L][T]","[L]⁻¹[T]","[M][L][T]⁻¹"],a:0,e:"velocità = lunghezza / tempo, quindi [v] = [L]/[T] = [L][T]⁻¹."},
{id:"fl1_005",t:"fl1",p:"1.1.2",l:2,q:"Quali sono le dimensioni di cos θ?",o:["Nessuna: è adimensionale","[L]","[L]²","Le stesse dell'angolo in gradi, [L]/[T]"],a:0,e:"Seno, coseno e tangente sono rapporti tra due segmenti, quindi sono numeri puri senza dimensioni."},
{id:"fl1_006",t:"fl1",p:"1.1.2",l:3,q:"Quale operazione NON ha senso in fisica?",o:["1 m + 1 kg","2 · (3 m)","5 m / 2 s","3 m + 40 cm"],a:0,e:"Si possono sommare o sottrarre solo grandezze omogenee (stesse dimensioni). Metri e chilogrammi hanno dimensioni diverse. 3 m + 40 cm invece è lecito: sono entrambe lunghezze."},
{id:"fl1_007",t:"fl1",p:"1.1.2",l:3,q:"Raddoppiando il perimetro p di una stanza, che dimensioni ha 2p?",o:["[L], come p","[L]²","2[L]","Nessuna"],a:0,e:"Moltiplicare per un numero puro non cambia le dimensioni: [2p] = [2]·[p] = 1·[L] = [L]."},
{id:"fl1_008",t:"fl1",p:"1.1.2",l:2,q:"Due grandezze fisiche con le stesse dimensioni si dicono…",o:["omogenee","adimensionali","fondamentali","concordi"],a:0,e:"Grandezze con le stesse dimensioni sono omogenee: per esempio la lunghezza di un tavolo e l'altezza di un muro, entrambe [L]."},
{id:"fl1_009",t:"fl1",p:"1.2",l:1,q:"Qual è l'unità di misura della temperatura nel Sistema Internazionale?",o:["Il kelvin (K)","Il grado Celsius (°C)","Il grado Fahrenheit (°F)","La caloria"],a:0,e:"Nel SI la temperatura è una grandezza fondamentale e si misura in kelvin."},
{id:"fl1_010",t:"fl1",p:"1.2",l:1,q:"Quale terna di unità caratterizza il sistema CGS?",o:["Centimetro, grammo, secondo","Metro, chilogrammo, secondo","Centimetro, chilogrammo, secondo","Metro, grammo, secondo"],a:0,e:"CGS viene dalle iniziali di centimetro, grammo e secondo. Metro, chilogrammo e secondo sono invece le unità del sistema MKS (il SI ristretto alla meccanica)."},
{id:"fl1_011",t:"fl1",p:"1.2",l:2,q:"Quale elenco contiene solo grandezze fondamentali del SI?",o:["Corrente elettrica, massa, temperatura, tempo","Lunghezza, massa, tempo, forza","Carica elettrica, massa, calore, tempo","Pressione, energia, lavoro, tempo"],a:0,e:"La forza, la carica elettrica, il calore, la pressione, l'energia e il lavoro sono grandezze derivate. Corrente, massa, temperatura e tempo sono tutte fondamentali."},
{id:"fl1_012",t:"fl1",p:"1.2",l:2,q:"A quanto corrisponde circa 1 kg, secondo la definizione riportata?",o:["Alla massa di 1 dm³ di acqua distillata a 4 °C","Alla massa di 1 cm³ di acqua a 4 °C","Alla massa di 1 m³ di acqua a 0 °C","Al peso di 1 litro d'acqua a 100 °C"],a:0,e:"Il chilogrammo è la massa del campione di Sèvres, pari circa alla massa di un decimetro cubo (un litro) di acqua distillata a 4 °C."},
{id:"fl1_013",t:"fl1",p:"1.2",l:1,q:"In quale unità si misura la quantità di sostanza nel SI?",o:["Mole","Candela","Chilogrammo","Ampere"],a:0,e:"La quantità di sostanza si misura in mole (mol). La candela misura l'intensità luminosa, l'ampere la corrente."},
{id:"fl1_014",t:"fl1",p:"1.3",l:1,q:"Il prefisso «tera» (T) corrisponde a…",o:["10¹²","10⁹","10⁶","10¹⁵"],a:0,e:"Multipli: deca 10¹, etto 10², chilo 10³, mega 10⁶, giga 10⁹, tera 10¹²."},
{id:"fl1_015",t:"fl1",p:"1.3",l:1,q:"Il prefisso «micro» (µ) corrisponde a…",o:["10⁻⁶","10⁻³","10⁻⁹","10⁻¹²"],a:0,e:"Sottomultipli: deci 10⁻¹, centi 10⁻², milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹, pico 10⁻¹²."},
{id:"fl1_016",t:"fl1",p:"1.3.1",l:2,q:"Come si scrive 0,0025 in notazione scientifica?",o:["2,5 · 10⁻³","25 · 10⁻⁴","2,5 · 10⁻²","0,25 · 10⁻²"],a:0,e:"In notazione scientifica serve una sola cifra diversa da zero prima della virgola: 0,0025 = 2,5 · 10⁻³."},
{id:"fl1_017",t:"fl1",p:"1.3.2",l:2,q:"Qual è l'ordine di grandezza di 562,5?",o:["3","2","5","1"],a:0,e:"562,5 = 5,625 · 10². Siccome 5,625 non è minore di 5, l'ODG è b + 1 = 3 (infatti 562,5 è più vicino a 1000 che a 100)."},
{id:"fl1_018",t:"fl1",p:"1.3.2",l:2,q:"Qual è l'ordine di grandezza di 23,54?",o:["1","2","0","23"],a:0,e:"23,54 = 2,354 · 10¹ e 2,354 < 5, quindi l'ODG è uguale all'esponente: 1."},
{id:"fl1_019",t:"fl1",p:"1.3",l:3,q:"A quanti nanosecondi corrispondono 201 µs?",o:["2,01 · 10⁵ ns","2,01 · 10³ ns","2,01 · 10⁻³ ns","2,01 · 10⁸ ns"],a:0,e:"201 µs = 201 · 10⁻⁶ s = 201 · 10⁻⁶ · 10⁹ ns = 201 · 10³ ns = 2,01 · 10⁵ ns."},
{id:"fl1_020",t:"fl1",p:"1.3.2",l:3,q:"Qual è l'ordine di grandezza di −0,7 km?",o:["0","−1","1","−7"],a:0,e:"−0,7 = −7 · 10⁻¹. Il segno non conta e |a| = 7 ≥ 5, quindi ODG = −1 + 1 = 0: la potenza di 10 più vicina è 10⁰ = 1."},
{id:"fl1_021",t:"fl1",p:"1.3",l:3,q:"Quale uguaglianza è corretta?",o:["60.000 ns = 10⁻⁶ min","0,01 µg = 10⁻⁸ kg","1 GeV = 10³ keV","1 Tm = 10¹⁵ km"],a:0,e:"60.000 ns = 6 · 10⁴ · 10⁻⁹ s = 6 · 10⁻⁵ s = 10⁻⁶ min (perché 1 min = 60 s). Le altre sono sbagliate: 0,01 µg = 10⁻¹¹ kg, 1 GeV = 10⁶ keV, 1 Tm = 10¹² m = 10⁹ km."},
{id:"fl1_022",t:"fl1",p:"1.4",l:1,q:"Cosa serve, oltre al modulo, per descrivere una grandezza vettoriale?",o:["La direzione e il verso","Solo l'unità di misura","Solo il verso","Il punto di applicazione e la massa"],a:0,e:"Un vettore è individuato da modulo (intensità), direzione (la retta su cui giace) e verso (indicato dalla freccia)."},
{id:"fl1_023",t:"fl1",p:"1.4",l:1,q:"Due vettori paralleli con verso opposto si dicono…",o:["antiparalleli (discordi)","concordi","ortogonali","omogenei"],a:0,e:"Paralleli: stessa direzione. Concordi: paralleli con stesso verso. Antiparalleli o discordi: paralleli con verso opposto. Ortogonali: direzioni a 90°."},
{id:"fl1_024",t:"fl1",p:"1.4.1",l:1,q:"Che cosa si ottiene moltiplicando un vettore per uno scalare negativo?",o:["Un vettore con la stessa direzione e verso opposto","Uno scalare negativo","Un vettore perpendicolare","Un vettore con verso uguale e modulo minore"],a:0,e:"Il multiplo ha la stessa direzione; il verso è concorde se lo scalare è positivo, discorde se è negativo; il modulo è moltiplicato per il valore assoluto dello scalare."},
{id:"fl1_025",t:"fl1",p:"1.4.2",l:2,q:"Due forze perpendicolari di 3 N e 4 N agiscono sullo stesso punto. Quanto vale la risultante?",o:["5 N","7 N","1 N","12 N"],a:0,e:"Con vettori ortogonali si usa Pitagora: R = √(3² + 4²) = √25 = 5 N."},
{id:"fl1_026",t:"fl1",p:"1.4.2",l:2,q:"Due vettori antiparalleli di modulo 6 e 2. Quanto vale il modulo della risultante?",o:["4, con il verso del vettore di modulo 6","8","4, con il verso del vettore di modulo 2","√40"],a:0,e:"Per vettori antiparalleli il modulo della risultante è la differenza dei moduli (6 − 2 = 4) e il verso è quello del vettore più intenso."},
{id:"fl1_027",t:"fl1",p:"1.4.3",l:2,q:"Un vettore v di modulo 8 forma un angolo di 30° con l'asse x. Quanto vale la sua componente lungo y?",o:["4","4√3","8","2"],a:0,e:"|vᵧ| = v · sen 30° = 8 · ½ = 4. La componente lungo x vale 8 · cos 30° = 4√3."},
{id:"fl1_028",t:"fl1",p:"1.4.4",l:2,q:"Quando il prodotto scalare di due vettori non nulli è zero?",o:["Quando i vettori sono perpendicolari","Quando sono paralleli e concordi","Quando sono antiparalleli","Mai"],a:0,e:"a·b = |a||b| cos θ e cos 90° = 0. Il prodotto scalare è massimo per θ = 0° e minimo (negativo) per θ = 180°."},
{id:"fl1_029",t:"fl1",p:"1.4.4",l:2,q:"Il prodotto vettoriale di due vettori paralleli…",o:["è nullo","è massimo","è uguale al prodotto dei moduli","è un numero negativo"],a:0,e:"|a ∧ b| = |a||b| sen θ e sen 0° = sen 180° = 0. Il modulo è massimo quando i vettori sono perpendicolari."},
{id:"fl1_030",t:"fl1",p:"1.4.4",l:3,q:"Quale affermazione sui prodotti tra vettori è corretta?",o:["Il prodotto scalare è commutativo, il prodotto vettoriale è anticommutativo","Sono entrambi commutativi","Sono entrambi sempre positivi","Il prodotto vettoriale dà come risultato un numero"],a:0,e:"a·b = b·a, mentre a ∧ b = −(b ∧ a): stesso modulo e direzione, verso opposto. Il prodotto scalare può essere negativo (angoli tra 90° e 180°), e il prodotto vettoriale è un vettore."},
{id:"fl1_031",t:"fl1",p:"1.4.4",l:3,q:"Due vettori di modulo 3 e 1 formano con l'asse x angoli di 60° e 30°. Quanto vale il modulo del loro prodotto vettoriale?",o:["3/2","3√3/2","3","0"],a:0,e:"L'angolo tra i vettori è 60° − 30° = 30°. |a ∧ b| = 3 · 1 · sen 30° = 3/2. (Il prodotto scalare invece vale 3 · cos 30° = 3√3/2.)"},
{id:"fl1_032",t:"fl1",p:"1.4.2",l:3,q:"Due forze uguali di modulo F formano un angolo α < 90°. Quanto vale la risultante?",o:["2F cos(α/2)","2F sen(α/2)","2F cos α","F√2"],a:0,e:"La risultante è la diagonale di un rombo di lato F: è il doppio dell'altezza del triangolo isoscele di lati F, che vale F cos(α/2). Quindi R = 2F cos(α/2)."},
{id:"fl1_033",t:"fl1",p:"1.4.4",l:3,q:"Il modulo del prodotto vettoriale di due vettori è sempre…",o:["minore o uguale al prodotto dei moduli","maggiore del prodotto dei moduli","uguale al prodotto dei moduli","uguale alla somma dei moduli"],a:0,e:"|a ∧ b| = |a||b| sen θ e sen θ ≤ 1: quindi è al massimo uguale al prodotto dei moduli (quando θ = 90°)."},
{id:"fl1_034",t:"fl1",p:"1.5",l:1,q:"Come si riducono gli errori accidentali?",o:["Ripetendo più volte la misura e facendo la media aritmetica","Cambiando unità di misura","Facendo una sola misura molto attenta","Non si possono ridurre in alcun modo"],a:0,e:"Gli errori accidentali sono casuali, per eccesso o per difetto: facendo la media di molte misure si compensano. Quelli sistematici invece non si riducono con la media."},
{id:"fl1_035",t:"fl1",p:"1.5",l:1,q:"Un righello di plastica lasciato vicino a una fonte di calore si dilata. Che errore provoca?",o:["Un errore sistematico per difetto","Un errore accidentale","Un errore sistematico per eccesso","Nessun errore"],a:0,e:"Il righello starato sbaglia sempre nello stesso verso: le sue tacche sono più distanti, quindi gli oggetti appaiono più corti. È un errore sistematico per difetto."},
{id:"fl1_036",t:"fl1",p:"1.5.2",l:2,q:"Come si calcola l'errore assoluto di una serie di misure, secondo il libro?",o:["(xmax − xmin) / 2","xmax − xmin","(xmax + xmin) / 2","Errore relativo × 100"],a:0,e:"L'errore assoluto è la semidifferenza tra il valore massimo e il minimo misurati."},
{id:"fl1_037",t:"fl1",p:"1.5.3",l:2,q:"Quante sono le cifre significative di 0,0240?",o:["3","2","4","5"],a:0,e:"Gli zeri davanti non contano; contano 2, 4 e lo zero finale dopo il 4 (che dice «0 decimi di millesimo»). Quindi 3 cifre significative."},
{id:"fl1_038",t:"fl1",p:"1.5.2",l:2,q:"Quale grandezza esprime la precisione (accuratezza) di una misura?",o:["L'errore relativo (o percentuale)","L'errore assoluto","Il valore medio","L'unità di misura"],a:0,e:"Errore relativo e percentuale sono indici di accuratezza: più sono piccoli, più la misura è precisa. L'errore assoluto da solo non basta."},
