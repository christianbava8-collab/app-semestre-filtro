{id:"cl11_004",t:"cl11",p:"11.1.1",l:2,q:"Un monosaccaride con gruppo aldeidico si chiama…",o:["aldoso", "chetoso", "alditolo", "glicoside"],a:0,e:"Con gruppo chetonico si chiama chetoso (es. fruttosio)."},
{id:"cl11_005",t:"cl11",p:"11.1.1",l:2,q:"Quale monosaccaride è un chetoesoso abbondante nella frutta e nel miele?",o:["Fruttosio", "Glucosio", "Galattosio", "Ribosio"],a:0,e:"È detto anche levulosio; il glucosio è detto destrosio."},
{id:"cl11_006",t:"cl11",p:"11.1.1",l:2,q:"Quali pentosi fanno parte dei nucleotidi?",o:["Ribosio e 2-deossiribosio", "Glucosio e fruttosio", "Galattosio e mannosio", "Saccarosio e lattosio"],a:0,e:"Gli aldopentosi più importanti."},
{id:"cl11_007",t:"cl11",p:"11.1.1",l:2,q:"D-glucosio e D-galattosio sono epimeri a quale carbonio?",o:["C4", "C2", "C1", "C6"],a:0,e:"D-glucosio e D-mannosio sono invece epimeri al C2."},
{id:"cl11_008",t:"cl11",p:"11.1.1",l:3,q:"Perché i monosaccaridi in acqua sono soprattutto in forma ciclica?",o:["Un –OH attacca il carbonile formando un emiacetale ciclico, favorito a 6 termini", "Perché perdono il carbonile", "Perché si polimerizzano", "Perché diventano aromatici"],a:0,e:"La forma piranosica (6 termini) è favorita per la minore tensione d'anello."},
{id:"cl11_009",t:"cl11",p:"11.1.1",l:3,q:"Come si chiama il carbonio C1 che si forma nella ciclizzazione del glucosio?",o:["Carbonio anomerico", "Carbonio chirale terziario", "Carbonio carbossilico", "Carbonio aromatico"],a:0,e:"Gli anomeri α (–OH sotto il piano) e β (sopra) differiscono per la sua configurazione."},
{id:"cl11_010",t:"cl11",p:"11.1.1",l:3,q:"Che cos'è la mutarotazione?",o:["La variazione nel tempo del potere rotatorio per interconversione degli anomeri α e β", "La rotazione dell'anello", "La trasformazione in fruttosio", "L'ossidazione dello zucchero"],a:0,e:"All'equilibrio il glucosio è circa 36% α e 64% β."},
{id:"cl11_011",t:"cl11",p:"11.1.1",l:3,q:"Qual è la conformazione più stabile del glucosio?",o:["A sedia con i gruppi –OH equatoriali", "A barca con –OH assiali", "Planare", "Lineare"],a:0,e:"Gli atomi di C sono sp³, quindi l'anello non è piano."},
{id:"cl11_012",t:"cl11",p:"11.1.1",l:2,q:"Quale amminozucchero forma la chitina?",o:["N-acetilglucosammina", "Glucosio", "Acido sialico", "Galattosio"],a:0,e:"Con l'acido N-acetilmurammico forma anche il peptidoglicano batterico."},
{id:"cl11_013",t:"cl11",p:"11.1.1",l:2,q:"Che cosa si ottiene riducendo il carbonile di un monosaccaride?",o:["Un alditolo (poliolo)", "Un acido aldonico", "Un glicoside", "Un disaccaride"],a:0,e:"Gli alditoli si usano come dolcificanti, diuretici e lassativi."},
{id:"cl11_014",t:"cl11",p:"11.1.1",l:2,q:"Che cosa sono gli zuccheri riducenti?",o:["Carboidrati che possono ossidarsi al C1, rilevabili con i saggi di Tollens, Fehling e Benedict", "Zuccheri che riducono il pH", "Zuccheri senza carbonile", "Solo i polisaccaridi"],a:0,e:"Sono i monosaccaridi aldosi e alcuni disaccaridi."},
{id:"cl11_015",t:"cl11",p:"11.1.1",l:3,q:"Ossidando solo il gruppo aldeidico di un aldoso si ottiene…",o:["un acido aldonico", "un acido aldarico", "un acido alduronico", "un alditolo"],a:0,e:"Aldarico: ossidati aldeide e –OH terminale; alduronico: solo l'–OH terminale (es. acido glucuronico)."},
{id:"cl11_016",t:"cl11",p:"11.1.1",l:3,q:"Che cos'è la reazione di Maillard?",o:["La reazione tra uno zucchero riducente e un gruppo amminico, che causa l'imbrunimento non enzimatico", "L'ossidazione del glucosio", "La sintesi del glicogeno", "La formazione del legame peptidico"],a:0,e:"Porta ai prodotti di Amadori, come l'emoglobina glicata, indicatore del controllo glicemico."},
{id:"cl11_017",t:"cl11",p:"11.1.1",l:2,q:"Come si chiama il legame che unisce il carbonio anomerico a un altro gruppo nucleofilo?",o:["Legame glicosidico", "Legame peptidico", "Legame fosfoanidridico", "Ponte disolfuro"],a:0,e:"Può essere O-, N- o S-glicosidico; la parte non zuccherina si chiama aglicone."},
{id:"cl11_018",t:"cl11",p:"11.1.2",l:1,q:"Quali monosaccaridi formano il saccarosio?",o:["α-glucosio + β-fruttosio", "Glucosio + galattosio", "Due glucosi", "Glucosio + ribosio"],a:0,e:"È lo zucchero da tavola, estratto da canna e barbabietola."},
{id:"cl11_019",t:"cl11",p:"11.1.2",l:2,q:"Qual è il principale zucchero del latte?",o:["Il lattosio (glucosio + galattosio)", "Il maltosio", "Il saccarosio", "Il cellobiosio"],a:0,e:"β-galattosio + α-glucosio."},
{id:"cl11_020",t:"cl11",p:"11.1.2",l:2,q:"Che legame unisce i due glucosi del maltosio?",o:["α(1→4)", "β(1→4)", "α(1→6)", "β(1→2)"],a:0,e:"Nel cellobiosio, dalla cellulosa, il legame è β(1→4)."},
{id:"cl11_021",t:"cl11",p:"11.1.3",l:2,q:"Quante unità contengono di solito gli oligosaccaridi?",o:["Da 2 a 10 circa", "Più di 1000", "Una sola", "Esattamente 20"],a:0,e:"Possono essere liberi o legati a proteine (glicoproteine) e lipidi (glicolipidi)."},
{id:"cl11_022",t:"cl11",p:"11.1.3",l:2,q:"Quale sistema di gruppi sanguigni dipende da oligosaccaridi sulla membrana degli eritrociti?",o:["Il sistema AB0", "Il fattore Rh soltanto", "Il sistema HLA", "Nessuno"],a:0,e:"Gli oligosaccaridi del glicocalice servono anche al riconoscimento cellulare."},
{id:"cl11_023",t:"cl11",p:"11.1.4",l:1,q:"Quali polisaccaridi sono formati solo da glucosio?",o:["Amido, glicogeno e cellulosa", "Chitina e peptidoglicano", "Acido ialuronico e eparina", "Inulina"],a:0,e:"Sono omopolimeri del glucosio con strutture e funzioni diverse."},
{id:"cl11_024",t:"cl11",p:"11.1.4",l:2,q:"Che legami ha l'amilopectina?",o:["α(1→4) e ramificazioni α(1→6)", "Solo α(1→4)", "β(1→4)", "β(1→6)"],a:0,e:"L'amilosio è lineare con soli α(1→4)."},
{id:"cl11_025",t:"cl11",p:"11.1.4",l:2,q:"Dove si accumula soprattutto il glicogeno?",o:["Nel fegato e nei muscoli", "Nel cervello", "Nelle ossa", "Nel sangue"],a:0,e:"È una riserva di glucosio a rapida disponibilità, molto ramificata."},
{id:"cl11_026",t:"cl11",p:"11.1.4",l:3,q:"Che cosa distingue la cellulosa dall'amido?",o:["Legami β(1→4) con catene lineari unite da legami a idrogeno", "Legami α(1→6)", "È formata da fruttosio", "È ramificata"],a:0,e:"Ha funzione strutturale nella parete cellulare vegetale."},
{id:"cl11_027",t:"cl11",p:"11.1.4",l:3,q:"Quale glicosamminoglicano ha funzione anticoagulante?",o:["L'eparina", "L'acido ialuronico", "Il condroitin solfato", "La chitina"],a:0,e:"L'acido ialuronico si trova nel liquido sinoviale, il condroitin solfato nella cartilagine."},
{id:"cl11_028",t:"cl11",p:"11.2.1",l:1,q:"Quali gruppi funzionali contiene un amminoacido?",o:["Un gruppo amminico e un gruppo carbossilico", "Solo un gruppo carbossilico", "Un gruppo ossidrile e un aldeidico", "Un gruppo fosfato"],a:0,e:"Negli α-amminoacidi l'ammino è legato al carbonio adiacente al carbossile."},
{id:"cl11_029",t:"cl11",p:"11.2.1",l:2,q:"Quale amminoacido non è chirale?",o:["La glicina", "L'alanina", "La leucina", "La lisina"],a:0,e:"Ha R = H, quindi il carbonio α ha due H."},
{id:"cl11_030",t:"cl11",p:"11.2.1",l:2,q:"A quale serie sterica appartengono gli amminoacidi delle proteine?",o:["Serie L", "Serie D", "Serie E", "Nessuna"],a:0,e:"Per analogia con la L-gliceraldeide in proiezione di Fischer."},
{id:"cl11_031",t:"cl11",p:"11.2.1",l:2,q:"Quale di questi è un amminoacido essenziale?",o:["Lisina", "Alanina", "Glicina", "Serina"],a:0,e:"Essenziali: fenilalanina, isoleucina, istidina, leucina, lisina, metionina, treonina, triptofano, valina."},
{id:"cl11_032",t:"cl11",p:"11.2.1",l:2,q:"Che cos'è la forma zwitterionica di un amminoacido?",o:["La forma con –COO⁻ e –NH₃⁺, a carica netta nulla", "La forma completamente protonata", "La forma completamente deprotonata", "Una forma ciclica"],a:0,e:"Prevale al punto isoelettrico e, per molti amminoacidi, a pH fisiologico."},
{id:"cl11_033",t:"cl11",p:"11.2.1",l:3,q:"In un'elettroforesi a pH inferiore al punto isoelettrico, dove migra un amminoacido?",o:["Verso il catodo, perché è carico positivamente", "Verso l'anodo", "Non migra", "Si decompone"],a:0,e:"A pH superiore al pI è negativo e migra verso l'anodo; al pI non migra."},
{id:"cl11_034",t:"cl11",p:"11.2.1",l:3,q:"Quale amminoacido ha una catena laterale basica?",o:["Lisina", "Acido aspartico", "Valina", "Serina"],a:0,e:"Lisina, arginina e istidina sono basici; aspartato e glutammato acidi."},
{id:"cl11_035",t:"cl11",p:"11.2.2",l:1,q:"Come si chiama il legame tra due amminoacidi?",o:["Legame peptidico (un legame ammidico)", "Legame glicosidico", "Legame fosfodiestereo", "Legame estereo"],a:0,e:"Si forma per condensazione tra il carbossile di uno e l'ammino del successivo."},
{id:"cl11_036",t:"cl11",p:"11.2.2",l:2,q:"Che cos'è la struttura primaria di una proteina?",o:["La sequenza degli amminoacidi", "L'α-elica", "Il ripiegamento globale", "L'associazione di subunità"],a:0,e:"Da essa dipendono tutti i livelli successivi."},
{id:"cl11_037",t:"cl11",p:"11.2.2",l:2,q:"Da che cosa sono stabilizzate α-elica e foglietto β?",o:["Da legami a idrogeno tra gruppi –CONH– dello scheletro", "Da ponti disolfuro soltanto", "Da legami ionici tra le R", "Da legami covalenti tra le R"],a:0,e:"Sono strutture secondarie; la terziaria dipende dalle catene laterali R."},
{id:"cl11_038",t:"cl11",p:"11.2.2",l:3,q:"Quali interazioni stabilizzano la struttura terziaria?",o:["Legami a idrogeno, ponti disolfuro, van der Waals, interazioni idrofobiche e ioniche tra le R", "Solo legami peptidici", "Solo legami glicosidici", "Nessuna"],a:0,e:"Le R apolari tendono a stare all'interno, lontano dall'acqua."},
{id:"cl11_039",t:"cl11",p:"11.2.2",l:3,q:"Perché l'emoglobina ha struttura quaternaria?",o:["È formata da quattro subunità e contiene il gruppo eme", "Perché ha quattro amminoacidi", "Perché è un peptide", "Perché non ha struttura terziaria"],a:0,e:"La struttura quaternaria riguarda più subunità o gruppi prostetici."},
{id:"cl11_040",t:"cl11",p:"11.2.2",l:2,q:"Che cos'è la denaturazione di una proteina?",o:["La perdita della struttura tridimensionale, con alterazione delle sue proprietà", "La rottura dei legami peptidici", "La sintesi della proteina", "L'aggiunta di zuccheri"],a:0,e:"È causata da calore, pH o solvente e può essere reversibile o irreversibile."},
{id:"cl11_041",t:"cl11",p:"11.2.2",l:2,q:"Per convenzione, come si scrive una catena polipeptidica?",o:["Con l'estremità N-terminale a sinistra e la C-terminale a destra", "Con la C-terminale a sinistra", "In ordine alfabetico", "Dal più pesante al più leggero"],a:0,e:"L'estremità N ha l'ammino libero, la C il carbossile libero."},
{id:"cl11_042",t:"cl11",p:"11.3",l:1,q:"Che cosa accomuna i lipidi?",o:["La scarsa solubilità in acqua", "La presenza di azoto", "Il gruppo aldeidico", "La struttura polimerica"],a:0,e:"Sono una classe eterogenea: trigliceridi, cere, fosfolipidi, steroidi."},
{id:"cl11_043",t:"cl11",p:"11.3",l:2,q:"Quali lipidi NON sono saponificabili?",o:["Gli steroidi", "I trigliceridi", "I fosfolipidi", "Le cere"],a:0,e:"Non contengono acidi grassi esterificati (come terpeni e vitamine liposolubili)."},
{id:"cl11_044",t:"cl11",p:"11.3",l:2,q:"Un lipide che contiene anche fosforo o azoto si dice…",o:["complesso", "semplice", "saturo", "non saponificabile"],a:0,e:"I lipidi semplici contengono solo C, H e O."},
{id:"cl11_045",t:"cl11",p:"11.3.1",l:1,q:"Perché gli acidi grassi saturi sono solidi a temperatura ambiente?",o:["Le catene lineari si impaccano bene", "Perché hanno doppi legami", "Perché sono corti", "Perché sono ionici"],a:0,e:"I doppi legami cis degli insaturi piegano la catena e abbassano il punto di fusione."},
{id:"cl11_046",t:"cl11",p:"11.3.1",l:2,q:"Quale acido grasso è tipico dell'olio d'oliva?",o:["L'acido oleico (ω-9)", "L'acido palmitico", "L'acido stearico", "L'acido laurico"],a:0,e:"Gli oli vegetali sono ricchi di acidi grassi insaturi."},
{id:"cl11_047",t:"cl11",p:"11.3.1",l:2,q:"Che cosa indica la notazione ω-3?",o:["Il primo doppio legame è sul terzo carbonio contando dall'estremità opposta al carbossile", "Ci sono tre doppi legami", "Ci sono 3 atomi di carbonio", "Il doppio legame è sul C3 dal carbossile"],a:0,e:"ω-6 indica il sesto carbonio, ω-9 il nono."},
{id:"cl11_048",t:"cl11",p:"11.3.1",l:3,q:"Quali sono gli acidi grassi essenziali per l'uomo?",o:["Acido linolenico (ω-3) e acido linoleico (ω-6)", "Acido palmitico e stearico", "Acido oleico e laurico", "Acido acetico e butirrico"],a:0,e:"L'organismo non li sintetizza: il linolenico è nei semi di lino e nelle noci."},
{id:"cl11_049",t:"cl11",p:"11.3.1",l:2,q:"Gli acidi grassi naturali hanno in genere un numero di carboni…",o:["pari", "dispari", "sempre 12", "sempre 20"],a:0,e:"È una conseguenza del loro meccanismo biosintetico."},
{id:"cl11_050",t:"cl11",p:"11.3.2",l:1,q:"Da che cosa è formato un trigliceride?",o:["Glicerolo esterificato con tre acidi grassi", "Glicerolo, due acidi grassi e un fosfato", "Sfingosina e un acido grasso", "Quattro anelli condensati"],a:0,e:"Serve come riserva di energia."},
{id:"cl11_051",t:"cl11",p:"11.3.2",l:2,q:"Perché gli oli sono liquidi e i grassi solidi?",o:["Gli oli contengono soprattutto acidi grassi insaturi, i grassi saturi", "Gli oli hanno più glicerolo", "I grassi sono ionici", "Gli oli non sono trigliceridi"],a:0,e:"Gli oli sono di solito vegetali, i grassi animali."},
{id:"cl11_052",t:"cl11",p:"11.3.2",l:2,q:"Che cosa si ottiene dalla saponificazione di un trigliceride con NaOH?",o:["Glicerolo e sali di sodio degli acidi grassi (saponi)", "Glucosio e acidi grassi", "Colesterolo", "Fosfolipidi"],a:0,e:"I saponi di sodio sono duri, quelli di potassio molli."},
{id:"cl11_053",t:"cl11",p:"11.3.2",l:3,q:"Come agiscono i saponi?",o:["Sono anfipatici e formano micelle che inglobano lo sporco apolare", "Reagiscono con lo sporco formando gas", "Sono acidi forti", "Ossidano i grassi"],a:0,e:"Code idrofobe all'interno, teste idrofile verso l'acqua."},
{id:"cl11_054",t:"cl11",p:"11.3.3",l:2,q:"Da che cosa è formato un glicerofosfolipide?",o:["Glicerolo, due acidi grassi e un fosfato legato a un gruppo polare", "Glicerolo e tre acidi grassi", "Sfingosina e zuccheri", "Quattro anelli"],a:0,e:"Ha una testa polare e due code apolari (molecola anfipatica)."},
{id:"cl11_055",t:"cl11",p:"11.3.3",l:2,q:"Quale amminoalcol forma lo scheletro degli sfingolipidi?",o:["La sfingosina", "La colina", "La serina", "L'etanolammina"],a:0,e:"Con un acido grasso forma la ceramide; cerebrosidi e gangliosidi hanno residui zuccherini."},
{id:"cl11_056",t:"cl11",p:"11.3.3",l:2,q:"Qual è la struttura base degli steroidi?",o:["Quattro anelli condensati (ciclopentanoperidrofenantrene)", "Una catena lineare", "Un anello benzenico", "Glicerolo e acidi grassi"],a:0,e:"Il colesterolo è il precursore di ormoni, acidi biliari e vitamina D."},
{id:"cl11_057",t:"cl11",p:"11.3.3",l:3,q:"Perché il colesterolo viaggia nel sangue legato alle lipoproteine?",o:["È insolubile nel plasma", "È troppo piccolo", "È carico positivamente", "Si degrada nel sangue"],a:0,e:"Livelli cronicamente alti favoriscono le placche ateromatose (aterosclerosi)."},
{id:"cl11_058",t:"cl11",p:"11.3.3",l:2,q:"Che cosa sono le cere?",o:["Esteri di acidi grassi con alcoli monovalenti a lunga catena", "Trigliceridi insaturi", "Steroidi", "Fosfolipidi"],a:0,e:"Hanno funzione protettiva e impermeabilizzante (cera d'api, foglie, mele)."},
{id:"cl11_059",t:"cl11",p:"11.4",l:1,q:"Da che cosa è formato un nucleotide?",o:["Uno zucchero pentoso, una base azotata e uno o più fosfati", "Glucosio e un amminoacido", "Glicerolo e acidi grassi", "Solo una base azotata"],a:0,e:"Senza fosfati si chiama nucleoside."},
{id:"cl11_060",t:"cl11",p:"11.4",l:2,q:"Quali sono le basi puriniche?",o:["Adenina e guanina", "Citosina e timina", "Uracile e citosina", "Timina e adenina"],a:0,e:"Le purine hanno due anelli; le pirimidine (citosina, timina, uracile) uno."},
{id:"cl11_061",t:"cl11",p:"11.4",l:2,q:"Quale base è presente nell'RNA ma non nel DNA?",o:["L'uracile", "La timina", "L'adenina", "La citosina"],a:0,e:"Il DNA usa la timina."},
{id:"cl11_062",t:"cl11",p:"11.4",l:3,q:"Come è legata la base azotata allo zucchero del nucleotide?",o:["Con un legame N-glicosidico al carbonio 1'", "Con un legame fosfoestereo al 5'", "Con un legame peptidico", "Con un ponte disolfuro"],a:0,e:"Il fosfato è legato al carbonio 5' con un legame fosfoestereo."},
{id:"cl11_063",t:"cl11",p:"11.4",l:2,q:"Che differenza c'è tra ribosio e 2-deossiribosio?",o:["Nel deossiribosio manca l'–OH sul carbonio 2'", "Il ribosio ha 6 carboni", "Il deossiribosio è un chetoso", "Nessuna"],a:0,e:"Il ribosio forma i ribonucleotidi (RNA), il deossiribosio i deossiribonucleotidi (DNA)."},
{id:"cl11_064",t:"cl11",p:"11.4.1",l:2,q:"Tra quali gruppi avviene la condensazione di due nucleotidi?",o:["Tra l'–OH al 3' di uno e il fosfato al 5' del successivo", "Tra due basi azotate", "Tra due fosfati", "Tra il 1' e il 5'"],a:0,e:"Si forma un ponte fosfodiestereo."},
{id:"cl11_065",t:"cl11",p:"11.4.1",l:2,q:"Che cosa si trova alle estremità di una catena di acido nucleico?",o:["Un fosfato libero all'estremità 5' e un –OH libero all'estremità 3'", "Due basi azotate", "Due fosfati", "Due –OH"],a:0,e:"Lo scheletro zucchero-fosfato porta le basi sporgenti."},
{id:"cl11_066",t:"cl11",p:"11.4.2",l:1,q:"Con quale base si appaia l'adenina nel DNA?",o:["Timina", "Guanina", "Citosina", "Uracile"],a:0,e:"A–T (o A–U nell'RNA) con 2 legami a idrogeno."},
{id:"cl11_067",t:"cl11",p:"11.4.2",l:2,q:"Quanti legami a idrogeno ci sono nella coppia G–C?",o:["3", "2", "1", "4"],a:0,e:"A–T ne ha 2."},
{id:"cl11_068",t:"cl11",p:"11.4.2",l:3,q:"Perché una purina si appaia sempre con una pirimidina?",o:["Per la direzionalità dei legami a idrogeno e la geometria regolare della doppia elica", "Perché hanno la stessa massa", "Perché sono entrambe cariche", "Per caso"],a:0,e:"È la complementarietà delle basi."},
{id:"cl11_069",t:"cl11",p:"11.4.3",l:2,q:"Quale nucleotide funge da secondo messaggero?",o:["Il cAMP (AMP ciclico)", "L'ATP", "Il NAD⁺", "L'UTP"],a:0,e:"Interviene in alcune vie di segnalazione cellulare."},
{id:"cl11_070",t:"cl11",p:"11.4.3",l:2,q:"A che cosa serve l'UTP nella sintesi del glicogeno?",o:["Ad attivare il glucosio", "A ossidare il glucosio", "A fornire azoto", "A trasportare ossigeno"],a:0,e:"Lo zucchero attivato si lega alla catena in crescita."},
{id:"cl11_071",t:"cl11",p:"11.4.3",l:3,q:"Quale coenzima redox è usato soprattutto nelle vie biosintetiche?",o:["NADP⁺/NADPH", "NAD⁺/NADH", "ATP", "GTP"],a:0,e:"NADPH serve per sintesi di colesterolo e acidi grassi e contro i radicali liberi."},
{id:"cl11_072",t:"cl11",p:"11.4.3",l:2,q:"Quale nucleotide fa da \"interruttore molecolare\" nella segnalazione cellulare?",o:["Il GTP", "Il cAMP", "L'UTP", "Il FAD"],a:0,e:"Il GTP ha anche un ruolo energetico nella sintesi proteica."},
{id:"cl11_sf1",t:"cl11",p:"11.1.2",l:4,q:"Quale disaccaride NON è riducente?",o:["Saccarosio", "Maltosio", "Lattosio", "Cellobiosio"],a:0,e:"Nel saccarosio il legame unisce entrambi i carboni anomerici (C1 del glucosio e C2 del fruttosio): non resta un'estremità che si possa aprire e ossidare."},
{id:"cl11_sf2",t:"cl11",p:"11.2.1",l:4,q:"L'acido aspartico ha pI ≈ 2,8. A pH 7, in elettroforesi, dove migra?",o:["Verso l'anodo (polo positivo)", "Verso il catodo", "Non migra", "Si ferma a metà"],a:0,e:"A pH maggiore del pI l'amminoacido ha carica netta negativa e va verso il polo positivo."},
{id:"cl11_sf3",t:"cl11",p:"11.1.4",l:4,q:"Quale polisaccaride gli esseri umani non riescono a digerire?",o:["Cellulosa", "Amido", "Glicogeno", "Amilopectina"],a:0,e:"Ha legami β(1→4), che i nostri enzimi digestivi non idrolizzano; amido e glicogeno hanno legami α."},
{id:"cl11_sf4",t:"cl11",p:"11.4.2",l:4,q:"Un frammento di DNA contiene il 20% di adenina. Quanta citosina contiene?",o:["30%", "20%", "40%", "60%"],a:0,e:"A = T = 20%, quindi A + T = 40%; G + C = 60% e, essendo uguali, C = 30%."},
{id:"cl11_sf5",t:"cl11",p:"11.3.2",l:4,q:"Quale prodotto si ottiene dall'idrolisi basica completa della tristearina con KOH?",o:["Glicerolo e stearato di potassio", "Glicerolo e acido stearico libero", "Colesterolo e stearato", "Sfingosina e stearato"],a:0,e:"In ambiente basico l'acido grasso si trova come sale (carbossilato): è un sapone molle di potassio."},
{id:"bl1_001",t:"bl1",p:"1.1",l:1,q:"Quale caratteristica distingue fondamentalmente un vivente da un oggetto inanimato?",o:["La capacità di riprodursi secondo un programma genetico", "La capacità di muoversi", "La presenza di acqua", "Il colore"],a:0,e:"Tutti i viventi sono formati da cellule, crescono, si riproducono, regolano il metabolismo, rispondono agli stimoli, hanno informazione genetica ed evolvono."},
{id:"bl1_002",t:"bl1",p:"1.1",l:1,q:"Che cos'è l'omeostasi?",o:["La stabilità delle caratteristiche dell'ambiente interno", "La crescita dell'organismo", "La riproduzione", "L'evoluzione della specie"],a:0,e:"Per esempio la temperatura corporea o la glicemia."},
{id:"bl1_003",t:"bl1",p:"1.1",l:2,q:"Quali sono gli unici \"viventi\" non formati da cellule, secondo il libro?",o:["I virus", "I batteri", "I funghi", "I protisti"],a:0,e:"A esclusione dei virus, tutti gli esseri viventi sono formati da cellule."},
{id:"bl1_004",t:"bl1",p:"1.2",l:1,q:"Qual è l'ordine corretto dei livelli di organizzazione?",o:["Cellula → tessuto → organo → organismo → popolazione", "Tessuto → cellula → organo → organismo", "Organo → tessuto → cellula", "Popolazione → organismo → comunità"],a:0,e:"Poi comunità, ecosistema, biosfera."},
{id:"bl1_005",t:"bl1",p:"1.2",l:2,q:"Che cosa sono le proprietà emergenti?",o:["Proprietà di un livello più complesse della somma delle parti", "Proprietà di una singola molecola", "Mutazioni casuali", "Caratteri ereditari recessivi"],a:0,e:"Ogni livello di complessità ne ha di proprie."},
{id:"bl1_006",t:"bl1",p:"1.2",l:2,q:"Perché mantenere l'ordine richiede energia?",o:["Per il secondo principio della termodinamica ogni sistema tende al disordine", "Perché le cellule sono sistemi isolati", "Perché l'energia si crea dal nulla", "Non richiede energia"],a:0,e:"I viventi sono sistemi aperti che scambiano materia ed energia."},
{id:"bl1_007",t:"bl1",p:"1.3",l:1,q:"A quando risalgono i fossili più antichi, simili ai batteri?",o:["3,5-3,8 miliardi di anni fa", "600 milioni di anni fa", "10.000 anni fa", "10 miliardi di anni fa"],a:0,e:"L'atmosfera primordiale era riducente, quindi le prime cellule erano anaerobie."},
{id:"bl1_008",t:"bl1",p:"1.3",l:2,q:"Che cosa sono le stromatoliti?",o:["Rocce stratificate prodotte da procarioti simili ai cianobatteri", "Fossili di dinosauri", "Cellule eucariotiche primitive", "Cristalli di ghiaccio"],a:0,e:"Indicano una comparsa molto precoce della fotosintesi (3,5 miliardi di anni fa)."},
{id:"bl1_009",t:"bl1",p:"1.3",l:2,q:"Quale conseguenza ebbe la comparsa di ossigeno nell'atmosfera?",o:["La formazione dello strato di ozono e del metabolismo aerobico", "La scomparsa della fotosintesi", "L'aumento della generazione spontanea", "La scomparsa degli eterotrofi"],a:0,e:"Impedì anche il ripetersi della formazione della vita dalla non vita."},
{id:"bl1_010",t:"bl1",p:"1.3.1",l:1,q:"Secondo la teoria dell'endosimbiosi, da che cosa derivano mitocondri e cloroplasti?",o:["Da procarioti inglobati da un procariote più grande", "Da invaginazioni del nucleo", "Da virus", "Dal reticolo endoplasmatico"],a:0,e:"I mitocondri da procarioti respiranti, i cloroplasti da procarioti fotosintetici."},
{id:"bl1_011",t:"bl1",p:"1.3.1",l:2,q:"A circa quanto tempo fa risalgono i primi organismi pluricellulari, secondo il libro?",o:["Circa 600 milioni di anni fa", "3,5 miliardi di anni fa", "10 milioni di anni fa", "100.000 anni fa"],a:0,e:"Probabilmente da un unicellulare le cui cellule figlie non si separarono."},
{id:"bl1_012",t:"bl1",p:"1.3.2",l:1,q:"In quanti domini e regni si classificano i viventi?",o:["3 domini e 6 regni", "2 domini e 5 regni", "5 domini e 3 regni", "1 dominio e 6 regni"],a:0,e:"Domini: Archei, Batteri, Eucarioti. Regni: Archeobatteri, Eubatteri, Protisti, Funghi, Piante, Animali."},
{id:"bl1_013",t:"bl1",p:"1.3.2",l:2,q:"Come si nutrono i funghi?",o:["Sono eterotrofi", "Sono autotrofi fotosintetici", "Sono chemiosintetici", "Non si nutrono"],a:0,e:"Possono essere unicellulari (lieviti) o pluricellulari filamentosi."},
{id:"bl1_014",t:"bl1",p:"1.3.2",l:2,q:"A quale dominio appartengono amebe e parameci?",o:["Eucarioti (regno Protisti)", "Batteri", "Archei", "Virus"],a:0,e:"I protisti sono eucarioti unicellulari, coloniali o pluricellulari semplici."},
{id:"bl1_015",t:"bl1",p:"1.4",l:1,q:"In che anno Darwin pubblicò L'origine delle specie?",o:["1859", "1809", "1900", "1665"],a:0,e:"Darwin visse dal 1809 al 1882."},
{id:"bl1_016",t:"bl1",p:"1.4",l:2,q:"Secondo Darwin, che ruolo ha l'ambiente?",o:["Indiretto: seleziona i caratteri favorevoli, non li crea", "Crea i caratteri nuovi", "Nessun ruolo", "Trasmette i caratteri acquisiti"],a:0,e:"La variabilità è casuale; l'ambiente fa sopravvivere gli individui più adatti."},
{id:"bl1_017",t:"bl1",p:"1.4",l:2,q:"Quali lacune aveva la teoria di Darwin?",o:["Non spiegava come si trasmettono i caratteri né l'origine della variabilità", "Non spiegava la selezione naturale", "Non parlava di evoluzione", "Negava l'ereditarietà"],a:0,e:"Le ha risolte la genetica: mutazione e ricombinazione (neodarwinismo)."},
{id:"bl1_018",t:"bl1",p:"1.4",l:3,q:"Come si chiama la teoria che unisce Darwin e la genetica?",o:["Neodarwinismo (teoria sintetica dell'evoluzione)", "Lamarckismo", "Fissismo", "Teoria cellulare"],a:0,e:"Da questa sintesi nasce anche la genetica di popolazione."},
{id:"bl1_019",t:"bl1",p:"1.4.1",l:2,q:"In termini moderni, che cos'è la selezione naturale?",o:["La diversa capacità riproduttiva di genotipi diversi in una popolazione", "La sopravvivenza dei più forti fisicamente", "La comparsa di mutazioni", "La migrazione"],a:0,e:"Modifica le frequenze alleliche della popolazione."},
{id:"bl1_020",t:"bl1",p:"1.4.1",l:2,q:"Quale tipo di selezione elimina le forme estreme e riduce la variabilità?",o:["Stabilizzatrice", "Direzionale", "Divergente", "Sessuale"],a:0,e:"Agisce soprattutto quando l'ambiente è stabile."},
{id:"bl1_021",t:"bl1",p:"1.4.1",l:3,q:"La Biston betularia scura diventata comune con l'inquinamento è un esempio di selezione…",o:["direzionale", "stabilizzatrice", "divergente", "sessuale"],a:0,e:"L'allele dominante scuro passò da circa il 20% a circa il 100% in cinquant'anni."},
{id:"bl1_022",t:"bl1",p:"1.4.1",l:3,q:"Quale selezione favorisce le forme estreme e può portare al polimorfismo?",o:["Divergente", "Stabilizzatrice", "Direzionale", "Artificiale"],a:0,e:"In certe circostanze può portare a due nuove specie."},
{id:"bl1_023",t:"bl1",p:"1.4.1",l:2,q:"Il piumaggio vistoso dei maschi di molti uccelli è dovuto a…",o:["selezione sessuale", "selezione stabilizzatrice", "deriva genetica", "mutazioni indotte"],a:0,e:"Le femmine scelgono i maschi con certe caratteristiche."},
{id:"bl1_024",t:"bl1",p:"1.5",l:1,q:"Quali sono i quattro elementi quantitativamente più importanti nei viventi?",o:["Ossigeno, carbonio, idrogeno, azoto", "Ferro, calcio, sodio, potassio", "Carbonio, zolfo, fosforo, ferro", "Ossigeno, sodio, cloro, carbonio"],a:0,e:"Con fosforo e zolfo costituiscono il 99% della sostanza vivente."},
{id:"bl1_025",t:"bl1",p:"1.5",l:2,q:"Come si formano i polimeri biologici?",o:["Con reazioni di condensazione, che eliminano acqua", "Con reazioni di idrolisi", "Con reazioni nucleari", "Per evaporazione"],a:0,e:"L'idrolisi è la reazione inversa, che aggiunge acqua."},
{id:"bl1_026",t:"bl1",p:"1.5",l:2,q:"Quale percentuale del peso di una cellula batterica è acqua?",o:["Circa il 70%", "Circa il 15%", "Circa il 26%", "Circa il 99%"],a:0,e:"Le macromolecole sono il 26%, le proteine da sole il 15%."},
{id:"bl1_027",t:"bl1",p:"1.6",l:2,q:"Quanta energia hanno circa i legami deboli rispetto a un legame covalente?",o:["Meno di 1/20", "Il doppio", "Uguale", "Dieci volte di più"],a:0,e:"Funzionano solo se agiscono in molti insieme e danno flessibilità alle macromolecole."},
{id:"bl1_028",t:"bl1",p:"1.6",l:2,q:"Quali interazioni deboli sono importanti in biologia?",o:["Legami a idrogeno, van der Waals, dipolo-dipolo, idrofobiche", "Solo legami covalenti", "Solo legami metallici", "Reazioni nucleari"],a:0,e:"Danno forma a DNA e proteine e tengono insieme i complessi proteici."},
{id:"bl1_029",t:"bl1",p:"1.7",l:1,q:"Qual è il contenuto d'acqua medio del corpo umano adulto?",o:["Circa il 60%", "Circa il 90%", "Circa il 30%", "Circa il 75%"],a:0,e:"Nei neonati è circa il 75%."},
{id:"bl1_030",t:"bl1",p:"1.7",l:2,q:"A che temperatura l'acqua ha la massima densità?",o:["4 °C", "0 °C", "100 °C", "37 °C"],a:0,e:"Passando a ghiaccio aumenta di volume per gli anelli esagonali tenuti da legami a idrogeno."},
{id:"bl1_031",t:"bl1",p:"1.8",l:1,q:"Qual è la desinenza tipica dei carboidrati?",o:["-osio", "-asi", "-ina", "-olo"],a:0,e:"Esempi: glucosio, fruttosio, saccarosio."},
{id:"bl1_032",t:"bl1",p:"1.8",l:2,q:"Quante unità danno per idrolisi gli oligosaccaridi, secondo il libro?",o:["Da 3 a 10", "2", "Più di 100", "1"],a:0,e:"I disaccaridi danno 2 monosaccaridi, i polisaccaridi più di 100."},
{id:"bl1_033",t:"bl1",p:"1.8",l:2,q:"Che percentuale del peso secco dei vegetali costituiscono i carboidrati?",o:["60-90%", "Circa l'1%", "Circa il 10%", "Il 100%"],a:0,e:"Nei tessuti umani sono solo l'1% circa, ma sono la principale fonte di calorie."},
{id:"bl1_034",t:"bl1",p:"1.9",l:1,q:"Quale amminoacido non ha carbonio chirale?",o:["La glicina", "L'alanina", "La serina", "La lisina"],a:0,e:"Ha R = H."},
{id:"bl1_035",t:"bl1",p:"1.9",l:2,q:"Quanti dei 20 amminoacidi proteici l'uomo non può sintetizzare, secondo questo capitolo?",o:["10", "2", "20", "5"],a:0,e:"Sono detti essenziali e vanno introdotti con l'alimentazione."},
{id:"bl1_036",t:"bl1",p:"1.9",l:2,q:"Come si chiama la parte non proteica di una proteina coniugata?",o:["Gruppo prostetico", "Dominio", "Motivo", "Coenzima libero"],a:0,e:"Esempi: eme nell'emoglobina, lipidi nelle LDL, carboidrati nelle immunoglobuline."},
{id:"bl1_037",t:"bl1",p:"1.9",l:2,q:"Le proteine fibrose sono…",o:["insolubili in acqua, flessibili e resistenti", "idrosolubili e sferiche", "sempre enzimi", "prive di amminoacidi"],a:0,e:"Le globulari sono idrosolubili e circa sferiche."},
{id:"bl1_038",t:"bl1",p:"1.9",l:3,q:"Quale proteina ha funzione di deposito del ferro?",o:["La ferritina", "L'emoglobina", "La cheratina", "L'actina"],a:0,e:"La cheratina è strutturale, l'emoglobina di trasporto, l'actina contrattile."},
{id:"bl1_039",t:"bl1",p:"1.9.3",l:2,q:"Che differenza c'è tra motivi e domini proteici?",o:["I domini sono regioni stabili e spesso autonome; i motivi sono brevi sequenze non stabili da sole", "Sono sinonimi", "I motivi sono più grandi dei domini", "I domini sono sequenze di DNA"],a:0,e:"Un dominio può contenere più motivi e trovarsi in proteine diverse."},
{id:"bl1_040",t:"bl1",p:"1.9.3",l:3,q:"Quale dominio è tipico dei fattori di trascrizione?",o:["Lo zinc finger, che lega DNA o RNA", "L'immunoglobulin-like", "Il dominio di membrana", "Il dominio catalitico della chinasi"],a:0,e:"L'immunoglobulin-like serve al riconoscimento molecolare."},
{id:"bl1_041",t:"bl1",p:"1.9.4",l:2,q:"Che cosa fanno le chinasi?",o:["Aggiungono gruppi fosfato alle proteine", "Rimuovono fosfati", "Degradano le proteine", "Sintetizzano DNA"],a:0,e:"Le fosfatasi rimuovono i fosfati: è una modificazione covalente reversibile."},
{id:"bl1_042",t:"bl1",p:"1.9.4",l:2,q:"Quando è attiva una proteina G?",o:["Quando lega GTP", "Quando lega GDP", "Quando è fosforilata dall'ubiquitina", "Sempre"],a:0,e:"Funziona da interruttore molecolare, regolata da GEF e GAP."},
{id:"bl1_043",t:"bl1",p:"1.9.4",l:3,q:"Come vengono eliminate le proteine danneggiate?",o:["Marcate con ubiquitina e degradate nel proteasoma", "Esportate dalla cellula", "Trasformate in DNA", "Accumulate nel nucleo"],a:0,e:"È la via ubiquitina-proteasoma."},
{id:"bl1_044",t:"bl1",p:"1.9.4",l:3,q:"Che cos'è la regolazione allosterica?",o:["Un cambio di conformazione dovuto a un ligando legato in un sito diverso dal sito attivo", "La rottura della proteina", "La sintesi di nuove proteine", "L'aggiunta di zuccheri"],a:0,e:"È tipica degli enzimi allosterici, interruttori on/off."},
{id:"bl1_045",t:"bl1",p:"1.10",l:1,q:"Che cosa accomuna i lipidi?",o:["L'insolubilità in acqua e la solubilità nei solventi apolari", "La presenza di azoto", "La struttura polimerica", "Il sapore dolce"],a:0,e:"Hanno ruolo strutturale, di riserva e di messaggeri (ormoni steroidei)."},
{id:"bl1_046",t:"bl1",p:"1.10",l:2,q:"Quale ormone citato dal libro è un lipide?",o:["Il testosterone", "L'insulina", "Il glucagone", "L'adrenalina"],a:0,e:"Anche l'aldosterone appartiene ai lipidi."},
{id:"bl1_047",t:"bl1",p:"1.11",l:1,q:"Da che cosa è formato un nucleotide?",o:["Una base azotata, uno zucchero pentoso e acido fosforico", "Un amminoacido e un fosfato", "Glicerolo e acidi grassi", "Solo una base azotata"],a:0,e:"Idrolizzando un nucleotide si ottengono acido fosforico e un nucleoside."},
{id:"bl1_048",t:"bl1",p:"1.11",l:2,q:"Quanti legami a idrogeno ci sono tra guanina e citosina?",o:["3", "2", "1", "4"],a:0,e:"Adenina e timina ne formano 2."},
{id:"bl1_049",t:"bl1",p:"1.11",l:2,q:"Che differenze ha l'RNA rispetto al DNA?",o:["È a filamento singolo, ha ribosio e uracile al posto della timina", "Ha deossiribosio e timina", "È a doppia elica", "Non ha fosfati"],a:0,e:"Il DNA ha due filamenti antiparalleli avvolti a elica."},
{id:"bl1_050",t:"bl1",p:"1.12",l:1,q:"Chi introdusse il termine \"cellula\" nel 1665?",o:["Robert Hooke", "Charles Darwin", "Rudolf Virchow", "Gregor Mendel"],a:0,e:"Osservando una sezione di sughero."},
{id:"bl1_051",t:"bl1",p:"1.12",l:2,q:"Quale affermazione fa parte della teoria cellulare?",o:["Ogni cellula deriva da un'altra cellula preesistente", "Le cellule nascono per generazione spontanea", "Solo gli animali hanno cellule", "Il DNA si trova solo nei batteri"],a:0,e:"Formulata da Schleiden, Schwann e Virchow a metà Ottocento."},
{id:"bl1_052",t:"bl1",p:"1.12",l:2,q:"Che cos'è il citosol?",o:["La componente fluida del citoplasma", "Tutto il contenuto della cellula compreso il nucleo", "La membrana cellulare", "Il nucleo"],a:0,e:"Il citoplasma è tutto ciò che sta dentro la membrana tranne il nucleo."},
{id:"bl1_053",t:"bl1",p:"1.12.1",l:1,q:"Dove si trova il DNA di un procariote?",o:["In una regione detta nucleoide, senza membrana", "In un nucleo con doppia membrana", "Nei mitocondri", "Nei lisosomi"],a:0,e:"È una singola molecola circolare; possono esserci anche plasmidi."},
{id:"bl1_054",t:"bl1",p:"1.12.1",l:2,q:"Quali dimensioni hanno le cellule procariotiche?",o:["0,5-5 µm", "10-100 µm", "1-5 mm", "1-5 nm"],a:0,e:"In media circa 2 micrometri."},
{id:"bl1_055",t:"bl1",p:"1.12.1",l:2,q:"Di che cosa è fatta la parete dei batteri?",o:["Peptidoglicano", "Cellulosa", "Chitina", "Cheratina"],a:0,e:"Catene di N-acetilglucosammina e acido N-acetilmuramico con ponti peptidici (non negli archeobatteri)."},
{id:"bl1_056",t:"bl1",p:"1.12.1",l:3,q:"Che cosa sono i mesosomi?",o:["Invaginazioni della membrana dei procarioti sede di reazioni enzimatiche", "Organelli con doppia membrana", "Ribosomi grandi", "Flagelli"],a:0,e:"Coinvolti in respirazione, fotosintesi, divisione e sintesi dei lipidi."},
{id:"bl1_057",t:"bl1",p:"1.12.1",l:3,q:"A che cosa servono i pili dei procarioti?",o:["Ad adesione e trasferimento genico (coniugazione)", "Al movimento", "Alla fotosintesi", "Alla respirazione"],a:0,e:"I flagelli, di flagellina, servono invece al movimento."},
{id:"bl1_058",t:"bl1",p:"1.12.2",l:1,q:"Quali dimensioni hanno le cellule eucariotiche?",o:["10-100 µm", "0,5-5 µm", "1-5 nm", "1-10 mm"],a:0,e:"Hanno organelli e un nucleo con cromosomi lineari."},
{id:"bl1_059",t:"bl1",p:"1.12.2",l:2,q:"Che cosa caratterizza il DNA degli eucarioti?",o:["Più cromosomi lineari associati a proteine, nel nucleo", "Una molecola circolare nel citoplasma", "Solo plasmidi", "Assenza di proteine"],a:0,e:"Gli eucarioti possono essere unicellulari (protisti) o pluricellulari."},
{id:"bl1_060",t:"bl1",p:"1.12.3",l:2,q:"Quale caratteristica è comune a tutti i tipi cellulari?",o:["L'ATP come molecola che conserva energia", "La presenza di flagelli", "La necessità di ossigeno", "La stessa dimensione"],a:0,e:"Comuni anche la composizione chimica, il DNA e reazioni come la glicolisi."},
{id:"bl1_061",t:"bl1",p:"1.12.3",l:3,q:"Che conseguenze possono avere gli errori nella replicazione del DNA?",o:["Dannose, indifferenti o utili", "Sempre dannose", "Sempre utili", "Nessuna"],a:0,e:"Le novità favorevoli o indifferenti possono essere trasmesse."},
{id:"bl1_062",t:"bl1",p:"1.13",l:1,q:"Qual è la struttura base della membrana cellulare?",o:["Un doppio strato fosfolipidico con proteine", "Un singolo strato di proteine", "Una parete di cellulosa", "Uno strato di DNA"],a:0,e:"È descritta dal modello a mosaico fluido."},
{id:"bl1_063",t:"bl1",p:"1.13",l:2,q:"Quale lipide rende più stabile la membrana degli animali?",o:["Il colesterolo", "Il trigliceride", "La cellulosa", "La cheratina"],a:0,e:"I batteri ne sono privi."},
{id:"bl1_064",t:"bl1",p:"1.14",l:1,q:"Il trasporto passivo avviene…",o:["secondo gradiente di concentrazione, senza spesa di energia", "contro gradiente con ATP", "solo con vescicole", "solo per le proteine"],a:0,e:"Il trasporto attivo va contro gradiente e consuma energia."},
{id:"bl1_065",t:"bl1",p:"1.15",l:1,q:"Quali molecole attraversano liberamente la membrana?",o:["Piccole molecole apolari (O₂, CO₂) e piccole polari (acqua, etanolo)", "Ioni e glucosio", "Proteine", "Acidi nucleici"],a:0,e:"Ioni e grosse molecole polari richiedono proteine di trasporto."},
{id:"bl1_066",t:"bl1",p:"1.15",l:2,q:"Che cosa succede a un globulo rosso in una soluzione ipertonica?",o:["Perde acqua e raggrinzisce", "Si gonfia e scoppia", "Non cambia", "Si divide"],a:0,e:"In soluzione ipotonica invece si gonfia fino alla lisi."},
{id:"bl1_067",t:"bl1",p:"1.15",l:3,q:"Perché le cellule vegetali in soluzione diluita non scoppiano?",o:["La parete cellulare resiste alla pressione di turgore", "Non hanno membrana", "Non assorbono acqua", "Espellono l'acqua con i lisosomi"],a:0,e:"La cellula si gonfia e preme contro la parete."},
{id:"bl1_068",t:"bl1",p:"1.16",l:2,q:"Che differenza c'è tra proteine canale e proteine trasportatrici (carrier)?",o:["I canali formano pori idrofili; i carrier legano la sostanza e cambiano forma", "Sono identiche", "I canali consumano sempre ATP", "I carrier trasportano solo acqua"],a:0,e:"Sono proteine transmembrana specifiche per la sostanza trasportata."},
{id:"bl1_069",t:"bl1",p:"1.16",l:2,q:"Come si chiama il trasporto passivo mediato da proteine?",o:["Diffusione facilitata", "Diffusione semplice", "Endocitosi", "Pompa sodio-potassio"],a:0,e:"Segue il gradiente ma richiede una proteina specifica."},
{id:"bl1_070",t:"bl1",p:"1.17",l:1,q:"Quanto vale circa il potenziale di riposo della membrana?",o:["−70 mV", "+70 mV", "0 mV", "−7 V"],a:0,e:"L'interno è negativo rispetto all'esterno."},
{id:"bl1_071",t:"bl1",p:"1.17",l:2,q:"Che cosa fa la pompa Na⁺/K⁺?",o:["Porta 3 Na⁺ fuori e 2 K⁺ dentro consumando ATP", "Porta Na⁺ dentro e K⁺ fuori senza energia", "Trasporta glucosio", "Trasporta H⁺ nei lisosomi"],a:0,e:"È un trasporto attivo primario."},
{id:"bl1_072",t:"bl1",p:"1.17",l:3,q:"Che cosa fanno le pompe di tipo V?",o:["Trasportano H⁺ in lisosomi, vescicole e vacuoli per acidificarli", "Trasportano Na⁺ fuori dalla cellula", "Producono ATP nei mitocondri", "Esportano proteine"],a:0,e:"Le pompe di tipo F sono le ATP sintasi."},
{id:"bl1_073",t:"bl1",p:"1.17.1",l:2,q:"Che cosa avviene nella depolarizzazione del neurone?",o:["Si aprono canali per il Na⁺, che entra", "Il K⁺ entra", "La pompa si ferma", "Il Cl⁻ esce"],a:0,e:"Poi si aprono i canali del K⁺ che esce (ripolarizzazione)."},
{id:"bl1_074",t:"bl1",p:"1.17.1",l:3,q:"Perché il potenziale d'azione è \"tutto o nulla\"?",o:["Si genera solo se si supera una soglia e ha sempre la stessa ampiezza", "Ha ampiezza proporzionale allo stimolo", "Non dipende dai canali", "Si genera sempre"],a:0,e:"Stimoli sotto soglia non producono il potenziale d'azione."},
{id:"bl1_075",t:"bl1",p:"1.18",l:1,q:"Come entrano nella cellula macromolecole e frammenti?",o:["Per endocitosi, con vescicole", "Per diffusione semplice", "Con le pompe", "Per osmosi"],a:0,e:"L'esocitosi le fa uscire."},
{id:"bl1_076",t:"bl1",p:"1.18",l:2,q:"La fagocitosi è…",o:["endocitosi di particelle grandi", "endocitosi di liquidi", "esocitosi", "diffusione facilitata"],a:0,e:"La pinocitosi riguarda i liquidi; esiste anche l'endocitosi mediata da recettori."},
{id:"bl1_077",t:"bl1",p:"1.18",l:3,q:"Che cosa mediano le vescicole rivestite di COPII?",o:["Il trasporto dal reticolo endoplasmatico al Golgi", "Il trasporto dal Golgi al RE", "L'endocitosi", "L'ingresso nel nucleo"],a:0,e:"COPI media invece il trasporto retrogrado; la clatrina l'endocitosi."},
{id:"bl1_078",t:"bl1",p:"1.19",l:1,q:"Da che cosa è circondato il nucleo?",o:["Da una doppia membrana con pori, in continuità con il RE rugoso", "Da una parete di cellulosa", "Da un singolo strato di proteine", "Da nulla"],a:0,e:"I pori nucleari regolano gli scambi con il citoplasma."},
{id:"bl1_079",t:"bl1",p:"1.19",l:2,q:"Che cosa si forma nel nucleolo?",o:["L'RNA ribosomiale e le subunità dei ribosomi", "Le proteine di membrana", "I lipidi", "L'ATP"],a:0,e:"Il nucleolo non è delimitato da membrana."},
{id:"bl1_080",t:"bl1",p:"1.20",l:1,q:"Che funzione hanno i ribosomi?",o:["La sintesi proteica", "La sintesi dei lipidi", "La digestione", "La respirazione"],a:0,e:"Sono formati da due subunità di rRNA e proteine."},
{id:"bl1_081",t:"bl1",p:"1.20",l:2,q:"Dove si trovano i ribosomi?",o:["Liberi nel citoplasma o legati al reticolo endoplasmatico", "Solo nel nucleo", "Solo nei lisosomi", "Solo nella membrana plasmatica"],a:0,e:"Quelli dei procarioti sono più piccoli."},
{id:"bl1_082",t:"bl1",p:"1.21",l:2,q:"Che funzione ha il reticolo endoplasmatico liscio?",o:["Sintesi dei lipidi ed eliminazione di farmaci e sostanze tossiche", "Sintesi delle proteine", "Digestione", "Respirazione"],a:0,e:"Il rugoso ha i ribosomi e sintetizza proteine da secernere o di membrana."},
{id:"bl1_083",t:"bl1",p:"1.21",l:2,q:"Che cosa fa l'apparato di Golgi?",o:["Modifica, smista e spedisce le proteine provenienti dal RE", "Sintetizza DNA", "Produce ATP", "Degrada il glucosio"],a:0,e:"È responsabile delle modificazioni post-traduzionali, come la glicosilazione."},
{id:"bl1_084",t:"bl1",p:"1.21",l:3,q:"Qual è il percorso di una proteina destinata alla secrezione?",o:["RE rugoso → Golgi → vescicole di secrezione → esocitosi", "Golgi → RE → nucleo", "Nucleo → lisosoma → membrana", "Citosol → mitocondrio → membrana"],a:0,e:"Il Golgi ha un lato cis (di ingresso) e uno trans (di uscita)."},
{id:"bl1_085",t:"bl1",p:"1.22",l:1,q:"Che cosa contengono i lisosomi?",o:["Enzimi idrolitici a pH acido (circa 5)", "DNA", "Clorofilla", "Ribosomi"],a:0,e:"Sono lo \"stomaco\" della cellula."},
{id:"bl1_086",t:"bl1",p:"1.22",l:2,q:"Che cos'è l'autofagia?",o:["La digestione da parte dei lisosomi di parti della cellula stessa", "L'endocitosi di batteri", "La divisione cellulare", "La sintesi di proteine"],a:0,e:"I lisosomi digeriscono sia materiale esterno sia componenti cellulari usurati."},
{id:"bl1_087",t:"bl1",p:"1.23",l:2,q:"Che cosa producono e demoliscono i perossisomi?",o:["Perossido di idrogeno, distrutto dalla catalasi", "Glucosio", "ATP", "Proteine"],a:0,e:"Demoliscono sostanze tossiche come alcol e farmaci."},
{id:"bl1_088",t:"bl1",p:"1.23",l:3,q:"Quale altra funzione hanno i perossisomi?",o:["La β-ossidazione degli acidi grassi a catena lunga", "La sintesi delle proteine", "La replicazione del DNA", "La fotosintesi"],a:0,e:"Hanno diametro tra 0,2 e 1,7 µm."},
{id:"bl1_089",t:"bl1",p:"1.24",l:1,q:"Come sono fatti i mitocondri?",o:["Doppia membrana, con la interna ripiegata in creste e una matrice", "Singola membrana", "Senza membrana", "Con parete di cellulosa"],a:0,e:"Sono la sede della respirazione cellulare."},
{id:"bl1_090",t:"bl1",p:"1.24",l:2,q:"Perché i mitocondri sono detti semiautonomi?",o:["Hanno un proprio DNA circolare e ribosomi", "Si muovono da soli", "Producono glucosio", "Non hanno proteine"],a:0,e:"La maggior parte delle loro proteine è comunque codificata nel nucleo."},
{id:"bl1_091",t:"bl1",p:"1.24",l:3,q:"Da chi si eredita il DNA mitocondriale?",o:["Dalla madre", "Dal padre", "Da entrambi i genitori", "Da nessuno"],a:0,e:"I mitocondri dello spermatozoo non vengono trasmessi."},
{id:"bl1_092",t:"bl1",p:"1.25",l:1,q:"Quali sono i tre tipi di filamenti del citoscheletro?",o:["Microtubuli, filamenti intermedi, microfilamenti", "Collagene, elastina, cheratina", "DNA, RNA, proteine", "Ciglia, flagelli, pili"],a:0,e:"I microfilamenti sono di actina, i microtubuli di tubulina."},
{id:"bl1_093",t:"bl1",p:"1.25",l:2,q:"Come sono fatti i centrioli?",o:["Nove gruppi di tre microtubuli", "Due microtubuli centrali", "Filamenti di actina", "Doppia membrana"],a:0,e:"Le cellule vegetali superiori non hanno centrioli."},
{id:"bl1_094",t:"bl1",p:"1.25",l:2,q:"Di quali strutture sono componenti i microtubuli?",o:["Fuso mitotico, centrioli, ciglia e flagelli", "Ribosomi", "Mitocondri", "Membrana nucleare"],a:0,e:"I filamenti intermedi stabilizzano la struttura collegando nucleo e giunzioni."},
{id:"bl1_095",t:"bl1",p:"1.26",l:2,q:"Come comunicano le cellule distanti?",o:["Con messaggeri chimici trasportati dal sangue che si legano a recettori", "Con giunzioni comunicanti", "Solo per contatto", "Non comunicano"],a:0,e:"Le cellule vicine possono comunicare tramite giunzioni."},
{id:"bl1_096",t:"bl1",p:"1.26",l:2,q:"Quali giunzioni mettono in comunicazione diretta il citoplasma di cellule adiacenti?",o:["Le giunzioni comunicanti (gap)", "Le giunzioni occludenti", "I desmosomi", "Gli emidesmosomi"],a:0,e:"Le occludenti sigillano; i desmosomi ancorano."},
{id:"bl1_097",t:"bl1",p:"1.14",l:2,q:"Il trasporto attivo richiede…",o:["energia, di solito ATP, perché va contro gradiente", "nessuna energia", "solo vescicole", "solo acqua"],a:0,e:"Esempio tipico: la pompa sodio-potassio."},
{id:"bl1_098",t:"bl1",p:"1.14",l:3,q:"Che cos'è il trasporto attivo secondario?",o:["Il trasporto contro gradiente sfruttando il gradiente di un altro ione creato da una pompa", "Il trasporto per diffusione", "L'esocitosi", "L'osmosi"],a:0,e:"Esempio: il cotrasporto sodio-glucosio nell'intestino."},
{id:"bl1_099",t:"bl1",p:"1.13",l:2,q:"Quali funzioni ha la membrana cellulare?",o:["Delimita la cellula, regola gli scambi e riceve segnali", "Produce ATP", "Sintetizza proteine", "Contiene il DNA"],a:0,e:"Le proteine di membrana fanno da trasportatori, recettori ed enzimi."},
{id:"bl1_100",t:"bl1",p:"1.13",l:3,q:"Che cosa sono i glicolipidi e le glicoproteine della membrana?",o:["Molecole con catene di zuccheri sul lato esterno, usate nel riconoscimento cellulare", "Molecole del citoscheletro", "Ribosomi", "Lipidi di riserva"],a:0,e:"Formano il glicocalice."},
{id:"bl1_101",t:"bl1",p:"1.18",l:2,q:"Che cosa mediano le vescicole rivestite di clatrina?",o:["L'endocitosi mediata da recettori", "Il trasporto dal RE al Golgi", "La sintesi proteica", "La divisione cellulare"],a:0,e:"Così entra, per esempio, il colesterolo legato alle LDL."},
{id:"bl1_102",t:"bl1",p:"1.24",l:2,q:"Quali organelli delle cellule vegetali hanno doppia membrana e DNA proprio, come i mitocondri?",o:["I cloroplasti", "I lisosomi", "I perossisomi", "I vacuoli"],a:0,e:"Sono la sede della fotosintesi."},
{id:"bl1_103",t:"bl1",p:"1.19",l:3,q:"Che cosa passa attraverso i pori nucleari?",o:["mRNA e subunità ribosomiali in uscita, proteine in entrata", "Solo acqua", "Interi cromosomi", "Mitocondri"],a:0,e:"Il trasporto è selettivo."},
{id:"bl1_104",t:"bl1",p:"1.12.2",l:2,q:"Quali strutture hanno le cellule vegetali ma non quelle animali?",o:["Parete di cellulosa, cloroplasti e grande vacuolo", "Mitocondri", "Ribosomi", "Nucleo"],a:0,e:"Le cellule animali hanno invece i centrioli."},
{id:"bl1_sf1",t:"bl1",p:"1.15",l:4,q:"Globuli rossi vengono messi in NaCl 0,3% (la soluzione fisiologica è 0,9%). Che cosa succede?",o:["Entra acqua e le cellule si gonfiano fino a lisarsi", "Esce acqua e le cellule raggrinziscono", "Non succede nulla", "Entra il sale e la cellula si restringe"],a:0,e:"La soluzione è ipotonica rispetto al citoplasma: l'acqua entra per osmosi."},
{id:"bl1_sf2",t:"bl1",p:"1.21",l:4,q:"Cellule pancreatiche vengono marcate con amminoacidi radioattivi. In che ordine compare la radioattività?",o:["RE rugoso, Golgi, vescicole di secrezione", "Golgi, RE rugoso, nucleo", "Vescicole, Golgi, RE", "Nucleo, lisosomi, membrana"],a:0,e:"È il percorso delle proteine da secernere, dimostrato proprio con esperimenti di questo tipo."},
{id:"bl1_sf3",t:"bl1",p:"1.12.1",l:4,q:"Quale struttura è presente sia nei procarioti sia negli eucarioti?",o:["Ribosomi", "Nucleo con membrana", "Mitocondri", "Reticolo endoplasmatico"],a:0,e:"I procarioti non hanno organelli delimitati da membrana, ma hanno ribosomi (più piccoli)."},
{id:"bl1_sf4",t:"bl1",p:"1.17",l:4,q:"Un farmaco blocca la pompa Na⁺/K⁺. Che cosa succede nel tempo al gradiente di Na⁺?",o:["Si riduce, perché il Na⁺ entrato non viene più espulso", "Aumenta", "Non cambia", "Si inverte subito"],a:0,e:"La pompa mantiene il gradiente spendendo ATP; senza di essa il Na⁺ si equilibra lentamente."},
{id:"bl1_sf5",t:"bl1",p:"1.4.1",l:4,q:"Una popolazione di topi vive su sabbia chiara; da un'eruzione la sabbia diventa scura e aumentano i topi scuri. È selezione…",o:["direzionale", "stabilizzatrice", "divergente", "sessuale"],a:0,e:"Un cambiamento ambientale favorisce un fenotipo estremo, come nel caso della Biston betularia."},
{id:"bl2_001",t:"bl2",p:"2.1",l:1,q:"Che cos'è il catabolismo?",o:["L'insieme delle reazioni di degradazione che liberano energia (esoergoniche)", "La sintesi di molecole complesse", "La divisione cellulare", "L'insieme delle reazioni che consumano energia"],a:0,e:"L'anabolismo comprende invece le reazioni di sintesi, endoergoniche."},
{id:"bl2_002",t:"bl2",p:"2.1",l:2,q:"Che cosa collega catabolismo e anabolismo?",o:["L'ATP, che trasferisce l'energia dalle une alle altre", "Il DNA", "Gli enzimi digestivi", "L'acqua"],a:0,e:"L'ATP è la \"moneta di scambio energetico\" della cellula."},
{id:"bl2_003",t:"bl2",p:"2.1",l:2,q:"Le reazioni anaboliche sono…",o:["endoergoniche: richiedono energia", "esoergoniche", "sempre spontanee", "reazioni di idrolisi"],a:0,e:"Esempio: la sintesi delle proteine o del glicogeno."},
{id:"bl2_004",t:"bl2",p:"2.2",l:1,q:"Che cosa fanno gli enzimi?",o:["Aumentano la velocità delle reazioni abbassando l'energia di attivazione, senza consumarsi", "Spostano l'equilibrio", "Forniscono energia alle reazioni", "Si consumano nella reazione"],a:0,e:"Sono catalizzatori biologici, per lo più proteine globulari."},
{id:"bl2_005",t:"bl2",p:"2.2",l:1,q:"Come si chiama la regione dell'enzima in cui si lega il substrato?",o:["Sito attivo", "Sito allosterico", "Dominio di membrana", "Gruppo prostetico"],a:0,e:"Il modello classico è quello chiave-serratura; oggi si parla di adattamento indotto."},
{id:"bl2_006",t:"bl2",p:"2.2",l:2,q:"Che cosa sono i cofattori?",o:["Ioni o molecole non proteiche necessarie all'attività di alcuni enzimi", "Inibitori", "Substrati", "Prodotti"],a:0,e:"I cofattori organici si chiamano coenzimi, spesso derivati da vitamine."},
{id:"bl2_007",t:"bl2",p:"2.2",l:2,q:"Come si supera l'inibizione competitiva?",o:["Aumentando la concentrazione del substrato", "Aumentando la temperatura a 100 °C", "Non si può superare", "Diminuendo il substrato"],a:0,e:"L'inibitore competitivo occupa il sito attivo; quello non competitivo si lega altrove."},
{id:"bl2_008",t:"bl2",p:"2.2",l:3,q:"Che cos'è la retroinibizione (feedback)?",o:["Il prodotto finale di una via inibisce un enzima iniziale della via", "Il substrato attiva l'enzima", "L'enzima si autodistrugge", "Il prodotto attiva la via"],a:0,e:"Può essere competitiva o allosterica."},
{id:"bl2_009",t:"bl2",p:"2.2",l:3,q:"Che effetto ha una temperatura molto alta su un enzima?",o:["Lo denatura e ne fa perdere l'attività", "Lo rende sempre più veloce", "Nessun effetto", "Lo trasforma in un altro enzima"],a:0,e:"Ogni enzima ha una temperatura e un pH ottimali."},
{id:"bl2_010",t:"bl2",p:"2.2.1",l:1,q:"Qual è la desinenza tipica degli enzimi?",o:["-asi", "-osio", "-ina", "-olo"],a:0,e:"Esempi: proteasi, lipasi, amilasi."},
{id:"bl2_011",t:"bl2",p:"2.2.1",l:2,q:"Quante sono le classi principali di enzimi (EC)?",o:["6", "3", "12", "20"],a:0,e:"Ossidoreduttasi, transferasi, idrolasi, liasi, isomerasi, ligasi."},
{id:"bl2_012",t:"bl2",p:"2.2.1",l:2,q:"Quale classe di enzimi catalizza la formazione di legami tra due molecole?",o:["Ligasi", "Idrolasi", "Isomerasi", "Ossidoreduttasi"],a:0,e:"Le idrolasi scindono legami con l'acqua; le isomerasi trasformano una molecola nel suo isomero."},
{id:"bl2_013",t:"bl2",p:"2.2.1",l:3,q:"A quale classe appartengono le proteasi?",o:["Idrolasi", "Transferasi", "Ligasi", "Liasi"],a:0,e:"Degradano le proteine idrolizzando i legami peptidici."},
{id:"bl2_014",t:"bl2",p:"2.3",l:1,q:"In biologia, che cosa comporta spesso un'ossidazione?",o:["Perdita di elettroni e di idrogeno", "Acquisto di elettroni", "Acquisto di idrogeno", "Nessuno scambio di elettroni"],a:0,e:"Nelle ossidoriduzioni biologiche gli elettroni viaggiano insieme a ioni H⁺."},
{id:"bl2_015",t:"bl2",p:"2.3",l:2,q:"In una redox biologica, la sostanza che si riduce…",o:["acquista elettroni (spesso con H)", "perde elettroni", "perde ossigeno sempre", "non cambia"],a:0,e:"Ossidazione e riduzione avvengono sempre insieme."},
{id:"bl2_016",t:"bl2",p:"2.4",l:1,q:"Da che cosa è formato l'ATP?",o:["Adenosina legata a tre gruppi fosfato", "Adenina e glucosio", "Tre adenine", "Un amminoacido e un fosfato"],a:0,e:"I legami tra i fosfati sono ad alta energia."},
{id:"bl2_017",t:"bl2",p:"2.4",l:2,q:"Che cosa si ottiene idrolizzando l'ATP?",o:["ADP + fosfato + energia", "AMP + glucosio", "ATP + acqua", "Nulla"],a:0,e:"L'energia liberata alimenta le reazioni che ne hanno bisogno."},
{id:"bl2_018",t:"bl2",p:"2.4",l:2,q:"Quali molecole trasportano potere riducente?",o:["NADH, FADH₂ e NADPH", "ATP e GTP", "Glucosio e fruttosio", "Acqua e CO₂"],a:0,e:"NADH e FADH₂ alimentano la catena respiratoria; NADPH serve nelle biosintesi e si forma nella fase luminosa."},
{id:"bl2_019",t:"bl2",p:"2.5",l:1,q:"Qual è la principale fonte di energia per le cellule?",o:["La demolizione del glucosio", "La demolizione delle proteine", "La sintesi del DNA", "La fotolisi"],a:0,e:"È una combustione controllata, graduale."},
{id:"bl2_020",t:"bl2",p:"2.5",l:2,q:"In che ordine avvengono le fasi del catabolismo aerobico del glucosio?",o:["Glicolisi, decarbossilazione del piruvato, ciclo di Krebs, catena respiratoria", "Ciclo di Krebs, glicolisi, catena respiratoria", "Catena respiratoria, glicolisi, Krebs", "Fermentazione, glicolisi, Krebs"],a:0,e:"La glicolisi avviene nel citoplasma, il resto nei mitocondri."},
{id:"bl2_021",t:"bl2",p:"2.5.1",l:1,q:"Dove avviene la glicolisi?",o:["Nel citoplasma", "Nei mitocondri", "Nel nucleo", "Nei cloroplasti"],a:0,e:"È presente praticamente in tutte le cellule."},
{id:"bl2_022",t:"bl2",p:"2.5.1",l:2,q:"Che cosa produce la glicolisi da una molecola di glucosio?",o:["2 piruvati, 2 ATP netti e 2 NADH", "1 piruvato e 38 ATP", "6 CO₂ e 6 H₂O", "2 lattati e 4 NADH"],a:0,e:"Il glucosio (6 C) diventa due molecole di piruvato (3 C)."},
{id:"bl2_023",t:"bl2",p:"2.5.1",l:2,q:"Come si chiama anche la glicolisi?",o:["Via di Embden-Meyerhof", "Ciclo di Krebs", "Ciclo di Calvin", "β-ossidazione"],a:0,e:"Il primo enzima, l'esochinasi, fosforila il glucosio a glucosio-6-fosfato."},
{id:"bl2_024",t:"bl2",p:"2.5.1",l:3,q:"La glicolisi richiede ossigeno?",o:["No, è anaerobica", "Sì, sempre", "Solo nei muscoli", "Solo nelle piante"],a:0,e:"In assenza di ossigeno il piruvato va incontro a fermentazione."},
{id:"bl2_025",t:"bl2",p:"2.5.2",l:1,q:"Dove avviene la respirazione cellulare negli eucarioti?",o:["Nei mitocondri", "Nel citoplasma", "Nel nucleo", "Nei lisosomi"],a:0,e:"Comprende decarbossilazione del piruvato, ciclo di Krebs e catena respiratoria."},
{id:"bl2_026",t:"bl2",p:"2.5.2",l:2,q:"Che cosa si forma dalla decarbossilazione ossidativa del piruvato?",o:["Acetil-CoA, CO₂ e NADH", "Glucosio", "Lattato", "Ossalacetato e ATP"],a:0,e:"L'acetil-CoA entra nel ciclo di Krebs."},
{id:"bl2_027",t:"bl2",p:"2.5.2",l:2,q:"Che cosa produce ogni giro del ciclo di Krebs?",o:["3 NADH, 1 FADH₂, 1 ATP (GTP) e 2 CO₂", "38 ATP", "2 piruvati", "Solo CO₂"],a:0,e:"L'acetile si unisce all'ossalacetato formando citrato."},
{id:"bl2_028",t:"bl2",p:"2.5.2",l:2,q:"Qual è l'accettore finale degli elettroni nella catena respiratoria?",o:["L'ossigeno, che forma acqua", "Il NAD⁺", "La CO₂", "Il glucosio"],a:0,e:"Senza ossigeno la catena si blocca."},
{id:"bl2_029",t:"bl2",p:"2.5.2",l:3,q:"Quante molecole di ATP si ottengono teoricamente dall'ossidazione completa di un glucosio, secondo il libro?",o:["38 (resa effettiva circa 30-32)", "2", "4", "100"],a:0,e:"La stima di 38 non considera i costi di trasporto; la resa reale è circa 30-32."},
{id:"bl2_030",t:"bl2",p:"2.5.2",l:3,q:"Come si forma l'ATP nella catena respiratoria?",o:["Il gradiente di H⁺ attraverso la membrana interna alimenta l'ATP sintasi", "Per fosforilazione a livello del substrato", "Dalla luce", "Dalla fermentazione"],a:0,e:"È la fosforilazione ossidativa (chemiosmosi)."},
{id:"bl2_031",t:"bl2",p:"2.6",l:1,q:"Con quale priorità la cellula usa le fonti di energia?",o:["Carboidrati, poi lipidi, poi proteine", "Proteine, lipidi, carboidrati", "Lipidi, proteine, carboidrati", "Solo carboidrati"],a:0,e:"Vengono convertiti in molecole che entrano nella glicolisi o nel ciclo di Krebs."},
{id:"bl2_032",t:"bl2",p:"2.6",l:2,q:"Come entrano nel metabolismo energetico gli amminoacidi?",o:["Dopo la rimozione del gruppo amminico, come intermedi di glicolisi o ciclo di Krebs", "Direttamente nella catena respiratoria", "Come glicerolo", "Non possono essere usati"],a:0,e:"L'azoto viene eliminato come urea."},
{id:"bl2_033",t:"bl2",p:"2.6.1",l:2,q:"Che cosa produce la β-ossidazione degli acidi grassi?",o:["Unità di acetil-CoA, NADH e FADH₂", "Glucosio", "Lattato", "Amminoacidi"],a:0,e:"Avviene nei mitocondri, staccando due atomi di carbonio alla volta."},
{id:"bl2_034",t:"bl2",p:"2.6.1",l:2,q:"Che cosa si ottiene dalla scomposizione dei trigliceridi?",o:["Glicerolo e acidi grassi", "Glucosio e fruttosio", "Amminoacidi", "Nucleotidi"],a:0,e:"Il glicerolo entra nella glicolisi, gli acidi grassi nella β-ossidazione."},
{id:"bl2_035",t:"bl2",p:"2.6.1",l:3,q:"Perché i lipidi forniscono più energia per grammo dei carboidrati?",o:["Sono più ridotti e producono più NADH e FADH₂", "Perché pesano di più", "Perché entrano nella glicolisi", "Non è vero"],a:0,e:"Un acido grasso a lunga catena produce un centinaio di ATP."},
{id:"bl2_036",t:"bl2",p:"2.7",l:1,q:"In quali condizioni avviene la fermentazione?",o:["In assenza di ossigeno", "Solo in presenza di luce", "In presenza di molto ossigeno", "Solo nei mitocondri"],a:0,e:"Avviene nel citoplasma."},
{id:"bl2_037",t:"bl2",p:"2.7",l:2,q:"A che cosa serve la fermentazione?",o:["A rigenerare il NAD⁺ per far continuare la glicolisi", "A produrre molto ATP", "A produrre ossigeno", "A sintetizzare glucosio"],a:0,e:"Il piruvato viene ridotto dal NADH."},
{id:"bl2_038",t:"bl2",p:"2.7",l:2,q:"Che cosa producono i lieviti con la fermentazione alcolica?",o:["Etanolo e CO₂", "Acido lattico", "Ossigeno", "Acetil-CoA"],a:0,e:"Nei muscoli sotto sforzo avviene invece la fermentazione lattica."},
{id:"bl2_039",t:"bl2",p:"2.7",l:3,q:"Quanti ATP produce la fermentazione per molecola di glucosio?",o:["2 (quelli della glicolisi)", "38", "0", "4"],a:0,e:"La fermentazione in sé non produce ATP."},
{id:"bl2_040",t:"bl2",p:"2.8",l:1,q:"Che cosa sono gli organismi autotrofi?",o:["Organismi che producono sostanze organiche da sostanze inorganiche", "Organismi che si nutrono di altri organismi", "Organismi parassiti", "Organismi senza metabolismo"],a:0,e:"Si dividono in fotoautotrofi e chemioautotrofi."},
{id:"bl2_041",t:"bl2",p:"2.8",l:2,q:"Che cosa sfruttano i chemioautotrofi come fonte di energia?",o:["L'ossidazione di sostanze inorganiche", "La luce solare", "Il glucosio di altri organismi", "Il calore"],a:0,e:"Esempio: alcuni batteri e archeobatteri."},
{id:"bl2_042",t:"bl2",p:"2.8",l:2,q:"Da dove viene l'ossigeno prodotto dalla fotosintesi?",o:["Dall'acqua (fotolisi)", "Dalla CO₂", "Dal glucosio", "Dall'aria"],a:0,e:"La fase luminosa scinde l'acqua e produce ATP e NADPH."},
{id:"bl2_043",t:"bl2",p:"2.8",l:2,q:"Dove avviene il ciclo di Calvin?",o:["Nello stroma del cloroplasto", "Nei tilacoidi", "Nel citoplasma", "Nei mitocondri"],a:0,e:"Usa ATP e NADPH per fissare la CO₂ in zuccheri; l'enzima chiave è la RuBisCO."},
{id:"bl2_044",t:"bl2",p:"2.8",l:3,q:"Qual è l'equazione globale della fotosintesi?",o:["6 CO₂ + 6 H₂O + luce → C₆H₁₂O₆ + 6 O₂", "C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O", "6 CO₂ → C₆H₁₂O₆", "Glucosio → 2 piruvati"],a:0,e:"È l'inverso della respirazione cellulare."},
{id:"bl2_045",t:"bl2",p:"2.2",l:2,q:"Che cosa succede alla velocità di una reazione enzimatica quando tutti i siti attivi sono occupati?",o:["Raggiunge un massimo (saturazione)", "Continua a crescere", "Diventa zero", "Si inverte"],a:0,e:"Aumentare ancora il substrato non serve."},
{id:"bl2_046",t:"bl2",p:"2.2",l:3,q:"Che cosa indica il modello dell'adattamento indotto?",o:["Il sito attivo cambia forma legando il substrato", "L'enzima è rigido come una serratura", "Il substrato si modifica prima di legarsi", "L'enzima si consuma"],a:0,e:"Ha sostituito il semplice modello chiave-serratura."},
{id:"bl2_047",t:"bl2",p:"2.4",l:3,q:"Perché l'ATP non è una riserva di energia a lungo termine?",o:["Viene consumato e rigenerato in continuazione; le riserve sono glicogeno e grassi", "Perché è instabile al freddo", "Perché non contiene energia", "Perché è nel nucleo"],a:0,e:"La cellula ne contiene poco e lo ricicla rapidamente."},
{id:"bl2_048",t:"bl2",p:"2.5.2",l:2,q:"Dove si trovano gli enzimi della catena respiratoria?",o:["Nella membrana mitocondriale interna (creste)", "Nella matrice", "Nel citoplasma", "Nella membrana esterna"],a:0,e:"Il ciclo di Krebs avviene invece nella matrice."},
{id:"bl2_049",t:"bl2",p:"2.5.2",l:3,q:"In che forma viene eliminato il carbonio del glucosio nella respirazione?",o:["Come CO₂, nella decarbossilazione del piruvato e nel ciclo di Krebs", "Come acqua", "Come lattato", "Come ossigeno"],a:0,e:"L'ossigeno respirato finisce invece nell'acqua."},
{id:"bl2_050",t:"bl2",p:"2.8",l:2,q:"Dove si trova la clorofilla?",o:["Nelle membrane dei tilacoidi dei cloroplasti", "Nello stroma", "Nei mitocondri", "Nel nucleo"],a:0,e:"Cattura soprattutto luce rossa e blu e riflette il verde."},
{id:"bl2_051",t:"bl2",p:"2.8",l:3,q:"Che cosa produce la fase luminosa da usare nel ciclo di Calvin?",o:["ATP e NADPH", "Glucosio e O₂", "CO₂ e H₂O", "Piruvato"],a:0,e:"L'ossigeno è un sottoprodotto della fotolisi dell'acqua."},
{id:"bl2_052",t:"bl2",p:"2.6",l:3,q:"Che cos'è la gluconeogenesi?",o:["La sintesi di glucosio da precursori non glucidici", "La demolizione del glucosio", "La sintesi di glicogeno", "La fermentazione"],a:0,e:"Avviene soprattutto nel fegato, per esempio a partire da lattato e amminoacidi."},
{id:"bl2_sf1",t:"bl2",p:"2.5.2",l:4,q:"Un veleno blocca la catena respiratoria. Quale processo continua a produrre ATP nella cellula?",o:["La glicolisi seguita dalla fermentazione", "Il ciclo di Krebs", "La β-ossidazione", "La fosforilazione ossidativa"],a:0,e:"Senza catena respiratoria NADH e FADH₂ non vengono riossidati e Krebs si ferma; resta la glicolisi con la fermentazione che rigenera NAD⁺."},
{id:"bl2_sf2",t:"bl2",p:"2.2",l:4,q:"In un saggio enzimatico, raddoppiando la concentrazione di substrato l'effetto di un inibitore diminuisce molto. L'inibitore è probabilmente…",o:["competitivo", "non competitivo", "irreversibile", "un cofattore"],a:0,e:"Solo l'inibizione competitiva si supera aumentando il substrato, perché inibitore e substrato competono per lo stesso sito attivo."},
{id:"bl2_sf3",t:"bl2",p:"2.7",l:4,q:"Perché i muscoli in intenso sforzo producono lattato?",o:["Per rigenerare NAD⁺ quando l'ossigeno non basta", "Per produrre più ossigeno", "Per sintetizzare glucosio", "Per accumulare energia nel lattato"],a:0,e:"Con poco ossigeno la catena respiratoria non smaltisce il NADH: riducendo il piruvato a lattato si rigenera NAD⁺ per la glicolisi."},
{id:"bl2_sf4",t:"bl2",p:"2.5.1",l:4,q:"Quante molecole di piruvato si ottengono dalla glicolisi di 3 molecole di glucosio?",o:["6", "3", "12", "2"],a:0,e:"Ogni glucosio (6 C) dà 2 piruvati (3 C)."},
{id:"bl3_001",t:"bl3",p:"3.1",l:1,q:"Come si dividono i procarioti?",o:["Per scissione binaria", "Per mitosi", "Per meiosi", "Per gemmazione con fuso mitotico"],a:0,e:"Il DNA circolare si duplica e le due copie si separano mentre la cellula si allunga."},
{id:"bl3_002",t:"bl3",p:"3.1",l:2,q:"A che cosa è ancorato il DNA batterico durante la divisione?",o:["Alla membrana plasmatica", "Al fuso mitotico", "Al centriolo", "Al nucleolo"],a:0,e:"La crescita della membrana tra i punti di attacco separa le due copie."},
{id:"bl3_003",t:"bl3",p:"3.1",l:2,q:"Il \"cromosoma batterico\" è…",o:["un'unica molecola di DNA circolare libera nel citoplasma", "un insieme di cromosomi lineari", "racchiuso in un nucleo", "formato da RNA"],a:0,e:"È molto avvolto e ripiegato su sé stesso."},
{id:"bl3_004",t:"bl3",p:"3.2",l:1,q:"Quali sono le fasi dell'interfase?",o:["G1, S, G2", "Profase, metafase, anafase", "Mitosi e citodieresi", "G0 e M"],a:0,e:"Nella fase S il DNA si replica."},
{id:"bl3_005",t:"bl3",p:"3.2",l:2,q:"Che cos'è la fase G0?",o:["Uno stato in cui la cellula esce dal ciclo e non si divide", "La fase di replicazione", "La fase della mitosi", "La fase di citodieresi"],a:0,e:"Neuroni e globuli rossi maturi non si dividono più."},
{id:"bl3_006",t:"bl3",p:"3.2",l:2,q:"In quale fase si duplica il DNA?",o:["S", "G1", "G2", "M"],a:0,e:"In G1 la cellula cresce, in G2 si prepara alla mitosi."},
{id:"bl3_007",t:"bl3",p:"3.2.1",l:2,q:"Quali enzimi controllano il passaggio alla fase S e alla mitosi?",o:["Le chinasi ciclina-dipendenti (Cdk)", "Le DNA polimerasi", "Le proteasi", "Le lipasi"],a:0,e:"Si attivano legando le cicline e fosforilano proteine bersaglio."},
{id:"bl3_008",t:"bl3",p:"3.2.1",l:3,q:"Perché le Cdk funzionano solo in certi momenti del ciclo?",o:["Perché la concentrazione delle cicline varia ciclicamente", "Perché sono sintetizzate solo in G2", "Perché si trovano solo nel nucleolo", "Perché dipendono dalla luce"],a:0,e:"Le cicline vengono sintetizzate e poi degradate."},
{id:"bl3_009",t:"bl3",p:"3.2.1",l:3,q:"Che cosa sono i checkpoint del ciclo cellulare?",o:["Punti di controllo che bloccano il ciclo se ci sono danni o errori", "Fasi della meiosi", "Organelli", "Tipi di cromosomi"],a:0,e:"Proteine come p53 bloccano il ciclo se il DNA è danneggiato."},
{id:"bl3_010",t:"bl3",p:"3.3",l:1,q:"Che cosa produce la mitosi?",o:["Due nuclei figli con una serie completa e identica di cromosomi", "Quattro cellule aploidi", "Gameti", "Due nuclei con metà dei cromosomi"],a:0,e:"La divisione del citoplasma si chiama citodieresi."},
{id:"bl3_011",t:"bl3",p:"3.3",l:2,q:"In quale fase della mitosi i cromosomi si allineano sulla piastra equatoriale?",o:["Metafase", "Profase", "Anafase", "Telofase"],a:0,e:"In anafase i cromatidi fratelli si separano verso i poli."},
{id:"bl3_012",t:"bl3",p:"3.3",l:2,q:"Che cosa avviene in anafase?",o:["I cromatidi fratelli si separano e migrano ai poli opposti", "I cromosomi si condensano", "Si forma la membrana nucleare", "I cromosomi si allineano"],a:0,e:"Sono tirati dalle fibre del fuso."},
{id:"bl3_013",t:"bl3",p:"3.3",l:2,q:"In quale fase si riforma l'involucro nucleare?",o:["Telofase", "Metafase", "Profase", "Anafase"],a:0,e:"In profase invece si disgrega e i cromosomi si condensano."},
{id:"bl3_014",t:"bl3",p:"3.3",l:3,q:"Come avviene la citodieresi nelle cellule vegetali?",o:["Con la formazione di una piastra cellulare", "Con un solco di strozzatura", "Per gemmazione", "Non avviene"],a:0,e:"Nelle cellule animali si forma un solco per un anello di actina e miosina."},
{id:"bl3_015",t:"bl3",p:"3.4",l:1,q:"Che cosa caratterizza la riproduzione asessuata?",o:["Un solo genitore e figli geneticamente identici", "Due genitori", "La meiosi", "La fecondazione"],a:0,e:"Si basa sulla mitosi (riproduzione agamica)."},
{id:"bl3_016",t:"bl3",p:"3.4",l:2,q:"Quale di questi è un tipo di riproduzione asessuata?",o:["Gemmazione", "Fecondazione", "Coniugazione dei gameti", "Meiosi"],a:0,e:"Altri: scissione, frammentazione, propagazione vegetativa, partenogenesi."},
{id:"bl3_017",t:"bl3",p:"3.4",l:3,q:"Qual è uno svantaggio della riproduzione asessuata?",o:["Non produce variabilità genetica", "È lenta", "Richiede due genitori", "Richiede la meiosi"],a:0,e:"È però rapida ed efficiente in un ambiente stabile."},
{id:"bl3_018",t:"bl3",p:"3.5",l:1,q:"Come si chiama la cellula che nasce dalla fusione di due gameti?",o:["Zigote", "Gamete", "Gametocita", "Spora"],a:0,e:"La riproduzione sessuata è detta anche gamica o anfigonica."},
{id:"bl3_019",t:"bl3",p:"3.5",l:2,q:"Qual è il vantaggio evolutivo della riproduzione sessuata?",o:["Produce variabilità genetica nella prole", "È più veloce", "Richiede un solo individuo", "Non richiede gameti"],a:0,e:"La variabilità aumenta la possibilità di adattarsi all'ambiente."},
{id:"bl3_020",t:"bl3",p:"3.5.1",l:1,q:"Le cellule somatiche umane sono…",o:["diploidi (2n = 46)", "aploidi", "triploidi", "tetraploidi"],a:0,e:"I gameti sono aploidi (n = 23)."},
{id:"bl3_021",t:"bl3",p:"3.5.1",l:2,q:"Che cosa sono i cromosomi omologhi?",o:["Coppie di cromosomi con gli stessi geni, uno di origine materna e uno paterna", "I due cromatidi di un cromosoma", "Cromosomi sessuali diversi", "Cromosomi mutati"],a:0,e:"Possono portare alleli diversi degli stessi geni."},
{id:"bl3_022",t:"bl3",p:"3.5.1",l:2,q:"Perché i gameti devono essere aploidi?",o:["Perché con la fecondazione il numero di cromosomi torni quello della specie", "Per essere più piccoli", "Per muoversi meglio", "Per non dividersi"],a:0,e:"Altrimenti il numero raddoppierebbe a ogni generazione."},
{id:"bl3_023",t:"bl3",p:"3.6",l:1,q:"Che cosa produce la meiosi?",o:["Quattro cellule aploidi da una diploide", "Due cellule diploidi", "Due cellule aploidi", "Quattro cellule diploidi"],a:0,e:"Avviene nei gametociti delle gonadi."},
{id:"bl3_024",t:"bl3",p:"3.6",l:2,q:"Che cosa si separa nella meiosi I?",o:["I cromosomi omologhi", "I cromatidi fratelli", "I centrioli", "Il DNA dalle proteine"],a:0,e:"Nella meiosi II si separano i cromatidi fratelli, come in una mitosi."},
{id:"bl3_025",t:"bl3",p:"3.6",l:2,q:"Quale divisione meiotica è preceduta dalla replicazione del DNA?",o:["Solo la meiosi I", "Solo la meiosi II", "Entrambe", "Nessuna"],a:0,e:"Per questo da una cellula 2n si ottengono cellule n."},
{id:"bl3_026",t:"bl3",p:"3.6",l:3,q:"In quale fase gli omologhi si appaiano formando tetradi?",o:["Profase I", "Metafase II", "Anafase I", "Telofase II"],a:0,e:"L'appaiamento si chiama sinapsi."},
{id:"bl3_027",t:"bl3",p:"3.6",l:3,q:"Quali meccanismi della meiosi producono variabilità?",o:["Crossing-over e assortimento indipendente degli omologhi", "Solo la replicazione del DNA", "La citodieresi", "La formazione del fuso"],a:0,e:"Con 23 coppie le combinazioni possibili sono 2²³."},
{id:"bl3_028",t:"bl3",p:"3.6.1",l:1,q:"Che cos'è il crossing-over?",o:["Lo scambio di segmenti tra cromatidi di cromosomi omologhi", "La separazione dei cromatidi", "La duplicazione del DNA", "La fusione dei gameti"],a:0,e:"Il punto di scambio si chiama chiasma."},
{id:"bl3_029",t:"bl3",p:"3.6.1",l:2,q:"Il crossing-over comporta perdita di materiale genetico?",o:["No, è uno scambio reciproco di segmenti corrispondenti", "Sì, sempre", "Sì, solo nei maschi", "Solo nei cromosomi sessuali"],a:0,e:"Il punto di scambio lungo i cromosomi è casuale."},
{id:"bl3_030",t:"bl3",p:"3.7",l:1,q:"Che cos'è l'apoptosi?",o:["La morte cellulare programmata geneticamente", "La necrosi da trauma", "La divisione cellulare", "La fusione di due cellule"],a:0,e:"Controlla il numero di cellule di un tessuto."},
{id:"bl3_031",t:"bl3",p:"3.7",l:2,q:"Perché le mani dell'embrione perdono l'aspetto palmato?",o:["Le cellule tra le dita muoiono per apoptosi", "Le dita crescono più velocemente", "Per necrosi", "Per meiosi"],a:0,e:"L'apoptosi è fondamentale nello sviluppo embrionale."},
{id:"bl3_032",t:"bl3",p:"3.7",l:3,q:"Che differenza c'è tra apoptosi e necrosi?",o:["L'apoptosi è ordinata e programmata; la necrosi è accidentale e provoca infiammazione", "Sono uguali", "La necrosi è programmata", "L'apoptosi provoca infiammazione"],a:0,e:"Nell'apoptosi la cellula si frammenta in corpi apoptotici fagocitati."},
{id:"bl3_033",t:"bl3",p:"3.8",l:2,q:"Che cos'è un'aneuploidia?",o:["Un numero anomalo di singoli cromosomi (es. trisomia)", "Un intero corredo in più", "Una mutazione puntiforme", "Uno scambio tra omologhi"],a:0,e:"La poliploidia riguarda invece interi corredi (3n, 4n)."},
{id:"bl3_034",t:"bl3",p:"3.8",l:2,q:"Come nasce di solito un'aneuploidia?",o:["Per non disgiunzione dei cromosomi durante la meiosi", "Per crossing-over normale", "Per mutazione puntiforme", "Per apoptosi"],a:0,e:"Un gamete riceve un cromosoma in più o in meno."},
{id:"bl3_035",t:"bl3",p:"3.8",l:3,q:"Che cos'è una traslocazione?",o:["Il trasferimento di un segmento tra cromosomi non omologhi", "La perdita di un segmento", "La ripetizione di un segmento", "Il capovolgimento di un segmento"],a:0,e:"Delezione = perdita, duplicazione = ripetizione, inversione = capovolgimento."},
{id:"bl3_036",t:"bl3",p:"3.8.1",l:1,q:"La sindrome di Down è dovuta a…",o:["tre copie del cromosoma 21", "una copia sola del cromosoma X", "tre copie del cromosoma 18", "un cromosoma Y in più"],a:0,e:"Può derivare anche da una traslocazione di un frammento del 21."},
{id:"bl3_037",t:"bl3",p:"3.8.1",l:2,q:"Quale cariotipo ha la sindrome di Turner?",o:["45, X0", "47, XXY", "47, +21", "46, XY"],a:0,e:"Klinefelter è 47, XXY."},
{id:"bl3_038",t:"bl3",p:"3.8.1",l:3,q:"Quale sindrome è una trisomia del cromosoma 18?",o:["Sindrome di Edwards", "Sindrome di Patau", "Sindrome di Down", "Sindrome di Klinefelter"],a:0,e:"Patau è la trisomia 13."},
{id:"bl3_039",t:"bl3",p:"3.9",l:1,q:"Dove avviene la gametogenesi?",o:["Nelle gonadi", "Nel midollo osseo", "Nel fegato", "Nel sangue"],a:0,e:"Spermatogenesi nei testicoli, ovogenesi nelle ovaie."},
{id:"bl3_040",t:"bl3",p:"3.9",l:2,q:"Quale processo produce i gameti?",o:["La meiosi", "La mitosi soltanto", "L'apoptosi", "La scissione binaria"],a:0,e:"Gli spermatozoi e le cellule uovo sono aploidi."},
{id:"bl3_041",t:"bl3",p:"3.9.1",l:2,q:"Quanti spermatozoi si formano da uno spermatocita primario?",o:["4", "1", "2", "8"],a:0,e:"Due divisioni meiotiche producono 4 spermatidi che maturano in spermatozoi."},
{id:"bl3_042",t:"bl3",p:"3.9.1",l:2,q:"Gli spermatociti secondari sono…",o:["aploidi (n)", "diploidi (2n)", "triploidi", "privi di DNA"],a:0,e:"Derivano dalla meiosi I degli spermatociti primari (2n)."},
{id:"bl3_043",t:"bl3",p:"3.9.2",l:2,q:"Quante cellule uovo funzionali produce un ovocita primario?",o:["1 (più i globuli polari)", "4", "2", "8"],a:0,e:"La divisione è asimmetrica: quasi tutto il citoplasma va all'ovocita."},
{id:"bl3_044",t:"bl3",p:"3.9.2",l:3,q:"Che cosa sono i globuli polari?",o:["Piccole cellule aploidi prodotte nell'ovogenesi che di solito degenerano", "Spermatozoi immaturi", "Cellule diploidi dell'ovaio", "Organelli dell'uovo"],a:0,e:"Servono a eliminare un corredo cromosomico conservando il citoplasma."},
{id:"bl3_045",t:"bl3",p:"3.9.2",l:3,q:"Nella donna, quando si completa la meiosi II dell'ovocita?",o:["Solo dopo la fecondazione", "Prima della nascita", "Alla pubertà", "Mai"],a:0,e:"L'ovocita secondario resta bloccato in metafase II fino all'ingresso dello spermatozoo."},
{id:"bl3_046",t:"bl3",p:"3.2",l:1,q:"Quale fase del ciclo cellulare è di solito la più lunga?",o:["L'interfase", "La metafase", "L'anafase", "La telofase"],a:0,e:"La mitosi occupa solo una piccola parte del ciclo."},
{id:"bl3_047",t:"bl3",p:"3.3",l:1,q:"Che cosa sono i cromatidi fratelli?",o:["Le due copie identiche di un cromosoma unite al centromero", "Due cromosomi omologhi", "Due cromosomi sessuali", "Due cellule figlie"],a:0,e:"Si separano in anafase."},
{id:"bl3_048",t:"bl3",p:"3.3",l:2,q:"Che cos'è il fuso mitotico?",o:["Una struttura di microtubuli che separa i cromosomi", "Una membrana", "Un tipo di DNA", "Il nucleolo"],a:0,e:"Si ancora ai cromosomi tramite i cinetocori."},
{id:"bl3_049",t:"bl3",p:"3.5",l:2,q:"Quale fenomeno durante la fecondazione contribuisce alla variabilità?",o:["L'unione casuale di due gameti", "La mitosi dello zigote", "La replicazione del DNA", "L'apoptosi"],a:0,e:"Si somma a crossing-over e assortimento indipendente."},
{id:"bl3_050",t:"bl3",p:"3.6",l:2,q:"Le cellule prodotte dalla meiosi sono geneticamente…",o:["diverse tra loro e dalla cellula madre", "identiche", "identiche alla madre", "diploidi"],a:0,e:"Al contrario delle cellule prodotte dalla mitosi."},
{id:"bl3_051",t:"bl3",p:"3.8",l:2,q:"Che cos'è una delezione?",o:["La perdita di un segmento di cromosoma", "La ripetizione di un segmento", "Il capovolgimento di un segmento", "L'aggiunta di un cromosoma"],a:0,e:"Esempio: la sindrome del cri du chat (cromosoma 5)."},
{id:"bl3_052",t:"bl3",p:"3.8",l:3,q:"Che cos'è la poliploidia?",o:["La presenza di interi corredi cromosomici in più (3n, 4n)", "Un cromosoma in più", "Un cromosoma in meno", "Una mutazione puntiforme"],a:0,e:"È frequente nelle piante coltivate."},
{id:"bl3_053",t:"bl3",p:"3.8.1",l:2,q:"Qual è il cariotipo della sindrome di Klinefelter?",o:["47, XXY", "45, X0", "47, +21", "46, XX"],a:0,e:"Riguarda individui maschi con un X in più."},
{id:"bl3_054",t:"bl3",p:"3.7",l:2,q:"Quale fattore induce l'apoptosi se il DNA è troppo danneggiato?",o:["p53", "L'insulina", "L'emoglobina", "La telomerasi"],a:0,e:"È uno dei controlli contro le cellule tumorali."},
{id:"bl3_sf1",t:"bl3",p:"3.6",l:4,q:"Una cellula con 2n = 8 va incontro a meiosi. Quanti cromosomi e cromatidi ha ogni cellula al termine della meiosi I?",o:["4 cromosomi, 8 cromatidi", "8 cromosomi, 16 cromatidi", "4 cromosomi, 4 cromatidi", "8 cromosomi, 8 cromatidi"],a:0,e:"La meiosi I separa gli omologhi (8 → 4 cromosomi), ma ogni cromosoma ha ancora due cromatidi, che si separano solo nella meiosi II."},
{id:"bl3_sf2",t:"bl3",p:"3.8",l:4,q:"Un individuo ha 47 cromosomi con tre cromosomi 13. Che tipo di mutazione è?",o:["Genomica (aneuploidia, trisomia)", "Genica puntiforme", "Cromosomica strutturale", "Poliploidia"],a:0,e:"Cambia il numero di un singolo cromosoma: è un'aneuploidia (sindrome di Patau)."},
{id:"bl3_sf3",t:"bl3",p:"3.3",l:4,q:"Una sostanza impedisce la formazione dei microtubuli del fuso. In che fase si bloccano le cellule?",o:["In mitosi, prima dell'anafase", "In G1", "In fase S", "In G2"],a:0,e:"Senza fuso i cromatidi non possono essere separati; la colchicina agisce così."},
{id:"bl3_sf4",t:"bl3",p:"3.2",l:4,q:"Una cellula in G1 ha 10 pg di DNA. Quanto DNA ha in G2?",o:["20 pg", "10 pg", "5 pg", "40 pg"],a:0,e:"Nella fase S il DNA si duplica; dopo la mitosi ogni cellula figlia torna a 10 pg."},
{id:"bl4_001",t:"bl4",p:"4.1",l:2,q:"Quale esperimento dimostrò che il materiale genetico dei batteriofagi è il DNA?",o:["Quello di Hershey e Chase con fosforo e zolfo radioattivi", "Quello di Mendel sui piselli", "Quello di Meselson e Stahl", "Quello di Miller"],a:0,e:"Nei batteri entrava il ³²P (DNA), non lo ³⁵S (proteine)."},
