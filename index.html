function setQ(q){sess.conf=null;sess.reveal=sess.mode==='place'||S.hide===false;sess.lvUp=null;sess.rev=null;sess.prev=null;sess.q=q;sess.order=shuffle([0,1,2,3]);sess.chosen=null;sess.shown=false;sess.ok=null;}
function startQuiz(mode,arg,opt){
  opt=opt||{};var pool=bank(),n=10;
  if(mode==='subj')pool=pool.filter(function(q){return topicOf(q.t).s===arg;});
  else if(mode==='topic'){pool=pool.filter(function(q){return q.t===arg;});n=8;}
  else if(mode==='multi'){var ids=arg||[];pool=pool.filter(function(q){return ids.indexOf(q.t)>-1;});n=opt.n===0?pool.length:(opt.n||10);}
  else if(mode==='par'){var ps=opt.pars||[];pool=pool.filter(function(q){return q.t===arg&&(!ps.length||ps.indexOf(q.p)>-1);});}
  else if(mode==='errors'){pool=pool.filter(function(q){return S.errors[q.id]&&S.errors[q.id].ok<2&&(!arg||q.t===arg);});n=12;}
  if(mode!=='errors'){var df=opt.diff===undefined?'auto':opt.diff;pool=pool.filter(function(q){return diffOK(q,df);});}
  if(!pool.length){ui.msg='Non ci sono domande disponibili per questa scelta.';view='home';sess=null;render();scrollTop();return;}
  if(opt.n&&mode!=='multi')n=opt.n;
  var items=pickQuestions(pool,Math.min(n,pool.length));

/* Mole: reagente limitante */
ANIM.cl5=function(root){
  root.innerHTML='<p class="muted">Reazione: 2 H₂ + O₂ danno 2 H₂O. Ogni pallino è 1 mol.</p>'+slider('h','Moli di H₂',0,8,1,4,' mol')+slider('o','Moli di O₂',0,6,1,1,' mol')+'<div class="mole-grid" id="out"></div><div class="cap" id="cap" aria-live="polite"></div>';
  function toks(n,c,sym){var s='';for(var i=0;i<n;i++)s+='<span class="tok '+c+'" style="--i:'+i+'">'+sym+'</span>';return s;}
  function upd(){
    var h=+$('h').value,o=+$('o').value,xi=Math.min(h/2,o),w=2*xi,hl=h-2*xi,ol=o-xi,t;
    var before=toks(h,'h','H₂')+toks(o,'o','O₂'),after=toks(w,'w','H₂O')+toks(hl,'h','H₂')+toks(ol,'o','O₂');
    $('out').innerHTML='<div class="panel" style="margin:0"><h3>Prima</h3><div class="toks">'+(before||'<span class="note">vuoto</span>')+'</div></div><div class="panel" style="margin:0"><h3>Dopo la reazione</h3><div class="toks">'+(after||'<span class="note">vuoto</span>')+'</div></div>';
    if(h===0||o===0)t='Senza uno dei due reagenti la reazione non parte.';
    else{
      var lim=h/2<o?'H₂, che finisce per primo':h/2>o?'O₂, che finisce per primo':'nessuno: le quantità sono nel rapporto esatto';
      t='Servono 2 mol di H₂ ogni 1 mol di O₂. Con '+h+' mol di H₂ e '+o+' mol di O₂ il reagente limitante è <strong>'+lim+'</strong>. Si formano <strong>'+w+' mol di H₂O</strong>'+((hl||ol)?' e avanzano '+[hl?hl+' mol di H₂':'',ol?ol+' mol di O₂':''].filter(Boolean).join(' e ')+'.':'.');
    }
    setText('cap',t);
  }
  onInput('h',upd);onInput('o',upd);upd();
};

/* pH */
ANIM.cl8=function(root){
  root.innerHTML=slider('p','pH',0,14,0.1,7,'')+'<div class="phbar"><i id="mk"></i></div><div class="ph-read" id="rd"></div><div class="ions"><div><strong>Ioni H⁺</strong><div class="dots" id="hd"></div></div><div><strong>Ioni OH⁻</strong><div class="dots" id="od"></div></div></div><p class="note">I pallini mostrano quale ione prevale, non sono in scala.</p>'+chipRow('pre',[[2,'Limone'],[5,'Caffè'],[7,'Acqua pura'],[7.4,'Sangue'],[11,'Ammoniaca domestica']],null)+'<div class="cap" id="cap" aria-live="polite"></div>';
  function dots(n,c){var s='';for(var i=0;i<n;i++)s+='<span class="dot '+c+'" style="animation-delay:'+(i*25)+'ms"></span>';return s;}
  var lastH=-1,lastO=-1;
  function upd(v){
    var k=Math.ceil(v-1e-9),mH=Math.pow(10,k-v),po=14-v,ko=Math.ceil(po-1e-9),mO=Math.pow(10,ko-po);
    var type=v<6.95?'Soluzione acida':v>7.05?'Soluzione basica':'Soluzione neutra';
    $('mk').style.left=(v/14*100)+'%';
    setText('rd','<span class="ph-big">pH '+nf(v)+'</span><span>[H⁺] = '+nf(mH)+' × 10'+sup(-k)+' mol/L</span><span>[OH⁻] = '+nf(mO)+' × 10'+sup(-ko)+' mol/L</span><strong>'+type+'</strong>');
    var hN=v<7?Math.round((7-v)/7*17)+1:1,oN=v>7?Math.round((v-7)/7*17)+1:1;
    if(hN!==lastH){$('hd').innerHTML=dots(hN,'hp');lastH=hN;}
    if(oN!==lastO){$('od').innerHTML=dots(oN,'oh');lastO=oN;}
    var f=Math.pow(10,Math.abs(7-v)),ft=f<10?nf(f):String(Math.round(f));
    setText('cap',Math.abs(v-7)<0.05?'A pH 7 gli ioni H⁺ e OH⁻ sono in numero uguale (10⁻⁷ mol/L ciascuno): la soluzione è neutra.':v<7?'Rispetto all\'acqua pura (pH 7) qui gli ioni H⁺ sono circa <strong>'+ft+' volte</strong> più numerosi. Ogni unità di pH in meno significa 10 volte più H⁺.':'Rispetto all\'acqua pura (pH 7) qui gli ioni OH⁻ sono circa <strong>'+ft+' volte</strong> più numerosi. Ogni unità di pH in più significa 10 volte più OH⁻.');
  }
  onInput('p',upd);
  wireChips('pre',function(k){var v=+k;$('p').value=v;$('pv').textContent=nf(v);upd(v);});
  upd(7);
};

/* DNA: trascrizione e traduzione */
ANIM.bl4=function(root){
  var tpl='TACCGATTTACT',cmp={T:'A',A:'U',C:'G',G:'C'},AA={AUG:['Met','metionina, l\'amminoacido di inizio'],GCU:['Ala','alanina'],AAA:['Lys','lisina'],UGA:['Stop','codone di stop: la traduzione finisce']},n=0,timer=null,msg='Il filamento stampo (in alto) viene letto da 3\' a 5\'. Premi «Prossima base»: l\'mRNA cresce da 5\' a 3\'.';
  root.innerHTML='<div class="row" style="margin-bottom:10px"><button class="btn sm" id="nx">Prossima base</button><button class="btn ghost sm" id="au">Automatico</button><button class="btn ghost sm" id="rs">Ricomincia</button></div><div class="cap" id="cap" aria-live="polite"></div><div class="dnaw"><div class="dna" id="dn"></div></div>';
  function mrna(){var s='';for(var i=0;i<n;i++)s+=cmp[tpl[i]];return s;}
  function grid(){
    var m=mrna(),h='<div class="rowlab">DNA stampo, 3\' verso 5\'</div>';
    for(var i=0;i<12;i++)h+='<div class="b" data-b="'+tpl[i]+'">'+tpl[i]+'</div>';
    h+='<div class="rowlab">mRNA, 5\' verso 3\'</div>';
    for(var k=0;k<12;k++)h+=k<n?'<div class="b'+(k===n-1?' new':'')+'" data-b="'+m[k]+'">'+m[k]+'</div>':'<div class="b empty"></div>';
    h+='<div class="rowlab">Proteina (un amminoacido ogni codone)</div>';
    for(var c=0;c<4;c++){var cod=m.slice(c*3,c*3+3);h+=cod.length===3?'<div class="b aa'+(n===(c+1)*3?' new':'')+'">'+AA[cod][0]+'</div>':'<div class="b aa empty"></div>';}
    $('dn').innerHTML=h;setText('cap',msg);
  }
  function step(){
    if(n>=12){stopAuto();return;}
    var b=tpl[n];n++;
    msg='Base '+n+': nello stampo c\'è <strong>'+b+'</strong>, quindi nell\'mRNA si inserisce <strong>'+cmp[b]+'</strong>.'+(b==='A'?' Nell\'RNA, al posto della timina, c\'è l\'uracile (U).':'');
    if(n%3===0){var cod=mrna().slice(n-3);msg+=' Codone completo: <strong>'+cod+'</strong>, tradotto in '+AA[cod][0]+' ('+AA[cod][1]+').';}
    if(n===12)msg+=' L\'mRNA è pronto: il ribosoma lo ha tradotto in una piccola proteina (Met, Ala, Lys).';
    grid();
  }
  function stopAuto(){if(timer){clearInterval(timer);timer=null;}$('au').textContent='Automatico';}
  stops.push(function(){if(timer)clearInterval(timer);});
  $('nx').addEventListener('click',function(){stopAuto();step();});
  $('au').addEventListener('click',function(){if(timer){stopAuto();return;}if(n>=12)n=0;$('au').textContent='Pausa';step();timer=setInterval(step,1100);});
  $('rs').addEventListener('click',function(){stopAuto();n=0;msg='Si riparte: premi «Prossima base».';grid();});
  grid();
};

/* Genetica: quadrato di Punnett */
ANIM.bl5=function(root){

  function gcd(a,b){return b?gcd(b,a%b):a;}
  function upd(){
    var g1=p1.split(''),g2=p2.split(''),cells=[],cnt={AA:0,Aa:0,aa:0};
    var h='<div></div><div class="pg-h">'+g2[0]+'</div><div class="pg-h">'+g2[1]+'</div>';
    for(var i=0;i<2;i++){h+='<div class="pg-h">'+g1[i]+'</div>';for(var j=0;j<2;j++){var a=g1[i],b=g2[j],gt=a<b?a+b:b+a;if(a===b)gt=a+b;else gt='Aa';cnt[gt]++;h+='<div class="pc '+gt+'" style="--i:'+(i*2+j)+'">'+gt+'</div>';}}

    var dom=cnt.AA+cnt.Aa,rec=cnt.aa,ratio=rec===0?'tutti con il fenotipo dominante':dom===0?'tutti con il fenotipo recessivo':(dom/gcd(dom,rec))+' dominanti : '+(rec/gcd(dom,rec))+' recessivi';
    setText('cap','Ogni genitore passa ai figli uno dei suoi due alleli, con uguale probabilità. Qui i figli sono: '+ratio+'. Probabilità di un figlio aa: <strong>'+rec*25+'%</strong>.');
  }
  wireChips('p1',function(k){p1=k;upd();});wireChips('p2',function(k){p2=k;upd();});
  upd();
};

    s+='<line class="ghost" x1="'+X(0)+'" y1="'+Y(v0)+'" x2="'+X(TT)+'" y2="'+Y(v0+a*TT)+'"/>';
    s+='<polygon class="area" points="'+X(0)+','+Y(0)+' '+X(0)+','+Y(v0)+' '+X(t).toFixed(1)+','+Y(v).toFixed(1)+' '+X(t).toFixed(1)+','+Y(0)+'"/>';

/* Dinamica: piano inclinato */
ANIM.fl3=function(root){
  var th=30,t=0,running=false,dirty=true,LM=4;
  root.innerHTML=slider('th','Inclinazione del piano',0,60,5,30,'°')+'<div class="read" id="rd"></div><svg id="sv" class="animsvg" viewBox="0 0 600 300" role="img" aria-label="Blocco su un piano inclinato con le forze"></svg><div class="row" style="margin-top:10px"><button class="btn sm" id="go">Fai scivolare il blocco</button><button class="btn ghost sm" id="rs">Riporta in cima</button></div><div class="cap" id="cap" style="margin-top:12px" aria-live="polite"></div>';
  function draw(){
    var r=th*Math.PI/180,sn=Math.sin(r),cs=Math.cos(r),a=10*sn,L=Math.min(430,sn>0.01?200/sn:430),H=L*sn,W=L*cs,tx=60,ty=260-H,bx=60+W;
    var s='<defs><marker id="ahi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mki" d="M0 0L10 5L0 10z"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mks" d="M0 0L10 5L0 10z"/></marker></defs>';
    s+='<polygon class="ramp" points="'+tx+','+ty.toFixed(1)+' '+bx.toFixed(1)+',260 60,260"/>';
    if(th>=5)s+='<path class="angle" d="M'+(bx-40).toFixed(1)+' 260 A40 40 0 0 1 '+(bx-40*cs).toFixed(1)+' '+(260-40*sn).toFixed(1)+'"/><text class="txt" x="'+(bx-58).toFixed(1)+'" y="'+(250-6)+'">'+th+'°</text>';
    var sm=Math.min(LM,0.5*a*t*t),d=30+sm/LM*(L-70),px=tx+d*cs,py=ty+d*sn,cx=px+14*sn,cy=py-14*cs;
    s+='<g transform="translate('+cx.toFixed(1)+' '+cy.toFixed(1)+') rotate('+th+')"><rect class="blk" x="-22" y="-14" width="44" height="28" rx="4"/></g>';
    s+='<line class="vw" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+(cy+56).toFixed(1)+'" marker-end="url(#ahi)"/><text class="txt" x="'+(cx+8).toFixed(1)+'" y="'+(cy+66).toFixed(1)+'">P = m·g</text>';
    if(sn>0.05)s+='<line class="vp" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(cx+cs*56*sn).toFixed(1)+'" y2="'+(cy+sn*56*sn).toFixed(1)+'" marker-end="url(#ahs)"/>';
    if(th>0)s+='<line class="vn" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(cx-sn*56*cs).toFixed(1)+'" y2="'+(cy+cs*56*cs).toFixed(1)+'" stroke-dasharray="5 4"/>';
    s+='<text class="txtm" x="330" y="26">Linea colorata: parte del peso lungo il piano (fa muovere il blocco)</text><text class="txtm" x="330" y="46">Linea tratteggiata: parte contro il piano (il piano la compensa)</text>';
    $('sv').innerHTML=s;
    setText('rd','<span>a = g · sin θ = <b>'+nf(a)+'</b> m/s²</span><span>t = <b>'+nf(t)+'</b> s</span><span>v = <b>'+nf(a*t)+'</b> m/s</span>');
    setText('cap',th===0?'Su un piano orizzontale il peso è tutto contro il piano: non c\'è nessuna parte lungo il piano e il blocco resta fermo.':'Il peso si scompone in due parti: <strong>P∥ = m·g·sin θ</strong> lungo il piano (fa scivolare il blocco) e <strong>P⊥ = m·g·cos θ</strong> contro il piano. Più il piano è ripido, più P∥ cresce. La massa si semplifica: tutti i blocchi accelerano allo stesso modo.');
  }
  function reset(){t=0;running=false;dirty=true;}
  onInput('th',function(v){th=v;reset();});
  $('go').addEventListener('click',function(){var a=10*Math.sin(th*Math.PI/180);if(a<=0)return;if(0.5*a*t*t>=LM)t=0;running=true;dirty=true;});
  $('rs').addEventListener('click',reset);
  loop(function(dt){if(running){var a=10*Math.sin(th*Math.PI/180);t+=dt;if(0.5*a*t*t>=LM){t=Math.sqrt(2*LM/a);running=false;}dirty=true;}if(dirty){dirty=false;draw();}});
};

/* Energia: caduta di una palla */
ANIM.fl4=function(root){
  var h0=10,t=0,running=false,dirty=true;
  root.innerHTML=slider('h','Altezza iniziale h',2,20,1,10,' m')+'<div class="read" id="rd"></div><svg id="sv" class="animsvg" viewBox="0 0 600 345" role="img" aria-label="Palla in caduta e barre di energia"></svg><div class="row" style="margin-top:10px"><button class="btn sm" id="go">Lascia cadere la palla</button><button class="btn ghost sm" id="rs">Riporta su</button></div><div class="cap" id="cap" style="margin-top:12px" aria-live="polite"></div>';
  function draw(){
    var T=Math.sqrt(h0/5),tt=Math.min(t,T),y=Math.max(0,h0-5*tt*tt),v=10*tt,U=10*y,K=0.5*v*v,E=10*h0,BH=230,s='',k;
    s+='<line class="axis" x1="40" y1="300" x2="560" y2="300"/><line class="axis" x1="60" y1="60" x2="60" y2="300"/>';
    for(k=0;k<=20;k+=5)s+='<line class="axis" x1="55" y1="'+(300-k*12)+'" x2="65" y2="'+(300-k*12)+'"/><text class="txtm" x="50" y="'+(304-k*12)+'" text-anchor="end">'+k+'</text>';
    s+='<text class="txtm" x="70" y="52">altezza (m)</text>';
    s+='<line class="ghost" x1="60" y1="'+(300-h0*12)+'" x2="180" y2="'+(300-h0*12)+'"/>';
    s+='<circle class="ball" cx="130" cy="'+(300-y*12-12).toFixed(1)+'" r="12"/>';
    var bars=[[250,'Potenziale',U,'bu'],[350,'Cinetica',K,'bk']];
    bars.forEach(function(b){var hh=b[2]/E*BH;s+='<rect class="'+b[3]+'" x="'+b[0]+'" y="'+(300-hh).toFixed(1)+'" width="70" height="'+hh.toFixed(1)+'" rx="4"/><text class="txtm" x="'+(b[0]+35)+'" y="320" text-anchor="middle">'+b[1]+'</text><text class="txt" x="'+(b[0]+35)+'" y="'+(292-hh).toFixed(1)+'" text-anchor="middle">'+nf(b[2])+' J</text>';});
    var hk=K/E*BH,hu=U/E*BH;
    s+='<rect class="bk" x="470" y="'+(300-hk).toFixed(1)+'" width="70" height="'+hk.toFixed(1)+'"/><rect class="bu" x="470" y="'+(300-hk-hu).toFixed(1)+'" width="70" height="'+hu.toFixed(1)+'"/><rect class="tot" x="470" y="'+(300-BH)+'" width="70" height="'+BH+'" rx="4"/><text class="txtm" x="505" y="320" text-anchor="middle">Totale</text><text class="txt" x="505" y="'+(292-BH)+'" text-anchor="middle">'+nf(E)+' J</text>';
    $('sv').innerHTML=s;
    setText('rd','<span>quota = <b>'+nf(y)+'</b> m</span><span>velocità = <b>'+nf(v)+'</b> m/s</span><span>tempo = <b>'+nf(tt)+'</b> s</span>');
    setText('cap',tt>=T?'A terra tutta l\'energia potenziale è diventata cinetica: v = √(2·g·h) = <strong>'+nf(Math.sqrt(2*10*h0))+' m/s</strong>. Il totale è rimasto sempre uguale (senza attrito).':'Mentre la palla scende, l\'energia potenziale (m·g·h) diminuisce e quella cinetica (½·m·v²) aumenta della stessa quantità. La palla pesa 1 kg e g = 10 m/s².');
  }
  function reset(){t=0;running=false;dirty=true;}
  onInput('h',function(v){h0=v;reset();});
  $('go').addEventListener('click',function(){if(t>=Math.sqrt(h0/5))t=0;running=true;dirty=true;});
  $('rs').addEventListener('click',reset);
  loop(function(dt){if(running){t+=dt;if(t>=Math.sqrt(h0/5)){t=Math.sqrt(h0/5);running=false;}dirty=true;}if(dirty){dirty=false;draw();}});
};

/* Circuiti elettrici */
ANIM.fl9=function(root){
  var mode='one',V=12,R=6,off=[0,0];
  root.innerHTML=chipRow('mode',[['one','Un resistore'],['ser','Due in serie'],['par','Due in parallelo']],'one')+slider('v','Tensione V',1,24,1,12,' V')+slider('r','Resistenza di ogni resistore',1,20,1,6,' Ω')+'<div class="read" id="rd"></div><svg id="sv" class="animsvg" viewBox="0 0 600 300" role="img" aria-label="Circuito elettrico con cariche in movimento"></svg><div class="cap" id="cap" style="margin-top:12px" aria-live="polite"></div>';
  function info(){
    var Rt=mode==='one'?R:mode==='ser'?2*R:R/2,I=V/Rt,Ib=mode==='par'?V/R:I;
    return {Rt:Rt,I:I,Ib:Ib};
  }
  function paths(){
    if(mode==='par')return [[[70,240],[70,60],[330,60],[330,240],[70,240]],[[70,240],[70,60],[520,60],[520,240],[70,240]]];
    return [[[70,240],[70,60],[520,60],[520,240],[70,240]]];
  }
  function draw(dt){
    var f=info(),P=paths(),s='';
    s+='<polyline class="wire" points="70,240 70,60 520,60 520,240 70,240"/>';
    if(mode==='par')s+='<polyline class="wire" points="330,60 330,240"/>';
    s+='<rect class="batt" x="58" y="130" width="24" height="40"/><text class="txt" x="94" y="155">'+V+' V</text>';
    var sp=Math.min(260,30+14*f.Ib);
    P.forEach(function(pts,i){
      off[i]+=dt*sp;var L=polyLen(pts),n=Math.round(L/38),stp=L/n;
      for(var k=0;k<n;k++){var q=polyPos(pts,off[i]+k*stp);s+='<circle class="ch" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4.5"/>';}
    });
    function res(x,y1,y2,lab){s+='<rect class="resb" x="'+(x-18)+'" y="'+y1+'" width="36" height="'+(y2-y1)+'" rx="4"/><text class="txt" x="'+(x+26)+'" y="'+((y1+y2)/2+5)+'">'+lab+'</text>';}
    if(mode==='one')res(520,120,180,R+' Ω');
    else if(mode==='ser'){res(520,85,125,R+' Ω');res(520,175,215,R+' Ω');}
    else{res(330,120,180,R+' Ω');res(520,120,180,R+' Ω');}
    $('sv').innerHTML=s;
    setText('rd','<span>R totale = <b>'+nf(f.Rt)+'</b> Ω</span><span>corrente totale = <b>'+nf(f.I)+'</b> A</span><span>potenza = <b>'+nf(V*f.I)+'</b> W</span>');
    setText('cap',mode==='one'?'Legge di Ohm: I = V / R = '+V+' / '+R+' = <strong>'+nf(f.I)+' A</strong>. Più la corrente è alta, più le cariche (i pallini) corrono veloci.':mode==='ser'?'In serie la corrente è la stessa in tutto il circuito e le resistenze si sommano: R = '+R+' + '+R+' = <strong>'+nf(f.Rt)+' Ω</strong>, quindi I = '+nf(f.I)+' A. Con più resistori la corrente cala.':'In parallelo ogni ramo ha la stessa tensione V e la corrente si divide: ogni ramo porta I = V / R = '+nf(f.Ib)+' A. La corrente totale è la somma ('+nf(f.I)+' A) e la resistenza equivalente si abbassa: R = '+R+' / 2 = <strong>'+nf(f.Rt)+' Ω</strong>.');
  }
  wireChips('mode',function(k){mode=k;off=[0,0];if(RM)draw(0);});
  onInput('v',function(x){V=x;if(RM)draw(0);});onInput('r',function(x){R=x;if(RM)draw(0);});
  draw(0);
  if(!RM)loop(function(dt){draw(dt);});
};


/* ---------- Eventi ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  var a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'go':go(d.v);break;
    case 'pickT':{var a=selTopics(),i=a.indexOf(d.t);if(i>-1)a.splice(i,1);else a.push(d.t);S.sel=a;save();ui.focusSel='[data-t="'+d.t+'"]';render();break;}
    case 'pickS':{var ids=TOPICS.filter(function(t){return t.s===d.v;}).map(function(t){return t.id;}),cur=selTopics(),all=ids.every(function(x){return cur.indexOf(x)>-1;});S.sel=all?cur.filter(function(x){return ids.indexOf(x)<0;}):cur.concat(ids.filter(function(x){return cur.indexOf(x)<0;}));save();ui.focusSel='[data-v="'+d.v+'"]';render();break;}
    case 'pickAll':S.sel=TOPICS.map(function(t){return t.id;});save();render();break;
    case 'pickNone':S.sel=[];save();render();break;
    case 'pickWeak':S.sel=rankTopics().slice(0,5);save();render();break;
    case 'pickN':ui.pickN=+d.v;ui.focusSel='[data-v="'+d.v+'"][data-act="pickN"]';render();break;
    case 'pickGo':startQuiz('multi',selTopics(),{n:ui.pickN===undefined?10:ui.pickN,diff:S.diff===undefined?'auto':S.diff});break;
    case 'pickD':S.diff=d.v==='auto'?'auto':+d.v;save();ui.focusSel='[data-act="pickD"][data-v="'+d.v+'"]';render();break;
    case 'errMore':ui.errAll=ui.errAll||{};ui.errAll[d.t]=true;render();break;
    case 'pickExam':S.diff=4;if(!selTopics().length)S.sel=rankTopics().slice(0,5);save();go('pick');break;
    case 'quizTopicExam':startQuiz('topic',d.t,{n:10,diff:4});break;
    case 'placeStart':startPlace(d.arg);break;
    case 'startQuiz':startQuiz(d.mode,d.arg);break;
    case 'quizTopic':startQuiz('topic',d.t);break;
    case 'parT':{var pa=parSel(d.t).slice(),pi=pa.indexOf(d.v);if(pi>-1)pa.splice(pi,1);else pa.push(d.v);S.psel[d.t]=pa;save();ui.focusSel='[data-act="parT"][data-v="'+d.v+'"]';render();break;}
    case 'parNone':parSel(d.t);S.psel[d.t]=[];save();render();break;
    case 'parQuiz':startQuiz('par',d.t,{pars:parSel(d.t),n:10});break;
    case 'parCards':ui.topic=d.t;startCards('par');break;
    case 'quizErrTopic':startQuiz('errors',d.t);break;
    case 'ans':answer(+d.i);break;
    case 'conf':if(sess&&!sess.reveal){sess.conf=d.c==='n'?null:d.c;sess.reveal=true;render();}break;
    case 'goalSet':S.goal=+d.v;save();render();break;
    case 'hideToggle':S.hide=(S.hide===false);save();render();break;
    case 'examStart':startExam(+d.n);break;
    case 'examGo':if(sess&&sess.mode==='exam'){sess.i=+d.i;ui.exConf=false;render();scrollTop();}break;
    case 'examAns':if(sess&&sess.mode==='exam'){sess.ans[sess.i]=+d.j;ui.exConf=false;render();}break;
    case 'examStep':if(sess&&sess.mode==='exam'){sess.i=Math.max(0,Math.min(sess.items.length-1,sess.i+(+d.v)));render();scrollTop();}break;
    case 'examSubmit':examSubmit(false);break;
    case 'examCancel':ui.exConf=false;render();break;
    case 'examQuit':if(ui.exQuit){go('home');}else{ui.exQuit=true;render();}break;
    case 'gScope':ui.gscope=d.v;render();break;
    case 'gStart':startGame(d.g);break;
    case 'gAgain':if(gm)startGame(gm.g);break;
    case 'gExit':go('games');break;
    case 'gPop':case 'gTime':case 'gKey':case 'gBoss':case 'gmT':case 'gmD':case 'gTF':case 'gGu':case 'gNext':case 'gOrd':gameAct(a,d);break;
    case 'next':next();break;
    case 'rev':setReview(d.v);break;
    case 'quit':go('home');break;
    case 'lessonStart':lessonStart();break;
    case 'lessonNext':lessonNext();break;
    case 'lessonSwap':ui.swap=(ui.swap||0)+1;render();break;
    case 'lessonDrop':S.lesson=null;save();render();break;
    case 'explain':explainQ(d.q,+d.c,el);break;
    case 'openTopic':ui.topic=d.t;view='topic';sess=null;ui.msg='';render();scrollTop();break;
    case 'tab':ui.tab=d.tab;render();break;
    case 'genMat':genMat(d.t);break;
    case 'genQ':genQ(d.t);break;
    case 'startCards':startCards(d.arg);break;
    case 'flip':if(sess){sess.flipped=true;render();}break;
    case 'rate':rate(d.r);break;
    case 'helpClose':S.helpSeen=true;ui.help=false;save();render();break;
    case 'backupOpen':ui.backup=true;render();break;
    case 'backupClose':ui.backup=false;render();break;
    case 'exportData':{
      var box=$('bk'),code='';
      try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){}
      box.value=code;box.focus();box.select();
      var done=function(ok){setText('bkm',ok?'Codice creato e copiato. Incollalo sull\'altro dispositivo.':'Codice creato: selezionalo e copialo a mano.');};
      try{navigator.clipboard.writeText(code).then(function(){done(true);},function(){done(false);});}catch(e){done(false);}
      break;}
    case 'importData':{
      var txt=($('bk').value||'').trim(),obj=null;
      try{obj=JSON.parse(decodeURIComponent(escape(atob(txt))));}catch(e){}
      if(!obj||!Array.isArray(obj.log)||typeof obj.topics!=='object'){setText('bkm','Il codice non è valido. Controlla di averlo copiato per intero.');break;}
      S=Object.assign(blank(),obj);save();ui.backup=false;ui.help=false;render();scrollTop();break;}
    case 'helpOpen':ui.help=true;render();scrollTop();break;
    case 'reset':
      if(ui.confirmReset){S=blank();save();ui.confirmReset=false;}else ui.confirmReset=true;
      render();break;
  }
});

render();
getSample().then(function(){render();});
})();
