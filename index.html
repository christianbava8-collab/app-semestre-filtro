{id:"fl10_026",t:"fl10",p:"10.2",l:3,q:"Una spira è in un campo magnetico. Quando il flusso attraverso di essa è nullo?",o:["Quando il campo è parallelo al piano della spira","Quando il campo è perpendicolare al piano della spira","Sempre","Mai"],a:0,e:"Φ = B·S·cos θ, con θ angolo tra B e la normale alla superficie: se B è parallelo al piano, θ = 90° e cos θ = 0."},
{id:"fl10_027",t:"fl10",p:"10.2.2",l:1,q:"Che cosa sono le correnti di Foucault?",o:["Correnti indotte in lamine conduttrici quando varia il flusso magnetico","Correnti nei liquidi","Correnti nei superconduttori","Correnti generate dalle pile"],a:0,e:"Sono dissipative (effetto Joule): nelle macchine elettriche si cerca di ridurle."},
{id:"fl10_028",t:"fl10",p:"10.2.3",l:2,q:"Qual è l'unità di misura dell'induttanza?",o:["Henry","Weber","Tesla","Farad"],a:0,e:"Il flusso autoconcatenato è Φ = L·i, quindi L = Φ/i: weber/ampere = henry."},
{id:"fl10_029",t:"fl10",p:"10.2.3",l:2,q:"Da che cosa dipende l'induttanza di un circuito?",o:["Solo dalla forma e dalle dimensioni del circuito","Dalla corrente che lo attraversa","Dalla tensione applicata","Dalla temperatura"],a:0,e:"Nei solenoidi è particolarmente elevata: L = μ₀n²S/l."},
{id:"fl10_030",t:"fl10",p:"10.2.3",l:3,q:"Perché spegnendo un interruttore a volte si vede una scintilla?",o:["Per un'extracorrente autoindotta dovuta alla brusca diminuzione di corrente","Per l'effetto Joule nella lampadina","Per le correnti di Foucault","Per un cortocircuito"],a:0,e:"L'induttanza si oppone alle variazioni di corrente: una variazione improvvisa genera una f.e.m. autoindotta elevata."},
{id:"fl10_031",t:"fl10",p:"10.2.2",l:3,q:"Perché estrarre rapidamente una lastra di rame da una potente calamita è difficile?",o:["Le correnti di Foucault indotte si oppongono al movimento (legge di Lenz)","Il rame è attratto dalla calamita come il ferro","Per l'attrito con l'aria","Per la forza di gravità"],a:0,e:"Il rame non è ferromagnetico, ma il movimento fa variare il flusso e nascono correnti che frenano il moto."},
{id:"fl10_032",t:"fl10",p:"10.3",l:1,q:"Che corrente si genera in una spira che ruota in un campo magnetico costante?",o:["Una corrente alternata","Una corrente continua","Nessuna corrente","Una corrente costante nel verso"],a:0,e:"Il verso della corrente indotta cambia ogni mezzo giro: la f.e.m. varia in modo sinusoidale."},
{id:"fl10_033",t:"fl10",p:"10.3.1",l:2,q:"Che relazione c'è tra intensità efficace e intensità massima di una corrente alternata?",o:["i_eff = i₀/√2","i_eff = i₀/2","i_eff = i₀·√2","i_eff = i₀"],a:0,e:"L'intensità efficace è quella della corrente continua che dissiperebbe la stessa energia per effetto Joule."},
{id:"fl10_034",t:"fl10",p:"10.3.2",l:2,q:"Che cosa rappresenta l'impedenza Z in un circuito in corrente alternata?",o:["Ciò che la resistenza rappresenta per la corrente continua","La frequenza della corrente","La capacità del circuito","La potenza dissipata"],a:0,e:"f.e.m.₀ = Z·i₀; Z si misura in ohm e dipende da resistori, condensatori, induttori e dalla pulsazione."},
{id:"fl10_035",t:"fl10",p:"10.3.1",l:3,q:"Una corrente alternata ha valore massimo 10 A. Quanto vale circa l'intensità efficace?",o:["7,1 A","5 A","14,1 A","10 A"],a:0,e:"i_eff = 10/√2 ≈ 7,07 A."},
{id:"fl10_036",t:"fl10",p:"10.4",l:1,q:"Quale macchina trasforma energia meccanica in corrente alternata?",o:["L'alternatore","La dinamo","Il motore elettrico","La pila"],a:0,e:"La dinamo produce corrente continua; il motore elettrico fa il contrario (elettrica → meccanica)."},
{id:"fl10_037",t:"fl10",p:"10.4",l:2,q:"Che differenza c'è tra una pila e un accumulatore?",o:["L'accumulatore è reversibile: trasforma energia chimica in elettrica e viceversa","La pila è reversibile","L'accumulatore produce corrente alternata","Nessuna"],a:0,e:"La pila trasforma energia chimica in elettrica ma non viceversa; l'accumulatore è una pila reversibile."},
{id:"fl10_038",t:"fl10",p:"10.4",l:2,q:"Un trasformatore ha 100 spire nel primario e 500 nel secondario. Se il primario è a 220 V, il secondario è a…",o:["1100 V","44 V","220 V","22.000 V"],a:0,e:"V₂/V₁ = n₂/n₁ ⇒ V₂ = 220 · 500/100 = 1100 V."},
{id:"fl10_039",t:"fl10",p:"10.4",l:3,q:"Perché nelle linee elettriche la corrente si trasporta ad alta tensione?",o:["Perché a parità di potenza la corrente è più bassa e le perdite per effetto Joule (∝ i²) sono minori","Perché l'alta tensione è più sicura","Perché la resistenza dei fili aumenta","Perché la corrente alternata non passa a bassa tensione"],a:0,e:"Alzando la tensione si abbassa l'intensità di corrente, e la dissipazione è proporzionale al quadrato della corrente."},
{id:"fl10_040",t:"fl10",p:"10.1.1",l:4,q:"Quali sono le dimensioni del campo magnetico B?",o:["[M][T]⁻²[i]⁻¹","[M][L][T]⁻²","[M][L]²[T]⁻²[i]⁻¹","[L][T]⁻¹"],a:0,e:"B = F/(q·v): [M][L][T]⁻² / ([i][T]·[L][T]⁻¹) = [M][T]⁻²[i]⁻¹."},
{id:"fl10_041",t:"fl10",p:"10.1.3",l:4,q:"Il campo di un filo a 2 cm di distanza vale 4·10⁻⁵ T. Quanto vale a 8 cm?",o:["1·10⁻⁵ T","2,5·10⁻⁶ T","1,6·10⁻⁴ T","2·10⁻⁵ T"],a:0,e:"B è inversamente proporzionale a r: distanza 4 volte maggiore ⇒ campo 4 volte minore."},
{id:"fl10_042",t:"fl10",p:"10.1.2",l:4,q:"Se la velocità di una particella carica che gira in un campo magnetico raddoppia, il raggio della sua traiettoria…",o:["raddoppia","si dimezza","quadruplica","resta uguale"],a:0,e:"r = mv/(qB): è proporzionale alla velocità."},
{id:"fl10_043",t:"fl10",p:"10.4",l:4,q:"Un trasformatore deve ridurre 220 V a 11 V. Se il primario ha 1000 spire, quante ne deve avere il secondario?",o:["50","20.000","200","500"],a:0,e:"n₂ = n₁ · V₂/V₁ = 1000 · 11/220 = 50."},
{id:"fl10_044",t:"fl10",p:"10.2",l:4,q:"Un magnete è fermo vicino a una spira chiusa. Quanta corrente indotta circola?",o:["Nessuna, perché il flusso non varia","Una corrente costante","Una corrente alternata","Dipende dalla forza del magnete"],a:0,e:"Le correnti indotte nascono solo se il flusso concatenato cambia nel tempo."},
{id:"fl10_045",t:"fl10",p:"10.1.1",l:1,q:"Come si stabilisce la direzione del vettore induzione magnetica B in un punto?",o:["È quella secondo cui si dispone un aghetto magnetico posto in quel punto","È sempre verticale","È quella della corrente","È quella del campo elettrico"],a:0,e:"Il verso va dal polo sud al polo nord dell'aghetto."},
{id:"fl10_046",t:"fl10",p:"10.1.1",l:2,q:"A che cosa corrisponde 1 weber?",o:["1 V·s","1 T/m²","1 A·m","1 N/C"],a:0,e:"1 Wb = 1 V·s; 1 T = 1 Wb/m²."},
{id:"fl10_047",t:"fl10",p:"10.1.4",l:2,q:"Due fili paralleli sono percorsi da correnti di verso opposto. Che cosa succede?",o:["Si respingono","Si attraggono","Non interagiscono","Ruotano di 90°"],a:0,e:"Correnti concordi si attraggono, discordi si respingono."},
{id:"fl10_048",t:"fl10",p:"10.1.4",l:3,q:"Se la distanza tra due fili paralleli percorsi da corrente raddoppia, la forza tra loro…",o:["si dimezza","diventa ¼","raddoppia","resta uguale"],a:0,e:"F = μ₀·i₁·i₂·l/(2πd): è inversamente proporzionale alla distanza d."},
{id:"fl10_049",t:"fl10",p:"10.2.2",l:2,q:"Perché nelle macchine elettriche si cerca di ridurre le correnti di Foucault?",o:["Perché dissipano energia per effetto Joule","Perché aumentano il rendimento","Perché sono pericolose per l'uomo","Perché producono raggi X"],a:0,e:"Sono correnti dissipative: trasformano energia in calore."},
{id:"fl10_050",t:"fl10",p:"10.3",l:2,q:"Come si scrive l'intensità di una corrente alternata in funzione del tempo?",o:["i = i₀·sen(ωt)","i = i₀·t","i = i₀/t","i = i₀ costante"],a:0,e:"i₀ è il valore massimo. Se nel circuito vale la legge di Ohm, f.e.m. e corrente sono in fase."},
{id:"fl10_051",t:"fl10",p:"10.3",l:3,q:"Nei circuiti in corrente alternata con induttanze e capacità, f.e.m. e corrente…",o:["possono essere sfasate","sono sempre in fase","sono sempre in opposizione","sono sempre nulle"],a:0,e:"Sono in fase solo se vale la legge di Ohm (circuito puramente resistivo); induttanze e capacità introducono uno sfasamento."},
{id:"fl10_052",t:"fl10",p:"10.3.1",l:2,q:"Come si definisce l'intensità efficace di una corrente alternata?",o:["L'intensità della corrente continua che dissiperebbe la stessa energia per effetto Joule","Il valore massimo della corrente","La media della corrente in un periodo","Il valore minimo della corrente"],a:0,e:"Vale i_eff = i₀/√2 e il calore dissipato è R·i_eff²·Δt."},
{id:"fl10_053",t:"fl10",p:"10.3.2",l:2,q:"In che unità si misura l'impedenza?",o:["Ohm","Henry","Farad","Hertz"],a:0,e:"Z lega i valori massimi: f.e.m.₀ = Z·i₀. È chiamata anche resistenza apparente o reattanza."},
{id:"fl10_054",t:"fl10",p:"10.3.2",l:3,q:"Da che cosa dipende l'impedenza di un circuito in corrente alternata?",o:["Da condensatori, resistori e induttori del circuito e dalla pulsazione della corrente","Solo dalla resistenza","Solo dalla tensione","Dal numero di spire del trasformatore"],a:0,e:"Rappresenta per la corrente alternata quello che la resistenza rappresenta per la continua."},
{id:"fl11_001",t:"fl11",p:"11.1",l:1,q:"Che cosa trasporta un'onda?",o:["Energia, ma non materia","Materia, ma non energia","Materia ed energia","Né materia né energia"],a:0,e:"Un tappo di sughero su uno specchio d'acqua oscilla in verticale ma non viene trasportato."},
{id:"fl11_002",t:"fl11",p:"11.1",l:1,q:"Quale tipo di onda si propaga anche nel vuoto?",o:["Le onde elettromagnetiche","Le onde sonore","Le onde sull'acqua","Le onde elastiche"],a:0,e:"Le onde meccaniche hanno bisogno di un mezzo; quelle elettromagnetiche no (la luce del Sole arriva attraverso lo spazio vuoto)."},
{id:"fl11_003",t:"fl11",p:"11.1",l:2,q:"Il suono nell'aria è un'onda…",o:["longitudinale","trasversale","elettromagnetica","stazionaria"],a:0,e:"Nei gas e all'interno dei liquidi si propagano solo onde longitudinali: zone alternate di compressione e rarefazione."},
{id:"fl11_004",t:"fl11",p:"11.1",l:2,q:"Quale di queste è un'onda trasversale?",o:["La luce","Il suono nell'aria","Il suono nell'acqua","Nessuna"],a:0,e:"Luce e onde sulla superficie dell'acqua sono trasversali: la vibrazione è perpendicolare alla propagazione."},
{id:"fl11_005",t:"fl11",p:"11.1",l:3,q:"In quale mezzo possono propagarsi onde meccaniche sia longitudinali sia trasversali?",o:["Nei solidi","Nei gas","All'interno dei liquidi","Nel vuoto"],a:0,e:"Nei solidi entrambi i tipi; nei gas e dentro i liquidi solo longitudinali; sulla superficie dei liquidi trasversali."},
{id:"fl11_006",t:"fl11",p:"11.2",l:1,q:"Quale relazione lega velocità, lunghezza d'onda e frequenza?",o:["v = λ·f","v = λ/f","v = f/λ","v = λ + f"],a:0,e:"L'onda percorre una lunghezza d'onda in un periodo: v = λ/T = λ·f."},
{id:"fl11_007",t:"fl11",p:"11.2",l:1,q:"In che unità si misura la frequenza?",o:["Hertz (oscillazioni al secondo)","Secondi","Metri","Metri al secondo"],a:0,e:"La frequenza è il numero di oscillazioni al secondo; il periodo T = 1/f si misura in secondi."},
{id:"fl11_008",t:"fl11",p:"11.2",l:2,q:"Un suono ha velocità 500 m/s e frequenza 100 Hz. Qual è la sua lunghezza d'onda?",o:["5 m","0,2 m","50.000 m","600 m"],a:0,e:"λ = v/f = 500/100 = 5 m."},
{id:"fl11_009",t:"fl11",p:"11.2",l:2,q:"Quando un'onda passa da un mezzo a un altro, che cosa NON cambia?",o:["La frequenza","La velocità","La lunghezza d'onda","Tutte cambiano"],a:0,e:"Periodo e frequenza sono proprietà intrinseche dell'onda; lunghezza d'onda, velocità e ampiezza dipendono dal mezzo."},
{id:"fl11_010",t:"fl11",p:"11.2.1",l:2,q:"Due onde sono in opposizione di fase quando…",o:["la prima ha un massimo mentre la seconda ha un minimo","hanno i massimi negli stessi istanti","una è in ritardo di un quarto di periodo","hanno frequenze diverse"],a:0,e:"In concordanza i massimi coincidono; in quadratura la seconda è in ritardo di T/4."},
{id:"fl11_011",t:"fl11",p:"11.2.3",l:3,q:"Come varia l'intensità di un'onda sferica se la distanza dalla sorgente raddoppia?",o:["Diventa ¼","Si dimezza","Resta uguale","Raddoppia"],a:0,e:"Per le onde sferiche l'intensità è inversamente proporzionale al quadrato della distanza."},
{id:"fl11_012",t:"fl11",p:"11.2.3",l:3,q:"Una stella V emette 4 volte la potenza di una stella Z (stesso spettro). Perché sembrino ugualmente luminose, l'osservatore deve stare da V a una distanza…",o:["doppia rispetto a Z","quadrupla rispetto a Z","uguale","metà"],a:0,e:"I ∝ P/r²: con potenza 4 volte maggiore serve una distanza 2 volte maggiore."},
{id:"fl11_013",t:"fl11",p:"11.2.3",l:3,q:"L'intensità di un'onda è proporzionale…",o:["al quadrato dell'ampiezza e al quadrato della frequenza","all'ampiezza","alla lunghezza d'onda","alla velocità"],a:0,e:"I = k·f²·A²: raddoppiando l'ampiezza l'intensità quadruplica."},
{id:"fl11_014",t:"fl11",p:"11.3.1",l:1,q:"Che cosa afferma la legge della riflessione?",o:["L'angolo di incidenza è uguale all'angolo di riflessione","L'angolo di riflessione è il doppio di quello di incidenza","Il raggio riflesso è sempre perpendicolare","L'angolo di rifrazione è uguale a quello di incidenza"],a:0,e:"Inoltre raggio incidente, raggio riflesso e normale stanno sullo stesso piano."},
{id:"fl11_015",t:"fl11",p:"11.3.1",l:2,q:"Quanto vale la velocità della luce in un mezzo con indice di rifrazione 1,5?",o:["2·10⁸ m/s","4,5·10⁸ m/s","3·10⁸ m/s","1,5·10⁸ m/s"],a:0,e:"v = c/n = 3·10⁸/1,5 = 2·10⁸ m/s."},
{id:"fl11_016",t:"fl11",p:"11.3.1",l:2,q:"Un raggio di luce passa dall'aria all'acqua. Che cosa succede?",o:["Rallenta e si avvicina alla normale","Accelera e si allontana dalla normale","Non cambia direzione","Si riflette totalmente"],a:0,e:"Passando a un mezzo dove è più lenta (n maggiore) la luce ha angolo di rifrazione minore di quello di incidenza."},
{id:"fl11_017",t:"fl11",p:"11.3.2",l:2,q:"Quando può avvenire la riflessione totale?",o:["Quando la luce passa da un mezzo più rifrangente a uno meno rifrangente, oltre l'angolo limite","Sempre, passando dall'aria al vetro","Solo con gli specchi","Quando l'angolo di incidenza è 0°"],a:0,e:"Il raggio rifratto si allontana dalla normale; oltre l'angolo limite sen θ = n₂/n₁ viene tutto riflesso."},
{id:"fl11_018",t:"fl11",p:"11.3.2",l:3,q:"Quanto vale circa l'angolo limite nel passaggio vetro (n = 1,5) – aria?",o:["41,8°","30°","48,6°","60°"],a:0,e:"sen θ = 1/1,5 ≈ 0,667 ⇒ θ ≈ 41,8°."},
{id:"fl11_019",t:"fl11",p:"11.3.4",l:3,q:"Quando è particolarmente evidente la diffrazione?",o:["Quando l'ostacolo o la fenditura hanno dimensioni confrontabili con la lunghezza d'onda","Quando l'ostacolo è molto più grande di λ","Solo con la luce","Solo nel vuoto"],a:0,e:"La fenditura si comporta come una nuova sorgente puntiforme (principio di Huygens-Fresnel)."},
{id:"fl11_020",t:"fl11",p:"11.3.5",l:3,q:"Due onde coerenti in opposizione di fase si sovrappongono. Che interferenza si ha?",o:["Distruttiva","Costruttiva","Nessuna","Riflessione totale"],a:0,e:"Le elongazioni si sommano: in opposizione di fase si sottraggono (distruttiva), in concordanza si rafforzano (costruttiva)."},
{id:"fl11_021",t:"fl11",p:"11.3.5",l:3,q:"Come si chiamano i punti fissi di un'onda stazionaria?",o:["Nodi","Ventri","Fronti","Fuochi"],a:0,e:"Le onde stazionarie, come nelle corde di una chitarra, alternano nodi (fermi) e ventri (ampiezza massima)."},
{id:"fl11_022",t:"fl11",p:"11.4",l:1,q:"Qual è l'intervallo di frequenze udibili dall'orecchio umano?",o:["Da 16 Hz a 20.000 Hz","Da 0 Hz a 1000 Hz","Da 20 kHz a 2 MHz","Da 1 Hz a 16 Hz"],a:0,e:"Sotto i 16 Hz ci sono gli infrasuoni, sopra i 20.000 Hz gli ultrasuoni."},
{id:"fl11_023",t:"fl11",p:"11.4",l:1,q:"Quanto vale circa la velocità del suono nell'aria in condizioni ordinarie?",o:["340 m/s","3·10⁸ m/s","1450 m/s","34 m/s"],a:0,e:"Nell'acqua è maggiore (1450 m/s), nei solidi ancora di più (5130 m/s nel ferro)."},
{id:"fl11_024",t:"fl11",p:"11.4.1",l:2,q:"Quale caratteristica del suono dipende dalla frequenza?",o:["L'altezza (acuto o grave)","L'intensità","Il timbro","La velocità"],a:0,e:"Frequenza alta = suono acuto. Il timbro dipende dalla forma dell'onda, l'intensità dall'energia trasportata."},
{id:"fl11_025",t:"fl11",p:"11.4.1",l:2,q:"Due strumenti suonano la stessa nota con la stessa intensità ma si distinguono. Perché?",o:["Hanno timbro diverso","Hanno frequenza diversa","Hanno velocità diversa","Hanno ampiezza diversa"],a:0,e:"Il timbro è legato alla forma dell'onda."},
{id:"fl11_026",t:"fl11",p:"11.4.1",l:2,q:"Quanto vale la soglia del dolore?",o:["120 dB","0 dB","20 dB","1000 dB"],a:0,e:"Soglia di udibilità 0 dB, soglia del dolore 120 dB."},
{id:"fl11_027",t:"fl11",p:"11.4.1",l:3,q:"Un suono è 100 volte più intenso della soglia di udibilità. Che livello sonoro ha?",o:["20 dB","100 dB","2 dB","10 dB"],a:0,e:"L = 10·log₁₀(100) = 10 · 2 = 20 dB."},
{id:"fl11_028",t:"fl11",p:"11.4.2",l:3,q:"A che distanza minima da una parete bisogna stare per sentire l'eco (v = 340 m/s)?",o:["17 m","34 m","3,4 m","170 m"],a:0,e:"Il suono riflesso deve arrivare almeno 0,1 s dopo: 2d = 340 · 0,1 ⇒ d = 17 m. Altrimenti si parla di rimbombo."},
{id:"fl11_029",t:"fl11",p:"11.4.3",l:3,q:"Perché ai soldati si ordina di rompere il passo attraversando un ponte?",o:["Per evitare la risonanza con la frequenza propria del ponte","Per ridurre il peso sul ponte","Per evitare l'effetto Doppler","Per evitare l'eco"],a:0,e:"Se il passo avesse la stessa frequenza propria del ponte, le oscillazioni si amplificherebbero fino a poterlo rompere."},
{id:"fl11_030",t:"fl11",p:"11.4.4",l:1,q:"Un'ambulanza si avvicina con la sirena accesa. Come si sente il suono?",o:["Più acuto (frequenza maggiore)","Più grave","Uguale","Più veloce"],a:0,e:"Effetto Doppler: avvicinandosi la frequenza percepita aumenta; allontanandosi diminuisce."},
{id:"fl11_031",t:"fl11",p:"11.4.5",l:2,q:"Che frequenze usano tipicamente gli ultrasuoni in ecografia?",o:["Tra 2 e 15 MHz","Tra 16 e 20.000 Hz","Sotto i 16 Hz","Tra 2 e 15 kHz"],a:0,e:"Frequenze più alte danno maggiore risoluzione ma minore penetrazione."},
{id:"fl11_032",t:"fl11",p:"11.4.5",l:3,q:"Come si calcola l'impedenza acustica di un mezzo?",o:["Z = ρ·v (densità per velocità del suono)","Z = v/ρ","Z = ρ/v","Z = λ·f"],a:0,e:"Quando l'ultrasuono incontra due mezzi con impedenze diverse, una parte viene riflessa: è il principio dell'ecografia."},
{id:"fl11_033",t:"fl11",p:"11.4.5",l:3,q:"Qual è la massima risoluzione assiale di un'ecografia?",o:["Metà lunghezza d'onda","Una lunghezza d'onda","Due lunghezze d'onda","Un quarto di lunghezza d'onda"],a:0,e:"È la minima distanza distinguibile lungo la profondità del fascio."},
{id:"fl11_034",t:"fl11",p:"11.5",l:1,q:"Quanto vale la velocità della luce nel vuoto?",o:["3·10⁸ m/s (300.000 km/s)","340 m/s","3·10⁵ m/s","3·10¹⁰ km/s"],a:0,e:"Maxwell trovò che le onde e.m. si propagano nel vuoto a questa velocità e ipotizzò che la luce fosse un'onda e.m."},
{id:"fl11_035",t:"fl11",p:"11.5.1",l:2,q:"Quale intervallo di lunghezze d'onda corrisponde alla luce visibile?",o:["Da 380 nm (violetto) a 760 nm (rosso)","Da 380 µm a 760 µm","Da 1 mm a 1 m","Da 10 nm a 100 nm"],a:0,e:"Prima del rosso c'è l'infrarosso, dopo il violetto l'ultravioletto."},
{id:"fl11_036",t:"fl11",p:"11.5.1",l:2,q:"Da che cosa dipende l'energia di un fotone?",o:["Dalla frequenza: E = h·f","Dall'ampiezza","Dalla velocità","Dalla distanza dalla sorgente"],a:0,e:"Più la frequenza è alta, più l'onda è energetica: infrarosso < visibile < ultravioletto."},
{id:"fl11_037",t:"fl11",p:"11.5",l:2,q:"In un'onda elettromagnetica, come sono orientati i campi E e B?",o:["Perpendicolari tra loro e alla direzione di propagazione, e in fase","Paralleli tra loro","Paralleli alla direzione di propagazione","Sfasati di un quarto di periodo"],a:0,e:"Le onde e.m. sono trasversali; dove si annulla un campo si annulla anche l'altro."},
{id:"fl11_038",t:"fl11",p:"11.5.2",l:3,q:"In un prisma, quale colore viene deviato di più?",o:["Il violetto","Il rosso","Il verde","Tutti allo stesso modo"],a:0,e:"L'indice di rifrazione dipende dalla frequenza: il rosso è il meno deviato, il violetto il più deviato (dispersione)."},
{id:"fl11_039",t:"fl11",p:"11.5.1",l:3,q:"Qual è la frequenza di un'onda e.m. con λ = 6000 Å nel vuoto?",o:["5·10¹⁴ Hz","5·10¹² Hz","2·10⁻¹⁵ Hz","1,8·10¹⁷ Hz"],a:0,e:"λ = 6·10⁻⁷ m; f = c/λ = 3·10⁸ / 6·10⁻⁷ = 5·10¹⁴ Hz."},
{id:"fl11_040",t:"fl11",p:"11.5.3",l:3,q:"Come varia l'illuminazione di una superficie se la sua distanza dalla sorgente raddoppia?",o:["Diventa ¼","Si dimezza","Resta uguale","Raddoppia"],a:0,e:"Legge di Lambert: l'intensità di illuminazione è inversamente proporzionale al quadrato della distanza."},
{id:"fl11_041",t:"fl11",p:"11.5.4",l:3,q:"Che cosa si intende per luce polarizzata?",o:["Luce in cui il campo elettrico oscilla in una sola direzione","Luce di un solo colore","Luce che viaggia più veloce","Luce riflessa da uno specchio"],a:0,e:"La luce naturale non è polarizzata; si può polarizzare per assorbimento (filtri), riflessione (angolo di Brewster) o diffusione."},
{id:"fl11_042",t:"fl11",p:"11.6.1",l:1,q:"Com'è l'immagine data da uno specchio piano?",o:["Virtuale, diritta, simmetrica e delle stesse dimensioni","Reale e capovolta","Virtuale e rimpicciolita","Reale e ingrandita"],a:0,e:"L'immagine sta dietro lo specchio alla stessa distanza dell'oggetto; se alzi il braccio destro, l'immagine alza il sinistro."},
{id:"fl11_043",t:"fl11",p:"11.6.1",l:2,q:"In uno specchio sferico, dove si trova il fuoco?",o:["A metà tra il centro di curvatura e il vertice (f = r/2)","Nel centro di curvatura","Sul vertice","A distanza doppia del raggio"],a:0,e:"Vale sia per gli specchi concavi (convergenti) sia per quelli convessi (divergenti), dove il fuoco è dietro lo specchio."},
{id:"fl11_044",t:"fl11",p:"11.6.1",l:2,q:"Com'è sempre l'immagine data da uno specchio convesso?",o:["Virtuale, diritta e rimpicciolita","Reale e capovolta","Reale e ingrandita","Virtuale e ingrandita"],a:0,e:"Lo specchio concavo invece può dare immagini reali o virtuali a seconda della posizione dell'oggetto."},
{id:"fl11_045",t:"fl11",p:"11.6.2",l:2,q:"Qual è il potere diottrico di una lente convergente con distanza focale 20 cm?",o:["+5 diottrie","+0,05 diottrie","+20 diottrie","−5 diottrie"],a:0,e:"P = 1/f con f in metri: 1/0,2 = 5 D, positivo perché la lente è convergente."},
{id:"fl11_046",t:"fl11",p:"11.6.2",l:3,q:"Un oggetto è a 30 cm da una lente convergente con f = 10 cm. A che distanza si forma l'immagine?",o:["15 cm","20 cm","7,5 cm","30 cm"],a:0,e:"1/q = 1/f − 1/p = 1/10 − 1/30 = 2/30 ⇒ q = 15 cm (positivo: immagine reale, oltre la lente)."},
{id:"fl11_047",t:"fl11",p:"11.6.2",l:3,q:"Un oggetto è posto nel fuoco di una lente convergente. Dove si forma l'immagine?",o:["All'infinito","Nel fuoco opposto","Nel centro della lente","A distanza 2f"],a:0,e:"1/q = 1/f − 1/f = 0: i raggi escono paralleli e non ha senso parlare di ingrandimento."},
{id:"fl11_048",t:"fl11",p:"11.6.1",l:3,q:"Il libro di 30 cm si riflette in uno specchio piano a 1 m. Se lo si sposta a 2 m, quanto è alta l'immagine?",o:["30 cm","15 cm","60 cm","7,5 cm"],a:0,e:"In uno specchio piano l'immagine ha sempre le stesse dimensioni dell'oggetto."},
{id:"fl11_049",t:"fl11",p:"11.6.3",l:1,q:"Nella miopia, dove si forma l'immagine e come si corregge?",o:["Prima della retina; con una lente divergente","Dopo la retina; con una lente convergente","Sulla retina; non serve correggere","Prima della retina; con una lente convergente"],a:0,e:"L'ipermetropia invece forma l'immagine dopo la retina e si corregge con una lente biconvessa (convergente)."},
{id:"fl11_050",t:"fl11",p:"11.6.3",l:2,q:"Che cos'è la presbiopia?",o:["La diminuzione del potere accomodativo dell'occhio","L'immagine che si forma prima della retina","Una diversa messa a fuoco su assi diversi","L'incapacità di distinguere i colori"],a:0,e:"L'astigmatismo è invece la diversa posizione dell'immagine su assi diversi."},
{id:"fl11_051",t:"fl11",p:"11.6.4",l:2,q:"Come si calcola l'ingrandimento totale di un microscopio ottico?",o:["Prodotto tra ingrandimento dell'obiettivo e dell'oculare","Somma dei due ingrandimenti","Rapporto tra i due","Solo dall'obiettivo"],a:0,e:"Per esempio un obiettivo 40× con oculare 10× dà 400×."},
{id:"fl11_052",t:"fl11",p:"11.6.4",l:3,q:"Perché nel microscopio ottico l'oggetto deve essere almeno in parte trasparente?",o:["Perché viene attraversato dalla luce del sistema di illuminazione","Perché la luce deve riflettersi sull'oggetto","Perché l'oculare funziona solo al buio","Perché il vetrino è opaco"],a:0,e:"Per questo spesso si osserva solo una sottile «fetta» del campione su un vetrino."},
{id:"fl11_053",t:"fl11",p:"11.2",l:4,q:"Una corda vibra a 2 Hz e la distanza tra un massimo e il minimo successivo è 2 m. Qual è la velocità dell'onda?",o:["8 m/s","4 m/s","1 m/s","2 m/s"],a:0,e:"Massimo-minimo = λ/2 ⇒ λ = 4 m; v = λ·f = 4 · 2 = 8 m/s."},
{id:"fl11_054",t:"fl11",p:"11.2.3",l:4,q:"Un'onda circolare ha ampiezza 2 cm a 1 m dalla sorgente. A che distanza l'ampiezza si dimezza?",o:["4 m","2 m","√2 m","8 m"],a:0,e:"Per onde circolari I ∝ 1/r e I ∝ A²: A dimezzata ⇒ I ridotta a ¼ ⇒ r quadruplicata: 4 m."},
{id:"fl11_055",t:"fl11",p:"11.5.1",l:4,q:"A quale regione dello spettro appartiene un'onda e.m. con λ = 1 cm nel vuoto?",o:["Microonde","Luce visibile","Raggi X","Ultravioletto"],a:0,e:"1 cm = 10⁷ nm, molto più del visibile (380–760 nm) e meno delle onde radio lunghe: è nel campo delle microonde."},
{id:"fl11_056",t:"fl11",p:"11.6.2",l:4,q:"Una lente divergente ha distanza focale −0,5 m. Qual è il suo potere diottrico?",o:["−2 diottrie","+2 diottrie","−0,5 diottrie","+0,5 diottrie"],a:0,e:"P = 1/f = 1/(−0,5) = −2 D: negativo perché la lente è divergente (come quelle per i miopi)."},
{id:"fl11_057",t:"fl11",p:"11.4.1",l:4,q:"Un suono ha livello 60 dB e un altro 80 dB. Quante volte è più intenso il secondo?",o:["100 volte","20 volte","2 volte","1000 volte"],a:0,e:"20 dB = 2 bel; ogni bel è un fattore 10: 10² = 100."},
{id:"fl11_058",t:"fl11",p:"11.2.1",l:2,q:"Due onde sono in quadratura di fase quando…",o:["la seconda è in ritardo di un quarto di periodo: quando la prima ha un massimo, la seconda è nulla","hanno i massimi insieme","una ha un massimo quando l'altra ha un minimo","hanno frequenze diverse"],a:0,e:"Concordanza: massimi insieme. Opposizione: massimo e minimo insieme. Quadratura: sfasamento di T/4."},
{id:"fl11_059",t:"fl11",p:"11.2.1",l:2,q:"Come si chiama la distanza di un punto oscillante dalla sua posizione di equilibrio?",o:["Elongazione","Ampiezza","Lunghezza d'onda","Fase"],a:0,e:"L'ampiezza A è il valore massimo dell'elongazione."},
{id:"fl11_060",t:"fl11",p:"11.2.2",l:1,q:"Che cos'è un fronte d'onda?",o:["L'insieme dei punti che in un dato istante hanno la stessa fase","Il punto più alto dell'onda","La sorgente dell'onda","La distanza tra due creste"],a:0,e:"Per onde nel piano è una linea (le circonferenze sull'acqua), per onde nello spazio una superficie."},
{id:"fl11_061",t:"fl11",p:"11.2.2",l:2,q:"Come è orientato il fronte d'onda rispetto alla direzione di propagazione?",o:["Perpendicolare","Parallelo","Inclinato di 45°","Dipende dall'onda"],a:0,e:"Il fronte d'onda è in ogni punto perpendicolare alla direzione di propagazione."},
{id:"fl11_062",t:"fl11",p:"11.2.2",l:2,q:"Come sono i fronti di un'onda prodotta da una sorgente puntiforme nello spazio tridimensionale?",o:["Sfere (onda sferica)","Piani","Rette","Circonferenze"],a:0,e:"In base ai fronti d'onda le onde si classificano in lineari, piane, circolari e sferiche."},
{id:"fl11_063",t:"fl11",p:"11.3.2",l:2,q:"La riflessione totale può avvenire quando la luce passa dall'aria all'acqua?",o:["No: serve il passaggio a un mezzo meno rifrangente, come dall'acqua all'aria","Sì, sempre","Sì, oltre i 45°","Sì, solo per la luce rossa"],a:0,e:"Il raggio rifratto si allontana dalla normale solo se passa a un mezzo con indice minore."},
{id:"fl11_064",t:"fl11",p:"11.3.3",l:1,q:"Che cosa succede quando un raggio colpisce una superficie non levigata?",o:["Viene riflesso in direzioni diverse (diffusione)","Viene riflesso con angolo uguale a quello di incidenza","Viene assorbito del tutto","Si rifrange sempre"],a:0,e:"Per questo una torcia puntata su una parete illumina tutta la stanza."},
{id:"fl11_065",t:"fl11",p:"11.3.3",l:2,q:"Perché una parete illuminata da una torcia rischiara tutta la stanza?",o:["Perché la superficie scabra diffonde la luce in tutte le direzioni","Perché la parete emette luce propria","Per la riflessione totale","Per la diffrazione"],a:0,e:"Ogni porzione della superficie ha un'inclinazione diversa e riflette la luce in una direzione diversa."},
{id:"fl11_066",t:"fl11",p:"11.3.3",l:2,q:"In che cosa differiscono riflessione e diffusione?",o:["Nella riflessione la superficie è levigata e c'è una sola direzione riflessa; nella diffusione è scabra e la luce va in molte direzioni","La diffusione avviene solo nel vuoto","La riflessione cambia la frequenza","Non c'è differenza"],a:0,e:"In entrambi i casi la luce torna indietro dalla superficie, ma con geometrie diverse."},
{id:"fl11_067",t:"fl11",p:"11.3.4",l:1,q:"Che cosa succede a un'onda che incontra una fenditura?",o:["La fenditura si comporta come una nuova sorgente puntiforme di onde","L'onda si ferma","L'onda cambia frequenza","L'onda si polarizza"],a:0,e:"È il principio di Huygens-Fresnel."},
{id:"fl11_068",t:"fl11",p:"11.3.4",l:2,q:"Che cosa fa il fronte d'onda quando incontra un ostacolo?",o:["Si deforma in modo da aggirarlo","Si ferma completamente","Viene sempre riflesso","Accelera"],a:0,e:"La diffrazione è più evidente quando le dimensioni dell'ostacolo sono confrontabili con λ."},
{id:"fl11_069",t:"fl11",p:"11.3.5",l:2,q:"Dove si possono osservare le onde stazionarie?",o:["Nelle corde di una chitarra","Nella luce del Sole","Nell'eco in montagna","Nei raggi X"],a:0,e:"Nascono dalla sovrapposizione di onde uguali che si riflettono agli estremi e restano confinate."},
{id:"fl11_070",t:"fl11",p:"11.4",l:2,q:"Il suono si propaga nel vuoto?",o:["No, perché è un'onda meccanica","Sì, alla velocità della luce","Sì, a 340 m/s","Solo se è un ultrasuono"],a:0,e:"Le onde acustiche hanno bisogno di un mezzo: nei fluidi sono compressioni e rarefazioni del mezzo."},
{id:"fl11_071",t:"fl11",p:"11.4.2",l:2,q:"Che cosa si sente se il suono riflesso arriva meno di 0,1 s dopo quello originale?",o:["Un rimbombo, non un'eco","Un'eco più forte","Nessun suono","Un suono più acuto"],a:0,e:"Per l'eco servono almeno 0,1 s di ritardo e un assorbimento minimo, come in montagna."},
{id:"fl11_072",t:"fl11",p:"11.4.2",l:3,q:"Una persona sente l'eco dopo 1 s (v = 340 m/s). A che distanza è la parete?",o:["170 m","340 m","680 m","17 m"],a:0,e:"Il suono fa andata e ritorno: 2d = 340 · 1 ⇒ d = 170 m."},
{id:"fl11_073",t:"fl11",p:"11.4.3",l:1,q:"Si fa vibrare un diapason vicino a un altro uguale. Che cosa succede al secondo?",o:["Comincia a vibrare emettendo lo stesso suono (risonanza)","Resta fermo","Emette un suono più grave","Smorza il primo"],a:0,e:"Un corpo con una propria frequenza di oscillazione vibra se colpito da un'onda con quella frequenza."},
{id:"fl11_074",t:"fl11",p:"11.4.3",l:2,q:"La risonanza riguarda…",o:["qualunque tipo di onda","solo le onde acustiche","solo la luce","solo le onde sull'acqua"],a:0,e:"Il libro sottolinea che il fenomeno è proprio di qualunque tipo di onda."},
{id:"fl11_075",t:"fl11",p:"11.4.4",l:2,q:"Un ascoltatore si allontana da una sorgente sonora ferma. La frequenza che percepisce è…",o:["minore di quella emessa","maggiore di quella emessa","uguale","nulla"],a:0,e:"Quando sorgente e ascoltatore si allontanano la frequenza percepita diminuisce, quando si avvicinano aumenta."},
{id:"fl11_076",t:"fl11",p:"11.4.4",l:3,q:"L'effetto Doppler si ha quando…",o:["c'è un moto relativo tra sorgente e ascoltatore","la sorgente è più potente","l'onda passa da un mezzo all'altro","l'onda incontra un ostacolo"],a:0,e:"Vale sia se si muove la sorgente sia se si muove l'ascoltatore."},
{id:"fl11_077",t:"fl11",p:"11.5",l:1,q:"Le onde elettromagnetiche sono…",o:["trasversali e si propagano anche nel vuoto","longitudinali","meccaniche","solo visibili"],a:0,e:"Sono formate da un campo elettrico e un campo magnetico che vibrano perpendicolari tra loro e alla direzione di propagazione."},
{id:"fl11_078",t:"fl11",p:"11.5.2",l:1,q:"Quale fenomeno spiega l'arcobaleno?",o:["La dispersione della luce nelle goccioline d'acqua","La riflessione totale","L'effetto Doppler","La polarizzazione"],a:0,e:"La luce bianca si scompone nei colori perché l'indice di rifrazione dipende dalla frequenza."},
{id:"fl11_079",t:"fl11",p:"11.5.2",l:2,q:"Tra rosso e violetto, quale colore ha frequenza minore?",o:["Il rosso","Il violetto","Hanno la stessa frequenza","Dipende dal mezzo"],a:0,e:"Il rosso ha frequenza minore e lunghezza d'onda maggiore; prima del rosso c'è l'infrarosso, dopo il violetto l'ultravioletto."},
{id:"fl11_080",t:"fl11",p:"11.5.3",l:1,q:"Qual è l'unità di misura dell'intensità di illuminazione?",o:["Il lux","La candela","Il watt","Il decibel"],a:0,e:"Il lux è l'illuminazione prodotta da una sorgente di 1 candela su una superficie a 1 m."},
{id:"fl11_081",t:"fl11",p:"11.5.3",l:3,q:"Una lampadina puntiforme da 125,6 W illumina in tutte le direzioni. A che distanza l'illuminazione vale 1000 W/m²?",o:["0,1 m","1 m","0,01 m","10 m"],a:0,e:"E = P/(4πr²) ⇒ r² = 125,6/(4π · 1000) = 0,01 m² ⇒ r = 0,1 m."},
{id:"fl11_082",t:"fl11",p:"11.5.4",l:2,q:"La luce naturale è polarizzata?",o:["No: il campo elettrico oscilla in tutte le direzioni perpendicolari alla propagazione","Sì, sempre","Solo di giorno","Solo quella del Sole"],a:0,e:"La polarizzazione si ottiene per assorbimento (filtri), riflessione (angolo di Brewster) o diffusione."},
{id:"fl11_083",t:"fl11",p:"11.5.4",l:3,q:"Come si ottiene la polarizzazione per riflessione?",o:["Con la luce che colpisce una superficie non metallica all'angolo di Brewster","Con un prisma","Con uno specchio metallico","Con una lente convergente"],a:0,e:"La luce riflessa da acqua o vetro a quell'angolo è parzialmente o totalmente polarizzata."},
{id:"fl11_084",t:"fl11",p:"11.6",l:1,q:"Di che cosa si occupa l'ottica geometrica?",o:["Della propagazione della luce quando la lunghezza d'onda è piccola rispetto agli ostacoli, trascurando la diffrazione","Della natura corpuscolare della luce","Della diffrazione e dell'interferenza","Delle onde sonore"],a:0,e:"In questa approssimazione la luce si descrive con raggi rettilinei."},
{id:"fl11_085",t:"fl11",p:"11.6",l:2,q:"Che cosa si forma dietro un corpo opaco illuminato da una sorgente estesa?",o:["Una zona d'ombra e una zona di penombra","Solo un'ombra scura","Nessuna ombra","Solo penombra"],a:0,e:"Con una sorgente puntiforme si forma solo l'ombra; con una sorgente estesa anche la penombra, dove arriva parte dei raggi."},
{id:"fl11_086",t:"fl11",p:"11.6",l:2,q:"Quando un'immagine si dice virtuale?",o:["Quando si forma dall'intersezione dei prolungamenti dei raggi divergenti","Quando i raggi si incontrano davvero in un punto","Quando è capovolta","Quando è ingrandita"],a:0,e:"Se i raggi convergono e si incontrano davvero l'immagine è reale."},
{id:"fl11_087",t:"fl11",p:"11.6.3",l:2,q:"Che lente si usa per correggere l'ipermetropia?",o:["Una lente biconvessa (convergente)","Una lente divergente","Uno specchio","Una lente cilindrica sempre"],a:0,e:"Nell'ipermetropia l'immagine si forma dopo la retina."},
{id:"fl11_088",t:"fl11",p:"11.6.4",l:2,q:"Come si chiamano le due lenti del microscopio ottico?",o:["Obiettivo (vicino all'oggetto) e oculare","Condensatore e diaframma","Specchio e prisma","Torretta e stativo"],a:0,e:"L'immagine prodotta dall'obiettivo fa da oggetto per l'oculare."},
{id:"fl12_001",t:"fl12",p:"12.1",l:1,q:"Che cosa indica il numero atomico Z?",o:["Il numero di protoni nel nucleo","Il numero di neutroni","Il numero di protoni più neutroni","Il numero di elettroni di valenza"],a:0,e:"A (numero di massa) è invece il numero di nucleoni, cioè protoni + neutroni."},
{id:"fl12_002",t:"fl12",p:"12.1",l:1,q:"Che cosa hanno in comune due isotopi dello stesso elemento?",o:["Lo stesso numero atomico Z","Lo stesso numero di massa A","Lo stesso numero di neutroni","Nulla"],a:0,e:"Gli isotopi hanno stesso Z e diverso A, perché contengono un diverso numero di neutroni; si comportano chimicamente allo stesso modo."},
{id:"fl12_003",t:"fl12",p:"12.1",l:2,q:"Quanti neutroni ha l'ossigeno-18 (Z = 8)?",o:["10","8","18","26"],a:0,e:"Neutroni = A − Z = 18 − 8 = 10."},
{id:"fl12_004",t:"fl12",p:"12.1",l:2,q:"Di che cosa sono fatti protoni e neutroni?",o:["Di quark","Di elettroni","Di fotoni","Sono particelle elementari"],a:0,e:"I nucleoni non sono elementari: sono costituiti da quark, descritti dalla fisica quantistica."},
{id:"fl12_005",t:"fl12",p:"12.1",l:2,q:"Quale di queste radiazioni è NON ionizzante?",o:["Le microonde","I raggi X","I raggi gamma","Le particelle alfa"],a:0,e:"UV, luce visibile, microonde e onde radio non hanno energia sufficiente per ionizzare; possono eccitare o riscaldare."},
{id:"fl12_006",t:"fl12",p:"12.1",l:3,q:"Quale interazione tiene uniti i nucleoni nel nucleo?",o:["L'interazione nucleare forte","L'interazione elettrostatica","L'interazione gravitazionale","L'interazione debole"],a:0,e:"Tra nucleo ed elettroni e nei legami delle molecole semplici agisce invece l'interazione elettrostatica."},
{id:"fl12_007",t:"fl12",p:"12.1",l:3,q:"Perché le radiazioni ionizzanti sono pericolose per le cellule?",o:["Rompono legami molecolari, creano radicali liberi e possono danneggiare il DNA","Riscaldano solo la pelle","Producono campi magnetici","Rallentano il metabolismo"],a:0,e:"Il danno al DNA può portare a mutazioni, apoptosi o proliferazione incontrollata; per lo stesso motivo sono usate in radioterapia contro i tumori."},
{id:"fl12_008",t:"fl12",p:"12.2.1",l:1,q:"Quale reazione nucleare avviene nel Sole?",o:["La fusione dell'idrogeno in elio","La fissione dell'uranio","Il decadimento alfa","Il decadimento gamma"],a:0,e:"Nella fusione due nuclei piccoli si uniscono in uno più grande e stabile, liberando energia."},
{id:"fl12_009",t:"fl12",p:"12.2.1",l:2,q:"Che cosa provoca la fissione dell'uranio-235 in una centrale nucleare?",o:["L'assorbimento di un neutrone lento","Un'alta temperatura","Un campo magnetico intenso","Un elettrone veloce"],a:0,e:"L'uranio si spezza in due nuclei più piccoli e libera neutroni che possono spezzare altri nuclei: reazione a catena."},
{id:"fl12_010",t:"fl12",p:"12.2.1",l:2,q:"A che cosa servono le barre di controllo in un reattore a fissione?",o:["Ad assorbire i neutroni in eccesso","A rallentare i neutroni","A produrre neutroni","A raffreddare l'uranio"],a:0,e:"Le barre (di solito di cadmio) assorbono neutroni; il moderatore (acqua pesante) li rallenta. In una bomba atomica mancano le barre di controllo."},
{id:"fl12_011",t:"fl12",p:"12.2.1",l:3,q:"Da dove viene l'energia liberata nella fissione?",o:["Dalla differenza tra la massa del nucleo iniziale e quella dei prodotti (equivalenza massa-energia)","Dall'energia cinetica dei neutroni lenti","Dalla combustione dell'uranio","Dall'energia degli elettroni"],a:0,e:"Un chilo di uranio fornisce circa un milione di volte l'energia di un chilo di carbone."},
{id:"fl12_012",t:"fl12",p:"12.2.2",l:1,q:"Qual è la più debole delle quattro forze fondamentali?",o:["La gravitazionale","L'elettromagnetica","La debole","La forte"],a:0,e:"In ordine decrescente: forte, debole, elettromagnetica, gravitazionale. La gravità conta solo su grandi scale."},
{id:"fl12_013",t:"fl12",p:"12.2.2",l:2,q:"Quale interazione regola il decadimento β?",o:["L'interazione debole","L'interazione forte","L'interazione gravitazionale","L'interazione elettrostatica"],a:0,e:"L'interazione debole è importante a livello microscopico ed è stata unificata con quella elettromagnetica nell'elettrodebole."},
{id:"fl12_014",t:"fl12",p:"12.2.2",l:3,q:"Quali interazioni sono state unificate nell'interazione elettrodebole?",o:["Debole ed elettromagnetica","Forte e debole","Gravitazionale ed elettromagnetica","Forte e gravitazionale"],a:0,e:"L'obiettivo della fisica moderna è completare l'unificazione in un'unica interazione."},
{id:"fl12_015",t:"fl12",p:"12.2.3",l:1,q:"Che cos'è una particella alfa?",o:["Un nucleo di elio (2 protoni e 2 neutroni)","Un elettrone veloce","Un fotone ad alta energia","Un positrone"],a:0,e:"Ha carica +2e. La particella β⁻ è un elettrone, la β⁺ un positrone, la γ un fotone."},
{id:"fl12_016",t:"fl12",p:"12.2.3",l:1,q:"Quale radiazione è la più penetrante?",o:["La radiazione gamma","La radiazione alfa","La radiazione beta","Sono uguali"],a:0,e:"Le α si fermano con un foglio di carta, le β con pochi mm di alluminio, le γ richiedono piombo o cemento."},
{id:"fl12_017",t:"fl12",p:"12.2.3",l:2,q:"In un decadimento alfa, come cambiano A e Z?",o:["A diminuisce di 4, Z di 2","A diminuisce di 2, Z di 4","A resta uguale, Z aumenta di 1","Non cambiano"],a:0,e:"L'atomo perde 2 protoni e 2 neutroni: (A, Z) → (A − 4, Z − 2)."},
{id:"fl12_018",t:"fl12",p:"12.2.3",l:2,q:"In un decadimento β⁻, che cosa succede al numero atomico?",o:["Aumenta di 1, mentre A resta uguale","Diminuisce di 1","Diminuisce di 2","Resta uguale"],a:0,e:"Un neutrone si trasforma in protone ed è emesso un elettrone veloce. Nel β⁺ invece Z diminuisce di 1."},
{id:"fl12_019",t:"fl12",p:"12.2.3",l:2,q:"In un decadimento gamma…",o:["A e Z restano invariati; il nucleo perde energia","A diminuisce di 4","Z aumenta di 1","Viene emesso un elettrone"],a:0,e:"Si emette un fotone ad alta energia, senza massa né carica."},
{id:"fl12_020",t:"fl12",p:"12.2.3",l:3,q:"L'uranio-238 (Z = 92) subisce un decadimento α. Che nucleo si forma?",o:["Torio-234 (Z = 90)","Uranio-234 (Z = 92)","Torio-238 (Z = 90)","Protoattinio-238 (Z = 93)"],a:0,e:"A: 238 − 4 = 234; Z: 92 − 2 = 90, che è il torio."},
{id:"fl12_021",t:"fl12",p:"12.2.3",l:3,q:"Il cobalto-60 (Z = 27) subisce un decadimento β⁻. Che nucleo si forma?",o:["Nichel-60 (Z = 28)","Ferro-60 (Z = 26)","Cobalto-59","Nichel-56"],a:0,e:"A resta 60, Z aumenta di 1 e diventa 28: nichel."},
{id:"fl12_022",t:"fl12",p:"12.2.3",l:2,q:"Qual è l'unità di misura della dose assorbita?",o:["Gray (J/kg)","Sievert","Becquerel","Curie"],a:0,e:"D = E/m. La dose equivalente H = w·D si misura in sievert, sempre J/kg ma «pesata» per l'effetto biologico."},
{id:"fl12_023",t:"fl12",p:"12.2.3",l:3,q:"Quale radiazione ha il fattore di pericolosità w più alto?",o:["La radiazione alfa (w = 20)","I raggi X (w = 1)","I raggi gamma (w = 1)","La radiazione beta (w = 1)"],a:0,e:"I neutroni hanno w tra 3 e 11. Le α sono poco penetranti ma molto dannose se assorbite."},
{id:"fl12_024",t:"fl12",p:"12.2.3",l:3,q:"Una dose assorbita di 0,1 Gy di particelle α a quale dose equivalente corrisponde?",o:["2 Sv","0,1 Sv","0,005 Sv","20 Sv"],a:0,e:"H = w·D = 20 · 0,1 = 2 Sv."},
{id:"fl12_025",t:"fl12",p:"12.2.3",l:3,q:"Quale uso della radioattività è terapeutico?",o:["Lo iodio-131 per ipertiroidismo o cancro della tiroide","La PET","La gamma camera","La valutazione della perfusione miocardica"],a:0,e:"PET e gamma camera sono tecniche diagnostiche con traccianti; la radioterapia e lo iodio-131 sono terapie."},
{id:"fl12_026",t:"fl12",p:"12.2.4",l:1,q:"Che cos'è il tempo di dimezzamento?",o:["Il tempo in cui decade metà dei nuclei radioattivi","Il tempo in cui decadono tutti i nuclei","La metà della vita media","Il tempo di un singolo decadimento"],a:0,e:"È caratteristico di ogni isotopo e va da frazioni di secondo a miliardi di anni."},
{id:"fl12_027",t:"fl12",p:"12.2.4",l:2,q:"Una sostanza ha tempo di dimezzamento 4 giorni. Quale frazione resta dopo 12 giorni?",o:["1/8","1/3","1/4","1/12"],a:0,e:"12 giorni sono 3 dimezzamenti: (1/2)³ = 1/8."},
{id:"fl12_028",t:"fl12",p:"12.2.4",l:2,q:"Qual è l'unità di misura dell'attività radioattiva nel SI?",o:["Becquerel (una disintegrazione al secondo)","Gray","Sievert","Hertz"],a:0,e:"Esiste anche il curie: 1 Ci = 3,7·10¹⁰ Bq (attività di un grammo di radio)."},
{id:"fl12_029",t:"fl12",p:"12.2.4",l:3,q:"Che forma ha la legge del decadimento radioattivo?",o:["Esponenziale: N(t) = N₀·e^(−λt)","Lineare: N(t) = N₀ − λt","Iperbolica: N(t) = N₀/t","Parabolica"],a:0,e:"Ogni nucleo ha in ogni istante la stessa probabilità di decadere, indipendentemente dalla sua «età»."},
{id:"fl12_030",t:"fl12",p:"12.2.4",l:3,q:"Che relazione c'è tra tempo di dimezzamento e vita media τ?",o:["T½ = τ·ln 2","T½ = τ/2","T½ = 2τ","T½ = τ"],a:0,e:"Poiché ln 2 ≈ 0,69, il tempo di dimezzamento è un po' più breve della vita media."},
{id:"fl12_031",t:"fl12",p:"12.3.1",l:1,q:"Che caratteristiche ha la luce di un laser?",o:["Monocromatica, unidirezionale e molto concentrata","Di tutti i colori e diffusa in ogni direzione","Invisibile e poco energetica","Polarizzata ma debole"],a:0,e:"Si ottiene per emissione stimolata; si usa in chirurgia al posto del bisturi e nella lavorazione dei metalli."},
{id:"fl12_032",t:"fl12",p:"12.3.2",l:2,q:"Come si producono i raggi X?",o:["Da elettroni ad alta energia che urtano un solido e fanno saltare gli elettroni interni degli atomi","Dal decadimento del nucleo","Da una lampada a incandescenza","Dalla fusione nucleare"],a:0,e:"L'elettrone che riempie il posto vuoto compie un salto ΔE ed emette un'onda di frequenza f = ΔE/h. Li scoprì Röntgen nel 1895."},
{id:"fl12_033",t:"fl12",p:"12.3.2",l:2,q:"I raggi X vengono deviati da un campo elettrico o magnetico?",o:["No, perché non hanno carica","Sì, sempre","Solo dal campo magnetico","Solo dal campo elettrico"],a:0,e:"Come tutte le onde elettromagnetiche sono privi di carica. Sono penetranti, impressionano le lastre e ionizzano i gas."},
{id:"fl12_034",t:"fl12",p:"12.3.2",l:2,q:"Che differenza c'è tra raggi X e raggi gamma?",o:["I gamma hanno frequenza maggiore e nascono dal nucleo; gli X dagli elettroni","Gli X sono più energetici","I gamma sono particelle cariche","Non c'è differenza"],a:0,e:"I raggi γ derivano dal riassestamento del nucleo dopo un decadimento α o β."},
{id:"fl12_035",t:"fl12",p:"12.3.3",l:3,q:"Nelle immagini TAC, perché le ossa appaiono più chiare?",o:["Perché sono più dense e attenuano di più i raggi X","Perché emettono raggi X","Perché riflettono gli ultrasuoni","Perché sono più calde"],a:0,e:"Il principio della TAC è l'attenuazione differenziale: i tessuti meno densi (grasso, aria) appaiono più scuri."},
{id:"fl12_036",t:"fl12",p:"12.3.3",l:3,q:"Rispetto a una radiografia tradizionale, la TAC…",o:["dà immagini di sezioni e ricostruzioni 3D, ma con una dose di radiazioni maggiore","usa ultrasuoni","non usa radiazioni ionizzanti","dà solo immagini bidimensionali"],a:0,e:"Per questo va valutata con attenzione l'indicazione clinica e ottimizzata la dose."},
{id:"fl12_037",t:"fl12",p:"12.1",l:4,q:"Il carbonio-14 ha Z = 6. Quanti protoni, neutroni ed elettroni ha l'atomo neutro?",o:["6 protoni, 8 neutroni, 6 elettroni","6 protoni, 14 neutroni, 6 elettroni","8 protoni, 6 neutroni, 8 elettroni","14 protoni, 6 neutroni, 14 elettroni"],a:0,e:"Neutroni = 14 − 6 = 8; nell'atomo neutro gli elettroni sono uguali ai protoni."},
{id:"fl12_038",t:"fl12",p:"12.2.4",l:4,q:"Il radon-222 ha tempo di dimezzamento di circa 3,8 giorni. Dopo circa 15,2 giorni, quale frazione resta?",o:["1/16","1/4","1/8","1/32"],a:0,e:"15,2 / 3,8 = 4 dimezzamenti: (1/2)⁴ = 1/16."},
{id:"fl12_039",t:"fl12",p:"12.2.3",l:4,q:"Un nucleo subisce un decadimento α seguito da due decadimenti β⁻. Come cambiano complessivamente A e Z?",o:["A − 4, Z invariato","A − 4, Z − 2","A invariato, Z + 2","A − 4, Z + 2"],a:0,e:"α: A − 4, Z − 2. Ogni β⁻: Z + 1. Totale: A − 4, Z − 2 + 2 = Z."},
{id:"fl12_040",t:"fl12",p:"12.2.3",l:4,q:"Quale schermatura basta per fermare le particelle beta?",o:["Pochi millimetri di alluminio","Un foglio di carta","Diversi centimetri di piombo","Nessuna, le attraversano tutte"],a:0,e:"Le α si fermano con la carta o la pelle; le γ richiedono piombo o cemento."},
{id:"fl12_041",t:"fl12",p:"12.2.1",l:4,q:"Che ruolo ha il moderatore in un reattore nucleare?",o:["Rallentare i neutroni perché possano provocare la fissione","Assorbire tutti i neutroni","Accelerare i neutroni","Schermare i raggi gamma"],a:0,e:"I neutroni sono efficaci solo se rallentati; il moderatore è di solito acqua pesante. Le barre di cadmio invece li assorbono."},
{id:"fl12_042",t:"fl12",p:"12.3.1",l:1,q:"Che cosa significa la parola «laser»?",o:["Amplificazione della luce per emissione stimolata di radiazione","Luce a bassa energia","Radiazione elettromagnetica casuale","Sorgente di raggi X"],a:0,e:"Light Amplification by Stimulated Emission of Radiation: una radiazione di frequenza precisa ne stimola un'altra uguale."},
{id:"fl12_043",t:"fl12",p:"12.3.1",l:2,q:"Nel laser, a che cosa serve lo specchio semiriflettente?",o:["A far uscire una parte della radiazione, monocromatica e unidirezionale","A eccitare gli atomi","A cambiare la frequenza","A raffreddare la sostanza attiva"],a:0,e:"La radiazione rimbalza tra due specchi attraversando la sostanza attiva; dallo specchio semiriflettente ne esce una parte."},
{id:"fl12_044",t:"fl12",p:"12.3.3",l:2,q:"Su quale principio si basa la TAC?",o:["Sull'attenuazione differenziale dei raggi X nei tessuti di diversa densità","Sulla riflessione degli ultrasuoni","Sulla risonanza magnetica","Sull'emissione di positroni"],a:0,e:"I raggi X vengono inviati da molte angolazioni; i tessuti più densi li attenuano di più e appaiono più chiari."}
];

bl1:{
 sum:["I **viventi** sono formati da cellule (tranne i virus), crescono, si riproducono, regolano il metabolismo (**omeostasi**), rispondono agli stimoli, hanno informazione genetica ed evolvono. Sono organizzati per livelli (cellula → tessuto → organo → organismo → popolazione → comunità → ecosistema → biosfera) con **proprietà emergenti**.", "**Origine**: fossili di 3,5-3,8 miliardi di anni; prime cellule anaerobie; **stromatoliti** e fotosintesi precoce; l'ossigeno porta ozono e metabolismo aerobico. **Endosimbiosi**: mitocondri e cloroplasti derivano da procarioti inglobati. **3 domini, 6 regni**: Archeobatteri, Eubatteri, Protisti, Funghi, Piante, Animali.", "**Darwin** (1859): variabilità ereditabile, lotta per l'esistenza, **selezione naturale**, nuove specie; l'ambiente seleziona, non crea. Il **neodarwinismo** aggiunge mutazione e ricombinazione. Selezione stabilizzatrice, **direzionale** (Biston betularia), divergente; selezione sessuale; adattamenti morfologici, fisiologici, comportamentali.", "**Biomolecole**: O, C, H, N (+ P, S = 99%); polimeri per **condensazione**, scissi per **idrolisi**. Cellula batterica: 70% acqua, 26% macromolecole. **Legami deboli** (< 1/20 del covalente) danno forma e flessibilità. Acqua: 60% dell'adulto, densità massima a 4 °C.", "**Carboidrati** Cₙ(H₂O)ₘ (-osio): mono-, di-, oligo- (3-10), polisaccaridi. **Proteine**: α-amminoacidi (glicina non chirale, 10 essenziali), fibrose o globulari, semplici o coniugate (gruppo prostetico), molte funzioni; **motivi** e **domini** (zinc finger). Regolazione: allosterica, fosforilazione (chinasi/fosfatasi), proteine G (GTP attive), ubiquitina-proteasoma, compartimenti, complessi. **Lipidi** insolubili in acqua. **Acidi nucleici**: A–T 2 legami H, G–C 3; RNA a singolo filamento con uracile.", "**Teoria cellulare** (Hooke 1665; Schleiden, Schwann, Virchow): ogni cellula da un'altra cellula. **Procarioti** (0,5-5 µm): nucleoide, DNA circolare, plasmidi, ribosomi piccoli, mesosomi, parete di **peptidoglicano**, flagelli, pili. **Eucarioti** (10-100 µm): nucleo, organelli, cromosomi lineari. Tutte le cellule condividono ATP, DNA, glicolisi.", "**Membrana**: doppio strato fosfolipidico con proteine e colesterolo, semipermeabile. Trasporto **passivo** (diffusione semplice di O₂, CO₂, acqua; **osmosi**; diffusione facilitata con canali e carrier) e **attivo** (pompe: **Na⁺/K⁺** 3 fuori e 2 dentro; tipo V per H⁺). **Potenziale di riposo −70 mV**; potenziale d'azione: entra Na⁺, esce K⁺. **Vescicole**: endocitosi (fagocitosi, pinocitosi, mediata da recettori), esocitosi; COPII dal RE al Golgi.", "**Organelli**: **nucleo** (doppia membrana con pori, nucleolo), **ribosomi** (sintesi proteica), **RE rugoso** (proteine) e **liscio** (lipidi, detossificazione), **Golgi** (modifica e smista), **lisosomi** (idrolasi, pH 5, autofagia), **perossisomi** (H₂O₂ e catalasi), **mitocondri** (doppia membrana, creste, DNA proprio, eredità materna), **citoscheletro** (microtubuli, filamenti intermedi, microfilamenti; centrioli 9×3). Comunicazione con messaggeri e recettori o giunzioni."],
 ex:[{"t": "Biston betularia", "d": "Con le fuliggini industriali i tronchi si scuriscono: le farfalle scure (allele dominante) sfuggono meglio agli uccelli e passano dal 20% a quasi il 100% in 50 anni. È selezione direzionale."}, {"t": "Globulo rosso e osmosi", "d": "In soluzione ipotonica entra acqua e la cellula si gonfia fino a lisarsi; in ipertonica perde acqua e raggrinzisce; nella fisiologica (NaCl 0,9%) resta uguale."}, {"t": "Viaggio di una proteina secreta", "d": "Ribosomi sul RE rugoso → lume del RE → vescicole COPII → Golgi (cis → trans, glicosilazione) → vescicole di secrezione → esocitosi."}],
 map:{"centro": "Biologia cellulare", "rami": [{"t": "Viventi", "figli": ["Caratteristiche e livelli", "Domini e regni"]}, {"t": "Evoluzione", "figli": ["Darwin", "Tipi di selezione"]}, {"t": "Biomolecole", "figli": ["Proteine e regolazione", "Acidi nucleici"]}, {"t": "Cellula", "figli": ["Procariote", "Eucariote"]}, {"t": "Membrana", "figli": ["Trasporti", "Potenziale −70 mV"]}, {"t": "Organelli", "figli": ["RE, Golgi, lisosomi", "Mitocondri, citoscheletro"]}]}},
bl2:{
 sum:["**Catabolismo**: degradazione con liberazione di energia (esoergonico); **anabolismo**: sintesi che consuma energia (endoergonico). L'**ATP** li collega.", "**Enzimi**: catalizzatori biologici (-asi) che abbassano l'energia di attivazione senza consumarsi; **sito attivo**, substrato; cofattori e coenzimi; dipendono da temperatura e pH. **Inibizione competitiva** (si supera con più substrato) e **non competitiva**; **enzimi allosterici** e **retroinibizione**. 6 classi EC: ossidoreduttasi, transferasi, idrolasi, liasi, isomerasi, ligasi.", "**Ossidoriduzioni**: chi si ossida perde elettroni (e H), chi si riduce li acquista. Trasportatori: **ATP** (adenosina + 3 fosfati, legami ad alta energia), **NADH**, **FADH₂** (verso la catena respiratoria), **NADPH** (biosintesi, fase luminosa).", "**Glicolisi** (Embden-Meyerhof, citoplasma, anaerobica): glucosio → 2 piruvati + 2 ATP netti + 2 NADH. **Respirazione** (mitocondri): piruvato → acetil-CoA + CO₂; **ciclo di Krebs** (per giro 3 NADH, 1 FADH₂, 1 ATP, 2 CO₂); **catena respiratoria** con O₂ accettore finale e ATP sintasi. Resa teorica **38 ATP**, reale **30-32**.", "**Fonti alternative**: priorità carboidrati, lipidi, proteine. Trigliceridi → glicerolo + acidi grassi; **β-ossidazione** → acetil-CoA, NADH, FADH₂. Amminoacidi deamminati entrano in glicolisi o Krebs.", "**Fermentazione** (senza O₂, citoplasma): il piruvato è ridotto dal NADH per rigenerare NAD⁺; **lattica** (muscoli) o **alcolica** (lieviti: etanolo + CO₂); solo 2 ATP.", "**Autotrofi** (produttori): **fotoautotrofi** (luce) e **chemioautotrofi** (ossidazione di sostanze inorganiche); **eterotrofi** (consumatori). **Fotosintesi**: fase luminosa nei tilacoidi (fotolisi dell'acqua, O₂, ATP, NADPH) e **ciclo di Calvin** nello stroma (RuBisCO fissa la CO₂): 6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂."],
 ex:[{"t": "Bilancio della glicolisi", "d": "C₆H₁₂O₆ + 2 NAD⁺ + 2 ADP + 2 Pᵢ → 2 piruvato + 2 NADH + 2 ATP + 2 H₂O: si spendono 2 ATP e se ne producono 4."}, {"t": "Bilancio di un glucosio", "d": "2 piruvati → 2 acetil-CoA → 2 giri di Krebs: in tutto 10 NADH e 2 FADH₂ che, con i pochi ATP diretti, danno circa 38 ATP teorici (30-32 reali)."}, {"t": "Sforzo muscolare", "d": "Con poco ossigeno il muscolo riduce il piruvato a lattato per rigenerare NAD⁺: continua la glicolisi ma si ottengono solo 2 ATP per glucosio."}],
 map:{"centro": "Metabolismo cellulare", "rami": [{"t": "Enzimi", "figli": ["Sito attivo, inibizione", "6 classi"]}, {"t": "Trasportatori", "figli": ["ATP", "NADH, FADH₂, NADPH"]}, {"t": "Glucosio", "figli": ["Glicolisi", "Krebs e catena respiratoria"]}, {"t": "Alternative", "figli": ["β-ossidazione", "Fermentazione"]}, {"t": "Autotrofi", "figli": ["Fotosintesi", "Chemiosintesi"]}]}},
bl3:{
 sum:["**Procarioti**: un DNA circolare ancorato alla membrana; si dividono per **scissione binaria**.", "**Ciclo eucariotico**: interfase (**G1** crescita, **S** replicazione del DNA, **G2** preparazione) + fase M (mitosi + citodieresi); **G0** = fuori dal ciclo (neuroni, globuli rossi). Controllo: **Cdk** attivate dalle **cicline**, checkpoint (p53).", "**Mitosi**: profase (condensazione, si disgrega l'involucro, si forma il fuso), metafase (piastra equatoriale), anafase (separazione dei cromatidi fratelli), telofase (riformazione dei nuclei); citodieresi con solco (animali) o piastra (vegetali). Base della **riproduzione asessuata** (cloni, nessuna variabilità).", "**Riproduzione sessuata**: gameti aploidi (n) → **zigote** diploide (2n); uomo 2n = 46, n = 23; cromosomi **omologhi** (uno materno, uno paterno).", "**Meiosi**: da una cellula 2n quattro cellule n; DNA replicato solo prima della meiosi I. **Meiosi I** separa gli omologhi (profase I: sinapsi, tetradi, **crossing-over** ai chiasmi), **meiosi II** separa i cromatidi. Variabilità: crossing-over e assortimento indipendente (2²³ combinazioni).", "**Apoptosi**: morte programmata (dita dell'embrione), diversa dalla necrosi. **Mutazioni cromosomiche** (delezione, duplicazione, inversione, traslocazione) e **genomiche** (aneuploidie per non disgiunzione; poliploidie). Down (trisomia 21), Edwards (18), Patau (13), Turner (45,X0), Klinefelter (47,XXY).", "**Gametogenesi** nelle gonadi. **Spermatogenesi**: spermatogonio → spermatocita I (2n) → spermatociti II (n) → 4 spermatidi → spermatozoi. **Ovogenesi**: ovogonio → ovocita I → ovocita II + globulo polare; una sola cellula uovo; la meiosi II si completa dopo la fecondazione."],
 ex:[{"t": "Contare il DNA", "d": "G1: 10 pg (2n). Dopo S, in G2: 20 pg. Dopo la mitosi ogni figlia ha 10 pg. Dopo la meiosi I ogni cellula ha 10 pg ma n cromosomi doppi; dopo la meiosi II, 5 pg."}, {"t": "Cromosomi in meiosi", "d": "2n = 8: dopo la meiosi I 4 cromosomi da 2 cromatidi (8 cromatidi); dopo la meiosi II 4 cromosomi da 1 cromatidio."}, {"t": "Non disgiunzione", "d": "Se in meiosi I i due cromosomi 21 non si separano, un gamete ne ha due: con la fecondazione nasce uno zigote con trisomia 21."}],
 map:{"centro": "Ciclo cellulare", "rami": [{"t": "Ciclo", "figli": ["G1, S, G2, M", "Cicline e Cdk"]}, {"t": "Mitosi", "figli": ["4 fasi", "Riproduzione asessuata"]}, {"t": "Meiosi", "figli": ["Meiosi I e II", "Crossing-over"]}, {"t": "Errori", "figli": ["Mutazioni cromosomiche", "Aneuploidie"]}, {"t": "Gameti", "figli": ["Spermatogenesi", "Ovogenesi"]}]}},
bl4:{
 sum:["**DNA materiale genetico**: Griffith (principio trasformante), Avery-MacLeod-McCarty, Hershey e Chase (³²P entra, ³⁵S no). **Struttura** (Watson e Crick, 1953): doppia elica di filamenti **antiparalleli**; A–T e G–C (**Chargaff**: A = T, G = C).", "**Cromosoma eucariote**: cromatina = DNA + istoni; **nucleosomi**; eucromatina (attiva) ed eterocromatina (condensata); centromero e **telomeri**.", "**Replicazione semiconservativa** (Meselson-Stahl): elicasi apre, primasi fa il primer di RNA, **DNA polimerasi** sintetizza 5'→3' (filamento continuo e discontinuo con **frammenti di Okazaki**), ligasi unisce. Correzione: proofreading 3'→5' e sistemi di riparo (escissione, dimeri di timina).", "**Un gene - un enzima** (Beadle e Tatum, Neurospora) → un gene - un polipeptide. **Dogma centrale** DNA → RNA → proteina. RNA: ribosio, singolo filamento, uracile; **mRNA**, **tRNA** (anticodone), **rRNA** (ribosomi).", "**Trascrizione**: l'RNA polimerasi si lega al promotore e copia il filamento stampo; negli eucarioti cappuccio 5', coda poli-A e **splicing** (via gli introni). **Codice genetico**: triplette, 64 codoni, ridondante, quasi universale; AUG inizio, UAA/UAG/UGA stop.", "**Traduzione** sui ribosomi: inizio, allungamento, terminazione (fattore di rilascio). **Chaperon**: aiutano il ripiegamento, evitano aggregati.", "**Mutazioni geniche**: sostituzioni (silenti, missenso come l'anemia falciforme, non senso) e inserzioni/delezioni (**frameshift**). **Mutageni** fisici (UV, raggi X, radiazioni) e chimici.", "**Virus**: acido nucleico + capside (± envelope), parassiti obbligati, specifici per i recettori; retrovirus (trascrittasi inversa). Batteriofagi: ciclo **litico** e **lisogenico** (profago). **Batteri**: scissione binaria + trasformazione, **trasduzione** (fagi), **coniugazione** (plasmide F, pilo). **Operone** (Jacob e Monod): promotore, operatore, geni strutturali; lac inducibile, trp reprimibile."],
 ex:[{"t": "Dallo stampo alla proteina", "d": "DNA stampo 3'-TAC GGA-5' → mRNA 5'-AUG CCU-3' → Met-Pro."}, {"t": "Chargaff", "d": "DNA con 30% di G: anche C = 30%, quindi A + T = 40% e A = T = 20%."}, {"t": "Operone lac", "d": "Senza lattosio il repressore sta sull'operatore e i geni sono spenti; con il lattosio il repressore si stacca e l'RNA polimerasi trascrive i geni per digerirlo."}],
 map:{"centro": "Genetica molecolare", "rami": [{"t": "DNA", "figli": ["Doppia elica, Chargaff", "Cromatina"]}, {"t": "Replicazione", "figli": ["Semiconservativa", "Okazaki, riparo"]}, {"t": "Espressione", "figli": ["Trascrizione, splicing", "Codice e traduzione"]}, {"t": "Mutazioni", "figli": ["Puntiformi, frameshift", "Mutageni"]}, {"t": "Microrganismi", "figli": ["Virus, fagi", "Batteri, operone"]}]}},
bl5:{
 sum:["**Mendel** (pisello, 1854-1864): linee pure, incroci controllati, analisi numerica. **Monoibrido**: F1 uniforme (dominanza), F2 **3 : 1** (genotipi 1 : 2 : 1). Leggi: **dominanza**, **segregazione** (gli alleli si separano nei gameti), **assortimento indipendente** (diibrido F2 **9 : 3 : 3 : 1**). **Test-cross** con l'omozigote recessivo per scoprire se un dominante è AA o Aa.", "**Eccezioni**: **dominanza incompleta** (fenotipo intermedio, F2 1 : 2 : 1), **codominanza** (AB), **alleli multipli** (Iᴬ, Iᴮ, i), **pleiotropia** (un gene, più effetti), **epistasi** (un gene ne maschera un altro), **geni concatenati** (stesso cromosoma; ricombinazione ∝ distanza, 1% = 1 cM), **caratteri quantitativi** (poligenici, continui).", "Il **fenotipo** dipende da genotipo e ambiente; **penetranza** (quanti portatori mostrano il carattere) ed **espressività** (quanto intensamente).", "**Teoria cromosomica**: i geni stanno sui cromosomi in un **locus**. Uomo: **XX** femmina, **XY** maschio (decide lo spermatozoo, probabilità 1/2). **Morgan** con Drosophila: caratteri legati all'X. I maschi sono emizigoti e ricevono l'X dalla madre.", "**Malattie legate all'X** recessive: **emofilia**, **daltonismo** (più frequenti nei maschi; madre portatrice → metà dei figli maschi malati). **Autosomiche recessive** (fibrosi cistica, talassemia: Aa × Aa → 1/4 malati) e **dominanti** (Huntington). **Pedigree**: quadrati maschi, cerchi femmine.", "**AB0**: antigeni A e B sui globuli rossi e anticorpi opposti nel plasma; 0 donatore universale, AB ricevente universale. **Rh**: D dominante (Rh⁺), d recessivo; madre Rh⁻ sensibilizzata con feto Rh⁺ → malattia emolitica del neonato."],
 ex:[{"t": "Monoibrido", "d": "YY × yy → F1 tutta Yy (gialla). Yy × Yy → 1 YY : 2 Yy : 1 yy, cioè 3 gialli : 1 verde."}, {"t": "Emofilia", "d": "Madre portatrice XᴴXʰ × padre sano XᴴY: figlie metà portatrici e metà sane; figli maschi metà emofiliaci e metà sani."}, {"t": "Gruppi sanguigni", "d": "Iᴬi × Iᴮi → Iᴬiᴮ (AB), Iᴬi (A), Iᴮi (B), ii (0), ciascuno con probabilità 1/4."}],
 map:{"centro": "Trasmissione dei geni", "rami": [{"t": "Mendel", "figli": ["3 : 1 e 9 : 3 : 3 : 1", "Test-cross"]}, {"t": "Eccezioni", "figli": ["Dominanza incompleta, codominanza", "Epistasi, geni concatenati"]}, {"t": "Cromosomi", "figli": ["XX e XY", "Morgan"]}, {"t": "Malattie", "figli": ["Legate all'X", "Autosomiche"]}, {"t": "Gruppi sanguigni", "figli": ["AB0", "Rh"]}]},
 extra:"punnett"},
bl6:{
 sum:["Negli eucarioti l'espressione genica si regola a più livelli: **conformazione** della cromatina (eucromatina trascritta, eterocromatina no; acetilazione degli istoni, metilazione del DNA), **trascrizione** (fattori di trascrizione, enhancer, silencer), **maturazione dell'RNA** (cappuccio, poli-A, **splicing alternativo**), **traduzione** (proteine inibitrici, microRNA), **modificazioni post-traduzionali**.", "**Epigenetica**: regolazione dell'attività genica senza cambiare la sequenza del DNA.", "**Genoma eucariote**: non più del 2% del DNA umano codifica proteine; il resto (non codificante) contiene introni, sequenze regolatrici e ripetute. **Telomeri**: estremità ripetute che si accorciano a ogni replicazione; la **telomerasi** li allunga (staminali, germinali, tumori).", "**Differenziamento**: tutte le cellule hanno lo stesso DNA ma esprimono geni diversi. **Staminali**: totipotenti (zigote), **pluripotenti** (embrionali), multipotenti, **unipotenti** (adulto); iPS da cellule adulte riprogrammate.", "**Cancro**: accumulo di mutazioni ed eventi epigenetici. **Oncogeni** (da proto-oncogeni, dominanti: Ras, HER2) e **oncosoppressori** (recessivi: **p53**, RB1). Caratteristiche: proliferazione incontrollata, elusione dell'apoptosi, immortalità, **angiogenesi**, invasione e **metastasi**."],
 ex:[{"t": "Un gene, più proteine", "d": "Un gene con 4 esoni può dare mRNA 1-2-3-4, 1-2-4, 1-3-4…: lo splicing alternativo salta esoni ma non ne cambia l'ordine."}, {"t": "I due colpi", "d": "Un oncosoppressore come RB1 smette di funzionare solo quando entrambe le copie sono inattivate; chi ne eredita una mutata ha bisogno di una sola mutazione in più."}, {"t": "Telomeri e tumori", "d": "Le cellule normali, accorciando i telomeri, arrivano alla senescenza; molte cellule tumorali riattivano la telomerasi e diventano immortali."}],
 map:{"centro": "Regolazione genica e cancro", "rami": [{"t": "Livelli di controllo", "figli": ["Cromatina, trascrizione", "RNA, traduzione"]}, {"t": "Epigenetica", "figli": ["Metilazione", "Istoni"]}, {"t": "Genoma", "figli": ["2% codificante", "Telomeri"]}, {"t": "Sviluppo", "figli": ["Differenziamento", "Staminali"]}, {"t": "Tumori", "figli": ["Oncogeni, p53", "Metastasi"]}]}},
bl7:{
 sum:["La **segnalazione cellulare** ha tre tappe: **ricezione** (un segnale come ormone, neurotrasmettitore, fattore di crescita o citochina lega un recettore specifico), **trasduzione** (cascata che amplifica il segnale) e **risposta** (espressione genica, proliferazione, metabolismo, sopravvivenza). Rispondono solo le cellule bersaglio.", "**Recettori**: tipo 1 accoppiati a **canali ionici** (ionotropici, sinapsi), tipo 2 accoppiati a **proteine G** (GPCR), tipo 3 ad **attività enzimatica** (tirosina chinasi, es. insulina), tipo 4 **intracellulari** (ormoni steroidei, agiscono da fattori di trascrizione).", "**Trasduzione**: interazioni proteina-proteina e fosforilazioni (**chinasi** e **fosfatasi**); vie ramificate con amplificazione e **cross-talk**.", "**Secondi messaggeri**: **cAMP** (prodotto dall'adenilato ciclasi, degradato dalla fosfodiesterasi, attiva la PKA), **Ca²⁺**, **IP₃** e **DAG** (dalla fosfolipasi C: IP₃ libera Ca²⁺, DAG attiva la PKC). Produzione transitoria e reversibile.", "**Vie fisiologiche**: Notch (destino cellulare), Wnt/β-catenina (proliferazione intestinale), NF-κB (infiammazione). Le alterazioni causano tumori e altre malattie."],
 ex:[{"t": "Adrenalina e glicogeno", "d": "L'adrenalina lega un GPCR sulla cellula del fegato: la proteina G attiva l'adenilato ciclasi, sale il cAMP, la PKA avvia la cascata che demolisce il glicogeno. Una molecola di ormone mobilita migliaia di glucosi."}, {"t": "Ormone steroideo", "d": "Il cortisolo attraversa la membrana, lega un recettore intracellulare e il complesso entra nel nucleo regolando la trascrizione di geni bersaglio."}],
 map:{"centro": "Segnalazione cellulare", "rami": [{"t": "Tappe", "figli": ["Ricezione", "Trasduzione, risposta"]}, {"t": "Recettori", "figli": ["Canali ionici, GPCR", "Enzimatici, intracellulari"]}, {"t": "Secondi messaggeri", "figli": ["cAMP, PKA", "Ca²⁺, IP₃, DAG"]}, {"t": "Vie", "figli": ["Notch, Wnt", "NF-κB"]}]}},
bl8:{
 sum:["**Microscopia**: il **potere risolutivo** è la distanza minima tra due punti distinti. Microscopio ottico (circa 0,2 µm), **TEM** (elettroni che attraversano il campione, circa 0,2 nm), **SEM** (elettroni riflessi, immagini 3D, circa 10 nm).", "**Organuli**: si rompono le cellule e si separano con la **centrifugazione differenziale** (prima i nuclei, poi mitocondri, poi microsomi e ribosomi).", "**Analisi molecolari**: estrazione (lisi) e purificazione; **elettroforesi** (il DNA, negativo, migra verso il polo + e i frammenti piccoli corrono di più). **Enzimi di restrizione** (batterici, siti di 4-8 bp, estremità adesive). **Sequenziamento Sanger** (dideossinucleotidi). **Omiche**: genomica, trascrittomica, proteomica, metabolomica.", "**PCR**: amplifica un tratto di DNA noto; cicli di denaturazione (~95 °C), appaiamento dei primer, estensione con la **Taq polimerasi**; copie = 2ⁿ. **Ibridazione** con sonde complementari. **Clonaggio**: gene + plasmide tagliati dallo stesso enzima, uniti dalla ligasi, inseriti nei batteri (DNA ricombinante).", "**Genome editing** con **CRISPR/Cas9** (difesa batterica contro i virus, guidata da un RNA). **Blotting**: **Southern** (DNA), **Northern** (RNA), **Western** (proteine con anticorpi). **Silenziamento genico** (siRNA). Applicazioni: insulina ricombinante, OGM, terapia genica.", "**Organismi modello**: semplici, economici, ciclo breve, caratteri distinguibili. Procariote: **E. coli**; eucarioti: **lievito** (ciclo cellulare), Drosophila, C. elegans, topo, pesce zebra, Arabidopsis."],
 ex:[{"t": "Potenza della PCR", "d": "Da una sola molecola: dopo 10 cicli 2¹⁰ ≈ 1000 copie, dopo 30 cicli circa un miliardo."}, {"t": "Tagli in un plasmide", "d": "Un enzima con 3 siti taglia un plasmide circolare in 3 frammenti; lo stesso numero di siti su un DNA lineare darebbe 4 frammenti."}, {"t": "Quale blot?", "d": "Il gene c'è? Southern. Viene trascritto? Northern. La proteina è prodotta? Western."}],
 map:{"centro": "Tecniche di laboratorio", "rami": [{"t": "Microscopia", "figli": ["Ottico", "TEM e SEM"]}, {"t": "Separazione", "figli": ["Centrifugazione", "Elettroforesi"]}, {"t": "DNA", "figli": ["Restrizione, PCR", "Sequenziamento"]}, {"t": "Ingegneria genetica", "figli": ["Clonaggio", "CRISPR/Cas9"]}, {"t": "Modelli", "figli": ["E. coli", "Lievito, Drosophila"]}]}},
fl1:{
 sum:["Una grandezza è **scalare** se basta un numero (con l'unità di misura): tempo, massa, temperatura, densità, lavoro, frequenza, carica elettrica.","Le **7 grandezze fondamentali** sono lunghezza [L], massa [M], tempo [T], intensità di corrente [i], temperatura [K], intensità luminosa e quantità di sostanza. Tutte le altre sono **derivate**.","Analisi dimensionale: i numeri puri e gli angoli non hanno dimensioni; si possono sommare solo grandezze **omogenee**; i due membri di un'equazione hanno le stesse dimensioni.","**SI**: metro, chilogrammo, secondo, ampere, kelvin, candela, mole. Per la sola meccanica si parla di sistema **MKS**; l'altro sistema importante è il **CGS** (cm, g, s).","Notazione scientifica: a · 10ᵇ con una sola cifra diversa da zero prima della virgola. **Ordine di grandezza**: b se |a| < 5, b + 1 se |a| ≥ 5.","Un **vettore** ha modulo, direzione e verso. Si somma con la regola del parallelogramma: |v|² = v₁² + v₂² + 2v₁v₂cos α. La differenza è la somma con l'opposto.","**Prodotto scalare** a·b = ab cos θ (è un numero, commutativo). **Prodotto vettoriale** |a∧b| = ab sen θ, perpendicolare al piano di a e b, verso con la regola della mano destra (anticommutativo).","Errori **sistematici** (sempre nello stesso verso, difficili da scoprire) e **accidentali** (casuali, si riducono facendo la media). Errore assoluto = (xmax − xmin)/2, relativo = e/M, percentuale = relativo × 100.","Propagazione: su somme e differenze si sommano gli **errori assoluti**; su prodotti e quozienti si sommano gli **errori relativi (percentuali)**."],
 ex:[{"t":"Somma di vettori perpendicolari","d":"Due forze di 3 N e 4 N perpendicolari: per Pitagora la risultante vale √(9 + 16) = 5 N."},{"t":"Ordine di grandezza","d":"562,5 = 5,625 · 10²: poiché 5,625 ≥ 5, l'ODG è 2 + 1 = 3. Invece 0,0025 = 2,5 · 10⁻³ ha ODG −3."},{"t":"Errore sull'area di un quadrato","d":"Lato L = (10 ± 2) cm: errore relativo 0,2. L'area A = L² = 100 cm² ha errore relativo 0,2 + 0,2 = 0,4, quindi errore assoluto 0,4 · 100 = 40 cm²."}],
 map:{"centro":"Scalari e vettori","rami":[{"t":"Grandezze scalari","figli":["7 fondamentali","Derivate e dimensioni"]},{"t":"Unità di misura","figli":["SI e CGS","Prefissi, ODG"]},{"t":"Vettori","figli":["Somma e scomposizione","Prodotto scalare e vettoriale"]},{"t":"Errori di misura","figli":["Sistematici e accidentali","Assoluto, relativo, %"]}]}},
fl2:{
 sum:["La **cinematica** descrive il moto senza occuparsi delle cause; la statica studia l'equilibrio, la dinamica le forze.","Un corpo si può trattare come **punto materiale** quando le sue dimensioni sono piccole rispetto agli spostamenti. Quiete e moto hanno senso solo rispetto a un **sistema di riferimento**.","Spostamento Δs = s₂ − s₁ (vettore). **Velocità media** v = Δs/Δt (vettore parallelo a Δs). Velocità istantanea = limite per Δt → 0 (derivata dello spazio).","Da km/h a m/s si **divide per 3,6**; da m/s a km/h si moltiplica per 3,6. La velocità media **non** è la media delle velocità.","**Accelerazione** a = Δv/Δt (m/s²). C'è accelerazione anche se il modulo della velocità è costante, quando cambia la direzione (traiettoria curva).","**MRU**: s = s₀ + v·t; grafico s-t retta con pendenza v, grafico v-t retta orizzontale.","**Moto uniformemente accelerato**: v = v₀ + a·t; s = s₀ + v₀t + ½at²; grafico s-t parabola, v-t retta con pendenza a.","**Caduta libera**: a = g = 9,8 m/s², non dipende da massa o forma. Da fermo: t = √(2h/g), v = √(2gh). Lancio in alto: hmax = v²/(2g), tsalita = v/g.","**Moto circolare uniforme**: T periodo, f = 1/T (Hz), v = 2πr/T, ω = 2π/T = 2πf, v = ω·r, accelerazione centripeta aₙ = v²/r = ω²r verso il centro.","**Moto armonico**: proiezione di un moto circolare uniforme su un diametro; x(t) = A sen(ωt + φ). Velocità massima al centro, nulla agli estremi; accelerazione massima agli estremi.","**Moti composti**: velocità assoluta = relativa + trascinamento (somma vettoriale). Moto parabolico: orizzontale uniforme, verticale uniformemente accelerato."],
 ex:[{"t":"Velocità media di un camion","d":"200 km/h per 0,5 h (100 km), 150 km/h per 1 h (150 km), 50 km/h per 2 h (100 km): 350 km in 3,5 h, quindi 100 km/h (non 133 km/h, che sarebbe la media delle velocità)."},{"t":"Lancio verso l'alto","d":"v₀ = 9,8 m/s: hmax = v²/2g = 96,04/19,6 = 4,9 m; tempo di salita v/g = 1 s; tempo per ricadere = ancora 1 s."},{"t":"La barca nel fiume","d":"Fiume largo 50 m, barca a 5 m/s perpendicolare alla corrente di 10 m/s: attraversa in 10 s e intanto è trascinata a valle di 10 · 10 = 100 m."}],
 map:{"centro":"Cinematica","rami":[{"t":"Grandezze","figli":["Spostamento","Velocità e accelerazione"]},{"t":"Moti rettilinei","figli":["Uniforme: s = vt","Accelerato: s = ½at²"]},{"t":"Caduta libera","figli":["g = 9,8 m/s²","Non dipende dalla massa"]},{"t":"Moti periodici","figli":["Circolare uniforme","Armonico"]},{"t":"Moti composti","figli":["Velocità relative","Moto parabolico"]}]}},
fl3:{
 sum:["**Relatività galileiana**: le leggi della fisica sono le stesse in tutti i sistemi in moto rettilineo uniforme gli uni rispetto agli altri. Un sistema è **inerziale** se vale il principio d'inerzia; la Terra lo è solo in buona approssimazione.","**1ª legge (inerzia)**: con risultante nulla un corpo resta fermo o in moto rettilineo uniforme. **2ª legge**: F = m·a (relazione vettoriale, m = massa inerziale). **3ª legge**: F₁₂ = −F₂₁, forze applicate a corpi diversi.","Newton: 1 N = 1 kg·m/s² = 10⁵ dyn. Si misura con il dinamometro. Nei sistemi non inerziali compaiono **forze apparenti** (es. forza centrifuga, opposta alla centripeta F = mv²/r).","**Quantità di moto** p = m·v (kg·m/s). **Impulso**: F·Δt = Δp. In un sistema isolato la quantità di moto totale si conserva (rinculo del fucile).","**Gravitazione**: F = G·m₁m₂/r², G = 6,67·10⁻¹¹ N·m²/kg², sempre attrattiva. Raddoppiando r la forza diventa ¼. Massa inerziale e gravitazionale hanno lo stesso valore.","**Peso** P = m·g (newton, vettore, dipende dal luogo); la massa è scalare e intrinseca. 1 kg-peso = 9,8 N. Sulla Luna il peso è circa 1/6. Velocità di fuga dalla Terra ≈ 11 km/s.","**Densità** ρ = m/V (kg/m³; acqua 1000 kg/m³). **Peso specifico** = P/V = ρ·g (N/m³). Densità e peso specifico relativi sono adimensionali.","**Momento di una forza** τ = r ∧ F, |τ| = F·b (b = braccio); dipende dal polo. **Coppia**: due forze uguali e opposte con risultante nulla ma momento F·b, uguale rispetto a ogni punto.","**Baricentro**: punto in cui si può pensare concentrato il peso; può stare fuori dal corpo (anello). Equilibrio stabile, instabile, indifferente. Corpo rigido in equilibrio: risultante **e** momento risultante nulli.","**Macchine**: vantaggio V = Fr/Fm. Leve: 1ª specie (fulcro in mezzo, forbici), 2ª (resistenza in mezzo, schiaccianoci, sempre vantaggiosa), 3ª (forza motrice in mezzo, braccio umano, sempre svantaggiosa). Equilibrio: Fm·bm = Fr·br.","Carrucola fissa V = 1; carrucola mobile V = 2; paranco con n carrucole mobili V = 2n. Piano inclinato: Fm = Fr·h/l, V = l/h > 1.","**Momento angolare** L = r ∧ p; nel moto circolare L = m·v·r = I·ω con **I = m·r²**. In un sistema isolato L si conserva (pattinatrice).","**Forza elastica** F = −k·x. Periodo molla T = 2π√(m/k); pendolo semplice T = 2π√(l/g), indipendente da massa e ampiezza.","**Attrito radente** F = f·N, parallelo alla superficie e opposto al moto; f statico > f dinamico. L'attrito volvente è minore del radente; nei fluidi dipende da viscosità, forma, dimensioni e velocità."],
 ex:[{"t":"Teorema dell'impulso","d":"5 kg fermi spinti da 90 N per 2 s: F·Δt = 180 N·s = m·v, quindi v = 180/5 = 36 m/s."},{"t":"I pattinatori","d":"Lui 80 kg, lei 60 kg; lei acquista 2 m/s². Forze uguali e opposte: 80·a = 60·2, quindi a = 1,5 m/s²."},{"t":"La pattinatrice in trottola","d":"Dimezzando il momento d'inerzia, per conservare L = I·ω la velocità angolare raddoppia."},{"t":"Peso specifico del benzene","d":"ρ = 879 kg/m³: peso specifico 879 · 9,8 ≈ 8600 N/m³; densità relativa all'acqua 0,879."}],
 map:{"centro":"Dinamica","rami":[{"t":"Leggi di Newton","figli":["Inerzia","F = m·a","Azione e reazione"]},{"t":"Forze","figli":["Gravitazione e peso","Elastica e attrito"]},{"t":"Conservazione","figli":["Quantità di moto","Momento angolare"]},{"t":"Statica","figli":["Momento e coppie","Equilibrio e baricentro","Leve e carrucole"]}]}},
fl4:{
