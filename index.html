{id:'bi_cell_sf8',t:'bi_cell',l:4,q:`Un fattore di trascrizione di grandi dimensioni, sintetizzato su ribosomi liberi nel citoplasma, perde per mutazione la sua sequenza di localizzazione nucleare (NLS), restando per il resto intatto. Dove si troverà prevalentemente?`,o:[`Nel citoplasma, perché non è riconosciuto per l'importazione nucleare`,`Nel nucleo, perché le proteine grandi attraversano comunque i pori per diffusione`,`Nei mitocondri, dove le proteine prive di segnale vengono importate per default`,`Nel reticolo endoplasmatico, dove resta intrappolato dopo la traduzione`],a:0,e:`Le proteine nucleari di grandi dimensioni entrano nel nucleo solo se hanno una NLS riconosciuta dalle importine, e passano attraverso i pori nucleari con trasporto regolato. Senza NLS la proteina rimane nel citosol dove è stata sintetizzata; l'ingresso nei mitocondri o nel RER richiede altri segnali specifici.`},
{id:'bi_cell_sf9',t:'bi_cell',l:4,q:`Un omogenato di fegato viene centrifugato a velocità crescenti. Il primo sedimento, ottenuto a bassa velocità, è ricco di DNA e istoni; il secondo, a velocità maggiore, consuma ossigeno e ossida il succinato. Che cosa contengono, nell'ordine, i due sedimenti?`,o:[`Prima i nuclei, poi i mitocondri`,`Prima i mitocondri, poi i nuclei`,`Prima i nuclei, poi i ribosomi`,`Prima i ribosomi, poi i mitocondri`],a:0,e:`Le particelle più grandi e dense sedimentano a forze centrifughe minori: i nuclei per primi, poi i mitocondri, poi i microsomi e per ultimi i ribosomi. DNA e istoni indicano i nuclei; consumo di O₂ e ossidazione del succinato (respirazione) indicano i mitocondri. Le altre opzioni invertono l'ordine delle dimensioni o attribuiscono la respirazione ai ribosomi.`},
{id:'bi_cell_sf10',t:'bi_cell',l:4,q:`Un batterio si divide per scissione binaria ogni 30 minuti. Partendo da una sola cellula, quante cellule discendenti ci saranno dopo 3 ore, supponendo che nessuna muoia?`,o:[`64`,`32`,`128`,`12`],a:0,e:`In 3 ore ci sono 6 divisioni da 30 minuti, e a ogni divisione il numero di cellule raddoppia: 2⁶ = 64. Trappole tipiche sono contare una divisione in meno (32), una in più (128) o moltiplicare invece di elevare a potenza (12).`},
{id:'bi_memb_sf1',t:'bi_memb',l:4,q:`Una cellula animale ha un'osmolarità interna di 0,3 osmol/L. Viene immersa in una soluzione di CaCl₂ 0,1 mol/L, completamente dissociato in Ca²⁺ e 2 Cl⁻, a cui la membrana è impermeabile. Che cosa accade?`,o:[`Nessuna variazione netta di volume, perché la soluzione è isotonica`,`La cellula si rigonfia, perché la soluzione contiene solo 0,1 mol/L di soluto`,`La cellula si raggrinzisce, perché il Ca²⁺ attira più acqua per la sua doppia carica`,`La cellula si rompe, perché gli ioni entrano per diffusione e richiamano acqua`],a:0,e:`Ogni unità di CaCl₂ libera 3 particelle, quindi l'osmolarità esterna è 0,1 × 3 = 0,3 osmol/L, uguale a quella interna: la soluzione è isotonica e non c'è flusso netto di acqua. Conta il numero di particelle, non la carica; e la membrana è impermeabile agli ioni.`},
{id:'bi_memb_sf2',t:'bi_memb',l:4,q:`La pompa Na⁺/K⁺ trasporta 3 Na⁺ verso l'esterno e 2 K⁺ verso l'interno per ogni molecola di ATP idrolizzata. Dopo l'idrolisi di 100 ATP, quante cariche positive nette sono state spostate verso l'esterno della cellula?`,o:[`100`,`500`,`300`,`200`],a:0,e:`In 100 cicli escono 300 Na⁺ ed entrano 200 K⁺: il bilancio netto è 300 − 200 = 100 cariche positive verso l'esterno (la pompa è elettrogenica). Sommare gli ioni (500) o considerare solo gli ioni uscenti (300) o entranti (200) è l'errore tipico.`},
{id:'bi_memb_sf3',t:'bi_memb',l:4,q:`Nella fibrosi polmonare la parete tra alveolo e capillare si ispessisce. Perché questo riduce lo scambio di O₂ per diffusione semplice?`,o:[`La diffusione rallenta quando aumenta lo spessore della barriera da attraversare`,`L'O₂ passa solo per trasporto attivo, che diventa insufficiente con la fibrosi`,`L'O₂ è polare e passa solo attraverso canali, che diminuiscono con la fibrosi`,`Il gradiente di O₂ si inverte e il gas tende a lasciare il sangue per tornare nell'alveolo`],a:0,e:`Per la legge di Fick, a parità di gradiente e di superficie, la velocità di diffusione diminuisce all'aumentare dello spessore della barriera. L'O₂ è apolare, attraversa il doppio strato senza proteine e non usa trasporto attivo; il gradiente tra alveolo e sangue non si inverte.`},
{id:'bi_memb_sf4',t:'bi_memb',l:4,q:`In una cellula si misura l'ingresso di due sostanze al crescere della loro concentrazione esterna. Per X la velocità cresce linearmente senza limite; per Y cresce e poi raggiunge un plateau. Quale interpretazione è più corretta?`,o:[`X entra per diffusione semplice, Y tramite trasportatori limitati che si saturano`,`X entra tramite trasportatori che si saturano, Y per diffusione semplice nel doppio strato`,`Entrambe entrano per trasporto attivo, ma Y consuma più ATP di X`,`Entrambe entrano per diffusione semplice, ma Y ha un coefficiente di diffusione minore`],a:0,e:`Nella diffusione semplice la velocità è proporzionale al gradiente di concentrazione e non satura. Un plateau indica invece proteine trasportatrici in numero finito, tutte occupate alle concentrazioni elevate. Un coefficiente di diffusione minore cambierebbe solo la pendenza, non produrrebbe un plateau.`},
{id:'bi_memb_sf5',t:'bi_memb',l:4,q:`Si aggiunge cianuro (che blocca la produzione mitocondriale di ATP) a cellule che accumulano due sostanze, X e Y. L'accumulo di X contro gradiente si arresta, mentre l'ingresso di Y secondo gradiente continua invariato. Che cosa si deduce?`,o:[`X richiede energia metabolica (trasporto attivo), mentre Y non la richiede`,`X passa per diffusione facilitata, mentre Y è trasportata attivamente`,`X passa per osmosi attraverso acquaporine, mentre Y entra per endocitosi`,`X e Y usano la stessa via, ma il cianuro blocca solo il trasportatore di X`],a:0,e:`Il trasporto contro gradiente richiede energia, che dipende direttamente dall'ATP o da un gradiente da questo mantenuto; l'ingresso secondo gradiente (diffusione semplice o facilitata) no. Quindi X è trasportata attivamente e Y no. L'inversione delle due vie e il riferimento a osmosi/endocitosi non rispettano i dati.`},
{id:'bi_memb_sf6',t:'bi_memb',l:4,q:`Un farmaco come l'ouabaina inibisce la pompa Na⁺/K⁺ delle cellule dell'epitelio intestinale. Quale effetto a catena è atteso sull'assorbimento di glucosio tramite il cotrasporto Na⁺-glucosio (SGLT)?`,o:[`Si riduce, perché il gradiente di Na⁺ che guida il cotrasporto si dissipa`,`Aumenta, perché più Na⁺ intracellulare spinge il glucosio verso l'interno`,`Resta invariato, perché il cotrasporto consuma direttamente ATP e non il gradiente di Na⁺`,`Si azzera subito, perché l'ouabaina blocca direttamente il trasportatore SGLT`],a:0,e:`Il SGLT è un trasporto attivo secondario: sfrutta il gradiente di Na⁺ creato dalla pompa Na⁺/K⁺. Bloccando la pompa, il Na⁺ si accumula all'interno, il gradiente si dissipa e il glucosio entra meno. Il cotrasporto non usa ATP direttamente e l'effetto non è immediato né diretto sul SGLT.`},
{id:'bi_memb_sf7',t:'bi_memb',l:4,q:`Nella fibrosi cistica il canale CFTR per il Cl⁻ è difettoso nelle cellule epiteliali delle vie aeree. Perché il muco diventa denso e poco fluido?`,o:[`Esce meno Cl⁻ nel lume e meno acqua lo segue per osmosi, quindi il muco si disidrata`,`Il Cl⁻ si accumula nel lume e richiama troppa acqua, rendendo il muco troppo diluito`,`Il difetto blocca la pompa Na⁺/K⁺ e la mancanza di ATP rende il muco più viscoso`,`Le cellule non riescono a secernere il muco per esocitosi, che quindi si addensa dentro di esse`],a:0,e:`Il Cl⁻ secreto nel lume delle vie aeree trascina con sé acqua per osmosi, mantenendo idratato il muco. Se il canale è difettoso, la secrezione di Cl⁻ cala, la superficie delle vie aeree si disidrata e il muco diventa denso. Il difetto riguarda un canale ionico, non la pompa Na⁺/K⁺ né l'esocitosi del muco.`},
{id:'bi_memb_sf8',t:'bi_memb',l:4,q:`Una cellula vegetale posta in una soluzione molto ipertonica va incontro a plasmolisi: il protoplasto si stacca dalla parete. Che cosa riempie lo spazio tra parete e membrana plasmatica?`,o:[`La soluzione ipertonica esterna, perché la parete lascia passare acqua e soluti`,`Acqua pura uscita dal vacuolo, perché la membrana trattiene i soluti`,`Aria penetrata dall'esterno, perché la parete cellulare è impermeabile ai liquidi`,`Citoplasma fuoriuscito attraverso piccole lacerazioni della membrana plasmatica`],a:0,e:`La parete cellulare è una struttura porosa e permeabile; la selettività appartiene alla membrana plasmatica. Quando il protoplasto perde acqua e si ritira, lo spazio che si crea tra membrana e parete viene occupato dalla soluzione esterna. Non è acqua pura, né aria, né citoplasma.`},
{id:'bi_memb_sf9',t:'bi_memb',l:4,q:`Nell'ipercolesterolemia familiare i recettori per le LDL del fegato sono assenti o difettosi e il colesterolo LDL resta alto nel sangue. Quale processo cellulare è compromesso?`,o:[`L'endocitosi mediata da recettore, che interiorizza le LDL nelle cellule`,`La diffusione facilitata del colesterolo attraverso canali proteici`,`L'esocitosi delle LDL dalla cellula epatica verso il sangue`,`Il trasporto attivo primario del colesterolo con pompe dipendenti dall'ATP`],a:0,e:`Le LDL sono particelle grandi che entrano nelle cellule legandosi al recettore e venendo inglobate in vescicole (endocitosi mediata da recettore). Se il recettore manca, le LDL non vengono rimosse dal sangue. Il colesterolo non attraversa la membrana con canali o pompe in questo processo e il difetto riguarda l'ingresso, non l'uscita.`},
{id:'bi_memb_sf10',t:'bi_memb',l:4,q:`Dopo un pasto l'insulina aumenta l'ingresso di glucosio nelle cellule muscolari e adipose. Quale meccanismo ne è alla base?`,o:[`La fusione con la membrana plasmatica di vescicole che contengono trasportatori GLUT4`,`L'attivazione della pompa Na⁺/K⁺, che spinge il glucosio dentro contro gradiente`,`L'aumento della permeabilità del doppio strato lipidico, che lascia diffondere il glucosio`,`L'apertura di canali per il Na⁺, che trascina il glucosio con trasporto attivo secondario`],a:0,e:`Il segnale dell'insulina porta all'inserimento nella membrana di vescicole che contengono GLUT4, un trasportatore per diffusione facilitata: aumentando il numero di trasportatori, entra più glucosio secondo gradiente. Il glucosio, polare, non attraversa liberamente il doppio strato e la pompa Na⁺/K⁺ non lo trasporta.`},
{id:'bi_dna_sf1',t:'bi_dna',l:4,q:`Un mRNA maturo eucariotico lungo 1.000 nucleotidi (coda poli-A esclusa) ha una regione 5' non tradotta di 60 nt e una regione 3' non tradotta di 100 nt. Il resto è la regione codificante, che termina con un codone di stop. Quanti amminoacidi ha il polipeptide appena sintetizzato?`,o:[`279`,`280`,`333`,`313`],a:0,e:`La regione codificante è lunga 1.000 − 60 − 100 = 840 nt, cioè 840/3 = 280 codoni. L'ultimo è lo stop, che non codifica nessun amminoacido: restano 279 amminoacidi. Le trappole sono dimenticare lo stop (280), dividere per 3 la lunghezza totale (333) o togliere solo la regione 5' non tradotta (313).`},
{id:'bi_dna_sf2',t:'bi_dna',l:4,q:`Un mRNA ha la sequenza codificante 5'-AUGGCUUGGAAAUAG-3'. Una mutazione puntiforme sostituisce con A la G in terza posizione del codone UGG. Quale peptide viene sintetizzato?`,o:[`Met-Ala, per un codone di stop prematuro (mutazione non senso)`,`Met-Ala-Trp-Lys, invariato (mutazione silente)`,`Met-Ala-Cys-Lys, con un amminoacido diverso (mutazione missenso)`,`Met-Ala seguito da amminoacidi diversi (mutazione frameshift)`],a:0,e:`Il messaggio originale si legge AUG-GCU-UGG-AAA-UAG, cioè Met-Ala-Trp-Lys. Con la sostituzione UGG diventa UGA, che è un codone di stop: la traduzione termina dopo Met-Ala. Una sostituzione di una singola base non sposta la cornice di lettura, quindi non è un frameshift.`},
{id:'bi_dna_sf3',t:'bi_dna',l:4,q:`Batteri cresciuti a lungo in un terreno con ¹⁵N (DNA pesante) sono trasferiti in un terreno con ¹⁴N e lasciati replicare per 3 generazioni. Secondo il modello semiconservativo, quale frazione delle molecole di DNA a doppia elica contiene ancora un filamento ¹⁵N?`,o:[`1/4`,`1/2`,`1/8`,`3/4`],a:0,e:`Dopo 3 generazioni ci sono 8 molecole. I 2 filamenti originali ¹⁵N non vengono mai degradati e finiscono in 2 molecole ibride diverse: 2/8 = 1/4. La frazione 1/2 vale dopo 2 generazioni, mentre 1/8 sarebbe attesa con il modello conservativo (una sola molecola completamente pesante).`},
{id:'bi_dna_sf4',t:'bi_dna',l:4,q:`In una cellula la DNA ligasi è inattiva. Quale conseguenza ha sulla replicazione di una forcella?`,o:[`Il filamento in ritardo resta fatto di frammenti di Okazaki non uniti tra loro`,`Il filamento continuo non può essere sintetizzato perché manca il primer`,`La forcella non si apre perché i due filamenti stampo non vengono separati`,`Le basi vengono incorporate in modo errato perché manca la correzione di bozze`],a:0,e:`La DNA ligasi salda i frammenti di Okazaki sul filamento in ritardo e chiude le interruzioni dopo la rimozione dei primer. Il filamento continuo è sintetizzato in modo ininterrotto; l'apertura della forcella è compito dell'elicasi; la correzione di bozze appartiene alla DNA polimerasi.`},
{id:'bi_dna_sf5',t:'bi_dna',l:4,q:`Cellule eucariote vengono trattate con una bassa concentrazione di α-amanitina, che inibisce selettivamente l'RNA polimerasi II. Quale prodotto della trascrizione risulta soprattutto ridotto?`,o:[`L'mRNA, con calo della sintesi di nuove proteine`,`L'RNA ribosomiale maggiore, cioè 28S, 18S e 5,8S, e quindi i ribosomi`,`I tRNA e l'RNA ribosomiale 5S`,`Il primer di RNA sintetizzato dalla primasi nella replicazione`],a:0,e:`L'RNA polimerasi II trascrive i geni che codificano proteine, quindi la perdita di mRNA riduce la sintesi proteica. I grandi RNA ribosomiali sono prodotti dalla polimerasi I, insensibile alla tossina, i tRNA dalla polimerasi III (inibita solo a concentrazioni più alte) e il primer dalla primasi.`},
{id:'bi_dna_sf6',t:'bi_dna',l:4,q:`Un farmaco inibisce le istone deacetilasi (HDAC). Quale effetto ci si attende a livello della cromatina?`,o:[`Più gruppi acetile sugli istoni, cromatina più aperta e più accessibile alla trascrizione`,`Meno gruppi acetile sugli istoni, cromatina più compatta e geni silenziati`,`Metilazione delle citosine nei promotori, con silenziamento genico`,`Mutazioni nella sequenza dei promotori, con perdita del legame dei fattori di trascrizione`],a:0,e:`Le HDAC rimuovono i gruppi acetile dagli istoni, favorendo una cromatina compatta e meno trascritta. Inibirle porta a un'acetilazione maggiore e a una struttura più aperta. È una modifica epigenetica: non cambia la sequenza del DNA e non è una metilazione del DNA.`},
{id:'bi_dna_sf7',t:'bi_dna',l:4,q:`Nelle cellule di un tumore il promotore di un gene oncosoppressore presenta isole CpG ipermetilate, ma la sequenza del gene è normale. Quale effetto è più probabile?`,o:[`Silenziamento epigenetico: il gene è poco trascritto, pur con sequenza integra`,`Mutazione missenso: la proteina prodotta ha un amminoacido diverso`,`Delezione del gene: manca del tutto il tratto di DNA che lo contiene`,`Amplificazione del gene: più copie nel genoma e quindi maggiore trascrizione`],a:0,e:`La metilazione delle citosine nelle isole CpG dei promotori è una modifica epigenetica associata a ridotta trascrizione senza alterare la sequenza. Il gene oncosoppressore viene quindi spento, con effetto simile a una perdita di funzione. Missenso, delezione e amplificazione sono alterazioni della sequenza o del numero di copie, non presenti qui.`},
{id:'bi_dna_sf8',t:'bi_dna',l:4,q:`Lo stesso gene produce una proteina nel cuore e una versione diversa nel muscolo scheletrico, a partire dallo stesso DNA. Quale meccanismo spiega meglio il fatto?`,o:[`Splicing alternativo dello stesso pre-mRNA, con combinazioni diverse di esoni`,`Mutazioni somatiche diverse nei due tessuti, che cambiano la sequenza del gene`,`Uso di un codice genetico diverso nei due tessuti`,`Replicazione selettiva del gene in uno solo dei due tessuti`],a:0,e:`Nello splicing alternativo lo stesso pre-mRNA può essere processato includendo o escludendo certi esoni, producendo mRNA e proteine diversi nei vari tessuti. Il DNA è lo stesso in tutte le cellule somatiche, il codice genetico è universale e la replicazione non è selettiva per tessuto.`},
{id:'bi_dna_sf9',t:'bi_dna',l:4,q:`Un filamento singolo di DNA contiene il 20% di A, il 30% di T, il 10% di G e il 40% di C. Qual è la percentuale di guanina nel DNA a doppio filamento formato da questo filamento e dal suo complementare?`,o:[`25%`,`10%`,`40%`,`50%`],a:0,e:`Nel filamento complementare le G corrispondono alle C del primo (40%) e viceversa. In totale, la guanina del doppio filamento è (10% + 40%)/2 = 25%, uguale alla citosina. Il 10% e il 40% considerano un solo filamento, mentre il 50% è la somma G + C.`},
{id:'bi_dna_sf10',t:'bi_dna',l:4,q:`L'AZT (zidovudina), usato contro l'HIV, è un analogo nucleosidico che blocca la trascrittasi inversa virale. Quale passaggio del ciclo del virus viene impedito?`,o:[`La sintesi di DNA a doppio filamento a partire dall'RNA virale`,`La traduzione dell'mRNA virale in proteine sui ribosomi della cellula ospite`,`La trascrizione del DNA provirale integrato in nuovo RNA virale`,`La replicazione del DNA cellulare nella fase S del ciclo`],a:0,e:`La trascrittasi inversa converte l'RNA genomico del virus in DNA, passaggio necessario prima dell'integrazione nel genoma ospite. Traduzione e trascrizione del provirus usano invece i macchinari della cellula ospite e non sono il bersaglio dell'AZT.`},
{id:'bi_gen_sf1',t:'bi_gen',l:4,q:`Incrocio AaBb × Aabb, con dominanza completa e geni su cromosomi diversi. Qual è la probabilità che un figlio mostri entrambi i caratteri dominanti?`,o:[`3/8`,`9/16`,`1/4`,`1/2`],a:0,e:`I due geni si considerano separatamente: Aa × Aa dà 3/4 di fenotipo dominante per A; Bb × bb dà 1/2 di fenotipo dominante per B. Essendo indipendenti, 3/4 × 1/2 = 3/8. 9/16 sarebbe la probabilità in un incrocio AaBb × AaBb.`},
{id:'bi_gen_sf2',t:'bi_gen',l:4,q:`Un uomo sano ha un fratello affetto da una malattia autosomica recessiva (genitori sani). Sposa una donna sana, non imparentata, che nella popolazione ha probabilità 1/50 di essere portatrice. Qual è la probabilità che il loro primo figlio sia affetto?`,o:[`1/300`,`1/400`,`1/200`,`1/600`],a:0,e:`Poiché i genitori dell'uomo sono entrambi portatori e lui è sano, la sua probabilità di essere portatore è 2/3 (non 1/2). Il figlio è affetto se entrambi trasmettono l'allele: 2/3 × 1/50 × 1/4 = 1/300. Usare 1/2 dà 1/400, ignorare il rischio dell'uomo dà 1/200.`},
{id:'bi_gen_sf3',t:'bi_gen',l:4,q:`Una donna portatrice di emofilia A (recessiva legata al cromosoma X, XᴴXʰ) ha un figlio con un uomo sano (XᴴY). Qual è la probabilità che il bambino, di sesso non ancora noto, sia emofilico?`,o:[`1/4`,`1/2`,`1/8`,`0`],a:0,e:`I quattro genotipi possibili sono XᴴXᴴ, XᴴXʰ, XᴴY e XʰY, tutti con probabilità 1/4. Solo XʰY è emofilico: 1/4 del totale. La probabilità è 1/2 solo se si sa già che il figlio è maschio; le femmine possono essere al massimo portatrici perché il padre ha XᴴY.`},
{id:'bi_gen_sf4',t:'bi_gen',l:4,q:`Un uomo di gruppo sanguigno A e una donna di gruppo B hanno un figlio di gruppo 0. Qual è la probabilità che il secondo figlio sia di gruppo AB?`,o:[`1/4`,`1/2`,`0`,`3/4`],a:0,e:`Il figlio di gruppo 0 (IᵒIᵒ) ha ricevuto un allele 0 da ciascun genitore, quindi i genitori sono IᴬIᵒ e IᴮIᵒ. L'incrocio dà A, B, AB e 0 ciascuno con probabilità 1/4. AB richiede Iᴬ dal padre e Iᴮ dalla madre: 1/2 × 1/2 = 1/4.`},
{id:'bi_gen_sf5',t:'bi_gen',l:4,q:`Si incrociano piante di bocca di leone a fiori rossi e a fiori bianchi, entrambe di linea pura. Tutta la F1 ha fiori rosa; nella F2 si osservano fiori rossi, rosa e bianchi in rapporto 1 : 2 : 1. Che cosa si deduce?`,o:[`Dominanza incompleta: l'eterozigote ha un fenotipo intermedio`,`Dominanza completa del rosso sul bianco, con il rosa dovuto all'ambiente`,`Codominanza: nell'eterozigote si vedono insieme macchie rosse e macchie bianche`,`Geni associati: i due alleli sono sullo stesso cromosoma e si ereditano insieme`],a:0,e:`Il rapporto fenotipico 1 : 2 : 1 coincide con il rapporto genotipico di un incrocio Aa × Aa: gli eterozigoti si distinguono da entrambi gli omozigoti perché il loro fenotipo è intermedio. Con dominanza completa si avrebbe 3 : 1; con codominanza si vedrebbero entrambi i fenotipi separati, non un colore intermedio.`},
{id:'bi_gen_sf6',t:'bi_gen',l:4,q:`In un incrocio di prova AaBb × aabb si ottengono solo due classi di figli, in rapporto circa 1 : 1: il doppio dominante e il doppio recessivo, e nessun'altra. Quale interpretazione è più probabile?`,o:[`I due geni sono sullo stesso cromosoma, vicini, e si ereditano insieme`,`I due geni assortiscono in modo indipendente, perché il rapporto è 1 : 1`,`Il gene B è epistatico sul gene A e ne maschera completamente l'effetto`,`Entrambi i caratteri mostrano dominanza incompleta negli eterozigoti`],a:0,e:`Con assortimento indipendente un incrocio di prova darebbe quattro classi in rapporto 1 : 1 : 1 : 1. Solo due classi indicano che gli alleli A e B (e a e b) viaggiano insieme perché i geni sono associati e vicini, con ricombinazione quasi assente. Epistasi o dominanza incompleta non spiegano l'assenza delle classi ricombinanti.`},
{id:'bi_gen_sf7',t:'bi_gen',l:4,q:`Per una malattia dominante legata al cromosoma X, un uomo affetto ha figli con una donna sana. Quali figli saranno affetti?`,o:[`Tutte le figlie e nessun figlio maschio`,`Tutti i figli maschi e nessuna figlia`,`Metà delle figlie e metà dei figli maschi`,`Nessun figlio, ma tutte le figlie saranno portatrici sane`],a:0,e:`L'uomo ha un solo cromosoma X, con l'allele dominante, che trasmette a tutte le figlie: poiché è dominante, le figlie sono affette. I figli maschi ricevono dal padre il cromosoma Y, quindi non ereditano l'allele. Le figlie non sono portatrici sane perché l'allele dominante si manifesta.`},
{id:'bi_gen_sf8',t:'bi_gen',l:4,q:`La malattia di Huntington è autosomica dominante a penetranza completa. Una donna non testata ha un padre affetto (eterozigote) e una madre sana. Qual è la probabilità che un suo figlio, avuto con un uomo sano non portatore, erediti l'allele della malattia?`,o:[`1/4`,`1/2`,`1/8`,`3/4`],a:0,e:`La donna ha probabilità 1/2 di aver ereditato l'allele dal padre affetto. Se lo ha, lo trasmette a un figlio con probabilità 1/2: 1/2 × 1/2 = 1/4. Il valore 1/2 è il rischio della donna stessa, non del figlio.`},
{id:'bi_gen_sf9',t:'bi_gen',l:4,q:`Un bambino omozigote per l'allele recessivo della fenilchetonuria viene diagnosticato alla nascita e segue una dieta povera di fenilalanina: non sviluppa il danno neurologico. Che cosa illustra questo caso?`,o:[`Il fenotipo dipende dall'interazione tra genotipo e ambiente`,`Il genotipo del bambino è cambiato per effetto della dieta`,`L'allele recessivo diventa dominante in assenza di fenilalanina`,`La dieta ha corretto la mutazione nel DNA delle sue cellule`],a:0,e:`Il genotipo del bambino resta lo stesso, ma l'ambiente (la quantità di fenilalanina assunta) influenza il fenotipo: senza il substrato che si accumula, il danno non si manifesta. La dieta non modifica il DNA né trasforma un allele recessivo in dominante.`},
{id:'bi_gen_sf10',t:'bi_gen',l:4,q:`Due genitori Aa × Aa hanno tre figli. Qual è la probabilità che esattamente due mostrino il fenotipo dominante e uno quello recessivo?`,o:[`27/64`,`9/64`,`9/16`,`3/8`],a:0,e:`Per ogni figlio, P(dominante) = 3/4 e P(recessivo) = 1/4. Una sequenza specifica, ad esempio dominante-dominante-recessivo, ha probabilità (3/4)² × 1/4 = 9/64. Le sequenze possibili sono 3 (il recessivo può essere il primo, il secondo o il terzo), quindi 3 × 9/64 = 27/64. 9/64 dimentica l'ordine.`},
{id:'bi_ciclo_sf1',t:'bi_ciclo',l:4,q:`Una cellula germinale diploide in G1 contiene 6 pg di DNA nucleare. Quanto DNA contiene ciascuna delle due cellule figlie al termine della meiosi I?`,o:[`6 pg`,`3 pg`,`12 pg`,`24 pg`],a:0,e:`Dopo la fase S la cellula ha 12 pg. La meiosi I separa i cromosomi omologhi (ciascuno con due cromatidi) e dimezza il numero di cromosomi, ma non i cromatidi: ogni cellula figlia ha 12/2 = 6 pg. Solo la meiosi II, che separa i cromatidi fratelli, porta a 3 pg per gamete.`},
{id:'bi_ciclo_sf2',t:'bi_ciclo',l:4,q:`In una specie con 2n = 8, quanti cromosomi e quanti cromatidi ha una cellula in metafase della meiosi II?`,o:[`4 cromosomi e 8 cromatidi`,`8 cromosomi e 16 cromatidi`,`4 cromosomi e 4 cromatidi`,`8 cromosomi e 8 cromatidi`],a:0,e:`Dopo la meiosi I le cellule sono aploidi (n = 4) ma ogni cromosoma è ancora formato da due cromatidi fratelli, che si separano solo in anafase II. In metafase II ci sono quindi 4 cromosomi e 4 × 2 = 8 cromatidi. 8 e 16 sono i valori di una metafase mitotica.`},
{id:'bi_ciclo_sf3',t:'bi_ciclo',l:4,q:`In una coltura asincrona di 2.000 cellule che proliferano con un ciclo di 20 ore, la fase S dura 8 ore. Supponendo che le cellule siano distribuite lungo il ciclo in proporzione alla durata di ogni fase, quante sono in fase S?`,o:[`800`,`400`,`1.200`,`160`],a:0,e:`La frazione di cellule in una fase è uguale al rapporto tra la durata della fase e la durata del ciclo: 8/20 = 40%. Il 40% di 2.000 è 800. 1.200 è il numero di cellule fuori dalla fase S (60%).`},
{id:'bi_ciclo_sf4',t:'bi_ciclo',l:4,q:`Un organismo ha 2n = 6, cioè tre coppie di omologhi, ciascuna formata da un cromosoma ereditato dalla madre e uno dal padre. Trascurando il crossing-over, qual è la probabilità che un suo gamete contenga solo cromosomi ereditati dalla propria madre?`,o:[`1/8`,`1/6`,`1/3`,`1/64`],a:0,e:`Per assortimento indipendente, ogni coppia contribuisce al gamete con il cromosoma materno o paterno con probabilità 1/2 ciascuno. Per tre coppie: (1/2)³ = 1/8. I gameti diversi possibili sono 2³ = 8, e quello con tutti i cromosomi materni è uno di questi.`},
{id:'bi_ciclo_sf5',t:'bi_ciclo',l:4,q:`Una coltura asincrona è analizzata con citometria a flusso, che misura il DNA per cellula: i picchi sono a 2C (G1) e 4C (G2/M). Dopo il trattamento con un farmaco il picco 4C aumenta molto e il picco 2C diminuisce, senza cellule con meno di 2C. Quale interpretazione è più plausibile?`,o:[`Le cellule completano la fase S e si accumulano in G2 o in mitosi`,`Le cellule si bloccano in G1 e non iniziano la replicazione`,`Le cellule entrano in G0 e smettono di replicare il DNA`,`Le cellule vanno in apoptosi, con frammentazione del DNA sotto 2C`],a:0,e:`Un contenuto di 4C indica DNA già replicato e non ancora ripartito tra due cellule figlie, quindi cellule in G2 o M: il farmaco blocca G2/M o la mitosi. Un blocco in G1 o l'ingresso in G0 aumenterebbe il picco 2C, e l'apoptosi darebbe cellule con meno di 2C, che qui non si osservano.`},
{id:'bi_ciclo_sf6',t:'bi_ciclo',l:4,q:`Una cellula in mitosi viene fusa con una cellula in G1. Poco dopo, i cromosomi del nucleo della cellula G1 si condensano prematuramente. Che cosa suggerisce?`,o:[`Il citoplasma mitotico contiene fattori, come ciclina B-CDK1, che promuovono la mitosi`,`Il nucleo della cellula G1 contiene un inibitore della mitosi che viene eliminato`,`La fusione danneggia il DNA e attiva il checkpoint di danno al DNA in G2/M`,`La cellula G1 era già entrata in fase S e stava replicando il proprio DNA`],a:0,e:`Se un nucleo in interfase entra in condensazione cromosomica dopo l'esposizione al citoplasma di una cellula in M, vuol dire che in quel citoplasma sono presenti fattori diffusibili che promuovono la mitosi: il fattore promotore della M è il complesso ciclina B-CDK1. Un danno al DNA bloccherebbe, non anticiperebbe, la mitosi.`},
{id:'bi_ciclo_sf7',t:'bi_ciclo',l:4,q:`Nelle cellule in G1 non stimolate, la proteina Rb lega il fattore di trascrizione E2F. Che cosa ci si aspetta in una cellula con Rb non funzionante?`,o:[`E2F è libero di attivare i geni della fase S anche senza segnali di crescita`,`E2F resta inattivo e la cellula si arresta in G1 anche con segnali di crescita`,`La cellula va in apoptosi perché p53 diventa inattivo`,`Il checkpoint G2/M si blocca e la mitosi non può iniziare`],a:0,e:`Rb è un freno del passaggio G1/S: finché è legata a E2F, i geni necessari alla fase S non si attivano. Se Rb non funziona, E2F è sempre libero e la cellula può entrare in S senza segnali mitogeni (proliferazione incontrollata, come nel retinoblastoma). Il blocco del ciclo sarebbe l'effetto opposto.`},
{id:'bi_ciclo_sf8',t:'bi_ciclo',l:4,q:`Molti chemioterapici bloccano la replicazione del DNA o la mitosi. Perché provocano effetti collaterali come caduta dei capelli e calo dei globuli bianchi?`,o:[`Colpiscono anche cellule sane che si dividono spesso, come bulbi piliferi e midollo osseo`,`Danneggiano i neuroni maturi, che si dividono molto più rapidamente delle cellule tumorali`,`Agiscono soprattutto sulle cellule in G0, abbondanti nei capelli e nel midollo`,`Alterano il DNA di tutte le cellule del corpo, comprese quelle che non si dividono`],a:0,e:`I farmaci che interferiscono con replicazione e mitosi colpiscono tutte le cellule che si dividono spesso, tumorali o no: cellule del bulbo pilifero, del midollo osseo e dell'epitelio intestinale. I neuroni maturi non si dividono e le cellule in G0 sono per definizione quiescenti, quindi poco sensibili.`},
{id:'bi_ciclo_sf9',t:'bi_ciclo',l:4,q:`In una cellula germinale si verifica la non-disgiunzione dei cromatidi fratelli del cromosoma 21 durante la meiosi II, in una sola delle due cellule figlie della meiosi I. Quali gameti si formano?`,o:[`Uno con 24 cromosomi, uno con 22 e due normali con 23`,`Due gameti con 24 cromosomi e due con 22 cromosomi`,`Uno con 22 cromosomi e tre normali con 23 cromosomi`,`Uno con 24 cromosomi e tre normali con 23 cromosomi`],a:0,e:`La meiosi I è regolare e produce due cellule n. In una di esse la meiosi II procede normalmente e dà due gameti con 23 cromosomi. Nell'altra i cromatidi del cromosoma 21 non si separano: un gamete riceve entrambi (24 cromosomi) e l'altro nessuno (22). Due gameti con 24 e due con 22 si avrebbero con una non-disgiunzione degli omologhi in meiosi I.`},
{id:'bi_ciclo_sf10',t:'bi_ciclo',l:4,q:`In metafase un cromosoma ha un cinetocore non legato ai microtubuli del fuso. Che cosa fa il checkpoint del fuso?`,o:[`Impedisce l'anafase inibendo l'APC/C, quindi i cromatidi restano uniti`,`Blocca la citodieresi dopo la separazione dei cromatidi fratelli in anafase`,`Fa ripetere la replicazione del DNA prima di consentire l'anafase`,`Impedisce l'ingresso in mitosi dalla fase G2 finché il DNA non è replicato`],a:0,e:`Un cinetocore non attaccato genera un segnale che inibisce l'APC/C: la securina non viene degradata, la separasi resta inattiva, la coesina tiene uniti i cromatidi e l'anafase non parte finché tutti i cromosomi sono ben legati. Il blocco G2/M agisce prima della mitosi e non riguarda l'attacco al fuso.`},
{id:'bi_biomol_sf1',t:'bi_biomol',l:4,q:`Il glicogeno viene mobilizzato molto più rapidamente di una catena lineare di glucosio di pari massa, come l'amilosio. Quale caratteristica strutturale del glicogeno lo spiega?`,o:[`Le ramificazioni α(1→6) creano molte estremità non riducenti attaccabili in parallelo`,`I legami β(1→4) del glicogeno sono più labili dei legami α dell'amilosio`,`Il glicogeno contiene anche fruttosio, legato al glucosio in modo più labile`,`Le ramificazioni riducono il numero di estremità libere e aumentano la solubilità`],a:0,e:`La glicogeno fosforilasi stacca il glucosio una unità alla volta dalle estremità non riducenti: più ramificazioni significano più estremità e quindi più enzimi che lavorano insieme. Il glicogeno è un polimero di solo glucosio con legami α(1→4) e α(1→6), non contiene fruttosio né legami β. Le ramificazioni aumentano, non riducono, il numero di estremità libere.`},
{id:'bi_biomol_sf2',t:'bi_biomol',l:4,q:`Una persona con deficit di lattasi non digerisce il latte. Quale legame del lattosio non viene scisso e quali unità collega?`,o:[`Il legame β(1→4) tra galattosio e glucosio`,`Il legame α(1→2) tra glucosio e fruttosio`,`Il legame α(1→4) tra due unità di glucosio`,`Il legame β(1→4) tra due unità di glucosio`],a:0,e:`Il lattosio è formato da galattosio e glucosio uniti da un legame β(1→4), che la lattasi intestinale idrolizza. Glucosio-fruttosio con legame α(1→2) è il saccarosio, glucosio-glucosio α(1→4) il maltosio, glucosio-glucosio β(1→4) il cellobiosio.`},
{id:'bi_biomol_sf3',t:'bi_biomol',l:4,q:`Un batterio coltivato a 37 °C viene trasferito a 15 °C. Quale modifica dei lipidi di membrana gli permette di mantenere la fluidità del doppio strato?`,o:[`Aumenta la quota di acidi grassi insaturi con doppi legami cis nei fosfolipidi`,`Aumenta la quota di acidi grassi saturi a catena più lunga nei fosfolipidi`,`Sostituisce parte dei fosfolipidi con trigliceridi nel doppio strato`,`Inserisce più colesterolo, che a bassa temperatura irrigidisce la membrana`],a:0,e:`I doppi legami cis creano pieghe nelle catene e impediscono un impaccamento fitto, mantenendo la membrana fluida al freddo. Catene sature e più lunghe fanno l'opposto, i trigliceridi non formano doppi strati e nelle cellule animali il colesterolo a bassa temperatura ostacola l'impaccamento invece di irrigidire (i batteri in genere non lo hanno).`},
{id:'bi_biomol_sf4',t:'bi_biomol',l:4,q:`L'analisi della composizione di un acido nucleico estratto da un virus dà: adenina 26%, guanina 31%, citosina 20%, uracile 23%. Che cosa si può dedurre?`,o:[`È RNA a singolo filamento: ha uracile e le basi complementari non coincidono`,`È DNA a doppia elica: la quantità di purine è uguale a quella delle pirimidine`,`È RNA a doppio filamento: adenina e uracile, guanina e citosina si appaiano`,`È DNA a singolo filamento: contiene guanina e citosina in buona quantità`],a:0,e:`La presenza di uracile indica RNA. Nei doppi filamenti vale A = U (o T) e G = C, qui invece A ≠ U (26 contro 23) e G ≠ C (31 contro 20); inoltre le purine sono il 57% e le pirimidine il 43%. Le regole di Chargaff non sono rispettate, quindi il filamento è singolo.`},
{id:'bi_biomol_sf5',t:'bi_biomol',l:4,q:`Un frammento di DNA a doppio filamento è lungo 100 coppie di basi e contiene in totale 60 timine (contando entrambi i filamenti). Quanti legami a idrogeno tengono uniti i due filamenti?`,o:[`240`,`300`,`200`,`260`],a:0,e:`Per la complementarità le adenine sono 60, quindi ci sono 60 coppie A-T (2 legami ciascuna) e 40 coppie G-C (3 legami ciascuna): 60×2 + 40×3 = 240. 300 e 200 sono i valori se tutte le coppie fossero G-C o tutte A-T, 260 deriva dallo scambio dei legami tra le due coppie.`},
{id:'bi_biomol_sf6',t:'bi_biomol',l:4,q:`Una soluzione zuccherina è negativa al reattivo di Benedict. Dopo ebollizione con HCl diluito e neutralizzazione diventa positiva. Quale zucchero contiene?`,o:[`Saccarosio`,`Maltosio`,`Lattosio`,`Glucosio`],a:0,e:`Il reattivo di Benedict rileva gli zuccheri riducenti, cioè con un gruppo carbonilico libero. Il saccarosio ha entrambi i carboni anomerici impegnati nel legame glicosidico, quindi non è riducente, ma l'idrolisi acida lo scinde in glucosio e fruttosio, entrambi riducenti. Maltosio, lattosio e glucosio sarebbero positivi già prima del trattamento.`},
{id:'bi_biomol_sf7',t:'bi_biomol',l:4,q:`Un polisaccaride, idrolizzato con acido a caldo, libera solo glucosio. Ingerito dall'uomo, non viene scisso dagli enzimi digestivi e passa come fibra. Quale tra questi è il più probabile?`,o:[`Cellulosa`,`Amido`,`Glicogeno`,`Chitina`],a:0,e:`La cellulosa è un polimero di glucosio con legami β(1→4), che gli enzimi umani non idrolizzano. Amido e glicogeno hanno legami α e sono digeriti dalle amilasi. La chitina non libera glucosio ma N-acetilglucosamina.`},
{id:'bi_biomol_sf8',t:'bi_biomol',l:4,q:`Il tripeptide Ala-Gly-Ser è scritto secondo la convenzione, dall'estremità N-terminale a quella C-terminale. Quale amminoacido ha il gruppo carbossilico α libero e quante molecole d'acqua si liberano nella sua sintesi?`,o:[`Ser; 2 molecole d'acqua`,`Ala; 2 molecole d'acqua`,`Ser; 3 molecole d'acqua`,`Gly; 1 molecola d'acqua`],a:0,e:`Le sequenze peptidiche si leggono dall'N-terminale (Ala, con amminico libero) al C-terminale (Ser, con carbossilico libero). Tre amminoacidi formano due legami peptidici e ogni condensazione libera una molecola d'acqua: 2 in totale, cioè n − 1.`},
{id:'bi_biomol_sf9',t:'bi_biomol',l:4,q:`Quale differenza strutturale dello zucchero rende il DNA chimicamente più stabile dell'RNA?`,o:[`Il desossiribosio è privo del gruppo OH in posizione 2'`,`Il desossiribosio ha un atomo di carbonio in più del ribosio`,`Il desossiribosio è privo del gruppo OH in posizione 3'`,`Il desossiribosio forma un anello a sei termini più stabile`],a:0,e:`Il gruppo OH in 2' del ribosio può attaccare il legame fosfodiesterico adiacente e favorirne l'idrolisi, quindi l'RNA è meno stabile. Il desossiribosio ha cinque atomi di carbonio, forma un anello a cinque termini e conserva l'OH in 3', indispensabile per il legame con il nucleotide successivo.`},
{id:'bi_biomol_sf10',t:'bi_biomol',l:4,q:`Le statine inibiscono la HMG-CoA reduttasi, enzima chiave di una via biosintetica del fegato. La sintesi di quale molecola, precursore anche degli ormoni steroidei, ne risulta ridotta?`,o:[`Colesterolo`,`Trigliceridi`,`Glicogeno`,`Emoglobina`],a:0,e:`La HMG-CoA reduttasi catalizza la tappa limitante della sintesi del colesterolo, da cui derivano anche ormoni steroidei e sali biliari. I trigliceridi si formano da glicerolo e acidi grassi, il glicogeno da glucosio, l'emoglobina è una proteina.`},
{id:'bi_prot_sf1',t:'bi_prot',l:4,q:`Un enzima che segue la cinetica di Michaelis-Menten ha Vmax = 120 μmol/min e Km = 2 mM. Qual è la velocità iniziale con [S] = 6 mM?`,o:[`90 μmol/min`,`60 μmol/min`,`80 μmol/min`,`100 μmol/min`],a:0,e:`v = Vmax·[S]/(Km + [S]) = 120·6/(2 + 6) = 90 μmol/min. 60 è la velocità a [S] = Km (metà di Vmax), 80 corrisponde a [S] = 4 mM e 100 a [S] = 10 mM.`},
{id:'bi_prot_sf2',t:'bi_prot',l:4,q:`Un inibitore lascia invariata la Vmax di un enzima e raddoppia la Km apparente. Con substrato molto abbondante l'effetto si annulla. Di che tipo di inibizione si tratta?`,o:[`Competitiva`,`Non competitiva`,`Incompetitiva`,`Irreversibile covalente`],a:0,e:`Un inibitore competitivo occupa il sito attivo: serve più substrato per raggiungere metà di Vmax (Km apparente maggiore) ma a [S] molto alta Vmax si recupera. Quella non competitiva abbassa Vmax con Km invariata, quella incompetitiva abbassa sia Vmax sia Km, quella irreversibile covalente riduce la quantità di enzima attivo e quindi Vmax.`},
{id:'bi_prot_sf3',t:'bi_prot',l:4,q:`Nell'avvelenamento da metanolo si somministra etanolo. Qual è il meccanismo d'azione?`,o:[`Compete con il metanolo per l'alcol deidrogenasi, rallentando la formazione di acido formico`,`Si lega a un sito allosterico dell'alcol deidrogenasi, inibendola in modo non competitivo`,`Denatura in modo irreversibile l'alcol deidrogenasi, bloccando ogni ossidazione alcolica`,`Converte direttamente il metanolo in acqua e CO₂, senza passare da intermedi tossici`],a:0,e:`L'etanolo è un substrato preferito dall'alcol deidrogenasi rispetto al metanolo e agisce come competitore: il metanolo viene eliminato in gran parte invariato invece di formare i metaboliti tossici (acido formico in particolare). Non c'è denaturazione, né inibizione allosterica, né conversione diretta in CO₂.`},
{id:'bi_prot_sf4',t:'bi_prot',l:4,q:`Un peptide contiene molta lisina e arginina e pochissimi residui acidi. In un'elettroforesi a pH 7,4, verso quale elettrodo migra e perché?`,o:[`Verso il catodo (polo negativo), perché ha carica netta positiva`,`Verso l'anodo (polo positivo), perché ha carica netta negativa`,`Non migra, perché a pH 7,4 ogni peptide è privo di carica netta`,`Verso l'anodo (polo positivo), perché i gruppi amminici sono deprotonati`],a:0,e:`Le catene laterali di lisina e arginina sono basiche e a pH 7,4 sono protonate (pKa circa 10,5 e 12,5), quindi il peptide ha carica netta positiva e migra verso il catodo. Un peptide è neutro solo al proprio punto isoelettrico, che qui è molto più alto di 7,4.`},
{id:'bi_prot_sf5',t:'bi_prot',l:4,q:`Nel muscolo che lavora intensamente aumentano la CO₂ e gli ioni H⁺. Come cambia l'affinità dell'emoglobina per l'O₂ e con quale vantaggio?`,o:[`Diminuisce (effetto Bohr), favorendo il rilascio di O₂ dove serve di più`,`Aumenta, così l'emoglobina trattiene più O₂ per i tessuti meno attivi`,`Resta invariata, perché dipende solo dalla pressione parziale di O₂`,`Aumenta, perché gli ioni H⁺ stabilizzano la forma ad alta affinità`],a:0,e:`Con pH più basso e più CO₂ l'emoglobina passa verso la forma a bassa affinità (effetto Bohr) e cede più O₂ proprio ai tessuti più attivi. L'affinità non dipende solo dalla pressione parziale di O₂ e H⁺ stabilizza la forma a bassa affinità, non quella ad alta affinità.`},
{id:'bi_prot_sf6',t:'bi_prot',l:4,q:`La ribonucleasi trattata con urea 8 M e un agente riducente si srotola e perde l'attività. Dopo rimozione graduale dei reagenti recupera la struttura nativa e l'attività. Che cosa dimostra l'esperimento?`,o:[`Che la sequenza degli amminoacidi contiene l'informazione per il ripiegamento corretto`,`Che urea e riducente hanno idrolizzato i legami peptidici, poi risaldati spontaneamente`,`Che solo la struttura secondaria è determinata dalla sequenza, la terziaria no`,`Che la denaturazione con urea è di norma irreversibile`],a:0,e:`L'urea e il riducente rompono legami non covalenti e disolfuro, non i legami peptidici. Poiché la proteina si rifolda da sola nella forma nativa, la struttura terziaria è specificata dalla struttura primaria (esperimento di Anfinsen). Il risultato contraddice l'idea che la denaturazione sia sempre irreversibile.`},
{id:'bi_prot_sf7',t:'bi_prot',l:4,q:`L'esochinasi (Km per il glucosio circa 0,1 mM) e la glucochinasi epatica (Km circa 10 mM) fosforilano il glucosio. Dopo un pasto la glicemia sale da 5 a 8 mM. Quale affermazione è corretta?`,o:[`L'esochinasi è già quasi satura e cambia poco; la glucochinasi aumenta sensibilmente`,`Entrambe aumentano la velocità in modo proporzionale alla glicemia, perché la Km non conta`,`L'esochinasi aumenta molto la velocità perché ha l'affinità più alta; la glucochinasi è satura`,`La glucochinasi è già satura a 5 mM e non risponde all'aumento della glicemia dopo il pasto`],a:0,e:`Con Km = 0,1 mM l'esochinasi lavora già a circa il 98% di Vmax a 5 mM, quindi quasi non cambia. Con Km = 10 mM la glucochinasi passa da circa un terzo a circa il 44% di Vmax: aumenta di oltre il 30%, cosa utile per il fegato che deve assorbire il glucosio in eccesso dopo i pasti.`},
{id:'bi_prot_sf8',t:'bi_prot',l:4,q:`Perché la tripsina viene sintetizzata dal pancreas come tripsinogeno inattivo?`,o:[`Per non digerire le proteine del pancreas stesso prima di raggiungere l'intestino`,`Perché la forma attiva sarebbe instabile al pH basico del duodeno`,`Perché l'attivazione richiede fosforilazione da parte dell'ATP nello stomaco`,`Perché il tripsinogeno è più solubile e può essere trasportato nel sangue`],a:0,e:`Gli zimogeni sono precursori inattivi che evitano l'autodigestione dell'organo che li produce. Il tripsinogeno viene attivato nel duodeno dall'enteropeptidasi, con taglio proteolitico, non per fosforilazione. La tripsina lavora bene a pH lievemente basico e non viene trasportata nel sangue.`},
{id:'bi_prot_sf9',t:'bi_prot',l:4,q:`L'emoglobina adulta è un tetramero con due catene α di 141 amminoacidi e due catene β di 146 amminoacidi. Quanti legami peptidici contiene in totale?`,o:[`570`,`573`,`574`,`566`],a:0,e:`Ogni catena di n amminoacidi ha n − 1 legami peptidici: 2·140 + 2·145 = 570. Il totale degli amminoacidi è 574 (da cui 573 se si sbaglia trattando tutto come una sola catena); le subunità sono tenute insieme da legami non covalenti, non peptidici.`},
{id:'bi_prot_sf10',t:'bi_prot',l:4,q:`Perché l'emoglobina fetale (α₂γ₂), con affinità per l'O₂ maggiore di quella adulta, è vantaggiosa per il feto?`,o:[`Permette di sottrarre O₂ all'emoglobina materna a livello della placenta`,`Permette di cedere O₂ ai tessuti fetali più facilmente della madre`,`Rende il feto indipendente dalla pressione parziale di O₂ materna`,`Evita la formazione del legame tra emoglobina e CO₂`],a:0,e:`A parità di pressione parziale di O₂, l'emoglobina con affinità più alta si satura di più: all'interfaccia placentare l'O₂ passa dall'emoglobina materna a quella fetale. Il feto dipende comunque dall'O₂ materno e l'alta affinità non riguarda il CO₂.`},
{id:'bi_metab_sf1',t:'bi_metab',l:4,q:`Una molecola di acetil-CoA viene completamente ossidata nel ciclo di Krebs. Contando 2,5 ATP per NADH, 1,5 ATP per FADH₂ e 1 ATP (o GTP) per fosforilazione a livello del substrato, quanti ATP si ottengono in totale?`,o:[`10`,`9`,`7,5`,`12`],a:0,e:`Un giro del ciclo produce 3 NADH, 1 FADH₂ e 1 ATP/GTP: 3·2,5 + 1·1,5 + 1 = 10. Il valore 9 dimentica l'ATP, 7,5 conta solo i NADH, 12 deriva dalla vecchia convenzione 3 e 2 ATP per NADH e FADH₂ (qui esclusa).`},
{id:'bi_metab_sf2',t:'bi_metab',l:4,q:`Acido miristico (saturo, 14 atomi di carbonio). Contando 2,5 ATP per NADH, 1,5 per FADH₂, 10 ATP per ogni acetil-CoA ossidato nel ciclo di Krebs e nella catena respiratoria, e 2 ATP equivalenti per l'attivazione ad acil-CoA, qual è la resa netta di ATP della completa ossidazione?`,o:[`92`,`94`,`106`,`82`],a:0,e:`14 C danno 6 cicli di β-ossidazione e 7 acetil-CoA. I cicli forniscono 6·(2,5 + 1,5) = 24 ATP, gli acetil-CoA 7·10 = 70, meno 2 per l'attivazione: 24 + 70 − 2 = 92. 94 dimentica l'attivazione, 106 è il valore del palmitato (16 C), 82 deriva dal contare 6 acetil-CoA invece di 7.`},
{id:'bi_metab_sf3',t:'bi_metab',l:4,q:`Il 2,4-dinitrofenolo, che trasporta protoni attraverso la membrana mitocondriale interna, viene aggiunto a mitocondri funzionanti. Quali effetti si osservano?`,o:[`Il consumo di O₂ aumenta, la sintesi di ATP diminuisce e si libera più calore`,`Il consumo di O₂ diminuisce e la sintesi di ATP aumenta per l'accumulo del gradiente`,`Il consumo di O₂ si blocca perché viene inibito il complesso IV`,`Il consumo di O₂ e la sintesi di ATP aumentano insieme perché passano più protoni`],a:0,e:`Il disaccoppiante dissipa il gradiente protonico senza passare dall'ATP sintasi: la catena respiratoria corre più velocemente (più O₂ consumato) ma l'energia si perde come calore e l'ATP prodotto cala. Non inibisce il complesso IV e i protoni che passano per il disaccoppiante non producono ATP.`},
{id:'bi_metab_sf4',t:'bi_metab',l:4,q:`Cellule in coltura vengono trattate con cianuro, inibitore della citocromo c ossidasi (complesso IV), in presenza di glucosio. Che cosa avviene?`,o:[`Il NADH si accumula e la cellula ricorre alla glicolisi anaerobica con produzione di lattato`,`L'ATP sintasi continua a lavorare con il gradiente residuo e la produzione di ATP resta invariata`,`Il ciclo di Krebs accelera perché nella matrice si accumula NAD⁺ in eccesso`,`La glicolisi si arresta e le cellule smettono completamente di consumare glucosio`],a:0,e:`Senza il complesso IV gli elettroni non arrivano all'O₂, la catena si ferma, il NADH non viene riossidato e il ciclo di Krebs rallenta. Per rigenerare NAD⁺ la glicolisi prosegue con riduzione del piruvato a lattato (e il consumo di glucosio aumenta per compensare la perdita di ATP).`},
{id:'bi_metab_sf5',t:'bi_metab',l:4,q:`In mitocondri isolati con substrato e O₂, l'oligomicina (inibitore dell'ATP sintasi) riduce molto il consumo di O₂. Aggiungendo poi un disaccoppiante, il consumo di O₂ torna elevato. Quale interpretazione è corretta?`,o:[`Senza rientro dei protoni il gradiente frena la catena; il disaccoppiante dissipa il gradiente`,`L'oligomicina blocca il complesso IV della catena e il disaccoppiante lo riattiva`,`L'oligomicina esaurisce il substrato ossidabile e il disaccoppiante lo rigenera`,`L'oligomicina disperde il gradiente protonico e il disaccoppiante lo ricostituisce`],a:0,e:`Se i protoni non possono rientrare attraverso l'ATP sintasi, il gradiente cresce e frena il pompaggio, quindi la catena rallenta e il consumo di O₂ cala. Il disaccoppiante riapre una via di rientro dei protoni e la catena torna veloce. Le altre risposte scambiano i ruoli o attribuiscono al disaccoppiante effetti che non ha.`},
{id:'bi_metab_sf6',t:'bi_metab',l:4,q:`Dopo un digiuno di 12 ore il fegato rilascia glucosio nel sangue, mentre il glicogeno muscolare non contribuisce alla glicemia. Qual è la spiegazione?`,o:[`Il fegato ha la glucosio-6-fosfatasi, assente nel muscolo`,`Il muscolo non ha la glicogeno fosforilasi e non degrada il glicogeno`,`Il muscolo non possiede l'esochinasi e non fosforila il glucosio`,`Solo il fegato è in grado di immagazzinare glicogeno`],a:0,e:`Il muscolo degrada il glicogeno (ha la fosforilasi), ma il glucosio-6-fosfato che ne deriva non può essere defosforilato né uscire dalla cellula, e viene usato in loco nella glicolisi. Il fegato, con la glucosio-6-fosfatasi, produce glucosio libero. Anche il muscolo contiene molto glicogeno e ha l'esochinasi.`},
{id:'bi_metab_sf7',t:'bi_metab',l:4,q:`Una coltura di lievito fermenta 5 mol di glucosio fino a etanolo in condizioni anaerobie. Considerando la sola resa netta della glicolisi, quante mol di ATP e di CO₂ si ottengono?`,o:[`10 mol di ATP e 10 mol di CO₂`,`10 mol di ATP e 5 mol di CO₂`,`20 mol di ATP e 10 mol di CO₂`,`10 mol di ATP e 30 mol di CO₂`],a:0,e:`Per ogni glucosio la glicolisi dà 2 ATP netti e la fermentazione alcolica produce 2 etanolo e 2 CO₂: per 5 mol si hanno 10 ATP e 10 CO₂. 30 mol di CO₂ sarebbero la resa della respirazione aerobica (6 per glucosio), non della fermentazione.`},
{id:'bi_metab_sf8',t:'bi_metab',l:4,q:`Nel ciclo di Calvin, quanti ATP e quanti NADPH servono per fissare 6 molecole di CO₂ nell'equivalente di una molecola di glucosio?`,o:[`18 ATP e 12 NADPH`,`12 ATP e 18 NADPH`,`9 ATP e 6 NADPH`,`6 ATP e 12 NADPH`],a:0,e:`Per ogni CO₂ fissata servono 3 ATP (riduzione del 3-fosfoglicerato e rigenerazione del RuBP) e 2 NADPH: per 6 CO₂ sono 18 ATP e 12 NADPH. 9 e 6 sono i valori per 3 CO₂ (una triosio fosfato), mentre 12 e 18 invertono il rapporto.`},
{id:'bi_metab_sf9',t:'bi_metab',l:4,q:`Alghe fotosintetiche ricevono ¹⁴CO₂ e vengono bloccate dopo pochi secondi: il primo composto stabile marcato è il 3-fosfoglicerato, a tre atomi di carbonio. Che cosa si deduce sulla fissazione della CO₂?`,o:[`La CO₂ si lega a un accettore a 5 atomi di carbonio, generando due molecole a 3 atomi`,`La CO₂ si lega a un composto a 2 atomi di carbonio, formando una molecola a 3 atomi`,`La CO₂ si lega al piruvato, formando una molecola a 4 atomi di carbonio`,`La CO₂ si lega a un composto a 6 atomi di carbonio, che si scinde in due molecole`],a:0,e:`Il primo prodotto stabile a 3 C indica che l'addizione di 1 C a un accettore a 5 C (ribulosio-1,5-bisfosfato, catalizzata dalla RuBisCO) forma un intermedio a 6 C instabile, che si scinde subito in due 3-fosfoglicerato. Il piruvato e l'ossalacetato (a 4 C) non sono il primo prodotto di questa via.`},
{id:'bi_metab_sf10',t:'bi_metab',l:4,q:`In una persona a digiuno da 18 ore, quale combinazione di eventi epatici è attesa per azione del glucagone?`,o:[`Aumentano glicogenolisi e gluconeogenesi, diminuisce la sintesi di glicogeno`,`Aumentano glicogenosintesi e glicolisi, diminuisce la gluconeogenesi`,`Aumentano glicogenolisi e glicolisi, diminuisce la gluconeogenesi`,`Aumentano glicogenosintesi e gluconeogenesi, diminuisce la glicogenolisi`],a:0,e:`Il glucagone attiva nel fegato la glicogeno fosforilasi, inibisce la glicogeno sintasi e favorisce la gluconeogenesi, riducendo la glicolisi, per mandare glucosio nel sangue. Le altre combinazioni mescolano effetti dell'insulina (che favorisce glicogenosintesi e glicolisi) con quelli del glucagone.`},
{id:'bi_gapp_sf1',t:'bi_gapp',l:4,q:`Una reazione di PCR parte da 4 molecole di DNA stampo a doppio filamento contenenti la sequenza bersaglio. Con efficienza del 100%, quante molecole a doppio filamento con la sequenza bersaglio ci sono dopo 6 cicli?`,o:[`256`,`24`,`64`,`512`],a:0,e:`A ogni ciclo il numero di molecole raddoppia: 4 · 2⁶ = 256. 24 sarebbe una crescita lineare, 64 dimentica le 4 molecole iniziali, 512 corrisponde a 7 cicli.`},
{id:'bi_gapp_sf2',t:'bi_gapp',l:4,q:`Un DNA lineare di 10 000 bp viene tagliato da un enzima di restrizione in tre siti, posti a 2000, 5000 e 9000 bp da un'estremità. Quanti frammenti si ottengono e di che lunghezza?`,o:[`4 frammenti: 1000, 2000, 3000 e 4000 bp`,`3 frammenti: 2000, 3000 e 4000 bp`,`4 frammenti: 2000, 5000, 9000 e 10 000 bp`,`3 frammenti: 2000, 5000 e 9000 bp`],a:0,e:`Un DNA lineare con 3 tagli dà 4 frammenti: da 0 a 2000 (2000), da 2000 a 5000 (3000), da 5000 a 9000 (4000) e da 9000 a 10 000 (1000); la somma è 10 000. Le altre risposte dimenticano l'ultimo frammento oppure scambiano le posizioni dei siti con le lunghezze.`},
{id:'bi_gapp_sf3',t:'bi_gapp',l:4,q:`Un amplicone di 600 bp contiene un sito per EcoRI a 200 bp da un'estremità; una mutazione puntiforme può abolire il sito. Il DNA di un paziente, digerito con EcoRI e analizzato su gel di agarosio, mostra bande a 600, 400 e 200 bp. Qual è il genotipo?`,o:[`Eterozigote per la mutazione`,`Omozigote per la mutazione`,`Omozigote per l'allele normale`,`Emizigote per l'allele mutato`],a:0,e:`L'allele normale viene tagliato in 200 + 400 bp, l'allele mutato (senza sito) resta a 600 bp. La presenza di tutte e tre le bande indica un allele per tipo, cioè un eterozigote. L'omozigote mutato mostrerebbe solo la banda a 600, l'omozigote normale solo 400 e 200; l'emizigote ha una sola copia del gene.`},
{id:'bi_gapp_sf4',t:'bi_gapp',l:4,q:`In una popolazione in equilibrio di Hardy-Weinberg una malattia autosomica recessiva colpisce 1 persona su 400. Quanti portatori sani ci si aspetta in un gruppo di 10 000 persone?`,o:[`950`,`25`,`475`,`1900`],a:0,e:`q² = 1/400, quindi q = 1/20 e p = 19/20. I portatori sono 2pq = 2·(19/20)·(1/20) = 0,095, cioè 950 su 10 000. 25 sono i malati, 475 deriva dal dimenticare il fattore 2 e 1900 dal raddoppiare ancora il risultato corretto.`},
{id:'bi_gapp_sf5',t:'bi_gapp',l:4,q:`Una coppia di genitori sani ha un figlio affetto da una malattia autosomica recessiva. Qual è la probabilità che un'altra loro figlia, sana, sia portatrice?`,o:[`2/3`,`1/2`,`1/4`,`1/3`],a:0,e:`I genitori sono obbligatoriamente portatori (Aa × Aa). Tra i figli sani le combinazioni possibili sono AA (1/4) e Aa (2/4): la probabilità di essere portatrice, dato che è sana, è (2/4)/(3/4) = 2/3. 1/2 è la probabilità non condizionata, 1/4 quella di essere affetta.`},
{id:'bi_gapp_sf6',t:'bi_gapp',l:4,q:`Due genitori sani sono eterozigoti per due malattie autosomiche recessive su cromosomi diversi, la fibrosi cistica e la fenilchetonuria. Qual è la probabilità che un figlio abbia la fibrosi cistica ma non la fenilchetonuria?`,o:[`3/16`,`1/16`,`9/16`,`1/4`],a:0,e:`I due geni segregano in modo indipendente: P(fibrosi cistica) = 1/4 e P(non fenilchetonurico) = 3/4, quindi 1/4 · 3/4 = 3/16. 1/16 è la probabilità di avere entrambe le malattie, 9/16 di non averne nessuna e 1/4 ignora la seconda condizione.`},
{id:'bi_gapp_sf7',t:'bi_gapp',l:4,q:`Una donna Rh negativa, dopo il parto del primo figlio Rh positivo, riceve immunoglobuline anti-D. Qual è lo scopo del trattamento?`,o:[`Eliminare le emazie fetali Rh+ dal sangue materno prima che la madre produca anticorpi`,`Immunizzare attivamente la madre, che produrrà anticorpi anti-D protettivi per il feto stesso`,`Trasformare le emazie del neonato da Rh positive a Rh negative, evitando l'anemia`,`Bloccare il passaggio delle IgG materne attraverso la placenta nelle gravidanze successive`],a:0,e:`Al parto emazie fetali Rh+ passano nel circolo materno; gli anticorpi anti-D somministrati le eliminano prima che il sistema immunitario materno si sensibilizzi, così una gravidanza successiva con feto Rh+ non è a rischio di malattia emolitica. L'immunità conferita è passiva, non attiva, e le IgG materne attraversano la placenta, ed è proprio questo a causare il danno se la madre è sensibilizzata.`},
{id:'bi_gapp_sf8',t:'bi_gapp',l:4,q:`Per produrre insulina umana in Escherichia coli si inserisce nel plasmide il cDNA e non il gene genomico. Perché?`,o:[`Perché i batteri non sanno rimuovere gli introni dal trascritto primario`,`Perché i batteri non sanno trascrivere il DNA di origine umana`,`Perché il cDNA contiene gli introni, che aumentano l'espressione`,`Perché il gene genomico non può essere tagliato dagli enzimi di restrizione`],a:0,e:`Il cDNA è ottenuto per retrotrascrizione dall'mRNA maturo, quindi è privo di introni, mentre E. coli non possiede lo spliceosoma per eliminarli dal trascritto. Il DNA umano può essere trascritto in batteri se ha un promotore adatto e il gene genomico può essere tagliato dagli enzimi di restrizione come qualsiasi DNA.`},
{id:'bi_gapp_sf9',t:'bi_gapp',l:4,q:`Batteri trasformati con un plasmide che porta il gene di resistenza all'ampicillina e il gene lacZ (con un sito di clonaggio al suo interno) sono piastrati su terreno con ampicillina e X-gal. Che cosa indicano le colonie bianche?`,o:[`Batteri con plasmide con lacZ interrotto dall'inserto di DNA estraneo`,`Batteri non trasformati, privi di qualsiasi plasmide`,`Batteri con plasmide richiuso su sé stesso senza inserto`,`Batteri con plasmide senza il gene di resistenza all'ampicillina`],a:0,e:`Solo i batteri con il plasmide resistono all'ampicillina e crescono. Se lacZ è integro la β-galattosidasi scinde l'X-gal e la colonia è blu (plasmide senza inserto); se l'inserto interrompe lacZ, la colonia è bianca (ricombinante). I batteri senza plasmide o privi del gene di resistenza non crescono.`},
{id:'bi_gapp_sf10',t:'bi_gapp',l:4,q:`In una cellula umana, Cas9 guidata da un RNA guida produce un taglio a doppio filamento in un gene e non è fornito alcuno stampo di riparazione. Quale esito è il più comune?`,o:[`Riparo per giunzione di estremità non omologhe, con piccoli indel che possono inattivare il gene`,`Riparo per ricombinazione omologa, che ripristina esattamente la sequenza originale`,`Sostituzione del tratto tagliato con una sequenza nuova scelta dalla cellula stessa`,`Metilazione del gene, che lo silenzia senza alterare la sequenza`],a:0,e:`In assenza di uno stampo il riparo avviene soprattutto per giunzione delle estremità non omologhe, che è soggetta a errori: piccole inserzioni o delezioni (indel) possono causare uno slittamento della fase di lettura e inattivare il gene. La riparazione per omologia richiede uno stampo e la metilazione non è la conseguenza del taglio.`},
{id:"fl1_001",t:"fl1",p:"1.1",l:1,q:"Quale di queste grandezze è scalare?",o:["La massa","Lo spostamento","La forza","La velocità"],a:0,e:"Una grandezza scalare è descritta solo da un numero con la sua unità. Massa, tempo, temperatura, densità, lavoro, frequenza e carica sono scalari; spostamento, forza e velocità servono anche direzione e verso."},
{id:"fl1_002",t:"fl1",p:"1.1.1",l:1,q:"Quante sono le grandezze fondamentali individuate in fisica?",o:["7","3","5","10"],a:0,e:"Sono sette: lunghezza, massa, tempo, intensità di corrente, temperatura, intensità luminosa e quantità di sostanza. Tutte le altre sono derivate."},
{id:"fl1_003",t:"fl1",p:"1.1.1",l:2,q:"Quale di queste è una grandezza derivata?",o:["La velocità","La massa","Il tempo","La temperatura"],a:0,e:"La velocità si ricava da lunghezza e tempo (v = lunghezza / tempo), quindi è derivata e ha dimensioni [L][T]⁻¹."},
{id:"fl1_004",t:"fl1",p:"1.1.2",l:2,q:"Quali sono le dimensioni della velocità?",o:["[L][T]⁻¹","[L][T]","[L]⁻¹[T]","[M][L][T]⁻¹"],a:0,e:"velocità = lunghezza / tempo, quindi [v] = [L]/[T] = [L][T]⁻¹."},
{id:"fl1_005",t:"fl1",p:"1.1.2",l:2,q:"Quali sono le dimensioni di cos θ?",o:["Nessuna: è adimensionale","[L]","[L]²","Le stesse dell'angolo in gradi, [L]/[T]"],a:0,e:"Seno, coseno e tangente sono rapporti tra due segmenti, quindi sono numeri puri senza dimensioni."},
{id:"fl1_006",t:"fl1",p:"1.1.2",l:3,q:"Quale operazione NON ha senso in fisica?",o:["1 m + 1 kg","2 · (3 m)","5 m / 2 s","3 m + 40 cm"],a:0,e:"Si possono sommare o sottrarre solo grandezze omogenee (stesse dimensioni). Metri e chilogrammi hanno dimensioni diverse. 3 m + 40 cm invece è lecito: sono entrambe lunghezze."},
{id:"fl1_007",t:"fl1",p:"1.1.2",l:3,q:"Raddoppiando il perimetro p di una stanza, che dimensioni ha 2p?",o:["[L], come p","[L]²","2[L]","Nessuna"],a:0,e:"Moltiplicare per un numero puro non cambia le dimensioni: [2p] = [2]·[p] = 1·[L] = [L]."},
{id:"fl1_008",t:"fl1",p:"1.1.2",l:2,q:"Due grandezze fisiche con le stesse dimensioni si dicono…",o:["omogenee","adimensionali","fondamentali","concordi"],a:0,e:"Grandezze con le stesse dimensioni sono omogenee: per esempio la lunghezza di un tavolo e l'altezza di un muro, entrambe [L]."},
{id:"fl1_009",t:"fl1",p:"1.2",l:1,q:"Qual è l'unità di misura della temperatura nel Sistema Internazionale?",o:["Il kelvin (K)","Il grado Celsius (°C)","Il grado Fahrenheit (°F)","La caloria"],a:0,e:"Nel SI la temperatura è una grandezza fondamentale e si misura in kelvin."},
{id:"fl1_010",t:"fl1",p:"1.2",l:1,q:"Quale terna di unità caratterizza il sistema CGS?",o:["Centimetro, grammo, secondo","Metro, chilogrammo, secondo","Centimetro, chilogrammo, secondo","Metro, grammo, secondo"],a:0,e:"CGS viene dalle iniziali di centimetro, grammo e secondo. Metro, chilogrammo e secondo sono invece le unità del sistema MKS (il SI ristretto alla meccanica)."},
{id:"fl1_011",t:"fl1",p:"1.2",l:2,q:"Quale elenco contiene solo grandezze fondamentali del SI?",o:["Corrente elettrica, massa, temperatura, tempo","Lunghezza, massa, tempo, forza","Carica elettrica, massa, calore, tempo","Pressione, energia, lavoro, tempo"],a:0,e:"La forza, la carica elettrica, il calore, la pressione, l'energia e il lavoro sono grandezze derivate. Corrente, massa, temperatura e tempo sono tutte fondamentali."},
{id:"fl1_012",t:"fl1",p:"1.2",l:2,q:"A quanto corrisponde circa 1 kg, secondo la definizione riportata?",o:["Alla massa di 1 dm³ di acqua distillata a 4 °C","Alla massa di 1 cm³ di acqua a 4 °C","Alla massa di 1 m³ di acqua a 0 °C","Al peso di 1 litro d'acqua a 100 °C"],a:0,e:"Il chilogrammo è la massa del campione di Sèvres, pari circa alla massa di un decimetro cubo (un litro) di acqua distillata a 4 °C."},
{id:"fl1_013",t:"fl1",p:"1.2",l:1,q:"In quale unità si misura la quantità di sostanza nel SI?",o:["Mole","Candela","Chilogrammo","Ampere"],a:0,e:"La quantità di sostanza si misura in mole (mol). La candela misura l'intensità luminosa, l'ampere la corrente."},
{id:"fl1_014",t:"fl1",p:"1.3",l:1,q:"Il prefisso «tera» (T) corrisponde a…",o:["10¹²","10⁹","10⁶","10¹⁵"],a:0,e:"Multipli: deca 10¹, etto 10², chilo 10³, mega 10⁶, giga 10⁹, tera 10¹²."},
{id:"fl1_015",t:"fl1",p:"1.3",l:1,q:"Il prefisso «micro» (µ) corrisponde a…",o:["10⁻⁶","10⁻³","10⁻⁹","10⁻¹²"],a:0,e:"Sottomultipli: deci 10⁻¹, centi 10⁻², milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹, pico 10⁻¹²."},
{id:"fl1_016",t:"fl1",p:"1.3.1",l:2,q:"Come si scrive 0,0025 in notazione scientifica?",o:["2,5 · 10⁻³","25 · 10⁻⁴","2,5 · 10⁻²","0,25 · 10⁻²"],a:0,e:"In notazione scientifica serve una sola cifra diversa da zero prima della virgola: 0,0025 = 2,5 · 10⁻³."},
{id:"fl1_017",t:"fl1",p:"1.3.2",l:2,q:"Qual è l'ordine di grandezza di 562,5?",o:["3","2","5","1"],a:0,e:"562,5 = 5,625 · 10². Siccome 5,625 non è minore di 5, l'ODG è b + 1 = 3 (infatti 562,5 è più vicino a 1000 che a 100)."},
{id:"fl1_018",t:"fl1",p:"1.3.2",l:2,q:"Qual è l'ordine di grandezza di 23,54?",o:["1","2","0","23"],a:0,e:"23,54 = 2,354 · 10¹ e 2,354 < 5, quindi l'ODG è uguale all'esponente: 1."},
{id:"fl1_019",t:"fl1",p:"1.3",l:3,q:"A quanti nanosecondi corrispondono 201 µs?",o:["2,01 · 10⁵ ns","2,01 · 10³ ns","2,01 · 10⁻³ ns","2,01 · 10⁸ ns"],a:0,e:"201 µs = 201 · 10⁻⁶ s = 201 · 10⁻⁶ · 10⁹ ns = 201 · 10³ ns = 2,01 · 10⁵ ns."},
{id:"fl1_020",t:"fl1",p:"1.3.2",l:3,q:"Qual è l'ordine di grandezza di −0,7 km?",o:["0","−1","1","−7"],a:0,e:"−0,7 = −7 · 10⁻¹. Il segno non conta e |a| = 7 ≥ 5, quindi ODG = −1 + 1 = 0: la potenza di 10 più vicina è 10⁰ = 1."},
{id:"fl1_021",t:"fl1",p:"1.3",l:3,q:"Quale uguaglianza è corretta?",o:["60.000 ns = 10⁻⁶ min","0,01 µg = 10⁻⁸ kg","1 GeV = 10³ keV","1 Tm = 10¹⁵ km"],a:0,e:"60.000 ns = 6 · 10⁴ · 10⁻⁹ s = 6 · 10⁻⁵ s = 10⁻⁶ min (perché 1 min = 60 s). Le altre sono sbagliate: 0,01 µg = 10⁻¹¹ kg, 1 GeV = 10⁶ keV, 1 Tm = 10¹² m = 10⁹ km."},
{id:"fl1_022",t:"fl1",p:"1.4",l:1,q:"Cosa serve, oltre al modulo, per descrivere una grandezza vettoriale?",o:["La direzione e il verso","Solo l'unità di misura","Solo il verso","Il punto di applicazione e la massa"],a:0,e:"Un vettore è individuato da modulo (intensità), direzione (la retta su cui giace) e verso (indicato dalla freccia)."},
{id:"fl1_023",t:"fl1",p:"1.4",l:1,q:"Due vettori paralleli con verso opposto si dicono…",o:["antiparalleli (discordi)","concordi","ortogonali","omogenei"],a:0,e:"Paralleli: stessa direzione. Concordi: paralleli con stesso verso. Antiparalleli o discordi: paralleli con verso opposto. Ortogonali: direzioni a 90°."},
{id:"fl1_024",t:"fl1",p:"1.4.1",l:1,q:"Che cosa si ottiene moltiplicando un vettore per uno scalare negativo?",o:["Un vettore con la stessa direzione e verso opposto","Uno scalare negativo","Un vettore perpendicolare","Un vettore con verso uguale e modulo minore"],a:0,e:"Il multiplo ha la stessa direzione; il verso è concorde se lo scalare è positivo, discorde se è negativo; il modulo è moltiplicato per il valore assoluto dello scalare."},
{id:"fl1_025",t:"fl1",p:"1.4.2",l:2,q:"Due forze perpendicolari di 3 N e 4 N agiscono sullo stesso punto. Quanto vale la risultante?",o:["5 N","7 N","1 N","12 N"],a:0,e:"Con vettori ortogonali si usa Pitagora: R = √(3² + 4²) = √25 = 5 N."},
{id:"fl1_026",t:"fl1",p:"1.4.2",l:2,q:"Due vettori antiparalleli di modulo 6 e 2. Quanto vale il modulo della risultante?",o:["4, con il verso del vettore di modulo 6","8","4, con il verso del vettore di modulo 2","√40"],a:0,e:"Per vettori antiparalleli il modulo della risultante è la differenza dei moduli (6 − 2 = 4) e il verso è quello del vettore più intenso."},
{id:"fl1_027",t:"fl1",p:"1.4.3",l:2,q:"Un vettore v di modulo 8 forma un angolo di 30° con l'asse x. Quanto vale la sua componente lungo y?",o:["4","4√3","8","2"],a:0,e:"|vᵧ| = v · sen 30° = 8 · ½ = 4. La componente lungo x vale 8 · cos 30° = 4√3."},
{id:"fl1_028",t:"fl1",p:"1.4.4",l:2,q:"Quando il prodotto scalare di due vettori non nulli è zero?",o:["Quando i vettori sono perpendicolari","Quando sono paralleli e concordi","Quando sono antiparalleli","Mai"],a:0,e:"a·b = |a||b| cos θ e cos 90° = 0. Il prodotto scalare è massimo per θ = 0° e minimo (negativo) per θ = 180°."},
{id:"fl1_029",t:"fl1",p:"1.4.4",l:2,q:"Il prodotto vettoriale di due vettori paralleli…",o:["è nullo","è massimo","è uguale al prodotto dei moduli","è un numero negativo"],a:0,e:"|a ∧ b| = |a||b| sen θ e sen 0° = sen 180° = 0. Il modulo è massimo quando i vettori sono perpendicolari."},
{id:"fl1_030",t:"fl1",p:"1.4.4",l:3,q:"Quale affermazione sui prodotti tra vettori è corretta?",o:["Il prodotto scalare è commutativo, il prodotto vettoriale è anticommutativo","Sono entrambi commutativi","Sono entrambi sempre positivi","Il prodotto vettoriale dà come risultato un numero"],a:0,e:"a·b = b·a, mentre a ∧ b = −(b ∧ a): stesso modulo e direzione, verso opposto. Il prodotto scalare può essere negativo (angoli tra 90° e 180°), e il prodotto vettoriale è un vettore."},
{id:"fl1_031",t:"fl1",p:"1.4.4",l:3,q:"Due vettori di modulo 3 e 1 formano con l'asse x angoli di 60° e 30°. Quanto vale il modulo del loro prodotto vettoriale?",o:["3/2","3√3/2","3","0"],a:0,e:"L'angolo tra i vettori è 60° − 30° = 30°. |a ∧ b| = 3 · 1 · sen 30° = 3/2. (Il prodotto scalare invece vale 3 · cos 30° = 3√3/2.)"},
{id:"fl1_032",t:"fl1",p:"1.4.2",l:3,q:"Due forze uguali di modulo F formano un angolo α < 90°. Quanto vale la risultante?",o:["2F cos(α/2)","2F sen(α/2)","2F cos α","F√2"],a:0,e:"La risultante è la diagonale di un rombo di lato F: è il doppio dell'altezza del triangolo isoscele di lati F, che vale F cos(α/2). Quindi R = 2F cos(α/2)."},
{id:"fl1_033",t:"fl1",p:"1.4.4",l:3,q:"Il modulo del prodotto vettoriale di due vettori è sempre…",o:["minore o uguale al prodotto dei moduli","maggiore del prodotto dei moduli","uguale al prodotto dei moduli","uguale alla somma dei moduli"],a:0,e:"|a ∧ b| = |a||b| sen θ e sen θ ≤ 1: quindi è al massimo uguale al prodotto dei moduli (quando θ = 90°)."},
{id:"fl1_034",t:"fl1",p:"1.5",l:1,q:"Come si riducono gli errori accidentali?",o:["Ripetendo più volte la misura e facendo la media aritmetica","Cambiando unità di misura","Facendo una sola misura molto attenta","Non si possono ridurre in alcun modo"],a:0,e:"Gli errori accidentali sono casuali, per eccesso o per difetto: facendo la media di molte misure si compensano. Quelli sistematici invece non si riducono con la media."},
{id:"fl1_035",t:"fl1",p:"1.5",l:1,q:"Un righello di plastica lasciato vicino a una fonte di calore si dilata. Che errore provoca?",o:["Un errore sistematico per difetto","Un errore accidentale","Un errore sistematico per eccesso","Nessun errore"],a:0,e:"Il righello starato sbaglia sempre nello stesso verso: le sue tacche sono più distanti, quindi gli oggetti appaiono più corti. È un errore sistematico per difetto."},
{id:"fl1_036",t:"fl1",p:"1.5.2",l:2,q:"Come si calcola l'errore assoluto di una serie di misure, secondo il libro?",o:["(xmax − xmin) / 2","xmax − xmin","(xmax + xmin) / 2","Errore relativo × 100"],a:0,e:"L'errore assoluto è la semidifferenza tra il valore massimo e il minimo misurati."},
{id:"fl1_037",t:"fl1",p:"1.5.3",l:2,q:"Quante sono le cifre significative di 0,0240?",o:["3","2","4","5"],a:0,e:"Gli zeri davanti non contano; contano 2, 4 e lo zero finale dopo il 4 (che dice «0 decimi di millesimo»). Quindi 3 cifre significative."},
{id:"fl1_038",t:"fl1",p:"1.5.2",l:2,q:"Quale grandezza esprime la precisione (accuratezza) di una misura?",o:["L'errore relativo (o percentuale)","L'errore assoluto","Il valore medio","L'unità di misura"],a:0,e:"Errore relativo e percentuale sono indici di accuratezza: più sono piccoli, più la misura è precisa. L'errore assoluto da solo non basta."},
{id:"fl1_039",t:"fl1",p:"1.5.2",l:3,q:"Larghezza (180 ± 0,2) cm e altezza (80 ± 0,1) cm di un tavolo. Quale misura è più precisa?",o:["La larghezza","L'altezza","Hanno la stessa precisione","Servono gli errori sistematici per dirlo"],a:0,e:"Errori relativi: 0,2/180 ≈ 0,11% e 0,1/80 ≈ 0,13%. La larghezza è più precisa, pur avendo l'errore assoluto maggiore."},
{id:"fl1_040",t:"fl1",p:"1.5.4",l:3,q:"Il lato di un quadrato misura (10 ± 2) cm. Qual è l'errore assoluto sul perimetro?",o:["8 cm","2 cm","4 cm","40 cm"],a:0,e:"P = L + L + L + L: in una somma si sommano gli errori assoluti, quindi 4 · 2 = 8 cm (errore relativo 8/40 = 0,2)."},
{id:"fl1_041",t:"fl1",p:"1.5.4",l:3,q:"Il lato di un quadrato misura (10 ± 2) cm. Qual è l'errore assoluto sull'area?",o:["40 cm²","4 cm²","8 cm²","20 cm²"],a:0,e:"A = L · L = 100 cm². In un prodotto si sommano gli errori relativi: 0,2 + 0,2 = 0,4. Errore assoluto = 0,4 · 100 = 40 cm²."},
{id:"fl1_042",t:"fl1",p:"1.5.3",l:3,q:"Con uno strumento sensibile al centimetro si ottiene un valore medio di 15,4 cm. Come va scritta la misura?",o:["15 cm","15,4 cm","154 mm","15,40 cm"],a:0,e:"Lo strumento non distingue i millimetri, quindi scriverli non ha senso: la misura corretta è 15 cm, con 2 cifre significative."},
{id:"fl1_043",t:"fl1",p:"1.4.2",l:4,q:"Tre forze non nulle sono applicate all'origine e giacciono tutte nel primo quadrante. Per quali moduli la loro risultante può essere nulla?",o:["Mai, qualunque siano i moduli","3, 4 e 5","0,5, 0,5 e 1","1, 2 e 4"],a:0,e:"Tutte e tre hanno componenti positive su x e y, quindi anche la loro somma ha componenti positive: la risultante non può mai annullarsi."},
{id:"fl1_044",t:"fl1",p:"1.3",l:4,q:"Sapendo che 1 Å = 10⁻¹⁰ m, quale uguaglianza è corretta?",o:["50 km = 5 · 10¹⁴ Å","50 km = 5 · 10¹³ Å","50 km = 5 · 10⁻⁶ Å","50 km = 5 · 10¹¹ Å"],a:0,e:"50 km = 5 · 10⁴ m; dividendo per 10⁻¹⁰ m/Å si ottiene 5 · 10⁴ · 10¹⁰ = 5 · 10¹⁴ Å."},
{id:"fl1_045",t:"fl1",p:"1.5.4",l:4,q:"Un lato misura (20,0 ± 0,1) cm e l'altro (5,0 ± 0,1) cm. Qual è l'errore percentuale sull'area del rettangolo?",o:["2,5%","0,5%","2%","0,2%"],a:0,e:"Errori percentuali: 0,1/20 = 0,5% e 0,1/5 = 2%. Nel prodotto si sommano: 0,5% + 2% = 2,5%."},
{id:"fl1_046",t:"fl1",p:"1.4.2",l:4,q:"Due vettori a e b hanno moduli 4 e 2. Se sono perpendicolari, quanto valgono |a + b| e |a − b|?",o:["Entrambi 2√5","6 e 2","2√5 e 2","6 e 2√5"],a:0,e:"Per vettori ortogonali sia la somma sia la differenza si calcolano con Pitagora: √(16 + 4) = √20 = 2√5. Hanno lo stesso modulo ma direzioni diverse."},
{id:"fl1_047",t:"fl1",p:"1.1.2",l:4,q:"Un angolo di 2π rad è…",o:["l'angolo giro, una grandezza adimensionale","un angolo piatto con dimensioni [L]","un numero puro pari a 3,14","un angolo retto"],a:0,e:"Gli angoli in radianti sono grandezze adimensionali. 2π rad è l'angolo giro; 2π da solo (senza «rad») è solo un numero puro, circa 6,28."},
{id:"fl1_048",t:"fl1",p:"1.1",l:1,q:"Che cosa significa misurare una grandezza fisica?",o:["Fissare un'unità di misura e stabilire quante volte è contenuta nella grandezza","Descriverla a parole","Stimarla a occhio","Confrontarla con un'altra grandezza qualsiasi"],a:0,e:"Misurare vuol dire confrontare la grandezza con un riferimento fissato (l'unità di misura): da qui la definizione operativa delle grandezze fisiche."},
{id:"fl1_049",t:"fl1",p:"1.1",l:2,q:"Che cosa si intende per definizione operativa di una grandezza fisica?",o:["Una definizione legata al procedimento con cui la grandezza si misura","Una definizione solo matematica","La definizione della sua unità nel CGS","Una definizione valida solo in laboratorio"],a:0,e:"Le grandezze fisiche sono tali solo se si possono misurare; la loro definizione è quindi legata al procedimento di misura."},
{id:"fl1_050",t:"fl1",p:"1.1.1",l:2,q:"Come si indicano le dimensioni delle grandezze fondamentali?",o:["Con una lettera tra parentesi quadre, per esempio [L] per la lunghezza","Con il simbolo dell'unità di misura tra tonde","Con un numero","Con una freccia"],a:0,e:"A ogni grandezza fondamentale è associata una lettera tra quadre: [L] lunghezza, [M] massa, [T] tempo, [i] corrente, [K] temperatura."},
{id:"fl1_051",t:"fl1",p:"1.3.1",l:1,q:"Nella notazione scientifica a · 10ᵇ, quante cifre diverse da zero ci sono prima della virgola in a?",o:["Una sola","Due","Nessuna","Quante se ne vuole"],a:0,e:"a è un decimale con una sola cifra diversa da zero prima della virgola; b è un intero."},
{id:"fl1_052",t:"fl1",p:"1.3.1",l:2,q:"Come si scrive −562,5 in notazione scientifica?",o:["−5,625 · 10²","−56,25 · 10¹","−5,625 · 10³","−0,5625 · 10³"],a:0,e:"Si sposta la virgola di due posti verso sinistra: −5,625 · 10²."},
{id:"fl1_053",t:"fl1",p:"1.4",l:1,q:"In un vettore, che cosa rappresenta la lunghezza della freccia?",o:["Il modulo (intensità)","La direzione","Il verso","Il punto di applicazione"],a:0,e:"La direzione è la retta su cui giace la freccia, il verso è indicato dalla punta, il punto di partenza è il punto di applicazione."},
{id:"fl1_054",t:"fl1",p:"1.4.1",l:1,q:"Moltiplicando un vettore a per 2, che cosa si ottiene?",o:["Un vettore con la stessa direzione e lo stesso verso, di modulo doppio","Un vettore perpendicolare ad a","Uno scalare pari a 2|a|","Un vettore di verso opposto"],a:0,e:"|2a| = 2|a|; con uno scalare positivo il verso resta concorde."},
{id:"fl1_055",t:"fl1",p:"1.4.1",l:2,q:"Che cos'è l'opposto di un vettore a?",o:["Il vettore −a, con lo stesso modulo e verso opposto","Un vettore perpendicolare ad a","Il vettore con modulo 1/|a|","Un vettore nullo"],a:0,e:"L'opposto si ottiene moltiplicando a per −1: stessa direzione e modulo, verso opposto."},
{id:"fl1_056",t:"fl1",p:"1.4.3",l:1,q:"Che cosa sono le componenti di un vettore su un sistema cartesiano?",o:["Le sue proiezioni ortogonali sugli assi","I suoi multipli","Il suo modulo e la sua direzione","Le sue diagonali"],a:0,e:"Sono i due vettori paralleli agli assi x e y la cui somma dà il vettore."},
{id:"fl1_057",t:"fl1",p:"1.4.3",l:2,q:"Un vettore di modulo 10 forma un angolo di 60° con l'asse x. Quanto vale la sua componente lungo x?",o:["5","5√3","10","8,66 · 10"],a:0,e:"|vₓ| = v · cos 60° = 10 · ½ = 5; la componente lungo y vale 10 · sen 60° = 5√3."},
{id:"fl1_058",t:"fl1",p:"1.5",l:2,q:"Perché gli errori sistematici sono considerati i più «pericolosi»?",o:["Perché sono difficili da individuare e non si riducono facendo la media","Perché sono sempre molto grandi","Perché sono casuali","Perché dipendono dall'operatore"],a:0,e:"Avvengono sempre nello stesso verso (per eccesso o per difetto), per esempio per difetti dello strumento."},
{id:"fl1_059",t:"fl1",p:"1.5.1",l:1,q:"Come si calcola la media aritmetica di n misure x₁, x₂, …, xₙ?",o:["(x₁ + x₂ + … + xₙ) / n","(xmax − xmin) / 2","x₁ · x₂ · … · xₙ","(xmax + xmin) · n"],a:0,e:"M = (x₁ + x₂ + … + xₙ)/n."},
{id:"fl1_060",t:"fl1",p:"1.5.1",l:2,q:"A che cosa serve fare più misure della stessa grandezza e calcolarne la media?",o:["A ridurre gli errori accidentali","A eliminare gli errori sistematici","A cambiare la sensibilità dello strumento","A ridurre le cifre significative"],a:0,e:"Gli errori accidentali sono per eccesso o per difetto e nella media tendono a compensarsi."},
{id:"fl1_061",t:"fl1",p:"1.5.1",l:2,q:"Tre misure di una lunghezza danno 12,0 cm, 12,4 cm e 12,2 cm. Qual è il valore medio?",o:["12,2 cm","12,4 cm","36,6 cm","0,2 cm"],a:0,e:"M = (12,0 + 12,4 + 12,2)/3 = 36,6/3 = 12,2 cm (l'errore assoluto sarebbe (12,4 − 12,0)/2 = 0,2 cm)."},
{id:"fl1_062",t:"fl1",p:"1.5.3",l:1,q:"Quante cifre significative ha 1,205?",o:["4","3","2","5"],a:0,e:"Le cifre diverse da zero sono significative e anche gli zeri compresi tra due cifre diverse da zero: 1, 2, 0, 5."},
{id:"fl2_001",t:"fl2",p:"2.1",l:1,q:"Quando un'automobile si può considerare un punto materiale?",o:["Quando i suoi spostamenti sono molto grandi rispetto alle sue dimensioni","Mai, perché è un corpo esteso","Solo quando è ferma","Solo se ha massa trascurabile"],a:0,e:"Considerare un corpo puntiforme dipende dal confronto tra le sue dimensioni e le altre lunghezze in gioco: un'auto che percorre chilometri si può trattare come un punto."},
{id:"fl2_002",t:"fl2",p:"2.1",l:1,q:"Che cos'è la traiettoria di un punto materiale?",o:["La linea che unisce tutte le posizioni occupate nel tempo","Il vettore che va dalla posizione iniziale a quella finale","La distanza totale percorsa","La velocità in ogni punto"],a:0,e:"La traiettoria è la linea di tutte le posizioni occupate. Il vettore dalla posizione iniziale alla finale è invece lo spostamento."},
{id:"fl2_003",t:"fl2",p:"2.1",l:2,q:"Perché si dice che ogni moto è «relativo»?",o:["Perché quiete e moto hanno senso solo rispetto a un sistema di riferimento scelto","Perché la velocità è sempre costante","Perché dipende dalla massa del corpo","Perché la traiettoria è sempre curva"],a:0,e:"Dire che un oggetto è fermo o in moto ha senso solo dopo aver fissato un sistema di riferimento, considerato fisso; nel libro di solito è un sistema solidale con la Terra."},
{id:"fl2_004",t:"fl2",p:"2.2.2",l:1,q:"A quanti m/s corrispondono 72 km/h?",o:["20 m/s","259,2 m/s","7,2 m/s","36 m/s"],a:0,e:"Da km/h a m/s si divide per 3,6: 72 / 3,6 = 20 m/s."},
{id:"fl2_005",t:"fl2",p:"2.2.3",l:1,q:"Qual è l'unità di misura dell'accelerazione nel SI?",o:["m/s²","m/s","m²/s","km/h"],a:0,e:"a = Δv/Δt, quindi (m/s)/s = m/s². Nel CGS si usa cm/s²."},
