{id:'bi_metab9',t:'bi_metab',l:1,q:`Che cos'è il metabolismo?`,o:[`L'insieme di tutte le reazioni chimiche che avvengono in una cellula o in un organismo`,`La sola digestione degli alimenti`,`L'insieme dei geni di un organismo`,`La divisione della cellula`],a:0,e:`Il metabolismo comprende il catabolismo (degradazione di molecole con rilascio di energia) e l'anabolismo (sintesi di molecole con consumo di energia).`},
{id:'bi_metab10',t:'bi_metab',l:1,q:`Quale pigmento cattura la luce nella fotosintesi?`,o:[`Clorofilla`,`Emoglobina`,`Melanina`,`Cheratina`],a:0,e:`La clorofilla, contenuta nei cloroplasti, assorbe soprattutto luce rossa e blu e riflette il verde: per questo le foglie appaiono verdi.`},
{id:'bi_metab11',t:'bi_metab',l:1,q:`Che cosa sono le reazioni anaboliche?`,o:[`Reazioni che costruiscono molecole complesse da molecole semplici consumando energia`,`Reazioni che degradano molecole liberando energia`,`Reazioni che non richiedono enzimi`,`Reazioni che avvengono solo nel nucleo`],a:0,e:`Esempi di anabolismo sono la sintesi delle proteine e la fotosintesi. Il catabolismo, come la respirazione cellulare, degrada molecole liberando energia.`},
{id:'bi_metab12',t:'bi_metab',l:1,q:`Come si chiamano i processi che producono ATP senza usare ossigeno?`,o:[`Fermentazioni`,`Fotosintesi`,`Respirazione aerobica`,`Traduzione`],a:0,e:`Le fermentazioni (lattica e alcolica) partono dalla glicolisi e rigenerano il NAD⁺ senza ossigeno, ma producono molto meno ATP della respirazione.`},
{id:'bi_metab13',t:'bi_metab',l:2,q:`Quali prodotti si ottengono dalla fermentazione alcolica del glucosio?`,o:[`Etanolo e anidride carbonica`,`Acido lattico e acqua`,`Solo acqua`,`Acetato e ossigeno`],a:0,e:`I lieviti trasformano il piruvato in etanolo con rilascio di CO₂: è il processo alla base di vino, birra e lievitazione del pane.`},
{id:'bi_metab14',t:'bi_metab',l:2,q:`Dove avvengono le reazioni della fase luminosa della fotosintesi?`,o:[`Nelle membrane dei tilacoidi dei cloroplasti`,`Nello stroma`,`Nella matrice mitocondriale`,`Nel nucleo`],a:0,e:`I pigmenti e la catena di trasporto sono nelle membrane dei tilacoidi: qui si formano ATP e NADPH. Il ciclo di Calvin avviene nello stroma.`},
{id:'bi_metab15',t:'bi_metab',l:2,q:`Quali molecole prodotte dalla fase luminosa vengono usate nel ciclo di Calvin?`,o:[`ATP e NADPH`,`Glucosio e ossigeno`,`CO₂ e acqua`,`ADP e NADP⁺`],a:0,e:`Nel ciclo di Calvin l'ATP fornisce energia e il NADPH potere riducente per trasformare la CO₂ in zuccheri.`},
{id:'bi_metab16',t:'bi_metab',l:2,q:`Da quale molecola deriva l'ossigeno liberato nella fotosintesi?`,o:[`Dall'acqua`,`Dall'anidride carbonica`,`Dal glucosio`,`Dall'ATP`],a:0,e:`Nella fase luminosa la fotolisi dell'acqua libera elettroni, protoni e O₂. L'ossigeno dell'anidride carbonica finisce invece nei carboidrati e nell'acqua prodotta.`},
{id:'bi_metab17',t:'bi_metab',l:2,q:`Quale molecola entra nel ciclo di Krebs?`,o:[`Acetil-CoA`,`Glucosio`,`Lattato`,`Etanolo`],a:0,e:`Il piruvato viene prima trasformato in acetil-CoA (decarbossilazione ossidativa); l'acetil-CoA si combina con l'ossalacetato e dà inizio al ciclo di Krebs.`},
{id:'bi_metab18',t:'bi_metab',l:2,q:`Qual è il prodotto finale della glicolisi, per ogni molecola di glucosio?`,o:[`Due molecole di piruvato`,`Due molecole di glucosio`,`Sei molecole di CO₂`,`Una molecola di ATP soltanto`],a:0,e:`La glicolisi scinde il glucosio (6 C) in due molecole di piruvato (3 C), con una resa netta di 2 ATP e 2 NADH.`},
{id:'bi_metab19',t:'bi_metab',l:2,q:`Dove avviene nei mitocondri la catena di trasporto degli elettroni?`,o:[`Nella membrana mitocondriale interna`,`Nella matrice`,`Nella membrana esterna`,`Nel citoplasma`],a:0,e:`I complessi della catena respiratoria sono nelle creste della membrana interna, dove creano il gradiente protonico usato dall'ATP sintasi.`},
{id:'bi_metab20',t:'bi_metab',l:3,q:`Qual è l'accettore finale degli elettroni nella catena di trasporto mitocondriale?`,o:[`L'ossigeno`,`Il NAD⁺`,`L'anidride carbonica`,`Il glucosio`],a:0,e:`Alla fine della catena gli elettroni riducono l'O₂ ad acqua. Senza ossigeno la catena si blocca e la respirazione aerobica si ferma.`},
{id:'bi_metab21',t:'bi_metab',l:3,q:`Che cosa fa l'ATP sintasi?`,o:[`Sintetizza ATP sfruttando il flusso di protoni secondo il loro gradiente`,`Scinde l'ATP in ADP e fosfato per fornire energia`,`Trasporta ossigeno`,`Replica il DNA`],a:0,e:`I protoni pompati dalla catena respiratoria rientrano nella matrice attraverso l'ATP sintasi: il flusso fa ruotare l'enzima e rende possibile l'unione di ADP e fosfato.`},
{id:'bi_metab22',t:'bi_metab',l:3,q:`Quante molecole di CO₂ si liberano dalla completa ossidazione di una molecola di glucosio nella respirazione cellulare?`,o:[`6`,`2`,`12`,`1`],a:0,e:`Il glucosio ha 6 atomi di carbonio, che vengono tutti rilasciati come CO₂: 2 molecole dalla decarbossilazione dei due piruvati in acetil-CoA e 4 dai due giri del ciclo di Krebs, in totale 6.`},
{id:'bi_metab23',t:'bi_metab',l:3,q:`Che cosa accade al piruvato nelle cellule muscolari in assenza di ossigeno?`,o:[`Viene ridotto a lattato, rigenerando NAD⁺`,`Entra nel ciclo di Krebs`,`Si trasforma in glucosio nel nucleo`,`Si trasforma in ossigeno`],a:0,e:`La riduzione del piruvato a lattato ossida il NADH a NAD⁺, necessario per continuare la glicolisi anche senza ossigeno.`},
{id:'bi_metab24',t:'bi_metab',l:3,q:`Quale enzima fissa l'anidride carbonica nel ciclo di Calvin?`,o:[`RuBisCO`,`ATP sintasi`,`DNA polimerasi`,`Pepsina`],a:0,e:`La ribulosio-1,5-bisfosfato carbossilasi/ossigenasi (RuBisCO) lega la CO₂ al ribulosio bisfosfato ed è considerata l'enzima più abbondante sulla Terra.`},
{id:'bi_metab25',t:'bi_metab',l:3,q:`Qual è il ruolo del NAD⁺ nel metabolismo?`,o:[`Accettore di elettroni (si riduce a NADH) nelle ossidazioni`,`Enzima che sintetizza ATP`,`Pigmento fotosintetico`,`Componente della membrana`],a:0,e:`Il NAD⁺ raccoglie elettroni e protoni nella glicolisi e nel ciclo di Krebs, trasformandosi in NADH, che li cede poi alla catena di trasporto.`},
{id:'bi_gapp7',t:'bi_gapp',l:1,q:`Quali sono i gruppi sanguigni del sistema ABO?`,o:[`A, B, AB e 0`,`A, B, C e D`,`1, 2, 3 e 4`,`Rh positivo e Rh negativo`],a:0,e:`Il sistema ABO dipende dagli antigeni A e B presenti sulla superficie dei globuli rossi: si hanno i gruppi A, B, AB (entrambi) e 0 (nessuno).`},
{id:'bi_gapp8',t:'bi_gapp',l:1,q:`Qual è il genotipo di una persona di gruppo sanguigno AB?`,o:[`IᴬIᴮ`,`ii`,`IᴬIᴬ`,`Iᴮi`],a:0,e:`Gli alleli Iᴬ e Iᴮ sono codominanti: la persona AB li possiede entrambi e li esprime tutti e due.`},
{id:'bi_gapp9',t:'bi_gapp',l:1,q:`Quali cromosomi sessuali ha una donna?`,o:[`XX`,`XY`,`XO`,`YY`],a:0,e:`Le donne hanno due cromosomi X, gli uomini un X e un Y. Il sesso del figlio dipende dallo spermatozoo, che porta X o Y.`},
{id:'bi_gapp10',t:'bi_gapp',l:1,q:`Quale combinazione di cromosomi sessuali determina il sesso maschile?`,o:[`XY`,`XX`,`XXX`,`YY`],a:0,e:`Il cromosoma Y contiene il gene SRY, che avvia lo sviluppo dei testicoli.`},
{id:'bi_gapp11',t:'bi_gapp',l:1,q:`Che cosa significa essere Rh positivo?`,o:[`Avere l'antigene Rh sulla superficie dei globuli rossi`,`Avere più globuli rossi del normale`,`Non avere anticorpi`,`Avere il gruppo sanguigno 0`],a:0,e:`Il fattore Rh (antigene D) è presente nelle persone Rh+ e assente in quelle Rh−.`},
{id:'bi_gapp12',t:'bi_gapp',l:1,q:`Che cos'è una mutazione genetica?`,o:[`Una variazione stabile della sequenza del DNA`,`Una malattia infettiva`,`Un cambiamento temporaneo del fenotipo dovuto all'ambiente`,`Una divisione cellulare`],a:0,e:`Le mutazioni possono essere neutre, dannose o vantaggiose, e se avvengono nei gameti possono essere trasmesse ai figli.`},
{id:'bi_gapp13',t:'bi_gapp',l:2,q:`Quale gruppo sanguigno è considerato donatore universale per i globuli rossi?`,o:[`0 (Rh negativo)`,`AB (Rh positivo)`,`A (Rh positivo)`,`B (Rh negativo)`],a:0,e:`I globuli rossi di gruppo 0 non portano gli antigeni A e B e, se Rh negativi, nemmeno l'Rh: possono essere trasfusi a quasi tutti.`},
{id:'bi_gapp14',t:'bi_gapp',l:2,q:`Da quali gruppi può ricevere globuli rossi una persona di gruppo AB?`,o:[`A, B, AB e 0`,`Solo AB`,`Solo A e B`,`Solo 0`],a:0,e:`La persona AB non ha anticorpi anti-A né anti-B nel plasma: per questo è detta ricevente universale per i globuli rossi.`},
{id:'bi_gapp15',t:'bi_gapp',l:2,q:`Perché le malattie recessive legate a X, come l'emofilia, sono più frequenti negli uomini?`,o:[`Perché hanno un solo cromosoma X: basta un allele recessivo per manifestarsi`,`Perché il cromosoma Y contiene l'allele malato`,`Perché le donne non hanno il cromosoma X`,`Perché il maschio ha due X`],a:0,e:`Nell'uomo non c'è un secondo X che compensi con un allele dominante. Una donna deve ereditare l'allele recessivo da entrambi i genitori.`},
{id:'bi_gapp16',t:'bi_gapp',l:2,q:`Un padre emofilico (XʰY) ha figli con una madre non portatrice (XᴴXᴴ). Come sono i figli?`,o:[`Figlie portatrici sane, figli sani`,`Tutte le figlie emofiliche`,`Metà dei figli maschi emofilici`,`Tutti i figli emofilici`],a:0,e:`Le figlie ricevono l'Xʰ del padre e un Xᴴ dalla madre: sono portatrici. I figli ricevono la Y dal padre e un Xᴴ dalla madre: sono sani.`},
{id:'bi_gapp17',t:'bi_gapp',l:2,q:`Genitori di gruppo 0 e AB. Quali gruppi possono avere i figli?`,o:[`A oppure B`,`Solo AB`,`0 oppure AB`,`A, B, AB e 0`],a:0,e:`Il genitore 0 è ii e il genitore AB è IᴬIᴮ: i figli possono essere Iᴬi (gruppo A) o Iᴮi (gruppo B). Non possono essere né 0 né AB.`},
{id:'bi_gapp18',t:'bi_gapp',l:2,q:`Che cos'è la sindrome di Down?`,o:[`Una condizione dovuta alla presenza di tre copie del cromosoma 21`,`Una malattia recessiva legata a X`,`Una carenza di un enzima`,`Una malattia infettiva`],a:0,e:`Nella forma più comune (trisomia 21) le cellule hanno 47 cromosomi invece di 46, per un errore di non-disgiunzione durante la meiosi.`},
{id:'bi_gapp19',t:'bi_gapp',l:2,q:`Che cosa sono gli alleli multipli?`,o:[`Più di due forme alternative di uno stesso gene presenti nella popolazione`,`Più geni per lo stesso carattere`,`Più di due alleli in una stessa persona`,`Alleli che non mutano mai`],a:0,e:`Il gruppo sanguigno ABO ne è un esempio: esistono tre alleli (Iᴬ, Iᴮ, i), ma ogni individuo ne ha solo due.`},
{id:'bi_gapp20',t:'bi_gapp',l:3,q:`Una donna di gruppo A (Iᴬi) e un uomo di gruppo B (Iᴮi) hanno un figlio. Qual è la probabilità che sia di gruppo 0?`,o:[`1/4`,`1/2`,`1/8`,`0`],a:0,e:`Per essere 0 il figlio deve ricevere l'allele i da entrambi: 1/2 · 1/2 = 1/4.`},
{id:'bi_gapp21',t:'bi_gapp',l:3,q:`Una donna portatrice di daltonismo (XᴰXᵈ) ha figli con un uomo non daltonico (XᴰY). Qual è la probabilità che una figlia sia daltonica?`,o:[`0`,`1/2`,`1/4`,`1`],a:0,e:`Tutte le figlie ricevono l'Xᴰ del padre, quindi hanno almeno un allele normale e non sono daltoniche (la metà sarà portatrice). Solo i figli maschi hanno il 50% di probabilità di essere daltonici.`},
{id:'bi_gapp22',t:'bi_gapp',l:3,q:`Due genitori portatori di fibrosi cistica (malattia autosomica recessiva) hanno un figlio. Qual è la probabilità che sia malato?`,o:[`1/4`,`1/2`,`3/4`,`1/8`],a:0,e:`Incrocio Aa × Aa: la probabilità del genotipo aa è 1/4.`},
{id:'bi_gapp23',t:'bi_gapp',l:3,q:`In una popolazione in equilibrio di Hardy-Weinberg, una malattia recessiva ha frequenza q² = 1/10 000 (cioè q = 0,01). Qual è la frequenza approssimata dei portatori (2pq)?`,o:[`circa il 2% (1 su 50)`,`circa lo 0,01% (1 su 10 000)`,`circa il 25%`,`circa l'1% (1 su 100)`],a:0,e:`Con q = 0,01 si ha p = 0,99 e 2pq = 2 · 0,99 · 0,01 ≈ 2%, cioè circa 1 persona su 50.`},
{id:'bi_gapp24',t:'bi_gapp',l:3,q:`Quale cariotipo caratterizza la sindrome di Turner?`,o:[`45,X`,`47,XXY`,`47,XY,+21`,`46,XY`],a:0,e:`Le donne con sindrome di Turner hanno un solo cromosoma X (monosomia X): 45 cromosomi in totale. 47,XXY è la sindrome di Klinefelter, 47,XY,+21 la sindrome di Down.`},
{id:'bi_gapp25',t:'bi_gapp',l:3,q:`Un uomo di gruppo A e una donna di gruppo B hanno un figlio di gruppo 0. Quali sono i genotipi dei genitori?`,o:[`Iᴬi e Iᴮi`,`IᴬIᴬ e IᴮIᴮ`,`IᴬIᴬ e Iᴮi`,`Iᴬi e IᴮIᴮ`],a:0,e:`Il figlio 0 è ii: ha ricevuto un allele i da ciascun genitore. Entrambi i genitori sono quindi eterozigoti, Iᴬi (gruppo A) e Iᴮi (gruppo B).`},
{id:'ch_atomo_sf1',t:'ch_atomo',l:4,q:`Il boro naturale è una miscela di due isotopi stabili, ¹⁰B e ¹¹B (masse atomiche approssimate 10 e 11), e la sua massa atomica media è 10,8. Qual è la percentuale approssimata di ¹⁰B nel boro naturale?`,o:[`20%`,`80%`,`10,8%`,`50%`],a:0,e:`Se x è la frazione di ¹⁰B: 10x + 11(1 − x) = 10,8, cioè 11 − x = 10,8, quindi x = 0,2 = 20%. L'80% è la percentuale di ¹¹B (il valore 10,8 è molto vicino a 11, quindi l'isotopo pesante prevale); 50% darebbe una media di 10,5; 10,8% confonde la massa media con una percentuale.`},
{id:'ch_atomo_sf2',t:'ch_atomo',l:4,q:`Lo iodio radioattivo ¹³¹I (Z = 53) viene captato dalla tiroide esattamente come lo iodio stabile ¹²⁷I. Quale affermazione ne spiega il motivo?`,o:[`Sono isotopi: hanno lo stesso Z e la stessa configurazione elettronica, ma diverso numero di neutroni`,`Sono isotopi: hanno lo stesso numero di neutroni, ma diverso numero di protoni ed elettroni`,`Sono isobari: hanno lo stesso numero di massa, ma diversa configurazione elettronica esterna`,`Sono ioni dello stesso elemento: hanno lo stesso numero di protoni, ma diverso numero di elettroni`],a:0,e:`Entrambi hanno Z = 53 e quindi 53 protoni e 53 elettroni nell'atomo neutro: la configurazione elettronica, che determina il comportamento chimico, è identica. Differiscono solo per i neutroni (78 per ¹³¹I e 74 per ¹²⁷I), perciò il numero di massa è diverso (non sono isobari) e il numero di protoni è lo stesso (non cambia Z).`},
{id:'ch_atomo_sf3',t:'ch_atomo',l:4,q:`Lo iodio radioattivo ¹³¹I, usato in medicina nucleare, ha un tempo di dimezzamento di circa 8 giorni. Trascurando l'eliminazione biologica, quale frazione di una dose iniziale è ancora presente (non decaduta) dopo 24 giorni?`,o:[`1/8 (12,5%)`,`1/3 (circa 33%)`,`1/4 (25%)`,`1/16 (6,25%)`],a:0,e:`24 giorni corrispondono a 24 / 8 = 3 tempi di dimezzamento. Ogni dimezzamento riduce a metà la quantità: 1 → 1/2 → 1/4 → 1/8 = 12,5%. 1/3 deriverebbe dall'errore di dividere linearmente per 3; 1/4 e 1/16 corrispondono a 2 e 4 emivite.`},
{id:'ch_atomo_sf4',t:'ch_atomo',l:4,q:`Le prime quattro energie di ionizzazione successive di un elemento sono, in MJ/mol: 0,74 – 1,45 – 7,7 – 10,5. A quale gruppo della tavola periodica appartiene l'elemento?`,o:[`Gruppo 2`,`Gruppo 1`,`Gruppo 13`,`Gruppo 14`],a:0,e:`L'energia aumenta di poco passando dal 1° al 2° elettrone (0,74 → 1,45) ma balza da 1,45 a 7,7 al 3°: dopo aver tolto due elettroni si attacca il guscio interno, molto più stabile. L'elemento ha quindi 2 elettroni di valenza, cioè è del gruppo 2 (i valori sono quelli del magnesio). Gruppo 1 darebbe un salto già dopo il primo elettrone; i gruppi 13 e 14 dopo il terzo e il quarto.`},
{id:'ch_atomo_sf5',t:'ch_atomo',l:4,q:`Lo zinco (Z = 30, atomo neutro [Ar] 3d¹⁰ 4s²) è un cofattore di molti enzimi, in cui si trova come ione Zn²⁺. Qual è la configurazione elettronica di Zn²⁺?`,o:[`[Ar] 3d¹⁰`,`[Ar] 3d⁸ 4s²`,`[Ar] 3d¹⁰ 4s²`,`[Ar] 3d⁹ 4s¹`],a:0,e:`Nella ionizzazione degli elementi di transizione si perdono per primi gli elettroni 4s, che sono quelli più esterni. Dall'atomo [Ar] 3d¹⁰ 4s² togliendo 2 elettroni si ottiene [Ar] 3d¹⁰, con sottolivello d completo e nessun elettrone spaiato. [Ar] 3d¹⁰ 4s² è l'atomo neutro; [Ar] 3d⁸ 4s² (come il nichel) e [Ar] 3d⁹ 4s¹ hanno 28 elettroni ma implicano la perdita di elettroni 3d invece dei 4s.`},
{id:'ch_atomo_sf6',t:'ch_atomo',l:4,q:`Nell'emoglobina il ferro si trova come Fe²⁺. Sapendo che l'atomo neutro di ferro (Z = 26) ha configurazione [Ar] 3d⁶ 4s², quanti elettroni spaiati ha lo ione libero Fe²⁺ nello stato fondamentale (regola di Hund)?`,o:[`4`,`2`,`5`,`6`],a:0,e:`Fe²⁺ perde i due elettroni 4s e diventa [Ar] 3d⁶. I cinque orbitali d si riempiono prima con un elettrone ciascuno a spin parallelo (5 spaiati) e il sesto elettrone si appaia in uno di essi: restano 4 elettroni spaiati. 5 sono quelli di Fe³⁺ (3d⁵), 6 è il numero di elettroni d, non di quelli spaiati.`},
{id:'ch_atomo_sf7',t:'ch_atomo',l:4,q:`Nelle cellule le concentrazioni di Na⁺ e K⁺ sono regolate dalla pompa Na⁺/K⁺. Quale ordine di raggio crescente è corretto per Na⁺, Na e K (Z: Na = 11, K = 19)?`,o:[`Na⁺ < Na < K`,`Na < Na⁺ < K`,`Na⁺ < K < Na`,`K < Na⁺ < Na`],a:0,e:`Un catione è più piccolo dell'atomo neutro: Na perdendo un elettrone perde l'intero terzo livello (resta 1s² 2s² 2p⁶) e aumenta la carica nucleare efficace sugli elettroni rimasti. K, nello stesso gruppo ma un periodo più sotto, ha un livello in più di Na. L'ordine è Na⁺ < Na < K.`},
{id:'ch_atomo_sf8',t:'ch_atomo',l:4,q:`Il magnesio naturale è una miscela di tre isotopi: ²⁴Mg (79%), ²⁵Mg (10%) e ²⁶Mg (11%). Quale valore approssimato ha la massa atomica media?`,o:[`24,3`,`25,0`,`24,0`,`24,8`],a:0,e:`Media pesata: 24 × 0,79 + 25 × 0,10 + 26 × 0,11 = 18,96 + 2,50 + 2,86 = 24,32, cioè circa 24,3. 25,0 sarebbe la media semplice dei tre numeri di massa, senza tener conto delle abbondanze; 24,0 considera solo l'isotopo più abbondante.`},
{id:'ch_atomo_sf9',t:'ch_atomo',l:4,q:`I metalli di transizione come Fe, Zn e Cu, essenziali in molti enzimi, hanno elettroni nel sottolivello 3d. Quanti orbitali ha il sottolivello 3d e quanti elettroni può contenere al massimo?`,o:[`5 orbitali, 10 elettroni`,`3 orbitali, 6 elettroni`,`5 orbitali, 5 elettroni`,`7 orbitali, 14 elettroni`],a:0,e:`Per un sottolivello con l = 2 (d) i valori di m sono −2, −1, 0, +1, +2: sono 5 orbitali. Ogni orbitale ospita al massimo 2 elettroni con spin opposto, quindi 5 × 2 = 10 elettroni. 3 orbitali e 6 elettroni sono quelli del sottolivello p; 7 e 14 quelli del sottolivello f; 5 elettroni dimenticherebbe lo spin.`},
{id:'ch_atomo_sf10',t:'ch_atomo',l:4,q:`In una lampada a idrogeno gli atomi eccitati emettono luce a due lunghezze d'onda diverse, una per la transizione elettronica n = 3 → n = 2 e una per n = 2 → n = 1. Quale affermazione è corretta?`,o:[`La transizione 2 → 1 emette fotoni più energetici e di lunghezza d'onda minore`,`La transizione 2 → 1 emette fotoni più energetici e di lunghezza d'onda maggiore`,`La transizione 3 → 2 emette fotoni più energetici perché parte da un livello più alto`,`Le due transizioni emettono fotoni con la stessa energia, perché il salto è di un livello`],a:0,e:`L'energia del fotone è la differenza tra i livelli: per 2 → 1 vale circa 13,6 × (1 − 1/4) = 10,2 eV, per 3 → 2 circa 13,6 × (1/4 − 1/9) = 1,9 eV. Poiché E = hc/λ, a energia maggiore corrisponde lunghezza d'onda minore. Conta la differenza tra i livelli, non il livello di partenza, e i livelli non sono equidistanti.`},
{id:'ch_legami_sf1',t:'ch_legami',l:4,q:`La glicina, il più semplice amminoacido, ha formula H₂N–CH₂–COOH (con un doppio legame C=O; tutti gli altri legami sono semplici). Quanti legami σ e π contiene la molecola?`,o:[`9 legami σ e 1 legame π`,`10 legami σ e 1 legame π`,`8 legami σ e 2 legami π`,`9 legami σ e 2 legami π`],a:0,e:`La molecola ha 10 atomi (N, 5 H, 2 C, 2 O) e non contiene anelli, quindi ha 10 − 1 = 9 legami σ (2 N–H, N–C, 2 C–H, C–C, C–O, O–H e il σ del C=O, cioè uno dei due legami del doppio legame): 9 in tutto. Il doppio legame C=O aggiunge un solo legame π, per cui π = 1. Contare il doppio legame come due σ porta a risposte errate.`},
{id:'ch_legami_sf2',t:'ch_legami',l:4,q:`Quale di queste specie attraversa più facilmente, per semplice diffusione, il doppio strato fosfolipidico di una membrana cellulare, la cui parte interna è idrofobica?`,o:[`O₂ (molecola piccola e apolare)`,`Na⁺ (ione con carica e guscio di idratazione)`,`Glucosio (molecola grande e molto polare)`,`HPO₄²⁻ (ione con doppia carica)`],a:0,e:`Il nucleo della membrana è formato da code idrocarburiche apolari: possono attraversarlo facilmente le molecole piccole e apolari come O₂. Ioni (Na⁺, HPO₄²⁻) e molecole molto polari come il glucosio sono circondati da molecole d'acqua tramite interazioni ione-dipolo o legami a idrogeno e non entrano nell'interno idrofobico: richiedono canali o trasportatori.`},
{id:'ch_legami_sf3',t:'ch_legami',l:4,q:`Si vogliono ordinare le molecole H₂O, NH₃ e CH₄ in base all'angolo di legame H–X–H. Qual è l'ordine crescente corretto?`,o:[`H₂O < NH₃ < CH₄`,`CH₄ < NH₃ < H₂O`,`NH₃ < H₂O < CH₄`,`H₂O < CH₄ < NH₃`],a:0,e:`In tutte e tre le molecole l'atomo centrale ha quattro coppie di elettroni disposte circa a tetraedro (109,5°). Le coppie solitarie respingono più di quelle di legame e comprimono gli angoli: H₂O ha 2 coppie solitarie (circa 104,5°), NH₃ ne ha 1 (circa 107°), CH₄ nessuna (109,5°). Più coppie solitarie, angolo più piccolo.`},
{id:'ch_legami_sf4',t:'ch_legami',l:4,q:`Gli atomi del gruppo –CO–NH– del legame peptidico giacciono sullo stesso piano e la rotazione attorno al legame C–N è fortemente impedita. Qual è la ragione?`,o:[`Per risonanza il legame C–N ha carattere parziale di doppio legame`,`Il legame C–N è un legame ionico tra un atomo di C e uno di N`,`L'azoto è ibridato sp³ e forma con il carbonio un legame σ rigido`,`Tra C e N si forma un legame a idrogeno intramolecolare di tipo rigido`],a:0,e:`La coppia solitaria dell'azoto è delocalizzata verso il carbonile (C=O): le due forme di risonanza conferiscono al legame C–N un carattere parziale di doppio legame, con rotazione ostacolata e geometria planare dell'azoto e degli atomi vicini. Non è un legame ionico (C e N condividono elettroni) e un azoto sp³ sarebbe piramidale, con rotazione libera.`},
{id:'ch_legami_sf5',t:'ch_legami',l:4,q:`Propano (CH₃CH₂CH₃), dimetiletere (CH₃OCH₃) ed etanolo (CH₃CH₂OH) hanno massa molecolare molto simile (44-46 u). Qual è l'ordine di punto di ebollizione crescente?`,o:[`propano < dimetiletere < etanolo`,`dimetiletere < propano < etanolo`,`etanolo < dimetiletere < propano`,`propano < etanolo < dimetiletere`],a:0,e:`A parità di massa contano le forze intermolecolari. Il propano è apolare e ha solo forze di London (bolle a circa −42 °C); il dimetiletere è polare e ha interazioni dipolo-dipolo ma non ha H legato a O (circa −24 °C); l'etanolo forma legami a idrogeno tramite il gruppo –OH (circa +78 °C).`},
{id:'ch_legami_sf6',t:'ch_legami',l:4,q:`La vitamina C (acido ascorbico, con quattro gruppi –OH) è idrosolubile, mentre la vitamina A (retinolo, con lunga catena idrocarburica e un solo –OH) è liposolubile. Quale spiegazione è corretta?`,o:[`I –OH della vitamina C formano legami a idrogeno con l'acqua; la catena apolare della A interagisce con i lipidi`,`La solubilità dipende solo dalla massa molecolare: la molecola più piccola, cioè la vitamina C, si scioglie in acqua`,`La vitamina A forma più legami a idrogeno con l'acqua perché ha una lunga catena idrocarburica ramificata`,`La vitamina C ha legami covalenti interni più forti e proprio per questo si scioglie bene in acqua`],a:0,e:`Vale la regola simile scioglie simile: i quattro gruppi –OH polari dell'acido ascorbico formano legami a idrogeno con l'acqua, mentre la lunga catena idrocarburica del retinolo è apolare e interagisce con i lipidi tramite forze di London. Massa molecolare e forza dei legami covalenti interni non determinano la solubilità; la catena lunga rende la A meno, non più, idrofila.`},
{id:'ch_legami_sf7',t:'ch_legami',l:4,q:`Il cloruro di sodio fonde a circa 800 °C, l'ossido di magnesio (MgO) a circa 2850 °C. Qual è la ragione principale di questa differenza?`,o:[`In MgO gli ioni hanno carica doppia (Mg²⁺ e O²⁻): l'attrazione nel reticolo è molto maggiore`,`In MgO gli atomi condividono coppie di elettroni formando un reticolo covalente tridimensionale`,`MgO è un solido molecolare in cui le molecole sono tenute insieme da legami a idrogeno`,`Il magnesio ha massa atomica maggiore del sodio, quindi servono temperature molto più alte per fonderlo`],a:0,e:`Entrambi sono solidi ionici. La forza di attrazione tra gli ioni cresce con il prodotto delle cariche (legge di Coulomb): in NaCl è (+1)(−1), in MgO è (+2)(−2), cioè quattro volte maggiore, con ioni anche piuttosto piccoli. Per questo il reticolo di MgO richiede molta più energia per essere distrutto. MgO non è né covalente né molecolare.`},
{id:'ch_legami_sf8',t:'ch_legami',l:4,q:`Un campione solido è trasparente e durissimo, non conduce la corrente né da solido né fuso, è insolubile in acqua e fonde a oltre 1500 °C. A quale tipo di solido appartiene più probabilmente?`,o:[`Solido covalente reticolare, come il quarzo (SiO₂)`,`Solido ionico, come il cloruro di sodio (NaCl)`,`Solido molecolare, come il ghiaccio (H₂O)`,`Solido metallico, come il ferro (Fe)`],a:0,e:`Durezza elevata, temperatura di fusione molto alta e mancanza di conducibilità indicano un reticolo tridimensionale di legami covalenti, in cui non ci sono elettroni liberi né ioni mobili. I solidi ionici conducono da fusi, quelli molecolari fondono a bassa temperatura e sono teneri, quelli metallici conducono anche da solidi.`},
{id:'ch_legami_sf9',t:'ch_legami',l:4,q:`Lo ione ammonio NH₄⁺ si forma da NH₃ e H⁺ e i suoi quattro legami N–H risultano equivalenti. Quale descrizione della formazione del quarto legame è corretta?`,o:[`L'azoto mette a disposizione la sua coppia solitaria per un legame covalente dativo con H⁺`,`L'idrogeno mette a disposizione una coppia di elettroni per legarsi all'azoto con un legame dativo`,`L'azoto cede un elettrone a H⁺ e i due si attraggono con un legame ionico`,`L'azoto promuove un elettrone in un orbitale vuoto e forma un quarto legame covalente normale`],a:0,e:`H⁺ non possiede elettroni ma ha l'orbitale 1s vuoto, mentre l'azoto di NH₃ ha una coppia solitaria: questa viene condivisa con H⁺ in un legame covalente dativo. Una volta formato, il legame è indistinguibile dagli altri tre e lo ione è tetraedrico. Il secondo legame è escluso perché H⁺ non ha elettroni da dare; l'azoto del secondo livello non ha orbitali vuoti in cui promuovere elettroni.`},
{id:'ch_legami_sf10',t:'ch_legami',l:4,q:`Perché l'evaporazione del sudore raffredda la pelle? (Il calore latente di vaporizzazione dell'acqua è elevato, circa 2,4 kJ/g.)`,o:[`Per diventare vapore le molecole d'acqua devono rompere legami a idrogeno, assorbendo molto calore dalla pelle`,`Evaporando, le molecole d'acqua formano nuovi legami a idrogeno con l'aria e liberano calore`,`L'evaporazione rompe i legami covalenti O–H delle molecole d'acqua, processo che assorbe calore`,`I sali disciolti nel sudore, passando nell'aria insieme al vapore, assorbono calore dalla pelle`],a:0,e:`Nell'acqua liquida ogni molecola è legata alle vicine da legami a idrogeno: per evaporare questi legami intermolecolari vanno rotti e l'energia necessaria, molto alta per l'acqua, viene sottratta alla pelle, che si raffredda. I legami covalenti O–H restano intatti (l'acqua vapore è sempre H₂O) e la formazione di legami libera calore, non lo assorbe.`},
{id:'ch_mole_sf1',t:'ch_mole',l:4,q:`La soluzione fisiologica contiene 0,9 g di NaCl ogni 100 mL (NaCl = 58,5 g/mol). Qual è, approssimativamente, la sua molarità?`,o:[`0,15 M`,`0,015 M`,`1,5 M`,`0,31 M`],a:0,e:`In 100 mL ci sono 0,9 g, quindi in 1 L ce ne sono 9 g. Moli = 9 / 58,5 ≈ 0,154 mol, quindi circa 0,15 M. 0,31 è la concentrazione di particelle (osmolarità, 2 ioni per formula), non la molarità del sale; 0,015 e 1,5 sono errori di fattore 10 sui volumi.`},
{id:'ch_mole_sf2',t:'ch_mole',l:4,q:`Per preparare 500 mL di una soluzione di KCl 0,1 M si parte da una soluzione concentrata 2 M. Quanti mL di soluzione concentrata vanno prelevati e portati a 500 mL con acqua?`,o:[`25 mL`,`100 mL`,`250 mL`,`2,5 mL`],a:0,e:`Si conserva il numero di moli: C₁V₁ = C₂V₂, quindi V₁ = 0,1 M × 500 mL / 2 M = 25 mL. 100 mL e 250 mL derivano da rapporti sbagliati (500 / 5 e 500 / 2), mentre 2,5 mL è un errore di fattore 10.`},
{id:'ch_mole_sf3',t:'ch_mole',l:4,q:`Un antiacido contiene 5,8 g di Mg(OH)₂ (M = 58 g/mol), che neutralizza l'acido cloridrico secondo Mg(OH)₂ + 2 HCl → MgCl₂ + 2 H₂O. Il succo gastrico è HCl circa 0,1 M. Quale volume di succo gastrico viene neutralizzato completamente?`,o:[`2 L`,`1 L`,`4 L`,`0,5 L`],a:0,e:`Moli di Mg(OH)₂ = 5,8 / 58 = 0,1 mol. Il rapporto stechiometrico è 1 : 2, quindi si neutralizzano 0,2 mol di HCl. Volume = n / C = 0,2 / 0,1 = 2 L. 1 L si ottiene dimenticando il coefficiente 2; 4 L moltiplica per 2 due volte; 0,5 L inverte il rapporto tra moli e concentrazione.`},
{id:'ch_mole_sf4',t:'ch_mole',l:4,q:`Nella respirazione cellulare il glucosio si ossida: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O. Quanti litri di CO₂ (gas ideale a 0 °C e 1 atm, 22,4 L/mol) si producono dall'ossidazione completa di 9 g di glucosio (M = 180 g/mol)?`,o:[`6,72 L`,`1,12 L`,`3,36 L`,`13,2 L`],a:0,e:`Moli di glucosio = 9 / 180 = 0,05 mol. Per ogni mole di glucosio si formano 6 mol di CO₂: 0,05 × 6 = 0,30 mol. Volume = 0,30 × 22,4 = 6,72 L. 1,12 L (0,05 × 22,4) dimentica il coefficiente 6; 3,36 L usa un rapporto 3 : 1; 13,2 è la massa in grammi di CO₂ (0,3 × 44), non un volume.`},
{id:'ch_mole_sf5',t:'ch_mole',l:4,q:`L'emoglobina ha massa molare di circa 65000 g/mol e contiene lo 0,34% in massa di ferro (Fe = 56 g/mol). Quanti atomi di ferro contiene una molecola di emoglobina?`,o:[`4`,`1`,`2`,`8`],a:0,e:`La massa di ferro in 1 mol di emoglobina è 0,0034 × 65000 ≈ 221 g. Dividendo per la massa molare del ferro: 221 / 56 ≈ 4 mol di Fe per mole di proteina, cioè 4 atomi per molecola (uno per ciascun gruppo eme). 1, 2 e 8 non sono compatibili con il calcolo (221 / 56 ≈ 3,95); 4 corrisponde ai quattro gruppi eme.`},
{id:'ch_mole_sf6',t:'ch_mole',l:4,q:`In un esame del sangue la glicemia a digiuno risulta 90 mg/dL. Qual è la concentrazione in mmol/L (glucosio M = 180 g/mol)?`,o:[`5 mmol/L`,`0,5 mmol/L`,`50 mmol/L`,`16,2 mmol/L`],a:0,e:`1 dL = 0,1 L, quindi 90 mg/dL = 900 mg/L = 0,9 g/L. Moli per litro = 0,9 / 180 = 0,005 mol/L = 5 mmol/L. 0,5 e 50 sono errori di fattore 10 nella conversione dei volumi; 16,2 si ottiene moltiplicando 90 per 0,18 invece di dividere per 18.`},
{id:'ch_mole_sf7',t:'ch_mole',l:4,q:`Una piccola bombola contiene 2,46 L di ossigeno medicale a 10 atm e 27 °C. Considerando O₂ un gas ideale (R = 0,082 L·atm/(mol·K), T in kelvin = °C + 273, O = 16 g/mol), quale massa di O₂ contiene?`,o:[`32 g`,`16 g`,`64 g`,`356 g`],a:0,e:`T = 27 + 273 = 300 K. Moli: n = PV / RT = (10 × 2,46) / (0,082 × 300) = 24,6 / 24,6 = 1 mol. La massa molare di O₂ è 32 g/mol, quindi 32 g. 16 g usa la massa dell'atomo O; 64 g raddoppia le moli; 356 g si ottiene inserendo 27 invece di 300 K.`},
{id:'ch_mole_sf8',t:'ch_mole',l:4,q:`Scaldando 5,6 g di ferro (Fe = 56 g/mol) in ossigeno si ottengono 8,0 g di un ossido di ferro (O = 16 g/mol). Qual è la formula minima dell'ossido?`,o:[`Fe₂O₃`,`FeO`,`Fe₃O₄`,`FeO₂`],a:0,e:`Massa di ossigeno = 8,0 − 5,6 = 2,4 g. Moli di Fe = 5,6 / 56 = 0,10 mol; moli di O = 2,4 / 16 = 0,15 mol. Rapporto Fe : O = 0,10 : 0,15 = 2 : 3, quindi Fe₂O₃. FeO sarebbe 1 : 1 (0,10 mol di O, 1,6 g); Fe₃O₄ sarebbe 3 : 4; FeO₂ 1 : 2.`},
{id:'ch_mole_sf9',t:'ch_mole',l:4,q:`Si hanno quattro soluzioni acquose (i sali si dissociano completamente; glucosio e urea restano come molecole): NaCl 0,2 M, glucosio 0,3 M, CaCl₂ 0,12 M, urea 0,25 M. Quale ha la maggiore concentrazione totale di particelle di soluto (osmolarità)?`,o:[`NaCl 0,2 M`,`Glucosio 0,3 M`,`CaCl₂ 0,12 M`,`Urea 0,25 M`],a:0,e:`Osmolarità = molarità × numero di particelle per unità formula. NaCl: 0,2 × 2 = 0,40 Osm/L; CaCl₂: 0,12 × 3 = 0,36; glucosio: 0,3 × 1 = 0,30; urea: 0,25. Il glucosio ha la molarità più alta ma non si dissocia; CaCl₂ dà 3 particelle ma la sua molarità è troppo bassa per superare NaCl.`},
{id:'ch_mole_sf10',t:'ch_mole',l:4,q:`100 mL di soluzione contengono 1,11 g di CaCl₂ (Ca = 40 g/mol, Cl = 35,5 g/mol), completamente dissociato in Ca²⁺ e 2 Cl⁻. Qual è la concentrazione di ioni Cl⁻?`,o:[`0,2 M`,`0,1 M`,`0,4 M`,`0,02 M`],a:0,e:`Massa molare di CaCl₂ = 40 + 2 × 35,5 = 111 g/mol, quindi 1,11 g = 0,01 mol. Per ogni CaCl₂ si liberano 2 Cl⁻: 0,02 mol di Cl⁻ in 0,1 L, cioè 0,2 M. 0,1 M è la molarità del sale (si dimentica il fattore 2); 0,4 M moltiplica per 2 una volta di troppo; 0,02 M corrisponde a dividere per 1 L invece che per 0,1 L.`},
{id:'ch_ph_sf1',t:'ch_ph',l:4,q:`Nel plasma il sistema tampone bicarbonato/CO₂ ha pKa = 6,1. Se [HCO₃⁻] = 24 mmol/L e la [CO₂] disciolta è 1,2 mmol/L, quanto vale il pH? (Usare log 2 = 0,3.)`,o:[`7,4`,`7,1`,`4,8`,`6,1`],a:0,e:`Equazione di Henderson-Hasselbalch: pH = pKa + log([HCO₃⁻]/[CO₂]) = 6,1 + log(24/1,2) = 6,1 + log 20 = 6,1 + (1 + 0,3) = 7,4. 7,1 corrisponde a un rapporto 10 (log 10 = 1); 4,8 si ottiene invertendo il rapporto (6,1 − 1,3); 6,1 corrisponderebbe a un rapporto 1 : 1.`},
{id:'ch_ph_sf2',t:'ch_ph',l:4,q:`Un paziente con grave ipoventilazione non riesce a eliminare CO₂ con la respirazione. Considerando l'equilibrio CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻, che cosa accade al pH del sangue?`,o:[`Diminuisce, perché l'accumulo di CO₂ sposta l'equilibrio verso destra e aumenta [H⁺]`,`Aumenta, perché l'accumulo di CO₂ sposta l'equilibrio verso sinistra e consuma H⁺`,`Resta invariato, perché il tampone bicarbonato annulla qualsiasi variazione di CO₂`,`Aumenta, perché la CO₂ è un composto apolare con carattere basico in acqua`],a:0,e:`Più CO₂ disciolta significa più H₂CO₃ e, per il principio di Le Châtelier, un equilibrio spostato verso destra con produzione di H⁺ (acidosi respiratoria): il pH scende. Il tampone attenua la variazione ma non può annullarla; la CO₂ in acqua forma acido carbonico, quindi ha carattere acido.`},
{id:'ch_ph_sf3',t:'ch_ph',l:4,q:`Una soluzione 0,1 M di una base debole B ha Kb = 1 × 10⁻⁵ (B + H₂O ⇌ BH⁺ + OH⁻). Usando l'approssimazione [OH⁻] = √(Kb · C), quanto vale il pH a 25 °C?`,o:[`11`,`3`,`9`,`13`],a:0,e:`[OH⁻] = √(10⁻⁵ × 10⁻¹) = √10⁻⁶ = 10⁻³ M, quindi pOH = 3 e pH = 14 − 3 = 11. 3 è il pOH (ci si dimentica di convertire); 13 sarebbe il pH di una base forte 0,1 M completamente dissociata; 9 si ottiene usando Kb come [OH⁻] (pOH = 5).`},
{id:'ch_ph_sf4',t:'ch_ph',l:4,q:`1 L di tampone contiene 0,2 mol di CH₃COOH e 0,2 mol di CH₃COONa (pKa = 4,76). Si aggiungono 0,1 mol di HCl senza variazioni di volume. Quale pH si ottiene circa? (Usare log 3 = 0,48.)`,o:[`4,3`,`4,8`,`5,2`,`1,0`],a:0,e:`L'HCl reagisce con l'acetato: CH₃COO⁻ + H⁺ → CH₃COOH. Restano 0,1 mol di acetato e ci sono 0,3 mol di acido. pH = 4,76 + log(0,1/0,3) = 4,76 − 0,48 = 4,28, cioè circa 4,3. 4,8 sarebbe il pH iniziale (nessuna variazione); 5,2 si ha invertendo il rapporto; 1,0 è il pH di HCl 0,1 M, che qui è stato in gran parte consumato dal tampone.`},
{id:'ch_ph_sf5',t:'ch_ph',l:4,q:`20 mL di una soluzione di acido solforico (acido forte diprotico, H₂SO₄ → 2 H⁺ + SO₄²⁻) sono neutralizzati completamente da 40 mL di NaOH 0,1 M. Qual è la molarità dell'acido solforico?`,o:[`0,1 M`,`0,2 M`,`0,05 M`,`0,4 M`],a:0,e:`Moli di NaOH = 0,040 L × 0,1 M = 4 mmol, che neutralizzano 4 mmol di H⁺. Ogni H₂SO₄ libera 2 H⁺, quindi le moli di acido sono 4 / 2 = 2 mmol, in 20 mL: 2 / 20 = 0,1 M. 0,2 M si ottiene trattando l'acido come monoprotico; 0,05 M e 0,4 M sono altri errori sui fattori 2.`},
{id:'ch_ph_sf6',t:'ch_ph',l:4,q:`Il pH normale del sangue arterioso è circa 7,4. In un paziente con grave acidosi il pH scende a 7,1. Come varia circa la concentrazione di H⁺? (Usare log 2 = 0,3.)`,o:[`Raddoppia circa`,`Si dimezza circa`,`Aumenta circa 10 volte`,`Diminuisce del 4% circa`],a:0,e:`Il pH è un logaritmo: la differenza di 0,3 unità significa che [H⁺] varia di un fattore 10^0,3 = 2. Poiché il pH è sceso, [H⁺] è aumentata: raddoppia. Un calo di pH non indica una diminuzione di [H⁺]; aumentare 10 volte richiederebbe 1 unità di pH; il 4% è la variazione percentuale del numero 7,4 → 7,1, che non ha significato chimico.`},
{id:'ch_ph_sf7',t:'ch_ph',l:4,q:`Sono dati tre acidi deboli con pKa: acido A = 2,5; acido B = 4,8; acido C = 9,2. Quale affermazione è corretta?`,o:[`A è l'acido più forte e la base coniugata di C è la più forte`,`A è l'acido più forte e la base coniugata di A è la più forte`,`C è l'acido più forte e la base coniugata di C è la più forte`,`C è l'acido più forte e la base coniugata di A è la più forte`],a:0,e:`Più il pKa è basso, più Ka è grande e più l'acido è forte e dissociato: l'acido più forte è A (pKa 2,5). Una base coniugata è tanto più forte quanto più è debole l'acido da cui deriva: la più forte è quindi la base coniugata di C (pKa 9,2), che ha maggiore tendenza a riprendere un protone.`},
{id:'ch_ph_sf8',t:'ch_ph',l:4,q:`Nelle cellule il sistema fosfato è un importante tampone. L'acido fosforico ha pKa₁ ≈ 2,1, pKa₂ ≈ 7,2 e pKa₃ ≈ 12,4. Quale coppia acido/base coniugata è più efficace come tampone a pH circa 7,2?`,o:[`H₂PO₄⁻ / HPO₄²⁻`,`H₃PO₄ / H₂PO₄⁻`,`HPO₄²⁻ / PO₄³⁻`,`HCl / Cl⁻`],a:0,e:`Un tampone lavora bene quando il pH è vicino al pKa della coppia (entro circa ±1): a pH 7,2 serve la coppia con pKa 7,2, cioè H₂PO₄⁻/HPO₄²⁻ (pKa₂). H₃PO₄/H₂PO₄⁻ ha pKa 2,1 e HPO₄²⁻/PO₄³⁻ pKa 12,4; HCl/Cl⁻ è un acido forte, la cui base coniugata non accetta protoni in acqua.`},
{id:'ch_ph_sf9',t:'ch_ph',l:4,q:`L'acido acetilsalicilico (aspirina) è un acido debole con pKa circa 3,5. Nello stomaco, a pH circa 1,5, qual è il rapporto [A⁻]/[HA] tra forma ionizzata e forma non ionizzata?`,o:[`1/100`,`100`,`10`,`1/10`],a:0,e:`Da Henderson-Hasselbalch: pH = pKa + log([A⁻]/[HA]), quindi log([A⁻]/[HA]) = 1,5 − 3,5 = −2 e il rapporto vale 10⁻² = 1/100. A pH inferiore al pKa prevale la forma non ionizzata (HA). 100 sarebbe il rapporto invertito (come in un ambiente con pH 5,5); 10 e 1/10 corrispondono a differenze di una sola unità.`},
{id:'ch_ph_sf10',t:'ch_ph',l:4,q:`Si titola un acido debole HA con NaOH. Quando è stata aggiunta esattamente metà della quantità di NaOH necessaria per arrivare al punto di equivalenza, il pH misurato è 5,0. Quanto vale approssimativamente la Ka dell'acido?`,o:[`1 × 10⁻⁵`,`1 × 10⁻⁹`,`1 × 10⁻⁷`,`1 × 10⁻³`],a:0,e:`A metà titolazione metà di HA è stata convertita in A⁻, quindi [HA] = [A⁻] e il rapporto vale 1 (log 1 = 0). Dall'equazione di Henderson-Hasselbalch, pH = pKa = 5,0, e Ka = 10⁻⁵. 1 × 10⁻⁹ si otterrebbe usando il pOH (14 − 5 = 9) invece del pH; 1 × 10⁻⁷ e 1 × 10⁻³ corrispondono a pKa 7 e 3.`},
{id:'ch_materia_sf1',t:'ch_materia',l:4,q:`Un batuffolo di lana d'acciaio (ferro) viene pesato, poi scaldato fino a incandescenza in aria e pesato di nuovo: dopo il riscaldamento la sua massa è maggiore. Quale interpretazione è corretta?`,o:[`Il ferro si è combinato con l'ossigeno dell'aria formando un ossido; la massa totale si conserva`,`La massa non si è conservata, perché il ferro ha assorbito calore e il calore ha una massa propria`,`Il ferro si è trasformato in un altro elemento più pesante per effetto del forte calore`,`Il ferro ha assorbito vapore acqueo dell'aria, in una semplice trasformazione fisica reversibile`],a:0,e:`La combustione del ferro è una reazione chimica: Fe + O₂ → ossido di ferro. L'ossigeno prelevato dall'aria si aggiunge alla massa del ferro; se si pesasse anche l'ossigeno consumato, la massa dei reagenti sarebbe uguale a quella dei prodotti (legge di Lavoisier). Gli elementi non si trasformano l'uno nell'altro in una reazione chimica e il calore non ha massa misurabile in questo contesto.`},
{id:'ch_materia_sf2',t:'ch_materia',l:4,q:`Quanto calore serve, circa, per portare 100 g di acqua da 20 °C a 100 °C e poi vaporizzarla tutta? (Calore specifico c = 4,2 J/(g·°C); calore latente di vaporizzazione 2260 J/g.)`,o:[`260 kJ`,`226 kJ`,`34 kJ`,`2600 kJ`],a:0,e:`Riscaldamento: Q₁ = m · c · ΔT = 100 × 4,2 × 80 = 33600 J ≈ 34 kJ. Vaporizzazione a 100 °C: Q₂ = m · L = 100 × 2260 = 226000 J = 226 kJ. Totale: 34 + 226 = 260 kJ circa. 226 kJ e 34 kJ sono le due fasi prese da sole; 2600 kJ deriva da un errore di unità di misura.`},
{id:'ch_materia_sf3',t:'ch_materia',l:4,q:`Un campione di gas ideale in un recipiente flessibile occupa 6 L a 300 K e 1 atm. Viene portato a 600 K e 2 atm. Quale volume occupa?`,o:[`6 L`,`12 L`,`3 L`,`24 L`],a:0,e:`Per un gas ideale P₁V₁/T₁ = P₂V₂/T₂, quindi V₂ = V₁ × (P₁/P₂) × (T₂/T₁) = 6 × (1/2) × (600/300) = 6 × 0,5 × 2 = 6 L. Il raddoppio della pressione dimezza il volume e il raddoppio della temperatura lo raddoppia: gli effetti si compensano. 12 L tiene conto solo di T, 3 L solo di P, 24 L applica entrambi i fattori nel verso sbagliato.`},
{id:'ch_materia_sf4',t:'ch_materia',l:4,q:`L'aria secca contiene circa il 21% di O₂ in volume; al livello del mare (760 mmHg) la pressione parziale dell'O₂ è circa 160 mmHg. A una quota in cui la pressione atmosferica totale è 380 mmHg, qual è circa la pressione parziale dell'O₂?`,o:[`80 mmHg`,`160 mmHg`,`40 mmHg`,`21 mmHg`],a:0,e:`Per la legge di Dalton, pO₂ = frazione di O₂ × pressione totale. In quota la composizione dell'aria resta circa 21% di O₂, ma la pressione totale è dimezzata: 0,21 × 380 ≈ 80 mmHg. 160 mmHg è il valore a livello del mare (la frazione non cambia, la pressione sì); 40 mmHg dimezza due volte; 21 mmHg confonde la percentuale con i mmHg.`},
{id:'ch_materia_sf5',t:'ch_materia',l:4,q:`Un subacqueo che risale troppo rapidamente da una grande profondità può avere la malattia da decompressione. Quale spiegazione è corretta?`,o:[`In profondità si scioglie più azoto nei tessuti (Henry); risalendo la pressione cala e l'azoto forma bolle`,`A pressione ridotta la solubilità dei gas aumenta e l'azoto in eccesso si accumula nei tessuti profondi`,`In profondità l'azoto reagisce con l'emoglobina formando un composto che si decompone in risalita`,`Il calo di temperatura in risalita fa condensare in bolle il vapore acqueo disciolto nel sangue`],a:0,e:`Secondo la legge di Henry la quantità di gas disciolta in un liquido è proporzionale alla sua pressione parziale: con la pressione elevata in profondità si scioglie più azoto. Se la pressione diminuisce troppo in fretta, la solubilità cala bruscamente e l'azoto esce dalla soluzione sotto forma di bolle nei tessuti e nel sangue. Con la diminuzione di pressione la solubilità cala, non aumenta; l'azoto è inerte e non reagisce con l'emoglobina.`},
{id:'ch_materia_sf6',t:'ch_materia',l:4,q:`Una sostanza pura solida a 20 °C viene riscaldata con potenza costante. La temperatura sale fino a 80 °C e rimane a 80 °C per 6 minuti; poi sale fino a 218 °C e rimane a 218 °C per 20 minuti. Quale deduzione è corretta?`,o:[`Fonde a 80 °C e bolle a 218 °C; il tratto piano più lungo indica che la vaporizzazione richiede più calore della fusione`,`Fonde a 80 °C e bolle a 218 °C; il tratto piano più lungo indica che la fusione richiede più calore della vaporizzazione`,`È un miscuglio, perché durante i tratti piani la temperatura non varia pur fornendo calore`,`Fonde a 80 °C e bolle a 218 °C; nei tratti piani il calore fornito aumenta l'energia cinetica delle particelle`],a:0,e:`Nei tratti piani di una sostanza pura avviene un passaggio di stato: il primo (80 °C) è la fusione, il secondo (218 °C) l'ebollizione. Con potenza costante il calore assorbito è proporzionale al tempo, quindi i 20 minuti dell'ebollizione indicano un calore latente maggiore dei 6 minuti della fusione. Durante i passaggi di stato il calore non aumenta l'energia cinetica (che resta costante con la temperatura) ma rompe le interazioni tra le particelle; è proprio la temperatura costante a distinguere una sostanza pura da un miscuglio.`},
{id:'ch_materia_sf7',t:'ch_materia',l:4,q:`Un campione di sangue reso incoagulabile viene centrifugato in una provetta e si separa in tre strati. Quale sequenza, dall'alto verso il basso, è corretta?`,o:[`Plasma; strato sottile di globuli bianchi e piastrine; globuli rossi`,`Globuli rossi; strato sottile di globuli bianchi e piastrine; plasma`,`Plasma; globuli rossi; strato sottile di globuli bianchi e piastrine`,`Strato sottile di globuli bianchi e piastrine; plasma; globuli rossi`],a:0,e:`Il sangue è un miscuglio eterogeneo e la centrifugazione separa i componenti in base alla densità: la parte liquida, il plasma, è la meno densa e sta in alto; i globuli rossi, i più densi, si depositano sul fondo; in mezzo si trova un sottile strato (buffy coat) di globuli bianchi e piastrine, di densità intermedia.`},
{id:'ch_materia_sf8',t:'ch_materia',l:4,q:`Un fascio di luce laser attraversa tre campioni limpidi. Nell'acqua distillata e nell'acqua con sale da cucina sciolto il percorso del fascio non è visibile; in una soluzione di albumina (proteina) il fascio è ben visibile come una traccia luminosa. Che cosa indica?`,o:[`L'albumina forma una dispersione colloidale: le particelle diffondono la luce (effetto Tyndall)`,`L'acqua salata contiene particelle più grandi dell'albumina, che per questo non diffondono la luce visibile`,`L'albumina forma una soluzione vera di ioni, come il sale, ma con una concentrazione molto maggiore`,`L'albumina è un elemento mentre l'acqua salata è un composto, e per questo diffondono la luce in modo diverso`],a:0,e:`Le particelle di una soluzione vera (ioni Na⁺ e Cl⁻ o molecole piccole) sono troppo piccole per diffondere la luce visibile e il fascio non si vede. Le macromolecole come l'albumina hanno dimensioni di nanometri e formano una dispersione colloidale che diffonde la luce: il percorso diventa visibile (effetto Tyndall). L'albumina non è un elemento né una soluzione di ioni.`},
{id:'ch_materia_sf9',t:'ch_materia',l:4,q:`20 g di un miscuglio di sabbia e sale da cucina vengono sciolti in acqua e filtrati. Il residuo sul filtro, dopo essiccamento, pesa 12 g. Quale percentuale in massa di sale conteneva il miscuglio?`,o:[`40%`,`60%`,`12%`,`66,7%`],a:0,e:`La sabbia non è solubile e resta sul filtro: 12 g. Il sale, solubile, passa nel filtrato e vale 20 − 12 = 8 g. Percentuale di sale = 8 / 20 × 100 = 40%. 60% è la percentuale di sabbia; 12% usa il valore in grammi come se fosse una percentuale; 66,7% è il rapporto tra sale e sabbia (8/12) invece che sul totale.`},
{id:'ch_materia_sf10',t:'ch_materia',l:4,q:`Una soluzione acquosa di NaCl al 5% in massa ha densità 1,05 g/mL. Quanti grammi di NaCl sono contenuti in 200 mL di soluzione?`,o:[`10,5 g`,`10 g`,`9,5 g`,`21 g`],a:0,e:`Massa della soluzione = volume × densità = 200 mL × 1,05 g/mL = 210 g. Massa di NaCl = 5% di 210 = 0,05 × 210 = 10,5 g. 10 g ignora la densità (5% di 200 g); 9,5 g divide per la densità invece di moltiplicare (200/1,05 × 0,05); 21 g è il 10% di 210.`},
{id:'ch_reaz_sf1',t:'ch_reaz',l:4,q:`Nella respirazione cellulare il glucosio viene ossidato completamente: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O. Quanti grammi di CO₂ (M = 44 g/mol) si formano dall'ossidazione completa di 9 g di glucosio (M = 180 g/mol)?`,o:[`13,2 g`,`2,2 g`,`26,4 g`,`6,6 g`],a:0,e:`9 g di glucosio sono 9/180 = 0,05 mol. Dal rapporto 1 : 6 si formano 0,05 × 6 = 0,3 mol di CO₂, cioè 0,3 × 44 = 13,2 g. 2,2 g si ottiene dimenticando il coefficiente 6 (0,05 × 44); 26,4 g raddoppia il risultato (0,6 mol); 6,6 g lo dimezza.`},
{id:'ch_reaz_sf2',t:'ch_reaz',l:4,q:`Si fanno reagire 4 g di H₂ (M = 2 g/mol) con 16 g di O₂ (M = 32 g/mol) secondo 2 H₂ + O₂ → 2 H₂O (M = 18 g/mol). Quanta acqua si forma al massimo?`,o:[`18 g`,`36 g`,`20 g`,`9 g`],a:0,e:`Le moli sono 2 mol di H₂ e 0,5 mol di O₂. Per 0,5 mol di O₂ servirebbero 1 mol di H₂ (rapporto 2 : 1): l'O₂ è il reagente limitante e si formano 2 × 0,5 = 1 mol di H₂O, cioè 18 g. 36 g deriva dal prendere H₂ come limitante (2 mol di acqua); 20 g è la somma delle masse dei reagenti, che non si consumano per intero; 9 g corrisponde a 0,5 mol.`},
{id:'ch_reaz_sf3',t:'ch_reaz',l:4,q:`Nell'emoglobina normale il ferro dell'eme è Fe²⁺. Un agente ossidante, come i nitriti, lo trasforma in Fe³⁺ (metaemoglobina), che non lega più O₂. Che cosa è successo al ferro?`,o:[`Si è ossidato: ha perso 1 elettrone e il suo numero di ossidazione è passato da +2 a +3`,`Si è ridotto: ha acquistato 1 elettrone e il suo numero di ossidazione è passato da +2 a +3`,`Si è ossidato: ha acquistato 1 elettrone e il suo numero di ossidazione è passato da +2 a +3`,`Si è ridotto: ha perso 1 elettrone e il suo numero di ossidazione è passato da +3 a +2`],a:0,e:`Il passaggio Fe²⁺ → Fe³⁺ aumenta il numero di ossidazione da +2 a +3: il ferro perde un elettrone, quindi si ossida (ed è l'agente ossidante a ridursi). Ossidazione = perdita di elettroni = aumento del numero di ossidazione; le altre opzioni scambiano uno di questi tre aspetti o invertono il verso della trasformazione.`},
{id:'ch_reaz_sf4',t:'ch_reaz',l:4,q:`Nell'etilometro chimico storico l'etanolo reagisce con lo ione dicromato Cr₂O₇²⁻ (arancione), che diventa Cr³⁺ (verde). Quanti elettroni acquistano complessivamente i due atomi di cromo di uno ione dicromato?`,o:[`6`,`3`,`2`,`12`],a:0,e:`In Cr₂O₇²⁻ il cromo ha n.o. x con 2x + 7 × (−2) = −2, quindi x = +6. Passando a Cr³⁺ ogni atomo acquista 3 elettroni, e i due atomi ne acquistano 2 × 3 = 6 (il dicromato è l'ossidante e si riduce). 3 è il valore per un solo atomo; 2 è il numero di atomi di Cr; 12 è un errore di conteggio doppio.`},
{id:'ch_reaz_sf5',t:'ch_reaz',l:4,q:`Bilanciando C₄H₁₀ + O₂ → CO₂ + H₂O con i più piccoli coefficienti interi, quali coefficienti si ottengono, nell'ordine?`,o:[`2, 13, 8, 10`,`1, 13, 4, 5`,`2, 9, 8, 10`,`1, 6, 4, 5`],a:0,e:`Con 1 C₄H₁₀ si ottengono 4 CO₂ e 5 H₂O, che richiedono 4 + 2,5 = 6,5 atomi di O₂. Per evitare la frazione si moltiplica tutto per 2: 2 C₄H₁₀ + 13 O₂ → 8 CO₂ + 10 H₂O (26 atomi di O da entrambe le parti). Le altre sequenze non hanno lo stesso numero di atomi di O (o di C o H) nei due membri.`},
{id:'ch_reaz_sf6',t:'ch_reaz',l:4,q:`Per dosare il Fe²⁺ di un integratore si usa la reazione MnO₄⁻ + 8 H⁺ + 5 Fe²⁺ → Mn²⁺ + 5 Fe³⁺ + 4 H₂O. Una compressa sciolta in ambiente acido richiede 20 mL di KMnO₄ 0,02 mol/L per ossidare tutto il Fe²⁺ (massa atomica del Fe = 56 g/mol). Quanti mg di ferro contiene la compressa?`,o:[`112 mg`,`22,4 mg`,`179 mg`,`560 mg`],a:0,e:`Le moli di MnO₄⁻ sono 0,020 L × 0,02 mol/L = 4 × 10⁻⁴ mol. Il rapporto è 1 : 5, quindi Fe²⁺ = 2 × 10⁻³ mol, cioè 2 × 10⁻³ × 56 = 0,112 g = 112 mg. 22,4 mg dimentica il fattore 5; 179 mg usa 8 (il coefficiente degli H⁺) al posto di 5; 560 mg applica due volte il fattore 5.`},
{id:'ch_reaz_sf7',t:'ch_reaz',l:4,q:`L'aspirina (C₉H₈O₄, M = 180 g/mol) si sintetizza dall'acido salicilico (C₇H₆O₃, M = 138 g/mol) con anidride acetica; il rapporto molare acido salicilico : aspirina è 1 : 1. Partendo da 13,8 g di acido salicilico con una resa dell'80%, quanti grammi di aspirina si ottengono?`,o:[`14,4 g`,`18 g`,`11,04 g`,`22,5 g`],a:0,e:`13,8 g sono 13,8/138 = 0,1 mol, quindi la resa teorica è 0,1 mol × 180 g/mol = 18 g. Con resa 80%: 18 × 0,8 = 14,4 g. 18 g ignora la resa; 11,04 g applica la resa alla massa del reagente (13,8 × 0,8); 22,5 g divide per 0,8 invece di moltiplicare.`},
{id:'ch_reaz_sf8',t:'ch_reaz',l:4,q:`Un antiossidante come la vitamina C protegge le molecole biologiche dallo stress ossidativo causato dai radicali liberi. In termini di ossidoriduzione, che cosa fa?`,o:[`Agisce da riducente: cede elettroni ai radicali liberi e si ossida al posto dei bersagli biologici`,`Agisce da ossidante: strappa elettroni ai radicali liberi e si riduce al posto dei bersagli biologici`,`Agisce da riducente: cede elettroni ai radicali liberi e per questo si riduce al posto dei bersagli biologici`,`Agisce da catalizzatore: trasforma i radicali liberi senza modificare il proprio numero di ossidazione`],a:0,e:`Un antiossidante è una sostanza facilmente ossidabile, cioè un riducente: cede elettroni ai radicali e così impedisce che siano sottratti a lipidi, proteine o DNA. Un riducente però si ossida, non si riduce: l'opzione che dice 'cede elettroni e si riduce' confonde i due termini; l'ossidante fa l'opposto e un catalizzatore non viene consumato.`},
{id:'ch_reaz_sf9',t:'ch_reaz',l:4,q:`In un becher aperto sul piatto di una bilancia si versa HCl su CaCO₃: CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂. Durante l'effervescenza la massa indicata diminuisce e a fine reazione resta inferiore a quella iniziale. Come si interpreta?`,o:[`Il CO₂ gassoso è sfuggito nell'aria: la massa totale si conserva, ma non è più tutta nel becher`,`Parte della massa dei reagenti si è trasformata in energia liberata sotto forma di effervescenza`,`La reazione in soluzione acquosa non rispetta la conservazione della massa`,`L'HCl si è consumato senza dare prodotti e la sua massa è sparita`],a:0,e:`Tra i prodotti c'è un gas, CO₂, che in un recipiente aperto si disperde nell'ambiente. La legge di conservazione della massa vale per il sistema chiuso: in un recipiente chiuso la massa resterebbe costante. La trasformazione di massa in energia è trascurabile in una reazione chimica e la conservazione vale anche in acqua.`},
{id:'ch_reaz_sf10',t:'ch_reaz',l:4,q:`L'etanolo brucia completamente secondo C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O. Quanti litri di CO₂, in condizioni normali (1 mol = 22,4 L), si formano da 23 g di etanolo (M = 46 g/mol)?`,o:[`22,4 L`,`11,2 L`,`44,8 L`,`67,2 L`],a:0,e:`23 g di etanolo sono 23/46 = 0,5 mol. Dal rapporto 1 : 2 si formano 1 mol di CO₂, cioè 22,4 L. 11,2 L dimentica il coefficiente 2; 44,8 L corrisponde a 2 mol, cioè al caso di 46 g di etanolo; 67,2 L è il volume (ipotetico) di 3 mol, il coefficiente dell'acqua.`},
{id:'ch_sol_sf1',t:'ch_sol',l:4,q:`Si hanno 100 mL di NaCl al 4,5% m/V e si vuole ottenere una soluzione fisiologica allo 0,9% m/V diluendo con acqua distillata (volumi additivi). Quanti mL di acqua occorre aggiungere?`,o:[`400 mL`,`500 mL`,`20 mL`,`100 mL`],a:0,e:`I 100 mL contengono 4,5 g di NaCl. Per avere 0,9 g ogni 100 mL il volume finale deve essere 4,5/0,9 × 100 = 500 mL, quindi si aggiungono 500 − 100 = 400 mL di acqua. 500 mL è il volume finale, non l'acqua da aggiungere; 20 mL deriva dal rapporto invertito (0,9/4,5 × 100); 100 mL dà una diluizione 1 : 1, cioè 2,25%.`},
{id:'ch_sol_sf2',t:'ch_sol',l:4,q:`Una soluzione di glucosio al 5% m/V (circa 0,28 mol/L) e una di NaCl allo 0,9% m/V (circa 0,15 mol/L) hanno osmolarità simili, intorno a 0,3 osmol/L, pur avendo molarità molto diverse. Perché?`,o:[`Il NaCl si dissocia in due ioni mentre il glucosio resta molecolare: conta il numero totale di particelle`,`Il glucosio si dissocia in due particelle per molecola mentre il NaCl resta indissociato`,`Il glucosio, essendo più pesante, esercita più pressione osmotica per mole e compensa la differenza`,`L'osmolarità dipende solo dai grammi di soluto per litro e non dal tipo di particelle`],a:0,e:`L'osmolarità conta le particelle osmoticamente attive. Il glucosio è un composto molecolare: 0,28 mol/L danno circa 0,28 osmol/L. Il NaCl si dissocia in Na⁺ e Cl⁻: 0,15 mol/L × 2 ≈ 0,3 osmol/L. Inoltre 50 g/L di glucosio e 9 g/L di NaCl sono masse molto diverse, quindi l'ultima opzione è smentita dai dati.`},
{id:'ch_sol_sf3',t:'ch_sol',l:4,q:`Una membrana semipermeabile, attraversabile solo dall'acqua, separa due compartimenti: A contiene glucosio 0,1 mol/L e B contiene NaCl 0,1 mol/L (dissociazione completa). Che cosa si osserva?`,o:[`L'acqua passa da A verso B, perché B ha più particelle attive (0,2 contro 0,1 osmol/L)`,`Non c'è flusso netto, perché le due soluzioni hanno la stessa molarità`,`L'acqua passa da B verso A, perché il glucosio è una molecola più grande degli ioni Na⁺ e Cl⁻`,`Il NaCl passa da B verso A fino a pareggiare le concentrazioni dei due lati`],a:0,e:`Il glucosio non si dissocia e dà 0,1 osmol/L; il NaCl dà Na⁺ + Cl⁻, cioè 0,2 osmol/L. L'acqua si sposta per osmosi verso la soluzione a maggiore osmolarità, quindi da A a B. Uguale molarità non significa uguale osmolarità, e la membrana lascia passare solo l'acqua, non il soluto.`},
{id:'ch_sol_sf4',t:'ch_sol',l:4,q:`Si mettono dei globuli rossi in una soluzione di NaCl 0,3% m/V. Al microscopio le cellule appaiono rigonfie e alcune sono lisate. Quale interpretazione è corretta?`,o:[`La soluzione è ipotonica rispetto al citoplasma: l'acqua entra nelle cellule per osmosi`,`La soluzione è ipertonica rispetto al citoplasma: l'acqua entra nelle cellule per osmosi`,`La soluzione è ipotonica rispetto al citoplasma: l'acqua esce dalle cellule per osmosi`,`La soluzione è isotonica rispetto al citoplasma: il rigonfiamento è dovuto a un ingresso attivo di NaCl`],a:0,e:`Una soluzione 0,3% m/V ha circa un terzo della concentrazione fisiologica (0,9%), quindi è ipotonica: fuori ci sono meno particelle che dentro la cellula. L'acqua entra per osmosi, la cellula si gonfia e può rompersi (emolisi). In una soluzione ipertonica l'acqua uscirebbe e le cellule si raggrinzirebbero; in una isotonica non ci sarebbe variazione di volume.`},
{id:'ch_sol_sf5',t:'ch_sol',l:4,q:`Da una soluzione madre 0,5 mol/L si eseguono tre diluizioni seriali successive 1 : 10 (ogni volta 1 mL di soluzione + 9 mL di acqua, partendo dalla soluzione ottenuta al passaggio precedente). Qual è la concentrazione finale?`,o:[`5 × 10⁻⁴ mol/L`,`5 × 10⁻³ mol/L`,`5 × 10⁻² mol/L`,`5 × 10⁻⁵ mol/L`],a:0,e:`Ogni passaggio divide la concentrazione per 10 (1 mL in 10 mL finali). Tre passaggi danno un fattore 10³ = 1000: 0,5 / 1000 = 5 × 10⁻⁴ mol/L. 5 × 10⁻² e 5 × 10⁻³ corrispondono a una o due diluizioni; 5 × 10⁻⁵ a quattro.`},
{id:'ch_sol_sf6',t:'ch_sol',l:4,q:`Una glicemia di 90 mg/dL corrisponde a quale concentrazione di glucosio (M = 180 g/mol)?`,o:[`5 mmol/L`,`0,5 mmol/L`,`50 mmol/L`,`2,5 mmol/L`],a:0,e:`90 mg/dL = 900 mg/L = 0,9 g/L. Moli per litro: 0,9/180 = 0,005 mol/L = 5 mmol/L. 0,5 e 50 mmol/L derivano da un errore di un fattore 10 nel passaggio da dL a L; 2,5 mmol/L da un errore di un fattore 2 (massa molare 360).`},
{id:'ch_sol_sf7',t:'ch_sol',l:4,q:`A un paziente vengono infusi 500 mL di soluzione fisiologica (NaCl 0,9% m/V, M = 58,5 g/mol). Circa quante mmol di Na⁺ riceve?`,o:[`77 mmol`,`154 mmol`,`39 mmol`,`7,7 mmol`],a:0,e:`0,9% m/V significa 0,9 g ogni 100 mL: in 500 mL ci sono 4,5 g di NaCl, pari a 4,5/58,5 ≈ 0,077 mol. Ogni mole di NaCl dà una mole di Na⁺, quindi circa 77 mmol. 154 mmol è la quantità in 1 L (la concentrazione, 154 mmol/L), non in 500 mL; 39 mmol dimezza ancora il volume; 7,7 mmol sbaglia di un fattore 10.`},
{id:'ch_sol_sf8',t:'ch_sol',l:4,q:`Il coefficiente crioscopico dell'acqua è 1,86 °C·kg/mol. Qual è circa la temperatura di congelamento di una soluzione acquosa di NaCl 0,1 mol/kg, supponendo dissociazione completa?`,o:[`−0,37 °C`,`−0,19 °C`,`−0,74 °C`,`−1,86 °C`],a:0,e:`L'abbassamento crioscopico è ΔT = i × Kcr × m. Per il NaCl i = 2 (Na⁺ e Cl⁻): ΔT = 2 × 1,86 × 0,1 ≈ 0,37 °C, quindi la soluzione congela a circa −0,37 °C. −0,19 °C dimentica la dissociazione (i = 1); −0,74 °C usa i = 4; −1,86 °C è il valore per 1 mol/kg di un non elettrolita.`},
{id:'ch_sol_sf9',t:'ch_sol',l:4,q:`Un subacqueo risale troppo rapidamente da una grande profondità e può sviluppare bolle di azoto nel sangue (malattia da decompressione). Quale principio spiega il fenomeno?`,o:[`Per la legge di Henry la solubilità di un gas dipende dalla pressione: calando questa, l'azoto in eccesso esce di soluzione`,`La solubilità di un gas aumenta al diminuire della pressione, quindi l'azoto si scioglie in eccesso e forma bolle`,`A bassa pressione l'azoto reagisce con l'emoglobina del sangue e forma un composto gassoso instabile`,`Calando la pressione sale la temperatura del sangue e ciò riduce la solubilità dell'azoto disciolto`],a:0,e:`In profondità la pressione parziale dell'azoto è alta e se ne scioglie di più nei tessuti. Risalendo la pressione scende, la solubilità diminuisce (legge di Henry) e il gas in eccesso forma bolle se la risalita è troppo rapida. L'azoto è inerte e non si lega all'emoglobina, e la temperatura del sangue non è la causa.`},
{id:'ch_sol_sf10',t:'ch_sol',l:4,q:`Una soluzione acquosa di NaCl conduce la corrente elettrica, mentre una soluzione di glucosio della stessa concentrazione quasi non la conduce. Perché?`,o:[`Il NaCl si dissocia in ioni liberi di muoversi, il glucosio resta in soluzione come molecole neutre`,`Il glucosio, essendo organico, non si scioglie in acqua e quindi non è presente nella soluzione`,`Il NaCl contiene elettroni liberi che il glucosio non possiede`,`Le molecole di glucosio formano legami a idrogeno con l'acqua che bloccano il passaggio degli elettroni`],a:0,e:`In soluzione acquosa la corrente è trasportata dagli ioni. Il NaCl, elettrolita forte, si dissocia in Na⁺ e Cl⁻ mobili; il glucosio è un non elettrolita: si scioglie bene (ha molti gruppi –OH) ma resta come molecola neutra, senza cariche da trasportare. Gli elettroni liberi non sono i portatori di carica in una soluzione.`},
{id:'ch_neut_sf1',t:'ch_neut',l:4,q:`Una compressa antiacido contiene 0,84 g di NaHCO₃ (M = 84 g/mol): NaHCO₃ + HCl → NaCl + H₂O + CO₂. Quanti mL di HCl 0,1 mol/L può neutralizzare al massimo?`,o:[`100 mL`,`10 mL`,`50 mL`,`200 mL`],a:0,e:`0,84/84 = 0,01 mol di NaHCO₃. Il rapporto con HCl è 1 : 1, quindi servono 0,01 mol di HCl: V = 0,01 mol / 0,1 mol/L = 0,1 L = 100 mL. 200 mL si ottiene contando due H⁺ per NaHCO₃; 50 mL e 10 mL derivano da errori sulla massa molare o sul volume.`},
{id:'ch_neut_sf2',t:'ch_neut',l:4,q:`Il calore sviluppato per mole di acqua formata è praticamente lo stesso nella neutralizzazione di HCl con NaOH e in quella di HNO₃ con KOH. Perché?`,o:[`La reazione netta è H⁺ + OH⁻ → H₂O in entrambi i casi; gli altri ioni sono spettatori`,`I sali che si formano, NaCl e KNO₃, hanno la stessa energia reticolare`,`I due acidi e le due basi hanno praticamente la stessa massa molare`,`Il calore dipende solo dalla temperatura iniziale e non dalle sostanze che reagiscono`],a:0,e:`Gli acidi e le basi forti sono completamente dissociati: Cl⁻, Na⁺, NO₃⁻ e K⁺ restano in soluzione invariati. L'unico processo è la formazione di acqua da H⁺ e OH⁻, la stessa in entrambe le coppie. Le masse molari e le energie reticolari dei sali non c'entrano, e il calore dipende invece dalle quantità di sostanza che reagiscono.`},
{id:'ch_neut_sf3',t:'ch_neut',l:4,q:`10 mL di aceto (acido acetico, monoprotico) vengono diluiti a 100 mL con acqua. Per neutralizzare 20 mL della soluzione diluita servono 10 mL di NaOH 0,2 mol/L. Qual è la molarità dell'acido acetico nell'aceto non diluito?`,o:[`1 mol/L`,`0,1 mol/L`,`0,2 mol/L`,`10 mol/L`],a:0,e:`Le moli di NaOH sono 0,010 L × 0,2 = 2 × 10⁻³ mol, uguali a quelle di acido in 20 mL (rapporto 1 : 1). La soluzione diluita è quindi 2 × 10⁻³ / 0,020 = 0,1 mol/L. La diluizione era 10 volte (10 mL → 100 mL), quindi l'aceto è 1 mol/L. 0,1 mol/L dimentica la diluizione; 0,2 mol/L è la molarità del NaOH; 10 mol/L la moltiplica due volte.`},
{id:'ch_neut_sf4',t:'ch_neut',l:4,q:`A 20 mL di acido acetico 0,1 mol/L (pKa = 4,76) si aggiungono 10 mL di NaOH 0,1 mol/L. Qual è circa il pH della soluzione?`,o:[`4,76`,`7,0`,`2,9`,`9,24`],a:0,e:`Moli di acido: 2 mmol; moli di base: 1 mmol. Metà dell'acido è convertita in acetato (1 mmol) e l'altra metà resta (1 mmol): si forma un tampone con [CH₃COO⁻] = [CH₃COOH], quindi pH = pKa = 4,76 (Henderson-Hasselbalch). 7,0 sarebbe il pH di una neutralizzazione di acido forte; 2,9 è il pH dell'acido acetico 0,1 mol/L prima dell'aggiunta; 9,24 è 14 − pKa.`},
{id:'ch_neut_sf5',t:'ch_neut',l:4,q:`Quale di questi sali, sciolto in acqua, dà una soluzione basica?`,o:[`CH₃COONa (acetato di sodio)`,`NaCl`,`KNO₃`,`NH₄Cl`],a:0,e:`Lo ione acetato è la base coniugata di un acido debole (CH₃COOH): in acqua si protona (CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻), liberando OH⁻ e portando il pH sopra 7. NaCl e KNO₃ derivano da acido e base forti e sono neutri; NH₄Cl contiene NH₄⁺, acido debole, e dà una soluzione acida.`},
{id:'ch_neut_sf6',t:'ch_neut',l:4,q:`Nel sangue lo ione bicarbonato HCO₃⁻ limita le variazioni di pH quando aumenta la concentrazione di H⁺. Quale processo descrive meglio la sua azione?`,o:[`HCO₃⁻ accetta H⁺ formando H₂CO₃, che si scinde in CO₂ ed H₂O (eliminabile col respiro)`,`HCO₃⁻ cede H⁺ formando CO₃²⁻, e questo aumenta ancora la concentrazione di H⁺`,`HCO₃⁻ riduce H⁺ a H₂ gassoso, che viene poi eliminato con il respiro dai polmoni`,`HCO₃⁻ neutralizza H⁺ formando NaOH, che è una base forte`],a:0,e:`Il bicarbonato è una base debole (accettore di protoni): HCO₃⁻ + H⁺ → H₂CO₃ ⇌ CO₂ + H₂O. Gli H⁺ in eccesso vengono così consumati e il CO₂ si elimina dai polmoni. Cedere H⁺ sarebbe il comportamento di un acido, non toglie H⁺ in eccesso; non si forma H₂ né NaOH, che sarebbe una base forte e contrasterebbe l'effetto tampone.`},
{id:'ch_neut_sf7',t:'ch_neut',l:4,q:`50 mL di H₂SO₄ 0,05 mol/L vengono mescolati con 50 mL di NaOH 0,12 mol/L. Supponendo volumi additivi e completa cessione di entrambi gli H⁺ dell'acido, qual è il pH finale?`,o:[`12`,`12,5`,`7`,`2`],a:0,e:`H⁺: 0,050 L × 0,05 × 2 = 5 mmol. OH⁻: 0,050 L × 0,12 = 6 mmol. Resta 1 mmol di OH⁻ in 100 mL: [OH⁻] = 0,01 mol/L, pOH = 2, pH = 12. 12,5 deriva dal considerare H₂SO₄ monoprotico (2,5 mmol di H⁺, eccesso 3,5 mmol); 7 sarebbe il caso di quantità equivalenti; 2 il caso di eccesso di acido.`},
{id:'ch_neut_sf8',t:'ch_neut',l:4,q:`Il succo gastrico ha pH 2. Quanti mL di NaOH 0,05 mol/L servono per neutralizzare 50 mL di succo gastrico?`,o:[`10 mL`,`100 mL`,`1 mL`,`50 mL`],a:0,e:`Con pH 2, [H⁺] = 10⁻² mol/L: in 50 mL ci sono 0,050 × 0,01 = 5 × 10⁻⁴ mol (0,5 mmol) di H⁺. Servono 0,5 mmol di OH⁻: V = 0,5 mmol / 0,05 mol/L = 10 mL. 100 mL corrisponde a pH 1; 1 mL a pH 3; 50 mL ignora la differenza di concentrazione tra succo e base.`},
{id:'ch_neut_sf9',t:'ch_neut',l:4,q:`Titolando 20 mL di un acido H₂A con NaOH 0,1 mol/L si osservano due salti di pH, il primo dopo 20 mL e il secondo dopo 40 mL di base aggiunta. Qual è la molarità di H₂A?`,o:[`0,1 mol/L`,`0,2 mol/L`,`0,05 mol/L`,`0,4 mol/L`],a:0,e:`Due salti indicano un acido diprotico. Alla fine servono 40 mL × 0,1 = 4 mmol di OH⁻, che neutralizzano 4 mmol di H⁺, cioè 2 mmol di H₂A (due H⁺ per molecola); in 20 mL: 2/20 = 0,1 mol/L. Lo stesso valore si ricava dal primo salto (2 mmol di OH⁻ per 2 mmol di H₂A). 0,2 mol/L tratta H₂A come monoprotico; 0,4 mol/L conta due volte il fattore 2; 0,05 mol/L divide per il volume totale.`},
{id:'ch_neut_sf10',t:'ch_neut',l:4,q:`Nella titolazione acido-base, qual è la differenza tra punto di equivalenza e punto finale?`,o:[`Il primo è il rapporto stechiometrico acido-base; il secondo è il viraggio dell'indicatore, che dovrebbe cadere vicino al primo`,`Il primo è il viraggio dell'indicatore; il secondo è il rapporto stechiometrico tra acido e base reagiti`,`Il primo si ha sempre a pH 7 e il secondo sempre a pH 8–9, in qualsiasi titolazione acido-base`,`Coincidono sempre, perché l'indicatore cambia colore esattamente nel momento della neutralizzazione`],a:0,e:`Il punto di equivalenza è una condizione chimica: le moli di H⁺ e OH⁻ sono uguali (a pH 7 solo per acido forte con base forte). Il punto finale è l'osservazione sperimentale del cambio di colore; si sceglie un indicatore il cui intervallo di viraggio contenga il pH dell'equivalenza per ridurre l'errore. I due punti non coincidono mai perfettamente e il pH di equivalenza dipende da acido e base.`},
{id:'ch_org_sf1',t:'ch_org',l:4,q:`Glucosio e fruttosio hanno la stessa formula molecolare C₆H₁₂O₆. Quale affermazione sulla loro struttura a catena aperta è corretta?`,o:[`Sono isomeri di struttura: il glucosio ha un gruppo aldeidico, il fruttosio un gruppo chetonico`,`Sono stereoisomeri: hanno gli stessi gruppi funzionali ma disposti diversamente nello spazio`,`Sono isomeri di struttura: il glucosio ha un gruppo chetonico, il fruttosio un gruppo aldeidico`,`Sono lo stesso composto: differiscono solo per la forma ciclica`],a:0,e:`Stessa formula ma gruppi funzionali diversi significa isomeria di struttura (di gruppo funzionale). Il glucosio è un aldoso (C1 aldeidico), il fruttosio un chetoso (C=O in posizione 2). Gli stereoisomeri avrebbero gli stessi gruppi; l'assegnazione inversa di aldeide e chetone è un errore, e le forme cicliche non rendono i due zuccheri lo stesso composto.`},
{id:'ch_org_sf2',t:'ch_org',l:4,q:`Un aldoesoso a catena aperta, come il glucosio, ha 4 atomi di carbonio asimmetrici (da C2 a C5). Quanti stereoisomeri diversi ha in totale questa costituzione?`,o:[`16`,`4`,`8`,`32`],a:0,e:`Con n centri stereogenici si possono avere al massimo 2ⁿ stereoisomeri: 2⁴ = 16 (8 della serie D e 8 della serie L). 4 è il numero di centri; 8 è il numero della sola serie D (o L); 32 = 2⁵ conterebbe anche il C1 aldeidico, che non è asimmetrico.`},
{id:'ch_org_sf3',t:'ch_org',l:4,q:`Un trigliceride si forma dalla reazione tra glicerolo e tre acidi grassi. Quali legami si formano e quante molecole d'acqua vengono liberate?`,o:[`3 legami estere e 3 molecole d'acqua`,`3 legami estere e 1 molecola d'acqua`,`1 legame estere e 3 molecole d'acqua`,`3 legami glicosidici e 3 molecole d'acqua`],a:0,e:`Il glicerolo ha tre gruppi –OH, ciascuno reagisce con il –COOH di un acido grasso in una esterificazione, che libera una molecola d'acqua per ogni legame estere formato: 3 legami estere e 3 H₂O. I legami glicosidici si formano tra zuccheri, non tra glicerolo e acidi grassi.`},
{id:'ch_org_sf4',t:'ch_org',l:4,q:`Tre molecole di glicina (C₂H₅NO₂, M = 75 g/mol) si uniscono con legami peptidici a formare il tripeptide Gly-Gly-Gly. Qual è la massa molare del tripeptide (H₂O = 18 g/mol)?`,o:[`189 g/mol`,`225 g/mol`,`207 g/mol`,`171 g/mol`],a:0,e:`Ogni legame peptidico (ammidico) si forma per condensazione tra –COOH e –NH₂ con perdita di una molecola d'acqua. Tre amminoacidi formano 2 legami e liberano 2 H₂O: 3 × 75 − 2 × 18 = 225 − 36 = 189 g/mol. 225 ignora l'acqua persa; 207 ne sottrae una sola; 171 ne sottrae tre.`},
{id:'ch_org_sf5',t:'ch_org',l:4,q:`L'acido acetico (M = 60 g/mol) bolle a 118 °C, il propan-1-olo (M = 60 g/mol) a 97 °C. Quale spiegazione è la più appropriata?`,o:[`Gli acidi carbossilici formano dimeri con due legami a idrogeno tra le molecole`,`Il propan-1-olo ha una catena più corta e quindi un maggior numero di atomi per molecola`,`L'acido acetico forma legami ionici tra le molecole, più forti dei legami a idrogeno`,`Il propan-1-olo non può formare legami a idrogeno perché ha un solo gruppo polare`],a:0,e:`A parità di massa molare il punto di ebollizione dipende dalle forze intermolecolari. L'acido carbossilico forma dimeri ciclici stabilizzati da due legami a idrogeno (il gruppo –COOH è donatore e accettore), quindi serve più energia per vaporizzarlo. Anche l'alcol forma legami a idrogeno, ma in modo meno efficace; tra molecole di acido acetico non ci sono legami ionici.`},
{id:'ch_org_sf6',t:'ch_org',l:4,q:`L'enzima lattato deidrogenasi converte il lattato (CH₃–CHOH–COO⁻) in piruvato (CH₃–CO–COO⁻). Dal punto di vista dei gruppi funzionali, che trasformazione avviene?`,o:[`Un alcol secondario viene ossidato a chetone`,`Un alcol primario viene ossidato ad aldeide`,`Un'aldeide viene ridotta ad alcol primario`,`Un chetone viene ridotto ad alcol terziario`],a:0,e:`Nel lattato il gruppo –OH è legato al C2, che è legato ad altri due atomi di carbonio: è un alcol secondario. Nel piruvato lo stesso C2 porta un C=O legato a due carboni: è un chetone. La perdita di due H (ossidazione) trasforma quindi un alcol secondario in chetone; le altre opzioni descrivono gruppi o direzioni diverse.`},
{id:'ch_org_sf7',t:'ch_org',l:4,q:`Due isomeri di formula C₃H₆O vengono messi a reagire con il reattivo di Tollens: uno forma uno specchio d'argento sulle pareti della provetta, l'altro non reagisce. Quali sono, rispettivamente?`,o:[`Propanale (reagisce) e propanone (non reagisce)`,`Propanone (reagisce) e propanale (non reagisce)`,`Propanale e propanone reagiscono entrambi, perché entrambi hanno un gruppo C=O`,`Nessuno dei due reagisce, perché il reattivo di Tollens ossida solo gli alcoli`],a:0,e:`Il reattivo di Tollens è un ossidante blando: ossida le aldeidi ad acidi carbossilici e si riduce ad argento metallico (specchio). I chetoni non si ossidano facilmente e non reagiscono. Di C₃H₆O sono isomeri il propanale (CH₃CH₂CHO, aldeide) e il propanone (CH₃COCH₃, chetone): reagisce il propanale. Il solo gruppo C=O non basta: nelle aldeidi il carbonile porta anche un H.`},
{id:'ch_org_sf8',t:'ch_org',l:4,q:`Un idrocarburo contiene l'80% di carbonio e il 20% di idrogeno in massa e ha massa molare 30 g/mol (C = 12, H = 1). Qual è la sua formula molecolare?`,o:[`C₂H₆`,`CH₃`,`C₂H₄`,`C₃H₈`],a:0,e:`In 100 g ci sono 80/12 ≈ 6,67 mol di C e 20/1 = 20 mol di H: rapporto 1 : 3, formula empirica CH₃ (massa 15). La massa molare è 30 = 2 × 15, quindi la formula molecolare è C₂H₆ (etano). CH₃ è solo la formula empirica; C₂H₄ (28 g/mol) e C₃H₈ (44 g/mol) non hanno né il rapporto né la massa corretti.`},
{id:'ch_org_sf9',t:'ch_org',l:4,q:`Quanti alcoli di formula C₄H₁₀O esistono come isomeri di struttura (senza contare gli stereoisomeri)?`,o:[`4`,`2`,`3`,`5`],a:0,e:`Con lo scheletro lineare si hanno butan-1-olo e butan-2-olo; con lo scheletro ramificato (isobutano) si hanno 2-metilpropan-1-olo e 2-metilpropan-2-olo. In totale 4 alcoli (due primari, uno secondario, uno terziario). Gli eteri con la stessa formula non sono alcoli, e gli enantiomeri del butan-2-olo non contano come isomeri di struttura.`},
{id:'ch_org_sf10',t:'ch_org',l:4,q:`Quali gruppi funzionali sono presenti nell'acido acetilsalicilico (aspirina)?`,o:[`Un acido carbossilico, un estere e un anello aromatico`,`Un'ammide, un alcol e un anello aromatico`,`Un'aldeide, un etere e un anello aromatico`,`Un acido carbossilico, un fenolo libero e un anello alifatico`],a:0,e:`L'aspirina deriva dall'acido salicilico per acetilazione del gruppo –OH fenolico: il –OH diventa un estere (–O–CO–CH₃), mentre il –COOH resta libero e il benzene resta aromatico. Non contiene azoto (niente ammide), né aldeide, né alcol libero; il fenolo è proprio il gruppo trasformato in estere.`},
{id:'bi_cell_sf1',t:'bi_cell',l:4,q:`Nella malattia a cellule I (mucolipidosi II) un enzima difettoso dell'apparato di Golgi non aggiunge il marcatore mannosio-6-fosfato agli enzimi lisosomiali. Quale conseguenza è attesa?`,o:[`Gli enzimi sono secreti all'esterno e non raggiungono i lisosomi, che accumulano materiale non digerito`,`Gli enzimi restano bloccati nel reticolo endoplasmatico rugoso e non arrivano mai fino al Golgi`,`Gli enzimi raggiungono i lisosomi ma restano inattivi, perché il pH interno dell'organulo è neutro`,`Gli enzimi sono smistati verso i perossisomi, che si riempiono quindi di materiale non digerito`],a:0,e:`Il mannosio-6-fosfato è il segnale aggiunto nel Golgi che indirizza gli enzimi idrolitici ai lisosomi. Senza di esso, gli enzimi seguono la via predefinita della secrezione e si ritrovano fuori dalla cellula, mentre i lisosomi privi di enzimi accumulano materiale non degradato (inclusioni). Il blocco nel RER e lo smistamento ai perossisomi non c'entrano con questo segnale.`},
{id:'bi_cell_sf2',t:'bi_cell',l:4,q:`Una cellula di forma cubica raddoppia la lunghezza del proprio lato, da 10 µm a 20 µm. Come cambia il rapporto superficie/volume?`,o:[`Si dimezza`,`Raddoppia`,`Resta invariato`,`Diventa quattro volte più piccolo`],a:0,e:`La superficie di un cubo è 6L² e il volume è L³, quindi il rapporto è 6/L. Con L che raddoppia, la superficie aumenta di 4 volte e il volume di 8 volte: il rapporto si dimezza (da 0,6 a 0,3 µm⁻¹). Per questo le cellule grandi hanno più difficoltà negli scambi con l'ambiente.`},
{id:'bi_cell_sf3',t:'bi_cell',l:4,q:`Un antibiotico inibisce selettivamente i ribosomi 70S dei batteri. Quale struttura di una cellula umana può subire effetti collaterali, data la sua origine evolutiva?`,o:[`I mitocondri, perché derivano da batteri e hanno ribosomi simili ai batterici`,`Il reticolo endoplasmatico rugoso, perché i suoi ribosomi sono di tipo 70S`,`Il nucleolo, perché assembla le subunità di tutti i ribosomi della cellula`,`I lisosomi, perché contengono enzimi che digeriscono materiale di origine batterica`],a:0,e:`I ribosomi citoplasmatici e quelli del RER delle cellule eucariote sono 80S, quindi non sono bersaglio degli antibiotici specifici per i 70S. I mitocondri, per la loro origine endosimbiontica, hanno ribosomi più simili a quelli batterici e possono quindi risentirne. Nucleolo e lisosomi non hanno ribosomi di tipo batterico.`},
{id:'bi_cell_sf4',t:'bi_cell',l:4,q:`Cellule pancreatiche che secernono proteine sono esposte per pochi minuti ad amminoacidi radioattivi, poi trasferite in un terreno con amminoacidi non marcati. Dopo 5 minuti la radioattività è nel reticolo endoplasmatico rugoso, dopo 20 minuti nell'apparato di Golgi, dopo 60 minuti nelle vescicole di secrezione. Che cosa si deduce?`,o:[`Le proteine da secernere passano dal RER al Golgi e poi alle vescicole di secrezione`,`Le proteine da secernere nascono nel Golgi e passano poi al RER e alle vescicole`,`Le proteine da secernere nascono nelle vescicole e passano poi al Golgi e al RER`,`Le proteine da secernere restano nel RER e solo gli amminoacidi raggiungono il Golgi`],a:0,e:`La breve esposizione al marcatore (impulso) segna solo le proteine sintetizzate in quel momento; seguirne la posizione nel tempo mostra la via percorsa. La radioattività compare in sequenza nel RER, nel Golgi e nelle vescicole, quindi quella è la direzione del flusso. Le altre sequenze invertono l'ordine o non spiegano la comparsa della radioattività nel Golgi.`},
{id:'bi_cell_sf5',t:'bi_cell',l:4,q:`Una donna è affetta da una malattia causata da una mutazione del DNA mitocondriale. Come può essere trasmessa ai suoi figli?`,o:[`Può essere trasmessa a tutti i figli, perché i mitocondri provengono quasi solo dall'ovocita`,`Può essere trasmessa solo alle figlie, perché il DNA mitocondriale si trova sul cromosoma X`,`Può essere trasmessa solo ai figli maschi, perché il DNA mitocondriale si trova sul cromosoma Y`,`Può essere trasmessa a metà dei figli, perché si segrega come una coppia di alleli autosomici`],a:0,e:`Il DNA mitocondriale è un piccolo genoma circolare nei mitocondri, non sui cromosomi X o Y né sugli autosomi. Alla fecondazione i mitocondri dello zigote derivano quasi esclusivamente dall'ovocita, quindi la trasmissione è materna e interessa figli di entrambi i sessi, con gravità variabile secondo la quota di mitocondri mutati.`},
{id:'bi_cell_sf6',t:'bi_cell',l:4,q:`Una cellula viene trattata con colchicina, che depolimerizza i microtubuli senza alterare i filamenti di actina. Quale funzione risulta compromessa?`,o:[`Il trasporto di vescicole e organuli, mediato da chinesine e dineine sui microtubuli`,`Lo strangolamento del citoplasma da parte dell'anello contrattile di actina e miosina nella citodieresi`,`Il movimento ameboide dei leucociti, basato sulla polimerizzazione dell'actina corticale`,`La resistenza alla trazione meccanica garantita dai filamenti intermedi di cheratina nell'epitelio`],a:0,e:`Chinesine e dineine si muovono lungo i microtubuli, che la colchicina smonta. Anello contrattile e movimento ameboide dipendono dall'actina, e la resistenza meccanica dai filamenti intermedi: sono componenti del citoscheletro diversi, quindi non direttamente colpiti.`},
{id:'bi_cell_sf7',t:'bi_cell',l:4,q:`Una cellula della corteccia surrenale produce ormoni steroidei, derivati del colesterolo. Quale organulo è particolarmente sviluppato in questa cellula?`,o:[`Il reticolo endoplasmatico liscio`,`Il reticolo endoplasmatico rugoso`,`I lisosomi, ricchi di idrolasi`,`Il nucleolo, sede dei geni per l'rRNA`],a:0,e:`Il reticolo endoplasmatico liscio ospita gli enzimi per la sintesi di lipidi e steroidi, per cui è molto esteso nelle cellule che producono ormoni steroidei. Il RER è abbondante nelle cellule che secernono proteine, il nucleolo è legato alla sintesi dei ribosomi e i lisosomi alla digestione intracellulare.`},
