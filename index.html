{id:"cl7_002",t:"cl7",p:"7.1",l:1,q:"Un sistema che scambia energia ma non materia con l'ambiente è…",o:["chiuso", "aperto", "isolato", "universale"],a:0,e:"Aperto: scambia materia ed energia; isolato: non scambia nulla (es. thermos chiuso)."},
{id:"cl7_003",t:"cl7",p:"7.1",l:2,q:"L'acqua in un thermos chiuso è un esempio di sistema…",o:["isolato", "aperto", "chiuso", "eterogeneo"],a:0,e:"Non scambia né materia né energia con l'ambiente."},
{id:"cl7_004",t:"cl7",p:"7.1.1",l:1,q:"Che cos'è una funzione di stato?",o:["Una grandezza che dipende solo dallo stato del sistema, non dal percorso", "Una grandezza che dipende dal percorso", "Il calore scambiato", "Il lavoro compiuto"],a:0,e:"La sua variazione dipende solo dagli stati iniziale e finale."},
{id:"cl7_005",t:"cl7",p:"7.1.1",l:2,q:"Quale legge afferma che la variazione di una funzione di stato non dipende dal numero di stadi?",o:["La legge di Hess", "La legge di Henry", "La legge di Raoult", "La legge di Arrhenius"],a:0,e:"Una reazione in uno o più passaggi ha la stessa ΔH complessiva."},
{id:"cl7_006",t:"cl7",p:"7.1.1",l:2,q:"Quale di queste NON è una funzione di stato citata dal libro?",o:["Il calore Q", "L'energia interna U", "L'entalpia H", "L'entropia S"],a:0,e:"U, H, S e G sono funzioni di stato."},
{id:"cl7_007",t:"cl7",p:"7.1.2",l:1,q:"In una reazione esotermica, ΔH è…",o:["negativa", "positiva", "nulla", "sempre uguale a ΔG"],a:0,e:"Il calore è ceduto all'ambiente: l'entalpia dei prodotti è minore di quella dei reagenti."},
{id:"cl7_008",t:"cl7",p:"7.1.2",l:2,q:"Che relazione c'è tra il ΔH di una reazione e quello della reazione inversa?",o:["Stesso valore, segno opposto", "Sono uguali", "Sono sempre zero", "L'inverso è il doppio"],a:0,e:"Se una reazione libera 100 kJ, l'inversa ne assorbe 100."},
{id:"cl7_009",t:"cl7",p:"7.1.2",l:2,q:"Quale passaggio di stato è esotermico?",o:["La condensazione", "La fusione", "La vaporizzazione", "La sublimazione"],a:0,e:"Esotermici: condensazione, solidificazione, brinamento; endotermici: fusione, vaporizzazione, sublimazione."},
{id:"cl7_010",t:"cl7",p:"7.1.2",l:3,q:"Perché la bevanda nel contenitore \"autoriscaldante\" si scalda?",o:["La dissoluzione del CaCl₂ in acqua è esotermica", "Il CaCl₂ brucia", "Si forma vapore", "Avviene una reazione nucleare"],a:0,e:"Premendo il fondo, sale e acqua si mescolano e si libera calore."},
{id:"cl7_011",t:"cl7",p:"7.1.3",l:1,q:"Che cosa misura l'entropia?",o:["Il grado di disordine microscopico (dispersione dell'energia)", "La velocità di reazione", "Il calore a pressione costante", "L'energia di attivazione"],a:0,e:"Aumenta con il numero di particelle, la temperatura e i gradi di libertà."},
{id:"cl7_012",t:"cl7",p:"7.1.3",l:2,q:"In quale processo l'entropia aumenta?",o:["Nell'evaporazione di un liquido", "Nel congelamento dell'acqua", "Nella condensazione del vapore", "Nella cristallizzazione di un sale"],a:0,e:"Passando da liquido ad aeriforme aumentano i gradi di libertà delle particelle."},
{id:"cl7_013",t:"cl7",p:"7.1.4",l:1,q:"Qual è l'espressione dell'energia libera di Gibbs?",o:["ΔG = ΔH − TΔS", "ΔG = ΔH + TΔS", "ΔG = TΔS − ΔH", "ΔG = ΔH · ΔS"],a:0,e:"La spontaneità dipende dal segno di ΔG."},
{id:"cl7_014",t:"cl7",p:"7.1.4",l:1,q:"Una reazione con ΔG < 0 è…",o:["spontanea (esoergonica)", "non spontanea", "all'equilibrio", "sempre veloce"],a:0,e:"ΔG > 0 non spontanea (endoergonica), ΔG = 0 all'equilibrio."},
{id:"cl7_015",t:"cl7",p:"7.1.4",l:2,q:"Una reazione con ΔH < 0 e ΔS > 0 è spontanea…",o:["a ogni temperatura", "solo ad alta temperatura", "solo a bassa temperatura", "mai"],a:0,e:"Entrambi i termini rendono ΔG negativo."},
{id:"cl7_016",t:"cl7",p:"7.1.4",l:3,q:"Una reazione con ΔH > 0 e ΔS > 0 è spontanea…",o:["solo a temperatura elevata", "a ogni temperatura", "solo a bassa temperatura", "mai"],a:0,e:"Serve che TΔS superi ΔH, quindi T alta."},
{id:"cl7_017",t:"cl7",p:"7.1.4",l:3,q:"Perché i diamanti non si trasformano in grafite pur essendo il processo spontaneo?",o:["La reazione è estremamente lenta", "Il processo ha ΔG > 0", "La grafite è meno stabile", "Il diamante è un gas"],a:0,e:"Spontaneità e velocità sono concetti separati."},
{id:"cl7_018",t:"cl7",p:"7.2.1",l:1,q:"Che cosa serve perché un urto tra reagenti sia efficace?",o:["Energia sufficiente e orientazione opportuna", "Solo energia sufficiente", "Solo che le particelle si tocchino", "Un catalizzatore"],a:0,e:"La velocità è proporzionale al numero di collisioni efficaci."},
{id:"cl7_019",t:"cl7",p:"7.2.1",l:2,q:"Che cos'è l'energia di attivazione?",o:["La differenza di energia tra stato di transizione e reagenti", "La differenza tra prodotti e reagenti", "L'energia dei prodotti", "L'energia del catalizzatore"],a:0,e:"È l'energia minima perché un urto sia efficace."},
{id:"cl7_020",t:"cl7",p:"7.2.1",l:2,q:"Come si chiama la struttura instabile al massimo del profilo energetico?",o:["Complesso attivato (stato di transizione)", "Intermedio stabile", "Prodotto", "Catalizzatore"],a:0,e:"In essa i legami dei reagenti si stanno rompendo e quelli dei prodotti formando."},
{id:"cl7_021",t:"cl7",p:"7.2.1",l:3,q:"Come varia la velocità di reazione all'aumentare dell'energia di attivazione?",o:["Diminuisce", "Aumenta", "Non cambia", "Raddoppia"],a:0,e:"Una barriera più alta rende meno probabili gli urti efficaci."},
{id:"cl7_022",t:"cl7",p:"7.2.2",l:2,q:"In una reazione di ordine zero la velocità…",o:["non dipende dalla concentrazione del reagente", "è proporzionale alla concentrazione", "è proporzionale al quadrato della concentrazione", "è sempre nulla"],a:0,e:"v = k: esempio la decomposizione di NH₃ su oro."},
{id:"cl7_023",t:"cl7",p:"7.2.2",l:2,q:"In v = k[A]²[B], qual è l'ordine globale?",o:["3", "2", "1", "4"],a:0,e:"Ordine 2 rispetto ad A, 1 rispetto a B: globale 3."},
{id:"cl7_024",t:"cl7",p:"7.2.2",l:3,q:"In una reazione del primo ordine, raddoppiando [A] la velocità…",o:["raddoppia", "quadruplica", "non cambia", "si dimezza"],a:0,e:"v = k[A]: proporzionalità diretta. Per il secondo ordine quadruplicherebbe."},
{id:"cl7_025",t:"cl7",p:"7.2.3",l:1,q:"Quale di questi fattori NON aumenta la velocità di reazione?",o:["Ridurre la superficie di contatto", "Aumentare la concentrazione", "Aumentare la temperatura", "Usare un catalizzatore"],a:0,e:"Una superficie maggiore aumenta gli urti possibili."},
{id:"cl7_026",t:"cl7",p:"7.2.3",l:2,q:"Perché aumentando la concentrazione dei reagenti la reazione accelera?",o:["Aumenta la probabilità di urti efficaci", "Diminuisce l'energia di attivazione", "Cambia ΔG", "Aumenta la costante di equilibrio"],a:0,e:"Più particelle per unità di volume significano più collisioni."},
{id:"cl7_027",t:"cl7",p:"7.2.4",l:2,q:"Perché la velocità aumenta con la temperatura?",o:["Aumenta l'energia cinetica media e quindi gli urti efficaci", "Diminuisce l'energia di attivazione", "Cambia la ΔH", "Aumenta la concentrazione"],a:0,e:"La barriera resta uguale, ma più particelle la superano."},
{id:"cl7_028",t:"cl7",p:"7.2.4",l:2,q:"Quale equazione lega la costante cinetica k alla temperatura?",o:["L'equazione di Arrhenius (1889)", "L'equazione di Nernst", "La legge di Hess", "La legge di Henry"],a:0,e:"k = A·e^(−Eₐ/RT); A è il fattore di frequenza."},
{id:"cl7_029",t:"cl7",p:"7.2.4",l:3,q:"Su quale teoria si basa l'equazione di Eyring?",o:["La teoria dello stato di transizione", "La teoria delle collisioni", "La teoria di Arrhenius degli acidi", "La teoria VSEPR"],a:0,e:"Usa la differenza di energia libera tra reagenti e complesso attivato."},
{id:"cl7_030",t:"cl7",p:"7.2.5",l:2,q:"Che cos'è il rate-determining step?",o:["Lo stadio più lento, che determina la legge cinetica", "Lo stadio più veloce", "L'ultimo stadio", "Lo stadio con più molecole"],a:0,e:"In una reazione a più stadi comanda il più lento."},
{id:"cl7_031",t:"cl7",p:"7.2.5",l:2,q:"Che cos'è la molecolarità di uno stadio elementare?",o:["Il numero di particelle che vi partecipano come reagenti", "L'ordine globale", "Il numero di prodotti", "La massa molecolare"],a:0,e:"Le reazioni elementari avvengono in un unico stadio."},
{id:"cl7_032",t:"cl7",p:"7.2.6",l:1,q:"Come agisce un catalizzatore?",o:["Abbassa l'energia di attivazione", "Aumenta l'energia di attivazione", "Cambia ΔH", "Sposta l'equilibrio verso i prodotti"],a:0,e:"Modifica il meccanismo e si ritrova inalterato alla fine."},
{id:"cl7_033",t:"cl7",p:"7.2.6",l:2,q:"Quale affermazione sui catalizzatori è FALSA?",o:["Rendono spontanea una reazione non spontanea", "Non compaiono nell'equazione globale", "Sono selettivi", "Accelerano il raggiungimento dell'equilibrio"],a:0,e:"Non cambiano né ΔH né ΔG: non possono rendere spontanea una reazione che non lo è."},
{id:"cl7_034",t:"cl7",p:"7.2.6",l:2,q:"Che cosa fanno gli inibitori?",o:["Rallentano la reazione aumentando l'energia di attivazione", "Accelerano la reazione", "Spostano l'equilibrio", "Cambiano ΔG"],a:0,e:"Sono l'opposto dei catalizzatori."},
{id:"cl7_035",t:"cl7",p:"7.2.6",l:2,q:"Che cosa contiene la marmitta catalitica?",o:["Particelle di platino, palladio, rodio o ossido di cerio", "Enzimi", "Carbone attivo", "Acido solforico"],a:0,e:"Catalizzano la trasformazione dei gas di scarico tossici in gas meno dannosi."},
{id:"cl7_036",t:"cl7",p:"7.2.6",l:3,q:"Che cosa indica una Km bassa nella cinetica di Michaelis-Menten?",o:["Alta affinità tra enzima e substrato", "Bassa affinità", "Velocità massima bassa", "Enzima inattivo"],a:0,e:"Km è la [S] a cui v = Vmax/2: più è bassa, meno substrato serve."},
{id:"cl7_037",t:"cl7",p:"7.2.6",l:3,q:"Perché lo zucchero non brucia spontaneamente all'aria pur avendo ΔH < 0?",o:["Ha un'energia di attivazione molto alta", "La sua combustione è endotermica", "Non contiene carbonio", "ΔG è positivo"],a:0,e:"Nel corpo gli enzimi abbassano la barriera."},
{id:"cl7_038",t:"cl7",p:"7.3",l:1,q:"In una reazione all'equilibrio…",o:["velocità diretta e inversa sono uguali e le concentrazioni non cambiano", "la reazione si è fermata", "ci sono solo prodotti", "ci sono solo reagenti"],a:0,e:"L'equilibrio è dinamico: entrambi i processi continuano."},
{id:"cl7_039",t:"cl7",p:"7.3",l:2,q:"Quanto vale ΔG all'equilibrio?",o:["0", "Negativo", "Positivo", "Uguale a ΔH"],a:0,e:"All'equilibrio diretta e inversa sono ugualmente spontanee."},
{id:"cl7_040",t:"cl7",p:"7.3",l:2,q:"Le reazioni \"a completamento\" sono…",o:["reazioni con equilibrio molto spostato verso i prodotti", "reazioni senza equilibrio", "reazioni lente", "reazioni endotermiche"],a:0,e:"Tutte le reazioni possono essere considerate reversibili."},
{id:"cl7_041",t:"cl7",p:"7.3.1",l:1,q:"Da che cosa dipende il valore di K_eq?",o:["Solo dalla temperatura", "Dalle concentrazioni iniziali", "Dalla pressione", "Dal catalizzatore"],a:0,e:"È caratteristica di ogni reazione a una data temperatura."},
{id:"cl7_042",t:"cl7",p:"7.3.1",l:2,q:"Che cosa indica K_eq ≫ 1?",o:["L'equilibrio è spostato verso i prodotti", "L'equilibrio è spostato verso i reagenti", "La reazione è lenta", "La reazione è endotermica"],a:0,e:"K_eq ≪ 1 indica invece un equilibrio spostato verso i reagenti."},
{id:"cl7_043",t:"cl7",p:"7.3.1",l:2,q:"Che cosa NON compare nell'espressione di K_eq?",o:["Le concentrazioni dei solidi e del solvente", "Le concentrazioni dei gas", "Le concentrazioni dei soluti", "I coefficienti stechiometrici come esponenti"],a:0,e:"Per esempio in soluzione acquosa non si scrive [H₂O]."},
{id:"cl7_044",t:"cl7",p:"7.3.1",l:3,q:"Se Q < K_eq, che cosa succede?",o:["La reazione diretta è spontanea (ΔG < 0)", "È spontanea la reazione inversa", "Il sistema è all'equilibrio", "La reazione si ferma"],a:0,e:"Il sistema evolve verso i prodotti finché Q = K_eq."},
{id:"cl7_045",t:"cl7",p:"7.3.1",l:3,q:"Qual è l'espressione di K per CH₄(g) + 2 H₂S(g) ⇌ CS₂(g) + 4 H₂(g)?",o:["[CS₂][H₂]⁴ / ([CH₄][H₂S]²)", "[CH₄][H₂S]² / ([CS₂][H₂]⁴)", "[CS₂][H₂] / ([CH₄][H₂S])", "[CS₂] + 4[H₂]"],a:0,e:"Prodotti al numeratore e reagenti al denominatore, ciascuno elevato al coefficiente."},
{id:"cl7_046",t:"cl7",p:"7.3.2",l:1,q:"Aggiungendo un reagente a un sistema all'equilibrio, l'equilibrio si sposta…",o:["verso destra (prodotti)", "verso sinistra (reagenti)", "non si sposta", "e cambia K"],a:0,e:"Il sistema consuma il reagente aggiunto; K resta uguale."},
{id:"cl7_047",t:"cl7",p:"7.3.2",l:2,q:"In una reazione esotermica, aumentando la temperatura…",o:["K diminuisce e l'equilibrio si sposta verso i reagenti", "K aumenta", "K non cambia", "l'equilibrio si sposta verso i prodotti"],a:0,e:"Il calore si comporta come un prodotto."},
{id:"cl7_048",t:"cl7",p:"7.3.2",l:2,q:"Un catalizzatore sposta l'equilibrio?",o:["No, accelera solo il suo raggiungimento", "Sì, verso i prodotti", "Sì, verso i reagenti", "Sì, cambia K"],a:0,e:"Abbassa allo stesso modo le barriere della reazione diretta e inversa."},
{id:"cl7_049",t:"cl7",p:"7.3.2",l:3,q:"Per N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), un aumento di pressione sposta l'equilibrio…",o:["verso i prodotti", "verso i reagenti", "non lo sposta", "cambia K"],a:0,e:"Ci sono 4 moli di gas a sinistra e 2 a destra: la pressione favorisce il lato con meno moli."},
{id:"cl7_050",t:"cl7",p:"7.3.2",l:3,q:"Per H₂(g) + I₂(g) ⇌ 2 HI(g), che effetto ha un aumento di pressione?",o:["Nessuno: le moli di gas sono uguali nei due membri", "Sposta verso HI", "Sposta verso H₂ e I₂", "Cambia K"],a:0,e:"2 moli a sinistra e 2 a destra."},
{id:"cl7_051",t:"cl7",p:"7.3.3",l:2,q:"Che cos'è il prodotto di solubilità K_ps di Ag₂SO₄?",o:["[Ag⁺]²·[SO₄²⁻]", "[Ag⁺]·[SO₄²⁻]", "[Ag₂SO₄]", "[Ag⁺]²·[SO₄²⁻]/[Ag₂SO₄]"],a:0,e:"Il solido non compare; ogni ione è elevato al suo coefficiente."},
{id:"cl7_052",t:"cl7",p:"7.3.3",l:2,q:"Quando avviene la precipitazione di un sale?",o:["Quando il prodotto ionico supera K_ps", "Quando il prodotto ionico è minore di K_ps", "Sempre", "Mai"],a:0,e:"La soluzione diventa sovrasatura e si forma la fase solida."},
{id:"cl7_053",t:"cl7",p:"7.3.3",l:3,q:"Qual è la solubilità di AgCl con K_ps = 1,8·10⁻¹⁰?",o:["Circa 1,3·10⁻⁵ M", "1,8·10⁻¹⁰ M", "Circa 1,3·10⁻¹⁰ M", "0,9·10⁻⁵ M"],a:0,e:"K_ps = s², quindi s = √(1,8·10⁻¹⁰) ≈ 1,3·10⁻⁵ M."},
{id:"cl7_054",t:"cl7",p:"7.3.3",l:3,q:"Che cosa provoca l'effetto dello ione comune?",o:["Diminuisce la solubilità del sale poco solubile", "Aumenta la solubilità", "Non ha effetto", "Cambia K_ps"],a:0,e:"Aggiungendo AgNO₃ a una soluzione satura di Ag₂SO₄ precipita altro sale (Le Châtelier)."},
{id:"cl7_055",t:"cl7",p:"7.3.4",l:2,q:"Che cosa sono gli equilibri multipli?",o:["Più equilibri simultanei e collegati nello stesso sistema", "Un equilibrio ripetuto più volte", "Equilibri tra più fasi solide", "Equilibri senza costante"],a:0,e:"Esempio: le dissociazioni successive degli acidi poliprotici come H₂CO₃."},
{id:"cl7_056",t:"cl7",p:"7.3.4",l:3,q:"Perché l'ammoniaca scioglie AgCl?",o:["Forma il complesso [Ag(NH₃)₂]⁺ e sottrae Ag⁺, spostando l'equilibrio di solubilità", "Aumenta K_ps", "Ossida l'argento", "Diminuisce la temperatura"],a:0,e:"La seconda reazione sposta la prima verso destra."},
{id:"cl7_057",t:"cl7",p:"7.3.4",l:3,q:"Quanto vale la K complessiva di una serie di equilibri multipli?",o:["Il prodotto delle singole costanti", "La somma delle costanti", "La media", "La costante più grande"],a:0,e:"Per esempio K = K₁·K₂ per un acido diprotico."},
{id:"cl7_058",t:"cl7",p:"7.3.5",l:2,q:"Che relazione c'è tra ΔG e ΔE in una redox?",o:["ΔG = −n·F·ΔE", "ΔG = n·F·ΔE", "ΔG = ΔE/nF", "ΔG = −RT·ΔE"],a:0,e:"ΔE > 0 corrisponde a ΔG < 0: redox spontanea, come in una pila."},
{id:"cl7_059",t:"cl7",p:"7.3.5",l:3,q:"Se ΔE° > 0, la K_eq della redox è…",o:["maggiore di 1", "minore di 1", "uguale a 0", "negativa"],a:0,e:"K = e^(nFΔE°/RT): con ΔE° positivo la reazione è favorita verso destra."},
{id:"cl7_060",t:"cl7",p:"7.3.6",l:2,q:"Come può la respirazione modificare il pH del sangue?",o:["Eliminando più o meno CO₂, che regola l'equilibrio dell'acido carbonico", "Producendo ossigeno", "Eliminando acqua", "Producendo glucosio"],a:0,e:"CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻: è modulato da polmoni e reni."},
{id:"cl7_061",t:"cl7",p:"7.3.6",l:2,q:"Quale patologia deriva dalla precipitazione di sali nel corpo, secondo il libro?",o:["I calcoli renali", "Il diabete", "L'anemia", "L'asma"],a:0,e:"Calcio e fosfato sono in equilibrio tra forma disciolta e minerale."},
{id:"cl7_062",t:"cl7",p:"7.3.6",l:3,q:"Dove ha l'assorbimento massimo l'aspirina, secondo il libro?",o:["Nello stomaco", "Nell'intestino crasso", "Nella bocca", "Nel fegato"],a:0,e:"È un acido debole: nell'ambiente acido dello stomaco prevale la forma non ionizzata."},
{id:"cl7_sf1",t:"cl7",p:"7.3.2",l:4,q:"Per la reazione esotermica 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g), quale intervento aumenta la resa di SO₃?",o:["Aumentare la pressione", "Aumentare la temperatura", "Aggiungere un catalizzatore", "Sottrarre O₂"],a:0,e:"3 moli di gas diventano 2: la pressione favorisce SO₃. Alzare T sfavorisce i prodotti (esotermica); il catalizzatore non sposta l'equilibrio."},
{id:"cl7_sf2",t:"cl7",p:"7.1.4",l:4,q:"Una reazione ha ΔH = +40 kJ e ΔS = +100 J/K. Sopra quale temperatura è spontanea?",o:["400 K", "40 K", "4000 K", "È sempre spontanea"],a:0,e:"ΔG < 0 quando T > ΔH/ΔS = 40.000 J / 100 J/K = 400 K. Attenzione alle unità: kJ e J."},
{id:"cl7_sf3",t:"cl7",p:"7.2.2",l:4,q:"Per v = k[A][B], se si raddoppia [A] e si triplica [B], la velocità diventa…",o:["6 volte maggiore", "5 volte maggiore", "9 volte maggiore", "uguale"],a:0,e:"v' = k(2[A])(3[B]) = 6v."},
{id:"cl7_sf4",t:"cl7",p:"7.3.3",l:4,q:"Per un sale MX₂ con solubilità s, quanto vale K_ps?",o:["4s³", "s²", "2s³", "s³"],a:0,e:"MX₂ ⇌ M²⁺ + 2 X⁻: [M²⁺] = s, [X⁻] = 2s ⇒ K_ps = s·(2s)² = 4s³."},
{id:"cl8_001",t:"cl8",p:"8.1.1",l:1,q:"Secondo Arrhenius, che cos'è un acido?",o:["Una specie che in acqua libera ioni H⁺", "Una specie che accetta H⁺", "Una specie che accetta un doppietto", "Una specie che libera OH⁻"],a:0,e:"Una base di Arrhenius libera invece ioni OH⁻, come NaOH."},
{id:"cl8_002",t:"cl8",p:"8.1.1",l:2,q:"Qual è un limite della teoria di Arrhenius?",o:["Non considera il ruolo del solvente e vale solo per specie che contengono H⁺ o OH⁻", "Non spiega gli acidi forti", "Vale solo per i gas", "Non spiega la neutralizzazione"],a:0,e:"Per esempio non spiega la basicità dell'ammoniaca, che non contiene OH⁻."},
{id:"cl8_003",t:"cl8",p:"8.1.2",l:1,q:"Secondo Brønsted-Lowry, una base è…",o:["una specie che accetta uno ione H⁺", "una specie che cede H⁺", "una specie che cede OH⁻", "una specie che accetta elettroni"],a:0,e:"Acidi e basi esistono come coppie coniugate."},
{id:"cl8_004",t:"cl8",p:"8.1.2",l:2,q:"Qual è la base coniugata di HBr?",o:["Br⁻", "H₃O⁺", "H₂O", "HBr₂⁻"],a:0,e:"HBr cede H⁺ all'acqua e diventa Br⁻."},
{id:"cl8_005",t:"cl8",p:"8.1.2",l:2,q:"Nella reazione NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, l'acqua si comporta da…",o:["acido", "base", "catalizzatore", "ossidante"],a:0,e:"Cede un H⁺ all'ammoniaca; con HCl invece l'acqua fa da base. È anfiprotica."},
{id:"cl8_006",t:"cl8",p:"8.1.2",l:2,q:"Che cosa significa che l'acqua è anfiprotica?",o:["Può sia cedere sia accettare ioni H⁺", "È un acido forte", "Non si ionizza mai", "È una base di Lewis soltanto"],a:0,e:"Si comporta da acido o da base a seconda della specie con cui reagisce."},
{id:"cl8_007",t:"cl8",p:"8.1.2",l:3,q:"Perché l'acido acetico può comportarsi da base?",o:["Reagendo con un acido più forte, come HClO₄, ne accetta un H⁺", "Perché contiene OH⁻", "Perché è anfotero in ogni caso", "Perché è un sale"],a:0,e:"Il comportamento acido o basico dipende dalla specie con cui si reagisce."},
{id:"cl8_008",t:"cl8",p:"8.1.2",l:2,q:"Che cos'è un acido poliprotico?",o:["Un acido che può cedere più di un H⁺", "Un acido con più atomi di ossigeno", "Un acido forte", "Un acido organico"],a:0,e:"H₂SO₄ è diprotico e cede i due H⁺ in due passaggi; HNO₃ è monoprotico."},
{id:"cl8_009",t:"cl8",p:"8.1.2",l:3,q:"In un composto XOH, quando prevale il comportamento basico?",o:["Quando X ha bassa elettronegatività (es. NaOH)", "Quando X è molto elettronegativo", "Quando X è l'ossigeno", "Sempre"],a:0,e:"Il legame X–O diventa ionico e si libera OH⁻; con X molto elettronegativo si libera H⁺."},
{id:"cl8_010",t:"cl8",p:"8.1.3",l:1,q:"Secondo Lewis, un acido è…",o:["un accettore di un doppietto elettronico", "un donatore di H⁺", "un donatore di doppietti", "una specie che libera OH⁻"],a:0,e:"Una base di Lewis dona un doppietto; si forma un legame dativo."},
{id:"cl8_011",t:"cl8",p:"8.1.3",l:2,q:"Perché BF₃ è un acido di Lewis?",o:["Il boro ha orbitali vuoti ed è circondato da soli sei elettroni", "Perché cede H⁺", "Perché contiene fluoro", "Perché è ionico"],a:0,e:"Accetta il doppietto dell'ammoniaca formando un legame dativo."},
{id:"cl8_012",t:"cl8",p:"8.1.3",l:2,q:"Quale di queste specie è una base di Lewis?",o:["NH₃", "H⁺", "BF₃", "Al³⁺"],a:0,e:"NH₃ ha un doppietto solitario da donare; anche CN⁻ è una base di Lewis."},
{id:"cl8_013",t:"cl8",p:"8.2.1",l:1,q:"Un acido forte in acqua è…",o:["completamente dissociato (α = 1)", "parzialmente dissociato", "non dissociato", "un non elettrolita"],a:0,e:"Gli acidi deboli sono solo parzialmente dissociati."},
{id:"cl8_014",t:"cl8",p:"8.2.1",l:2,q:"A un valore più alto di Ka corrisponde un acido…",o:["più forte", "più debole", "neutro", "basico"],a:0,e:"Più Ka è grande, più l'equilibrio è spostato verso la forma dissociata. Viceversa, più pKa è alto, più l'acido è debole."},
{id:"cl8_015",t:"cl8",p:"8.2.1",l:2,q:"Quale di questi è un acido debole?",o:["HF", "HCl", "HNO₃", "HClO₄"],a:0,e:"Gli idracidi forti sono HCl, HBr, HI; HF è debole."},
{id:"cl8_016",t:"cl8",p:"8.2.1",l:2,q:"Quale di queste è una base debole?",o:["NH₃", "NaOH", "KOH", "Ba(OH)₂"],a:0,e:"Gli idrossidi dei gruppi 1 e 2 sono basi forti; ammoniaca e ammine sono deboli."},
{id:"cl8_017",t:"cl8",p:"8.2.1",l:3,q:"Un acido con Ka < 10⁻¹⁴ è…",o:["debolissimo, più debole dell'acqua", "forte", "moderatamente forte", "neutro"],a:0,e:"Ka ≫ 1 acido forte; Ka ≪ 1 debole."},
{id:"cl8_018",t:"cl8",p:"8.2.2",l:2,q:"Fissato l'elemento centrale, come varia la forza degli ossiacidi con il numero di ossigeni?",o:["Aumenta", "Diminuisce", "Non cambia", "Si annulla"],a:0,e:"Gli O sottraggono densità elettronica al legame O–H: HClO₄ è più forte di HClO."},
{id:"cl8_019",t:"cl8",p:"8.2.2",l:2,q:"Che cosa rende un acido più forte?",o:["Un legame H–X debole e una base coniugata stabile", "Un legame H–X molto forte", "Una base coniugata instabile", "L'assenza di ossigeno"],a:0,e:"La stabilità della base coniugata può venire da risonanza o effetti induttivi."},
{id:"cl8_020",t:"cl8",p:"8.2.2",l:3,q:"Che cosa riduce la basicità di una specie?",o:["Atomi elettronegativi vicini o delocalizzazione della coppia per risonanza", "Atomi poco elettronegativi legati", "Un doppietto disponibile", "Una carica negativa localizzata"],a:0,e:"La base è più forte quanto più il suo doppietto è disponibile."},
{id:"cl8_021",t:"cl8",p:"8.3",l:1,q:"Quanto vale Kw a 25 °C?",o:["10⁻¹⁴", "10⁻⁷", "14", "7"],a:0,e:"Kw = [H₃O⁺][OH⁻] = 10⁻¹⁴: in acqua pura [H₃O⁺] = [OH⁻] = 10⁻⁷ M."},
{id:"cl8_022",t:"cl8",p:"8.3",l:2,q:"Come varia Kw con la temperatura?",o:["Aumenta, perché l'autoprotolisi è endotermica", "Diminuisce", "Non cambia", "Si annulla a 100 °C"],a:0,e:"Per questo pH + pOH = 14 vale solo a 25 °C."},
{id:"cl8_023",t:"cl8",p:"8.3",l:2,q:"Quanto vale Ka·Kb per una coppia acido/base coniugata?",o:["Kw = 10⁻¹⁴", "1", "14", "Ka + Kb"],a:0,e:"Più forte è l'acido, più debole è la sua base coniugata. In forma logaritmica pKa + pKb = 14."},
{id:"cl8_024",t:"cl8",p:"8.3",l:3,q:"Una base ha pKb = 9,2. Qual è il pKa del suo acido coniugato?",o:["4,8", "9,2", "23,2", "5,2"],a:0,e:"pKa = 14 − 9,2 = 4,8."},
{id:"cl8_025",t:"cl8",p:"8.3",l:3,q:"Un acido forte è coniugato con…",o:["una base debolissima", "una base forte", "un acido debole", "un'altra coppia forte"],a:0,e:"Un acido debole è invece coniugato con una base debole."},
{id:"cl8_026",t:"cl8",p:"8.4",l:1,q:"Come si definisce il pH?",o:["pH = −log[H₃O⁺]", "pH = log[H₃O⁺]", "pH = [H₃O⁺]·10", "pH = 14 · [OH⁻]"],a:0,e:"Analogamente pOH = −log[OH⁻] e a 25 °C pH + pOH = 14."},
{id:"cl8_027",t:"cl8",p:"8.4",l:1,q:"Una soluzione con pH = 9 è…",o:["basica", "acida", "neutra", "sempre tampone"],a:0,e:"pH < 7 acida, = 7 neutra, > 7 basica (alcalina)."},
{id:"cl8_028",t:"cl8",p:"8.4",l:2,q:"In una soluzione con [OH⁻] = 10⁻⁴ M, quanto vale il pH?",o:["10", "4", "−4", "14"],a:0,e:"pOH = 4, quindi pH = 14 − 4 = 10."},
{id:"cl8_029",t:"cl8",p:"8.4",l:2,q:"Se il pH passa da 3 a 5, la concentrazione di H⁺…",o:["diventa 100 volte minore", "raddoppia", "diventa 2 volte minore", "diventa 100 volte maggiore"],a:0,e:"Ogni unità di pH vale un fattore 10."},
{id:"cl8_030",t:"cl8",p:"8.4.1",l:1,q:"Qual è il pH di HCl 0,01 M?",o:["2", "1", "0,01", "12"],a:0,e:"Acido forte: [H⁺] = 10⁻² M, pH = 2."},
{id:"cl8_031",t:"cl8",p:"8.4.1",l:2,q:"Qual è il pH di KOH 10⁻⁴ M?",o:["10", "4", "14", "−4"],a:0,e:"Base forte: pOH = 4, pH = 10."},
{id:"cl8_032",t:"cl8",p:"8.4.1",l:2,q:"Qual è il pH di H₂SO₄ 0,005 M (considerato acido forte diprotico)?",o:["2", "2,3", "3", "5"],a:0,e:"[H⁺] = 2 · 0,005 = 0,01 M, pH = 2."},
{id:"cl8_033",t:"cl8",p:"8.4.1",l:3,q:"Qual è il pH di Ba(OH)₂ 0,001 M?",o:["Circa 11,3", "11", "3", "2,7"],a:0,e:"[OH⁻] = 0,002 M, pOH ≈ 2,7, pH ≈ 11,3."},
{id:"cl8_034",t:"cl8",p:"8.4.1",l:3,q:"Per un acido debole HA, quale formula approssima [H₃O⁺]?",o:["√(Ka·Ca)", "Ka·Ca", "Ca", "Ka/Ca"],a:0,e:"Vale se Ka ≪ Ca e si trascura l'autoprotolisi dell'acqua."},
{id:"cl8_035",t:"cl8",p:"8.4.1",l:3,q:"Qual è circa il pH di NH₃ 0,1 M (Kb = 1,8·10⁻⁵)?",o:["11", "13", "3", "9"],a:0,e:"[OH⁻] = √(1,8·10⁻⁶) ≈ 10⁻³ M, pOH ≈ 3, pH ≈ 11."},
{id:"cl8_036",t:"cl8",p:"8.4.1",l:3,q:"Un acido debole 0,01 M ha pH…",o:["compreso tra 2 e 7", "uguale a 2", "minore di 2", "maggiore di 7"],a:0,e:"Un acido forte alla stessa concentrazione avrebbe pH 2; il debole è più vicino alla neutralità."},
{id:"cl8_037",t:"cl8",p:"8.4.2",l:1,q:"Con quali strumenti si misura il pH?",o:["Il pH-metro e gli indicatori (anche su cartine)", "Il termometro", "Il manometro", "Il contatore Geiger"],a:0,e:"Gli indicatori cambiano colore secondo il pH."},
{id:"cl8_038",t:"cl8",p:"8.4.2",l:2,q:"Che cosa sono di solito gli indicatori acido-base?",o:["Acidi organici deboli con forma protonata e deprotonata di colore diverso", "Sali neutri", "Basi forti", "Metalli"],a:0,e:"Il viraggio avviene quando pH = pK(ind)."},
{id:"cl8_039",t:"cl8",p:"8.4.2",l:3,q:"Se pH < pK dell'indicatore, quale forma prevale?",o:["La forma protonata HInd", "La forma deprotonata Ind⁻", "Entrambe in egual misura", "Nessuna"],a:0,e:"Con pH > pK prevale Ind⁻."},
{id:"cl8_040",t:"cl8",p:"8.5",l:1,q:"Che cosa si forma nella neutralizzazione tra un acido e una base in acqua?",o:["Un sale e acqua", "Solo un gas", "Un ossido", "Un idruro"],a:0,e:"H₃O⁺ + OH⁻ → 2 H₂O."},
{id:"cl8_041",t:"cl8",p:"8.5",l:2,q:"Una reazione di neutralizzazione dà sempre una soluzione a pH 7?",o:["No, dipende dalla forza di acido e base", "Sì, sempre", "Solo con acidi deboli", "Solo a 100 °C"],a:0,e:"Il sale formato può dare idrolisi acida o basica."},
{id:"cl8_042",t:"cl8",p:"8.5",l:3,q:"Perché la reazione H₃O⁺ + OH⁻ → 2 H₂O è praticamente irreversibile?",o:["Ha K = 1/Kw = 10¹⁴", "Ha K = 10⁻¹⁴", "È endotermica", "È lenta"],a:0,e:"È l'inverso dell'autoprotolisi."},
{id:"cl8_043",t:"cl8",p:"8.6",l:1,q:"Che cos'è l'idrolisi salina?",o:["La reazione degli ioni di un sale con l'acqua che modifica il pH", "La dissoluzione di un sale", "La precipitazione di un sale", "L'elettrolisi di un sale"],a:0,e:"Un sale può dare soluzioni acide, neutre o basiche."},
{id:"cl8_044",t:"cl8",p:"8.6",l:2,q:"Quale sale dà idrolisi basica?",o:["CH₃COONa", "NaCl", "NH₄Cl", "KClO₄"],a:0,e:"Lo ione acetato è la base coniugata di un acido debole."},
{id:"cl8_045",t:"cl8",p:"8.6",l:2,q:"Quale sale dà idrolisi acida?",o:["NH₄Cl", "NaCl", "CH₃COONa", "KNO₃"],a:0,e:"NH₄⁺ è l'acido coniugato della base debole NH₃."},
{id:"cl8_046",t:"cl8",p:"8.6",l:3,q:"Perché NaHCO₃ dà idrolisi basica mentre KHSO₄ dà idrolisi acida?",o:["H₂CO₃ è debole già in prima dissociazione (HCO₃⁻ è basico); H₂SO₄ è forte e HSO₄⁻ è acido", "Perché contengono metalli diversi", "Perché il bicarbonato è un acido forte", "Perché il solfato è basico"],a:0,e:"Contano le proprietà acido-base dei coniugati."},
{id:"cl8_047",t:"cl8",p:"8.6",l:3,q:"Il pH di una soluzione di NaCl è…",o:["7", "minore di 7", "maggiore di 7", "dipende dalla concentrazione"],a:0,e:"Da acido forte e base forte: idrolisi neutra a qualunque concentrazione."},
{id:"cl8_048",t:"cl8",p:"8.7",l:1,q:"Che cos'è una soluzione tampone?",o:["Una soluzione che mantiene il pH quasi costante aggiungendo piccole quantità di acidi o basi", "Una soluzione a pH 7", "Una soluzione di acido forte", "Una soluzione satura"],a:0,e:"È formata da un acido debole e la sua base coniugata (o viceversa) in concentrazioni simili."},
{id:"cl8_049",t:"cl8",p:"8.7",l:2,q:"Qual è l'equazione di Henderson-Hasselbalch?",o:["pH = pKa + log(Cb/Ca)", "pH = pKa − log(Cb/Ca)", "pH = −log Ka·Ca", "pH = 14 − pKb"],a:0,e:"Vale per rapporti Cb/Ca tra 1/10 e 10."},
{id:"cl8_050",t:"cl8",p:"8.7",l:2,q:"Quando un tampone ha la massima efficacia?",o:["Quando Cb = Ca, cioè pH = pKa", "Quando Cb = 10 Ca", "Quando non c'è acido", "A pH 7 sempre"],a:0,e:"Con log 1 = 0 il pH coincide con il pKa."},
{id:"cl8_051",t:"cl8",p:"8.7",l:3,q:"Diluendo un tampone con acqua, che cosa succede?",o:["Il pH non cambia, ma diminuisce il potere tamponante", "Il pH aumenta molto", "Il pH diminuisce molto", "Diventa una soluzione neutra"],a:0,e:"Il rapporto Cb/Ca resta uguale, ma ci sono meno moli per neutralizzare."},
{id:"cl8_052",t:"cl8",p:"8.7.1",l:2,q:"Quale coppia forma un tampone?",o:["CH₃COOH e CH₃COONa", "HCl e NaCl", "NaOH e NaCl", "HNO₃ e KNO₃"],a:0,e:"Serve un acido debole con la sua base coniugata. Anche NH₃/NH₄Cl."},
{id:"cl8_053",t:"cl8",p:"8.7.1",l:3,q:"Come si può preparare un tampone acetato partendo da acido acetico?",o:["Aggiungendo NaOH in difetto rispetto all'acido", "Aggiungendo HCl", "Aggiungendo NaOH in eccesso", "Aggiungendo NaCl"],a:0,e:"Parte dell'acido diventa acetato, il resto rimane: si ottiene la coppia coniugata."},
{id:"cl8_054",t:"cl8",p:"8.7.1",l:3,q:"Per un tampone basico NH₃/NH₄⁺, quale pK si usa nell'equazione di H-H?",o:["Il pKa di NH₄⁺ (14 − pKb di NH₃)", "Il pKb di NH₃", "Il pKw", "Il pKa dell'acqua"],a:0,e:"Si usa sempre il pKa dell'acido della coppia."},
{id:"cl8_055",t:"cl8",p:"8.7.2",l:1,q:"Qual è il pH fisiologico del plasma?",o:["Circa 7,35-7,45", "Circa 6,5", "Circa 8", "Esattamente 7"],a:0,e:"È mantenuto in un intervallo molto stretto dai sistemi tampone."},
{id:"cl8_056",t:"cl8",p:"8.7.2",l:2,q:"Qual è il principale tampone del sangue?",o:["Acido carbonico / bicarbonato", "Acido acetico / acetato", "Ammoniaca / ammonio", "HCl / NaCl"],a:0,e:"È regolato da polmoni (CO₂) e reni (HCO₃⁻)."},
{id:"cl8_057",t:"cl8",p:"8.8",l:2,q:"Che cos'è il punto di equivalenza di una titolazione acido-base?",o:["Il punto in cui le moli di base aggiunte sono stechiometricamente uguali a quelle di acido", "Il punto in cui il pH è sempre 7", "Il punto in cui l'indicatore si scioglie", "L'inizio della titolazione"],a:0,e:"Il punto finale, segnalato dal viraggio dell'indicatore, dovrebbe coincidere con esso."},
{id:"cl8_058",t:"cl8",p:"8.8",l:2,q:"Titolando un acido forte con una base forte, il pH al punto di equivalenza è…",o:["7", "minore di 7", "maggiore di 7", "0"],a:0,e:"Si forma un sale a idrolisi neutra."},
{id:"cl8_059",t:"cl8",p:"8.8",l:3,q:"Titolando un acido debole con una base forte, il pH al punto di equivalenza è…",o:["maggiore di 7", "minore di 7", "uguale a 7", "uguale al pKa"],a:0,e:"Si forma la base coniugata dell'acido debole, che dà idrolisi basica. A metà titolazione invece pH = pKa."},
{id:"cl8_060",t:"cl8",p:"8.8",l:3,q:"20 mL di HCl sono neutralizzati da 10 mL di NaOH 0,2 M. Qual è la concentrazione di HCl?",o:["0,1 M", "0,2 M", "0,4 M", "0,05 M"],a:0,e:"Moli di NaOH = 0,002 = moli di HCl; 0,002/0,020 L = 0,1 M."},
{id:"cl8_061",t:"cl8",p:"8.9",l:2,q:"Perché i fosfati di calcio si sciolgono meglio in ambiente acido?",o:["Gli H⁺ protonano gli ioni fosfato e spostano l'equilibrio verso la dissoluzione", "Perché l'acido ossida il calcio", "Perché aumenta K_ps", "Perché il calcio diventa negativo"],a:0,e:"A pH più alti invece precipitano e il solido si stabilizza."},
{id:"cl8_062",t:"cl8",p:"8.9",l:2,q:"Quale minerale costituisce in gran parte ossa e denti?",o:["L'idrossiapatite Ca₅(PO₄)₃OH", "Il carbonato di sodio", "Il cloruro di calcio", "La silice"],a:0,e:"Ha un K_ps bassissimo (circa 10⁻⁵⁸)."},
{id:"cl8_063",t:"cl8",p:"8.9",l:3,q:"Perché il fluoro protegge lo smalto dei denti?",o:["Trasforma l'idrossiapatite in fluoroidrossiapatite, meno solubile in ambiente acido", "Uccide tutti i batteri", "Aumenta il pH della saliva a 14", "Scioglie il tartaro"],a:0,e:"Alcuni OH⁻ sono sostituiti da F⁻."},
{id:"cl8_064",t:"cl8",p:"8.9",l:3,q:"In quali condizioni urinarie tende a precipitare l'ossalato di calcio, secondo il libro?",o:["Urine troppo alcaline", "Urine troppo acide", "Urine neutre", "Urine diluite"],a:0,e:"Tendono a precipitare in modo pH-dipendente anche fosfati, carbonati, urati e acido urico."},
{id:"cl8_sf1",t:"cl8",p:"8.4.1",l:4,q:"Si mescolano volumi uguali di HCl 0,2 M e NaOH 0,1 M. Qual è il pH della soluzione finale?",o:["Circa 1,3", "7", "1", "Circa 12,7"],a:0,e:"Restano 0,1 mol/L di H⁺ in eccesso, ma il volume raddoppia: [H⁺] = 0,05 M, pH = −log 0,05 ≈ 1,3."},
{id:"cl8_sf2",t:"cl8",p:"8.7",l:4,q:"Un tampone contiene acido acetico 0,1 M e acetato 1 M (pKa = 4,75). Qual è il pH?",o:["5,75", "4,75", "3,75", "7"],a:0,e:"pH = pKa + log(1/0,1) = 4,75 + 1 = 5,75."},
{id:"cl8_sf3",t:"cl8",p:"8.6",l:4,q:"Quale soluzione 0,1 M ha il pH più alto?",o:["Na₂CO₃", "NaHCO₃", "NaCl", "NH₄Cl"],a:0,e:"CO₃²⁻ è una base più forte di HCO₃⁻ (coniugata di un acido più debole); NaCl è neutro, NH₄Cl acido."},
{id:"cl8_sf4",t:"cl8",p:"8.4",l:4,q:"Una soluzione ha pH = 4. Di quante volte bisogna diluirla per portarla a pH 5?",o:["10 volte", "2 volte", "100 volte", "5 volte"],a:0,e:"Il pH aumenta di 1 se [H⁺] diventa 10 volte più piccola (vale per un acido forte, trascurando l'acqua)."},
{id:"cl8_sf5",t:"cl8",p:"8.8",l:4,q:"Quanti mL di NaOH 0,1 M servono per neutralizzare 25 mL di H₂SO₄ 0,1 M?",o:["50 mL", "25 mL", "12,5 mL", "100 mL"],a:0,e:"Moli di H₂SO₄ = 0,0025; servono 2 · 0,0025 = 0,005 mol di OH⁻ ⇒ 0,005/0,1 = 0,050 L."},
{id:"cl9_001",t:"cl9",p:"9.1",l:1,q:"Di che cosa si occupa la chimica organica?",o:["Dei composti con legami carbonio-carbonio e/o carbonio-idrogeno", "Solo dei composti degli esseri viventi", "Dei metalli", "Dei gas nobili"],a:0,e:"In origine riguardava la materia vivente; oggi tutti i composti del carbonio con legami C–C o C–H."},
{id:"cl9_002",t:"cl9",p:"9.1",l:1,q:"Quanti legami covalenti forma il carbonio nei composti organici?",o:["4", "2", "3", "6"],a:0,e:"Ha 4 elettroni di valenza (2s² 2p²) ed è sempre ibridato."},
{id:"cl9_003",t:"cl9",p:"9.1",l:2,q:"Quanto vale l'elettronegatività del carbonio nella scala di Pauling?",o:["2,5", "4,0", "0,9", "3,5"],a:0,e:"Un valore intermedio gli permette di legarsi con quasi tutti gli elementi."},
{id:"cl9_004",t:"cl9",p:"9.1",l:2,q:"Un carbonio legato a tre altri atomi di carbonio si dice…",o:["terziario", "primario", "secondario", "quaternario"],a:0,e:"Primario: 1 C; secondario: 2; terziario: 3; quaternario: 4."},
{id:"cl9_005",t:"cl9",p:"9.1",l:2,q:"Che ibridazione ha un carbonio impegnato in un triplo legame?",o:["sp", "sp²", "sp³", "Nessuna"],a:0,e:"Singoli: sp³ (109,5°); doppi: sp² (120°); tripli: sp (180°)."},
{id:"cl9_006",t:"cl9",p:"9.1",l:3,q:"Entro quali valori varia il numero di ossidazione del carbonio?",o:["Da −4 a +4", "Da 0 a +4", "Da −2 a +2", "Da −4 a 0"],a:0,e:"Per esempio −4 nel metano e +4 nella CO₂."},
{id:"cl9_007",t:"cl9",p:"9.2",l:1,q:"Che cosa mostra la formula di struttura?",o:["Come sono legati gli atomi e la loro disposizione", "Solo il tipo e il numero di atomi", "Solo la massa molecolare", "Solo i gruppi funzionali"],a:0,e:"La formula bruta è poco informativa perché molti composti hanno la stessa (isomeri)."},
{id:"cl9_008",t:"cl9",p:"9.2",l:2,q:"Nella formula topologica (scheletrica)…",o:["gli atomi di C e i loro H sono impliciti nei vertici di una linea spezzata", "tutti i legami sono esplicitati", "gli H sono sempre disegnati", "non compaiono gli eteroatomi"],a:0,e:"Ogni vertice o estremità di segmento è un carbonio."},
{id:"cl9_009",t:"cl9",p:"9.2",l:2,q:"Come si chiama la formula CH₃CH₂CH₂CH(OH)CH₃, con legami impliciti?",o:["Formula condensata", "Formula di Lewis", "Formula topologica", "Formula minima"],a:0,e:"Nella formula razionale si esplicitano solo i legami C–C e C–eteroatomo."},
{id:"cl9_010",t:"cl9",p:"9.3",l:1,q:"Che cos'è un gruppo funzionale?",o:["Un gruppo di atomi responsabile delle proprietà chimiche e fisiche di una classe di composti", "La catena carboniosa più lunga", "Un atomo di idrogeno", "Un isomero"],a:0,e:"Per esempio –OH, –NH₂, –COOH."},
{id:"cl9_011",t:"cl9",p:"9.3",l:2,q:"Un composto con più gruppi funzionali si dice…",o:["polifunzionale", "monofunzionale", "isomero", "aromatico"],a:0,e:"I gruppi possono essere uguali o diversi."},
{id:"cl9_012",t:"cl9",p:"9.3",l:2,q:"Quale gruppo funzionale è il gruppo carbossilico?",o:["–COOH", "–OH", "–NH₂", "–CHO"],a:0,e:"–OH è ossidrilico, –NH₂ amminico, –CHO aldeidico."},
{id:"cl9_013",t:"cl9",p:"9.4",l:1,q:"Come variano i punti di ebollizione dei composti organici con la massa molecolare?",o:["Aumentano", "Diminuiscono", "Non cambiano", "Si annullano"],a:0,e:"Le forze di London crescono con il numero di atomi."},
{id:"cl9_014",t:"cl9",p:"9.4",l:2,q:"Quale composto ha il punto di ebollizione più alto?",o:["CH₃CH₂CH₂OH", "CH₃CH₂OH", "CH₃CH₂Cl", "CH₃CH₃"],a:0,e:"Gli alcoli formano legami a idrogeno; tra i due alcoli bolle più alto quello con la catena più lunga."},
{id:"cl9_015",t:"cl9",p:"9.4",l:2,q:"Quale composto è il più solubile in acqua?",o:["CH₃OH", "CH₃CH₂OCH₂CH₃", "CH₃(CH₂)₃CH₂OH", "CH₃CH₂CH₃"],a:0,e:"Il metanolo forma legami a idrogeno e ha catena cortissima; la solubilità cala allungando la catena."},
{id:"cl9_016",t:"cl9",p:"9.4",l:3,q:"Perché un etere è poco solubile in acqua rispetto a un alcol?",o:["Il suo O non è legato a H e non può donare legami a idrogeno", "Perché è ionico", "Perché non contiene ossigeno", "Perché è un gas"],a:0,e:"Può solo accettare legami a idrogeno."},
{id:"cl9_017",t:"cl9",p:"9.5.1",l:1,q:"Nella rottura omolitica di un legame…",o:["ogni atomo trattiene un elettrone e si formano radicali", "un atomo trattiene entrambi gli elettroni", "si formano ioni", "non si forma nulla"],a:0,e:"I radicali hanno un elettrone spaiato e sono molto reattivi."},
{id:"cl9_018",t:"cl9",p:"9.5.1",l:2,q:"Nella rottura eterolitica di un legame C–X, che cosa si può formare sul carbonio?",o:["Un carbocatione o un carbanione", "Un radicale", "Un atomo neutro", "Un orbitale ibrido"],a:0,e:"L'atomo più elettronegativo trattiene il doppietto: meccanismo ionico o polare."},
{id:"cl9_019",t:"cl9",p:"9.5.2",l:1,q:"Un reagente elettrofilo è…",o:["una specie povera di elettroni (acido di Lewis)", "una specie ricca di elettroni", "sempre un anione", "un radicale"],a:0,e:"Per esempio H⁺, BCl₃ o il C del gruppo carbonilico."},
{id:"cl9_020",t:"cl9",p:"9.5.2",l:2,q:"Quale di queste specie è un nucleofilo?",o:["OH⁻", "H⁺", "BCl₃", "Il carbonio carbonilico"],a:0,e:"I nucleofili (basi di Lewis) hanno doppietti o carica negativa: OH⁻, CN⁻, l'N di –NH₂."},
{id:"cl9_021",t:"cl9",p:"9.5.3",l:1,q:"In una reazione di addizione…",o:["si rompe un legame π e si formano nuovi legami σ", "si rompono legami σ e si forma un legame π", "un atomo ne sostituisce un altro", "si forma un polimero"],a:0,e:"È la reazione tipica dei legami multipli."},
{id:"cl9_022",t:"cl9",p:"9.5.3",l:2,q:"Una reazione in cui si rompono legami σ e si forma un legame π è…",o:["un'eliminazione", "un'addizione", "una sostituzione", "una polimerizzazione"],a:0,e:"A–B–C → A=B + C."},
{id:"cl9_023",t:"cl9",p:"9.5.3",l:2,q:"In chimica organica, un'ossidazione è…",o:["un aumento dei legami con l'ossigeno e/o una diminuzione di quelli con H", "un aumento dei legami con H", "una perdita di ossigeno", "un'addizione di H₂"],a:0,e:"Esempio: alcol → aldeide → acido carbossilico."},
{id:"cl9_024",t:"cl9",p:"9.5.4",l:2,q:"Che effetto hanno i gruppi alchilici come –CH₃?",o:["Effetto induttivo positivo (+I): donano elettroni e stabilizzano i carbocationi", "Effetto −I", "Nessun effetto", "Destabilizzano i carbocationi"],a:0,e:"Per questo un carbocatione terziario è più stabile di uno primario."},
{id:"cl9_025",t:"cl9",p:"9.5.4",l:3,q:"Perché l'acido trifluoroacetico è più forte dell'acido acetico?",o:["Gli atomi di F, con effetto −I, stabilizzano la base coniugata", "Perché il fluoro è un donatore di elettroni", "Perché ha più idrogeni", "Perché è aromatico"],a:0,e:"La carica negativa del trifluoroacetato è delocalizzata dagli elettron-attrattori."},
{id:"cl9_026",t:"cl9",p:"9.5.4",l:2,q:"Qual è l'ordine di stabilità dei carbocationi?",o:["Terziario > secondario > primario", "Primario > secondario > terziario", "Sono tutti uguali", "Secondario > terziario > primario"],a:0,e:"I gruppi alchilici (+I) donano densità elettronica alla carica positiva."},
{id:"cl9_027",t:"cl9",p:"9.5.4",l:3,q:"Come varia l'intensità dell'effetto induttivo lungo la catena?",o:["Decresce rapidamente con la distanza", "Aumenta con la distanza", "È costante", "Si trasmette solo lungo i legami π"],a:0,e:"Si propaga soprattutto lungo i legami σ."},
{id:"cl9_028",t:"cl9",p:"9.5.5",l:2,q:"Perché il fenolo è più acido dell'etanolo?",o:["Lo ione fenossido è stabilizzato per risonanza sull'anello aromatico", "Perché il fenolo ha più idrogeni", "Perché l'etanolo è aromatico", "Perché il fenolo è ionico"],a:0,e:"La carica negativa del fenossido è delocalizzata; quella dell'etossido no."},
{id:"cl9_029",t:"cl9",p:"9.5.5",l:3,q:"Quale gruppo ha effetto di risonanza positivo (+R)?",o:["–OH", "–NO₂", "–C₆H₅ come attrattore", "–CHO"],a:0,e:"I gruppi con doppietti donabili (–OH, –NH₂, –OR) aumentano la densità elettronica del sistema π."},
{id:"cl9_030",t:"cl9",p:"9.6.1",l:1,q:"Che cosa sono gli isomeri?",o:["Composti con la stessa formula bruta ma diversa struttura o disposizione spaziale", "Composti con la stessa formula di struttura", "Atomi con diverso numero di neutroni", "Allotropi di un elemento"],a:0,e:"Si dividono in strutturali (costituzionali) e stereoisomeri."},
{id:"cl9_031",t:"cl9",p:"9.6.1",l:2,q:"Butano e metilpropano sono isomeri…",o:["di catena", "di posizione", "di gruppo funzionale", "ottici"],a:0,e:"Hanno la stessa formula C₄H₁₀ ma catene diverse (lineare e ramificata)."},
{id:"cl9_032",t:"cl9",p:"9.6.1",l:2,q:"Etanolo e dimetiletere (C₂H₆O) sono isomeri…",o:["di gruppo funzionale", "di catena", "ottici", "conformazionali"],a:0,e:"Uno è un alcol, l'altro un etere."},
{id:"cl9_033",t:"cl9",p:"9.6.1",l:3,q:"Quanti isomeri strutturali ha l'esano C₆H₁₄?",o:["5", "3", "4", "6"],a:0,e:"n-esano, 2-metilpentano, 3-metilpentano, 2,2-dimetilbutano, 2,3-dimetilbutano."},
{id:"cl9_034",t:"cl9",p:"9.6.2",l:1,q:"Gli enantiomeri sono…",o:["immagini speculari non sovrapponibili", "immagini speculari sovrapponibili", "isomeri di catena", "conformazioni della stessa molecola"],a:0,e:"Come le mani: la proprietà si chiama chiralità."},
{id:"cl9_035",t:"cl9",p:"9.6.2",l:2,q:"Che cos'è un carbonio chirale?",o:["Un carbonio legato a quattro sostituenti tutti diversi", "Un carbonio con un doppio legame", "Un carbonio primario", "Un carbonio aromatico"],a:0,e:"La disposizione dei quattro gruppi ne definisce la configurazione."},
{id:"cl9_036",t:"cl9",p:"9.6.2",l:2,q:"Quale proprietà fisica distingue due enantiomeri?",o:["L'attività ottica (ruotano la luce polarizzata in versi opposti)", "Il punto di fusione", "La densità", "La solubilità in acqua"],a:0,e:"Destrogiro (+) e levogiro (−); una miscela 50:50 (racemo) è otticamente inattiva."},
{id:"cl9_037",t:"cl9",p:"9.6.2",l:2,q:"Che differenza c'è tra conformazioni e configurazioni?",o:["Le conformazioni si interconvertono senza rompere legami, le configurazioni no", "Sono sinonimi", "Le configurazioni ruotano liberamente", "Le conformazioni richiedono la rottura di legami"],a:0,e:"Esempio: conformazioni eclissata e sfalsata dell'etano."},
{id:"cl9_038",t:"cl9",p:"9.6.2",l:3,q:"Acido maleico e acido fumarico sono…",o:["isomeri cis e trans (diastereoisomeri)", "enantiomeri", "isomeri di catena", "lo stesso composto"],a:0,e:"L'acido fumarico (trans) è presente nelle cellule, il maleico (cis) è tossico."},
{id:"cl9_039",t:"cl9",p:"9.6.2",l:3,q:"Che cos'è un composto meso?",o:["Un composto con centri chirali ma achirale per un piano di simmetria interno", "Una miscela racemica", "Un enantiomero puro", "Un isomero di catena"],a:0,e:"È otticamente inattivo: esempio una forma dell'acido tartarico."},
{id:"cl9_040",t:"cl9",p:"9.6.2",l:3,q:"Nel sistema R/S, quando la configurazione è R?",o:["Quando, con il gruppo a priorità minore dietro, la sequenza 1→2→3 è oraria", "Quando è antioraria", "Quando il composto è destrogiro", "Quando l'OH è a destra in Fischer"],a:0,e:"Le priorità seguono il numero atomico (regole di Cahn-Ingold-Prelog); R/S non coincide con +/−."},
{id:"cl9_041",t:"cl9",p:"9.6.2",l:3,q:"Glucosio e mannosio, che differiscono per la configurazione di un solo centro chirale, sono…",o:["epimeri", "enantiomeri", "anomeri", "isomeri di catena"],a:0,e:"Gli anomeri (α/β) sono epimeri delle forme cicliche al carbonio emiacetalico."},
{id:"cl9_042",t:"cl9",p:"9.6.2",l:2,q:"Nella notazione E/Z, la configurazione Z indica che i gruppi a priorità più alta sono…",o:["dallo stesso lato del doppio legame", "da lati opposti", "su un carbonio chirale", "in posizione meta"],a:0,e:"Z = zusammen (insieme), E = entgegen (opposti)."},
{id:"cl9_043",t:"cl9",p:"9.6.3",l:2,q:"Perché i due enantiomeri di un farmaco possono avere effetti diversi?",o:["I bersagli biologici (enzimi, recettori) sono anch'essi chirali", "Perché hanno formula bruta diversa", "Perché uno è radioattivo", "Non possono avere effetti diversi"],a:0,e:"Esempio storico: la talidomide, un enantiomero antiemetico e l'altro teratogeno."},
{id:"cl9_044",t:"cl9",p:"9.6.3",l:2,q:"Quale isomero del platino è usato come antitumorale?",o:["Il cisplatino; la forma trans non ha effetto", "Il transplatino", "Entrambi in egual modo", "Nessuno dei due"],a:0,e:"Anche tra diastereoisomeri le attività biologiche possono essere molto diverse."},
{id:"cl9_045",t:"cl9",p:"9.7",l:1,q:"Quale desinenza indica un idrocarburo con soli legami singoli?",o:["-ano", "-ene", "-ino", "-olo"],a:0,e:"-ene per i doppi legami, -ino per i tripli."},
{id:"cl9_046",t:"cl9",p:"9.7",l:1,q:"Quale radice indica una catena di 5 atomi di carbonio?",o:["Pent-", "But-", "Es-", "Prop-"],a:0,e:"Met-1, Et-2, Prop-3, But-4, Pent-5, Es-6, Ept-7, Ott-8, Non-9, Dec-10."},
{id:"cl9_047",t:"cl9",p:"9.7",l:2,q:"Quale suffisso hanno gli alcoli?",o:["-olo", "-ale", "-one", "-oico"],a:0,e:"-ale indica le aldeidi, -one i chetoni."},
{id:"cl9_048",t:"cl9",p:"9.7",l:2,q:"Come si numera la catena principale?",o:["Dando il numero più basso al gruppo funzionale, poi ai legami multipli, poi ai sostituenti", "Sempre da sinistra a destra", "Dando il numero più alto al gruppo funzionale", "In ordine alfabetico"],a:0,e:"La catena principale è la più lunga che contiene il gruppo a priorità più alta."},
{id:"cl9_049",t:"cl9",p:"9.7",l:3,q:"Qual è il nome di CH₃–C≡C–CH₂–CH(CH₃)–CH₂–CH₃?",o:["5-metil-2-eptino", "3-metil-5-eptino", "5-metil-2-eptene", "2-metil-5-eptino"],a:0,e:"7 C (ept-), triplo legame in posizione 2 (-ino), metile sul C5."},
{id:"cl9_050",t:"cl9",p:"9.7",l:3,q:"In che ordine si elencano i sostituenti nel nome?",o:["In ordine alfabetico", "In ordine di numero di atomi", "In ordine di posizione", "In ordine di elettronegatività"],a:0,e:"Esempio: 4-iodo-2,2-dimetilnonano."},
{id:"cl9_051",t:"cl9",p:"9.8",l:1,q:"Che cosa sono gli idrocarburi?",o:["Composti formati solo da carbonio e idrogeno", "Composti con carbonio, idrogeno e ossigeno", "Composti inorganici del carbonio", "Solo i composti aromatici"],a:0,e:"Si dividono in alifatici (saturi e insaturi, aperti o ciclici) e aromatici."},
{id:"cl9_052",t:"cl9",p:"9.8",l:2,q:"Un idrocarburo con soli legami singoli si dice…",o:["saturo", "insaturo", "aromatico", "polare"],a:0,e:"Alcheni e alchini sono insaturi."},
{id:"cl9_053",t:"cl9",p:"9.8.2",l:1,q:"Qual è la formula generale degli alcani a catena aperta?",o:["CₙH₂ₙ₊₂", "CₙH₂ₙ", "CₙH₂ₙ₋₂", "CₙHₙ"],a:0,e:"Esempi: metano CH₄, etano C₂H₆, propano C₃H₈."},
{id:"cl9_054",t:"cl9",p:"9.8.2",l:2,q:"Perché gli alcani si chiamano anche paraffine?",o:["Perché sono poco reattivi (parum affinis)", "Perché sono solidi", "Perché sono aromatici", "Perché contengono ossigeno"],a:0,e:"Reagiscono solo in condizioni drastiche."},
{id:"cl9_055",t:"cl9",p:"9.8.2",l:2,q:"Che tipo di reazione è l'alogenazione degli alcani?",o:["Una sostituzione radicalica", "Un'addizione elettrofila", "Un'eliminazione", "Una sostituzione elettrofila aromatica"],a:0,e:"Avviene con luce o calore: R–H + X₂ → R–X + HX."},
{id:"cl9_056",t:"cl9",p:"9.8.2",l:3,q:"Che cosa produce la combustione di un alcano in difetto di ossigeno?",o:["Anche monossido di carbonio, molto tossico", "Solo CO₂ e acqua", "Solo idrogeno", "Ozono"],a:0,e:"Con ossigeno sufficiente si formano CO₂ e H₂O."},
{id:"cl9_057",t:"cl9",p:"9.8.2",l:3,q:"Quale alcano è il primo ad avere isomeri strutturali?",o:["Il butano C₄H₁₀", "Il propano", "L'etano", "Il pentano"],a:0,e:"C₄H₁₀ ha 2 isomeri, C₅H₁₂ 3, C₆H₁₄ 5."},
{id:"cl9_058",t:"cl9",p:"9.8.3",l:1,q:"Che cosa contengono gli alcheni?",o:["Almeno un doppio legame C=C", "Solo legami singoli", "Almeno un triplo legame", "Un anello aromatico"],a:0,e:"L'alchene più semplice è l'etene (etilene)."},
{id:"cl9_059",t:"cl9",p:"9.8.3",l:2,q:"Qual è la reazione caratteristica degli alcheni?",o:["L'addizione elettrofila al doppio legame", "La sostituzione radicalica", "La sostituzione elettrofila aromatica", "L'eliminazione"],a:0,e:"Passa per un intermedio carbocationico."},
{id:"cl9_060",t:"cl9",p:"9.8.3",l:2,q:"Perché intorno al doppio legame C=C non c'è libera rotazione?",o:["Per la presenza del legame π", "Per il legame σ", "Perché i C sono sp³", "Per gli idrogeni"],a:0,e:"Il legame π irrigidisce la struttura e rende possibile l'isomeria cis-trans."},
{id:"cl9_061",t:"cl9",p:"9.8.3",l:3,q:"Secondo la regola di Markovnikov, nell'addizione di HBr al propene, dove va l'H?",o:["Sul carbonio meno sostituito (con più idrogeni)", "Sul carbonio più sostituito", "Indifferentemente", "Sul carbonio centrale sempre come Br"],a:0,e:"Così si forma il carbocatione più stabile; il prodotto principale è il 2-bromopropano."},
{id:"cl9_062",t:"cl9",p:"9.8.3",l:3,q:"Che cosa si ottiene dall'idratazione di un alchene in ambiente acido?",o:["Un alcol", "Un alcano", "Un'aldeide", "Un acido carbossilico"],a:0,e:"L'idrogenazione con Pt, Pd o Ni dà invece l'alcano."},
{id:"cl9_063",t:"cl9",p:"9.8.3",l:3,q:"Che cosa sono i dieni coniugati?",o:["Dieni con i doppi legami separati da un solo legame singolo", "Dieni con doppi legami adiacenti", "Dieni con doppi legami molto distanti", "Alchini"],a:0,e:"Esempio 1,3-butadiene, che mostra risonanza. Doppi legami adiacenti = cumulati (alleni)."},
{id:"cl9_064",t:"cl9",p:"9.8.3",l:2,q:"Quali plastiche si ottengono per poliaddizione di alcheni?",o:["Polietilene, polipropilene, polistirene", "Nylon e poliesteri", "Cellulosa", "Gomma siliconica"],a:0,e:"La poliaddizione degli alcheni ha meccanismo radicalico."},
{id:"cl9_065",t:"cl9",p:"9.8.4",l:1,q:"Come si chiama l'alchino più semplice?",o:["Etino (acetilene)", "Etene", "Metano", "Propino"],a:0,e:"Formula HC≡CH."},
{id:"cl9_066",t:"cl9",p:"9.8.4",l:2,q:"Da che cosa è formato un triplo legame C≡C?",o:["Un legame σ e due legami π", "Tre legami σ", "Due σ e un π", "Tre legami π"],a:0,e:"I carboni sono ibridati sp e restano due orbitali p puri ciascuno."},
{id:"cl9_067",t:"cl9",p:"9.8.4",l:3,q:"Che cosa si ottiene dall'idratazione di un alchino?",o:["Un enolo instabile che si trasforma in aldeide o chetone (tautomeria cheto-enolica)", "Un alcol stabile", "Un alcano", "Un acido"],a:0,e:"Richiede catalizzatori."},
{id:"cl9_068",t:"cl9",p:"9.8.5",l:2,q:"Che cos'è la tensione d'anello?",o:["L'instabilità dovuta ad angoli di legame molto minori di 109,5°", "La rotazione libera dei legami", "La risonanza nei cicli", "L'aromaticità"],a:0,e:"È forte in ciclopropano e ciclobutano, che aprono facilmente l'anello."},
{id:"cl9_069",t:"cl9",p:"9.8.5",l:2,q:"Quali conformazioni stabili ha il cicloesano?",o:["A sedia e a barca", "Eclissata e sfalsata soltanto", "Planare", "Lineare"],a:0,e:"Le due conformazioni sono in equilibrio tra loro."},
{id:"cl9_070",t:"cl9",p:"9.8.5",l:1,q:"Qual è la formula generale dei cicloalcani?",o:["CₙH₂ₙ", "CₙH₂ₙ₊₂", "CₙH₂ₙ₋₂", "CₙHₙ"],a:0,e:"Hanno due idrogeni in meno dell'alcano aperto corrispondente."},
{id:"cl9_071",t:"cl9",p:"9.8.6",l:1,q:"Qual è il capostipite degli idrocarburi aromatici?",o:["Il benzene C₆H₆", "Il cicloesano", "L'etene", "Il toluene"],a:0,e:"I sei C sono sp² ai vertici di un esagono regolare."},
{id:"cl9_072",t:"cl9",p:"9.8.6",l:2,q:"Quale regola deve rispettare un composto aromatico?",o:["La regola di Hückel: 4n + 2 elettroni π", "La regola dell'ottetto", "La regola di Markovnikov", "La regola di Hund"],a:0,e:"Serve anche che sia ciclico, planare e completamente coniugato."},
{id:"cl9_073",t:"cl9",p:"9.8.6",l:2,q:"Qual è la reazione tipica del benzene?",o:["La sostituzione elettrofila aromatica", "L'addizione elettrofila", "La sostituzione radicalica", "L'eliminazione"],a:0,e:"Così l'anello mantiene l'aromaticità."},
{id:"cl9_074",t:"cl9",p:"9.8.6",l:2,q:"Come si chiama il metilbenzene?",o:["Toluene", "Fenolo", "Anilina", "Stirene"],a:0,e:"Fenolo = idrossibenzene, anilina = amminobenzene, stirene = etenilbenzene."},
{id:"cl9_075",t:"cl9",p:"9.8.6",l:2,q:"Il prefisso para- indica sostituenti in posizione…",o:["1,4", "1,2", "1,3", "1,5"],a:0,e:"Orto = 1,2; meta = 1,3; para = 1,4."},
{id:"cl9_076",t:"cl9",p:"9.8.6",l:3,q:"Che effetto ha il gruppo –NO₂ sulla sostituzione elettrofila aromatica?",o:["Disattivante forte e meta-orientante", "Attivante e orto-para orientante", "Nessun effetto", "Attivante e meta-orientante"],a:0,e:"–NH₂ e –OH sono invece attivanti forti orto-para; gli alogeni sono disattivanti ma orto-para."},
{id:"cl9_077",t:"cl9",p:"9.8.6",l:3,q:"Quale idrocarburo aromatico è associato al rischio di leucemie?",o:["Il benzene", "Il toluene", "Il cicloesano", "L'etene"],a:0,e:"I suoi metaboliti danneggiano il midollo osseo. Toluene e xileni sono soprattutto neurotossici."},
{id:"cl9_078",t:"cl9",p:"9.8.6",l:3,q:"Perché gli IPA sono genotossici?",o:["Sono planari e si intercalano nel DNA, e danno metaboliti reattivi", "Perché sono ionici", "Perché sono gas", "Perché sono molto idrofili"],a:0,e:"Si formano nella combustione incompleta di carbone, petrolio e tabacco."},
{id:"cl9_sf1",t:"cl9",p:"9.8.3",l:4,q:"Quale prodotto principale si ottiene addizionando HCl al 2-metilpropene?",o:["2-cloro-2-metilpropano", "1-cloro-2-metilpropano", "2-clorobutano", "1,2-dicloro-2-metilpropano"],a:0,e:"Per Markovnikov l'H va sul CH₂ terminale e il Cl sul carbonio terziario, dove si forma il carbocatione più stabile."},
{id:"cl9_sf2",t:"cl9",p:"9.6.2",l:4,q:"Quanti stereoisomeri può avere al massimo una molecola con 2 carboni chirali diversi?",o:["4", "2", "3", "8"],a:0,e:"Al massimo 2ⁿ = 2² = 4 (meno se c'è una forma meso, come nell'acido tartarico che ne ha 3)."},
{id:"cl9_sf3",t:"cl9",p:"9.6.1",l:4,q:"Quale coppia NON è una coppia di isomeri?",o:["Propano e propene", "Butano e metilpropano", "Etanolo e dimetiletere", "1-propanolo e 2-propanolo"],a:0,e:"Propano (C₃H₈) e propene (C₃H₆) hanno formule brute diverse."},
{id:"cl9_sf4",t:"cl9",p:"9.5.4",l:4,q:"Quale acido è il più forte?",o:["CCl₃COOH", "CH₃COOH", "CH₂ClCOOH", "CH₃CH₂COOH"],a:0,e:"Tre atomi di cloro (effetto −I) stabilizzano al massimo la base coniugata; la catena alchilica (+I) rende invece l'acido più debole."},
{id:"cl9_sf5",t:"cl9",p:"9.8.6",l:4,q:"Quale molecola è aromatica secondo Hückel?",o:["Benzene (6 elettroni π)", "Cicloesano", "Ciclobutadiene (4 elettroni π)", "Cicloesene"],a:0,e:"Il benzene ha 6 = 4·1 + 2 elettroni π delocalizzati su un anello planare; il ciclobutadiene ne ha 4 e il cicloesano non è coniugato."},
{id:"cl10_001",t:"cl10",p:"10.1",l:1,q:"Che cosa contiene un alogenuro alchilico?",o:["Un atomo di alogeno legato a una catena carboniosa (R–X)", "Un gruppo –OH", "Un gruppo –NH₂", "Un gruppo –COOH"],a:0,e:"Se l'alogeno è legato a un anello aromatico si parla di alogenuro arilico (Ar–X)."},
{id:"cl10_002",t:"cl10",p:"10.1",l:2,q:"Rispetto agli idrocarburi corrispondenti, gli alogenuri hanno punti di ebollizione…",o:["più alti, perché il legame C–X è polare", "più bassi", "uguali", "nulli"],a:0,e:"Sono invece generalmente insolubili in acqua."},
{id:"cl10_003",t:"cl10",p:"10.1",l:2,q:"Come si chiama CH₃–CHCl–CH₂–CH₃?",o:["2-clorobutano", "3-clorobutano", "1-clorobutano", "clorobutene"],a:0,e:"L'alogeno si indica come sostituente con il numero più basso possibile."},
{id:"cl10_004",t:"cl10",p:"10.1.3",l:2,q:"Che cosa avviene in una sostituzione nucleofila (Sɴ)?",o:["Un nucleofilo entrante sostituisce un gruppo uscente", "Si forma un doppio legame", "Un elettrofilo sostituisce un H aromatico", "Si addiziona acqua"],a:0,e:"Con basi forti si ha invece eliminazione (E), che forma un doppio legame C=C."},
{id:"cl10_005",t:"cl10",p:"10.1.3",l:2,q:"Quale substrato favorisce il meccanismo Sɴ2?",o:["Metilico o primario, poco ingombrato", "Terziario", "Aromatico", "Molto ingombrato"],a:0,e:"Sɴ2 è bimolecolare, in un solo stadio, con inversione di configurazione."},
{id:"cl10_006",t:"cl10",p:"10.1.3",l:3,q:"Che cosa caratterizza il meccanismo Sɴ1?",o:["Due stadi con un carbocatione planare intermedio e possibile racemizzazione", "Un solo stadio con inversione", "Nessun intermedio", "Solo substrati metilici"],a:0,e:"È favorito dai substrati terziari, molto ingombrati."},
{id:"cl10_007",t:"cl10",p:"10.1.3",l:3,q:"In un'eliminazione, quale alchene si forma di preferenza?",o:["Il più sostituito, perché più stabile", "Il meno sostituito", "Sempre l'etene", "Un alchino"],a:0,e:"È una regola empirica (di Zaitsev) sugli aspetti regiochimici."},
{id:"cl10_008",t:"cl10",p:"10.2",l:1,q:"Qual è il gruppo funzionale degli alcoli?",o:["L'ossidrile –OH legato a una catena carboniosa", "Il carbonile C=O", "Il carbossile –COOH", "L'ammino –NH₂"],a:0,e:"Se l'–OH è su un anello aromatico si parla di fenoli."},
{id:"cl10_009",t:"cl10",p:"10.2",l:2,q:"Come si chiama il 1,2,3-propantriolo?",o:["Glicerolo (glicerina in soluzione)", "Glicol etilenico", "Etanolo", "Fenolo"],a:0,e:"Il 1,2-etandiolo è il glicol etilenico."},
{id:"cl10_010",t:"cl10",p:"10.2",l:2,q:"Perché gli alcoli hanno punti di ebollizione più alti degli alcani corrispondenti?",o:["Formano legami a idrogeno intermolecolari", "Sono ionici", "Hanno massa molto maggiore", "Sono aromatici"],a:0,e:"Gli alcoli a catena corta sono anche solubili in acqua."},
{id:"cl10_011",t:"cl10",p:"10.2",l:3,q:"In un alcol secondario, il carbonio che porta l'–OH è legato a…",o:["due altri atomi di carbonio", "un solo atomo di carbonio", "tre atomi di carbonio", "nessun carbonio"],a:0,e:"Primario: 1 C; secondario: 2; terziario: 3."},
{id:"cl10_012",t:"cl10",p:"10.2.2",l:1,q:"Ossidando un alcol primario in condizioni blande si ottiene…",o:["un'aldeide", "un chetone", "un acido carbossilico", "un etere"],a:0,e:"In condizioni forti si arriva all'acido carbossilico; un alcol secondario dà un chetone; un terziario non si ossida."},
{id:"cl10_013",t:"cl10",p:"10.2.2",l:2,q:"Che cosa si ottiene disidratando un alcol con H₂SO₄?",o:["Un alchene", "Un alcano", "Un'aldeide", "Un estere"],a:0,e:"È la reazione inversa dell'idratazione di un alchene."},
{id:"cl10_014",t:"cl10",p:"10.2.2",l:2,q:"Perché i fenoli sono più acidi degli alcoli?",o:["Lo ione fenossido è stabilizzato per risonanza", "Perché hanno più idrogeni", "Perché l'ossigeno è più elettronegativo nei fenoli", "Perché sono ionici"],a:0,e:"Gli alcoli sono acidi molto deboli e reagiscono con i metalli formando alcossidi."},
{id:"cl10_015",t:"cl10",p:"10.2.2",l:3,q:"Quale coppia redox si forma ossidando un idrochinone?",o:["Idrochinone / p-benzochinone", "Alcol / etere", "Acido / estere", "Ammina / ammide"],a:0,e:"Il coenzima Q (ubichinone) usa questa coppia nella catena respiratoria."},
{id:"cl10_016",t:"cl10",p:"10.2.2",l:3,q:"Qual è la via principale di ossidazione dell'etanolo nel fegato?",o:["Etanolo → acetaldeide → acetato", "Etanolo → etene → acetato", "Etanolo → metanolo → CO₂", "Etanolo → glucosio"],a:0,e:"L'alcol deidrogenasi produce acetaldeide, poi ossidata ad acetato."},
{id:"cl10_017",t:"cl10",p:"10.2.2",l:3,q:"Che cosa si forma dalla reazione tra etanolo e 1-iodopropano?",o:["Un etere (etil propil etere), sintesi di Williamson", "Un estere", "Un'aldeide", "Un alchene"],a:0,e:"L'ossigeno dell'etanolo attacca il carbonio legato allo iodio (Sɴ2)."},
{id:"cl10_018",t:"cl10",p:"10.3",l:1,q:"Che cosa sono i tioli?",o:["Analoghi solforati degli alcoli, con gruppo –SH", "Eteri dello zolfo", "Acidi solfonici", "Ammine aromatiche"],a:0,e:"Il suffisso IUPAC è -tiolo, per esempio 1-butantiolo."},
{id:"cl10_019",t:"cl10",p:"10.3",l:2,q:"Rispetto agli alcoli corrispondenti, i tioli hanno punti di ebollizione…",o:["più bassi, perché non formano legami a idrogeno", "più alti", "uguali", "molto più alti"],a:0,e:"Sono volatili, poco solubili in acqua e hanno odori sgradevoli."},
{id:"cl10_020",t:"cl10",p:"10.3",l:2,q:"Che cosa si forma ossidando due tioli?",o:["Un disolfuro (ponte S–S)", "Un'aldeide", "Un chetone", "Un etere"],a:0,e:"I ponti disolfuro tra cisteine stabilizzano le proteine."},
{id:"cl10_021",t:"cl10",p:"10.3",l:3,q:"A parità di atomi di carbonio, i tioli rispetto agli alcoli sono…",o:["più acidi", "meno acidi", "ugualmente acidi", "basici"],a:0,e:"Con una base formano tiolati."},
{id:"cl10_022",t:"cl10",p:"10.4",l:1,q:"Qual è la struttura generale di un etere?",o:["R–O–R'", "R–OH", "R–CO–R'", "R–COO–R'"],a:0,e:"Si chiamano anche con il prefisso alcossi-, come metossibenzene (anisolo)."},
{id:"cl10_023",t:"cl10",p:"10.4",l:2,q:"Perché gli eteri bollono a temperatura più bassa degli alcoli?",o:["Non formano legami a idrogeno intermolecolari", "Sono più pesanti", "Sono ionici", "Sono aromatici"],a:0,e:"Sono volatili, infiammabili e buoni solventi."},
{id:"cl10_024",t:"cl10",p:"10.4",l:2,q:"Che cosa sono gli epossidi?",o:["Eteri ciclici a tre termini, molto reattivi per la tensione d'anello", "Esteri ciclici", "Ammidi cicliche", "Alcoli aromatici"],a:0,e:"L'ossido di etilene si usa come sterilizzante."},
{id:"cl10_025",t:"cl10",p:"10.5",l:1,q:"Quale gruppo funzionale hanno in comune aldeidi e chetoni?",o:["Il carbonile C=O", "Il carbossile", "L'ossidrile", "L'ammino"],a:0,e:"Nelle aldeidi è a fine catena, nei chetoni all'interno."},
{id:"cl10_026",t:"cl10",p:"10.5",l:1,q:"Quale suffisso hanno i chetoni?",o:["-one", "-ale", "-olo", "-oico"],a:0,e:"Per esempio propanone (acetone); le aldeidi usano -ale (etanale = acetaldeide)."},
{id:"cl10_027",t:"cl10",p:"10.5",l:2,q:"Come si chiama comunemente il metanale?",o:["Formaldeide", "Acetaldeide", "Acetone", "Acido formico"],a:0,e:"In soluzione acquosa si chiama formalina."},
{id:"cl10_028",t:"cl10",p:"10.5",l:2,q:"Rispetto agli alcoli, aldeidi e chetoni hanno punti di ebollizione…",o:["più bassi, perché il carbonile accetta ma non dona legami a idrogeno", "più alti", "uguali", "nulli"],a:0,e:"Sono comunque più alti di quelli degli alcani corrispondenti."},
{id:"cl10_029",t:"cl10",p:"10.5.2",l:2,q:"Qual è la reazione tipica del carbonile di aldeidi e chetoni?",o:["L'addizione nucleofila", "La sostituzione elettrofila", "L'eliminazione", "La sostituzione radicalica"],a:0,e:"Il carbonio carbonilico è elettrofilo; le aldeidi sono più reattive dei chetoni."},
{id:"cl10_030",t:"cl10",p:"10.5.2",l:2,q:"Che cosa si ottiene addizionando un alcol a un'aldeide?",o:["Un emiacetale (e con altro alcol un acetale)", "Un estere", "Un'ammide", "Un acido"],a:0,e:"Spiega la ciclizzazione dei monosaccaridi e i legami glicosidici."},
{id:"cl10_031",t:"cl10",p:"10.5.2",l:2,q:"Che cosa si ottiene riducendo il butanone?",o:["2-butanolo", "1-butanolo", "Acido butanoico", "Butanale"],a:0,e:"La riduzione di un chetone dà un alcol secondario; quella di un'aldeide un alcol primario."},
{id:"cl10_032",t:"cl10",p:"10.5.2",l:3,q:"Che cos'è la tautomeria cheto-enolica?",o:["Un equilibrio tra forma carbonilica ed enolica (C=C con –OH)", "Una reazione di ossidazione", "Una forma di isomeria ottica", "Un tipo di polimerizzazione"],a:0,e:"Gli H in α al carbonile sono moderatamente acidi; la tautomeria delle basi azotate è legata alla mutagenesi spontanea."},
{id:"cl10_033",t:"cl10",p:"10.5.2",l:3,q:"Che cosa produce una condensazione aldolica?",o:["Un aldolo (β-idrossicarbonilico), che può disidratarsi a composto α,β-insaturo", "Un estere", "Un'ammide", "Un etere"],a:0,e:"Lo ione enolato attacca un carbonile formando un nuovo legame C–C (es. citrato sintasi nel ciclo di Krebs)."},
{id:"cl10_034",t:"cl10",p:"10.6",l:1,q:"Le ammine possono essere considerate derivati di…",o:["ammoniaca", "acqua", "acido nitrico", "metano"],a:0,e:"Uno o più H di NH₃ sono sostituiti da catene carboniose."},
{id:"cl10_035",t:"cl10",p:"10.6",l:2,q:"R–NH–R' è un'ammina…",o:["secondaria", "primaria", "terziaria", "quaternaria"],a:0,e:"Primaria R–NH₂; terziaria R–N(R')–R''."},
{id:"cl10_036",t:"cl10",p:"10.6",l:2,q:"Rispetto agli alcoli corrispondenti, le ammine hanno punti di ebollizione…",o:["più bassi, perché N è meno elettronegativo di O", "più alti", "uguali", "nulli"],a:0,e:"Le ammine terziarie non formano legami a idrogeno tra loro."},
{id:"cl10_037",t:"cl10",p:"10.6",l:2,q:"Quale ammina è la più importante commercialmente?",o:["L'anilina", "La trimetilammina", "La metilammina", "La colina"],a:0,e:"Si prepara riducendo il nitrobenzene; serve per farmaci e coloranti."},
{id:"cl10_038",t:"cl10",p:"10.6.2",l:2,q:"Perché le ammine sono basi?",o:["Hanno un doppietto solitario sull'azoto che accetta H⁺", "Liberano OH⁻ dalla formula", "Sono acidi di Lewis", "Contengono ossigeno"],a:0,e:"Sono basi deboli di Brønsted-Lowry."},
{id:"cl10_039",t:"cl10",p:"10.6.2",l:3,q:"Perché l'anilina è una base più debole dell'ammoniaca?",o:["L'anello aromatico sottrae il doppietto per risonanza (−R)", "Perché ha più idrogeni", "Perché è un'ammina terziaria", "Perché è ionica"],a:0,e:"Le ammine alifatiche sono invece più basiche dell'ammoniaca (effetto +I)."},
{id:"cl10_040",t:"cl10",p:"10.6.2",l:3,q:"Che cosa si forma tra ammine secondarie e nitriti?",o:["N-nitrosammine, cancerogene", "Ammidi", "Immine", "Sali di diazonio stabili"],a:0,e:"Si possono formare dai nitriti delle carni conservate; la vitamina C ne inibisce la formazione."},
{id:"cl10_041",t:"cl10",p:"10.6.2",l:3,q:"Che cosa si ottiene da un'aldeide e un'ammina primaria?",o:["Un'immina (base di Schiff)", "Un'ammide", "Un estere", "Un nitrile"],a:0,e:"Le immine sono intermedi nel metabolismo degli amminoacidi e nella glicazione dell'emoglobina."},
{id:"cl10_042",t:"cl10",p:"10.6.2",l:2,q:"La colina è…",o:["un ammonio quaternario con un gruppo alcolico, precursore dell'acetilcolina", "un'ammina aromatica", "un acido carbossilico", "un estere fosfato"],a:0,e:"È un costituente dei lipidi di membrana (fosfatidilcolina)."},
{id:"cl10_043",t:"cl10",p:"10.7",l:1,q:"Quale gruppo funzionale hanno i nitrili?",o:["Il gruppo ciano –C≡N", "Il gruppo nitro –NO₂", "Il gruppo ammino", "Il gruppo nitroso"],a:0,e:"Derivano formalmente da HCN."},
{id:"cl10_044",t:"cl10",p:"10.7",l:2,q:"Che cosa si ottiene dall'idrolisi dei nitrili?",o:["Ammidi e poi acidi carbossilici", "Alcoli", "Ammine", "Eteri"],a:0,e:"La riduzione dei nitrili dà invece ammine."},
{id:"cl10_045",t:"cl10",p:"10.8",l:1,q:"Quale suffisso hanno gli acidi carbossilici nella nomenclatura IUPAC?",o:["acido …-oico", "-olo", "-ale", "-one"],a:0,e:"Per esempio acido etanoico (acetico)."},
{id:"cl10_046",t:"cl10",p:"10.8",l:1,q:"Come si chiama l'acido metanoico?",o:["Acido formico", "Acido acetico", "Acido propionico", "Acido butirrico"],a:0,e:"Si trova nelle secrezioni di api e formiche e nelle ortiche."},
{id:"cl10_047",t:"cl10",p:"10.8",l:2,q:"Quale acido si trova negli agrumi ed è l'additivo E330?",o:["Acido citrico", "Acido lattico", "Acido ossalico", "Acido piruvico"],a:0,e:"È un acido tricarbossilico."},
{id:"cl10_048",t:"cl10",p:"10.8",l:2,q:"Come si chiamano gli acidi carbossilici a lunga catena?",o:["Acidi grassi", "Acidi dicarbossilici", "Lattoni", "Acidi nucleici"],a:0,e:"Sono idrofobi e lipofili."},
{id:"cl10_049",t:"cl10",p:"10.8",l:2,q:"Perché gli acidi carbossilici bollono più degli alcoli corrispondenti?",o:["Formano legami a idrogeno più estesi", "Perché sono ionici", "Perché non sono polari", "Perché sono aromatici"],a:0,e:"Quelli a catena corta sono completamente solubili in acqua."},
{id:"cl10_050",t:"cl10",p:"10.8.2",l:2,q:"Perché lo ione carbossilato è stabile?",o:["La carica negativa è delocalizzata per risonanza tra i due ossigeni", "Perché è un radicale", "Perché contiene azoto", "Perché ha un doppio legame C=C"],a:0,e:"Per questo gli acidi carbossilici sono più acidi degli alcoli."},
{id:"cl10_051",t:"cl10",p:"10.8.2",l:3,q:"Come varia la forza degli acidi carbossilici con la lunghezza della catena?",o:["Diminuisce allungando la catena; aumenta con sostituenti elettronegativi", "Aumenta allungando la catena", "Non varia", "È massima per l'acido butirrico"],a:0,e:"Acido trifluoroacetico > acetico > butirrico."},
{id:"cl10_052",t:"cl10",p:"10.8.2",l:2,q:"Che cos'è l'esterificazione di Fischer?",o:["La reazione acido carbossilico + alcol (catalisi acida) → estere + acqua", "La reazione acido + base", "L'ossidazione di un alcol", "L'idrolisi di un'ammide"],a:0,e:"È una condensazione reversibile; l'inversa è l'idrolisi dell'estere."},
{id:"cl10_053",t:"cl10",p:"10.8.2",l:3,q:"Che cos'è la decarbossilazione?",o:["La perdita del gruppo carbossilico sotto forma di CO₂", "L'aggiunta di CO₂", "L'ossidazione a chetone", "La formazione di un'ammide"],a:0,e:"In biologia: decarbossilazione ossidativa del piruvato ad acetil-CoA."},
{id:"cl10_054",t:"cl10",p:"10.8.3",l:2,q:"Quale derivato acilico è il più reattivo nella sostituzione nucleofila acilica?",o:["L'alogenuro acilico", "L'ammide", "L'estere", "L'acido carbossilico"],a:0,e:"Ordine: alogenuro > anidride > tioestere > estere > acido > ammide."},
{id:"cl10_055",t:"cl10",p:"10.8.3",l:2,q:"Che cosa producono tutti i derivati acilici per idrolisi?",o:["L'acido carbossilico corrispondente (o il carbossilato in ambiente basico)", "Un alcol", "Un'ammina", "Un alchene"],a:0,e:"L'idrolisi è una sostituzione nucleofila acilica con l'acqua."},
{id:"cl10_056",t:"cl10",p:"10.9",l:2,q:"Come si prepara un alogenuro acilico?",o:["Da un acido carbossilico con agenti alogenanti come SOCl₂", "Da un alcol e un alogeno", "Da un'ammina e HCl", "Da un estere e acqua"],a:0,e:"Sono usati come intermedi di sintesi grazie all'alta reattività."},
{id:"cl10_057",t:"cl10",p:"10.9",l:3,q:"Come si chiama un alogenuro acilico secondo la nomenclatura?",o:["Alogenuro di …-oile (es. cloruro di etanoile)", "Acido alogenoico", "Alogeno-alcano", "…-ammide"],a:0,e:"Per esempio cloruro di acetile."},
{id:"cl10_058",t:"cl10",p:"10.10",l:2,q:"Come si forma un'anidride?",o:["Per condensazione di due molecole di acido carbossilico con perdita di acqua", "Per ossidazione di un alcol", "Per idrolisi di un estere", "Da un'ammina e un acido"],a:0,e:"Possono essere simmetriche, miste o cicliche (anidride ftalica)."},
{id:"cl10_059",t:"cl10",p:"10.10",l:3,q:"A che cosa servono le anidridi nella sintesi dell'aspirina?",o:["Come agenti acilanti (anidride acetica)", "Come catalizzatori", "Come solventi", "Come basi"],a:0,e:"In biochimica sono importanti le anidridi dell'acido fosforico."},
{id:"cl10_060",t:"cl10",p:"10.11",l:1,q:"Come si chiama l'estere CH₃COOCH₂CH₃?",o:["Etanoato di etile (acetato di etile)", "Etil etanolo", "Acido etiletanoico", "Etanale di etile"],a:0,e:"La desinenza -oico diventa -oato e si aggiunge il nome del radicale dell'alcol."},
{id:"cl10_061",t:"cl10",p:"10.11",l:2,q:"Che cos'è la saponificazione?",o:["L'idrolisi basica di un estere, che dà un carbossilato e un alcol", "La sintesi di un estere", "L'ossidazione di un acido grasso", "La formazione di un'ammide"],a:0,e:"I sali carbossilati a lunga catena di sodio e potassio sono i saponi."},
{id:"cl10_062",t:"cl10",p:"10.11",l:2,q:"Che cosa sono i lattoni?",o:["Esteri ciclici", "Ammidi cicliche", "Eteri ciclici", "Alcoli ciclici"],a:0,e:"Si formano per esterificazione intramolecolare, favorita per anelli a 5 o 6 atomi."},
{id:"cl10_063",t:"cl10",p:"10.11",l:3,q:"Perché i tioesteri sono più reattivi degli esteri?",o:["La risonanza dello zolfo, del terzo periodo, stabilizza meno il legame", "Perché lo zolfo è più elettronegativo", "Perché sono ionici", "Perché sono aromatici"],a:0,e:"In biochimica sono intermedi ad alta energia (es. acetil-CoA)."},
{id:"cl10_064",t:"cl10",p:"10.11",l:3,q:"Che cosa serve perché un estere dia la condensazione di Claisen?",o:["Almeno un idrogeno in α al carbonile e una base forte", "Un catalizzatore metallico", "La luce", "Un acido forte"],a:0,e:"Si forma un β-chetoestere; in biochimica serve per acidi grassi, colesterolo, corpi chetonici."},
{id:"cl10_065",t:"cl10",p:"10.12",l:1,q:"Come si chiama HCONH₂?",o:["Metanammide", "Metilammina", "Acido formico", "Formaldeide"],a:0,e:"Le ammidi primarie usano il suffisso -ammide."},
{id:"cl10_066",t:"cl10",p:"10.12",l:2,q:"Perché le ammidi sono poco reattive?",o:["Il legame C–N ha parziale carattere di doppio legame per risonanza", "Perché non hanno ossigeno", "Perché sono ioniche", "Perché sono gas"],a:0,e:"Questa stabilità spiega il ruolo del legame peptidico."},
{id:"cl10_067",t:"cl10",p:"10.12",l:2,q:"Che cos'è l'urea?",o:["La diammide dell'acido carbonico, principale prodotto di eliminazione dell'azoto nei mammiferi", "Un acido grasso", "Un'ammina aromatica", "Un estere fosfato"],a:0,e:"È sintetizzata nel fegato con il ciclo dell'urea; uccelli e rettili producono acido urico."},
{id:"cl10_068",t:"cl10",p:"10.12",l:3,q:"Perché la penicillina è reattiva?",o:["Contiene un β-lattame, ammide ciclica tesa a quattro atomi", "Perché è un estere", "Perché è un alogenuro acilico", "Perché è aromatica"],a:0,e:"I lattami con meno di cinque termini sono più reattivi delle ammidi normali."},
{id:"cl10_069",t:"cl10",p:"10.13",l:2,q:"Che cosa contengono i legami fosfoanidridici?",o:["Legami P–O–P, come nell'ATP", "Legami C–N", "Legami S–S", "Legami C=C"],a:0,e:"Sono destabilizzati dalla repulsione elettrostatica e ricchi di energia."},
{id:"cl10_070",t:"cl10",p:"10.13",l:2,q:"Nel DNA, i nucleotidi sono uniti da legami…",o:["fosfodiesterei", "fosfoanidridici", "peptidici", "glicosidici tra basi"],a:0,e:"Un gruppo fosfato forma esteri con due zuccheri."},
{id:"cl10_071",t:"cl10",p:"10.13",l:3,q:"Come agiscono gli agenti nervini come sarin e VX?",o:["Inibiscono l'acetilcolinesterasi", "Bloccano l'emoglobina", "Ossidano il DNA", "Sciolgono le membrane"],a:0,e:"Sono derivati organofosforici molto tossici; i bifosfonati invece curano l'osteoporosi."},
{id:"cl10_072",t:"cl10",p:"10.13",l:3,q:"Il 1,3-bisfosfoglicerato della glicolisi è un esempio di…",o:["acilfosfato", "estere fosfato semplice", "ammide", "tioestere"],a:0,e:"Gli acilfosfati sono intermedi nelle acilazioni biochimiche."},
{id:"cl10_073",t:"cl10",p:"10.14",l:1,q:"Che cos'è un composto eterociclico?",o:["Un composto ciclico con almeno un atomo diverso dal carbonio nell'anello", "Un idrocarburo ciclico", "Un composto con due anelli di carbonio", "Un polimero"],a:0,e:"Gli eteroatomi più comuni sono N, O, S."},
{id:"cl10_074",t:"cl10",p:"10.14",l:2,q:"Quale di questi è un eterociclo aromatico?",o:["La piridina", "La piperidina", "Il tetraidrofurano", "La pirrolidina"],a:0,e:"Gli eterocicli aromatici danno sostituzione elettrofila aromatica come il benzene."},
{id:"cl10_075",t:"cl10",p:"10.14",l:2,q:"Quale molecola biologica contiene anelli eterociclici, secondo il libro?",o:["La caffeina", "Il glicerolo", "L'acido acetico", "L'etanolo"],a:0,e:"Anche nicotina, morfina, riboflavina e il gruppo eme."},
{id:"cl10_076",t:"cl10",p:"10.15",l:1,q:"Che cos'è un polimero?",o:["Una macromolecola formata da unità ripetitive (monomeri)", "Un isomero", "Un gas nobile", "Un piccolo composto organico"],a:0,e:"La reazione che li produce è la polimerizzazione."},
{id:"cl10_077",t:"cl10",p:"10.15",l:2,q:"Il nylon e il PET sono polimeri di…",o:["policondensazione", "poliaddizione", "isomerizzazione", "idrolisi"],a:0,e:"Si elimina una piccola molecola (di solito acqua). Polietilene, PP, PVC e PS sono di poliaddizione."},
{id:"cl10_078",t:"cl10",p:"10.15",l:2,q:"Proteine, polisaccaridi e acidi nucleici sono polimeri di…",o:["policondensazione", "poliaddizione radicalica", "isomerizzazione", "combustione"],a:0,e:"Monomeri: amminoacidi, monosaccaridi, nucleotidi."},
{id:"cl10_079",t:"cl10",p:"10.15",l:3,q:"Un polimero formato da monomeri diversi si dice…",o:["copolimero (eteropolimero)", "omopolimero", "monomero", "dimero"],a:0,e:"I copolimeri possono essere alternati o statistici."},
{id:"cl10_sf1",t:"cl10",p:"10.2.2",l:4,q:"Quale alcol NON si ossida con i comuni ossidanti?",o:["2-metil-2-propanolo", "1-propanolo", "2-propanolo", "Etanolo"],a:0,e:"È un alcol terziario: il carbonio con l'–OH non ha idrogeni. Il primario dà aldeide e acido, il secondario un chetone."},
{id:"cl10_sf2",t:"cl10",p:"10.11",l:4,q:"Quali prodotti si ottengono dalla saponificazione dell'acetato di etile con NaOH?",o:["Acetato di sodio ed etanolo", "Acido acetico ed etene", "Etanale e metanolo", "Acetato di sodio e metanolo"],a:0,e:"L'idrolisi basica di CH₃COOCH₂CH₃ dà il carbossilato (CH₃COO⁻Na⁺) e l'alcol da cui deriva l'estere (etanolo)."},
{id:"cl10_sf3",t:"cl10",p:"10.6.2",l:4,q:"Quale composto è la base più forte?",o:["Dimetilammina", "Ammoniaca", "Anilina", "Acetammide"],a:0,e:"Due gruppi alchilici (+I) aumentano la basicità; l'anilina è indebolita dalla risonanza con l'anello e le ammidi non sono praticamente basiche."},
{id:"cl10_sf4",t:"cl10",p:"10.5.2",l:4,q:"Che cosa si ottiene dall'ossidazione del propanale?",o:["Acido propanoico", "1-propanolo", "Propanone", "Propene"],a:0,e:"Le aldeidi si ossidano facilmente ad acidi carbossilici; la riduzione darebbe invece l'1-propanolo."},
{id:"cl10_sf5",t:"cl10",p:"10.1.3",l:4,q:"Il (R)-2-bromobutano reagisce con OH⁻ con meccanismo Sɴ2. Che cosa si ottiene?",o:["(S)-2-butanolo, con inversione di configurazione", "Una miscela racemica di 2-butanolo", "(R)-2-butanolo", "1-butene soltanto"],a:0,e:"L'attacco alle spalle dell'Sɴ2 inverte la configurazione; la racemizzazione è tipica dell'Sɴ1."},
{id:"cl11_001",t:"cl11",p:"11",l:1,q:"Quali caratteristiche hanno in comune le biomolecole?",o:["Sono polifunzionali, spesso macromolecole e polimeri", "Sono tutte inorganiche", "Sono tutte gassose", "Hanno sempre massa molecolare bassa"],a:0,e:"Molte sono formate dalla ripetizione di unità strutturali."},
{id:"cl11_002",t:"cl11",p:"11",l:2,q:"Che cosa significa che una biomolecola è polifunzionale?",o:["Possiede numerosi gruppi funzionali", "Ha molte funzioni nella cellula", "È formata da un solo monomero", "Contiene un solo atomo di carbonio"],a:0,e:"Per esempio uno zucchero ha un carbonile e più gruppi –OH."},
{id:"cl11_003",t:"cl11",p:"11.1.1",l:1,q:"Quale formula generale hanno molti carboidrati semplici?",o:["Cₙ(H₂O)ₘ", "CₙH₂ₙ₊₂", "CₙH₂ₙO", "C₆H₆"],a:0,e:"Da qui il nome storico di \"carbo-idrati\"."},
