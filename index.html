{id:'ch_neut8',t:'ch_neut',l:1,q:`Come si chiama il procedimento con cui si determina la concentrazione di una soluzione facendola reagire con una soluzione a concentrazione nota?`,o:[`Titolazione`,`Distillazione`,`Filtrazione`,`Cromatografia`],a:0,e:`Nella titolazione si aggiunge gradualmente il titolante (di concentrazione nota) finché la reazione è completa, e dal volume impiegato si calcola la concentrazione incognita.`},
{id:'ch_neut9',t:'ch_neut',l:1,q:`Quale strumento di laboratorio si usa per aggiungere il titolante goccia a goccia, misurandone il volume?`,o:[`Buretta`,`Becher`,`Provetta`,`Pallone da distillazione`],a:0,e:`La buretta è un tubo graduato con un rubinetto che permette di dosare con precisione il volume di titolante aggiunto.`},
{id:'ch_neut10',t:'ch_neut',l:1,q:`Quale sale si forma dalla neutralizzazione di H₂SO₄ con NaOH?`,o:[`Na₂SO₄`,`NaSO₂`,`Na₂S`,`NaHS`],a:0,e:`L'anione dell'acido solforico, SO₄²⁻, si combina con 2 Na⁺: si forma il solfato di sodio Na₂SO₄ e acqua.`},
{id:'ch_neut11',t:'ch_neut',l:1,q:`A che cosa serve un indicatore in una titolazione acido-base?`,o:[`A segnalare con un cambio di colore il punto finale`,`A velocizzare la reazione`,`A neutralizzare l'acido`,`A misurare il volume`],a:0,e:`L'indicatore cambia colore in un intervallo di pH vicino al punto di equivalenza: il cambio di colore segnala quando smettere di aggiungere titolante.`},
{id:'ch_neut12',t:'ch_neut',l:1,q:`Quale ione si combina con H⁺ nella neutralizzazione per formare acqua?`,o:[`OH⁻`,`Cl⁻`,`Na⁺`,`O²⁻`],a:0,e:`La reazione di neutralizzazione in forma ionica è H⁺ + OH⁻ → H₂O.`},
{id:'ch_neut13',t:'ch_neut',l:2,q:`Quanti mL di KOH 0,1 M servono per neutralizzare 50 mL di HCl 0,2 M?`,o:[`100 mL`,`25 mL`,`50 mL`,`10 mL`],a:0,e:`Le moli di HCl sono 0,05 L · 0,2 M = 0,01 mol. Servono 0,01 mol di KOH, cioè 0,01 / 0,1 = 0,1 L = 100 mL.`},
{id:'ch_neut14',t:'ch_neut',l:2,q:`Quante moli di H⁺ sono presenti in 100 mL di HCl 0,5 M?`,o:[`0,05 mol`,`0,5 mol`,`5 mol`,`0,005 mol`],a:0,e:`n = M · V = 0,5 mol/L · 0,1 L = 0,05 mol. HCl è monoprotico, quindi le moli di H⁺ sono uguali a quelle di HCl.`},
{id:'ch_neut15',t:'ch_neut',l:2,q:`Titolando acido acetico (acido debole) con NaOH (base forte), il pH al punto di equivalenza è…`,o:[`maggiore di 7`,`uguale a 7`,`minore di 7`,`uguale al pKa`],a:0,e:`Al punto di equivalenza resta solo acetato di sodio. Lo ione acetato è una base debole e reagendo con l'acqua produce OH⁻: la soluzione è basica.`},
{id:'ch_neut16',t:'ch_neut',l:2,q:`Titolando HCl (acido forte) con NH₃ (base debole), il pH al punto di equivalenza è…`,o:[`minore di 7`,`maggiore di 7`,`uguale a 7`,`uguale a 14`],a:0,e:`Al punto di equivalenza resta NH₄Cl. Lo ione NH₄⁺ è un acido debole e cede H⁺ all'acqua: la soluzione è acida.`},
{id:'ch_neut17',t:'ch_neut',l:2,q:`Quanti mL di NaOH 0,1 M servono per neutralizzare completamente 10 mL di H₃PO₄ 0,1 M (che può cedere 3 H⁺)?`,o:[`30 mL`,`10 mL`,`20 mL`,`90 mL`],a:0,e:`Le moli di H₃PO₄ sono 0,01 L · 0,1 M = 0,001 mol, che liberano 0,003 mol di H⁺. Servono 0,003 mol di NaOH, cioè 0,003 / 0,1 = 0,03 L = 30 mL.`},
{id:'ch_neut18',t:'ch_neut',l:2,q:`Nella reazione H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O, quante moli di NaOH neutralizzano 0,5 mol di H₂SO₄?`,o:[`1 mol`,`0,5 mol`,`0,25 mol`,`2 mol`],a:0,e:`Il rapporto stechiometrico è 1 : 2: 0,5 mol di H₂SO₄ reagiscono con 2 · 0,5 = 1 mol di NaOH.`},
{id:'ch_neut19',t:'ch_neut',l:2,q:`Perché il bicarbonato di sodio (NaHCO₃) può essere usato come antiacido?`,o:[`Perché è una base debole che neutralizza l'acido cloridrico in eccesso nello stomaco`,`Perché è un acido forte`,`Perché aumenta la produzione di HCl`,`Perché è un catalizzatore`],a:0,e:`Lo ione HCO₃⁻ accetta H⁺ dall'acido gastrico (HCl) formando H₂CO₃, che si decompone in CO₂ e acqua: l'acidità diminuisce.`},
{id:'ch_neut20',t:'ch_neut',l:3,q:`Per titolare 15 mL di una soluzione di H₂SO₄ servono 30 mL di NaOH 0,1 M. Qual è la molarità dell'H₂SO₄?`,o:[`0,1 M`,`0,2 M`,`0,05 M`,`0,02 M`],a:0,e:`Le moli di NaOH sono 0,03 L · 0,1 M = 0,003 mol. Con rapporto 2 : 1 le moli di H₂SO₄ sono 0,0015 mol, quindi M = 0,0015 / 0,015 = 0,1 M.`},
{id:'ch_neut21',t:'ch_neut',l:3,q:`A 20 mL di HCl 0,1 M si aggiungono 10 mL di NaOH 0,1 M. Qual è il pH della soluzione (circa)?`,o:[`1,5`,`1`,`7`,`13`],a:0,e:`Le moli sono 0,002 mol di H⁺ e 0,001 mol di OH⁻: restano 0,001 mol di H⁺ in 0,030 L, cioè [H⁺] = 0,033 M. pH = −log 0,033 ≈ 1,5.`},
{id:'ch_neut22',t:'ch_neut',l:3,q:`A 25 mL di HCl 0,1 M si aggiungono 30 mL di NaOH 0,1 M. Qual è il pH della soluzione (circa)?`,o:[`12`,`2`,`7`,`1,5`],a:0,e:`Le moli sono 0,0025 mol di H⁺ e 0,0030 mol di OH⁻: restano 0,0005 mol di OH⁻ in 0,055 L, cioè [OH⁻] ≈ 0,0091 M. pOH ≈ 2,04 e pH ≈ 11,96, cioè circa 12,0.`},
{id:'ch_neut23',t:'ch_neut',l:3,q:`Quale indicatore è più adatto per titolare un acido debole con una base forte, con punto di equivalenza a pH circa 8–9?`,o:[`Fenolftaleina (viraggio circa 8–10)`,`Metilarancio (viraggio 3,1–4,4)`,`Rosso metile (viraggio 4,4–6,2)`,`Nessuno, perché non c'è un viraggio`],a:0,e:`L'indicatore deve virare in un intervallo che comprende il pH del punto di equivalenza. La fenolftaleina vira circa tra pH 8 e 10, mentre gli altri indicatori virano in ambiente acido.`},
{id:'ch_neut24',t:'ch_neut',l:3,q:`Perché una soluzione di NH₄Cl in acqua è acida?`,o:[`NH₄⁺ è un acido debole e cede H⁺ all'acqua`,`Cl⁻ è una base forte`,`NH₄Cl contiene ioni H⁺ già pronti`,`NH₄⁺ è una base e produce OH⁻`],a:0,e:`NH₄⁺ è l'acido coniugato della base debole NH₃: in acqua NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺. Lo ione Cl⁻ deriva da un acido forte e non influenza il pH.`},
{id:'ch_neut25',t:'ch_neut',l:3,q:`Quanti grammi di Ca(OH)₂ (M = 74 g/mol) servono per neutralizzare 0,2 mol di HCl?`,o:[`7,4 g`,`14,8 g`,`3,7 g`,`74 g`],a:0,e:`Ca(OH)₂ libera 2 OH⁻, quindi 0,2 mol di HCl richiedono 0,1 mol di Ca(OH)₂. m = 0,1 mol · 74 g/mol = 7,4 g.`},
{id:'ch_org7',t:'ch_org',l:1,q:`Qual è la formula molecolare del metano?`,o:[`CH₄`,`C₂H₆`,`CH₃OH`,`CO₂`],a:0,e:`Il metano è l'alcano più semplice: un atomo di carbonio legato a quattro atomi di idrogeno, CH₄.`},
{id:'ch_org8',t:'ch_org',l:1,q:`Da quali elementi sono formati gli idrocarburi?`,o:[`Solo carbonio e idrogeno`,`Carbonio, idrogeno e ossigeno`,`Carbonio e ossigeno`,`Idrogeno e azoto`],a:0,e:`Gli idrocarburi (alcani, alcheni, alchini, aromatici) contengono solo atomi di C e H.`},
{id:'ch_org9',t:'ch_org',l:1,q:`Quale gruppo funzionale caratterizza le ammine?`,o:[`–NH₂ (gruppo amminico)`,`–OH`,`–COOH`,`–CHO`],a:0,e:`Le ammine derivano dall'ammoniaca e contengono azoto, per esempio –NH₂ nelle ammine primarie. –OH è degli alcoli, –COOH degli acidi carbossilici, –CHO delle aldeidi.`},
{id:'ch_org10',t:'ch_org',l:1,q:`Quale di questi composti è un alcol?`,o:[`Etanolo (CH₃CH₂OH)`,`Etano (CH₃CH₃)`,`Acetone (CH₃COCH₃)`,`Acido acetico (CH₃COOH)`],a:0,e:`Un alcol ha un gruppo –OH legato a un carbonio saturo. L'etano è un alcano, l'acetone un chetone e l'acido acetico un acido carbossilico.`},
{id:'ch_org11',t:'ch_org',l:1,q:`Quale gruppo funzionale caratterizza le aldeidi?`,o:[`–CHO`,`–OH`,`–COOH`,`–NH₂`],a:0,e:`Nelle aldeidi il gruppo carbonile C=O sta all'estremità della catena, con un atomo di idrogeno legato al carbonio: –CHO.`},
{id:'ch_org12',t:'ch_org',l:1,q:`Che cosa studia la chimica organica?`,o:[`I composti del carbonio`,`Solo i composti degli organismi viventi`,`Solo gli idrocarburi`,`I composti dei metalli`],a:0,e:`La chimica organica studia i composti del carbonio, in particolare quelli con legami C–C e C–H, che sono la base delle molecole biologiche e di molti materiali.`},
{id:'ch_org13',t:'ch_org',l:2,q:`Qual è la formula generale degli alcheni, idrocarburi con un solo doppio legame?`,o:[`CₙH₂ₙ`,`CₙH₂ₙ₊₂`,`CₙH₂ₙ₋₂`,`CₙHₙ`],a:0,e:`Un doppio legame C=C fa perdere due atomi di idrogeno rispetto all'alcano con lo stesso numero di carboni: da CₙH₂ₙ₊₂ si passa a CₙH₂ₙ (per esempio C₂H₄, etene).`},
{id:'ch_org14',t:'ch_org',l:2,q:`Come si chiama il composto CH≡CH?`,o:[`Etino (acetilene)`,`Etene`,`Etano`,`Etanolo`],a:0,e:`Il triplo legame tra i due atomi di carbonio caratterizza gli alchini; con due carboni si ha l'etino, comunemente chiamato acetilene.`},
{id:'ch_org15',t:'ch_org',l:2,q:`Quale gruppo funzionale è presente negli esteri?`,o:[`–COO–`,`–CO–`,`–CONH₂`,`–COOH`],a:0,e:`Gli esteri hanno formula generale R–COO–R': derivano da un acido carbossilico e da un alcol. –COOH è il gruppo degli acidi.`},
{id:'ch_org16',t:'ch_org',l:2,q:`Qual è il nome del composto CH₃CH₂CH₃?`,o:[`Propano`,`Propene`,`Butano`,`Etano`],a:0,e:`Tre atomi di carbonio con soli legami singoli: propano (CₙH₂ₙ₊₂ con n = 3, cioè C₃H₈).`},
{id:'ch_org17',t:'ch_org',l:2,q:`Come si chiama la reazione tra un acido carbossilico e un alcol che dà un estere e acqua?`,o:[`Esterificazione`,`Idrogenazione`,`Neutralizzazione`,`Polimerizzazione`],a:0,e:`Per esempio acido acetico + etanolo → acetato di etile + acqua. È una reazione di condensazione tra il gruppo –COOH e il gruppo –OH.`},
{id:'ch_org18',t:'ch_org',l:2,q:`Come si chiama il composto CH₃COOH?`,o:[`Acido acetico (etanoico)`,`Acetone`,`Etanolo`,`Acetaldeide`],a:0,e:`Il gruppo –COOH lo identifica come acido carbossilico; con due atomi di carbonio è l'acido etanoico, detto acido acetico (è l'acido dell'aceto).`},
{id:'ch_org19',t:'ch_org',l:2,q:`A quale classe di composti appartiene il benzene (C₆H₆)?`,o:[`Idrocarburi aromatici`,`Alcani`,`Alcoli`,`Chetoni`],a:0,e:`Il benzene ha un anello di sei atomi di carbonio con elettroni π delocalizzati: è il capostipite degli idrocarburi aromatici.`},
{id:'ch_org20',t:'ch_org',l:3,q:`Quanti isomeri di struttura ha il butano (C₄H₁₀)?`,o:[`2`,`1`,`3`,`4`],a:0,e:`Esistono il n-butano (catena lineare) e l'isobutano, o metilpropano (catena ramificata): 2 isomeri di struttura.`},
{id:'ch_org21',t:'ch_org',l:3,q:`Quanti atomi di idrogeno ha un alcano con 6 atomi di carbonio?`,o:[`14`,`12`,`13`,`16`],a:0,e:`La formula generale degli alcani è CₙH₂ₙ₊₂: per n = 6 si ottiene C₆H₁₄, cioè 2 · 6 + 2 = 14 atomi di idrogeno.`},
{id:'ch_org22',t:'ch_org',l:3,q:`Quale composto si ottiene, per primo, dall'ossidazione blanda di un alcol primario come l'etanolo?`,o:[`Un'aldeide (acetaldeide)`,`Un chetone`,`Un estere`,`Un alcano`],a:0,e:`Gli alcoli primari si ossidano ad aldeidi e, con ossidazione ulteriore, ad acidi carbossilici. Gli alcoli secondari danno invece chetoni.`},
{id:'ch_org23',t:'ch_org',l:3,q:`Quale di questi composti è chirale, cioè contiene un carbonio asimmetrico?`,o:[`Acido lattico (CH₃–CH(OH)–COOH)`,`Etanolo (CH₃CH₂OH)`,`Propano (CH₃CH₂CH₃)`,`Acido acetico (CH₃COOH)`],a:0,e:`Nell'acido lattico il carbonio centrale è legato a quattro gruppi diversi (H, OH, CH₃, COOH): è un centro stereogenico e la molecola esiste in due enantiomeri.`},
{id:'ch_org24',t:'ch_org',l:3,q:`Che cosa si ottiene dall'idrogenazione dell'etene (CH₂=CH₂ + H₂, con catalizzatore)?`,o:[`Etano`,`Etino`,`Etanolo`,`Metano`],a:0,e:`Nella reazione di addizione i due atomi di idrogeno si legano ai due carboni e il doppio legame diventa singolo: si ottiene CH₃–CH₃, l'etano.`},
{id:'ch_org25',t:'ch_org',l:3,q:`Perché gli alcoli hanno punti di ebollizione più alti degli alcani di massa simile?`,o:[`Perché formano legami a idrogeno tra le molecole`,`Perché hanno legami ionici`,`Perché sono molecole più grandi`,`Perché sono apolari`],a:0,e:`Il gruppo –OH può formare legami a idrogeno intermolecolari: per vaporizzare serve più energia. L'etanolo bolle a 78 °C, il propano (massa simile) a circa −42 °C.`},
{id:'bi_ciclo7',t:'bi_ciclo',l:1,q:`Da quali fasi è composta l'interfase del ciclo cellulare?`,o:[`G1, S e G2`,`Profase, metafase e anafase`,`Mitosi e citodieresi`,`G0 e M`],a:0,e:`L'interfase comprende G1 (crescita), S (replicazione del DNA) e G2 (preparazione alla divisione). Segue la fase M, cioè la mitosi con la citodieresi.`},
{id:'bi_ciclo8',t:'bi_ciclo',l:1,q:`Come si chiama la divisione del citoplasma che conclude la divisione cellulare?`,o:[`Citodieresi (citocinesi)`,`Replicazione`,`Trascrizione`,`Interfase`],a:0,e:`La citodieresi separa il citoplasma in due cellule figlie e inizia durante la telofase.`},
{id:'bi_ciclo9',t:'bi_ciclo',l:1,q:`Che cosa significa che una cellula è diploide (2n)?`,o:[`Ha due serie di cromosomi, una da ciascun genitore`,`Ha una sola serie di cromosomi`,`Ha il doppio dei geni di una cellula aploide soltanto`,`Ha due nuclei`],a:0,e:`Le cellule diploidi contengono coppie di cromosomi omologhi: nell'uomo 23 coppie, cioè 46 cromosomi. I gameti sono invece aploidi (n).`},
{id:'bi_ciclo10',t:'bi_ciclo',l:1,q:`Quale tipo di divisione cellulare permette la crescita e la riparazione dei tessuti?`,o:[`Mitosi`,`Meiosi`,`Fecondazione`,`Trascrizione`],a:0,e:`La mitosi produce due cellule figlie geneticamente identiche alla cellula madre: serve per crescita, rinnovamento e riparazione.`},
{id:'bi_ciclo11',t:'bi_ciclo',l:1,q:`In quali cellule dell'uomo avviene la meiosi?`,o:[`Nelle cellule germinali delle gonadi`,`Nelle cellule della pelle`,`Nei neuroni`,`Nei globuli rossi`],a:0,e:`La meiosi avviene solo nelle gonadi (testicoli e ovaie) e produce i gameti.`},
{id:'bi_ciclo12',t:'bi_ciclo',l:1,q:`Che cosa sono i cromatidi fratelli?`,o:[`Le due copie identiche di un cromosoma replicato, unite al centromero`,`I due cromosomi omologhi`,`Due cromosomi di coppie diverse`,`Le due eliche del DNA`],a:0,e:`Dopo la fase S ogni cromosoma è formato da due cromatidi fratelli identici. Si separano durante l'anafase della mitosi (e della meiosi II).`},
{id:'bi_ciclo13',t:'bi_ciclo',l:2,q:`In quale fase della mitosi i cromatidi fratelli si separano e migrano verso poli opposti?`,o:[`Anafase`,`Profase`,`Metafase`,`Telofase`],a:0,e:`All'anafase il centromero si divide e le fibre del fuso trascinano i cromatidi, ormai cromosomi indipendenti, verso i poli.`},
{id:'bi_ciclo14',t:'bi_ciclo',l:2,q:`In quale fase della mitosi si riformano i due nuclei figli e i cromosomi si decondensano?`,o:[`Telofase`,`Anafase`,`Profase`,`Metafase`],a:0,e:`Nella telofase si ricostituisce l'involucro nucleare attorno a ciascun gruppo di cromosomi, e nel frattempo comincia la citodieresi.`},
{id:'bi_ciclo15',t:'bi_ciclo',l:2,q:`In quale fase della meiosi si separano i cromosomi omologhi?`,o:[`Anafase I`,`Anafase II`,`Profase II`,`Fase S`],a:0,e:`Nell'anafase I vanno ai poli opposti i cromosomi omologhi (ciascuno ancora con due cromatidi): per questo la meiosi I è detta divisione riduzionale. Nell'anafase II si separano invece i cromatidi fratelli.`},
{id:'bi_ciclo16',t:'bi_ciclo',l:2,q:`Quanti cromatidi ha una cellula umana in metafase della mitosi?`,o:[`92`,`46`,`23`,`184`],a:0,e:`Dopo la replicazione ogni cromosoma è formato da due cromatidi. Con 46 cromosomi si hanno 46 · 2 = 92 cromatidi, ma il numero di cromosomi resta 46.`},
{id:'bi_ciclo17',t:'bi_ciclo',l:2,q:`Che cos'è la fase G0?`,o:[`Una fase di quiescenza in cui la cellula esce dal ciclo e non si divide`,`La fase in cui il DNA viene replicato`,`La fase della mitosi`,`La fase in cui la cellula muore sempre`],a:0,e:`Molte cellule differenziate (come i neuroni) restano in G0. Alcune possono rientrare nel ciclo se stimolate.`},
{id:'bi_ciclo18',t:'bi_ciclo',l:2,q:`Quale ruolo hanno cicline e chinasi ciclina-dipendenti (CDK)?`,o:[`Regolare la progressione del ciclo cellulare`,`Replicare il DNA`,`Trasportare ossigeno`,`Digerire il DNA danneggiato`],a:0,e:`Il complesso ciclina-CDK, attivato in momenti specifici, fa passare la cellula da una fase all'altra del ciclo.`},
{id:'bi_ciclo19',t:'bi_ciclo',l:2,q:`Quante divisioni cellulari avvengono in una meiosi completa, rispetto a una mitosi?`,o:[`Due divisioni nella meiosi, una nella mitosi`,`Una nella meiosi, due nella mitosi`,`Una in entrambe`,`Tre nella meiosi, una nella mitosi`],a:0,e:`Nella meiosi un'unica replicazione del DNA è seguita da due divisioni (meiosi I e II): da una cellula 2n si ottengono quattro cellule n.`},
{id:'bi_ciclo20',t:'bi_ciclo',l:3,q:`Una cellula umana (2n = 46) completa la meiosi I. Quanti cromosomi ha ciascuna delle due cellule figlie?`,o:[`23 cromosomi, ciascuno con due cromatidi`,`46 cromosomi con un cromatide`,`23 cromosomi con un cromatide`,`92 cromosomi`],a:0,e:`Nella meiosi I si separano gli omologhi: ogni cellula riceve 23 cromosomi, che sono ancora replicati, cioè formati da due cromatidi. Solo nella meiosi II si separano i cromatidi.`},
{id:'bi_ciclo21',t:'bi_ciclo',l:3,q:`Che cosa caratterizza il comportamento delle cellule tumorali rispetto ai controlli del ciclo cellulare?`,o:[`Perdono i controlli e si dividono in modo incontrollato`,`Non replicano mai il DNA`,`Restano sempre in G0`,`Si dividono solo per meiosi`],a:0,e:`Nei tumori sono alterati geni che controllano il ciclo (oncogeni attivati, oncosoppressori inattivati): le cellule continuano a dividersi anche quando non dovrebbero.`},
{id:'bi_ciclo22',t:'bi_ciclo',l:3,q:`Quale proteina, spesso detta «guardiano del genoma», blocca il ciclo cellulare in presenza di danni al DNA?`,o:[`p53`,`Actina`,`Emoglobina`,`Cheratina`],a:0,e:`La proteina p53 è un oncosoppressore: se il DNA è danneggiato arresta il ciclo per permettere la riparazione o, se il danno è troppo grave, induce la morte programmata (apoptosi). In molti tumori p53 è mutata.`},
{id:'bi_ciclo23',t:'bi_ciclo',l:3,q:`Quale errore della meiosi può causare la sindrome di Down?`,o:[`Non-disgiunzione del cromosoma 21`,`Delezione del cromosoma X`,`Mancata replicazione del DNA`,`Mutazione puntiforme silente`],a:0,e:`Se i due cromosomi 21 non si separano in meiosi, si forma un gamete con due copie: dopo la fecondazione lo zigote ha tre copie (trisomia 21).`},
{id:'bi_ciclo24',t:'bi_ciclo',l:3,q:`Quante combinazioni diverse di cromosomi (di origine materna o paterna) può produrre l'uomo per assortimento indipendente dei 23 cromosomi dei suoi gameti, senza considerare il crossing-over?`,o:[`2²³ (circa 8,4 milioni)`,`23² (circa 529)`,`46 (uno per cromosoma)`,`2⁴⁶ (circa 70 mila miliardi)`],a:0,e:`Per ognuna delle 23 coppie di omologhi si può trasmettere il cromosoma materno o quello paterno: 2²³ = 8.388.608 combinazioni. cioè circa 8.4 milioni.`},
{id:'bi_ciclo25',t:'bi_ciclo',l:3,q:`In quale punto del ciclo cellulare la cellula controlla che il DNA sia stato replicato correttamente prima di entrare in mitosi?`,o:[`Al checkpoint G2/M`,`Al checkpoint G1/S`,`Al termine della telofase`,`Durante la metafase della meiosi II`],a:0,e:`Il checkpoint G2/M verifica che la replicazione sia completa e che il DNA sia integro. Il checkpoint G1/S controlla invece le condizioni per iniziare la replicazione.`},
{id:'bi_biomol7',t:'bi_biomol',l:1,q:`Quali elementi sono presenti in tutti i carboidrati?`,o:[`Carbonio, idrogeno e ossigeno`,`Carbonio e azoto`,`Idrogeno e fosforo`,`Carbonio, idrogeno e zolfo`],a:0,e:`I carboidrati hanno formula generale approssimativa Cₙ(H₂O)ₙ: sono formati solo da C, H e O.`},
{id:'bi_biomol8',t:'bi_biomol',l:1,q:`Quali biomolecole conservano e trasmettono l'informazione genetica?`,o:[`Gli acidi nucleici`,`I lipidi`,`I carboidrati`,`Le vitamine`],a:0,e:`DNA e RNA sono acidi nucleici: la sequenza delle loro basi contiene l'informazione per costruire le proteine.`},
{id:'bi_biomol9',t:'bi_biomol',l:1,q:`Quale polisaccaride è la riserva di glucosio nelle piante?`,o:[`Amido`,`Glicogeno`,`Cellulosa`,`Chitina`],a:0,e:`Le piante immagazzinano glucosio sotto forma di amido (per esempio in patate e cereali). Gli animali usano il glicogeno.`},
{id:'bi_biomol10',t:'bi_biomol',l:1,q:`Quali biomolecole formano enzimi e anticorpi?`,o:[`Le proteine`,`I lipidi`,`I carboidrati`,`Gli acidi nucleici`],a:0,e:`Enzimi e anticorpi sono proteine, cioè polimeri di amminoacidi, con forme tridimensionali specifiche.`},
{id:'bi_biomol11',t:'bi_biomol',l:1,q:`Quanti atomi di carbonio ha una molecola di glucosio (C₆H₁₂O₆)?`,o:[`6`,`12`,`3`,`24`],a:0,e:`La formula del glucosio è C₆H₁₂O₆: 6 atomi di carbonio, 12 di idrogeno e 6 di ossigeno.`},
{id:'bi_biomol12',t:'bi_biomol',l:1,q:`Come si comportano in genere i lipidi in acqua?`,o:[`Sono insolubili`,`Sono molto solubili`,`Si ionizzano completamente`,`Si trasformano in zuccheri`],a:0,e:`I lipidi sono per lo più apolari e idrofobici: per questo olio e acqua non si mescolano.`},
{id:'bi_biomol13',t:'bi_biomol',l:2,q:`Da quali due monosaccaridi è formato il saccarosio (lo zucchero da tavola)?`,o:[`Glucosio e fruttosio`,`Glucosio e galattosio`,`Due molecole di glucosio`,`Fruttosio e galattosio`],a:0,e:`Il saccarosio è un disaccaride: glucosio + fruttosio, uniti da un legame glicosidico. Il lattosio è glucosio + galattosio, il maltosio è glucosio + glucosio.`},
{id:'bi_biomol14',t:'bi_biomol',l:2,q:`Come si chiama la reazione che scinde un polimero in monomeri aggiungendo acqua?`,o:[`Idrolisi`,`Condensazione`,`Ossidazione`,`Fermentazione`],a:0,e:`Nell'idrolisi una molecola d'acqua rompe un legame fra due monomeri: è la reazione inversa della condensazione, ed è alla base della digestione.`},
{id:'bi_biomol15',t:'bi_biomol',l:2,q:`Quale lipide è il precursore degli ormoni steroidei, come il cortisolo e gli ormoni sessuali?`,o:[`Colesterolo`,`Trigliceride`,`Fosfolipide`,`Cera`],a:0,e:`Gli ormoni steroidei derivano dal colesterolo, uno steroide con struttura a quattro anelli.`},
{id:'bi_biomol16',t:'bi_biomol',l:2,q:`Che cosa sono i nucleotidi?`,o:[`I monomeri degli acidi nucleici, formati da zucchero, gruppo fosfato e base azotata`,`I monomeri delle proteine`,`I monomeri dei lipidi`,`I componenti del glicogeno`],a:0,e:`Ogni nucleotide ha uno zucchero (ribosio o desossiribosio), un gruppo fosfato e una base azotata.`},
{id:'bi_biomol17',t:'bi_biomol',l:2,q:`Di che cosa è formato un trigliceride?`,o:[`Di una molecola di glicerolo e tre acidi grassi`,`Di tre molecole di glicerolo e un acido grasso`,`Di tre amminoacidi`,`Di tre monosaccaridi`],a:0,e:`Il glicerolo si lega a tre acidi grassi con legami estere. I trigliceridi (grassi e oli) sono la principale riserva energetica a lungo termine.`},
{id:'bi_biomol18',t:'bi_biomol',l:2,q:`Che cosa distingue un acido grasso saturo da uno insaturo?`,o:[`Quello saturo non ha doppi legami C=C nella catena`,`Quello saturo ha più doppi legami`,`Quello saturo contiene azoto`,`Quello saturo è sempre liquido`],a:0,e:`Gli acidi grassi saturi hanno solo legami singoli tra i carboni (catena dritta): i grassi saturi sono di solito solidi. Gli insaturi hanno uno o più doppi legami e sono di solito liquidi (oli).`},
{id:'bi_biomol19',t:'bi_biomol',l:2,q:`Quale polisaccaride è il principale componente della parete cellulare delle piante?`,o:[`Cellulosa`,`Amido`,`Glicogeno`,`Chitina`],a:0,e:`La cellulosa è un polimero di glucosio con funzione strutturale. L'uomo non possiede gli enzimi per digerirla: è una componente delle fibre alimentari.`},
{id:'bi_biomol20',t:'bi_biomol',l:3,q:`Un polipeptide lineare è formato da 50 amminoacidi. Quanti legami peptidici contiene?`,o:[`49`,`50`,`51`,`25`],a:0,e:`Ogni legame peptidico unisce due amminoacidi consecutivi: in una catena lineare di n amminoacidi ce ne sono n − 1 = 49.`},
{id:'bi_biomol21',t:'bi_biomol',l:3,q:`Quante molecole d'acqua si liberano formando un polisaccaride lineare da 10 molecole di glucosio?`,o:[`9`,`10`,`11`,`1`],a:0,e:`Ogni legame glicosidico si forma per condensazione con perdita di una molecola d'acqua. Tra 10 unità ci sono 9 legami, quindi si liberano 9 molecole d'acqua.`},
{id:'bi_biomol22',t:'bi_biomol',l:3,q:`Quale tipo di legame unisce due monosaccaridi in un disaccaride?`,o:[`Legame glicosidico`,`Legame peptidico`,`Legame fosfodiesterico`,`Legame estere`],a:0,e:`Il legame glicosidico si forma per condensazione tra un gruppo –OH di un monosaccaride e uno dell'altro.`},
{id:'bi_biomol23',t:'bi_biomol',l:3,q:`Quale legame unisce tra loro i nucleotidi successivi in un filamento di DNA?`,o:[`Legame fosfodiesterico`,`Legame peptidico`,`Legame glicosidico`,`Legame a idrogeno`],a:0,e:`Il gruppo fosfato lega il carbonio 3' di un nucleotide al carbonio 5' del successivo: si forma lo scheletro zucchero-fosfato. I legami a idrogeno uniscono le basi dei due filamenti.`},
{id:'bi_biomol24',t:'bi_biomol',l:3,q:`Amido e cellulosa sono entrambi polimeri del glucosio. Che cosa li differenzia?`,o:[`Il tipo di legame glicosidico tra le unità di glucosio (α nell'amido, β nella cellulosa)`,`La cellulosa è formata da fruttosio`,`L'amido contiene azoto`,`Il numero di atomi di carbonio del monomero`],a:0,e:`Nell'amido le unità sono unite da legami α, nella cellulosa da legami β: la diversa geometria rende la cellulosa fibrosa e rigida e impedisce all'uomo di digerirla.`},
{id:'bi_biomol25',t:'bi_biomol',l:3,q:`Quale tra queste biomolecole contiene fosforo?`,o:[`Fosfolipidi`,`Trigliceridi`,`Glucosio`,`Amido`],a:0,e:`I fosfolipidi hanno una testa con un gruppo fosfato. Contengono fosforo anche DNA, RNA e ATP. Trigliceridi, glucosio e amido sono formati solo da C, H e O.`},
{id:'bi_prot7',t:'bi_prot',l:1,q:`Quali gruppi sono presenti in ogni amminoacido, oltre alla catena laterale (R)?`,o:[`Un gruppo amminico e un gruppo carbossilico`,`Due gruppi amminici`,`Un gruppo aldeidico e uno fosfato`,`Un gruppo –OH e uno –SH`],a:0,e:`Un amminoacido ha un carbonio centrale legato a un gruppo amminico (–NH₂), un gruppo carbossilico (–COOH), un idrogeno e la catena laterale R, che lo distingue dagli altri.`},
{id:'bi_prot8',t:'bi_prot',l:1,q:`Di che natura chimica sono gli anticorpi?`,o:[`Proteine`,`Lipidi`,`Carboidrati`,`Acidi nucleici`],a:0,e:`Gli anticorpi (immunoglobuline) sono proteine prodotte dai linfociti B, capaci di legarsi in modo specifico agli antigeni.`},
{id:'bi_prot9',t:'bi_prot',l:1,q:`Quale proteina trasporta l'ossigeno nel sangue?`,o:[`Emoglobina`,`Cheratina`,`Collagene`,`Insulina`],a:0,e:`L'emoglobina dei globuli rossi contiene ferro e lega l'ossigeno nei polmoni per rilasciarlo nei tessuti.`},
{id:'bi_prot10',t:'bi_prot',l:1,q:`Come si chiama la molecola su cui agisce un enzima?`,o:[`Substrato`,`Prodotto`,`Cofattore`,`Inibitore`],a:0,e:`Il substrato si lega all'enzima e viene trasformato in uno o più prodotti.`},
{id:'bi_prot11',t:'bi_prot',l:1,q:`Come si chiama la regione dell'enzima in cui si lega il substrato?`,o:[`Sito attivo`,`Sito allosterico`,`Terminale N`,`Gruppo prostetico`],a:0,e:`Il sito attivo è una tasca con forma e proprietà chimiche complementari al substrato, in cui avviene la reazione.`},
{id:'bi_prot12',t:'bi_prot',l:1,q:`Quale proteina è il componente principale di capelli e unghie?`,o:[`Cheratina`,`Emoglobina`,`Amilasi`,`Insulina`],a:0,e:`La cheratina è una proteina fibrosa e resistente che forma capelli, unghie e lo strato più esterno della pelle.`},
{id:'bi_prot13',t:'bi_prot',l:2,q:`Che cos'è la struttura terziaria di una proteina?`,o:[`Il ripiegamento tridimensionale complessivo di una singola catena polipeptidica`,`La sequenza degli amminoacidi`,`Le α-eliche e i foglietti β`,`L'associazione di più catene`],a:0,e:`Interazioni tra le catene laterali (legami idrogeno, ponti disolfuro, interazioni idrofobiche, legami ionici) fanno assumere alla catena la sua forma tridimensionale.`},
{id:'bi_prot14',t:'bi_prot',l:2,q:`Che cosa descrive il modello dell'adattamento indotto per gli enzimi?`,o:[`Il sito attivo modifica leggermente la propria forma quando si lega il substrato`,`Il substrato non cambia mai forma`,`L'enzima si consuma nella reazione`,`Ogni enzima agisce su qualunque substrato`],a:0,e:`Nel modello di Koshland il legame con il substrato induce un cambiamento di conformazione dell'enzima che lo adatta meglio al substrato e favorisce la reazione.`},
{id:'bi_prot15',t:'bi_prot',l:2,q:`Che cos'è un cofattore?`,o:[`Una molecola o uno ione non proteico necessario per l'attività di un enzima`,`Un substrato modificato`,`Un anticorpo`,`Una mutazione dell'enzima`],a:0,e:`I cofattori possono essere ioni metallici (come Mg²⁺ o Zn²⁺) o molecole organiche dette coenzimi (per esempio il NAD⁺ e molte vitamine).`},
{id:'bi_prot16',t:'bi_prot',l:2,q:`Come agisce un inibitore competitivo?`,o:[`Si lega al sito attivo e compete con il substrato`,`Si lega a un sito lontano e deforma l'enzima`,`Distrugge l'enzima`,`Aumenta la velocità della reazione`],a:0,e:`L'inibitore competitivo assomiglia al substrato e occupa il sito attivo: aumentando la concentrazione del substrato la sua azione può essere superata.`},
{id:'bi_prot17',t:'bi_prot',l:2,q:`Come varia la velocità di una reazione enzimatica aumentando la concentrazione del substrato, con enzima costante?`,o:[`Aumenta fino a un valore massimo (saturazione)`,`Aumenta sempre in modo lineare`,`Diminuisce sempre`,`Resta uguale`],a:0,e:`Quando tutti i siti attivi sono occupati, aggiungere substrato non aumenta più la velocità: si raggiunge la velocità massima Vmax.`},
{id:'bi_prot18',t:'bi_prot',l:2,q:`A quale pH l'enzima pepsina, presente nello stomaco, è più attivo?`,o:[`In ambiente fortemente acido (circa pH 2)`,`In ambiente basico (circa pH 9)`,`A pH neutro (circa 7)`,`A qualsiasi pH`],a:0,e:`Ogni enzima ha un pH ottimale legato all'ambiente in cui lavora: la pepsina agisce nello stomaco, acido per l'HCl; gli enzimi dell'intestino tenue lavorano a pH basico.`},
{id:'bi_prot19',t:'bi_prot',l:2,q:`Che cos'è la struttura quaternaria di una proteina?`,o:[`L'associazione di più catene polipeptidiche in un'unica proteina`,`La sequenza degli amminoacidi`,`La forma di una singola catena`,`Il ripiegamento a elica`],a:0,e:`Per esempio l'emoglobina è formata da quattro catene (due α e due β). Non tutte le proteine hanno una struttura quaternaria.`},
{id:'bi_prot20',t:'bi_prot',l:3,q:`Quale tipo di inibizione enzimatica non può essere superata aumentando la concentrazione del substrato?`,o:[`Inibizione non competitiva`,`Inibizione competitiva`,`Saturazione del substrato`,`Attivazione allosterica`],a:0,e:`L'inibitore non competitivo si lega a un sito diverso dal sito attivo e riduce l'attività dell'enzima indipendentemente dalla quantità di substrato: la velocità massima diminuisce.`},
{id:'bi_prot21',t:'bi_prot',l:3,q:`Che cos'è un enzima allosterico?`,o:[`Un enzima regolato da molecole che si legano a un sito diverso dal sito attivo`,`Un enzima senza sito attivo`,`Un enzima che agisce solo a freddo`,`Un enzima formato da RNA`],a:0,e:`Il legame di un effettore al sito allosterico cambia la forma dell'enzima e ne aumenta o ne riduce l'attività: è un meccanismo di regolazione molto diffuso nel metabolismo.`},
{id:'bi_prot22',t:'bi_prot',l:3,q:`Che cosa si intende per retroinibizione (feedback negativo) in una via metabolica?`,o:[`Il prodotto finale inibisce un enzima delle prime tappe`,`Il substrato aumenta l'attività dell'enzima`,`L'enzima viene distrutto dal calore`,`Il prodotto finale attiva tutti gli enzimi`],a:0,e:`Quando il prodotto finale si accumula, inibisce un enzima iniziale della via, evitando di produrne in eccesso.`},
{id:'bi_prot23',t:'bi_prot',l:3,q:`Che cosa determina la specificità di un enzima per il suo substrato?`,o:[`La forma tridimensionale e le proprietà chimiche del sito attivo`,`Il colore dell'enzima`,`La sola temperatura`,`Il numero di atomi del substrato`],a:0,e:`Solo le molecole con forma e carica complementari al sito attivo possono legarsi. La struttura del sito attivo dipende dal ripiegamento della proteina.`},
{id:'bi_prot24',t:'bi_prot',l:3,q:`Qual è la causa molecolare dell'anemia falciforme?`,o:[`La sostituzione di un singolo amminoacido (glutammato con valina) nella catena β dell'emoglobina`,`La perdita di un intero cromosoma`,`La delezione dell'intero gene dell'emoglobina`,`Un'infezione batterica del sangue`],a:0,e:`Una mutazione puntiforme cambia un codone e quindi un amminoacido: l'emoglobina alterata tende a polimerizzare a basso ossigeno e deforma i globuli rossi a falce.`},
{id:'bi_prot25',t:'bi_prot',l:3,q:`Qual è la funzione delle proteine chiamate chaperon (chaperonine)?`,o:[`Aiutare le altre proteine a ripiegarsi nella forma corretta`,`Trasportare gli amminoacidi ai ribosomi`,`Tagliare il DNA`,`Produrre ATP`],a:0,e:`Gli chaperon impediscono ripiegamenti errati e aggregazioni delle proteine appena sintetizzate o danneggiate, per esempio dallo stress termico.`},
{id:'bi_metab7',t:'bi_metab',l:1,q:`Quale gas assorbono le piante per la fotosintesi?`,o:[`Anidride carbonica`,`Ossigeno`,`Azoto`,`Idrogeno`],a:0,e:`Nella fotosintesi le piante fissano la CO₂ dell'aria nei carboidrati.`},
{id:'bi_metab8',t:'bi_metab',l:1,q:`Quale gas viene liberato nell'atmosfera dalla fotosintesi clorofilliana?`,o:[`Ossigeno`,`Anidride carbonica`,`Metano`,`Azoto`],a:0,e:`Nelle reazioni della fase luminosa l'acqua viene scissa e si libera O₂ come prodotto di scarto.`},
{id:'bi_metab9',t:'bi_metab',l:1,q:`Che cos'è il metabolismo?`,o:[`L'insieme di tutte le reazioni chimiche che avvengono in una cellula o in un organismo`,`La sola digestione degli alimenti`,`L'insieme dei geni di un organismo`,`La divisione della cellula`],a:0,e:`Il metabolismo comprende il catabolismo (degradazione di molecole con rilascio di energia) e l'anabolismo (sintesi di molecole con consumo di energia).`},
{id:'bi_metab10',t:'bi_metab',l:1,q:`Quale pigmento cattura la luce nella fotosintesi?`,o:[`Clorofilla`,`Emoglobina`,`Melanina`,`Cheratina`],a:0,e:`La clorofilla, contenuta nei cloroplasti, assorbe soprattutto luce rossa e blu e riflette il verde: per questo le foglie appaiono verdi.`},
{id:'bi_metab11',t:'bi_metab',l:1,q:`Che cosa sono le reazioni anaboliche?`,o:[`Reazioni che costruiscono molecole complesse da molecole semplici consumando energia`,`Reazioni che degradano molecole liberando energia`,`Reazioni che non richiedono enzimi`,`Reazioni che avvengono solo nel nucleo`],a:0,e:`Esempi di anabolismo sono la sintesi delle proteine e la fotosintesi. Il catabolismo, come la respirazione cellulare, degrada molecole liberando energia.`},
{id:'bi_metab12',t:'bi_metab',l:1,q:`Come si chiamano i processi che producono ATP senza usare ossigeno?`,o:[`Fermentazioni`,`Fotosintesi`,`Respirazione aerobica`,`Traduzione`],a:0,e:`Le fermentazioni (lattica e alcolica) partono dalla glicolisi e rigenerano il NAD⁺ senza ossigeno, ma producono molto meno ATP della respirazione.`},
{id:'bi_metab13',t:'bi_metab',l:2,q:`Quali prodotti si ottengono dalla fermentazione alcolica del glucosio?`,o:[`Etanolo e anidride carbonica`,`Acido lattico e acqua`,`Solo acqua`,`Acetato e ossigeno`],a:0,e:`I lieviti trasformano il piruvato in etanolo con rilascio di CO₂: è il processo alla base di vino, birra e lievitazione del pane.`},
{id:'bi_metab14',t:'bi_metab',l:2,q:`Dove avvengono le reazioni della fase luminosa della fotosintesi?`,o:[`Nelle membrane dei tilacoidi dei cloroplasti`,`Nello stroma`,`Nella matrice mitocondriale`,`Nel nucleo`],a:0,e:`I pigmenti e la catena di trasporto sono nelle membrane dei tilacoidi: qui si formano ATP e NADPH. Il ciclo di Calvin avviene nello stroma.`},
{id:'bi_metab15',t:'bi_metab',l:2,q:`Quali molecole prodotte dalla fase luminosa vengono usate nel ciclo di Calvin?`,o:[`ATP e NADPH`,`Glucosio e ossigeno`,`CO₂ e acqua`,`ADP e NADP⁺`],a:0,e:`Nel ciclo di Calvin l'ATP fornisce energia e il NADPH potere riducente per trasformare la CO₂ in zuccheri.`},
{id:'bi_metab16',t:'bi_metab',l:2,q:`Da quale molecola deriva l'ossigeno liberato nella fotosintesi?`,o:[`Dall'acqua`,`Dall'anidride carbonica`,`Dal glucosio`,`Dall'ATP`],a:0,e:`Nella fase luminosa la fotolisi dell'acqua libera elettroni, protoni e O₂. L'ossigeno dell'anidride carbonica finisce invece nei carboidrati e nell'acqua prodotta.`},
{id:'bi_metab17',t:'bi_metab',l:2,q:`Quale molecola entra nel ciclo di Krebs?`,o:[`Acetil-CoA`,`Glucosio`,`Lattato`,`Etanolo`],a:0,e:`Il piruvato viene prima trasformato in acetil-CoA (decarbossilazione ossidativa); l'acetil-CoA si combina con l'ossalacetato e dà inizio al ciclo di Krebs.`},
{id:'bi_metab18',t:'bi_metab',l:2,q:`Qual è il prodotto finale della glicolisi, per ogni molecola di glucosio?`,o:[`Due molecole di piruvato`,`Due molecole di glucosio`,`Sei molecole di CO₂`,`Una molecola di ATP soltanto`],a:0,e:`La glicolisi scinde il glucosio (6 C) in due molecole di piruvato (3 C), con una resa netta di 2 ATP e 2 NADH.`},
{id:'bi_metab19',t:'bi_metab',l:2,q:`Dove avviene nei mitocondri la catena di trasporto degli elettroni?`,o:[`Nella membrana mitocondriale interna`,`Nella matrice`,`Nella membrana esterna`,`Nel citoplasma`],a:0,e:`I complessi della catena respiratoria sono nelle creste della membrana interna, dove creano il gradiente protonico usato dall'ATP sintasi.`},
{id:'bi_metab20',t:'bi_metab',l:3,q:`Qual è l'accettore finale degli elettroni nella catena di trasporto mitocondriale?`,o:[`L'ossigeno`,`Il NAD⁺`,`L'anidride carbonica`,`Il glucosio`],a:0,e:`Alla fine della catena gli elettroni riducono l'O₂ ad acqua. Senza ossigeno la catena si blocca e la respirazione aerobica si ferma.`},
{id:'bi_metab21',t:'bi_metab',l:3,q:`Che cosa fa l'ATP sintasi?`,o:[`Sintetizza ATP sfruttando il flusso di protoni secondo il loro gradiente`,`Scinde l'ATP in ADP e fosfato per fornire energia`,`Trasporta ossigeno`,`Replica il DNA`],a:0,e:`I protoni pompati dalla catena respiratoria rientrano nella matrice attraverso l'ATP sintasi: il flusso fa ruotare l'enzima e rende possibile l'unione di ADP e fosfato.`},
{id:'bi_metab22',t:'bi_metab',l:3,q:`Quante molecole di CO₂ si liberano dalla completa ossidazione di una molecola di glucosio nella respirazione cellulare?`,o:[`6`,`2`,`12`,`1`],a:0,e:`Il glucosio ha 6 atomi di carbonio, che vengono tutti rilasciati come CO₂: 2 molecole dalla decarbossilazione dei due piruvati in acetil-CoA e 4 dai due giri del ciclo di Krebs, in totale 6.`},
{id:'bi_metab23',t:'bi_metab',l:3,q:`Che cosa accade al piruvato nelle cellule muscolari in assenza di ossigeno?`,o:[`Viene ridotto a lattato, rigenerando NAD⁺`,`Entra nel ciclo di Krebs`,`Si trasforma in glucosio nel nucleo`,`Si trasforma in ossigeno`],a:0,e:`La riduzione del piruvato a lattato ossida il NADH a NAD⁺, necessario per continuare la glicolisi anche senza ossigeno.`},
{id:'bi_metab24',t:'bi_metab',l:3,q:`Quale enzima fissa l'anidride carbonica nel ciclo di Calvin?`,o:[`RuBisCO`,`ATP sintasi`,`DNA polimerasi`,`Pepsina`],a:0,e:`La ribulosio-1,5-bisfosfato carbossilasi/ossigenasi (RuBisCO) lega la CO₂ al ribulosio bisfosfato ed è considerata l'enzima più abbondante sulla Terra.`},
{id:'bi_metab25',t:'bi_metab',l:3,q:`Qual è il ruolo del NAD⁺ nel metabolismo?`,o:[`Accettore di elettroni (si riduce a NADH) nelle ossidazioni`,`Enzima che sintetizza ATP`,`Pigmento fotosintetico`,`Componente della membrana`],a:0,e:`Il NAD⁺ raccoglie elettroni e protoni nella glicolisi e nel ciclo di Krebs, trasformandosi in NADH, che li cede poi alla catena di trasporto.`},
{id:'bi_gapp7',t:'bi_gapp',l:1,q:`Quali sono i gruppi sanguigni del sistema ABO?`,o:[`A, B, AB e 0`,`A, B, C e D`,`1, 2, 3 e 4`,`Rh positivo e Rh negativo`],a:0,e:`Il sistema ABO dipende dagli antigeni A e B presenti sulla superficie dei globuli rossi: si hanno i gruppi A, B, AB (entrambi) e 0 (nessuno).`},
{id:'bi_gapp8',t:'bi_gapp',l:1,q:`Qual è il genotipo di una persona di gruppo sanguigno AB?`,o:[`IᴬIᴮ`,`ii`,`IᴬIᴬ`,`Iᴮi`],a:0,e:`Gli alleli Iᴬ e Iᴮ sono codominanti: la persona AB li possiede entrambi e li esprime tutti e due.`},
{id:'bi_gapp9',t:'bi_gapp',l:1,q:`Quali cromosomi sessuali ha una donna?`,o:[`XX`,`XY`,`XO`,`YY`],a:0,e:`Le donne hanno due cromosomi X, gli uomini un X e un Y. Il sesso del figlio dipende dallo spermatozoo, che porta X o Y.`},
{id:'bi_gapp10',t:'bi_gapp',l:1,q:`Quale combinazione di cromosomi sessuali determina il sesso maschile?`,o:[`XY`,`XX`,`XXX`,`YY`],a:0,e:`Il cromosoma Y contiene il gene SRY, che avvia lo sviluppo dei testicoli.`},
{id:'bi_gapp11',t:'bi_gapp',l:1,q:`Che cosa significa essere Rh positivo?`,o:[`Avere l'antigene Rh sulla superficie dei globuli rossi`,`Avere più globuli rossi del normale`,`Non avere anticorpi`,`Avere il gruppo sanguigno 0`],a:0,e:`Il fattore Rh (antigene D) è presente nelle persone Rh+ e assente in quelle Rh−.`},
{id:'bi_gapp12',t:'bi_gapp',l:1,q:`Che cos'è una mutazione genetica?`,o:[`Una variazione stabile della sequenza del DNA`,`Una malattia infettiva`,`Un cambiamento temporaneo del fenotipo dovuto all'ambiente`,`Una divisione cellulare`],a:0,e:`Le mutazioni possono essere neutre, dannose o vantaggiose, e se avvengono nei gameti possono essere trasmesse ai figli.`},
{id:'bi_gapp13',t:'bi_gapp',l:2,q:`Quale gruppo sanguigno è considerato donatore universale per i globuli rossi?`,o:[`0 (Rh negativo)`,`AB (Rh positivo)`,`A (Rh positivo)`,`B (Rh negativo)`],a:0,e:`I globuli rossi di gruppo 0 non portano gli antigeni A e B e, se Rh negativi, nemmeno l'Rh: possono essere trasfusi a quasi tutti.`},
{id:'bi_gapp14',t:'bi_gapp',l:2,q:`Da quali gruppi può ricevere globuli rossi una persona di gruppo AB?`,o:[`A, B, AB e 0`,`Solo AB`,`Solo A e B`,`Solo 0`],a:0,e:`La persona AB non ha anticorpi anti-A né anti-B nel plasma: per questo è detta ricevente universale per i globuli rossi.`},
{id:'bi_gapp15',t:'bi_gapp',l:2,q:`Perché le malattie recessive legate a X, come l'emofilia, sono più frequenti negli uomini?`,o:[`Perché hanno un solo cromosoma X: basta un allele recessivo per manifestarsi`,`Perché il cromosoma Y contiene l'allele malato`,`Perché le donne non hanno il cromosoma X`,`Perché il maschio ha due X`],a:0,e:`Nell'uomo non c'è un secondo X che compensi con un allele dominante. Una donna deve ereditare l'allele recessivo da entrambi i genitori.`},
{id:'bi_gapp16',t:'bi_gapp',l:2,q:`Un padre emofilico (XʰY) ha figli con una madre non portatrice (XᴴXᴴ). Come sono i figli?`,o:[`Figlie portatrici sane, figli sani`,`Tutte le figlie emofiliche`,`Metà dei figli maschi emofilici`,`Tutti i figli emofilici`],a:0,e:`Le figlie ricevono l'Xʰ del padre e un Xᴴ dalla madre: sono portatrici. I figli ricevono la Y dal padre e un Xᴴ dalla madre: sono sani.`},
{id:'bi_gapp17',t:'bi_gapp',l:2,q:`Genitori di gruppo 0 e AB. Quali gruppi possono avere i figli?`,o:[`A oppure B`,`Solo AB`,`0 oppure AB`,`A, B, AB e 0`],a:0,e:`Il genitore 0 è ii e il genitore AB è IᴬIᴮ: i figli possono essere Iᴬi (gruppo A) o Iᴮi (gruppo B). Non possono essere né 0 né AB.`},
{id:'bi_gapp18',t:'bi_gapp',l:2,q:`Che cos'è la sindrome di Down?`,o:[`Una condizione dovuta alla presenza di tre copie del cromosoma 21`,`Una malattia recessiva legata a X`,`Una carenza di un enzima`,`Una malattia infettiva`],a:0,e:`Nella forma più comune (trisomia 21) le cellule hanno 47 cromosomi invece di 46, per un errore di non-disgiunzione durante la meiosi.`},
{id:'bi_gapp19',t:'bi_gapp',l:2,q:`Che cosa sono gli alleli multipli?`,o:[`Più di due forme alternative di uno stesso gene presenti nella popolazione`,`Più geni per lo stesso carattere`,`Più di due alleli in una stessa persona`,`Alleli che non mutano mai`],a:0,e:`Il gruppo sanguigno ABO ne è un esempio: esistono tre alleli (Iᴬ, Iᴮ, i), ma ogni individuo ne ha solo due.`},
{id:'bi_gapp20',t:'bi_gapp',l:3,q:`Una donna di gruppo A (Iᴬi) e un uomo di gruppo B (Iᴮi) hanno un figlio. Qual è la probabilità che sia di gruppo 0?`,o:[`1/4`,`1/2`,`1/8`,`0`],a:0,e:`Per essere 0 il figlio deve ricevere l'allele i da entrambi: 1/2 · 1/2 = 1/4.`},
{id:'bi_gapp21',t:'bi_gapp',l:3,q:`Una donna portatrice di daltonismo (XᴰXᵈ) ha figli con un uomo non daltonico (XᴰY). Qual è la probabilità che una figlia sia daltonica?`,o:[`0`,`1/2`,`1/4`,`1`],a:0,e:`Tutte le figlie ricevono l'Xᴰ del padre, quindi hanno almeno un allele normale e non sono daltoniche (la metà sarà portatrice). Solo i figli maschi hanno il 50% di probabilità di essere daltonici.`},
{id:'bi_gapp22',t:'bi_gapp',l:3,q:`Due genitori portatori di fibrosi cistica (malattia autosomica recessiva) hanno un figlio. Qual è la probabilità che sia malato?`,o:[`1/4`,`1/2`,`3/4`,`1/8`],a:0,e:`Incrocio Aa × Aa: la probabilità del genotipo aa è 1/4.`},
{id:'bi_gapp23',t:'bi_gapp',l:3,q:`In una popolazione in equilibrio di Hardy-Weinberg, una malattia recessiva ha frequenza q² = 1/10 000 (cioè q = 0,01). Qual è la frequenza approssimata dei portatori (2pq)?`,o:[`circa il 2% (1 su 50)`,`circa lo 0,01% (1 su 10 000)`,`circa il 25%`,`circa l'1% (1 su 100)`],a:0,e:`Con q = 0,01 si ha p = 0,99 e 2pq = 2 · 0,99 · 0,01 ≈ 2%, cioè circa 1 persona su 50.`},
{id:'bi_gapp24',t:'bi_gapp',l:3,q:`Quale cariotipo caratterizza la sindrome di Turner?`,o:[`45,X`,`47,XXY`,`47,XY,+21`,`46,XY`],a:0,e:`Le donne con sindrome di Turner hanno un solo cromosoma X (monosomia X): 45 cromosomi in totale. 47,XXY è la sindrome di Klinefelter, 47,XY,+21 la sindrome di Down.`},
{id:'bi_gapp25',t:'bi_gapp',l:3,q:`Un uomo di gruppo A e una donna di gruppo B hanno un figlio di gruppo 0. Quali sono i genotipi dei genitori?`,o:[`Iᴬi e Iᴮi`,`IᴬIᴬ e IᴮIᴮ`,`IᴬIᴬ e Iᴮi`,`Iᴬi e IᴮIᴮ`],a:0,e:`Il figlio 0 è ii: ha ricevuto un allele i da ciascun genitore. Entrambi i genitori sono quindi eterozigoti, Iᴬi (gruppo A) e Iᴮi (gruppo B).`},
{id:'fi_gran7',t:'fi_gran',l:1,q:`Qual è l'unità di misura della lunghezza nel Sistema Internazionale?`,o:[`Metro`,`Chilometro`,`Centimetro`,`Miglio`],a:0,e:`Nel SI l'unità di lunghezza è il metro (m). Chilometro e centimetro sono suoi multipli e sottomultipli, il miglio non fa parte del SI.`},
{id:'fi_gran8',t:'fi_gran',l:1,q:`Qual è l'unità di misura del tempo nel Sistema Internazionale?`,o:[`Secondo`,`Minuto`,`Ora`,`Giorno`],a:0,e:`Il secondo (s) è l'unità SI del tempo. Minuti e ore sono unità accettate ma non del SI.`},
{id:'fi_gran9',t:'fi_gran',l:1,q:`Quanti grammi sono 3 kg?`,o:[`3000 g`,`30 g`,`300 g`,`0,003 g`],a:0,e:`1 kg = 1000 g, quindi 3 kg = 3 · 1000 = 3000 g.`},
{id:'fi_gran10',t:'fi_gran',l:1,q:`Quale prefisso corrisponde a un fattore 10⁻³?`,o:[`milli`,`kilo`,`centi`,`micro`],a:0,e:`Milli = 10⁻³ (un millesimo), kilo = 10³, centi = 10⁻², micro = 10⁻⁶.`},
{id:'fi_gran11',t:'fi_gran',l:1,q:`Quanti centimetri sono 1,5 m?`,o:[`150 cm`,`15 cm`,`0,015 cm`,`1500 cm`],a:0,e:`1 m = 100 cm, quindi 1,5 m = 150 cm.`},
{id:'fi_gran12',t:'fi_gran',l:1,q:`Quale di queste è una grandezza fondamentale del Sistema Internazionale?`,o:[`Massa`,`Forza`,`Velocità`,`Energia`],a:0,e:`Le grandezze fondamentali del SI sono lunghezza, massa, tempo, corrente elettrica, temperatura, quantità di sostanza e intensità luminosa. Forza, velocità ed energia sono grandezze derivate.`},
{id:'fi_gran13',t:'fi_gran',l:2,q:`Quanti secondi sono contenuti in 2,5 ore?`,o:[`9000 s`,`150 s`,`250 s`,`900 s`],a:0,e:`1 h = 3600 s, quindi 2,5 h = 2,5 · 3600 = 9000 s.`},
{id:'fi_gran14',t:'fi_gran',l:2,q:`A quanti m/s corrispondono 36 km/h?`,o:[`10 m/s`,`36 m/s`,`3,6 m/s`,`129,6 m/s`],a:0,e:`Si divide per 3,6: 36 / 3,6 = 10 m/s. Infatti 36 km = 36 000 m e 1 h = 3600 s.`},
{id:'fi_gran15',t:'fi_gran',l:2,q:`Quanti millilitri sono 0,25 L?`,o:[`250 mL`,`25 mL`,`2,5 mL`,`2500 mL`],a:0,e:`1 L = 1000 mL, quindi 0,25 L = 0,25 · 1000 = 250 mL.`},
{id:'fi_gran16',t:'fi_gran',l:2,q:`A quanti m² corrispondono 5000 cm²?`,o:[`0,5 m²`,`50 m²`,`5 m²`,`0,05 m²`],a:0,e:`1 m² = 10 000 cm² (perché 1 m = 100 cm e le aree si moltiplicano per 100²). 5000 cm² = 5000 / 10 000 = 0,5 m².`},
{id:'fi_gran17',t:'fi_gran',l:2,q:`La densità dell'alluminio è 2,7 g/cm³. A quanti kg/m³ corrisponde?`,o:[`2700 kg/m³`,`27 kg/m³`,`0,0027 kg/m³`,`270 kg/m³`],a:0,e:`1 g/cm³ = 1000 kg/m³ (1 g = 10⁻³ kg e 1 cm³ = 10⁻⁶ m³). Quindi 2,7 g/cm³ = 2700 kg/m³.`},
{id:'fi_gran18',t:'fi_gran',l:2,q:`Quante cifre significative ha il numero 0,00450?`,o:[`3`,`5`,`2`,`6`],a:0,e:`Gli zeri a sinistra non sono significativi; lo sono le cifre 4, 5 e lo zero finale a destra della virgola, che indica la precisione della misura. Le cifre significative sono quindi 3.`},
{id:'fi_gran19',t:'fi_gran',l:2,q:`Come si scrive 0,00032 in notazione scientifica?`,o:[`3,2 × 10⁻⁴`,`3,2 × 10⁻³`,`32 × 10⁻⁵`,`3,2 × 10⁴`],a:0,e:`Si sposta la virgola di 4 posti a destra per ottenere 3,2: occorre quindi moltiplicare per 10⁻⁴.`},
{id:'fi_gran20',t:'fi_gran',l:3,q:`A quale combinazione di unità fondamentali del SI equivale il joule?`,o:[`kg · m² / s²`,`kg · m / s²`,`kg · m² / s`,`kg · m / s`],a:0,e:`J = N · m e N = kg · m / s², quindi J = kg · m² / s².`},
{id:'fi_gran21',t:'fi_gran',l:3,q:`Quanti m³ sono 250 L?`,o:[`0,25 m³`,`250 m³`,`2,5 m³`,`0,025 m³`],a:0,e:`1 m³ = 1000 L, quindi 250 L = 250 / 1000 = 0,25 m³.`},
{id:'fi_gran22',t:'fi_gran',l:3,q:`La velocità della luce nel vuoto è circa 3 × 10⁸ m/s. A quanti km/h corrisponde?`,o:[`1,08 × 10⁹ km/h`,`3 × 10⁸ km/h`,`8,3 × 10⁷ km/h`,`1,08 × 10⁶ km/h`],a:0,e:`Per passare da m/s a km/h si moltiplica per 3,6: 3 × 10⁸ · 3,6 = 1,08 × 10⁹ km/h.`},
{id:'fi_gran23',t:'fi_gran',l:3,q:`Quale delle seguenti formule è dimensionalmente corretta per l'accelerazione?`,o:[`a = v / t`,`a = v · t`,`a = s / t`,`a = v² · t`],a:0,e:`Le dimensioni dell'accelerazione sono [m/s²]. v / t = (m/s) / s = m/s². Le altre espressioni danno m (v · t), m/s (s / t) o m²/s (v² · t).`},
{id:'fi_gran24',t:'fi_gran',l:3,q:`A quale volume corrisponde 1 mL?`,o:[`1 cm³`,`1 dm³`,`1 m³`,`10 cm³`],a:0,e:`1 L = 1 dm³ = 1000 cm³, quindi 1 mL = 1/1000 L = 1 cm³.`},
{id:'fi_gran25',t:'fi_gran',l:3,q:`Una lunghezza viene misurata come (20,0 ± 0,5) cm. Qual è l'errore relativo percentuale?`,o:[`2,5%`,`0,5%`,`25%`,`2,5 cm`],a:0,e:`L'errore relativo è errore assoluto / valore misurato = 0,5 / 20,0 = 0,025, cioè 2,5%.`},
{id:'fi_vet7',t:'fi_vet',l:1,q:`Tra massa, tempo, forza e temperatura, quale è una grandezza vettoriale?`,o:[`Forza`,`Massa`,`Tempo`,`Temperatura`],a:0,e:`Una forza è definita da modulo, direzione e verso: è un vettore. Massa, tempo e temperatura sono scalari, cioè descritti da un solo numero (con l'unità di misura).`},
{id:'fi_vet8',t:'fi_vet',l:1,q:`Quali elementi servono per definire completamente un vettore?`,o:[`Modulo, direzione e verso`,`Solo il modulo`,`Solo la direzione`,`Solo il punto di applicazione`],a:0,e:`Un vettore ha un'intensità (modulo), una retta d'azione (direzione) e un orientamento su di essa (verso).`},
{id:'fi_vet9',t:'fi_vet',l:1,q:`Tra spostamento, accelerazione, velocità e temperatura, quale è una grandezza scalare?`,o:[`Temperatura`,`Spostamento`,`Accelerazione`,`Velocità`],a:0,e:`La temperatura è un numero senza direzione. Spostamento, velocità e accelerazione sono vettori.`},
{id:'fi_vet10',t:'fi_vet',l:1,q:`Due forze di 4 N agiscono sullo stesso punto, nella stessa direzione e nello stesso verso. Quanto vale la risultante?`,o:[`8 N`,`0 N`,`4 N`,`16 N`],a:0,e:`Con stessa direzione e verso i moduli si sommano: 4 + 4 = 8 N.`},
{id:'fi_vet11',t:'fi_vet',l:1,q:`Come si chiama il vettore che si ottiene sommando due o più vettori?`,o:[`Vettore risultante`,`Vettore opposto`,`Vettore nullo`,`Versore`],a:0,e:`La somma dei vettori si chiama risultante: è il vettore che da solo ha lo stesso effetto di tutti gli altri insieme.`},
{id:'fi_vet12',t:'fi_vet',l:1,q:`Un atleta percorre un giro completo di una pista circolare e torna al punto di partenza. Quanto vale il suo spostamento?`,o:[`Zero`,`Uguale alla lunghezza della pista`,`Uguale al diametro della pista`,`Uguale al raggio`],a:0,e:`Lo spostamento è il vettore che va dalla posizione iniziale a quella finale. Se coincidono, lo spostamento è nullo, anche se il cammino percorso è lungo.`},
{id:'fi_vet13',t:'fi_vet',l:2,q:`Due forze perpendicolari hanno moduli 12 N e 5 N. Quanto vale il modulo della risultante?`,o:[`13 N`,`17 N`,`7 N`,`60 N`],a:0,e:`Per il teorema di Pitagora R = √(12² + 5²) = √169 = 13 N. La somma 17 N sarebbe valida solo per forze parallele concordi.`},
{id:'fi_vet14',t:'fi_vet',l:2,q:`Un vettore di modulo 20 forma un angolo di 60° con l'asse x (cos 60° = 0,5). Quanto vale la sua componente lungo x?`,o:[`10`,`17,3`,`20`,`40`],a:0,e:`Vₓ = V · cos θ = 20 · 0,5 = 10. La componente lungo y sarebbe V · sin 60° ≈ 17,3.`},
{id:'fi_vet15',t:'fi_vet',l:2,q:`Un vettore ha componenti Vₓ = 3 e Vᵧ = 4. Quanto vale il suo modulo?`,o:[`5`,`7`,`12`,`3,5`],a:0,e:`V = √(3² + 4²) = √25 = 5 (terna pitagorica 3-4-5).`},
{id:'fi_vet16',t:'fi_vet',l:2,q:`Un viaggiatore cammina 3 km verso est e poi 4 km verso nord. Quanto vale il modulo del suo spostamento?`,o:[`5 km`,`7 km`,`1 km`,`12 km`],a:0,e:`Gli spostamenti sono perpendicolari: √(3² + 4²) = 5 km. Il cammino percorso, invece, è 7 km.`},
{id:'fi_vet17',t:'fi_vet',l:2,q:`Come è fatto il vettore opposto di un vettore v?`,o:[`Ha stessi modulo e direzione ma verso contrario`,`Ha modulo doppio`,`Ha modulo nullo`,`Ha direzione perpendicolare`],a:0,e:`Il vettore −v ha lo stesso modulo e la stessa direzione di v, ma verso opposto; la somma v + (−v) dà il vettore nullo.`},
{id:'fi_vet18',t:'fi_vet',l:2,q:`Come si calcola la differenza a − b di due vettori?`,o:[`Sommando ad a il vettore opposto di b`,`Sottraendo i moduli e basta`,`Moltiplicando i moduli`,`Sommando i moduli`],a:0,e:`a − b = a + (−b): si somma ad a il vettore b rovesciato di verso. Non basta sottrarre i moduli, perché conta anche la direzione.`},
{id:'fi_vet19',t:'fi_vet',l:2,q:`Due vettori paralleli e concordi hanno moduli 5 e 7. Quanto vale il modulo della somma?`,o:[`12`,`2`,`35`,`√74`],a:0,e:`Per vettori con stessa direzione e verso i moduli si sommano: 5 + 7 = 12.`},
{id:'fi_vet20',t:'fi_vet',l:3,q:`Due vettori di modulo 10 formano tra loro un angolo di 120°. Quanto vale il modulo della loro somma?`,o:[`10`,`20`,`14,1`,`0`],a:0,e:`Si usa R² = a² + b² + 2ab·cos θ = 100 + 100 + 200 · (−0,5) = 100, quindi R = 10. Con 120° il risultato ha lo stesso modulo dei due vettori.`},
{id:'fi_vet21',t:'fi_vet',l:3,q:`Una barca che naviga a 3 m/s rispetto all'acqua attraversa un fiume con corrente di 4 m/s, perpendicolare alla direzione della barca. Quanto vale la sua velocità rispetto alla riva?`,o:[`5 m/s`,`7 m/s`,`1 m/s`,`12 m/s`],a:0,e:`Le due velocità sono perpendicolari e si compongono con il teorema di Pitagora: √(3² + 4²) = 5 m/s.`},
{id:'fi_vet22',t:'fi_vet',l:3,q:`Una forza di 100 N forma un angolo di 37° con l'asse x (sin 37° ≈ 0,6 e cos 37° ≈ 0,8). Quali sono le sue componenti?`,o:[`Fₓ ≈ 80 N e Fᵧ ≈ 60 N`,`Fₓ ≈ 60 N e Fᵧ ≈ 80 N`,`Fₓ ≈ 37 N e Fᵧ ≈ 63 N`,`Fₓ ≈ 100 N e Fᵧ ≈ 0 N`],a:0,e:`Fₓ = F · cos 37° ≈ 100 · 0,8 = 80 N e Fᵧ = F · sin 37° ≈ 100 · 0,6 = 60 N. Si verifica con Pitagora: √(80² + 60²) = 100 N.`},
{id:'fi_vet23',t:'fi_vet',l:3,q:`Qual è la somma dei vettori a = (2, 3) e b = (−5, 1)?`,o:[`(−3, 4)`,`(7, 2)`,`(−3, 2)`,`(3, 4)`],a:0,e:`Si sommano le componenti corrispondenti: x = 2 + (−5) = −3 e y = 3 + 1 = 4.`},
{id:'fi_vet24',t:'fi_vet',l:3,q:`Su un punto agiscono una forza di 3 N verso est e una di 4 N verso nord. Quale terza forza lo mantiene in equilibrio?`,o:[`5 N, nella direzione opposta alla risultante delle prime due`,`7 N verso nord-est`,`5 N nella stessa direzione della risultante`,`1 N verso est`],a:0,e:`La risultante delle prime due è √(3² + 4²) = 5 N verso nord-est. Per l'equilibrio la somma di tutte le forze deve essere nulla: la terza forza ha modulo 5 N e verso opposto (sud-ovest).`},
{id:'fi_vet25',t:'fi_vet',l:3,q:`Un vettore ha componenti Vₓ = −6 e Vᵧ = 8. Quanto vale il suo modulo?`,o:[`10`,`14`,`2`,`−10`],a:0,e:`Il modulo è sempre positivo: V = √((−6)² + 8²) = √(36 + 64) = 10. Il segno meno della componente non influisce sul modulo.`},
{id:'fi_flu7',t:'fi_flu',l:1,q:`Quanti pascal corrispondono circa a 1 atmosfera?`,o:[`101 325 Pa (circa 10⁵ Pa)`,`1 Pa`,`760 Pa`,`10 Pa`],a:0,e:`La pressione atmosferica normale è 1 atm = 101 325 Pa, cioè circa 100 000 Pa. Il numero 760 è invece il valore in mmHg.`},
{id:'fi_flu8',t:'fi_flu',l:1,q:`Qual è la densità dell'acqua pura (a circa 4 °C)?`,o:[`1000 kg/m³`,`1 kg/m³`,`100 kg/m³`,`10 000 kg/m³`],a:0,e:`L'acqua ha densità 1 g/cm³ = 1000 kg/m³: 1 litro di acqua ha una massa di 1 kg.`},
{id:'fi_flu9',t:'fi_flu',l:1,q:`Che cosa afferma il principio di Pascal?`,o:[`La pressione applicata a un fluido in un recipiente si trasmette inalterata in ogni punto del fluido`,`La pressione diminuisce con la profondità`,`Un corpo immerso riceve una spinta verso l'alto`,`La pressione dipende solo dal volume`],a:0,e:`Se si esercita una pressione su un fluido incomprimibile chiuso, essa si trasmette identica in ogni punto: è il principio del torchio idraulico e dei freni a disco.`},
{id:'fi_flu10',t:'fi_flu',l:1,q:`In quale direzione agisce la spinta di Archimede?`,o:[`Verso l'alto`,`Verso il basso`,`Orizzontale`,`Dipende dal materiale`],a:0,e:`Il fluido spinge ogni corpo immerso verso l'alto con una forza uguale al peso del fluido spostato.`},
{id:'fi_flu11',t:'fi_flu',l:1,q:`Quando un corpo galleggia sulla superficie di un liquido?`,o:[`Quando la sua densità media è minore di quella del liquido`,`Quando la sua massa è piccola in assoluto`,`Quando è cavo`,`Quando la sua densità è maggiore`],a:0,e:`Un corpo galleggia se la spinta di Archimede massima eguaglia il suo peso con una parte non immersa: in sostanza se la sua densità media è minore di quella del fluido.`},
{id:'fi_flu12',t:'fi_flu',l:1,q:`Come varia la pressione in un liquido in quiete all'aumentare della profondità?`,o:[`Aumenta`,`Diminuisce`,`Resta costante`,`Si annulla`],a:0,e:`Per la legge di Stevino p = p₀ + ρ · g · h: la pressione cresce in modo lineare con la profondità h.`},
{id:'fi_flu13',t:'fi_flu',l:2,q:`Qual è la pressione dovuta alla sola acqua a 20 m di profondità? (d = 1000 kg/m³, g = 10 m/s²)`,o:[`200000 Pa`,`20 000 Pa`,`2000 Pa`,`1 000 000 Pa`],a:0,e:`p = d · g · h = 1000 · 10 · 20 = 200 000 Pa, cioè circa 2 atm in più della pressione atmosferica.`},
{id:'fi_flu14',t:'fi_flu',l:2,q:`Un blocco di massa 2 kg ha densità 4000 kg/m³. Quanto vale il suo volume?`,o:[`0,0005 m³`,`2000 m³`,`0,5 m³`,`8000 m³`],a:0,e:`d = m / V, quindi V = m / d = 2 / 4000 = 0,0005 m³ (cioè 0,5 L).`},
{id:'fi_flu15',t:'fi_flu',l:2,q:`Una persona di 60 kg si appoggia su due piedi, con superficie totale di appoggio 0,03 m² (g = 10 m/s²). Quale pressione esercita sul pavimento?`,o:[`20000 Pa`,`600 Pa`,`1800 Pa`,`200 Pa`],a:0,e:`La forza è il peso: 60 · 10 = 600 N. p = F / S = 600 / 0,03 = 20 000 Pa.`},
{id:'fi_flu16',t:'fi_flu',l:2,q:`Un corpo di volume 2 L è completamente immerso in acqua (d = 1000 kg/m³, g = 10 m/s²). Quanto vale la spinta di Archimede?`,o:[`20 N`,`2 N`,`200 N`,`2000 N`],a:0,e:`2 L = 0,002 m³. La spinta è il peso del fluido spostato: d · V · g = 1000 · 0,002 · 10 = 20 N.`},
{id:'fi_flu17',t:'fi_flu',l:2,q:`Un blocco pesa 50 N nell'aria. Immerso in acqua riceve una spinta di Archimede di 20 N. Quanto vale il suo peso apparente?`,o:[`30 N`,`70 N`,`20 N`,`50 N`],a:0,e:`Il peso apparente è il peso meno la spinta: 50 − 20 = 30 N.`},
{id:'fi_flu18',t:'fi_flu',l:2,q:`Un'acqua scorre in un tubo di sezione 0,01 m² con velocità 2 m/s. Quanto vale la portata?`,o:[`0,02 m³/s`,`0,005 m³/s`,`200 m³/s`,`0,2 m³/s`],a:0,e:`La portata è Q = S · v = 0,01 · 2 = 0,02 m³/s, cioè 20 litri al secondo.`},
{id:'fi_flu19',t:'fi_flu',l:2,q:`Secondo l'equazione di continuità, se un tubo si restringe e la sua sezione si dimezza, la velocità di un liquido incomprimibile…`,o:[`raddoppia`,`si dimezza`,`resta uguale`,`diventa quattro volte più grande`],a:0,e:`La portata S · v è costante: se S si dimezza, v deve raddoppiare.`},
{id:'fi_flu20',t:'fi_flu',l:3,q:`Un cubo di legno (densità 600 kg/m³) galleggia nell'acqua (densità 1000 kg/m³). Quale frazione del suo volume è immersa?`,o:[`60%`,`40%`,`100%`,`16,7%`],a:0,e:`All'equilibrio il peso (d_legno · V · g) è uguale alla spinta (d_acqua · V_immerso · g): V_immerso / V = 600 / 1000 = 0,6, cioè 60%.`},
{id:'fi_flu21',t:'fi_flu',l:3,q:`In un torchio idraulico i pistoni hanno superfici 5 cm² e 100 cm². Se sul pistone piccolo si esercita una forza di 20 N, quale forza si ottiene sul pistone grande?`,o:[`400 N`,`1 N`,`100 N`,`2000 N`],a:0,e:`Per il principio di Pascal F₁/A₁ = F₂/A₂, quindi F₂ = F₁ · A₂/A₁ = 20 · 100 / 5 = 400 N.`},
{id:'fi_flu22',t:'fi_flu',l:3,q:`Qual è la pressione assoluta a 10 m di profondità in acqua (p₀ = 1 × 10⁵ Pa, d = 1000 kg/m³, g = 10 m/s²)?`,o:[`2 × 10⁵ Pa`,`1 × 10⁵ Pa`,`1,1 × 10⁵ Pa`,`10 × 10⁵ Pa`],a:0,e:`La pressione dell'acqua è d · g · h = 1000 · 10 · 10 = 1 × 10⁵ Pa. Va sommata a quella atmosferica: 2 × 10⁵ Pa, cioè circa 2 atm.`},
{id:'fi_flu23',t:'fi_flu',l:3,q:`Secondo l'equazione di Bernoulli, in un tratto orizzontale di un tubo dove la velocità del fluido è maggiore, la pressione è…`,o:[`minore`,`maggiore`,`uguale`,`nulla`],a:0,e:`Per un fluido ideale p + ½·d·v² resta costante lungo un tubo orizzontale: dove v aumenta, p diminuisce.`},
{id:'fi_flu24',t:'fi_flu',l:3,q:`Secondo la legge di Stevino, da che cosa dipende la pressione in un punto di un liquido in quiete?`,o:[`Dalla profondità e dalla densità del liquido, non dalla forma del recipiente`,`Dalla quantità totale di liquido`,`Dalla forma del recipiente`,`Dall'area della superficie libera`],a:0,e:`p = p₀ + d · g · h: conta solo la profondità del punto, per questo il livello è lo stesso in vasi comunicanti di forme diverse.`},
{id:'fi_flu25',t:'fi_flu',l:3,q:`Un iceberg di ghiaccio (densità 917 kg/m³) galleggia in acqua di mare (densità 1025 kg/m³). Quale percentuale del suo volume è immersa (circa)?`,o:[`89%`,`10%`,`50%`,`100%`],a:0,e:`Peso e spinta si bilanciano: V_immerso / V = 917 / 1025 ≈ 0,89, cioè circa l'89%. Solo circa l'11% emerge dall'acqua.`},
{id:'fi_cal7',t:'fi_cal',l:1,q:`Qual è l'unità di misura del calore nel Sistema Internazionale?`,o:[`Joule`,`Caloria`,`Kelvin`,`Watt`],a:0,e:`Il calore è una forma di energia in transito, quindi si misura in joule (J). La caloria (1 cal ≈ 4,186 J) è un'unità storica.`},
{id:'fi_cal8',t:'fi_cal',l:1,q:`Come si chiama la trasmissione del calore che avviene in un solido tra parti a contatto, senza spostamento di materia?`,o:[`Conduzione`,`Convezione`,`Irraggiamento`,`Evaporazione`],a:0,e:`Nella conduzione l'energia termica passa da una particella all'altra per urti e vibrazioni: per esempio lungo un cucchiaio di metallo in una pentola calda.`},
{id:'fi_cal9',t:'fi_cal',l:1,q:`Come si chiama la trasmissione del calore in un liquido o in un gas dovuta al movimento di masse di fluido?`,o:[`Convezione`,`Conduzione`,`Irraggiamento`,`Sublimazione`],a:0,e:`Nella convezione il fluido caldo, meno denso, sale e quello freddo scende: si formano correnti, come in una pentola d'acqua sul fornello.`},
{id:'fi_cal10',t:'fi_cal',l:1,q:`A quanti gradi Celsius corrispondono (circa) 300 K?`,o:[`27 °C`,`573 °C`,`−27 °C`,`3 °C`],a:0,e:`T(°C) = T(K) − 273,15 = 300 − 273,15 ≈ 27 °C.`},
{id:'fi_cal11',t:'fi_cal',l:1,q:`In quale direzione passa spontaneamente il calore tra due corpi a contatto?`,o:[`Dal corpo a temperatura più alta a quello a temperatura più bassa`,`Dal corpo più freddo al più caldo`,`Dal corpo più grande al più piccolo`,`In entrambe le direzioni in modo uguale`],a:0,e:`Il calore fluisce spontaneamente dal caldo al freddo, finché le temperature si uguagliano (equilibrio termico).`},
{id:'fi_cal12',t:'fi_cal',l:1,q:`Qual è la temperatura di ebollizione dell'acqua a pressione atmosferica normale, espressa in kelvin?`,o:[`373,15 K`,`100 K`,`273,15 K`,`173,15 K`],a:0,e:`100 °C + 273,15 = 373,15 K.`},
{id:'fi_cal13',t:'fi_cal',l:2,q:`Quanto calore serve per scaldare 500 g di acqua da 20 °C a 40 °C? (c = 4186 J/(kg · K))`,o:[`41860 J (circa 42 kJ)`,`2093 J`,`4186 J`,`83 720 J`],a:0,e:`Q = m · c · ΔT = 0,5 kg · 4186 J/(kg · K) · 20 K = 41 860 J, cioè circa 42 kJ. Attenzione: la massa va espressa in kg.`},
{id:'fi_cal14',t:'fi_cal',l:2,q:`Il calore latente di vaporizzazione dell'acqua è 2260 kJ/kg. Quanto calore serve per far evaporare 0,5 kg di acqua già a 100 °C?`,o:[`1130 kJ`,`226 kJ`,`4520 kJ`,`2260 kJ`],a:0,e:`Q = m · λ = 0,5 kg · 2260 kJ/kg = 1130 kJ.`},
{id:'fi_cal15',t:'fi_cal',l:2,q:`Qual è la capacità termica di un blocco di rame di massa 2 kg (calore specifico 385 J/(kg · K))?`,o:[`770 J/K`,`192,5 J/K`,`385 J/K`,`1540 J/K`],a:0,e:`La capacità termica è C = m · c = 2 · 385 = 770 J/K: indica quanti joule servono per scaldare il blocco di 1 K.`},
{id:'fi_cal16',t:'fi_cal',l:2,q:`Perché un oggetto di metallo sembra più freddo al tatto di un oggetto di legno, entrambi a temperatura ambiente?`,o:[`Perché il metallo conduce meglio il calore e lo sottrae più in fretta alla mano`,`Perché il metallo ha una temperatura più bassa`,`Perché il legno produce calore`,`Perché il metallo ha più massa`],a:0,e:`I due oggetti hanno la stessa temperatura, ma il metallo ha conducibilità termica molto maggiore: il calore della mano passa rapidamente nel metallo e la sensazione è di freddo.`},
{id:'fi_cal17',t:'fi_cal',l:2,q:`Un sistema cede 100 J di calore all'ambiente e subisce un lavoro di 50 J (cioè l'ambiente compie 50 J di lavoro su di esso). Di quanto varia la sua energia interna?`,o:[`−50 J`,`−150 J`,`+150 J`,`+50 J`],a:0,e:`Con ΔU = Q − W, dove Q è il calore assorbito e W il lavoro compiuto dal sistema: Q = −100 J e W = −50 J, quindi ΔU = −100 − (−50) = −50 J.`},
{id:'fi_cal18',t:'fi_cal',l:2,q:`Si mescolano 2 kg di acqua a 90 °C con 3 kg di acqua a 40 °C, senza dispersioni. Quale temperatura finale si ottiene?`,o:[`60 °C`,`65 °C`,`50 °C`,`70 °C`],a:0,e:`Il calore ceduto è uguale a quello assorbito: 2 · (90 − T) = 3 · (T − 40), da cui 180 − 2T = 3T − 120 e T = 300 / 5 = 60 °C.`},
{id:'fi_cal19',t:'fi_cal',l:2,q:`Un gas ideale, con volume costante, viene scaldato fino a raddoppiare la sua temperatura assoluta. Che cosa accade alla pressione?`,o:[`Raddoppia`,`Si dimezza`,`Resta uguale`,`Diventa quattro volte più grande`],a:0,e:`A volume costante la pressione è proporzionale alla temperatura assoluta (legge di Gay-Lussac): p/T = costante.`},
{id:'fi_cal20',t:'fi_cal',l:3,q:`Quale pressione ha 2 mol di un gas ideale a 300 K in un volume di 0,05 m³? (R = 8,314 J/(mol · K))`,o:[`circa 1,0 × 10⁵ Pa`,`circa 1,0 × 10⁴ Pa`,`circa 8,3 × 10⁴ Pa`,`circa 1,0 × 10⁶ Pa`],a:0,e:`Dall'equazione di stato p = n · R · T / V = 2 · 8,314 · 300 / 0,05 ≈ 99800 Pa, cioè circa 1,0 × 10⁵ Pa.`},
{id:'fi_cal21',t:'fi_cal',l:3,q:`Qual è il rendimento massimo di una macchina termica che lavora tra due sorgenti a 600 K e 300 K?`,o:[`50%`,`100%`,`25%`,`75%`],a:0,e:`Il rendimento di Carnot è η = 1 − T_fredda / T_calda = 1 − 300/600 = 0,5, cioè 50%. Nessuna macchina reale può fare meglio.`},
{id:'fi_cal22',t:'fi_cal',l:3,q:`In una trasformazione isoterma di un gas ideale, quanto vale la variazione di energia interna?`,o:[`Zero`,`Positiva`,`Negativa`,`Uguale al lavoro compiuto`],a:0,e:`Per un gas ideale l'energia interna dipende solo dalla temperatura: se T non cambia, ΔU = 0. Per il primo principio il calore assorbito è allora uguale al lavoro compiuto dal gas.`},
{id:'fi_cal23',t:'fi_cal',l:3,q:`Una sbarra di 2 m di lunghezza, con coefficiente di dilatazione lineare 1,2 × 10⁻⁵ K⁻¹, viene scaldata di 50 K. Di quanto si allunga?`,o:[`1,2 mm`,`12 mm`,`0,12 mm`,`1,2 m`],a:0,e:`ΔL = α · L₀ · ΔT = 1,2 × 10⁻⁵ · 2 · 50 = 1,2 × 10⁻³ m = 1,2 mm.`},
{id:'fi_cal24',t:'fi_cal',l:3,q:`Quanto calore serve per fondere 2 kg di ghiaccio a 0 °C e portare l'acqua ottenuta a 10 °C? (λ = 334 kJ/kg, c = 4,186 kJ/(kg · K))`,o:[`circa 752 kJ`,`circa 668 kJ`,`circa 84 kJ`,`circa 1500 kJ`],a:0,e:`Fusione: 2 · 334 = 668 kJ. Riscaldamento dell'acqua: 2 · 4,186 · 10 ≈ 83,7 kJ. Totale ≈ 751,7 kJ, cioè circa 752 kJ.`},
{id:'fi_cal25',t:'fi_cal',l:3,q:`Un gas ideale occupa 2 L a 300 K. A pressione costante viene scaldato fino a 450 K. Quale volume occupa?`,o:[`3 L`,`1,3 L`,`0,9 L`,`4 L`],a:0,e:`A pressione costante V/T è costante (legge di Charles): V₂ = V₁ · T₂/T₁ = 2 · 450 / 300 = 3 L. La temperatura va sempre espressa in kelvin.`},
{id:'ch_atomo_sf1',t:'ch_atomo',l:4,q:`Il boro naturale è una miscela di due isotopi stabili, ¹⁰B e ¹¹B (masse atomiche approssimate 10 e 11), e la sua massa atomica media è 10,8. Qual è la percentuale approssimata di ¹⁰B nel boro naturale?`,o:[`20%`,`80%`,`10,8%`,`50%`],a:0,e:`Se x è la frazione di ¹⁰B: 10x + 11(1 − x) = 10,8, cioè 11 − x = 10,8, quindi x = 0,2 = 20%. L'80% è la percentuale di ¹¹B (il valore 10,8 è molto vicino a 11, quindi l'isotopo pesante prevale); 50% darebbe una media di 10,5; 10,8% confonde la massa media con una percentuale.`},
{id:'ch_atomo_sf2',t:'ch_atomo',l:4,q:`Lo iodio radioattivo ¹³¹I (Z = 53) viene captato dalla tiroide esattamente come lo iodio stabile ¹²⁷I. Quale affermazione ne spiega il motivo?`,o:[`Sono isotopi: hanno lo stesso Z e la stessa configurazione elettronica, ma diverso numero di neutroni`,`Sono isotopi: hanno lo stesso numero di neutroni, ma diverso numero di protoni ed elettroni`,`Sono isobari: hanno lo stesso numero di massa, ma diversa configurazione elettronica esterna`,`Sono ioni dello stesso elemento: hanno lo stesso numero di protoni, ma diverso numero di elettroni`],a:0,e:`Entrambi hanno Z = 53 e quindi 53 protoni e 53 elettroni nell'atomo neutro: la configurazione elettronica, che determina il comportamento chimico, è identica. Differiscono solo per i neutroni (78 per ¹³¹I e 74 per ¹²⁷I), perciò il numero di massa è diverso (non sono isobari) e il numero di protoni è lo stesso (non cambia Z).`},
{id:'ch_atomo_sf3',t:'ch_atomo',l:4,q:`Lo iodio radioattivo ¹³¹I, usato in medicina nucleare, ha un tempo di dimezzamento di circa 8 giorni. Trascurando l'eliminazione biologica, quale frazione di una dose iniziale è ancora presente (non decaduta) dopo 24 giorni?`,o:[`1/8 (12,5%)`,`1/3 (circa 33%)`,`1/4 (25%)`,`1/16 (6,25%)`],a:0,e:`24 giorni corrispondono a 24 / 8 = 3 tempi di dimezzamento. Ogni dimezzamento riduce a metà la quantità: 1 → 1/2 → 1/4 → 1/8 = 12,5%. 1/3 deriverebbe dall'errore di dividere linearmente per 3; 1/4 e 1/16 corrispondono a 2 e 4 emivite.`},
{id:'ch_atomo_sf4',t:'ch_atomo',l:4,q:`Le prime quattro energie di ionizzazione successive di un elemento sono, in MJ/mol: 0,74 – 1,45 – 7,7 – 10,5. A quale gruppo della tavola periodica appartiene l'elemento?`,o:[`Gruppo 2`,`Gruppo 1`,`Gruppo 13`,`Gruppo 14`],a:0,e:`L'energia aumenta di poco passando dal 1° al 2° elettrone (0,74 → 1,45) ma balza da 1,45 a 7,7 al 3°: dopo aver tolto due elettroni si attacca il guscio interno, molto più stabile. L'elemento ha quindi 2 elettroni di valenza, cioè è del gruppo 2 (i valori sono quelli del magnesio). Gruppo 1 darebbe un salto già dopo il primo elettrone; i gruppi 13 e 14 dopo il terzo e il quarto.`},
{id:'ch_atomo_sf5',t:'ch_atomo',l:4,q:`Lo zinco (Z = 30, atomo neutro [Ar] 3d¹⁰ 4s²) è un cofattore di molti enzimi, in cui si trova come ione Zn²⁺. Qual è la configurazione elettronica di Zn²⁺?`,o:[`[Ar] 3d¹⁰`,`[Ar] 3d⁸ 4s²`,`[Ar] 3d¹⁰ 4s²`,`[Ar] 3d⁹ 4s¹`],a:0,e:`Nella ionizzazione degli elementi di transizione si perdono per primi gli elettroni 4s, che sono quelli più esterni. Dall'atomo [Ar] 3d¹⁰ 4s² togliendo 2 elettroni si ottiene [Ar] 3d¹⁰, con sottolivello d completo e nessun elettrone spaiato. [Ar] 3d¹⁰ 4s² è l'atomo neutro; [Ar] 3d⁸ 4s² (come il nichel) e [Ar] 3d⁹ 4s¹ hanno 28 elettroni ma implicano la perdita di elettroni 3d invece dei 4s.`},
{id:'ch_atomo_sf6',t:'ch_atomo',l:4,q:`Nell'emoglobina il ferro si trova come Fe²⁺. Sapendo che l'atomo neutro di ferro (Z = 26) ha configurazione [Ar] 3d⁶ 4s², quanti elettroni spaiati ha lo ione libero Fe²⁺ nello stato fondamentale (regola di Hund)?`,o:[`4`,`2`,`5`,`6`],a:0,e:`Fe²⁺ perde i due elettroni 4s e diventa [Ar] 3d⁶. I cinque orbitali d si riempiono prima con un elettrone ciascuno a spin parallelo (5 spaiati) e il sesto elettrone si appaia in uno di essi: restano 4 elettroni spaiati. 5 sono quelli di Fe³⁺ (3d⁵), 6 è il numero di elettroni d, non di quelli spaiati.`},
{id:'ch_atomo_sf7',t:'ch_atomo',l:4,q:`Nelle cellule le concentrazioni di Na⁺ e K⁺ sono regolate dalla pompa Na⁺/K⁺. Quale ordine di raggio crescente è corretto per Na⁺, Na e K (Z: Na = 11, K = 19)?`,o:[`Na⁺ < Na < K`,`Na < Na⁺ < K`,`Na⁺ < K < Na`,`K < Na⁺ < Na`],a:0,e:`Un catione è più piccolo dell'atomo neutro: Na perdendo un elettrone perde l'intero terzo livello (resta 1s² 2s² 2p⁶) e aumenta la carica nucleare efficace sugli elettroni rimasti. K, nello stesso gruppo ma un periodo più sotto, ha un livello in più di Na. L'ordine è Na⁺ < Na < K.`},
{id:'ch_atomo_sf8',t:'ch_atomo',l:4,q:`Il magnesio naturale è una miscela di tre isotopi: ²⁴Mg (79%), ²⁵Mg (10%) e ²⁶Mg (11%). Quale valore approssimato ha la massa atomica media?`,o:[`24,3`,`25,0`,`24,0`,`24,8`],a:0,e:`Media pesata: 24 × 0,79 + 25 × 0,10 + 26 × 0,11 = 18,96 + 2,50 + 2,86 = 24,32, cioè circa 24,3. 25,0 sarebbe la media semplice dei tre numeri di massa, senza tener conto delle abbondanze; 24,0 considera solo l'isotopo più abbondante.`},
{id:'ch_atomo_sf9',t:'ch_atomo',l:4,q:`I metalli di transizione come Fe, Zn e Cu, essenziali in molti enzimi, hanno elettroni nel sottolivello 3d. Quanti orbitali ha il sottolivello 3d e quanti elettroni può contenere al massimo?`,o:[`5 orbitali, 10 elettroni`,`3 orbitali, 6 elettroni`,`5 orbitali, 5 elettroni`,`7 orbitali, 14 elettroni`],a:0,e:`Per un sottolivello con l = 2 (d) i valori di m sono −2, −1, 0, +1, +2: sono 5 orbitali. Ogni orbitale ospita al massimo 2 elettroni con spin opposto, quindi 5 × 2 = 10 elettroni. 3 orbitali e 6 elettroni sono quelli del sottolivello p; 7 e 14 quelli del sottolivello f; 5 elettroni dimenticherebbe lo spin.`},
{id:'ch_atomo_sf10',t:'ch_atomo',l:4,q:`In una lampada a idrogeno gli atomi eccitati emettono luce a due lunghezze d'onda diverse, una per la transizione elettronica n = 3 → n = 2 e una per n = 2 → n = 1. Quale affermazione è corretta?`,o:[`La transizione 2 → 1 emette fotoni più energetici e di lunghezza d'onda minore`,`La transizione 2 → 1 emette fotoni più energetici e di lunghezza d'onda maggiore`,`La transizione 3 → 2 emette fotoni più energetici perché parte da un livello più alto`,`Le due transizioni emettono fotoni con la stessa energia, perché il salto è di un livello`],a:0,e:`L'energia del fotone è la differenza tra i livelli: per 2 → 1 vale circa 13,6 × (1 − 1/4) = 10,2 eV, per 3 → 2 circa 13,6 × (1/4 − 1/9) = 1,9 eV. Poiché E = hc/λ, a energia maggiore corrisponde lunghezza d'onda minore. Conta la differenza tra i livelli, non il livello di partenza, e i livelli non sono equidistanti.`},
{id:'ch_legami_sf1',t:'ch_legami',l:4,q:`La glicina, il più semplice amminoacido, ha formula H₂N–CH₂–COOH (con un doppio legame C=O; tutti gli altri legami sono semplici). Quanti legami σ e π contiene la molecola?`,o:[`9 legami σ e 1 legame π`,`10 legami σ e 1 legame π`,`8 legami σ e 2 legami π`,`9 legami σ e 2 legami π`],a:0,e:`La molecola ha 10 atomi (N, 5 H, 2 C, 2 O) e non contiene anelli, quindi ha 10 − 1 = 9 legami σ (2 N–H, N–C, 2 C–H, C–C, C–O, O–H e il σ del C=O, cioè uno dei due legami del doppio legame): 9 in tutto. Il doppio legame C=O aggiunge un solo legame π, per cui π = 1. Contare il doppio legame come due σ porta a risposte errate.`},
{id:'ch_legami_sf2',t:'ch_legami',l:4,q:`Quale di queste specie attraversa più facilmente, per semplice diffusione, il doppio strato fosfolipidico di una membrana cellulare, la cui parte interna è idrofobica?`,o:[`O₂ (molecola piccola e apolare)`,`Na⁺ (ione con carica e guscio di idratazione)`,`Glucosio (molecola grande e molto polare)`,`HPO₄²⁻ (ione con doppia carica)`],a:0,e:`Il nucleo della membrana è formato da code idrocarburiche apolari: possono attraversarlo facilmente le molecole piccole e apolari come O₂. Ioni (Na⁺, HPO₄²⁻) e molecole molto polari come il glucosio sono circondati da molecole d'acqua tramite interazioni ione-dipolo o legami a idrogeno e non entrano nell'interno idrofobico: richiedono canali o trasportatori.`},
{id:'ch_legami_sf3',t:'ch_legami',l:4,q:`Si vogliono ordinare le molecole H₂O, NH₃ e CH₄ in base all'angolo di legame H–X–H. Qual è l'ordine crescente corretto?`,o:[`H₂O < NH₃ < CH₄`,`CH₄ < NH₃ < H₂O`,`NH₃ < H₂O < CH₄`,`H₂O < CH₄ < NH₃`],a:0,e:`In tutte e tre le molecole l'atomo centrale ha quattro coppie di elettroni disposte circa a tetraedro (109,5°). Le coppie solitarie respingono più di quelle di legame e comprimono gli angoli: H₂O ha 2 coppie solitarie (circa 104,5°), NH₃ ne ha 1 (circa 107°), CH₄ nessuna (109,5°). Più coppie solitarie, angolo più piccolo.`},
{id:'ch_legami_sf4',t:'ch_legami',l:4,q:`Gli atomi del gruppo –CO–NH– del legame peptidico giacciono sullo stesso piano e la rotazione attorno al legame C–N è fortemente impedita. Qual è la ragione?`,o:[`Per risonanza il legame C–N ha carattere parziale di doppio legame`,`Il legame C–N è un legame ionico tra un atomo di C e uno di N`,`L'azoto è ibridato sp³ e forma con il carbonio un legame σ rigido`,`Tra C e N si forma un legame a idrogeno intramolecolare di tipo rigido`],a:0,e:`La coppia solitaria dell'azoto è delocalizzata verso il carbonile (C=O): le due forme di risonanza conferiscono al legame C–N un carattere parziale di doppio legame, con rotazione ostacolata e geometria planare dell'azoto e degli atomi vicini. Non è un legame ionico (C e N condividono elettroni) e un azoto sp³ sarebbe piramidale, con rotazione libera.`},
{id:'ch_legami_sf5',t:'ch_legami',l:4,q:`Propano (CH₃CH₂CH₃), dimetiletere (CH₃OCH₃) ed etanolo (CH₃CH₂OH) hanno massa molecolare molto simile (44-46 u). Qual è l'ordine di punto di ebollizione crescente?`,o:[`propano < dimetiletere < etanolo`,`dimetiletere < propano < etanolo`,`etanolo < dimetiletere < propano`,`propano < etanolo < dimetiletere`],a:0,e:`A parità di massa contano le forze intermolecolari. Il propano è apolare e ha solo forze di London (bolle a circa −42 °C); il dimetiletere è polare e ha interazioni dipolo-dipolo ma non ha H legato a O (circa −24 °C); l'etanolo forma legami a idrogeno tramite il gruppo –OH (circa +78 °C).`},
{id:'ch_legami_sf6',t:'ch_legami',l:4,q:`La vitamina C (acido ascorbico, con quattro gruppi –OH) è idrosolubile, mentre la vitamina A (retinolo, con lunga catena idrocarburica e un solo –OH) è liposolubile. Quale spiegazione è corretta?`,o:[`I –OH della vitamina C formano legami a idrogeno con l'acqua; la catena apolare della A interagisce con i lipidi`,`La solubilità dipende solo dalla massa molecolare: la molecola più piccola, cioè la vitamina C, si scioglie in acqua`,`La vitamina A forma più legami a idrogeno con l'acqua perché ha una lunga catena idrocarburica ramificata`,`La vitamina C ha legami covalenti interni più forti e proprio per questo si scioglie bene in acqua`],a:0,e:`Vale la regola simile scioglie simile: i quattro gruppi –OH polari dell'acido ascorbico formano legami a idrogeno con l'acqua, mentre la lunga catena idrocarburica del retinolo è apolare e interagisce con i lipidi tramite forze di London. Massa molecolare e forza dei legami covalenti interni non determinano la solubilità; la catena lunga rende la A meno, non più, idrofila.`},
{id:'ch_legami_sf7',t:'ch_legami',l:4,q:`Il cloruro di sodio fonde a circa 800 °C, l'ossido di magnesio (MgO) a circa 2850 °C. Qual è la ragione principale di questa differenza?`,o:[`In MgO gli ioni hanno carica doppia (Mg²⁺ e O²⁻): l'attrazione nel reticolo è molto maggiore`,`In MgO gli atomi condividono coppie di elettroni formando un reticolo covalente tridimensionale`,`MgO è un solido molecolare in cui le molecole sono tenute insieme da legami a idrogeno`,`Il magnesio ha massa atomica maggiore del sodio, quindi servono temperature molto più alte per fonderlo`],a:0,e:`Entrambi sono solidi ionici. La forza di attrazione tra gli ioni cresce con il prodotto delle cariche (legge di Coulomb): in NaCl è (+1)(−1), in MgO è (+2)(−2), cioè quattro volte maggiore, con ioni anche piuttosto piccoli. Per questo il reticolo di MgO richiede molta più energia per essere distrutto. MgO non è né covalente né molecolare.`},
