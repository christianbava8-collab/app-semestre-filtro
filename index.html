 sum:["**Lavoro** L = F·s = F·s·cos α (prodotto scalare, grandezza scalare). Si misura in joule: 1 J = 1 N·m = 10⁷ erg.","Il lavoro è positivo se α < 90°, negativo se α > 90°, **nullo** se F = 0, s = 0 o F ⊥ s (es. forza centripeta, peso su un piano orizzontale). È massimo per α = 0°.","**Potenza** P = L/Δt = F·v, in watt (W = J/s). Il **kilowattora** è un lavoro (energia): 1 kWh = 3,6·10⁶ J. 1 CV ≈ 735,5 W; 1 hp ≈ 745,7 W.","**Energia cinetica** Ec = ½mv². **Teorema dell'energia cinetica**: il lavoro della forza è uguale alla variazione di energia cinetica.","**Campo conservativo**: il lavoro delle forze del campo non dipende dal cammino ma solo da posizione iniziale e finale; su un percorso chiuso è nullo. Solo lì si definisce l'**energia potenziale**.","Energia potenziale gravitazionale Ep = m·g·h; elastica Ep = ½kx². Il lavoro delle forze del campo è −ΔEp.","**Conservazione dell'energia meccanica**: con sole forze conservative ½mv² + mgh = costante. L'attrito è non conservativo: l'energia meccanica non si conserva (diventa per esempio energia termica).","Scivolando senza attrito da un'altezza h: v = √(2gh), indipendente da massa e inclinazione. Il pendolo risale alla stessa altezza da cui è partito.","**Urti**: la quantità di moto si conserva **sempre**; l'energia cinetica si conserva solo negli urti **elastici**. Urto perfettamente anelastico: i corpi restano uniti, v' = (m₁v₁ + m₂v₂)/(m₁ + m₂)."],
 ex:[{"t":"Lavoro con angolo","d":"F = 10 N, s = 2 m: con 30° L = 20 · cos 30° ≈ 17,3 J (10√3 J); con 150° il lavoro è negativo, −10√3 J."},{"t":"Centrale elettrica","d":"Un milione di alloggi da 1 kW ciascuno: 10⁶ · 10³ W = 10⁹ W = 1 GW."},{"t":"Energia cinetica di un grave","d":"1 g lasciato cadere da 2 m: Ec = mgh = 10⁻³ · 9,8 · 2 = 0,0196 J."}],
 map:{"centro":"Lavoro ed energia","rami":[{"t":"Lavoro","figli":["L = F·s·cos α","Joule"]},{"t":"Potenza","figli":["P = L/t = F·v","Watt, kWh"]},{"t":"Energia meccanica","figli":["Cinetica ½mv²","Potenziale mgh, ½kx²"]},{"t":"Conservazione","figli":["Forze conservative","Urti"]}]}},
fl5:{
 sum:["Tre stati: **aeriforme** (né forma né volume propri), **liquido** (volume proprio, forma del recipiente), **solido** (forma e volume propri). Un fluido è perfetto se ha viscosità nulla.","Liquido perfetto: incomprimibile e non viscoso. Gas perfetto: comprimibile, perfettamente elastico, non viscoso. Il **gas** non si liquefa per compressione, il **vapore** sì.","Funzioni di stato: **estensive** (volume, numero di moli: additive) e **intensive** (temperatura, pressione: non additive).","**Pressione** P = F⊥/S, in pascal. 1 atm = 760 mmHg = 1,01325 bar = 101325 Pa ≈ 10⁵ Pa; 1 Pa = 10 barie. Volume: 1 L = 1 dm³ = 10⁻³ m³.","Scale termometriche: T(K) = t(°C) + 273,15; T(°F) = 9/5·t(°C) + 32. Il grado Celsius e il kelvin hanno la **stessa ampiezza**. Non esistono temperature kelvin negative.","**Dilatazione**: V = V₀(1 + k·t); lineare L = L₀(1 + γ·t). Per i gas k = 1/273 °C⁻¹ uguale per tutti. L'acqua passando da ghiaccio a liquido diminuisce di volume.","**Passaggi di stato**: fusione, vaporizzazione, sublimazione assorbono energia; solidificazione, liquefazione (condensazione), brinamento la cedono. Durante il passaggio la temperatura resta costante. **Q = m·λ**; per l'acqua λ fusione = 79,7 cal/g, λ evaporazione = 540 cal/g.","Gas perfetti: **Boyle** PV = cost (T cost.), **Charles** V = V₀(1+αt) (P cost.), **Gay-Lussac** P = P₀(1+αt) (V cost.). **PV = nRT** con T in kelvin, R ≈ 8,31 J/(mol·K) = 0,082 L·atm/(mol·K).","**Avogadro**: volumi uguali di gas diversi, a pari P e T, contengono lo stesso numero di molecole; a 0 °C e 1 atm una mole occupa 22,4 L. **Dalton**: pressione totale = somma delle pressioni parziali (Pᵢ = P·nᵢ/n).","**Teoria cinetica**: la pressione nasce dagli urti delle molecole sulle pareti; l'energia cinetica media è ½mv² = 3/2·k·T (k = 1,38·10⁻²³ J/K). A pari T le molecole più leggere sono più veloci.","**Gas reali**: equazione di Van der Waals. Sopra la **temperatura critica** non si liquefanno per sola compressione (acqua 374 °C). Si comportano da gas perfetti ad alte T e basse P.","Ebollizione: quando la **tensione di vapore** uguaglia la pressione esterna. In montagna l'acqua bolle sotto i 100 °C, in pentola a pressione sopra. L'evaporazione avviene a ogni temperatura, solo in superficie.","**Tensione superficiale**: lo strato superficiale si comporta come una pellicola elastica. **Capillarità**: il dislivello h è inversamente proporzionale al raggio del capillare (Jurin-Borelli).","Solidi: covalenti (diamante, durissimi), ionici (NaCl, duri ma fragili), molecolari (teneri, bassa T di fusione), metallici (conduttori, malleabili). Il vetro è un solido amorfo.","**Sforzo** σ = F/S (Pa); **deformazione** ε = ΔL/L₀ (adimensionale). **Hooke**: σ = E·ε, con E modulo di Young (osso 15–20 GPa; tendini 0,5–1,5 GPa). Taglio: τ = G·Δθ."],
 ex:[{"t":"Il binario","d":"Ferro lungo 5 m, γ = 12·10⁻⁶ °C⁻¹, ΔT = 50 °C: ΔL = 5 · 12·10⁻⁶ · 50 = 3 mm. Per questo i binari hanno interruzioni periodiche."},{"t":"Fondere 1 kg di ghiaccio","d":"Q = m·λ = 1000 g · 79,7 cal/g = 79.700 cal."},{"t":"Recipiente chiuso riscaldato","d":"n, R e V costanti: P/T = costante. Se T (in kelvin) raddoppia, anche la pressione raddoppia."}],
 map:{"centro":"Stati di aggregazione","rami":[{"t":"Funzioni di stato","figli":["Pressione","Volume","Temperatura"]},{"t":"Passaggi di stato","figli":["Calore latente","T costante"]},{"t":"Gas","figli":["PV = nRT","Teoria cinetica","Gas reali"]},{"t":"Liquidi","figli":["Ebollizione","Tensione superficiale","Capillarità"]},{"t":"Solidi","figli":["Tipi di solidi","Sforzo e Hooke"]}]}},
fl6:{
 sum:["**Pascal**: in un fluido in quiete (trascurando la gravità) la pressione si trasmette uguale in tutti i punti e in tutte le direzioni; le forze di pressione sono perpendicolari alle superfici.","Forze **superficiali** (es. il pistone) e forze **di volume** (es. il peso). **Lavoro di pressione** L = P·ΔV (es. lavoro del cuore = pressione × gittata sistolica).","**Laplace**: per una sfera sottile ΔP = 2T/r (alveolo, vescica), per un cilindro sottile ΔP = T/r (vasi). Se il raggio di un vaso aumenta, aumenta la tensione sulla parete (aneurisma).","**Stevino**: P = ρ·g·h, la pressione cresce con la profondità; in acqua aumenta di circa 1 atm ogni 10 m. Non dipende dalla forma del recipiente (**vasi comunicanti**: il liquido raggiunge la stessa altezza).","**Archimede**: un corpo immerso riceve una spinta verso l'alto pari al peso del fluido spostato. Galleggia se la sua densità è minore di quella del fluido; equilibrio: ρf·Vimmerso = ρc·Vcorpo.","La spinta si applica al **centro di spinta** (baricentro del fluido spostato). Equilibrio stabile se il baricentro del corpo è sotto il centro di spinta.","**Regime stazionario**: in ogni punto velocità, pressione e densità non cambiano nel tempo. **Torricelli**: velocità di efflusso v = √(2gh).","**Continuità**: S₁v₁ = S₂v₂ (fluido incomprimibile): dove il condotto si restringe il fluido accelera. Portata volumica Q = S·v.","**Bernoulli**: P + ρgh + ½ρv² = costante. **Venturi**: se la sezione diminuisce, la velocità aumenta e la pressione diminuisce.","**Viscosità** = attrito interno (unità: Pa·s, poiseuille). **Stokes**: F = 6πηrv. Un corpo che cade in un fluido raggiunge una velocità limite. Perdita di carico: la pressione cala lungo il condotto.","**Reynolds** Re = ρvd/η (adimensionale): laminare < 2000, transizione 2000–4000, turbolento > 4000. **Poiseuille**: Q = πΔP r⁴/(8ηL): la portata dipende dalla quarta potenza del raggio.","Sangue: plasma (≈90% acqua) + parte corpuscolare (globuli rossi, bianchi, piastrine). **Ematocrito** ≈ volume dei globuli rossi / volume totale. **VES** normale 0–20 mm/h.","Cuore: 2 atri e 2 ventricoli, 4 valvole. Lavoro per battito ≈ 120 mmHg (1,6·10⁴ Pa) × 70 mL ≈ 1,1 J; potenza totale a riposo 1,5–2,5 W. FC massima (Astrand): uomini 220 − età, donne 226 − età."],
 ex:[{"t":"Il sub a 10 m","d":"P idrostatica = ρgh = 1000 · 9,8 · 10 ≈ 10⁵ Pa ≈ 1 atm; con l'atmosfera sopra, il sub sente circa 2 atm."},{"t":"Il corpo che galleggia","d":"Volume 300 dm³, ne emergono 60 dm³: è immerso per 8/10, quindi la sua densità è 0,8 volte quella dell'acqua."},{"t":"Reynolds in un'arteria","d":"ρ = 1050 kg/m³, v = 0,5 m/s, d = 4 mm, η = 4·10⁻³ Pa·s: Re = 1050 · 0,5 · 0,004 / 0,004 = 525, flusso laminare."}],
 map:{"centro":"Meccanica dei fluidi","rami":[{"t":"Idrostatica","figli":["Pascal","Stevino","Archimede"]},{"t":"Fluidodinamica","figli":["Continuità","Bernoulli e Venturi","Torricelli"]},{"t":"Fluidi reali","figli":["Stokes","Reynolds","Poiseuille"]},{"t":"Biologia","figli":["Sangue e VES","Lavoro del cuore"]}]}},
fl7:{
 sum:["Il **calore** è energia scambiata tra corpi a temperature diverse; non è una funzione di stato. Si misura in joule; **1 cal = 4,186 J** (equivalente meccanico della caloria, esperienza di Joule). 1 kcal = 1 Cal = 1000 cal.","Trasmissione: **conduzione** (tipica dei solidi, senza spostamento di materia), **convezione** (tipica dei fluidi, con spostamento di materia), **irraggiamento** (onde elettromagnetiche, anche nel vuoto: il calore del Sole).","**Capacità termica** C = Q/ΔT (J/K). **Calore specifico** c = Q/(m·ΔT) (J/kg·K). **Q = c·m·ΔT**. Acqua: 1 cal/g·°C = 4186 J/kg·K; ghiaccio 0,5 cal/g·°C. Nei gas: cp − cv = R (Mayer).","**Equilibrio termico** (sistema isolato): calore ceduto = calore assorbito. Stessa sostanza: Te = (m₁T₁ + m₂T₂)/(m₁ + m₂).","Sistemi **isolati** (né materia né energia), **chiusi** (solo energia), **aperti** (materia ed energia). Convenzioni: Q > 0 se assorbito; L > 0 se compiuto dal sistema (espansione).","Piano PV: **isoterma** (T cost., iperbole), **isobara** (P cost., retta orizzontale), **isocora** (V cost., retta verticale), **adiabatica** (Q = 0, curva più ripida dell'isoterma).","**Primo principio**: ΔU = Q − L. U è funzione di stato (nei gas perfetti dipende solo da T); Q e L no. Isoterma: Q = L. Isocora: ΔU = Q. Adiabatica: ΔU = −L. Isobara: L = P·ΔV.","**Rendimento** η = L/Qc = 1 − Qf/Qc < 1. **Carnot** (2 isoterme + 2 adiabatiche): η = 1 − Tf/Tc con T in kelvin, il massimo possibile. Il lavoro è l'area del ciclo. Il frigorifero percorre il ciclo al contrario.","Trasformazioni **reversibili**: successione di stati di equilibrio, percorribili nei due versi; quelle reali (con attriti) sono irreversibili. **Entropia**: ΔS = Q/T (reversibile); S = k·ln W misura il disordine.","**Secondo principio** (enunciati equivalenti): Kelvin (non si trasforma integralmente in lavoro il calore di una sola sorgente), Clausius (il calore passa spontaneamente dal caldo al freddo), entropia (in un sistema isolato le trasformazioni spontanee aumentano l'entropia). Impossibili i moti perpetui di 1ª e 2ª specie.","**Entalpia** H = U + PV: a pressione costante ΔH = calore scambiato; ΔH < 0 esotermica, ΔH > 0 endotermica. **Gibbs** G = H − TS: ΔG < 0 spontanea, ΔG > 0 non spontanea, ΔG = 0 equilibrio.","Metabolismo basale adulto ≈ 1 kcal/(kg·h). Energia dei nutrienti: carboidrati e proteine ≈ 4 kcal/g, grassi ≈ 9 kcal/g. Rendimento del corpo umano 20–25%."],
 ex:[{"t":"Mescolare acqua","d":"200 g a 20 °C + 500 g a 80 °C: Te = (200·20 + 500·80)/700 ≈ 62,9 °C."},{"t":"Carnot al 20%","d":"Tf = 27 °C = 300 K, η = 0,2: Tc = Tf/(1 − η) = 300/0,8 = 375 K = 102 °C."},{"t":"Metabolismo basale","d":"Uomo di 80 kg: 1 kcal/(kg·h) · 80 kg · 24 h = 1920 kcal ≈ 8·10⁶ J al giorno, cioè circa 93 W."}],
 map:{"centro":"Termodinamica","rami":[{"t":"Calore","figli":["1 cal = 4,186 J","Conduzione, convezione, irraggiamento"]},{"t":"Calorimetria","figli":["Q = c·m·ΔT","Equilibrio termico"]},{"t":"Principi","figli":["ΔU = Q − L","Secondo principio, entropia"]},{"t":"Macchine","figli":["Rendimento","Ciclo di Carnot"]},{"t":"Chimica e biologia","figli":["Entalpia, Gibbs","Metabolismo"]}]}},
fl8:{
 sum:["Cariche di segno opposto si attraggono, dello stesso segno si respingono. La carica si misura in **coulomb** (non è grandezza fondamentale del SI: [Q] = [i][T]). **Conduttori** (cariche libere, es. metalli) e **isolanti/dielettrici** (vuoto, aria, ceramica, carta, acqua distillata).","**Coulomb**: F = K₀·Q₁Q₂/r², K₀ = 1/(4πε₀) = 9·10⁹ N·m²/C². Raddoppiando la distanza la forza diventa ¼.","In un mezzo F = Q₁Q₂/(4πε₀εᵣr²): la **costante dielettrica relativa** εᵣ ≥ 1 (adimensionale) riduce la forza per polarizzazione. Acqua εᵣ = 81, aria ≈ 1,0006, vuoto 1.","Rispetto alla gravità: la forza elettrica dipende dal mezzo, può essere repulsiva ed è molto più intensa (nell'atomo di idrogeno circa 10³⁹ volte).","**Campo elettrico** E = F/q (N/C = V/m); da una carica puntiforme E = K₀Q/r², non dipende dalla carica esploratrice. Vale la **sovrapposizione**. Le linee di forza escono dalle cariche positive ed entrano nelle negative.","Su una carica negativa la forza è opposta al campo. Una carica libera **non** segue in generale le linee di forza curve.","**Energia potenziale** Ep = K₀Qq/r (J): lavoro contro il campo per portare q dall'infinito. **Potenziale** V = Ep/q = K₀Q/r (volt, scalare). **Lavoro del campo** da A a B: L = q(V_A − V_B).","**Superfici equipotenziali**: perpendicolari alle linee di campo; spostarsi su di esse non richiede lavoro. E = ΔV/Δs, diretto dai potenziali alti ai bassi; tra due piastre E = ΔV/d (uniforme).","**Gauss**: flusso Φ = Q/ε₀. Nei conduttori in equilibrio la carica sta sulla superficie, il campo interno è nullo, tutti i punti hanno lo stesso potenziale; la carica si concentra sulle punte.","**Capacità** C = Q/V, in **farad** (F = C/V). Condensatore piano C = ε·S/d, campo interno uniforme E = ΔV/d. Lavoro di carica L = ½Q·ΔV = ½C·ΔV². ε si misura in F/m.","**Elettronvolt**: 1 eV = 1,6·10⁻¹⁹ J. La carica è **quantizzata** (multiplo di e = 1,6·10⁻¹⁹ C), si **conserva** in un sistema isolato ed è uno **scalare**.","**Pacemaker**: generatore (batteria + circuito) ed elettrocateteri; impulsi di 2–5 V, pochi µA, circa 0,5 ms. Interviene se il nodo senoatriale (atrio destro) non funziona bene, per esempio nelle bradicardie."],
 ex:[{"t":"Coulomb e distanza","d":"Due cariche a 1 m si attraggono con 1 N; a 2 m la forza diventa 1/4 N."},{"t":"Due cariche uguali","d":"Nel punto medio tra due cariche positive uguali il campo è nullo (i due campi si annullano), ma il potenziale è 2K₀Q/d (gli scalari si sommano)."},{"t":"Lavoro del campo","d":"+8 C da 6 V a 2 V: L = q(V_A − V_B) = 8 · 4 = +32 J."}],
 map:{"centro":"Elettrostatica","rami":[{"t":"Cariche","figli":["Coulomb","Quantizzazione e conservazione"]},{"t":"Campo elettrico","figli":["E = F/q","Linee di forza"]},{"t":"Potenziale","figli":["V = K₀Q/r","Equipotenziali"]},{"t":"Conduttori","figli":["Gauss","Capacità e condensatori"]}]}},
fl9:{
 sum:["Corrente = moto ordinato di cariche dovuto a una d.d.p. Nei metalli si muovono gli **elettroni**, in verso opposto al campo; nei liquidi e nei gas anche gli ioni. Per convenzione il **verso della corrente** è quello delle cariche positive.","**Intensità di corrente** i = ΔQ/Δt, in **ampere** (1 A = 1 C/s): è una grandezza fondamentale del SI ed è scalare. Corrente **continua** (intensità e verso costanti) o **alternata** (verso che si inverte periodicamente).","**1ª legge di Ohm**: ΔV = R·i (resistenza in ohm, Ω = V/A). **2ª legge**: R = ρ·l/S (ρ resistività, Ω·m; conducibilità = 1/ρ).","Nei metalli la resistenza **aumenta** con la temperatura; nei **semiconduttori diminuisce**. Sotto la temperatura critica i **superconduttori** hanno resistenza quasi nulla.","Resistività crescente: argento, rame, alluminio… (conduttori); germanio, silicio… (semiconduttori); mica, vetro, quarzo, porcellana, ambra, paraffina (isolanti).","**Effetto Joule**: energia dissipata E = R·i²·Δt = ΔV·i·Δt; potenza **P = R·i² = ΔV·i = ΔV²/R**. In calorie: Q = R·i²·Δt / 4,186.","**Forza elettromotrice**: lavoro del generatore per unità di carica (volt); coincide con la d.d.p. ai capi a **circuito aperto**. Con resistenza interna r: f.e.m. = (R + r)·i = ΔV + r·i.","**Amperometro** in **serie** (misura la corrente); **voltmetro** in **parallelo** (misura la d.d.p.).","Resistenze in **serie**: Req = R₁ + R₂ (maggiore di ciascuna). In **parallelo**: 1/Req = 1/R₁ + 1/R₂ (minore di ciascuna).","Condensatori: al contrario. In **parallelo** Ceq = C₁ + C₂; in **serie** 1/Ceq = 1/C₁ + 1/C₂.","In serie gli elementi hanno la **stessa corrente**; in parallelo la **stessa d.d.p.** **Kirchhoff**: 1) in ogni nodo correnti entranti = uscenti; 2) in ogni maglia la somma delle f.e.m. = somma delle d.d.p.","L'acqua distillata non conduce; diventa conduttrice con un **elettrolita**. Liquidi e gas (ionizzati) sono **conduttori di seconda specie** e non seguono la legge di Ohm. I **raggi catodici** sono elettroni emessi dal catodo (≈ 1/3 della velocità della luce)."],
 ex:[{"t":"La lampadina","d":"Resistenza 100 Ω, capi a 2 V e 8 V: ΔV = 6 V, i = 6/100 = 0,06 A = 60 mA."},{"t":"Tre resistenze in parallelo","d":"200 Ω, 200 Ω e 100 Ω: 1/Req = 1/200 + 1/200 + 2/200 = 4/200 ⇒ Req = 50 Ω."},{"t":"Quattro condensatori da 100 pF","d":"In parallelo darebbero 400 pF; in serie 1/Ceq = 4/100 ⇒ Ceq = 25 pF."}],
 map:{"centro":"Elettrodinamica","rami":[{"t":"Corrente","figli":["i = ΔQ/Δt","Continua e alternata"]},{"t":"Ohm","figli":["ΔV = R·i","R = ρl/S"]},{"t":"Energia","figli":["Effetto Joule","P = R·i²"]},{"t":"Circuiti","figli":["Serie e parallelo","Kirchhoff","f.e.m. e resistenza interna"]}]}},
fl10:{
 sum:["I **magneti** (es. magnetite) attraggono il ferro; la Terra è un grande magnete. Poli uguali si respingono, opposti si attraggono. **Non si può isolare un monopolo**: spezzando una calamita si ottengono altri dipoli.","Oersted (1820): un filo percorso da corrente genera un campo magnetico. Una carica ferma genera solo un campo elettrico; una carica **in moto** genera anche un campo magnetico.","Le linee del campo magnetico sono **sempre chiuse** (quelle elettriche in genere aperte). Il campo magnetico **non è conservativo**: non si definisce un'energia potenziale magnetica.","**Induzione magnetica B**: direzione dell'ago magnetico, verso dal sud al nord dell'ago. Si misura in **tesla** (1 T = 1 Wb/m²; 1 Wb = 1 V·s).","**Forza di Lorentz** F = q·v ∧ B, modulo q·v·B·sen θ: perpendicolare a v e B, **non compie lavoro**. Se v ∥ B nessuna deviazione; se v ⊥ B moto circolare uniforme con **r = mv/(qB)**; altrimenti moto a spirale.","**Biot-Savart**: filo rettilineo B = μ₀μᵣ·i/(2πr), linee circolari concentriche (regola della mano destra). **Spira** al centro B = μ₀i/(2R). **Solenoide**: campo interno uniforme B = μ₀·n·i/l, esterno trascurabile.","Forza su un filo: F = i·l ∧ B (massima se il filo è perpendicolare a B). Due fili paralleli: correnti **concordi si attraggono**, discordi si respingono; F = μ₀i₁i₂l/(2πd).","**Flusso** Φ(B) = B·S·cos θ, in weber (T·m²). **Induzione elettromagnetica**: c'è corrente indotta solo se **varia il flusso** concatenato.","**Faraday-Neumann-Lenz**: f.e.m. = −ΔΦ/Δt. **Lenz**: la corrente indotta genera un campo che si oppone alla variazione di flusso che l'ha prodotta.","**Correnti di Foucault**: correnti indotte in lamine metalliche, dissipative (effetto Joule). **Autoinduzione**: Φ = L·i, L induttanza in **henry**; f.e.m. autoindotta −L·Δi/Δt; extracorrenti all'apertura/chiusura.","**Corrente alternata**: spira che ruota in un campo; i = i₀·sen(ωt). **Valore efficace** i_eff = i₀/√2 (stessa dissipazione Joule di una corrente continua). **Impedenza** Z: f.e.m.₀ = Z·i₀.","**Pila** (chimica → elettrica), **accumulatore** (reversibile), **dinamo** (meccanica → continua), **alternatore** (meccanica → alternata), **motore elettrico** (elettrica → meccanica).","**Trasformatore**: V₂/V₁ = n₂/n₁. Per il trasporto si alza la tensione e si abbassa la corrente, perché le perdite per effetto Joule dipendono da i²."],
 ex:[{"t":"Protone nel campo","d":"q = 1,6·10⁻¹⁹ C, v = 2 m/s ⊥ B = 1 T: F = qvB = 3,2·10⁻¹⁹ N; percorre una circonferenza. Un elettrone girerebbe in verso opposto."},{"t":"Due particelle sulla stessa circonferenza","d":"Stessa carica, stesso B, stesso raggio: r = mv/(qB) ⇒ m·v uguale. Se mA = 2mB, allora vA = vB/2."},{"t":"Magnete e spira","d":"Avvicinando il magnete il flusso aumenta e nasce una corrente; allontanandolo la corrente si inverte; con il magnete fermo non c'è corrente."}],
 map:{"centro":"Magnetismo","rami":[{"t":"Campo magnetico","figli":["Linee chiuse","Tesla"]},{"t":"Forze","figli":["Lorentz","Fili paralleli"]},{"t":"Sorgenti","figli":["Filo, spira, solenoide"]},{"t":"Induzione","figli":["Faraday-Neumann-Lenz","Autoinduzione"]},{"t":"Applicazioni","figli":["Corrente alternata","Trasformatore"]}]}},
fl11:{
 sum:["Un'**onda** è un'oscillazione che si propaga trasportando **energia ma non materia** (il tappo di sughero oscilla solo in verticale).","Onde **meccaniche** (serve un mezzo, non vanno nel vuoto: es. il suono) ed **elettromagnetiche** (anche nel vuoto: la luce). **Trasversali** (vibrazione ⊥ propagazione: onde sull'acqua, luce) e **longitudinali** (vibrazione ∥ propagazione: suono nei fluidi).","Nei solidi onde longitudinali e trasversali; dentro liquidi e gas solo longitudinali; sulla superficie dei liquidi trasversali.","**Periodo** T, **frequenza** f = 1/T (Hz), **lunghezza d'onda** λ (distanza percorsa in un periodo), **velocità** v = λ·f = λ/T. T e f sono proprie dell'onda; λ, v e ampiezza dipendono dal mezzo. 1 Å = 10⁻¹⁰ m.","**Fase**: concordanza, opposizione, quadratura. **Fronte d'onda**: punti con la stessa fase, perpendicolare alla propagazione. **Intensità** (W/m²) ∝ ampiezza² · frequenza²: costante per onde piane, ∝ 1/r per circolari, ∝ 1/r² per sferiche.","**Riflessione**: angolo di incidenza = angolo di riflessione. **Rifrazione** (Snell): sen i / sen r = n₂/n₁ = v₁/v₂; la luce rallenta dove n è maggiore (v = c/n) e si avvicina alla normale.","**Riflessione totale**: passando a un mezzo meno rifrangente, oltre l'angolo limite (sen θ = n₂/n₁; vetro-aria ≈ 41,8°). **Diffusione** da superfici scabre. **Diffrazione**: evidente con ostacoli o fenditure di dimensioni simili a λ (Huygens-Fresnel). **Interferenza** costruttiva/distruttiva; **onde stazionarie** con nodi e ventri.","**Suono**: onda meccanica longitudinale nei fluidi; udibile tra **16 Hz e 20.000 Hz**. Velocità: 340 m/s in aria, 1450 m/s in acqua, 5130 m/s nel ferro.","Caratteri: **altezza** (frequenza), **intensità** (I = P/(4πr²)), **timbro** (forma d'onda). Livello sonoro L = 10·log(I/I₀) dB: soglia di udibilità 0 dB, soglia del dolore 120 dB. Suono periodico, rumore no.","**Eco**: serve un ritardo di almeno 0,1 s, quindi una parete ad almeno 17 m. **Risonanza**: un corpo vibra se colpito da un'onda alla sua frequenza propria (diapason, ponte e passo di marcia).","**Effetto Doppler**: la frequenza percepita aumenta quando sorgente e ascoltatore si avvicinano, diminuisce quando si allontanano (sirena dell'ambulanza). **Infrasuoni** < 16 Hz; **ultrasuoni** > 20 kHz (ecografia 2–15 MHz; risoluzione assiale λ/2; impedenza acustica Z = ρ·v).","**Onde e.m.**: campi E e B perpendicolari tra loro e alla propagazione, in fase; nel vuoto **c = 3·10⁸ m/s** (Maxwell). Luce visibile 380 nm (violetto) – 760 nm (rosso). Fotoni: **E = h·f**: più frequenza, più energia (infrarosso < visibile < ultravioletto).","**Dispersione**: n dipende dalla frequenza; nel prisma il rosso è il meno deviato, il violetto il più deviato (arcobaleno). Illuminazione in lux (legge di Lambert ∝ 1/r²). **Polarizzazione** per assorbimento, riflessione (angolo di Brewster), diffusione.","**Specchio piano**: immagine virtuale, diritta, simmetrica, stesse dimensioni e stessa distanza. Specchi sferici: f = r/2; concavo convergente, convesso divergente (immagine sempre virtuale, diritta, rimpicciolita).","**Punti coniugati**: 1/p + 1/q = 1/f (specchi e lenti sottili). **Potere diottrico** P = 1/f (f in metri, diottrie): positivo per lenti convergenti, negativo per divergenti.","**Miopia**: immagine prima della retina, lente divergente. **Ipermetropia**: dopo la retina, lente convergente (biconvessa). **Presbiopia**: minor accomodazione. Microscopio: obiettivo + oculare, ingrandimento totale = prodotto dei due."],
 ex:[{"t":"La corda col fiocchetto","d":"f = 2 Hz e distanza massimo-minimo 2 m ⇒ λ = 4 m; v = λ·f = 8 m/s. Il fiocchetto non avanza: l'onda è trasversale."},{"t":"L'eco","d":"Il suono va e torna (2d) in almeno 0,1 s: d = 340 · 0,1 / 2 = 17 m."},{"t":"Potere diottrico","d":"Lente convergente con f = 20 cm = 0,2 m: P = 1/0,2 = +5 diottrie."}],
 map:{"centro":"Onde","rami":[{"t":"Tipi","figli":["Meccaniche ed e.m.","Trasversali e longitudinali"]},{"t":"Grandezze","figli":["v = λ·f","Intensità"]},{"t":"Fenomeni","figli":["Riflessione e rifrazione","Diffrazione e interferenza"]},{"t":"Suono","figli":["Decibel, eco, risonanza","Doppler, ultrasuoni"]},{"t":"Luce e ottica","figli":["Spettro, fotoni","Specchi e lenti"]}]}},
fl12:{
 sum:["Atomo: **nucleo** (protoni + neutroni = nucleoni, fatti di quark) ed **elettroni**. **Z** = numero atomico (protoni), **A** = numero di massa (protoni + neutroni). **Isotopi**: stesso Z, diverso A (es. ¹⁶O e ¹⁸O; ¹²C, ¹³C, ¹⁴C).","Forze di legame: interazione **forte** nel nucleo; **elettrostatica** tra nucleo ed elettroni e nei legami delle molecole semplici; **elettromagnetica** tra molecole complesse (proteine, DNA).","**Radiazioni ionizzanti** (raggi X, α, β, γ) strappano elettroni e creano ioni e radicali liberi: possono danneggiare il DNA, ma si usano in radioterapia. **Non ionizzanti**: UV, luce visibile, microonde, onde radio (risonanza magnetica, fototerapia, diatermia).","**Fusione**: nuclei piccoli si uniscono (idrogeno → elio nel Sole, 4·10²⁶ J/s). **Fissione**: un nucleo grande si spezza, per esempio ²³⁵U colpito da un neutrone lento; i neutroni prodotti danno una **reazione a catena**. Barre di controllo (cadmio) assorbono neutroni; il moderatore (acqua pesante) li rallenta.","**Quattro forze**, dalla più intensa: **forte** (tiene uniti i nucleoni), **debole** (decadimento β), **elettromagnetica** (dall'atomo all'universo), **gravitazionale** (la più debole, conta su grandi scale). Debole ed elettromagnetica sono unificate nell'**elettrodebole**.","**Radioattività**: nuclei instabili si trasformano spontaneamente; si conservano Z e A totali. **α** (nucleo di elio): A − 4, Z − 2. **β⁻** (elettrone): Z + 1. **β⁺** (positrone): Z − 1. **γ** (fotone): A e Z invariati.","Penetrazione: **α** fermate da un foglio di carta o dalla pelle; **β** da pochi mm di alluminio; **γ** servono piombo o cemento.","**Dose assorbita** D = E/m in **gray** (J/kg). **Dose equivalente** H = w·D in **sievert**; w = 1 per raggi X, β e γ, 3–11 per neutroni, 20 per α. Circa 4 Sv: morte nel 50% dei casi.","Decadimento esponenziale: N(t) = N₀·e^(−λt) = N₀·2^(−t/T½). Il **tempo di dimezzamento** T½ è il tempo in cui decade metà dei nuclei; T½ = τ·ln 2 (τ vita media). Attività in **becquerel** (1 decadimento/s); 1 Ci = 3,7·10¹⁰ Bq.","**Laser** (emissione stimolata): luce monocromatica, unidirezionale, energia concentrata (chirurgia, metalli). **Raggi X** (Röntgen, 1895): salti degli elettroni interni, f > 10¹⁵ Hz, penetranti, non deviati da campi. **Raggi γ**: ancora più energetici, nascono dal nucleo.","**TAC**: usa i raggi X da molte angolazioni; i tessuti più densi attenuano di più e appaiono più chiari. Dà immagini di sezioni e 3D, ma con dose maggiore della radiografia tradizionale."],
 ex:[{"t":"Decadimento α dell'uranio","d":"²³⁸U (Z = 92) emette una particella α e diventa torio-234 (Z = 90): A cala di 4, Z di 2."},{"t":"Decadimento β⁻ del cobalto","d":"⁶⁰Co (Z = 27) diventa ⁶⁰Ni (Z = 28): un neutrone si trasforma in protone, A non cambia."},{"t":"Dimezzamenti","d":"Dopo 3 tempi di dimezzamento resta 1/2 · 1/2 · 1/2 = 1/8 dei nuclei iniziali."}],
 map:{"centro":"Materia e radiazioni","rami":[{"t":"Atomo","figli":["Z e A","Isotopi"]},{"t":"Nucleo","figli":["Fusione e fissione","Quattro forze"]},{"t":"Radioattività","figli":["α, β, γ","Tempo di dimezzamento","Gray e sievert"]},{"t":"Radiazioni e.m.","figli":["Laser","Raggi X, γ e TAC"]}]}},
cl1:{
 sum:["La materia è fatta di **atomi**. Una **sostanza pura** ha composizione uniforme e definita: può essere un **composto** (più elementi, es. NaCl, H₂O) o una **sostanza semplice** (un solo elemento, es. O₂, Fe). Solo i **gas nobili** esistono come atomi singoli.", "Le **miscele** hanno composizione variabile: **omogenee** (una fase: aria, acqua minerale, vino) o **eterogenee** (più fasi: sangue, rocce, latte). Si separano con metodi fisici: **filtrazione** (dimensioni), **distillazione** (volatilità), **cromatografia** (affinità per due fasi), **centrifugazione** (densità), **estrazione con solventi** (solubilità).", "Simboli: una o due lettere, la prima maiuscola (Cu, K, Au). **Formula bruta**: tipo e numero di atomi; **minima**: rapporto minimo (nei composti ionici coincide con la bruta); **molecolare**: rapporto effettivo; **di struttura**: come sono legati gli atomi.", "Nelle **reazioni** si rompono e si formano legami; si **bilanciano** con i coefficienti stechiometrici, senza toccare i pedici.", "**Leggi ponderali**: conservazione della massa (**Lavoisier**, 1789), proporzioni definite (**Proust**, 1799), proporzioni multiple (**Dalton**, 1803). La **teoria atomica di Dalton** (1802) le spiega; l'indivisibilità dell'atomo è stata poi smentita.", "Atomo: nucleo (**protoni** + **neutroni**) ed **elettroni**. **Z** = protoni, **A** = protoni + neutroni. e = 1,6·10⁻¹⁹ C; 1 u = 1,67·10⁻²⁷ kg; nucleone/elettrone ≈ 1836. **Cationi** (+) e **anioni** (−). **Isotopi**: stesso Z, diverso A (prozio, deuterio, trizio).", "**1 u** = 1/12 della massa del ¹²C. La massa atomica è la media ponderata degli isotopi. Aᵣ e Mᵣ sono adimensionali.", "**Mole**: 6,02·10²³ entità (NA). **n = m/MM**. Legge di **Avogadro**: a pari P e T, volumi uguali di gas hanno lo stesso numero di particelle; a 0 °C e 1 atm una mole occupa **22,4 L**. Dalle percentuali si ricava la formula minima, con la massa molecolare quella molecolare.", "**Chimica nucleare**: α (A −4, Z −2), β⁻ (n → p, Z +1), β⁺ (p → n, Z −1), γ (fotone, A e Z invariati). Attività in **Bq**, dose assorbita in **Gy**, dose equivalente in **Sv**. Effetti **stocastici** (senza soglia) e **deterministici** (con soglia). La **NMR/MRI** usa le onde radio e soprattutto il nucleo ¹H."],
 ex:[{"t": "Moli di acqua", "d": "90 g di H₂O con MM = 18 g/mol: n = 90/18 = 5 mol, cioè 5 · 6,02·10²³ ≈ 3·10²⁴ molecole."}, {"t": "Dalla percentuale alla formula", "d": "C 80%, H 20%: in 100 g ci sono 6,67 mol di C e 20 mol di H, rapporto 1 : 3 ⇒ CH₃. Con massa molecolare 30: 30/15 = 2 ⇒ C₂H₆."}, {"t": "Lo ione Al³⁺", "d": "Z = 13, A = 27: 13 protoni, 14 neutroni e 13 − 3 = 10 elettroni."}, {"t": "Composizione percentuale di N₂O₃", "d": "M = 2·14 + 3·16 = 76: %N = 28/76 ≈ 37%, %O = 48/76 ≈ 63%."}],
 map:{"centro": "Linguaggio della chimica", "rami": [{"t": "Materia", "figli": ["Sostanze pure", "Miscele e separazione"]}, {"t": "Formule e reazioni", "figli": ["Bruta, minima, molecolare", "Bilanciamento"]}, {"t": "Leggi ponderali", "figli": ["Lavoisier, Proust, Dalton", "Teoria atomica"]}, {"t": "Atomo", "figli": ["Z, A, isotopi", "Ioni"]}, {"t": "Mole", "figli": ["n = m/MM", "22,4 L a 0 °C e 1 atm"]}, {"t": "Nucleare", "figli": ["Decadimenti α, β, γ", "Bq, Gy, Sv"]}]}},
cl2:{
 sum:["**Modelli atomici**: Dalton (atomi indivisibili) → **Thomson** 1902 (\"a panettone\": massa positiva con elettroni immersi) → **Rutherford** 1911 (planetario: atomo quasi vuoto, massa nel nucleo; ma l'elettrone dovrebbe cadere sul nucleo) → **Bohr** 1913 (orbite stazionarie quantizzate; l'atomo scambia energia solo saltando tra orbite, ΔE = hν) → **modello quantomeccanico** 1930.", "**Heisenberg** (1927): non si conoscono insieme posizione e quantità di moto; al posto dell'orbita c'è l'**orbitale**, regione dove è probabile trovare l'elettrone (funzione d'onda ψ).", "**Numeri quantici**: **n** (dimensione ed energia, 1, 2, 3…), **ℓ** (forma: 0 s, 1 p, 2 d, 3 f; da 0 a n − 1), **m** (orientazione, da −ℓ a +ℓ), **mₛ** (spin, ±½). Orbitali: s 1, p 3, d 5, f 7. Un livello contiene al massimo **2n²** elettroni.", "**Configurazione elettronica**: ordine 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p… (regola della diagonale). Regole: **Aufbau** (prima gli orbitali a energia minore), **Pauli** (max 2 elettroni a spin opposto per orbitale), **Hund** (negli orbitali degeneri prima uno per orbitale con spin paralleli).", "**Tavola periodica**: 7 **periodi** (righe) e 18 **gruppi** (colonne). Gruppi A = **rappresentativi** (s e p), gruppi B = **transizione** (d), lantanoidi e attinoidi = transizione interna (f). Blocchi s, p, d, f. Per i rappresentativi: elettroni di valenza = gruppo, ultimo livello = periodo. Configurazione abbreviata con il gas nobile precedente, es. Zr = [Kr] 5s² 4d².", "**Proprietà periodiche**: il **raggio atomico** aumenta scendendo e diminuisce verso destra; **energia di ionizzazione**, **affinità elettronica** ed **elettronegatività** (Pauling: F 4,0, Fr 0,7) aumentano verso destra e verso l'alto. Ogni ionizzazione successiva costa di più; salto quando si arriva a un livello interno.", "**Metalli** (centro-sinistra): pochi elettroni esterni, bassa EI ed elettronegatività, formano cationi, lucenti, duttili, conduttori. **Non metalli** (alto a destra): formano anioni. **Semimetalli**: B, Si, Ge, As, Sb, Te. L'idrogeno ha configurazione da metallo ma si comporta da non metallo."],
 ex:[{"t": "Configurazione dell'ossigeno", "d": "Z = 8: 1s² 2s² 2p⁴. Nel 2p i primi tre elettroni occupano tre orbitali con spin paralleli (Hund), il quarto si appaia."}, {"t": "Riconoscere l'elemento", "d": "Valenza 3s² 3p⁴: periodo 3, 6 elettroni di valenza ⇒ gruppo 16, è lo zolfo. Valenza 2s² 2p¹: periodo 2, gruppo 13 ⇒ boro."}, {"t": "Il salto del carbonio", "d": "C: 1s² 2s² 2p². Le prime 4 ionizzazioni tolgono elettroni del livello 2; la quinta deve strappare un elettrone 1s e l'energia sale bruscamente."}],
 map:{"centro": "Struttura dell'atomo", "rami": [{"t": "Modelli", "figli": ["Thomson, Rutherford", "Bohr, quantomeccanico"]}, {"t": "Numeri quantici", "figli": ["n, ℓ, m, mₛ", "s, p, d, f"]}, {"t": "Configurazione", "figli": ["Aufbau, Pauli", "Regola di Hund"]}, {"t": "Tavola periodica", "figli": ["Periodi e gruppi", "Blocchi s, p, d, f"]}, {"t": "Proprietà periodiche", "figli": ["Raggio", "Ionizzazione, AE, elettronegatività"]}, {"t": "Classi", "figli": ["Metalli, non metalli", "Semimetalli"]}]}},
cl3:{
 sum:["Due atomi si legano se il prodotto ha **energia minore**: la differenza è l'**energia di legame**. Nei legami intervengono gli **elettroni di valenza** (simboli di **Lewis**). **Regola dell'ottetto**: gli atomi tendono alla configurazione s²p⁶ dei gas nobili (l'elio si ferma a 2).", "Legami interatomici: **covalente** (non metalli, condivisione), **ionico** (metallo + non metallo, trasferimento di elettroni), **metallico** (cationi in una nuvola di elettroni delocalizzati). Per convenzione ionico se Δχ > 1,9, covalente se < 1,7.", "**Covalente**: lunghezza di legame = equilibrio tra attrazioni e repulsioni (H–H 0,074 nm); doppietti di legame e **solitari**; legami singoli, doppi, tripli (più alto l'ordine, più forte e corto). **Apolare** tra atomi uguali, **polare** (δ⁺/δ⁻) tra atomi diversi; **dativo** se la coppia viene da un solo atomo (es. NH₄⁺). Il covalente è **direzionale**.", "Legame **σ**: sovrapposizione frontale, più forte; legame **π**: laterale tra orbitali p (N₂ = 1σ + 2π). **Ibridazione**: sp³ (109,5°, CH₄), sp² (120°, BH₃), sp (180°, BeH₂). **Risonanza**: la struttura reale è un ibrido delle forme limite (NO₂⁻, benzene).", "**VSEPR**: i doppietti si allontanano il più possibile. NS = 2 lineare, 3 trigonale planare, 4 tetraedrica (NH₃ piramidale 107,5°, H₂O piegata 104,5°). Una molecola è **polare** se la somma vettoriale dei dipoli (in debye) non è nulla: CO₂, BF₃, CCl₄ apolari; H₂O, NH₃, CHCl₃ polari.", "**Ionico**: attrazione elettrostatica, **adirezionale**; forma reticoli cristallini, solidi ad alta fusione, conducono fusi o in soluzione. L'**energia reticolare** cresce con la carica e al diminuire della dimensione degli ioni. **Metallico**: spiega conducibilità, duttilità, malleabilità; Hg e Cn non sono solidi.", "**Forze intermolecolari**: van der Waals (dipolo-dipolo/Keesom, dipolo-indotto/Debye, dispersione/London, crescono con la massa: Cl₂ gas, Br₂ liquido, I₂ solido), **legame a idrogeno** (H legato a F, O, N; spiega le anomalie dell'acqua: densità massima a 4 °C, ghiaccio meno denso, alta tensione superficiale), **ione-dipolo** (dissoluzione di NaCl), **idrofobiche** (effetto entropico).", "**Stati**: aeriforme, liquido, solido. Durante un passaggio di stato T resta costante (**Q = m·λ**); altrove **Q = m·c·ΔT**. Gas sopra la temperatura critica, vapore sotto. **PV = nRT** (R = 0,0821 L·atm/(mol·K)); **Dalton**: Pᵢ = P_tot·xᵢ; gas reali: van der Waals. Si bolle quando la tensione di vapore = pressione esterna.", "Solidi **ionici**, **metallici**, **molecolari**, **covalenti**; cristallini o amorfi. **Diagramma di fase**: punto triplo (acqua 0,01 °C, 0,006 atm), punto critico (acqua 374 °C, 218 atm; CO₂ 31 °C, 73 atm). Biologia: il sudore raffredda evaporando; respirazione con le leggi di **Boyle**, **Dalton**, **Henry** (gas disciolto ∝ pressione parziale) e **Fick** (diffusione ∝ area e gradiente, ∝ 1/spessore)."],
 ex:[{"t": "Il fluoruro di magnesio", "d": "Mg (gruppo 2) cede 2 elettroni e diventa Mg²⁺; ogni F (gruppo 17) ne acquista 1. Per la neutralità servono due F⁻: MgF₂."}, {"t": "Acqua e anidride carbonica", "d": "CO₂ è lineare: i dipoli C=O si annullano, molecola apolare. H₂O è piegata (2 doppietti solitari): i dipoli non si annullano, molecola polare."}, {"t": "Pressione parziale", "d": "Miscela a 800 torr con 60% di O₂ e 40% di CO₂: P(O₂) = 0,60 · 800 = 480 torr, P(CO₂) = 320 torr."}, {"t": "Moli in una bombola", "d": "10,0 L di H₂ a 100 atm e 30 °C (303 K): n = PV/RT = 1000/(0,0821 · 303) ≈ 40,2 mol."}],
 map:{"centro": "Legami chimici", "rami": [{"t": "Interatomici", "figli": ["Covalente, ionico", "Metallico"]}, {"t": "Covalente", "figli": ["σ e π, ibridazione", "Risonanza"]}, {"t": "Forma e polarità", "figli": ["VSEPR", "Momento di dipolo"]}, {"t": "Intermolecolari", "figli": ["Van der Waals", "Legame a idrogeno"]}, {"t": "Stati di aggregazione", "figli": ["Passaggi di stato", "PV = nRT"]}, {"t": "Biologia", "figli": ["Sudore", "Respirazione e gas"]}]}},
cl4:{
 sum:["Il **numero di ossidazione** è la carica formale che un atomo avrebbe se gli elettroni di legame andassero all'atomo più elettronegativo. Regole: sostanze elementari 0; ione monoatomico = sua carica; somma = 0 nei composti neutri, = carica negli ioni; **H +1** (−1 negli idruri metallici); **O −2** (−1 nei perossidi, +2 in OF₂); gruppo 1 = +1, gruppo 2 = +2.", "Un elemento non supera il N.O. del suo gruppo; gruppi 14 e 16 hanno di solito N.O. pari, 15 e 17 dispari. Metallo + non metallo → composti **ionici**; non metalli tra loro → **covalenti**. Composti dei metalli **basici**, dei non metalli **acidi**.", "**Nomenclatura**: IUPAC con prefissi greci (triossido di diferro) e **notazione di Stock** (ossido di ferro(III)); tradizionale con **-oso** (N.O. minore) e **-ico** (maggiore), **ipo-…-oso** e **per-…-ico** quando i N.O. sono tre o quattro.", "**Binari**: idruri (metallici con H −1, covalenti come NH₃, CH₄, PH₃), **idracidi** (acido …-idrico: HCl, H₂S, HCN), **ossidi basici** (metallo + O), **anidridi** (non metallo + O che con l'acqua danno ossiacidi; CO non lo è), **sali degli idracidi** (-uro: NaCl, CaCl₂, KBr). Mn e Cr: N.O. bassi danno ossidi basici, alti anidridi.", "**Ternari**: **idrossidi** M(OH)ₓ (basi), **ossiacidi** HₓXOᵧ (acidi; meta-, piro-, orto- con 1, 2, 3 H₂O). Anioni: **-ico → -ato**, **-oso → -ito** (ipoclorito, clorito, clorato, perclorato); con H rimasti: bicarbonato, idrogenofosfato. Formula dei sali: si bilanciano le cariche, es. Al₂(SO₄)₃.", "**Reazioni di preparazione**: metallo + O₂ → ossido basico; non metallo + O₂ → anidride; ossido basico + H₂O → idrossido; anidride + H₂O → ossiacido; acido + idrossido → sale + acqua.", "**Composti di coordinazione**: atomo centrale (acido di Lewis, spesso metallo del blocco d) e leganti donatori (basi di Lewis), mono- o polidentati (EDTA esadentato, chelanti). Numero di coordinazione 4 (tetraedrico o planare quadrato) o 6 (ottaedrico). Isomeria cis-trans (cisplatino) e ottica. Esempi biologici: eme (Fe), clorofilla (Mg), B₁₂ (Co).", "**Allotropia** (diamante/grafite, O₂/O₃) e **polimorfismo** (zolfo monoclino e rombico; biodisponibilità dei farmaci). **Elementi**: H il più abbondante dell'Universo; alcalini ns¹, molto reattivi, idrossidi basi forti; alcalino-terrosi ns² (calce viva CaO, spenta Ca(OH)₂, Mg²⁺ nella clorofilla); transizione (Fe, Co, Cu, Zn negli enzimi); gruppo 13 (B semimetallo, Al₂O₃ anfotero); 14 (C, Si, Pb); 15 (N₂ nell'aria, P nei fosfati); 16 (O₂ ≈ 20% dell'aria, S nei ponti disolfuro); alogeni (N.O. −1, HF unico idracido debole); gas nobili inerti, **radon** cancerogeno."],
 ex:[{"t": "N.O. dello zolfo in H₂SO₄", "d": "2·(+1) + x + 4·(−2) = 0 ⇒ x = +6. Nello ione NO₃⁻: x + 3·(−2) = −1 ⇒ N = +5."}, {"t": "Formula del solfato di alluminio", "d": "Al³⁺ e SO₄²⁻ (da H₂SO₄ senza due H⁺): per pareggiare le cariche servono 2 Al³⁺ e 3 SO₄²⁻ ⇒ Al₂(SO₄)₃."}, {"t": "Dal nome dell'acido all'anione", "d": "Acido ipocloroso HClO → ipoclorito ClO⁻; acido clorico HClO₃ → clorato ClO₃⁻; acido perclorico HClO₄ → perclorato ClO₄⁻."}, {"t": "Due reazioni con l'acqua", "d": "CuO + H₂O → Cu(OH)₂ (ossido basico → idrossido); SO₃ + H₂O → H₂SO₄ (anidride → ossiacido)."}],
 map:{"centro": "Composti inorganici", "rami": [{"t": "Numero di ossidazione", "figli": ["Regole", "Valenza"]}, {"t": "Nomenclatura", "figli": ["IUPAC e Stock", "-oso, -ico, ipo-, per-"]}, {"t": "Binari", "figli": ["Idruri, idracidi", "Ossidi, anidridi, sali -uro"]}, {"t": "Ternari", "figli": ["Idrossidi, ossiacidi", "Sali -ato, -ito"]}, {"t": "Coordinazione", "figli": ["Leganti e chelanti", "Eme, clorofilla, B₁₂"]}, {"t": "Elementi", "figli": ["Gruppi 1-2 e transizione", "Gruppi 13-18"]}]}},
cl5:{
 sum:["Un'**equazione chimica** ha i reagenti a sinistra, i prodotti a destra e i **coefficienti stechiometrici** davanti alle formule; stati fisici (s), (l), (g), (aq). Reazioni in fase **omogenea** o **eterogenea**.", "**Tipi di reazione**: sintesi, decomposizione, dissociazione, ionizzazione, scambio semplice, doppio scambio (metatesi), neutralizzazione, redox, combustione, condensazione (si perde una piccola molecola) e idrolisi.", "**Equazione ionica**: elettroliti forti scritti come ioni, solidi, gas ed elettroliti deboli in forma molecolare; nell'**equazione ionica netta** si tolgono gli **ioni spettatori** (es. Ag⁺ + Cl⁻ → AgCl).", "**Bilanciamento**: si cambiano solo i coefficienti, mai i pedici; prima gli elementi rari, H e O per ultimi; ioni poliatomici come blocchi; coefficienti minimi interi.", "**Redox**: trasferimento di elettroni. Chi si **ossida perde** elettroni (N.O. ↑) ed è il **riducente**; chi si **riduce acquista** elettroni (N.O. ↓) ed è l'**ossidante**. Comproporzione e disproporzione. Bilanciamento con le semireazioni: elettroni ceduti = acquistati (m.c.m.), H⁺ o OH⁻ e H₂O.", "**Pila**: redox spontanea → energia elettrica; **anodo (−) ossidazione**, **catodo (+) riduzione**, ponte salino. f.e.m. = E(catodo) − E(anodo); riferimento: elettrodo a idrogeno (0 V). Più alto E°, più ossidante (F₂); più basso, più riducente (Li). Redox spontanea se ΔE > 0. **Daniell**: Zn/Cu, 1,10 V.", "**Cella elettrolitica**: energia elettrica → redox non spontanea; anodo (+) ossidazione, catodo (−) riduzione (elettrolisi dell'acqua: H₂ al catodo, O₂ all'anodo). Conduttori di **prima specie** (elettroni) e di **seconda specie** (ioni). **Faraday**: m = Z·q, F = 96.485 C/mol. **Nernst**: potenziale fuori dalle condizioni standard (pH-metro, pile a concentrazione).", "**Stechiometria**: i coefficienti sono rapporti in moli. Procedura: bilancia, converti in moli, proporzione, riconverti. **Reagente limitante** = quello in difetto. **Resa %** = resa effettiva / resa teorica · 100."],
 ex:[{"t": "Sintesi dell'ammoniaca", "d": "N₂ + 3 H₂ → 2 NH₃. Con 6 mol di H₂ (N₂ in eccesso): 3 : 2 = 6 : x ⇒ 4 mol di NH₃ = 68 g."}, {"t": "Pila Daniell", "d": "Cu²⁺/Cu +0,34 V, Zn²⁺/Zn −0,76 V. Lo zinco si ossida all'anodo, il rame si riduce al catodo: f.e.m. = 0,34 − (−0,76) = 1,10 V."}, {"t": "Elettrolisi del rame", "d": "2,0 A per 30 min: q = 3600 C. Per Cu²⁺ servono 2 elettroni: 3600/96.485/2 ≈ 0,019 mol di Cu ≈ 1,2 g."}, {"t": "Resa percentuale", "d": "32,5 g di Zn = 0,5 mol ⇒ teorici 0,5 mol di Cu = 31,8 g. Ottenuti 27 g: resa = 27/31,8 ≈ 85%."}],
 map:{"centro": "Reazioni chimiche", "rami": [{"t": "Equazioni", "figli": ["Molecolari e ioniche", "Bilanciamento"]}, {"t": "Tipi", "figli": ["Sintesi, decomposizione", "Scambio, neutralizzazione"]}, {"t": "Redox", "figli": ["Ossidante e riducente", "Semireazioni"]}, {"t": "Elettrochimica", "figli": ["Pila e f.e.m.", "Elettrolisi, Faraday, Nernst"]}, {"t": "Stechiometria", "figli": ["Rapporti in moli", "Limitante e resa"]}]}},
cl6:{
 sum:["Miscele **omogenee** (soluzioni) ed **eterogenee** (dispersioni): **sospensioni** (> 1 µm: fango, sangue) e **colloidi** (1 nm-1 µm): schiuma, aerosol (nebbia), emulsione (olio-aceto), fumo, sol e gel.", "Una **soluzione** ha un **solvente** (stesso stato della soluzione, in quantità maggiore) e uno o più **soluti**; può essere gassosa (aria), liquida (acqua di mare) o solida (bronzo). La dissoluzione porta alla **solvatazione** (in acqua **idratazione**).", "Velocità di dissoluzione: **agitazione**, **temperatura**, **suddivisione** del soluto. **Solubilità** = concentrazione della soluzione **satura**; esistono soluzioni **sovrasature** (metastabili). \"**Il simile scioglie il simile**\". Dissoluzione esotermica: solubilità ↓ con T; endotermica: ↑. Gas: **legge di Henry** C = k_H·P, meno solubili a caldo.", "**Regole di solubilità**: solubili i composti dei metalli alcalini e di NH₄⁺, nitrati, acetati, clorati; cloruri, bromuri e ioduri tranne Ag⁺, Pb²⁺, Hg₂²⁺; solfati tranne Ca²⁺, Sr²⁺, Ba²⁺, Pb²⁺. Insolubili carbonati, fosfati, solfuri, ossidi e idrossidi metallici (tranne alcalini).", "**Concentrazioni**: % m/m, % m/V (non adimensionale), % V/V; **molarità** M = n/V(L); **frazione molare** (somma = 1); **molalità** m = n/kg di solvente; **normalità** N = M·v_op (≥ M; usata in medicina, mEq/L). **Diluizione**: M₁V₁ = M₂V₂.", "**Elettroliti** forti (α = 1: sali solubili, acidi e basi forti) e deboli (α < 1); **dissociazione** (composti ionici) e **ionizzazione** (molecole che reagiscono con l'acqua). Non elettroliti: glucosio, urea.", "**Proprietà colligative** (dipendono dal numero di particelle, coefficiente di **van't Hoff** i): **Raoult** p = p°·x(solvente); **ΔT_eb = K_eb·m** e **ΔT_cr = K_cr·m** (il sale sulle strade); **osmosi** dal diluito al concentrato, **π = C·R·T** (· i). Isotoniche, ipotoniche (globuli rossi si gonfiano e lisano), ipertoniche. **Osmolarità** = osmoli/L.", "**Aria**: inspirata ≈ 78% N₂, 21% O₂, 0,04% CO₂; espirata ≈ 16% O₂, 4% CO₂, satura di vapore e più calda (spirometria, capnografia, test del respiro). **Fluidi biologici**: Na⁺, K⁺, Cl⁻, Ca²⁺, HCO₃⁻; la **Na⁺/K⁺-ATPasi** mantiene i gradienti."],
 ex:[{"t": "Molarità di NaOH", "d": "20 g di NaOH (40 g/mol) = 0,5 mol in 0,5 L ⇒ 1 M. In percentuale: 20 g in 500 mL = 4% m/V."}, {"t": "Diluire dieci volte", "d": "100 mL di NaCl 0,1 M + 900 mL di acqua: 0,1 · 100 = M₂ · 1000 ⇒ 0,01 M."}, {"t": "Molalità di HBr al 25%", "d": "25 g di HBr = 0,31 mol in 75 g di acqua ⇒ 0,31 · 1000/75 ≈ 4,1 mol/kg."}, {"t": "Glucosio contro NaCl", "d": "Entrambe 1 M, ma NaCl ha i = 2: è ipertonica e l'acqua passa dal glucosio verso il NaCl."}],
 map:{"centro": "Soluzioni", "rami": [{"t": "Miscele", "figli": ["Sospensioni e colloidi", "Soluto e solvente"]}, {"t": "Solubilità", "figli": ["Simile scioglie simile", "T, P e legge di Henry"]}, {"t": "Concentrazione", "figli": ["%, M, m, x", "Diluizione M₁V₁ = M₂V₂"]}, {"t": "Elettroliti", "figli": ["Forti e deboli", "Coefficiente i"]}, {"t": "Colligative", "figli": ["Raoult, ebullio, crio", "Osmosi π = CRT"]}, {"t": "Biologia", "figli": ["Aria inspirata/espirata", "Elettroliti nei fluidi"]}]}},
cl7:{
 sum:["La **termodinamica** studia le variazioni di energia (1 cal = 4,186 J). Sistemi **aperti** (materia ed energia), **chiusi** (solo energia), **isolati** (niente). **Funzioni di stato**: dipendono solo da stato iniziale e finale (legge di **Hess**): U, H, S, G.", "**Entalpia**: ΔH = calore a pressione costante. **Esotermica** ΔH < 0, **endotermica** ΔH > 0; la reazione inversa ha ΔH opposto. Fusione, vaporizzazione, sublimazione sono endotermiche; condensazione, solidificazione, brinamento esotermiche.", "**Entropia**: misura del disordine; cresce con particelle, temperatura, gradi di libertà. **Gibbs**: **ΔG = ΔH − TΔS**; ΔG < 0 spontanea (esoergonica), > 0 non spontanea, = 0 equilibrio. ΔH − e ΔS + sempre spontanea; ΔH + e ΔS − mai; ΔH + e ΔS + solo ad alta T; ΔH − e ΔS − solo a bassa T. Spontaneità ≠ velocità (diamante → grafite).", "**Cinetica**: teoria delle **collisioni** (urti con energia e orientazione giuste). **Energia di attivazione** Eₐ = stato di transizione − reagenti. Legge cinetica v = k[A]ⁿ: ordine 0, 1, 2. Velocità ↑ con concentrazione, temperatura (Arrhenius, Eyring), superficie, catalizzatore. Lo stadio più lento (**rate-determining step**) comanda.", "**Catalizzatori**: abbassano Eₐ, cambiano il meccanismo, restano inalterati, selettivi; **non** cambiano ΔH, ΔG né l'equilibrio. **Inibitori**: alzano Eₐ. Enzimi: **Michaelis-Menten**, Km bassa = alta affinità.", "**Equilibrio**: dinamico, velocità diretta = inversa, ΔG = 0. **K_eq** dipende solo da T; esclude solidi e solvente; K ≫ 1 verso prodotti. Quoziente **Q**: Q < K va verso destra, Q > K verso sinistra; ΔG = ΔG° + RT ln Q.", "**Le Châtelier**: aggiungere reagente o togliere prodotto → destra; aumentare T favorisce il verso endotermico (K cambia); aumentare P favorisce il lato con meno moli di gas; il catalizzatore non sposta nulla.", "**Solubilità**: K_ps (AgCl: s = √K_ps); precipita se il prodotto ionico supera K_ps; lo **ione comune** riduce la solubilità. **Equilibri multipli**: K totale = prodotto delle K (acidi poliprotici, complessi). **Redox**: ΔG = −nFΔE. In biologia: pH del sangue (CO₂/HCO₃⁻), enzimi, emoglobina, calcoli renali, assorbimento dei farmaci."],
 ex:[{"t": "Quando diventa spontanea", "d": "ΔH = +40 kJ, ΔS = +100 J/K: ΔG < 0 se T > 40.000/100 = 400 K."}, {"t": "Sintesi dell'ammoniaca", "d": "N₂ + 3 H₂ ⇌ 2 NH₃: 4 moli di gas diventano 2, quindi un aumento di pressione sposta l'equilibrio verso NH₃."}, {"t": "Solubilità di AgCl", "d": "K_ps = [Ag⁺][Cl⁻] = s² = 1,8·10⁻¹⁰ ⇒ s ≈ 1,3·10⁻⁵ mol/L."}, {"t": "H₂ + I₂ ⇌ 2 HI (esotermica)", "d": "Per aumentare HI: aggiungere H₂ o I₂, togliere HI, abbassare la temperatura. La pressione non ha effetto (2 moli di gas per parte)."}],
 map:{"centro": "Termodinamica, cinetica, equilibrio", "rami": [{"t": "Termodinamica", "figli": ["ΔH, ΔS", "ΔG = ΔH − TΔS"]}, {"t": "Cinetica", "figli": ["Collisioni ed Eₐ", "Ordine di reazione"]}, {"t": "Catalizzatori", "figli": ["Abbassano Eₐ", "Enzimi, Michaelis-Menten"]}, {"t": "Equilibrio", "figli": ["K_eq e Q", "Le Châtelier"]}, {"t": "Equilibri speciali", "figli": ["K_ps, ione comune", "Multipli e redox"]}]}},
cl8:{
 sum:["**Arrhenius**: acido libera H⁺, base libera OH⁻ (limiti: ignora il solvente). **Brønsted-Lowry**: acido cede H⁺, base lo accetta; coppie **coniugate** (HBr/Br⁻, NH₄⁺/NH₃). L'acqua è **anfiprotica**. **Lewis**: acido accetta un doppietto (H⁺, cationi metallici, BF₃), base lo dona (NH₃, CN⁻). Acidi mono- e **poliprotici** (H₂SO₄ cede 2 H⁺ in due passaggi).", "**Forza**: acidi e basi forti sono completamente dissociati (α = 1). **Ka**, **Kb** (pK = −log K): Ka alta = acido forte. Acidi forti: HCl, HBr, HI, HClO₄, H₂SO₄, HNO₃, HClO₃; basi forti: idrossidi dei gruppi 1 e 2. Deboli: HF, HCN, CH₃COOH, NH₃, ammine. Più ossigeni sull'atomo centrale → ossiacido più forte.", "**Autoprotolisi**: Kw = [H₃O⁺][OH⁻] = 10⁻¹⁴ a 25 °C (aumenta con T). **Ka·Kb = Kw**, pKa + pKb = 14: acido forte ↔ base coniugata debolissima.", "**pH = −log[H₃O⁺]**, pOH = −log[OH⁻], **pH + pOH = 14**. Ogni unità di pH = fattore 10. Acido forte: pH = −log Ca (diprotico: 2Ca). Base forte: pOH = −log Cb. Acido debole: [H⁺] = √(Ka·Ca); base debole: [OH⁻] = √(Kb·Cb).", "Si misura con il **pH-metro** o con **indicatori** (acidi deboli; viraggio a pH = pK(ind)). **Neutralizzazione**: acido + base → sale + acqua, non sempre a pH 7.", "**Idrolisi salina**: sale da acido forte + base forte → neutro (NaCl); acido forte + base debole → acido (NH₄Cl); acido debole + base forte → basico (CH₃COONa, NaHCO₃).", "**Tamponi**: acido debole + base coniugata (o viceversa) in concentrazioni simili. **Henderson-Hasselbalch**: pH = pKa + log(Cb/Ca); massima efficacia a pH = pKa; la diluizione non cambia il pH ma riduce il potere tamponante. Plasma: pH **7,35-7,45**, tampone **H₂CO₃/HCO₃⁻**.", "**Titolazioni**: al punto di equivalenza moli di acido = moli di base (acido forte + base forte: pH 7; acido debole + base forte: pH > 7). **Solubilità e pH**: in ambiente acido si sciolgono fosfati di calcio (idrossiapatite); urine troppo alcaline favoriscono l'ossalato di calcio; il fluoro dà fluoroidrossiapatite, più resistente agli acidi."],
 ex:[{"t": "pH di acidi e basi forti", "d": "HCl 0,01 M ⇒ pH 2. KOH 10⁻⁴ M ⇒ pOH 4, pH 10. Ba(OH)₂ 0,001 M ⇒ [OH⁻] = 0,002 M, pOH ≈ 2,7, pH ≈ 11,3."}, {"t": "Ammoniaca 0,1 M", "d": "Kb = 1,8·10⁻⁵: [OH⁻] = √(1,8·10⁻⁶) ≈ 1,3·10⁻³ M ⇒ pOH ≈ 3, pH ≈ 11."}, {"t": "Riconoscere l'idrolisi", "d": "NaCl e KClO₄ neutri; NH₄NO₃ acido (NH₄⁺); NaHCO₃ basico (HCO₃⁻ base debole); KHSO₄ acido (HSO₄⁻ è acido)."}, {"t": "Tampone acetato", "d": "pKa = 4,75, acetato 1 M e acido 0,1 M: pH = 4,75 + log 10 = 5,75."}],
 map:{"centro": "Acidi e basi", "rami": [{"t": "Teorie", "figli": ["Arrhenius", "Brønsted-Lowry, Lewis"]}, {"t": "Forza", "figli": ["Ka, Kb, pK", "Forti e deboli"]}, {"t": "pH", "figli": ["pH + pOH = 14", "Indicatori"]}, {"t": "Sali", "figli": ["Idrolisi acida o basica", "Neutralizzazione"]}, {"t": "Tamponi", "figli": ["Henderson-Hasselbalch", "Sangue 7,35-7,45"]}, {"t": "Titolazioni", "figli": ["Punto di equivalenza", "Solubilità e pH"]}]},
 extra:"ph"},
cl9:{
 sum:["La **chimica organica** studia i composti con legami C–C e/o C–H (con eteroatomi O, N, S, P, alogeni). Il **carbonio** ha 4 elettroni di valenza, forma sempre 4 legami, è ibridato **sp³** (109,5°), **sp²** (120°) o **sp** (180°), si concatena in catene aperte o cicliche; χ = 2,5; N.O. da −4 a +4. Carboni primari, secondari, terziari, quaternari.", "**Formule**: bruta, di Lewis, razionale, condensata, **topologica**. I **gruppi funzionali** (–OH, –NH₂, –COOH…) definiscono le classi. Punti di ebollizione: crescono con la massa (London), poi dipolo-dipolo, poi **legami a idrogeno**. La solubilità in acqua cala allungando la catena.", "**Reattività**: rottura **omolitica** (radicali) o **eterolitica** (carbocationi e carbanioni). **Elettrofili** (acidi di Lewis: H⁺, BCl₃, C=O) e **nucleofili** (basi di Lewis: OH⁻, CN⁻, –NH₂). Reazioni: sostituzione, addizione, eliminazione, ossidazione, riduzione, polimerizzazione.", "**Effetto induttivo**: −I (–OH, –Cl: attrattori) e +I (gruppi alchilici: donatori); carbocationi terziario > secondario > primario; CF₃COOH più forte di CH₃COOH. **Effetto di risonanza**: −R (–NO₂) e +R (–OH, –NH₂); il fenolo è più acido dell'etanolo.", "**Isomeria strutturale**: di catena, di posizione, di gruppo funzionale (C₆H₁₄ ha 5 isomeri). **Stereoisomeria**: conformazioni (eclissata/sfalsata), **enantiomeri** (carbonio chirale, attività ottica, racemo), **diastereoisomeri** (cis/trans, epimeri, anomeri), composti **meso**. Configurazioni **R/S**, **D/L**, **E/Z**. Biomedicina: talidomide, cisplatino.", "**Nomenclatura IUPAC**: catena principale più lunga con il gruppo prioritario; radici met-, et-, prop-, but-, pent-, es-, ept-, ott-, non-, dec-; desinenze -ano, -ene, -ino, -olo, -ale, -one; numeri più bassi al gruppo funzionale; sostituenti in ordine alfabetico.", "**Alcani** CₙH₂ₙ₊₂ (paraffine, poco reattivi): alogenazione radicalica, combustione (CO in difetto di O₂), deidrogenazione. **Alcheni** (C=C, σ + π, niente rotazione): **addizione elettrofila** (idrogenazione, alogenazione, idratazione, idroalogenazione con regola di **Markovnikov**), polimerizzazione (PE, PP, PS); dieni cumulati, isolati, coniugati. **Alchini** (C≡C, σ + 2π): addizioni; idratazione → enolo → aldeide/chetone.", "**Cicloalcani** CₙH₂ₙ (tensione d'anello in ciclopropano e ciclobutano; cicloesano a sedia e a barca). **Aromatici**: ciclici, planari, coniugati, **Hückel 4n + 2**; benzene ibrido di risonanza. Derivati: toluene, fenolo, acido benzoico, stirene, anilina; orto/meta/para. **Sostituzione elettrofila aromatica** (nitrazione, solfonazione, alogenazione, Friedel-Crafts); –NH₂, –OH attivanti orto-para, –NO₂ disattivante meta. Tossicità: benzene (leucemie), IPA (cancerogeni), naftalene."],
 ex:[{"t": "Ordinare per punto di ebollizione", "d": "CH₃CH₃ < CH₃CH₂Cl < CH₃CH₂OH < CH₃CH₂CH₂OH: prima London, poi dipolo-dipolo, poi legami a idrogeno; tra i due alcoli vince la catena più lunga."}, {"t": "I cinque isomeri dell'esano", "d": "n-esano, 2-metilpentano, 3-metilpentano, 2,2-dimetilbutano, 2,3-dimetilbutano (tutti C₆H₁₄)."}, {"t": "Regola di Markovnikov", "d": "Propene + HBr: l'H va sul CH₂ terminale, il Br sul carbonio centrale (carbocatione secondario più stabile) ⇒ 2-bromopropano."}, {"t": "Dare il nome", "d": "CH₃–C≡C–CH₂–CH(CH₃)–CH₂–CH₃: 7 atomi di C, triplo legame dal C2, metile sul C5 ⇒ 5-metil-2-eptino."}],
 map:{"centro": "Chimica organica e idrocarburi", "rami": [{"t": "Carbonio", "figli": ["sp³, sp², sp", "Formule"]}, {"t": "Reattività", "figli": ["Elettrofili e nucleofili", "Effetti I e R"]}, {"t": "Isomeria", "figli": ["Strutturale", "Stereoisomeria, R/S, E/Z"]}, {"t": "Alifatici", "figli": ["Alcani, alcheni, alchini", "Markovnikov"]}, {"t": "Ciclici e aromatici", "figli": ["Tensione d'anello", "Benzene, Hückel, SEAr"]}]}},
cl10:{
 sum:["**Alogenuri** R–X / Ar–X: legame C–X polare, punti di ebollizione più alti degli idrocarburi, insolubili in acqua. Con nucleofili danno **sostituzione nucleofila**: **Sɴ2** (un solo stadio, substrati primari, inversione) o **Sɴ1** (carbocatione, substrati terziari, racemo); con basi forti **eliminazione** (E1, E2) verso l'alchene più sostituito.", "**Alcoli** R–OH e **fenoli** Ar–OH (primari, secondari, terziari; glicol, glicerolo): legami a idrogeno. Reazioni: sostituzione (eteri, sintesi di Williamson), disidratazione ad alcheni, alcossidi con i metalli. **Ossidazione**: primario → aldeide → acido; secondario → chetone; terziario no. Fenoli più acidi (risonanza); chinoni/idrochinoni e **coenzima Q**. **Etanolo** → acetaldeide → acetato nel fegato.", "**Tioli** (–SH): bollono meno degli alcoli, più acidi, si ossidano a **disolfuri** (ponti S–S). **Eteri** R–O–R': niente legami a idrogeno tra loro, volatili, buoni solventi; **epossidi** tesi e reattivi.", "**Aldeidi** (-ale, carbonile in fondo) e **chetoni** (-one, carbonile interno): C=O polare, C sp². **Addizione nucleofila** (aldeidi più reattive): cianidrine, immine, emiacetali/acetali (ciclizzazione degli zuccheri). Ossidazione delle aldeidi ad acidi; riduzione ad alcoli. **Tautomeria cheto-enolica**, enolati, **condensazione aldolica**.", "**Ammine** (primarie, secondarie, terziarie, ammonio quaternario): basi deboli per il doppietto su N; alifatiche più basiche di NH₃, **anilina** meno. Alchilazione, acilazione (ammidi), nitrosazione (**N-nitrosammine** cancerogene), **immine** (basi di Schiff). Colina. **Nitrili** –C≡N: idrolisi ad ammidi e acidi, riduzione ad ammine.", "**Acidi carbossilici** (acido …-oico; formico, acetico, citrico; acidi grassi): legami a idrogeno forti; acidi deboli, carbossilato stabilizzato per risonanza; più forti con sostituenti elettronegativi, più deboli allungando la catena. Reazioni: salificazione, riduzione, **decarbossilazione**, **sostituzione nucleofila acilica**, **esterificazione di Fischer**.", "**Derivati acilici** (reattività): alogenuri acilici > anidridi > tioesteri > esteri > acidi > ammidi. **Esteri** (-oato di -ile), **saponificazione** (saponi), lattoni, **Claisen**; tioesteri ad alta energia (acetil-CoA). **Ammidi**: legame C–N stabile (legame peptidico), lattami (penicillina), **urea**.", "**Derivati fosforici**: esteri fosfati (DNA, fosfolipidi), legami **fosfoanidridici** (ATP), acilfosfati; agenti nervini e bifosfonati. **Eterocicli** (piridina, pirrolo, furano; caffeina, nicotina, eme). **Polimeri**: **poliaddizione** (PE, PP, PVC, PS) e **policondensazione** (nylon, PET, polilattato; proteine, polisaccaridi, acidi nucleici); omopolimeri e copolimeri."],
 ex:[{"t": "Ossidare gli alcoli", "d": "1-propanolo → propanale → acido propanoico; 2-propanolo → propanone (acetone); 2-metil-2-propanolo (terziario) non si ossida."}, {"t": "Ridurre i carbonili", "d": "Propanale → 1-propanolo (alcol primario); butanone → 2-butanolo (alcol secondario)."}, {"t": "Esterificazione e saponificazione", "d": "CH₃COOH + CH₃CH₂OH ⇌ CH₃COOCH₂CH₃ + H₂O (catalisi acida). Con NaOH l'estere dà CH₃COO⁻Na⁺ + etanolo."}, {"t": "Basicità delle ammine", "d": "Dimetilammina > metilammina > ammoniaca > anilina: i gruppi alchilici donano elettroni, l'anello aromatico li sottrae per risonanza."}],
 map:{"centro": "Derivati degli idrocarburi", "rami": [{"t": "Alogenuri", "figli": ["Sɴ1 e Sɴ2", "Eliminazione"]}, {"t": "Composti ossigenati", "figli": ["Alcoli, fenoli, eteri", "Aldeidi e chetoni"]}, {"t": "Composti azotati", "figli": ["Ammine, immine", "Nitrili, ammidi"]}, {"t": "Acidi e derivati", "figli": ["Esteri, anidridi", "Saponificazione"]}, {"t": "Altro", "figli": ["Fosfati, ATP", "Eterocicli, polimeri"]}]}},
cl11:{
 sum:["Le **biomolecole** sono polifunzionali, spesso macromolecole e polimeri di unità ripetitive.", "**Carboidrati** Cₙ(H₂O)ₘ: monosaccaridi **aldosi** e **chetosi**, triosi-esosi. Glucosio (destrosio), galattosio, mannosio, **fruttosio** (levulosio); ribosio e 2-deossiribosio. D/L indipendente dall'attività ottica; **epimeri** (glucosio/mannosio al C2, glucosio/galattosio al C4). In acqua **ciclizzano** a emiacetale (piranosio a 6 termini, furanosio a 5); carbonio **anomerico**, anomeri α e β, **mutarotazione**; glucosio a sedia con –OH equatoriali. Amminozuccheri (N-acetilglucosammina: chitina, peptidoglicano).", "**Reattività degli zuccheri**: riduzione ad **alditoli**; ossidazione ad acidi aldonici, aldarici, alduronici (acido glucuronico); **zuccheri riducenti** (Tollens, Fehling, Benedict); **reazione di Maillard** (prodotti di Amadori, emoglobina glicata); **legame glicosidico** O-, N-, S-.", "**Disaccaridi**: saccarosio (α-glucosio + β-fruttosio), **lattosio** (glucosio + galattosio), maltosio α(1→4), cellobiosio β(1→4). **Oligosaccaridi** (2-10 unità): glicocalice, gruppi sanguigni AB0. **Polisaccaridi**: amido (amilosio lineare α1→4, amilopectina con α1→6), **glicogeno** (fegato e muscolo, molto ramificato), **cellulosa** (β1→4, strutturale); GAG (acido ialuronico, condroitin solfato, eparina anticoagulante).", "**Amminoacidi**: α-amminoacidi della serie **L**, tutti chirali tranne la **glicina**; R apolari, polari neutri, acidi, basici; 9 **essenziali**. Sono anfoteri: **zwitterione** al punto isoelettrico (pI); in **elettroforesi** a pH < pI vanno al catodo, a pH > pI all'anodo.", "**Proteine**: legame **peptidico** (ammidico), N-terminale a sinistra. Struttura **primaria** (sequenza), **secondaria** (α-elica, foglietto β, legami a idrogeno dello scheletro), **terziaria** (interazioni tra le R: ponti disolfuro, idrofobiche, ioniche), **quaternaria** (subunità e gruppi prostetici: emoglobina). **Denaturazione** per calore, pH, solventi.", "**Lipidi** (insolubili in acqua): saponificabili e non. **Acidi grassi** saturi (solidi) e insaturi cis (liquidi), notazione ω; essenziali linolenico (ω-3) e linoleico (ω-6). **Trigliceridi** = glicerolo + 3 acidi grassi (oli insaturi, grassi saturi); **saponificazione** → saponi anfipatici che formano micelle. **Glicerofosfolipidi** e **sfingolipidi** (sfingosina, ceramidi, cerebrosidi, gangliosidi), **steroidi** (colesterolo, lipoproteine, aterosclerosi), **cere**.", "**Nucleotidi** = pentoso + base + fosfati (nucleoside senza fosfato). Basi **puriniche** A, G; **pirimidiniche** C, T (DNA), U (RNA). Base al C1' (N-glicosidico), fosfato al C5'. Polimerizzazione 3'-OH + 5'-fosfato → **ponte fosfodiestereo**; estremità 5' e 3'. **A–T/A–U** (2 legami H), **G–C** (3). Nucleotidi liberi: ATP, GTP, UTP, cAMP, NAD⁺, NADP⁺, FAD."],
 ex:[{"t": "Epimeri del glucosio", "d": "D-glucosio e D-mannosio differiscono solo al C2; D-glucosio e D-galattosio solo al C4. Sono diastereoisomeri, non enantiomeri."}, {"t": "Equilibrio del glucosio in acqua", "d": "Circa 36% di α-glucopiranosio, 64% di β e tracce di forma aperta: per questo il potere rotatorio cambia nel tempo (mutarotazione)."}, {"t": "Regola di Chargaff", "d": "DNA con 20% di A: anche T = 20%, quindi G + C = 60% e C = G = 30%."}, {"t": "Elettroforesi", "d": "Acido aspartico (pI ≈ 2,8) a pH 7 è negativo e migra verso l'anodo; lisina (pI alto) a pH 7 è positiva e va verso il catodo."}],
 map:{"centro": "Propedeutica biochimica", "rami": [{"t": "Carboidrati", "figli": ["Mono-, di-, polisaccaridi", "Ciclizzazione, anomeri"]}, {"t": "Amminoacidi", "figli": ["Serie L, zwitterione", "Punto isoelettrico"]}, {"t": "Proteine", "figli": ["Legame peptidico", "Strutture 1-4"]}, {"t": "Lipidi", "figli": ["Acidi grassi, trigliceridi", "Fosfolipidi, steroidi"]}, {"t": "Acidi nucleici", "figli": ["Nucleotidi", "A–T, G–C"]}]}},

/* ---------- Utilità ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split(/\n{2,}/).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');}
function rich(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
var _tm={};TOPICS.forEach(function(t){_tm[t.id]=t;});
function topicOf(id){return _tm[id];}
function parName(q){var t=topicOf(q.t);if(!t||!t.par||!q.p)return '';for(var i=0;i<t.par.length;i++)if(t.par[i][0]===q.p)return q.p+' '+t.par[i][1];return '';}
function parSel(tid){S.psel=S.psel||{};var a=S.psel[tid],t=topicOf(tid);if(!Array.isArray(a)||!t||!t.par)return [];var ok=t.par.map(function(p){return p[0];});return a.filter(function(x){return ok.indexOf(x)>-1;});}
function parPool(tid){var ps=parSel(tid);return bank().filter(function(q){return q.t===tid&&(!ps.length||ps.indexOf(q.p)>-1);});}
function bookScope(t){return t&&t.par?' Resta SOLO dentro questi paragrafi del capitolo '+t.ch+' del libro dello studente (Alpha Test, '+SUBJ[t.s].n+'), senza argomenti di altri capitoli e senza contenuti in più: '+t.par.map(function(p){return p[0]+' '+p[1];}).join('; ')+'.':'';}
var _bk=null,_bkC=null,_bkN=-1,_qm={},_rm={},_rin=false;
function bank(){if(!_bk||_bkC!==S.custom||_bkN!==S.custom.length){_bk=QB.concat(S.custom);_bkC=S.custom;_bkN=S.custom.length;_qm={};_bk.forEach(function(q){_qm[q.id]=q;});}return _bk;}
function qById(id){bank();return _qm[id];}
function T(id){return S.topics[id]||(S.topics[id]={level:1,streak:0,fragile:false,placed:false});}
function recent(tid,n){var r=[];for(var i=S.log.length-1;i>=0&&r.length<n;i--){if(S.log[i].t===tid&&S.log[i].l!==4)r.push(S.log[i]);}return r;}
function known(tid){if(_rin){var k='k'+tid;if(k in _rm)return _rm[k];return _rm[k]=T(tid).placed||recent(tid,1).length>0;}return T(tid).placed||recent(tid,1).length>0;}
function unresolved(tid){
  var k='u'+(tid||'');if(_rin&&_rm[k])return _rm[k];
  var r=Object.keys(S.errors).filter(function(id){var q=qById(id);return q&&(!tid||q.t===tid)&&S.errors[id].ok<2;});
  if(_rin)_rm[k]=r;return r;
}
function weakness(tid){if(_rin){var k='w'+tid;if(k in _rm)return _rm[k];return _rm[k]=weakness0(tid);}return weakness0(tid);}
function weakness0(tid){var t=T(tid),r=recent(tid,10);if(!r.length&&!t.placed)return 0.5;var acc=r.length?r.filter(function(x){return x.ok;}).length/r.length:0.5;return Math.min((1-acc)*0.6+((3-t.level)/2)*0.4+Math.min(unresolved(tid).length,4)*0.08,1.2);}
function lastAns(qid){for(var i=S.log.length-1;i>=0;i--){if(S.log[i].q===qid)return S.log[i];}return null;}
function levelLabel(tid){var t=T(tid);if(!known(tid))return 'Da valutare';return t.fragile?'Da costruire':LV[t.level];}

function dayKey(t){var d=new Date(t===undefined?Date.now():t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

/* ---------- Selezione domande e registrazione risposte ---------- */
function qWeight(q){
  var t=T(q.t),w=1,e=S.errors[q.id];
  if(e&&e.ok<2)w+=3;
  var l=lastAns(q.id);
  if(!l)w+=1;else if(l.ok&&Date.now()-l.ts<2*864e5)w*=0.3;
  var d=Math.abs(q.l-t.level);w+=d===0?2:d===1?0.5:0;
  w*=(0.6+weakness(q.t)*1.4);
  return Math.max(w,0.05);
}
function pickQuestions(pool,n){
  var arr=pool.map(function(q){return {q:q,w:qWeight(q)};}),out=[];
  while(out.length<n&&arr.length){
    var tot=arr.reduce(function(a,x){return a+x.w;},0),r=Math.random()*tot,i=0;
    for(;i<arr.length;i++){r-=arr[i].w;if(r<=0)break;}
    i=Math.min(i,arr.length-1);out.push(arr[i].q);arr.splice(i,1);
  }
  return out;
}
function record(q,orig,ok,place,conf){
  var up=false,now=Date.now();
  S.log.push({q:q.id,t:q.t,ok:ok,ts:now,c:conf||undefined,l:q.l===4?4:undefined});
  if(q.l===4){S.sf=S.sf||{};var sx=S.sf[q.t]||(S.sf[q.t]={n:0,ok:0});sx.n++;if(ok)sx.ok++;}
  if(S.log.length>600)S.log.splice(0,S.log.length-600);
  var e=S.errors[q.id],c0=S.cards[q.id];
  if(!ok){S.errors[q.id]={n:(e?e.n:0)+1,ok:0,last:orig,ts:now,sure:conf==='s'};S.cards[q.id]={box:0,due:now};}
  else{
    if(e)e.ok=(e.ok||0)+1;
    if(!place&&c0&&c0.due<=now){c0.box=Math.min(4,(c0.box||0)+1);c0.due=now+INT[c0.box]*864e5;}
  }
  bump(1);
  if(!place&&q.l<=3){
    var t=T(q.t);
    if(ok){if(q.l>=t.level){t.streak++;if(t.streak>=2&&t.level<3){t.level++;t.streak=0;t.fragile=false;up=true;}}}
    else if(q.l<=t.level){t.streak=0;if(t.level>1)t.level--;else t.fragile=true;}
  }
  save();
  return up;
}

/* ---------- Mappe e grafici (SVG) ---------- */
function wrap(s,max){
  var w=String(s).split(/\s+/),lines=[],cur='';
  w.forEach(function(x){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x;}else cur=(cur+' '+x).trim();});
  if(cur)lines.push(cur);
  return lines.slice(0,3);
}
function validMap(m){return m&&typeof m.centro==='string'&&Array.isArray(m.rami)&&m.rami.length>=2&&m.rami.every(function(r){return r&&typeof r.t==='string';});}
function mapSVG(m,sv){
  var W=900,H=640,cx=W/2,cy=H/2,nodes=[],edges=[];
  function mk(x,y,text,cls,max){var L=wrap(text,max),fs=cls==='c'?19:cls==='b'?16.5:15;var w=Math.max.apply(null,L.map(function(l){return l.length;}))*fs*0.54+26;var lh=fs*1.22;return {x:x,y:y,w:w,h:L.length*lh+16,L:L,fs:fs,lh:lh,cls:cls};}
  var c=mk(cx,cy,m.centro,'c',14);c.d=0;nodes.push(c);
  var rami=m.rami.slice(0,6),n=rami.length,start=-90-180/n;
  rami.forEach(function(r,i){
    var ang=(start+i*360/n)*Math.PI/180;
    var b=mk(cx+210*Math.cos(ang),cy+140*Math.sin(ang),r.t,'b',16);b.d=0.2+i*0.2;nodes.push(b);edges.push([c,b]);
    var kids=(Array.isArray(r.figli)?r.figli:[]).filter(function(k){return typeof k==='string';}).slice(0,3),m2=kids.length;
    kids.forEach(function(k,j){
      var a2=ang+(j-(m2-1)/2)*(22*Math.PI/180);
      var l=mk(cx+380*Math.cos(a2),cy+262*Math.sin(a2),k,'l',20);l.d=0.35+i*0.2+j*0.1;nodes.push(l);edges.push([b,l]);
    });
  });
  nodes.forEach(function(nd){nd.x=Math.max(nd.w/2+4,Math.min(W-nd.w/2-4,nd.x));nd.y=Math.max(nd.h/2+4,Math.min(H-nd.h/2-4,nd.y));});
  var s='<svg class="mc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mappa concettuale: '+esc(m.centro)+'" style="--sc:var('+sv+')">';
  edges.forEach(function(e){var len=Math.hypot(e[1].x-e[0].x,e[1].y-e[0].y);s+='<line class="mc-e" style="--len:'+len.toFixed(0)+';--d:'+Math.max(0,(e[1].d||0)-0.12).toFixed(2)+'s" x1="'+e[0].x.toFixed(1)+'" y1="'+e[0].y.toFixed(1)+'" x2="'+e[1].x.toFixed(1)+'" y2="'+e[1].y.toFixed(1)+'"/>';});
  nodes.forEach(function(nd){
    s+='<g class="mc-'+nd.cls+'" style="--d:'+(nd.d||0).toFixed(2)+'s"><rect x="'+(nd.x-nd.w/2).toFixed(1)+'" y="'+(nd.y-nd.h/2).toFixed(1)+'" width="'+nd.w.toFixed(1)+'" height="'+nd.h.toFixed(1)+'" rx="'+(nd.cls==='c'?18:nd.cls==='b'?12:8)+'"/>';
    nd.L.forEach(function(l,i){s+='<text x="'+nd.x.toFixed(1)+'" y="'+(nd.y+(i-(nd.L.length-1)/2)*nd.lh+nd.fs*0.34).toFixed(1)+'" text-anchor="middle" font-size="'+nd.fs+'">'+esc(l)+'</text>';});
    s+='</g>';
  });
  return s+'</svg>';
}
function ticks(lo,hi){
  var span=(hi-lo)||1,raw=span/5,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*p,a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,r=[];
  for(var v=a;v<=b+step/2;v+=step)r.push(+v.toFixed(10));
  return r;
}
function nf(v){return String(+(+v).toFixed(2)).replace('.',',');}
function validChart(g){
  if(!g||typeof g!=='object')return false;
  if(g.tipo==='barre')return Array.isArray(g.etichette)&&Array.isArray(g.valori)&&g.etichette.length>=2&&g.etichette.length===g.valori.length&&g.valori.every(function(v){return typeof v==='number'&&isFinite(v);});
  if(g.tipo==='linea')return Array.isArray(g.punti)&&g.punti.length>=2&&g.punti.every(function(p){return Array.isArray(p)&&p.length===2&&p.every(function(v){return typeof v==='number'&&isFinite(v);});});
  return false;

function chartSVG(g,sv){
  var W=640,H=340,L=64,R=24,Tp=46,B=58,pw=W-L-R,ph=H-Tp-B;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafico: '+esc(g.titolo||'')+'" style="--sc:var('+sv+')">';

    yt=ticks(mn,mx);sy=function(v){return Tp+ph-(v-yt[0])/(yt[yt.length-1]-yt[0])*ph;};
    yt.forEach(function(v){s+='<line class="ch-ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'"/><text class="ch-t" x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end">'+nf(v)+'</text>';});
    var n=g.etichette.length,bw=pw/n;
    g.valori.forEach(function(v,i){var x=L+i*bw+bw*0.2,y0=sy(0),y1=sy(v);s+='<rect class="ch-b" x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+bw*0.6+'" height="'+Math.abs(y0-y1)+'" rx="3"/><text class="ch-t" x="'+(L+i*bw+bw/2)+'" y="'+(H-B+20)+'" text-anchor="middle">'+esc(String(g.etichette[i]).slice(0,14))+'</text>';});
  }else{

    xt=ticks(Math.min.apply(null,xs),Math.max.apply(null,xs));yt=ticks(Math.min(0,Math.min.apply(null,ys)),Math.max.apply(null,ys));
    sx=function(v){return L+(v-xt[0])/(xt[xt.length-1]-xt[0])*pw;};sy=function(v){return Tp+ph-(v-yt[0])/(yt[yt.length-1]-yt[0])*ph;};
    yt.forEach(function(v){s+='<line class="ch-ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'"/><text class="ch-t" x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end">'+nf(v)+'</text>';});
    xt.forEach(function(v){s+='<text class="ch-t" x="'+sx(v)+'" y="'+(H-B+20)+'" text-anchor="middle">'+nf(v)+'</text>';});
    s+='<polyline class="ch-l" pathLength="1" points="'+g.punti.map(function(p){return sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1);}).join(' ')+'"/>';
    if(g.punti.length<=12)g.punti.forEach(function(p){s+='<circle class="ch-p" cx="'+sx(p[0]).toFixed(1)+'" cy="'+sy(p[1]).toFixed(1)+'" r="4"/>';});
  }

  s+='<text class="ch-t" x="'+(L+pw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(g.asseX||'')+'</text>';
  s+='<text class="ch-t" transform="translate(16 '+(Tp+ph/2)+') rotate(-90)" text-anchor="middle">'+esc(g.asseY||'')+'</text>';
  return s+'</svg>';
}

var gm=null;
function defPool(scope){
  var out=[];
  TOPICS.forEach(function(t){if(scope!=='all'&&t.s!==scope)return;(DEFS[t.id]||[]).forEach(function(d){out.push({t:t.id,s:t.s,term:d[0],def:d[1]});});});

}
function gScope(){return ui.gscope||'all';}
function othersOf(x,pool){
  var same=pool.filter(function(y){return y.t===x.t&&y.term!==x.term;});
  if(same.length>=3)return same;
  var ss=pool.filter(function(y){return y.s===x.s&&y.term!==x.term;});
  return ss.length>=3?ss:pool.filter(function(y){return y.term!==x.term;});
}
function buildItem(g,x,pool){

  if(g==='tf'){var truth=Math.random()<0.5,w=shuffle(oth)[0];return {term:x.term,def:truth?x.def:w.def,right:x.def,truth:truth,t:x.t};}

}

    gm={g:g,pairs:pairs,tOrder:shuffle(idx(pairs.length)),dOrder:shuffle(idx(pairs.length)),sel:null,done:{},nd:0,miss:0,start:Date.now(),sec:null,shake:null};
  }else if(g==='tf'||g==='guess'){
    gm={g:g,items:shuffle(pool).slice(0,10).map(function(x){return buildItem(g,x,pool);}),i:0,score:0,shown:null,pick:null,streak:0,end:false};
  }else{

    var prev=gm&&gm.g==='order'?gm.seq:null,cand=list.filter(function(s){return s!==prev;});
    var seq=shuffle(cand.length?cand:list)[0],n=seq.i.length,ord;

      if(wn.indexOf(l)<0)m.wrong++;
      var all=w.term.split('').every(function(c){return !isL(c)||m.used[normL(c)];});
      if(all){m.res='win';m.score++;}else if(m.wrong>=m.max)m.res='lose';
      render();return true;
    }
    if(a==='gNext'){
      if(m.i+1>=m.words.length){m.end=true;bestUp('hang',m.score);}
      else{m.i++;m.used={};m.wrong=0;m.res=null;}
      render();scrollTop();return true;
    }
    return false;
  }
  if(m.g==='boss'){
    if(a==='gBoss'&&m.shown===null){
      var q=m.q,orig=m.order[+d.i],ok=orig===q.a;
      record(q,orig,ok,false,null);
      m.chosen=+d.i;m.shown=ok?'ok':'bad';
      if(ok){
        m.score++;m.hp--;m.hit=true;
        if(m.hp<=0){m.monsters++;m.beat=true;m.mi++;m.hpMax=Math.min(12,5+m.monsters);m.hp=m.hpMax;bestUp('boss',m.monsters);}
        m.tok++;var tk=m.tok;
        setTimeout(function(){if(gm&&gm.g==='boss'&&gm.tok===tk&&view==='game'&&gm.shown==='ok'){bossQ();render();}},m.beat?1100:750);
      }else{m.lives--;}
      render();return true;
    }
    if(a==='gNext'){
      if(m.lives<=0){m.end=true;bestUp('boss',m.monsters);}else bossQ();
      render();scrollTop();return true;
    }
    return false;
  }
  return false;
}

function lessonStart(){

function lessonGo(){
  var L=S.lesson;ui.msg='';

  else if(L.step===2)startQuiz('topic',L.tid,{n:5,lesson:true});
  else if(L.step===3){
    var now=Date.now(),ids=(L.wrong||[]).slice();
    bank().forEach(function(q){if(q.t===L.tid&&S.cards[q.id]&&S.cards[q.id].due<=now&&ids.indexOf(q.id)<0)ids.push(q.id);});
    var items=ids.map(qById).filter(Boolean).slice(0,6);
    if(!items.length){finishLesson();view='lessonDone';sess=null;render();scrollTop();return;}
    sess={mode:'cards',items:items,i:0,flipped:false,known:0,review:0,done:false,lesson:true};view='playcards';render();scrollTop();
  }else{view='lessonDone';sess=null;render();scrollTop();}
