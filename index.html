var CONTENT={
fl1:{
 sum:["Una grandezza è **scalare** se basta un numero (con l'unità di misura): tempo, massa, temperatura, densità, lavoro, frequenza, carica elettrica.","Le **7 grandezze fondamentali** sono lunghezza [L], massa [M], tempo [T], intensità di corrente [i], temperatura [K], intensità luminosa e quantità di sostanza. Tutte le altre sono **derivate**.","Analisi dimensionale: i numeri puri e gli angoli non hanno dimensioni; si possono sommare solo grandezze **omogenee**; i due membri di un'equazione hanno le stesse dimensioni.","**SI**: metro, chilogrammo, secondo, ampere, kelvin, candela, mole. Per la sola meccanica si parla di sistema **MKS**; l'altro sistema importante è il **CGS** (cm, g, s).","Notazione scientifica: a · 10ᵇ con una sola cifra diversa da zero prima della virgola. **Ordine di grandezza**: b se |a| < 5, b + 1 se |a| ≥ 5.","Un **vettore** ha modulo, direzione e verso. Si somma con la regola del parallelogramma: |v|² = v₁² + v₂² + 2v₁v₂cos α. La differenza è la somma con l'opposto.","**Prodotto scalare** a·b = ab cos θ (è un numero, commutativo). **Prodotto vettoriale** |a∧b| = ab sen θ, perpendicolare al piano di a e b, verso con la regola della mano destra (anticommutativo).","Errori **sistematici** (sempre nello stesso verso, difficili da scoprire) e **accidentali** (casuali, si riducono facendo la media). Errore assoluto = (xmax − xmin)/2, relativo = e/M, percentuale = relativo × 100.","Propagazione: su somme e differenze si sommano gli **errori assoluti**; su prodotti e quozienti si sommano gli **errori relativi (percentuali)**."],
 ex:[{"t":"Somma di vettori perpendicolari","d":"Due forze di 3 N e 4 N perpendicolari: per Pitagora la risultante vale √(9 + 16) = 5 N."},{"t":"Ordine di grandezza","d":"562,5 = 5,625 · 10²: poiché 5,625 ≥ 5, l'ODG è 2 + 1 = 3. Invece 0,0025 = 2,5 · 10⁻³ ha ODG −3."},{"t":"Errore sull'area di un quadrato","d":"Lato L = (10 ± 2) cm: errore relativo 0,2. L'area A = L² = 100 cm² ha errore relativo 0,2 + 0,2 = 0,4, quindi errore assoluto 0,4 · 100 = 40 cm²."}],
 map:{"centro":"Scalari e vettori","rami":[{"t":"Grandezze scalari","figli":["7 fondamentali","Derivate e dimensioni"]},{"t":"Unità di misura","figli":["SI e CGS","Prefissi, ODG"]},{"t":"Vettori","figli":["Somma e scomposizione","Prodotto scalare e vettoriale"]},{"t":"Errori di misura","figli":["Sistematici e accidentali","Assoluto, relativo, %"]}]}},
fl2:{
 sum:["La **cinematica** descrive il moto senza occuparsi delle cause; la statica studia l'equilibrio, la dinamica le forze.","Un corpo si può trattare come **punto materiale** quando le sue dimensioni sono piccole rispetto agli spostamenti. Quiete e moto hanno senso solo rispetto a un **sistema di riferimento**.","Spostamento Δs = s₂ − s₁ (vettore). **Velocità media** v = Δs/Δt (vettore parallelo a Δs). Velocità istantanea = limite per Δt → 0 (derivata dello spazio).","Da km/h a m/s si **divide per 3,6**; da m/s a km/h si moltiplica per 3,6. La velocità media **non** è la media delle velocità.","**Accelerazione** a = Δv/Δt (m/s²). C'è accelerazione anche se il modulo della velocità è costante, quando cambia la direzione (traiettoria curva).","**MRU**: s = s₀ + v·t; grafico s-t retta con pendenza v, grafico v-t retta orizzontale.","**Moto uniformemente accelerato**: v = v₀ + a·t; s = s₀ + v₀t + ½at²; grafico s-t parabola, v-t retta con pendenza a.","**Caduta libera**: a = g = 9,8 m/s², non dipende da massa o forma. Da fermo: t = √(2h/g), v = √(2gh). Lancio in alto: hmax = v²/(2g), tsalita = v/g.","**Moto circolare uniforme**: T periodo, f = 1/T (Hz), v = 2πr/T, ω = 2π/T = 2πf, v = ω·r, accelerazione centripeta aₙ = v²/r = ω²r verso il centro.","**Moto armonico**: proiezione di un moto circolare uniforme su un diametro; x(t) = A sen(ωt + φ). Velocità massima al centro, nulla agli estremi; accelerazione massima agli estremi.","**Moti composti**: velocità assoluta = relativa + trascinamento (somma vettoriale). Moto parabolico: orizzontale uniforme, verticale uniformemente accelerato."],
 ex:[{"t":"Velocità media di un camion","d":"200 km/h per 0,5 h (100 km), 150 km/h per 1 h (150 km), 50 km/h per 2 h (100 km): 350 km in 3,5 h, quindi 100 km/h (non 133 km/h, che sarebbe la media delle velocità)."},{"t":"Lancio verso l'alto","d":"v₀ = 9,8 m/s: hmax = v²/2g = 96,04/19,6 = 4,9 m; tempo di salita v/g = 1 s; tempo per ricadere = ancora 1 s."},{"t":"La barca nel fiume","d":"Fiume largo 50 m, barca a 5 m/s perpendicolare alla corrente di 10 m/s: attraversa in 10 s e intanto è trascinata a valle di 10 · 10 = 100 m."}],
 map:{"centro":"Cinematica","rami":[{"t":"Grandezze","figli":["Spostamento","Velocità e accelerazione"]},{"t":"Moti rettilinei","figli":["Uniforme: s = vt","Accelerato: s = ½at²"]},{"t":"Caduta libera","figli":["g = 9,8 m/s²","Non dipende dalla massa"]},{"t":"Moti periodici","figli":["Circolare uniforme","Armonico"]},{"t":"Moti composti","figli":["Velocità relative","Moto parabolico"]}]}},
fl3:{
 sum:["**Relatività galileiana**: le leggi della fisica sono le stesse in tutti i sistemi in moto rettilineo uniforme gli uni rispetto agli altri. Un sistema è **inerziale** se vale il principio d'inerzia; la Terra lo è solo in buona approssimazione.","**1ª legge (inerzia)**: con risultante nulla un corpo resta fermo o in moto rettilineo uniforme. **2ª legge**: F = m·a (relazione vettoriale, m = massa inerziale). **3ª legge**: F₁₂ = −F₂₁, forze applicate a corpi diversi.","Newton: 1 N = 1 kg·m/s² = 10⁵ dyn. Si misura con il dinamometro. Nei sistemi non inerziali compaiono **forze apparenti** (es. forza centrifuga, opposta alla centripeta F = mv²/r).","**Quantità di moto** p = m·v (kg·m/s). **Impulso**: F·Δt = Δp. In un sistema isolato la quantità di moto totale si conserva (rinculo del fucile).","**Gravitazione**: F = G·m₁m₂/r², G = 6,67·10⁻¹¹ N·m²/kg², sempre attrattiva. Raddoppiando r la forza diventa ¼. Massa inerziale e gravitazionale hanno lo stesso valore.","**Peso** P = m·g (newton, vettore, dipende dal luogo); la massa è scalare e intrinseca. 1 kg-peso = 9,8 N. Sulla Luna il peso è circa 1/6. Velocità di fuga dalla Terra ≈ 11 km/s.","**Densità** ρ = m/V (kg/m³; acqua 1000 kg/m³). **Peso specifico** = P/V = ρ·g (N/m³). Densità e peso specifico relativi sono adimensionali.","**Momento di una forza** τ = r ∧ F, |τ| = F·b (b = braccio); dipende dal polo. **Coppia**: due forze uguali e opposte con risultante nulla ma momento F·b, uguale rispetto a ogni punto.","**Baricentro**: punto in cui si può pensare concentrato il peso; può stare fuori dal corpo (anello). Equilibrio stabile, instabile, indifferente. Corpo rigido in equilibrio: risultante **e** momento risultante nulli.","**Macchine**: vantaggio V = Fr/Fm. Leve: 1ª specie (fulcro in mezzo, forbici), 2ª (resistenza in mezzo, schiaccianoci, sempre vantaggiosa), 3ª (forza motrice in mezzo, braccio umano, sempre svantaggiosa). Equilibrio: Fm·bm = Fr·br.","Carrucola fissa V = 1; carrucola mobile V = 2; paranco con n carrucole mobili V = 2n. Piano inclinato: Fm = Fr·h/l, V = l/h > 1.","**Momento angolare** L = r ∧ p; nel moto circolare L = m·v·r = I·ω con **I = m·r²**. In un sistema isolato L si conserva (pattinatrice).","**Forza elastica** F = −k·x. Periodo molla T = 2π√(m/k); pendolo semplice T = 2π√(l/g), indipendente da massa e ampiezza.","**Attrito radente** F = f·N, parallelo alla superficie e opposto al moto; f statico > f dinamico. L'attrito volvente è minore del radente; nei fluidi dipende da viscosità, forma, dimensioni e velocità."],
 ex:[{"t":"Teorema dell'impulso","d":"5 kg fermi spinti da 90 N per 2 s: F·Δt = 180 N·s = m·v, quindi v = 180/5 = 36 m/s."},{"t":"I pattinatori","d":"Lui 80 kg, lei 60 kg; lei acquista 2 m/s². Forze uguali e opposte: 80·a = 60·2, quindi a = 1,5 m/s²."},{"t":"La pattinatrice in trottola","d":"Dimezzando il momento d'inerzia, per conservare L = I·ω la velocità angolare raddoppia."},{"t":"Peso specifico del benzene","d":"ρ = 879 kg/m³: peso specifico 879 · 9,8 ≈ 8600 N/m³; densità relativa all'acqua 0,879."}],
 map:{"centro":"Dinamica","rami":[{"t":"Leggi di Newton","figli":["Inerzia","F = m·a","Azione e reazione"]},{"t":"Forze","figli":["Gravitazione e peso","Elastica e attrito"]},{"t":"Conservazione","figli":["Quantità di moto","Momento angolare"]},{"t":"Statica","figli":["Momento e coppie","Equilibrio e baricentro","Leve e carrucole"]}]}},
fl4:{
 sum:["**Lavoro** L = F·s = F·s·cos α (prodotto scalare, grandezza scalare). Si misura in joule: 1 J = 1 N·m = 10⁷ erg.","Il lavoro è positivo se α < 90°, negativo se α > 90°, **nullo** se F = 0, s = 0 o F ⊥ s (es. forza centripeta, peso su un piano orizzontale). È massimo per α = 0°.","**Potenza** P = L/Δt = F·v, in watt (W = J/s). Il **kilowattora** è un lavoro (energia): 1 kWh = 3,6·10⁶ J. 1 CV ≈ 735,5 W; 1 hp ≈ 745,7 W.","**Energia cinetica** Ec = ½mv². **Teorema dell'energia cinetica**: il lavoro della forza è uguale alla variazione di energia cinetica.","**Campo conservativo**: il lavoro delle forze del campo non dipende dal cammino ma solo da posizione iniziale e finale; su un percorso chiuso è nullo. Solo lì si definisce l'**energia potenziale**.","Energia potenziale gravitazionale Ep = m·g·h; elastica Ep = ½kx². Il lavoro delle forze del campo è −ΔEp.","**Conservazione dell'energia meccanica**: con sole forze conservative ½mv² + mgh = costante. L'attrito è non conservativo: l'energia meccanica non si conserva (diventa per esempio energia termica).","Scivolando senza attrito da un'altezza h: v = √(2gh), indipendente da massa e inclinazione. Il pendolo risale alla stessa altezza da cui è partito.","**Urti**: la quantità di moto si conserva **sempre**; l'energia cinetica si conserva solo negli urti **elastici**. Urto perfettamente anelastico: i corpi restano uniti, v' = (m₁v₁ + m₂v₂)/(m₁ + m₂)."],
 ex:[{"t":"Lavoro con angolo","d":"F = 10 N, s = 2 m: con 30° L = 20 · cos 30° ≈ 17,3 J (10√3 J); con 150° il lavoro è negativo, −10√3 J."},{"t":"Centrale elettrica","d":"Un milione di alloggi da 1 kW ciascuno: 10⁶ · 10³ W = 10⁹ W = 1 GW."},{"t":"Energia cinetica di un grave","d":"1 g lasciato cadere da 2 m: Ec = mgh = 10⁻³ · 9,8 · 2 = 0,0196 J."}],
 map:{"centro":"Lavoro ed energia","rami":[{"t":"Lavoro","figli":["L = F·s·cos α","Joule"]},{"t":"Potenza","figli":["P = L/t = F·v","Watt, kWh"]},{"t":"Energia meccanica","figli":["Cinetica ½mv²","Potenziale mgh, ½kx²"]},{"t":"Conservazione","figli":["Forze conservative","Urti"]}]}},
fl5:{
 sum:["Tre stati: **aeriforme** (né forma né volume propri), **liquido** (volume proprio, forma del recipiente), **solido** (forma e volume propri). Un fluido è perfetto se ha viscosità nulla.","Liquido perfetto: incomprimibile e non viscoso. Gas perfetto: comprimibile, perfettamente elastico, non viscoso. Il **gas** non si liquefa per compressione, il **vapore** sì.","Funzioni di stato: **estensive** (volume, numero di moli: additive) e **intensive** (temperatura, pressione: non additive).","**Pressione** P = F⊥/S, in pascal. 1 atm = 760 mmHg = 1,01325 bar = 101325 Pa ≈ 10⁵ Pa; 1 Pa = 10 barie. Volume: 1 L = 1 dm³ = 10⁻³ m³.","Scale termometriche: T(K) = t(°C) + 273,15; T(°F) = 9/5·t(°C) + 32. Il grado Celsius e il kelvin hanno la **stessa ampiezza**. Non esistono temperature kelvin negative.","**Dilatazione**: V = V₀(1 + k·t); lineare L = L₀(1 + γ·t). Per i gas k = 1/273 °C⁻¹ uguale per tutti. L'acqua passando da ghiaccio a liquido diminuisce di volume.","**Passaggi di stato**: fusione, vaporizzazione, sublimazione assorbono energia; solidificazione, liquefazione (condensazione), brinamento la cedono. Durante il passaggio la temperatura resta costante. **Q = m·λ**; per l'acqua λ fusione = 79,7 cal/g, λ evaporazione = 540 cal/g.","Gas perfetti: **Boyle** PV = cost (T cost.), **Charles** V = V₀(1+αt) (P cost.), **Gay-Lussac** P = P₀(1+αt) (V cost.). **PV = nRT** con T in kelvin, R ≈ 8,31 J/(mol·K) = 0,082 L·atm/(mol·K).","**Avogadro**: volumi uguali di gas diversi, a pari P e T, contengono lo stesso numero di molecole; a 0 °C e 1 atm una mole occupa 22,4 L. **Dalton**: pressione totale = somma delle pressioni parziali (Pᵢ = P·nᵢ/n).","**Teoria cinetica**: la pressione nasce dagli urti delle molecole sulle pareti; l'energia cinetica media è ½mv² = 3/2·k·T (k = 1,38·10⁻²³ J/K). A pari T le molecole più leggere sono più veloci.","**Gas reali**: equazione di Van der Waals. Sopra la **temperatura critica** non si liquefanno per sola compressione (acqua 374 °C). Si comportano da gas perfetti ad alte T e basse P.","Ebollizione: quando la **tensione di vapore** uguaglia la pressione esterna. In montagna l'acqua bolle sotto i 100 °C, in pentola a pressione sopra. L'evaporazione avviene a ogni temperatura, solo in superficie.","**Tensione superficiale**: lo strato superficiale si comporta come una pellicola elastica. **Capillarità**: il dislivello h è inversamente proporzionale al raggio del capillare (Jurin-Borelli).","Solidi: covalenti (diamante, durissimi), ionici (NaCl, duri ma fragili), molecolari (teneri, bassa T di fusione), metallici (conduttori, malleabili). Il vetro è un solido amorfo.","**Sforzo** σ = F/S (Pa); **deformazione** ε = ΔL/L₀ (adimensionale). **Hooke**: σ = E·ε, con E modulo di Young (osso 15–20 GPa; tendini 0,5–1,5 GPa). Taglio: τ = G·Δθ."],
 ex:[{"t":"Il binario","d":"Ferro lungo 5 m, γ = 12·10⁻⁶ °C⁻¹, ΔT = 50 °C: ΔL = 5 · 12·10⁻⁶ · 50 = 3 mm. Per questo i binari hanno interruzioni periodiche."},{"t":"Fondere 1 kg di ghiaccio","d":"Q = m·λ = 1000 g · 79,7 cal/g = 79.700 cal."},{"t":"Recipiente chiuso riscaldato","d":"n, R e V costanti: P/T = costante. Se T (in kelvin) raddoppia, anche la pressione raddoppia."}],
 map:{"centro":"Stati di aggregazione","rami":[{"t":"Funzioni di stato","figli":["Pressione","Volume","Temperatura"]},{"t":"Passaggi di stato","figli":["Calore latente","T costante"]},{"t":"Gas","figli":["PV = nRT","Teoria cinetica","Gas reali"]},{"t":"Liquidi","figli":["Ebollizione","Tensione superficiale","Capillarità"]},{"t":"Solidi","figli":["Tipi di solidi","Sforzo e Hooke"]}]}},
fl6:{
 sum:["**Pascal**: in un fluido in quiete (trascurando la gravità) la pressione si trasmette uguale in tutti i punti e in tutte le direzioni; le forze di pressione sono perpendicolari alle superfici.","Forze **superficiali** (es. il pistone) e forze **di volume** (es. il peso). **Lavoro di pressione** L = P·ΔV (es. lavoro del cuore = pressione × gittata sistolica).","**Laplace**: per una sfera sottile ΔP = 2T/r (alveolo, vescica), per un cilindro sottile ΔP = T/r (vasi). Se il raggio di un vaso aumenta, aumenta la tensione sulla parete (aneurisma).","**Stevino**: P = ρ·g·h, la pressione cresce con la profondità; in acqua aumenta di circa 1 atm ogni 10 m. Non dipende dalla forma del recipiente (**vasi comunicanti**: il liquido raggiunge la stessa altezza).","**Archimede**: un corpo immerso riceve una spinta verso l'alto pari al peso del fluido spostato. Galleggia se la sua densità è minore di quella del fluido; equilibrio: ρf·Vimmerso = ρc·Vcorpo.","La spinta si applica al **centro di spinta** (baricentro del fluido spostato). Equilibrio stabile se il baricentro del corpo è sotto il centro di spinta.","**Regime stazionario**: in ogni punto velocità, pressione e densità non cambiano nel tempo. **Torricelli**: velocità di efflusso v = √(2gh).","**Continuità**: S₁v₁ = S₂v₂ (fluido incomprimibile): dove il condotto si restringe il fluido accelera. Portata volumica Q = S·v.","**Bernoulli**: P + ρgh + ½ρv² = costante. **Venturi**: se la sezione diminuisce, la velocità aumenta e la pressione diminuisce.","**Viscosità** = attrito interno (unità: Pa·s, poiseuille). **Stokes**: F = 6πηrv. Un corpo che cade in un fluido raggiunge una velocità limite. Perdita di carico: la pressione cala lungo il condotto.","**Reynolds** Re = ρvd/η (adimensionale): laminare < 2000, transizione 2000–4000, turbolento > 4000. **Poiseuille**: Q = πΔP r⁴/(8ηL): la portata dipende dalla quarta potenza del raggio.","Sangue: plasma (≈90% acqua) + parte corpuscolare (globuli rossi, bianchi, piastrine). **Ematocrito** ≈ volume dei globuli rossi / volume totale. **VES** normale 0–20 mm/h.","Cuore: 2 atri e 2 ventricoli, 4 valvole. Lavoro per battito ≈ 120 mmHg (1,6·10⁴ Pa) × 70 mL ≈ 1,1 J; potenza totale a riposo 1,5–2,5 W. FC massima (Astrand): uomini 220 − età, donne 226 − età."],
 ex:[{"t":"Il sub a 10 m","d":"P idrostatica = ρgh = 1000 · 9,8 · 10 ≈ 10⁵ Pa ≈ 1 atm; con l'atmosfera sopra, il sub sente circa 2 atm."},{"t":"Il corpo che galleggia","d":"Volume 300 dm³, ne emergono 60 dm³: è immerso per 8/10, quindi la sua densità è 0,8 volte quella dell'acqua."},{"t":"Reynolds in un'arteria","d":"ρ = 1050 kg/m³, v = 0,5 m/s, d = 4 mm, η = 4·10⁻³ Pa·s: Re = 1050 · 0,5 · 0,004 / 0,004 = 525, flusso laminare."}],
 map:{"centro":"Meccanica dei fluidi","rami":[{"t":"Idrostatica","figli":["Pascal","Stevino","Archimede"]},{"t":"Fluidodinamica","figli":["Continuità","Bernoulli e Venturi","Torricelli"]},{"t":"Fluidi reali","figli":["Stokes","Reynolds","Poiseuille"]},{"t":"Biologia","figli":["Sangue e VES","Lavoro del cuore"]}]}},
fl7:{
 sum:["Il **calore** è energia scambiata tra corpi a temperature diverse; non è una funzione di stato. Si misura in joule; **1 cal = 4,186 J** (equivalente meccanico della caloria, esperienza di Joule). 1 kcal = 1 Cal = 1000 cal.","Trasmissione: **conduzione** (tipica dei solidi, senza spostamento di materia), **convezione** (tipica dei fluidi, con spostamento di materia), **irraggiamento** (onde elettromagnetiche, anche nel vuoto: il calore del Sole).","**Capacità termica** C = Q/ΔT (J/K). **Calore specifico** c = Q/(m·ΔT) (J/kg·K). **Q = c·m·ΔT**. Acqua: 1 cal/g·°C = 4186 J/kg·K; ghiaccio 0,5 cal/g·°C. Nei gas: cp − cv = R (Mayer).","**Equilibrio termico** (sistema isolato): calore ceduto = calore assorbito. Stessa sostanza: Te = (m₁T₁ + m₂T₂)/(m₁ + m₂).","Sistemi **isolati** (né materia né energia), **chiusi** (solo energia), **aperti** (materia ed energia). Convenzioni: Q > 0 se assorbito; L > 0 se compiuto dal sistema (espansione).","Piano PV: **isoterma** (T cost., iperbole), **isobara** (P cost., retta orizzontale), **isocora** (V cost., retta verticale), **adiabatica** (Q = 0, curva più ripida dell'isoterma).","**Primo principio**: ΔU = Q − L. U è funzione di stato (nei gas perfetti dipende solo da T); Q e L no. Isoterma: Q = L. Isocora: ΔU = Q. Adiabatica: ΔU = −L. Isobara: L = P·ΔV.","**Rendimento** η = L/Qc = 1 − Qf/Qc < 1. **Carnot** (2 isoterme + 2 adiabatiche): η = 1 − Tf/Tc con T in kelvin, il massimo possibile. Il lavoro è l'area del ciclo. Il frigorifero percorre il ciclo al contrario.","Trasformazioni **reversibili**: successione di stati di equilibrio, percorribili nei due versi; quelle reali (con attriti) sono irreversibili. **Entropia**: ΔS = Q/T (reversibile); S = k·ln W misura il disordine.","**Secondo principio** (enunciati equivalenti): Kelvin (non si trasforma integralmente in lavoro il calore di una sola sorgente), Clausius (il calore passa spontaneamente dal caldo al freddo), entropia (in un sistema isolato le trasformazioni spontanee aumentano l'entropia). Impossibili i moti perpetui di 1ª e 2ª specie.","**Entalpia** H = U + PV: a pressione costante ΔH = calore scambiato; ΔH < 0 esotermica, ΔH > 0 endotermica. **Gibbs** G = H − TS: ΔG < 0 spontanea, ΔG > 0 non spontanea, ΔG = 0 equilibrio.","Metabolismo basale adulto ≈ 1 kcal/(kg·h). Energia dei nutrienti: carboidrati e proteine ≈ 4 kcal/g, grassi ≈ 9 kcal/g. Rendimento del corpo umano 20–25%."],
 ex:[{"t":"Mescolare acqua","d":"200 g a 20 °C + 500 g a 80 °C: Te = (200·20 + 500·80)/700 ≈ 62,9 °C."},{"t":"Carnot al 20%","d":"Tf = 27 °C = 300 K, η = 0,2: Tc = Tf/(1 − η) = 300/0,8 = 375 K = 102 °C."},{"t":"Metabolismo basale","d":"Uomo di 80 kg: 1 kcal/(kg·h) · 80 kg · 24 h = 1920 kcal ≈ 8·10⁶ J al giorno, cioè circa 93 W."}],
 map:{"centro":"Termodinamica","rami":[{"t":"Calore","figli":["1 cal = 4,186 J","Conduzione, convezione, irraggiamento"]},{"t":"Calorimetria","figli":["Q = c·m·ΔT","Equilibrio termico"]},{"t":"Principi","figli":["ΔU = Q − L","Secondo principio, entropia"]},{"t":"Macchine","figli":["Rendimento","Ciclo di Carnot"]},{"t":"Chimica e biologia","figli":["Entalpia, Gibbs","Metabolismo"]}]}},
fl8:{
 sum:["Cariche di segno opposto si attraggono, dello stesso segno si respingono. La carica si misura in **coulomb** (non è grandezza fondamentale del SI: [Q] = [i][T]). **Conduttori** (cariche libere, es. metalli) e **isolanti/dielettrici** (vuoto, aria, ceramica, carta, acqua distillata).","**Coulomb**: F = K₀·Q₁Q₂/r², K₀ = 1/(4πε₀) = 9·10⁹ N·m²/C². Raddoppiando la distanza la forza diventa ¼.","In un mezzo F = Q₁Q₂/(4πε₀εᵣr²): la **costante dielettrica relativa** εᵣ ≥ 1 (adimensionale) riduce la forza per polarizzazione. Acqua εᵣ = 81, aria ≈ 1,0006, vuoto 1.","Rispetto alla gravità: la forza elettrica dipende dal mezzo, può essere repulsiva ed è molto più intensa (nell'atomo di idrogeno circa 10³⁹ volte).","**Campo elettrico** E = F/q (N/C = V/m); da una carica puntiforme E = K₀Q/r², non dipende dalla carica esploratrice. Vale la **sovrapposizione**. Le linee di forza escono dalle cariche positive ed entrano nelle negative.","Su una carica negativa la forza è opposta al campo. Una carica libera **non** segue in generale le linee di forza curve.","**Energia potenziale** Ep = K₀Qq/r (J): lavoro contro il campo per portare q dall'infinito. **Potenziale** V = Ep/q = K₀Q/r (volt, scalare). **Lavoro del campo** da A a B: L = q(V_A − V_B).","**Superfici equipotenziali**: perpendicolari alle linee di campo; spostarsi su di esse non richiede lavoro. E = ΔV/Δs, diretto dai potenziali alti ai bassi; tra due piastre E = ΔV/d (uniforme).","**Gauss**: flusso Φ = Q/ε₀. Nei conduttori in equilibrio la carica sta sulla superficie, il campo interno è nullo, tutti i punti hanno lo stesso potenziale; la carica si concentra sulle punte.","**Capacità** C = Q/V, in **farad** (F = C/V). Condensatore piano C = ε·S/d, campo interno uniforme E = ΔV/d. Lavoro di carica L = ½Q·ΔV = ½C·ΔV². ε si misura in F/m.","**Elettronvolt**: 1 eV = 1,6·10⁻¹⁹ J. La carica è **quantizzata** (multiplo di e = 1,6·10⁻¹⁹ C), si **conserva** in un sistema isolato ed è uno **scalare**.","**Pacemaker**: generatore (batteria + circuito) ed elettrocateteri; impulsi di 2–5 V, pochi µA, circa 0,5 ms. Interviene se il nodo senoatriale (atrio destro) non funziona bene, per esempio nelle bradicardie."],
 ex:[{"t":"Coulomb e distanza","d":"Due cariche a 1 m si attraggono con 1 N; a 2 m la forza diventa 1/4 N."},{"t":"Due cariche uguali","d":"Nel punto medio tra due cariche positive uguali il campo è nullo (i due campi si annullano), ma il potenziale è 2K₀Q/d (gli scalari si sommano)."},{"t":"Lavoro del campo","d":"+8 C da 6 V a 2 V: L = q(V_A − V_B) = 8 · 4 = +32 J."}],
 map:{"centro":"Elettrostatica","rami":[{"t":"Cariche","figli":["Coulomb","Quantizzazione e conservazione"]},{"t":"Campo elettrico","figli":["E = F/q","Linee di forza"]},{"t":"Potenziale","figli":["V = K₀Q/r","Equipotenziali"]},{"t":"Conduttori","figli":["Gauss","Capacità e condensatori"]}]}},
fl9:{
 sum:["Corrente = moto ordinato di cariche dovuto a una d.d.p. Nei metalli si muovono gli **elettroni**, in verso opposto al campo; nei liquidi e nei gas anche gli ioni. Per convenzione il **verso della corrente** è quello delle cariche positive.","**Intensità di corrente** i = ΔQ/Δt, in **ampere** (1 A = 1 C/s): è una grandezza fondamentale del SI ed è scalare. Corrente **continua** (intensità e verso costanti) o **alternata** (verso che si inverte periodicamente).","**1ª legge di Ohm**: ΔV = R·i (resistenza in ohm, Ω = V/A). **2ª legge**: R = ρ·l/S (ρ resistività, Ω·m; conducibilità = 1/ρ).","Nei metalli la resistenza **aumenta** con la temperatura; nei **semiconduttori diminuisce**. Sotto la temperatura critica i **superconduttori** hanno resistenza quasi nulla.","Resistività crescente: argento, rame, alluminio… (conduttori); germanio, silicio… (semiconduttori); mica, vetro, quarzo, porcellana, ambra, paraffina (isolanti).","**Effetto Joule**: energia dissipata E = R·i²·Δt = ΔV·i·Δt; potenza **P = R·i² = ΔV·i = ΔV²/R**. In calorie: Q = R·i²·Δt / 4,186.","**Forza elettromotrice**: lavoro del generatore per unità di carica (volt); coincide con la d.d.p. ai capi a **circuito aperto**. Con resistenza interna r: f.e.m. = (R + r)·i = ΔV + r·i.","**Amperometro** in **serie** (misura la corrente); **voltmetro** in **parallelo** (misura la d.d.p.).","Resistenze in **serie**: Req = R₁ + R₂ (maggiore di ciascuna). In **parallelo**: 1/Req = 1/R₁ + 1/R₂ (minore di ciascuna).","Condensatori: al contrario. In **parallelo** Ceq = C₁ + C₂; in **serie** 1/Ceq = 1/C₁ + 1/C₂.","In serie gli elementi hanno la **stessa corrente**; in parallelo la **stessa d.d.p.** **Kirchhoff**: 1) in ogni nodo correnti entranti = uscenti; 2) in ogni maglia la somma delle f.e.m. = somma delle d.d.p.","L'acqua distillata non conduce; diventa conduttrice con un **elettrolita**. Liquidi e gas (ionizzati) sono **conduttori di seconda specie** e non seguono la legge di Ohm. I **raggi catodici** sono elettroni emessi dal catodo (≈ 1/3 della velocità della luce)."],
 ex:[{"t":"La lampadina","d":"Resistenza 100 Ω, capi a 2 V e 8 V: ΔV = 6 V, i = 6/100 = 0,06 A = 60 mA."},{"t":"Tre resistenze in parallelo","d":"200 Ω, 200 Ω e 100 Ω: 1/Req = 1/200 + 1/200 + 2/200 = 4/200 ⇒ Req = 50 Ω."},{"t":"Quattro condensatori da 100 pF","d":"In parallelo darebbero 400 pF; in serie 1/Ceq = 4/100 ⇒ Ceq = 25 pF."}],
 map:{"centro":"Elettrodinamica","rami":[{"t":"Corrente","figli":["i = ΔQ/Δt","Continua e alternata"]},{"t":"Ohm","figli":["ΔV = R·i","R = ρl/S"]},{"t":"Energia","figli":["Effetto Joule","P = R·i²"]},{"t":"Circuiti","figli":["Serie e parallelo","Kirchhoff","f.e.m. e resistenza interna"]}]}},
fl10:{
 sum:["I **magneti** (es. magnetite) attraggono il ferro; la Terra è un grande magnete. Poli uguali si respingono, opposti si attraggono. **Non si può isolare un monopolo**: spezzando una calamita si ottengono altri dipoli.","Oersted (1820): un filo percorso da corrente genera un campo magnetico. Una carica ferma genera solo un campo elettrico; una carica **in moto** genera anche un campo magnetico.","Le linee del campo magnetico sono **sempre chiuse** (quelle elettriche in genere aperte). Il campo magnetico **non è conservativo**: non si definisce un'energia potenziale magnetica.","**Induzione magnetica B**: direzione dell'ago magnetico, verso dal sud al nord dell'ago. Si misura in **tesla** (1 T = 1 Wb/m²; 1 Wb = 1 V·s).","**Forza di Lorentz** F = q·v ∧ B, modulo q·v·B·sen θ: perpendicolare a v e B, **non compie lavoro**. Se v ∥ B nessuna deviazione; se v ⊥ B moto circolare uniforme con **r = mv/(qB)**; altrimenti moto a spirale.","**Biot-Savart**: filo rettilineo B = μ₀μᵣ·i/(2πr), linee circolari concentriche (regola della mano destra). **Spira** al centro B = μ₀i/(2R). **Solenoide**: campo interno uniforme B = μ₀·n·i/l, esterno trascurabile.","Forza su un filo: F = i·l ∧ B (massima se il filo è perpendicolare a B). Due fili paralleli: correnti **concordi si attraggono**, discordi si respingono; F = μ₀i₁i₂l/(2πd).","**Flusso** Φ(B) = B·S·cos θ, in weber (T·m²). **Induzione elettromagnetica**: c'è corrente indotta solo se **varia il flusso** concatenato.","**Faraday-Neumann-Lenz**: f.e.m. = −ΔΦ/Δt. **Lenz**: la corrente indotta genera un campo che si oppone alla variazione di flusso che l'ha prodotta.","**Correnti di Foucault**: correnti indotte in lamine metalliche, dissipative (effetto Joule). **Autoinduzione**: Φ = L·i, L induttanza in **henry**; f.e.m. autoindotta −L·Δi/Δt; extracorrenti all'apertura/chiusura.","**Corrente alternata**: spira che ruota in un campo; i = i₀·sen(ωt). **Valore efficace** i_eff = i₀/√2 (stessa dissipazione Joule di una corrente continua). **Impedenza** Z: f.e.m.₀ = Z·i₀.","**Pila** (chimica → elettrica), **accumulatore** (reversibile), **dinamo** (meccanica → continua), **alternatore** (meccanica → alternata), **motore elettrico** (elettrica → meccanica).","**Trasformatore**: V₂/V₁ = n₂/n₁. Per il trasporto si alza la tensione e si abbassa la corrente, perché le perdite per effetto Joule dipendono da i²."],
 ex:[{"t":"Protone nel campo","d":"q = 1,6·10⁻¹⁹ C, v = 2 m/s ⊥ B = 1 T: F = qvB = 3,2·10⁻¹⁹ N; percorre una circonferenza. Un elettrone girerebbe in verso opposto."},{"t":"Due particelle sulla stessa circonferenza","d":"Stessa carica, stesso B, stesso raggio: r = mv/(qB) ⇒ m·v uguale. Se mA = 2mB, allora vA = vB/2."},{"t":"Magnete e spira","d":"Avvicinando il magnete il flusso aumenta e nasce una corrente; allontanandolo la corrente si inverte; con il magnete fermo non c'è corrente."}],
 map:{"centro":"Magnetismo","rami":[{"t":"Campo magnetico","figli":["Linee chiuse","Tesla"]},{"t":"Forze","figli":["Lorentz","Fili paralleli"]},{"t":"Sorgenti","figli":["Filo, spira, solenoide"]},{"t":"Induzione","figli":["Faraday-Neumann-Lenz","Autoinduzione"]},{"t":"Applicazioni","figli":["Corrente alternata","Trasformatore"]}]}},
fl11:{
 sum:["Un'**onda** è un'oscillazione che si propaga trasportando **energia ma non materia** (il tappo di sughero oscilla solo in verticale).","Onde **meccaniche** (serve un mezzo, non vanno nel vuoto: es. il suono) ed **elettromagnetiche** (anche nel vuoto: la luce). **Trasversali** (vibrazione ⊥ propagazione: onde sull'acqua, luce) e **longitudinali** (vibrazione ∥ propagazione: suono nei fluidi).","Nei solidi onde longitudinali e trasversali; dentro liquidi e gas solo longitudinali; sulla superficie dei liquidi trasversali.","**Periodo** T, **frequenza** f = 1/T (Hz), **lunghezza d'onda** λ (distanza percorsa in un periodo), **velocità** v = λ·f = λ/T. T e f sono proprie dell'onda; λ, v e ampiezza dipendono dal mezzo. 1 Å = 10⁻¹⁰ m.","**Fase**: concordanza, opposizione, quadratura. **Fronte d'onda**: punti con la stessa fase, perpendicolare alla propagazione. **Intensità** (W/m²) ∝ ampiezza² · frequenza²: costante per onde piane, ∝ 1/r per circolari, ∝ 1/r² per sferiche.","**Riflessione**: angolo di incidenza = angolo di riflessione. **Rifrazione** (Snell): sen i / sen r = n₂/n₁ = v₁/v₂; la luce rallenta dove n è maggiore (v = c/n) e si avvicina alla normale.","**Riflessione totale**: passando a un mezzo meno rifrangente, oltre l'angolo limite (sen θ = n₂/n₁; vetro-aria ≈ 41,8°). **Diffusione** da superfici scabre. **Diffrazione**: evidente con ostacoli o fenditure di dimensioni simili a λ (Huygens-Fresnel). **Interferenza** costruttiva/distruttiva; **onde stazionarie** con nodi e ventri.","**Suono**: onda meccanica longitudinale nei fluidi; udibile tra **16 Hz e 20.000 Hz**. Velocità: 340 m/s in aria, 1450 m/s in acqua, 5130 m/s nel ferro.","Caratteri: **altezza** (frequenza), **intensità** (I = P/(4πr²)), **timbro** (forma d'onda). Livello sonoro L = 10·log(I/I₀) dB: soglia di udibilità 0 dB, soglia del dolore 120 dB. Suono periodico, rumore no.","**Eco**: serve un ritardo di almeno 0,1 s, quindi una parete ad almeno 17 m. **Risonanza**: un corpo vibra se colpito da un'onda alla sua frequenza propria (diapason, ponte e passo di marcia).","**Effetto Doppler**: la frequenza percepita aumenta quando sorgente e ascoltatore si avvicinano, diminuisce quando si allontanano (sirena dell'ambulanza). **Infrasuoni** < 16 Hz; **ultrasuoni** > 20 kHz (ecografia 2–15 MHz; risoluzione assiale λ/2; impedenza acustica Z = ρ·v).","**Onde e.m.**: campi E e B perpendicolari tra loro e alla propagazione, in fase; nel vuoto **c = 3·10⁸ m/s** (Maxwell). Luce visibile 380 nm (violetto) – 760 nm (rosso). Fotoni: **E = h·f**: più frequenza, più energia (infrarosso < visibile < ultravioletto).","**Dispersione**: n dipende dalla frequenza; nel prisma il rosso è il meno deviato, il violetto il più deviato (arcobaleno). Illuminazione in lux (legge di Lambert ∝ 1/r²). **Polarizzazione** per assorbimento, riflessione (angolo di Brewster), diffusione.","**Specchio piano**: immagine virtuale, diritta, simmetrica, stesse dimensioni e stessa distanza. Specchi sferici: f = r/2; concavo convergente, convesso divergente (immagine sempre virtuale, diritta, rimpicciolita).","**Punti coniugati**: 1/p + 1/q = 1/f (specchi e lenti sottili). **Potere diottrico** P = 1/f (f in metri, diottrie): positivo per lenti convergenti, negativo per divergenti.","**Miopia**: immagine prima della retina, lente divergente. **Ipermetropia**: dopo la retina, lente convergente (biconvessa). **Presbiopia**: minor accomodazione. Microscopio: obiettivo + oculare, ingrandimento totale = prodotto dei due."],
 ex:[{"t":"La corda col fiocchetto","d":"f = 2 Hz e distanza massimo-minimo 2 m ⇒ λ = 4 m; v = λ·f = 8 m/s. Il fiocchetto non avanza: l'onda è trasversale."},{"t":"L'eco","d":"Il suono va e torna (2d) in almeno 0,1 s: d = 340 · 0,1 / 2 = 17 m."},{"t":"Potere diottrico","d":"Lente convergente con f = 20 cm = 0,2 m: P = 1/0,2 = +5 diottrie."}],
 map:{"centro":"Onde","rami":[{"t":"Tipi","figli":["Meccaniche ed e.m.","Trasversali e longitudinali"]},{"t":"Grandezze","figli":["v = λ·f","Intensità"]},{"t":"Fenomeni","figli":["Riflessione e rifrazione","Diffrazione e interferenza"]},{"t":"Suono","figli":["Decibel, eco, risonanza","Doppler, ultrasuoni"]},{"t":"Luce e ottica","figli":["Spettro, fotoni","Specchi e lenti"]}]}},
fl12:{
 sum:["Atomo: **nucleo** (protoni + neutroni = nucleoni, fatti di quark) ed **elettroni**. **Z** = numero atomico (protoni), **A** = numero di massa (protoni + neutroni). **Isotopi**: stesso Z, diverso A (es. ¹⁶O e ¹⁸O; ¹²C, ¹³C, ¹⁴C).","Forze di legame: interazione **forte** nel nucleo; **elettrostatica** tra nucleo ed elettroni e nei legami delle molecole semplici; **elettromagnetica** tra molecole complesse (proteine, DNA).","**Radiazioni ionizzanti** (raggi X, α, β, γ) strappano elettroni e creano ioni e radicali liberi: possono danneggiare il DNA, ma si usano in radioterapia. **Non ionizzanti**: UV, luce visibile, microonde, onde radio (risonanza magnetica, fototerapia, diatermia).","**Fusione**: nuclei piccoli si uniscono (idrogeno → elio nel Sole, 4·10²⁶ J/s). **Fissione**: un nucleo grande si spezza, per esempio ²³⁵U colpito da un neutrone lento; i neutroni prodotti danno una **reazione a catena**. Barre di controllo (cadmio) assorbono neutroni; il moderatore (acqua pesante) li rallenta.","**Quattro forze**, dalla più intensa: **forte** (tiene uniti i nucleoni), **debole** (decadimento β), **elettromagnetica** (dall'atomo all'universo), **gravitazionale** (la più debole, conta su grandi scale). Debole ed elettromagnetica sono unificate nell'**elettrodebole**.","**Radioattività**: nuclei instabili si trasformano spontaneamente; si conservano Z e A totali. **α** (nucleo di elio): A − 4, Z − 2. **β⁻** (elettrone): Z + 1. **β⁺** (positrone): Z − 1. **γ** (fotone): A e Z invariati.","Penetrazione: **α** fermate da un foglio di carta o dalla pelle; **β** da pochi mm di alluminio; **γ** servono piombo o cemento.","**Dose assorbita** D = E/m in **gray** (J/kg). **Dose equivalente** H = w·D in **sievert**; w = 1 per raggi X, β e γ, 3–11 per neutroni, 20 per α. Circa 4 Sv: morte nel 50% dei casi.","Decadimento esponenziale: N(t) = N₀·e^(−λt) = N₀·2^(−t/T½). Il **tempo di dimezzamento** T½ è il tempo in cui decade metà dei nuclei; T½ = τ·ln 2 (τ vita media). Attività in **becquerel** (1 decadimento/s); 1 Ci = 3,7·10¹⁰ Bq.","**Laser** (emissione stimolata): luce monocromatica, unidirezionale, energia concentrata (chirurgia, metalli). **Raggi X** (Röntgen, 1895): salti degli elettroni interni, f > 10¹⁵ Hz, penetranti, non deviati da campi. **Raggi γ**: ancora più energetici, nascono dal nucleo.","**TAC**: usa i raggi X da molte angolazioni; i tessuti più densi attenuano di più e appaiono più chiari. Dà immagini di sezioni e 3D, ma con dose maggiore della radiografia tradizionale."],
 ex:[{"t":"Decadimento α dell'uranio","d":"²³⁸U (Z = 92) emette una particella α e diventa torio-234 (Z = 90): A cala di 4, Z di 2."},{"t":"Decadimento β⁻ del cobalto","d":"⁶⁰Co (Z = 27) diventa ⁶⁰Ni (Z = 28): un neutrone si trasforma in protone, A non cambia."},{"t":"Dimezzamenti","d":"Dopo 3 tempi di dimezzamento resta 1/2 · 1/2 · 1/2 = 1/8 dei nuclei iniziali."}],
 map:{"centro":"Materia e radiazioni","rami":[{"t":"Atomo","figli":["Z e A","Isotopi"]},{"t":"Nucleo","figli":["Fusione e fissione","Quattro forze"]},{"t":"Radioattività","figli":["α, β, γ","Tempo di dimezzamento","Gray e sievert"]},{"t":"Radiazioni e.m.","figli":["Laser","Raggi X, γ e TAC"]}]}},
ch_atomo:{
 sum:[`Il numero atomico **Z** è il numero di protoni; il numero di massa **A** è protoni + neutroni. Nell'atomo neutro gli elettroni sono uguali ai protoni.`,`Gli **isotopi** hanno lo stesso Z ma un diverso numero di neutroni.`,`Gli elettroni occupano gli orbitali (s, p, d, f) in ordine di energia crescente, al massimo 2 per orbitale (principio di Pauli); negli orbitali della stessa energia si dispongono prima da soli (regola di Hund).`,`Nella tavola periodica i **gruppi** (colonne) hanno lo stesso numero di elettroni di valenza; i **periodi** (righe) corrispondono al livello energetico più esterno.`,`Lungo un periodo (verso destra) aumentano elettronegatività ed energia di ionizzazione e diminuisce il raggio. Lungo un gruppo (verso il basso) il raggio aumenta e l'elettronegatività diminuisce.`],
 ex:[{t:`Il sodio`,d:`Na: Z = 11, A = 23, quindi 11 protoni, 12 neutroni, 11 elettroni. Perdendo un elettrone diventa Na⁺ con la configurazione del neon.`},{t:`Il cloro`,d:`Cl (Z = 17): 1s² 2s² 2p⁶ 3s² 3p⁵. Acquistando un elettrone diventa Cl⁻ con 1s² 2s² 2p⁶ 3s² 3p⁶, come l'argon.`}],
 map:{centro:`Atomo`,rami:[{t:`Nucleo`,figli:[`Protoni (Z)`,`Neutroni`]},{t:`Elettroni`,figli:[`Orbitali s, p, d, f`,`Configurazione elettronica`]},{t:`Isotopi`,figli:[`Stesso Z`,`Diverso A`]},{t:`Tavola periodica`,figli:[`Gruppi: elettroni di valenza`,`Periodi: livelli energetici`]}]}},
ch_legami:{
 sum:[`**Legame ionico**: trasferimento di elettroni tra un metallo e un non metallo (grande differenza di elettronegatività), per esempio NaCl.`,`**Legame covalente**: condivisione di coppie di elettroni. È polare se gli atomi hanno elettronegatività diversa (H–O) e apolare se è uguale (H–H).`,`La forma delle molecole si prevede con il modello **VSEPR**: le coppie di elettroni (di legame e solitarie) si respingono e si dispongono il più lontano possibile.`,`Forze intermolecolari: dispersione di London, dipolo-dipolo, **legame a idrogeno** (H legato a F, O o N). Più sono forti, più alto è il punto di ebollizione.`],
 ex:[{t:`L'acqua`,d:`L'ossigeno è molto elettronegativo, quindi la molecola è polare e angolare (due coppie solitarie). Tra le molecole si formano legami a idrogeno: per questo l'acqua bolle a 100 °C mentre H₂S è un gas a temperatura ambiente.`},{t:`L'ammoniaca`,d:`NH₃ ha 3 coppie di legame e 1 solitaria: geometria piramidale trigonale, con angoli di circa 107°.`}],
 map:{centro:`Legami chimici`,rami:[{t:`Ionico`,figli:[`Metallo + non metallo`,`Reticolo cristallino`]},{t:`Covalente`,figli:[`Coppie condivise`,`Polare o apolare`]},{t:`Forma (VSEPR)`,figli:[`Coppie solitarie`,`Geometria molecolare`]},{t:`Forze intermolecolari`,figli:[`Legame a idrogeno`,`Dispersione di London`]}]}},
ch_mole:{
 sum:[`La **mole** è la quantità di sostanza che contiene 6,022 × 10²³ entità (numero di Avogadro).`,`La massa molare M (g/mol) coincide numericamente con la massa atomica o molecolare. Si usa **n = m / M**.`,`In una reazione bilanciata i coefficienti indicano i rapporti tra le **moli**, non tra i grammi.`,`Il **reagente limitante** è quello che si esaurisce per primo e decide quanto prodotto si forma.`,`Molarità: **M = n / V** (mol/L). Nelle diluizioni vale M₁V₁ = M₂V₂.`],
 ex:[{t:`Dai grammi alle molecole`,d:`18 g di H₂O = 1 mol (M = 18 g/mol) = 6,022 × 10²³ molecole.`},{t:`Reagente limitante`,d:`2 H₂ + O₂ → 2 H₂O con 4 mol di H₂ e 1 mol di O₂. Per usare tutto l'H₂ servirebbero 2 mol di O₂, ma ce n'è 1: O₂ è limitante e si formano 2 mol di H₂O.`}],
 map:{centro:`Mole e stechiometria`,rami:[{t:`Mole`,figli:[`Numero di Avogadro`,`n = m / M`]},{t:`Reazioni`,figli:[`Bilanciamento`,`Rapporti molari`]},{t:`Reagente limitante`,figli:[`Si esaurisce per primo`,`Determina la resa`]},{t:`Concentrazione`,figli:[`Molarità = n / V`,`Diluizione: M₁V₁ = M₂V₂`]}]}},
ch_ph:{
 sum:[`**pH = −log[H⁺]** e pOH = −log[OH⁻]. A 25 °C, pH + pOH = 14.`,`pH < 7 acido, = 7 neutro, > 7 basico. Ogni unità di pH corrisponde a un fattore 10 nella concentrazione di H⁺.`,`Acidi e basi **forti** si dissociano completamente: per un acido forte monoprotico [H⁺] è uguale alla sua concentrazione.`,`Acidi e basi **deboli** si dissociano solo in parte (costanti Ka e Kb).`,`Un **tampone** contiene un acido debole e la sua base coniugata (o viceversa) e resiste alle variazioni di pH.`],
 ex:[{t:`HCl 0,01 M`,d:`Acido forte: [H⁺] = 10⁻² M, quindi pH = 2.`},{t:`NaOH 0,001 M`,d:`Base forte: [OH⁻] = 10⁻³ M, pOH = 3, quindi pH = 11.`},{t:`Il sangue`,d:`Ha un pH di circa 7,4, mantenuto dal tampone acido carbonico / bicarbonato.`}],
 map:{centro:`Acidi e basi`,rami:[{t:`pH`,figli:[`pH = −log[H⁺]`,`pH + pOH = 14`]},{t:`Forti`,figli:[`Dissociazione completa`,`HCl, NaOH`]},{t:`Deboli`,figli:[`Dissociazione parziale`,`Ka e Kb`]},{t:`Tamponi`,figli:[`Acido debole + base coniugata`,`Limitano le variazioni di pH`]}]},
 extra:'ph'},
bi_cell:{
 sum:[`Le cellule **procariote** non hanno un nucleo delimitato da membrana; le **eucariote** hanno il nucleo e gli organuli.`,`**Mitocondri**: respirazione aerobica e produzione di ATP. **Ribosomi**: sintesi delle proteine.`,`Il reticolo endoplasmatico **rugoso** (con ribosomi) produce proteine da secernere o di membrana; il **liscio** si occupa di lipidi e detossificazione. Il **Golgi** modifica, smista e impacchetta.`,`I **lisosomi** digeriscono materiali all'interno della cellula. I **cloroplasti** (solo piante e alghe) svolgono la fotosintesi.`,`La **parete cellulare** è presente in piante, funghi e batteri, ma non nelle cellule animali.`],
 ex:[{t:`L'insulina`,d:`È sintetizzata dai ribosomi del reticolo rugoso delle cellule β del pancreas, modificata nel Golgi e secreta in vescicole.`},{t:`La cellula muscolare`,d:`Ha moltissimi mitocondri perché consuma molto ATP.`}],
 map:{centro:`Cellula eucariote`,rami:[{t:`Nucleo`,figli:[`DNA`,`Nucleolo: rRNA`]},{t:`Energia`,figli:[`Mitocondri: ATP`,`Cloroplasti (piante)`]},{t:`Sintesi e trasporto`,figli:[`Ribosomi`,`Reticolo, Golgi, vescicole`]},{t:`Rivestimenti`,figli:[`Membrana plasmatica`,`Parete cellulare (piante)`]}]}},
bi_memb:{
 sum:[`La membrana plasmatica è un **doppio strato di fosfolipidi**: teste idrofile all'esterno, code idrofobiche all'interno, con proteine e colesterolo (modello a mosaico fluido).`,`**Trasporto passivo** (senza ATP, secondo gradiente): diffusione semplice, diffusione facilitata, osmosi.`,`**Trasporto attivo** (con ATP, contro gradiente): per esempio la pompa Na⁺/K⁺.`,`**Osmosi**: l'acqua attraversa una membrana semipermeabile verso la soluzione più ricca di soluti.`,`Una cellula animale in soluzione **ipotonica** si gonfia (può lisarsi), in soluzione **ipertonica** si raggrinzisce, in soluzione **isotonica** resta stabile.`],
 ex:[{t:`La pompa Na⁺/K⁺`,d:`Per ogni ATP idrolizzato porta 3 Na⁺ fuori e 2 K⁺ dentro: crea il gradiente necessario ai neuroni.`},{t:`Globuli rossi in acqua distillata`,d:`L'acqua entra per osmosi, i globuli rossi si gonfiano e si rompono (emolisi).`}],
 map:{centro:`Membrana plasmatica`,rami:[{t:`Struttura`,figli:[`Doppio strato fosfolipidico`,`Proteine e colesterolo`]},{t:`Trasporto passivo`,figli:[`Diffusione semplice e facilitata`,`Osmosi`]},{t:`Trasporto attivo`,figli:[`Richiede ATP`,`Pompa Na⁺/K⁺`]},{t:`Tonicità`,figli:[`Ipotonica: la cellula si gonfia`,`Ipertonica: si raggrinzisce`]}]}},
bi_dna:{
 sum:[`Il DNA è una doppia elica antiparallela con appaiamenti **A–T** e **G–C** (nell'RNA A–U); lo zucchero è il desossiribosio.`,`**Replicazione semiconservativa**: ogni nuova doppia elica ha un filamento vecchio e uno nuovo. La DNA polimerasi lavora in direzione 5'→3'.`,`**Trascrizione** (nel nucleo): DNA → mRNA, a opera dell'RNA polimerasi. L'mRNA è complementare e antiparallelo allo stampo.`,`**Traduzione** (ribosomi): mRNA → proteina. Ogni codone (3 basi) specifica un amminoacido, portato dal tRNA. **AUG** è il codone di inizio.`,`Il codice genetico è **degenerato** (più codoni per lo stesso amminoacido) ma non ambiguo.`],
 ex:[{t:`Dallo stampo all'mRNA`,d:`Stampo 3'-TACGGA-5' → mRNA 5'-AUGCCU-3'.`},{t:`Mutazioni puntiformi`,d:`Cambiare una base può modificare un amminoacido (missenso), creare un codone di stop (non senso) o non cambiare nulla (silente).`}],
 map:{centro:`Dal DNA alla proteina`,rami:[{t:`Replicazione`,figli:[`DNA → DNA`,`Semiconservativa`]},{t:`Trascrizione`,figli:[`DNA → mRNA`,`Nel nucleo`]},{t:`Traduzione`,figli:[`mRNA → proteina`,`Ribosomi e tRNA`]},{t:`Codice genetico`,figli:[`Codoni di 3 basi`,`AUG = inizio`]}]}},
bi_gen:{
 sum:[`L'allele **dominante** si manifesta anche in eterozigosi; quello **recessivo** solo in omozigosi.`,`**Genotipo** = costituzione allelica (AA, Aa, aa). **Fenotipo** = carattere osservabile.`,`**Prima legge di Mendel** (segregazione): i due alleli di un gene si separano nei gameti.`,`**Seconda legge** (assortimento indipendente): geni su cromosomi diversi si trasmettono in modo indipendente.`,`Aa × Aa dà 1 AA : 2 Aa : 1 aa (genotipi), cioè 3 dominanti : 1 recessivo (fenotipi).`],
 ex:[{t:`Portatori sani`,d:`Due genitori sani Aa per una malattia recessiva: 1/4 dei figli è malato (aa). Tra i figli sani, 1/3 è AA e 2/3 è portatore Aa.`},{t:`Reincrocio`,d:`Aa × aa dà metà figli Aa e metà aa: rapporto 1 : 1.`}],
 map:{centro:`Genetica mendeliana`,rami:[{t:`Alleli`,figli:[`Dominante e recessivo`,`Omozigote ed eterozigote`]},{t:`Leggi di Mendel`,figli:[`Segregazione`,`Assortimento indipendente`]},{t:`Quadrato di Punnett`,figli:[`Aa × Aa = 3 : 1`,`Aa × aa = 1 : 1`]},{t:`Malattie recessive`,figli:[`Portatori sani`,`Rischio 1/4`]}]},
 extra:'punnett'},
ch_materia:{
 sum:[`La materia è tutto ciò che ha massa e occupa spazio. Gli stati di aggregazione sono **solido**, **liquido** e **aeriforme**.`,`**Solido**: forma e volume propri. **Liquido**: volume proprio ma forma del recipiente. **Aeriforme**: né forma né volume propri.`,`Passaggi di stato: fusione (solido → liquido), solidificazione, evaporazione ed ebollizione (liquido → aeriforme), condensazione, sublimazione (solido → aeriforme). Durante un passaggio di stato la temperatura resta costante.`,`Una **sostanza pura** ha composizione definita (un elemento o un composto). Un **miscuglio** contiene più sostanze: **omogeneo** se ha una sola fase (acqua e sale sciolto), **eterogeneo** se si vedono più fasi (acqua e sabbia).`,`I miscugli si separano con metodi fisici: filtrazione, decantazione, distillazione, cromatografia. I composti si scindono nei loro elementi solo con reazioni chimiche.`],
 ex:[{t:`Acqua salata`,d:`È un miscuglio omogeneo. Con la distillazione l'acqua evapora e poi si condensa, mentre il sale resta nel recipiente.`},{t:`Ghiaccio che fonde`,d:`A pressione atmosferica, finché c'è ghiaccio la temperatura resta 0 °C: il calore assorbito serve per la fusione, non per scaldare.`}],
 map:{centro:`Materia`,rami:[{t:`Stati`,figli:[`Solido, liquido, aeriforme`,`Passaggi di stato`]},{t:`Sostanze pure`,figli:[`Elementi`,`Composti`]},{t:`Miscugli`,figli:[`Omogenei`,`Eterogenei`]},{t:`Separazione`,figli:[`Filtrazione, decantazione`,`Distillazione`]}]}},
ch_reaz:{
 sum:[`In una reazione chimica i **reagenti** si trasformano in **prodotti**: gli atomi si riarrangiano ma non si creano né si distruggono (**conservazione della massa**).`,`**Bilanciare** vuol dire scegliere i **coefficienti stechiometrici** in modo che ogni elemento abbia lo stesso numero di atomi a sinistra e a destra. Non si cambiano mai i pedici delle formule.`,`Tipi principali: **sintesi** (A + B → AB), **decomposizione** (AB → A + B), **scambio semplice**, **doppio scambio**, **combustione** (con O₂; per gli idrocarburi dà CO₂ e H₂O).`,`I coefficienti indicano rapporti in **moli**: 2 H₂ + O₂ → 2 H₂O vuol dire 2 mol di H₂ per 1 mol di O₂ per 2 mol di H₂O.`,`Il **reagente limitante** si esaurisce per primo e decide quanto prodotto si ottiene. La **resa** percentuale è (quantità ottenuta / quantità teorica) · 100.`],
 ex:[{t:`Combustione del metano`,d:`CH₄ + 2 O₂ → CO₂ + 2 H₂O. A sinistra e a destra ci sono 1 C, 4 H e 4 O: l'equazione è bilanciata.`},{t:`Resa`,d:`Se la quantità teorica è 20 g e ne ottieni 15 g, la resa è 15 / 20 · 100 = 75%.`}],
 map:{centro:`Reazioni chimiche`,rami:[{t:`Reagenti e prodotti`,figli:[`Conservazione della massa`,`Equazione chimica`]},{t:`Bilanciamento`,figli:[`Coefficienti stechiometrici`,`Non cambiare i pedici`]},{t:`Tipi`,figli:[`Sintesi e decomposizione`,`Scambio e combustione`]},{t:`Quantità`,figli:[`Rapporti in moli`,`Reagente limitante e resa`]}]}},
ch_sol:{
 sum:[`Una soluzione è formata da **soluto** (in quantità minore) e **solvente** (in quantità maggiore).`,`**Molarità**: M = n / V (mol/L). Per ottenere la massa di soluto: m = M · V · massa molare.`,`**Concentrazione percentuale**: % m/m = (massa di soluto / massa di soluzione) · 100; % m/V = grammi di soluto ogni 100 mL di soluzione.`,`**Diluizione**: aggiungendo solvente le moli di soluto non cambiano, quindi **M₁ · V₁ = M₂ · V₂**.`,`Una soluzione è **satura** quando ha sciolto il massimo di soluto a quella temperatura. In genere la solubilità dei solidi cresce con la temperatura, quella dei gas diminuisce.`],
 ex:[{t:`Preparare una soluzione`,d:`0,5 L di NaCl 0,2 M (M = 58,5 g/mol): n = 0,2 · 0,5 = 0,1 mol, quindi m = 0,1 · 58,5 = 5,85 g.`},{t:`Diluizione`,d:`Da 20 mL di soluzione 0,5 M a 0,1 M: V₂ = 0,5 · 20 / 0,1 = 100 mL, cioè si aggiungono 80 mL di solvente.`}],
 map:{centro:`Soluzioni`,rami:[{t:`Componenti`,figli:[`Soluto`,`Solvente`]},{t:`Concentrazione`,figli:[`Molarità n / V`,`Percentuale m/m e m/V`]},{t:`Diluizione`,figli:[`M₁V₁ = M₂V₂`,`Le moli non cambiano`]},{t:`Solubilità`,figli:[`Soluzione satura`,`Dipende dalla temperatura`]}]}},
ch_neut:{
 sum:[`La **neutralizzazione** è la reazione tra un acido e una base che produce un **sale** e acqua: HCl + NaOH → NaCl + H₂O.`,`Alla base c'è la reazione H⁺ + OH⁻ → H₂O. Al **punto di equivalenza** le moli di H⁺ e di OH⁻ sono uguali.`,`Per un acido con un solo H⁺ e una base con un solo OH⁻: **M(acido) · V(acido) = M(base) · V(base)**. Con H₂SO₄ o Ca(OH)₂ bisogna moltiplicare per il numero di H⁺ o di OH⁻ liberati.`,`Il pH al punto di equivalenza dipende dalla forza: acido forte + base forte dà pH 7; acido debole + base forte dà pH > 7; acido forte + base debole dà pH < 7.`,`La **titolazione** determina una concentrazione incognita aggiungendo goccia a goccia una soluzione di concentrazione nota, con un indicatore che cambia colore.`],
 ex:[{t:`Titolazione`,d:`20 mL di HCl sono neutralizzati da 25 mL di NaOH 0,1 M: n(NaOH) = 0,0025 mol = n(HCl), quindi M(HCl) = 0,0025 / 0,020 = 0,125 M.`},{t:`Acido diprotico`,d:`10 mL di H₂SO₄ 0,1 M contengono 0,002 mol di H⁺: servono 20 mL di NaOH 0,1 M.`}],
 map:{centro:`Neutralizzazione`,rami:[{t:`Reazione`,figli:[`Acido + base`,`Sale + acqua`]},{t:`Equivalenza`,figli:[`mol H⁺ = mol OH⁻`,`Ma · Va = Mb · Vb`]},{t:`pH finale`,figli:[`Forte + forte: 7`,`Con un debole: diverso da 7`]},{t:`Titolazione`,figli:[`Soluzione di concentrazione nota`,`Indicatore di colore`]}]}},
ch_org:{
 sum:[`La chimica organica studia i composti del **carbonio**, che forma 4 legami e può concatenarsi in catene e anelli.`,`**Idrocarburi**: solo C e H. **Alcani** (legami singoli, CₙH₂ₙ₊₂, per esempio il metano CH₄), **alcheni** (almeno un doppio legame, CₙH₂ₙ), **alchini** (triplo legame), **aromatici** (con l'anello del benzene).`,`**Gruppi funzionali**: alcoli (–OH), aldeidi (–CHO), chetoni (C=O dentro la catena), acidi carbossilici (–COOH), ammine (–NH₂), eteri (–O–), esteri (–COO–), ammidi (–CONH–).`,`**Isomeri**: composti con la stessa formula molecolare ma struttura diversa (per esempio butano e 2-metilpropano, entrambi C₄H₁₀).`,`Il gruppo funzionale determina le proprietà: l'–OH forma legami a idrogeno (punti di ebollizione più alti), il –COOH è acido, l'–NH₂ è basico.`],
 ex:[{t:`Un alcol`,d:`CH₃CH₂OH è l'etanolo: una catena di 2 atomi di carbonio con un gruppo –OH.`},{t:`Isomeri`,d:`C₄H₁₀ può essere butano (catena lineare) oppure 2-metilpropano (catena ramificata): stessa formula, proprietà diverse.`}],
 map:{centro:`Chimica organica`,rami:[{t:`Idrocarburi`,figli:[`Alcani, alcheni, alchini`,`Aromatici`]},{t:`Gruppi funzionali`,figli:[`–OH, –CHO, C=O`,`–COOH, –NH₂, esteri`]},{t:`Isomeria`,figli:[`Stessa formula`,`Struttura diversa`]},{t:`Proprietà`,figli:[`Legami a idrogeno`,`Acidità e basicità`]}]}},
bi_ciclo:{
 sum:[`Il **ciclo cellulare** comprende l'**interfase** (G1, S, G2) e la **divisione** (mitosi e citodieresi). Nella fase S il DNA viene replicato.`,`**Mitosi**: da una cellula madre nascono 2 cellule figlie identiche, con lo stesso numero di cromosomi. Fasi: profase, metafase, anafase, telofase.`,`**Meiosi**: due divisioni consecutive che da una cellula diploide (2n) producono 4 cellule **aploidi** (n), cioè i gameti. Avviene solo nelle cellule germinali.`,`Nella meiosi I si separano i cromosomi omologhi e avviene il **crossing-over**, lo scambio di tratti tra omologhi che crea variabilità genetica. Nella meiosi II si separano le cromatidi fratelle.`,`Il ciclo è controllato da punti di controllo. Se non funzionano, le cellule possono dividersi in modo incontrollato, come nei tumori.`],
 ex:[{t:`Numero di cromosomi`,d:`Nell'uomo 2n = 46. Dopo la mitosi ogni cellula figlia ha 46 cromosomi, dopo la meiosi ogni gamete ne ha 23.`},{t:`Le fasi della mitosi`,d:`In metafase i cromosomi si allineano all'equatore della cellula; in anafase le cromatidi fratelle si separano e migrano ai poli opposti.`}],
 map:{centro:`Ciclo cellulare`,rami:[{t:`Interfase`,figli:[`G1, S, G2`,`Replicazione del DNA in S`]},{t:`Mitosi`,figli:[`2 cellule identiche`,`Profase, metafase, anafase, telofase`]},{t:`Meiosi`,figli:[`4 cellule aploidi`,`Crossing-over`]},{t:`Controllo`,figli:[`Punti di controllo`,`Tumori se falliscono`]}]}},
bi_biomol:{
 sum:[`Le quattro grandi classi di biomolecole sono **carboidrati**, **lipidi**, **proteine** e **acidi nucleici**.`,`**Carboidrati**: monosaccaridi (glucosio, fruttosio), disaccaridi (saccarosio, lattosio), polisaccaridi (amido, glicogeno, cellulosa). Hanno funzione energetica e strutturale.`,`**Lipidi**: trigliceridi (riserva di energia), fosfolipidi (membrane), steroidi (colesterolo, ormoni). Sono poco solubili in acqua, cioè idrofobici.`,`**Proteine**: polimeri di amminoacidi uniti da legami peptidici. **Acidi nucleici**: DNA e RNA, polimeri di nucleotidi.`,`I polimeri si formano per **condensazione** (si libera una molecola d'acqua) e si scindono per **idrolisi** (si consuma acqua).`],
 ex:[{t:`Condensazione`,d:`Due molecole di glucosio si uniscono formando maltosio e liberando una molecola di acqua.`},{t:`Riserve di glucosio`,d:`Gli animali lo accumulano come glicogeno (fegato e muscoli), le piante come amido. La cellulosa invece è strutturale e forma la parete cellulare vegetale.`}],
 map:{centro:`Biomolecole`,rami:[{t:`Carboidrati`,figli:[`Glucosio, saccarosio`,`Amido, glicogeno, cellulosa`]},{t:`Lipidi`,figli:[`Trigliceridi`,`Fosfolipidi, steroidi`]},{t:`Proteine`,figli:[`Amminoacidi`,`Legame peptidico`]},{t:`Acidi nucleici`,figli:[`DNA e RNA`,`Nucleotidi`]}]}},
bi_prot:{
 sum:[`Le proteine sono formate da **20 amminoacidi** diversi uniti da legami peptidici. L'ordine degli amminoacidi è la **struttura primaria**.`,`**Struttura secondaria**: α-elica e foglietto β, stabilizzati da legami a idrogeno. **Terziaria**: ripiegamento tridimensionale della catena. **Quaternaria**: unione di più catene (per esempio l'emoglobina).`,`La forma tridimensionale determina la funzione. La **denaturazione** (calore, pH estremi) distrugge la forma e quindi la funzione.`,`Gli **enzimi** sono catalizzatori biologici (quasi tutti proteine): abbassano l'energia di attivazione e accelerano la reazione senza consumarsi. Sono **specifici** per il proprio substrato, che si lega al sito attivo.`,`L'attività di un enzima dipende da temperatura, pH e concentrazione del substrato. Un **inibitore** ne riduce l'attività.`],
 ex:[{t:`Amilasi`,d:`Scinde l'amido in zuccheri più semplici. Nella saliva funziona al meglio a pH vicino alla neutralità.`},{t:`Denaturazione`,d:`Quando si cuoce un uovo l'albume coagula: il calore fa perdere alle proteine la forma nativa.`}],
 map:{centro:`Proteine ed enzimi`,rami:[{t:`Struttura`,figli:[`Primaria: sequenza`,`Terziaria e quaternaria: forma 3D`]},{t:`Funzioni`,figli:[`Strutturali e di trasporto`,`Enzimi e anticorpi`]},{t:`Enzimi`,figli:[`Abbassano l'energia di attivazione`,`Specifici per il substrato`]},{t:`Fattori`,figli:[`Temperatura e pH`,`Denaturazione`]}]}},
bi_metab:{

/* ---------- Selezione domande e registrazione risposte ---------- */
function qWeight(q){
  var t=T(q.t),w=1,e=S.errors[q.id];
  if(e&&e.ok<2)w+=3;
  var l=lastAns(q.id);
  if(!l)w+=1;else if(l.ok&&Date.now()-l.ts<2*864e5)w*=0.3;
  var d=Math.abs(q.l-t.level);w+=d===0?2:d===1?0.5:0;
  w*=(0.6+weakness(q.t)*1.4);

}
function pickQuestions(pool,n){
  var arr=pool.map(function(q){return {q:q,w:qWeight(q)};}),out=[];
  while(out.length<n&&arr.length){
    var tot=arr.reduce(function(a,x){return a+x.w;},0),r=Math.random()*tot,i=0;
    for(;i<arr.length;i++){r-=arr[i].w;if(r<=0)break;}
    i=Math.min(i,arr.length-1);out.push(arr[i].q);arr.splice(i,1);
  }
  return out;
}
function record(q,orig,ok,place,conf){
  var up=false,now=Date.now();
  S.log.push({q:q.id,t:q.t,ok:ok,ts:now,c:conf||undefined,l:q.l===4?4:undefined});
  if(q.l===4){S.sf=S.sf||{};var sx=S.sf[q.t]||(S.sf[q.t]={n:0,ok:0});sx.n++;if(ok)sx.ok++;}
  if(S.log.length>600)S.log.splice(0,S.log.length-600);
  var e=S.errors[q.id],c0=S.cards[q.id];
  if(!ok){S.errors[q.id]={n:(e?e.n:0)+1,ok:0,last:orig,ts:now,sure:conf==='s'};S.cards[q.id]={box:0,due:now};}
  else{
    if(e)e.ok=(e.ok||0)+1;
    if(!place&&c0&&c0.due<=now){c0.box=Math.min(4,(c0.box||0)+1);c0.due=now+INT[c0.box]*864e5;}
  }
  bump(1);
  if(!place&&q.l<=3){
    var t=T(q.t);
    if(ok){if(q.l>=t.level){t.streak++;if(t.streak>=2&&t.level<3){t.level++;t.streak=0;t.fragile=false;up=true;}}}
    else if(q.l<=t.level){t.streak=0;if(t.level>1)t.level--;else t.fragile=true;}

/* ---------- Mappe e grafici (SVG) ---------- */
function wrap(s,max){
  var w=String(s).split(/\s+/),lines=[],cur='';
  w.forEach(function(x){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x;}else cur=(cur+' '+x).trim();});
  if(cur)lines.push(cur);
  return lines.slice(0,3);
}
function validMap(m){return m&&typeof m.centro==='string'&&Array.isArray(m.rami)&&m.rami.length>=2&&m.rami.every(function(r){return r&&typeof r.t==='string';});}

  var W=900,H=640,cx=W/2,cy=H/2,nodes=[],edges=[];

  var rami=m.rami.slice(0,6),n=rami.length,start=-90-180/n;
  rami.forEach(function(r,i){
    var ang=(start+i*360/n)*Math.PI/180;
    var b=mk(cx+210*Math.cos(ang),cy+140*Math.sin(ang),r.t,'b',16);b.d=0.2+i*0.2;nodes.push(b);edges.push([c,b]);
    var kids=(Array.isArray(r.figli)?r.figli:[]).filter(function(k){return typeof k==='string';}).slice(0,3),m2=kids.length;
    kids.forEach(function(k,j){
      var a2=ang+(j-(m2-1)/2)*(22*Math.PI/180);
      var l=mk(cx+380*Math.cos(a2),cy+262*Math.sin(a2),k,'l',20);l.d=0.35+i*0.2+j*0.1;nodes.push(l);edges.push([b,l]);
    });
  });
  nodes.forEach(function(nd){nd.x=Math.max(nd.w/2+4,Math.min(W-nd.w/2-4,nd.x));nd.y=Math.max(nd.h/2+4,Math.min(H-nd.h/2-4,nd.y));});
  var s='<svg class="mc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mappa concettuale: '+esc(m.centro)+'" style="--sc:var('+sv+')">';
  edges.forEach(function(e){var len=Math.hypot(e[1].x-e[0].x,e[1].y-e[0].y);s+='<line class="mc-e" style="--len:'+len.toFixed(0)+';--d:'+Math.max(0,(e[1].d||0)-0.12).toFixed(2)+'s" x1="'+e[0].x.toFixed(1)+'" y1="'+e[0].y.toFixed(1)+'" x2="'+e[1].x.toFixed(1)+'" y2="'+e[1].y.toFixed(1)+'"/>';});
  nodes.forEach(function(nd){

    nd.L.forEach(function(l,i){s+='<text x="'+nd.x.toFixed(1)+'" y="'+(nd.y+(i-(nd.L.length-1)/2)*nd.lh+nd.fs*0.34).toFixed(1)+'" text-anchor="middle" font-size="'+nd.fs+'">'+esc(l)+'</text>';});
    s+='</g>';
  });
  return s+'</svg>';
}
function ticks(lo,hi){

function chartSVG(g,sv){

var POP_MS=10000,MONS=[['👾','Blob Atomico'],['🐲','Drago Enzima'],['👹','Orco Ossidante'],['🦖','Rex Reazione'],['🐙','Piovra Proteina'],['🧟','Zombie Zigote'],['🦑','Calamaro Catalizzatore']];
function hearts(n,max){var s='';for(var i=0;i<max;i++)s+=i<n?'❤️':'🖤';return '<span class="hearts" role="img" aria-label="'+n+' vite su '+max+'">'+s+'</span>';}
function normL(c){return c.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();}
function isL(c){var n=normL(c);return n.length===1&&/^[A-Z]$/.test(n);}
function bestUp(k,v){S.gs=S.gs||{};if(v>(S.gs[k]||0))S.gs[k]=v;save();}

function startGame2(g){
  var sc=gScope(),pool=defPool(sc);
  if(g==='pop'){
    gm={g:g,items:shuffle(pool).slice(0,10).map(function(x){return buildItem('guess',x,pool);}),i:0,score:0,right:0,lives:3,shown:null,wrong:{},last:0,end:false,tok:0,t0:0};
    popTimer();
  }else if(g==='hang'){
    var ws=shuffle(pool.filter(function(x){var n=x.term.split('').filter(isL).length;return n>=3&&n<=22;})).slice(0,5);
    gm={g:g,words:ws,i:0,score:0,used:{},wrong:0,max:6,res:null,end:false};
  }else{
    var bp=shuffle(bank().filter(function(q){var t=topicOf(q.t);return t&&(sc==='all'||t.s===sc)&&q.o&&q.o.length===4;}));
    gm={g:g,pool:bp,pi:0,q:null,order:[],mi:0,monsters:0,hpMax:5,hp:5,lives:3,score:0,shown:null,chosen:null,hit:false,beat:false,end:false,tok:0};
    bossQ();
  }
  view='game';render();scrollTop();
}
function popTimer(){
  gm.tok++;gm.t0=Date.now();var tk=gm.tok;
  setTimeout(function(){if(gm&&gm.g==='pop'&&gm.tok===tk&&gm.shown===null&&view==='game')gameAct('gTime',{});},POP_MS);
}
function bossQ(){
  if(gm.pi>=gm.pool.length){gm.pool=shuffle(gm.pool);gm.pi=0;}
  gm.q=gm.pool[gm.pi++];gm.order=shuffle([0,1,2,3]);gm.shown=null;gm.chosen=null;
}

    h+='<div class="tbar" aria-hidden="true"><b'+(m.shown===null?' style="animation-duration:'+(POP_MS/1000)+'s;animation-delay:-'+el.toFixed(2)+'s"':' class="stop"')+'></b></div>';
    h+='<div class="tag" style="--sc:var('+SUBJ[t.s].v+')">'+esc(t.n)+'</div><h2 class="qt">'+esc(it.def)+'</h2><p class="muted" style="margin:0">Scoppia il palloncino con il termine giusto.</p><div class="balloons">';
    var cols=['--chim','--bio','--fis','--bad'];
    it.opts.forEach(function(o,j){

      h+='<button class="'+cls+'" style="--bc:var('+cols[j]+');--k:'+j+'" data-act="gPop" data-i="'+j+'"'+(m.shown!==null||m.wrong[j]?' disabled':'')+'><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
    if(m.shown!==null){
      var ok=m.shown==='ok';
      h+='<div class="panel fb'+(ok?'':' bad')+'"><h3>'+(ok?'Scoppiato! +'+m.last+' punti':m.shown==='time'?'Tempo scaduto':'Vite finite')+'</h3><p><strong>'+esc(it.term)+'</strong>: '+esc(it.def)+'</p><button class="btn block" data-act="gNext">'+(m.lives<=0||m.i+1>=m.items.length?'Vedi il risultato':'Avanti')+'</button></div>';
    }

  }
  if(m.g==='hang'){
    if(m.end)return gEnd('Impiccato',m.score+' su '+m.words.length,m.score===m.words.length?'Hai indovinato tutti i termini':'Ogni termine che non hai indovinato si ripassa meglio al prossimo giro');
    var w=m.words[m.i],tt=topicOf(w.t),done=m.res!==null;
    var h2=gHead('Impiccato · parola '+(m.i+1)+' di '+m.words.length)+'<div class="between" style="margin:0 0 8px"><span class="muted">Indovinate: <strong>'+m.score+'</strong></span>'+hearts(m.max-m.wrong,m.max)+'</div>';
    h2+='<div class="tag" style="--sc:var('+SUBJ[tt.s].v+')">'+esc(tt.n)+'</div><p class="stmt">'+esc(w.def)+'</p><div class="word" aria-label="Termine da indovinare">';
    w.term.split('').forEach(function(c){
      if(c===' ')h2+='<span class="sp"></span>';
      else if(!isL(c))h2+='<span class="ch fix">'+esc(c)+'</span>';
      else h2+='<span class="ch'+(m.used[normL(c)]||done?' on':'')+'">'+((m.used[normL(c)]||done)?esc(c.toUpperCase()):'')+'</span>';
    });
    h2+='</div>';
    if(!done){
      var wn=w.term.split('').map(normL).join('');
      h2+='<div class="kb" role="group" aria-label="Lettere">'+'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function(l){var u=m.used[l];return '<button class="key'+(u?(wn.indexOf(l)>-1?' ok':' no'):'')+'" data-act="gKey" data-l="'+l+'"'+(u?' disabled':'')+'>'+l+'</button>';}).join('')+'</div>';
    }else{
      h2+='<div class="panel fb'+(m.res==='win'?'':' bad')+'"><h3>'+(m.res==='win'?'Bravo, indovinato':'Non ce l\'hai fatta')+'</h3><p>Il termine è <strong>'+esc(w.term)+'</strong>.</p><button class="btn block" data-act="gNext">'+(m.i+1>=m.words.length?'Vedi il risultato':'Prossimo termine')+'</button></div>';
    }
    return h2;
  }
  /* boss */
  if(m.end)return gEnd('Battaglia col mostro',m.monsters+(m.monsters===1?' mostro':' mostri'),m.score+' risposte esatte'+(S.gs&&S.gs.boss?' · Record: '+S.gs.boss+(S.gs.boss===1?' mostro':' mostri'):''),'Combatti ancora');
  var mo=MONS[m.mi%MONS.length],q=m.q;
  var h3=gHead('Battaglia col mostro')+'<div class="between" style="margin:0 0 6px"><span class="muted">Sconfitti: <strong>'+m.monsters+'</strong></span>'+hearts(m.lives,3)+'</div>';
  h3+='<div class="monster'+(m.hit?' hit':'')+(m.beat?' beat':'')+'"><div class="mem" aria-hidden="true">'+mo[0]+'</div><strong>'+esc(mo[1])+'</strong><div class="meter2" style="--sc:var(--bad)" role="img" aria-label="Vita del mostro '+m.hp+' su '+m.hpMax+'"><b style="width:'+Math.round(m.hp/m.hpMax*100)+'%;animation:none"></b></div></div>';
  m.hit=false;m.beat=false;
  h3+='<h2 class="qt">'+esc(q.q)+'</h2>';
  m.order.forEach(function(orig,j){
    var cls='';if(m.shown!==null){if(orig===q.a)cls=' ok';else if(j===m.chosen)cls=' bad';}
    h3+='<button class="opt'+cls+'" data-act="gBoss" data-i="'+j+'"'+(m.shown!==null?' disabled':'')+'><span class="k">'+'ABCD'[j]+'</span><span>'+esc(q.o[orig])+'</span></button>';
  });
  if(m.shown==='bad')h3+='<div class="panel fb bad"><h3>Il mostro ti ha colpito</h3><p>La risposta corretta è <strong>'+esc(q.o[q.a])+'</strong>.</p><p>'+esc(q.e)+'</p><button class="btn block" data-act="gNext">'+(m.lives<=0?'Vedi il risultato':'Avanti')+'</button></div>';
  return h3;
}
function gameAct2(a,d){
  var m=gm;
  if(m.g==='pop'){
    if(a==='gPop'&&m.shown===null){
      var it=m.items[m.i],j=+d.i;
      if(it.opts[j]===it.term){var left=Math.max(0,Math.ceil((POP_MS-(Date.now()-m.t0))/1000));m.last=10+left;m.score+=m.last;m.shown='ok';m.right++;m.tok++;}
      else{m.lives--;m.wrong[j]=true;if(m.lives<=0){m.shown='bad';m.tok++;}}
      render();return true;
    }
    if(a==='gTime'&&m.shown===null){m.lives--;m.shown='time';m.tok++;render();return true;}
    if(a==='gNext'){
      if(m.lives<=0||m.i+1>=m.items.length){m.end=true;bestUp('pop',m.score);}
      else{m.i++;m.shown=null;m.wrong={};popTimer();}
      render();scrollTop();return true;
    }
    return false;
  }
  if(m.g==='hang'){
    if(a==='gKey'&&m.res===null){
      var l=d.l,w=m.words[m.i];if(m.used[l])return true;
      m.used[l]=true;
      var wn=w.term.split('').map(normL);
      if(wn.indexOf(l)<0)m.wrong++;
      var all=w.term.split('').every(function(c){return !isL(c)||m.used[normL(c)];});
      if(all){m.res='win';m.score++;}else if(m.wrong>=m.max)m.res='lose';
      render();return true;
    }
    if(a==='gNext'){
      if(m.i+1>=m.words.length){m.end=true;bestUp('hang',m.score);}
      else{m.i++;m.used={};m.wrong=0;m.res=null;}
      render();scrollTop();return true;
    }
    return false;
  }
  if(m.g==='boss'){
    if(a==='gBoss'&&m.shown===null){
      var q=m.q,orig=m.order[+d.i],ok=orig===q.a;
      record(q,orig,ok,false,null);
      m.chosen=+d.i;m.shown=ok?'ok':'bad';
      if(ok){
        m.score++;m.hp--;m.hit=true;
        if(m.hp<=0){m.monsters++;m.beat=true;m.mi++;m.hpMax=Math.min(12,5+m.monsters);m.hp=m.hpMax;bestUp('boss',m.monsters);}
        m.tok++;var tk=m.tok;
        setTimeout(function(){if(gm&&gm.g==='boss'&&gm.tok===tk&&view==='game'&&gm.shown==='ok'){bossQ();render();}},m.beat?1100:750);
      }else{m.lives--;}
      render();return true;
    }
    if(a==='gNext'){
      if(m.lives<=0){m.end=true;bestUp('boss',m.monsters);}else bossQ();
      render();scrollTop();return true;
    }
    return false;
  }
  return false;
}

/* ---------- Lezione guidata ---------- */
function lessonStart(){
  var L=S.lesson;
  if(!L||L.step>=4){S.lesson={tid:pickLessonTopic(),step:1,wrong:[]};ui.swap=0;save();}
  lessonGo();
}
function lessonGo(){
  var L=S.lesson;ui.msg='';
  if(L.step===1){view='lesson';sess=null;render();scrollTop();}
  else if(L.step===2)startQuiz('topic',L.tid,{n:5,lesson:true});
  else if(L.step===3){
    var now=Date.now(),ids=(L.wrong||[]).slice();
    bank().forEach(function(q){if(q.t===L.tid&&S.cards[q.id]&&S.cards[q.id].due<=now&&ids.indexOf(q.id)<0)ids.push(q.id);});
    var items=ids.map(qById).filter(Boolean).slice(0,6);
    if(!items.length){finishLesson();view='lessonDone';sess=null;render();scrollTop();return;}
    sess={mode:'cards',items:items,i:0,flipped:false,known:0,review:0,done:false,lesson:true};view='playcards';render();scrollTop();
  }else{view='lessonDone';sess=null;render();scrollTop();}
}
function lessonNext(){
  var L=S.lesson;if(!L)return;
  if(L.step===2&&sess&&sess.answers)L.wrong=sess.answers.filter(function(x){return !x.ok;}).map(function(x){return x.q;});
  L.step++;save();lessonGo();
}
function finishLesson(){if(S.lesson&&S.lesson.step<4){S.lesson.step=4;S.lessonsDone=(S.lessonsDone||0)+1;save();}}

/* ---------- Sessioni ---------- */
function setQ(q){sess.conf=null;sess.reveal=sess.mode==='place'||S.hide===false;sess.lvUp=null;sess.rev=null;sess.prev=null;sess.q=q;sess.order=shuffle([0,1,2,3]);sess.chosen=null;sess.shown=false;sess.ok=null;}
function startQuiz(mode,arg,opt){
  opt=opt||{};var pool=bank(),n=10;
  if(mode==='subj')pool=pool.filter(function(q){return topicOf(q.t).s===arg;});
  else if(mode==='topic'){pool=pool.filter(function(q){return q.t===arg;});n=8;}
  else if(mode==='multi'){var ids=arg||[];pool=pool.filter(function(q){return ids.indexOf(q.t)>-1;});n=opt.n===0?pool.length:(opt.n||10);}
  else if(mode==='par'){var ps=opt.pars||[];pool=pool.filter(function(q){return q.t===arg&&(!ps.length||ps.indexOf(q.p)>-1);});}
  else if(mode==='errors'){pool=pool.filter(function(q){return S.errors[q.id]&&S.errors[q.id].ok<2&&(!arg||q.t===arg);});n=12;}
  if(mode!=='errors'){var df=opt.diff===undefined?'auto':opt.diff;pool=pool.filter(function(q){return diffOK(q,df);});}
  if(!pool.length){ui.msg='Non ci sono domande disponibili per questa scelta.';view='home';sess=null;render();scrollTop();return;}
  if(opt.n&&mode!=='multi')n=opt.n;
  var items=pickQuestions(pool,Math.min(n,pool.length));
  ui.lp=0;sess={mode:'quiz',sub:mode==='multi'?'multi':'',items:items,i:0,answers:[],lesson:!!opt.lesson};setQ(items[0]);view='play';render();scrollTop();
}
function startPlace(arg){
  ui.lp=0;
  var topics=TOPICS.filter(function(t){return arg==='all'||t.s===arg;}).map(function(t){return t.id;});
  sess={mode:'place',queue:topics,total:topics.length,done:0,cur:null,stage:2,answers:[],subjects:arg==='all'?Object.keys(SUBJ):[arg],lv:{}};
  view='play';placeAdvance();render();scrollTop();
}
function placeQ(tid,l){return QB.find(function(q){return q.t===tid&&q.l===l;});}
function placeAdvance(){
  if(!sess.cur){
    if(!sess.queue.length){sess.subjects.forEach(function(s){S.placed[s]=true;});save();view='result';return;}
    sess.cur=sess.queue.shift();sess.stage=2;
  }
  setQ(placeQ(sess.cur,sess.stage));
}
function placeNext(){
  var last=sess.answers[sess.answers.length-1],tid=sess.cur;
  if(sess.stage===2){sess.stage=last.ok?3:1;}
  else{
    var lv=sess.stage===3?(last.ok?3:2):1,fragile=sess.stage===1&&!last.ok,t=T(tid);
    t.level=lv;t.fragile=fragile;t.placed=true;t.streak=0;sess.lv[tid]={lv:lv,fragile:fragile};sess.done++;sess.cur=null;save();
  }
  placeAdvance();
}
function answer(j){
  if(!sess||sess.shown)return;
  var q=sess.q,orig=sess.order[j],ok=orig===q.a;
  sess.chosen=j;sess.shown=true;sess.ok=ok;
  var conf=sess.conf||null,up=record(q,orig,ok,sess.mode==='place',conf);
  sess.prev=S.cards[q.id]?JSON.parse(JSON.stringify(S.cards[q.id])):null;
  if(ok&&sess.mode!=='place'&&conf&&conf!=='s'&&!S.cards[q.id]){S.cards[q.id]={box:0,due:Date.now()};sess.rev=1;save();}
  sess.lvUp=up?LV[T(q.t).level]:null;ui.fx=true;
  sess.answers.push({q:q.id,t:q.t,ok:ok,orig:orig});
  render();
  var f=document.querySelector('.fb');if(f){try{f.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});}catch(e){}}
}
function setReview(v){
  if(!sess||sess.mode==='place'||!sess.shown||!sess.ok)return;
  var q=sess.q,last=sess.answers[sess.answers.length-1];
  if(v==='1'){S.cards[q.id]={box:0,due:Date.now()};sess.rev=1;}
  else{if(sess.prev)S.cards[q.id]=sess.prev;else delete S.cards[q.id];sess.rev=0;}
  if(last&&last.q===q.id)last.rev=sess.rev;
  save();render();
}
function next(){
  if(!sess)return;
  if(sess.mode==='place')placeNext();
  else if(sess.i+1>=sess.items.length)view='result';
  else{sess.i++;setQ(sess.items[sess.i]);}
  render();scrollTop();
}
var INT=[0,1,3,7,21];
function startCards(arg){
  var now=Date.now(),pool=cardsPool(arg);
  var due=pool.filter(function(q){return S.cards[q.id]&&S.cards[q.id].due<=now;}).sort(function(a,b){return S.cards[a.id].due-S.cards[b.id].due;});
  var items=due.slice();
  if(arg!=='due')items=items.concat(shuffle(pool.filter(function(q){return !S.cards[q.id]&&q.l<=3;})));
  items=items.slice(0,15);
  if(!items.length){ui.msg='Nessuna flashcard da ripassare adesso.';view='home';sess=null;render();scrollTop();return;}
  sess={mode:'cards',items:items,i:0,flipped:false,known:0,review:0,done:false};view='playcards';render();scrollTop();
}
function rate(r){
  if(!sess||sess.mode!=='cards')return;
  var q=sess.items[sess.i],c=S.cards[q.id]||(S.cards[q.id]={box:0,due:0});
  if(r==='known'){c.box=Math.min(4,(c.box||0)+1);c.due=Date.now()+INT[c.box]*864e5;sess.known++;}
  else{c.box=0;c.due=Date.now()+6e5;sess.review++;}
  bump(1);save();sess.i++;sess.flipped=false;if(sess.i>=sess.items.length){sess.done=true;if(sess.lesson){finishLesson();view='lessonDone';sess=null;}}
  render();scrollTop();
}

/* ---------- Funzioni con Claude ---------- */
async function explainQ(qid,c,btnEl){
  var q=qById(qid),box=document.getElementById('xp-'+qid);if(!q||!box)return;
  var key=qid+':'+c;
  if(S.expl[key]){box.innerHTML=fmt(S.expl[key]);box.hidden=false;return;}
  var sm=await getSample();
  if(!sm){box.hidden=false;box.innerHTML='<p>In questo momento Claude non è disponibile. La spiegazione qui sopra resta valida.</p>';return;}
  if(btnEl)btnEl.disabled=true;
  box.hidden=false;box.innerHTML='<p class="muted">Claude sta preparando la spiegazione…</p>';
  var prompt='Sei un tutor paziente per studenti italiani che preparano il semestre filtro di Medicina.\n'+
   'Lo studente ha sbagliato questa domanda.\nDomanda: '+q.q+'\nOpzioni: '+q.o.map(function(o,i){return 'ABCD'[i]+') '+o;}).join(' | ')+'\n'+
   'Risposta data dallo studente: '+q.o[c]+'\nRisposta corretta: '+q.o[q.a]+'\nSpiegazione di base: '+q.e+'\n\n'+
   'Scrivi in italiano, in modo semplice, al massimo 170 parole, in paragrafi brevi senza titoli né elenchi. Nell\'ordine: 1) quale ragionamento o confusione tipica porta alla risposta data; 2) il ragionamento corretto passo per passo; 3) un trucco per ricordarlo; 4) un mini esempio simile con la soluzione. Puoi usare **grassetto** per le parole chiave. Non inventare dati.';
  try{
    var r=await sm(prompt,{cache:false,onText:function(o){var b=document.getElementById('xp-'+qid);if(b)b.innerHTML=fmt(o.text);}});
    S.expl[key]=r.text;save();
    var b2=document.getElementById('xp-'+qid);if(b2){b2.hidden=false;b2.innerHTML=fmt(r.text);}
  }catch(e){
    var m=errMsg(e),b3=document.getElementById('xp-'+qid);if(b3)b3.innerHTML='<p>'+esc(m||'Richiesta annullata.')+'</p>';
  }
  if(btnEl)btnEl.disabled=false;
}
async function genMat(tid){

  if(!sm){ui.msg='In questo momento Claude non è disponibile.';render();return;}
  var t=topicOf(tid),errs=unresolved(tid).map(function(id){var q=qById(id),e=S.errors[id];return '- '+q.q+' | risposta data: '+q.o[e.last]+' | corretta: '+q.o[q.a];}).join('\n')||'(nessun errore registrato: prepara un buon ripasso generale)';
  var prompt='Sei un tutor per studenti italiani che preparano il semestre filtro di Medicina.\nArgomento: '+t.n+' ('+SUBJ[t.s].n+'). Livello attuale dello studente: '+levelLabel(tid)+'.'+bookScope(t)+'\nErrori dello studente su questo argomento:\n'+errs+'\n\n'+
   'Crea materiale di studio su misura che copra proprio queste lacune. Rispondi SOLO con JSON valido, senza testo prima o dopo e senza backtick, con questa forma:\n'+
   '{"riassunto":["punto breve", ... 5-7 punti],"esempi":[{"titolo":"...","testo":"esempio svolto con numeri e passaggi"}, ... 2-3],"mappa":{"centro":"...","rami":[{"t":"...","figli":["...","..."]}, ... 4 rami con 2 figli ciascuno]},"grafico":null}\n'+
   'Per "grafico" usa null, oppure {"tipo":"linea","titolo":"...","asseX":"...","asseY":"...","punti":[[x,y],...]}, oppure {"tipo":"barre","titolo":"...","etichette":["..."],"valori":[numeri]}, ma solo se aiuta davvero a capire e solo con dati di cui sei sicuro. Frasi brevi e chiare. Puoi usare **grassetto** nei punti del riassunto.';
  ui.busy='mat';ui.msg='';render();

    var d=await sm.json(prompt,{cache:false});

  }catch(e){ui.msg=errMsg(e);}

async function genQ(tid){
  var sm=await getSample();
  if(!sm){ui.msg='In questo momento Claude non è disponibile.';render();return;}

function polyLen(p){var L=0;for(var i=0;i<p.length-1;i++)L+=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);return L;}
function polyPos(p,d){
  var L=polyLen(p);d=((d%L)+L)%L;
  for(var i=0;i<p.length-1;i++){var l=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);if(d<=l){var f=d/l;return [p[i][0]+(p[i+1][0]-p[i][0])*f,p[i][1]+(p[i+1][1]-p[i][1])*f];}d-=l;}
  return p[0];
}

  function shells(z){var a=Math.min(z,2),r=z-a,b=Math.min(r,8);r-=b;return [a,b,r].filter(function(x){return x>0;});}
  function draw(){
    var sh=shells(Z),R=[52,98,144],s='';

    s+='<circle class="nuc" cx="200" cy="160" r="30"/><text class="nuct" x="200" y="166" text-anchor="middle">'+Z+'+</text>';

  }

  }

  wireChips('pre',function(k){var v=+k;$('p').value=v;$('pv').textContent=nf(v);upd(v);});
