<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filtro">
<title>Studio Filtro</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16202C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#16202C; --muted:#566475; --line:#D3DCE6; --soft:#E3E9F0;
  --chim:#B0206F; --bio:#1C7C4D; --fis:#2B55C9;
  --ok:#1C7C4D; --bad:#C23B2E; --on-sub:#FFFFFF;
  --font-display:'Bricolage Grotesque','Avenir Next','Helvetica Neue',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Helvetica Neue',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151C; --surface:#18212B; --ink:#E8EDF3; --muted:#9AA8B8; --line:#2B3846; --soft:#212C38;
    --chim:#E36AAE; --bio:#4DBE88; --fis:#7D9DF7; --ok:#4DBE88; --bad:#F0786B; --on-sub:#0F151C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E8EDF3; --muted:#9AA8B8; --line:#2B3846; --soft:#212C38;
  --chim:#E36AAE; --bio:#4DBE88; --fis:#7D9DF7; --ok:#4DBE88; --bad:#F0786B; --on-sub:#0F151C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 var(--font-body)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px))}
#app>main{flex:1 0 auto;width:100%}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 .8em}
ul{margin:0 0 .8em;padding-left:1.2em}
li{margin-bottom:.4em}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.9rem}
:focus-visible{outline:3px solid var(--fis);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;margin-right:14px;white-space:nowrap}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;min-height:44px;white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.badge{background:var(--bad);color:var(--bg);border-radius:99px;font-size:.78rem;padding:1px 8px;margin-left:4px}
main{max-width:1040px;margin:0 auto;padding:22px 20px 70px}

.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;font-weight:700;padding:12px 20px;min-height:48px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;text-decoration:underline;padding:10px 0;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 14px}
.panel.next{border-left:8px solid var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
.subj{border-top:7px solid var(--sc)}
.subj ul{list-style:none;padding:0;margin:0}
.trow{appearance:none;display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);padding:12px 2px;min-height:52px;cursor:pointer}
.trow:last-child{border-bottom:0}
.trow .lab{display:block;font-size:.85rem;color:var(--muted)}
.meter{display:inline-flex;gap:3px;flex:none}
.meter i{display:block;width:18px;height:9px;border-radius:2px;background:var(--soft);border:1px solid var(--line)}
.meter i.on{background:var(--sc,var(--ink));border-color:var(--sc,var(--ink))}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 16px;min-height:44px;cursor:pointer}
.chip::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc);margin-right:8px}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--sc);margin-bottom:8px}
.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sc)}

.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog>b{display:block;height:100%;background:var(--ink);transition:width .25s}
.qt{font-size:1.35rem;margin-bottom:18px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;min-height:58px;background:var(--surface);border:2px solid var(--line);border-radius:12px;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:10px}
.opt .k{font-family:var(--font-display);font-weight:700;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-left:8px solid var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.xp{margin-top:12px;padding:14px 16px;background:var(--soft);border-radius:10px}
.xp p:last-child{margin-bottom:0}

.err .mine{color:var(--bad);font-weight:700}
.err .good{color:var(--ok);font-weight:700}
.fcard{display:grid;place-items:center;text-align:center;min-height:300px;padding:30px;font-size:1.3rem;cursor:pointer;width:100%;font-family:inherit;color:var(--ink)}
.fcard .ans{font-weight:700;font-size:1.5rem;margin-bottom:12px}
.fcard .ex{font-size:1rem;color:var(--muted)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs .tab{border:1px solid var(--line);background:var(--surface)}
.tabs .tab[aria-current="page"]{border-color:var(--ink)}
svg.mc,svg.chart,svg.phs{width:100%;height:auto;display:block}
svg text{font-family:var(--font-body)}
.mc-e{stroke:var(--sc);stroke-width:2;opacity:.55}
.mc-c rect{fill:var(--sc)} .mc-c text{fill:var(--on-sub);font-weight:700}
.mc-b rect{fill:var(--soft);stroke:var(--sc);stroke-width:2} .mc-b text{fill:var(--ink);font-weight:700}
.mc-l rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5} .mc-l text{fill:var(--ink)}
.ch-ax{stroke:var(--line);stroke-width:1}
.ch-t{fill:var(--muted);font-size:13px}
.ch-ti{fill:var(--ink);font-size:15px;font-weight:700}
.ch-l{stroke:var(--sc);stroke-width:3;fill:none;stroke-linejoin:round}
.ch-p{fill:var(--sc)}
.ch-b{fill:var(--sc)}
.ex-item{border-left:5px solid var(--sc);padding:4px 0 4px 14px;margin-bottom:14px}
.pun{border-collapse:collapse;margin:8px 0 14px}
.pun th,.pun td{border:1px solid var(--line);padding:10px 22px;text-align:center;font-size:1.15rem}
.pun th{background:var(--soft)}
.pun caption{font-weight:700;margin-bottom:6px;text-align:left}
.stat{font-family:var(--font-display);font-size:3rem;font-weight:700;line-height:1}
.foot{margin-top:26px}

/* layout semplificato, pensato per il telefono */
main{padding-bottom:32px}
.tabbar{position:sticky;bottom:0;z-index:10;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;appearance:none;border:0;background:none;font:inherit;font-size:.78rem;font-weight:700;color:var(--muted);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;position:relative;cursor:pointer}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.hero{border-top:7px solid var(--sc,var(--ink))}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 6px}
.btn.block{display:block;width:100%;margin-top:6px}
.center{text-align:center}
p.center{margin:8px 0 0}
.steps{list-style:none;padding:0;margin:16px 0 14px;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;margin:0}
.steps .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none}
.steps li.done .n{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.steps li.cur .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lbar{display:flex;gap:6px;margin:8px 0 16px}
.lbar span{flex:1;text-align:center;font-size:.82rem;font-weight:700;padding:8px 2px;border-radius:8px;background:var(--soft);color:var(--muted)}
.lbar span.cur{background:var(--ink);color:var(--bg)}
.lbar span.done{background:color-mix(in srgb,var(--ok) 22%,var(--surface));color:var(--ink)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.qc{appearance:none;text-align:left;font:inherit;font-size:.92rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:92px;cursor:pointer}
.qc b{display:block;font-family:var(--font-display);font-size:2rem;line-height:1.1;color:var(--ink)}
.qc:disabled{opacity:.55;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul.plain{list-style:none;padding:0;margin:0}
.lab{display:block;font-size:.85rem;color:var(--muted)}
.go{color:var(--muted);font-weight:700;white-space:nowrap}
details.more>summary{cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:30px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:1.5rem;color:var(--muted);line-height:1}
details.more[open]>summary::after{content:"−"}
details.more[open]>summary{margin-bottom:14px}
details.errq{border-top:1px solid var(--line);padding:12px 0}
details.errq>summary{cursor:pointer;font-weight:700;list-style:none}
details.errq>summary::-webkit-details-marker{display:none}
details.errq>summary::before{content:"›";display:inline-block;width:1em;color:var(--muted);transition:transform .2s}
details.errq[open]>summary::before{transform:rotate(90deg)}
details.errq[open]>summary{margin-bottom:8px}
.qt{font-size:1.25rem;margin:4px 0 16px}

/* movimento: risponde alle azioni, poco altrove */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes seg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes nodein{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes glow{50%{opacity:.5}}
@keyframes drop{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
main.enter{animation:rise .24s ease-out}
main.enter .meter i.on{transform-origin:left center;animation:seg .5s ease-out both;animation-delay:calc(var(--i,0)*110ms + 250ms)}
main.enter .flow li{animation:rise .45s ease-out both;animation-delay:calc(var(--i)*140ms + 150ms)}
.opt.ok.fx{animation:pop .4s ease-out}
.opt.bad.fx{animation:shake .45s ease-out}
.fb.fx{animation:rise .3s ease-out .12s both}
.lvup{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-radius:10px;padding:10px 14px;margin:0 0 12px;animation:pop .5s ease-out .3s both}
.mc-e{stroke-dasharray:var(--len,300);stroke-dashoffset:var(--len,300);animation:draw .55s ease-out forwards;animation-delay:var(--d,0s)}
svg.mc g{transform-box:fill-box;transform-origin:center;animation:nodein .4s ease-out both;animation-delay:var(--d,0s)}
.ch-l{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
.ch-p{transform-box:fill-box;transform-origin:center;animation:nodein .3s ease-out 1s both}
.ch-b{transform-box:fill-box;transform-origin:center bottom;animation:grow .7s ease-out both}

/* guida */
.help{border-left:8px solid var(--fis)}
.flow{list-style:none;margin:12px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.flow li{display:flex;gap:10px;align-items:flex-start;margin:0}
.flow b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display)}
.flow p{margin:2px 0 0;font-size:.92rem;color:var(--muted)}

/* animazioni interattive */
.anim{--sc:var(--fis)}
.animsvg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.cap{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 12px;min-height:3.4em}
.sl{display:block;margin:10px 0}
.sl span{display:block}
.sl input[type=range]{width:100%;height:44px;accent-color:var(--sc)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.ta{width:100%;font:inherit;font-size:.9rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.read{display:flex;gap:6px 22px;flex-wrap:wrap;margin:10px 0;font-family:var(--font-display);font-size:1.05rem}
.read b{font-size:1.35rem}
.axis{stroke:var(--muted);stroke-width:1.5}
.txt{fill:var(--ink);font-size:15px;font-weight:700}
.txtm{fill:var(--muted);font-size:13px}
.ch{fill:var(--sc)}
.shell{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:3 5}
.nuc{fill:var(--sc)}
.nuct{fill:var(--on-sub);font-weight:700;font-size:16px}
.e{fill:var(--muted)}
.e.val{fill:var(--sc)}
.atom{fill:var(--surface);stroke:var(--ink);stroke-width:3;transition:fill .4s}
.atom.pos{fill:color-mix(in srgb,var(--fis) 22%,var(--surface))}
.atom.neg{fill:color-mix(in srgb,var(--chim) 22%,var(--surface))}
.alab{fill:var(--ink);font-size:24px;font-weight:700;font-family:var(--font-display)}
.toks{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.tok{display:inline-grid;place-items:center;min-width:48px;height:40px;padding:0 8px;border-radius:99px;color:var(--on-sub);font-weight:700;animation:pop .35s ease-out both;animation-delay:calc(var(--i)*60ms)}
.tok.h{background:var(--fis)}
.tok.o{background:var(--chim)}
.tok.w{background:var(--bio)}
.mole-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.phbar{position:relative;height:26px;border-radius:8px;background:linear-gradient(90deg,#D7263D,#F18F01 25%,#5FAD56 50%,#2E86AB 75%,#6A4C93);margin:26px 0 14px}
.phbar i{position:absolute;top:-10px;left:50%;width:6px;height:46px;margin-left:-3px;background:var(--ink);border-radius:3px;transition:left .25s ease-out;box-shadow:0 0 0 2px var(--bg)}
.ph-read{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.ph-big{font-family:var(--font-display);font-size:2.4rem;font-weight:700;line-height:1}
.ions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.dots{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;margin-top:6px}
.dot{width:16px;height:16px;border-radius:50%;animation:nodein .3s ease-out both}
.dot.hp{background:var(--chim)}
.dot.oh{background:var(--fis)}
.org{cursor:pointer}
.org.hot{animation:glow 1.1s ease-in-out infinite;filter:drop-shadow(0 0 5px var(--sc))}
.cmem{fill:color-mix(in srgb,var(--bio) 8%,var(--surface));stroke:var(--bio);stroke-width:5}
.wall{fill:none;stroke:var(--muted);stroke-width:10;opacity:.55}
.nucl{fill:color-mix(in srgb,var(--fis) 16%,var(--surface));stroke:var(--fis);stroke-width:3}
.nucleolus{fill:var(--fis)}
.mit{fill:color-mix(in srgb,var(--chim) 20%,var(--surface));stroke:var(--chim);stroke-width:3}
.cr{fill:none;stroke:var(--chim);stroke-width:2}
.rerl{fill:none;stroke:var(--ink);stroke-width:3;opacity:.7}
.rd{fill:var(--ink)}
.golgi{fill:none;stroke:var(--fis);stroke-width:6;stroke-linecap:round}
.lis{fill:color-mix(in srgb,var(--chim) 35%,var(--surface));stroke:var(--chim);stroke-width:3}
.clo{fill:color-mix(in srgb,var(--bio) 45%,var(--surface));stroke:var(--bio);stroke-width:3}
.vac{fill:color-mix(in srgb,var(--fis) 14%,var(--surface));stroke:var(--fis);stroke-width:3;stroke-dasharray:6 5}
.infobox{background:var(--soft);border-radius:10px;padding:12px 14px;margin:12px 0;min-height:4.4em}
.beaker{fill:color-mix(in srgb,var(--fis) 7%,var(--surface));stroke:var(--line);stroke-width:2}
.cellb{fill:color-mix(in srgb,var(--bio) 12%,var(--surface));stroke:var(--bio);stroke-width:5}
.cellb.burst{stroke:var(--bad)}
.sol{fill:var(--chim)}
.wat{fill:var(--fis)}
.dnaw{overflow-x:auto;padding-bottom:6px}
.dna{display:grid;grid-template-columns:repeat(12,minmax(38px,1fr));gap:4px;min-width:500px}
.rowlab{grid-column:1/-1;font-size:.9rem;color:var(--muted);margin-top:8px}
.b{height:46px;display:grid;place-items:center;border-radius:8px;font-family:var(--font-display);font-weight:700;font-size:1.2rem;background:var(--soft)}
.b[data-b="A"]{background:color-mix(in srgb,var(--fis) 24%,var(--surface))}
.b[data-b="T"],.b[data-b="U"]{background:color-mix(in srgb,var(--chim) 24%,var(--surface))}
.b[data-b="C"]{background:color-mix(in srgb,var(--bio) 24%,var(--surface))}
.b[data-b="G"]{background:color-mix(in srgb,var(--ink) 14%,var(--surface))}
.b.empty{background:transparent;border:2px dashed var(--line)}
.b.new{animation:drop .45s ease-out both}
.b.aa{grid-column:span 3;background:var(--ink);color:var(--bg)}
.b.aa.empty{background:transparent;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:56px 1fr 1fr;gap:6px;max-width:420px;margin:12px 0}
.pg-h{display:grid;place-items:center;font-weight:700;font-size:1.3rem;font-family:var(--font-display)}
.pc{display:grid;place-items:center;height:68px;border-radius:10px;font-family:var(--font-display);font-weight:700;font-size:1.5rem;animation:pop .45s ease-out both;animation-delay:calc(var(--i)*120ms)}
.pc.AA{background:var(--bio);color:var(--on-sub)}
.pc.Aa{background:color-mix(in srgb,var(--bio) 45%,var(--surface))}
.pc.aa{background:var(--soft);border:2px solid var(--bio)}
.sbar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:12px 0;border:1px solid var(--line)}
.sbar>div{transition:width .5s ease-out;display:grid;place-items:center;font-size:.85rem;font-weight:700;overflow:hidden;white-space:nowrap}
.car{fill:var(--sc)}
.wheel{fill:var(--ink)}
.area{fill:var(--sc);opacity:.25}
.line{stroke:var(--sc);stroke-width:3;fill:none}

<script>
(function(){
'use strict';

/* ---------- Dati: materie, argomenti, domande ---------- */
var LV={1:'Base',2:'Intermedio',3:'Avanzato'};
var SUBJ={chim:{n:'Chimica',v:'--chim'},bio:{n:'Biologia',v:'--bio'},fis:{n:'Fisica',v:'--fis'}};
var TOPICS=[
 {id:'ch_atomo',s:'chim',n:'Atomo e tavola periodica'},
 {id:'ch_legami',s:'chim',n:'Legami e molecole'},
 {id:'ch_mole',s:'chim',n:'Mole e stechiometria'},
 {id:'ch_ph',s:'chim',n:'Acidi, basi e pH'},
 {id:'bi_cell',s:'bio',n:'La cellula'},
 {id:'bi_memb',s:'bio',n:'Membrana e trasporto'},
 {id:'bi_dna',s:'bio',n:'DNA e sintesi proteica'},
 {id:'bi_gen',s:'bio',n:'Genetica mendeliana'},
 {id:'fi_cin',s:'fis',n:'Cinematica'},
 {id:'fi_din',s:'fis',n:'Forze e leggi di Newton'},
 {id:'fi_en',s:'fis',n:'Lavoro ed energia'},
 {id:'fi_el',s:'fis',n:'Circuiti elettrici'}
];

/* t = argomento, l = livello (1-3), o = opzioni, a = indice della risposta corretta, e = spiegazione */
var QB=[
{id:'ch_atomo1',t:'ch_atomo',l:1,q:`Quanti protoni, neutroni ed elettroni ha un atomo neutro di sodio ²³Na (Z = 11)?`,o:[`11 protoni, 12 neutroni, 11 elettroni`,`11 protoni, 23 neutroni, 11 elettroni`,`12 protoni, 11 neutroni, 12 elettroni`,`23 protoni, 11 neutroni, 23 elettroni`],a:0,e:`Z = 11 è il numero di protoni e, in un atomo neutro, gli elettroni sono uguali ai protoni (11). I neutroni sono A − Z = 23 − 11 = 12.`},
{id:'ch_atomo2',t:'ch_atomo',l:2,q:`Come variano in genere l'elettronegatività e il raggio atomico lungo un periodo, da sinistra a destra?`,o:[`L'elettronegatività aumenta e il raggio diminuisce`,`L'elettronegatività diminuisce e il raggio aumenta`,`Entrambe aumentano`,`Entrambe diminuiscono`],a:0,e:`Andando a destra la carica del nucleo cresce mentre il livello energetico esterno resta lo stesso: il nucleo attira di più gli elettroni, quindi il raggio si riduce e l'elettronegatività aumenta.`},
{id:'ch_atomo3',t:'ch_atomo',l:3,q:`Qual è la configurazione elettronica dello ione Cl⁻ (Z = 17)?`,o:[`1s² 2s² 2p⁶ 3s² 3p⁶`,`1s² 2s² 2p⁶ 3s² 3p⁵`,`1s² 2s² 2p⁶ 3s² 3p⁴`,`1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹`],a:0,e:`Il cloro neutro ha 17 elettroni (…3s² 3p⁵). Lo ione Cl⁻ ne ha 18: completa il sottolivello 3p e diventa isoelettronico con l'argon.`},

{id:'ch_legami1',t:'ch_legami',l:1,q:`Quale tipo di legame tiene uniti gli ioni nel cloruro di sodio (NaCl)?`,o:[`Ionico`,`Covalente apolare`,`Metallico`,`Legame a idrogeno`],a:0,e:`Il sodio (metallo) cede un elettrone al cloro (non metallo): si formano Na⁺ e Cl⁻ tenuti insieme dall'attrazione elettrostatica, cioè un legame ionico.`},
{id:'ch_legami2',t:'ch_legami',l:2,q:`Perché l'acqua ha un punto di ebollizione molto più alto di H₂S, pur avendo massa molecolare minore?`,o:[`Tra le molecole d'acqua si formano legami a idrogeno`,`L'acqua ha legami covalenti interni più forti`,`L'acqua è una molecola apolare`,`L'acqua contiene ioni`],a:0,e:`L'ossigeno è piccolo e molto elettronegativo: l'idrogeno legato a O forma legami a idrogeno con le molecole vicine, e questi legami intermolecolari vanno spezzati per far bollire il liquido. Con lo zolfo l'effetto è trascurabile.`},
{id:'ch_legami3',t:'ch_legami',l:3,q:`Qual è la geometria della molecola di ammoniaca (NH₃) secondo il modello VSEPR?`,o:[`Piramidale trigonale`,`Planare trigonale`,`Tetraedrica`,`Lineare`],a:0,e:`L'azoto ha 4 coppie di elettroni attorno a sé: 3 di legame e 1 solitaria. Le 4 coppie si dispongono a tetraedro, ma la forma della molecola (contando solo gli atomi) è piramidale trigonale.`},

{id:'ch_mole1',t:'ch_mole',l:1,q:`Quante moli sono contenute in 36 g di acqua (M = 18 g/mol)?`,o:[`2 mol`,`0,5 mol`,`18 mol`,`648 mol`],a:0,e:`n = m / M = 36 g / 18 g/mol = 2 mol.`},
{id:'ch_mole2',t:'ch_mole',l:2,q:`Quante molecole sono presenti in 0,5 mol di una sostanza?`,o:[`3,0 × 10²³`,`6,0 × 10²³`,`1,2 × 10²⁴`,`3,0 × 10²⁴`],a:0,e:`Si moltiplica il numero di moli per il numero di Avogadro: 0,5 × 6,022 × 10²³ ≈ 3,0 × 10²³ molecole.`},
{id:'ch_mole3',t:'ch_mole',l:3,q:`Nella reazione 2 H₂ + O₂ → 2 H₂O si fanno reagire 4 mol di H₂ e 1 mol di O₂. Quante moli di H₂O si formano?`,o:[`2 mol`,`4 mol`,`1 mol`,`5 mol`],a:0,e:`Per consumare 4 mol di H₂ servirebbero 2 mol di O₂, ma ce n'è solo 1: O₂ è il reagente limitante. Dal rapporto 1 O₂ : 2 H₂O si formano 2 mol di acqua.`},

{id:'ch_ph1',t:'ch_ph',l:1,q:`Qual è il pH di una soluzione di HCl 0,01 M (acido forte)?`,o:[`2`,`1`,`12`,`0,01`],a:0,e:`HCl si dissocia completamente: [H⁺] = 10⁻² M, quindi pH = −log(10⁻²) = 2.`},
{id:'ch_ph2',t:'ch_ph',l:2,q:`Qual è il pH di una soluzione di NaOH 0,001 M a 25 °C?`,o:[`11`,`3`,`10`,`14`],a:0,e:`NaOH è una base forte: [OH⁻] = 10⁻³ M, quindi pOH = 3. A 25 °C pH + pOH = 14, perciò pH = 11.`},
{id:'ch_ph3',t:'ch_ph',l:3,q:`Quale coppia di sostanze, in soluzione acquosa, forma una soluzione tampone?`,o:[`CH₃COOH e CH₃COONa`,`HCl e NaCl`,`NaOH e NaCl`,`HNO₃ e NaNO₃`],a:0,e:`Un tampone contiene un acido debole e la sua base coniugata (o una base debole e il suo acido coniugato). CH₃COOH è un acido debole e CH₃COO⁻ (da CH₃COONa) è la sua base coniugata. Nelle altre coppie l'acido o la base è forte.`},

{id:'bi_cell1',t:'bi_cell',l:1,q:`Quale organulo è la sede principale della produzione di ATP nella respirazione aerobica?`,o:[`Mitocondrio`,`Lisosoma`,`Apparato di Golgi`,`Nucleolo`],a:0,e:`Nei mitocondri avvengono il ciclo di Krebs e la fosforilazione ossidativa, che producono la maggior parte dell'ATP.`},
{id:'bi_cell2',t:'bi_cell',l:2,q:`Quale struttura è presente nelle cellule vegetali ma non in quelle animali?`,o:[`Parete cellulare`,`Mitocondri`,`Ribosomi`,`Membrana plasmatica`],a:0,e:`La parete cellulare (di cellulosa nelle piante) circonda la membrana plasmatica e dà sostegno alla cellula. Mitocondri, ribosomi e membrana plasmatica sono presenti in entrambe.`},
{id:'bi_cell3',t:'bi_cell',l:3,q:`Dove vengono sintetizzate le proteine destinate a essere secrete dalla cellula?`,o:[`Ribosomi legati al reticolo endoplasmatico rugoso`,`Reticolo endoplasmatico liscio`,`Lisosomi`,`Perossisomi`],a:0,e:`Le proteine da secernere sono prodotte dai ribosomi del reticolo endoplasmatico rugoso, poi passano all'apparato di Golgi per essere modificate e smistate in vescicole. Il reticolo liscio non ha ribosomi e si occupa soprattutto di lipidi.`},

{id:'bi_memb1',t:'bi_memb',l:1,q:`Come sono orientati i fosfolipidi nel doppio strato della membrana plasmatica?`,o:[`Teste idrofile verso l'esterno e code idrofobiche verso l'interno`,`Teste idrofobiche verso l'esterno e code idrofile verso l'interno`,`Tutte le code verso l'esterno`,`Senza un ordine preciso`],a:0,e:`Le teste fosfato sono idrofile e guardano l'ambiente acquoso (fuori e dentro la cellula); le code di acidi grassi sono idrofobiche e restano nascoste al centro del doppio strato.`},
{id:'bi_memb2',t:'bi_memb',l:2,q:`Una cellula animale viene messa in una soluzione ipotonica rispetto al suo citoplasma. Cosa accade?`,o:[`L'acqua entra per osmosi e la cellula si gonfia, fino a rompersi se l'eccesso è grande`,`L'acqua esce e la cellula si raggrinzisce`,`Non c'è movimento netto di acqua`,`Entrano ioni per trasporto attivo`],a:0,e:`Ipotonica significa meno soluti fuori che dentro: l'acqua si sposta verso l'ambiente più concentrato, cioè dentro la cellula. Senza parete cellulare, la cellula animale può gonfiarsi e lisarsi.`},
{id:'bi_memb3',t:'bi_memb',l:3,q:`Quale affermazione sulla pompa Na⁺/K⁺ è corretta?`,o:[`Porta 3 Na⁺ fuori e 2 K⁺ dentro usando ATP, contro gradiente`,`Porta Na⁺ e K⁺ secondo gradiente senza consumare energia`,`Porta 2 Na⁺ fuori e 3 K⁺ dentro usando ATP`,`Porta solo K⁺ verso l'esterno`],a:0,e:`È un trasporto attivo: per ogni ATP idrolizzato escono 3 Na⁺ ed entrano 2 K⁺, contro i rispettivi gradienti. Crea il gradiente elettrochimico essenziale per neuroni e muscoli.`},

{id:'bi_dna1',t:'bi_dna',l:1,q:`Quali coppie di basi azotate si appaiano nella doppia elica del DNA?`,o:[`A con T e G con C`,`A con G e T con C`,`A con C e G con T`,`A con U e G con C`],a:0,e:`Adenina e timina formano 2 legami a idrogeno; guanina e citosina ne formano 3. L'uracile compare solo nell'RNA.`},
{id:'bi_dna2',t:'bi_dna',l:2,q:`In una cellula eucariote, dove avviene la trascrizione?`,o:[`Nel nucleo`,`Sui ribosomi`,`Nell'apparato di Golgi`,`Nei lisosomi`],a:0,e:`La trascrizione (DNA → mRNA) avviene nel nucleo. L'mRNA maturo esce poi nel citoplasma, dove i ribosomi lo traducono in proteina.`},
{id:'bi_dna3',t:'bi_dna',l:3,q:`Un tratto di DNA stampo è 3'-TAC-5'. Quale mRNA viene trascritto?`,o:[`5'-AUG-3'`,`5'-UAC-3'`,`5'-ATG-3'`,`5'-GUA-3'`],a:0,e:`L'mRNA è complementare e antiparallelo allo stampo: T→A, A→U, C→G, e si legge in direzione 5'→3'. Si ottiene 5'-AUG-3', il codone di inizio. Nell'RNA non c'è timina (T) ma uracile (U).`},

{id:'bi_gen1',t:'bi_gen',l:1,q:`Incrocio Aa × Aa (A dominante su a). Qual è il rapporto fenotipico atteso nella prole?`,o:[`3 dominanti : 1 recessivo`,`1 : 1`,`1 : 2 : 1`,`Tutti dominanti`],a:0,e:`I genotipi attesi sono 1 AA : 2 Aa : 1 aa. AA e Aa mostrano il fenotipo dominante, aa quello recessivo: rapporto fenotipico 3 : 1. Il rapporto 1 : 2 : 1 è invece quello genotipico.`},
{id:'bi_gen2',t:'bi_gen',l:2,q:`Incrocio Aa × aa. Qual è la probabilità che un figlio sia aa?`,o:[`1/2`,`1/4`,`3/4`,`0`],a:0,e:`Aa produce gameti A e a (50% ciascuno), aa produce solo gameti a: i figli sono Aa (1/2) e aa (1/2).`},
{id:'bi_gen3',t:'bi_gen',l:3,q:`Due genitori sani sono entrambi portatori di una malattia autosomica recessiva. Un loro figlio è sano: qual è la probabilità che sia portatore?`,o:[`2/3`,`1/2`,`1/4`,`3/4`],a:0,e:`I genotipi possibili sono AA (1/4), Aa (2/4), aa (1/4). Sapendo che il figlio è sano si esclude aa: restano AA (1 parte) e Aa (2 parti) su 3, quindi la probabilità di essere portatore è 2/3.`},

{id:'fi_cin1',t:'fi_cin',l:1,q:`Un'auto viaggia a velocità costante di 20 m/s per 5 s. Quanta strada percorre?`,o:[`100 m`,`4 m`,`25 m`,`10 m`],a:0,e:`Nel moto rettilineo uniforme s = v · t = 20 m/s × 5 s = 100 m.`},
{id:'fi_cin2',t:'fi_cin',l:2,q:`Un corpo parte da fermo con accelerazione costante a = 2 m/s². Che velocità ha dopo 5 s?`,o:[`10 m/s`,`2,5 m/s`,`7 m/s`,`25 m/s`],a:0,e:`v = v₀ + a · t = 0 + 2 · 5 = 10 m/s.`},
{id:'fi_cin3',t:'fi_cin',l:3,q:`Un sasso viene lasciato cadere da 20 m di altezza (g = 10 m/s², senza attrito dell'aria). Dopo quanto tempo tocca terra?`,o:[`2 s`,`4 s`,`1 s`,`√2 s`],a:0,e:`h = ½ · g · t², quindi t = √(2h/g) = √(2 · 20 / 10) = √4 = 2 s.`},

{id:'fi_din1',t:'fi_din',l:1,q:`Secondo il primo principio della dinamica, un corpo su cui la risultante delle forze è nulla…`,o:[`resta fermo o si muove di moto rettilineo uniforme`,`si ferma dopo un po'`,`accelera in modo costante`,`si muove di moto circolare`],a:0,e:`È il principio di inerzia: senza una forza risultante la velocità non cambia, né in modulo né in direzione.`},
{id:'fi_din2',t:'fi_din',l:2,q:`Su un corpo di massa 2 kg agisce una forza risultante di 10 N. Qual è la sua accelerazione?`,o:[`5 m/s²`,`20 m/s²`,`0,2 m/s²`,`12 m/s²`],a:0,e:`Secondo principio: a = F / m = 10 N / 2 kg = 5 m/s².`},
{id:'fi_din3',t:'fi_din',l:3,q:`Un blocco scivola senza attrito su un piano inclinato di 30° (g = 10 m/s²). Qual è la sua accelerazione lungo il piano?`,o:[`5 m/s²`,`10 m/s²`,`8,7 m/s²`,`2,5 m/s²`],a:0,e:`Lungo il piano agisce la componente del peso m·g·sin θ, quindi a = g · sin 30° = 10 · 0,5 = 5 m/s². Il valore 8,7 m/s² si otterrebbe usando per errore il coseno.`},

{id:'fi_en1',t:'fi_en',l:1,q:`Qual è l'unità di misura dell'energia nel Sistema Internazionale?`,o:[`Joule`,`Watt`,`Newton`,`Pascal`],a:0,e:`Il joule (J) misura energia e lavoro. Il watt (W) misura la potenza, cioè joule al secondo.`},
{id:'fi_en2',t:'fi_en',l:2,q:`Qual è l'energia cinetica di un corpo di 2 kg che si muove a 3 m/s?`,o:[`9 J`,`6 J`,`18 J`,`3 J`],a:0,e:`Ec = ½ · m · v² = ½ · 2 · 3² = 9 J. Attenzione: la velocità va elevata al quadrato.`},
{id:'fi_en3',t:'fi_en',l:3,q:`Un corpo di 1 kg cade da 5 m di altezza senza attrito (g = 10 m/s²). Con che velocità arriva a terra?`,o:[`10 m/s`,`5 m/s`,`50 m/s`,`7 m/s`],a:0,e:`Per la conservazione dell'energia m·g·h = ½·m·v², quindi v = √(2·g·h) = √(2 · 10 · 5) = 10 m/s. La massa si semplifica.`},

{id:'fi_el1',t:'fi_el',l:1,q:`Qual è l'espressione della legge di Ohm?`,o:[`V = R · I`,`V = I / R`,`R = V · I`,`I = V · R`],a:0,e:`La tensione ai capi di un resistore è il prodotto di resistenza e corrente: V = R · I (volt = ohm × ampere).`},
{id:'fi_el2',t:'fi_el',l:2,q:`Due resistori da 10 Ω in serie sono collegati a una batteria da 20 V. Qual è la corrente?`,o:[`1 A`,`2 A`,`4 A`,`0,5 A`],a:0,e:`In serie le resistenze si sommano: R = 20 Ω. Quindi I = V / R = 20 V / 20 Ω = 1 A.`},
{id:'fi_el3',t:'fi_el',l:3,q:`Qual è la resistenza equivalente di due resistori da 10 Ω collegati in parallelo?`,o:[`5 Ω`,`20 Ω`,`10 Ω`,`0,2 Ω`],a:0,e:`In parallelo 1/R = 1/10 + 1/10 = 2/10, quindi R = 5 Ω. In parallelo la resistenza equivalente è sempre minore della più piccola.`},
{id:'ch_atomo4',t:'ch_atomo',l:1,q:`Che cosa hanno in comune gli isotopi di uno stesso elemento?`,o:[`Lo stesso numero atomico Z`,`Lo stesso numero di neutroni`,`Lo stesso numero di massa A`,`Lo stesso numero di nucleoni`],a:0,e:`Gli isotopi hanno lo stesso Z (stesso numero di protoni, quindi stesso elemento) ma un diverso numero di neutroni, e perciò un diverso numero di massa A.`},
{id:'ch_atomo5',t:'ch_atomo',l:2,q:`Quanti elettroni di valenza ha un atomo di ossigeno (Z = 8)?`,o:[`6`,`2`,`8`,`4`],a:0,e:`La configurazione è 1s² 2s² 2p⁴: gli elettroni del livello più esterno (n = 2) sono 2 + 4 = 6. L'ossigeno è nel gruppo 16 e tende ad acquistare 2 elettroni.`},
{id:'ch_atomo6',t:'ch_atomo',l:3,q:`Quale tra questi elementi ha la prima energia di ionizzazione più alta?`,o:[`Elio`,`Litio`,`Sodio`,`Potassio`],a:0,e:`L'energia di ionizzazione cresce verso destra lungo un periodo e verso l'alto lungo un gruppo. L'elio ha il guscio completo e vicinissimo al nucleo: strappare un elettrone costa moltissimo. Litio, sodio e potassio sono metalli alcalini e cedono facilmente l'elettrone esterno.`},
{id:'ch_legami4',t:'ch_legami',l:1,q:`Quale di queste molecole contiene un legame covalente doppio?`,o:[`O₂`,`H₂`,`N₂`,`HCl`],a:0,e:`In O₂ i due atomi condividono due coppie di elettroni (O=O). H₂ e HCl hanno un legame singolo, N₂ un legame triplo.`},
{id:'ch_legami5',t:'ch_legami',l:2,q:`Quale di queste molecole è polare?`,o:[`H₂O`,`CO₂`,`CH₄`,`N₂`],a:0,e:`H₂O è angolare, quindi i due dipoli O–H non si annullano. CO₂ è lineare e CH₄ tetraedrica: i dipoli si compensano. N₂ ha atomi uguali, senza differenza di elettronegatività.`},
{id:'ch_legami6',t:'ch_legami',l:3,q:`Qual è l'ibridazione del carbonio nel metano (CH₄)?`,o:[`sp³`,`sp²`,`sp`,`sp³d`],a:0,e:`Il carbonio forma 4 legami σ identici: un orbitale s e tre p si mescolano in quattro orbitali sp³, diretti ai vertici di un tetraedro (angoli di 109,5°).`},
{id:'ch_mole4',t:'ch_mole',l:1,q:`Qual è la massa molare di CO₂ (C = 12 g/mol, O = 16 g/mol)?`,o:[`44 g/mol`,`28 g/mol`,`60 g/mol`,`32 g/mol`],a:0,e:`M = 12 + 2 · 16 = 44 g/mol.`},
{id:'ch_mole5',t:'ch_mole',l:2,q:`Quanti grammi di NaOH (M = 40 g/mol) servono per preparare 500 mL di soluzione 0,2 M?`,o:[`4 g`,`8 g`,`40 g`,`0,4 g`],a:0,e:`n = M · V = 0,2 mol/L · 0,5 L = 0,1 mol. m = n · M = 0,1 · 40 = 4 g. Attenzione a convertire i mL in litri.`},
{id:'ch_mole6',t:'ch_mole',l:3,q:`Si diluiscono 100 mL di una soluzione 0,5 M fino a un volume finale di 250 mL. Qual è la nuova molarità?`,o:[`0,2 M`,`1,25 M`,`0,05 M`,`0,4 M`],a:0,e:`Le moli non cambiano: M₁V₁ = M₂V₂, quindi M₂ = 0,5 · 100 / 250 = 0,2 M.`},
{id:'ch_ph4',t:'ch_ph',l:1,q:`Una soluzione con pH 3 è…`,o:[`acida`,`neutra`,`basica`,`un tampone`],a:0,e:`Per pH minore di 7 la soluzione è acida: [H⁺] = 10⁻³ M, più alta di quella dell'acqua pura.`},
{id:'ch_ph5',t:'ch_ph',l:2,q:`Di quante volte aumenta [H⁺] passando da pH 5 a pH 3?`,o:[`100 volte`,`2 volte`,`10 volte`,`1000 volte`],a:0,e:`La scala del pH è logaritmica: ogni unità in meno vuol dire 10 volte più H⁺. Due unità in meno sono 10 · 10 = 100 volte.`},
{id:'ch_ph6',t:'ch_ph',l:3,q:`Quale sale, sciolto in acqua, dà una soluzione basica?`,o:[`CH₃COONa`,`NaCl`,`NH₄Cl`,`KNO₃`],a:0,e:`CH₃COO⁻ è la base coniugata dell'acido acetico (un acido debole) e reagisce con l'acqua producendo OH⁻. NaCl e KNO₃ derivano da acido e base forti (neutri); NH₄Cl dà una soluzione acida.`},
{id:'bi_cell4',t:'bi_cell',l:1,q:`Quale organulo contiene enzimi digestivi?`,o:[`Lisosoma`,`Mitocondrio`,`Ribosoma`,`Nucleolo`],a:0,e:`I lisosomi contengono enzimi idrolitici che digeriscono molecole e organuli danneggiati.`},
{id:'bi_cell5',t:'bi_cell',l:2,q:`Quale caratteristica distingue una cellula procariote da una eucariote?`,o:[`Non ha un nucleo delimitato da membrana`,`Non ha DNA`,`Non ha ribosomi`,`Non ha membrana plasmatica`],a:0,e:`Le procariote hanno DNA, ribosomi e membrana plasmatica, ma il DNA non è racchiuso in un nucleo. Non hanno organuli delimitati da membrana.`},
{id:'bi_cell6',t:'bi_cell',l:3,q:`Dove avviene il ciclo di Krebs nelle cellule eucariote?`,o:[`Nella matrice mitocondriale`,`Nel citoplasma`,`Sulla membrana plasmatica`,`Nel nucleo`],a:0,e:`Il ciclo di Krebs si svolge nella matrice del mitocondrio. La glicolisi avviene nel citoplasma e la catena di trasporto degli elettroni sulla membrana mitocondriale interna.`},
{id:'bi_memb4',t:'bi_memb',l:1,q:`Quale processo trasporta molecole secondo gradiente senza consumare energia?`,o:[`Diffusione`,`Trasporto attivo`,`Pompa Na⁺/K⁺`,`Idrolisi di ATP`],a:0,e:`La diffusione è un trasporto passivo: le molecole vanno dalla zona più concentrata a quella meno concentrata, senza ATP.`},
{id:'bi_memb5',t:'bi_memb',l:2,q:`Che cos'è l'osmosi?`,o:[`Il passaggio di acqua attraverso una membrana semipermeabile`,`Il passaggio di soluti contro gradiente`,`L'ingresso di particelle grandi nella cellula`,`La sintesi di ATP`],a:0,e:`L'osmosi è il movimento dell'acqua, attraverso una membrana semipermeabile, verso la soluzione con più soluti.`},
{id:'bi_memb6',t:'bi_memb',l:3,q:`Che cosa accade a una cellula vegetale posta in una soluzione ipotonica?`,o:[`Si gonfia ma non scoppia grazie alla parete cellulare: diventa turgida`,`Scoppia sempre`,`Si raggrinzisce`,`Non scambia acqua`],a:0,e:`L'acqua entra per osmosi, ma la parete rigida resiste alla pressione. La cellula diventa turgida, che è la condizione normale di una pianta ben idratata.`},
{id:'bi_dna4',t:'bi_dna',l:1,q:`Quale zucchero è presente nel DNA?`,o:[`Desossiribosio`,`Ribosio`,`Glucosio`,`Fruttosio`],a:0,e:`Il DNA contiene desossiribosio (da cui il nome); l'RNA contiene ribosio.`},
{id:'bi_dna5',t:'bi_dna',l:2,q:`Cosa significa che la replicazione del DNA è semiconservativa?`,o:[`Ogni nuova doppia elica contiene un filamento originale e uno nuovo`,`Metà del DNA viene distrutto`,`Si replica solo metà del genoma`,`I due filamenti originali restano insieme`],a:0,e:`I due filamenti si separano e ognuno fa da stampo per uno nuovo: le due molecole figlie sono formate da un filamento vecchio e uno appena sintetizzato.`},
{id:'bi_dna6',t:'bi_dna',l:3,q:`Un codone dell'mRNA è 5'-GCU-3'. Quale anticodone del tRNA si appaia, letto da 3' a 5'?`,o:[`3'-CGA-5'`,`3'-GCU-5'`,`3'-CGT-5'`,`3'-UCG-5'`],a:0,e:`L'anticodone è complementare e antiparallelo al codone: G→C, C→G, U→A. Si ottiene 3'-CGA-5'. Nell'RNA non c'è timina, quindi CGT non può essere corretto.`},
{id:'bi_gen4',t:'bi_gen',l:1,q:`Un individuo con genotipo Aa è…`,o:[`eterozigote`,`omozigote dominante`,`omozigote recessivo`,`aploide`],a:0,e:`Ha due alleli diversi per il gene: è eterozigote. Si manifesta il carattere dominante, ma l'allele recessivo può essere trasmesso ai figli.`},
{id:'bi_gen5',t:'bi_gen',l:2,q:`Incrocio AA × aa. Qual è il genotipo di tutti i figli?`,o:[`Aa`,`AA`,`aa`,`Metà AA e metà aa`],a:0,e:`Un genitore dà sempre A e l'altro sempre a: tutti i figli sono Aa (prima generazione F1, tutta uguale).`},
{id:'bi_gen6',t:'bi_gen',l:3,q:`Due geni su cromosomi diversi. Incrocio AaBb × AaBb: qual è la probabilità di un figlio aabb?`,o:[`1/16`,`1/4`,`1/8`,`3/16`],a:0,e:`Per l'assortimento indipendente le probabilità si moltiplicano: P(aa) = 1/4 e P(bb) = 1/4, quindi P(aabb) = 1/16.`},
{id:'fi_cin4',t:'fi_cin',l:1,q:`Un ciclista percorre 36 km in 2 ore. Qual è la sua velocità media?`,o:[`18 km/h`,`72 km/h`,`38 km/h`,`34 km/h`],a:0,e:`v = spazio / tempo = 36 km / 2 h = 18 km/h.`},
{id:'fi_cin5',t:'fi_cin',l:2,q:`A quanti m/s corrispondono 72 km/h?`,o:[`20 m/s`,`72 m/s`,`259 m/s`,`7,2 m/s`],a:0,e:`Per passare da km/h a m/s si divide per 3,6: 72 / 3,6 = 20 m/s.`},
{id:'fi_cin6',t:'fi_cin',l:3,q:`Un'auto frena in modo uniforme da 20 m/s fino a fermarsi in 4 s. Quanta strada percorre in frenata?`,o:[`40 m`,`80 m`,`20 m`,`10 m`],a:0,e:`La velocità media è (20 + 0) / 2 = 10 m/s, quindi lo spazio è 10 · 4 = 40 m. Se si usasse 20 m/s per tutto il tempo (80 m) si sovrastimerebbe.`},
{id:'fi_din4',t:'fi_din',l:1,q:`Qual è il peso di un oggetto di massa 5 kg? (g = 10 m/s²)`,o:[`50 N`,`5 N`,`50 kg`,`0,5 N`],a:0,e:`P = m · g = 5 · 10 = 50 N. Il peso è una forza e si misura in newton, la massa in kilogrammi.`},
{id:'fi_din5',t:'fi_din',l:2,q:`Secondo il terzo principio della dinamica, se A esercita una forza su B, allora…`,o:[`B esercita su A una forza uguale e opposta`,`B non reagisce`,`B esercita una forza maggiore`,`le due forze si annullano perché agiscono sullo stesso corpo`],a:0,e:`Azione e reazione sono uguali e opposte ma applicate a corpi diversi, perciò non si annullano a vicenda.`},
{id:'fi_din6',t:'fi_din',l:3,q:`Un ascensore sale con accelerazione 2 m/s² verso l'alto (g = 10 m/s²). Quale forza segna la bilancia sotto una persona di 60 kg?`,o:[`720 N`,`600 N`,`480 N`,`120 N`],a:0,e:`Le forze sulla persona sono la normale N verso l'alto e il peso verso il basso: N − m·g = m·a, quindi N = m(g + a) = 60 · 12 = 720 N.`},
{id:'fi_en4',t:'fi_en',l:1,q:`Un corpo di 3 kg si trova a 10 m di altezza (g = 10 m/s²). Qual è la sua energia potenziale?`,o:[`300 J`,`30 J`,`3 J`,`100 J`],a:0,e:`U = m · g · h = 3 · 10 · 10 = 300 J.`},
{id:'fi_en5',t:'fi_en',l:2,q:`Una forza di 20 N sposta un oggetto di 5 m nella stessa direzione della forza. Quanto lavoro compie?`,o:[`100 J`,`4 J`,`25 J`,`15 J`],a:0,e:`L = F · s · cos 0° = 20 · 5 = 100 J.`},
{id:'fi_en6',t:'fi_en',l:3,q:`Un motore compie 6000 J di lavoro in 20 s. Qual è la sua potenza?`,o:[`300 W`,`120000 W`,`30 W`,`3000 W`],a:0,e:`P = L / t = 6000 J / 20 s = 300 W.`},
{id:'fi_el4',t:'fi_el',l:1,q:`Quale unità misura la resistenza elettrica?`,o:[`Ohm`,`Ampere`,`Volt`,`Watt`],a:0,e:`La resistenza si misura in ohm (Ω). L'ampere misura la corrente, il volt la tensione, il watt la potenza.`},
{id:'fi_el5',t:'fi_el',l:2,q:`Una lampada è attraversata da 0,5 A con una tensione di 12 V. Qual è la sua potenza?`,o:[`6 W`,`24 W`,`2 W`,`12 W`],a:0,e:`P = V · I = 12 · 0,5 = 6 W.`},
{id:'fi_el6',t:'fi_el',l:3,q:`Tre resistori da 6 Ω sono collegati in parallelo. Qual è la resistenza equivalente?`,o:[`2 Ω`,`18 Ω`,`6 Ω`,`3 Ω`],a:0,e:`1/R = 1/6 + 1/6 + 1/6 = 3/6, quindi R = 2 Ω. In parallelo si può usare anche R/n = 6/3 = 2 Ω quando i resistori sono uguali.`}
];

/* ---------- Utilità ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split(/\n{2,}/).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');}
function rich(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function topicOf(id){return TOPICS.find(function(t){return t.id===id;});}
function bank(){return QB.concat(S.custom);}
function qById(id){return bank().find(function(q){return q.id===id;});}
function T(id){return S.topics[id]||(S.topics[id]={level:1,streak:0,fragile:false,placed:false});}
function recent(tid,n){var r=[];for(var i=S.log.length-1;i>=0&&r.length<n;i--){if(S.log[i].t===tid)r.push(S.log[i]);}return r;}
function known(tid){return T(tid).placed||recent(tid,1).length>0;}
function unresolved(tid){return Object.keys(S.errors).filter(function(id){var q=qById(id);return q&&(!tid||q.t===tid)&&S.errors[id].ok<2;});}
function weakness(tid){var t=T(tid),r=recent(tid,10);if(!r.length&&!t.placed)return 0.5;var acc=r.length?r.filter(function(x){return x.ok;}).length/r.length:0.5;return Math.min((1-acc)*0.6+((3-t.level)/2)*0.4+Math.min(unresolved(tid).length,4)*0.08,1.2);}
function lastAns(qid){for(var i=S.log.length-1;i>=0;i--){if(S.log[i].q===qid)return S.log[i];}return null;}
function levelLabel(tid){var t=T(tid);if(!known(tid))return 'Da valutare';return t.fragile?'Da costruire':LV[t.level];}
function meter(tid){var t=T(tid),k=known(tid);return '<span class="meter" role="img" aria-label="'+esc(levelLabel(tid))+'" style="--sc:var('+SUBJ[topicOf(tid).s].v+')">'+[1,2,3].map(function(i){return '<i style="--i:'+(i-1)+'" class="'+(k&&i<=t.level&&!(t.fragile&&i===1)?'on':'')+'"></i>';}).join('')+'</span>';}

/* ---------- Claude (capability "sample") ---------- */
var sampleFn,sampleP=null;
function getSample(){
  if(sampleP)return sampleP;
  sampleP=(async function(){
    try{if(!window.claude||!window.claude.use)return null;var s=await window.claude.use('sample');return s||null;}catch(e){return null;}
  })().then(function(s){sampleFn=s||false;return s;});
  return sampleP;
}
function errMsg(e){
  var c=e&&e.code;
  if(c==='not_granted')return 'Per usare Claude serve il tuo permesso: riprova e accetta la richiesta.';
  if(c==='rate_limited')return 'Troppe richieste ravvicinate. Riprova tra poco.';
  if(c==='cancelled')return '';
  return 'Non sono riuscito a completare la richiesta. Riprova tra poco.';
}
function claudeOk(){return sampleFn!==false;}

/* ---------- Selezione domande e registrazione risposte ---------- */
function qWeight(q){
  var t=T(q.t),w=1,e=S.errors[q.id];
  if(e&&e.ok<2)w+=3;
  var l=lastAns(q.id);
  if(!l)w+=1;else if(l.ok&&Date.now()-l.ts<2*864e5)w*=0.3;
  var d=Math.abs(q.l-t.level);w+=d===0?2:d===1?0.5:0;
  w*=(0.6+weakness(q.t)*1.4);
  return Math.max(w,0.05);
}
function pickQuestions(pool,n){
  var arr=pool.map(function(q){return {q:q,w:qWeight(q)};}),out=[];
  while(out.length<n&&arr.length){
    var tot=arr.reduce(function(a,x){return a+x.w;},0),r=Math.random()*tot,i=0;
    for(;i<arr.length;i++){r-=arr[i].w;if(r<=0)break;}
    i=Math.min(i,arr.length-1);out.push(arr[i].q);arr.splice(i,1);
  }
  return out;
}
function record(q,orig,ok,place){
  var up=false;
  S.log.push({q:q.id,t:q.t,ok:ok,ts:Date.now()});
  if(S.log.length>600)S.log.splice(0,S.log.length-600);
  var e=S.errors[q.id];
  if(!ok){S.errors[q.id]={n:(e?e.n:0)+1,ok:0,last:orig,ts:Date.now()};S.cards[q.id]={box:1,due:Date.now()};}
  else if(e){e.ok=(e.ok||0)+1;}
  if(!place){
    var t=T(q.t);
    if(ok){if(q.l>=t.level){t.streak++;if(t.streak>=2&&t.level<3){t.level++;t.streak=0;t.fragile=false;up=true;}}}
    else if(q.l<=t.level){t.streak=0;if(t.level>1)t.level--;else t.fragile=true;}
  }
  save();
  return up;
}

/* ---------- Suggerimento "cosa fare adesso" ---------- */
function suggest(){
  var none=TOPICS.every(function(t){return !known(t.id);});
  if(none)return {h:'Comincia dal test di livello',p:'Poche domande per materia, che si adattano alle tue risposte. Servono a capire da dove far partire i quiz.',b:[{l:'Fai il test di livello',a:'go',v:'quiz'}]};
  var ranked=TOPICS.map(function(t){return {t:t,w:weakness(t.id)};}).sort(function(a,b){return b.w-a.w;});
  var top=ranked[0],tid=top.t.id,er=unresolved(tid).length,lv=T(tid).level,how;
  if(er>=2||lv===1||T(tid).fragile)how={tab:'anim',txt:'Guarda l\'animazione per capire il meccanismo, rileggi il riassunto e poi rifai le domande sbagliate.'};
  else if(lv===2)how={tab:'map',txt:'Guarda la mappa concettuale per collegare le idee, poi fai un quiz mirato.'};
  else how={tab:'ex',txt:'Hai buone basi: passa agli esempi svolti e a domande più difficili.'};
  var b=[{l:'Studia: '+top.t.n,a:'openTopic',t:tid,tab:how.tab},er?{l:'Rifai gli errori ('+er+')',a:'quizErrTopic',t:tid,g:1}:{l:'Quiz su questo argomento',a:'quizTopic',t:tid,g:1}];
  return {h:'Da rafforzare: '+top.t.n,p:(er?'Hai '+er+(er===1?' errore da recuperare. ':' errori da recuperare. '):'')+how.txt,b:b};
}

/* ---------- Mappe e grafici (SVG) ---------- */
function wrap(s,max){
  var w=String(s).split(/\s+/),lines=[],cur='';
  w.forEach(function(x){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x;}else cur=(cur+' '+x).trim();});
  if(cur)lines.push(cur);
  return lines.slice(0,3);
}
function validMap(m){return m&&typeof m.centro==='string'&&Array.isArray(m.rami)&&m.rami.length>=2&&m.rami.every(function(r){return r&&typeof r.t==='string';});}
function mapSVG(m,sv){
  var W=900,H=640,cx=W/2,cy=H/2,nodes=[],edges=[];
  function mk(x,y,text,cls,max){var L=wrap(text,max),fs=cls==='c'?19:cls==='b'?16.5:15;var w=Math.max.apply(null,L.map(function(l){return l.length;}))*fs*0.54+26;var lh=fs*1.22;return {x:x,y:y,w:w,h:L.length*lh+16,L:L,fs:fs,lh:lh,cls:cls};}
  var c=mk(cx,cy,m.centro,'c',14);c.d=0;nodes.push(c);
  var rami=m.rami.slice(0,6),n=rami.length,start=-90-180/n;
  rami.forEach(function(r,i){
    var ang=(start+i*360/n)*Math.PI/180;
    var b=mk(cx+210*Math.cos(ang),cy+140*Math.sin(ang),r.t,'b',16);b.d=0.2+i*0.2;nodes.push(b);edges.push([c,b]);
    var kids=(Array.isArray(r.figli)?r.figli:[]).filter(function(k){return typeof k==='string';}).slice(0,3),m2=kids.length;
    kids.forEach(function(k,j){
      var a2=ang+(j-(m2-1)/2)*(22*Math.PI/180);
      var l=mk(cx+380*Math.cos(a2),cy+262*Math.sin(a2),k,'l',20);l.d=0.35+i*0.2+j*0.1;nodes.push(l);edges.push([b,l]);
    });
  });
  nodes.forEach(function(nd){nd.x=Math.max(nd.w/2+4,Math.min(W-nd.w/2-4,nd.x));nd.y=Math.max(nd.h/2+4,Math.min(H-nd.h/2-4,nd.y));});
  var s='<svg class="mc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mappa concettuale: '+esc(m.centro)+'" style="--sc:var('+sv+')">';
  edges.forEach(function(e){var len=Math.hypot(e[1].x-e[0].x,e[1].y-e[0].y);s+='<line class="mc-e" style="--len:'+len.toFixed(0)+';--d:'+Math.max(0,(e[1].d||0)-0.12).toFixed(2)+'s" x1="'+e[0].x.toFixed(1)+'" y1="'+e[0].y.toFixed(1)+'" x2="'+e[1].x.toFixed(1)+'" y2="'+e[1].y.toFixed(1)+'"/>';});
  nodes.forEach(function(nd){
    s+='<g class="mc-'+nd.cls+'" style="--d:'+(nd.d||0).toFixed(2)+'s"><rect x="'+(nd.x-nd.w/2).toFixed(1)+'" y="'+(nd.y-nd.h/2).toFixed(1)+'" width="'+nd.w.toFixed(1)+'" height="'+nd.h.toFixed(1)+'" rx="'+(nd.cls==='c'?18:nd.cls==='b'?12:8)+'"/>';
    nd.L.forEach(function(l,i){s+='<text x="'+nd.x.toFixed(1)+'" y="'+(nd.y+(i-(nd.L.length-1)/2)*nd.lh+nd.fs*0.34).toFixed(1)+'" text-anchor="middle" font-size="'+nd.fs+'">'+esc(l)+'</text>';});
    s+='</g>';
  });
  return s+'</svg>';
}
function ticks(lo,hi){
  var span=(hi-lo)||1,raw=span/5,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*p,a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,r=[];
  for(var v=a;v<=b+step/2;v+=step)r.push(+v.toFixed(10));
  return r;
}
function nf(v){return String(+(+v).toFixed(2)).replace('.',',');}
function validChart(g){
  if(!g||typeof g!=='object')return false;
  if(g.tipo==='barre')return Array.isArray(g.etichette)&&Array.isArray(g.valori)&&g.etichette.length>=2&&g.etichette.length===g.valori.length&&g.valori.every(function(v){return typeof v==='number'&&isFinite(v);});
  if(g.tipo==='linea')return Array.isArray(g.punti)&&g.punti.length>=2&&g.punti.every(function(p){return Array.isArray(p)&&p.length===2&&p.every(function(v){return typeof v==='number'&&isFinite(v);});});
  return false;
}
function chartSVG(g,sv){
  var W=640,H=340,L=64,R=24,Tp=46,B=58,pw=W-L-R,ph=H-Tp-B;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafico: '+esc(g.titolo||'')+'" style="--sc:var('+sv+')">';
  s+='<text class="ch-ti" x="'+L+'" y="24">'+esc(g.titolo||'')+'</text>';
  var xt,yt,sx,sy;
  if(g.tipo==='barre'){
    var mx=Math.max.apply(null,g.valori.concat([0])),mn=Math.min.apply(null,g.valori.concat([0]));
    yt=ticks(mn,mx);sy=function(v){return Tp+ph-(v-yt[0])/(yt[yt.length-1]-yt[0])*ph;};
    yt.forEach(function(v){s+='<line class="ch-ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'"/><text class="ch-t" x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end">'+nf(v)+'</text>';});
    var n=g.etichette.length,bw=pw/n;
    g.valori.forEach(function(v,i){var x=L+i*bw+bw*0.2,y0=sy(0),y1=sy(v);s+='<rect class="ch-b" x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+bw*0.6+'" height="'+Math.abs(y0-y1)+'" rx="3"/><text class="ch-t" x="'+(L+i*bw+bw/2)+'" y="'+(H-B+20)+'" text-anchor="middle">'+esc(String(g.etichette[i]).slice(0,14))+'</text>';});
  }else{
    var xs=g.punti.map(function(p){return p[0];}),ys=g.punti.map(function(p){return p[1];});
    xt=ticks(Math.min.apply(null,xs),Math.max.apply(null,xs));yt=ticks(Math.min(0,Math.min.apply(null,ys)),Math.max.apply(null,ys));
    sx=function(v){return L+(v-xt[0])/(xt[xt.length-1]-xt[0])*pw;};sy=function(v){return Tp+ph-(v-yt[0])/(yt[yt.length-1]-yt[0])*ph;};
    yt.forEach(function(v){s+='<line class="ch-ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(v)+'" y2="'+sy(v)+'"/><text class="ch-t" x="'+(L-8)+'" y="'+(sy(v)+4)+'" text-anchor="end">'+nf(v)+'</text>';});
    xt.forEach(function(v){s+='<text class="ch-t" x="'+sx(v)+'" y="'+(H-B+20)+'" text-anchor="middle">'+nf(v)+'</text>';});
    s+='<polyline class="ch-l" pathLength="1" points="'+g.punti.map(function(p){return sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1);}).join(' ')+'"/>';
    if(g.punti.length<=12)g.punti.forEach(function(p){s+='<circle class="ch-p" cx="'+sx(p[0]).toFixed(1)+'" cy="'+sy(p[1]).toFixed(1)+'" r="4"/>';});
  }
  s+='<line class="ch-ax" x1="'+L+'" x2="'+L+'" y1="'+Tp+'" y2="'+(Tp+ph)+'"/>';
  s+='<text class="ch-t" x="'+(L+pw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(g.asseX||'')+'</text>';
  s+='<text class="ch-t" transform="translate(16 '+(Tp+ph/2)+') rotate(-90)" text-anchor="middle">'+esc(g.asseY||'')+'</text>';
  return s+'</svg>';
}
function phScale(){
  var x0=30,x1=610,w=x1-x0,px=function(v){return x0+v/14*w;};
  var s='<svg class="phs" viewBox="0 0 640 160" role="img" aria-label="Scala del pH con alcuni esempi">';
  s+='<defs><linearGradient id="phg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#D7263D"/><stop offset=".25" stop-color="#F18F01"/><stop offset=".5" stop-color="#5FAD56"/><stop offset=".75" stop-color="#2E86AB"/><stop offset="1" stop-color="#6A4C93"/></linearGradient></defs>';
  s+='<rect x="'+x0+'" y="74" width="'+w+'" height="26" rx="6" fill="url(#phg)"/>';
  for(var i=0;i<=14;i++)s+='<text class="ch-t" x="'+px(i)+'" y="120" text-anchor="middle"'+(i===7?' style="font-weight:700;fill:var(--ink)"':'')+'>'+i+'</text>';
  [[2,'limone',44],[5,'caffè',44],[7,'acqua pura',18],[7.4,'sangue',44],[11,'ammoniaca domestica',18]].forEach(function(m){
    s+='<line class="ch-ax" x1="'+px(m[0])+'" x2="'+px(m[0])+'" y1="'+(m[2]+6)+'" y2="74" style="stroke:var(--muted)"/><text class="ch-t" x="'+px(m[0])+'" y="'+m[2]+'" text-anchor="middle" style="fill:var(--ink)">'+m[1]+'</text>';
  });
  s+='<text class="ch-t" x="'+x0+'" y="148">più acido</text><text class="ch-t" x="'+x1+'" y="148" text-anchor="end">più basico</text><text class="ch-t" x="'+px(7)+'" y="148" text-anchor="middle">neutro a 25 °C</text>';
  return s+'</svg><p class="note">Valori indicativi: il pH reale di cibi e prodotti varia.</p>';
}
function punnett(){
  return '<table class="pun"><caption>Incrocio Aa × Aa</caption><tr><th></th><th>A</th><th>a</th></tr><tr><th>A</th><td>AA</td><td>Aa</td></tr><tr><th>a</th><td>Aa</td><td>aa</td></tr></table><p>Genotipi: 1 AA : 2 Aa : 1 aa. Fenotipi: 3 dominanti : 1 recessivo.</p>';
}
function extraHTML(kind,sv){
  if(kind==='ph')return phScale();
  if(kind==='punnett')return punnett();
  if(kind==='vt')return chartSVG({tipo:'linea',titolo:'Velocità nel tempo (da fermo, a = 2 m/s²)',asseX:'t (s)',asseY:'v (m/s)',punti:[[0,0],[1,2],[2,4],[3,6],[4,8],[5,10]]},sv)+'<p class="note">La pendenza della retta è l\'accelerazione (2 m/s²). L\'area sotto la retta, da 0 a 5 s, è lo spazio percorso: 25 m.</p>';
  return '';
}

  if(S.log.length)h+='<p class="muted">Lezioni completate: <strong>'+(S.lessonsDone||0)+'</strong>'+(acc!==null?' · Risposte esatte di recente: <strong>'+acc+'%</strong>':'')+'</p>';

}

function vPlay(){

  }

}

function vResult(){

function vPlaceResult(){

function vErrors(){

        (claudeOk()?'<button class="btn ghost sm" data-act="explain" data-q="'+q.id+'" data-c="'+e.last+'">Spiegami meglio</button>':'')+
        '<div class="xp" id="xp-'+q.id+'"'+(cached?'':' hidden')+'>'+(cached?fmt(cached):'')+'</div></details>';
    });

}

function vStudy(){
  var h='<h1>Argomenti</h1><div class="cols">'+Object.keys(SUBJ).map(function(sid){
    return '<section class="panel subj" style="--sc:var('+SUBJ[sid].v+')"><h2>'+SUBJ[sid].n+'</h2><ul>'+TOPICS.filter(function(t){return t.s===sid;}).map(function(t){

  return h+'<section class="panel"><h2>Allenamento libero</h2><div class="row"><button class="btn ghost sm" data-act="startQuiz" data-mode="smart">Quiz misto</button><button class="btn ghost sm" data-act="startCards" data-arg="all">Flashcard</button><button class="btn ghost sm" data-act="placeStart" data-arg="all">Rifai il test di livello</button></div></section>';
}

function renderMat(d,sv){
  var h='';
  if(Array.isArray(d.riassunto)&&d.riassunto.length)h+='<h3>Riassunto</h3><ul>'+d.riassunto.filter(function(x){return typeof x==='string';}).map(function(x){return '<li>'+rich(x)+'</li>';}).join('')+'</ul>';
  if(Array.isArray(d.esempi)&&d.esempi.length){h+='<h3>Esempi</h3>';d.esempi.forEach(function(x){if(x&&typeof x.testo==='string')h+='<div class="ex-item"><strong>'+esc(x.titolo||'Esempio')+'</strong><br>'+rich(x.testo)+'</div>';});}
  if(validMap(d.mappa))h+='<h3>Mappa concettuale</h3>'+mapSVG(d.mappa,sv);
  if(validChart(d.grafico))h+='<h3>Grafico</h3>'+chartSVG(d.grafico,sv);
  return h||'<p>Il materiale generato non era in un formato utilizzabile. Riprova.</p>';
}
function topicBody(t){

  h+='<section class="panel"><h2>Guarda come funziona</h2><p class="muted">'+esc(HINT[t.id]||'')+'</p><div class="anim" id="anim" style="--sc:var('+sv+')"></div></section>';

  if(C.extra)h+='<details class="panel more"><summary>'+extraName(C.extra)+'</summary>'+extraHTML(C.extra,sv)+'</details>';
  if(mine)h+='<details class="panel more" open><summary>Su misura per te</summary>'+renderMat(mine.data,sv)+'<p class="note">Preparato da Claude sui tuoi errori: confrontalo con il libro.</p></details>';

  }else if(ui.msg)h+='<p class="panel">'+esc(ui.msg)+'</p>';
  return h;

function vTopic(){

}

/* ---------- Lezione guidata ---------- */
function lessonStart(){
  var L=S.lesson;
  if(!L||L.step>=4){S.lesson={tid:pickLessonTopic(),step:1,wrong:[]};ui.swap=0;save();}
  lessonGo();
}
function lessonGo(){
  var L=S.lesson;ui.msg='';
  if(L.step===1){view='lesson';sess=null;render();scrollTop();}
  else if(L.step===2)startQuiz('topic',L.tid,{n:5,lesson:true});
  else if(L.step===3){
    var now=Date.now(),ids=(L.wrong||[]).slice();
    bank().forEach(function(q){if(q.t===L.tid&&S.cards[q.id]&&S.cards[q.id].due<=now&&ids.indexOf(q.id)<0)ids.push(q.id);});
    var items=ids.map(qById).filter(Boolean).slice(0,6);
    if(!items.length){finishLesson();view='lessonDone';sess=null;render();scrollTop();return;}
    sess={mode:'cards',items:items,i:0,flipped:false,known:0,review:0,done:false,lesson:true};view='playcards';render();scrollTop();
  }else{view='lessonDone';sess=null;render();scrollTop();}
}
function lessonNext(){
  var L=S.lesson;if(!L)return;
  if(L.step===2&&sess&&sess.answers)L.wrong=sess.answers.filter(function(x){return !x.ok;}).map(function(x){return x.q;});
  L.step++;save();lessonGo();
}
function finishLesson(){if(S.lesson&&S.lesson.step<4){S.lesson.step=4;S.lessonsDone=(S.lessonsDone||0)+1;save();}}

var lastKey='';
function backupBlock(){
  if(!ui.backup)return '';
  return '<section class="panel"><h2>Salva o trasferisci i progressi</h2><p>Per portare i progressi da un dispositivo all\'altro: su questo premi «Crea codice» e copialo. Sull\'altro dispositivo incollalo qui sotto e premi «Importa». L\'importazione sostituisce i progressi che hai sul dispositivo.</p><textarea id="bk" class="ta" rows="4" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Il codice compare qui, oppure incollalo qui"></textarea><div class="row" style="margin-top:10px"><button class="btn sm" data-act="exportData">Crea codice</button><button class="btn ghost sm" data-act="importData">Importa</button><button class="btn ghost sm" data-act="backupClose">Chiudi</button></div><p class="note" id="bkm" aria-live="polite"></p></section>';
}
function render(){
  stopAnims();
  var body='';
  if(view==='lesson'&&S.lesson){ui.topic=S.lesson.tid;body=vLesson();}
  else if(view==='lessonDone'&&S.lesson)body=vLessonDone();
  else if(view==='play'&&sess)body=vPlay();
  else if(view==='result'&&sess)body=vResult();
  else if(view==='playcards'&&sess)body=vPlayCards();
  else if(view==='errors')body=vErrors();
  else if(view==='study')body=vStudy();
  else if(view==='topic'&&ui.topic)body=vTopic();
  else{view='home';body=vHome();}
  var key=view+'|'+(view==='play'&&sess&&sess.q?sess.q.id:'')+(view==='topic'?ui.topic:'')+(view==='playcards'&&sess?sess.i:''),cls=key!==lastKey?' class="enter"':'';
  lastKey=key;
  app.innerHTML='<main'+cls+'>'+body+'</main>'+navHTML();
  if(view==='topic'||view==='lesson')initAnim();
}
function go(v){view=v;if(v!=='play'&&v!=='playcards'&&v!=='result')sess=null;ui.msg='';ui.confirmReset=false;render();scrollTop();}

/* ---------- Sessioni ---------- */
function setQ(q){sess.lvUp=null;sess.q=q;sess.order=shuffle([0,1,2,3]);sess.chosen=null;sess.shown=false;sess.ok=null;}
function startQuiz(mode,arg,opt){
  opt=opt||{};var pool=bank(),n=10;
  if(mode==='subj')pool=pool.filter(function(q){return topicOf(q.t).s===arg;});
  else if(mode==='topic'){pool=pool.filter(function(q){return q.t===arg;});n=8;}
  else if(mode==='errors'){pool=pool.filter(function(q){return S.errors[q.id]&&S.errors[q.id].ok<2&&(!arg||q.t===arg);});n=12;}
  if(!pool.length){ui.msg='Non ci sono domande disponibili per questa scelta.';view='home';sess=null;render();scrollTop();return;}
  if(opt.n)n=opt.n;
  var items=pickQuestions(pool,Math.min(n,pool.length));
  sess={mode:'quiz',items:items,i:0,answers:[],lesson:!!opt.lesson};setQ(items[0]);view='play';render();scrollTop();
}
function startPlace(arg){
  var topics=TOPICS.filter(function(t){return arg==='all'||t.s===arg;}).map(function(t){return t.id;});
  sess={mode:'place',queue:topics,total:topics.length,done:0,cur:null,stage:2,answers:[],subjects:arg==='all'?Object.keys(SUBJ):[arg],lv:{}};
  view='play';placeAdvance();render();scrollTop();
}
function placeQ(tid,l){return QB.find(function(q){return q.t===tid&&q.l===l;});}
function placeAdvance(){
  if(!sess.cur){
    if(!sess.queue.length){sess.subjects.forEach(function(s){S.placed[s]=true;});save();view='result';return;}
    sess.cur=sess.queue.shift();sess.stage=2;
  }
  setQ(placeQ(sess.cur,sess.stage));
}
function placeNext(){
  var last=sess.answers[sess.answers.length-1],tid=sess.cur;
  if(sess.stage===2){sess.stage=last.ok?3:1;}
  else{
    var lv=sess.stage===3?(last.ok?3:2):1,fragile=sess.stage===1&&!last.ok,t=T(tid);
    t.level=lv;t.fragile=fragile;t.placed=true;t.streak=0;sess.lv[tid]={lv:lv,fragile:fragile};sess.done++;sess.cur=null;save();
  }
  placeAdvance();
}
function answer(j){
  if(!sess||sess.shown)return;
  var q=sess.q,orig=sess.order[j],ok=orig===q.a;
  sess.chosen=j;sess.shown=true;sess.ok=ok;
  var up=record(q,orig,ok,sess.mode==='place');sess.lvUp=up?LV[T(q.t).level]:null;ui.fx=true;
  sess.answers.push({q:q.id,t:q.t,ok:ok,orig:orig});
  render();
  var f=document.querySelector('.fb');if(f){try{f.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});}catch(e){}}
}
function next(){
  if(!sess)return;
  if(sess.mode==='place')placeNext();
  else if(sess.i+1>=sess.items.length)view='result';
  else{sess.i++;setQ(sess.items[sess.i]);}
  render();scrollTop();
}
var INT=[0,1,3,7,14];
function startCards(arg){
  var now=Date.now(),pool=cardsPool(arg);
  var due=pool.filter(function(q){return S.cards[q.id]&&S.cards[q.id].due<=now;}).sort(function(a,b){return S.cards[a.id].due-S.cards[b.id].due;});
  var items=due.slice();
  if(arg!=='due')items=items.concat(shuffle(pool.filter(function(q){return !S.cards[q.id];})));
  items=items.slice(0,15);
  if(!items.length){ui.msg='Nessuna flashcard da ripassare adesso.';view='home';sess=null;render();scrollTop();return;}
  sess={mode:'cards',items:items,i:0,flipped:false,known:0,review:0,done:false};view='playcards';render();scrollTop();
}
function rate(r){
  if(!sess||sess.mode!=='cards')return;
  var q=sess.items[sess.i],c=S.cards[q.id]||(S.cards[q.id]={box:0,due:0});
  if(r==='known'){c.box=Math.min(4,(c.box||0)+1);c.due=Date.now()+INT[c.box]*864e5;sess.known++;}
  else{c.box=1;c.due=Date.now()+6e5;sess.review++;}

function $(id){return document.getElementById(id);}

function polyLen(p){var L=0;for(var i=0;i<p.length-1;i++)L+=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);return L;}
function polyPos(p,d){
  var L=polyLen(p);d=((d%L)+L)%L;
  for(var i=0;i<p.length-1;i++){var l=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);if(d<=l){var f=d/l;return [p[i][0]+(p[i+1][0]-p[i][0])*f,p[i][1]+(p[i+1][1]-p[i][1])*f];}d-=l;}
  return p[0];
}

    var sh=shells(Z),R=[52,98,144],s='';

    s+='<circle class="nuc" cx="200" cy="160" r="30"/><text class="nuct" x="200" y="166" text-anchor="middle">'+Z+'+</text>';

/* Membrana: osmosi */
ANIM.bi_memb=function(root){

    s+='<circle class="cellb'+(R>86?' burst':'')+'" cx="300" cy="150" r="'+R.toFixed(1)+'"/>';
    ins.forEach(function(p){s+='<circle class="sol" cx="'+(300+p[0]*R).toFixed(1)+'" cy="'+(150+p[1]*R).toFixed(1)+'" r="6"/>';});
    for(var n=0;n<14;n++){
      var th=n*2*Math.PI/14,dir=mode==='ipo'?1:mode==='iper'?-1:(n%2?1:-1),f=(n/14+clock*0.32)%1,dist=dir>0?R+42-84*f:R-42+84*f;
      s+='<circle class="wat" cx="'+(300+Math.cos(th)*dist).toFixed(1)+'" cy="'+(150+Math.sin(th)*dist).toFixed(1)+'" r="4" opacity="'+Math.sin(Math.PI*f).toFixed(2)+'"/>';

    if(R>86)s+='<text class="txt" x="300" y="285" text-anchor="middle" style="fill:var(--bad)">Rischio di lisi</text>';

  }
  wireChips('mode',function(k){mode=k;setText('cap',CAP[k]);if(RM){R=tgt[k];draw();}});
  setText('cap',CAP[mode]);

};

/* DNA: trascrizione e traduzione */
ANIM.bi_dna=function(root){
  var tpl='TACCGATTTACT',cmp={T:'A',A:'U',C:'G',G:'C'},AA={AUG:['Met','metionina, l\'amminoacido di inizio'],GCU:['Ala','alanina'],AAA:['Lys','lisina'],UGA:['Stop','codone di stop: la traduzione finisce']},n=0,timer=null,msg='Il filamento stampo (in alto) viene letto da 3\' a 5\'. Premi «Prossima base»: l\'mRNA cresce da 5\' a 3\'.';
  root.innerHTML='<div class="row" style="margin-bottom:10px"><button class="btn sm" id="nx">Prossima base</button><button class="btn ghost sm" id="au">Automatico</button><button class="btn ghost sm" id="rs">Ricomincia</button></div><div class="cap" id="cap" aria-live="polite"></div><div class="dnaw"><div class="dna" id="dn"></div></div>';
  function mrna(){var s='';for(var i=0;i<n;i++)s+=cmp[tpl[i]];return s;}
  function grid(){
    var m=mrna(),h='<div class="rowlab">DNA stampo, 3\' verso 5\'</div>';
    for(var i=0;i<12;i++)h+='<div class="b" data-b="'+tpl[i]+'">'+tpl[i]+'</div>';
    h+='<div class="rowlab">mRNA, 5\' verso 3\'</div>';
    for(var k=0;k<12;k++)h+=k<n?'<div class="b'+(k===n-1?' new':'')+'" data-b="'+m[k]+'">'+m[k]+'</div>':'<div class="b empty"></div>';
    h+='<div class="rowlab">Proteina (un amminoacido ogni codone)</div>';
    for(var c=0;c<4;c++){var cod=m.slice(c*3,c*3+3);h+=cod.length===3?'<div class="b aa'+(n===(c+1)*3?' new':'')+'">'+AA[cod][0]+'</div>':'<div class="b aa empty"></div>';}
    $('dn').innerHTML=h;setText('cap',msg);
  }
  function step(){
    if(n>=12){stopAuto();return;}
    var b=tpl[n];n++;
    msg='Base '+n+': nello stampo c\'è <strong>'+b+'</strong>, quindi nell\'mRNA si inserisce <strong>'+cmp[b]+'</strong>.'+(b==='A'?' Nell\'RNA, al posto della timina, c\'è l\'uracile (U).':'');
    if(n%3===0){var cod=mrna().slice(n-3);msg+=' Codone completo: <strong>'+cod+'</strong>, tradotto in '+AA[cod][0]+' ('+AA[cod][1]+').';}
    if(n===12)msg+=' L\'mRNA è pronto: il ribosoma lo ha tradotto in una piccola proteina (Met, Ala, Lys).';
    grid();
  }
  function stopAuto(){if(timer){clearInterval(timer);timer=null;}$('au').textContent='Automatico';}
  stops.push(function(){if(timer)clearInterval(timer);});
  $('nx').addEventListener('click',function(){stopAuto();step();});
  $('au').addEventListener('click',function(){if(timer){stopAuto();return;}if(n>=12)n=0;$('au').textContent='Pausa';step();timer=setInterval(step,1100);});
  $('rs').addEventListener('click',function(){stopAuto();n=0;msg='Si riparte: premi «Prossima base».';grid();});
  grid();
};

/* Genetica: quadrato di Punnett */
ANIM.bi_gen=function(root){
  var p1='Aa',p2='Aa';
  var G=[['AA','AA'],['Aa','Aa'],['aa','aa']];
  root.innerHTML='<h3>Genitore 1</h3>'+chipRow('p1',G,p1)+'<h3>Genitore 2</h3>'+chipRow('p2',G,p2)+'<div class="pgrid" id="pg"></div><div class="sbar" id="sb"></div><div class="cap" id="cap" aria-live="polite"></div>';
  function gcd(a,b){return b?gcd(b,a%b):a;}
  function upd(){
    var g1=p1.split(''),g2=p2.split(''),cells=[],cnt={AA:0,Aa:0,aa:0};
    var h='<div></div><div class="pg-h">'+g2[0]+'</div><div class="pg-h">'+g2[1]+'</div>';
    for(var i=0;i<2;i++){h+='<div class="pg-h">'+g1[i]+'</div>';for(var j=0;j<2;j++){var a=g1[i],b=g2[j],gt=a<b?a+b:b+a;if(a===b)gt=a+b;else gt='Aa';cnt[gt]++;h+='<div class="pc '+gt+'" style="--i:'+(i*2+j)+'">'+gt+'</div>';}}
    $('pg').innerHTML=h;
    var col={AA:'var(--bio)',Aa:'color-mix(in srgb,var(--bio) 45%,var(--surface))',aa:'var(--soft)'};
    $('sb').innerHTML=['AA','Aa','aa'].map(function(k){return '<div style="width:'+cnt[k]*25+'%;background:'+col[k]+(k==='AA'?';color:var(--on-sub)':'')+'">'+(cnt[k]?cnt[k]*25+'% '+k:'')+'</div>';}).join('');
    var dom=cnt.AA+cnt.Aa,rec=cnt.aa,ratio=rec===0?'tutti con il fenotipo dominante':dom===0?'tutti con il fenotipo recessivo':(dom/gcd(dom,rec))+' dominanti : '+(rec/gcd(dom,rec))+' recessivi';
    setText('cap','Ogni genitore passa ai figli uno dei suoi due alleli, con uguale probabilità. Qui i figli sono: '+ratio+'. Probabilità di un figlio aa: <strong>'+rec*25+'%</strong>.');
  }
  wireChips('p1',function(k){p1=k;upd();});wireChips('p2',function(k){p2=k;upd();});
  upd();
};

    var T=Math.sqrt(h0/5),tt=Math.min(t,T),y=Math.max(0,h0-5*tt*tt),v=10*tt,U=10*y,K=0.5*v*v,E=10*h0,BH=230,s='',k;
    s+='<line class="axis" x1="40" y1="300" x2="560" y2="300"/><line class="axis" x1="60" y1="60" x2="60" y2="300"/>';
    for(k=0;k<=20;k+=5)s+='<line class="axis" x1="55" y1="'+(300-k*12)+'" x2="65" y2="'+(300-k*12)+'"/><text class="txtm" x="50" y="'+(304-k*12)+'" text-anchor="end">'+k+'</text>';
    s+='<text class="txtm" x="70" y="52">altezza (m)</text>';
    s+='<line class="ghost" x1="60" y1="'+(300-h0*12)+'" x2="180" y2="'+(300-h0*12)+'"/>';
    s+='<circle class="ball" cx="130" cy="'+(300-y*12-12).toFixed(1)+'" r="12"/>';
    var bars=[[250,'Potenziale',U,'bu'],[350,'Cinetica',K,'bk']];
    bars.forEach(function(b){var hh=b[2]/E*BH;s+='<rect class="'+b[3]+'" x="'+b[0]+'" y="'+(300-hh).toFixed(1)+'" width="70" height="'+hh.toFixed(1)+'" rx="4"/><text class="txtm" x="'+(b[0]+35)+'" y="320" text-anchor="middle">'+b[1]+'</text><text class="txt" x="'+(b[0]+35)+'" y="'+(292-hh).toFixed(1)+'" text-anchor="middle">'+nf(b[2])+' J</text>';});
    var hk=K/E*BH,hu=U/E*BH;
    s+='<rect class="bk" x="470" y="'+(300-hk).toFixed(1)+'" width="70" height="'+hk.toFixed(1)+'"/><rect class="bu" x="470" y="'+(300-hk-hu).toFixed(1)+'" width="70" height="'+hu.toFixed(1)+'"/><rect class="tot" x="470" y="'+(300-BH)+'" width="70" height="'+BH+'" rx="4"/><text class="txtm" x="505" y="320" text-anchor="middle">Totale</text><text class="txt" x="505" y="'+(292-BH)+'" text-anchor="middle">'+nf(E)+' J</text>';
    $('sv').innerHTML=s;
    setText('rd','<span>quota = <b>'+nf(y)+'</b> m</span><span>velocità = <b>'+nf(v)+'</b> m/s</span><span>tempo = <b>'+nf(tt)+'</b> s</span>');
    setText('cap',tt>=T?'A terra tutta l\'energia potenziale è diventata cinetica: v = √(2·g·h) = <strong>'+nf(Math.sqrt(2*10*h0))+' m/s</strong>. Il totale è rimasto sempre uguale (senza attrito).':'Mentre la palla scende, l\'energia potenziale (m·g·h) diminuisce e quella cinetica (½·m·v²) aumenta della stessa quantità. La palla pesa 1 kg e g = 10 m/s².');
  }
  function reset(){t=0;running=false;dirty=true;}
  onInput('h',function(v){h0=v;reset();});
  $('go').addEventListener('click',function(){if(t>=Math.sqrt(h0/5))t=0;running=true;dirty=true;});
  $('rs').addEventListener('click',reset);
  loop(function(dt){if(running){t+=dt;if(t>=Math.sqrt(h0/5)){t=Math.sqrt(h0/5);running=false;}dirty=true;}if(dirty){dirty=false;draw();}});
};

/* Circuiti elettrici */
ANIM.fi_el=function(root){
  var mode='one',V=12,R=6,off=[0,0];
  root.innerHTML=chipRow('mode',[['one','Un resistore'],['ser','Due in serie'],['par','Due in parallelo']],'one')+slider('v','Tensione V',1,24,1,12,' V')+slider('r','Resistenza di ogni resistore',1,20,1,6,' Ω')+'<div class="read" id="rd"></div><svg id="sv" class="animsvg" viewBox="0 0 600 300" role="img" aria-label="Circuito elettrico con cariche in movimento"></svg><div class="cap" id="cap" style="margin-top:12px" aria-live="polite"></div>';
  function info(){
    var Rt=mode==='one'?R:mode==='ser'?2*R:R/2,I=V/Rt,Ib=mode==='par'?V/R:I;
    return {Rt:Rt,I:I,Ib:Ib};
  }
  function paths(){
    if(mode==='par')return [[[70,240],[70,60],[330,60],[330,240],[70,240]],[[70,240],[70,60],[520,60],[520,240],[70,240]]];
    return [[[70,240],[70,60],[520,60],[520,240],[70,240]]];
  }
  function draw(dt){
    var f=info(),P=paths(),s='';
    s+='<polyline class="wire" points="70,240 70,60 520,60 520,240 70,240"/>';
    if(mode==='par')s+='<polyline class="wire" points="330,60 330,240"/>';
    s+='<rect class="batt" x="58" y="130" width="24" height="40"/><text class="txt" x="94" y="155">'+V+' V</text>';
    var sp=Math.min(260,30+14*f.Ib);
    P.forEach(function(pts,i){
      off[i]+=dt*sp;var L=polyLen(pts),n=Math.round(L/38),stp=L/n;
      for(var k=0;k<n;k++){var q=polyPos(pts,off[i]+k*stp);s+='<circle class="ch" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4.5"/>';}
    });
    function res(x,y1,y2,lab){s+='<rect class="resb" x="'+(x-18)+'" y="'+y1+'" width="36" height="'+(y2-y1)+'" rx="4"/><text class="txt" x="'+(x+26)+'" y="'+((y1+y2)/2+5)+'">'+lab+'</text>';}
    if(mode==='one')res(520,120,180,R+' Ω');
    else if(mode==='ser'){res(520,85,125,R+' Ω');res(520,175,215,R+' Ω');}
    else{res(330,120,180,R+' Ω');res(520,120,180,R+' Ω');}
    $('sv').innerHTML=s;
    setText('rd','<span>R totale = <b>'+nf(f.Rt)+'</b> Ω</span><span>corrente totale = <b>'+nf(f.I)+'</b> A</span><span>potenza = <b>'+nf(V*f.I)+'</b> W</span>');
    setText('cap',mode==='one'?'Legge di Ohm: I = V / R = '+V+' / '+R+' = <strong>'+nf(f.I)+' A</strong>. Più la corrente è alta, più le cariche (i pallini) corrono veloci.':mode==='ser'?'In serie la corrente è la stessa in tutto il circuito e le resistenze si sommano: R = '+R+' + '+R+' = <strong>'+nf(f.Rt)+' Ω</strong>, quindi I = '+nf(f.I)+' A. Con più resistori la corrente cala.':'In parallelo ogni ramo ha la stessa tensione V e la corrente si divide: ogni ramo porta I = V / R = '+nf(f.Ib)+' A. La corrente totale è la somma ('+nf(f.I)+' A) e la resistenza equivalente si abbassa: R = '+R+' / 2 = <strong>'+nf(f.Rt)+' Ω</strong>.');
  }
  wireChips('mode',function(k){mode=k;off=[0,0];if(RM)draw(0);});
  onInput('v',function(x){V=x;if(RM)draw(0);});onInput('r',function(x){R=x;if(RM)draw(0);});
  draw(0);
  if(!RM)loop(function(dt){draw(dt);});
};


/* ---------- Eventi ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  var a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'go':go(d.v);break;
    case 'placeStart':startPlace(d.arg);break;
    case 'startQuiz':startQuiz(d.mode,d.arg);break;
    case 'quizTopic':startQuiz('topic',d.t);break;
    case 'quizErrTopic':startQuiz('errors',d.t);break;
    case 'ans':answer(+d.i);break;
    case 'next':next();break;
    case 'quit':go('home');break;
    case 'lessonStart':lessonStart();break;
    case 'lessonNext':lessonNext();break;
    case 'lessonSwap':ui.swap=(ui.swap||0)+1;render();break;
    case 'lessonDrop':S.lesson=null;save();render();break;
    case 'explain':explainQ(d.q,+d.c,el);break;
    case 'openTopic':ui.topic=d.t;view='topic';sess=null;ui.msg='';render();scrollTop();break;
    case 'tab':ui.tab=d.tab;render();break;
    case 'genMat':genMat(d.t);break;
    case 'genQ':genQ(d.t);break;
    case 'startCards':startCards(d.arg);break;
    case 'flip':if(sess){sess.flipped=true;render();}break;
    case 'rate':rate(d.r);break;
    case 'helpClose':S.helpSeen=true;ui.help=false;save();render();break;
    case 'backupOpen':ui.backup=true;render();break;
    case 'backupClose':ui.backup=false;render();break;
    case 'exportData':{
      var box=$('bk'),code='';
      try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){}
      box.value=code;box.focus();box.select();
      var done=function(ok){setText('bkm',ok?'Codice creato e copiato. Incollalo sull\'altro dispositivo.':'Codice creato: selezionalo e copialo a mano.');};
      try{navigator.clipboard.writeText(code).then(function(){done(true);},function(){done(false);});}catch(e){done(false);}
      break;}
    case 'importData':{
      var txt=($('bk').value||'').trim(),obj=null;
      try{obj=JSON.parse(decodeURIComponent(escape(atob(txt))));}catch(e){}
      if(!obj||!Array.isArray(obj.log)||typeof obj.topics!=='object'){setText('bkm','Il codice non è valido. Controlla di averlo copiato per intero.');break;}
      S=Object.assign(blank(),obj);save();ui.backup=false;ui.help=false;render();scrollTop();break;}
    case 'helpOpen':ui.help=true;render();scrollTop();break;
    case 'reset':
      if(ui.confirmReset){S=blank();save();ui.confirmReset=false;}else ui.confirmReset=true;
      render();break;
  }
});

render();
getSample().then(function(){render();});
})();
