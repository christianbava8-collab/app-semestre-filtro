<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filtro">
<title>Studio Filtro</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16202C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#16202C; --muted:#566475; --line:#D3DCE6; --soft:#E3E9F0;
  --chim:#B0206F; --bio:#1C7C4D; --fis:#2B55C9;
  --ok:#1C7C4D; --bad:#C23B2E; --on-sub:#FFFFFF;
  --font-display:'Bricolage Grotesque','Avenir Next','Helvetica Neue',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Helvetica Neue',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151C; --surface:#18212B; --ink:#E8EDF3; --muted:#9AA8B8; --line:#2B3846; --soft:#212C38;
    --chim:#E36AAE; --bio:#4DBE88; --fis:#7D9DF7; --ok:#4DBE88; --bad:#F0786B; --on-sub:#0F151C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E8EDF3; --muted:#9AA8B8; --line:#2B3846; --soft:#212C38;
  --chim:#E36AAE; --bio:#4DBE88; --fis:#7D9DF7; --ok:#4DBE88; --bad:#F0786B; --on-sub:#0F151C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 var(--font-body)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px))}
#app>main{flex:1 0 auto;width:100%}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 .8em}
ul{margin:0 0 .8em;padding-left:1.2em}
li{margin-bottom:.4em}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.9rem}
:focus-visible{outline:3px solid var(--fis);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;margin-right:14px;white-space:nowrap}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;min-height:44px;white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.badge{background:var(--bad);color:var(--bg);border-radius:99px;font-size:.78rem;padding:1px 8px;margin-left:4px}
main{max-width:1040px;margin:0 auto;padding:22px 20px 70px}

.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;font-weight:700;padding:12px 20px;min-height:48px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;text-decoration:underline;padding:10px 0;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 14px}
.panel.next{border-left:8px solid var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
.subj{border-top:7px solid var(--sc)}
.subj ul{list-style:none;padding:0;margin:0}
.trow{appearance:none;display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);padding:12px 2px;min-height:52px;cursor:pointer}
.trow:last-child{border-bottom:0}
.trow .lab{display:block;font-size:.85rem;color:var(--muted)}
.meter{display:inline-flex;gap:3px;flex:none}
.meter i{display:block;width:18px;height:9px;border-radius:2px;background:var(--soft);border:1px solid var(--line)}
.meter i.on{background:var(--sc,var(--ink));border-color:var(--sc,var(--ink))}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 16px;min-height:44px;cursor:pointer}
.chip::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc);margin-right:8px}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--sc);margin-bottom:8px}
.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sc)}

.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog>b{display:block;height:100%;background:var(--ink);transition:width .25s}
.qt{font-size:1.35rem;margin-bottom:18px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;min-height:58px;background:var(--surface);border:2px solid var(--line);border-radius:12px;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:10px}
.opt .k{font-family:var(--font-display);font-weight:700;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-left:8px solid var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.xp{margin-top:12px;padding:14px 16px;background:var(--soft);border-radius:10px}
.xp p:last-child{margin-bottom:0}

.err .mine{color:var(--bad);font-weight:700}
.err .good{color:var(--ok);font-weight:700}
.fcard{display:grid;place-items:center;text-align:center;min-height:300px;padding:30px;font-size:1.3rem;cursor:pointer;width:100%;font-family:inherit;color:var(--ink)}
.fcard .ans{font-weight:700;font-size:1.5rem;margin-bottom:12px}
.fcard .ex{font-size:1rem;color:var(--muted)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs .tab{border:1px solid var(--line);background:var(--surface)}
.tabs .tab[aria-current="page"]{border-color:var(--ink)}
svg.mc,svg.chart,svg.phs{width:100%;height:auto;display:block}
svg text{font-family:var(--font-body)}
.mc-e{stroke:var(--sc);stroke-width:2;opacity:.55}
.mc-c rect{fill:var(--sc)} .mc-c text{fill:var(--on-sub);font-weight:700}
.mc-b rect{fill:var(--soft);stroke:var(--sc);stroke-width:2} .mc-b text{fill:var(--ink);font-weight:700}
.mc-l rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5} .mc-l text{fill:var(--ink)}
.ch-ax{stroke:var(--line);stroke-width:1}
.ch-t{fill:var(--muted);font-size:13px}
.ch-ti{fill:var(--ink);font-size:15px;font-weight:700}
.ch-l{stroke:var(--sc);stroke-width:3;fill:none;stroke-linejoin:round}
.ch-p{fill:var(--sc)}
.ch-b{fill:var(--sc)}
.ex-item{border-left:5px solid var(--sc);padding:4px 0 4px 14px;margin-bottom:14px}
.pun{border-collapse:collapse;margin:8px 0 14px}
.pun th,.pun td{border:1px solid var(--line);padding:10px 22px;text-align:center;font-size:1.15rem}
.pun th{background:var(--soft)}
.pun caption{font-weight:700;margin-bottom:6px;text-align:left}
.stat{font-family:var(--font-display);font-size:3rem;font-weight:700;line-height:1}
.foot{margin-top:26px}

/* layout semplificato, pensato per il telefono */
main{padding-bottom:32px}
.tabbar{position:sticky;bottom:0;z-index:10;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;appearance:none;border:0;background:none;font:inherit;font-size:.78rem;font-weight:700;color:var(--muted);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;position:relative;cursor:pointer}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.hero{border-top:7px solid var(--sc,var(--ink))}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 6px}
.btn.block{display:block;width:100%;margin-top:6px}
.center{text-align:center}
p.center{margin:8px 0 0}
.steps{list-style:none;padding:0;margin:16px 0 14px;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;margin:0}
.steps .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none}
.steps li.done .n{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.steps li.cur .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lbar{display:flex;gap:6px;margin:8px 0 16px}
.lbar span{flex:1;text-align:center;font-size:.82rem;font-weight:700;padding:8px 2px;border-radius:8px;background:var(--soft);color:var(--muted)}
.lbar span.cur{background:var(--ink);color:var(--bg)}
.lbar span.done{background:color-mix(in srgb,var(--ok) 22%,var(--surface));color:var(--ink)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.qc{appearance:none;text-align:left;font:inherit;font-size:.92rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:92px;cursor:pointer}
.qc b{display:block;font-family:var(--font-display);font-size:2rem;line-height:1.1;color:var(--ink)}
.qc:disabled{opacity:.55;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul.plain{list-style:none;padding:0;margin:0}
.lab{display:block;font-size:.85rem;color:var(--muted)}
.go{color:var(--muted);font-weight:700;white-space:nowrap}
details.more>summary{cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:30px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:1.5rem;color:var(--muted);line-height:1}
details.more[open]>summary::after{content:"−"}
details.more[open]>summary{margin-bottom:14px}
details.errq{border-top:1px solid var(--line);padding:12px 0}
details.errq>summary{cursor:pointer;font-weight:700;list-style:none}
details.errq>summary::-webkit-details-marker{display:none}
details.errq>summary::before{content:"›";display:inline-block;width:1em;color:var(--muted);transition:transform .2s}
details.errq[open]>summary::before{transform:rotate(90deg)}
details.errq[open]>summary{margin-bottom:8px}
.qt{font-size:1.25rem;margin:4px 0 16px}

/* movimento: risponde alle azioni, poco altrove */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes seg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes nodein{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes glow{50%{opacity:.5}}
@keyframes drop{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
main.enter{animation:rise .24s ease-out}
main.enter .meter i.on{transform-origin:left center;animation:seg .5s ease-out both;animation-delay:calc(var(--i,0)*110ms + 250ms)}
main.enter .flow li{animation:rise .45s ease-out both;animation-delay:calc(var(--i)*140ms + 150ms)}
.opt.ok.fx{animation:pop .4s ease-out}
.opt.bad.fx{animation:shake .45s ease-out}
.fb.fx{animation:rise .3s ease-out .12s both}
.lvup{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-radius:10px;padding:10px 14px;margin:0 0 12px;animation:pop .5s ease-out .3s both}
.mc-e{stroke-dasharray:var(--len,300);stroke-dashoffset:var(--len,300);animation:draw .55s ease-out forwards;animation-delay:var(--d,0s)}
svg.mc g{transform-box:fill-box;transform-origin:center;animation:nodein .4s ease-out both;animation-delay:var(--d,0s)}
.ch-l{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
.ch-p{transform-box:fill-box;transform-origin:center;animation:nodein .3s ease-out 1s both}
.ch-b{transform-box:fill-box;transform-origin:center bottom;animation:grow .7s ease-out both}

/* guida */
.help{border-left:8px solid var(--fis)}
.flow{list-style:none;margin:12px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.flow li{display:flex;gap:10px;align-items:flex-start;margin:0}
.flow b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display)}
.flow p{margin:2px 0 0;font-size:.92rem;color:var(--muted)}

/* animazioni interattive */
.anim{--sc:var(--fis)}
.animsvg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.cap{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 12px;min-height:3.4em}
.sl{display:block;margin:10px 0}
.sl span{display:block}
.sl input[type=range]{width:100%;height:44px;accent-color:var(--sc)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ta{width:100%;font:inherit;font-size:.9rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.read{display:flex;gap:6px 22px;flex-wrap:wrap;margin:10px 0;font-family:var(--font-display);font-size:1.05rem}
.read b{font-size:1.35rem}
.axis{stroke:var(--muted);stroke-width:1.5}
.txt{fill:var(--ink);font-size:15px;font-weight:700}
.txtm{fill:var(--muted);font-size:13px}
.ch{fill:var(--sc)}
.shell{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:3 5}
.nuc{fill:var(--sc)}
.nuct{fill:var(--on-sub);font-weight:700;font-size:16px}
.e{fill:var(--muted)}
.e.val{fill:var(--sc)}
.atom{fill:var(--surface);stroke:var(--ink);stroke-width:3;transition:fill .4s}
.atom.pos{fill:color-mix(in srgb,var(--fis) 22%,var(--surface))}
.atom.neg{fill:color-mix(in srgb,var(--chim) 22%,var(--surface))}
.alab{fill:var(--ink);font-size:24px;font-weight:700;font-family:var(--font-display)}
.toks{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.tok{display:inline-grid;place-items:center;min-width:48px;height:40px;padding:0 8px;border-radius:99px;color:var(--on-sub);font-weight:700;animation:pop .35s ease-out both;animation-delay:calc(var(--i)*60ms)}
.tok.h{background:var(--fis)}
.tok.o{background:var(--chim)}
.tok.w{background:var(--bio)}
.mole-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.phbar{position:relative;height:26px;border-radius:8px;background:linear-gradient(90deg,#D7263D,#F18F01 25%,#5FAD56 50%,#2E86AB 75%,#6A4C93);margin:26px 0 14px}
.phbar i{position:absolute;top:-10px;left:50%;width:6px;height:46px;margin-left:-3px;background:var(--ink);border-radius:3px;transition:left .25s ease-out;box-shadow:0 0 0 2px var(--bg)}
.ph-read{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.ph-big{font-family:var(--font-display);font-size:2.4rem;font-weight:700;line-height:1}
.ions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.dots{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;margin-top:6px}
.dot{width:16px;height:16px;border-radius:50%;animation:nodein .3s ease-out both}
.dot.hp{background:var(--chim)}
.dot.oh{background:var(--fis)}
.org{cursor:pointer}
.org.hot{animation:glow 1.1s ease-in-out infinite;filter:drop-shadow(0 0 5px var(--sc))}
.cmem{fill:color-mix(in srgb,var(--bio) 8%,var(--surface));stroke:var(--bio);stroke-width:5}
.wall{fill:none;stroke:var(--muted);stroke-width:10;opacity:.55}
.nucl{fill:color-mix(in srgb,var(--fis) 16%,var(--surface));stroke:var(--fis);stroke-width:3}
.nucleolus{fill:var(--fis)}
.mit{fill:color-mix(in srgb,var(--chim) 20%,var(--surface));stroke:var(--chim);stroke-width:3}
.cr{fill:none;stroke:var(--chim);stroke-width:2}
.rerl{fill:none;stroke:var(--ink);stroke-width:3;opacity:.7}
.rd{fill:var(--ink)}
.golgi{fill:none;stroke:var(--fis);stroke-width:6;stroke-linecap:round}
.lis{fill:color-mix(in srgb,var(--chim) 35%,var(--surface));stroke:var(--chim);stroke-width:3}
.clo{fill:color-mix(in srgb,var(--bio) 45%,var(--surface));stroke:var(--bio);stroke-width:3}
.vac{fill:color-mix(in srgb,var(--fis) 14%,var(--surface));stroke:var(--fis);stroke-width:3;stroke-dasharray:6 5}
.infobox{background:var(--soft);border-radius:10px;padding:12px 14px;margin:12px 0;min-height:4.4em}
.beaker{fill:color-mix(in srgb,var(--fis) 7%,var(--surface));stroke:var(--line);stroke-width:2}
.cellb{fill:color-mix(in srgb,var(--bio) 12%,var(--surface));stroke:var(--bio);stroke-width:5}
.cellb.burst{stroke:var(--bad)}
.sol{fill:var(--chim)}
.wat{fill:var(--fis)}
.dnaw{overflow-x:auto;padding-bottom:6px}
.dna{display:grid;grid-template-columns:repeat(12,minmax(38px,1fr));gap:4px;min-width:500px}
.rowlab{grid-column:1/-1;font-size:.9rem;color:var(--muted);margin-top:8px}
.b{height:46px;display:grid;place-items:center;border-radius:8px;font-family:var(--font-display);font-weight:700;font-size:1.2rem;background:var(--soft)}
.b[data-b="A"]{background:color-mix(in srgb,var(--fis) 24%,var(--surface))}
.b[data-b="T"],.b[data-b="U"]{background:color-mix(in srgb,var(--chim) 24%,var(--surface))}
.b[data-b="C"]{background:color-mix(in srgb,var(--bio) 24%,var(--surface))}
.b[data-b="G"]{background:color-mix(in srgb,var(--ink) 14%,var(--surface))}
.b.empty{background:transparent;border:2px dashed var(--line)}
.b.new{animation:drop .45s ease-out both}
.b.aa{grid-column:span 3;background:var(--ink);color:var(--bg)}
.b.aa.empty{background:transparent;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:56px 1fr 1fr;gap:6px;max-width:420px;margin:12px 0}
.pg-h{display:grid;place-items:center;font-weight:700;font-size:1.3rem;font-family:var(--font-display)}
.pc{display:grid;place-items:center;height:68px;border-radius:10px;font-family:var(--font-display);font-weight:700;font-size:1.5rem;animation:pop .45s ease-out both;animation-delay:calc(var(--i)*120ms)}
.pc.AA{background:var(--bio);color:var(--on-sub)}
.pc.Aa{background:color-mix(in srgb,var(--bio) 45%,var(--surface))}
.pc.aa{background:var(--soft);border:2px solid var(--bio)}
.sbar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:12px 0;border:1px solid var(--line)}
.sbar>div{transition:width .5s ease-out;display:grid;place-items:center;font-size:.85rem;font-weight:700;overflow:hidden;white-space:nowrap}
.car{fill:var(--sc)}

.angle{fill:none;stroke:var(--ink);stroke-width:2}

.vw{stroke:var(--ink);stroke-width:3}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes tick{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
main.enter{animation:fadein .2s ease-out}
main.enter>*{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(5){animation-delay:.16s}main.enter>*:nth-child(6){animation-delay:.2s}main.enter>*:nth-child(n+7){animation-delay:.24s}
main.enter .opt{animation:rise .34s cubic-bezier(.2,.7,.2,1) both}
main.enter .opt:nth-of-type(2){animation-delay:.05s}main.enter .opt:nth-of-type(3){animation-delay:.1s}main.enter .opt:nth-of-type(4){animation-delay:.15s}
main.enter .cols>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
main.enter .cols>*:nth-child(2){animation-delay:.07s}main.enter .cols>*:nth-child(3){animation-delay:.14s}

main.enter .quick>*:nth-child(2){animation-delay:.06s}
.btn,.opt,.trow,.chip,.qc,.tab,.tabbar button,.fcard{transition:transform .14s ease,background-color .2s,border-color .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.btn:active:not(:disabled),.opt:active:not(:disabled),.qc:active:not(:disabled),.chip:active,.tab:active{transform:scale(.97)}
.trow:active{transform:scale(.99);background:var(--soft)}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--ink)}.btn.ghost:hover{border-color:var(--ink)}.qc:hover:not(:disabled){border-color:var(--ink)}}
.prog>b{transition:width .5s cubic-bezier(.2,.7,.2,1)}
.tabbar button{overflow:visible}
.tabbar button::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink);transform:scaleX(0);transition:transform .25s}
.tabbar button[aria-current="page"]::before{transform:scaleX(1)}
.tabbar button[aria-current="page"] svg{animation:pop .35s ease-out}
.btn.block,.hero .btn{box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.stat .cnt{display:inline-block;min-width:.6em}
.hero{animation-fill-mode:both}
/* quiz su misura */
.pick h1{margin-bottom:6px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.shead h2{margin:0}
.cb{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);transition:background-color .18s,border-color .18s}

.trow[aria-checked="true"] .cb{background:var(--sc);border-color:var(--sc)}
.trow[aria-checked="true"] .cb svg{opacity:1;animation:tick .3s ease-out both}
.trow.pk{justify-content:flex-start;gap:14px}
.trow.pk .nm{flex:1}
.pickbar{position:sticky;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));margin:0 -14px;animation:slideup .35s cubic-bezier(.2,.7,.2,1) both}
.pickbar .sum{margin:0 0 10px;font-weight:700}
.pickbar .sum span{font-weight:400;color:var(--muted)}
.pickbar .chips{margin-bottom:10px}
.pickbar .chip{padding:6px 14px;min-height:40px}.pickbar .chip::before{display:none}
.pickbar .go2{display:grid;grid-template-columns:auto 1fr;gap:10px}
.pickrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.sbtn{appearance:none;font:inherit;font-size:.85rem;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:36px;cursor:pointer}
.sbtn:active{transform:scale(.96)}
.cnt-q{font-size:.8rem;color:var(--muted);font-weight:400}
/* dashboard, sicurezza, simulazione, giochi */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin:0 0 14px;align-items:start}
.dash>.panel{margin:0}
.goalp{display:flex;gap:18px;align-items:center}
.gtxt{flex:1;min-width:0}
.ring{flex:none;width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--soft);stroke-width:10}
.ring .pr{fill:none;stroke:var(--fis);stroke-width:10;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--o);animation:ringin .9s cubic-bezier(.2,.7,.2,1) both}
.ring.met .pr{stroke:var(--ok)}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--font-display);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .rt small{display:block;font-size:.75rem;font-weight:400;color:var(--muted);font-family:var(--font-body);margin-top:3px}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.big{font-family:var(--font-display);font-weight:700;font-size:1.3rem;line-height:1.2;margin:0 0 4px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{appearance:none;font:inherit;font-size:.88rem;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 14px;min-height:40px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;margin-top:6px}
.wd{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.wd .v{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wd .b{display:block;width:100%;max-width:34px;height:calc(var(--h) * 1px);border-radius:6px 6px 2px 2px;background:var(--line);transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.7,.2,1) both}
.wd.met .b{background:var(--ok)}
.wd.part .b{background:var(--muted)}
.wd .l{font-size:.8rem;color:var(--muted);font-weight:700}
.wd.today .l{color:var(--ink);text-decoration:underline}
.sb{margin:0 0 14px}
.sb .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sb .top span{color:var(--muted);font-size:.9rem}
.meter2{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.meter2 b{display:block;height:100%;background:var(--sc);border-radius:99px;transform-origin:left;animation:barin .7s cubic-bezier(.2,.7,.2,1) both}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
ul.plain{list-style:none;padding:0;margin:0}
.cfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cfg .btn{padding:12px 6px}
.tagS{display:inline-block;font-size:.72rem;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:99px;padding:0 8px;margin-right:8px;vertical-align:1px}
.opt.sel{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 9%,var(--surface))}

.timer{font-family:var(--font-display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}

.mt{appearance:none;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 14px;min-height:46px;cursor:pointer}

.shake{animation:shk .35s ease-in-out;border-color:var(--bad)!important}

.word{display:flex;flex-wrap:wrap;gap:6px 5px;margin:14px 0 18px}

.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 10px}
.key{appearance:none;font:inherit;font-weight:700;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}

{id:"cl1_001",t:"cl1",p:"1.1",l:1,q:"Di che cosa è fatta la materia, secondo il libro?",o:["Di atomi che si combinano tra loro in modi diversi", "Solo di molecole biatomiche", "Solo di ioni", "Di sostanze pure indivisibili"],a:0,e:"La materia è fatta di atomi, particelle piccolissime che combinandosi in modi diversi danno origine, a livello macroscopico, alle sostanze."},
{id:"cl1_002",t:"cl1",p:"1.1",l:1,q:"Quali sono i tre oggetti di studio della chimica?",o:["Struttura e composizione della materia, sue trasformazioni, energia coinvolta", "Solo le reazioni tra gas", "Solo la composizione dei composti organici", "Moto, forze ed energia dei corpi"],a:0,e:"La chimica studia la struttura e la composizione della materia, le trasformazioni che subisce e l'energia coinvolta in queste trasformazioni."},
{id:"cl1_003",t:"cl1",p:"1.1",l:2,q:"Qual è la più piccola parte di un composto che ne mantiene le caratteristiche chimiche?",o:["La molecola (o l'unità formula)", "L'atomo", "Il protone", "L'elettrone"],a:0,e:"L'atomo è la più piccola particella che mantiene l'identità di un elemento; per un composto serve la molecola, perché gli elementi combinati hanno proprietà diverse da quelle del composto."},
{id:"cl1_004",t:"cl1",p:"1.1",l:2,q:"Che cos'è un anione?",o:["Uno ione con carica negativa", "Uno ione con carica positiva", "Un atomo neutro", "Una molecola biatomica"],a:0,e:"Uno ione positivo è detto catione, uno ione negativo anione."},
{id:"cl1_005",t:"cl1",p:"1.1.1",l:1,q:"Che cos'è una sostanza pura?",o:["Materia formata da un solo tipo di unità fondamentale, con composizione uniforme e ben definita", "Un miscuglio omogeneo", "Qualsiasi liquido trasparente", "Una sostanza formata da un solo atomo"],a:0,e:"Una sostanza pura ha composizione uniforme e ben definita: per esempio l'acqua pura (solo molecole di H₂O) o il sale da cucina (solo ioni Na⁺ e Cl⁻)."},
{id:"cl1_006",t:"cl1",p:"1.1.1",l:1,q:"Come si chiama una sostanza pura formata da atomi di due o più elementi diversi?",o:["Composto", "Sostanza elementare", "Miscela", "Isotopo"],a:0,e:"I composti (sostanze composte) contengono atomi di elementi diversi, come NaCl o H₂O; le sostanze semplici contengono un solo elemento."},
{id:"cl1_007",t:"cl1",p:"1.1.1",l:2,q:"Un composto formato da tre elementi diversi si dice…",o:["ternario", "binario", "biatomico", "triatomico"],a:0,e:"Due elementi = binario, tre elementi = ternario. \"Biatomico\" e \"triatomico\" si riferiscono invece al numero di atomi nella molecola."},
{id:"cl1_008",t:"cl1",p:"1.1.1",l:2,q:"Quali sono gli unici elementi presenti in natura come atomi singoli?",o:["I gas nobili", "I metalli alcalini", "Ossigeno e azoto", "Gli alogeni"],a:0,e:"Solo i gas nobili esistono come atomi isolati; l'ossigeno, per esempio, si trova come O₂ e il ferro come atomi uniti dal legame metallico."},
{id:"cl1_009",t:"cl1",p:"1.1.1",l:3,q:"Qual è la differenza tra \"elemento\" e \"sostanza elementare\"?",o:["L'elemento è un tipo di atomo; la sostanza elementare è una sostanza pura fatta di atomi di quell'elemento (es. O₂)", "Sono sinonimi esatti", "La sostanza elementare contiene sempre più elementi", "L'elemento è sempre un gas"],a:0,e:"Un elemento è l'insieme di atomi con lo stesso numero atomico; la sostanza elementare è la sostanza pura che ne è fatta, come O₂, H₂ o S₈."},
{id:"cl1_010",t:"cl1",p:"1.1.2",l:1,q:"Una miscela con una sola fase si dice…",o:["omogenea", "eterogenea", "composta", "pura"],a:0,e:"Le miscele omogenee (soluzioni) hanno una sola fase e composizione uniforme; quelle eterogenee hanno due o più fasi."},
{id:"cl1_011",t:"cl1",p:"1.1.2",l:1,q:"Quale di queste è una miscela eterogenea?",o:["Il sangue", "L'aria", "L'acqua minerale", "Il vino"],a:0,e:"Il sangue ha più fasi (plasma e parte corpuscolata). Aria, acqua minerale e vino sono miscele omogenee."},
{id:"cl1_012",t:"cl1",p:"1.1.2",l:2,q:"Secondo il libro, il latte è…",o:["una miscela eterogenea (un'emulsione)", "una sostanza pura", "una miscela omogenea", "un composto"],a:0,e:"Il latte è un'emulsione: goccioline lipidiche disperse in una soluzione acquosa con zuccheri, proteine e sali."},
{id:"cl1_013",t:"cl1",p:"1.1.2",l:2,q:"Quale proprietà sfrutta la distillazione?",o:["La diversa temperatura di ebollizione (volatilità)", "La dimensione delle particelle", "La densità", "L'affinità per una fase stazionaria"],a:0,e:"La distillazione separa i componenti in base alla temperatura di ebollizione: per esempio acqua e alcol, o le benzine dal petrolio."},
{id:"cl1_014",t:"cl1",p:"1.1.2",l:2,q:"Con quale tecnica si separa il sangue in plasma e parte corpuscolata?",o:["Centrifugazione", "Distillazione", "Cromatografia", "Filtrazione"],a:0,e:"La centrifugazione sfrutta la diversa densità dei componenti."},
{id:"cl1_015",t:"cl1",p:"1.1.2",l:2,q:"La decaffeinazione del caffè è un esempio di…",o:["estrazione con solventi", "cromatografia", "centrifugazione", "distillazione frazionata"],a:0,e:"L'estrazione con solventi sfrutta la solubilità selettiva di un componente in un determinato solvente."},
{id:"cl1_016",t:"cl1",p:"1.1.2",l:3,q:"Nella cromatografia, il componente più affine alla fase stazionaria…",o:["si muove più lentamente", "si muove più velocemente", "non si separa mai", "evapora per primo"],a:0,e:"Più un componente è affine alla fase fissa, più è trattenuto e minore è la sua velocità; quello più affine alla fase mobile corre di più."},
{id:"cl1_017",t:"cl1",p:"1.2",l:1,q:"Come si scrive il simbolo di un elemento?",o:["Una o due lettere: la prima maiuscola, la seconda minuscola", "Sempre due lettere maiuscole", "Sempre una lettera minuscola", "Tre lettere maiuscole"],a:0,e:"Per esempio Cu (rame, da cuprum), K (potassio, da kalium), Au (oro, da aurum)."},
{id:"cl1_018",t:"cl1",p:"1.2",l:1,q:"Il simbolo K indica…",o:["il potassio", "il calcio", "il cripto", "il carbonio"],a:0,e:"K deriva dal latino kalium (potassio). Il calcio è Ca, il carbonio C."},
{id:"cl1_019",t:"cl1",p:"1.2",l:2,q:"Che cosa indica la formula bruta?",o:["Il tipo e il numero di atomi della sostanza, senza dire come sono legati", "La disposizione spaziale degli atomi", "Solo gli elementi presenti, senza quantità", "Il tipo di legame tra gli atomi"],a:0,e:"La formula bruta (o grezza) dice quali atomi ci sono e quanti; come sono legati lo indica la formula di struttura."},
{id:"cl1_020",t:"cl1",p:"1.2",l:2,q:"Quanti atomi di idrogeno ci sono in (NH₄)₂SO₄?",o:["8", "4", "2", "6"],a:0,e:"Lo ione NH₄⁺ è presente due volte: 2 × 4 = 8 atomi di H (e 2 di N, 1 di S, 4 di O)."},
{id:"cl1_021",t:"cl1",p:"1.2",l:2,q:"Qual è la formula minima del glucosio, C₆H₁₂O₆?",o:["CH₂O", "C₆H₁₂O₆", "C₂H₄O₂", "CHO"],a:0,e:"Dividendo i pedici per 6 si ottiene CH₂O."},
{id:"cl1_022",t:"cl1",p:"1.2",l:3,q:"Il butano ha formula molecolare C₄H₁₀. Qual è la sua formula minima?",o:["C₂H₅", "CH₂", "C₄H₁₀", "CH₃"],a:0,e:"Dividendo i pedici per il massimo comun divisore (2) si ottiene C₂H₅."},
{id:"cl1_023",t:"cl1",p:"1.2",l:3,q:"Per un composto ionico come Ag₂S, la formula minima…",o:["coincide con la formula bruta", "non si può scrivere", "è sempre diversa da quella bruta", "coincide con la formula di struttura"],a:0,e:"Nei composti ionici non esistono molecole: la formula indica il rapporto minimo di combinazione, quindi formula minima e bruta coincidono."},
{id:"cl1_024",t:"cl1",p:"1.3",l:1,q:"In un'equazione chimica, dove si scrivono i reagenti?",o:["A sinistra della freccia", "A destra della freccia", "Sopra la freccia", "Indifferentemente a destra o a sinistra"],a:0,e:"Reagenti a sinistra, prodotti a destra, separati da una freccia."},
{id:"cl1_025",t:"cl1",p:"1.3",l:1,q:"Che cosa sono i coefficienti stechiometrici?",o:["Numeri interi davanti alle formule che indicano quante molecole (o unità formula) partecipano", "I pedici delle formule", "Le cariche degli ioni", "Le masse molari"],a:0,e:"I coefficienti servono a bilanciare l'equazione; i pedici invece non si modificano mai."},
{id:"cl1_026",t:"cl1",p:"1.3",l:2,q:"La reazione SO₂ + O₂ → SO₃ è bilanciata?",o:["No: va scritta 2 SO₂ + O₂ → 2 SO₃", "Sì, così com'è", "No: va scritta SO₂ + O₂ → SO₄", "No: va scritta SO₂ + O → SO₃ con O atomico"],a:0,e:"A sinistra ci sono 4 atomi di O e a destra 3; con i coefficienti 2, 1, 2 gli atomi tornano uguali, senza cambiare le formule."},
{id:"cl1_027",t:"cl1",p:"1.3",l:2,q:"Che cosa avviene durante una reazione chimica?",o:["Si rompono e si formano legami chimici", "Cambiano i nuclei degli atomi", "Si creano nuovi atomi", "Cambia solo lo stato fisico"],a:0,e:"Nelle reazioni chimiche gli atomi si riarrangiano rompendo e formando legami; i nuclei restano invariati."},
{id:"cl1_028",t:"cl1",p:"1.3",l:3,q:"Nella reazione CaCl₂ + 2 AgNO₃ → Ca(NO₃)₂ + 2 AgCl, quanti atomi di ossigeno compaiono tra i reagenti?",o:["6", "3", "2", "9"],a:0,e:"2 AgNO₃ contengono 2 × 3 = 6 atomi di O, e infatti anche Ca(NO₃)₂ ne contiene 6."},
{id:"cl1_029",t:"cl1",p:"1.4",l:1,q:"Chi formulò la legge di conservazione della massa?",o:["Lavoisier", "Proust", "Dalton", "Avogadro"],a:0,e:"Lavoisier (1789): in una reazione chimica la massa totale del sistema resta costante."},
{id:"cl1_030",t:"cl1",p:"1.4",l:1,q:"Che cosa afferma la legge delle proporzioni definite (Proust)?",o:["In un composto gli elementi sono combinati in un rapporto di massa definito e costante", "Volumi uguali di gas contengono lo stesso numero di particelle", "La massa si conserva", "Gli elementi si combinano in rapporti multipli"],a:0,e:"La legge di Proust (1799) riguarda il rapporto di massa fisso tra gli elementi di una sostanza pura."},
{id:"cl1_031",t:"cl1",p:"1.4",l:2,q:"Quale legge descrive il caso di due elementi che formano più composti, con masse in rapporti di numeri interi piccoli?",o:["Legge delle proporzioni multiple (Dalton)", "Legge delle proporzioni definite", "Legge di Avogadro", "Legge di conservazione della massa"],a:0,e:"È la legge di Dalton (1803), per esempio CO e CO₂: le masse di O combinate con la stessa massa di C stanno nel rapporto 1 : 2."},
{id:"cl1_032",t:"cl1",p:"1.4",l:2,q:"Perché le leggi ponderali si chiamano così?",o:["Perché riguardano le masse delle sostanze", "Perché riguardano i volumi dei gas", "Perché le ha scoperte un chimico di nome Ponder", "Perché riguardano solo le reazioni nucleari"],a:0,e:"\"Ponderale\" significa relativo al peso, cioè alla massa."},
{id:"cl1_033",t:"cl1",p:"1.4",l:3,q:"10 g di reagenti in rapporto stechiometrico reagiscono completamente. Quanto pesano i prodotti?",o:["10 g", "Meno di 10 g, perché si libera energia", "Più di 10 g", "Dipende dal numero di prodotti"],a:0,e:"Per la legge di Lavoisier la somma delle masse dei reagenti è uguale alla somma delle masse dei prodotti."},
{id:"cl1_034",t:"cl1",p:"1.5",l:1,q:"In che anno Dalton elaborò la sua teoria atomica?",o:["1802", "1789", "1905", "400 a.C."],a:0,e:"Dalton elaborò la teoria nel 1802 per spiegare le leggi ponderali. Democrito aveva avuto l'intuizione dell'atomo già nel 400 a.C."},
{id:"cl1_035",t:"cl1",p:"1.5",l:2,q:"Quale postulato di Dalton fu poi smentito da esperimenti successivi?",o:["Che gli atomi siano indivisibili", "Che gli atomi di elementi diversi siano diversi", "Che nelle reazioni gli atomi conservino la loro identità", "Che gli atomi si combinino formando composti"],a:0,e:"Esistono processi che frammentano l'atomo nelle sue componenti, quindi l'atomo non è indivisibile."},
{id:"cl1_036",t:"cl1",p:"1.5",l:2,q:"Come spiega la teoria di Dalton la conservazione della massa?",o:["Gli atomi si conservano nelle reazioni, quindi si conserva anche la loro massa", "Gli atomi si creano e si distruggono in egual numero", "La massa dipende solo dagli elettroni", "L'energia si trasforma in massa"],a:0,e:"Se nelle reazioni gli atomi conservano la loro identità e non si creano né si distruggono, la massa totale resta costante."},
{id:"cl1_037",t:"cl1",p:"1.5",l:3,q:"Secondo Dalton, perché in un composto gli elementi stanno in rapporti di massa fissi?",o:["Perché il rapporto tra il numero dei loro atomi è fisso", "Perché tutti gli atomi hanno la stessa massa", "Perché la massa degli elettroni è trascurabile", "Perché i composti sono sempre biatomici"],a:0,e:"Se il rapporto tra il numero di atomi è costante, lo è anche il rapporto tra le loro masse: è la spiegazione della legge di Proust."},
{id:"cl1_038",t:"cl1",p:"1.6",l:1,q:"Dove è concentrata quasi tutta la massa dell'atomo?",o:["Nel nucleo", "Negli elettroni", "Uniformemente in tutto il volume", "Negli orbitali esterni"],a:0,e:"Il nucleo contiene protoni e neutroni (nucleoni) e quindi quasi tutta la massa."},
{id:"cl1_039",t:"cl1",p:"1.6",l:1,q:"Che cosa indica il numero atomico Z?",o:["Il numero di protoni", "Il numero di neutroni", "Il numero di nucleoni", "La massa dell'atomo"],a:0,e:"Z = protoni; A = protoni + neutroni (numero di massa)."},
{id:"cl1_040",t:"cl1",p:"1.6",l:2,q:"Quanti neutroni ha l'ossigeno-16 (Z = 8)?",o:["8", "16", "24", "6"],a:0,e:"Neutroni = A − Z = 16 − 8 = 8."},
{id:"cl1_041",t:"cl1",p:"1.6",l:2,q:"Qual è circa il rapporto tra la massa di un nucleone e quella di un elettrone?",o:["1836", "105", "1/1836", "10"],a:0,e:"Un nucleone pesa circa 1836 volte un elettrone. 10⁵ è invece il rapporto tra raggio atomico e raggio nucleare."},
{id:"cl1_042",t:"cl1",p:"1.6",l:2,q:"Qual è circa il raggio di un atomo?",o:["10⁻¹⁰ m (1 Å)", "10⁻¹⁵ m", "10⁻⁵ m", "10⁻²⁰ m"],a:0,e:"Il raggio atomico è circa 10⁻¹⁰ m = 1 Å, quello del nucleo circa 10⁻¹⁵ m: il rapporto è 10⁵."},
{id:"cl1_043",t:"cl1",p:"1.6",l:3,q:"Qual è la carica elementare e?",o:["1,6 · 10⁻¹⁹ C", "1,67 · 10⁻²⁷ C", "9,11 · 10⁻³¹ C", "6,02 · 10²³ C"],a:0,e:"e = 1,6 · 10⁻¹⁹ C. 1,67 · 10⁻²⁷ kg è la massa di un nucleone e 9,11 · 10⁻³¹ kg quella dell'elettrone."},
{id:"cl1_044",t:"cl1",p:"1.6.1",l:1,q:"Un atomo che perde elettroni diventa…",o:["un catione", "un anione", "un isotopo", "un nuclide neutro"],a:0,e:"Perdendo elettroni prevale la carica positiva dei protoni: si forma un catione, per esempio Na⁺."},
{id:"cl1_045",t:"cl1",p:"1.6.1",l:2,q:"Quante particelle ha lo ione Al³⁺ (Z = 13, A = 27)?",o:["13 protoni, 14 neutroni, 10 elettroni", "13 protoni, 14 neutroni, 16 elettroni", "10 protoni, 14 neutroni, 13 elettroni", "13 protoni, 27 neutroni, 10 elettroni"],a:0,e:"Protoni = Z = 13; neutroni = 27 − 13 = 14; tre cariche positive = 3 elettroni in meno, quindi 10."},
{id:"cl1_046",t:"cl1",p:"1.6.1",l:2,q:"Quanti elettroni ha lo ione cloruro Cl⁻ (Z = 17)?",o:["18", "17", "16", "35"],a:0,e:"La carica negativa indica un elettrone in più rispetto ai 17 protoni."},
{id:"cl1_047",t:"cl1",p:"1.6.1",l:3,q:"Nelle reazioni chimiche, quali particelle subatomiche sono coinvolte?",o:["Solo gli elettroni", "Protoni ed elettroni", "Solo i neutroni", "Tutti i nucleoni"],a:0,e:"Nei processi chimici partecipano solo gli elettroni: protoni e neutroni restano nel nucleo e l'identità degli atomi non cambia."},
{id:"cl1_048",t:"cl1",p:"1.6.2",l:1,q:"Che cosa hanno in comune gli isotopi di uno stesso elemento?",o:["Il numero atomico Z", "Il numero di massa A", "Il numero di neutroni", "La massa atomica"],a:0,e:"Gli isotopi hanno lo stesso numero di protoni ma diverso numero di neutroni, quindi diverso A."},
{id:"cl1_049",t:"cl1",p:"1.6.2",l:2,q:"Come si chiama l'isotopo dell'idrogeno con 1 protone e 2 neutroni?",o:["Trizio", "Deuterio", "Prozio", "Elio-3"],a:0,e:"Prozio: 0 neutroni; deuterio: 1 neutrone; trizio: 2 neutroni. L'idrogeno è l'unico elemento i cui isotopi hanno nomi propri."},
{id:"cl1_050",t:"cl1",p:"1.6.2",l:2,q:"Gli isotopi di un elemento nella tavola periodica…",o:["occupano lo stesso posto", "occupano caselle diverse", "stanno in gruppi diversi", "stanno nello stesso gruppo ma in periodi diversi"],a:0,e:"Hanno lo stesso Z, quindi la stessa casella e lo stesso nome."},
{id:"cl1_051",t:"cl1",p:"1.6.2",l:3,q:"Il potassio-41 (Z = 19) quanti neutroni contiene?",o:["22", "19", "41", "60"],a:0,e:"Neutroni = A − Z = 41 − 19 = 22; essendo neutro ha 19 elettroni."},
{id:"cl1_052",t:"cl1",p:"1.6.2",l:3,q:"Che cosa emettono gli isotopi instabili per stabilizzarsi?",o:["Radiazioni α, β o γ", "Solo elettroni di valenza", "Molecole di idrogeno", "Nulla: restano instabili per sempre"],a:0,e:"Gli isotopi instabili sono radioattivi ed emettono radiazioni α, β e γ."},
{id:"cl1_053",t:"cl1",p:"1.7",l:1,q:"L'unità di massa atomica (u) è…",o:["1/12 della massa di un atomo di carbonio-12", "la massa di un atomo di idrogeno", "la massa di un elettrone", "1/16 della massa dell'ossigeno"],a:0,e:"Per convenzione all'atomo di ¹²C è attribuita una massa di 12 u, e 1 u ne è la dodicesima parte."},
{id:"cl1_054",t:"cl1",p:"1.7",l:2,q:"Perché la massa atomica del carbonio nella tavola periodica è 12,01 e non 12?",o:["È una media ponderata delle masse dei suoi isotopi secondo la loro abbondanza", "Per un errore di misura", "Perché si somma la massa degli elettroni", "Perché il carbonio ha 12,01 protoni"],a:0,e:"La massa atomica è la media delle masse degli isotopi (¹²C, ¹³C, ¹⁴C) pesata sulla loro abbondanza."},
{id:"cl1_055",t:"cl1",p:"1.7",l:2,q:"La massa atomica relativa Aᵣ è…",o:["adimensionale, perché è un rapporto tra masse", "espressa in grammi", "espressa in u", "espressa in mol"],a:0,e:"È il rapporto tra la massa dell'atomo e l'unità di massa atomica: grandezze omogenee, quindi numero puro. In passato si chiamava \"peso atomico\"."},
{id:"cl1_056",t:"cl1",p:"1.7",l:2,q:"Qual è la massa molecolare relativa di H₂SO₄ (H = 1, S = 32, O = 16)?",o:["98", "50", "96", "82"],a:0,e:"2 · 1 + 32 + 4 · 16 = 98."},
{id:"cl1_057",t:"cl1",p:"1.7",l:3,q:"Qual è la massa relativa di (NH₄)₂SO₄ (N = 14, H = 1, S = 32, O = 16)?",o:["132", "114", "118", "150"],a:0,e:"2 · 14 + 8 · 1 + 32 + 4 · 16 = 28 + 8 + 32 + 64 = 132."},
{id:"cl1_058",t:"cl1",p:"1.8",l:1,q:"Quante entità contiene una mole?",o:["6,02 · 10²³", "6,02 · 10⁻²³", "22,4", "12"],a:0,e:"Una mole contiene un numero di Avogadro di entità elementari, NA = 6,02 · 10²³ mol⁻¹."},
{id:"cl1_059",t:"cl1",p:"1.8",l:1,q:"Qual è la formula per calcolare il numero di moli?",o:["n = m / MM", "n = MM / m", "n = m · MM", "n = m · NA"],a:0,e:"Le moli si ottengono dividendo la massa in grammi per la massa molare."},
{id:"cl1_060",t:"cl1",p:"1.8",l:2,q:"Quante moli sono 90 g di acqua (MM = 18 g/mol)?",o:["5 mol", "1620 mol", "0,2 mol", "18 mol"],a:0,e:"n = 90 / 18 = 5 mol."},
{id:"cl1_061",t:"cl1",p:"1.8",l:2,q:"Qual è la massa di 2,5 mol di NaOH (MM = 40 g/mol)?",o:["100 g", "16 g", "42,5 g", "40 g"],a:0,e:"m = n · MM = 2,5 · 40 = 100 g."},
{id:"cl1_062",t:"cl1",p:"1.8",l:3,q:"Quanti atomi di ferro ci sono in 1 mol di Fe₂O₃?",o:["1,204 · 10²⁴", "6,02 · 10²³", "3,01 · 10²³", "1,806 · 10²⁴"],a:0,e:"Una mole di Fe₂O₃ contiene 2 mol di Fe: 2 · 6,02 · 10²³ = 1,204 · 10²⁴ atomi."},
{id:"cl1_063",t:"cl1",p:"1.8",l:3,q:"Un diamante da 1 carato (0,20 g) a quante moli di carbonio corrisponde (C = 12)?",o:["Circa 0,017 mol", "Circa 0,17 mol", "Circa 60 mol", "Circa 2,4 mol"],a:0,e:"n = 0,20 / 12 ≈ 0,017 mol."},
{id:"cl1_064",t:"cl1",p:"1.8",l:3,q:"La mole è definita come la quantità di sostanza che contiene tante entità quanti sono gli atomi in…",o:["12 g di carbonio-12", "1 g di idrogeno", "16 g di ossigeno", "22,4 L di aria"],a:0,e:"La definizione fa riferimento a 12 grammi di ¹²C."},
{id:"cl1_065",t:"cl1",p:"1.8.1",l:1,q:"Che cosa afferma la legge di Avogadro?",o:["A parità di P e T, volumi uguali di gas diversi contengono lo stesso numero di particelle", "Il volume di un gas è inversamente proporzionale alla pressione", "La massa si conserva nelle reazioni", "Un gas occupa sempre 22,4 L"],a:0,e:"A uguali pressione e temperatura, volumi uguali di gas (ideali) contengono lo stesso numero di particelle, quindi di moli."},
{id:"cl1_066",t:"cl1",p:"1.8.1",l:2,q:"Quale volume occupa una mole di gas ideale a 0 °C e 1 atm?",o:["22,4 L", "24,5 L", "1 L", "11,2 L"],a:0,e:"In condizioni standard (0 °C, 1 atm) il volume molare è 22,4 L."},
{id:"cl1_067",t:"cl1",p:"1.8.1",l:2,q:"Quanti litri occupano 2 mol di un gas ideale a 0 °C e 1 atm?",o:["44,8 L", "22,4 L", "11,2 L", "2 L"],a:0,e:"2 · 22,4 = 44,8 L, qualunque sia il gas."},
{id:"cl1_068",t:"cl1",p:"1.8.1",l:3,q:"A parità di P e T, 1 L di H₂ e 1 L di CO₂ contengono…",o:["lo stesso numero di molecole", "lo stesso numero di atomi", "la stessa massa", "un numero di molecole proporzionale alla massa molare"],a:0,e:"Per Avogadro il numero di molecole è uguale; la massa invece è diversa (CO₂ pesa di più)."},
{id:"cl1_069",t:"cl1",p:"1.8.2",l:2,q:"Che cosa serve conoscere per calcolare la formula minima?",o:["Gli elementi presenti e la percentuale in massa di ciascuno", "Solo la massa molecolare", "Solo la formula di struttura", "Il volume molare"],a:0,e:"Dalle percentuali si ricavano le moli di ogni elemento in 100 g e quindi il rapporto minimo di combinazione."},
{id:"cl1_070",t:"cl1",p:"1.8.2",l:3,q:"Un composto contiene 80% di C e 20% di H (C = 12, H = 1). Qual è la formula minima?",o:["CH₃", "CH₄", "C₂H₆", "CH₂"],a:0,e:"In 100 g: C = 80/12 ≈ 6,67 mol, H = 20/1 = 20 mol. Dividendo per 6,67 si ottiene 1 : 3, quindi CH₃."},
{id:"cl1_071",t:"cl1",p:"1.8.2",l:3,q:"Nel calcolo della formula minima, dopo aver trovato le moli di ogni elemento…",o:["si dividono tutte per il valore più piccolo", "si sommano tra loro", "si moltiplicano per il numero di Avogadro", "si dividono per la massa molecolare"],a:0,e:"Dividendo per il valore più piccolo si ottiene il rapporto minimo tra gli atomi."},
{id:"cl1_072",t:"cl1",p:"1.8.3",l:2,q:"Che cosa serve per passare dalla formula minima a quella molecolare?",o:["La massa molecolare", "La percentuale di ossigeno", "Il volume molare", "Il numero atomico"],a:0,e:"Si divide la massa molecolare per la massa della formula minima e si moltiplicano i pedici per il numero ottenuto."},
{id:"cl1_073",t:"cl1",p:"1.8.3",l:3,q:"Formula minima CH₃, massa molecolare 30 (C = 12, H = 1). Qual è la formula molecolare?",o:["C₂H₆", "CH₃", "C₃H₉", "C₂H₄"],a:0,e:"Massa di CH₃ = 15; 30 / 15 = 2; quindi C₂H₆ (etano)."},
{id:"cl1_074",t:"cl1",p:"1.8.3",l:3,q:"Formula minima CH₂O, massa molecolare 180. Qual è la formula molecolare?",o:["C₆H₁₂O₆", "C₃H₆O₃", "CH₂O", "C₁₂H₂₂O₁₁"],a:0,e:"Massa di CH₂O = 30; 180 / 30 = 6; quindi C₆H₁₂O₆ (glucosio)."},
{id:"cl1_075",t:"cl1",p:"1.8.4",l:2,q:"Come si calcola la percentuale in massa di un elemento X in un composto?",o:["(massa di X nel composto / massa totale) · 100", "(moli di X / moli totali) · 100", "(Z di X / A di X) · 100", "(massa totale / massa di X) · 100"],a:0,e:"%X = massa di X nel composto diviso massa totale del composto, per 100."},
{id:"cl1_076",t:"cl1",p:"1.8.4",l:3,q:"Qual è la percentuale di azoto in N₂O₃ (N = 14, O = 16)?",o:["Circa 37%", "Circa 63%", "Circa 47%", "Circa 29%"],a:0,e:"M = 28 + 48 = 76; %N = 28/76 · 100 ≈ 37% (O ≈ 63%)."},
{id:"cl1_077",t:"cl1",p:"1.8.4",l:3,q:"Qual è la percentuale in massa dell'idrogeno nell'acqua (H = 1, O = 16)?",o:["Circa 11%", "Circa 67%", "Circa 33%", "Circa 5%"],a:0,e:"2/18 · 100 ≈ 11%: gli atomi di H sono 2 su 3, ma pesano poco."},
{id:"cl1_078",t:"cl1",p:"1.9",l:1,q:"Che cosa coinvolge una reazione nucleare?",o:["I nuclei degli atomi", "Solo gli elettroni di valenza", "Solo i legami chimici", "Solo i neutroni liberi"],a:0,e:"Nelle reazioni nucleari cambiano i nuclei e quindi gli elementi; nelle reazioni chimiche sono coinvolti solo gli elettroni di valenza."},
{id:"cl1_079",t:"cl1",p:"1.9",l:1,q:"Quali nuclidi sono tutti instabili?",o:["Quelli con Z > 83 (dal polonio in poi)", "Quelli con Z < 20", "Tutti quelli con numero pari di neutroni", "Quelli dei gas nobili"],a:0,e:"Tutti i nuclidi con Z > 83 sono instabili e radioattivi."},
{id:"cl1_080",t:"cl1",p:"1.9",l:2,q:"Con il decadimento α, come cambiano A e Z?",o:["A diminuisce di 4, Z di 2", "A non cambia, Z aumenta di 1", "A non cambia, Z diminuisce di 1", "A e Z non cambiano"],a:0,e:"La particella α è un nucleo di elio-4 (2 protoni + 2 neutroni)."},
{id:"cl1_081",t:"cl1",p:"1.9",l:2,q:"Nel decadimento β⁻ che cosa succede?",o:["Un neutrone diventa protone: A resta uguale, Z aumenta di 1", "Un protone diventa neutrone: Z diminuisce di 1", "Si emette un nucleo di elio", "Si emette solo un fotone"],a:0,e:"Si emette un elettrone (e un antineutrino); avviene nei nuclidi con eccesso di neutroni."},
{id:"cl1_082",t:"cl1",p:"1.9",l:2,q:"I nuclidi con eccesso di protoni tendono a emettere…",o:["radiazioni β⁺", "radiazioni β⁻", "solo neutroni", "raggi X"],a:0,e:"Nel β⁺ un protone diventa neutrone emettendo un positrone e un neutrino: Z diminuisce di 1."},
{id:"cl1_083",t:"cl1",p:"1.9",l:2,q:"Qual è l'unità SI dell'attività di un materiale radioattivo?",o:["Il becquerel (Bq)", "Il gray (Gy)", "Il sievert (Sv)", "Il curie (Ci)"],a:0,e:"1 Bq = 1 disintegrazione al secondo. Il curie (1 Ci = 37 GBq) non è un'unità SI."},
{id:"cl1_084",t:"cl1",p:"1.9",l:3,q:"Che differenza c'è tra gray e sievert?",o:["Il gray misura la dose assorbita (J/kg); il sievert la dose equivalente, che tiene conto del tipo di radiazione", "Sono la stessa cosa", "Il gray misura l'attività, il sievert la dose assorbita", "Il sievert misura il numero di decadimenti al secondo"],a:0,e:"Dose equivalente (Sv) = dose assorbita (Gy) · Q, fattore di pericolosità della radiazione."},
{id:"cl1_085",t:"cl1",p:"1.9",l:3,q:"Che cos'è il difetto di massa?",o:["La differenza tra la massa reale di un nucleo e la somma delle masse dei suoi nucleoni", "La massa persa dagli elettroni", "L'errore di misura della massa atomica", "La differenza tra due isotopi"],a:0,e:"Il nucleo pesa un po' meno della somma dei nucleoni: la differenza corrisponde all'energia di legame del nucleo (E = mc², Einstein 1905)."},
{id:"cl1_086",t:"cl1",p:"1.9",l:3,q:"Quali effetti delle radiazioni non hanno una soglia dose-effetto?",o:["Gli effetti stocastici, come le mutazioni genetiche", "Gli effetti deterministici, come le ustioni", "Nessuno: tutti hanno una soglia", "Solo quelli dei raggi γ"],a:0,e:"Gli effetti stocastici possono comparire anche a piccole dosi, con probabilità che cresce con la dose; quelli deterministici solo oltre una soglia."},
{id:"cl1_087",t:"cl1",p:"1.9",l:2,q:"Quale radioisotopo si usa per curare il carcinoma tiroideo?",o:["Lo iodio-131", "Il carbonio-14", "L'uranio-238", "Il cobalto-60"],a:0,e:"Lo iodio-131 è un radiofarmaco terapeutico per la tiroide."},
{id:"cl1_088",t:"cl1",p:"1.9.1",l:2,q:"Quale nucleo usa quasi esclusivamente la risonanza magnetica per immagini (MRI)?",o:["L'idrogeno ¹H", "Il carbonio-12", "L'ossigeno-16", "L'elio-4"],a:0,e:"L'idrogeno è abbondante nei tessuti per la presenza di acqua e lipidi."},
{id:"cl1_089",t:"cl1",p:"1.9.1",l:2,q:"In quale campo della radiazione elettromagnetica lavora la NMR?",o:["Onde radio", "Raggi X", "Raggi γ", "Ultravioletto"],a:0,e:"I nuclei assorbono radiazione a bassa energia, nel campo delle onde radio."},
{id:"cl1_090",t:"cl1",p:"1.9.1",l:3,q:"Quali nuclei sono magneticamente attivi in NMR?",o:["Quelli con almeno uno tra numero di protoni e di neutroni dispari", "Solo quelli con Z pari", "Tutti i nuclei", "Solo i nuclei radioattivi"],a:0,e:"Per esempio ¹H, ¹³C, ³¹P. Il ¹²C (6 protoni, 6 neutroni) non è attivo."},
{id:"cl1_091",t:"cl1",p:"1.9.1",l:3,q:"Come si chiama la radiofrequenza che produce la risonanza?",o:["Frequenza di Larmor", "Frequenza di Planck", "Frequenza di Bohr", "Frequenza di Avogadro"],a:0,e:"Dipende dal campo magnetico applicato e dal tipo di nucleo (rapporto giromagnetico)."},
{id:"cl1_sf1",t:"cl1",p:"1.8",l:4,q:"Un campione di 4,4 g di CO₂ (C = 12, O = 16) contiene quanti atomi di ossigeno?",o:["1,2 · 10²³", "6,0 · 10²²", "6,0 · 10²³", "2,4 · 10²³"],a:0,e:"MM(CO₂) = 44 g/mol, quindi 0,1 mol di CO₂. Gli atomi di O sono 0,2 mol: 0,2 · 6,02 · 10²³ ≈ 1,2 · 10²³. Il primo distrattore conta le molecole, non gli atomi di O."},
{id:"cl1_sf2",t:"cl1",p:"1.9",l:4,q:"Il radio-226 (Z = 88) emette una particella α e poi una β⁻. Quale nuclide si ottiene?",o:["A = 222, Z = 87", "A = 222, Z = 86", "A = 226, Z = 87", "A = 218, Z = 85"],a:0,e:"α: A − 4 = 222, Z − 2 = 86. β⁻: A invariato, Z + 1 = 87."},
{id:"cl1_sf3",t:"cl1",p:"1.8.2",l:4,q:"Un ossido di azoto contiene il 30,4% di N e il 69,6% di O (N = 14, O = 16). Qual è la formula minima?",o:["NO₂", "NO", "N₂O", "N₂O₅"],a:0,e:"N: 30,4/14 ≈ 2,17 mol; O: 69,6/16 ≈ 4,35 mol. Rapporto 1 : 2, quindi NO₂."},
{id:"cl1_sf4",t:"cl1",p:"1.6.2",l:4,q:"Un elemento ha due isotopi: massa 10 u (20%) e 11 u (80%). Qual è la sua massa atomica?",o:["10,8 u", "10,5 u", "10,2 u", "11 u"],a:0,e:"Media ponderata: 10 · 0,2 + 11 · 0,8 = 2 + 8,8 = 10,8 u (è il boro)."},
{id:"cl1_sf5",t:"cl1",p:"1.4",l:4,q:"Il carbonio forma due ossidi: in uno 12 g di C sono legati a 16 g di O, nell'altro a 32 g di O. Quale legge illustra questo caso?",o:["La legge delle proporzioni multiple", "La legge delle proporzioni definite", "La legge di conservazione della massa", "La legge di Avogadro"],a:0,e:"Fissata la massa di C, le masse di O stanno nel rapporto 16 : 32 = 1 : 2, numeri interi piccoli (CO e CO₂)."},
{id:"cl2_001",t:"cl2",p:"2.1",l:1,q:"Che cos'è un modello atomico?",o:["Una rappresentazione teorica della struttura degli atomi", "Una fotografia dell'atomo", "Un esperimento per misurare la massa atomica", "Una tabella delle masse atomiche"],a:0,e:"Il modello cerca di descrivere la struttura della materia a livello degli atomi e viene aggiornato con le nuove evidenze sperimentali."},
{id:"cl2_002",t:"cl2",p:"2.1",l:2,q:"Nel modello di Dalton le reazioni chimiche consistevano in…",o:["combinazione e separazione di atomi indivisibili", "trasformazione di un atomo in un altro", "scambio di protoni tra nuclei", "emissione di radiazioni"],a:0,e:"Per Dalton gli atomi erano indivisibili e le reazioni li combinavano o separavano."},
{id:"cl2_003",t:"cl2",p:"2.1",l:2,q:"Che cosa portò a superare il modello di Dalton nel Novecento?",o:["La scoperta delle particelle subatomiche", "La scoperta della mole", "La legge di Lavoisier", "La scoperta dei gas nobili"],a:0,e:"Le nuove evidenze sperimentali dimostrarono che l'atomo contiene elettroni, protoni e neutroni."},
{id:"cl2_004",t:"cl2",p:"2.1.1",l:1,q:"Come viene chiamato il modello atomico di Thomson?",o:["Modello a panettone", "Modello planetario", "Modello a orbite stazionarie", "Modello quantomeccanico"],a:0,e:"Thomson immaginava una massa fluida positiva con gli elettroni immersi, come l'uvetta nel panettone."},
{id:"cl2_005",t:"cl2",p:"2.1.1",l:2,q:"Che cosa dimostrò Thomson con i tubi di Crookes?",o:["L'esistenza di particelle subatomiche negative (gli elettroni)", "L'esistenza del nucleo", "L'esistenza dei neutroni", "La quantizzazione dell'energia"],a:0,e:"Alla fine dell'Ottocento Thomson dimostrò sperimentalmente l'esistenza degli elettroni."},
{id:"cl2_006",t:"cl2",p:"2.1.1",l:2,q:"Perché Thomson ipotizzò una massa carica positivamente?",o:["Perché la materia è elettricamente neutra e gli elettroni sono negativi", "Perché aveva scoperto i protoni", "Perché aveva misurato il nucleo", "Perché gli elettroni sono positivi"],a:0,e:"Se gli elettroni sono negativi e l'atomo è neutro, ci deve essere una carica positiva che li bilancia."},
{id:"cl2_007",t:"cl2",p:"2.1.2",l:1,q:"Come si chiama il modello di Rutherford?",o:["Modello planetario", "Modello a panettone", "Modello a orbitali", "Modello a orbite stazionarie"],a:0,e:"Gli elettroni ruotano su orbite circolari attorno a un nucleo centrale, come pianeti attorno al Sole."},
{id:"cl2_008",t:"cl2",p:"2.1.2",l:2,q:"Che cosa stabilì Rutherford sulla struttura dell'atomo?",o:["Che è in gran parte vuoto, con la massa concentrata in un piccolo nucleo centrale", "Che è una sfera piena positiva", "Che gli elettroni stanno nel nucleo", "Che le orbite sono quantizzate"],a:0,e:"Quasi tutta la massa sta nel nucleo e gli elettroni ruotano a grande distanza."},
{id:"cl2_009",t:"cl2",p:"2.1.2",l:3,q:"Qual era il problema del modello di Rutherford?",o:["Per la fisica classica un elettrone in orbita dovrebbe perdere energia e cadere sul nucleo", "Non spiegava l'esistenza degli elettroni", "Prevedeva un atomo carico positivamente", "Non prevedeva il nucleo"],a:0,e:"Una carica in movimento irradia energia: l'elettrone dovrebbe spiraleggiare fino al nucleo, cosa che non succede."},
{id:"cl2_010",t:"cl2",p:"2.1.3",l:1,q:"Su quale idea di Planck si basò Bohr?",o:["La quantizzazione dell'energia", "Il principio di indeterminazione", "Il dualismo onda-particella", "La legge di Coulomb"],a:0,e:"Bohr combinò il modello di Rutherford con la quantizzazione dell'energia di Planck."},
{id:"cl2_011",t:"cl2",p:"2.1.3",l:2,q:"Secondo Bohr, quando un atomo scambia energia con l'ambiente?",o:["Quando un elettrone passa da un'orbita stazionaria a un'altra", "Sempre, mentre l'elettrone ruota", "Solo quando perde un protone", "Mai"],a:0,e:"L'energia scambiata (per esempio come fotone hν) è pari alla differenza di energia tra le due orbite."},
{id:"cl2_012",t:"cl2",p:"2.1.3",l:2,q:"Nel modello di Bohr, gli elettroni più lontani dal nucleo hanno…",o:["energia maggiore (n maggiore)", "energia minore", "la stessa energia degli altri", "energia nulla"],a:0,e:"Più l'elettrone è lontano dal nucleo, maggiore è la sua energia e il suo numero n."},
{id:"cl2_013",t:"cl2",p:"2.1.3",l:3,q:"Che cosa significa che le orbite di Bohr sono \"quantizzate\"?",o:["Possono avere solo certi valori discreti di energia", "Possono avere qualsiasi energia", "Sono tutte uguali", "Si possono contare"],a:0,e:"Ogni orbita ha una distanza ed energia ben determinate: valori discreti, non continui."},
{id:"cl2_014",t:"cl2",p:"2.1.4",l:1,q:"Che cosa afferma il principio di indeterminazione di Heisenberg?",o:["Non si possono conoscere insieme, con precisione a piacere, posizione e quantità di moto di una particella", "Gli elettroni stanno fermi nel nucleo", "L'energia è sempre conservata", "Due elettroni non possono avere gli stessi numeri quantici"],a:0,e:"Per questo per l'elettrone non si parla di traiettoria ma di probabilità di trovarlo in una regione."},
{id:"cl2_015",t:"cl2",p:"2.1.4",l:2,q:"Che cos'è un orbitale?",o:["La regione di spazio attorno al nucleo dove è alta la probabilità di trovare l'elettrone", "La traiettoria circolare dell'elettrone", "Il nucleo dell'atomo", "Un tipo di legame"],a:0,e:"Il concetto deterministico di orbita viene sostituito da quello probabilistico di orbitale."},
{id:"cl2_016",t:"cl2",p:"2.1.4",l:2,q:"In che anno si colloca il principio di indeterminazione?",o:["1927", "1902", "1911", "1913"],a:0,e:"Heisenberg, 1927; il modello quantomeccanico è indicato intorno al 1930."},
{id:"cl2_017",t:"cl2",p:"2.1.5",l:1,q:"Che cosa indica il numero quantico principale n?",o:["La dimensione dell'orbitale e il livello energetico", "La forma dell'orbitale", "L'orientazione nello spazio", "Lo spin"],a:0,e:"n vale 1, 2, 3…: più è grande, più l'orbitale è grande, lontano dal nucleo ed energetico."},
{id:"cl2_018",t:"cl2",p:"2.1.5",l:1,q:"Quanti orbitali contiene un sottolivello p?",o:["3", "1", "5", "7"],a:0,e:"s = 1 orbitale, p = 3, d = 5, f = 7."},
{id:"cl2_019",t:"cl2",p:"2.1.5",l:2,q:"Se n = 3, quali valori può assumere ℓ?",o:["0, 1, 2", "1, 2, 3", "0, 1, 2, 3", "Solo 3"],a:0,e:"ℓ va da 0 a n − 1. Per n = 3 si hanno i sottolivelli 3s, 3p, 3d."},
{id:"cl2_020",t:"cl2",p:"2.1.5",l:2,q:"Quale sottolivello corrisponde a ℓ = 2?",o:["d", "p", "s", "f"],a:0,e:"ℓ = 0 s, 1 p, 2 d, 3 f."},
{id:"cl2_021",t:"cl2",p:"2.1.5",l:2,q:"Quanti elettroni può contenere al massimo il livello n = 3?",o:["18", "8", "9", "32"],a:0,e:"Al massimo 2n² elettroni: 2 · 9 = 18 (3s² 3p⁶ 3d¹⁰)."},
{id:"cl2_022",t:"cl2",p:"2.1.5",l:3,q:"Se ℓ = 2, quali valori può assumere m?",o:["−2, −1, 0, +1, +2", "0, 1, 2", "−1, 0, +1", "Solo 2"],a:0,e:"m va da −ℓ a +ℓ: cinque valori, cioè cinque orbitali d."},
{id:"cl2_023",t:"cl2",p:"2.1.5",l:3,q:"Quale numero quantico distingue i due elettroni di uno stesso orbitale?",o:["Il numero di spin mₛ", "Il numero principale n", "Il numero secondario ℓ", "Il numero magnetico m"],a:0,e:"Un orbitale è definito da n, ℓ, m; i due elettroni differiscono per lo spin (+½ e −½)."},
{id:"cl2_024",t:"cl2",p:"2.1.5",l:3,q:"Come si chiamano orbitali con la stessa energia?",o:["Degeneri (isoenergetici)", "Paralleli", "Antiparalleli", "Ibridi"],a:0,e:"Orbitali con n e ℓ uguali hanno la stessa energia: sono degeneri."},
{id:"cl2_025",t:"cl2",p:"2.2",l:1,q:"Qual è la configurazione elettronica dell'ossigeno (Z = 8)?",o:["1s² 2s² 2p⁴", "1s² 2s² 2p⁶", "1s² 2p⁶", "1s² 2s² 2p²"],a:0,e:"8 elettroni: 2 nel 1s, 2 nel 2s e 4 nel 2p."},
{id:"cl2_026",t:"cl2",p:"2.2",l:1,q:"Che cosa afferma il principio di Aufbau?",o:["Gli elettroni occupano prima gli orbitali liberi a energia minore", "Due elettroni non possono avere i quattro numeri quantici uguali", "Gli elettroni si distribuiscono singolarmente negli orbitali degeneri", "Gli elettroni occupano prima gli orbitali più esterni"],a:0,e:"Aufbau significa \"costruzione\": si riempiono gli orbitali in ordine di energia crescente."},
{id:"cl2_027",t:"cl2",p:"2.2",l:2,q:"Che cosa afferma il principio di esclusione di Pauli?",o:["In un atomo due elettroni non possono avere i quattro numeri quantici uguali", "Gli elettroni riempiono prima gli orbitali a bassa energia", "Gli elettroni si dispongono con spin paralleli", "L'elettrone non ha traiettoria"],a:0,e:"Ne segue che ogni orbitale ospita al massimo due elettroni a spin opposto."},
{id:"cl2_028",t:"cl2",p:"2.2",l:2,q:"Che cosa afferma la regola di Hund?",o:["Negli orbitali degeneri gli elettroni si distribuiscono singolarmente, con spin paralleli, sul massimo numero di orbitali", "Ogni orbitale contiene due elettroni", "Si riempie prima il 3d del 4s", "Gli spin devono essere sempre opposti"],a:0,e:"È il principio della massima molteplicità: nel 2p dell'ossigeno i primi tre elettroni vanno uno per orbitale."},
{id:"cl2_029",t:"cl2",p:"2.2",l:2,q:"Quale sottolivello si riempie subito dopo il 4s?",o:["3d", "4p", "4d", "3p"],a:0,e:"L'ordine è 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p…: il 3d ha energia maggiore del 4s."},
{id:"cl2_030",t:"cl2",p:"2.2",l:3,q:"Qual è la configurazione dello ione Cl⁻ (Z = 17)?",o:["1s² 2s² 2p⁶ 3s² 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁵", "1s² 2s² 2p⁶ 3s² 3p⁴", "1s² 2s² 2p⁶ 3s²"],a:0,e:"Cl⁻ ha 18 elettroni: la stessa configurazione dell'argon."},
{id:"cl2_031",t:"cl2",p:"2.2",l:3,q:"Qual è la configurazione del sodio (Z = 11)?",o:["1s² 2s² 2p⁶ 3s¹", "1s² 2s² 2p⁷", "1s² 2s² 2p⁵ 3s²", "1s² 2s² 3s¹ 2p⁶"],a:0,e:"Dopo il 2p⁶ (neon) l'undicesimo elettrone va nel 3s."},
{id:"cl2_032",t:"cl2",p:"2.3.1",l:1,q:"Come si chiamano le righe della tavola periodica?",o:["Periodi", "Gruppi", "Blocchi", "Famiglie"],a:0,e:"Ogni riga è un periodo e corrisponde al riempimento di un livello; le colonne sono i gruppi."},
{id:"cl2_033",t:"cl2",p:"2.3.1",l:1,q:"Che cosa hanno in comune gli elementi di uno stesso gruppo?",o:["La stessa configurazione elettronica esterna", "Lo stesso numero atomico", "La stessa massa", "Lo stesso numero di livelli"],a:0,e:"Hanno lo stesso numero di elettroni di valenza, e quindi proprietà chimiche simili."},
{id:"cl2_034",t:"cl2",p:"2.3.1",l:2,q:"Quanti sono i periodi noti della tavola periodica?",o:["7", "8", "18", "4"],a:0,e:"I periodi sono 7, corrispondenti ai primi sette livelli energetici; i gruppi IUPAC sono 18."},
{id:"cl2_035",t:"cl2",p:"2.3.1",l:2,q:"Gli elementi dei gruppi B (3-12) si chiamano…",o:["elementi di transizione", "elementi rappresentativi", "gas nobili", "lantanoidi"],a:0,e:"Hanno elettroni negli orbitali d; i rappresentativi (gruppi A) hanno gli elettroni esterni in s o p."},
{id:"cl2_036",t:"cl2",p:"2.3.1",l:2,q:"A quale blocco appartengono i gruppi 1 e 2?",o:["Blocco s", "Blocco p", "Blocco d", "Blocco f"],a:0,e:"Blocco s: gruppi 1-2; blocco p: 13-18; blocco d: 3-12; blocco f: lantanoidi e attinoidi."},
{id:"cl2_037",t:"cl2",p:"2.3.1",l:3,q:"A quale gruppo appartiene l'elemento con configurazione esterna 3s² 3p⁴?",o:["Gruppo 16 (VIA): è lo zolfo", "Gruppo 4", "Gruppo 14", "Gruppo 2"],a:0,e:"Ha 6 elettroni di valenza: per gli elementi rappresentativi il numero di elettroni di valenza corrisponde al gruppo."},
{id:"cl2_038",t:"cl2",p:"2.3.2",l:2,q:"Nella configurazione di valenza 2s² 2p¹, che cosa indica il numero 2 davanti agli orbitali?",o:["Il periodo", "Il gruppo", "Il numero di elettroni", "Il numero di orbitali"],a:0,e:"Il numero davanti indica l'ultimo livello occupato, cioè il periodo; la somma degli apici dà il gruppo. È il boro (periodo 2, gruppo 13)."},
{id:"cl2_039",t:"cl2",p:"2.3.2",l:2,q:"Che cosa significa [Ne] in una configurazione abbreviata?",o:["Che gli elettroni interni hanno la configurazione del neon", "Che l'elemento è il neon", "Che l'elemento è un gas", "Che mancano 10 elettroni"],a:0,e:"Si antepone il gas nobile del periodo precedente per indicare gli elettroni interni (di core)."},
{id:"cl2_040",t:"cl2",p:"2.3.2",l:3,q:"Qual è la configurazione abbreviata dello zirconio (Z = 40)?",o:["[Kr] 5s² 4d²", "[Ar] 4s² 3d²", "[Kr] 4d⁴", "[Kr] 5s² 5p²"],a:0,e:"Il gas nobile precedente è il cripto (Z = 36); seguono 5s² e 4d²."},
{id:"cl2_041",t:"cl2",p:"2.3.2",l:3,q:"Per gli elementi dei blocchi d e f, la sola configurazione di valenza (s e p)…",o:["non basta a identificarli: vanno indicati anche gli orbitali d o f", "basta sempre", "indica il numero atomico", "coincide con il gruppo IUPAC"],a:0,e:"Per i metalli di transizione si include anche l'ultimo sottolivello d occupato."},
{id:"cl2_042",t:"cl2",p:"2.3.3",l:1,q:"Come varia il raggio atomico lungo un gruppo, dall'alto verso il basso?",o:["Aumenta", "Diminuisce", "Resta uguale", "Prima aumenta poi diminuisce"],a:0,e:"Scendendo si aggiungono livelli più lontani dal nucleo."},
{id:"cl2_043",t:"cl2",p:"2.3.3",l:2,q:"Perché il raggio atomico diminuisce da sinistra a destra lungo un periodo?",o:["Aumentano i protoni e quindi l'attrazione del nucleo sugli elettroni", "Diminuiscono gli elettroni", "Diminuiscono i livelli energetici", "Aumentano i neutroni"],a:0,e:"Gli elettroni si aggiungono allo stesso livello mentre la carica nucleare cresce."},
{id:"cl2_044",t:"cl2",p:"2.3.3",l:2,q:"Che cos'è l'energia di ionizzazione?",o:["L'energia necessaria per sottrarre l'elettrone più esterno a un atomo gassoso", "L'energia liberata quando un atomo acquista un elettrone", "La tendenza ad attrarre gli elettroni di legame", "L'energia di un legame ionico"],a:0,e:"Togliendo un elettrone a un atomo neutro si forma un catione monovalente."},
{id:"cl2_045",t:"cl2",p:"2.3.3",l:2,q:"Qual è l'elemento più elettronegativo?",o:["Il fluoro (4,0)", "L'ossigeno", "Il francio", "Il cloro"],a:0,e:"Nella scala di Pauling (0-4) il fluoro vale 4,0; il francio, il meno elettronegativo, 0,7."},
{id:"cl2_046",t:"cl2",p:"2.3.3",l:2,q:"Dove si trovano i valori più alti di energia di ionizzazione, affinità elettronica ed elettronegatività?",o:["In alto a destra nella tavola periodica", "In basso a sinistra", "Al centro", "In basso a destra"],a:0,e:"Aumentano da sinistra a destra lungo un periodo e dal basso verso l'alto lungo un gruppo."},
{id:"cl2_047",t:"cl2",p:"2.3.3",l:3,q:"Nel carbonio, tra quali energie di ionizzazione si osserva un salto brusco?",o:["Tra la quarta e la quinta", "Tra la prima e la seconda", "Tra la seconda e la terza", "Tra la quinta e la sesta"],a:0,e:"I primi 4 elettroni sono nel livello n = 2; il quinto e il sesto stanno nel 1s, più vicino al nucleo."},
{id:"cl2_048",t:"cl2",p:"2.3.3",l:3,q:"Perché ogni energia di ionizzazione successiva è maggiore della precedente?",o:["Si toglie un elettrone a uno ione con carica positiva sempre maggiore", "Gli elettroni interni sono più lontani dal nucleo", "Il nucleo perde protoni", "Aumenta il raggio atomico"],a:0,e:"Allontanare cariche negative da uno ione sempre più positivo richiede sempre più energia."},
{id:"cl2_049",t:"cl2",p:"2.3.3",l:3,q:"Perché i metalli dei gruppi 1 e 2 tendono a formare cationi?",o:["Hanno pochi elettroni di valenza, bassa energia di ionizzazione e bassa affinità elettronica", "Hanno alta elettronegatività", "Hanno il guscio di valenza completo", "Hanno alta affinità elettronica"],a:0,e:"Per esempio Na → Na⁺ e Ca → Ca²⁺: è facile togliere 1 o 2 elettroni."},
{id:"cl2_050",t:"cl2",p:"2.3.4",l:1,q:"Dove si trovano i metalli nella tavola periodica?",o:["Al centro e a sinistra", "In alto a destra", "Solo nel blocco p", "Solo nell'ultimo gruppo"],a:0,e:"I non metalli stanno in alto a destra; i semimetalli a cavallo della linea spezzata."},
{id:"cl2_051",t:"cl2",p:"2.3.4",l:2,q:"Quale di queste proprietà NON è tipica dei metalli?",o:["Alta elettronegatività", "Lucentezza", "Buona conducibilità elettrica", "Malleabilità"],a:0,e:"I metalli hanno bassa elettronegatività (sono elettropositivi) e formano facilmente ioni positivi."},
{id:"cl2_052",t:"cl2",p:"2.3.4",l:2,q:"Quale di questi elementi è un semimetallo?",o:["Silicio", "Sodio", "Zolfo", "Ferro"],a:0,e:"Semimetalli: boro, silicio, germanio, arsenico, antimonio e tellurio."},
{id:"cl2_053",t:"cl2",p:"2.3.4",l:3,q:"Quale caso particolare segnala il libro per l'idrogeno?",o:["Ha configurazione da metallo ma caratteristiche da non metallo", "È un semimetallo", "È un metallo alcalino a tutti gli effetti", "È un gas nobile"],a:0,e:"Pur stando nel gruppo 1, l'idrogeno si comporta da non metallo."},
{id:"cl2_054",t:"cl2",p:"2.3.4",l:3,q:"Come varia il carattere metallico?",o:["Diminuisce lungo un periodo da sinistra a destra e aumenta lungo un gruppo dall'alto verso il basso", "Aumenta lungo un periodo", "È uguale per tutti gli elementi di un periodo", "Diminuisce scendendo lungo un gruppo"],a:0,e:"Segue l'andamento opposto a energia di ionizzazione ed elettronegatività."},
{id:"cl2_055",t:"cl2",p:"2.3.4",l:2,q:"Come si chiamano gli elementi del gruppo 2?",o:["Metalli alcalino-terrosi", "Metalli alcalini", "Alogeni", "Calcogeni"],a:0,e:"Gruppo 1 alcalini, gruppo 2 alcalino-terrosi, gruppo 17 alogeni, gruppo 18 gas nobili."},
{id:"cl2_sf1",t:"cl2",p:"2.2",l:4,q:"Quale terna di numeri quantici (n, ℓ, m) NON è possibile?",o:["n = 2, ℓ = 2, m = 0", "n = 3, ℓ = 2, m = −2", "n = 2, ℓ = 1, m = −1", "n = 4, ℓ = 0, m = 0"],a:0,e:"ℓ deve essere minore di n: con n = 2 ℓ può valere solo 0 o 1. Le altre terne rispettano 0 ≤ ℓ ≤ n − 1 e −ℓ ≤ m ≤ +ℓ."},
{id:"cl2_sf2",t:"cl2",p:"2.3.3",l:4,q:"Un elemento ha le prime energie di ionizzazione (kJ/mol): 738, 1451, 7733, 10540. A quale gruppo appartiene probabilmente?",o:["Gruppo 2", "Gruppo 1", "Gruppo 13", "Gruppo 17"],a:0,e:"Il salto brusco è tra la seconda e la terza: ha 2 elettroni di valenza facili da togliere, quindi è un alcalino-terroso (è il magnesio)."},
{id:"cl2_sf3",t:"cl2",p:"2.2",l:4,q:"Quanti elettroni spaiati ha l'azoto (Z = 7) nello stato fondamentale?",o:["3", "1", "5", "0"],a:0,e:"1s² 2s² 2p³: per la regola di Hund i tre elettroni 2p occupano tre orbitali diversi con spin paralleli."},
{id:"cl2_sf4",t:"cl2",p:"2.3.3",l:4,q:"Quale serie è in ordine di raggio atomico crescente?",o:["F < O < N < C", "C < N < O < F", "O < F < N < C", "N < C < F < O"],a:0,e:"Lungo il secondo periodo il raggio diminuisce da sinistra a destra, quindi il più piccolo è il fluoro e il più grande il carbonio."},
{id:"cl3_001",t:"cl3",p:"3.1.1",l:1,q:"Quando due atomi A e B si legano?",o:["Quando l'energia di AB è minore di quella dei due atomi isolati", "Quando l'energia di AB è maggiore", "Sempre, se sono vicini", "Solo se hanno la stessa massa"],a:0,e:"Il legame si forma se il sistema legato è più stabile (a energia minore); la differenza di energia si libera."},
{id:"cl3_002",t:"cl3",p:"3.1.1",l:2,q:"Che cos'è l'energia di legame?",o:["L'energia liberata quando si forma il legame, uguale a quella da fornire per romperlo", "L'energia cinetica degli atomi", "L'energia degli elettroni interni", "L'energia del nucleo"],a:0,e:"È la stessa quantità nei due sensi: liberata nella formazione, assorbita nella rottura."},
{id:"cl3_003",t:"cl3",p:"3.1.1",l:2,q:"Un legame con alta energia di legame è…",o:["forte, perché serve molta energia per romperlo", "debole", "sempre ionico", "instabile"],a:0,e:"La forza del legame è correlata alla sua energia di legame."},
{id:"cl3_004",t:"cl3",p:"3.1.2",l:1,q:"Quanti elettroni di valenza ha l'ossigeno?",o:["6", "8", "2", "16"],a:0,e:"L'ossigeno è nel gruppo 16 (VIA): per i gruppi A il numero di elettroni di valenza coincide con il numero del gruppo (unità)."},
{id:"cl3_005",t:"cl3",p:"3.1.2",l:2,q:"Che cos'è il simbolo di Lewis?",o:["Il simbolo dell'elemento circondato da tanti punti quanti sono i suoi elettroni di valenza", "La formula di struttura di una molecola", "Il simbolo con il numero atomico in basso", "La configurazione elettronica completa"],a:0,e:"Per esempio Na con un punto, Cl con sette punti."},
{id:"cl3_006",t:"cl3",p:"3.1.2",l:2,q:"Quale gruppo di elementi ha 1 elettrone di valenza?",o:["Il gruppo 1 (litio, sodio, potassio)", "Il gruppo 17", "Il gruppo 2", "Il gruppo 18"],a:0,e:"I metalli alcalini (gruppo IA) hanno un solo elettrone nel livello esterno."},
{id:"cl3_007",t:"cl3",p:"3.1.3",l:1,q:"Che cosa afferma la regola dell'ottetto?",o:["Gli atomi tendono a legarsi per raggiungere 8 elettroni nel livello esterno, come i gas nobili", "Ogni molecola contiene 8 atomi", "Ogni atomo forma 8 legami", "Gli elettroni di un atomo sono sempre 8"],a:0,e:"La configurazione s²p⁶ dei gas nobili è molto stabile ed è responsabile della loro inerzia chimica."},
{id:"cl3_008",t:"cl3",p:"3.1.3",l:2,q:"Quale eccezione alla regola dell'ottetto ricorda il libro tra i gas nobili?",o:["L'elio, stabile con un doppietto (1s²)", "Il neon", "L'argon", "Il radon"],a:0,e:"L'elio ha solo due elettroni ma è comunque stabile."},
{id:"cl3_009",t:"cl3",p:"3.1.3",l:3,q:"Qual è la formula del composto più semplice tra magnesio e fluoro secondo l'ottetto?",o:["MgF₂", "MgF", "Mg₂F", "MgF₇"],a:0,e:"Mg cede 2 elettroni (Mg²⁺), ogni F ne acquista 1 (F⁻): servono due F⁻ per ogni Mg²⁺."},
{id:"cl3_010",t:"cl3",p:"3.2.1",l:1,q:"Tra quali atomi si forma il legame covalente?",o:["Tra non metalli con elettronegatività uguale o simile", "Tra un metallo e un non metallo", "Solo tra metalli", "Solo tra gas nobili"],a:0,e:"Gli atomi raggiungono l'ottetto condividendo elettroni e formano una molecola."},
{id:"cl3_011",t:"cl3",p:"3.2.1",l:2,q:"Come raggiungono l'ottetto due atomi di fluoro nella molecola F₂?",o:["Mettendo in comune un elettrone ciascuno", "Uno cede un elettrone all'altro", "Acquistando elettroni da un metallo", "Perdendo 7 elettroni ciascuno"],a:0,e:"Ogni F ha 7 elettroni di valenza: condividendone uno ciascuno, entrambi arrivano a 8."},
{id:"cl3_012",t:"cl3",p:"3.2.2",l:1,q:"Tra quali atomi si forma tipicamente il legame ionico?",o:["Tra un metallo e un non metallo (alta differenza di elettronegatività)", "Tra due non metalli uguali", "Tra due metalli", "Tra due gas nobili"],a:0,e:"L'atomo più elettronegativo acquista elettroni da quello meno elettronegativo; gli ioni si attraggono."},
{id:"cl3_013",t:"cl3",p:"3.2.2",l:2,q:"Quale di questi è un catione poliatomico?",o:["NH₄⁺", "Fe³⁺", "SO₄²⁻", "Cl⁻"],a:0,e:"Lo ione ammonio è positivo e formato da più atomi; SO₄²⁻ è un anione poliatomico."},
{id:"cl3_014",t:"cl3",p:"3.2.3",l:2,q:"Che cosa tiene unito un metallo nel legame metallico?",o:["L'attrazione tra i cationi del reticolo e la nuvola di elettroni delocalizzati", "La condivisione di coppie tra due atomi", "Il trasferimento di elettroni a un non metallo", "I legami a idrogeno"],a:0,e:"Gli elettroni di valenza sono delocalizzati su tutto il solido."},
{id:"cl3_015",t:"cl3",p:"3.2.3",l:1,q:"Il legame metallico è tipico…",o:["dei metalli", "dei non metalli", "dei gas nobili", "delle molecole biatomiche"],a:0,e:"È un'interazione multiatomica: gli atomi, come ioni, formano un reticolo ordinato e mettono in comune gli elettroni di valenza."},
{id:"cl3_016",t:"cl3",p:"3.3.1",l:1,q:"Che cos'è la lunghezza di legame?",o:["La distanza tra i nuclei alla quale forze attrattive e repulsive si equilibrano", "Il diametro dell'atomo più grande", "La somma dei raggi nucleari", "La distanza tra gli elettroni di valenza"],a:0,e:"Avvicinando gli atomi crescono le attrazioni nucleo-elettroni, ma anche le repulsioni nucleo-nucleo ed elettroni-elettroni."},
{id:"cl3_017",t:"cl3",p:"3.3.1",l:2,q:"Quanto vale la lunghezza del legame H–H?",o:["0,074 nm", "7,4 nm", "0,74 nm", "74 nm"],a:0,e:"Corrisponde al minimo della curva di energia potenziale in funzione della distanza internucleare."},
